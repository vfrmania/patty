  "cours": "<div class=\"cours-head\"><h2>Colonisation et empires coloniaux (XIXe-XXe siècles)</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. Pourquoi l\'Europe conquiert-elle le monde ?</h3>\n<div class=\"tip\">Vers 1880, quelques États européens (Grande-Bretagne, France, Allemagne, Belgique, Italie, Portugal, Pays-Bas), plus le Japon et les États-Unis, se partagent une grande partie de la planète. Les <b>causes</b> sont multiples et entrelacées. <b>Économiques</b> : la révolution industrielle exige des <b>matières premières</b> (coton, caoutchouc, minerais, pétrole), des <b>débouchés</b> pour les produits manufacturés, des débouchés de capitaux (chemins de fer, ports). <b>Démographiques</b> : l\'Europe, en pleine explosion démographique, envoie des millions d\'émigrants (Italiens, Britanniques, Irlandais) qui peuplent les « colonies de peuplement » (Algérie, Australie, Canada, Afrique du Sud). <b>Politiques et stratégiques</b> : prestige national (se dit « grande puissance » celui qui a un empire), points d\'appui maritimes (Suez 1869, Dakar, Singapour), rivalités entre États qui se lisent en Afrique. <b>Culturelles et « scientifiques »</b> : la conviction d\'une supériorité de la « race » blanche et de la « civilisation » (théories racialistes, « fardeau de l\'homme blanc » de Kipling), la mission « civilisatrice » revendiquée par Jules Ferry (« races supérieures ont des devoirs envers les races inférieures », discours de 1884) et l\'<b>évangélisation</b> catholique ou protestante. Toutes ces causes sont concourantes : aucune n\'est « la » cause unique ; c\'est leur conjonction, après 1870, qui déclenche la ruée.</div>\n<div class=\"tip\"><b>Comment conquiert-on ?</b> Rarement par la force brute seule. Les armes sont d\'abord dissuasives : le <b>canon</b> (artillerie de montagne), le <b>fusil à répétition</b> puis la <b>mitrailleuse</b> (Maxim) écrasent les armées locales ; la <b>quinine</b> protège du paludisme et ouvre l\'intérieur africain (« l\'Afrique des ténèbres » devient pénétrable après 1850). La conquête est souvent le fait de petites colonnes : France en Algérie (prise d\'Alger 1830, conquête longue et brutale jusqu\'aux années 1850-1880, résistance d\'Abd el-Kader, insurrection de 1871), en Afrique occidentale (Faidherbe au Sénégal, missions de Gallieni et Lyautey « pacifiant » la vallée du Niger puis Madagascar 1895-96), en Indochine (Cochinchine 1862-67, Tonkin 1883-85, guerre franco-chinoise). La <b>conférence de Berlin</b> (novembre 1884 - février 1885), pilotée par Bismarck, fixe les règles du partage (occupation « effective », liberté de commerce sur les fleuves Congo et Niger) : sans un seul Africain à la table, les frontières de l\'Afrique sont tracées à la règle — d\'où des États artificiels dont les frontières subsistent aujourd\'hui.</div>\n<h3>2. L\'Empire français et l\'Empire britannique : administrer et exploiter</h3>\n<div class=\"tip\">En 1914, la France possède le <b>deuxième empire colonial du monde</b> (après le britannique) : environ 10 millions de km² et 50 millions d\'habitants, surtout en <b>Afrique</b> (Afrique occidentale et équatoriale françaises, Afrique du Nord : Algérie, Tunisie 1881, Maroc 1912) et en <b>Indochine</b>. L\'Empire britannique, « où le soleil ne se couche jamais », regroupe l\'Inde des « vice-rois » (colonisée par la Compagnie des Indes jusqu\'en 1858, puis directement par la Couronne, après la révolte des Cipayes en 1857), le Canada, l\'Australie, l\'Afrique du Sud, l\'Égypte (occupée en 1882) — des « dominions » blancs autonomes coexistent avec des colonies d\'exploitation. Deux modèles d\'administration : assimilation républicaine affichée (les « quatre vieilles colonies » françaises envoient des députés à Paris) et <b>indirect rule</b> britannique (les chefs traditionnels gouvernent sous contrôle). En pratique, partout, l\'essentiel est <b>l\'exploitation</b> : terres confisquées (colons d\'Algérie), plantations (hévéa en Indochine), travaux forcés (code de l\'indigénat en Afrique française : corvées, impôts en monnaie obligeant à travailler pour les Européens, justice sommaire), commerce monopolisé par les grandes compagnies. Contre cette domination naissent des <b>résistances</b> : insurrections armées (Abd el-Kader, Samori Touré, Lyautey à Madagascar ; révolte des Hereros en Afrique allemande, réprimée par un quasi-génocide, 1904), résistances culturelles et religieuses, puis premiers <b>nationalismes</b> (Jeunes-Turcs dans l\'Empire ottoman, Indian National Congress fondé en 1885, mouvements de la « Nahda » arabe).</div>\n<div class=\"tip\"><b>L\'empire au quotidien</b> : villes coloniales à deux vitesses (quartiers européens modernes, médinas et villages « indigènes »), écoles et missions qui forment de petites élites acculturées — mais qui, lisant les Lumières, retourneront l\'universalisme contre la colonisation (Senghor, Ho Chi Minh, plus tard). Expositions coloniales (Paris 1907, 1931), zoos humains, cartes postales et affiches fabriquent dans les métropoles une <b>culture coloniale</b> : l\'indigène y figure « paresseux, infantile, fidèle » ; les manuels scolaires célèbrent l\'œuvre civilisatrice. Cette culture imprègne profondément les sociétés européennes jusque dans les années 1950.</div>\n<h3>3. Contestations et fin des empires</h3>\n<div class=\"tip\">Dès l\'entre-deux-guerres, la contestation monte. La <b>première guerre mondiale</b> a mobilisé des centaines de milliers de « tirailleurs » et de soldats coloniaux (la « force noire » de Mangin) : ces combattants revenus ne peuvent plus être traités en « indigènes ». Les <b>nationalismes</b> s\'organisent : Parti du Congrès en Inde (Gandhi y prend la direction en 1920-21, campagne de <b>désobéissance civile</b>, marche du sel 1930 ; Nehru au côté) ; en Indochine, Ho Chi Minh fonde le parti communiste vietnamien (1930) ; en Afrique du Nord, le Parti populaire algérien de Messali Hadj (1937), le Néo-Destour de Bourguiba en Tunisie ; en Afrique noire, la négritude (Senghor, Césaire, Damas) retourne le regard colonial. La <b>seconde guerre mondiale</b> fragilise les métropoles vaincues (France de 1940) et fait naître l\'<b>ONU</b> (1945) et la <b>déclaration universelle des droits de l\'homme</b> (1948) : le discours de l\'égalité rend la colonisation indéfendable moralement. Les <b>indépendances</b> se succèdent : Liban et Syrie (1943-46), Inde et Pakistan (1947, partition sanglante), Indonésie (1949, guerre contre les Pays-Bas), puis l\'Afrique : Libye (1951), Maroc-Tunisie (1956), Ghana (1957), la <b>décolonisation de l\'Afrique noire française en 1960</b> (« année de l\'Afrique », 14 pays indépendants). Mais la <b>guerre d\'Algérie</b> (1954-1962) montre la face sanglante : refus de l\'indépendance par une population européenne d\'un million de personnes, guerre sans merci (embuscades, torture, déplacements de populations), coup d\'État manqué des généraux (1961), <b>accords d\'Évian et indépendance le 5 juillet 1962</b>, exode des pieds-noirs. Le bilan des empires reste l\'objet de débats mémoriels (rôle économique réel, violence des conquêtes, séquelles des frontières artificielles) ; le « <b>Tiers-Monde</b> » (terme d\'Alfred Sauvy, 1952) cherche entre 1955 (Bandung) et les années 1970 une « tierce voie » — non-alignement, développement.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le discours de Jules Ferry (1884), un texte à double tranchant</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Devant la Chambre, Jules Ferry justifie l\'expansion coloniale en invoquant trois arguments : « œuvre humanitaire et civilisatrice », « intérêt économique », « devoir des races supérieures ». Analysez.</div><div class=\"etu\"><b>Étape 1 — Replacer</b> : 1884, Troisième République, conférence de Berlin en cours ; Ferry, républicain fondateur de l\'école publique, veut convaincre une Chambre réticente.</div><div class=\"etu\"><b>Étape 2 — Distinguer</b> : les arguments économiques (marchés, matières premières) sont factuels et vérifiables ; l\'argument « humanitaire » est un <b>habillage moral</b> ; l\'argument des « races supérieures » est une pure idéologie raciste, aussitôt contestée (Clémenceau répond : « races supérieures ? … il y a entre elles l\'égalité des droits »).</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : le texte est précieux car il montre les justifications officielles de la colonisation — et qu\'elles étaient déjà dénoncées à l\'époque. <b>Réflexe méthode</b> : toujours situer un discours (auteur, date, destinataire, but) avant de le citer.</div></div></details>\n<details class=\"ex-util\"><summary>💡 Focus sur... — Gandhi : de la résistance à l\'indépendance de l\'Inde</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Par quels moyens Gandhi conduit-il l\'Inde à l\'indépendance (1947) ?</div><div class=\"etu\"><b>Étape 1 — La doctrine</b> : <b>non-violence</b> (ahimsa) et <b>désobéissance civile</b> : refuser la loi injuste, accepter la prison, ne jamais rendre la violence — sel fabriqué illégalement en 1930, marche du sel (380 km, 1930), boycott des tissus anglais.</div><div class=\"etu\"><b>Étape 2 — Les effets</b> : mobilisation massive et unie (hindous et musulmans ensemble), écho mondial, impopularité croissante de la répression britannique, épuisement de la Grande-Bretagne après 1945.</div><div class=\"etu\"><b>Étape 3 — Les limites</b> : l\'indépendance aboutit à la <b>partition</b> Inde/Pakistan (1947) et à des centaines de milliers de morts ; Gandhi assassiné en 1948 par un extrémiste hindou. <b>Réflexe méthode</b> : un grand personnage ne « fait » pas l\'histoire seul : combiner son action avec les causes profondes (économie, guerre, mobilisation).</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b> la conférence de Berlin (1884-85) ne « partage » pas l\'Algérie (française depuis 1830) mais fixe les règles du partage africain ; Suez = 1869 (canal), Égypte occupée par les Britanniques en 1882 ; distinguer colonie de peuplement, colonie d\'exploitation, protectorat, mandat ; l\'Inde devient indépendante en 1947 (pas 1950) ; décolonisation de l\'Afrique française = 1960, Algérie = 1962 ; ne pas écrire que « la colonisation a civilisé » sans distance critique.</div>"

  "id": "guerres-mondiales",

  "titre": "Les deux guerres mondiales (1914-1945)",
  "cours": "<div class=\"cours-head\"><h2>Les deux guerres mondiales (1914-1945)</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. 1914-1918 : la Première Guerre mondiale, un effondrement de civilisation</h3>\n<div class=\"tip\"><b>Pourquoi la guerre ?</b> L\'assassinat de l\'archiduc François-Ferdinand à Sarajevo (28 juin 1914) n\'est que l\'étincelle. Les causes profondes : <b>rivalités</b> entre puissances (coloniales — Maroc 1905, 1911 —, économiques, maritimes entre Allemagne et Grande-Bretagne) ; <b>alliances</b> rigides (Triple Entente : France, Royaume-Uni, Russie ; Triplice : Allemagne, Autriche-Hongrie, Italie) qui transforment un conflit balkanique en guerre européenne ; <b>nationalismes</b> exacerbés ; courses aux armements. Le jeu des alliances fait entrer en guerre, en quelques semaines, toutes les grandes puissances. Les <b>plans</b> prévoient une guerre courte ; la <b>course à la mer</b> (septembre-novembre 1914) et l\'échec de la Marne figent un front de 700 km : la <b>guerre de position</b> commence.</div>\n<div class=\"tip\"><b>La guerre des tranchées (1915-1917)</b> : sur le front ouest, soldats français (« poilus ») et allemands s\'enterrent. Les offensives (Verdun, février-décembre 1916 : 300 000 morts et 400 000 blessés pour quelques kilomètres ; la Somme, 1916 : 1,2 million de victimes) brisent contre les barbelés, les mitrailleuses et l\'artillerie. Les <b>nouvelles armes</b> (gaz, lance-flammes, chars en 1916, aviation, sous-marins) ne rompent pas le front. La vie du combattant est faite d\'attentes, de poux, de peur et de <b>violence de masse</b> : bombardements, corps à corps, exécutions ; les mutineries de 1917 (Chemin des Dames) sont réprimées. L\'<b>arrière</b> est mobilisé totalement : <b>économie de guerre</b> (usines d\'armement, femmes aux champs et aux machines, « munitionnettes »), emprunts, propagande, censure ; les empires coloniaux fournissent soldats et matières. L\'<b>entrée en guerre des États-Unis</b> (avril 1917, après la guerre sous-marine à outrance) et la <b>révolution russe</b> (février puis octobre 1917, paix de Brest-Litovsk mars 1918) changent la donne : les offensives allemandes du printemps 1918 échouent, la contre-offensive alliée (Foch, chars, Américains) brise le Reich ; l\'Allemagne signe l\'<b>armistice le 11 novembre 1918</b>.</div>\n<div class=\"tip\"><b>1919 : un monde transformé</b>. Bilan humain effroyable : près de <b>10 millions de morts militaires</b>, des millions d\'invalides et de veuves ; la France perd 1,4 million d\'hommes (« classes creuses »). Bilan matériel : régions dévastées (Nord et Est de la France), dettes, inflation. Bilan politique : quatre empires disparaissent (allemand, austro-hongrois, russe, ottoman) ; de nouveaux États naissent du <b>traité de Versailles</b> (28 juin 1919) — l\'Allemagne, jugée responsable (article 231), perd territoire (Alsace-Lorraine, colonies), armée et paie des réparations ; la SDN (Société des Nations) est créée mais sans les États-Unis (isolationnisme) ni la Russie bolchevique. Le ressentiment allemand, la crise économique et les idéologies autoritaires préparent la suite : « cette guerre n\'est pas la guerre, c\'est la guerre de vingt ans » (Foch). L\'Europe sort affaiblie : les États-Unis et le Japon progressent, les mouvements de décolonisation naissent (Wilson et Lénine ont tous deux parlé du droit des peuples).</div>\n<h3>2. 1919-1939 : entre deux guerres, la montée des totalitarismes</h3>\n<div class=\"tip\">Les <b>régimes totalitaires</b> naissent du traumatisme de la guerre et de la crise. En <b>Russie</b>, Lénine puis <b>Staline</b> (à partir de 1924-1929) construisent une dictature du parti unique : collectivisation forcée (famine d\'Ukraine 1932-33, plusieurs millions de morts), dékoulakisation, <b>Grande Terreur</b> (1937-38 : environ 750 000 exécutions), goulag, propagande et culte de la personnalité, planification. En <b>Italie</b>, <b>Mussolini</b> prend le pouvoir par la marche sur Rome (1922) : parti unique fasciste, encadrement de la jeunesse, corporatisme, mythologie de l\'Empire (Éthiopie 1935-36). En <b>Allemagne</b>, la crise de 1929 (6 millions de chômeurs) porte le parti nazi : <b>Hitler</b> devient chancelier le 30 janvier 1933, obtient les pleins pouvoirs, installe la dictature (parti unique, Gestapo, camps de concentration dès Dachau 1933), mène une <b>politique antisémite</b> croissante (boycott 1933, lois de Nuremberg 1935, nuit de Cristal 1938) et prépare la guerre (remilitarisation de la Rhénanie 1936, Anschluss et Munich 1938, entrée en Bohême 1939, pacte germano-soviétique avec Staline le 23 août 1939).</div>\n<h3>3. 1939-1945 : la Seconde Guerre mondiale, guerre d\'anéantissement</h3>\n<div class=\"tip\"><b>1939-1942 : les victoires de l\'Axe.</b> Le 1er septembre 1939, l\'Allemagne envahit la <b>Pologne</b> (Blitzkrieg, guerre éclair) ; France et Royaume-Uni déclarent la guerre. 1940 : offensive à l\'ouest, <b>débâcle française</b> (Dunkerque, l\'armistice du 22 juin) ; le maréchal Pétain signe la capitulation et fonde l\'État français de <b>Vichy</b> (révolution nationale, collaboration, statut des Juifs d\'octobre 1940) ; le général <b>de Gaulle</b> lance l\'appel du 18 juin depuis Londres et organise la <b>France libre</b>. La <b>bataille d\'Angleterre</b> (été 1940) échoue ; Hitler se tourne vers les Balkans puis envahit l\'<b>URSS</b> (22 juin 1941) ; le <b>Japon</b> attaque <b>Pearl Harbor</b> (7 décembre 1941) : les États-Unis entrent en guerre. En 1942, l\'Axe domine l\'Europe et le Pacifique ; les <b>étapes de la Shoah</b> s\'accélèrent : ghettos (Varsovie), <b>conférence de Wannsee</b> (20 janvier 1942 : organisation de la « solution finale »), centres de mise à mort (Auschwitz-Birkenau, Treblinka...) — près de <b>6 millions de Juifs</b> assassinés, ainsi que les Tsiganes (200 000 à 300 000 victimes), dans un <b>génocide</b> industriel et bureaucratique.</div>\n<div class=\"tip\"><b>1942-1945 : le retournement et la victoire alliée.</b> Trois ruptures en 1942-43 : <b>Midway</b> (juin 1942, Pacifique), <b>El Alamein</b> (automne 1942, Afrique du Nord), <b>Stalingrad</b> (hiver 1942-43, tournant en Europe — la 6e armée allemande anéantie). La <b>guerre totale</b> mobilise toutes les ressources : économies américaines (« arsenal de la démocratie »), femmes au travail partout, bombardements stratégiques des villes (Coventry, Hambourg, Dresde, Tokyo), guerre du Pacifique âpre (Guadalcanal, Iwo Jima, Okinawa). Le 6 juin 1944, le <b>Débarquement de Normandie</b> ouvre le front ouest ; Paris libéré en août ; l\'Armée rouge arrive de l\'est ; le 8 mai 1945, l\'Allemagne capitule. Le 6 août 1945, la première <b>bombe atomique</b> détruit Hiroshima (puis Nagasaki le 9) : le Japon capitule le 2 septembre 1945. Bilan : <b>50 à 60 millions de morts</b> (dont une majorité de civils), Europe et Asie en ruines, traumatisme moral du génocide, début de l\'ère nucléaire.</div>\n<div class=\"tip\"><b>La France dans la guerre</b> : trois France se superposent — Vichy (autoritaire, collaborationniste), la <b>Résistance</b> intérieure (maquis, réseaux, presse clandestine, Jean Moulin unifiant les mouvements en 1943) et la France libre puis combattante ; à la Libération, le GPRF dirigé par de Gaulle rétablit la légalité républicaine (droit de vote des femmes en 1944), épure et refonde la République (programme du CNR : sécurité sociale, nationalisations). La guerre a fait de la France une puissance secondaire entre les deux supergrands vainqueurs, États-Unis et URSS — entrée dans la <b>guerre froide</b>.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — Verdun, symbole de la guerre de position</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi Verdun (1916) est-il devenu le symbole de la Première Guerre mondiale ?</div><div class=\"etu\"><b>Étape 1 — Les faits</b> : l\'état-major allemand veut « saigner » l\'armée française en attaquant un secteur réputé vital ; 10 mois de combats, 300 000 morts et 400 000 blessés, villages rasés (ils ne seront jamais reconstruits), le fameux « ils ne passeront pas » (Nivelle/Pétain).</div><div class=\"etu\"><b>Étape 2 — Ce que cela révèle</b> : la guerre industrielle (millions d\'obus), l\'endurance des combattants (souffrance psychologique, « Verdun des hommes »), l\'absurdité stratégique (quelques kilomètres perdus et repris), l\'entrée de Pétain dans la légende — retournée en 1940.</div><div class=\"etu\"><b>Étape 3 — La mémoire</b> : ossuaire de Douaumont, flamme et tombe du Soldat inconnu (1920) : Verdun devient lieu de mémoire franco-allemand (réconciliation, 1984 Mitterrand-Kohl). <b>Réflexe méthode</b> : un symbole se construit : distinguer l\'événement, ce qu\'il révèle, et sa mémoire.</div></div></details>\n<details class=\"ex-util\"><summary>💡 Focus sur... — Auschwitz, comprendre la Shoah</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Qu\'est-ce qui fait de la Shoah un événement singulier dans l\'histoire des guerres ?</div><div class=\"etu\"><b>Étape 1 — Le processus</b> : exclusion légale (lois de Nuremberg, statut de Vichy), spoliation, ghettos, fusillades à l\'Est (Einsatzgruppen, Babi Yar 1941), puis mise à mort industrielle : sélection, chambres à gaz, crématoriums. Wannsee (janvier 1942) coordonne la bureaucratie du meurtre.</div><div class=\"etu\"><b>Étape 2 — La singularité</b> : un <b>génocide</b> planifié par un État moderne, visant l\'extermination totale d\'un peuple (juifs d\'Europe, du nouveau-né au vieillard), y compris sans « utilité » militaire : les trains de la mort continuent en 1944 alors que l\'Allemagne manque de tout.</div><div class=\"etu\"><b>Étape 3 — Le devoir de mémoire</b> : procès de Nuremberg (1945-46, naissance du crime contre l\'humanité), témoignages (Primo Levi, Anne Frank), principe « plus jamais ça », loi française de 1990 contre la négation. <b>Réflexe méthode</b> : distinguer faits (dates, chiffres) et interprétation ; citer les étapes du processus, pas seulement le bilan.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b> ne pas confondre armistice (cessez-le-feu, 11 novembre 1918) et traité de paix (Versailles, 28 juin 1919) ; Verdun = 1916, la Somme = 1916 aussi ; l\'Italie change de camp en 1915 (rejoint l\'Entente) ; Vichy collabore dès octobre 1940 (entrevue de Montoire) ; débarquement de Normandie = 6 juin 1944 (Pas-de-Calais : opération diversion) ; Hiroshima = 6 août 1945, capitulation du Japon = 2 septembre 1945 ; la Shoah commence avant Wannsee (fusillades 1941).</div>"

  "titre": "La guerre froide : un monde bipolaire (1947-1991)",
  "cours": "<div class=\"cours-head\"><h2>La guerre froide : un monde bipolaire (1947-1991)</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. 1945-1947 : de la Grande Alliance à la rupture</h3>\n<div class=\"tip\">En 1945, les vainqueurs — États-Unis, URSS, Royaume-Uni — ont coopéré pour battre l\'Axe (conférences de Yalta et Potsdam, février-août 1945, qui dessinent les zones d\'occupation de l\'Allemagne). Mais deux visions du monde s\'opposent : la démocratie libérale et l\'économie capitaliste d\'un côté, le parti unique et l\'économie collectiviste de l\'autre. Dès 1946, les tensions montent (discours de Churchill sur le « rideau de fer », février 1946). En mars 1947, le président Truman énonce sa doctrine : aider les « peuples libres » menacés (Grèce, Turquie) — c\'est la politique d\'<b>endiguement</b> (containment). En septembre, Jdanov répond pour l\'URSS en dénonçant l\'« impérialisme américain » : le monde se divise en deux blocs. La guerre froide est un affrontement <b>global, indirect et idéologique</b> : jamais les deux supergrands ne s\'affrontent directement, mais tout (économie, culture, sport, espace, tiers-monde) devient champ de bataille.</div>\n<div class=\"tip\"><b>Les outils de la bipolarité</b>. Chaque bloc s\'organise : côté occidental, plan <b>Marshall</b> (juin 1947 : 13 milliards de dollars d\'aide à la reconstruction européenne, refusés par l\'Est sur ordre de Moscou), <b>OTAN</b> (1949, alliance militaire), OECE ; côté soviétique, Kominform (1947), <b>COMECON</b> (1949, économie planifiée intégrée) et <b>pacte de Varsovie</b> (1955). L\'<b>Allemagne</b> cristallise la coupure : blocus de Berlin (juin 1948 - mai 1949, pont aérien allié) → naissance de la RFA et de la RDA (1949) ; mur de <b>Berlin</b> (13 août 1961) : le « rideau de fer » devient béton. La course aux <b>armements</b> est permanente : bombe A américaine (1945), soviétique (1949), bombe H (1952/1953), puis l\'<b>équilibre de la terreur</b> : les deux camps disposent d\'arsenaux nucléaires capables de se détruire mutuellement (dissuasion, MAD). La propagande, les radios (Voice of America, Radio Moscou), le sport et la conquête spatiale (Spoutnik 1957, Gagarine 1961, Apollo 11 : la Lune en 1969) prolongent la compétition.</div>\n<h3>2. Crises et guerres périphériques : le « tiers monde » en jeu</h3>\n<div class=\"tip\"><b>Les crises directes</b> entre les deux grands sont rares mais graves : <b>Berlin</b> (1948-49, 1961), <b>guerre de Corée</b> (1950-53 : la Corée du Nord communiste envahit le Sud ; contre-offensive de l\'ONU sous drapeau de l\'ONU — l\'URSS boycottait le Conseil de sécurité — ; armistice de Panmunjom, la péninsule reste coupée au 38e parallèle), <b>crise des missiles de Cuba</b> (octobre 1962 : le plus proche du gouffre — Khrouchtchev installe des fusées à Cuba, Kennedy impose une quarantaine navale ; retrait soviétique contre promesse de non-invasion et retrait des fusées américaines de Turquie ; à la suite, le « téléphone rouge » et la détente). D\'autres conflits par procuration ensanglantent le tiers monde : <b>Vietnam</b> (guerre des Français jusqu\'en 1954, Dien Bien Phu ; puis 1965-1973, engagement massif américain ; chute de Saigon 1975), Afghanistan (1979-1989, l\'Armée rouge s\'enlise contre des moujahidine soutenus par les États-Unis), Moyen-Orient (Israël soutenu par l\'Ouest, pays arabes par l\'URSS).</div>\n<div class=\"tip\"><b>Le tiers monde entre les blocs</b> : la conférence de <b>Bandung</b> (1955, 29 pays d\'Asie et d\'Afrique autour de Nehru, Nasser et Soekarno) affirme le refus de l\'alignement ; le <b>non-alignement</b> devient une force (Conférence de Belgrade 1961, Tito-Nehru-Nasser). La décolonisation (cf. chapitre précédent) crée un tiers monde qui refuse la logique des blocs mais reste un enjeu : aide au développement, armée, clientélisme. La France de <b>de Gaulle</b> (1958-1969) illustre une voie atlantique « indépendante » : sortie intégrée de l\'OTAN (1966), force de frappe nucléaire, reconnaissance de la Chine populaire (1964) — d\'autres États refusent la bipolarité stricte.</div>\n<h3>3. Détente, nouvelle guerre froide, effondrement (1962-1991)</h3>\n<div class=\"tip\"><b>La détente (1962-1975)</b> : après Cuba, les deux camps négocient — « téléphone rouge », traités de non-prolifération (TNP 1968), SALT I (1972, plafonnement des armes stratégiques, visite de Nixon à Moscou), accords d\'Helsinki (1975). La coopération spatiale (Soyuz-Apollo 1975) symbolise l\'apaisement. Mais la détente reste fragile : l\'URSS de Brejnev impose sa doctrine de « souveraineté limitée » sur ses satellites (Prague 1968, le « printemps » écrasé par les chars du pacte de Varsovie). <b>La nouvelle guerre froide (1975-1985)</b> : les Soviétiques envahissent l\'Afghanistan (1979), les Euromissiles divisent l\'Europe (double décision de l\'OTAN 1979), les États-Unis de Reagan relancent la course (IDS « guerre des étoiles » 1983, boycott des JO de Moscou 1980 — celui de Los Angeles 1984 en réponse). Les relations tombent au plus bas depuis 1962.</div>\n<div class=\"tip\"><b>L\'effondrement du bloc de l\'Est (1985-1991)</b> : en 1985, <b>Mikhaïl Gorbatchev</b> arrive au pouvoir et lance deux réformes : la <b>glasnost</b> (transparence, liberté d\'expression) et la <b>perestroïka</b> (restructuration économique). Le système soviétique, épuisé (économie en ruine, guerre d\'Afghanistan, course aux armements, Tchernobyl en 1986 qui ruine le prestige du régime), se délite. En 1989, une année miracle : la <b>chute du mur de Berlin</b> le 9 novembre 1989, les régimes communistes d\'Europe de l\'Est tombent l\'un après l\'autre (Pologne, Hongrie, Tchécoslovaquie avec la « révolution de velours », Roumanie sanglante) ; l\'Allemagne se <b>réunifie le 3 octobre 1990</b>. Le pacte de Varsovie se dissout (1991), puis l\'URSS elle-même : tentative de putsch conservateur en août 1991, démissions de Gorbatchev, création de la CEI : le <b>25 décembre 1991, l\'URSS disparaît</b>. La guerre froide s\'achève sans guerre directe, par l\'épuisement économique et l\'aspiration des peuples à la liberté ; le monde entre dans un nouvel ordre — incertain ( (cf. chapitre suivant)).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la crise de Cuba (1962), au bord du gouffre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment la crise des missiles de Cuba (octobre 1962) illustre-t-elle à la fois le danger et la « gestion » de la guerre froide ?</div><div class=\"etu\"><b>Étape 1 — Le contexte</b> : Castro à Cuba (1959) s\'allie à Moscou ; les États-Unis ont des fusées en Turquie ; en octobre 1962, des avions espions photographient des rampes de missiles nucléaires soviétiques en cours d\'installation à Cuba, à portée des États-Unis.</div>\n<div class=\"etu\"><b>Étape 2 — La gestion</b> : Kennedy choisit le blocus naval (« quarantaine ») plutôt que l\'attaque ; treize jours de tension maximale, négociations secrètes : retrait des fusées contre engagement de non-invasion de Cuba et retrait discret des fusées de Turquie. Le monde frôle la guerre nucléaire — et s\'en sort par le <b>compromis</b>.</div><div class=\"etu\"><b>Étape 3 — Les conséquences</b> : « téléphone rouge », traités de limitation (interdiction des essais atmosphériques 1963), début de la détente. <b>Réflexe méthode</b> : une crise se raconte en trois temps — contexte, déroulé, conséquences ; montrer les marges de décision des acteurs.</div></div></details>\n<details class=\"ex-util\"><summary>💡 Focus sur... — 1989, l\'année où le mur est tombé</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi le mur de Berlin, symbole de la guerre froide, tombe-t-il en 1989 ?</div><div class=\"etu\"><b>Étape 1 — Les causes</b> : crises économique et de légitimité du bloc de l\'Est, réformes de Gorbatchev (glasnost/perestroïka, refus d\'intervenir), mobilisations civiles (Solidarność en Pologne, manifestations de Leipzig, <i>Paneuropéen</i> de Hongrie ouvrant son rideau de fer).</div><div class=\"etu\"><b>Étape 2 — L\'événement</b> : le 9 novembre 1989, une conférence de presse maladroite annonce l\'ouverture des passages : dans la nuit, des dizaines de milliers de Berlinois se pressent aux postes, les gardes ouvrent ; le mur est « mangé » par la foule dans les jours suivants.</div><div class=\"etu\"><b>Étape 3 — La suite</b> : réunification allemande (3 octobre 1990), dissolution du pacte de Varsovie et de l\'URSS (1991). <b>Réflexe méthode</b> : un symbole (le mur) permet de raconter toute la guerre froide : construction (1961), vie quotidienne (deux mondes), chute (1989), mémoire.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b> guerre froide = affrontement indirect : jamais de guerre directe USA-URSS ; OTAN = 1949, pacte de Varsovie = 1955 (en réponse) ; mur de Berlin = 1961, sa chute = 1989 (ne pas confondre) ; crise de Cuba = 1962 (pas la baie des Cochons, 1961) ; l\'ONU ne « gagne » pas la guerre de Corée : c\'est une coalition sous son drapeau ; l\'URSS disparaît fin 1991, la RFA/RDA fusionnent en 1990 ; Gorbatchev ne « décide » pas de la réunification : il l\'accepte.</div>"

  "cours": "<div class=\"cours-head\"><h2>Le monde depuis 1990 : un nouvel ordre mondial ?</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. 1991-2001 : l\'espoir d\'un « nouvel ordre mondial »</h3>\n<div class=\"tip\">La disparition de l\'URSS (décembre 1991) laisse les États-Unis seule « hyperpuissance » : l\'Amérique domine tous les registres — militaire (interventions), économique (modèle libéral, révolution Internet), culturel (Hollywood, marques, soft power). George Bush père parle en 1991 d\'un « <b>nouvel ordre mondial</b> » : l\'ONU, momentanément réconciliée (fin du veto soviétique), sanctionne une coalition internationale qui libère le <b>Koweït</b> envahi par l\'Irak de Saddam Hussein (guerre du Golfe, janvier-février 1991). L\'espoir d\'une gouvernance mondiale pacifiée semble possible : accords israélo-palestiniens d\'<b>Oslo</b> (1993), fin de l\'apartheid en Afrique du Sud (libération de Mandela 1990, élections 1994), extension de l\'Union européenne (Maastricht 1992, euro 2002), élargissement de l\'OTAN à l\'Est (1999, 2004). Mais la décennie déçoit aussi : guerres civiles yougoslaves (Croatie, Bosnie 1992-95 — Srebrenica 1995, premier génocide européen depuis 1945 —, Kosovo 1999), génocide des <b>Tutsi au Rwanda</b> (1994, environ 800 000 morts en trois mois, inaction internationale), échec de la Somalie, « nouvelles guerres » où les civils sont les premières victimes.</div>\n<div class=\"tip\"><b>La mondialisation s\'accélère</b> : révolution des <b>technologies de l\'information</b> (Web, téléphonie mobile), ouverture des marchés (OMC, 1995), flux financiers et délocalisations, émergence de la <b>Chine</b> (réformes de Deng Xiaoping, « socialisme de marché », zone économique spéciale de Shenzhen, entrée à l\'OMC en 2001). Le monde semble « plat » (Friedman) : mais la mondialisation produit aussi des perdants (inégalités, précarité), des contestations (Seattle 1999, mouvements « altermondialistes ») et une gouvernance fragile (crises financières : Mexique 1994, Asie 1997, Internet 2000).</div>\n<h3>2. Depuis 2001 : un monde instable et multipolaire</h3>\n<div class=\"tip\">Le <b>11 septembre 2001</b> (attentats d\'Al-Qaïda contre le World Trade Center et le Pentagone, près de 3 000 morts) ouvre une nouvelle ère : la <b>guerre contre le terrorisme</b> — intervention en <b>Afghanistan</b> (2001-2021, retour des talibans après le retrait américain), guerre d\'<b>Irak</b> (2003, sans mandat de l\'ONU, armes de destruction massive introuvables, chaos et émergence de Daech). Le terrorisme djihadiste frappe partout (Madrid 2004, Londres 2005, Paris 2015, Nice 2016...) : les démocraties cherchent l\'équilibre entre sécurité et libertés (Patriot Act, lois antiterroristes, surveillance). Les <b>printemps arabes</b> (2011 : Tunisie — Ben Ali renversé —, Égypte, Libye, Syrie...) soulèvent un espoir de démocratisation ; mais la <b>guerre civile syrienne</b> (depuis 2011, centaines de milliers de morts, millions de réfugiés) et la montée de <b>Daech</b> (« État islamique », 2014-2019) débouchent sur des crises migratoires majeures (2015, crise des réfugiés en Europe).</div>\n<div class=\"tip\"><b>Un monde multipolaire et concurrentiel</b> : les États-Unis restent la première puissance, mais de nouveaux acteurs s\'affirment. La <b>Chine</b> de Xi Jinping (depuis 2012) : deuxième économie mondiale, nouvelles routes de la soie (initiative lancée en 2013), mainmise sur la mer de Chine, surveillance massive des Ouïghours — et rivalité technologique et commerciale avec Washington (guerre commerciale 2018, Huawei, semi-conducteurs). La <b>Russie</b> de Poutine (depuis 2000) : reprise en main autoritaire, annexion de la <b>Crimée</b> (2014), soutien aux séparatistes du Donbass, puis <b>invasion de l\'Ukraine</b> (24 février 2022) — retour de la guerre de haute intensité en Europe, condamnée par l\'Assemblée générale de l\'ONU. D\'autres puissances comptent : Inde, Brésil, Turquie, pays du Golfe ; les institutions mondiales (ONU, OMC) sont bloquées (vetos, divisions) ; les <b>enjeux globaux</b> — climat (COP21 de Paris 2015, accords de Paris), pandémies (Covid-19 en 2020 : première crise sanitaire mondiale depuis 1918), intelligence artificielle, cybermenaces — exigent des coopérations que les rivalités compliquent.</div>\n<div class=\"tip\"><b>Où en est le monde ?</b> L\'expression « nouvel ordre mondial » a vieilli : l\'ordre d\'après 1991 (hégémonie américaine, extension du modèle libéral) est contesté de l\'intérieur (populismes, remise en cause des démocraties, réseaux sociaux et désinformation) et de l\'extérieur (autocrates, puissances révisionnistes). Pour autant, le multilatéralisme n\'est pas mort (accord de Paris sur le climat, gestion des pandémies, justice pénale internationale), et les sociétés civiles, les ONG et les générations montantes se mobilisent (mouvements climatiques). Le monde depuis 1990 est donc à la fois <b>plus interconnecté</b> (mondialisation, technologies) et <b>plus fragmenté</b> (rivalités, guerres, crises) : comprendre les années 1990-2020, c\'est apprendre à raisonner en tensions plutôt qu\'en certitudes.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le 11 septembre 2001, un tournant mondial</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi le 11 septembre 2001 marque-t-il l\'entrée dans une nouvelle période des relations internationales ?</div><div class=\"etu\"><b>Étape 1 — L\'événement</b> : quatre avions détournés par des terroristes d\'Al-Qaïda ; deux tours du World Trade Center détruites, un avion sur le Pentagone, un quatrième (vol 93) s\'écrase en Pennsylvanie ; près de 3 000 morts, images mondialement retransmises en direct.</div><div class=\"etu\"><b>Étape 2 — Les conséquences immédiates</b> : légitimation de l\'intervention en Afghanistan (2001) ; doctrine de la « guerre contre le terrorisme » ; alliance internationale, renforcement des politiques de sécurité (fichiers, surveillance, Guantanamo) ; économie (aérien, assurances) affectée.</div><div class=\"etu\"><b>Étape 3 — Les conséquences profondes</b> : la plus grande puissance du monde est frappée au cœur — on ne mesure plus la menace uniquement en États ; asymétrie (réseaux terroristes contre États), guerres en Irak (2003) et en Afghanistan (2001-2021) ; exacerbation des tensions autour de l\'islam politique et du Moyen-Orient. <b>Réflexe méthode</b> : un tournant se prouve : montrer l\'avant/l\'après, les conséquences immédiates et longues, en France et dans le monde.</div></div></details>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la Chine, une puissance devenue mondiale</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment la Chine est-elle passée en trente ans d\'un pays pauvre à la deuxième puissance mondiale ?</div><div class=\"etu\"><b>Étape 1 — Les réformes</b> : dès 1978, Deng Xiaoping ouvre l\'économie (« socialisme de marché ») : zones économiques spéciales, agriculture décollectivisée, attraction des capitaux étrangers ; après Tiananmen (1989), la croissance continue.</div><div class=\"etu\"><b>Étape 2 — Le décollage</b> : « atelier du monde » (exportations), urbanisation massive, entrée à l\'OMC (2001), montée en technologie (5G, espace, trains à grande vitesse) ; centaines de millions de personnes sorties de la pauvreté — mais censure, parti unique, surveillance (crédit social) et répression des minorités.</div><div class=\"etu\"><b>Étape 3 — La puissance globale</b> : deuxième économie (2010), première puissance commerciale, routes de la soie, marine en expansion, revendication en mer de Chine, rivalité avec les États-Unis. <b>Réflexe méthode</b> : une puissance se mesure sur plusieurs registres — économie, armée, technologie, culture, influence (soft power).</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b> l\'URSS disparaît fin 1991 (pas en 1989) ; OMC = 1995 (GATT avant) ; 11 septembre 2001 = Al-Qaïda (pas Daech, qui apparaît en 2014) ; guerre d\'Irak 2003 ≠ guerre du Golfe 1991 ; annexion de la Crimée = 2014, invasion de l\'Ukraine = 2022 ; « multipolaire » ≠ équilibre parfait : les États-Unis restent la première puissance militaire ; mondialisation ≠ uniformisation (les cultures résistent et se réinventent).</div>"
