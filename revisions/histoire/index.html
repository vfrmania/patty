<script>
var PROGRAMME = [{"n": "Antiquité et Moyen Âge","ch": [{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident","id": "antiquite"},{"t": "Le Moyen Âge : féodalité, Église et croisades","id": "moyen-age"}]},

{"n": "XIXe siècle","ch": [{"t": "La révolution industrielle et la société du XIXe siècle","id": "industrialisation"},{"t": "Colonisation et empires coloniaux (XIXe-XXe siècles)","id": "colonisation"}]},
{"n": "XXe-XXIe siècles","ch": [{"t": "Les deux guerres mondiales (1914-1945)","id": "guerres-mondiales"},{"t": "La guerre froide : un monde bipolaire (1947-1991)","id": "guerre-froide"},{"t": "Le monde depuis 1990 : un nouvel ordre mondial ?","id": "monde-1990"}]}];
var COURS_META = [{"id": "antiquite","theme": "L'Antiquité : Grèce, Rome et la naissance de l'Occident (Collège)","niveau": "Collège","titre": "L'Antiquité : Grèce, Rome et la naissance de l'Occident","cours": "<div class=\"cours-head\"><h2>L'Antiquité : Grèce, Rome et la naissance de l'Occident</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La Grèce : cités, démocratie et culture</h3>\n<div class=\"tip\">Vers le VIIIe siècle av. J.-C., les Grecs s'organisent en <b>cités</b> (polis) : Athènes, Sparte, Corinthe. Chaque cité : son territoire, ses lois, ses dieux. <b>Athènes (Ve siècle av. J.-C.)</b> invente la <b>démocratie</b> (cléisthène puis Périclès) : les citoyens votent les lois à l'Ecclésie (assemblée) : MAIS citoyens = hommes libres adultes nés de parents athéniens (les femmes, les esclaves et les métèques exclus). La culture grecque : théâtre (tragédie), jeux olympiques (776 av. J.-C.), philosophie (Socrate, Platon, Aristote).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — décrypter une sculpture grecque</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire la frise du Parthénon : que nous apprend-elle sur Athènes vers 440 av. J.-C. ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le contexte</b> : le Parthénon (temple d'Athéna) est construit après les guerres médiques : Périclès le fait bâtir avec le trésor de la ligue de Délos : c'est la <b>puissance d'Athènes</b> affichée.</div><div class=\"etu\"><b>Étape 2</b> — <b>La frise</b> : elle représente la <b>grande Panathénées</b> (fête de la déesse) : des citoyens processionnent avec le péplos d'Athéna : les dieux assistent : l'harmonie des corps.</div><div class=\"etu\"><b>Étape 3</b> — <b>Ce que l'œuvre révèle</b> : la fierté <b>civique</b> (la cité s'offre à sa déesse), l'ordre et la mesure (idéal de sôphrosynè) : le sens du <b>message politique</b> (Athènes : la ville modèle) : question type brevet : décrire : contextualiser : expliquer.</div></div></details>\n<h3>2. Rome : la République, l'Empire, le droit</h3>\n<div class=\"tip\"><b>Rome</b> : fondée selon la légende en 753 av. J.-C. République en 509 (chasse des rois : le Sénat, les consuls). Droit écrit (Loi des Douze Tables, 450 av. J.-C.). Conquêtes méditerranéennes (guerres puniques contre Carthage : Hannibal). <b>Empire</b> : Auguste (27 av. J.-C.) : la Pax Romana : routes, aqueducs, latin : une citoyenneté étendue (édit de Caracalla, 212 : citoyenneté à tous les hommes libres). Empire romain d'Occident : chute en 476.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi « tous les chemins mènent à Rome » ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer comment une route romaine témoigne de la puissance impériale.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le réseau</b> : environ 80 000 km de voies pavées relient les provinces : la Via Appia part de Rome « toutes les routes partent de Rome » : bornage (les bornes milliaires indiquent les distances).</div><div class=\"etu\"><b>Étape 2</b> — <b>La fonction</b> : faire circuler les <b>légions</b> (vitesse de déploiement), les marchandises (blé d'Égypte : amphores), le <b>courrier impérial</b> (cursus publicus) : l'administration contrôle.</div><div class=\"etu\"><b>Étape 3</b> — <b>La romanisation</b> : le long des routes : les villes ( Forums, thermes, arènes), le latin (langues romanes), le droit : la route est un <b>outil d'intégration</b> : question type : document = une borne : identifier, dater, expliquer la fonction.</div></div></details>\n<h3>3. La chute de l'Empire et l'héritage</h3>\n<div class=\"tip\"><b>IIIe siècle</b> : crise (invasions : inflation : empire divisé : christianisme officialisé par Constantin : édit de Milan 313 : Théodose religion d'État 380). Division Empire d'Orient (Byzance : Constantinople : jusqu'en 1453) / Occident : <b>476</b> : déposition du dernier empereur par Odoacre : les royaumes barbares s'installent. <b>Héritage</b> : latin et langues romanes, droit romain, architecture, christianisme : l'Église garde la culture écrite.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — 476 : une chute discrète</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi parle-t-on de « chute » de l'Empire romain d'Occident en 476 alors que personne à l'époque ne s'en rend compte ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Les faits</b> : en 476, Odoacre renvoie les insignes impériaux à Constantinople : il n'y a plus d'empereur à Rome : c'est un <b>événement administratif</b> pas une bataille.</div><div class=\"etu\"><b>Étape 2</b> — <b>La lenteur</b> : l'Empire se délite depuis le IIIe siècle (invasions :et les crises fiscales : armée de plus en plus barbare) : la « chute » est un <b>processus</b> plus qu'un jour.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le choix des historiens</b> : 476 est une <b>convention</b> commode pour clore l'Antiquité : l'historien découpe le temps (périodisation) : c'est le réflexe de méthode : distinguer l'événement et la construction historique.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la démocratie athénienne exclut femmes, esclaves, métèques (démocratie « directe » mais très restreinte) ; ne pas confondre République romaine (509-27 av. J.-C.) et Empire (après Auguste) ; 476 = Occident SEULEMENT (Byzance continue) ; les « Barbares » ne détruisent pas tout : ils s'installent et se romanisent partiellement.</div>"},
{"id": "moyen-age","theme": "Le Moyen Âge : féodalité, Église et croisades (Collège)","niveau": "Collège","titre": "Le Moyen Âge : féodalité, Église et croisades","cours": "<div class=\"cours-head\"><h2>Le Moyen Âge : féodalité, Église et croisades</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'Occident médiéval : royaumes et paysans</h3>\n<div class=\"tip\">Après 476 : des <b>royaumes barbares</b> (Wisigoths en Espagne : Ostrogoths en Italie : Francs en Gaule). <b>Clovis</b> (roi des Francs : 481-511) : conversion au christianisme (baptême de Reims ~496 : alliance avec l'Église : légitimité) : empire franc : <b>Charlemagne</b> (couronné empereur à Rome en <b>800</b> : renouveau impérial : écoles : capitulaires). Partage de Verdun (843) : trois royaumes. Les <b>invasions</b> (Vikings, Sarrasins, Hongrois : IXe-Xe) fragmentent le pouvoir : la société se réorganise localement : la <b>féodalité</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire une cérémonie d'hommage</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un vassal met ses mains dans celles de son seigneur et jure fidélité. Expliquer ce rituel.</div><div class=\"etu\"><b>Étape 1</b> — <b>L'hommage</b> : le vassal (le « homme ») reconnaît être « l'homme » du seigneur : la formule : « je veux être votre homme » : le geste des mains jointes dans les mains du seigneur (l'immixtion des mains).</div><div class=\"etu\"><b>Étape 2</b> — <b>La fidélité</b> : le serment (sur les reliques : Dieu témoin) : obligations du vassal (aide militaire : conseil : rançon) et du seigneur (protection : le fief : la terre qui rémunère).</div><div class=\"etu\"><b>Étape 3</b> — <b>Ce que révèle le rituel</b> : le pouvoir est <b>personnel et contractuel</b> (pas un État abstrait : des liens d'homme à homme : le « gouvernement des seigneurs ») : la pyramide vassalique (le roi : les grands : les chevaliers) : question type : décrire le document + expliquer la société féodale.</div></div></details>\n<h3>2. L'Église, cadre de la vie</h3>\n<div class=\"tip\">L'Église <b>encadre</b> : la vie des sacrements (baptême : mariage : extrême-onction), le calendrier (fêtes : dimanches), l'assistance (hôpitaux : hospices). La <b>chrétienté latine</b> : le pape (Rome), les évêques, les abbayes (Cluny ~910 : réforme : Cîteaux 1098 : Bernard de Clairvaux). La peur de l'enfer dicte les comportements (les fresques du jugement). Le <b>clergé</b> : régulier (moines : vœux) et séculier (curés : la paroisse). L'Église : première propriétaire foncière : la dîme (impôt) : l'ordre social : oratores (ceux qui prient), bellatores (ceux qui combattent), laboratores (ceux qui travaillent).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — une abbaye cistercienne</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire le plan d'une abbaye cistercienne et expliquer sa fonction économique.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le plan type</b> : l'église abbatiale (offices : la journée rythmée par les heures), le cloître (méditation), le réfectoire, le dortoir, la salle du chapitre (discipline), les bâtiments des <b>convers</b> (moines travailleurs) : les granges.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'économie</b> : les moines blancs défrichent (les forêts : les marais : Cîteaux fondée dans un vallon marécageux) : les granges exploitées par les convers (les laïcs) : l'abbaye de Clairvaux : des milliers d'hectares : moulins : forges : vignes : le commerce de la laine.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le sens</b> : le monastère est une <b>entreprise intégrée</b> (religion + production + hospitalité) : les cisterciens refusent le faste clunisien (l'austérité de Bernard : les églises dépouillées) : l'ordre nouveau accompagne l'essor agricole du XIIe (la « révolution agricole » : charrue : triennial rotation) : question type : décrire une abbaye : expliquer le rôle économique de l'Église.</div></div></details>\n<h3>3. Les croisades et l'expansion</h3>\n<div class=\"tip\"><b>1095</b> : Urbain II prêche à Clermont (« Dieu le veut ! ») : la 1re croisade : prise de Jérusalem en <b>1099</b> : les États latins d'Orient. 8 croisades jusqu'en 1291 (chute d'Acre). Motifs : religieux (délivrer les Lieux saints : le péché remis : l'indulgence), seigneuriaux (des terres : des aventuriers), économiques (les marchands italiens : Venise : Gênes : Pise). Conséquences : affaiblissement de Byzance (1204 : sac de Constantinople par la 4e croisade !), échanges avec l'Orient, orders militaires (Templiers : Hospitaliers), l'inquisition et les expulsions (les juifs de France en 1306 : la « croisade » interne contre l'hérésie cathare : Albigeoise 1209-1229).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — analyser le sac de Constantinople (1204)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La 4e croisade, partie « délivrer Jérusalem », finit par piller Constantinople, ville chrétienne. Expliquer ce détournement.</div><div class=\"etu\"><b>Étape 1</b> — <b>La dette</b> : les croisés ont loué une flotte à <b>Venise</b> (le doge Enrico Dandolo) : ils ne peuvent pas payer : Venise les détourne vers Zara (1202 : ville chrétienne : excommunication) puis vers Constantinople (l'usurpateur byzantin promet argent et union des Églises).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le sac (avril 1204)</b> : trois jours de pillage (les reliques : la bronze des chevaux de Saint-Marc : emportées à Venise) : l'empereur <b>latin</b> installé (Baudouin de Flandre) : l'empire « latin » dure jusqu'en 1261 : Byzance ne s'en remettra jamais.</div><div class=\"etu\"><b>Étape 3</b> — <b>La portée</b> : la croisade montre que l'idéal religieux est <b>détourné par les intérêts</b> (vénitiens : dynastiques) : le choc entre les chrétientés latine et grecque devient irréparable (le schisme de 1054 : confirmé) : et l'Orient est affaibli : les Ottomans en profiteront : question type : raconter + critiquer les motivations réelles.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « féodalité » ≠ société entière (le roi garde un rôle : l'Église un cadre commun) ; toutes les croisades ne vont pas en Terre sainte (Albigeoise : en France) ; le Moyen Âge n'est pas « obscurantiste » : universités (Bologne : Paris : 1200), cathédrales gothiques, agriculture : la « renaissance du XIIe » ; 800 : couronnement de Charlemagne (pas 843 : partage : pas 987 : Hugues Capet).</div>"},
{"id": "renaissance","theme": "La Renaissance : humanisme et réformes religieuses (Collège)","niveau": "Collège","titre": "La Renaissance : humanisme et réformes religieuses","cours": "<div class=\"cours-head\"><h2>La Renaissance : humanisme et réformes religieuses</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'humanisme : l'homme au centre</h3>\n<div class=\"tip\">XVe-XVIe : l'<b>humanisme</b> (érasme : More : Rabelais : Montaigne) : retour aux sources antiques (ad fontes), critique des textes (l'imprimerie de Gutenberg ~1450 : la Bible imprimée : 180 exemplaires en 1455), éducation nouvelle (le collège de Guyenne : les « exercises » latins : l'individu formé). <b>« Je suis homme : rien d'humain ne m'est étranger »</b> (Térence : la devise) : la dignité de l'homme (Pic de la Mirandole). La <b>Renaissance artistique</b> : l'Italie (Florence : les Médicis : Brunelleschi : le dôme) : la perspective (Masaccio), l'anatomie (Léonard : les planches de Vésale 1543), les mécènes.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'imprimerie révolutionne la lecture</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Avant 1450, un moine copie une Bible en 3 ans. Après Gutenberg : 180 Bibles en 3 ans. Expliquer les conséquences.</div><div class=\"etu\"><b>Étape 1</b> — <b>La technique</b> : caractères mobiles métalliques (l'alliage plomb-étain-antimoine), la presse à vis (de vin : adaptée), l'encre grasse : la « fabrique » du livre (Mayence : l'atelier : les 42 lignes).</div><div class=\"etu\"><b>Étape 2</b> — <b>La diffusion</b> : 1450-1500 : 20 millions d'incunables (les livres imprimés avant 1501) : Venise (Aldo Manuce : le portable : l'italique : le « format poche » ancien) : le prix chute (le manuscrit : le cochage : la reliure) : l'alphabétisation croît.</div><div class=\"etu\"><b>Étape 3</b> — <b>La portée</b> : les idées circulent (Érasme vendu partout : Luther : ses pamphlets (les 95 thèses : 1517 : les « libelles » : les gravures de Cranach : la propagande) : la Réforme IMPOSSIBLE sans l'imprimerie : « l'art divin » selon Luther) : la lecture silencieuse, individuelle : l'esprit critique : question type : montrer qu'une innovation technique a des conséquences culturelles.</div></div></details>\n<h3>2. Les réformes religieuses</h3>\n<div class=\"tip\"><b>1517</b> : Luther affiche (envoie ?) les <b>95 thèses</b> contre les indulgences : la grâce par la FOI seule (sola fide), l'Écriture seule (sola scriptura : la Bible traduite en allemand 1522 : chacun lit), le refus de la hiérarchie (prêtres mariés). <b>1534</b> : <b>Act of Supremacy</b> (Henri VIII : l'anglicanisme). <b>Jean Calvin</b> (l'Institution chrétienne 1536 : Genève : la prédestination). La <b>contre-réforme catholique</b> : le concile de <b>Trente</b> (1545-1563 : la messe en latin confirmée : les séminaires : la censure (l'Index 1559) : la rigueur) : les jésuites (Ignace de Loyola 1540 : l'enseignement).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi l'Allemagne s'embrase-t-elle ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer pourquoi la doctrine de Luther triomphe dans les principautés allemandes en 10 ans.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le scandale des indulgences</b> : le pape Léon X finance Saint-Pierre (les indulgences plénières : le dominicain Tétzel : « quand la pièce sonne : l'âme s'envole ») : Luther (un moine augustin : professeur à Wittenberg) proteste : le salut ne s'achète pas.</div><div class=\"etu\"><b>Étape 2</b> — <b>La protection des princes</b> : les princes allemands convoitent les biens ecclésiastiques (l'Église : la plus grande propriétaire) : la doctrine du « for intérieur » (le chrétien n'obéit qu'à la Parole) légitime le rejet de Rome : Frédéric le Sage cache Luther (la Wartburg : la Bible traduite).</div><div class=\"etu\"><b>Étape 3</b> — <b>La propagande</b> : les pamphlets à saisir (les 95 thèses : le creux : les gravures : le rustique allemand contre la « grande bête » du pape) : en 1521, la diète de Worms (Luther : « ici je suis : je ne peux autrement ») : l'empereur Charles Quint le met au ban : les princes « protestants » (la protestation de Spire 1529 : le mot) : la guerre des paysans (1524-25 : Luther la condamne : le « tuer comme des chiens enragés » : la Réforme se tourne vers les princes) : question type : articuler religion et politique.</div></div></details>\n<h3>3. Les guerres de religion en France</h3>\n<div class=\"tip\">France : <b>catholiques contre protestants (Huguenots)</b> : 1562-1598 : huit guerres. Le <b>massacre de la Saint-Barthélemy</b> (24 août <b>1572</b> : Catherine de Médicis : Charles IX : 3 000 morts à Paris : des milliers en province). L'édit de Nantes (<b>1598</b> : Henri IV : la liberté de culte dans les places de sûreté : coexistence légale).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire l'édit de Nantes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'édit de Nantes (1598) : une paix ou une victoire ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le contenu</b> : la liberté de conscience partout : le culte protestant permis (sauf à Paris) : les places de sûreté (La Rochelle : Montauban : 100 places ? le « état dans l'État ») : les charges partagées.</div><div class=\"etu\"><b>Étape 2</b> — <b>Un compromis</b> : ni la conversion des protestants (l'objectif de la Ligue), ni leur élimination : la coexistence légale (première moderne en Europe ?) : Henri IV (lui-même converti : « Paris vaut bien une messe » : 1593) achète la paix.</div><div class=\"etu\"><b>Étape 3</b> — <b>La portée</b> : une tolérance ADMINISTRATIVE (pas philosophique : personne ne croit au pluralisme) : la fragilité (Louis XIV la révoque en 1685 : l'édit de Fontainebleau : 200 000 huguenots partent (la révocation : les dragonnades)) : question type : montrer les limites d'une paix religieuse.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> Renaissance ≠ rupture brutale (continuités médiévales : les « renaissances » multiples depuis Charlemagne) ; Luther ne veut pas d'abord une « nouvelle église » mais une RÉFORME ; 1517 : 95 thèses (pas la Bible) ; ne pas confondre Trente (catholique : 1545-63) et Vatican II (1962-65) ; Saint-Barthélemy (1572) ≠ édit de Nantes (1598).</div>"},
{"id": "absolutisme","theme": "L'absolutisme royal et les Lumières (Collège)","niveau": "Collège","titre": "L'absolutisme royal et les Lumières","cours": "<div class=\"cours-head\"><h2>L'absolutisme royal et les Lumières</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'absolutisme de droit divin</h3>\n<div class=\"tip\"><b>Henri IV</b> (assassiné 1610) → <b>Louis XIII</b> (Richelieu : 1624-42 : « réduire les grands » : les places protestantes (Alès 1629)) → <b>Louis XIV</b> (1661 : gouvernement personnel : « l'État, c'est moi » (apocryphe mais révélateur) : « </div>\n<div class=\"tip\">Le roi de <b>droit divin</b> (Bossuet : la politique tirée de l'Écriture : le roi « lieutenant de Dieu ») : les intendants (le « royaume administré »), la cour (Versailles 1682 : l'étiquette : le contrôle des nobles), les académies (l'Académie française 1634 : le classicisme), la révocation de l'édit de Nantes (<b>1685</b>). Les guerres (les « guerres de Louis XIV » : 1667-1714 : le traité d'Utrecht 1713).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — Versailles, machine de pouvoir</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le lever du roi : 100 courtisans assistent à la toilette de Louis XIV. Expliquer la fonction de ce rituel.</div><div class=\"etu\"><b>Étape 1</b> — <b>La domestication des nobles</b> : les grands seigneurs (Condé : Conti : les « princes du sang ») qui conspiraient (la Fronde 1648-53 : l'enfance marquée du roi) sont transformés en <b>courtisans</b> qui briguent l'honneur de tendre la chemise : l'ambition domestiquée.</div><div class=\"etu\"><b>Étape 2</b> — <b>La distribution des faveurs</b> : les pensions : les charges (le « commerce des honneurs ») : tout vient du Roi Soleil (le protocole : les « entrées » : les « honneurs de la cour ») : la dépendance générale.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le message</b> : l'art (Le Brun : la galerie des Glaces : les « exploits » du roi : Apollon : le soleil) : la propagande (les médailles : les « petites » académies : le Mercure galant) : Versailles est une <b>scène du pouvoir</b> : question type : décrire + expliquer la fonction politique d'un lieu.</div></div></details>\n<h3>2. Les Lumières : la critique du système</h3>\n<div class=\"tip\">XVIIIe : la <b>raison critique</b> : Montesquieu (l'Esprit des lois 1748 : la séparation des pouvoirs), Voltaire (les Lettres anglaises 1734 : le fanatisme dénoncé : « écrasez l'infâme »), Rousseau (le Contrat social 1762 : la souveraineté du peuple), Diderot et d'Alembert (l'<b>Encyclopédie</b> 1751-72 : 28 volumes : les « connaissances » classées : la diffusion : les abonnés : l'Europe), les physiocrates (l'économie). Le <b>despotisme éclairé</b> : les rois se réclament des philosophes (Frédéric II : Catherine II : les réformes « d'en haut »). Le réseau : les salons (la« sociabilité »), les cafés, les académies de province, la <b>cinquantaine</b> de sociétés.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'Encyclopédie, arme de combat</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi l'Encycédie est-elle à la fois un dictionnaire et un manifeste ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le projet</b> (1750 : le Prospectus : « rassembler les connaissances éparses : les mettre à la portée des hommes ») : la traduction de Chambers (le projet initial : modeste) devient la« grande affaire » (Diderot : la ténacité : 20 ans : les censure (le privilège retiré 1752 : 1759 : la mise à l'Index) : les 8 volumes de planches (les métiers : l'« encyclopédie » des techniques).</div><div class=\"etu\"><b>Étape 2</b> — <b>Les articles-éclairs</b> : les définitions qui blessent : « Autorité politique » (Diderot : « nul homme n'a reçu de la nature le droit de commander aux autres »), « Fanatisme » (Voltaire : « l'ennemi »), « Guerre » (l'« art de s'égorger »), les articles « théologiques » (le cheval de Troie : les « superstitions » ridiculisées) : la« discrétion » (les renvois : les doubles : le lecteur qui compare).</div><div class=\"etu\"><b>Étape 3</b> — <b>La portée</b> : la diffusion (les 25 000 exemplaires avant 1789 (une moitié hors de France !) : les lecteurs européens (Catherine II abonnée : Frédéric : les « despotes » lecteurs) : les« réimpression » pirates (l'Italie : la Suisse) : l'Encyclopédie forme les élites qui feront (partiellement) 1789 : le « dictionnaire raisonné » = la méthode : CLASSER pour CRITIQUER.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> l'absolutisme n'est pas « tout-puissant » (les coutumes : les parlements : les « lois fondamentales » : la fiscalité négociée) ; les philosophes ne sont pas « révolutionnaires » (la plupart veulent des rois éclairés : Rousseau à part) ; l'Encyclopédie est censurée puis diffusée : la censure nourrit la curiosité ; ne pas confondre XVIIe (absolutisme : classicisme) et XVIIIe (Lumières).</div>"},

a tête de Launay (l'hôtel de ville).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le symbole</b> : la Bastille = l'arbitraire (les lettres de cachet (la prison d'État (le mythe (Voltaire : la« Bastille » libérée (le« marquis » de Sade (les cris (la demolition (les« pierres » vendues (les pavés de la liberté ! : la milice (la garde nationale : Lafayette : la cocarde (le bleu-rouge de Paris + le blanc du roi : le Roi (le« roi de Paris » : la foule : la« acceptation » (le 17 : Louis XVI à Paris (la« reconciliation » : le sens : le peuple parisien devient acteur politique.</div></div></details>\n<h3>2. 1789 : l'année des ruptures</h3>\n<div class=\"tip\"><b>Nuit du 4 août</b> : l'abolition des privilèges (le « brigandage de quelques-uns » : la« société » refondée). <b>26 août</b> : la <b>Déclaration des droits de l'homme et du citoyen</b> (17 articles : les droits naturels (liberté : propriété : sûreté : résistance à l'oppression) : la loi générale (l'égalité devant l'impôt : les charges : la souveraineté de la nation). Octobre : les femmes de Paris (la marche sur Versailles (le roi « rapatrié » à Paris). La <b>constitution civile du clergé</b> (12 juillet 1790 : le serment : la France coupée en deux (les« réfractaires »). La fuite de Varennes (juin 1791 : la confiance rompue).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — analyser la DDHC</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Les hommes naissent et demeurent libres et égaux en droits. » (article 1er). Expliquer la portée et les limites de ce texte.</div><div class=\"etu\"><b>Étape 1</b> — <b>La portée</b> : la légitimité renversée (la souveraineté du peuple (le contrat : le droit naturel (les droits ANTÉRIEURS à l'État (l'État les reconnaît : il ne les donne pas) : l'universalité (le« tous » (la portée mondiale (le modèle : les Amériques : l'Europe : les décolonisations.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le contenu</b> : la liberté (l'article 4 : tout ce qui ne nuit pas (la loi fixe les limites : l'égalité devant la loi (l'article 6 : la« générale » (les charges ouvertes : la propriété (l'article 17 : inviolable (le« fondement » de la société : la résistance à l'oppression (l'article 2 : le droit de la« sûreté »).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les limites</b> : les exclus (les femmes (Olympe de Gouges : la déclaration des droits de la femme (1791 : « si la femme peut monter sur l'échafaud : elle doit pouvoir monter à la tribune » : la guillotinée ! : les esclaves (le« CODE » noir maintenu : la traite : les colonies (les« Amis des noirs » (la Société : l'abolition de 1794 (la« reprise » de 1802 ! : les pauvres (le suffrage censitaire (l'« actif » : la distinction (la« citoyens passifs » : la propriété condition (le vote « virtuel » : les domestiques exclus) : le texte fondateur : UNE promesse universelle PARTIELLEMENT appliquée : c'est le sujet type.</div></div></details>\n<h3>3. La radicalisation (1792-1794) et la fin (1794-1799)</h3>\n<div class=\"tip\"><b>1792</b> : la guerre (l'Autriche : la Prusse : Valmy (20 septembre : la République (21 septembre 1792 : la Convention : l'exécution du roi (21 janvier 1793 : le crime d'État ? la« régicide »). 1793 : la Terreur (le Comité de salut public (Robespierre : Saint-Just : l'économie réglementée (le maximum : les« armées révolutionnaires » : la levée en masse (août 1793 : la« nation » armée : les suspects (la loi du 22 prairial (juin 1794 : la« Grande Terreur » : les 16 000 exécutions (les Vendéens : Lyon : Nantes (les« noyades »). <b>Thermidor</b> (27 juillet 1794 : la chute de Robespierre : la fin de la Terreur : la Convention thermidorienne (la« réaction » : le Directoire (1795-99 : l'instabilité (les coups d'État (les« conspirations » : le 18 Brumaire (9 novembre 1799 : Bonaparte.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi la Terreur ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La Terreur est-elle une nécessité (la guerre) ou une idéologie (la vertu) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La nécessité</b> : la France envahie (Valmy : l'étranger (les coalisés : la Vendée (la guerre civile (l'intérieur (les« federalisme » (Lyon : Toulon (les Anglo-espagnols : la trahison (Dumouriez ! : l'évacuation (les« frontières » : la levée en masse (août : les 14 armées (les victoires (Hondschoote : Wattignies (l'économie (le maximum (les assignats (la« victoire » de l'an II : la République sauvée.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'idéologie</b> : la vertu (Robespierre : la« démocratie » (le peuple souverain : les ennemis du peuple (la« conspiration » (l'étranger intérieur : le procès du roi (la mort (le« régicide » fondateur (la“ déchristianisation » (l'Être suprême (la religion civile : les« philosophes » de la Terreur (Saint-Just : « la république : c'est la destruction de tout ce qui s'y oppose ».</div><div class=\"etu\"><b>Étape 3</b> — <b>La discussion</b> : les historiens (la« circonstancielle » (Cobban : Mathiez (la« sociale » (Soboul (les « sans-culottes » (le mouvement (la« bourgeoisie » (la« politique » (Furet : la« culture » de 1793 (la langue (le vocabulaire (la“ régénération ” : le bilan (les 16 000-17 000 exécutions (35 000 morts en Vendée ? (l'ensemble des guerres de l'Ouest : 200 000 ? : la question : la Terreur « sauvé » la Révolution ? ou l'a-t-elle « dévoyée » (la« dictature » (les institutions (le salut public (la guerre totale (le précédent : le sujet type : toujours articuler circonstances et idéologie.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la Révolution n'est pas un bloc (les phases (1789 : 1792 : 1793 : thermidor) : la« fin » (1799 est une continuité institutionnelle (Bonaparte « hérite » (les acquis civils (l'art. 17 ! : ne pas confondre DDHC (1789 : déclaration) et Constitution (1791 : le« roi » des Français (la« monarchie constitutionnelle » : la Terreur n'est pas toute la Révolution (l'ensemble (les« années » : la Vendée : la chouannerie (les révoltes « contre » (le sens pour les paysans (la religion (les « brigands » de la foi).</div>"},

 class=\"etu\"><b>Étape 3</b> — <b>Le message</b> : l'union des légitimités (le charisme militaire (le plébiscite (l'Église (le « nouveau » Charles Quint ? le Charlemagne (la« translation » (les insignes (les abeilles (les « carolingien » : le sacre : un COUP DE THÉÂTRE politique : la modernité du pouvoir (la propagande (le tableau (David (les « commandes » (l'art d'État : la question type : analyser une image de propagande.</div></div></details>\n<h3>2. L'Empire : expansion et blocus</h3>\n<div class=\"tip\">Les guerres (les coalitions (les victoires (Austerlitz (le 2 décembre 1805 : le « soleil » d'Austerlitz : Ulm : Iéna (1806 (les Prussiens écrasés : Friedland (1807 (le traité de Tilsit (les empires « partagés » : l'Europe napoléonienne (les royaumes « familiaux » (les frères (Joseph : Naples puis Espagne : Louis : Hollande : Jérôme : Westphalie : les « satellisés » : la Confédération du Rhin : le grand-duché de Varsovie. Le <b>blocus continental</b> (1806 : l'Angleterre « étouffée » (les décrets de Berlin : le« système » (les côtes « fermées » (les « licences » (les exceptions (les« fraudeurs » : le« Milan » (1807 (la guerre économique.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'Espagne : le « guêpier » (1808)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi la guerre d'Espagne (1808-1814) devient-elle le désastre de l'Empire ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La « trahison » initiale</b> : Napoléon profite des querelles dynastiques espagnoles (Charles IV : Ferdinand : le« prince des Asturies » (l'Entrevue de Bayonne (l'abdication forcée (Joseph roi d'Espagne : les Espagnols « trahis » (le 2 mai 1808 : Madrid (l'insurrection (les« Dos de Mayo » (les fusillades (Goya : les« fusillades » du 3 mai.</div><div class=\"etu\"><b>Étape 2</b> — <b>La guerre « nouvelle »</b> : la guérilla (la « petite guerre » (les paysans (les prêtres (les « armées » irrégulières (l'occupant épuisé (les embuscades (les ataille</b> : la ferme de la Haye-Sainte (les attaques (la garde impériale (les carrés (le soir : les Prussiens (la« Plancenoit » (le « pulvérisation » (les « sauve qui peut » : les pertes (40 000 hommes (l'armée « détruite ».</div><div class=\"etu\"><b>Étape 3</b> — <b>La portée</b> : la fin « totale » (la seconde abdication (l'île « lointaine » (Sainte-Hélène (l'Atlantique (le « rocher » (la« captivité » (Hudson Lowe (le« mémorial » (la dictée de Las Cases (la« légende » (le« martyr » : le romantisme (le mythe (l'« influence » : les 1840 (le retour des cendres (le Invalides (la« religieuse » de la mémoire : la question type : conclure sur la mémoire (la« postérité » d'une défaite.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> Napoléon « clôt » la Révolution MAIS conserve les acquis (l'égalité civile : les biens nationaux : le Code : l'Empire n'est pas le « retour » de l'Ancien Régime (les titres nouveaux (la « noblesse » d'Empire (le mérite : le Concordat n'est pas le retour du clergé d'Ancien Régime (l'Église « salariale » : ne pas confondre consulat (1799 : sénatus-consulte (1804 : sacre (2 décembre 1804.</div>"},
{"id": "industrialisation","theme": "La révolution industrielle et la société du XIXe siècle (Collège)","niveau": "Collège","titre": "La révolution industrielle et la société du XIXe siècle","cours": "<div class=\"cours-head\"><h2>La révolution industrielle et la société du XIXe siècle</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les moteurs de l'industrialisation</h3>\n<div class=\"tip\">À partir de l'Angleterre (fin XVIIIe), trois révolutions s'enchaînent : la <b>machine à vapeur</b> (James Watt : l'énergie ne dépend plus du muscle, du vent ou de l'eau), le <b>charbon</b> et le <b>coton</b> (les usines : la production en série), puis le <b>chemin de fer</b> (1825-1850 : le monde rétréci : les marchés unifiés). La France industrialise plus lentement (le textile du Nord : la soie lyonnaise : la métallurgie lorraine), l'Allemagne et les États-Unis rattrapent vers 1880 (l'acier : la chimie : l'électricité — la « seconde révolution industrielle »).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le chemin de fer change tout</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Montrer avec trois exemples que le chemin de fer transforme l'économie, la société et le paysage.</div><div class=\"etu\"><b>Étape 1</b> — <b>Économie</b> : les marchandises circulent vite et bas (le prix du transport de blé s'effondre : les régions de famine disparaissent), les usines reçoivent charbon et acier : la sidérurgie explose.</div><div class=\"etu\"><b>Étape 2</b> — <b>Société</b> : les ouvriers se déplacent vers les villes (l'exode rural), les horaires s'imposent à tous (la montre : la gare : l'heure commune), les classes moyennes voyagent (les bains de mer).</div><div class=\"etu\"><b>Étape 3</b> — <b>Paysage et politique</b> : les gares monumentales (le neogothique de Saint-Pancras : la verrière du Grand Palais), les ponts, les tunnels — et l'État s'implique (le plan Freycinet en France) : le rail est le symbole du progrès (les tableaux de Monet à la gare Saint-Lazare) : question type : relier une innovation et ses effets multiples.</div></div></details>\n<h3>2. La société industrielle : ouvriers et bourgeois</h3>\n<div class=\"tip\">La population urbaine explose (Londres : 1 million en 1800, 6 en 1900). Les <b>ouvriers</b> : journées de 12-16 h, travail des enfants (les filatures : les mines), logements insalubres (les taudis : le surpeuplement), accidents sans protection. Les <b>bourgeois</b> (patrons : ingénieurs : négociants) détiennent les usines et le pouvoir (le cens : le vote des « notables »). Les conflits naissent : les <b>luttes ouvrières</b> (Canuts lyonnais 1831-1834 : la révolte des « canuts » : « Vivre en travaillant ou mourir en combattant »), les journées de 1848, la Commune de Paris (1871). Les <b>syndicats</b> se légalisent (1884 : loi Waldeck-Rousseau), la <b>SEDI</b> — la IIe Internationale (1889) — organise les travailleurs, les lois sociales apparaissent enfin (limitation du travail des enfants : retraites de 1910).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — une journée d'ouvrière en filature (1840)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire la journée d'une ouvrière de filature et montrer ce que la médecine et le droit en disent à l'époque.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le travail</b> : 13 heures devant les machines (le bruit permanent : les courants d'air : la chaleur des ateliers), la surveillance des contremaitres, les amendes pour la moindre faute, la cotonose (la poussière de coton qui ronge les poumons).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le corps</b> : les médecins d'usine notent les déformations (les jambes en courbe des fileuses : les mains coupées non indemnisées), l'espérance de vie d'un ouvrier dépasse rarement 40 ans (Villermé : le « Tableau de l'état physique et moral des ouvriers », 1840).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le droit</b> : la loi de 1841 (travail des enfants limité à 8 h... rarement contrôlée), l'interdiction des coalitions jusqu'en 1884 : la question type : « un document décrit le travail ouvrier : relevez, expliquez, datez ».</div></div></details>\n<h3>3. L'urbanisation et les idées nouvelles</h3>\n<div class=\"tip\">Les villes se transforment : <b>Haussmann</b> perce les grands boulevards parisiens (1853-1870 : l'air : la circulation : les barricades difficiles), l'assainissement (l'eau : l'égout de Belgrand), les grands magasins (Le Bon Marché 1852 : la consommation nouvelle). Les idées : le <b>libéralisme</b> (laisser faire : les physiocrates hérités), le <b>socialisme</b> (Saint-Simon : Fourier : Proudhon), et surtout <b>Marx</b> (<i>le Capital</i> 1867 : la lutte des classes : la plus-value : la révolution annoncée), l'<b>anarchisme</b> (Bakounine). L'école ( Ferry : 1881-1882, gratuite, laïque, obligatoire) forme les citoyens de la République.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « révolution industrielle » au singulier masque deux phases (vapeur/charbon ~1780-1850 : électricité/pétrole/acier ~1880) ; l'industrialisation n'est pas linéaire (les crises : 1847 : 1873 : la « Grande Dépression » des prix) ; les conditions ouvrières s'améliorent LENTEMENT et inégalement (les lois sociales sont tardives) ; ne pas confondre Canuts (1830s) et Commune (1871).</div>"},
      x += 0.52 * ln.size * enc.length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');

  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}
