    "titre": "Colonisation et empires coloniaux (XIXe-XXe siècles)",
    "cours": "<div class=\"cours-head\"><h2>Colonisation et empires coloniaux (XIXe-XXe siècles)</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Pourquoi l'Europe colonise-t-elle le monde ?</h3>\n<p>Entre 1880 et 1914, les puissances européennes se partagent une grande partie de l'Afrique et de l'Asie. Les motifs sont <b>économiques, politiques, culturels et démographiques</b> :</p>\n<ul>\n<li><b>économiques</b> : matières premières (coton, caoutchouc, minerais), débouchés pour l'industrie, placements financiers ;</li>\n<li><b>politiques</b> : rivalités entre puissances (France, Royaume-Uni, Allemagne, Belgique, Italie) — posséder des colonies est un marqueur de prestige et de puissance ;</li>\n<li><b>culturels et religieux</b> : la « mission civilisatrice » et l'évangélisation servent de justification (le poème de Rudyard Kipling, « le fardeau de l'homme blanc », en est l'expression caricaturale) ;</li>\n<li><b>démographiques et scientifiques</b> : explorateurs (Livingstone, Brazza, Savorgnan de Brazza), sociétés de géographie, puis émigration européenne.</li>\n</ul>\n<div class=\"warn\"><b>La conférence de Berlin (1884-1885)</b> : les puissances européennes (la conférence est présidée par Bismarck ; l'Allemagne, la France, la Belgique et le Royaume-Uni y participent) fixent les règles du partage de l'Afrique — <b>sans aucun représentant africain</b> : les frontières sont tracées à la règle sur des cartes, en fonction des intérêts européens. Ce découpage artificiel est une des origines de nombreux conflits actuels.</div>\n\n<h3>2. Les empires coloniaux : domination et exploitation</h3>\n<p>En 1914, l'Afrique est presque entièrement colonisée ; les empires couvrent environ 84 % du monde :</p>\n<table>\n<tr><th>Empire</th><th>Étendue (v. 1914)</th><th>Principales colonies</th></tr>\n<tr><td>Empire britannique</td><td>le plus vaste (~ 400 millions d'habitants)</td><td>Inde, Afrique de l'Est et du Sud, Canada, Australie</td></tr>\n<tr><td>Empire français</td><td>2e (~ 50 millions)</td><td>Algérie (1830), Afrique occidentale et équatoriale, Indochine (1887), Madagascar</td></tr>\n<tr><td>Belgique (Léopold II)</td><td>Congo</td><td>exploitation brutale du caoutchouc</td></tr>\n<tr><td>Allemagne, Italie, Portugal, Pays-Bas</td><td>—</td><td>Afrique de l'Ouest allemande, Libye, Angola, Indes néerlandaises</td></tr>\n</table>\n<p>La domination coloniale prend plusieurs formes :</p>\n<ul>\n<li><b>administration directe</b> (Afrique française) ou indirecte (les Britanniques gouvernent par les chefs locaux) ;</li>\n<li><b>codes de l'indigénat</b> : les colonisés n'ont pas les mêmes droits que les Européens (impôts, corvées, justice inégale) ;</li>\n<li><b>économie de plantation</b> et mines : les cultures et les ressources sont tournées vers l'exportation ; travail forcé ;</li>\n<li><b>migrations forcées</b> : la traite continue sous d'autres formes (recrutement de tirailleurs, travail contractuel) ;</li>\n<li>la <b>mission civilisatrice</b> construit écoles, hôpitaux, chemins de fer — un discours qui masque l'exploitation.</li>\n</ul>\n\n<h3>3. Résistances et décolonisation</h3>\n<p>Les résistances à la colonisation existent dès le début :</p>\n<ul>\n<li><b>résistances armées</b> : Abd el-Kader en Algérie (1830-1847), Samory Touré en Afrique de l'Ouest, la reine Ranavalona à Madagascar, les Boxers en Chine (1900) ;</li>\n<li><b>résistances culturelles</b> : préservation des langues, religions, coutumes ; premiers mouvements intellectuels (négritude plus tard) ;</li>\n<li>après 1918 et surtout 1945, les colonisés demandent l'égalité puis l'indépendance : les tirailleurs des deux guerres mondiales revendiquent des droits ; la Charte de l'ONU (1945) proclame le droit des peuples à disposer d'eux-mêmes.</li>\n</ul>\n<p>La décolonisation s'accélère après 1945 :</p>\n<ul>\n<li><b>1947</b> : indépendance de l'<b>Inde</b> (Gandhi, Nehru) et du Pakistan ;</li>\n<li><b>1954-1962</b> : guerre d'<b>Algérie</b> — conflit long et brutal, indépendance en 1962 (accords d'Évian) ;</li>\n<li><b>1960</b> : « année de l'Afrique » — 17 États africains deviennent indépendants ;</li>\n<li>les indépendances aboutissent à des États aux frontières artificielles, souvent fragiles : néo-colonialisme, conflits, sous-développement persistant.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"20\" y1=\"64\" x2=\"420\" y2=\"64\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"420,64 410,59 410,69\" fill=\"#4f46e5\"/><line x1=\"34.0\" y1=\"64\" x2=\"34.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"34.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Conquête de l’Algérie</text><text x=\"34.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1830</text><line x1=\"127.0\" y1=\"64\" x2=\"127.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"127.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"127.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1884-85</text><text x=\"127.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Conférence de Berlin</text><line x1=\"220.0\" y1=\"64\" x2=\"220.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"220.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"220.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Indépendance de l’Inde</text><text x=\"220.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1947</text><line x1=\"313.0\" y1=\"64\" x2=\"313.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"313.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"313.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1960</text><text x=\"313.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Année de l’Afrique</text><line x1=\"406.0\" y1=\"64\" x2=\"406.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"406.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"406.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Algérie indépendante</text><text x=\"406.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1962</text></svg><span class=\"fig-cap\">De la conquête coloniale aux indépendances : un siècle et demi de domination, puis la décolonisation.</span></div><details class=\"ex-util\"><summary>💡 Focus sur... — analyser une affiche de propagande coloniale</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une affiche de 1930 représente une France rayonnante éclairant l'Afrique : des enfants africains tendent les bras vers la lumière. Décrivez et critiquez ce document.</div><div class=\"etu\"><b>Étape 1 — Décrire</b> : composition (la France au sommet, lumière descendante), personnages (enfants passifs), slogan éventuel : l'image met en scène la « mission civilisatrice ».</div><div class=\"etu\"><b>Étape 2 — Contextualiser</b> : l'entre-deux-guerres est l'apogée de l'empire français (exposition coloniale de Vincennes, 1931) ; l'affiche s'adresse au public français pour légitimer la colonisation.</div><div class=\"etu\"><b>Étape 3 — Critiquer</b> : inversion des rôles (l'Africain n'a ni nom ni parole), silence sur le travail forcé et l'indigénat, assimilation de « civilisation » à la seule culture européenne : c'est un document de propagande, pas une description.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : croiser avec d'autres sources (témoignages de colonisés, rapports sur le code de l'indigénat) : la méthode de l'historien confronte toujours les points de vue.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>La conférence de Berlin (1884-1885) ne « partage » pas officiellement tout : elle fixe des <b>règles</b> d'occupation (effective, notification) — mais aucun Africain n'y est consulté.</li>\n<li>L'Algérie est conquise dès <b>1830</b> : c'est une colonie de peuplement, pas une colonie tardive.</li>\n<li>La décolonisation n'est pas un mouvement uniforme : l'Inde (1947) obtient l'indépendance par négociation, l'Algérie (1954-1962) par la guerre, l'Afrique française en 1960 par accords.</li>\n<li>« Mission civilisatrice » est un <b>discours</b> justificateur, pas un bilan : toujours le signaler comme tel dans une copie.</li>\n<li>Les frontières africaines actuelles héritent du découpage colonial — facteur de tensions, pas une fatalité « tribale ».</li>\n</ul>\n</div>"
  },

    "titre": "Les deux guerres mondiales (1914-1945)",
    "cours": "<div class=\"cours-head\"><h2>Les deux guerres mondiales (1914-1945)</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. 1914-1918 : la Première Guerre mondiale, une guerre totale et industrielle</h3>\n<p>Le 28 juin 1914, l'archiduc <b>François-Ferdinand</b> est assassiné à Sarajevo ; les alliances emportent l'Europe dans la guerre (Triple-Entente : France, Royaume-Uni, Russie ; Triple-Alliance : Allemagne, Autriche-Hongrie, Italie — qui change de camp). La guerre de mouvement (Marne, septembre 1914) s'enlise : la <b>guerre des tranchées</b> commence (Verdun, 1916 : 700 000 victimes pour un front qui n'a pas bougé ; la Somme, 1916 ; le Chemin des Dames, 1917).</p>\n<ul>\n<li><b>guerre industrielle</b> : artillerie lourde, mitrailleuses, gaz (Ypres, 1915), chars, aviation : la machine l'emporte sur le courage ;</li>\n<li><b>guerre totale</b> : tout l'arrière est mobilisé — femmes dans les usines, emprunts, propagande, rationnement ; les empires coloniaux fournissent soldats (tirailleurs) et matières ;</li>\n<li><b>1917</b> : tournant — les États-Unis entrent en guerre (après la guerre sous-marine allemande) ; la Russie, révolutionnée, sort du conflit (paix de Brest-Litovsk, 1918) ;</li>\n<li><b>1918</b> : offensive allemande, puis victoire alliée ; armistice du <b>11 novembre 1918</b>.</li>\n</ul>\n<p>La paix des traités de 1919-1920 (traité de <b>Versailles</b> avec l'Allemagne, 28 juin 1919) impose à l'Allemagne la responsabilité du conflit, des réparations, des pertes territoriales et la limitation de son armée. La SDN (Société des Nations) est créée pour garantir la paix — mais sans les États-Unis, sans armée, elle restera impuissante. La guerre a fait environ <b>10 millions de morts militaires</b> et des millions de blessés, mutilés et « gueules cassées ».</p>\n\n<h3>2. 1919-1939 : fragilité de la paix et montée des totalitarismes</h3>\n<ul>\n<li><b>URSS</b> : à partir de 1917 (révolution bolchevique), Lénine puis <b>Staline</b> (à partir de 1924) construisent un régime totalitaire : parti unique, économie collectivisée, répression (famines, goulag, procès de Moscou, grande terreur 1937-38) ;</li>\n<li><b>Italie fasciste</b> : <b>Mussolini</b> prend le pouvoir en 1922 (marche sur Rome) : parti unique, encadrement de la jeunesse, culte du chef ;</li>\n<li><b>Allemagne nazie</b> : la crise de 1929 (chômage de masse) porte <b>Hitler</b> au pouvoir en <b>1933</b> : dictature, réarmement, antisémitisme d'État (lois de Nuremberg 1935, nuit de Cristal 1938), révisionnisme territorial (remilitarisation de la Rhénanie 1936, Anschluss et Munich 1938) ;</li>\n<li>les démocraties (France, Royaume-Uni) sont divisées et pratiquent l'<b>apaisement</b> (Munich, 1938 : on cède les Sudètes) : la guerre semble éviter un temps l'inévitable.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"20\" y1=\"64\" x2=\"420\" y2=\"64\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"420,64 410,59 410,69\" fill=\"#4f46e5\"/><line x1=\"34.0\" y1=\"64\" x2=\"34.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"34.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Début de la guerre</text><text x=\"34.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1914</text><line x1=\"96.0\" y1=\"64\" x2=\"96.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"96.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"96.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1916</text><text x=\"96.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Verdun</text><line x1=\"158.0\" y1=\"64\" x2=\"158.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"158.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"158.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Entrée des États-Unis</text><text x=\"158.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1917</text><line x1=\"220.0\" y1=\"64\" x2=\"220.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"220.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"220.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1918</text><text x=\"220.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Armistice du 11 nov.</text><line x1=\"282.0\" y1=\"64\" x2=\"282.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"282.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"282.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Crise économique</text><text x=\"282.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1929</text><line x1=\"344.0\" y1=\"64\" x2=\"344.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"344.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"344.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1933</text><text x=\"344.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Hitler au pouvoir</text><line x1=\"406.0\" y1=\"64\" x2=\"406.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"406.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"406.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Invasion de la Pologne</text><text x=\"406.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1939</text></svg><span class=\"fig-cap\">De la Grande Guerre à la Seconde : la paix de Versailles, la crise de 1929 et les totalitarismes mènent l’Europe à la guerre en vingt ans.</span></div><h3>3. 1939-1945 : la Seconde Guerre mondiale, guerre d'anéantissement</h3>\n<p>Le 1er septembre 1939, l'Allemagne envahit la <b>Pologne</b> ; la France et le Royaume-Uni déclarent la guerre. Phases du conflit :</p>\n<ol>\n<li><b>1939-1942 : victoires de l'Axe</b> : Blitzkrieg (Pologne, France de mai-juin 1940 : exode, armistice du 22 juin 1940), bataille d'Angleterre (1940), invasion de l'URSS (1941), Pearl Harbor et entrée en guerre des États-Unis (décembre 1941) ;</li>\n<li><b>1942 : tournant</b> : Stalingrad (février 1943) et Midway (juin 1942) ;</li>\n<li><b>1943-1945 : reconquête et effondrement de l'Axe</b> : débarquements de Normandie (6 juin 1944) et de Provence, capitulations allemande (8 mai 1945) puis japonaise (après Hiroshima et Nagasaki, 6 et 9 août 1945 ; capitulation le 2 septembre 1945).</li>\n</ol>\n<p>Cette guerre est une <b>guerre d'anéantissement</b>, sans précédent :</p>\n<ul>\n<li><b>Shoah</b> : la persécution des Juifs d'Europe (ghettos, Einsatzgruppen) devient génocide industriel à partir de 1942 (conférence de Wannsee, centres de mise à mort d'Auschwitz-Birkenau, Treblinka…) : environ <b>6 millions de Juifs</b> assassinés, ainsi que les Tsiganes (Samudaripen), les handicapés, les opposants politiques ;</li>\n<li><b>civils visés</b> : bombardements massifs des villes (Londres, Coventry, Dresde, Tokyo), sièges (Leningrad), représailles (Oradour, juin 1944) ;</li>\n<li><b>Résistances</b> : maquis (France, Yougoslavie, URSS), réseaux de renseignement, sauvetage des Juifs (Justes) ; en France, la France libre du général de Gaulle (appel du 18 juin 1940) face au régime de Vichy (collaboration, 10 juillet 1940) ;</li>\n<li><b>bilan</b> : 50 à 60 millions de morts, dont une majorité de civils ; Europe ruinée, traumatisme moral : le crime contre l'humanité est défini et jugé (procès de Nuremberg, 1945-46) ; l'ONU (1945) proclame les droits de l'homme (Déclaration universelle, 1948).</li>\n</ul>\n<div class=\"tip\"><b>Repère de méthode :</b> les deux guerres mondiales se combinent dans le même chapitre parce qu'elles forment un cycle : la paix mal conçue de 1919 (humiliation allemande, crise, totalitarismes) prépare 1939. Retenir la chaîne : <b>traité de Versailles → crise de 1929 → dictatures → guerre d'anéantissement → 1945 : monde bipolaire et décolonisation.</b></div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — caractériser la guerre d'anéantissement à partir d'un exemple</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> À partir d'un témoignage de rescapé d'Auschwitz, montrez que la Seconde Guerre mondiale est une guerre d'anéantissement.</div><div class=\"etu\"><b>Étape 1 — Définir</b> : « anéantissement » = vouloir détruire totalement l'ennemi, y compris les civils, ses biens, sa culture — pas seulement le vaincre militairement.</div><div class=\"etu\"><b>Étape 2 — Décrire le document</b> : arrivée (sélection, gaz), déshumanisation (matricule, travail forcé, faim) : les témoignages montrent un système industrialisé du meurtre.</div><div class=\"etu\"><b>Étape 3 — Élargir</b> : croiser avec d'autres exemples du programme (Stalingrad, bombardements, Nankin) : le ciblage des civils est général des deux côtés, mais le génocide des Juifs et des Tsiganes est un cas à part : anéantir un peuple pour ce qu'il est, non pour ce qu'il fait.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la guerre d'anéantissement s'oppose à la guerre « classique » : d'où, en réponse, la définition du crime contre l'humanité à Nuremberg et la Déclaration universelle de 1948.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Armistice (arrêt des combats, 11 novembre 1918 / 22 juin 1940) ≠ traité de paix (Versailles, 1919) ou capitulation (8 mai 1945).</li>\n<li>La Shoah commence avant 1942 (persécutions, ghettos, fusillades) ; 1942 marque l'industrialisation du génocide (Wannsee), pas son début.</li>\n<li>Verdun (1916) : bataille symbolique franco-allemande, environ 700 000 victimes — ne pas confondre avec Stalingrad (1942-43), tournant de la Seconde.</li>\n<li>1917 : entrée en guerre des États-Unis ET révolution russe — les deux expliquent le dénouement de 1918.</li>\n<li>Ne pas écrire « Hitler lance la crise de 1929 » : la crise facilite sa prise de pouvoir (1933), elle n'est pas causée par lui.</li>\n<li>Vichy (juillet 1940) collabore ; la France libre (de Gaulle) et la Résistance intérieure combattent : distinguer clairement les deux France.</li>\n</ul>\n</div>"

    "cours": "<div class=\"cours-head\"><h2>La guerre froide (1947-1991) : un monde bipolaire</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Deux blocs, deux modèles : la formation du monde bipolaire</h3>\n<p>En 1945, les vainqueurs — États-Unis et URSS — deviennent rivaux : la <b>guerre froide</b> est une confrontation <b> indirecte</b> (pas de guerre ouverte entre les deux « Grands ») entre deux modèles :</p>\n<table>\n<tr><th></th><th>Bloc de l'Ouest (États-Unis)</th><th>Bloc de l'Est (URSS)</th></tr>\n<tr><td>Modèle</td><td>démocratie libérale, capitalisme</td><td>parti unique, communisme, économie dirigée</td></tr>\n<tr><td>Alliance</td><td>OTAN (1949)</td><td>pacte de Varsovie (1955)</td></tr>\n<tr><td>Plan économique</td><td>plan Marshall (1947)</td><td>CAEM / Comecon</td></tr>\n<tr><td>Rideau de fer</td><td colspan=\"2\">frontière fermée coupant l'Europe en deux (discours de Churchill, 1946)</td></tr>\n</table>\n<ul>\n<li><b>1947</b> : doctrine Truman (« endiguement » du communisme) et plan Marshall ; doctrine Jdanov côté soviétique : la rupture est consommée ;</li>\n<li><b>1948-1949</b> : <b>blocus de Berlin</b> — l'URSS bloque les accès à Berlin-Ouest ; les Américains ravitaillent par un pont aérien ; l'Allemagne se coupe en deux (RFA 1949, RDA 1949) ;</li>\n<li>la <b>course aux armements</b> : bombe atomique américaine (1945), soviétique (1949), bombe H (1952-53), missiles : c'est l'<b>équilibre de la terreur</b> (chacun peut détruire l'autre : « destruction mutuelle assurée »).</li>\n</ul>\n\n<h3>2. Crises et guerres périphériques : le monde sous tension</h3>\n<ul>\n<li><b>guerres périphériques</b> : les deux Grands s'affrontent par alliés interposés — Corée (1950-53), Vietnam (guerre française puis américaine jusqu'en 1975), Afghanistan (1979-89) ;</li>\n<li><b>crises</b> : Berlin (1948-49 puis mur de Berlin, <b>1961</b> : l'Est enferme sa population — symbole de la guerre froide) ; <b>Cuba (1962)</b> : les missiles soviétiques à Cuba, blocus naval américain — le monde frôle la guerre nucléaire, puis « téléphone rouge » et Détente (années 1960-70 : traités de limitation SALT) ;</li>\n<li><b>course à l'espace</b> : Spoutnik (1957), Gagarine (1961), puis Apollo 11 : la Lune (1969) : la propagande se joue aussi dans les étoiles ;</li>\n<li><b>monde non-aligné</b> : conférence de Bandung (1955), mouvement des non-alignés (Belgrade 1961) : les nouveaux États (décolonisation) refusent de choisir un camp.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"20\" y1=\"64\" x2=\"420\" y2=\"64\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"420,64 410,59 410,69\" fill=\"#4f46e5\"/><line x1=\"34.0\" y1=\"64\" x2=\"34.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"34.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Doctrine Truman + plan Marshall</text><text x=\"34.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1947</text><line x1=\"96.0\" y1=\"64\" x2=\"96.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"96.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"96.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1949</text><text x=\"96.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">OTAN, RFA/RDA</text><line x1=\"158.0\" y1=\"64\" x2=\"158.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"158.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"158.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Mur de Berlin</text><text x=\"158.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1961</text><line x1=\"220.0\" y1=\"64\" x2=\"220.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"220.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"220.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1962</text><text x=\"220.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Crise des missiles de Cuba</text><line x1=\"282.0\" y1=\"64\" x2=\"282.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"282.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"282.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Afghanistan</text><text x=\"282.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1979</text><line x1=\"344.0\" y1=\"64\" x2=\"344.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"344.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"344.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1989</text><text x=\"344.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Chute du mur</text><line x1=\"406.0\" y1=\"64\" x2=\"406.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"406.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"406.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Fin de l’URSS</text><text x=\"406.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1991</text></svg><span class=\"fig-cap\">La guerre froide en sept dates : formation des blocs (1947-49), crises majeures (Berlin, Cuba), enlisement (Afghanistan), puis effondrement du bloc de l’Est.</span></div><h3>3. De la Détente à la fin de l'URSS (1985-1991)</h3>\n<ul>\n<li><b>1962-1979 : la Détente</b> : après Cuba, les Grands négocient (téléphone rouge 1963, SALT I 1972, Helsinki 1975) ; la guerre froide continue pourtant (Vietnam, Afghanistan) ;</li>\n<li><b>1979-1985 : nouvelle guerre froide</b> : euromissiles, boycott des JO de Moscou (1980) ;</li>\n<li><b>1985 : Gorbatchev</b> tente de sauver l'URSS : <i>glasnost</i> (transparence) et <i>perestroïka</i> (restructuration) — mais la contestation s'emballe :</li>\n<li><b>1989</b> : l'Europe de l'Est se libère (Pologne : Solidarność et élections libres ; Hongrie ; chute du <b>mur de Berlin le 9 novembre 1989</b>) ;</li>\n<li><b>1991</b> : tentative de putsch à Moscou (août), indépendances des républiques, dissolution de l'<b>URSS le 25 décembre 1991</b> : la guerre froide est finie — le monde devient unipolaire, dominé par les États-Unis.</li>\n</ul>\n<div class=\"warn\"><b>Le tiers monde et l'ONU :</b> pendant la guerre froide, l'ONU est souvent bloquée par le <b>veto</b> des cinq membres permanents du Conseil de sécurité ; l'arme nucléaire rend les Grands prudents (ni armée américaine ni armée soviétique ne s'affrontent jamais directement). Toute crise (Cuba) illustre cette règle : on va au bord du gouffre, puis on négocie.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — expliquer la crise des missiles de Cuba (1962)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> À l'aide d'une carte des positions américano-soviétiques en octobre 1962, expliquez pourquoi la crise de Cuba est un tournant de la guerre froide.</div><div class=\"etu\"><b>Étape 1 — Les causes</b> : Cuba de Castro s'allie à l'URSS (1961, échec de la baie des Cochons) ; l'URSS installe des missiles nucléaires à Cuba, à portée des États-Unis ; les Américains le découvrent par avion espion (U-2).</div><div class=\"etu\"><b>Étape 2 — Le déroulé</b> : blocus naval (« quarantaine ») américain (octobre 1962), préparation d'une riposte ; treize jours au bord de la guerre nucléaire.</div><div class=\"etu\"><b>Étape 3 — Le dénouement</b> : retrait des missiles soviétiques contre promesse américaine de ne pas envahir Cuba et retrait des missiles US de Turquie.</div><div class=\"etu\"><b>Étape 4 — Conclure sur le tournant</b> : la peur partagée produit la Détente : téléphone rouge (1963), traités de limitation des armes ; la crise montre que l'équilibre de la terreur rend la guerre directe irrationnelle.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Guerre froide = pas de guerre directe USA-URSS : les combats sont périphériques et par alliés interposés.</li>\n<li>1947 (doctrine Truman, plan Marshall) marque le début de la rupture — pas 1945 (les deux Grands sont encore alliés).</li>\n<li>Le mur de Berlin (1961) est construit par l'<b>Est</b> pour empêcher sa population de fuir ; il tombe en 1989.</li>\n<li>Cuba 1962 : ce n'est pas la guerre, c'est la crise la plus grave — et son résultat est une <b>négociation</b> (retrait soviétique + engagement américain).</li>\n<li>L'URSS ne disparaît qu'en <b>décembre 1991</b> ; la chute du mur (novembre 1989) est une étape, pas la fin.</li>\n</ul>\n</div>"

    "cours": "<div class=\"cours-head\"><h2>Le monde depuis 1990 : nouvel ordre mondial et mondialisation</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. 1991 : un monde nouveau ?</h3>\n<p>La fin de la guerre froide (chute du mur 1989, dissolution de l'URSS <b>1991</b>) fait espérer un « nouvel ordre mondial » pacifique (les accords de Maastricht créent l'<b>Union européenne</b> la même année). Mais de nouveaux désordres apparaissent :</p>\n<ul>\n<li><b>guerres civiles et ethniques</b> : Yougoslavie (1991-1995, puis Kosovo 1999 : Srebrenica, génocide bosniaque), Rwanda (1994 : génocide des Tutsi) ;</li>\n<li><b>guerres du Golfe</b> : l'Irak de Saddam Hussein envahit le Koweït (1990) ; coalition internationale et guerre du Golfe (1991), sous mandat de l'ONU ; guerre d'Afghanistan (2001) après les attentats du <b>11 septembre 2001</b> ; guerre d'Irak (2003, sans mandat ONU) ;</li>\n<li>l'<b>ONU</b>, sans la paralysie de la guerre froide, intervient davantage (peacekeeping) — mais ses moyens restent limités ;</li>\n<li>de nouvelles <b>puissances</b> émergent : Chine (ouverture économique), Inde, Brésil, Russie post-soviétique : le monde devient multipolaire et les tensions se déplacent (Ukraine, Moyen-Orient, mer de Chine méridionale).</li>\n</ul>\n\n<h3>2. La mondialisation : un monde interconnecté</h3>\n<p>Depuis 1990, la <b>mondialisation</b> — mise en relation de toutes les parties du monde (échanges, flux, réseaux) — s'accélère :</p>\n<ul>\n<li><b>flux commerciaux</b> : le commerce mondial explose (OMC, fondée en 1995) ; les multinationales organisent la production à l'échelle planétaire ;</li>\n<li><b>flux financiers</b> : capitaux circulant en continu ; mais crises mondiales (Asie 1997, <b>crise financière de 2008</b>, Covid-2020) ;</li>\n<li><b>révolution numérique</b> : Internet (web public dans les années 1990), smartphones, réseaux sociaux : la communication et l'économie se transforment en profondeur ;</li>\n<li><b>flux humains</b> : tourisme de masse, migrations (travail, études, réfugiés : plus de 100 millions de personnes déplacées au début des années 2020) ;</li>\n<li><b>défi climatique</b> : réchauffement climatique (GIEC, accord de Paris 2015) : un enjeu global qui impose des réponses mondiales — difficile en monde multipolaire.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"20\" y1=\"64\" x2=\"420\" y2=\"64\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"420,64 410,59 410,69\" fill=\"#4f46e5\"/><line x1=\"34.0\" y1=\"64\" x2=\"34.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"34.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Fin de l’URSS, guerre du Golfe</text><text x=\"34.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1991</text><line x1=\"127.0\" y1=\"64\" x2=\"127.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"127.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"127.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1993</text><text x=\"127.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Maastricht : UE</text><line x1=\"220.0\" y1=\"64\" x2=\"220.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"220.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"220.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">11 septembre</text><text x=\"220.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">2001</text><line x1=\"313.0\" y1=\"64\" x2=\"313.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"313.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"313.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">2008</text><text x=\"313.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Crise financière</text><line x1=\"406.0\" y1=\"64\" x2=\"406.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"406.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"406.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Accord de Paris</text><text x=\"406.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">2015</text></svg><span class=\"fig-cap\">Le monde depuis 1990 : espoir d’un nouvel ordre, puis crises (11 septembre, 2008) et défis globaux (climat, migrations).</span></div><h3>3. La France et l'Europe dans le monde actuel</h3>\n<ul>\n<li><b>Europe unie</b> : Maastricht (1992-93) puis euro (2002) : l'UE devient un pôle majeur ; mais crises (euroscepticisme, Brexit 2016-2020) ;</li>\n<li><b>France</b> : puissance moyenne, membre permanent du Conseil de sécurité, dissuasion nucléaire, présence mondiale (outre-mer, francophonie) ;</li>\n<li><b>défis actuels</b> : terrorisme (2015), pandémie (2020), guerre en Ukraine (2014, puis 2022 : retour de la guerre en Europe), intelligence artificielle : le monde reste instable malgré la mondialisation.</li>\n</ul>\n<div class=\"tip\"><b>Fil conducteur du chapitre :</b> après 1991, on passe d'un monde <b>bipolaire</b> à un monde <b>multipolaire</b> et <b>globalisé</b> ; les conflits ne disparaissent pas, ils changent de forme (guerres civiles, terrorisme, guerres hybrides, cybersécurité) ; les grands défis (climat, santé, numérique) sont mondiaux — d'où l'importance des organisations internationales (ONU, OMC, GIEC).</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — définir la mondialisation avec des exemples de flux</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> À partir d'exemples concrets, montrez que la mondialisation met en relation toutes les parties du monde.</div><div class=\"etu\"><b>Étape 1 — Les types de flux</b> : marchandises (un smartphone conçu en Californie, assemblé en Asie, vendu en Europe), capitaux (bourses connectées), informations (réseaux sociaux), personnes (tourisme, migrations).</div><div class=\"etu\"><b>Étape 2 — Les acteurs</b> : États (accords, OMC), entreprises (multinationales), organisations internationales (ONU), individus (consommateurs, migrants).</div><div class=\"etu\"><b>Étape 3 — Les inégalités</b> : la mondialisation enrichit et intègre (émergence de la Chine, des NPIA) mais laisse des marges (pays les moins avancés) et creuse les inégalités internes : les flux ne profitent pas également à tous.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : un monde « global » ne veut pas dire un monde égal ni pacifique : les crises de 2008 et 2020 montrent l'interdépendance — force (coopération) et fragilité (contagion).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>1991 n'inaugure pas la paix mondiale : Yougoslavie et Rwanda suivent presque immédiatement ; « nouvel ordre mondial » est une expression à relativiser.</li>\n<li>Mondialisation ≠ uniformisation : le monde reste multipolaire et inégal ; des cultures et puissances diverses subsistent.</li>\n<li>ONU fondée en <b>1945</b> ; OMC en <b>1995</b> (GATT avant) — ne pas confondre.</li>\n<li>Le 11 septembre 2001 ouvre la guerre d'Afghanistan ; la guerre d'Irak (2003) est <b>sans</b> mandat ONU : à distinguer.</li>\n<li>L'euro circule à partir de <b>2002</b> ; Maastricht est signé en 1992 (en vigueur 1993).</li>\n</ul>\n</div>"

    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
}
function pdfEnc(s){

    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }

function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }

function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';

      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }

}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'li') segs = [{ t: '- ', b: bold || false }].concat(segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;
  function walk(n){
    for (var c = n.firstChild; c; c = c.nextSibling){
      if (c.nodeType === 3){
        var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');

        var g = c.tagName;

        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }

function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];

    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [];
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) words.push({ br: true });
        p.split(' ').forEach(function(w){ if (w !== '') words.push({ w: w, b: s.b }); });

      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      if (wd.sp) { continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();

function pdfDownload(pdfStr, filename){

  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';

    var cls = qa === 0 ? '' : (isOk ? ' ok' : ' mid');
    var sym = qa === 0 ? '⬜' : (isOk ? '✅' : '🟡');
    var tip = t + ' — ' + qa + '/' + n + ' question' + (n > 1 ? 's' : '') + ' répondues' + (qa ? ' (' + Math.round(100 * qo / qa) + ' % de réussite)' : '');
    h += '<button class="pg-dot' + cls + '" title="' + tip.replace(/"/g, '&quot;') + '" onclick="pgChap(\'' + t.replace(/'/g, "\\'") + '\')">' + sym + ' ' + cm.titre + '</button>';
  });
  h += '</div>';
  el.style.display = 'block';
  el.innerHTML = h;
}

function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  pgSave(state.qs[state.idx], i === state.qs[state.idx].a);
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme d&#39;histoire</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p><div style="margin:12px 0 0"><input type="text" id="prog-search" oninput="progSearchList(this.value)" placeholder="🔎 Rechercher dans les cours..." style="width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.9rem;font-family:inherit;outline:none"></div><div id="prog-search-results"></div>' + h + '</section>';
})();
// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « » ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
pgResume();
</script>
