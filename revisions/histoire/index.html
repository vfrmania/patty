<script>
var PROGRAMME = [{"n": "Antiquité et Moyen Âge","ch": [{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident","id": "antiquite"},{"t": "Le Moyen Âge : féodalité, Église et croisades","id": "moyen-age"}]},
{"n": "Époque moderne (XVIe-XVIIIe)","ch": [{"t": "La Renaissance : humanisme et réformes religieuses","id": "renaissance"},{"t": "L'absolutisme royal et les Lumières","id": "absolutisme"},{"t": "La Révolution française : 1789-1799","id": "revolution"},{"t": "Napoléon Bonaparte et l'Empire","id": "empire"}]},
{"n": "XIXe siècle","ch": [{"t": "La révolution industrielle et la société du XIXe siècle","id": "industrialisation"},{"t": "Colonisation et empires coloniaux (XIXe-XXe siècles)","id": "colonisation"}]},
{"n": "XXe-XXIe siècles","ch": [{"t": "Les deux guerres mondiales (1914-1945)","id": "guerres-mondiales"},{"t": "La guerre froide : un monde bipolaire (1947-1991)","id": "guerre-froide"},{"t": "Le monde depuis 1990 : un nouvel ordre mondial ?","id": "monde-1990"}]}];
var COURS_META = [
 {
  "id": "antiquite",
  "theme": "L\'Antiquité : Grèce, Rome et la naissance de l\'Occident (Collège)",
  "niveau": "Collège",
  "titre": "L\'Antiquité : Grèce, Rome et la naissance de l\'Occident",
  "cours": "<div class=\"cours-head\"><h2>L\'Antiquité : Grèce, Rome et la naissance de l\'Occident</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. La Grèce des cités : un monde fragmenté et inventif</h3>\n<div class=\"tip\">Contrairement à l\'Égypte ou à la Perde, la Grèce antique n\'est <b>jamais unifiée</b> : elle est composée de centaines de <b>cités</b> (en grec <i>polis</i>), comme Athènes, Sparte, Corinthe ou Thèbes. Chaque cité possède son territoire (souvent une ville et ses campagnes), ses lois, son armée, ses monnaies et ses dieux protecteurs. Ce morcellement s\'explique par la géographie : des montagnes et des mers qui isolent les communautés. Mais c\'est justement cette petite échelle qui rend possible une invention politique majeure : <b>la citoyenneté</b>, c\'est-à-dire le fait que des habitants ordinaires participent directement à la vie politique.</div>\n<div class=\"tip\">Au VIIIe siècle av. J.-C., les Grecs essaiment autour de la Méditerranée et de la mer Noire en fondant des <b>colonies</b> (Massalia, future Marseille, vers 600 av. J.-C.). Cette expansion diffuse partout un fonds culturel commun : la langue grecque, les dieux de l\'Olympe (Zeus, Athéna, Apollon...), les épopées d\'Homère (<i>Iliade</i> et <i>Odyssée</i>) et, à partir de 776 av. J.-C., les <b>jeux olympiques</b>, organisés tous les quatre ans à Olympie en l\'honneur de Zeus : pendant les Jeux, les guerres entre cités s\'interrompent (trêve sacrée). Les Jeux montrent que les Grecs se sentent appartenir à une même civilisation tout en restant politiquement divisés.</div>\n<h3>2. Athènes : l\'invention de la démocratie (Ve siècle av. J.-C.)</h3>\n<div class=\"tip\">Le mot <b>démocratie</b> vient du grec <i>dêmos</i> (le peuple) et <i>kratos</i> (le pouvoir) : « le pouvoir au peuple ». À Athènes, cette idée se met en place par étapes : les réformes de <b>Solon</b> (début VIe siècle) puis de <b>Clisthène</b> (508-507 av. J.-C.), souvent considéré comme le père de la démocratie, répartissent les citoyens en groupes mixtes qui brisent l\'emprise des grandes familles. Au Ve siècle, sous <b>Périclès</b> (vers 443-429 av. J.-C.), la démocratie atteint son apogée.</div>\n<div class=\"tip\"><b>Comment fonctionne cette démocratie ?</b> C\'est une <b>démocratie directe</b> : les citoyens ne délèguent pas leur pouvoir à des députés, ils votent eux-mêmes. L\'assemblée souveraine, l\'<b>Ecclésie</b>, se réunit environ 40 fois par an sur la colline de la Pnyx : tout citoyen présent peut prendre la parole (<i>iségoria</i>) et voter à main levée les lois, la guerre ou la paix. La <b>Boulè</b>, conseil de 500 citoyens tirés au sort, prépare les décisions. La plupart des charges sont attribuées par <b>tirage au sort</b>, considéré comme plus démocratique que l\'élection ; certaines sont indemnifiées (misthos), ce qui permet aux plus pauvres de participer. Les stratèges (généraux, comme Périclès) sont élus et rééligibles. Les tribunaux, comme celui de l\'Héliée, comptent des centaines de jurés tirés au sort.</div>\n<div class=\"warn\"><b>Mais qui est citoyen ?</b> Une minorité ! Pour être citoyen athénien, il faut être un <b>homme</b>, <b>libre</b>, <b>adulte</b> (plus de 18 ans) et né de <b>père et mère athéniens</b> (loi de Périclès, 451 av. J.-C.). Sur environ 250 000 à 300 000 habitants d\'Athènes et de sa région (l\'Attique), il n\'y a guère plus de 40 000 à 60 000 citoyens. Sont exclus : les <b>femmes</b> (environ la moitié de la population, sans droits politiques), les <b>esclaves</b> (très nombreux, sans aucun droit), et les <b>métèques</b>, étrangers libres installés à Athènes (comme le philosophe Aristote), qui paient des taxes mais ne votent pas. La démocratie athénienne est donc <b>directe mais très restreinte</b> : c\'est LE piège classique du brevet.</div>\n<div class=\"tip\"><b>La culture athénienne du Ve siècle</b> est inséparable de la vie civique : le <b>théâtre</b> (tragédies d\'Eschyle, Sophocle et Euripide, comédies d\'Aristophane) est joué lors de fêtes en l\'honneur de Dionysos devant toute la cité ; la <b>philosophie</b> naît avec Socrate, qui questionne les Athéniens sur la justice et la vertu, puis Platon (fondateur de l\'Académie) et Aristote. Périclès fait construire sur l\'Acropole le <b>Parthénon</b> (temple d\'Athéna, achevé vers 432 av. J.-C.), joyau de l\'architecture classique avec ses colonnes de marbre et sa statue colossale d\'Athéna Parthénos sculptée par Phidias. Les guerres médiques (492-479 av. J.-C.), où les cités grecques battent l\'immense Empire perse à Marathon (490) puis à Salamine (480, victoire navale), puis Platées (479), nourrissent l\'orgueil civique athénien et l\'âge d\'or de la cité.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — décrypter le Parthénon, un message politique en marbre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrivez le Parthénon et expliquez ce que ce temple nous apprend sur Athènes vers 440 av. J.-C.</div><div class=\"etu\"><b>Étape 1 — Décrire</b> : temple en marbre, style classique (colonnes doriques), 8 colonnes en façade, frise sculptée de 160 mètres, construit sur l\'Acropole, dominating la ville.</div><div class=\"etu\"><b>Étape 2 — Contextualiser</b> : commandé par Périclès après les guerres médiques, financé en partie par le trésor de la ligue de Délos (alliance de cités sous direction athénienne) : Athènes se l\'approprie pour affirmer sa puissance.</div><div class=\"etu\"><b>Étape 3 — Expliquer</b> : la frise représente la grande Panathénées, fête où la cité offre un péplos à sa protectrice Athéna. Le message est double : la piété de la cité envers sa déesse et l\'orgueil d\'une démocratie qui se montre la plus brillante du monde grec. <b>Réflexe méthode</b> : décrire, dater, contextualiser, puis expliquer le message.</div></div></details>\n<h3>3. Rome : de la République à l\'Empire</h3>\n<div class=\"tip\">Selon la légende, <b>Rome</b> est fondée en <b>753 av. J.-C.</b> par Romulus. Vers 509 av. J.-C., les Romains chassent leurs rois (étrusques) et instaurate la <b>République</b>, mot latin qui signifie « chose publique » (<i>res publica</i>) : le pouvoir n\'appartient plus à un roi mais à la communauté des citoyens, représentée par le <b>Sénat</b> (assemblée d\'environ 300 anciens magistrats, l\'organe le plus puissant) et par des magistrats élus chaque année, les deux <b>consuls</b>, qui dirigent la cité et commandent les armées. Devant la contestation des plébéiens, la République se dote de lois écrites, les <b>Douze Tables</b> (vers 450 av. J.-C.), et crée des <b>tribuns de la plèbe</b>, magistrats chargés de défendre le peuple et dotés d\'un droit de veto. Rome invente ainsi une culture politique dont le vocabulaire nous est resté : consul, sénateur, dictateur, veto, censure.</div>\n<div class=\"tip\">Aux IVe-IIe siècles av. J.-C., Rome conquiert d\'abord l\'Italie, puis la Méditerranée. Les trois <b>guerres puniques</b> (264-146) contre Carthage — dont la deuxième, avec l\'épopée d\'<b>Hannibal</b> traversant les Alpes avec ses éléphants (218) et la victoire romaine de Zama (202) — font de Rome la maîtresse de l\'Occident ; des victoires contre les royaumes hellénistiques font d\'elle celle de l\'Orient. Mais la République s\'épuise : conquêtes gigantesques, esclaves par millions, enrichissement des élites, misère des paysans, guerres civiles (Sylla, puis César contre Pompée). <b>Jules César</b>, général vainqueur de la Gaule (58-50 av. J.-C.), se fait nommer dictateur à vie et est assassiné aux ides de mars (15 mars) <b>44 av. J.-C.</b> par des sénateurs attachés à la République.</div>\n<div class=\"tip\">Son héritier adoptif <b>Octave</b> sort vainqueur des guerres civiles (victoire d\'Actium, 31 av. J.-C.). En <b>27 av. J.-C.</b>, il prend le nom d\'<b>Auguste</b> et instaure le <b>Principat</b> : officiellement, la République continue d\'exister (Sénat, magistrats, élections), mais en réalité tout le pouvoir est concentré dans les mains d\'un seul homme, appelé <b>empereur</b>. Commence deux siècles de <b>Pax Romana</b> (paix romaine) : l\'Empire, qui s\'étend de la Bretagne à l\'Égypte, de l\'Espagne à la Syrie (environ 60 à 70 millions d\'habitants), connaît une prospérité fondée sur la sécurité des routes et des mers, le commerce et l\'urbanisation. Les villes reçoivent des <b>aqueducs</b> (eau courante), des thermes, des amphithéâtres (le Colisée à Rome, inauguré en 80), des forums, des ponts et des voies — environ 80 000 km de routes pavées qui relient les provinces et permettent de déplacer légions, courriers et marchandises : « tous les chemins mènent à Rome ».</div>\n<div class=\"tip\"><b>La citoyenneté romaine</b> est la grande force de l\'Empire : d\'abord réservée aux habitants de Rome, elle s\'étend progressivement à toute l\'Italie (guerre sociale, 90-88 av. J.-C.), puis aux élites des provinces. En <b>212</b>, l\'<b>édit de Caracalla</b> accorde la citoyenneté à <b>tous les hommes libres</b> de l\'Empire : une intégration remarquable pour l\'époque, même si les femmes restent mineures juridiquement et les esclaves hors du droit civil. Le <b>droit romain</b> (contrats, propriété, procès équitables, présomption d\'innocence) devient un modèle que l\'Europe utilise encore aujourd\'hui. La <b>romanisation</b> désigne cette diffusion simultanée de la langue latine, du droit, de l\'urbanisme et des modes de vie romains : les peuples conquis adoptent peu à peu la culture du vainqueur sans y être forcés.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — une borne milliaire, document type brevet</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une borne milliaire de Gaule indique « à Lyon, 20 milles ». Que nous apprend ce document sur l\'Empire romain ?</div><div class=\"etu\"><b>Étape 1 — Identifier</b> : une borne milliaire est une pierre dressée au bord des voies romaines, indiquant les distances vers les grandes villes ; elle porte souvent le nom de l\'empereur qui a fait construire ou réparer la route.</div><div class=\"etu\"><b>Étape 2 — Expliquer la fonction</b> : les routes servent au courrier impérial (cursus publicus), au déplacement rapide des légions et au commerce ; les bornes prouvent le souci d\'organisation et de contrôle du territoire.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : un objet modeste comme une borne témoigne de la puissance de l\'État romain : administration, sécurité, unité de l\'Empire. <b>Réflexe méthode</b> : pour un document, toujours donner sa nature, sa date, son auteur, son message, puis le relier au contexte.</div></div></details>\n<h3>4. La christianisation et la chute de l\'Empire d\'Occident</h3>\n<div class=\"tip\">Au Ier siècle, une nouvelle religion naît en Judée, province romaine : le <b>christianisme</b>, fondé sur l\'enseignement de <b>Jésus de Nazareth</b>, crucifié vers 30, et diffusé par les apôtres, notamment Paul. Longtemps persécutée, cette religion gagne l\'Empire malgré les persécutions (Néron en 64, Dioclétien vers 303). En <b>313</b>, l\'<b>édit de Milan</b> (empereur Constantin) accorde la liberté de culte ; en <b>380</b>, l\'empereur Théodose en fait la <b>religion officielle de l\'Empire</b> (édit de Thessalonique) : l\'Église se structure (évêques, diocèses) et devient une puissance spirituelle qui va durer plus que l\'Empire lui-même.</div>\n<div class=\"tip\">À partir du IIIe siècle, l\'Empire traverse une grave crise : invasions gothiques, inflation, hausse des impôts, guerres civiles. Pour mieux le défendre, l\'Empire est partagé : en 395, la division devient définitive entre l\'<b>Empire d\'Occident</b> (capitale Ravenne puis Rome) et l\'<b>Empire d\'Orient</b> (capitale Constantinople, l\'ancienne Byzance), qui survivra jusqu\'en <b>1453</b>. L\'Occident s\'affaiblit : les peuples dits « barbares » — Goths, Vandales, Burgondes, Francs — franchissent le Rhin et le Danube et s\'installent comme fédérés ou conquérants. En <b>476</b>, le chef Odoacre renvoie les insignes impériaux à Constantinople : il n\'y a plus d\'empereur en Occident. La date est conventionnelle — un événement administratif, pas une bataille — mais elle sert aux historiens pour marquer la fin de l\'Antiquité et le début du Moyen Âge.</div>\n<div class=\"tip\"><b>Que reste-t-il de Rome ?</b> Un héritage colossal : les langues romanes (français, espagnol, italien, portugais, roumain) issues du latin ; le <b>droit romain</b>, base des droits européens ; l\'architecture et l\'urbanisme ; l\'alphabet latin ; et surtout le <b>christianisme</b>. L\'Église, avec ses évêques et ses moines copiant les textes anciens, devient la gardienne de la culture écrite en Occident. C\'est pourquoi on parle de la « naissance de l\'Occident » : la civilisation européenne se construit sur ce socle gréco-romain christianisé.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — 476 : une chute qui ne fit presque aucun bruit</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi parle-t-on de « chute » de l\'Empire romain d\'Occident en 476 alors que presque personne à l\'époque ne s\'en est aperçu ?</div><div class=\"etu\"><b>Étape 1 — Les faits</b> : en 476, Odoacre, chef d\'armée barbare au service de Rome, dépose Romulus Augustule, jeune empereur d\'Occident, et renvoie les insignes impériaux à Constantinople : c\'est un acte administratif, sans bataille ni sac de ville.</div><div class=\"etu\"><b>Étape 2 — Un processus long</b> : l\'Empire d\'Occident se délitait depuis 150 ans — crises économiques, armée composée de Barbares, territoire mangé par les royaumes gothiques et vandales. La « chute » est donc un aboutissement plus qu\'un événement.</div><div class=\"etu\"><b>Étape 3 — Le choix des historiens</b> : 476 est une convention commode de périodisation. Cela enseigne une méthode essentielle : les grandes dates sont souvent des choix d\'historiens pour découper le temps, pas des coups de tonnerre. <b>Réflexe méthode</b> : distinguer l\'événement de sa construction historique.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b> la démocratie athénienne est directe mais très restreinte (femmes, esclaves, métèques exclus) ; ne pas confondre République romaine (509-27 av. J.-C.) et Empire (à partir d\'Auguste, 27 av. J.-C.) ; 476 marque la fin de l\'Empire d\'Occident SEULEMENT (l\'Empire d\'Orient dure jusqu\'en 1453) ; les « Barbares » ne détruisent pas tout : ils s\'installent, se convertissent et se romanisent partiellement.</div>"

  "cours": "<div class=\"cours-head\"><h2>Le Moyen Âge : féodalité, Église et croisades</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. Après Rome : les royaumes barbares et l\'Empire carolingien</h3>\n<div class=\"tip\">Après 476, l\'ancien Empire romain d\'Occident se partage en <b>royaumes barbares</b> : Ostrogoths en Italie, Wisigoths en Espagne, Burgondes et Francs en Gaule. Ces peuples, longtemps appelés « Barbares » par les Romains, ne détruisent pas tout : ils adoptent le latin vulgaire (qui se transforme peu à peu en langues romanes), se convertissent au catholicisme et conservent une partie de l\'administration romaine. En 481, <b>Clovis</b> devient roi des Francs ; il bat le dernier représentant de Rome en Gaule (bataille de Soissons, 486) et se <b>convertit au christianisme</b> vers 496 (baptême à Reims, selon la tradition) : alliance décisive entre le pouvoir royal et l\'Église, qui légitimera pendant quinze siècles les rois de France. La dynastie mérovingienne s\'affaiblit ensuite (« rois fainéants »).</div>\n<div class=\"tip\">Au VIIIe siècle, une nouvelle famille prend le pouvoir : les <b>Carolingiens</b>. <b>Charles Martel</b> arrête les Arabes à Poitiers (732), son fils <b>Pépin le Bref</b> se fait élire roi (751) avec l\'appui du pape. Son fils <b>Charlemagne</b> (768-814) construit un immense empire de la Saxe à l\'Espagne, de l\'Italie à la Germanie. Le 25 décembre <b>800</b>, il est <b>couronné empereur à Rome</b> par le pape Léon III : renaissance de l\'idée impériale en Occident. Charlemagne organise son territoire en <b>comtés</b> (dirigés par des comtes), contrôle ses agents par les <b>missi dominici</b> (envoyés itinérants) et fait renaître la culture dans les écoles de son palais (dite « renaissance carolingienne ») grâce à des lettrés comme Alcuin. Mais l\'empire est trop vaste : partagé en 843 (traité de Verdun) entre les petits-fils de Charlemagne, il se disloque face aux nouvelles invasions (Vikings au nord, Magyars à l\'est, Sarrasins au sud).</div>\n<div class=\"tip\"><b>Pourquoi cet empire s\'effondre-t-il ?</b> Faiblesse des successeurs, coût des guerres, et surtout la logique du gouvernement personnel : l\'empire tient par la présence physique de l\'empereur et par les liens de fidélité, pas par une administration solide. Après la mort de Charles le Gros (888), l\'empire carolingien n\'est plus qu\'un souvenir — mais il laisse une idée forte : celle d\'un pouvoir unificateur chrétien en Occident, que l\'Église gardera en réserve.</div>\n<h3>2. La société féodale : liens d\'homme à homme</h3>\n<div class=\"tip\">Entre le IXe et le XIIe siècle, faute d\'État central, la protection devient une affaire privée : naît la <b>féodalité</b>, système d\'obligations entre hommes. Sa scène est le <b>fief</b> : terre (ou revenu, comme un péage ou une église) qu\'un <b>vassal</b> reçoit d\'un <b>seigneur</b> en échange de sa fidélité et de son service militaire. La cérémonie de l\'<b>hommage</b> — le vassal, à genoux, met ses mains jointes dans celles du seigneur — scelle le contrat, renforcé par le serment de fidélité et par des obligations concrètes : aide militaire (ost), conseil (cour), rançon si le seigneur est capturé. Le seigneur, en échange, doit protection et entretien. La formule des vassaux : « je vous ferai fidèle hommage, je vous aiderai en conseil et en ost ».</div>\n<div class=\"tip\"><b>Attention : l\'Empire n\'est pas la pyramide parfaite des manuels.</b> La hiérarchie vassalique n\'est pas une pyramide nette du roi au paysan : un même homme peut être vassal de plusieurs seigneurs (fidélités multiples, sources de conflits) ; les liens personnels comptent plus que le rang. À la base de la société, la majorité de la population vit dans les <b>seigneuries</b> : domaines agricoles où les paysans, libres ou <b>serfs</b> (attachés à la terre), cultivent les terres du seigneur et lui doivent redevances (corvées, cens) et banalités (usage du four, du moulin). La société est divisée en trois <b>ordres</b> selon le schéma de l\'époque : ceux qui prient (<b>clercs</b>), ceux qui combattent (<b>nobles</b>), ceux qui travaillent (<b>paysans</b>) — chacun à sa place dans un ordre voulu par Dieu.</div>\n<h3>3. L\'Église, pilier de l\'Occident médiéval</h3>\n<div class=\"tip\">L\'Église catholique structure toute la vie : elle cadre le <b>calendrier</b> (fêtes religieuses qui scandent l\'année), les <b>sacrements</b> (baptême, mariage, extrême-onction) qui marquent la vie de chacun, et la <b>culture écrite</b> : les moines copistes des monastères (comme Cluny fondée en 910, ou Cîteaux en 1098) recopient et sauvent les textes antiques. La chrétienté latine reconnaît le <b>pape</b> (évêque de Rome) comme chef spirituel ; à ses côtés, les <b>évêques</b> dirigent les diocèses, les curés les paroisses. L\'Église est aussi une puissance temporelle : elle possède parfois un tiers des terres, perçoit la <b>dîme</b> (impôt religieux) et fait respecter la <b>paix de Dieu</b> — mouvement lancé à la fin du Xe siècle pour protéger clercs, paysans et marchands de la violence des seigneurs, en menaçant les chevaliers pillards d\'excommunication. Vers l\'an Mil, l\'Occident se transforme : <b>essor démographique</b>, défrichements de forêts (les moines de Cîteaux en tête), <b>renouveau des villes</b> et du commerce, premières foires (Champagne), croisades économiques et techniques (charrue lourde, moulin à eau).</div>\n<h3>4. Les croisades : la chrétienté en armes</h3>\n<div class=\"tip\">En 1095, au concile de Clermont, le pape <b>Urbain II</b> appelle les chevaliers d\'Occident à libérer Jérusalem et le tombeau du Christ, tombés aux mains des Turcs. C\'est le lancement de la <b>première croisade</b> : le cri de « Dieu le veut ! » rassemble des dizaines de milliers de combattants (et une « croisade des pauvres » qui périt en Anatolie). Après quatre ans de marche, les croisés prennent <b>Jérusalem le 15 juillet 1099</b> et fondent les États latins d\'Orient (royaume de Jérusalem, comtés d\'Édesse et de Tripoli, principauté d\'Antioche), défendus par des ordres religieux-militaires comme les <b>templiers</b> et les <b>hospitaliers</b>.</div>\n<div class=\"tip\">Les croisades suivantes sont des échecs : la deuxième (1147-1149) après la chute d\'Édesse, la troisième (1189-1192) — avec Richard Cœur de Lion et Philippe Auguste — ne reprend pas Jérusalem, prise par <b>Saladin</b> en 1187 ; la quatrième (1202-1204) dévie vers le sac de <b>Constantinople</b> (1204), la ville chrétienne !, affaiblissant durablement Byzance. Les États latins tombent un à un ; <b>Saint-Jean-d\'Acre</b>, dernière place, en 1291. Que retire l\'Occident de deux siècles de croisades ? Des contacts renforcés avec l\'Orient méditerranéen (épices, soieries, papier, chiffres arabes), des techniques de gouvernement (taxation, écriture administrative), le prestige de la papauté à son sommet — mais aussi l\'habitude de la guerre sainte contre les « infidèles », qui servira plus tard à justifier d\'autres violences.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la cérémonie de l\'hommage, document fondateur de la féodalité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un texte du XIe siècle décrit un vassal mettant ses mains dans celles de son seigneur. Que révèle ce rituel sur la société féodale ?</div><div class=\"etu\"><b>Étape 1 — Décrire le geste</b> : l\'hommage est une cérémonie publique et physique — mains jointes placées entre les mains du seigneur, parfois un baiser, serment sur les reliques. Le corps parle : le geste matérialise la soumission et la protection.</div><div class=\"etu\"><b>Étape 2 — Expliquer le contexte</b> : après l\'effondrement carolingien, aucun État ne protège les hommes. Le lien vassalique est un contrat privé de sécurité réciproque qui remplace l\'État : protection contre fidélité.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : la société féodale est une société de liens personnels plus que d\'institutions. <b>Réflexe méthode</b> : un rituel est un document comme un autre — le décrire précisément (gestes, mots, acteurs) permet de reconstituer la logique sociale d\'une époque.</div></div></details>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi partir en croisade ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Quelles motivations poussent des milliers d\'Occidentaux à partir en Terre sainte à partir de 1095 ?</div><div class=\"etu\"><b>Étape 1 — Les motifs religieux</b> : l\'indulgence (pardon des péchés promis aux croisés), le pèlerinage vers les lieux saints, la protection des chrétiens d\'Orient : le salut de l\'âme est en jeu.</div><div class=\"etu\"><b>Étape 2 — Les motifs sociaux et économiques</b> : pour les cadets de la noblesse sans terre, la croisade offre aventure, butin et fiefs en Orient ; pour les villes italiennes (Venise, Gênes, Pise), des comptoirs commerciaux et le transport des pèlerins.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : croisade = croisement du religieux, du social et de l\'économique. <b>Réflexe méthode</b> : toujours chercher la multiplicité des causes d\'un grand mouvement collectif.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b> la féodalité n\'est pas une pyramide nette : les fidélités se croisent ; Clovis se convertit au christianisme catholique (pas arien comme d\'autres Barbares) — d\'où l\'alliance royale-Église ; les croisades visent d\'abord Jérusalem, mais la 4e s\'attaque à Constantinople, ville chrétienne ; « féodalité » (liens vassaliques) ≠ « seigneurie » (rapports seigneur-paysans).</div>"

  "cours": "<div class=\"cours-head\"><h2>La Renaissance : humanisme et réformes religieuses</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. L\'humanisme : changer de regard sur l\'homme et le monde</h3>\n<div class=\"tip\">Au XVe siècle, des intellectuels italiens redécouvrent les textes antiques (Grecs et Latins) conservés à Constantinople et dans les monastères. Ce mouvement, appelé <b>humanisme</b>, met <b>l\'homme au centre</b> de la réflexion : pour les humanistes, l\'être humain n\'est pas seulement une créature pécheresse à préparer à l\'au-delà, il est capable de savoir, de créer et d\'améliorer sa condition. La méthode humaniste est rigoureuse : retour aux <b>textes sources</b> (ad fontes), dans leur langue originale (on apprend le grec et l\'hébreu), comparaison des manuscrits pour établir la version la plus fidèle, esprit critique envers les traditions. En 1516, <b>Érasme</b> publie une édition critique du Nouveau Testament en grec ; son cri d\'érudition, « je veux parler à tous », résume l\'idéal de diffusion du savoir.</div>\n<div class=\"tip\"><b>L\'imprimerie accélère tout</b> : vers <b>1450</b>, <b>Johannes Gutenberg</b> met au point en Mayence les caractères mobiles métalliques et la presse. Le premier livre imprimé, la <b>bible à 42 lignes</b>, sort vers 1455. En cinquante ans, l\'imprimerie gagne l\'Europe : on compte des milliers d\'ateliers et, avant 1500, environ 20 millions de livres (« incunables ») : la Bible de Luther (plus tard) se vendra à des centaines de milliers d\'exemplaires. Conséquences : les livres deviennent moins chers, les idées circulent vite et loin, la lecture se répand, l\'Église perd le monopole de l\'interprétation des textes sacrés — chacun peut désormais lire (ou entendre lire) la Bible dans sa langue. L\'imprimerie est l\'invention qui rend possibles à la fois la Renaissance et la Réforme.</div>\n<h3>2. La Renaissance artistique : l\'art au service de l\'homme</h3>\n<div class=\"tip\">En Italie (Florence, Rome, Venise), les artistes renouvellent le regard : inspiration antique, <b>perspective</b> à point de fuite (Brunelleschi, Alberti), étude anatomique du corps, <b>sfumato</b> de Léonard de Vinci, chaleur des couleurs vénitiennes. <b>Leonardo da Vinci</b> (1452-1519) — la Joconde, la Cène, carnets d\'ingénieur et d\'anatomiste — incarne l\'esprit universel de la Renaissance ; <b>Michel-Ange</b> (1475-1564) sculpte le David, peint le plafond de la chapelle Sixtine ; <b>Raphaël</b> (1483-1520) compose des VIERGES d\'une sérénité classique. Les <b>mécènes</b> financent cet art : les Médicis à Florence, les papes à Rome (Jules II fait reconstruire la basilique Saint-Pierre), les rois en France (François Ier fait venir Léonard et Primatice à Fontainebleau). Les guerres d\'Italie (depuis 1494) diffusent en France ce goût nouveau : châteaux de la Loire (Chambord, Chenonceau) mêlant défense médiévale et grâce italienne.</div>\n<div class=\"tip\">L\'art de la Renaissance n\'est pas seulement décoratif : il <b>montre</b> la nouvelle place de l\'homme. Le David de Michel-Ange (1501-1504) représente un géant calme et maître de lui, force de la République florentine ; les portraits (Titien, Holbein, Jean Clouet) donnent à des individus ordinaires la dignité avant réservée aux saints ; les sujets mythologiques (Botticelli, Vénus) côtoient les sujets religieux. Le monde devient objet de curiosité : cartes marines plus précises, cabinets de curiosités, débuts de l\'observation naturaliste — quelques décennies avant la « révolution scientifique » de Copernic et Galilée.</div>\n<h3>3. La Réforme : l\'Église brisée</h3>\n<div class=\"tip\">Au début du XVIe siècle, l\'Église catholique est critiquée : les humanistes dénoncent l\'ignorance de certains clercs, les fidèles s\'indignent de la vente des <b>indulgences</b> (le pardon des péchés contre argent, pour financer la basilique Saint-Pierre). En <b>1517</b>, le moine allemand <b>Martin Luther</b> publie ses <b>95 thèses</b> contre ce commerce : le salut, dit-il, vient de la <b>foi seule</b> (sola fide), non des œuvres ni des paiements ; seule l\'Écriture (sola scriptura) fait autorité, pas le pape ; chaque baptisé peut lire la Bible — Luther la traduit en allemand (1522-1534). Refusant de se rétracter, il est <b>excommunié en 1521</b> ; protégé par le prince de Saxe, il fonde une nouvelle Église, la <b>luthérienne</b>. À Genève, <b>Jean Calvin</b> organise dès 1541 une réforme plus rigoureuse (prédestination, discipline morale stricte) : le <b>calvinisme</b> gagne la France (les huguenots), l\'Écosse, les Pays-Bas et l\'Angleterre. En Angleterre, le roi <b>Henri VIII</b>, refusé par le pape sur son divorce, rompt en <b>1534</b> (Acte de suprématie) : l\'Église <b>anglicane</b>, dont le roi est le chef, naît d\'un conflit dynastique autant que religieux.</div>\n<div class=\"tip\"><b>Les conséquences politiques sont explosives</b> : l\'Empire se déchire (guerre des paysans allemands 1524-25, guerres de religion jusqu\'en 1555 : paix d\'Augsbourg — chaque prince choisit la religion de son territoire). En France, les guerres de religion (1562-1598) opposent catholiques et protestants : le massacre de la <b>Saint-Barthélemy</b> (24 août <b>1572</b>) fait des milliers de morts protestants à Paris. Elles ne s\'achèvent qu\'avec l\'<b>édit de Nantes</b> (<b>1598</b>) : <b>Henri IV</b> (ancien protestant converti au catholicisme — « Paris vaut bien une messe ») accorde aux protestants la liberté de culte et des places de sûreté : première reconnaissance légale d\'une minorité religieuse en Europe. Le pluralisme religieux, impensable un siècle plus tôt, devient une réalité politique.</div>\n<h3>4. La Contre-Réforme catholique</h3>\n<div class=\"tip\">Face à la Réforme, l\'Église catholique se réforme de l\'intérieur : le <b>concile de Trente</b> (1545-1563) redéfinit la doctrine (les œuvres ET la foi, les sept sacrements, la transsubstantiation), impose la formation des prêtres dans des <b>séminaires</b>, publie un <b>catéchisme</b> et une liste des livres interdits (<b>Index</b>), réaffirme l\'autorité du pape. De nouveaux ordres partent à la conquête des âmes : les <b>jésuites</b> (fondés par Ignace de Loyola, approuvés en 1540) éduquent les élites dans leurs collèges et partent en mission jusqu\'au Japon et au Paraguay ; Thérèse d\'Avila et Jean de la Croix réforment le Carmel. L\'art devient une arme : le <b>baroque</b> (Bernin, le Caravage, Rubens) émeut les sens pour ramener les fidèles — églises éblouissantes, scènes extatiques, contrastes dramatiques. À la fin du XVIe siècle, l\'Europe est religieusement coupée en deux : le Nord luthérien/calviniste et le Sud catholique — la France restant, elle, profondément déchirée.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — les 95 thèses de Luther, une affiche qui change l\'Europe</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi un texte universitaire de 1517 provoque-t-il la rupture de la chrétienté occidentale ?</div><div class=\"etu\"><b>Étape 1 — Le contenu</b> : Luther, professeur de théologie à Wittenberg, conteste la vente des indulgences : le pardon de Dieu ne s\'achète pas ; il vient de la foi. Il en appelle à un débat, comme le voulait l\'usage universitaire.</div><div class=\"etu\"><b>Étape 2 — La diffusion</b> : imprimées et traduites, les thèses circulent en quelques semaines dans toute l\'Allemagne : sans l\'imprimerie, l\'affiche serait restée locale. La technologie transforme une dispute de théologie en événement européen.</div><div class=\"etu\"><b>Étape 3 — La rupture</b> : Rome exige une rétractation ; Luther brûle la bulle papale (1520) et refuse de se soumettre devant l\'empereur à Worms (1521) : « ma conscience est captive de la Parole de Dieu ». L\'autorité religieuse se brise sur une question de principe. <b>Réflexe méthode</b> : pour comprendre un événement, articuler le contenu (les idées), le relais (l\'imprimé) et le contexte (les critiques antérieures de l\'Église).</div></div></details>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l\'atelier de Gutenberg, la révolution du livre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Qu\'est-ce qui, dans l\'invention de Gutenberg (vers 1450), change durablement la circulation des idées ?</div><div class=\"etu\"><b>Étape 1 — La technique</b> : caractères métalliques mobiles et interchangeables, encre grasse, presse à vis empruntée aux métiers du vin : la composition d\'une page devient rapide et réutilisable, quand un copiste mettait des mois pour un seul livre.</div><div class=\"etu\"><b>Étape 2 — Les effets immédiats</b> : chute du prix des livres, multiplication des titres, standardisation des textes (moins d\'erreurs de copie), essor des langues vernaculaires imprimées.</div><div class=\"etu\"><b>Étape 3 — Les effets de long terme</b> : alphabétisation, formation de l\'opinion publique, diffusion des Réformes — mais aussi censure (Index). <b>Réflexe méthode</b> : une invention technique n\'a d\'effet historique que reliée aux sociétés qui s\'en emparent.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b> Renaissance (culturelle, artistique) et Réforme (religieuse) sont liées mais distinctes — l\'imprimerie sert les deux ; Luther ne cherche pas d\'abord à fonder une nouvelle Église, il veut réformer la sienne ; ne pas confondre luthéranisme (Luther, Allemagne) et calvinisme (Genève, prédestination) ; l\'édit de Nantes (1598) accorde la liberté de culte aux protestants — il est révoqué... en 1685 par Louis XIV ; Saint-Barthélemy (1572) : catholiques massacrant des protestants, pas l\'inverse.</div>"

  "cours": "<div class=\"cours-head\"><h2>L\'absolutisme royal et les Lumières</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. Henri IV et Louis XIII : reconstruire et affermir le royaume</h3>\n<div class=\"tip\">À la mort d\'Henri IV (assassiné par Ravaillac en 1610), la France sort à peine des guerres de religion. Son fils <b>Louis XIII</b> (1610-1643), enfant à son accession, voit d\'abord le pouvoir aux mains de sa mère Marie de Médicis puis, à partir de 1624, du cardinal <b>Richelieu</b>, principal ministre pendant dix-huit ans. Richelieu poursuit un but clair : « rendre le roi absolu » — c\'est-à-dire renforcer l\'autorité de l\'État central contre tous les pouvoirs intermédiaires : il fait exécuter ou envoyer au bagne des grands seigneurs conspirateurs, assiège et rase les forteresses privées, réduit l\'autonomie des protestants après le siège de <b>La Rochelle</b> (1627-1628, paix d\'Alès 1629 : les huguenots perdent leurs places fortes mais gardent la liberté de culte), et étend partout la <b>police royale</b> : intendants, commissaires, impôts. Il fonde aussi l\'Académie française (1635) pour normer la langue. À l\'extérieur, la France de Richelieu entre dans la guerre de Trente Ans contre les Habsbourg : elle en sort victorieuse mais épuisée.</div>\n<div class=\"tip\">À la mort de Louis XIII, son fils n\'a que quatre ans : la régence d\'<b>Anne d\'Autriche</b> et de <b>Mazarin</b> (1643-1661) provoque une crise grave : la <b>Fronde</b> (1648-1653), révolte à la fois des parlements (qui refusent de nouveaux impôts), des grands seigneurs et du peuple parisien contre la hausse des impôts de la guerre. Le jeune Louis XIV en garde une leçon : les grands sont dangereux et Paris est turbulent — il décidera de « domestiquer » la noblesse et d\'installer la cour loin de la capitale. L\'expérience de la Fronde, vécue comme un traumatisme, est la clé de naissance de l\'absolutisme mature.</div>\n<h3>2. Louis XIV, roi absolu : le roi de droit divin</h3>\n<div class=\"tip\">À la mort de Mazarin (1661), <b>Louis XIV</b> (1643-1715) déclare qu\'il « gouvernera lui-même » : plus de principal ministre, le roi décide de tout, assisté de conseils et de secrétaires d\'État. L\'absolutisme repose sur une théorie : le <b>droit divin</b> — le roi tient son pouvoir de Dieu, non du peuple ; le couronnement, le sacre à Reims et l\'onction sainte le consacrent « lieutenant de Dieu sur Terre » ; nul ne peut donc légitimement le contester (Bossuet : « la personne des rois est sacrée »). En pratique, le roi concentre les pouvoirs : <b>législatif</b> (édits, ordonnances), <b>exécutif</b> (nomme et révoque les ministres et officiers), <b>judiciaire</b> (rend la justice « en son nom », dans ses parlements — des cours de justice, pas des assemblées) et même une mainmise sur l\'Église de France (gallicanisme). Contre les protestants, la <b>révocation de l\'édit de Nantes</b> (<b>1685</b>, édit de Fontainebleau) interdit le culte réformé : des centaines de milliers de huguenots s\'exilent, perdant la France des artisans et des capitaux.</div>\n<div class=\"tip\"><b>Comment tient-on la noblesse ?</b> Par la séduction autant que par la contrainte. En 1682, la cour s\'installe à <b>Versailles</b>, palais monumental aménagé à partir du petit château de chasse de Louis XIII (Le Vau puis Hardouin-Mansart pour l\'architecture, Le Nôtre pour les jardins, Le Brun puis Mignard pour les décors). La <b>galerie des Glaces</b> (357 miroirs) exalte les victoires du roi ; la <b>grand appartement</b> célèbre le Soleil. Louis XIV se choisit pour emblème le soleil (Apollon) : source de lumière et de vie, unique centre autour duquel tout tourne. La vie de cour est un théâtre permanent : le <b>lever du roi</b>, étiquette minutieuse où assister au réveil royal est un honneur convoité, les chasses, les fêtes (les Plaisirs de l\'île enchantée, 1664), les arts (Molière — malgré la querelle du Tartuffe —, Lully, Racine). Les grands, pensionnés et flattés, se ruinent en honneurs et perdent l\'habitude de la contestation : plus de Fronde. Versailles est une <b>machine politique</b> qui réussit : le roi, en costume de guerre ou en brocart, reste l\'unique centre de décision.</div>\n<div class=\"tip\"><b>L\'État s\'administre</b> : Colbert (ministre des finances jusqu\'en 1683) développe une véritable politique économique dirigiste — manufactures royales (tapisseries de Gobelins, soieries de Lyon), protection douanière, compagnies de commerce (Compagnie des Indes), codifications (ordonnances civile, pénale, commerciale, forestière). Louvois modernise l\'armée : uniformes, casernes, service structuré, École militaire plus tard. L\'âge classique rayonne : Académie des sciences (1666), Observatoire, Cassini et les cartes de France. Mais les guerres sans fin (Hollande 1672-1678, ligues d\'Augsbourg 1688-1697, succession d\'Espagne 1701-1713) et les dépenses de cour creusent le déficit ; les mauvaises récoltes des années 1690 (la « grande » famine de 1693-94 fait près d\'un million de morts) et l\'hiver de 1709 épuisent le royaume. À la mort de Louis XIV (1715), la France admire son roi et est exténuée — les deux faces de l\'absolutisme.</div>\n<h3>3. Les Lumières : la pensée qui prépare 1789</h3>\n<div class=\"tip\">Au XVIIIe siècle, un nouveau mouvement intellectuel, les <b>Lumières</b> (enlightenment, Aufklärung), reprend le flambeau humaniste avec une conviction : la <b>raison</b>, l\'expérience et la critique peuvent améliorer la société. Les armes : le livre, la <b>correspondance</b>, l\'<b>Encyclopédie</b> — vaste projet dirigé par <b>Diderot</b> et d\'Alembert (1751-1772, 28 volumes, environ 25 000 exemplaires diffusés, malgré la censure et le retrait du privilège) qui « rassemble les connaissances éparses » et les met à la portée de tous ; l\'<b>esprit critique</b> : Voltaire dénonce l\'infâme (le fanatisme religieux, l\'affaire Calas), Rousseau imagine un contrat fondé sur la volonté générale et dénonce l\'inégalité (Discours sur l\'origine de l\'inégalité, 1755 ; Du contrat social, 1762), Montesquieu théorise la <b>séparation des pouvoirs</b> (De l\'esprit des lois, 1748) ; les physiocrates et les économistes pensent la richesse ; les « parlements » et pamphlets contestent l\'arbitraire (affaire des refus de fiscalité).</div>\n<div class=\"tip\"><b>Où et comment ces idées circulent-elles ?</b> Dans les <b>salons</b> (celui de Madame Geoffrin, de Madame de Tencin), les cafés, les académies provinciales, les loges maçonniques, les journaux et par la mode de la <b>correspondance</b> européenne (Voltaire-Frédéric II, réseaux savants). L\'Encyclopédie et les œuvres des philosophes traversent les frontières, souvent imprimées en Hollande ou en Suisse pour échapper à la censure française. L\'idéal peut se résumer en trois exigences : <b>tolérance</b> religieuse, <b>liberté</b> politique (limitations du pouvoir), <b>égalité</b> devant la loi et l\'impôt. Ces idées pénètrent lentement toutes les couches lettrées : nobles libéraux, magistrats, avocats, médecins, marchands éclairés. Quand la crise financière de 1788-1789 force Louis XVI à convoquer les États généraux, c\'est le vocabulaire des Lumières qui exprime les revendications : les cahiers de doléances réclament une constitution, l\'égalité devant l\'impôt, la fin des privilèges. Les Lumières ne « causent » pas la Révolution, mais elles fournissent le programme et les mots.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — Versailles, une machine à domestiquer la noblesse</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le lever du roi à Versailles : pourquoi cette cérémonie quotidienne est-elle un instrument politique ?</div><div class=\"etu\"><b>Étape 1 — Décrire</b> : chaque matin, une hiérarchie précise de courtisans assiste à la toilette et à l\'habillage du roi ; servir le roi (lui tendre sa chemise, ses boucles) est un honneur réservé aux plus grands.</div><div class=\"etu\"><b>Étape 2 — Expliquer</b> : l\'étiquette transforme les grands seigneurs en solliciteurs ; en espérant pensions, charges et faveurs, ils vivent à la cour, sous l\'œil du roi, loin de leurs terres et de leurs châteaux forts. La dépense de cour ruine les velléités d\'indépendance.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : après la Fronde (1648-53), plus aucune révolte nobiliaire sérieuse : le cérémonial réussit là où la force seule aurait échoué. <b>Réflexe méthode</b> : les pratiques quotidiennes (étiquette, fêtes, images) sont des documents politiques à part entière.</div></div></details>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l\'Encyclopédie, un combat pour le savoir</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi la publication de l\'Encyclopédie (1751-1772) est-elle considérée comme un événement politique ?</div><div class=\"etu\"><b>Étape 1 — Le projet</b> : Diderot et d\'Alembert veulent rassembler et rendre accessibles toutes les connaissances — arts et métiers compris, jusque-là méprisés. Le sous-titre parle de « raison » : le savoir doit être universel et utile.</div><div class=\"etu\"><b>Étape 2 — L\'obstacle</b> : la censure royale et l\'Église interdisent momentanément l\'ouvrage (1752, 1759 : le privilège retiré) ; la suite paraît sous couvert et avec l\'appui discret de la favorite Mme de Pompadour et de hauts personnages.</div><div class=\"etu\"><b>Étape 3 — La portée</b> : l\'Encyclopédie diffuse l\'esprit critique : articles « Autorité politique », « Torture », « Fanatisme » ; elle forme une génération d\'esprits éclairés et montre que le savoir peut échapper aux autorités. <b>Réflexe méthode</b> : un livre est un acteur de l\'histoire quand on étudie qui l\'interdit, qui le diffuse et qui le lit.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b> « absolutisme » ne signifie pas « caprice » : c\'est une doctrine (droit divin) et une pratique administrative ; les parlements d\'Ancien Régime sont des cours de justice, pas des assemblées politiques ; Versailles est une réussite politique (noblesse domestiquée) autant qu\'un gouffre financier ; révocation de l\'édit de Nantes = 1685 (Louis XIV), édit de Nantes = 1598 (Henri IV) ; les Lumières inspirent le programme de 1789 mais la Révolution a des causes sociales et financières propres.</div>"

  "cours": "<div class=\"cours-head\"><h2>La Révolution française : 1789-1799</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. 1788-1789 : le royaume au bord de la faillite</h3>\n<div class=\"tip\">Pourquoi la France, royaume puissant, bascule-t-elle en 1789 ? D\'abord une <b>crise financière</b> : les guerres (dont le soutien à la Révolution américaine) ont creusé la dette ; la monarchie est en banqueroute virtuelle — la moitié du budget passe en remboursements. La <b>société d\'ordres</b> paraît injuste aux yeux éclairés : le clergé (premier ordre) et la noblesse (second) possèdent l\'essentiel des terres et sont <b>exemptés</b> de la taille, l\'impôt principal ; le tiers état (98 % de la nation) paie tout : taille, gabelle, dîme, corvées. Enfin la <b>crise économique</b> frappe : mauvaises récoltes (grêle de 1788, hiver terrible), prix du pain au plus haut, chômage urbain. La formule de Sieyès (janvier 1789) résume le sentiment : « Qu\'est-ce que le tiers état ? TOUT. Qu\'a-t-il été jusqu\'à présent ? RIEN. »</div>\n<div class=\"tip\">Louis XVI, à court d\'argent, doit convoquer les <b>États généraux</b> (assemblée des trois ordres, pas réunie depuis 1614) pour le 5 mai 1789. Les Français rédigent des <b>cahiers de doléances</b> : partout on demande une constitution, l\'égalité devant l\'impôt, la fin des privilèges — le vocabulaire des Lumières est partout. Mais dès le mois de mai, tout se bloque sur la question du <b>vote</b> : par ordre (3 voix, les privilégiés bloquent tout) ou par tête (577 députés du tiers contre ~600 en tout pour les deux premiers ordres) ? Le tiers état, refusant d\'être « rien », se proclame <b>Assemblée nationale</b> le <b>17 juin</b> (proposition de Sieyès), jurant le <b>serment du jeu de paume le 20 juin</b> : « ne jamais nous séparer jusqu\'à ce que la constitution soit établie ». Le roi cède le 27 juin : la Révolution a commencé sans verser de sang — mais le roi masse des troupes autour de Paris inquiète le peuple.</div>\n<h3>2. L\'été 1789 : le peuple entre en scène</h3>\n<div class=\"tip\">À Paris, la rumeur court que le roi veut disperser l\'Assemblée. Le <b>14 juillet 1789</b>, le peuple parisien, cherchant des armes et de la poudre, prend la forteresse-prison de la <b>Bastille</b>, symbole de l\'arbitraire royal ; la <b>Grande Peur</b> gagne les campagnes (peur des « brigands », châteaux brûlés). Dans la nuit du <b>4 août</b>, l\'Assemblée abolit « entièrement le régime féodal » : privilèges, dîme, justices seigneuriales tombent (avec des rachats pour les paysans, longtemps impopulaires). Le <b>26 août</b>, l\'Assemblée vote la <b>Déclaration des droits de l\'homme et du citoyen</b> (DDHC), texte fondateur : « Les hommes naissent et demeurent libres et égaux en droits » (art. 1er) ; la souveraineté réside dans la <b>nation</b>, pas dans le roi ; loi générale, liberté d\'opinion et de religion, présomption d\'innocence, propriété inviolable. Le roi, ramené de force à Paris le 6 octobre (journée des 5-6 octobre, marche des Parisiennes sur Versailles), est désormais sous surveillance.</div>\n<div class=\"tip\"><b>1791</b> : l\'Assemblée constituante achève une première transformation du pays — <b>constitution civile du clergé</b> (juillet 1790 : les prêtres deviennent des fonctionnaires élus, ce qui divise l\'Église), abolition des parlements, découpage du royaume en <b>83 départements</b> égaux, suppression des corporations, assignats. Mais le pays se déchire : les nobles émigrent (Coblence), le roi tente de fuir et est arrêté à <b>Varennes</b> (juin 1791) : la confiance est morte. La <b>constitution de 1791</b> (septembre) instaure une <b>monarchie constitutionnelle</b> avec suffrage censitaire : le roi garde un veto. Les <b>clubs</b> structurent la politique : Feuillants (modérés), <b>Girondins</b> (députés républicains modérés), <b>Jacobins</b> (républicains radicaux, avec Robespierre), Cordeliers (Danton, Marat).</div>\n<h3>3. 1792-1794 : la République et la Terreur</h3>\n<div class=\"tip\">Les monarchies européennes menacent ; l\'Autriche et la Prusse envahissent. Le 20 avril 1792, la France leur déclare la guerre — d\'abord militairement désastreuse. Le <b>10 août 1792</b>, les Parisiens (avec les fédérés marseillais) prennent les Tuileries et suspendent le roi : la monarchie tombe. Le <b>21 septembre 1792</b>, la Convention proclame la <b>République</b> ; Louis XVI, jugé pour trahison, est <b>guillotiné le 21 janvier 1793</b> — l\'Europe entière se retourne contre la France. Les armées ennemies avancent ; à l\'intérieur, la Vendée se soulève (mars 1793, guerre civile atroce), les Girondins sont chassés (2 juin). Dans ce péril total, la Convention, dominée par les Jacobins (Robespierre, Saint-Just), installe la <b>Terreur</b> : le <b>Comité de salut public</b> gouverne ; la loi des suspects (17 septembre) fait incarcérer les « suspects » ; le tribunal révolutionnaire envoie à la guillotine près de 17 000 personnes (plus les morts en province, Vendée surtout : au total, plusieurs centaines de milliers). La <b>déchristianisation</b> remplace le calendrier (1793 = an II) et le culte de l\'Être suprême (juin 1794). Mais la <b>levée en masse</b> (août 1793 : « la jeunesse ira au combat... ») crée une armée de masse victorieuse, et l\'<b>économie dirigée</b> (maximum des prix, réquisitions) nourrit Paris. La Terreur « sauve » la République — et l\'écrase : Robespierre, de plus en plus isolé, est renversé le <b>9 thermidor an II</b> (27 juillet 1794) et guillotiné.</div>\n<div class=\"tip\"><b>Bilan de la Révolution (1789-1799)</b> : la France ne sera plus jamais un royaume d\'ordres : égalité devant la loi et l\'impôt, fin des privilèges, souveraineté de la nation, DDHC, métrique (1795), État-nation unifié. Mais la Révolution a aussi inventé la <b>guerre totale</b> et la <b>violence d\'État</b> au nom de la vertu ; elle laisse une France divisée en héritages contradictoires — et une armée victorieuse où monte un jeune général corse, Bonaparte. Le <b>coup d\'État du 18 brumaire an VIII</b> (9 novembre 1799) met fin au Directoire instable et ouvre l\'ère consulaire.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la DDHC du 26 août 1789, analyser un texte fondateur</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Quels principes nouveaux la Déclaration des droits de l\'homme et du citoyen établit-elle ?</div><div class=\"etu\"><b>Étape 1 — Les principes</b> : liberté et égalité en droits (art. 1) ; souveraineté de la nation (art. 3) ; loi = expression de la volonté générale (art. 6) ; liberté d\'opinion et de religion ; propriété inviolable ; nul homme accusé n\'est coupable avant jugement (présomption d\'innocence).</div><div class=\"etu\"><b>Étape 2 — Les ruptures</b> : la souveraineté passe du roi à la nation ; les privilèges (juridiques) disparaissent ; la loi devient générale. Mais le texte protège la propriété et ne concerne pas les femmes ni les esclaves (Olympe de Gouges réclame la Déclaration des droits de la femme, 1791 ; l\'esclavage n\'est aboli qu\'en 1794).</div><div class=\"etu\"><b>Étape 3 — La postérité</b> : préambule de toutes les républiques françaises, inspiration des droits de l\'homme contemporains. <b>Réflexe méthode</b> : pour un texte de référence, citer précisément 2-3 articles, identifier les ruptures et les limites.</div></div></details>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi la Terreur ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une République née de la liberté instaure en 1793-94 un régime de peur : comment expliquer ce paradoxe ?</div><div class=\"etu\"><b>Étape 1 — Le contexte d\'urgence</b> : invasion étrangère, guerre civile vendéenne, révoltes fédéralistes, famine à Paris : l\'Assemblée croit sauver la République en terrorisant ses ennemis intérieurs (« il faut punir les conspirateurs »).</div><div class=\"etu\"><b>Étape 2 — L\'idéologie</b> : les Jacobins identifient la vertu (le peuple) et la trahison (l\'aristocrate) : qui n\'est pas avec la République est contre elle. La politique devient une guerre morale : Robespierre justifie la Terreur comme « justice prompte, sévère, inflexible ».</div><div class=\"etu\"><b>Étape 3 — Le bilan</b> : environ 17 000 exécutions légales, sans compter les noyades et colonnes infernales en Vendée ; une République sauvée militairement, mais une démocratie écrasée par l\'État. <b>Réflexe méthode</b> : expliquer ≠ justifier : donner les causes, mesurer les effets, garder le jugement critique.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b> la Révolution ne commence pas le 14 juillet mais le 17 juin (Assemblée nationale) / 20 juin (jeu de paume) ; la DDHC proclame l\'égalité en droits, pas la démocratie (suffrage censitaire en 1791) ; la République est proclamée le 21 septembre 1792, le roi exécuté le 21 janvier 1793 ; la Terreur est le fait de la Convention (pas de « Robespierre seul ») ; abolition de la monarchie ≠ abolition de l\'esclavage (1794, rétabli par Napoléon en 1802).</div>"

  "cours": "<div class=\"cours-head\"><h2>Napoléon Bonaparte et l\'Empire</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. 1799-1804 : du consulat à l\'Empire</h3>\n<div class=\"tip\">À la fin du Directoire (1795-1799), la France est lasse : guerres extérieures, crises financières, coups d\'État permanents, retour menaçant des royalistes. Le général <b>Napoléon Bonaparte</b>, vainqueur d\'Italie, héros de la campagne d\'Égypte (1798-99, dont l\'expédition savante fait connaître la pierre de Rosette), est l\'homme fort attendu. Le <b>coup d\'État du 18 brumaire an VIII</b> (9-10 novembre 1799) renverse le Directoire : trois consuls sont nommés, Bonaparte devient <b>premier consul</b> ; la constitution de l\'an VIII (décembre 1799, approuvée par plébiscite) lui donne en réalité tout le pouvoir — « citoyens, la Révolution est fixée à ses principes : elle est finie. » Le <b>Consulat</b> (1799-1804) restaure l\'ordre : paix provisoire avec l\'Europe (traité de Lunéville 1801, paix d\'Amiens 1802), réconciliation religieuse par le <b>concordat</b> de 1801 avec le pape Pie VII (l\'État reconnaît la catholicité « religion de la majorité » mais nomme les évêques ; les biens d\'Église vendus ne sont pas rendus), centralisation administrative (préfets nommés dans chaque département, 1800), création de la <b>Banque de France</b> (1800) et du franc germinal (1803), code civil (1804).</div>\n<div class=\"tip\">Fort de ses succès, Bonaparte se fait proclamer <b>empereur des Français</b> le 18 mai 1804 (constitution de l\'an XII, plébiscite) : il se <b>couronne lui-même</b> à Notre-Dame le 2 décembre 1804 en présence du pape — image saisissante : l\'empereur ne tient son pouvoir que de lui-même et du peuple, non de Dieu ni d\'hérédité. C\'est un « Empire » héréditaire, mais plébiscitaire : Napoléon se veut l\'héritier de 1789 (« J\'ai fermé l\'abîme de la Révolution ») tout en rétablissant une monarchie. Le sacre, peint par <b>David</b> (1807), est une œuvre de propagande : tous les ordres y sont reconciliés autour du nouvel homme providentiel.</div>\n<h3>2. L\'œuvre de Napoléon : consolider la Révolution ?</h3>\n<div class=\"tip\"><b>L\'administration</b> : la France est divisée en départements dirigés par des <b>préfets</b> (1800), fonctionnaires nommés par le pouvoir central et responsables devant lui ; les maires sont aussi nommés dans les grandes villes. Cette « pyramide » administrative, encore en place aujourd\'hui, donne à l\'État une efficacité inédite : recensements, impôts levés, conscription appliquée, police politique (Fouché). <b>La justice</b> : le <b>Code civil</b> (21 mars 1804, dit « Code Napoléon ») unifie le droit : égalité devant la loi (héritage révolutionnaire), propriété protégée, contrat et famille encadrés ; mais la femme mariée est placée sous l\'autorité du mari, le divorce reste possible mais restreint, le chef de famille domine. Suivent le code pénal (1810), le code de commerce (1807), le code d\'instruction criminelle. <b>L\'éducation</b> : création des <b>lycées</b> (1802), des bourses, de l\'<b>Université impériale</b> (1806-1808) — monopole de l\'État sur l\'enseignement, avec des lycées qui forment les cadres de la nation. <b>L\'économie et la gloire</b> : routes, canaux, instituts, légion d\'honneur (1802), bataille d\'Austerlitz (2 décembre 1805, « soleil d\'Austerlitz ») qui écrase l\'Autriche et la Russie.</div>\n<div class=\"tip\"><b>Continuité ou rupture avec la Révolution ?</b> Les deux à la fois. Napoléon <b>garde</b> l\'égalité civile (plus d\'ordres, plus de privilèges), la vente des biens nationaux, la liberté religieuse (protestants et juifs reconnus), la méritocratie (« à chaque Français selon ses talents »). Mais il <b>régresse</b> sur le politique : plus de libertés publiques (censure en 1807, police, liste des proscrits), les femmes sont légalement mineures, l\'esclavage est <b>rétabli</b> dans les colonies (1802, contre l\'abolition de 1794), le pouvoir est plébiscitaire mais autoritaire. La devise résumée : « La Révolution est finie » — Napoléon fixe ce qu\'il en conserve et supprime ce qui menace l\'ordre (liberté de la presse, opposition). Le bilan doit donc toujours être <b>nuancé</b> : consolidation de l\'acquis civil, confiscation de l\'acquis politique.</div>\n<h3>3. 1805-1815 : l\'Empire à son apogée puis la chute</h3>\n<div class=\"tip\">De 1805 à 1807, Napoléon écrase successivement l\'Autriche (Austerlitz, 2 déc. 1805), la Prusse (Iéna, 1806), la Russie (Friedland, 1807) : il domine l\'Europe continentale. Il remodèle la carte : fin du Saint-Empire (confédération du Rhin, 1806), royaumes confiés à sa famille (Louis en Hollande, Joseph en Espagne puis Naples, Jérôme en Westphalie), grand-duché de Varsovie. Le <b>blocus continental</b> (décrets de Berlin 1806 et Milan 1807) interdit tout commerce avec l\'Angleterre : c\'est une guerre économique, qui appauvrit les ports français et indispose l\'Europe. Mais des <b>deux guerres d\'Espagne</b> (1808-1814, résistance populaire contre Joseph Bonaparte) à la <b>Russie</b> (1812 : 600 000 hommes partis, la retraite de Moscou détruit la Grande Armée — moins de 100 000 revenus), l\'Empire s\'épuise. L\'Allemagne se soulève (bataille de Leipzig, « bataille des Nations », 1813). La <b>campagne de France</b> (1814) est admirable mais vaine : Paris est pris, Napoléon <b>abdique</b> le 6 avril 1814, reçoit l\'île d\'Elbe. Le retour des « <b>Cent Jours</b> » (1er mars - 22 juin 1815) s\'achève à <b>Waterloo</b> (18 juin 1815) : seconde abdication, exil à Sainte-Hélène où il meurt en 1821.</div>\n<div class=\"tip\"><b>Mémoire et postérité</b> : le mémorial de Sainte-Hélène (dicté à Las Cases) fabrique la légende — le « petit Caporal » devenu empereur, le défenseur de la Révolution trahi par les rois. Cette légende noire ou dorée traverse le XIXe siècle (retour des cendres en 1840), nourrit le roman national et explique la popularité du bonapartisme. L\'œuvre administrative, elle, survit : Code civil (appliqué dans de nombreux pays), lycées, préfets, légion d\'honneur. Le congrès de Vienne (1814-1815) efface la carte napoléonienne et rétablit des monarchies « légitimes » — mais la Sainte-Alliance ne pourra pas empêcher les idées de 1789 de continuer leur chemin.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le sacre de Napoléon, une image de propagande</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi le tableau de David, Le Sacre de Napoléon Ier (1807), est-il un document politique autant qu\'artistique ?</div><div class=\"etu\"><b>Étape 1 — Décrire</b> : scène grandiose à Notre-Dame ; Napoléon, debout en costume d\'apparat, couronne lui-même Joséphine agenouillée ; le pape, assis derrière, n\'est que spectateur bénisseur ; les frères et sœurs de l\'empereur assistent en habits de cour ; le clergé, l\'armée, les anciens et le peuple y figurent.</div><div class=\"etu\"><b>Étape 2 — Analyser</b> : tout est message — Napoléon se couronne seul (le pouvoir vient de lui, non du pape) ; l\'apparat monarchique (velours, lauriers) rattache l\'Empire à une tradition royale apaisée, mais la présence du pape pacifié et des révolutionnaires convertis signe la « fusion » de la France divisée ; la mère de Napoléon, en réalité absente, est peinte présente pour parfaire l\'image familiale.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : commande impériale, le tableau est un manifeste : l\'Empire dépasse la Révolution en réconciliant les héritages. <b>Réflexe méthode</b> : une commande officielle se lit comme un programme politique : qui peint, qui commande, qui figure, qui est absent.</div></div></details>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le Code civil, la Révolution fixée ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le Code civil de 1804 : consolidation ou trahison des acquis de 1789 ?</div><div class=\"etu\"><b>Étape 1 — Ce qu\'il garde</b> : égalité civile (plus de privilèges), abolition de la féodalité (confirmée), propriété (y compris des biens nationaux) garantie, contrat et libre concurrence encadrés, laïcité relative (l\'état civil laïcisé).</div><div class=\"etu\"><b>Étape 2 — Ce qu\'il fige ou régresse</b> : la femme mariée est « mineure » (dot, travail, biens sous autorisation maritale) ; l\'ouvrier est soumis au livret ; l\'enfant illégitime discriminé ; le divorce restreint (1816). Le chef de famille, le propriétaire et le contrat règlent la société.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : « le Code est la constitution civile de la société bourgeoise » : il fixe la société issue de la Révolution — pour les hommes propriétaires. <b>Réflexe méthode</b> : juger un code = confronter ses principes aux personnes qu\'il exclut.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b> 18 brumaire = 1799 (fin du Directoire), Empire = 1804, pas 1800 ; Napoléon « empereur des Français » (titre issu du peuple, plébiscité), pas « empereur de France » (titre héréditaire) ; le concordat n\'est pas un retour à l\'Ancien Régime religieux (l\'Église reste soumise) ; Waterloo = 18 juin 1815 (et non 1814) ; le Code civil n\'a jamais été favorable aux femmes.</div>"

  "cours": "<div class=\"cours-head\"><h2>La révolution industrielle et la société du XIXe siècle</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. Les mutations économiques : machines, usines, rail</h3>\n<div class=\"tip\">La <b>révolution industrielle</b> naît en <b>Angleterre</b> à la fin du XVIIIe siècle (coton, vapeur) puis gagne la France et l\'Europe dans la première moitié du XIXe siècle. Trois nouveautés décisives : la <b>machine</b> (machine à vapeur de James Watt perfectionnée dès 1769, métiers à filer et à tisser mécaniques), l\'<b>énergie</b> fossile (le <b>charbon</b> remplace l\'eau, le vent et le muscle : une tonne de charbon « contient » le travail de dizaines d\'hommes), et l\'<b>usine</b> — le regroupement des ouvriers et des machines sous un même toit, près des gisements. En France, l\'industrialisation se concentre d\'abord dans le Nord (textile), la Lorraine et la Loire (charbon, fer, Le Creusot), Lyon (soie), puis partout après 1850. <b>Deuxième révolution industrielle</b> (1850-1900) : <b>acier</b>, <b>électricité</b>, <b>pétrole</b>, <b>chimie</b>, et surtout le <b>chemin de fer</b> — locomotives de Stephenson, premières lignes (Stockton-Darlington 1825 ; Paris-Rouen 1843 ; réseau français multiplié par dix sous le Second Empire). Le rail transforme tout : il crée la demande (acier, charbon, bois), unifie le marché national (prix alignés, denrées périssables transportées), rapproche les campagnes des villes, change la guerre et accélère l\'émigration.</div>\n<div class=\"tip\"><b>Nouvelles villes, nouveaux paysages</b> : les villes industrielles croissent très vite (Roubaix, Mulhouse, Saint-Étienne, et en Angleterre Manchester) — la ville « sauvage » du milieu du siècle est composée d\'ateliers, de cheminées, de corons (cités ouvrières alignées autour des mines), de boue et de fumée. La croissance économique est pourtant chaotique : des phases d\'expansion (1850-1873, « Grande Dépression » 1873-1896 relative, Belle Époque 1896-1914) alternent avec des crises cycliques (1826, 1847, 1857 — première crise mondiale partie des États-Unis). <b>Capitalisme et libéralisme</b> : l\'économie est pensée par des libéraux (Say, Bastiat) qui vantent la libre entreprise, la concurrence et la propriété privée ; l\'entreprise se concentre (sociétés anonymes, banques d\'affaires, grands magasins). L\'Angleterre, « atelier du monde » jusque vers 1870, est ensuite concurrencée par l\'Allemagne et les États-Unis, plus rapides dans la deuxième révolution industrielle.</div>\n<h3>2. La société industrielle : bourgeois et ouvriers</h3>\n<div class=\"tip\">La société d\'ordres est morte ; la place de chacun se définit désormais par la <b>fortune</b> et la <b>profession</b>. En haut, la <b>bourgeoisie</b> — industriels, banquiers, grands commerçants, mais aussi professions libérales et hauts fonctionnaires — détient l\'usine, la banque, la presse ; son pouvoir social (style de vie, mariages, écoles), culturel et souvent politique remplace celui de l\'ancienne noblesse, qui survit dans les salons et l\'armée. En bas, le <b>monde ouvrier</b> se forme par vagues : ouvriers des manufactures, mineurs, journaliers, et aussi artisans et ouvriers à domicile laminés par la machine (les canuts de Lyon se révoltent en 1831 et 1834). Les conditions de travail sont rudes : 12 à 16 heures par jour, travail des <b>enfants</b> (seulement encadré en France par la loi de 1841, mal appliquée), femmes payées moins, ateliers dangereux et insalubres, crises de chômage brutales. Le logement ouvrier est souvent une chambre ou un taudis ; la famille vit dans la promiscuité, l\'alcool et la mortalité (espérance de vie ouvrière à Paris vers 1840 : inférieure à 30 ans).</div>\n<div class=\"tip\">Face à ce monde inégal, la première moitié du siècle est celle des <b>espérances</b> : les saint-simoniens et les premiers <b>socialistes</b> (Blanc, Proudhon, Fourier, Marx et Engels publient le <b>Manifeste du parti communiste</b> en 1848) imaginent une société plus juste ; les ouvriers se regroupent en <b>associations</b> puis en syndicats (légalisés en France seulement en 1884, loi Waldeck-Rousseau) ; les <b>grèves</b> deviennent l\'arme du salariat (prohibées puis tolérées). Après 1850, la condition ouvrière s\'améliore lentement : salaires réels en hausse, législation sociale timide en France (travail des enfants limité, retraites ouvrières en 1910), mutualités et coopératives, hygiène publique (Haussmann à Paris, eau, égouts) — mais la « question sociale » reste ouverte : les ouvriers forment une classe consciente de ses intérêts (le « prolétariat » des socialistes) et, refusée du partage politique, elle nourrit le mouvement ouvrier (syndicats, parti socialiste, grèves comme celle de Courrières en 1906).</div>\n<h3>3. La vague révolutionnaire de 1848 et l\'affirmation des nations</h3>\n<div class=\"tip\"><b>1848</b> : « le printemps des peuples » éclate presque partout en Europe. Les causes communes : crise économique (récoltes 1846, crise financière et chômage), refus des systèmes issus du congrès de Vienne (monarchies autoritaires), aspiration à la <b>liberté</b> (presse, parlement) et à la <b>nation</b> (unité allemande et italienne, indépendance des peuples). En France, la <b>révolution de février</b> (22-24) renverse Louis-Philippe : la <b>Deuxième République</b> est proclamée le 24 février avec un gouvernement qui reconnaît le <b>suffrage universel masculin</b> (une première en France) et le <b>droit au travail</b> (ateliers nationaux de Louis Blanc). Mais l\'échec des ateliers (fermés en juin) déclenche l\'<b>insurrection des journées de Juin</b> (23-26 juin 1848), sauvagement réprimée (plusieurs milliers de morts) : la République se divise — conservateurs ruraux et ordre moral élisent <b>Louis-Napoléon Bonaparte</b> en décembre 1848. Celui-ci, fort du nom, renverse la République le <b>2 décembre 1851</b> (candidature du coup d\'État approuvée par plébiscite, répression) et fonde le <b>Second Empire</b> (2 décembre 1852) : Napoléon III.</div>\n<div class=\"tip\">Dans toute l\'Europe, les révolutions de 1848 sont vaincues (Vienne, Berlin, Milan, les États allemands et italiens restent morcelés) — mais elles enseignent aux peuples que la liberté et l\'unité ne viendront pas d\'un simple soulèvement. La <b>nationalité</b> devient l\'idée-force du siècle : unité allemande réalisée « par le fer et par le sang » (Bismarck, guerre contre le Danemark 1864, l\'Autriche 1866, la France 1870-71, proclamation de l\'Empire allemand à Versailles le 18 janvier 1871) ; unité italienne menée par le royaume de Piémont-Sardaigne (Cavour, Garibaldi, Victor-Emmanuel II, Rome prise en 1870). La France, battue à Sedan (1er septembre 1870), voit tomber le Second Empire (4 septembre 1870, proclamation de la Troisième République) — mais la France reste divisée : la Commune de Paris (18 mars - 28 mai 1871) et sa répression sanglante laissent des mémoires opposées pour un siècle.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire un tableau de l\'économie industrielle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Production mondiale de charbon (~1815 : quelques Mt ; 1850 : ~130 Mt ; 1900 : ~700+ Mt) et réseau ferroviaire européen (1840 : ~3 000 km ; 1900 : ~300 000 km) : que montrent ces chiffres ?</div><div class=\"etu\"><b>Étape 1 — Décrire</b> : croissance exponentielle : production multipliée par 5 à 7 en un demi-siècle, rail multiplié par 100 ; des décollages datés (Angleterre d\'abord, Allemagne et États-Unis après 1870).</div><div class=\"etu\"><b>Étape 2 — Expliquer</b> : le charbon alimente machines, rail et navires ; le rail transporte charbon et acier — chaque secteur entraîne l\'autre (croissance auto-entretenue). Les pays « retardataires » rattrapent par les technologies nouvelles.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : un « take-off » industriel est daté et localisé, jamais uniforme. <b>Réflexe méthode</b> : toujours préciser ordre de grandeur, période, espace.</div></div></details>\n<details class=\"ex-util\"><summary>💡 Focus sur... — 1848 en France, une révolution trahie ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi la République de 1848, née de l\'enthousiasme, finit-elle dans le coup d\'État de 1851 ?</div><div class=\"etu\"><b>Étape 1 — Les promesses</b> : suffrage universel masculin, droit au travail, ateliers nationaux, abolition de l\'esclavage dans les colonies (décret du 27 avril 1848, sous l\'impulsion de Victor Schœlcher), liberté de la presse.</div><div class=\"etu\"><b>Étape 2 — Les fractures</b> : la fermeture des ateliers (juin) oppose ouvriers et République conservatrice ; les élections d\'avril-mai donnent une majorité rurale modérée ; la question sociale (chômage, salaires) reste sans solution.</div><div class=\"etu\"><b>Étape 3 — La confiscation</b> : le prince-président utilise le mécontentement et son nom pour renverser la République (2 décembre 1851, plébiscite). <b>Réflexe méthode</b> : 1848 illustre la tension entre « démocratie politique » (le suffrage) et « démocratie sociale » (le droit au travail) — un couple à suivre dans toute la suite du programme.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b> la révolution industrielle commence en Angleterre (pas en France) vers 1760-1780 ; chemin de fer français : Paris-Rouen 1843 (pas 1830) ; suffrage universel masculin = 1848 (pas 1789 ni 1870) ; le Second Empire = Napoléon III (1852-1870), le Premier = Napoléon Ier ; ne pas confondre grève (moyen) et syndicat (organisation) ; la Commune de Paris (1871) n\'est pas la Révolution de 1848.</div>"
