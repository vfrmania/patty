{"t": "La révolution industrielle et la société du XIXe siècle (Collège)","q": "La machine à vapeur de James Watt (brevet 1769) est décisive car :","c": ["elle LIBÈRE l'énergie du muscle, du vent et de l'eau : l'usine peut s'installer partout et la machine travaille sans repos","elle est jolie","elle coûte cher","elle vole"],"a": 0,"e": "La vapeur (chaudières au charbon) permet une production continue à grande échelle : c'est le cœur de la première révolution industrielle (textile : mines : rail).","d": "<b>L'énergie mécanique disponible partout</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement : avant Watt, l'énergie vient du moulin à eau (les manufactures au bord des rivières : la localisation subie) ou des bras (le lent filage au rouet) : la machine de Watt (une pompe d'abord : les mines de Cornwall noyées) transforme la chaleur en mouvement : les usines s'installent près des gisements de charbon (Manchester : les « Cottonopolis »), les métiers mécaniques (la mule-jenny : le métier à filer) décuplent la production de fil, les wagons remorqués (la locomotive de Stephenson : 1825-1830) roulent jour et nuit : l'économie n'est plus soumise à la nuit, à la saison ni au muscle : la productivité s'envole (le prix du coton filé divisé) et le monde devient « moderne » (le temps mesuré : la fabrique disciplinée). Piège : la vapeur n'invente pas l'industrie (les manufactures existaient) : elle la démultiplie et la délocalise des rivières vers les bassins houillers.</div>"},
{"t": "La révolution industrielle et la société du XIXe siècle (Collège)","q": "Le chemin de fer provoque :","c": ["la fin des villes","la guerre","la famine","une RÉVOLUTION DES TRANSPORTS : les marchés s'unifient, les prix s'alignent, les migrations s'accélèrent, l'acier et le charbon explosent"],"a": 3,"e": "Le rail abaisse le coût du fret (le blé circule : les famines locales disparaissent), tire la sidérurgie (rails : locomotives : ponts) et rapproche les hommes (le tourisme : les journaux : l'heure unifiée).","d": "<b>L'effet en chaîne</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le développement : ① l'économie : le prix du transport de la tonne de marchandise s'effondre : le blé de Moldavie concurrence le blé français (la crise agricole de 1873-1896) : les régions se spécialisent (le vin : le textile : la métallurgie) ② l'industrie : chaque kilomètre de voie consomme de l'acier (les rails), du charbon (les chaudières), des travaux publics (les ponts de Eiffel : les tunnels) : la demande fait grossir Schneider (le Creusot) et les banques (les sociétés de chemin de fer : les grandes affaires des Rothschild) ③ la société : l'exode rural vers les gares : les migrants vers l'Amérique embarquent au Havre : les horaires imprimés uniformisent le temps (l'heure de Paris imposée aux provinces) : le bilan : en 1850, l'Europe compte 25 000 km de voies : en 1900, 300 000 : le monde rétréci. Piège : le rail détruit aussi (les canaux concurrencés : les diligences ruinées : les campagnes dépeuplées) : toute innovation a des gagnants et des perdants — question type attendue au brevet.</div>"},
{"t": "La révolution industrielle et la société du XIXe siècle (Collège)","q": "Les révoltes des Canuts lyonnais (1831 et 1834) expriment :","c": ["la guerre civile","la MISÈRE des ouvriers de la soie et la naissance de la QUESTION SOCIALE (le tarif refusé par les fabricants : « Vivre en travaillant ou mourir en combattant »)","la mode","la joie des ouvriers"],"a": 1,"e": "Les soyeux de Lyon (les canuts) travaillent à domicile pour des salaires effondrés : ils réclament un tarif minimum (la « conjuration égalitaire ») : la répression fait des morts : la monarchie de Juillet découvre « la question sociale » (les premiers socialismes).","d": "<b>La question sociale naît à Lyon</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le récit : les canuts (les ouvriers de la soie : les métiers Jacquard dans les quartiers de la Croix-Rousse) subissent la baisse des prix (les façonnés invendus : les salaires divisés par deux depuis 1827) : en novembre 1831, ils défilent pour le <b>tarif</b> (le prix minimum de la façon) négocié puis renié par les fabricants : la ville se soulève (les barricades des pentes : l'armée évacuée : le préfet emprisonné quelques heures) : la répression (le général Soult : 600 morts ou blessés : les procès) : 1834, second soulèvement (l'interdiction des sociétés de secours mutuels : le déclin des canuts) : la portée : pour la première fois, l'État découvre une CLASSE ouvrière organisée (le mot «Canut » : la chanson) : les observateurs (le médecin Villermé) enquêtent, les socialistes (Saint-Simonistes : Buchez) théorisent, la monarchie tremble (la peur des « barbès ») : la « question sociale » entre dans le vocabulaire politique. Piège : les Canuts ne sont pas des « prolétaires d'usine » mais des ouvriers à domicile (la fabrique dispersée de Lyon : la « fabrique » au sens ancien) : le soulèvement est corporatiste (le tarif) autant que social.</div>"},
{"t": "La révolution industrielle et la société du XIXe siècle (Collège)","q": "L'enquête du docteur Villermé (1840) sur les ouvriers :","c": ["est un roman","DÉNONCE les conditions de vie et de travail (la misère : le travail des enfants : l'espérance de vie écrasée) et prépare les premières lois sociales","vante le confort ouvrier","est interdite"],"a": 1,"e": "Le « Tableau de l'état physique et moral des ouvriers employés dans les manufactures » (Villermé : un enquêteur scrupuleux) documente les salaires, les logements, la mortalité : le choc de l'opinion prépare la loi de 1841 (limitation du travail des enfants).","d": "<b>La misère documentée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la méthode : Villermé (un médecin : un libéral royaliste ! : membre de l'Académie de médecine) visite pendant des années les manufactures (le Nord : l'Alsace : Lyon) : il MESURE (les salaires nominels et réels : les loyers des chambres : le prix de la soupe), il OBSERVE (les enfants de 5 ans aux cardes de laine : les femmes en couchent dans les ateliers : la cotonose et les poumons des filateurs), il COMPARE (la mortalité des quartiers riches et pauvres de Paris : deux fois plus élevée à l'est) : le résultat (les pages terribles sur les filatures : les journées de 15 h : la promiscuité des dortoirs) : la portée : la commission d'enquête parlementaire (1840), la <b>loi du 22 mars 1841</b> (moins de 8 ans interdits : 8 h à 12 ans en théorie... le contrôle inexistant), la suite : les congrès d'hygiène : les bureaux de statistique : la sociologie naissante (Le Play : les Ouvriers européens) : l'exemple montre le rôle de l'EXPERTISE dans la réforme (mesurer pour faire loi). Piège : la loi de 1841 est inefficace (pas d'inspecteurs avant 1874) : ne pas la présenter comme une victoire ouvrière : c'est un début de prise de conscience.</div>"},
{"t": "La révolution industrielle et la société du XIXe siècle (Collège)","q": "La loi Waldeck-Rousseau (1884) :","c": ["interdit les grèves","crée les usines","supprime les impôts","LÉGALISE les syndicats professionnels en France (la liberté d'organisation des travailleurs)"],"a": 3,"e": "Après le délit de coalition (hérité de la Révolution : l'article 417 du Code civil interdisait les coalitions), la IIIe République reconnaît les syndicats : la Bourse du travail (1887 : Fernand Pelloutier) et la CGT naissante (1895) s'organisent : la grève reste encadrée (l'occupation interdite).","d": "<b>La liberté syndicale</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le chemin : ① l'Ancien régime juridique : le délit de coalition : la loi Le Chapelier (1791 : l'interdiction des corporations ET des rassemblements d'ouvriers : « l'anéantissement de toute corporation ») : l'article 417 du Code pénal : la prison pour les grévistes : les procès des mineurs de Rive-de-Giers (1869 : les acquittements de la fin) ② le tournant : la Grande Dépression (les salaires : les prix) : les grandes grèves (les mineurs 1880-1884 : la fédération des travailleurs : la pression des socialistes) : la IIIe République opportuniste (les « solidaristes » : la recherche de la paix sociale) : la loi du 21 mars 1884 (« les syndicats professionnels sont librement constitués » : la personnalité civile : les dépôts de statuts en mairie) ③ la suite : la CGT fondée en 1895 à Limoges : les fédérations : la Charte d'Amiens (1906 : l'indépendance syndicale : la grève générale) : la grève de 1904 (les employés du métro... non : les cheminots) : les lois sociales : le repos hebdomadaire (1906 : le dimanche) : les retraites ouvrières (1910) : le bilan : la France se syndique lentement (moins d'un million d'adhérents en 1914) mais le DROIT existe : le rapport de forces a changé. Piège : la grève des fonctionnaires reste interdite jusqu'en 1946 : la loi légalise le SYNDICAT, pas toute l'action revendicative (l'employeur peut remplacer les grévistes : le lock-out légal).</div>"},
{"t": "La révolution industrielle et la société du XIXe siècle (Collège)","q": "Les transformations de Paris sous le Second Empire (Haussmann) comprennent :","c": ["les grands boulevards percés (l'air : la circulation : les égouts : l'eau : les façades alignées : les gares : les parcs) — une modernité spectaculaire ET un contrôle social","une révolution","la fin des monuments","la destruction de Paris"],"a": 0,"e": "Le baron Haussmann (préfet de la Seine 1853-1870 : l'Empire de Napoléon III) : les percées (la rue de Rivoli : les grandes avenues : l'Opéra de Garnier : les 34 000 bâtiments neufs), les réseaux (l'eau potable : les égouts de Belgrand : l'éclairage au gaz), les squares (les squares des halles : les bois de Boulogne et Vincennes) : la ville « moderne » ET la ville « contre-insurgée » (les barricades impossibles dans les avenues larges : le canon bouge vite).","d": "<b>La modernité stratégique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le programme : ① les motivations affichées : l'air (la théorie des miasmes : l'épidémie de choléra de 1832 : 18 000 morts), la circulation (les rues moyennâgeuses embouteillées : les omnibus), la beauté : la ville-capital des arts : les voyageurs du monde entier : les expositions universelles (1855 : 1867 : le Palais de l'Industrie) ② les moyens : l'expropriation massive : les 350 000 déracinés : les locataires chassés : les loyers montent : les pauvres repoussés vers l'est (Belleville : la Chapelle), les chantiers : les 600 km de voies nouvelles : les 34 000 immeubles : le réglement des hauteurs (l'alignement : la pierre de taille : les balcons de l'étage noble), les réseaux : les 600 km d'égouts visitables (Belgrand : le béton : les relevés), l'eau des aqueducs (Dhuis : Vanne : les 2 millions de m3/jour), le gaz (les becs : les boulevards éclairés) ③ les fins politiques : les percées droites (le boulevard de Sébastopol : le rue de Rennes : le canon et la cavalerie manœuvrent : les barricades privées de ruelles), la caserne : les forts du sud (le Mont-Valérien : le « Paris » bombardable), la caserne de la rue (les postes de police : le télégraphe) : le bilan : le Paris de la Commune (1871) : les combats ÉGALITÉ impossible à tenir ? Non : la Commune tient 72 jours... mais l'artillerie versaillaise l'emporte par les percées : la postérité : le modèle haussmannien exporté (Barcelone : le plan Cerdà : Vienne : la Ringstrasse : les capitales du monde) : le sujet : « moderniser pour contrôler ? » : la double lecture. Piège : Haussmann n'est pas seul : l'ingénieur Belgrand (l'eau : les égouts), l'architecte Davioud (les kiosques : les parcs), l'Empereur (les décisions) : et la destruction (les couvents rasés : le quartiers entiers : les expropriés sans indemnité juste) choque même les contemporains (les pamphlets : les procès : la chute de l'Empire suspend les travaux).</div>"},
{"t": "La révolution industrielle et la société du XIXe siècle (Collège)","q": "La « seconde révolution industrielle » (~1880-1914) repose sur :","c": ["l'ÉLECTRICITÉ, l'ACIER et le PÉTROLE (les nouvelles sources d'énergie : la chimie : l'automobile : le téléphone)","la vapeur uniquement","l'agriculture","le vent"],"a": 0,"e": "La dynamo (Gramme 1871), l'acier Bessemer et Thomas (les ponts : les rails : les immeubles), le moteur à explosion et le pétrole (l'automobile : les frères Lumière : l'avion des frères Wright) : de nouveaux pays industriels (l'Allemagne : les États-Unis) dépassent l'Angleterre : les monopoles et les grandes firmes (Krupp : Standard Oil : les banques mêlées à l'industrie).","d": "<b>Électricité, acier, pétrole</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les marqueurs : ① l'électricité : la dynamo de Gramme (1871 : l'industrie de la machine), les centrales : la première à Belcourt ? (les usines des sociétés : Edison et ses brevets en Europe), les usages : l'éclairage des rues (le théâtre : les cafés), la machine-outin (le moteur dans l'atelier : les transmissions souples), le tramway (les villes étalées), l'électrochimie (l'aluminium : l'acier au four électrique) ② l'acier : le procédé Bessemer (l'air insufflé : la fonte décarburée en 20 minutes : la chute du prix), le Thomas-Gilchrist : les fontes phosphoreuses (la minette lorraine utilisable !), les usages : les rails (les grandes compagnies), les ponts (le pont sur le Forth 1890), les charpentes : les gares : la Tour Eiffel 1889 (les 7 300 tonnes), les navires (les paquebots : les cuirassés) ③ le pétrole et le moteur : le moteur à quatre temps : Otto 1876 : Daimler : Benz (l'automobile de 1885), les forages : Bakou : le Texas (Spindletop 1901 : la ruée), les conséquences : l'automobile : les licences : les usines Ford (la chaîne en 1913 : la modernisation rapide), l'avion (Wright 1903 : Blériot 1909 : la traversée de la Manche) ④ les géants industriels : la concentration : Krupp (l'acier et les canons : les 100 000 ouvriers), Standard Oil : le trust de Rockefeller : le monopole du raffinage (l'antitrust de 1890 : Sherman), Siemens (l'électrique), les banques (la finance mêlée : l'« capitalisme financier ») : la hiérarchie bascule : l'Allemagne et les États-Unis doublent l'Angleterre : les indices de production : les universités techniques (le MIT 1861 : les grandes écoles allemandes) : le protectionnisme agricole et industriel : les tarifs de 1879 (l'Allemagne : l'alliance du seigle et de l'acier) : la leçon : chaque révolution redistribue les puissances. Piège : la « seconde » ne remplace pas la « première » (la vapeur et le rail continuent : les couches s'empilent) : et la France reste en retrait (la démographie : la rente : les structures familiales : les historiens expliquent la « retard »).</div>"},
{"t": "La révolution industrielle et la société du XIXe siècle (Collège)","q": "Les lois scolaires de Jules Ferry (1881-1882) :","c": ["privatisent l'école","suppriment les instituteurs","rendent l'école primaire GRATUITE, LAÏQUE et OBLIGATOIRE (la formation du citoyen républicain : l'élévation du peuple)","créent les universités"],"a": 2,"e": "L'école gratuite (1881), obligatoire (de 6 à 13 ans) et laïque (les programmes sans catéchisme : les instituteurs remplacent les frères), l'institutrice et l'instituteur (les « hussards noirs de la République » : les écoles normales) : lutter contre l'ignorance (les enquêtes : 40 % des conscrits illettrés en 1870) et forger des citoyens.","d": "<b>Gratuité, obligation, laïcité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le chantier : ① le diagnostic : les enquêtes des années 1870 : le baron Dupin : les statistiques des conscrits (les départements « arriérés » : le quart sud-ouest : la Bretagne rurale), le recul de la défaite de 1871 : l'« ignorance » accusée : les leçons allemandes : l'instituteur prussien vainqueur de l'instituteur français (la formule du philosophe : le débat) ② les lois : le 16 juin 1881 : la gratuité (les écoles communales gratuites : les classes nombreuses : les bâtiments), le 28 mars 1882 : l'obligation (de 6 à 13 ans : l'assiduité : les certificats d'études), la laïcité : les programmes laïcs : le catéchisme reporté au jeudi (le « jour » de l'église), les suivantes : les écoles normales d'instituteurs (le recrutement : les bourses), l'École normale supérieure de Saint-Cloud (les méthodes), les manuels : le Tour de la France par deux enfants (1887 : 6 millions d'exemplaires : le petit patriote : le lavoir : la sage proverb)  ③ les effets : l'alphabétisation (les conscrits : l'analphabétisme sous les 5 % en 1900), la langue : le français contre les patois (l'école impose : le gouvernement : l'« accent » honteux), la nation : les cartes : les chants : la Marseillaise à l'école : les drapeaux : les « histoire de France » héroïques : le manuel de Lavisse : les Gaulois à la mains sur la charrue... « nos ancêtres les Gaulois » pour les enfants d'Algérie (la citation de Camus : le débat) , les filles : l'enseignement secondaire féminin (la loi Camille Sée 1880 : les lycées de jeunes filles : les « samedis » de couture... la formation « différente » : la critique : l'inégalité durable) : le sujet : « l'école de la République : une machine à intégrer ? » : la démonstration : les objectifs : les effets : les limites (les filles : les colonies : l'anti-cléricalisme qui divise). Piège : la laïcité de 1882 n'est pas la séparation de 1905 : l'école d'abord : l'Église et l'État ensuite : les Inventaires (1903-1904 : les congés des religieux de l'enseignement : la loi de 1904) : la séparation (1905 : la libre pratique : l'interdiction du budget des cultes).</div>"},
{"t": "La révolution industrielle et la société du XIXe siècle (Collège)","q": "Selon Marx (le Capital, 1867), l'histoire des sociétés est :","c": ["pacifique","l'histoire de la LUTTE DES CLASSES : le capitalisme exploite le travail ouvrier (la plus-value) et prépare sa propre chute (la révolution du prolétariat)","une histoire des rois","un mystère"],"a": 1,"e": "Marx (avec Engels : le Manifeste du parti communiste 1848 : « un spectre hante l'Europe ») théorise : la valeur vient du travail, le capital s'approprie la plus-value (la différence), les crises cycliques et la concentration préparent la révolution : le marxisme inspire les partis socialistes (la SFIO en France 1905) et la IIe Internationale (1889).","d": "<b>La lutte des classes et la plus-value</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la théorie en 4 temps : ① la méthode : le matérialisme historique : l'infrastructure économique (les forces productives : les rapports de production) détermine la « superstructure » (le droit : la religion : la philosophie : « l'opium du peuple »), la succession des modes de production : l'esclavagisme : le féodalisme : le capitalisme (chaque régime porte « ses » gravediggers) ② l'exploitation : la marchandise (la valeur d'échange : le travail abstrait), la force de travail (l'ouvrier vend son temps : le salaire = le coût de reproduction de la force), la <b>plus-value</b> : la différence : la valeur produite moins le salaire : le profit du capital : l'exploitation scientifiquement démontrée : les heures du chapitre sur la journée de travail (10 heures : 12 : les machines qui volent le « supplément ») ③ les crises : la surproduction cyclique : 1825 : 1847 : 1857 : la « crise » du crédit : les marchandises invendues (les usines fermées : les affamés au milieu de l'abondance : le « paradoxe »), la baisse tendancielle du taux de profit : les machines : le travail vivant moins rentable : la recherche du profit : l'impérialisme : les marchés : les colonies (l'analyse de Lénine plus tard) ④ la révolution : la concentration (les grandes usines : les prolétaires rassemblés : la « classe en soi » devient « classe pour soi »), le parti : l'organisation : l'Internationale : 1864 : l'AIM : la Commune (1871 : la première insurrection prolétarienne « qualifiée »), la dictature du prolétariat : la transition : l'État ouvrier : la société sans classes (le communisme : « de chacun selon ses forces : à chacun selon ses besoins ») : la portée : les partis sociaux-démocrates : l'Allemagne : la France : la SFIO 1905 : Guesde : Jaurès : l'« humaniste » : le débat avec Guesde : les méthodes : la réforme ou la révolution : le révisionnisme de Bernstein : 1899 : « le mouvement est tout » : la critique (Rosa Luxemburg : la réponse), la Russie : le « marxisme » de Lénine : le parti d'avant-garde : la révolution de 1917 : la première application... et la question (la paysannerie : le « matérialisme historique » accommodé) : le sujet : « Marx : scientifique ou prophète ? » : les deux : la méthode (les archives du British Museum : les « lois ») : la foi (la téléologie : la certitude de la chute). Piège : Marx n'organise presque rien lui-même : l'activiste est Engels (le « patron » textile finançant) : et il meurt en 1883 AVANT l'application de ses idées : le marxisme des partis est déjà une INTERPRÉTATION.</div>"},
{"t": "La révolution industrielle et la société du XIXe siècle (Collège)","q": "La croissance industrielle du XIXe siècle s'accompagne de :","c": ["la disparition des crises","la fin du travail","la paix parfaite","des CRISES CYCLIQUES (1847 : 1857 : 1873-1896 la « Grande Dépression » des prix : les faillites : le chômage massif) et de l'instabilité sociale"],"a": 3,"e": "L'industrialisation n'est pas un long fleuve tranquille : les cycles (l'expansion : la surproduction : la crise : la reprise), la Grande Dépression de 1873-1896 : la baisse des prix agricoles (les blés américains et russes : les chemins de fer mondiaux) : la protection (les tarifs de 1892 : Mélène) : la mise en cause du libéralisme (les cartels : les monopoles) : la concurrence internationale durcit (les nationalismes économiques).","d": "<b>Le cycle et ses secousses</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme d'une crise : ① le boom : le crédit facile : les banques : les sociétés en commandite : les « boîtes » : les sociétés anonymes nouvelles : la loi de 1867 : la spéculation de l'Empire libéral (les « haussmanneries » : les sociétés de chemin de fer), la hausse des prix (les matières premières : les salaires), la surproduction (les usines neuves : les débouchés espérés) ② le krach : l'annonce : une faillite : la panique (les déposants : la ruine des banques : l'assèchement du crédit), les exemples : la crise de 1847 : les récoltes : les chemins de fer : les subsistances (l'année de la révolution de 1848 ! : le lien social-crise), 1857 : la première crise MONDIALE : le crédit de New York : les rails : la banque hamburgaise : la contagion (les télégraphes : les navires : l'économie globalisée), 1873 : le krach de Vienne : les gratte-ciel viennois : les banques : la Bourse de New York : le « Black Friday » de Jay Cooke (le financier des chemins de fer : la panique) ③ la dépression : la baisse des prix : la Grande Dépression 1873-1896 : les prix qui décroissent : la concurrence mondiale : le blé américain : les prairies : les moissonneuses : les clippers puis les cargos : le canal de Suez 1869 (les Indes par mer rouge), les « denrées » qui s'effondrent : les rentes foncières : les paysans : les « gueux » : les dettes : les saisies (la révolte : les boulangers de la « revanche »), la protection : les tarifs douaniers : l'Allemagne 1879 : la France 1892 (le tarif Mélène : les céréales : la « république des paysans »), la fin du libre-échange : le traité de Cobden-Chevalier (1860) : le débat : le renouveau du protectionnisme (l'emploi contre les prix) ④ la reprise : les nouvelles industries : l'électricité : l'automobile (les « secondes » révolutions : les nouveaux moteurs), la reprise de 1896 : la Belle Époque : la croissance : les « années » faciles : les technocrates : les nouvelles classes moyennes : les employés : les bureaux : la « civilisation » du travail de bureau : les magasins à prix unique : les mille des « rien » : les bazars (les grandes surfaces naissantes) : la leçon : le capitalisme croît PAR les crises : les destructions créatrices : Schumpeter : la formule : l'innovateur balaye : le « vieux » : le cycle : les « kondratieff » : les grandes vagues : 50 ans : la statistique : les débats des historiens : la précision : les cycles inégaux (le refus du mécanisme trop simple). Piège : « Grande Dépression » (1873-1896) ≠ crise de 1929 (la différence : la baisse des prix au XIXe : l'effondrement de la demande en 1929) : ne jamais confondre les deux (les sujets adorent le piège lexical).</div>"},

function chapHeadHTML(m){
  return '<div class="chap-head"><span class="chap-title">🏛️ Histoire — ' + esc(m.titre) + '</span>' +
    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();
  if (t === 'quiz') {
    var bar = document.getElementById('quiz-chapbar');
    if (currentChap && META_BY_ID[currentChap]) { bar.innerHTML = chapHeadHTML(META_BY_ID[currentChap]); startTraining(META_BY_ID[currentChap].theme); }
    else { bar.innerHTML = ''; state.mode = 'menu'; render(); }
  }
  if (t === 'prog' || t === 'cours') window.scrollTo({top:0});
}
function clearChap(){ currentChap = null; }

function goCours(id){
  currentChap = id;
  showTab('cours');
  window.scrollTo({top:0, behavior:'smooth'});
}
function goCoursList(){ currentChap = null; showTab('cours'); }

function ficheHTML(id, num, open){
  var m = META_BY_ID[id]; var f = FICHE_BY_ID[id];
  return '<details class="fiche" id="fiche-' + id + '"' + (open ? ' open' : '') + '>' +
    '<summary><span class="fiche-num">' + num + '</span> Fiche — ' + esc(m.titre) + ' <span class="niv" style="font-size:.7rem;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-weight:700;margin-left:6px">' + esc(m.niveau) + '</span></summary>' +
    '<div class="fiche-body">' +
    '<div class="fiche-actions"><button class="btn-pdf" onclick="printFiche(\'' + id + '\')">🖨️ Imprimer</button><button class="btn-pdf" onclick="fichePDF(\'' + id + '\')">📄 PDF</button></div>' +
    '<div class="print-title">Fiche synthétique — ' + esc(m.titre) + ' (' + esc(m.niveau) + ')</div>' +
    f +
    '</div></details>';
}

function renderFiches(){
  var z = document.getElementById('fiches-zone'); var h = '';
  if (currentChap && FICHE_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += ficheHTML(currentChap, 1, true);
  } else {
    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
    var i = 1;
    FICHES_DATA.forEach(function(f){ h += ficheHTML(f.id, i); i++; });
  }
  z.innerHTML = h;
}

        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;
        var cl = ' ' + (c.className || '') + ' ';
        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }
        emitP();
        if (/^H[1-6]$/.test(g)) emitBlock('h', c, indent);
        else if (g === 'LI') emitBlock('li', c, indent + 14);
        else if (g === 'UL' || g === 'OL') {
          for (var li = c.firstChild; li; li = li.nextSibling){
            if (li.nodeType === 1 && li.tagName === 'LI') {
              emitBlock('li', li, indent + 14);
              for (var sub = li.firstChild; sub; sub = sub.nextSibling){
                if (sub.nodeType === 1 && (sub.tagName === 'UL' || sub.tagName === 'OL')){
                  for (var sli = sub.firstChild; sli; sli = sli.nextSibling){
                    if (sli.nodeType === 1 && sli.tagName === 'LI') emitBlock('li', sli, indent + 30);
                  }
                }
              }
            }
          }
        }
        else if (g === 'TABLE'){
          var rows = [];
          (function collectTbl(tn){
            for (var r = tn.firstChild; r; r = r.nextSibling){
              if (r.nodeType !== 1) continue;
              if (r.tagName === 'TR'){
                var cells = [], head = false;
                for (var td = r.firstChild; td; td = td.nextSibling){
                  if (td.nodeType !== 1) continue;
                  if (td.tagName === 'TD' || td.tagName === 'TH'){
                    if (td.tagName === 'TH') head = true;
                    var cs = []; pdfSegs(td, td.tagName === 'TH', cs);
                    cells.push(cs.map(function(x){ return x.t; }).join('').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
                  }
                }
                if (cells.length && cells.join('').replace(/\s/g, '') !== '') rows.push({ cells: cells, head: head });
              } else if (r.tagName === 'THEAD' || r.tagName === 'TBODY') collectTbl(r);
            }
          })(c);
          if (rows.length) blocks.push({ type: 'table', rows: rows, indent: indent });
        }
        else if (g === 'P') { emitBlock('p', c, indent); }

    }
    emitP();

  walk(root);

}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    if (b.type === 'title'){ lines.push({ banner: 1, title: b.segs.map(function(s){ return s.t; }).join(' ').replace(/\s+/g, ' ').trim() }); return; }
    if (b.type === 'table'){ lines.push({ table: b }); return; }
    var isTitle = b.type === 'title';
    var size = b.type === 'h' ? 12 : 10.5;
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [], spPend = false;
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) { words.push({ br: true }); spPend = false; }
        var toks = p.split(/( +)/);
        for (var ti = 0; ti < toks.length; ti++){
          var tk = toks[ti];
          if (tk === '') continue;
          if (/^ +$/.test(tk)) { spPend = true; continue; }
          words.push({ w: tk, b: s.b, sp: spPend });
          spPend = false;
        }
      });
    });
    var cur = [], len = 0, firstLn = true;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, h: b.type === 'h', li: (b.type === 'li' && firstLn), gap: (b.type === 'h' ? 10 : 5) }); cur = []; len = 0; firstLn = false; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last && wd.sp ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var COL = { ind: [0.31, 0.27, 0.90], lav: [0.93, 0.95, 1.00], bord: [0.80, 0.84, 0.88], gry: [0.45, 0.50, 0.60], wht: [1, 1, 1], blk: [0.13, 0.13, 0.15] };
  function rg(c){ return c[0] + ' ' + c[1] + ' ' + c[2] + ' rg'; }
  function RG(c){ return c[0] + ' ' + c[1] + ' ' + c[2] + ' RG'; }
  var pages = [], cur = [], y = TOP, curTitle = 'Fiche';
  function newPage(){ pages.push(cur); cur = []; y = TOP; }
  function T(x, yy, size, bold, s, col){
    var enc = pdfEnc(pdfTranslit(s));
    if (!enc) return;
    cur.push(rg(col) + ' BT 1 0 0 1 ' + x.toFixed(2) + ' ' + yy.toFixed(2) + ' Tm /F' + (bold ? 2 : 1) + ' ' + size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
  }
  function wrapCell(text, wpt, size){
    var budget = Math.max(6, Math.floor((wpt - 10) / (0.52 * size)));
    var outl = [], line = '';
    text.split(' ').forEach(function(w){
      if (w === '') return;
      if (line === '') line = w;
      else if ((line + ' ' + w).length <= budget) line += ' ' + w;
      else { outl.push(line); line = w; }
    });
    if (line !== '') outl.push(line);
    return outl.length ? outl : [''];
  }
  function renderTable(tbl){
    var rows = tbl.rows, indent = tbl.indent || 0, ts = 9, lh = ts * 1.35;
    var tw = W - 2 * M - indent;
    var ncol = 0; rows.forEach(function(r){ ncol = Math.max(ncol, r.cells.length); });
    var weights = [];
    for (var j = 0; j < ncol; j++){ var mx = 5; rows.forEach(function(r){ if (r.cells[j]) mx = Math.max(mx, r.cells[j].length); }); weights.push(mx); }
    var sum = 0; weights.forEach(function(w){ sum += w; });
    var widths = [], acc = 0;
    for (var j2 = 0; j2 < ncol; j2++){ var wpt = Math.max(52, tw * weights[j2] / sum); widths.push(wpt); acc += wpt; }
    var scale = tw / acc; widths = widths.map(function(w){ return w * scale; });
    var xs = [M + indent]; for (var j3 = 0; j3 < ncol; j3++) xs.push(xs[j3] + widths[j3]);
    rows.forEach(function(r){
      var wc = [], nl = 1;
      for (var j4 = 0; j4 < ncol; j4++){ var cl = wrapCell(r.cells[j4] || '', widths[j4], ts); wc.push(cl); nl = Math.max(nl, cl.length); }
      var rowH = nl * lh + 8;
      if (y - rowH < M + 22) newPage();
      var top = y, bot = y - rowH;
      if (r.head) cur.push(rg(COL.lav) + ' ' + (M + indent) + ' ' + bot.toFixed(2) + ' ' + tw.toFixed(2) + ' ' + rowH.toFixed(2) + ' re f');
      cur.push(RG(COL.bord) + ' 0.8 w');
      cur.push((M + indent) + ' ' + top.toFixed(2) + ' m ' + (M + indent + tw) + ' ' + top.toFixed(2) + ' l S');
      cur.push((M + indent) + ' ' + bot.toFixed(2) + ' m ' + (M + indent + tw) + ' ' + bot.toFixed(2) + ' l S');
      for (var j5 = 0; j5 <= ncol; j5++) cur.push(xs[j5].toFixed(2) + ' ' + top.toFixed(2) + ' m ' + xs[j5].toFixed(2) + ' ' + bot.toFixed(2) + ' l S');
      cur.push('0 0 0 RG 1 w');
      for (var j6 = 0; j6 < ncol; j6++){
        for (var k = 0; k < wc[j6].length; k++) T(xs[j6] + 5, top - ts - 4 - k * lh, ts, r.head, wc[j6][k], COL.blk);
      }
      y = bot;
    });
    y -= 6;
  }
  lines.forEach(function(ln){
    if (ln.banner){
      if (y - 46 < M) newPage();
      var bh = 42;
      curTitle = ln.title || 'Fiche';
      cur.push(rg(COL.ind) + ' ' + M + ' ' + (y - bh).toFixed(2) + ' ' + (W - 2 * M) + ' ' + bh + ' re f');
      T(M + 14, y - 21, 14, true, curTitle, COL.wht);
      T(M + 14, y - 33, 8.5, false, 'Fiche synth\u00e9tique' + (typeof PDF_MATIERE !== 'undefined' && PDF_MATIERE ? ' \u2014 ' + PDF_MATIERE : ''), COL.wht);
      y -= bh + 14;
      return;
    }
    if (ln.table){ renderTable(ln.table); return; }
    var lh2 = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh2 - (ln.h ? 12 : 0) < M + 22) newPage();
    y -= (ln.gap || 0);
    if (ln.h){
      y -= 2;
      var bh3 = ln.size + 10;
      cur.push(rg(COL.lav) + ' ' + M + ' ' + (y - ln.size - 3).toFixed(2) + ' ' + (W - 2 * M) + ' ' + bh3 + ' re f');
      y -= ln.size * 1.05;
      var hx = M + 8, prevEnd = true;
      ln.segs.forEach(function(s){
        if (!s.t) return;
        var enc2 = pdfEnc(pdfTranslit(s.t));
        if (!enc2) return;
        var gapSp = (hx > M + 8 && !prevEnd && s.t.charAt(0) !== ' ') ? 1 : 0;
        T(hx + 0.52 * ln.size * gapSp, y, ln.size, true, s.t, COL.ind);
        hx += 0.52 * ln.size * (enc2.length + gapSp);
        prevEnd = / $/.test(s.t);
      });
      y -= ln.size * 0.37 + 3;
      return;
    }
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    if (ln.li) T(x - 11, y, ln.size, false, '\u2022', COL.ind);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      T(x, y, ln.size, s.b, s.t, COL.blk);
      x += 0.52 * ln.size * pdfEnc(pdfTranslit(s.t)).length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  for (var p = 0; p < pages.length; p++){
    var pgFoot = 'Fiche synth\u00e9tique' + (typeof PDF_MATIERE !== 'undefined' && PDF_MATIERE ? ' \u2014 ' + PDF_MATIERE : '') + ' \u2014 ' + curTitle;
    var fx = M, fw = 0.52 * 7.5 * pdfEnc(pdfTranslit(pgFoot)).length;
    pages[p].push(rg(COL.gry) + ' BT 1 0 0 1 ' + fx + ' 30 Tm /F1 7.5 Tf (' + pdfEsc(pdfEnc(pdfTranslit(pgFoot))) + ') Tj ET');
    var pn = 'Page ' + (p + 1) + ' / ' + pages.length;
    var pw = 0.52 * 7.5 * pn.length;
    pages[p].push('BT 1 0 0 1 ' + (W - M - pw).toFixed(2) + ' 30 Tm /F1 7.5 Tf (' + pdfEsc(pn) + ') Tj ET');
  }
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p2 = 0; p2 < pages.length; p2++){
    var po = 5 + 2 * p2, co = 6 + 2 * p2;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p2].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i2 = 1; i2 < objs.length; i2++){
    offs[i2] = out.length;
    if (objs[i2].indexOf('STREAM:') === 0){
      var st = objs[i2].slice(7);
      out += i2 + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i2 + ' 0 obj\n' + objs[i2] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i3 = 1; i3 < objs.length; i3++) out += ('0000000000' + offs[i3]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « » ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();
