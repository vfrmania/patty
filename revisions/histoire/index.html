  "fiche": "\n<h3>📌 L\'essentiel</h3>\n<p><b>1947</b> : doctrine Truman (endiguement) / doctrine Jdanov ; plan Marshall vs Kominform ; Berlin (blocus 1948-49), OTAN 1949 / pacte de Varsovie 1955.</p>\n<p><b>Crises</b> : Corée (1950-53), mur de Berlin (1961), Cuba (octobre 1962, dissuasion), Vietnam (1965-1975), Afghanistan (1979-89).</p>\n<p><b>Tiers monde</b> : Bandung 1955, non-alignement, décolonisation.</p>\n<p><b>Détente puis effondrement</b> : SALT 1972, Helsinki 1975 ; nouvelle guerre froide (Euromissiles, Reagan) ; Gorbatchev (glasnost, perestroïka) ; chute du mur (9 novembre 1989), réunification (3 octobre 1990), fin de l\'URSS (25 décembre 1991).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Vocabulaire</b> : bipolarité, endiguement, dissuasion, détente, glasnost, perestroïka, non-alignement.</li>\n<li><b>Logique des blocs</b> : pour chaque événement, situer camp, outils (alliance, aide, propagande), lieu (Europe ou tiers monde).</li>\n<li><b>Carte mentale</b> : deux blocs + un tiers monde convoité.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Guerre froide = pas d\'affrontement direct USA-URSS.</li>\n<li>Mur construit en 1961 pour empêcher la fuite des Allemands de l\'Est.</li>\n<li>La chute du mur ne met pas fin à l\'URSS : c\'est 1991.</li>\n</ul>"
 },
 {
  "id": "monde-1990",
  "fiche": "\n<h3>📌 L\'essentiel</h3>\n<p><b>1991-2001</b> : hyperpuissance américaine ; guerre du Golfe (1991), ONU retrouvée ; espoirs (Oslo 1993, Mandela 1994) mais guerres yougoslaves et génocide rwandais (1994) ; mondialisation (OMC 1995, Internet, Chine).</p>\n<p><b>Depuis 2001</b> : 11 septembre → guerre contre le terrorisme (Afghanistan 2001, Irak 2003) ; printemps arabes (2011), Syrie, Daech, crises migratoires.</p>\n<p><b>Multipolarité</b> : Chine (Xi Jinping, routes de la soie), Russie (Crimée 2014, Ukraine 2022), Inde, Turquie ; ONU bloquée, enjeux globaux (climat, pandémies, technologies).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Vocabulaire</b> : hyperpuissance, unipolaire/multipolaire, mondialisation, terrorisme, soft power, multilatéralisme.</li>\n<li><b>Tournant</b> : prouver un tournant (avant/après, échelles multiples).</li>\n<li><b>Puissance</b> : l\'évaluer sur tous les registres (économie, militaire, culture, influence).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Le « nouvel ordre mondial » est une promesse de 1991, pas une réalité durable.</li>\n<li>Ne pas confondre Al-Qaïda (2001) et Daech (2014).</li>\n<li>La mondialisation crée richesses ET inégalités : toujours les deux faces.</li>\n</ul>"
 }
];
var QUESTIONS = [{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident (Collège)","q": "La démocratie athénienne du Ve siècle av. J.-C. :","c": ["concerne tous les habitants","ressemble à la nôtre","est une dictature","est une démocratie DIRECTE mais RESTREINTE (citoyens = hommes libres nés de parents athéniens : femmes, esclaves et métèques exclus)"],"a": 3,"e": "Les citoyens votent eux-mêmes les lois à l'Ecclésie (directe) MAIS une minorité de la population est citoyenne.","d": "<b>Directe et restreinte</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul : à Athènes vers 450, sur environ 250 000 habitants, à peine 40 000 sont des citoyens (hommes libres de plus de 18 ans, nés de deux parents athéniens après Périclès) : les femmes (la moitié de la ville), les esclaves (près d'un tiers) et les métèques (étrangers installés, comme Lysias) sont HORS du politique : le mot « démocratie » (dêmos kratos : pouvoir du peuple) est donc exact et trompeur à la fois : les institutions (Ecclésie : vote à main levée : la majorité : le tirage au sort pour les charges) sont révolutionnaires pour l'époque, mais l'inclusion est étroite. Piège : ne jamais écrire que les Athéniens ont inventé la démocratie « de tous » : la précision « citoyens seulement » est TOUJOURS attendue au brevet.</div>"},
{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident (Collège)","q": "Les guerres médiques opposent :","c": ["Rome et Carthage","les cités grecques à l'EMPIRE PERSE (Marathon 490, Salamine 480)","la Gaule et Rome","Athènes et Sparte"],"a": 1,"e": "Les Perses (Darius puis Xerxès) envahient la Grèce : victoires grecques de Marathon (490) et Salamine (480) : mythe fondateur de la liberté grecque.","d": "<b>Grecs contre Perses</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le récit : en 490, Darius débarque à Marathon : les hoplites athéniens (phalange lourdement armée) écrasent les Perses : le messager court annoncer la victoire (le « marathon » moderne) : en 480, Xerxès revient avec une armée immense : Thermopyles (les 300 Spartiates de Léonidas) puis <b>Salamine</b> : la flotte athénienne de Thémistocle détruit la flotte perse dans le détroit : Athènes sort de ces guerres en tête de la ligue de Délos (empire maritime : trésor transféré à Athènes : construction du Parthénon) : les « guerres médiques » (Mèdes = Perses) fondent l'identité grecque (libres contre les rois despotiques). Piège : ne pas confondre avec les guerres puniques (Rome contre Carthage : 264-146).</div>"},
{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident (Collège)","q": "En 212, l'édit de Caracalla :","c": ["accorde la CITOYENNETÉ romaine à tous les habitants libres de l'Empire","divise l'Empire","interdit le christianisme","crée le Sénat"],"a": 0,"e": "La citoyenneté romaine s'étend des riches notables à tout l'Empire : la romanisation juridique unifie (fiscalité comprise : motivation aussi financière).","d": "<b>Citoyenneté pour tous les hommes libres</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : la République réservait la citoyenneté aux Romains puis aux Italiques (guerre sociale : 90 av. J.-C.) : l'Empire l'accorde progressivement aux élites provinciales (Gaulois : notables : l'empereur Claude plaide pour l'ouverture : « tout ce qu'il y a de bon dans le monde ») : en 212, <b>Caracalla</b> généralise (Constitutio Antoniniana) : millions de provinciaux deviennent citoyens (droits : procès : protection : mais aussi impôts) : l'Empire devient une communauté de droit : c'est la force de l'intégration romaine (contre l'empire athénien : dominant ses alliés). Piège : l'édit ne concerne PAS les esclaves (non libres) : et l'extension sert aussi à élargir la base fiscale (l'héritage et les taxes de Caracalla : le « mollesse » du préfet Cassius Dion sur les motivations).</div>"},
{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident (Collège)","q": "La République romaine (509-27 av. J.-C.) se caractérise par :","c": ["un empereur absolu","un royaume héréditaire","une démocratie directe","des MAGISTRATS élus (consuls), un Sénat et des assemblées : équilibre des pouvoirs"],"a": 3,"e": "Après la chute des rois, Rome institue un régime mixte : consuls (pouvoir exécutif, 2, élus 1 an : garde-fou contre le retour d'un tyran), Sénat (aristocratie), assemblées (votes).","d": "<b>Consuls + Sénat + assemblées</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le fonctionnement : ① les <b>consuls</b> commandent l'armée et président : ils sont DEUX et élus pour UN an (chacun peut bloquer l'autre : l'intercession) : ② le <b>Sénat</b> (les patriciens puis les nobles) oriente la politique extérieure et les finances : c'est la mémoire de l'État ③ les <b>assemblées centuriates et tribunes</b> élisent les magistrats et votent les lois : la plèbe obtient ses représentants (les <b>tribuns de la plèbe</b> : intouchables sacro-saints : véto) : l'équilibre (Polybe admire cette « constitution mixte ») évite la tyrannie : jusqu'à ce que les conquêtes et les richesses dérèglent la machine (les Gracques : Marius : Sylla : César). Piège : le mot « République » (res publica : la chose publique) désigne le RÉGIME, pas une élection au suffrage universel : le vote est censitaire (par centuries riches) et les femmes exclues.</div>"},
{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident (Collège)","q": "L'édit de Milan (313) :","c": ["interdit les jeux","instaure le latin","accorde la LIBERTÉ de culte aux chrétiens (Constantin : le christianisme cesse d'être persécuté)","fonde Constantinople"],"a": 2,"e": "Constantin, avant la bataille du pont Milvius (312), choisit le signe du Christ : en 313 avec Licinius, la liberté de culte est proclamée : le christianisme passe de secte persécutée à religion protégée puis d'État (Théodose, 380).","d": "<b>Liberté de culte</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la trajectoire : ① jusqu'au IIIe siècle : les chrétiens sont sporadiquement persécutés (Néron en 64 : les « martyrs » : refus du culte impérial : « Proclamer César Seigneur » : l'Église refuse : Dèce 250 : Dioclétien 303 : la grande persécution) ② le <b>tournant constantinien</b> : en 312, Constantin vainc Maxence au pont Milvius (vision du signe : In hoc signo vinces) : en 313, l'édit de Milan (avec Licinius) : « que les chrétiens et tous les autres aient la liberté de suivre la religion de leur choix » : restitution des biens ③ la suite : Constantin bâtir (églises du Latran, Saint-Pierre), le concile de Nicée (325 : il préside : le Credo : le trinitarisme fixé), <b>Théodose</b> (380 : édit de Thessalonique : christianisme religion d'État : cultes païens interdits) : l'Empire et l'Église s'épousent : le pape Léon Ier négociera avec Attila (452) : la papauté prend le relais. Piège : ne pas confondre édit de Milan (liberté) et édit de Thessalonique (religion d'ÉSTATE : 380).</div>"},
{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident (Collège)","q": "La Pax Romana désigne :","c": ["un impôt","une route","un traité de paix","la période de STABILITÉ et de prospérité de l'Empire (Auguste, 27 av. J.-C. → Marc Aurèle, 180)"],"a": 3,"e": "Deux siècles d'ordre romain : frontières protégées (limes), commerce florissant, urbanisation : la sécurité paie la prospérité.","d": "<b>Deux siècles de stabilité impériale</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les ingrédients : ① la <b>sécurité</b> : les légions tiennent les frontières (le limes : Rhin : Danube : mur d'Hadrien en Bretagne : 122) : les provinces ne se battent plus entre elles ② les <b>infrastructures</b> : 80 000 km de routes, des ports, des aqueducs (Nemausus : le pont du Gard : 50 km d'eau par jour à Nîmes) : les marchandises circulent (blé : huile : vin : garum : céramique sigillée) ③ l'<b>administration</b> : le droit (contrats), la monnaie (le denier), la poste impériale : un Gallus (Gaulois) devient sénateur sous Claude : la romanisation intègre : le résultat : une population qui croît (60 millions ?) : les villes embellissent (Pompéi : thermes : théâtres) : jusqu'au IIIe siècle (épidémies : invasions : crise de 235-284 : l'armée nomme les empereurs) : la Pax Romana est l'argument massue des « bienfaits » de l'Empire (contre l'image de Rome : la destruction). Piège : la paix est une paix ARMÉE : les guerres aux marges : Daces : Parthes : révoltes (les Juifs : 70 : destruction du Temple : la diaspora) : « paix » ne veut pas dire absence de violence.</div>"},
{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident (Collège)","q": "La christianisation de l'Empire s'accompagne de :","c": ["l'interdiction des écoles","la fin de l'écriture","la disparition du latin","une nouvelle culture ÉCRITE (les copies de la Bible, les Pères de l'Église : l'évêque administre la ville : les monastères naissent)"],"a": 3,"e": "L'Église structure : évêques (sièges urbains : Rome : légitimité de Pierre), conciles (Nicée 325 : doctrine), moines (Antoine en Égypte : puis Benoît au Ve s. : la règle : ora et labora) : une culture et une organisation qui survivront à l'Empire.","d": "<b>Une Église structurée et lettrée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : ① les <b>évêques</b> succèdent aux notables urbains : les cités déclinent : l'évêque garde les registres, nourrit les pauvres, rachète les captifs (saint Ambroise : Milan : saint Augustin : Hippone) ② les <b>conciles</b> fixent la croyance (Nicée 325 : le Fils « de même substance » : le Credo : Constantin finance) ③ les <b>moines</b> : fuite du monde (Antoine : Pachôme : les déserts d'Égypte) : en Occident, <b>Benoît</b> (Mont-Cassin : vers 530 : la Règle : prier et travailler : ora et labora) : les monastères copient les textes antiques (les scriptoria) : défrichent : accueillent : l'Église devient l'héritière qui transmet (le latin devient langue savante : les clercs seuls lettrés : la culture passe par l'église). Piège : la christianisation n'efface pas tout : les campagnes restent « païennes » longtemps (pagus = le village : le paganisme) : les évangélisateurs récupèrent les cultes (les sources sacrées deviennent des sanctuaires mariaux) : la conversion est lente et négociée.</div>"},
{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident (Collège)","q": "Les jeux olympiques antiques étaient :","c": ["un divertissement moderne","un entraînement militaire secret","une fête romaine","une fête RELIGIEUSE panhellénique (776 av. J.-C. : trêve sacrée : concours en l'honneur de Zeus)"],"a": 3,"e": "Toutes les cités grecques y envoient des athlètes (panhellenisme : l'identité grecque commune) : la trêve olympique suspend les guerres : les vainqueurs reçoivent l'olivier et la gloire de leur cité.","d": "<b>Une fête religieuse panhellénique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le protocole : tous les 4 ans à Olympie (Péloponnèse : sanctuaire de Zeus : la statue chryséléphantine : une des 7 merveilles) : la <b>trêve sacrée</b> (ekecheiria : les mains levées) suspend les combats pour laisser passer athlètes et spectateurs (jusqu'à 40 000 personnes) : les épreuves (stadion : course à pied : lutte : pankration : pentathlon : course de chars) se déroulent NUS (gymnos) : seuls les hommes libres Grecs (les barbares exclus) : les vainqueurs reçoivent une couronne d'olivier (l'astuce de la ville de Mistra ?) et surtout l'HONNEUR (statues : odes : Pindare : repas gratuit à vie : la cité creuse une brèche dans ses murailles pour les faire entrer) : la fête affirme l'unité Grecque au-delà des cités rivales (quatre sites panhelléniques : Olympie : Delphes : Isthme : Némée). Piège : l'esprit du concours est religieux (le corps beau honore Zeus) et civique (la gloire de la cité) : le professionnalisme arrive tard (à l'époque romaine) : la trêve ne « supprime » pas les guerres : elle les suspend autour de la fête.</div>"},
{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident (Collège)","q": "L'Empire romain se divise en deux en 395 :","c": ["Orient (capitale Constantinople : survit jusqu'en 1453) et Occident (chute en 476)","cité et campagne","Gaule et Germanie","nord et sud"],"a": 0,"e": "Théodose meurt en 395 : l'Empire est partagé entre ses deux fils : Arcadius (Orient : grec : riche : Byzance) et Honorius (Occident : latin : envahi) : deux destins opposés.","d": "<b>Orient / Occident</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le partage : depuis Dioclétien (Tétrarchie : 293), l'Empire s'administre en deux parties pour faire face aux invasions : en 395 la division devient DÉFINITIVE : ① l'<b>Orient</b> (Byzance : le grec : Constantinople « la Nouvelle Rome » : les greniers à blé de l'Égypte : les finances solides : les remparts) résiste : <b>1453</b> (prise par les Ottomans) ② l'<b>Occident</b> : le latin : trésor vidé : les Wisigoths (410 : sac de Rome : le « retentissant » de saint Jérôme), les Vandales (455 : second sac : « vandalisme »), les Huns (Attila : repoussé aux champs Catalauniques 451 puis par le pape Léon) : <b>476</b> : le dernier empereur (Romulus Augustule : le nom prédestiné !) est déposé : les royaumes barbares se partagent l'Italie, la Gaule (Clovis), l'Espagne, l'Afrique : deux mondes : l'un continue l'Empire (Byzance : Justinien tente la reconquête : le Code justinien), l'autre repart sur des bases nouvelles (royaumes + Église). Piège : « chute de Rome » en 476 = Occident SEULEMENT : la question de vocabulaire « Empire romain d'Orient » vs « d'Occident » est systématiquement piégée.</div>"},
{"t": "L'Antiquité : Grèce, Rome et la naissance de l'Occident (Collège)","q": "Le principal héritage romain en Occident est :","c": ["le DROIT (fondement des droits européens), le latin (langues romanes) et le christianisme (via l'Église)","les dieux olympiens","le gothique","les pharaons"],"a": 0,"e": "L'Empire disparaît mais son droit (le Code justinien redécouvert au Moyen Âge fonde le droit continental), sa langue (le latin devient le français, l'espagnol, l'italien...) et sa religion (l'Église romaine) structurent l'Europe.","d": "<b>Droit + langue + religion</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le triptyque : ① le <b>droit</b> : la distinction personne/chose, le contrat, la présomption : le Code de Justinien compilé vers 530 : redécouvert à Bologne vers 1080 : la renaissance juridique : Napoléon s'en inspire (le Code civil de 1804 : « la raison écrite ») ② la <b>langue</b> : le latin parlé évolue (les sermons de saint Césaire d'Arles ~500 : déjà du « roman ») : les langues romanes (l'italien : l'espagnol : le portugais : le roumain : le français : les Serments de Strasbourg 842 : premier texte « en romana lingua ») : le latin reste la langue savante (l'Église : les universités : le Droit : la science jusqu'au XVIIe) ③ la <b>religion</b> : l'Église romaine (l'évêque de Rome : le pape : la succession de Pierre : l'autorité morale : la chrétienté médiévale) : la carte de l'Europe se dessine sur ces trois socles : question type : « montrez que l'Empire romain a durablement marqué l'Europe » : les trois axes sont la trame de la réponse. Piège : ne pas réduire Rome à ses conquêtes (l'essentiel est juridique et culturel : le droit : la langue : la foi).</div>"},
{"t": "Le Moyen Âge : féodalité, Église et croisades (Collège)","q": "Le baptême de Clovis (~496) est un événement majeur car :","c": ["il a lieu à Paris","il fait de lui un empereur","il fonde Paris","il allie la ROYAUTÉ franque à l'ÉGLISE catholique (légitimité : appui du clergé gallo-romain : modèle des rois chrétiens)"],"a": 3,"e": "Clovis choisit le catholicisme (contre les autres peuples barbares ariens) : l'évêque Remi l'oigne à Reims : le roi reçoit une légitimité religieuse et l'appui des élites romaines de Gaule.","d": "<b>Royaute + Église : l'alliance fondatrice</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le contexte : les Wisigoths et les Burgondes sont <b>ariens</b> (hérésie : le Christ inférieur au Père : en conflit avec les évêques catholiques) : Clovis, païen, épouse Clotilde (une princesse catholique burgonde : elle insiste pour baptiser les enfants) : après la victoire de Tolbiac (496 : contre les Alamans : l'invocation au « Dieu de Clotilde »), il est baptisé à <b>Reims</b> par l'évêque <b>Remi</b> (« Courbe la tête, fier Sicambre : adore ce que tu as brûlé, brûle ce que tu as adoré ») : les conséquences : ① la <b>légitimité</b> (le roi chrétien : oint : le modèle des rois de France : Reims deviendra la ville du sacre jusqu'à Charles X) ② l'<b>alliance</b> avec le clergé gallo-romain (les évêques administrent : les cadres romains servent les Francs) ③ la <b>fusion</b> progressive des deux peuples (la loi salique : le droit romain : les mariages) : contre les Goths ariens, il gagne la loyauté des catholiques (victoire de Vouillé 507 : l'Aquitaine). Piège : le baptême est un ACTE POLITIQUE autant que personnel : ne jamais le raconter comme une simple anecdote pieuse.</div>"},
{"t": "Le Moyen Âge : féodalité, Église et croisades (Collège)","q": "La relation vassalique repose sur :","c": ["le sang","l'élection","le contrat PERSONNEL hommage-fidélité-fief (protection du seigneur contre services du vassal)","l'argent"],"a": 2,"e": "L'hommage (geste des mains), le serment de fidélité (sur les reliques), le fief (la terre donnée) : des obligations réciproques, homme à homme.","d": "<b>Hommage + fidélité + fief</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cérémonial (décrit par Galbert de Bruges, 1127) : le vassal s'agenouille, <b>joint ses mains</b> et les place dans celles du seigneur (l'immixtion des mains) : il prononce « je veux être votre homme » : l'hommage ② le seigneur l'embrasse (le baiser de paix) : le vassal jure sur les <b>reliques</b> (le serment : Dieu témoin : parjure = damnation) ③ l'investiture du <b>fief</b> (une motte, une terre, un droit de péage : le fief « mouvant » revient au seigneur si la lignée s'éteint) : les obligations : le vassal doit l'<b>aide</b> (40 jours de service militaire par an), le <b>conseil</b> (la cour : la justice du seigneur), la rançon et le mariage de la fille : le seigneur doit la <b>protection</b> (château : armée) et l'entretien (le fief) : le système est réciproque et hiérarchisé (un vassal a lui-même des vassaux : la pyramide : « le vassal de mon vassal n'est pas mon vassal ») : la société politique est un RÉSEAU de contrats personnels (pas un État abstrait). Piège : la féodalité n'est pas l'anarchie : les règles sont strictes (la rupture = le « felonie » : le fief confisqué) et l'Église tente de la moraliser (la Paix de Dieu : protection des clercs : paysans : marchands).</div>"},
{"t": "Le Moyen Âge : féodalité, Église et croisades (Collège)","q": "La société médiévale se représente en trois ordres :","c": ["oratores (ceux qui PRIENT), bellatores (ceux qui COMBATTENT), laboratores (ceux qui TRAVAILLENT)","clercs : juges : marchands","roi : reine : peuple","nobles : paysans : bourgeois"],"a": 0,"e": "La tripartition fonctionnelle (prier : combattre : travailler) justifie l'inégalité : chacun à sa place pour le salut commun : l'Église bénit cet ordre (Adalbéron de Laon, vers 1020).","d": "<b>Oratores, bellatores, laboratores</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la construction idéologique : vers 1020, l'évêque <b>Adalbéron de Laon</b> : « la maison de Dieu est une, triple pourtant : les uns prient, les autres combattent, les autres travaillent » : ① les <b>oratores</b> (le clergé : les moines : les chanoines) : ils intercèdent pour tous (la messe : les prières : la grâce) ② les <b>bellatores</b> (la noblesse) : ils protègent (la guerre : la justice : le château) : l'ordre chevaleresque (l'adoubement : le jeune homme : 14-18 ans : le bain symbolique : la veillée d'armes : le colée : les promesses) ③ les <b>laboratores</b> (les paysans : la masse : plus de 90 %) : ils nourrissent (les corvées : les banalités : le moulin banal : le four banal) : la dîme et le cens alimentent les deux premiers ordres : la fonction du schéma : JUSTIFIER l'inégalité (une hiérarchie voulue par Dieu : l'harmonie du corps social : la tête commande : les membres obéissent) : les « rebelles » (les hérétiques : les paysans révoltés) brisent l'ordre voulu. Piège : la tripartition EXCLUT délibérément les villes et le commerce (le bourgeois « stérile » naissant au XIIe : l'usure condamnée) : le schéma se fissure avec l'essor urbain (les Lombards : les foires de Champagne : les juifs relégués au crédit).</div>"},
{"t": "Le Moyen Âge : féodalité, Église et croisades (Collège)","q": "En 1095, à Clermont, Urbain II :","c": ["excommunie l'empereur","prêche la PREMIÈRE CROISADE (délivrer Jérusalem : « Dieu le veut ! » : indulgence pour les croisés)","couronne un roi","fonde une université"],"a": 1,"e": "Le pape mobilise la chevalerie contre les Turcs Seldjoukides (menace sur les pèlerins et Byzance) : la foule crie « Dieu le veut » (Deus lo vult) : la croisade naît.","d": "<b>L'appel de Clermont</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le contexte : ① l'empereur byzantin <b>Alexis Comnène</b> (battu à Manzikert 1071 par les Turcs) appelle le pape à l'aide (des mercenaires : pas une armée de foule !) ② <b>Urbain II</b> (un clunisien : pape réformateur : la « trêve de Dieu ») traverse la France (la paix réformée : les seigneurs battus) : le 27 novembre 1095, au concile de Clermont : « Que ceux qui veulent combattre les bêtes sauvages au milieu des bois s'en viennent combattre les infidèles : le voyage vaut mieux que le péché » (les versions d'après : Foucher de Chartres : Robert le Moine) : la foule : « <b>Deus lo vult !</b> » ③ le message : l'<b>indulgence</b> (la remise de la pénitence : le pèlerinage armé = pénitence) : la protection de la famille du croisé (l'Église garde sa maison) : le salut du guerrier (le chevalier violent devient miles Christi) : la 1re croisade (1096-1099) : la « croisade populaire » (Pierre l'Ermite : massacres des juifs du Rhin : anéantie en Anatolie) puis la croisade des princes (Godefroy de Bouillon : prise de Nicée : Antioche : <b>Jérusalem le 15 juillet 1099</b> : un massacre) : les États latins. Piège : les motivations sont PLURIELLES (religieuses : sociales : économiques : les cadets sans terre : les aventuriers : les marchands italiens) : ne jamais réduire à « la foi seule » ni à « la soif d'or » : les deux ensemble.</div>"},
{"t": "Le Moyen Âge : féodalité, Église et croisades (Collège)","q": "La 4e croisade (1202-1204) aboutit au sac de Constantinople : cela montre que :","c": ["Jérusalem a été reprise","les Byzantins étaient musulmans","la croisade peut être DÉTOURNÉE de son but religieux par des intérêts (la dette aux Vénitiens : les promesses byzantines)","les papes sont impuissants"],"a": 2,"e": "Les croisés, endettés envers Venise, prennent Zara (chrétienne) puis Constantinople (chrétienne) : l'idéal croisé est compromis : le schisme avec les Grecs devient irréparable.","d": "<b>Le détournement vénitien</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme tragique : ① le contrat : les barons (Boniface de Montferrat) louent à <b>Venise</b> (le doge Enrico Dandolo : aveugle : rancune anti-byzantine) une flotte pour 85 000 marcs d'argent ② l'impasse : l'armée arrive : moins de monde que prévu : la dette (34 000 manquants) : Dandolo propose un détour : <b>Zara</b> (1202 : ville chrétienne de Hongrie : le pape excommunie les croisés... puis les relève) ③ la chute : Alexis, prétendant byzantin, promet 200 000 marcs + l'union des Églises si on le remet sur le trône : Constantinople est prise (juillet 1203) : la population se révolte : <b>le sac, avril 1204</b> : trois jours de pillage (les reliques byzantines partent pour l'Occident : les chevaux de bronze de l'Hippodrome décorent désormais San Marco) : l'« empire latin » (1204-1261) : Byzance reprend sa capitale mais ne s'en remettra pas (l'affaiblissement prépare 1453) : les Grecs ne pardonneront jamais (« mieux le turban que la tiare »). Piège : la question type est « montrez que les motivations réelles dépassent le motif religieux » : réponse = la dette vénitienne + les rivalités commerciales + les promesses dynastiques : le tout ENSEVELI sous le discours de la foi.</div>"},
{"t": "Le Moyen Âge : féodalité, Église et croisades (Collège)","q": "Les Templiers étaient :","c": ["des moines","des paysans","des marchands vénitiens","des MOINES-SOLDATS (ordre religieux et militaire fondé en 1129 : protection des pèlerins et des routes de Terre sainte : supprimé en 1312)"],"a": 3,"e": "La « militia Christi » combine les vœux monastiques et la guerre : le concile de Troyes approuve la règle (Bernard de Clairvaux : « De laude novae militiae ») : ils deviennent aussi des banquiers (les lettres de change : les dépôts royaux) : Philippe le Bel les supprime (1307-1312 : procès : aveux sous torture : la malédiction de Jacques de Molay).","d": "<b>Des moines-soldats</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la trajectoire : ① la naissance (1119 : Hugues de Payns et 8 chevaliers : protéger les pèlerins sur la route de Jérusalem) : le concile de <b>Troyes (1129)</b> : la règle (bernardine : le manteau blanc : la croix rouge : les vœux : obéissance : pauvreté : chasteté : ET la guerre juste : tuer l'infidèle « non homicide : malecide » : Bernard approuve le meurtre légitime du Sarrasin !) ② l'essor : les forteresses (le krak des Chevaliers est plutôt hospitalier : mais les templiers tiennent Gaza : Acre : le Temple de Paris : la tour du Temple) : le <b>crédit</b> (le pèlerin dépose à Paris, retire à Jérusalem : la lettre de change : la flotte : le trésor royal confié au Temple) : les privilèges (exempts de la dîme : réponse uniquement au pape) ③ la chute : Philippe le Bel, endetté et désireux d'une police royale unique, fait arrêter tous les templiers le 13 octobre 1307 (les aveux sous torture : l'adoration d'une tête : le baiser obscène : les charges : l'homosexualité : l'idolâtrie) : le concile de Vienne (1312) supprime l'ordre (Clément V : le procès de « dévolution ») : Jacques de <b>Molay</b> brûlé (1314 : « vous serez tous morts dans l'année » : Clément et Philippe meurent dans l'année : la légende) : les biens aux Hospitaliers. Piège : les Templiers ne sont pas « les inventeurs de la finance » seuls (les Lombards : les Cahorsins) : leur banque est une extension de la logistique du pèlerinage.</div>"},
{"t": "Le Moyen Âge : féodalité, Église et croisades (Collège)","q": "La « révolution agricole » du Moyen Âge central comprend :","c": ["les chemins de fer","les tracteurs","la CHARRUE à versoir, les moulins à eau/vent, la rotation triennale, le défrichage (les clairières : les abbayes)","les engrais chimiques"],"a": 2,"e": "Assolement triennal (céréales d'hiver : céréales de printemps : jachère), charrue lourde (qui retourne la terre : les sols lourds du Nord cultivables), le moulin (l'énergie) : la population double entre 1000 et 1300 !","d": "<b>Charrue + moulin + triennial + défrichements</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les chiffres : la population de la France passe d'environ 5 millions (vers l'an mil) à 15-20 millions (vers 1300) : les gains : ① la <b>charrue à versoir</b> : l'araire ancienne ne grattait pas : la charrue RETOURNE (le versoir : la roue avant) : les grosses glèbes du Bassin parisien deviennent des greniers ② l'<b>assolement triennal</b> (an 1 : blé d'hiver : an 2 : avoine/pois : an 3 : jachère labourée : contre l'épuisement : plus de rendements : la vachette fournit le fumier) ③ le <b>moulin</b> : seigneurial : banal : le paysan paye le « ban » pour moudre : l'énergie hydraulique remplace les bras : 20 000 moulins dans le Domesday anglais (1086) ! ④ les <b>défrichements</b> : les « essarts » : les abbayes cisterciennes : les plateaux de l'Île-de-France : les « villes neuves » (villeneuves) à charte de franchise : les paysans fuient les seigneuries lourdes vers ces libertés : le résultat : moins de famines (jusqu'aux grandes famines 1315-1317 : le « petit âge glaciaire » : la Grande Famine) puis la peste noire (1347 : la moitié de la population !). Piège : le mouvement va CYCLES : expansion (1000-1300) : crises (XIVe : famine : guerre de Cent Ans : peste : révoltes) : ne jamais croire à une croissance linéaire.</div>"},
{"t": "Le Moyen Âge : féodalité, Église et croisades (Collège)","q": "Le sacre de Charlemagne (25 décembre 800) :","c": ["le pape Léon III le couronne EMPEREUR à Rome (renouveau de l'idée impériale en Occident : légitimation du pouvoir par l'Église)","le fait roi des Francs","a lieu à Aix","instaure l'islam"],"a": 0,"e": "La couronne « romaine » est conférée au roi des Francs : l'Occident a de nouveau un « empereur des Romains » : Byzance proteste (le « problème des deux empereurs ») : le modèle durera (l'Empire romain germanique en 962).","d": "<b>Empereur par la grâce de Dieu et du pape</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la scène : à Rome, le 25 décembre 800, pendant la messe de Noël à Saint-Pierre, Charlemagne agenouillé : le pape <b>Léon III</b> (qu'il a aidé à restaurer : la foule romaine venait de l'écharper) dépose la couronne sur sa tête : le choeur chante : « À Charles, Auguste, couronné de Dieu, grand et pacifique empereur des Romains, vie et victoire ! » : les enjeux : ① la <b>légitimité</b> : le titre CONFÉRÉ par le pape : l'empereur protège l'Église : l'alliance du trône et de l'autel : la « translation de l'empire » théorisée (le pape a le droit de conférer : les papes en useront !) ② le <b>modèle</b> (renouveau de l'Antiquité : la « renaissance carolingienne » : Alcuin : l'école du palais : l'écriture minuscule caroline : les scriptoria : les corrections des textes) ③ l'<b>administration</b> : les missi dominici : les enquêteurs royaux : les capitulaires (les lois par chapitres) : la monnaie (le denier d'argent) : le « gouvernement » itinérant du palais d'Aix ④ la <b>fragilité</b> (l'empire est trop vaste : les raids normands : la mort de Louis le Pieux : le partage de Verdun 843 : la France/Germanie/Lotharingie). Piège : ne pas confondre le couronnement de 800 avec le traité de Verdun (843) : ni avec l'Empire romain germanique (962 : Otton).</div>"},
{"t": "Le Moyen Âge : féodalité, Église et croisades (Collège)","q": "La croissance des villes à partir du XIIe siècle s'accompagne de :","c": ["la disparition de l'Église","l'abandon des campagnes","la fin des seigneurs","des LIBERTÉS URBAINES (chartes de franchises : communes : échevins : métiers : foires) et d'une nouvelle société (les bourgeois)"],"a": 3,"e": "La « révolution urbaine » : les bourgeois achètent ou arrachent des chartes (Laon 1112 : la commune !), les métiers s'organisent, les foires (Champagne) irriguent l'Europe : le « temps des cathédrales » (Chartres : Reims : Amiens) manifeste la fierté citadine.","d": "<b>Chartes, communes, bourgeois</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mouvement : ① la <b>renaissance urbaine</b> (après l'effondrement du Haut Moyen Âge : les remparts : les faubourgs : les « borcs » neufs près des châteaux et des abbayes : Saint-Denis : la foire du Lendit) ② les <b>libertés</b> : le « serf ville » : « l'air de la ville rend libre » après an et jour : les chartes de franchises : Goslar : 1104 ? : Beaumont : 1182 : Lorris (le « meilleur » : copié partout) : les COMMUNES (le serment collectif : Laon 1112 : l'évêque assassiné : la commune écrasée puis restaurée) : les échevins : la cloche de l'hôtel de ville ③ l'<b>économie</b> : les foires de Champagne (Troyes : Provins : l'italien : le flamand : la lettre de foire : le change) : les métiers (les guildes : les jurandes : le maître : l'apprenti : le compagnon) : les draps flamands (Gand : Bruges : Ypres) ④ la <b>fierté</b> : la cathédrale gothique (l'ogive : la croisée d'ogives : l'arc-boutant : la lumière de Suger à Saint-Denis ~1140) : la ville se construit une église PLUS HAUTE que celle du voisin (Amiens : 42 m sous voûte !) : l'Hôtel-Dieu : l'université (Paris : Bologne) : la ville est une PERSONNE MORALE qui agit (bannières : sceaux : « Ville de Paris »). Piège : la ville ne supprime pas la féodalité : elle s'y INSÈRE (l'évêque-duc de Cologne : le roi-« bourgeois de Paris ») : les chartes sont des ACCORDS, pas des déclarations d'indépendance.</div>"},
{"t": "Le Moyen Âge : féodalité, Église et croisades (Collège)","q": "La peste noire (1347-1352) :","c": ["tue 10 % de la population","tue environ UN TIERS à la MOITIÉ de la population européenne (retour de la croissance : conséquences économiques et sociales : les révoltes)","ne touche que l'Italie","est une légende"],"a": 1,"e": "La yersinia pestis (par les puces des rats des navires génois : Messine 1347) tue 25-45 % des Européens en 5 ans : les survivants exigent des salaires plus hauts (les « grandes révoltes » : Jacquerie 1358 : révolte paysanne 1381) : les États répriment (ordonnances des salaires).","d": "<b>La grande mortalité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la vague : partie d'Asie centrale (la Horde d'Or : Caffa : les catapultes de cadavres !), portée par les navires génois (Messine octobre 1347 : Marseille janvier 1348 : Paris juin : l'Angleterre : la Scandinavie : 1352) : la <b>bubonique</b> (les « charbons » : bubons : 60-80 % de morts en 3-5 jours) et la <b>pulmonaire</b> (la contagion directe : 100 % : « trois jours ») : les populations (la « peste » = d'un mot grec : le fléau) attribuent : l'air corrompu (les conjonctions astrales : le « fléau de Dieu » : les processions : les flagellants), les empoisonneurs (les pogroms : les juifs accusés d'empoisonner les puits : Strasbourg 1349 : 900 brûlés), les boucs émissaires ② les conséquences : la <b>démographie</b> (25-45 % de morts : la main-d'œuvre rare : les salaires augmentent : le prix des terres baisse) : les <b>révoltes</b> : la Jacquerie (1358 : les nobles « inutiles » : Étienne Marcel : lesParis urban revolts) : la révolte des paysans anglais (1381 : Wat Tyler : « quand Adam bêchait et Ève filait : qui était alors le gentilhomme ? ») : les États réagissent par le <b>contrôle des salaires</b> (l'ordonnance des travailleurs : 1349 : l'Angleterre) : la croissance repart (les « halles » neuves : les « champs » réduits : l'élevage : la laine). Piège : la peste ACCÉLÈRE des tensions déjà là (la guerre de Cent Ans : les famines 1315-17 : la fiscalité royale) : l'« après-peste » n'est pas uniforme : la moitié des villageois meurt : certains villages disparaissent (les « déserts ») : les autres négocient.</div>"},
{"t": "La Renaissance : humanisme et réformes religieuses (Collège)","q": "L'humanisme de la Renaissance se caractérise par :","c": ["le retour aux SOURCES antiques, la confiance dans l'éducation et la raison, la dignité de l'homme (Érasme, Rabelais, Montaigne)","le mépris des livres","la guerre permanente","la fin de la religion"],"a": 0,"e": "Les humanistes retournent « ad fontes » : aux textes originaux (grecs : hébreux : l'étude critique de la Bible), forment l'individu (les collèges), croient que « l'homme peut presque tout » (l'optimisme anthropologique).","d": "<b>Retour aux sources + éducation + dignité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le programme : ① <b>ad fontes</b> : Érasme édite le Nouveau Testament grec (1516 : face à la Vulgate latine : les erreurs de traduction ! : « mon miroir et mon mensonge » : le « folie » d'Érasme : la critique souriante de la dévotion extérieure) : les textes d'Aristote repris (Lefèvre d'Étaples) : le grec et l'hébreu dans les collèges : Guillaume Budé : le collège de France (1530) : les lecteurs royaux ② la <b>pédagogie</b> : Érasme : « De ratione studii » : le gai savoir : Rabelais : « Pantagruel » : l'abbaye de Thélème : « Fais ce que voudras » : l'éducation de Gargantua (le « bien instruit » : les langues : les sciences : les exercices) : Montaigne (1580 : les Essais : « un homme complet » : « le chef bien fait plutôt que bien plein » : le jugement) ③ l'<b>anthropologie</b> : Pic de la Mirandole (1486 : « De la dignité de l'homme » : l'homme « libre et souverain » : le « caméléon » qui se fait lui-même : « comme un statuaire ») : Léonard de Vinci (l'« homo universalis » : l'art : l'ingénieur : les sciences : le « plan des machines » : les dissections) : l'humanisme n'est pas « l'amour de l'humanité » au sens moderne (le humanitaire) mais la CULTURE LETTRÉE (l'humanitas romaine). Piège : les humanistes restent CHRÉTIENS : Érasme veut réformer l'Église de l'intérieur : « j'ai semé des idées » : la crise viendra d'ailleurs (Luther : un moine « antihumaniste » sur la question de la liberté : « le servitude arbitre » contre le « libre arbitre » !).</div>"},
{"t": "La Renaissance : humanisme et réformes religieuses (Collège)","q": "Les 95 thèses de Luther (1517) dénoncent :","c": ["le pape lui-même","les INDULGENCES (le commerce des pardons : le salut par la grâce et la foi, pas par l'argent)","l'imprimerie","les protestants"],"a": 1,"e": "« Quand la pièce dans le tronc résonne : l'âme au paradis s'envole » (Tétzel) : Luther répond : le pardon vient de Dieu seul : la foi : la grâce gratuite.","d": "<b>Les indulgences</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le déclenchement : le pape <b>Léon X</b> (un Médicis : le faste) lance une grande indulgence : le financement de la basilique Saint-Pierre : la moitié pour les dettes de l'archevêché de Mayence (Albrecht : la banque Fugger : le crédit !) : le prédicateur <b>Tétzel</b> : le jingle commercial : Luther (un moine augustin : docteur en théologie : Wittenberg : l'expérience spirituelle de la tour : « le juste vivra par la foi » : Romains 1,17 : l'angoisse du salut résolue par la GRATUITÉ) réagit : le 31 octobre 1517 (la date symbolique : la veille de la Toussaint), les <b>95 thèses</b> (des propositions de DISPUTATION scolastique : pas encore un manifeste) : « pourquoi le pape, riche au-delà de Croesus, ne paie-t-il pas Saint-Pierre de son argent ? » : le texte est imprimé : les 4 semaines : l'Allemagne entière : « en deux semaines : toute l'Allemagne : en quatre : toute l'Europe » (un témoignage) : le « tsunami » de l'imprimerie : l'escalade : 1518-19 : les disputes de Leipzig : « le pape peut errer : les conciles aussi » : 1520 : les trois traités (À la noblesse allemande : la captivité babylonienne : la liberté du chrétien) : la bulle Exsurge Domine : la menace : Luther brûle la bulle (10 décembre 1520 : l'étudiant : « tu m'as défié : je te brûle » : la rupture consommée) : 1521 : <b>Worms</b> (« ma conscience est captive de la Parole de Dieu : ici je suis : je ne puis autrement ») : le ban impérial : la Wartburg : la « mine » : la Bible en allemand (1522 : le peuple lit) : le « nouveau » allemand littéraire. Piège : Luther critique d'abord un ABUS (les indulgences) : la rupture dogmatique (sola fide : sola scriptura : rejet de la hiérarchie) se construit ENsuite (1518-1521) : le déroulé chronologique est l'ossature de la réponse.</div>"},
{"t": "La Renaissance : humanisme et réformes religieuses (Collège)","q": "La doctrine de Calvin se distingue par :","c": ["le pape à Genève","le culte des saints","la PRÉDESTINATION (Dieu a choisi les élus : la confiance se manifeste dans le travail et la discipline : l'éthique du « monde »)","les indulgences"],"a": 2,"e": "L'Institution chrétienne (1536) : la souveraineté absolue de Dieu (les élus fixés d'éternité) : le croyant le montre par une vie ordonnée : Genève la théocratie disciplinée (le consistoire : le ban sur la danse) : les communautés huguenotes en France.","d": "<b>Prédestination + discipline</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le système : ① la <b>doctrine</b> : l'homme est radicalement déchu (le « néant ») : Dieu seul sauve : la prédestination (les élus inscrits « dès avant la fondation du monde » : Romains 9) : ni les œuvres ni les sacrements ne « forcent » le salut : MAIS le croyant cherche les SIGNES de son élection : la vie droite (la « vocation » dans le monde : le métier : la famille : la cité) : pas de monastère (la fuite du monde = l'ingratitude) : le culte NU (les « quatre chants » : la prédication : la table) : les églises « blanchies » (l'iconoclasme : les vitraux cassés) ② la <b>cité</b> : Genève 1541 : les Ordonnances ecclésiastiques : le consistoire : les anciens : la discipline : le ban : la censure (l'imprimeur : les livres) : la « Rome protestante » (les missionnaires français formés : le « séminaire » informel) ③ la <b>diffusion</b> : les marchands (les « italiens » : les napolitains : la plague huguenote) : les nobles (les Bourbons : Coligny : Condé : la moitié de la noblesse française !) : les villes du sud et de l'ouest (La Rochelle : Nîmes : Montpellier) : la « religion prétendue réformée » (le nom légal). Piège : le lien « calvinisme → capitalisme » (Max Weber : l'éthique protestante) est un DÉBAT (pas un théorème) : le calvinisme produit des communautés lettrées (chacun lit la Bible : les écoles) et disciplinées : les conditions favorisent l'épargne et l'entreprise : mais le capitalisme a d'autres racines (les villes italiennes catholiques !) : au bac, présenter le débat.</div>"},
{"t": "La Renaissance : humanisme et réformes religieuses (Collège)","q": "Le concile de Trente (1545-1563) est :","c": ["une réunion protestante","un concile orthodoxe","un traité de paix","la réponse CATHOLIQUE à la Réforme (dogmes confirmés, séminaires pour former les prêtres, Index des livres interdits, discipline et sainteté)"],"a": 3,"e": "L'Église se réforme de l'intérieur : la formation des clercs (les séminaires : le curé instruit), la clarification dogmatique (la messe : les sept sacrements : la Vulgate), la censure (l'Index 1559), les ordres nouveaux (les jésuites 1540 : l'enseignement : les missions) : la « Réforme catholique » (pas seulement « contre »).","d": "<b>La Réforme catholique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le chantier (25 sessions en 18 ans : trois papes : les guerres empêchent) : ① le <b>dogme</b> : contre les protestants : la tradition ET l'Écriture (les deux sources : contre le sola scriptura) : les sept sacrements confirmés : la transsubstantiation (le réel : contre l'« emblème » réformé) : la messe en latin (pas de traduction : contre la « langue vulgaire ») : le purgatoire : le culte des saints (modéré) : la justification (la foi ET les œuvres : le « concubinage » des deux : la grâce qui coopère) ② la <b>discipline</b> : les <b>séminaires</b> : les évêques DOIVENT former les prêtres : les curés lettres : les visites : les registres paroissiaux (baptêmes : mariages : sépultures : la « police » des âmes) : la résidence des évêques (fin des cumulards : le schisme des « absents ») : les ordres réguliers réformés : les capucins : les Barnabites : les théatins : la « sainteté » moderne (Charles Borromée : Milan : la catéchèse : le « catéchisme du concile de Trente ») ③ les <b>armes culturelles</b> : l'<b>Index</b> (1559 : la liste des livres interdits : jusqu'en 1966 !) : l'Inquisition (remaniée : Rome 1542 : les tribunaux) : la <b>Compagnie de Jésus</b> : 1540 : Ignace de Loyola : les Exercices spirituels (le discernement : les 30 jours) : les collèges (l'élite européenne : 700 collèges au XVIIIe !) : les missions : le Japon : Xavier : la Chine : Ricci (l'adaptation) : le Paraguay : les « réductions » ④ le style : le « baroque » de la contre-réforme : l'art qui EMOTIONNE (Bernin : le théâtre de la foi) : la Vierge (la victoire de Lépante 1571 : « Auxiliatrix ») : la piété populaire encadrée (le rosaire réformé : les congrégations). Piège : Trente n'est pas seulement « contre » (une réaction défensive) : c'est une RECONQUÊTE (les « reconquistas » spirituelles : la France : la Pologne : la Bavière) : les historiens disent « Réforme catholique » autant que « Contre-Réforme ».</div>"},
{"t": "La Renaissance : humanisme et réformes religieuses (Collège)","q": "Le massacre de la Saint-Barthélemy (24 août 1572) :","c": ["est inventé","tue le roi","débute par l'assassinat des chefs protestants à Paris puis s'étend (3000 morts à Paris : des milliers en province : le « crime de l'État »)","est une fête"],"a": 2,"e": "Le mariage Marguerite de Valois-Henri de Navarre (le « compromis ») tourne au massacre : Coligny assassiné : la guerre civile reprend : l'Europe protestante se braque (« la nuit de la Saint-Barthélemy » : la légende noire de la monarchie française).","d": "<b>Le tournant des guerres de religion</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : ① le <b>contexte</b> : trois guerres déjà : la « paix » fragile : le mariage (18 août 1572) de Marguerite de Valois (la sœur du roi) avec Henri de Navarre (le futur Henri IV : le chef protestant) : les huguenots venus à Paris : Coligny (l'« amiral » : le chef respecté : l'influence croissante sur Charles IX : la guerre contre l'Espagne !) ② le <b>déclenchement</b> : le 22 août : l'attentat manqué contre Coligny (Maurevel : l'arquebusade : la « preuve » de la conjuration) : le conseil royal (Catherine de Médicis ? Charles IX ? le « tuez-les tous pour qu'il n'en reste aucun » apocryphe : les Guise : le duc Henri le « balafre » fils) décide l'« élimination » : la nuit du 24 : les cloches : les Parisiens armés (les milices : les ligueurs) : Coligny achevé (jeté par la fenêtre : pendu aux pieds de l'échafaud : la tête envoyée au pape !) ③ l'<b>extension</b> : les jours suivants : Paris (3 000 morts) puis les villes (Lyon : Orléans : Rouen : Bordeaux : Toulouse : les « mi-carême » : 10 000 morts ?) : le roi « assume » : le récit officiel : la « conjuration protestante » déjouée : les reproches : Grégoire XIII TE DEUM et médailles ! : l'Europe horrifiée (Élisabeth : les pamphlets allemands : la « légende noire ») ④ les <b>conséquences</b> : la 4e guerre : les « malcontents » (la 3e partie : les politiques : la paix de trop tard) : la radicalisation (les protestants se « arment » : la République des places : Sancerre : la « Rochelle ») : les théories de résistance (les monarchomaques : le droit de tuer le tyran ! : « Vindiciae contra tyrannos ») : la France divisée pour 26 ans encore. Piège : l'ordre du massacre part du ROI (Charles IX assume officiellement : c'est un « crime d'État ») : l'étendue et l'initiative des tueries provinciales sont plus discutées (les autorités locales ? les foules ?) : la nuance « centre/province » est attendue.</div>"},
{"t": "La Renaissance : humanisme et réformes religieuses (Collège)","q": "L'édit de Nantes (1598) :","c": ["accorde aux protestants la LIBERTÉ DE CULTE et des garanties (places de sûreté) : la coexistence légale","crée l'école","exile Henri IV","interdit le protestantisme"],"a": 0,"e": "Henri IV (converti au catholicisme en 1593 : « Paris vaut bien une messe ») pacifie : 92 articles (culte : états : places : amnistie) : une PAIX DE COMPROMIS administrative, fragile (révoquée en 1685).","d": "<b>La coexistence légale</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le texte (avril 1598 : Nantes : 92 articles généraux + 56 « particulières » + les brevets) : ① la <b>liberté de conscience</b> (absolue : partout) et la <b>liberté de culte</b> : là où le protestantisme existed en 1596-97 : pas à Paris (5 km) : pas à la cour : les « limites » ② les <b>garanties</b> : les places de sûreté (les villes : La Rochelle : Montauban : Nîmes : les garnisons protestantes PAYÉES PAR LE ROI : environ 100 places : le « état dans l'État » : la critique catholique) : les chambres mi-parties : les tribunaux (Paris : Castres : les juges moitié catholiques : moitié protestants) : l'égalité d'accès aux charges (les universités : les hôpitaux) ③ le <b>sens</b> : une tolérance ADMINISTRATIVE : pas philosophique : « je ne veux pas qu'on leur fasse de mal » : la raison d'État (Sully protestant : l'économie) : la « paix » achetée (Henri IV achète les derniers ligueurs) ④ les <b>limites</b> : les protestants (un million ? : 600 églises) se méfient (les « églises du désert » après) : les catholiques inquiets (Rome mécontente : Clément VIII « honteuse paix ») : l'édit de Alès (1629 : Richelieu : les places supprimées : le culte maintenu) : la <b>révocation : 1685 : Fontainebleau : Louis XIV : « un roi : une foi » : les dragonnades : l'exil de 200 000 : Brandebourg : Hollande : Angleterre : la perte pour la France (les savoir-faire : les banques huguenotes : la critique : l'Angleterre gagne !). Piège : la question type : « l'édit de Nantes est-il un acte de tolérance ? » : réponse NUANCÉE : oui juridiquement (la coexistence) : non philosophiquement (une trêve de raison d'État : pas de reconnaissance du pluralisme comme VALEUR).</div>"},
{"t": "La Renaissance : humanisme et réformes religieuses (Collège)","q": "L'imprimerie de Gutenberg (~1450) permet :","c": ["les téléphones","l'argent facile","la DIFFUSION de masse des textes (Bibles : pamphlets : affiches : 20 millions de livres avant 1500) : la circulation des idées","la fin des rois"],"a": 2,"e": "Les caractères mobiles + la presse : le livre abordable : la Bible dans les langues vernaculaires (la lecture personnelle : Luther : Tyndale : Lefèvre) : la propagande (les pamphlets : les gravures) : l'alphabétisation.","d": "<b>La diffusion de masse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les chiffres : un atelier : Mayence : la « fabrique » : 20 ouvriers : la division du travail : les caractères fondus (l'alliage : la fonte : les moules) : la presse à vis : l'encre d'huile de lin : le papier (les moulins à papier : l'Italie : le « chiffon ») : 180 Bibles (1455 : les « 42 lignes » : vendues à la foire de Francfort) : en 1500 : plus de 1000 ateliers : 20 millions d'incunables (les livres du « berceau ») : 150-200 millions au XVIe ! : le prix (une Bible manuscrite = plusieurs années de salaire : la version imprimée : quelques semaines) : le « best-seller » : la Bible allemande de Luther (1522 : 5 000 exemplaires : épuisés en 3 mois : 430 éditions avant 1600 !) : les <b>effets</b> : la lecture individuelle (les yeux : la « lectio » silencieuse) : la « réforme » lisible : chacun confronte le texte : « l'Écriture seule » IMPOSSIBLE sans imprimerie : les thèses : les affiches : les « placards » (1534 : la profanation des rues de Paris ! : l'affaire des placards : la répression de François Ier) : la <b>propagande</b> : les pamphlets : les chansons (la chanson de la Saint-Barthélemy) : les gravures (Cranach : la « passion de Léonard » et le Christ caricaturé : Holbein) : l'« opinion publique » naissante. Piège : l'imprimerie ne « cause » pas la Réforme (les causes sont religieuses et sociales) : elle l'ACCÉLÈRE et l'IRREVERSIBILISE : l'érasmisme humaniste a circulé pareil : et l'Église imprime aussi (l'Index : les théologiens : les catéchismes) : l'outil est NEUTRE : les usages sont partisans.</div>"},
{"t": "La Renaissance : humanisme et réformes religieuses (Collège)","q": "L'art de la Renaissance italienne se reconnaît à :","c": ["les croix partout","la PERSPECTIVE (la profondeur mathématique), le retour de l'antique (nu : mythe), l'anatomie réaliste et le naturalisme","le collage","l'abstraction"],"a": 1,"e": "La perspective à point de fuite (Brunelleschi : Alberti « De pictura » 1435), le sfumato de Léonard, les Madones humanisées (Raphaël), le David de Michel-Ange (1504 : la beauté du corps) : un art qui exalte l'homme et la nature (les mécènes : les Médicis).","d": "<b>Perspective + antique + naturalisme</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les marqueurs : ① la <b>perspective</b> : Brunelleschi : l'expérience du « miroir » du baptistère (le panneau percé : la place de la Signoria « vue » par le trou) : Alberti (1435 : « De pictura » : la fenêtre : le point de fuite : la « pyramide visuelle ») : Masaccio : la Trinité de Santa Maria Novella (vers 1427 : la voûte peinte « en creux » : le premier frisson perspectif) : Mantegna (le raccourci : le Christ mort vu des pieds !) ② l'<b>antique</b> : la redécouverte : les fouilles : le Laocoon (1506 : Michel-Ange présent ! : le « sublime » : Winckelmann plus tard) : les collections (les Médicis : le jardin de San Marco : le « studiolos ») : les nus héroïques : le <b>David</b> de Michel-Ange : 1501-1504 : le bloc « guastato » (abîmé) : le jeune homme de 26 ans : « j'ai enlevé le superflu » : le « gigante » : la Signoria : le symbole civique florentin : la « contrapposto » antique : le poids sur une jambe ③ le <b>naturalisme</b> : l'observation : Léonard : les carnets : 7000 pages : l'eau : les oiseaux : les dissections (les « 30 corps ») : la « sfumato » (les brouillards : la Joconde : le sourire : les « ombres sans lignes ») : le « parallèle » anatomique (les muscles : le corps-machine) : Vésale : 1543 : « De humani corporis fabrica » : le corps observé : contre Galien ! : les planches (les poses classiques : les fonds de paysage) : les <b>mécènes</b> : les Médicis (Cosme : Laurent : le « magnifico » : le cercle de Marsile Ficin : l'Académie platonicienne : la « second » Michel-Ange : la chapelle des Médicis) : les papes : Jules II : la Sixtine (1508-1512 : les 300 figures : le « jugement » 1536-41 : la « terribilità ») : Léon X : Raphaël : les « stanze » : la « Scuola d'Atene » (1510 : Platon pointant le ciel : Aristote la terre : les deux vérités ?) : le sens : l'ART DEVIENT UNE PUISSANCE : le « value » de la signature : le génie moderne : Vasari (1550 : « Les Vies » : l'histoire de l'art née) : « la divina proportione ». Piège : l'art Renaissance reste RELIGIEUX à 90 % (les retables : les Madones) : le « retour de l'homme » se fait DANS le sacré (le David biblique nu comme héros antique) : ne pas en faire un art « laïque ».</div>"},
{"t": "La Renaissance : humanisme et réformes religieuses (Collège)","q": "La Réforme en Angleterre (1534) :","c": ["est calviniste","vient du ROI : Henri VIII rompt avec Rome (l'Act of Supremacy : le roi chef de l'Église) pour des raisons DYNASTIQUES (le divorce avec Catherine d'Aragon) : l'anglicanisme","n'a jamais existé","est un choix spirituel"],"a": 1,"e": "Le refus papal d'annuler le mariage (la nécessité d'un héritier male : la « grande affaire ») : le roi se proclame chef de l'Église d'Angleterre : les loyalties : Thomas More exécuté (1535) : les monastères dissous (1536-40 : les terres au service du roi : les élites achetées).","d": "<b>Une réforme royale et dynastique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario : ① le <b>problème</b> : Henri VIII : 1509-1547 : le « défenseur de la foi » (le traité contre Luther : le pape le récompense !) : Catherine d'Aragon : la veuve de son frère : la dispense : la fille Marie : PAS de fils (les fausses couches) : l'« impotence » théologique (le Lévitique : « prendre la femme de son frère = semer dans le champ d'autrui ») : l'annulation demandée : Clément VII REFUSE : Charles Quint : le neveu de Catherine ! : le sac de Rome (1527 : le pape prisonnier : l'humiliation : la « Captivité ») : l'impossibilité diplomatique ② la <b>rupture</b> : Anne Boleyn : la dame d'honneur : la grossesse (1533 : l'Élisabeth future !) : le mariage secret : l'archevêque Cranmer (un « érasmiens » : l'annulation prononcée : le pape excommunie) : le <b>Act of Supremacy</b> : 1534 : « le roi est le seul protecteur : le seul chef suprême de l'Église d'Angleterre » : les serments : Thomas More (l'« homme pour toutes les saisons » : la démission : le silence : le procès : « je meurs le bon serviteur du roi : mais d'abord de Dieu » : 1535 : la tête) : Fisher (l'évêque : le cardinal : exécuté) ③ les <b>conséquences</b> : la dissolution des monastères : 1536-1541 : 800 maisons : les terres vendues (la « nouvelle » gentry : les acheteurs : la « cause » du futur parti protestant !) : les trésors : les « pèlerinages » : la révolte du « Grace » (1536 : le nord : la « Piété » : écrasée) : la <b>doctrine</b> : Henry reste « catholique sans pape » : les Six Articles (1539 : la transsubstantiation maintenue : le célibat) : la vraie Réforme doctrinale viendra sous Édouard VI (les 42 articles : le livre commun) : le retour catholique : Marie la Sanglante : 1553 : le mariage avec Philippe II : les bûchers (Cranmer : Latimer : Ridley : les 300 : Oxford) : le <b>règlement</b> : Élisabeth Iere : 1558 : le « via media » : l'Église établie : les 39 articles (1563 : le compromis : la chape : l'aile) : la tolérance surveillée (les récusants : les amendes : les catholiques marginalisés). Piège : la Réforme anglaise commence PAR LE HAUT (le roi) pour un motif DYNASTIQUE : la doctrine protestante s'installe par ÉTAPES (Édouard : Élisabeth) : ne jamais raconter 1534 comme une « conversion » spirituelle.</div>"},
{"t": "La Renaissance : humanisme et réformes religieuses (Collège)","q": "La « nouvelle piété » tridentine se manifeste par :","c": ["les SACREMENTS encadrés (registres : catéchisme), les ordres réformés (jésuites : capucins), l'art émotionnel du baroque","l'athéisme","la fin des messes","la liberté de culte"],"a": 0,"e": "Le catholicisme se réforme de l'intérieur : le curé formé (les séminaires : le catéchisme de Trente 1566), les frères capucins (la prédication populaire), les collèges jésuites (l'élite), les madones et jubilés (la dévotion encadrée), l'Index (la censure) : la « reconquête » des âmes.","d": "<b>Une pastorale de reconquête</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les outils : ① la <b>paroisse</b> : le curé de Trente : lettré : le séminaire : le « petit » séminaire (les pauvres : les bourses) : la visite de l'évêque : la « pastorale » de visite : les <b>registres</b> : baptêmes : le nom chrétien : le calendrier réformé : le pape Grégoire XIII : 1582 : les 10 jours « volés » ! : les protestants refusent (les « vraies » dates : l'Angleterre jusqu'en 1752 !) : les « double » dates de Colbert : les <b>missions</b> : les jésuites : le missionnaire : la « réduction » du Paraguay : les catéchismes en langues : le « tamil » : le « bréviaire » japonais : la « Valignano » : l'adaptation (les daimios : la cour) : le Christian century japonais : 1587 : l'interdiction : les martyrs : les 26 crucifiés de Nagasaki (1597) ② la <b>spiritualité</b> : Thérèse d'Avila : la réformatrice du Carmel : la « chaussée » : les « âmes » (le château intérieur : la mystique) : Jean de la Croix (la nuit obscure) : Philippe Neri (l'Oratoire : la joie romaine) : Charles Borromée : Milan : les « saint » modèles : la peste (1576 : le « saint » de la ville) : la « mort » chrétienne (l'ars moriendi : les fraternités) ③ le <b>baroque</b> : le « style » de la reconquête : l'église « émotion » : les plafonds : la voûte de Saint-Ignace (le trompe-l'œil de Pozzo : la « gloire ») : Bernin : le baldaquin : la « extase » de sainte Thérèse (le marbre « mou » : la « sensualité contrôlée ») : les missions d'art (les « thrènes » : les Christs expressifs) : le but : TOUCHER : les sens : la conversion : les « ex-voto » : les miracles vérifiés (le procès de canonisation : le notaire du surnaturel !). Piège : la contre-réforme n'est pas « l'obscurantisme » pur : l'Index certes : mais les collèges : les registres : l'hygiène pastorale : l'« Église de l'encadrement » produit aussi la modernité administrative (l'« état civil » moderne vient des registres paroissiaux !).</div>"},
{"t": "L'absolutisme royal et les Lumières (Collège)","q": "La monarchie absolue de droit divin signifie :","c": ["le roi est un tyran illégal","le roi ne rend compte qu'à DIEU (Bossuet : le roi « lieutenant de Dieu ») : pouvoir héréditaire sans contre-pouvoir institutionnel","le roi gouverne avec le peuple","le roi élu"],"a": 1,"e": "La légitimité vient de Dieu (le sacre de Reims : l'huile sainte) : le roi est « par la grâce de Dieu » : les lois fondamentales (la succession male) le lient : mais pas de « constitution » au sens moderne.","d": "<b>De droit divin, hérititaire, sans contre-pouvoir institutionnel</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la doctrine (Bossuet : « Politique tirée des propres paroles de l'Écriture sainte » : le sermon du sacre : « les princes agissent comme ministres de Dieu : ses lieutenant sur terre » : la « Sainte Ecriture » : « le trône du roi est le trône de Dieu ») : les rites : le <b>sacre de Reims</b> : l'huile de la sainte ampoule : le « thaumaturge » : le roi touche les écrouelles (la maladie : les « rois qui guérissent » : la sacralité populaire : jusqu'à Louis XV !) : la <b>liturgie royale</b> : le roi communie « en ambas » (des deux espèces : comme le clergé) : le « canon » des messes : le nom dans les prières publiques : le « rex » mentionné : les <b>limites réelles</b> : les lois fondamentales du royaume (la succession : l'inaliénabilité du domaine : la religion catholique : « une foi » !) : les coutumes : le nord : le droit écrit (le sud) : les parlements : les « cours souveraines » : l'enregistrement des lois : les remontrances (les « objections » : la « fronde » parlementaire de 1753-1771) : les corps intermédiaires (l'Église : la noblesse : les villes : les corporations) : le roi « absolu » NEGOCIE en permanence (la fiscalité : les impôts « temporaires » toujours reconduits : les assemblées provinciales) : le sens : l'« absolutisme » est une CONSTRUCTION : le mythe royale : l'image : le contrôle (les « historiens du roi » : les médailles : l'Académie des inscriptions) plus que la pratique bureaucratique (les intendants : les « généralités ») : Louis XIV n'est pas Staline : il règne sur une société d'ordres qui garde ses franchises. Piège : « l'État, c'est moi » (attribué : apocryphe) et « le roi meurt : vive le roi » : la continuité dynastique : le roi ne « gouverne » que s'il est majeur : les régences : Anne d'Autriche (1643-51 : Mazarin) : Philippe d'Orléans (1715-23 : la polysynodie !) prouvent que la MONARCHIE dépasse la personne.</div>"},
{"t": "L'absolutisme royal et les Lumières (Collège)","q": "La Fronde (1648-1653) :","c": ["est une série de RÉVOLTES contre Mazarin et la fiscalité (parlementaires : princes : peuple parisien : le jeune Louis XIV marqué : la répression : l'absolutisme en réponse)","est une guerre étrangère","est une fête","concerne l'Angleterre"],"a": 0,"e": "Pendant la minorité de Louis XIV : le parlement de Paris (les remontrances : la Paulette), les princes (Condé) et le peuple (les barricades : 1648) contestent Mazarin (les impôts) : la guerre civile : le roi vainqueur en déduit la leçon (dompter les grands : Versailles).","d": "<b>La révolte des corps contre le cardinal</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le déroulé : ① le <b>contexte</b> : la minorité (Louis XIV : 10 ans en 1648) : Mazarin : le « Sicilien » : le favori : les impôts de la guerre de Trente Ans : la France engagée depuis 1635 : les « tailles » multipliées : les « partisans » (les fermiers : les « profiteurs ») : l'unanimité de la haine (les mazarinades : 5000 pamphlets !) ② les <b>étapes</b> : la <b>Fronde parlementaire</b> : 1648-49 : le parlement de Paris : les magistrats : les « officiers » propriétaires de leurs charges (la Paulette : l'hérédité) : les remontrances : le refus d'enregistrer les édits fiscaux : l'arrestation de Broussel : le conseiller populaire : le peuple : les barricades (26 août 1648 : la journée : « le nom de Broussel ») : la libération : la paix de Rueil : la fuite du roi : 1649 : Saint-Germain : le siège de Paris (Condé l'assiège pour le roi !) : la paix : la <b>Fronde des princes</b> : 1650-53 : Condé : le « grand » : le vainqueur de Rocroi : l'arrestation (1650 : Mazarin emprisonne le prince !) : la « guerre » des princes : Condé : Conti : le duc de Beaufort : « le roi des Halles » : les alliances : l'Espagne ! : Condé passe à l'ennemi (la trahison) : Bordeaux (la « Fronde » de l'Ormée : le peuple girondin) : l'effondrement : 1652 : le retour du roi : la « entrée » : la réconciliation : les révoltes écrasées : Mazarin réinstalle : les châtiments (les exils : les amnisties calculées) ③ les <b>conséquences</b> : le traumatisme du roi (la nuit de février 1651 : le « retour » du roi seul : les « coups de feu » : la peur du peuple parisien) : la leçon politique : ne JAMAIS laisser les corps défier : le « gouvernement personnel » dès 1661 : la mort de Mazarin : « le roi gouverne » : les ministres exécutants (pas de « principal ministre » : Colbert) : Versailles (1682 : la cour : les nobles « domestiqués ») : les parlements réduits (les lit de justice : les remontrances brisées). Piège : la Fronde n'est PAS révolutionnaire (personne ne conteste la monarchie : on combat le MINISTRE : le « roi au-dessus ») : c'est une crise du GOUVERNEMENT (la minorité : la fiscalité) qui sert L'absolutisme (la leçon du chaos).</div>"},
{"t": "L'absolutisme royal et les Lumières (Collège)","q": "Montesquieu, dans De l'Esprit des lois (1748), défend :","c": ["la dictature","la SÉPARATION des pouvoirs législatif, exécutif et judiciaire (la liberté se protège par l'équilibre)","la suppression des lois","la religion d'État"],"a": 1,"e": "« Pour qu'on ne puisse abuser du pouvoir : il faut que par la disposition des choses le pouvoir arrête le pouvoir » : le modèle anglais (le parlement : les juges) : la théorie qui inspirera les constitutions (États-Unis 1787 : France 1791).","d": "<b>La séparation des pouvoirs</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la démonstration : ① l'observation : l'Angleterre : les Lettres persanes (1721 : la satire : les « us et coutumes » : les Persans ironiques) : le séjour : 1729-31 : le whig : le parlement : les juges indépendants (les « jurys ») : la « liberté » anglaise (l'habeas corpus : 1679) ② la <b>théorie</b> : « De l'Esprit des lois » : 1748 : 20 ans de travail : Genève (la censure française : Paris refuse : l'édition hollandaise) : la classification des gouvernements : le républicain (la vertu) : le monarchique (l'honneur : les corps intermédiaires ! : Montesquieu NOBLE : le président à mortier de Bordeaux : la défense des parlements !) : le despotique : la peur : l'Asie « esclavagiste » (le « climat » : la théorie contestée) : le fameux <b>livre XI, chapitre 6</b> : « De la constitution d'Angleterre » : « tout homme qui a du pouvoir est porté à en abuser » (la reprise de la sagesse classique) : la répartition : le législatif : les deux chambres : les « communes » et les « lords » (le bicaméralisme) : l'exécutif (le roi : le veto : la « sanction ») : le judiciaire : les juges : le jury : les « nuls » : les « bouche de la loi » (la justice « invisible ») : le mécanisme (les contre-pouvoirs mutuels : l'« arrêt » : la modération) ③ la <b>postérité</b> : les Américains : Philadelphie : 1787 : la Constitution : « the Federalist » (Madison : Hamilton : « l'ambition contre l'ambition ») : la France : 1791 : la Constitution civile : le roi « sanctionne » : le veto (le conflit vient !) : les juges « élus » (les problèmes) : l'Europe (les constitutions du XIXe) : les critiques : Rousseau : la séparation « impossible » : la souveraineté INDIVISIBLE (le peuple : le législatif souverain) : « la volonté générale » : le débat moderne : la « justice » indépendante : les « abus » : la séparation toujours réactivée (la Ve République : 1958 : les articles 16 : 24 : la révision 2008). Piège : Montesquieu n'est pas « démocrate » : il défend la monarchie ARISTOCRATIQUE (les corps : les parlements : la noblesse de robe : sa propre caste !) : la séparation vise à protéger la liberté du MAGISTRAT autant que du citoyen.</div>"},
{"t": "L'absolutisme royal et les Lumières (Collège)","q": "Voltaire se bat surtout contre :","c": ["la raison","les paysans","le FANATISME et l'intolérance (l'affaire Calas 1762 : le « traité sur la tolérance » 1763 : « écrasez l'infâme »)","les sciences"],"a": 2,"e": "Le combat pour la tolérance (Calas : Sirven : La Barre) : les lettres anglaises (la liberté : le commerce : la religion « raisonnable » : le déisme) : le philosophe « star » (Ferney : les rois correspondants : l'« opinion » européenne).","d": "<b>Contre « l'infâme » (le fanatisme)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'affaire <b>Calas</b> : 1762 : Toulouse : le marchand protestant : le fils (Marc-Antoine) trouvé mort : le suicide ? le « parricide » supposé : la rumeur (« il voulait se convertir » !) : le parlement : la « contagion » de la rumeur : les juges fanatisés (le « préjugé » catholique local : les « exécutions » des protestants suspects) : le <b>roué</b> : la torture : l'« estomac » (l'eau) : les jambes « brisées » (le supplice : le « écartèlement » : la question) : le refus : Calas « innocent » : « vous m'ôtez la vie : je la donne à Dieu » : le courage : la mort (1762) ② la <b>campagne</b> : Voltaire : l'« écrasez l'infâme » (la signature des lettres : Ecr. l'inf.) : l'enquête : les « lettres » : les témoins : la « famille » : les juges : la « guerre » des pamphlets : l'« opinion publique » mobilisée (les souverains : les philosophes : les cours : les « sympathie » européenne) : le <b>Traité sur la tolérance</b> : 1763 : l'histoire des persécutions : le « comparaison » : les marchands chinois : les quakers : les anglais : les « nègres » (le début de la dénonciation de l'esclavage !) : la réhabilitation : 1765 : le conseil du roi : la cassation : la « innocence » proclamée : la veuve indemnisée (36 000 livres) ③ les <b>autres combats</b> : les Sirven (la même affaire : la famille poursuivie : la réhabilitation 1771) : le chevalier de <b>La Barre</b> : 1766 : le jeune homme : les « blasphèmes » : le passage de la procession (le « mauvais » geste) : les livres (le Dictionnaire philosophique saisi !) : la torture : la<em>supplice</em> (la langue coupée : la tête tranchée : « brûlé avec le Volume des ... philosophical dictionary » ! : Voltaire : « la honte de la France ») : les « sermons » de compiègne : la révision impossible : le climat anti-philosophes : les « les jésuites expulsés (1762 » !) : les parlements « réactionnaires » : les « complots » (l'affaire du Dictionnaire : la chasse) ④ le <b>sens</b> : Voltaire invente l'INTELLECTUEL ENGAGÉ : la « star » : Ferney : les visiteurs : les rois : Frédéric II : les années potzdàm (1750-53 : la brouille) : Catherine II (les « compliments ») : les « correspondances » (7000 lettres de la dernière décennie !) : l'« opinion publique » comme pouvoir : la « tribune » européenne : le « patriote » de Genève : la mort : 1778 : le retour triomphal à Paris (l'Académie : la Comédie : « Dieu : protegez le roi » et « Monsieur : mr De Voltaire ») : les « reliques » (le cœur : la « Bibliothèque nationale » ?) : l'« écrasez l'infâme » reste le programme. Piège : Voltaire n'est pas DÉMOCRATE : l'« canaille » méprisée (le peuple : la « populace » : les lettre philosophique : la « honnêteté » des élites : le « royaume des lettrés ») : il croit aux ROIS éclairés : le « bien » par le haut : le despotisme « éclairé » : Frédéric : le « moi » (le machiavelisme de la réforme par un seul).</div>"},
{"t": "L'absolutisme royal et les Lumières (Collège)","q": "Rousseau, dans Du contrat social (1762), pose :","c": ["l'église d'État","la guerre de tous","la SOUVERAINETÉ du peuple (la volonté générale : la loi que le peuple se donne) : la légitimité vient d'en bas","le roi divin"],"a": 2,"e": "« L'homme est né libre : et partout il est dans les fers » : la souveraineté populaire inaliénable : le gouvernement n'est qu'un commis : la source des démocraties modernes (et de 1789-93).","d": "<b>La souveraineté du peuple</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les thèses : ① la <b>critique</b> : le Discours sur l'origine de l'inégalité : 1755 : « la première pensée de Rousseau » : la société née de la <b>propriété</b> : « le premier qui enclos un champ » : « ceci est à moi » : les « gendarmes » payés par les riches (la légalisation de la fraude : l'inégalité installée par la loi) : la « culture » : les talents : la dépendance : l'« amour-propre » (le regard d'autrui : la comparaison : le malheur moderne) : la lettre à d'Alembert (les spectacles : Genève : la « vertu » civique) ② le <b>contrat</b> : 1762 : « Du contrat social » : l'expression initiale : que la force ne fonde rien : contre Hobbes lu superficiellement : la « convention » : le pacte : chacun se donne à TOUS (l'aliénation totale : l'égalité) : le « Moi commun » : le corps politique : la cité : la « volonté générale » : la délibération du bien commun : l'« universalité » : la loi : des sujets « en masse » (les objets généraux : pas les individus !) : la souveraineté : INALIÉNABLE (le peuple ne se représente pas : « les Anglais croient être libres : ils se trompent ») : INDIVISIBLE : pas de séparation des pouvoirs (contre Montesquieu) : le législatif souverain : l'exécutant commis ③ les <b>conséquences</b> : la religion civile : le livre IV : les « dogmes » civiques (l'Être suprême : la tolérance sauf pour les intolérants !) : la censure de l'archevêque de Paris : la « brûlement » : Genève : Paris : l
