<script>

  {
    "id": "debuts-humanite",
    "theme": "Les débuts de l'humanité : la Préhistoire (Collège)",
    "niveau": "Collège",
    "titre": "Les débuts de l'humanité : la Préhistoire",
    "cours": "<div class=\"cours-head\"><h2>Les débuts de l'humanité : la Préhistoire</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Une très longue histoire</h3>\n<p>La <b>Préhistoire</b> couvre la période de l'apparition des premiers humains jusqu'à l'invention de l'<b>écriture</b> (vers 3500 av. J.-C. en Mésopotamie).</p>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise de la Prehistoire : Paleolithique jusqu a -10000, puis Neolithique jusqu a l ecriture vers -3500\">\n  <line x1=\"20\" y1=\"65\" x2=\"410\" y2=\"65\" stroke=\"#1e293b\" stroke-width=\"3\"/>\n  <polygon points=\"410,60 424,65 410,70\" fill=\"#1e293b\"/>\n  <rect x=\"20\" y=\"50\" width=\"240\" height=\"30\" fill=\"#4f46e5\" opacity=\"0.15\"/>\n  <rect x=\"260\" y=\"50\" width=\"140\" height=\"30\" fill=\"#16a34a\" opacity=\"0.15\"/>\n  <text x=\"140\" y=\"44\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">Paléolithique : chasseurs-cueilleurs</text>\n  <text x=\"330\" y=\"44\" font-size=\"11\" fill=\"#16a34a\" text-anchor=\"middle\" font-weight=\"bold\">Néolithique : agriculteurs</text>\n  <g font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\">\n    <text x=\"30\" y=\"100\">≈ −3 Ma</text><text x=\"150\" y=\"100\">−100 000</text>\n    <text x=\"262\" y=\"100\">−10 000</text><text x=\"400\" y=\"100\">−3500</text>\n  </g>\n</svg><span class=\"fig-cap\">Frise : premiers outils (-3 Ma) ; Homo sapiens (-100 000 env.) ; agriculture (-10 000 env.) ; écriture (-3500).</span></div>\n<ul>\n<li><b>Paléolithique</b> : les humains sont <b>chasseurs-cueilleurs</b> nomades ; ils fabriquent des outils en pierre taillée et maîtrisent le <b>feu</b> ;</li>\n<li><b>Néolithique</b> : vers -10 000, <b>agriculture</b> et <b>élevage</b> apparaissent au Proche-Orient : c'est la plus grande révolution de l'humanité.</li>\n</ul>\n\n<h3>2. Homo sapiens</h3>\n<ul>\n<li>L'espèce humaine actuelle, <b>Homo sapiens</b>, apparaît en Afrique il y a environ 300 000 ans ;</li>\n<li>Elle se répand progressivement sur tous les continents par <b>migrations</b> (les humains sont Homo sapiens partout, sans exception) ;</li>\n<li>Art pariétal (Lascaux, vers -18 000) : preuve de vie symbolique et culturelle.</li>\n</ul>\n\n<h3>3. La sédentarisation</h3>\n<ul>\n<li>Au Néolithique, cultiver oblige à rester au même endroit : les <b>villages</b> naissent ;</li>\n<li>Conséquences : surplus de nourriture, augmentation de la <b>population</b>, premiers artisanats (poterie, tissage), organisation sociale.</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La Préhistoire s'arrête avec les Romains » : non, elle s'arrête avec l'<b>écriture</b> (vers -3500).</li>\n<li>« L'homme de Néandertal est notre ancêtre direct » : c'est une espèce <b>éteinte</b>, cousine d'Homo sapiens.</li>\n<li>Confondre Paléolithique (pierre taillée, chasse) et Néolithique (agriculture, villages).</li>\n<li>« −10 000 » se lit « dix mille ans <b>avant</b> notre ère » : plus le nombre est grand, plus c'est ancien.</li>\n</ul>\n</div>"
  },

    "niveau": "Collège",
    "titre": "L'Antiquité : Grèce, Rome et la naissance de l'Occident",
    "cours": "<div class=\"cours-head\"><h2>L'Antiquité : Grèce, Rome et la naissance de l'Occident</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La Grèce des cités : un monde fragmenté et inventif</h3>\n<p>Contrairement à l'Égypte ou à la Perse, la Grèce antique n'est <b>jamais unifiée</b> : elle est composée de centaines de <b>cités</b> (<i>polis</i>), comme Athènes, Sparte ou Corinthe. Chaque cité possède :</p>\n<ul>\n<li>un <b>territoire</b> (la ville entourée de ses terres agricoles) ;</li>\n<li>ses <b>lois</b>, ses monnaies, son armée et ses cultes propres ;</li>\n<li>une identité forte : un citoyen se définit d'abord par sa cité (« je suis Athénien »), pas par son pays.</li>\n</ul>\n<p>Cette fragmentation n'empêche pas une culture commune : la langue, les dieux de l'Olympe, les Jeux olympiques (tous les quatre ans à Olympie) et les épopées d'Homère rapprochent les Grecs, qui se considèrent comme « ceux qui parlent grec », face aux « barbares ».</p>\n<div class=\"tip\"><b>Pourquoi cette géographie ?</b> Des montagnes et des mers découpent le territoire : aucune cité ne peut dominer l'ensemble. La mer est partout proche : les Grecs deviennent d'excellents marins, commerçants et fondateurs de colonies (Marseille vers 600 av. J.-C., en Sicile, en mer Noire).</div>\n\n<h3>2. Athènes : l'invention de la démocratie</h3>\n<p>Au Ve siècle av. J.-C., Athènes invente un régime nouveau : la <b>démocratie</b> (« pouvoir du peuple »). Après les réformes de Clisthène (508-507 av. J.-C.) :</p>\n<ul>\n<li>l'<b>Ecclésia</b> (l'assemblée des citoyens) vote les lois et décide de la guerre ;</li>\n<li>la <b>boulè</b> (conseil de 500 citoyens tirés au sort) prépare les décisions ;</li>\n<li>l'<b>héliée</b> (tribunal, jurés tirés au sort) juge les affaires ;</li>\n<li>la <b>stratégie</b> : dix généraux élus dirigent l'armée.</li>\n</ul>\n<div class=\"warn\"><b>Une démocratie limitée :</b> les citoyens ne sont que les hommes adultes nés de parents athéniens — environ 10 % de la population ! Sont exclus : les <b>femmes</b>, les <b>métèques</b> (étrangers libres) et les <b>esclaves</b>. C'est pourtant une invention majeure : pour la première fois, des hommes ordinaires participent directement au pouvoir, et la parodie ou la critique des puissants est tolérée (les comédies d'Aristophane se moquent des politiques devant tout le peuple).</div>\n<p>Athènes connaît son siècle d'or sous <b>Périclès</b> (443-429 av. J.-C.) : reconstruction de l'Acropole (le Parthénon), développement du théâtre et de la philosophie (Socrate). Mais la longue <b>guerre du Péloponnèse</b> (431-404) contre Sparte épuise la cité, qui ne s'en remet jamais complètement.</p>\n\n<h3>3. Rome : de la République à l'Empire</h3>\n<p>Rome serait fondée en <b>753 av. J.-C.</b> La légende en fait une fondation guerrière (Romulus et Rémus, allaités par une louve). Son histoire se découpe en trois grandes périodes :</p>\n<ol>\n<li>la <b>royauté</b> (753-509 av. J.-C.) : des rois étrusques gouvernent la petite cité ;</li>\n<li>la <b>République</b> (509-27 av. J.-C.) : le pouvoir appartient à des magistrats élus pour un an — deux <b>consuls</b> en tête, un <b>Sénat</b> qui dirige vraiment, des assemblées de citoyens. C'est l'époque de la conquête de la Méditerranée ( guerres puniques contre Carthage : 264-146) ;</li>\n<li>l'<b>Empire</b> (27 av. J.-C.-476 apr. J.-C.) : après un siècle de guerres civiles (César assassiné en 44 av. J.-C.), <b>Auguste</b> prend tous les pouvoirs en 27 av. J.-C. : il est le premier empereur, tout en gardant l'apparence républicaine.</li>\n</ol>\n<p>L'Empire romain, à son apogée au IIe siècle, s'étend de la Bretagne à l'Égypte, de l'Espagne à la Mésopotamie : environ 5 millions de km² et 50 à 70 millions d'habitants. Il tient par :</p>\n<ul>\n<li>l'<b>armée</b> : des légions de soldats professionnels, fidèles d'abord à leur empereur ;</li>\n<li>le <b>droit romain</b> : une législation écrite commune qui protège les citoyens et encadre les contrats ;</li>\n<li>la <b>pax romana</b> : la paix intérieure, qui permet le commerce sur de longues distances ;</li>\n<li>les <b>villes</b> : chaque cité conquise reçoit des thermes, un forum, un théâtre, des routes pavées — la romanisation fait adhérer les élites locales.</li>\n</ul>\n\n<h3>4. La naissance du christianisme et la fin de l'Empire d'Occident</h3>\n<p>Dans la province romaine de Judée, <b>Jésus</b> prêche vers 30 apr. J.-C. : son message est repris par ses disciples, surtout <b>Paul</b>, qui étend la nouvelle religion aux non-juifs. Longtemps persécutés (chrétiens livrés aux bêtes dans l'arène), les chrétiens gagnent peu à peu l'Empire :</p>\n<ul>\n<li><b>313</b> : l'<b>édit de Milan</b> — l'empereur Constantin autorise le christianisme ;</li>\n<li><b>380</b> : l'édit de Thessalonique fait du christianisme la <b>religion officielle</b> de l'Empire ;</li>\n<li><b>325</b> : concile de Nicée — les évêques fixent les croyances communes (le <b>credo</b>) : l'Église s'organise.</li>\n</ul>\n<p>À partir du IIIe siècle, l'Empire est fragilisé par les invasions germaniques, les crises économiques et les luttes pour le pouvoir. En <b>395</b>, il est définitivement coupé en deux : l'Empire d'Orient (Byzance) et l'Empire d'Occident. Le dernier empereur d'Occident est déposé en <b>476</b> : cette date marque traditionnellement la fin de l'Antiquité en Occident.</p>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"20\" y1=\"64\" x2=\"420\" y2=\"64\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"420,64 410,59 410,69\" fill=\"#4f46e5\"/><line x1=\"34.0\" y1=\"64\" x2=\"34.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"34.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Fondation de Rome</text><text x=\"34.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">753 av. J.-C.</text><line x1=\"127.0\" y1=\"64\" x2=\"127.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"127.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"127.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">508 av. J.-C.</text><text x=\"127.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Démocratie d’Athènes</text><line x1=\"220.0\" y1=\"64\" x2=\"220.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"220.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"220.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Auguste empereur</text><text x=\"220.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">27 av. J.-C.</text><line x1=\"313.0\" y1=\"64\" x2=\"313.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"313.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"313.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">313</text><text x=\"313.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Constantin autorise le christianisme</text><line x1=\"406.0\" y1=\"64\" x2=\"406.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"406.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"406.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Chute de Rome</text><text x=\"406.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">476</text></svg><span class=\"fig-cap\">Les cinq dates à retenir de l’Antiquité. Les repères en gras ci-dessus sont ceux à connaître par cœur.</span></div><table>\n<tr><th>Période</th><th>Dates</th><th>Pouvoir</th><th>Repère clé</th></tr>\n<tr><td>Royauté romaine</td><td>753-509 av. J.-C.</td><td>rois étrusques</td><td>fondation légendaire de Rome</td></tr>\n<tr><td>République romaine</td><td>509-27 av. J.-C.</td><td>consuls + Sénat</td><td>conquête de la Méditerranée</td></tr>\n<tr><td>Empire romain</td><td>27 av. J.-C.-476</td><td>empereur</td><td>pax romana, christianisation</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — raconter la vie d'un citoyen athénien</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrivez la journée d'un citoyen athénien du Ve siècle qui participe à une séance de l'Ecclésia. Quelles institutions rencontre-t-il ? Qui croise-t-il dans la rue mais jamais dans l'assemblée ?</div><div class=\"etu\"><b>Étape 1 — Le cadre</b> : il se rend sur la colline de la Pnyx au petit matin ; plusieurs milliers de citoyens sont là, tirés au sort pour vérifier les droits de chacun.</div><div class=\"etu\"><b>Étape 2 — La séance</b> : la boulè a préparé l'ordre du jour ; un héraut lit la proposition, puis les citoyens votent à main levée — c'est la démocratie directe : pas de députés, chacun vote en personne.</div><div class=\"etu\"><b>Étape 3 — Les absents</b> : sa femme (gérée par un tuteur légal, sans droits politiques), l'esclave qui l'accompagne, le métèque marchand du port du Pirée — tous vivent la cité, aucun ne la gouverne.</div><div class=\"etu\"><b>Étape 4 — La conclusion attendue</b> : la démocratie athénienne est à la fois une révolution politique (le peuple gouverne) et un régime restrictif (citoyenneté très fermée) : toujours montrer les deux faces.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Ne pas confondre <b>démocratie athénienne</b> (directe : les citoyens votent eux-mêmes les lois) et <b>démocratie représentative</b> moderne (on élit des députés).</li>\n<li>La Grèce n'est <b>jamais unifiée</b> : parler des « Grecs » comme d'un seul pays est anachronique — chaque cité a ses lois et ses monnaies.</li>\n<li>Rome n'est pas toujours un empire : la <b>République</b> précède l'Empire de près de cinq siècles, avec des consuls élus pour un an.</li>\n<li>Les chrétiens sont d'abord <b>persécutés</b> : l'édit de Milan (313) est une autorisation, pas encore une religion d'État (380).</li>\n<li>476 = chute de l'Empire d'<b>Occident</b> seulement : l'Empire d'Orient (Byzance) dure encore mille ans, jusqu'en 1453.</li>\n</ul>\n</div>"

    "id": "debuts-judaisme-christianisme",
    "theme": "Les débuts du judaïsme et du christianisme (Collège)",
    "niveau": "Collège",
    "titre": "Les débuts du judaïsme et du christianisme",
    "cours": "<div class=\"cours-head\"><h2>Les débuts du judaïsme et du christianisme</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le judaïsme, première religion monothéiste</h3>\n<ul>\n<li>Le judaïsme naît au <b>Proche-Orient</b>, parmi les <b>Hébreux</b> ;</li>\n<li>Croyance en <b>un seul Dieu</b> (monothéisme) qui établit une <b>Alliance</b> avec son peuple ;</li>\n<li>Personnages clés : <b>Abraham</b> (père des croyants), <b>Moïse</b> (qui reçoit les Tables de la Loi) ;</li>\n<li>Texte sacré : la <b>Bible hébraïque</b> (Torah, Prophètes, Écrits).</li>\n</ul>\n\n<h3>2. Jésus et les débuts du christianisme</h3>\n<ul>\n<li><b>Jésus</b> prêche en Judée (Palestine) au <b>1er siècle de notre ère</b>, dans l'Empire romain ;</li>\n<li>Ses disciples le reconnaissent comme le <b>messie</b> (le Christ, « l'oint ») ;</li>\n<li>Après sa mort, ses apôtres (Paul notamment) diffusent la nouvelle religion dans l'Empire romain ;</li>\n<li>Symbole de l'expansion : l'Église est d'abord <b>persécutée</b>, puis reconnue au 4e siècle (édit de Milan, 313 : liberté de culte ; christianisme religion d'État à la fin du 4e siècle).</li>\n</ul>\n\n<h3>3. Une source commune : la Bible</h3>\n<ul>\n<li>La <b>Bible</b> chrétienne reprend l'Ancien Testament (Bible hébraïque) et y ajoute le <b>Nouveau Testament</b> (Évangiles, Actes, lettres) ;</li>\n<li>Judaïsme et christianisme partagent donc une racine commune à une <b>seule divinité</b> et à des textes proches.</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Les Hébreux étaient polythéistes » : non, le judaïsme est le premier grand <b>monothéisme</b>.</li>\n<li>Confondre <b>avant</b> et <b>après</b> J.-C. : Abraham ≈ −2000 (avant) ; Jésus ≈ année 30 (après).</li>\n<li>« Le christianisme s'est diffusé instantanément » : plusieurs siècles, d'abord contre lui.</li>\n<li>La Bible n'est pas un seul livre : c'est un <b>ensemble</b> de textes écrits longtemps.</li>\n</ul>\n</div>"
  },

    "id": "moyen-age",
    "theme": "Le Moyen Âge : féodalité, Église et croisades (Collège)",
    "niveau": "Collège",
    "titre": "Le Moyen Âge : féodalité, Église et croisades",
    "cours": "<div class=\"cours-head\"><h2>Le Moyen Âge : féodalité, Église et croisades</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Un monde recomposé après la chute de Rome</h3>\n<p>Après 476, l'Occident se fragmente : les royaumes « barbares » (Francs, Wisigoths, Ostrogoths) se partagent les terres de l'ancien Empire. Puis trois pouvoirs tentent de rassembler l'Occident :</p>\n<ul>\n<li>l'<b>Empire carolingien</b> : Charlemagne est couronné empereur à Rome en <b>800</b> ; son empire est bientôt partagé (traité de Verdun, 843) ;</li>\n<li>l'<b>Église</b> : seule structure qui subsiste partout — évêchés, monastères, pape à Rome ;</li>\n<li>en France, la dynastie des <b>Capétiens</b> à partir de <b>987</b> (Hugues Capet) : un roi élu, d'abord très faible, dont le pouvoir ne dépasse pas l'Île-de-France.</li>\n</ul>\n<p>De nouvelles vagues d'invasions (Vikings au nord, Sarrasins au sud, Hongrois à l'est) affaiblissent les rois : les populations se tournent vers les <b>seigneurs locaux</b>, qui peuvent les protéger. C'est le cadre de la féodalité.</p>\n\n<h3>2. La société féodale : seigneurs, vassaux et paysans</h3>\n<p>La féodalité organise la société comme une pyramide de liens personnels :</p>\n<ol>\n<li>le <b>hommage</b> : un seigneur (le suzerain) concède un fief (une terre) à un vassal, qui lui prête serment de fidélité ;</li>\n<li>le vassal doit l'<b>aide</b> (militaire) et le <b>conseil</b> à son suzerain ;</li>\n<li>en échange, le suzerain <b>protège</b> son vassal.</li>\n</ol>\n<p>Les liens se superposent : un comte peut être vassal du roi et suzerain de chevaliers. Le roi n'est souvent que le sommet <b>théorique</b> de la pyramide.</p>\n<div class=\"tip\"><b>La vie quotidienne :</b> l'immense majorité des habitants sont des <b>paysans</b> : libres ou serfs, ils cultivent les terres de la seigneurie et doivent au seigneur des corvées (travaux) et des redevances (une partie de la récolte, le moulin et le four banal). En échange, le seigneur assure l'ordre et la justice, et l'Église explique le monde : le temps (les cloches), les fêtes, la charité et la peur de l'enfer.</div>\n<div class=\"fig\"><svg viewBox=\"0 0 440 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Pyramide feodale\">\n  <polygon points=\"220,20 170,70 270,70\" fill=\"#4f46e5\"/>\n  <text x=\"220\" y=\"16\" font-size=\"10.5\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">Roi (suzerain supême)</text>\n  <polygon points=\"150,80 90,140 290,140 210,80\" fill=\"#818cf8\"/>\n  <text x=\"190\" y=\"115\" font-size=\"10\" fill=\"#1e1b4b\" text-anchor=\"middle\">Seigneurs laïcs (ducs, comtes, châtelains)</text>\n  <text x=\"190\" y=\"128\" font-size=\"9\" fill=\"#1e1b4b\" text-anchor=\"middle\">et seigneurs ecclésiastiques (évêques, abbés)</text>\n  <rect x=\"30\" y=\"148\" width=\"380\" height=\"14\" fill=\"#c7d2fe\"/>\n  <text x=\"220\" y=\"159\" font-size=\"10\" fill=\"#1e1b4b\" text-anchor=\"middle\">Paysans (libres et serfs) — plus de 90 % de la population</text>\n  <text x=\"300\" y=\"60\" font-size=\"9.5\" fill=\"#64748b\">hommage &#8595; / protection &#8593;</text>\n</svg><span class=\"fig-cap\">La pyramide féodale : chaque étage est lié à celui du dessus par le serment d'hommage (aide militaire et conseil) contre la protection et le fief.</span></div>\n\n<h3>3. L'Église, au cœur de la vie médiévale</h3>\n<p>L'Église catholique structure toute la société :</p>\n<ul>\n<li><b>la chrétienté</b> : l'Occident entier partage la même foi, les mêmes sacrements (baptême, mariage, extrême-onction) ;</li>\n<li><b>le clergé</b> : séculier (curés, évêques, pape) et régulier (moines vivant en monastères, qui copient les manuscrits, cultivent, soignent et accueillent) ;</li>\n<li><b>le calendrier</b> : l'année est rythmée par les fêtes religieuses (Noël, Pâques) ; la semaine par la messe dominicale ; la vie par les sacrements ;</li>\n<li><b>les savoirs</b> : les écoles cathédrales puis les <b>universités</b> (Bologne, Paris, Oxford) enseignent le trivium et le quadrivium — toute la culture passe par l'Église.</li>\n</ul>\n<p>L'Église est aussi un pouvoir temporel : elle possède des terres, perçoit la <b>dîme</b> (impôt sur les récoltes), exhorte les rois et lance de grands projets — notamment les croisades.</p>\n\n<h3>4. Les croisades et l'essor des villes</h3>\n<p>En <b>1095</b>, au concile de Clermont, le pape <b>Urbain II</b> appelle les chevaliers à libérer Jérusalem, tombée aux mains des Turcs : « Dieu le veut ! ». Huit croisades suivent, de 1096 à 1291 :</p>\n<ul>\n<li><b>1099</b> : prise de Jérusalem et création des États latins d'Orient ;</li>\n<li>les croisades deviennent des pèlerinages armés, promettant le salut à ceux qui participent ;</li>\n<li>après 1291 (chute de Saint-Jean-d'Acre), les chrétiens perdent la Terre sainte — mais les échanges avec l'Orient se sont intensifiés.</li>\n</ul>\n<p>À partir du XIIe siècle, l'Occident se transforme :</p>\n<ul>\n<li>les <b>villes</b> croissent (bourgs, faubourgs) : artisans et marchands s'y regroupent ; les habitants obtiennent des <b>chartes de franchises</b> (comme Paris) ;</li>\n<li>le <b>commerce</b> reprend : foires de Champagne, routes vers l'Italie ;</li>\n<li>les <b>cathédrales gothiques</b> (Chartres, Amiens, Paris) s'élèvent — prouesses techniques de pierre et de lumière ;</li>\n<li>la <b>peste noire</b> (1347-1352) tue un tiers de la population européenne : choc majeur qui bouleverse l'économie et prépare les révoltes paysannes.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"20\" y1=\"64\" x2=\"420\" y2=\"64\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"420,64 410,59 410,69\" fill=\"#4f46e5\"/><line x1=\"34.0\" y1=\"64\" x2=\"34.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"34.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Charlemagne empereur</text><text x=\"34.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">800</text><line x1=\"127.0\" y1=\"64\" x2=\"127.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"127.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"127.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">987</text><text x=\"127.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Hugues Capet</text><line x1=\"220.0\" y1=\"64\" x2=\"220.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"220.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"220.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Appel d’Urbain II</text><text x=\"220.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1095</text><line x1=\"313.0\" y1=\"64\" x2=\"313.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"313.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"313.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1200s</text><text x=\"313.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Villes et cathédrales</text><line x1=\"406.0\" y1=\"64\" x2=\"406.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"406.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"406.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Peste noire</text><text x=\"406.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1347</text></svg><span class=\"fig-cap\">Les grandes étapes du Moyen Âge : construction des royaumes, essor de l’Église, croisades, urbanisation, puis le choc de la peste.</span></div><details class=\"ex-util\"><summary>💡 Focus sur... — analyser une scène d'hommage féodal</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un texte décrit un comte qui, à genoux, mains jointes entre celles du duc, prononce : « Je deviens votre homme. » Analysez la cérémonie.</div><div class=\"etu\"><b>Étape 1 — Décrire les gestes</b> : immixtio manuum (les mains jointes du vassal dans celles du suzerain), l'osculum (baiser de paix) : les gestes matérialisent un contrat solennel, plus fort qu'une signature à une époque où peu savent écrire.</div><div class=\"etu\"><b>Étape 2 — Identifier les devoirs</b> : le vassal promet l'aide militaire (40 jours de service par an), le conseil (assister à la cour du suzerain) ; le suzerain promet protection et concession du fief.</div><div class=\"etu\"><b>Étape 3 — Remettre en contexte</b> : en temps de guerres locales et d'invasions, la protection armée vaut plus que l'or ; le roi n'est qu'un suzerain parmi d'autres : le lien personnel prime sur le lien territorial.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la féodalité n'est pas un « chaos » mais un système de droits et devoirs réciproques — dont témoignent les chartes et les récits de cérémonies.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Féodalité ≠ « désordre » : c'est un système organisé de liens contractuels (hommage, fief, protection).</li>\n<li>Le <b>serf</b> n'est pas un esclave : il est attaché à la terre mais a une famille, une maison et des biens reconnus par la coutume.</li>\n<li>Les croisades ne visent pas à « convertir » : c'est un pèlerinage armé pour reprendre des lieux saints, promettant le salut.</li>\n<li>987 (Hugues Capet) ne crée pas une France moderne : le roi capétien est d'abord un grand seigneur parmi d'autres.</li>\n<li>La peste noire (1347) frappe un Occident déjà en croissance : elle ralentit brutalement un essor urbain et commercial commencé deux siècles plus tôt.</li>\n</ul>\n</div>"

    "id": "renaissance",
    "theme": "La Renaissance : humanisme et réformes religieuses (Collège)",
    "niveau": "Collège",
    "titre": "La Renaissance : humanisme et réformes religieuses",
    "cours": "<div class=\"cours-head\"><h2>La Renaissance : humanisme et réformes religieuses</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'humanisme : l'homme au centre du monde</h3>\n<p>À partir du XVe siècle, un nouveau courant intellectuel naît en Italie et se diffuse en Europe : l'<b>humanisme</b>. Les humanistes :</p>\n<ul>\n<li>remettent l'<b>homme</b> au centre de la réflexion (et plus Dieu seul) : chacun doit cultiver ses talents, s'instruire, agir dans le monde ;</li>\n<li>retournent aux <b>textes antiques</b> (Grèce, Rome) qu'ils recherchent dans les bibliothèques, traduisent et impriment ;</li>\n<li>veulent <b>réformer</b> la société par l'éducation : écoles, collèges, pédagogie nouvelle ;</li>\n<li>contestent les autorités établies : chacun doit lire et comprendre par soi-même.</li>\n</ul>\n<div class=\"tip\"><b>Figures à connaître :</b> <b>Érasme</b> (humaniste européen, critique les abus de l'Église en appelant à revenir à l'Évangile), <b>Léonard de Vinci</b> (artiste-ingénieur : la Joconde, mais aussi machines volantes et dissections), <b>Gutenberg</b> (imprimeur), <b>Rabelais</b> et <b>Montaigne</b> en France.</div>\n<p>Une invention accélère tout : vers <b>1450</b>, <b>Gutenberg</b> met au point l'<b>imprimerie</b> à caractères métalliques mobiles. La <b>Bible de Gutenberg</b> (vers 1455) ouvre une révolution :</p>\n<ul>\n<li>les livres deviennent <b>nombreux, rapides et bon marché</b> (un ouvrage en semaines au lieu de mois de copie à la main) ;</li>\n<li>les idées circulent à travers toute l'Europe : imprimeurs, libraires et universités forment un réseau ;</li>\n<li>la lecture se répand — y compris la lecture <b>individuelle et silencieuse</b> : chacun peut se faire son propre jugement, ce qui prépare la Réforme et les Lumières.</li>\n</ul>\n\n<h3>2. Un nouveau regard sur le monde : artistes et explorateurs</h3>\n<p>Les artistes de la Renaissance renouvellent la peinture et l'architecture en s'inspirant de l'Antiquité :</p>\n<ul>\n<li>la <b>perspective</b> : construire l'illusion de la profondeur (Brunelleschi, Alberti) ;</li>\n<li>le <b>corps humain</b> étudié avec précision (anatomie, nus, portraits réalistes) ;</li>\n<li>de grands mécènes : les <b>Médicis</b> à Florence, les papes à Rome — Léonard de Vinci, Michel-Ange (le plafond de la chapelle Sixtine, le David), Raphaël.</li>\n</ul>\n<p>En même temps, les grandes découvertes élargissent le monde connu :</p>\n<ul>\n<li><b>1492</b> : <b>Christophe Colomb</b> atteint l'Amérique (pensant rejoindre l'Asie par l'ouest) ;</li>\n<li><b>1498</b> : <b>Vasco de Gama</b> contourne l'Afrique et ouvre la route des Indes ;</li>\n<li><b>1522</b> : l'expédition <b>Magellan</b> accomplit le premier tour du monde ;</li>\n<li>conséquences : échanges de plantes et d'animaux, or américain, développement de l'esclavage colonial et premières colonisations (Conquistadores : Cortés au Mexique en 1519-1521).</li>\n</ul>\n\n<h3>3. Les réformes religieuses : la chrétienté se brise</h3>\n<p>L'humanisme, qui invite chacun à lire les textes par soi-même, met en lumière les écarts entre le message évangélique et les pratiques de l'Église : les abus (vente des indulgences, richesses, cumul des charges). En <b>1517</b>, le moine allemand <b>Martin Luther</b> publie ses <b>95 thèses</b> contre les indulgences :</p>\n<ul>\n<li>le salut vient de la <b>foi</b> seule, pas des œuvres ni des achats ;</li>\n<li>l'autorité repose sur la <b>Bible</b> seule — que chacun doit pouvoir lire dans sa langue (Luther la traduit en allemand) ;</li>\n<li>ni pape ni concile ne peuvent décider seul de la vérité.</li>\n</ul>\n<p>La rupture est consommée : Luther est excommunié en 1521, mais ses idées, diffusées par l'imprimerie, gagnent l'Allemagne, la Suisse (<b>calvinisme</b> à Genève), l'Angleterre (Henri VIII rompt avec Rome en 1534 : naissance de l'anglicanisme) et la France (courant protestant huguenot). L'Église catholique réagit à son tour : c'est la <b>Contre-Réforme (Réforme catholique)</b>, lancée par le <b>concile de Trente</b> (1545-1563) :</p>\n<ul>\n<li>confirmation des dogmes (transsubstantiation, sept sacrements) et refus du mariage des prêtres ;</li>\n<li>création de la <b>Société de Jésus</b> (jésuites, 1540) : éducation, missions, reconquête des âmes ;</li>\n<li>réforme des abus (formation des prêtres, interdiction de la vente des indulgences) ;</li>\n<li>remise en ordre de l'art : le <b>baroque</b> (grandes églises, émotions visibles) doit séduire et convaincre.</li>\n</ul>\n<p>En France, les <b>guerres de religion</b> (1562-1598) opposent catholiques et protestants (massacre de la Saint-Barthélemy en 1572). Elles s'achèvent par l'<b>édit de Nantes</b> (1598) : Henri IV accorde aux protestants la liberté de culte — un édit de tolérance exceptionnel pour l'époque.</p>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"20\" y1=\"64\" x2=\"420\" y2=\"64\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"420,64 410,59 410,69\" fill=\"#4f46e5\"/><line x1=\"34.0\" y1=\"64\" x2=\"34.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"34.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Imprimerie</text><text x=\"34.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1450</text><line x1=\"127.0\" y1=\"64\" x2=\"127.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"127.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"127.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1492</text><text x=\"127.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Voyage de Colomb</text><line x1=\"220.0\" y1=\"64\" x2=\"220.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"220.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"220.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">95 thèses de Luther</text><text x=\"220.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1517</text><line x1=\"313.0\" y1=\"64\" x2=\"313.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"313.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"313.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1545</text><text x=\"313.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Concile de Trente</text><line x1=\"406.0\" y1=\"64\" x2=\"406.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"406.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"406.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Édit de Nantes</text><text x=\"406.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1598</text></svg><span class=\"fig-cap\">La Renaissance en cinq dates : l’imprimerie change la diffusion des idées, le monde s’agrandit, la chrétienté se divise puis se réforme.</span></div><details class=\"ex-util\"><summary>💡 Focus sur... — expliquer le rôle de l'imprimerie dans la Réforme</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Sans l'imprimerie, Luther serait resté un simple moine allemand. » Expliquez cette phrase.</div><div class=\"etu\"><b>Étape 1 — La diffusion</b> : les 95 thèses, écrites en latin, sont imprimées et réimprimées, traduites en allemand : en quelques semaines, tout le Saint-Empire en parle ; les brochures et gravures (souvent satiriques contre le pape) touchent même les illettrés car les images circulent.</div><div class=\"etu\"><b>Étape 2 — La lecture directe</b> : Luther traduit la Bible en allemand (1522-1534) ; chaque lecteur peut désormais confronter le texte sacré aux pratiques de l'Église — c'est exactement le programme humaniste appliqué à la religion.</div><div class=\"etu\"><b>Étape 3 — L'impossible retour</b> : une rumeur s'éteint, un livre reste ; les autorités ne peuvent plus confisquer tous les exemplaires : la rupture religieuse devient durable et géographique (nord de l'Europe protestant, sud catholique).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : l'imprimerie est l'accélérateur technique de la Réforme — une invention modifie le cours religieux de l'Europe : c'est un bon exemple de lien entre technique et société.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Humanisme ≠ « amour de l'humanité » seulement : c'est un programme intellectuel — retour aux textes antiques, éducation, jugement personnel.</li>\n<li>Colomb ne sait pas qu'il atteint un nouveau continent : il croit jusqu'à sa mort avoir touché l'Asie.</li>\n<li>La Réforme commence en <b>1517</b> (95 thèses), pas avec Calvin (Genève, années 1540) ni Henri VIII (1534).</li>\n<li>Contre-Réforme ≠ simple rejet : le concile de Trente réforme aussi les abus internes (formation des prêtres, indulgences).</li>\n<li>L'édit de Nantes (1598) est un édit de <b>tolérance</b> (liberté de culte aux protestants), pas une conversion de la France au protestantisme.</li>\n</ul>\n</div>"

    "id": "absolutisme",
    "theme": "L'absolutisme royal et les Lumières (Collège)",
    "niveau": "Collège",
    "titre": "L'absolutisme royal et les Lumières",
    "cours": "<div class=\"cours-head\"><h2>L'absolutisme royal et les Lumières</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'absolutisme de droit divin</h3>\n<p>Au XVIIe siècle, les rois de France concentrent tous les pouvoirs : c'est la <b>monarchie absolue de droit divin</b> :</p>\n<ul>\n<li>le roi tient son pouvoir de <b>Dieu</b> et ne rend de comptes qu'à lui ;</li>\n<li>il <b>concentre</b> les pouvoirs : législatif (il fait les lois), exécutif (il gouverne), judiciaire (la justice rendue en son nom) ;</li>\n<li>il <b>ne partage pas</b> la souveraineté : les assemblées d'États existent dans certaines provinces, mais le roi peut les ignorer ;</li>\n<li>il gouverne avec des <b>ministres</b> et des <b>commissaires</b> (intendants) envoyés dans les provinces pour appliquer sa volonté.</li>\n</ul>\n<div class=\"tip\"><b>Louis XIV (1643-1715), l'absolutisme au sommet :</b> après la révolte nobiliaire de la Fronde (1648-1653), le jeune roi décide de dominer les grands :\n<ul>\n<li>1661 : mort de Mazarin — Louis XIV gouverne <b>personnellement</b> (« L'État, c'est moi » selon la légende) ;</li>\n<li>il impose l'étiquette de <b>Versailles</b> : la noblesse vit auprès du roi (grands appartements, fêtes, pensions) — surveillée et domestiquée par le faste ;</li>\n<li>il révoque l'édit de Nantes en <b>1685</b> (dragonnades contre les protestants : plus de 200 000 huguenots s'exilent) ;</li>\n<li>colbertisme (Colbert) : manufactures royales, commerce protégé — mais les guerres (Pays-Bas, Succession d'Espagne) épuisent le royaume.</li>\n</ul>\n</div>\n\n<h3>2. Le roi, la cour et la société d'Ancien Régime</h3>\n<p>La société d'<b>Ancien Régime</b> est une société d'ordres, inégale devant l'impôt :</p>\n<table>\n<tr><th>Ordre</th><th>Qui ?</th><th>Privilèges</th></tr>\n<tr><td>Clergé (premier ordre)</td><td>curés, évêques, moines</td><td>exemption d'impôt, dîme, terres</td></tr>\n<tr><td>Noblesse (second ordre)</td><td>noblesse d'épée, de robe, de cour</td><td>exemption d'impôt, chasses, seigneuries, honneurs</td></tr>\n<tr><td>Tiers état</td><td>bourgeois, paysans, artisans, ouvriers (98 % des Français)</td><td>payer tous les impôts (taille, gabelle, dîme, droits féodaux)</td></tr>\n</table>\n<p>La cour de Versailles est le théâtre du pouvoir : loger près du roi, obtenir une charge, une pension ou un regard, est vital pour la noblesse. Le château (40 000 ouvriers, des milliers d'arbres transplantés) exprime la grandeur : le roi soleil rayonne sur l'Europe — les autres cours imitent Versailles (« modèle exporté » à Vienne, Madrid, Naples...).</p>\n\n<h3>3. Le XVIIIe siècle : l'esprit des Lumières</h3>\n<p>Au XVIIIe siècle, un mouvement intellectuel conteste l'ordre établi : les <b>Lumières</b>. Leurs idées :</p>\n<ul>\n<li>la <b>raison</b> doit guider les hommes, pas la tradition ni la superstition ;</li>\n<li>la <b>liberté</b> individuelle (conscience, expression, commerce) et l'<b>égalité</b> devant la loi ;</li>\n<li>la <b>séparation</b> des pouvoirs (Montesquieu, <i>De l'esprit des lois</i>, 1748) pour éviter l'arbitraire ;</li>\n<li>la <b>souveraineté nationale</b> : le pouvoir vient du peuple (Rousseau, <i>Du contrat social</i>, 1762) ;</li>\n<li>le <b>progrès</b> et la tolérance (Voltaire combat l'intolérance et les fanatismes) ;</li>\n<li>l'attaque frontale contre l'Ancien Régime : encyclopédie de Diderot et d'Alembert (1751-1772, 28 volumes, 4 000 exemplaires par volume — malgré la censure).</li>\n</ul>\n<div class=\"tip\"><b>La diffusion :</b> les idées circulent par les livres et brochures, les salons (conversations aristocratiques et bourgeoises), les cafés, les académies de province, la presse, les loges maçonniques — et malgré la <b>censure</b> royale et ecclésiastique (livres interdits, emprisonnements, l'<i>Encyclopédie</i> est suspendue puis rééditée).</div>\n<p>Des souverains essayent de concilier absolutisme et Lumières : Frédéric II de Prusse, Catherine II de Russie, Joseph II d'Autriche — le « despotisme éclairé ». En France, Louis XVI convoque les notables, mais les réformes échouent : la crise financière s'aggrave (guerre d'indépendance américaine, 1778-1783), et l'esprit nouveau prépare la Révolution.</p>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"20\" y1=\"64\" x2=\"420\" y2=\"64\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"420,64 410,59 410,69\" fill=\"#4f46e5\"/><line x1=\"34.0\" y1=\"64\" x2=\"34.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"34.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Règne personnel de Louis XIV</text><text x=\"34.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1661</text><line x1=\"127.0\" y1=\"64\" x2=\"127.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"127.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"127.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1685</text><text x=\"127.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Révocation de Nantes</text><line x1=\"220.0\" y1=\"64\" x2=\"220.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"220.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"220.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Mort de Louis XIV</text><text x=\"220.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1715</text><line x1=\"313.0\" y1=\"64\" x2=\"313.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"313.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"313.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1751</text><text x=\"313.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Encyclopédie</text><line x1=\"406.0\" y1=\"64\" x2=\"406.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"406.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"406.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Révolution française</text><text x=\"406.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1789</text></svg><span class=\"fig-cap\">De l’apogée de l’absolutisme à la contestation des Lumières : un siècle et demi qui mène à 1789.</span></div><details class=\"ex-util\"><summary>💡 Focus sur... — comprendre « l'État, c'est moi »</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquez la formule attribuée à Louis XIV : que signifie-t-elle sur le plan politique ? En quoi les Lumières la contestent-elles ?</div><div class=\"etu\"><b>Étape 1 — Le sens politique</b> : le roi incarne l'État ; sa volonté est la loi ; aucun corps (parlements, assemblées, Église) ne peut limiter durablement son autorité : la souveraineté est une et indivisible, et elle lui appartient « de Dieu ».</div><div class=\"etu\"><b>Étape 2 — Les instruments</b> : Versailles immobilise la noblesse, les intendants contrôlent les provinces, l'armée et les lois unifient le royaume : la formule décrit une pratique concrète, pas seulement une fierté.</div><div class=\"etu\"><b>Étape 3 — La contestation</b> : Locke puis Montesquieu répondent que le pouvoir sans contrepoids devient arbitraire : il faut séparer législatif, exécutif et judiciaire ; Rousseau renverse la souveraineté : elle appartient au peuple.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la formule résume l'Ancien Régime — et l'objet même que la Révolution va détruire : en 1789, la souveraineté passe du roi à la nation.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Absolutisme ≠ caprice : c'est une <b>doctrine</b> (droit divin, souveraineté indivisible) avec des instruments (intendants, Versailles, police du royaume).</li>\n<li>La société d'ordres n'est pas la société de classes : les ordres sont <b>juridiques</b> (privilèges), pas seulement économiques — un bourgeois reste juridiquement inférieur à un noble pauvre.</li>\n<li>Les Lumières ne sont pas « anti-religieuses » partout : Voltaire combat le fanatisme, Rousseau et plusieurs philosophes restent déistes.</li>\n<li>L'<i>Encyclopédie</i> paraît malgré la censure — avec des privilèges royaux obtenus au fil de l'eau : les Lumières utilisent aussi les circuits du pouvoir.</li>\n<li>Le « despotisme éclairé » n'est pas une démocratie : les souverains éclairés gardent tous les pouvoirs.</li>\n</ul>\n</div>"

    "cours": "<div class=\"cours-head\"><h2>La Révolution française : 1789-1799</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Pourquoi une révolution ? La crise de 1789</h3>\n<p>À la fin du XVIIIe siècle, la France monarchique s'enfonce dans une crise générale :</p>\n<ul>\n<li><b>crise financière</b> : le royaume est endetté (guerres, cour, aide à l'indépendance américaine) ; les tentatives de taxer les privilégiés échouent (assemblée des notables, 1787) ;</li>\n<li><b>crise sociale</b> : la bourgeoisie supporte l'inégalité des ordres et aspire aux charges et aux réformes ; les paysans pâtissent des droits féodaux et des mauvaises récoltes ;</li>\n<li><b>crise politique</b> : le roi gouverne mal, renvoie ses réformateurs (Turgot, Necker) ; l'exemple anglais (1688) et américain (1776) montre qu'un autre régime est possible ;</li>\n<li><b>crise idéologique</b> : les Lumières ont popularisé la souveraineté du peuple, l'égalité devant la loi et la liberté.</li>\n</ul>\n<p>Le 5 mai <b>1789</b>, Louis XVI convoque les <b>États généraux</b> (députés des trois ordres) à Versailles pour voter de nouveaux impôts : le Tiers état (qui représente 98 % des Français) réclame le vote par tête et non par ordre. Refusé, il se proclame <b>Assemblée nationale</b> le 17 juin, jurant de donner une constitution à la France : c'est la <b>révolution juridique</b>.</p>\n\n<h3>2. 1789 : l'année décisive</h3>\n<ol>\n<li><b>20 juin</b> : serment du <b>jeu de paume</b> — les députés jurent de ne pas se séparer avant d'avoir donné une constitution ;</li>\n<li><b>14 juillet</b> : le peuple de Paris prend la <b>Bastille</b>, forteresse-prison symbole de l'arbitraire royal ; les campagnes se soulèvent (la Grande Peur) ;</li>\n<li><b>4 août (nuit du)</b> : l'Assemblée abolit les <b>privilèges féodaux</b> ;</li>\n<li><b>26 août</b> : vote de la <b>Déclaration des droits de l'homme et du citoyen</b> (DDHC) ;</li>\n<li>octobre : le roi est ramené de force à Paris ; l'Assemblée entreprend de réformer toute la France (biens du clergé « mis à disposition de la nation », départements, assignats).</li>\n</ol>\n<div class=\"tip\"><b>La DDHC (26 août 1789), texte fondateur :</b> les hommes naissent et demeurent <b>libres et égaux en droits</b> ; la souveraineté réside dans la <b>nation</b> ; la loi est l'expression de la volonté générale ; les libertés fondamentales sont garanties (expression, presse, propriété, présomption d'innocence). Le principe est posé : le pouvoir n'appartient plus au roi, mais à la nation — c'est la fin de l'Ancien Régime juridique.</div>\n\n<h3>3. De la monarchie constitutionnelle à la République et à la Terreur</h3>\n<p>La Révolution se radicalise par étapes :</p>\n<ul>\n<li><b>1791</b> : première <b>constitution</b> — monarchie constitutionnelle : le roi garde un veto, le vote est censitaire (payants) ; la fuite du roi à Varennes (juin 1791) a détruit sa confiance ;</li>\n<li><b>10 août 1792</b> : insurrection parisienne : la monarchie est renversée ; <b>21 septembre 1792</b> : proclamation de la <b>République</b> ;</li>\n<li>janvier <b>1793</b> : exécution de <b>Louis XVI</b> après un procès ; la France est en guerre contre presque toute l'Europe ;</li>\n<li><b>1793-1794</b> : le gouvernement révolutionnaire (Comité de salut public — <b>Robespierre</b>, Danton) impose la <b>Terreur</b> : lois de suspects, tribunal révolutionnaire, environ 16 600 exécutions ; levée en masse (carnot) d'une armée de 800 000 hommes ; prix Maximum, déchristianisation, calendrier révolutionnaire ;</li>\n<li><b>9-10 thermidor an II (juillet 1794)</b> : chute et exécution de Robespierre — la Terreur s'arrête.</li>\n</ul>\n\n<h3>4. Le Directoire et le 18 Brumaire</h3>\n<p>Après Thermidor, la République se stabilise mal : le <b>Directoire</b> (1795-1799) est un régime fragile, ballotté entre royalistes et jacobins, miné par la guerre et la crise financière. La bourgeoisie possédante souhaite l'ordre. Le général <b>Napoléon Bonaparte</b>, victorieux en Italie, apparaît comme l'homme providentiel : le <b>9-10 novembre 1799 (18 Brumaire)</b>, il renverse le Directoire par un coup d'État et prend le pouvoir avec le Consulat — la Révolution s'achève.</p>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"20\" y1=\"64\" x2=\"420\" y2=\"64\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"420,64 410,59 410,69\" fill=\"#4f46e5\"/><line x1=\"34.0\" y1=\"64\" x2=\"34.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"34.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Assemblée nationale</text><text x=\"34.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">17 juin</text><line x1=\"108.4\" y1=\"64\" x2=\"108.4\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"108.4\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"108.4\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">14 juillet</text><text x=\"108.4\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Prise de la Bastille</text><line x1=\"182.8\" y1=\"64\" x2=\"182.8\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"182.8\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"182.8\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">DDHC</text><text x=\"182.8\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">26 août</text><line x1=\"257.20000000000005\" y1=\"64\" x2=\"257.20000000000005\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"257.2\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"257.2\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">21 sept. 1792</text><text x=\"257.2\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">République</text><line x1=\"331.6\" y1=\"64\" x2=\"331.6\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"331.6\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"331.6\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Terreur</text><text x=\"331.6\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1793-94</text><line x1=\"406.0\" y1=\"64\" x2=\"406.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"406.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"406.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1799</text><text x=\"406.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">18 Brumaire</text></svg><span class=\"fig-cap\">Les six étapes de la décennie révolutionnaire : la France passe de la monarchie absolue au coup d’État de Bonaparte.</span></div><table>\n<tr><th>Régime</th><th>Dates</th><th>Caractéristiques</th></tr>\n<tr><td>Monarchie absolue</td><td>…-1792</td><td>pouvoir du roi de droit divin</td></tr>\n<tr><td>Monarchie constitutionnelle</td><td>1791-1792</td><td>roi + Assemblée élue (censitaire), constitution de 1791</td></tr>\n<tr><td>Convention (République)</td><td>1792-1795</td><td>république, exécution du roi, Terreur 1793-94</td></tr>\n<tr><td>Directoire</td><td>1795-1799</td><td>cinq directeurs, instabilité, guerres</td></tr>\n<tr><td>Consulat</td><td>1799-1804</td><td>Bonaparte premier consul</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — rédiger un développement construit sur 1789</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Montrez que l'année 1789 est une année de rupture. » (développement construit en trois parties)</div><div class=\"etu\"><b>Étape 1 — Une rupture politique</b> : les États généraux deviennent Assemblée nationale (17 juin) ; le serment du jeu de paume fonde la souveraineté de la nation ; la Bastille (14 juillet) et la marche des femmes (5-6 octobre) imposent le nouveau pouvoir au roi.</div><div class=\"etu\"><b>Étape 2 — Une rupture juridique</b> : nuit du 4 août (abolition des privilèges) et DDHC (26 août) : l'égalité devant la loi remplace la société d'ordres ; la constitution se prépare.</div><div class=\"etu\"><b>Étape 3 — Nuancer</b> : tout n'est pas achevé — la monarchie existe jusqu'en 1792 ; les femmes et les domestiques sont exclus du vote ; les troubles durent (Grande Peur, guerre civile naissante) : 1789 ouvre un processus plus qu'il ne referme une époque.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : formulez la thèse : 1789 détruit l'Ancien Régime juridique et invente le citoyen moderne — mais la Révolution continue jusqu'en 1799.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>La DDHC proclame des droits naturels, mais le vote de 1791 reste <b>censitaire</b> : l'égalité proclamée n'est pas l'égalité du suffrage.</li>\n<li>La République est proclamée le <b>21 septembre 1792</b> ; le 10 août est l'insurrection qui rend la monarchie impossible — deux dates différentes.</li>\n<li>La Terreur n'est pas la Révolution entière : elle est un épisode (1793-1794) lié à la guerre et aux menaces intérieures.</li>\n<li>Le 18 Brumaire (1799) <b>achève</b> la Révolution : Bonaparte conserve certains acquis (égalité civile, biens nationaux) mais supprime les libertés politiques.</li>\n<li>Ne pas confondre États généraux (mai), Assemblée nationale (juin), Assemblée constituante (juillet) : la même assemblée change de nom selon son rôle.</li>\n</ul>\n</div>"

    "titre": "Napoléon Bonaparte et l'Empire",
    "cours": "<div class=\"cours-head\"><h2>Napoléon Bonaparte et l'Empire</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'ascension d'un général hors du commun</h3>\n<p>Né en Corse en 1769 dans une famille de petite noblesse, <b>Napoléon Bonaparte</b> est un officier d'artillerie brillant, formé à l'école des Lumières. Son ascension est fulgurante :</p>\n<ul>\n<li><b>1793</b> : victoire de Toulon ;</li>\n<li><b>1795</b> : sauve le Directoire en écrasant une insurrection royaliste (« coup de canon ») ;</li>\n<li><b>1796-1797</b> : campagne d'Italie victorieuse — le général devient une star politique ;</li>\n<li><b>1798-1799</b> : expédition d'Égypte (militairement décevante, mais scientifiquement célèbre — découverte de la pierre de Rosette) ;</li>\n<li><b>1799 (18 Brumaire)</b> : coup d'État — il devient <b>premier consul</b> : la Révolution est finie, l'ordre revient.</li>\n</ul>\n\n<h3>2. Consulat et Empire : le pouvoir personnel</h3>\n<p>Bonaparte consolide un pouvoir de plus en plus personnel :</p>\n<ol>\n<li><b>1799-1804, Consulat</b> : constitution du Consulat (1799) — élections par plébiscite, mais pouvoir exécutif tout-puissant du premier consul ; paix intérieure (fin de la chouannerie), réformes ;</li>\n<li><b>1804, Empire</b> : après le complot royaliste, Bonaparte se proclame <b>empereur des Français</b> (sacre de décembre 1804 — il prend la couronne des mains du pape pour la poser lui-même) ;</li>\n<li><b>1804-1814/1815</b> : gouvernement autoritaire (police de Fouché, censure), plébiscites soignés, noblesse d'Empire créée en 1808.</li>\n</ol>\n<div class=\"tip\"><b>Un pouvoir appuyé sur la gloire et les masses :</b> le régime survit par les victoires et la popularité (soldats, paysans rassurés sur la propriété, bourgeois stabilisés) ; les plébiscites (1800, 1804, 1815) donnent des « oui » écrasants — le pouvoir personnel semble démocratiquement confirmé.</div>\n\n<h3>3. Une œuvre réformatrice durable</h3>\n<p>Napoléon reste dans les mémoires comme un grand réformateur, au moins autant que comme un conquérant :</p>\n<ul>\n<li><b>Code civil</b> (1804, promulgué le 21 mars) : égalité devant la loi, propriété protégée, contrat, laïcité de l'état civil ; il est encore la base de notre droit civil — mais il restaure aussi l'autorité du mari et du père ;</li>\n<li><b>Concordat</b> (1801) : paix religieuse avec l'Église catholique — le clergé est salarié par l'État, les biens des acquéreurs confirmés ;</li>\n<li><b>Banque de France</b> (1800), franc germinal (1803), Chambre de commerce ;</li>\n<li><b>lycées</b> (1802), baccalauréat, université impériale (1808) ;</li>\n<li><b>préfects</b> (1800) et administrative centralisée : l'administration de la France actuelle date de l'Empire ;</li>\n<li><b>Légion d'honneur</b> (1802) : récompense fondée sur le mérite.</li>\n</ul>\n\n<h3>4. L'Empire militaire et la chute</h3>\n<p>L'Empire est aussi un empire militaire, construit contre les coalitions européennes :</p>\n<ul>\n<li><b>1805</b> : victoire d'<b>Austerlitz</b> (« la bataille des trois empereurs ») sur l'Autriche et la Russie ;</li>\n<li><b>1806</b> : Iéna contre la Prusse ; blocus continental (1806) pour asphyxier l'Angleterre — mais il ruine aussi les ports et l'économie européenne ;</li>\n<li><b>1807-1812</b> : apogée : l'Empire compte 130 départements et 44 millions d'habitants ; des royaumes confiés aux frères de l'empereur ;</li>\n<li><b>1812</b> : campagne de <b>Russie</b> désastreuse (600 000 hommes au départ, moins de 100 000 reviennent : le « général Hiver » et la stratégie russe de la terre brûlée) ;</li>\n<li><b>1813-1814</b> : les coalisés entrent en France ; abdication et île d'Elbe ;</li>\n<li><b>1815</b> : les <b>Cents Jours</b> (retour, l'<b>Aigle</b> volé) se terminent à <b>Waterloo</b> (18 juin 1815) : seconde abdication, exil à Sainte-Hélène, mort en 1821.</li>\n</ul>\n<p>Le congrès de <b>Vienne</b> (1814-1815) redessine l'Europe en effaçant l'essentiel des conquêtes, mais l'œuvre administrative et juridique (Code civil) survit à l'Empire.</p>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"20\" y1=\"64\" x2=\"420\" y2=\"64\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"420,64 410,59 410,69\" fill=\"#4f46e5\"/><line x1=\"34.0\" y1=\"64\" x2=\"34.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"34.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">18 Brumaire</text><text x=\"34.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1799</text><line x1=\"127.0\" y1=\"64\" x2=\"127.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"127.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"127.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1804</text><text x=\"127.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Code civil / Empire</text><line x1=\"220.0\" y1=\"64\" x2=\"220.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"220.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"220.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Austerlitz</text><text x=\"220.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1805</text><line x1=\"313.0\" y1=\"64\" x2=\"313.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"313.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"313.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1812</text><text x=\"313.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Campagne de Russie</text><line x1=\"406.0\" y1=\"64\" x2=\"406.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"406.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"406.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Waterloo</text><text x=\"406.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1815</text></svg><span class=\"fig-cap\">L’ascension, l’apogée et la chute de l’Empire : de la prise du pouvoir à Sainte-Hélène.</span></div><details class=\"ex-util\"><summary>💡 Focus sur... — Napoléon : héritier ou adversaire de la Révolution ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> En quoi Bonaparte est-il à la fois l'héritier et le fossoyeur de la Révolution ?</div><div class=\"etu\"><b>Étape 1 — L'héritier</b> : il conserve les acquis essentiels : égalité civile (Code civil), fin des privilèges, biens nationaux confirmés, carrière ouverte aux talents (il n'est pas noble), Concordat pacifié, administration laïque.</div><div class=\"etu\"><b>Étape 2 — Le fossoyeur</b> : il supprime les libertés politiques (censure, police), restaure une monarchie (Empire, noblesse de 1808), le pouvoir vient d'un homme (plébiscites acclamatifs), le Code civil réduit les droits des femmes et des ouvriers (carnet, livret).</div><div class=\"etu\"><b>Étape 3 — L'arbitre</b> : sa formule : « La Révolution est finie » — il propose l'ordre aux possédants contre la garantie des acquis ; c'est ce compromis qui assure sa popularité.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la bonne réponse est toujours nuancée : consolidation des acquis civils + destruction des libertés politiques — deux faces, un même personnage.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Le <b>Code civil</b> (1804) n'est pas la seule codification : codes de procédure, pénal, commerce suivent — mais le Code civil est le pilier à retenir.</li>\n<li>Le Concordat (1801) n'est pas une union de l'État et de l'Église : le catholicisme n'est plus religion d'État, les prêtres sont salariés, les biens restent aux acheteurs.</li>\n<li>1804 double événement : Code civil (mars) et proclamation de l'Empire (mai) — préciser lequel.</li>\n<li>Le blocus continental (1806) vise l'Angleterre mais affaiblit l'économie des ports français et des alliés.</li>\n<li>Waterloo (18 juin 1815) vient après les Cents Jours : la première abdication date de 1814.</li>\n</ul>\n</div>"
  },

    "id": "industrialisation",
    "theme": "La révolution industrielle et la société du XIXe siècle (Collège)",
    "niveau": "Collège",
    "titre": "La révolution industrielle et la société du XIXe siècle",
    "cours": "<div class=\"cours-head\"><h2>La révolution industrielle et la société du XIXe siècle</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La révolution industrielle : des machines qui changent le monde</h3>\n<p>La <b>révolution industrielle</b> naît en Angleterre à la fin du XVIIIe siècle et gagne l'Europe continentale au XIXe. Trois moteurs :</p>\n<ul>\n<li><b>l'énergie</b> : le <b>charbon</b> (machine à vapeur de <b>James Watt</b>, brevetée en 1769) remplace la force de l'eau, des animaux et des bras : les usines peuvent s'installer partout ;</li>\n<li><b>la machine</b> : métiers à tisser mécaniques, hauts fourneaux, puis chaîne de production : la machine <b>multiplie</b> la production par l'homme ;</li>\n<li><b>les transports</b> : <b>chemin de fer</b> (première ligne moderne Stockton-Darlington, 1825 ; en France Paris-Rouen, 1843), bateaux à vapeur : les marchandises et les hommes circulent dix fois plus vite.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Croissance de la production industrielle\">\n  <line x1=\"45\" y1=\"150\" x2=\"415\" y2=\"150\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"45\" y1=\"150\" x2=\"45\" y2=\"15\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <polyline points=\"45,148 115,143 185,133 255,115 325,85 395,40\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <circle cx=\"115\" cy=\"143\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"185\" cy=\"133\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"255\" cy=\"115\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"325\" cy=\"85\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"395\" cy=\"40\" r=\"3.5\" fill=\"#16a34a\"/>\n  <text x=\"115\" y=\"164\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">1850</text><text x=\"185\" y=\"164\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">1860</text><text x=\"255\" y=\"164\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">1880</text><text x=\"325\" y=\"164\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">1900</text>\n  <text x=\"400\" y=\"30\" font-size=\"9.5\" fill=\"#16a34a\" text-anchor=\"end\">production industrielle</text>\n  <text x=\"55\" y=\"30\" font-size=\"9\" fill=\"#475569\">explosion de la production</text>\n  <text x=\"55\" y=\"42\" font-size=\"9\" fill=\"#475569\">grâce à vapeur + chemin de fer</text>\n</svg><span class=\"fig-cap\">La courbe de la production industrielle européenne au XIXe siècle : une croissance exponentielle, sans précédent dans l'histoire humaine — c'est cela, la « révolution » industrielle.</span></div>\n\n<h3>2. Le monde ouvrier : travail, villes, luttes</h3>\n<p>La révolution industrielle crée un nouveau groupe social : les <b>ouvriers</b>. Leurs conditions de travail sont dures :</p>\n<ul>\n<li><b>journées de 12 à 16 heures</b>, travail des enfants et des femmes, salaires très bas, licenciements à volonté ;</li>\n<li>les <b>villes</b> (Manchester, Lille, Lyon) grossissent à toute vitesse : taudis, insalubrité, épidémies (choléra) ; la ville industrielle devient un monde nouveau, sans repères traditionnels ;</li>\n<li>les <b>ateliers</b> sont dangereux (machines sans protection, accidents, maladies pulmonaires des mineurs) ;</li>\n<li>en cas de crise (1847, 1873), le chômage jette des familles entières dans la misère — les émeutes de 1848 partent de là.</li>\n</ul>\n<p>Face à ces conditions, les ouvriers s'organisent :</p>\n<ol>\n<li><b>syndicats</b> : associations de travailleurs pour négocier collectivement (légalisés en France en 1884, loi Waldeck-Rousseau) ;</li>\n<li><b>grèves</b> : arrêt collectif du travail pour obtenir des salaires ou des droits (Révolte des Canuts à Lyon en 1831 et 1834, grèves de 1848 et de 1869-1870) ;</li>\n<li><b>partis ouvriers</b> : le mouvement ouvrier se dote d'objectifs politiques — le <b>marxisme</b> (Marx et Engels, <i>Manifeste du parti communiste</i>, 1848) appelle les « prolétaires » à s'unir ; la <b>SFIO</b> (parti socialiste français) est fondée en 1905.</li>\n</ol>\n\n<h3>3. La Belle Époque et la deuxième révolution industrielle</h3>\n<p>À partir de 1880, une <b>deuxième révolution industrielle</b> transforme encore l'économie :</p>\n<ul>\n<li>nouvelles énergies : <b>électricité</b> et <b>pétrole</b> ;</li>\n<li>nouvelles inventions : automobile (1880s-1900s), avion (Blériot traverse la Manche en 1909), cinéma (frères Lumière, 1895), vaccins (Pasteur) ;</li>\n<li>les <b>usines</b> se concentrent : de grandes entreprises (Renault, Schneider) emploient des milliers d'ouvriers — et les <b>grandes surfaces</b> commerciales (grands magasins : le Bon Marché, 1852) ;</li>\n<li>une <b>belle époque</b> (1900-1914) pour les classes possédantes : expositions universelles (Paris 1889, tour Eiffel ; 1900), loisirs, sport, journaux à grand tirage.</li>\n</ul>\n<div class=\"warn\"><b>Mais ce progrès a un prix :</b> la France et l'Europe restent des sociétés très inégalitaires : une bourgeoisie industrieuse et fortunée vit à côté d'un prolétariat pauvre ; les femmes n'ont ni le droit de vote ni l'égalité civile ; les paysans restent majoritaires en France jusque vers 1930. La « Belle Époque » n'est belle que pour une minorité.</div>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"20\" y1=\"64\" x2=\"420\" y2=\"64\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"420,64 410,59 410,69\" fill=\"#4f46e5\"/><line x1=\"34.0\" y1=\"64\" x2=\"34.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"34.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Machine à vapeur (Watt)</text><text x=\"34.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1769</text><line x1=\"127.0\" y1=\"64\" x2=\"127.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"127.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"127.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1825</text><text x=\"127.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Premier chemin de fer</text><line x1=\"220.0\" y1=\"64\" x2=\"220.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"220.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"220.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Manifeste de Marx</text><text x=\"220.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1848</text><line x1=\"313.0\" y1=\"64\" x2=\"313.0\" y2=\"74\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"313.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"313.0\" y=\"88\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1884</text><text x=\"313.0\" y=\"101\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">Syndicats légaux</text><line x1=\"406.0\" y1=\"64\" x2=\"406.0\" y2=\"54\" stroke=\"#4f46e5\" stroke-width=\"1.2\"/><circle cx=\"406.0\" cy=\"64\" r=\"4.5\" fill=\"#4f46e5\"/><text x=\"406.0\" y=\"32\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\">SFIO</text><text x=\"406.0\" y=\"45\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">1905</text></svg><span class=\"fig-cap\">Les jalons de l’ère industrielle : la machine à vapeur déclenche tout, et le monde ouvrier conquiert lentement ses droits (syndicats, partis).</span></div><table>\n<tr><th>Période</th><th>Énergie clé</th><th>Transports</th><th>Symboles</th></tr>\n<tr><td>1re révolution industrielle (1760-1880)</td><td>charbon, vapeur</td><td>chemin de fer, bateau à vapeur</td><td>usine, mine, locomotive</td></tr>\n<tr><td>2e révolution industrielle (1880-1914)</td><td>électricité, pétrole</td><td>automobile, avion</td><td>auto, cinéma, grands magasins</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — décrire la journée d'un ouvrier en 1850</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> À partir d'un témoignage d'époque, racontez la journée d'un ouvrier du textile à Roubaix en 1850 : horaires, salaire, logement, famille.</div><div class=\"etu\"><b>Étape 1 — Le cadre</b> : départ à l'usine à 5 h, douze heures de travail au bruit des métiers, poussière de coton, chaleur ; le travail est <b>à la tâche</b> (payé à la pièce) : chaque pause coûte.</div><div class=\"etu\"><b>Étape 2 — La famille</b> : la femme et les enfants travaillent aussi (les enfants à la filature dès 8-10 ans) : le salaire familial est la seule sécurité — pas de retraite, ni assurance maladie, ni chômage.</div><div class=\"etu\"><b>Étape 3 — Le logement</b> : un coron ou une chambre en taudis, promiscuité, eau rare, épidémies : l'espérance de vie ouvrière est nettement plus basse que celle des bourgeois.</div><div class=\"etu\"><b>Étape 4 — Conclure sur la conséquence</b> : de ces conditions naissent la mutualisation (cafés, sociétés de secours), les syndicats puis les partis ouvriers : la misère individuelle devient une lutte collective.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Révolution industrielle ≠ un seul pays, une seule date : elle démarre en Angleterre (charbon + coton) vers 1760-1780 et se diffuse ensuite.</li>\n<li>La machine à vapeur (Watt, 1769) précède le chemin de fer (1825) : le <b>train</b> en est l'application majeure, pas l'origine.</li>\n<li>1848 : à la fois révolutions politiques en Europe ET publication du <i>Manifeste</i> de Marx — les deux sont liés (misère ouvrière + révolutions).</li>\n<li>Les syndicats ne sont légaux en France qu'en <b>1884</b> (loi Waldeck-Rousseau) ; avant, la coalition est un délit (loi Le Chapelier, 1791).</li>\n<li>La Belle Époque (1900-1914) n'est pas un âge d'or pour tous : les inégalités et les tensions internationales préparent 1914.</li>\n</ul>\n</div>"

  {
    "id": "colonisation",
