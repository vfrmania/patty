var COURS_META = [
 {
  "id": "espaces-conflit",
  "theme": "De nouveaux espaces de conflit ? (HGGSP)",
  "niveau": "Terminale — HGGSP",
  "titre": "De nouveaux espaces de conflit ?",
  "cours": "<div class=\"cours-head\"><h2>De nouveaux espaces de conflit ?</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Cartographier le monde : une vision qui engage</h3>\n<ul>\n<li><b>une carte n'est jamais neutre</b> : la projection (Mercator gonfle les hautes latitudes : le Groenland paraît immense), le découpage, le centre choisi, les données retenues : la carte est un <b>acte géopolitique</b> ;</li>\n<li><b>gerrymandering</b> : redécouper les circonscriptions pour gagner — manipuler l'espace, c'est manipuler le pouvoir.</li>\n</ul>\n\n<h3>2. Frontières : lignes et zones de conflit</h3>\n<ul>\n<li><b>une frontière n'est pas toujours une ligne nette</b> : environ 46 % des frontières terrestres sont mal définies ou contestées ;</li>\n<li>des <b>frontières héritées</b> de la colonisation (tracées « au cordeau » en Afrique : environ 44 % méridiennes) ;</li>\n<li>des frontières « naturelles » contestées (un fleuve qui change de lit) ;</li>\n<li>des <b>zones grises</b> figées par l'Histoire : le Kaliningrad, le Cachemire, la Corée du Nord.</li>\n</ul>\n\n<h3>3. De nouveaux espaces de conflictualité</h3>\n<ul>\n<li>le conflit s'est <b>déplacé vers les espaces traversiers</b> : mers, détroits, cyberspace, espace extra-atmosphérique, Arctique — des espaces n'appartenant à personne devenus décisifs ;</li>\n<li>des <b>espaces délaissés</b> (Sahel, Somalie) où l'État est absent : de nouveaux acteurs (jihadistes, trafiquants, milices) y prospèrent : le conflit suit le vide étatique ;</li>\n<li>mais ces espaces ne sont pas « sans loi » : le droit international tente de suivre — souvent en retard.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire une carte critique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une carte des « pays en voie de développement » peint l'Afrique en rouge et l'Europe en vert. Quels choix visibles et invisibles orientent la lecture ?</div><div class=\"etu\"><b>Étape 1 — L'indicateur</b> : « développement » mesuré par quoi ? PIB/hab. (l'Angola pétrolier « riche ») ou IDH (espérance de vie, école) ? Le choix change la carte.</div><div class=\"etu\"><b>Étape 2 — La découpe</b> : par États ou par régions ? Le niveau d'analyse fabrique le message (une moyenne nationale masque les écarts internes).</div><div class=\"etu\"><b>Étape 3 — Le seuil</b> : où placer la limite rouge/vert ? Déplacer le seuil d'un dollar change des millions d'habitants de couleur.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : en HGGSP, on interroge toujours : qui a fait cette carte, pour dire quoi ?</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le Cachemire, conflit emblématique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi le Cachemire est-il resté un espace de conflit depuis 1947 entre l'Inde et le Pakistan ?</div><div class=\"etu\"><b>Étape 1 — La faute coloniale</b> : en 1947, la Partition laisse aux États princiers le choix ; le maharaja hindou d'un État majoritairement musulman hésite, l'invasion pachtoune le force à choisir l'Inde.</div><div class=\"etu\"><b>Étape 2 — Guerres et lignes</b> : trois guerres (1947, 1965, 1999), une « ligne de contrôle » de facto (1972), mais aucune reconnaissance : deux puissances nucléaires se regardent sur un glacier (Siachen, 6000 m : la guerre la plus haute du monde).</div><div class=\"etu\"><b>Étape 3 — Lecture HGGSP</b> : le conflit est frontalier ET identitaire ET hydrique (l'Indus prend sa source au Cachemire) : un même espace concentre plusieurs conflictualités.</div><div class=\"etu\"><b>Étape 4 — Élargir</b> : l'Arctique illustre le nouveau type : pas de guerre ouverte, mais un affrontement de droit, de science et de présence — la conflictualité sans bataille.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>une carte n'est jamais neutre : interroger source, découpe, seuils ;</li>\n<li>frontière ≠ ligne : souvent une zone contestée ;</li>\n<li>l'Arctique n'est pas « sans loi » : Montego Bay (1982) structure la compétition (ZEE, plateaux étendus, dossiers scientifiques à l'ONU) ;</li>\n<li>« nouveaux espaces » ne veut pas dire « sans droit ».</li>\n</ul>\n</div>"
 },
 {
  "id": "mers-oceans",
  "theme": "Mers et océans : espaces de convoitises (HGGSP)",
  "niveau": "Terminale — HGGSP",
  "titre": "Mers et océans : espaces de convoitises",
  "cours": "<div class=\"cours-head\"><h2>Mers et océans : espaces de convoitises</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Un monde maritimisé : pourquoi les mers sont-elles devenues centrales ?</h3>\n<p>Environ <b>90 % du commerce mondial transite par la mer</b>. Notre économie dépend donc directement des océans : on parle d'un <b>monde maritimisé</b>. Trois raisons l'expliquent :</p>\n<ul>\n<li>le <b>transport maritime</b> est de loin le moins cher pour acheminer de grandes quantités de marchandises (un porte-conteneurs géant transporte plus de 20 000 « boîtes ») ;</li>\n<li>les océans sont des <b>réservoirs de ressources</b> : halieutiques (poissons), énergétiques (pétrole et gaz offshore, éoliennes en mer), minérales (nodules polymétalliques) ;</li>\n<li>les <b>câbles sous-marins</b> acheminent environ 99 % des données numériques mondiales (Internet) : la « mondialisation » passe aussi par le fond des océans.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Principales routes maritimes mondiales\">\n  <rect x=\"0\" y=\"0\" width=\"440\" height=\"190\" rx=\"8\" fill=\"#dbeafe\"/>\n  <path d=\"M 55 70 Q 150 50 240 85 Q 330 115 400 60\" fill=\"none\" stroke=\"#1e40af\" stroke-width=\"2.5\"/>\n  <path d=\"M 240 85 Q 220 140 130 150\" fill=\"none\" stroke=\"#1e40af\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\"/>\n  <path d=\"M 55 70 Q 90 140 130 150\" fill=\"none\" stroke=\"#1e40af\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\"/>\n  <path d=\"M 240 85 Q 260 30 380 25\" fill=\"none\" stroke=\"#1e40af\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\"/>\n  <circle cx=\"55\" cy=\"70\" r=\"5\" fill=\"#dc2626\"/><text x=\"55\" y=\"60\" font-size=\"10\" text-anchor=\"middle\" fill=\"#334155\">Asie de l'Est</text>\n  <circle cx=\"130\" cy=\"150\" r=\"4.5\" fill=\"#dc2626\"/><text x=\"130\" y=\"168\" font-size=\"10\" text-anchor=\"middle\" fill=\"#334155\">Europe</text>\n  <circle cx=\"400\" cy=\"60\" r=\"4.5\" fill=\"#dc2626\"/><text x=\"398\" y=\"78\" font-size=\"10\" text-anchor=\"middle\" fill=\"#334155\">Am&#233;rique du Nord</text>\n  <circle cx=\"380\" cy=\"25\" r=\"3.5\" fill=\"#dc2626\"/><text x=\"385\" y=\"16\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#334155\">Canal de Panama</text>\n  <circle cx=\"240\" cy=\"85\" r=\"3.5\" fill=\"#f59e0b\"/><text x=\"243\" y=\"99\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#7c2d12\">Golfe arabico-persique</text>\n  <text x=\"70\" y=\"115\" font-size=\"10.5\" fill=\"#1e40af\">&#8226; principale route : Asie &#8594; Europe</text>\n  <text x=\"70\" y=\"130\" font-size=\"9.5\" fill=\"#475569\"> routes secondaires (pointill&#233;s)</text>\n</svg><span class=\"fig-cap\">Les grandes routes maritimes concentrent les flux de conteneurs et d'hydrocarbures ; les détroits et canaux (Malacca, Suez, Panama, Ormuz) sont des points de passage stratégiques et donc des enjeux de puissance.</span></div>\n\n<h3>2. Des ressources convoitées et disputées</h3>\n<p>Les océans sont l'objet de rivalités croissantes entre États. Quatre types de convoitises à connaître :</p>\n<ol>\n<li><b>Les ressources énergétiques et minérales</b> : hydrocarbures offshore (golfe arabico-persique, golfe de Guinée, Arctique), granulats marins, nodules polymétalliques (Pacifique) ;</li>\n<li><b>Les ressources halieutiques</b> : environ 90 millions de tonnes de poissons pêchées par an, dont une part illégale ou non déclarée ; la surpêche menace des stocks entiers (thon, cabillaud) ;</li>\n<li><b>La biodiversité</b> : 60 % des services écosystémiques marins sont dégradés ; les aires marines protégées (AMP) restent rares (environ 8 % de l'océan) ;</li>\n<li><b>Les routes et détroits</b> : contrôle du canal de Suez, du détroit d'Ormuz (20 % du pétrole mondial), de Malacca ou des passages arctiques que le réchauffement climatique rend praticables.</li>\n</ol>\n<table>\n<tr><th>Ressource</th><th>Exemples de convoitises</th><th>Acteurs en concurrence</th></tr>\n<tr><td>Pétrole et gaz offshore</td><td>Arctique, golfe arabico-persique, Atlantique sud</td><td>Grandes compagnies, États riverains, grandes puissances</td></tr>\n<tr><td>Pêche</td><td>ZEE contestées, pêche INN (illégale)</td><td>Flottes industrielles (Chine, UE), États côtiers, ONG</td></tr>\n<tr><td>Nodules polymétalliques</td><td>Clarion-Clipperton (Pacifique)</td><td>Firmes minières, AIFM, États</td></tr>\n<tr><td>Routes et détroits</td><td>Ormuz, Malacca, Suez, passages arctiques</td><td>Puissances navales (É.-U., Chine), États riverains</td></tr>\n</table>\n\n<h3>3. Le cadre juridique : le droit de la mer et ses limites</h3>\n<p>Le cœur du chapitre est la <b>convention de Montego Bay (1982)</b>, entrée en vigueur en 1994, dite « constitution des océans ». Elle organise les espaces maritimes autour de chaque État côtier :</p>\n<ul>\n<li><b>eaux intérieures et mer territoriale</b> (jusqu'à 12 milles marin ≈ 22 km) : souveraineté de l'État côtier, mais droit de passage inoffensif des navires étrangers ;</li>\n<li><b>zone contiguë</b> (jusqu'à 24 milles) : l'État peut y faire respecter sa loi (douane, pêche) ;</li>\n<li><b>zone économique exclusive (ZEE)</b> jusqu'à 200 milles (≈ 370 km) : l'État côtier y a l'<b>exclusivité d'exploitation des ressources</b> (pêche, hydrocarbures) — c'est l'objet principal des convoitises ;</li>\n<li>au-delà, la « Zone » est le <b>patrimoine commun de l'humanité</b>, gérée par l'Autorité internationale des fonds marins (AIFM).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Zonation maritime\">\n  <rect x=\"40\" y=\"20\" width=\"40\" height=\"110\" fill=\"#bbf7d0\"/>\n  <rect x=\"80\" y=\"20\" width=\"30\" height=\"110\" fill=\"#86efac\"/>\n  <rect x=\"110\" y=\"20\" width=\"30\" height=\"110\" fill=\"#4ade80\"/>\n  <rect x=\"140\" y=\"20\" width=\"180\" height=\"110\" fill=\"#bfdbfe\"/>\n  <rect x=\"320\" y=\"20\" width=\"80\" height=\"110\" fill=\"#93c5fd\"/>\n  <line x1=\"40\" y1=\"135\" x2=\"40\" y2=\"146\" stroke=\"#334155\"/><text x=\"60\" y=\"146\" font-size=\"9\" fill=\"#334155\">c&#244;te</text>\n  <line x1=\"110\" y1=\"135\" x2=\"110\" y2=\"146\" stroke=\"#334155\"/><text x=\"110\" y=\"146\" font-size=\"9\" fill=\"#334155\" text-anchor=\"middle\">12 milles</text>\n  <line x1=\"320\" y1=\"135\" x2=\"320\" y2=\"146\" stroke=\"#334155\"/><text x=\"320\" y=\"146\" font-size=\"9\" fill=\"#334155\" text-anchor=\"middle\">200 milles</text>\n  <text x=\"95\" y=\"55\" font-size=\"9\" fill=\"#14532d\" text-anchor=\"middle\">mer territoriale</text>\n  <text x=\"230\" y=\"55\" font-size=\"10\" fill=\"#1e3a8a\" text-anchor=\"middle\">ZEE (ressources exclusives)</text>\n  <text x=\"360\" y=\"55\" font-size=\"9\" fill=\"#1e3a8a\" text-anchor=\"middle\">&#171; Zone &#187; : patrimoine</text>\n  <text x=\"360\" y=\"68\" font-size=\"9\" fill=\"#1e3a8a\" text-anchor=\"middle\">commun de l'humanit&#233;</text>\n  <text x=\"60\" y=\"55\" font-size=\"8.5\" fill=\"#14532d\" text-anchor=\"middle\">eaux</text><text x=\"60\" y=\"66\" font-size=\"8.5\" fill=\"#14532d\" text-anchor=\"middle\">int.</text>\n</svg><span class=\"fig-cap\">La zonation définie par la convention de Montego Bay : plus on s'éloigne de la côte, plus les droits de l'État côtier s'affaiblissent — mais la ZEE reste le cœur des rivalités.</span></div>\n<div class=\"warn\"><b>Le droit de la mer a pourtant des limites :</b>\n<ul>\n<li>des États ne l'ont pas ratifié (États-Unis) et il est parfois inappliqué ou inapplicable ;</li>\n<li>les <b>ZEE se recouvrent</b> quand les côtes sont proches : contentieux gréco-turc en Méditerranée orientale, Chine et ses voisins en mer de Chine méridionale (atolls Spratleys et Paracels, malgré la sentence arbitrale de La Haye de 2016) ;</li>\n<li>la définition du plateau continental prolongé (au-delà des 200 milles) nourrit des demandes contradictoires (Arctique).</li>\n</ul>\n</div>\n\n<h3>4. Les acteurs de la maritimisation et la militarisation des mers</h3>\n<p>Les convoitises impliquent une grande variété d'acteurs, qui coopèrent ou s'affrontent :</p>\n<ul>\n<li><b>Les États</b> dotés d'une marine océanique : les États-Unis (première marine du monde, 11 porte-avions), la Chine (première flotte de pêche, marine en pleine expansion), la Russie, la France (2e domaine maritime mondial grâce à ses territoires d'outre-mer) ;</li>\n<li><b>Les organisations internationales</b> : ONU (droit de la mer, accord BBNJ de 2023 sur la haute mer), OMI (navigation), AIFM (fonds marins) ;</li>\n<li><b>Les entreprises</b> : armateurs (MSC, Maersk), compagnies pétrolières, firmes minières ;</li>\n<li><b>Les acteurs illégaux</b> : piraterie (golfe d'Aden, golfe de Guinée), pêche INN, trafics ;</li>\n<li><b>Les ONG et scientifiques</b> : Greenpeace, Sea Shepherd, programmes de recherche, qui alertent sur la santé des océans.</li>\n</ul>\n<p>Cette multiplicité se traduit par une <b>militarisation croissante</b> : bases navales, patrouilles, démonstrations de force (détroit de Taïwan), course aux porte-avions et sous-marins. La mer est redevenue un espace de puissance.</p>\n\n<h3>5. Mers et océans face aux défis environnementaux</h3>\n<p>Les océans, surexploités, subissent aussi le changement climatique :</p>\n<ul>\n<li><b>réchauffement</b> : hausse des températures de surface, blanchissement des coraux, montée du niveau de la mer (menace sur les deltas et les États insulaires — Tuvalu, Maldives) ;</li>\n<li><b>acidification</b> : l'océan absorbe environ un quart du CO₂ émis, ce qui acidifie l'eau et menace les organismes calcaires ;</li>\n<li><b>pollutions</b> : 8 millions de tonnes de plastiques par an rejoignent la mer, formant des « continents de déchets » ; les marées noires ponctuent l'exploitation offshore ;</li>\n<li><b>réponses émergentes</b> : accord BBNJ (2023) pour protéger la biodiversité en haute mer, extension des aires marines protégées, navigation plus propre (carburants moins soufrés imposés par l'OMI).</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser une carte des ZEE et des contentieux maritimes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> À partir d'une carte des zones économiques exclusives en mer de Chine méridionale, montrez que le droit de la mer est un instrument de puissance autant qu'un cadre de coopération.</div><div class=\"etu\"><b>Étape 1 — Décrire</b> : repérer les ZEE riveraines (Chine, Vietnam, Philippines, Malaisie) et leurs recouvrements ; localiser les atolls occupés et militarisés (Spratleys, Paracels).</div><div class=\"etu\"><b>Étape 2 — Mobiliser le droit</b> : rappeler Montego Bay (ZEE 200 milles, terre génératrice), la sentence de La Haye (2016) défavorable à la Chine, non appliquée par elle.</div><div class=\"etu\"><b>Étape 3 — Analyser les logiques de puissance</b> : contrôle des routes (un tiers du commerce mondial), ressources (hydrocarbures, pêche), projection navale ; la Chine pousse sa « ligne en neuf traits » contre le droit.</div><div class=\"etu\"><b>Étape 4 — Conclure avec nuance</b> : le droit encadre mais ne suffit pas ; sans exécution forcée, la puissance navale décide — d'où l'importance des tribunaux, des alliances et de la diplomatie.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Ne pas confondre <b>mer territoriale</b> (12 milles, souveraineté) et <b>ZEE</b> (200 milles, seules les ressources sont exclusives : un navire étranger peut y naviguer librement).</li>\n<li>Montego Bay est signée en <b>1982</b> et appliquée en <b>1994</b> — les deux dates peuvent tomber.</li>\n<li>La « Zone » internationale des fonds marins est un <b>patrimoine commun de l'humanité</b>, pas une zone libre d'appropriation privée.</li>\n<li>La France est une puissance maritime majeure grâce à ses <b>outre-mer</b> (2e ZEE mondiale ≈ 10,2 millions de km²) — ne pas la réduire à sa métropole.</li>\n<li>Ne pas écrire que « les océans ne sont juridiquement réglementés que par Montego Bay » : l'accord BBNJ (2023) complète le cadre pour la haute mer.</li>\n<li>La sentence de 2016 sur la mer de Chine méridionale n'est <b>pas appliquée</b> par la Chine : droit ≠ réalité géopolitique, toujours distinguer les deux plans.</li>\n</ul>\n</div>"

  "id": "demographie-developpement",
  "theme": "Démographie, développement et richesse (HGGSP)",
  "niveau": "Terminale — HGGSP",
  "titre": "Démographie, développement et richesse",
  "cours": "<div class=\"cours-head\"><h2>Démographie, développement et richesse</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La transition démographique : le modèle et ses exceptions</h3>\n<ul>\n<li><b>le modèle</b> : la mortalité baisse (médecine, hygiène) puis la natalité (urbanisation, école, contraception) → une explosion transitoire de population ;</li>\n<li><b>le monde</b> : 1 Md (1800) → 2 Md (1927) → 8 Md (2022) ; environ 90 % de la croissance dans les pays du Sud ;</li>\n<li><b>le basculement</b> : l'Inde (>1,4 Md) a dépassé la Chine (2023), dont la population décroît (politique de l'enfant unique 1979-2015, vieillissement).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Transition démographique\">\n  <line x1=\"45\" y1=\"140\" x2=\"415\" y2=\"140\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"45\" y1=\"140\" x2=\"45\" y2=\"15\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <path d=\"M 45 45 C 150 50 250 55 415 70\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <path d=\"M 45 50 C 150 52 220 90 415 120\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"360\" y=\"62\" font-size=\"9\" fill=\"#16a34a\">natalité</text>\n  <text x=\"360\" y=\"117\" font-size=\"9\" fill=\"#4f46e5\">mortalité</text>\n  <rect x=\"150\" y=\"140\" width=\"160\" height=\"0.5\" fill=\"none\"/>\n  <rect x=\"155\" y=\"55\" width=\"130\" height=\"85\" fill=\"#4f46e5\" opacity=\"0.08\"/>\n  <text x=\"220\" y=\"50\" font-size=\"9\" fill=\"#475569\" text-anchor=\"middle\">explosion transitoire</text>\n  <text x=\"100\" y=\"155\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">phase 1</text>\n  <text x=\"220\" y=\"155\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">phase 2 : boom</text>\n  <text x=\"350\" y=\"155\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">phase 3 : stabilisation</text>\n</svg><span class=\"fig-cap\">Le modèle de la transition démographique : la mortalité baisse d'abord, la natalité ensuite — l'écart entre les deux produit l'explosion transitoire de population.</span></div>\n\n<h3>2. Mesurer le développement : au-delà du PIB</h3>\n<ul>\n<li><b>PIB/hab.</b> : la richesse produite — mais il ignore les inégalités, le non-marchand, l'environnement ;</li>\n<li><b>IDH (PNUD)</b> : santé (espérance de vie) + éducation (durée de scolarisation) + revenu : un indice de 0 à 1 ;</li>\n<li><b>autres indicateurs</b> : Gini (inégalités), pauvreté multidimensionnelle, empreinte écologique : le choix de l'indicateur est un choix <b>politique</b>.</li>\n</ul>\n\n<h3>3. Migrations : l'âge des mobilités</h3>\n<ul>\n<li><b>281 millions de migrants internationaux</b> (3,6 % de l'humanité, ONU 2020) : une proportion stable depuis 50 ans, en hausse absolue ;</li>\n<li><b>causes</b> : guerre (Syriens, Ukrainiens), climat, travail, études ;</li>\n<li><b>géographie</b> : corridors Asie du Sud-Golfe, Mexique-USA, Afrique-Europe — l'Europe n'est <b>pas</b> la première destination (c'est l'Asie) ;</li>\n<li><b>débat</b> : fuite des cerveaux vs apport démographique et économique aux pays vieillissants.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire une pyramide des âges</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pyramide étroite à la base, large au sommet (Japon) vs pyramide à base large (Niger). Que déduire de chacune ?</div><div class=\"etu\"><b>Étape 1 — Vieillissement (Japon)</b> : base étroite = peu de naissances ; sommet large = longévité : conséquences : retraites (2 actifs par retraité contre 4 en 1990), immigration, dette.</div><div class=\"etu\"><b>Étape 2 — Jeunesse (Niger, âge médian ~15 ans)</b> : base large = boom : conséquences : écoles à bâtir, emplois à créer, risque d'instabilité si l'État ne suit pas (le chômage des jeunes, levier du printemps arabe).</div><div class=\"etu\"><b>Étape 3 — Le concept HGGSP</b> : la démographie est une donnée <b>politique</b> : vieillir ou rajeunir change la puissance (économie, armée, retraites).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la carte du monde de 2050 se lit dans les pyramides d'aujourd'hui : l'Afrique doublera sa part de population mondiale.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le corridor Mexique-États-Unis</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Environ 11 millions de Mexicains sans papiers aux USA : comment ce corridor fonctionne-t-il géopolitiquement ?</div><div class=\"etu\"><b>Étape 1 — Le moteur</b> : différentiel de salaire (×5-10) + proximité + réseaux familiaux : la migration est un fait de marché et de réseau, pas seulement de misère.</div><div class=\"etu\"><b>Étape 2 — Les transferts</b> : les mandats des migrants (plus de 60 Md $/an vers le Mexique) dépassent l'aide publique au développement : la migration est un acteur du développement.</div><div class=\"etu\"><b>Étape 3 — La tension</b> : mur, déportations : la frontière devient un enjeu électoral ; mais l'économie américaine (agriculture, BTP) emploie cette main-d'œuvre.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la boucle besoin/défi, humanité/sécurité fait du corridor le cas d'école de toutes les migrations.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>PIB ≠ développement : croiser IDH, Gini, indicateurs sociaux ;</li>\n<li>« surpeuplé » n'est pas un concept scientifique (les Pays-Bas sont denses et riches) ;</li>\n<li>les migrations ne vident pas les pays du Sud : 3,6 % de l'humanité seulement vit hors de son pays de naissance ;</li>\n<li>l'Inde a dépassé la Chine en 2023 : vérifier les chiffres avant de citer.</li>\n</ul>\n</div>"

  "titre": "Les ressources et la transition énergétique",
  "cours": "<div class=\"cours-head\"><h2>Les ressources et la transition énergétique</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Ressources : géographie de la dépendance</h3>\n<ul>\n<li><b>pétrole</b> : environ 67 % des réserves dans 5 pays du Golfe + la Russie ;</li>\n<li><b>gaz</b> : Russie, Qatar, Iran (~45 %) ;</li>\n<li><b>terres rares</b> : Chine — 60 % de production, ~85 % du raffinage ;</li>\n<li><b>lithium</b> : triangle Argentine-Bolivie-Chili ; <b>cobalt</b> : RDC (~70 %) ;</li>\n<li><b>dépendance = vulnérabilité</b> : l'Europe importait 40 % de son gaz de Russie avant 2022 (55 % pour l'Allemagne) : une arme économique.</li>\n</ul>\n\n<h3>2. L'énergie, moteur des tensions et des transitions</h3>\n<ul>\n<li>le pétrole structure l'ordre mondial depuis 1945 : dollar-pétrole, chocs (1973 : embargo, prix ×6, récessions), guerres du Golfe, cartel OPEP (+ ou − de production pour réguler les prix) ;</li>\n<li>la <b>transition énergétique</b> : COP 21 (2015 : 1,5-2 °C), UE : −55 % d'émissions en 2030, neutralité en 2050 ;</li>\n<li>la géopolitique des hydrocarbures devient géopolitique des <b>métaux</b> (lithium, cobalt, terres rares).</li>\n</ul>\n\n<h3>3. Climat et ressources : le rapport Nord-Sud</h3>\n<ul>\n<li><b>responsabilités différenciées</b> : les pays du Nord ont émis l'essentiel du CO₂ historique (USA : ~25 % des émissions cumulées pour 4 % de l'humanité) ;</li>\n<li>les pays du Sud subissent (sécheresses, submersion) et veulent leur droit au développement ;</li>\n<li>le fonds « pertes et dommages » acté à la COP27 (2022) : le transfert Nord-Sud devient monétaire : le climat est une négociation permanente de justice.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"25\" y1=\"62\" x2=\"423\" y2=\"62\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"423,62 413,57 413,67\" fill=\"#4f46e5\"/><circle cx=\"25.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"25.0\" y1=\"62\" x2=\"25.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"25.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1973</text><text x=\"25.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Premier choc pétrolier</text><circle cx=\"155.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"155.0\" y1=\"62\" x2=\"155.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"155.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1982</text><text x=\"155.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Montego Bay :</text><text x=\"155.0\" y=\"94\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">droit de la</text><text x=\"155.0\" y=\"104\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">mer</text><circle cx=\"285.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"285.0\" y1=\"62\" x2=\"285.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"285.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2015</text><text x=\"285.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Accord de Paris</text><circle cx=\"415.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"415.0\" y1=\"62\" x2=\"415.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"415.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2022</text><text x=\"415.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Arme du gaz,</text><text x=\"415.0\" y=\"94\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">COP27</text></svg><span class=\"fig-cap\">Ressources et énergie : des chocs pétroliers à la COP27, la question énergétique structure la géopolitique mondiale depuis cinquante ans.</span></div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le gaz russe, arme de la guerre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment le gaz est-il devenu une arme dans la guerre Russie-Ukraine (2022-2023) ?</div><div class=\"etu\"><b>Étape 1 — La dépendance</b> : avant 2022, 40 % du gaz européen venait de Russie (contrats longs, pipelines Nord Stream) : l'Europe paie, la Russie encaisse (jusqu'à ~1 Md $/jour au pic).</div><div class=\"etu\"><b>Étape 2 — L'arme</b> : réductions de livraisons (printemps 2022), arrêt de Nord Stream (septembre 2022), prix ×5 (TTF ~340 €/MWh en août 2022) : l'arme de la pauvreté énergétique.</div><div class=\"etu\"><b>Étape 3 — La riposte</b> : diversification (GNL américain, qatari), accélération des renouvelables, sobriété : l'hiver 2022-23 passe sans blackout ; la dépendance recule vers ~15 % (2023).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : une ressource peut être une arme, mais l'arme s'émousse quand le client se diversifie : la transition énergétique est aussi une stratégie de sécurité.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — les terres rares, nerf de la guerre technologique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi les « terres rares » (17 métaux) sont-elles devenues un enjeu de conflit entre les USA et la Chine ?</div><div class=\"etu\"><b>Étape 1 — À quoi elles servent</b> : aimants permanents (néodyme) des voitures électriques et éoliennes, batteries, écrans, lasers, défense moderne.</div><div class=\"etu\"><b>Étape 2 — Le monopole chinois</b> : 60 % des mines, surtout ~85 % du raffinage : 2010, embargo informel vers le Japon ; 2023, contrôles à l'export (gallium, germanium) : l'arme des métaux.</div><div class=\"etu\"><b>Étape 3 — Réponses occidentales</b> : lois CHIPS/IRA (subventions), réouverture de mines, recyclage, substitution : mais une mine prend 10-15 ans à ouvrir.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : qui tient le raffinage tient la transition des autres : la géopolitique des métaux a l'inertie du siècle.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'eau douce, ressource explosive</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le Nil, le Mékong, l'Indus : pourquoi ces fleuves sont-ils des dossiers géopolitiques brûlants ?</div><div class=\"etu\"><b>Étape 1 — Amont/aval</b> : celui qui bâtit le barrage tient le robinet : Éthiopie (Grand barrage de la Renaissance) vs Égypte (97 % de son eau vient du Nil).</div><div class=\"etu\"><b>Étape 2 — La diplomatie de l'eau</b> : les barrages chinois sur le Mékong conditionnent la crue dont dépendent le Vietnam et le Cambodge.</div><div class=\"etu\"><b>Étape 3 — L'exception</b> : le traité de l'Indus (1960) entre Inde et Pakistan, respecté malgré trois guerres : la gestion pacifique d'un fleuve partagé est l'exception remarquable à connaître.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la ressource est un rapport de force en puissance, qui devient géopolitique quand elle croise une frontière.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>l'OPEP est un cartel de producteurs (les prix), pas un syndicat de consommateurs ;</li>\n<li>la transition ne supprime pas la géopolitique de l'énergie : elle la <b>déplace</b> (pétrole → métaux) ;</li>\n<li>les « réserves » sont des données économiques (extraites au prix du moment), pas des stocks fixés ;</li>\n<li>« terres rares » ne veut pas dire rares géologiquement : dispersées et coûteuses à raffiner.</li>\n</ul>\n</div>"

  "cours": "<div class=\"cours-head\"><h2>Faire la guerre, faire la paix</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Formes de guerre : la mutation des conflits</h3>\n<ul>\n<li>les guerres <b>interétatiques</b> deviennent rares (mais pas disparues : Russie-Ukraine, 2022) ;</li>\n<li>dominent les conflits <b>intra-étatiques</b> et transnationaux : guerres civiles, insurrections, terrorisme ;</li>\n<li>la <b>guerre hybride</b> : mélange d'actions militaires conventionnelles, irrégulières, cyber et informationnelles (Crimée, 2014 : « petits hommes verts », brouillage des médias) ;</li>\n<li>des <b>théâtres nouveaux</b> : cyber, espace, fonds marins.</li>\n</ul>\n\n<h3>2. Faire la paix : acteurs et instruments</h3>\n<ul>\n<li><b>maintien de la paix ONU</b> : les casques bleus (consentement des parties, impartialité, non-recours à la force sauf légitime défense : 11 missions actives) ;</li>\n<li><b>juridiction</b> : la CPI (statut de Rome, 1998 : génocides, crimes de guerre — limite : les grandes puissances non parties) ;</li>\n<li><b>diplomatie</b> : médiateurs (Qatar, Turquie), accords (Oslo 1993, Minsk 2014-15), désarmement (TNP, START).</li>\n</ul>\n\n<h3>3. L'ONU entre idéal et réalisme</h3>\n<ul>\n<li>le <b>chapitre VII</b> : le Conseil de sécurité (5 permanents au veto + 10 élus) peut autoriser la force — mais les Cinq se bloquent souvent (Syrie : vetos russes ; Ukraine : veto systématique) ;</li>\n<li>résolutions <b>contraignantes</b> (Conseil) vs <b>déclaratives</b> (Assemblée) ;</li>\n<li>« l'ONU n'a pas d'armée propre » : elle est ce que ses membres veulent qu'elle soit.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"25\" y1=\"62\" x2=\"423\" y2=\"62\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"423,62 413,57 413,67\" fill=\"#4f46e5\"/><circle cx=\"25.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"25.0\" y1=\"62\" x2=\"25.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"25.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1945</text><text x=\"25.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Création de l’ONU,</text><text x=\"25.0\" y=\"42\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Charte</text><circle cx=\"103.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"103.0\" y1=\"62\" x2=\"103.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"103.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1949</text><text x=\"103.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Conventions de Genève</text><circle cx=\"181.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"181.0\" y1=\"62\" x2=\"181.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"181.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1993</text><text x=\"181.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">TPI, accords d’Oslo</text><circle cx=\"259.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"259.0\" y1=\"62\" x2=\"259.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"259.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1998</text><text x=\"259.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Statut de Rome</text><text x=\"259.0\" y=\"94\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">(CPI)</text><circle cx=\"337.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"337.0\" y1=\"62\" x2=\"337.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"337.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2002</text><text x=\"337.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">CPI opérationnelle</text><circle cx=\"415.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"415.0\" y1=\"62\" x2=\"415.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"415.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2016</text><text x=\"415.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Paix en Colombie</text></svg><span class=\"fig-cap\">Faire la paix : depuis 1945, le droit international humanitaire et les juridictions pénales complètent la diplomatie pour encadrer la guerre et sortir des conflits.</span></div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — 2022, retour de la guerre conventionnelle en Europe</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La guerre Russie-Ukraine (2022) mêle formes anciennes et nouvelles : lesquelles ?</div><div class=\"etu\"><b>Étape 1 — Anciennes</b> : front, artillerie, sièges (Bakhmout), mobilisation, frappes sur les villes : la guerre de matériel (les obus) revient.</div><div class=\"etu\"><b>Étape 2 — Nouvelles</b> : drones (observation, FPV kamikazes), frappes de précision, guerre de l'information, sanctions économiques, ciblage des infrastructures énergétiques.</div><div class=\"etu\"><b>Étape 3 — Lecture HGGSP</b> : la guerre entre États n'a pas disparu ET elle se mène sur toutes les dimensions (terrestre, maritime, aérien, cyber, informationnel, économique).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la dissuasion encadre le conflit sans l'empêcher : la guerre « complète » (multi-domaines) est là.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — Colombie : négocier la paix après 50 ans de guerre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'accord FARC-gouvernement (2016) est présenté comme un « modèle » de sortie de conflit : pourquoi, quelles limites ?</div><div class=\"etu\"><b>Étape 1 — Le processus</b> : 4 ans de négociation à La Havane (Norvège + Cuba garants), 6 points traités (dont les victimes), référendum perdu de peu, révision puis vote au Congrès ; prix Nobel de la paix pour Santos.</div><div class=\"etu\"><b>Étape 2 — La justice transitionnelle</b> : ni amnistie ni vengeance : aveux complets contre peines alternatives ; 13 000 FARC désarmés, réinsertion (parti politique, 10 sièges garantis deux mandats).</div><div class=\"etu\"><b>Étape 3 — Limites</b> : dissidences qui reprennent les armes, narcotrafic, dirigeants sociaux assassinés (plus de 400 depuis 2016).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la paix est un processus, pas une date : la Colombie montre ce que la négociation peut — et ne peut pas — seule.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — 2011, la Libye : le piège de la « responsabilité de protéger »</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La résolution 1973 (2011) autorise une zone d'exclusion aérienne en Libye ; l'OTAN la transforme : quel débat sur l'usage de la force ?</div><div class=\"etu\"><b>Étape 1 — Le droit</b> : la « responsabilité de protéger » (R2P, 2005) : quand un État massacre son peuple, la communauté peut intervenir ; le Conseil vote 10-0 (5 abstentions).</div><div class=\"etu\"><b>Étape 2 — La dérive</b> : la protection des civils devient un appui logistique aux rebelles jusqu'au renversement et à la mort de Kadhafi : pour Moscou et Pékin, un mandat humanitaire détourné en changement de régime.</div><div class=\"etu\"><b>Étape 3 — Conséquences</b> : méfiance accrue (vetos ensuite sur la Syrie), Libye enlisée dans la guerre civile.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : l'ingérence humanitaire peut-elle rester limitée ? Un échec structure les blocages futurs.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« maintien de la paix » (consentement, légitime défense) ≠ « imposition de la paix » (chapitre VII, force) ;</li>\n<li>la CPI ne juge que depuis 2002, et pas les non-parties (USA, Russie, Chine) ;</li>\n<li>une résolution du Conseil (contraignante) ≠ une résolution de l'Assemblée (déclarative) ;</li>\n<li>dissuasion (empêcher par la peur) ≠ défense (gagner si attaque).</li>\n</ul>\n</div>"
 },
 {
  "id": "puissance-usa-chine",
  "theme": "La puissance : les États-Unis et la Chine (HGGSP)",
  "niveau": "Terminale — HGGSP",
  "titre": "La puissance : les États-Unis et la Chine",
  "cours": "<div class=\"cours-head\"><h2>La puissance : les États-Unis et la Chine</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Mesurer la puissance : les attributs</h3>\n<p><b>La puissance est la capacité d'un acteur à imposer sa volonté.</b> Ses attributs :</p>\n<ul>\n<li>territoriaux et démographiques ;</li>\n<li>économiques (PIB) ;</li>\n<li>militaires (budget, projection, alliances) ;</li>\n<li>technologiques ;</li>\n<li>culturels et diplomatiques.</li>\n</ul>\n<div class=\"tip\"><b>Joseph Nye</b> : <b>hard power</b> (contraindre : armée, sanctions) vs <b>soft power</b> (séduire : culture, valeurs, modèle). Les USA cumulent les deux ; la Chine construit le second.</div>\n\n<h3>2. Les États-Unis : la puissance installée</h3>\n<ul>\n<li>le <b>dollar</b> (60 % des réserves mondiales : les sanctions passent par SWIFT) ;</li>\n<li>la <b>tech</b> (GAFAM : les standards du monde) ;</li>\n<li>les <b>alliances</b> (OTAN art. 5, traités Japon/Corée/Australie) ;</li>\n<li>la <b>culture mondiale</b> (Hollywood, universités, langue) ;</li>\n<li>la <b>projection</b> (11 groupes aéronavals, ~750 bases) ;</li>\n<li>mais des <b>fragilités</b> : polarisation interne (Capitole, 2021), dette (~120 % du PIB), retrait chaotique d'Afghanistan (2021), contestation par les BRICS.</li>\n</ul>\n\n<h3>3. La Chine : la montée en puissance</h3>\n<ul>\n<li><b>trajectoire</b> : réformes de Deng (1978) → OMC (2001) → 2e économie (2010) → « rajeunissement national » proclamé par Xi (2017) ;</li>\n<li><b>Belt and Road Initiative</b> (2013) : routes de la soie — ports (Pirée, Hambantota), rails, prêts à 150+ pays : influence par les infrastructures (« diplomatie du piège de la dette » ? débattu) ;</li>\n<li><b>objectifs</b> : Taïwan (la « ligne rouge »), mer de Chine méridionale, premiers rangs technologiques, armée « de classe mondiale » en 2049.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"25\" y1=\"62\" x2=\"423\" y2=\"62\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"423,62 413,57 413,67\" fill=\"#4f46e5\"/><circle cx=\"25.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"25.0\" y1=\"62\" x2=\"25.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"25.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1978</text><text x=\"25.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Réformes de Deng</text><circle cx=\"103.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"103.0\" y1=\"62\" x2=\"103.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"103.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2001</text><text x=\"103.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">OMC</text><circle cx=\"181.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"181.0\" y1=\"62\" x2=\"181.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"181.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2010</text><text x=\"181.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">2e économie mondiale</text><circle cx=\"259.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"259.0\" y1=\"62\" x2=\"259.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"259.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2013</text><text x=\"259.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Belt and Road</text><circle cx=\"337.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"337.0\" y1=\"62\" x2=\"337.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"337.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2017</text><text x=\"337.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">« Siècle chinois</text><text x=\"337.0\" y=\"42\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">» (Xi)</text><circle cx=\"415.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"415.0\" y1=\"62\" x2=\"415.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"415.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2023</text><text x=\"415.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">PIB PPA n°1</text></svg><span class=\"fig-cap\">La montée en puissance chinoise : ouverture économique (1978), intégration au commerce mondial (2001), puis affirmation stratégique (BRI, Taïwan, technologies).</span></div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — comparer les deux puissances, chiffre par chiffre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparez USA et Chine : PIB, dépenses militaires, monnaie, alliances, soft power : quelles forces et faiblesses respectives ?</div><div class=\"etu\"><b>Étape 1 — Économie</b> : PIB nominal : USA ~25 000 Md $, Chine ~18 000 Md $ ; en PPA, la Chine est n°1 depuis 2016 ; dépendance croisée (la Chine détient ~800 Md $ de dette US).</div><div class=\"etu\"><b>Étape 2 — Militaire</b> : USA ~900 Md $/an (37 % mondial, 11 marines, ~750 bases) ; Chine ~300 Md $ (n°2, marine la plus nombreuse en navires) — mais les USA ont l'expérience, les alliances et la projection mondiale.</div><div class=\"etu\"><b>Étape 3 — Le reste</b> : dollar (60 % des réserves) sans rival (yuan ~2 %) ; soft power : Hollywood, universités — la Chine investit (Instituts Confucius, BRI) mais reste en retard d'image.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : puissance établie multipolaire vs puissance montante incomplète : le débat de la « transition de puissance », moment historiquement dangereux.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le dollar, monnaie géopolitique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi la domination du dollar donne-t-elle aux USA un pouvoir que personne d'autre n'a ?</div><div class=\"etu\"><b>Étape 1 — Le privilège</b> : 60 % des réserves, 80 % du commerce : les USA empruntent dans leur monnaie (le « déficit sans douleur »).</div><div class=\"etu\"><b>Étape 2 — L'arme</b> : SWIFT et le clearing passent par des banques américaines : toute transaction en $ est un levier de sanction (Iran coupé de SWIFT ; 300 Md $ d'avoirs russes gelés en 2022) : l'extraterritorialité.</div><div class=\"etu\"><b>Étape 3 — La contestation</b> : dédollarisation (paiements en yuan/rupees), BRICS+, alternatives à SWIFT (CIPS) — mais le réseau est difficile à remplacer.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : le dollar reste roi, et toute remise en question de son règne est l'objectif géopolitique le plus stratégique du siècle.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — Taïwan, l'épine et le « bouclier de silicium »</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi Taïwan (23 M d'habitants) est-il le point le plus explosif du monde ?</div><div class=\"etu\"><b>Étape 1 — L'histoire</b> : 1949 : les nationalistes vaincus s'y réfugient ; Pékin la considère comme une « province rebellée » ; les USA pratiquent l'« ambiguïté stratégique ».</div><div class=\"etu\"><b>Étape 2 — La puce</b> : TSMC fabrique ~90 % des puces les plus avancées : une guerre = arrêt mondial de l'électronique : le « bouclier de silicium ».</div><div class=\"etu\"><b>Étape 3 — Le calendrier</b> : Xi : la « réunification » comme mission historique ; exercices-blocus répétés (2022-24) ; les USA arment l'île.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : jusqu'où la transition de puissance peut-elle aller sans guerre ? Taïwan concentre la question du chapitre.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>PIB nominal vs PPA : les classements changent ;</li>\n<li>la Chine n'a pas les alliés des USA (OTAN, Japon, Corée : la Chine a la Corée du Nord et le Pakistan) ;</li>\n<li>le soft power chinois progresse mais reste en retard ;</li>\n<li>la « dédollarisation » est amorcée mais très lente ;</li>\n<li>la transition de puissance n'est pas automatiquement guerrière (USA-GB au XXe siècle : transition pacifique).</li>\n</ul>\n</div>"

  "id": "nouvelles-conflictualites",
  "theme": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)",

  "titre": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information",
  "cours": "<div class=\"cours-head\"><h2>Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le terrorisme : une violence théâtrale</h3>\n<ul>\n<li><b>définition</b> : une violence contre des civils pour semer la terreur et obtenir un effet politique : la cible n'est pas l'objectif, le public est la cible (médiatisation) ;</li>\n<li><b>vagues historiques</b> : anarchiste (fin XIXe), anticoloniale, d'extrême gauche (RAF, Brigades rouges), religieuse (Al-Qaïda 2001, Daech 2014-19 : « proto-État » et attentats de masse en Europe).</li>\n</ul>\n\n<h3>2. Cyber : le champ sans front</h3>\n<ul>\n<li><b>typologie</b> : espionnage, sabotage (Stuxnet, 2010), influence (infox), prédation criminelle (rançongiciels : Colonial Pipeline 2021, hôpitaux) ;</li>\n<li><b>problèmes</b> : l'attribution difficile, la riposte incertaine (escalade ?), le privé en première ligne (Google, Microsoft) ;</li>\n<li><b>doctrine française</b> : cyberdéfense et « riposte en capacité » (lois de programmation militaire).</li>\n</ul>\n\n<h3>3. Guerres de l'information : infox et brouillage</h3>\n<ul>\n<li><b>infox</b> : fausses, trompeuses, contextes volés — visées : discréditer, diviser, paralyser (le doute sur tout) ;</li>\n<li><b>écosystème</b> : usines à trolls (Internet Research Agency), fermes d'influence, algorithmes, deepfakes ;</li>\n<li><b>contre-mesures</b> : fact-checking, éducation aux médias, sanctions, Viginum.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"25\" y1=\"62\" x2=\"423\" y2=\"62\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"423,62 413,57 413,67\" fill=\"#4f46e5\"/><circle cx=\"25.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"25.0\" y1=\"62\" x2=\"25.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"25.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2001</text><text x=\"25.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">11-Septembre, Al-Qaïda</text><circle cx=\"122.5\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"122.5\" y1=\"62\" x2=\"122.5\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"122.5\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2010</text><text x=\"122.5\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Stuxnet</text><circle cx=\"220.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"220.0\" y1=\"62\" x2=\"220.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"220.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2014</text><text x=\"220.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Daech, proto-État</text><circle cx=\"317.5\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"317.5\" y1=\"62\" x2=\"317.5\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"317.5\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2017</text><text x=\"317.5\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">NotPetya : 10</text><text x=\"317.5\" y=\"94\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Md $</text><circle cx=\"415.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"415.0\" y1=\"62\" x2=\"415.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"415.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2022</text><text x=\"415.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Guerre de l’info</text><text x=\"415.0\" y=\"42\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Ukraine</text></svg><span class=\"fig-cap\">Les nouvelles conflictualités : du 11-Septembre à la guerre de l’information ukrainienne, la violence se joue aussi sur les écrans et les réseaux.</span></div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le 11-Septembre, basculement du monde</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le 11 septembre 2001 : quels effets géopolitiques durables ?</div><div class=\"etu\"><b>Étape 1 — L'immédiat</b> : ~3 000 morts ; l'article 5 de l'OTAN (unique invocation) ; guerre d'Afghanistan (2001), puis Irak (2003, sans l'ONU).</div><div class=\"etu\"><b>Étape 2 — Les transformations</b> : « guerre contre le terrorisme » sans front ni ennemi déclaré : Guantanamo, surveillance de masse (Patriot Act, Snowden 2013), drones d'assassinat ciblé.</div><div class=\"etu\"><b>Étape 3 — L'héritage</b> : retrait d'Afghanistan (2021, retour des talibans), Daech né des cendres irakiennes, épuisement américain (~2 000 Md $ dépensés).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la terreur comme stratégie du faible : un acteur faible impose son agenda à l'hyper-puissance et l'épuise.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — Stuxnet, première arme numérique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Stuxnet (2010) a détruit ~1000 centrifugeuses iraniennes de Natanz : pourquoi est-ce un tournant géopolitique ?</div><div class=\"etu\"><b>Étape 1 — L'arme</b> : un ver traversant les « air gaps » (clés USB), ciblant un type précis de contrôleurs Siemens : les centrifugeuses s'autodétruisent tout en affichant des mesures normales.</div><div class=\"etu\"><b>Étape 2 — La révolution</b> : première arme purement logicielle détruisant des installations physiques ; attribuée (jamais officiellement) aux USA et Israël : le cyber passe de l'espionnage au sabotage.</div><div class=\"etu\"><b>Étape 3 — La suite</b> : NotPetya (2017 : 10 Md $ de dégâts mondiaux), rançongiciels contre les hôpitaux (2020-21).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : le cyber est le premier champ où les dégâts collatéraux sont mondiaux et où le civil, le militaire et le privé sont mêlés — sans « droit de la guerre » abouti.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le brouillage avant l'invasion</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Avant et pendant l'invasion de l'Ukraine (2022), l'information fut une arme : décrivez les stratégies des deux camps.</div><div class=\"etu\"><b>Étape 1 — Le côté russe</b> : nier (« exercice »), justifier (« dénazification »), théories (armes biologiques), influenceurs payés : brouiller le public russe ET international.</div><div class=\"etu\"><b>Étape 2 — Le côté ukrainien</b> : communication présidentielle quotidienne (Zelensky en selfie : « je suis à Kyiv »), open source (drones, Bellingcat), récits héroïques.</div><div class=\"etu\"><b>Étape 3 — Bilan</b> : la guerre de l'information a soudé l'OTAN et aidé l'Ukraine à obtenir l'aide, sans briser le contrôle russe du récit intérieur.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la bataille du récit est une dimension de la guerre à part entière.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>le terrorisme vise l'effet <b>politique</b> par la terreur, pas la victoire militaire ;</li>\n<li>l'attribution cyber est difficile : une « attribution publique » par les services n'est pas une preuve judiciaire ;</li>\n<li>les GAFAM sont des acteurs du cybercombat (défense privée) ;</li>\n<li>infox = désinformation <b>délibérée</b> ≠ opinion erronée ;</li>\n<li>la guerre de l'information n'est pas nouvelle (la propagande a toujours existé) : ses canaux (viralité, ciblage algorithmique) le sont.</li>\n</ul>\n</div>"
 },

  "id": "onu-gouvernance",
  "theme": "L'ONU et la gouvernance mondiale (HGGSP)",
  "niveau": "Terminale — HGGSP",
  "titre": "L'ONU et la gouvernance mondiale",
  "cours": "<div class=\"cours-head\"><h2>L'ONU et la gouvernance mondiale</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'ONU : architecture et paradoxes</h3>\n<ul>\n<li><b>6 organes principaux</b> : le Conseil de sécurité (15 membres, 5 permanents au veto), l'Assemblée générale (193 États, 1 État = 1 voix), le Secrétariat (le SG : Guterres), la Cour internationale de Justice, le Conseil économique et social ;</li>\n<li><b>le paradoxe fondateur</b> : l'ONU a été conçue par les grandes puissances (Yalta, 1945) pour éviter qu'elles ne se fassent la guerre… et leur a donné le veto qui les rend inattaquables ;</li>\n<li>l'ONU vaut ce que ses membres veulent bien lui donner (budget ~3 Md $ : moins qu'un grand hôpital parisien, hors agences).</li>\n</ul>\n\n<h3>2. Au-delà de l'ONU : une gouvernance à géométrie variable</h3>\n<ul>\n<li>un réseau d'institutions spécialisées : <b>OMC</b> (commerce), <b>FMI/Banque mondiale</b> (monnaie, développement), <b>OMS</b> (santé), <b>AIEA</b> (nucléaire), <b>CPI</b> (individus), <b>COP</b> (climat), <b>G7/G20</b> (coordination) ;</li>\n<li><b>multipolarisation</b> : les BRICS élargis (2024 : Égypte, Éthiopie, Iran, Émirats…) contestent les institutions « occidentales » : « réforme de la gouvernance » = mot d'ordre du Sud.</li>\n</ul>\n\n<h3>3. Le droit international : force et fragilité</h3>\n<ul>\n<li>le droit encadre presque tout : la Charte (1945), le droit de la mer (Montego Bay), le droit humanitaire (Genève 1949), le climat (Paris 2015 : contributions <b>volontaires</b>) ;</li>\n<li>le droit <b>sanctionne</b> et <b>légitime</b> — mais il repose sur le consentement des États : l'organe d'appel de l'OMC est paralysé depuis 2019 (blocage américain des juges) ;</li>\n<li>la CIJ rend des avis (2024 : occupations illégales) : la parole juridique existe, l'exécution dépend des États.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"25\" y1=\"62\" x2=\"423\" y2=\"62\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"423,62 413,57 413,67\" fill=\"#4f46e5\"/><circle cx=\"25.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"25.0\" y1=\"62\" x2=\"25.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"25.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1945</text><text x=\"25.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Charte de San</text><text x=\"25.0\" y=\"42\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Francisco</text><circle cx=\"103.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"103.0\" y1=\"62\" x2=\"103.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"103.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1972</text><text x=\"103.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Conférence de Stockholm</text><circle cx=\"181.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"181.0\" y1=\"62\" x2=\"181.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"181.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1992</text><text x=\"181.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Sommet de Rio</text><circle cx=\"259.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"259.0\" y1=\"62\" x2=\"259.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"259.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1998</text><text x=\"259.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Statut de Rome</text><circle cx=\"337.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"337.0\" y1=\"62\" x2=\"337.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"337.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2015</text><text x=\"337.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Accord de Paris</text><circle cx=\"415.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"415.0\" y1=\"62\" x2=\"415.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"415.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2022</text><text x=\"415.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Négociation traité pandémie</text></svg><span class=\"fig-cap\">La gouvernance mondiale depuis 1945 : à chaque défi global (environnement, justice, santé, climat), de nouvelles institutions — mais toujours sans gouvernement mondial.</span></div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — résolution contraignante ou déclarative ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux « résolutions de l'ONU » : 1) le Conseil de sécurité sur l'Irak (1990 : autorisation de la force) ; 2) l'Assemblée générale sur le climat (2023 : avis consultatif). Quelle différence ?</div><div class=\"etu\"><b>Étape 1 — Conseil (chap. VII)</b> : la résolution 678 (1990) autorise « tous les moyens nécessaires » pour libérer le Koweït : contraignante, elle légitime l'emploi de la force (rare).</div><div class=\"etu\"><b>Étape 2 — Assemblée</b> : vote majoritaire, tous les sujets, mais non contraignante : sa force est de nombre (141 voix pour condamner l'invasion de l'Ukraine, mars 2022) : légitimité, pas exécution.</div><div class=\"etu\"><b>Étape 3 — Élargir</b> : la gouvernance mondiale n'est pas un « gouvernement mondial » : un assemblage d'organes à géométrie variable, souvent paralysé au moment précis où il faudrait agir.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la question de la réforme (Conseil élargi ? veto limité ?) revient à chaque crise.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la pandémie de Covid-19 : test de la gouvernance</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La pandémie (2020-22) a révélé les forces et faiblesses de la gouvernance mondiale : lesquelles ?</div><div class=\"etu\"><b>Étape 1 — Les forces</b> : l'OMS alerte (30 janvier 2020), le génome est séquencé en quelques jours (science ouverte), COVAX (2 Md de doses) : un vaccin livré en moins d'un an (record absolu).</div><div class=\"etu\"><b>Étape 2 — Les faiblesses</b> : les États prennent les décisions (fermetures, « vaccinationalisme » : les riches réservent les doses de 2021) ; l'OMS n'a aucun pouvoir de contrainte (enquête sur l'origine entravée).</div><div class=\"etu\"><b>Étape 3 — La leçon</b> : excellente sur la science, faible sur la politique : les défis globaux réclament des solutions globales, mais la souveraineté reste la règle du jeu.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : l'écart entre les deux est LE problème central du siècle (d'où le traité pandémie en négociation depuis 2022).</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le climat : le droit volontaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'accord de Paris (2015) est universel (195 parties) : pourquoi les émissions continuent-elles ?</div><div class=\"etu\"><b>Étape 1 — L'architecture</b> : chaque État fixe ses contributions (NDC), révisées tous les 5 ans, sans mécanisme de contrainte : un « pacte de confiance » (le refus américain de Kyoto a dicté ce design souple).</div><div class=\"etu\"><b>Étape 2 — Les résultats</b> : trajectoire actuelle ~2,5-2,9 °C (loin des 1,5) — mais des dynamiques s'enclenchent (renouvelables les moins chères, mécanisme carbone aux frontières de l'UE).</div><div class=\"etu\"><b>Étape 3 — Le débat HGGSP</b> : gouvernance « molle » (soft law) ou inefficace ? Les deux thèses s'écrivent avec des preuves.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la COP est une négociation permanente, jamais un gouvernement : le maximum que le monde souverain accepte aujourd'hui.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>l'ONU n'est pas un gouvernement (pas d'armée propre, budget modeste) ;</li>\n<li>« résolution de l'ONU » ne veut rien dire : préciser <b>Conseil</b> (contraignante) vs <b>Assemblée</b> (déclarative) ;</li>\n<li>le secrétaire général ne « dirige » pas le monde : il alerte, médiatise, propose ;</li>\n<li>les sanctions ONU sont les plus légitimes, mais les embargos font parfois souffrir les populations (Irak, années 1990).</li>\n</ul>\n</div>"

  "cours": "<div class=\"cours-head\"><h2>La propagation des idées et de l'information</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les ondes de choc : révolutions et réseaux</h3>\n<ul>\n<li><b>les idées voyagent plus vite que les armées</b> : imprimerie (Luther, 1517 : 300 000 tracts en 3 ans : la Réforme est la première « viralité »), Lumières (l'Encyclopédie malgré la censure), 1848 (le « printemps des peuples » : la nouvelle saute de capitale en capitale en semaines) ;</li>\n<li><b>XXe siècle</b> : radio (les totalitarismes : Goebbels), télévision (Vietnam : « la première guerre dans le salon » ; 1968 : la planète voit Paris), satellites (CNN : la guerre du Golfe en direct).</li>\n</ul>\n\n<h3>2. Le nouveau canon : les plateformes</h3>\n<ul>\n<li><b>écosystème</b> : 5 Md d'internautes, 4-5 h/jour ; TikTok (1,5 Md), YouTube (2,5 Md), WhatsApp (2 Md — LE réseau de l'info en Afrique et Amérique latine), Facebook (3 Md), Telegram ;</li>\n<li><b>économie de l'attention</b> : l'algorithme optimise le temps de vision, pas la vérité : l'émotion (la colère surtout) est le carburant de la viralité ;</li>\n<li><b>concentration</b> : 4-5 entreprises privées américaines (et TikTok chinois) filtrent l'information planétaire : une géopolitique des infrastructures numériques.</li>\n</ul>\n\n<h3>3. États et plateformes : la bataille de la régulation</h3>\n<ul>\n<li>les États veulent reprendre la main : <b>RGPD/DSA européens</b> (responsabilité des plateformes, transparence des algorithmes), lois nationales, censure étatique (le Grand Pare-feu chinois : le contre-modèle souverain) ;</li>\n<li><b>contentieux géopolitique</b> : TikTok (données = souveraineté), spyware (Pegasus), influence électorale (Cambridge Analytica) ;</li>\n<li><b>le dilemme central</b> : réguler sans casser la liberté d'expression : chaque bloc tranche selon sa culture (1er amendement US vs dignité UE vs souveraineté Chine).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"25\" y1=\"62\" x2=\"423\" y2=\"62\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"423,62 413,57 413,67\" fill=\"#4f46e5\"/><circle cx=\"25.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"25.0\" y1=\"62\" x2=\"25.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"25.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1517</text><text x=\"25.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Luther : tracts</text><text x=\"25.0\" y=\"42\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">imprimés</text><circle cx=\"103.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"103.0\" y1=\"62\" x2=\"103.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"103.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1751</text><text x=\"103.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Encyclopédie</text><circle cx=\"181.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"181.0\" y1=\"62\" x2=\"181.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"181.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1930s</text><text x=\"181.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Radio des propagandes</text><circle cx=\"259.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"259.0\" y1=\"62\" x2=\"259.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"259.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1968</text><text x=\"259.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Écrans : la</text><text x=\"259.0\" y=\"94\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">planète voit</text><circle cx=\"337.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"337.0\" y1=\"62\" x2=\"337.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"337.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1991</text><text x=\"337.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">CNN, guerre en</text><text x=\"337.0\" y=\"42\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">direct</text><circle cx=\"415.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"415.0\" y1=\"62\" x2=\"415.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"415.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2011</text><text x=\"415.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Printemps arabe 2.0</text></svg><span class=\"fig-cap\">De la presse de Luther à TikTok : chaque saut technologique accélère la propagation des idées — et la bataille pour les contrôler.</span></div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — 2011 : le « printemps arabe », révolution 2.0 ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Facebook a fait la révolution tunisienne et égyptienne » : nuancer ce slogan.</div><div class=\"etu\"><b>Étape 1 — Ce que les réseaux ONT fait</b> : coordination (les manifestations du 25 janvier 2011 en Égypte : « Nous sommes tous Khaled Saïd »), contournement de la censure, contamination transnationale (l'effet domino visuel après la chute de Ben Ali).</div><div class=\"etu\"><b>Étape 2 — Ce qu'ils n'ont PAS fait</b> : les causes profondes sont économiques et politiques (jeunes diplômés sans avenir, corruption, prix alimentaires) ; et l'Égypte a coupé Internet le 28 janvier 2011 : la rue s'est remplie pareil.</div><div class=\"etu\"><b>Étape 3 — Leçon HGGSP</b> : « les réseaux sociaux sont un accélérateur, pas une cause » : la même technologie a porté les mobilisations démocratiques ET les djihadismes, les complotismes ET le fact-checking.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la technologie est neutre de sens, les acteurs la chargent : douter des récits technologiques (enthousiastes ou apocalyptiques) est une compétence du chapitre.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'arme des images : Alan Kurdi</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'image d'Alan Kurdi (septembre 2015 : l'enfant syrien échoué sur une plage turque) a fait le tour du monde : quelles réactions, quelles limites ?</div><div class=\"etu\"><b>Étape 1 — L'onde</b> : en 24 h : 53 M de vues ; dons massifs (la collecte suédoise ×100 en une semaine) ; Merkel : « wir schaffen das » ; l'opinion bascule.</div><div class=\"etu\"><b>Étape 2 — Les limites</b> : l'effet s'évanouit en semaines (l'agenda des plateformes tourne) ; les mêmes images sont retournées par les camps hostiles ; la fermeture de la route des Balkans suit en 2016.</div><div class=\"etu\"><b>Étape 3 — Leçon</b> : une image peut changer l'agenda (le « moment » émotionnel), mais pas les intérêts ni les rapports de force.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : articuler « l'effet image » et « l'effet structure » est la marque d'une copie aboutie.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le DSA : l'Europe légifère le monde ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le Digital Services Act (2022) impose aux très grandes plateformes d'évaluer les risques systémiques, de s'auditer et de transmettre les données aux chercheurs : quel effet géopolitique ?</div><div class=\"etu\"><b>Étape 1 — Le mécanisme</b> : plus de responsabilité (suppression rapide des contenus illégaux), plus de transparence (algorithmes expliqués), sanctions jusqu'à 6 % du chiffre d'affaires mondial.</div><div class=\"etu\"><b>Étape 2 — L'effet de taille</b> : le marché européen (450 M de consommateurs) est trop gros pour être refusé : les plateformes appliquent souvent les règles mondialement (« effet Bruxelles », comme le RGPD copié par 100+ pays).</div><div class=\"etu\"><b>Étape 3 — Les objections</b> : coût de conformité (favorise les géants), risque de sur-censure, fragmentation mondiale de l'Internet (chaque bloc légifère seul).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la régulation est le champ de bataille actuel de l'information : qui fixe les règles du discours mondial ?</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Internet a fait la révolution » : non, il l'a <b>accélérée</b> (causes profondes d'abord) ;</li>\n<li>les plateformes ne fixent pas « la » vérité : elles règlent l'<b>attention</b> ;</li>\n<li>critiquer l'économie de l'attention ≠ complotisme ;</li>\n<li>la censure autoritaire n'est pas la régulation démocratique : distinguer les modèles (Chine / UE / USA) ;</li>\n<li>une image virale change l'agenda, rarement la politique de fond.</li>\n</ul>\n</div>"

  "id": "afrique",

  "cours": "<div class=\"cours-head\"><h2>L'Afrique : un continent en transformation</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le continent le plus jeune du monde</h3>\n<ul>\n<li><b>1,4 Md d'habitants (2023), 2,5 Md en 2050</b> : 60 % de moins de 25 ans ; l'âge médian (~19 ans) est la moitié de celui du monde ;</li>\n<li><b>54 États, ~2000 langues</b> : l'Afrique n'est pas UN pays ;</li>\n<li><b>urbanisation galopante</b> : Lagos (~15 M), Kinshasa (~15 M), Le Caire : les « villes-monstres » sont le laboratoire du continent ;</li>\n<li>une <b>jeunesse géopolitique</b> : 17 % de l'humanité, 25 % des naissances mondiales, ~3 % du PIB ; 54 voix à l'ONU = un bloc à séduire : le « continent-courtisé » (sommets Russie, Chine/FOCAC, UE).</li>\n</ul>\n\n<h3>2. Les partenaires : le « retour des puissances »</h3>\n<ul>\n<li><b>la Chine, 1re partenaire depuis 2009</b> : commerce ~280 Md $, infrastructures (BRI), 10 000+ entreprises chinoises ;</li>\n<li><b>la Russie</b> : Wagner/Africa Corps (Mali, RCA, Libye : sécurité contre l'or et l'uranium), céréales et armes ;</li>\n<li>les <b>nouvelles présences</b> : Émirats, Turquie (drones Bayraktar), Arabie saoudite ;</li>\n<li><b>le retrait occidental</b> : fin de Barkhane (2022), retrait du Mali (2022) et du Niger (2023) ; l'UE et les États-Unis restent premiers bailleurs d'aide (Global Gateway, AGOA).</li>\n</ul>\n\n<h3>3. Les dynamiques internes : intégration et États</h3>\n<ul>\n<li><b>ZLECAf (2021)</b> : un marché continental (54 signataires, 1,4 Md de consommateurs) ; le commerce intra-africain (~16 %) doit encore décoller (contre ~60 % dans l'UE) ;</li>\n<li>des <b>États fragiles</b> (Soudan 2023 : plus grande crise de réfugiés ; l'Est de la RDC en guerre depuis 30 ans) cohabitent avec des réussites (Rwanda tech, Botswana et le diamant, Maroc, Afrique du Sud) ;</li>\n< pe 4 — Conclure</b> : le continent-courtisé devient le continent-contesté : l'influence y est désormais une enchère permanente.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le Rwanda, « Singapour africain » ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le Rwanda affiche 8 % de croissance, Kigali « la ville la plus propre d'Afrique », des hubs tech et des drones médicaux (Zipline). Pourquoi parle-t-on de modèle, et quelles limites ?</div><div class=\"etu\"><b>Étape 1 — Les résultats</b> : croissance soutenue, corruption mesurée basse, assurance santé généralisée, drones médicaux, tourisme (les gorilles) : l'État de développement (Kagame : « nous ne mendions pas »).</div><div class=\"etu\"><b>Étape 2 — Le revers</b> : la « démocratie » contrôlée (99 % en 2017), opposants en exil, liberté de presse parmi les plus basses du monde : le modèle « développement d'abord, libertés ensuite ».</div><div class=\"etu\"><b>Étape 3 — Leçon HGGSP</b> : peut-on « développer » sans démocratiser ? Le débat Sen, à citer des deux côtés (stabilité/efficacité vs droits humains/durabilité).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : l'Afrique n'attend plus le « développement » : elle exporte ses modèles (le Rwanda forme des policiers, lobby à l'ONU, accueille le siège du CAF).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« l'Afrique » est 54 pays : toujours préciser les cas (le Nigéria et l'Éthiopie diffèrent plus que la France et le Vietnam) ;</li>\n<li>la présence chinoise n'est pas que « dette » : marché, emplois, influence (le débat doit être étayé) ;</li>\n<li>les coups d'État sahéliens ne sont pas tous « anti-français » par essence : l'échec sécuritaire et le rejet du modèle occidental sont les moteurs ;</li>\n<li>l'aide publique au développement est inférieure aux mandats des migrants, aux IDE… et à l'évasion fiscale.</li>\n</ul>\n</div>"

{"t": "De nouveaux espaces de conflit ? (HGGSP)", "q": "La projection de Mercator :", "c": ["est neutre", "réduit l'Europe", "est interdite", "gonfle les surfaces des hautes latitudes (Groenland, Russie)"], "a": 3, "e": "Elle agrandit le Nord : un message géopolitique en soi.", "d": "<b>Elle gonfle le Nord</b> : le Groenland paraît 14 fois l'Algérie alors qu'ils font la même taille.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi : pour représenter une sphère à plat, il faut choisir ce qu'on déforme : Mercator (1569, pour la navigation) conserve les angles et étire démesurément les pôles : l'Afrique (30 M km²) semble plus petite que le Groenland (2 M km²) : 15 fois moins en réalité ! Piège : « est neutre » : AUCUNE projection ne l'est : chaque carte est un choix, donc un argument : en HGGSP, la carte est un DOCUMENT à critiquer, pas un fond décoratif.</div>"},
{"t": "De nouveaux espaces de conflit ? (HGGSP)", "q": "Une ZEE (zone économique exclusive) s'étend jusqu'à :", "c": ["12 milles marins", "200 milles marins", "jusqu'à la côte adverse", "500 milles"], "a": 1, "e": "200 milles (≈370 km) : droit d'exploitation des ressources, fixé par Montego Bay (1982).", "d": "<b>200 milles</b> : la convention de Montego Bay.<div class='ex-detail'><u>Exemple rédigé</u> : le régime à trois cercles : eaux territoriales (12 milles : souveraineté), zone contiguë (24 milles), ZEE (200 milles : exploitation économique) : c'est sur les ZEE que se joue l'Arctique et les tensions en mer de Chine méridionale (9 traits de la carte chinoise vs ZEE des voisins). Piège : « 12 milles » : c'est la souveraineté, pas l'exploitation : la ZEE est un droit ÉCONOMIQUE, pas une annexion.</div>"},
