{"t": "De nouveaux espaces de conflit ? (HGGSP)", "q": "Le Cachemire illustre :", "c": ["la superposition de plusieurs conflictualités (territoriale, identitaire, hydrique)", "un conflit résolu par l'ONU", "un conflit purement religieux", "une frontière stable"], "a": 0, "e": "Inde/Pakistan : frontière non reconnue, identités, eaux de l'Indus, puissances nucléaires.", "d": "<b>La superposition de conflictualités</b>.<div class='ex-detail'><u>Exemple rédigé</u> : décomposition : ① territoriale (la ligne de contrôle de 1972 n'est pas une frontière reconnue) ② identitaire (majorité musulmane, maharaja hindou en 1947) ③ hydrique (l'Indus, traité de 1960 toujours respecté, miracle rare) ④ nucléaire (deux puissances atomiques face à face) : le concept HGGSP : un espace de conflit concentre des NATURES de conflit : le traiter d'un seul angle (religion) appauvrit l'analyse.</div>"},
{"t": "De nouveaux espaces de conflit ? (HGGSP)", "q": "L'Arctique, nouvel espace de convoitise, se dispute d'abord :", "c": ["par des guerres ouvertes", "par des ventes aux enchères", "par l'OTAN seulement", "par le droit (dossiers d'extension de plateaux à l'ONU) et la présence militaire"], "a": 3, "e": "Montego Bay + dépôts scientifiques : la compétition juridique prime, avec signaux militaires croissants.", "d": "<b>Par le droit et la présence</b>, pas (encore) par la guerre.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario : la fonte ouvre routes et hydrocarbures : chaque État riverain dépose à l'ONU des preuves scientifiques que « son » plateau continental se prolonge au pôle (le drapeau planté au fond par la Russie en 2007 était un coup de communication, pas un acte juridique) : pendant ce temps, bases réactivées et brise-glaces s'accumulent : la conflictualité moderne : un affrontement de DROIT doublé d'une course aux MOYENS : la bataille sans bataille.</div>"},
{"t": "De nouveaux espaces de conflit ? (HGGSP)", "q": "Les « zones grises » (Sahel, Somalie) sont des espaces :", "c": ["très contrôlés par l'État", "hors de toute conflictualité", "où l'État est faible ou absent, propices aux acteurs non étatiques", "sans population"], "a": 2, "e": "Vide étatique ⟹ jihadistes, trafiquants, milices : le conflit suit la défaillance de l'État.", "d": "<b>Vide étatique ⟹ acteurs non étatiques</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne : un État ne contrôle plus son territoire (Sahel : étendue, pauvreté, corruption) : les groupes armés (Boko Haram, JNIM) offrent protection et ressources (trafics, zakat armée) : les États étrains intervennent (Barkhane) mais sans État local légitime, le vide se referme ailleurs : la HGGSP y lit un principe : la conflictualité se déplace vers les ESPACES DÉLAISSÉS par la mondialisation, pas vers ses centres.</div>"},
{"t": "De nouveaux espaces de conflit ? (HGGSP)", "q": "Pour critiquer une carte, on n'interroge PAS :", "c": ["les seuils retenus", "la couleur du fond de mer", "l'auteur et la source", "l'indicateur et son année"], "a": 1, "e": "Le fond de mer ne porte pas de message : tout le reste (source, dates, découpage, seuils) est un choix orienté.", "d": "<b>La couleur du fond de mer</b> : purement décorative.<div class='ex-detail'><u>Exemple rédigé</u> : le protocole de lecture critique : QUI (mission ? État ? ONG ?) : QUOI (indicateur, sa définition, son année) : COMMENT (projection, découpe en États ou régions, nombre de classes et seuils) : POURQUOI (quel message) : une carte du « terrorisme » par État n'a pas le même sens que par région, et changer « 10 attaques » en « 50 attaques » comme seuil change toute la couleur du monde.</div>"},
{"t": "De nouveaux espaces de conflit ? (HGGSP)", "q": "Les frontières africaines rectilignes s'expliquent par :", "c": ["des traités anciens entre royaumes", "le relief", "l'ONU", "le partage colonial (Berlin 1884-85 et couper au cordeau)"], "a": 3, "e": "44 % méridiennes : héritage de la conférence de Berlin et des accords coloniaux, jamais remis en cause à l'indépendance.", "d": "<b>Le partage colonial</b> (Berlin 1884-85).<div class='ex-detail'><u>Exemple rédigé</u> : la preuve chiffrée : 44 % des frontières africaines suivent des méridiens ou parallèles (contre ~3 % ailleurs) : les puissances européennes se partageaient sur carte, sans tenir compte des peuples : à l'indépendance (1960), l'OUA choisit l'INTANGIBILITÉ des frontières (uti possidetis) : figer la faute pour éviter les guerres : un choix géopolitique majeur : les frontières coloniales, causes de conflits (Biafra, Sahel), sont restées : la stabilité contre la justice.</div>"},
{"t": "De nouveaux espaces de conflit ? (HGGSP)", "q": "Le cyberspace est un « nouvel espace de conflit » car :", "c": ["il n'existe pas réellement", "il appartient à l'ONU", "il est pacifique par nature", "il est un champ d'affrontement (piratage, infox, sabotage) sans frontière physique"], "a": 3, "e": "Attaques étatiques et criminelles : un champ stratégique mondial (SolarWinds, NotPetya).", "d": "<b>Un champ d'affrontement sans frontière</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le bestiaire : piratage d'État (SolarWinds 2020 : intrusion massive aux USA), sabotage (Stuxnet 2010 : centrifugeuses iraniennes), infox (élections), rançongiciels (Colonial Pipeline 2021 : l'essence s'arrête sur la côte Est américaine) : l'attribution est difficile (qui a attaqué ?), la riposte incertaine : les espaces nouveaux de conflit sont d'abord des espaces de DROIT EN CONSTRUCTION.</div>"},
{"t": "De nouveaux espaces de conflit ? (HGGSP)", "q": "La ligne de contrôle au Cachemire date globalement de :", "c": ["1972 (accords de Simla)", "1948", "1999", "1947"], "a": 0, "e": "La ligne de cessez-le-feu devient « ligne de contrôle » en 1972 : de facto, jamais reconnue comme frontière.", "d": "<b>1972</b> (accords de Simla après la guerre de 1971).<div class='ex-detail'><u>Exemple rédigé</u> : la chronologie : 1947-48 première guerre : ligne de cessez-le-feu supervisée par l'ONU (résolution demandant plébiscite, jamais tenu) : 1965 guerre : 1971 guerre (le Pakistan perd le Bangladesh) : 1972 Simla : « ligne de contrôle », à surveiller des deux côtés : 1999 guerre de Kargil sur cette même ligne : l'absence de reconnaissance officielle de la ligne est le moteur du contentieux : de facto ≠ de jure, la distinction clé en HGGSP.</div>"},
{"t": "De nouveaux espaces de conflit ? (HGGSP)", "q": "Le gerrymandering consiste à :", "c": ["découper des circonscriptions pour favoriser un parti", "gommer les frontières", "compter les habitants", "interdire les cartes"], "a": 0, "e": "Manipuler l'espace électoral : la carte comme arme politique interne.", "d": "<b>Découper des circonscriptions pour gagner</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : en concentrant les électeurs adverses dans peu de circonscriptions (qu'on perd massivement) et en les diluant ailleurs, un parti minoritaire en voix peut rafler la majorité des sièges : des exemples aux États-Unis dessinent des circonscriptions en « salamandre » (d'où le nom, 1812) : la leçon HGGSP : l'espace n'est pas un décor : le découper, c'est distribuer le pouvoir : cartes électorales, découpages scolaires, régions : qui trace, gouverne.</div>"},
{"t": "Mers et océans : espaces de convoitises (HGGSP)", "q": "Le détroit d'Ormuz est stratégique car :", "c": ["il est très large", "il relie les Amériques", "il est fermé depuis 1979", "~20 % du pétrole mondial y transite"], "a": 3, "e": "Goulot de 33 km entre le Golfe persique et l'océan Indien : tout le pétrole du Golfe doit y passer.", "d": "<b>~20 % du pétrole mondial</b> y transite.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement du goulot : production du Golfe (Arabie, Irak, Koweït, Émirats, Iran) + petroliers + 33 km de large = un point unique dont la fermeture, même partielle (attaques 2019, saisies), ferait grimper le baril et les assurances : la mondialisation repose sur des passages ÉTROITS : celui qui menace un goulet tient l'économie mondiale par un fil.</div>"},
{"t": "Mers et océans : espaces de convoitises (HGGSP)", "q": "La ZEE d'un État côtier s'étend jusqu'à :", "c": ["50 milles", "12 milles", "200 milles", "350 milles"], "a": 2, "e": "200 milles pour l'exploitation économique ; 12 milles = eaux territoriales souveraines.", "d": "<b>200 milles</b> : la zone d'exploitation (Montego Bay).<div class='ex-detail'><u>Exemple rédigé</u> : la gradation à connaître par cœur : 0-12 milles : eaux territoriales (souveraineté, comme le territoire terrestre) : 12-24 : zone contiguë (police) : jusqu'à 200 : ZEE (pêche, fond, ressources : souveraineté ÉCONOMIQUE seulement : navigation et câbles restent libres) : au-delà, extension possible du plateau jusqu'à 350 milles SUR DOSSIER SCIENTIFIQUE. Piège : confondre 12 (souveraineté) et 200 (économie) est l'erreur classique en dissertation.</div>"},
{"t": "Mers et océans : espaces de convoitises (HGGSP)", "q": "Grâce à ses outre-mer, la ZEE française :", "c": ["est la 2e du monde (~11 millions de km²)", "n'existe pas en Polynésie", "est minuscule", "est la première du monde"], "a": 0, "e": "11 M km² : derrière les États-Unis : grâce à la Polynésie, Nouvelle-Calédonie, Kerguelen, etc.", "d": "<b>La 2e du monde</b> (~11 M km²).<div class='ex-detail'><u>Exemple rédigé</u> : la leçon géographique : quelques îles dispersées (Clipperton, Wallis, Kerguelen) génèrent des ZEE immenses : la France est ainsi « le 2e domaine maritime mondial » : les États-Unis (1ers) le doivent à l'Alaska, Hawaï et Guam : conséquence géopolitique : la France est riveraine de l'Arctique (via le Groenland ? non : via Svalbard ? NON : Saint-Pierre-et-Miquelon et Clipperton), du Pacifique, de l'Indien : une puissance maritime sans en avoir l'habitude mentale.</div>"},
{"t": "Mers et océans : espaces de convoitises (HGGSP)", "q": "La sentence de 2016 sur la mer de Chine méridionale :", "c": ["a donné les îles à la Chine", "a été rejetée par Pékin (aucune contrainte d'exécution)", "a été acceptée par la Chine", "a fermé le détroit de Malacca"], "a": 1, "e": "La Cour permanente d'arbitrage invalide les « droits historiques » ; Pékin refuse la sentence : le droit sans la force.", "d": "<b>Rejetée par Pékin</b> : un arbitrage sans exécution forcée.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : les Philippines saisissent l'arbitrage : la sentence (12 juillet 2016) dit qu'un récif dragué ne devient pas une île et que la « ligne en 9 traits » n'a pas de base juridique : la Chine boycotte la procédure et déclare la sentence « nulle et non avenue » : aucune police mondiale ne peut la forcer : la leçon HGGSP : dans un monde d'États souverains, le droit international a le dernier mot... seulement si les puissances veulent bien l'écouter : le rapport de force prime.</div>"},
{"t": "Mers et océans : espaces de convoitises (HGGSP)", "q": "Les îles artificielles chinoises (Spratleys) :", "c": ["appartiennent aux Philippines", "créent des droits juridiques", "ne créent aucun droit selon Montego Bay (sentence 2016)", "sont des bases de recherche pure"], "a": 2, "e": "Installations artificielles ⟹ pas de ZEE : mais présence militaire de facto (pistes, radars).", "d": "<b>Aucun droit juridique</b> : mais des faits accomplis.<div class='ex-detail'><u>Exemple rédigé</u> : la nuance féconde : JURIDIQUEMENT, la sentence de 2016 a raison (dragage ≠ île : récifs ≠ ZEE) : FACTUELLEMENT, piste de 3 km, missiles et radars sont LÀ, et les « pêcheurs-miliciens » harcèlent les voisins : le conflit moderne se joue sur l'écart entre le droit et le fait : savoir distinguer les deux registres est exactement la compétence attendue en HGGSP.</div>"},
{"t": "Mers et océans : espaces de convoitises (HGGSP)", "q": "99 % de l'Internet intercontinental passe par :", "c": ["le satellite", "des ballons stratosphériques", "la 5G", "des câbles sous-marins"], "a": 3, "e": "~400 câbles sous l'océan : la circulation de l'information est... maritime !", "d": "<b>Des câbles sous-marins</b> (~400).<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe à retenir : le « cloud » est sous la mer : des câbles en fibre (2-3 cm d'épaisseur, posés par des navires câbliers) transportent la quasi-totalité des données : coupures accidentelles (ancres : 150-200 par an) ou visées (sabotages suspectés en mer Baltique et mer Rouge) : la conflictualité maritime a une dimension NUMÉRIQUE : couper un câble = couper un continent du réseau.</div>"},
{"t": "Mers et océans : espaces de convoitises (HGGSP)", "q": "La « ligne en neuf traits » revendiquée par la Chine :", "c": ["a été validée par La Haye", "date de l'ONU", "est une revendication héritée (carte de 1947) invalidée en 2016", "concerne l'Arctique"], "a": 2, "e": "Revendication « historique » de ~80 % de la mer de Chine méridionale, rejetée par l'arbitrage.", "d": "<b>Héritée de 1947, invalidée en 2016</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la généalogie : la République de Chine trace une carte en U en 1947 (11 traits, devenus 9) : Pékin la reprend : elle englobe les ZEE du Vietnam, des Philippines, de la Malaisie et de Brunei : l'arbitrage de 2016 répond que la convention de Montego Bay (que la Chine a ratifiée) prime sur le droit « historique » : Pékin refuse : l'affrontement d'un droit ancien revendiqué et d'un droit moderne écrit, sans juge armé pour trancher.</div>"},
{"t": "Mers et océans : espaces de convoitises (HGGSP)", "q": "Le canal de Suez voit passer environ :", "c": ["12 % du commerce mondial", "50 %", "1 % du commerce mondial", "tout le pétrole"], "a": 0, "e": "~12 % du commerce mondial : 19 000 passages/an : l'Ever Given (2021) a bloqué 400 navires 6 jours.", "d": "<b>~12 % du commerce mondial</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'événement-révélateur : en mars 2021, le porte-conteneurs Ever Given (400 m) s'échoue dans le canal : 6 jours d'arrêt : 400 navires bloqués, ~10 milliards $ de trafic/jour gelés : détours par le cap de Bonne-Espérance (+9 000 km) : une seule pause d'un goulot, et c'est l'économie mondiale qui trinque : la fragilité des points de passage est une donnée centrale de la géopolitique des mers.</div>"},
{"t": "Mers et océans : espaces de convoitises (HGGSP)", "q": "Une île inhabitée génère :", "c": ["une souveraineté automatique pour le voisin", "un droit de l'ONU", "aucune ZEE", "une ZEE de 200 milles si elle est habitable"], "a": 3, "e": "Selon Montego Bay : une île (naturelle, habitable) a droit à ZEE : un simple rocher découvrant, non.", "d": "<b>Une ZEE si elle est « habitable »</b> (île au sens juridique).<div class='ex-detail'><u>Exemple rédigé</u> : la distinction décisive de l'article 121 : île = terre naturelle qui « soutient la vie humaine et une activité économique » ⟹ ZEE pleine : rocher qui « ne soutient pas » ⟹ rien : d'où les bagarres pour savoir si Okinotorishima (japonais, deux galets) ou les Éparses sont des îles : des forts en droit des mers débattent de quelques mètres de corail : chaque caillou « habitable » vaut 400 000 km² d'océan économique.</div>"},
{"t": "Mers et océans : espaces de convoitises (HGGSP)", "q": "La liberté de navigation en haute mer :", "c": ["est un régime juridique issu de Montego Bay", "est un état de nature sans règles", "a été abolie en 1982", "n'existe qu'en temps de paix"], "a": 0, "e": "La haute mer (au-delà des ZEE) est libre mais encadrée : navigation, pêche, câbles : un DROIT commun, pas un no man's land.", "d": "<b>Un régime juridique</b> (Montego Bay, partie VII).<div class='ex-detail'><u>Exemple rédigé</u> : la nuance : « libre » ne veut pas dire « sans droit » : la haute mer appartient à tous et à personne (patrimoine commun), la piraterie y est réprimée par TOUS les États (compétence universelle), les navires relèvent du seul État du pavillon : l'ordre juridique maritime est l'un des plus anciens commununs de l'humanité : remis en cause par les surpêches, les zones de piraterie (Golfe de Guinée) et les contests frontaliers : le droit sous tension, encore.</div>"},
{"t": "Démographie, développement et richesse (HGGSP)", "q": "Le pays le plus peuplé du monde depuis 2023 :", "c": ["l'Inde", "les États-Unis", "la Chine", "l'Indonésie"], "a": 0, "e": "L'Inde (>1,4 Md) a dépassé la Chine, dont la population décline.", "d": "<b>L'Inde</b> (>1,4 Md).<div class='ex-detail'><u>Exemple rédigé</u> : le basculement : la Chine (politique de l'enfant unique 1979-2015) vieillit et décroît : l'Inde, sans contrainte aussi stricte, continue : 2023 : l'ONU acte le dépassement : enjeux : l'Inde a un dividende démographique (jeunesse nombreuse) mais doit créer des emplois : la Chine gère la « vieille » : les deux trajectoires illustrent la transition démographique décalée, et le poids politique des pyramides d'âges.</div>"},
{"t": "Démographie, développement et richesse (HGGSP)", "q": "L'IDH (indice de développement humain) combine :", "c": ["le PIB seul", "santé, éducation et revenu", "l'armée", "la superficie"], "a": 1, "e": "Espérance de vie + durée de scolarisation + PIB/hab : 0 à 1.", "d": "<b>Santé + éducation + revenu</b> (PNUD).<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi ce trio : Mahbub ul Haq et Amartya Sen (1990) voulaient capter ce que le PIB rate : vivre longtemps, apprendre, disposer d'un revenu décent : application : un pays pétrolier peut avoir un PIB/hab élevé et un IDH moyen (inégalités, écoles faibles) : l'IDH corrige la vue purement économique : mais il omet lui-même les inégalités (d'où l'IDHI) et l'environnement : AUCUN indicateur ne dit tout : en HGGSP, c'est le croisement qui analyse.</div>"},
{"t": "Démographie, développement et richesse (HGGSP)", "q": "Une pyramide des âges à base large (Niger) signale :", "c": ["une guerre", "un vieillissement", "une population jeune, en forte croissance", "une migration massive"], "a": 2, "e": "Beaucoup de naissances : population jeune : défi écoles/emplois, dividende possible.", "d": "<b>Population jeune</b> en forte croissance.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne d'inférence : base large ⟹ fécondité élevée (Niger : ~6,7 enfants/femme) ⟹ âge médian ~15 ans ⟹ dans 20 ans : millions d'actifs : SI les écoles et les emplois suivent, le pays décolle (dividende démographique, cf. Asie de l'Est) : SINON : chômage des jeunes, instabilité : la démographie est une ESPERANCE conditionnelle : en HGGSP, toujours la relier aux capacités de l'État (éducation, santé, emploi).</div>"},
{"t": "Démographie, développement et richesse (HGGSP)", "q": "Les transferts d'argent des migrants vers leur pays (mandats) :", "c": ["sont négligeables", "profitent seulement aux banques", "sont interdits par l'ONU", "dépassent l'aide publique au développement mondiale"], "a": 3, "e": "~650 Md $/an : trois fois l'aide publique au développement : la migration finance le Sud.", "d": "<b>Dépassent l'aide publique</b> (et les IDE dans beaucoup de pays).<div class='ex-detail'><u>Exemple rédigé</u> : les chiffres (Banque mondiale) : mandats ~650 Md $/an vers les pays du Sud (dont 60+ Md vers le Mexique, 80+ Md vers l'Inde) : aide publique : ~200 Md : la migration est ainsi « la politique de développement la plus efficace du monde » (chaque mandat touche une famille SANS intermédiaire étatique) : contrepoint : coût humain (familles séparées), et « fuite des cerveaux » quand les diplômés partent : le bilan dépend de qui part, de qui revient, de qui envoie.</div>"},
{"t": "Démographie, développement et richesse (HGGSP)", "q": "La population mondiale est passée de 1 à 8 milliards entre :", "c": ["1960 et 2022", "1500 et 1900", "1900 et 2000", "1800 et 2022"], "a": 3, "e": "1 Md vers 1800, 2 Md en 1927, 8 Md en novembre 2022 : l'explosion est récente et ralentit.", "d": "<b>1800-2022</b> : 1 ⟹ 8 milliards.<div class='ex-detail'><u>Exemple rédigé</u> : le rythme accéléré : 1 Md (≈1804) : 2 Md (1927 : 123 ans) : 3 Md (1959 : 32 ans !) : 4 (1974) : 5 (1987) : 6 (1999) : 7 (2011) : 8 (2022 : 11 ans) : la croissance ABSOLUE ralentit maintenant (pic de croissance behind us : ~90 M/an vers 90 → 70 M/an) : l'ONU projette un plateau ~10,4 Md vers 2080 : la transition s'achève partout : le monde se stabilise en vieillissant, sauf l'Afrique.</div>"},
{"t": "Démographie, développement et richesse (HGGSP)", "q": "La part des migrants internationaux dans la population mondiale :", "c": ["~3,6 % (stable en proportion depuis 50 ans)", "50 %", "diminue vers 0", "augmente vers 20 %"], "a": 0, "e": "281 millions (3,6 %) : en hausse absolue, stable en proportion : contre l'intuition d'« invasion ».", "d": "<b>~3,6 %</b> : stable en proportion.<div class='ex-detail'><u>Exemple rédigé</u> : le chiffre qui démonte le mythe : si la migration « explosait », la proportion monterait : or elle est ~3 % depuis 50 ans (les chiffres ABSOLUS montent car la population monte) : 2/3 des migrants vivent dans des pays... du Sud (l'Asie est la 1re région d'accueil, le Golfe le 1er corridor) : la perception européenne (« assiégée ») est un fait MÉDIATIQUE autant que démographique : en HGGSP, distinguer le fait et sa perception est la première règle.</div>"},
{"t": "Démographie, développement et richesse (HGGSP)", "q": "Le « dividende démographique » désigne :", "c": ["la baisse de natalité", "une aide de l'ONU", "le gain de croissance quand la population active explose avant le vieillissement", "un impôt sur les naissances"], "a": 2, "e": "Beaucoup d'actifs, peu de dépendants : fenêtre de croissance (Asie de l'Est, Inde aujourd'hui).", "d": "<b>La fenêtre de croissance d'une population active nombreuse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : quand la fécondité baisse, la génération nombreuse d'avant arrive à l'âge adulte : peu d'enfants à charge, peu encore de retraités : épargne, investissement, croissance (la Chine 1980-2010, la Corée) : la fenêtre se referme avec le vieillissement : l'Inde et l'Afrique y entrant doivent créer les EMPLOIS sinon le dividende devient bombe (chômage) : une pyramide n'est pas un destin : c'est une opportunité à saisir par l'école et l'économie.</div>"},
{"t": "Démographie, développement et richesse (HGGSP)", "q": "Le coefficient de Gini mesure :", "c": ["la population", "les inégalités de revenu (0 = égalité parfaite, 100 = inégalité max)", "l'IDH", "la richesse"], "a": 1, "e": "Un indicateur d'inégalité de distribution : complète le PIB/hab moyen.", "d": "<b>Les inégalités</b> (0 à 100).<div class='ex-detail'><u>Exemple rédigé</u> : l'utilisation : deux pays au PIB/hab identique : Gini 25 (Scandinavie) vs 60 (Brésil, Afrique du Sud) : la vie quotidienne diffère radicalement (infrastructures partagées vs gated communities à côté de favelas) : le PIB dit la TAILLE du gâteau, le Gini dit sa DÉCOUPE : l'IDHI (IDH ajusté inégalités) combine les deux : en dissertation, PIB/hab + Gini = le couple minimal d'une comparaison sérieuse.</div>"},
{"t": "Démographie, développement et richesse (HGGSP)", "q": "La Chine après la politique de l'enfant unique (1979-2015) fait face à :", "c": ["une immigration massive", "un vieillissement rapide et une population décroissante", "rien", "un baby-boom"], "a": 1, "e": "1,3 enfant/femme : population déclinante depuis 2022, vieillissement : le « miracle » a un coût.", "d": "<b>Vieillissement et décroissance</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'addition : la politique + l'urbanisation + le coût du logement ont fait tomber la fécondité à ~1 enfant/femme : 2022 : première baisse de population depuis 60 ans : 2050 : peut-être 1,3 Md (de 1,41) et 30 % de plus de 60 ans : conséquences géopolitiques : moins de soldats, moins d'actifs, plus de dépenses de santé/retraites : le « siècle chinois » se heurte à sa pyramide inversée : la politique des DEUX enfants (2016) puis TROIS (2021) n'a pas relancé les naissances (coût de l'éducation) : le forcing démographique se retourne.</div>"},
{"t": "Démographie, développement et richesse (HGGSP)", "q": "Selon Amartya Sen, le développement est :", "c": ["l'élargissement des libertés et capacités des personnes", "l'urbanisation", "la croissance du PIB", "l'industrialisation"], "a": 0, "e": "« Development as Freedom » : le développement = ce que les gens peuvent FAIRE et ÊTRE, pas ce qu'ils possèdent.", "d": "<b>L'élargissement des libertés et capacités</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la rupture conceptuelle : un revenu sans école ni santé ni droits politiques n'est pas du développement (le pétrole sans libertés) : Sen fonde l'IDH sur cette idée : mesurer ce que les gens PEUVENT faire (vivre longtemps, apprendre, participer) : conséquence HGGSP : un pays « riche » non libre peut être « sous-développé » au sens de Sen : l'indicateur incarne une PHILOSOPHIE : le choisir, c'est déjà trancher le débat « richesse ou libertés ».</div>"},
{"t": "Les ressources et la transition énergétique (HGGSP)", "q": "Avant 2022, l'Europe importait de Russie environ :", "c": ["rien", "40 % de son gaz", "90 % de son pétrole", "10 % de son gaz"], "a": 1, "e": "~40 % du gaz (55 % pour l'Allemagne) : la dépendance devenue arme en 2022.", "d": "<b>~40 % de son gaz</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme de l'arme : dépendance (pipelines, contrats longs) ⟹ réduction des livraisons en 2022 ⟹ prix x5 (août 2022) ⟹ riposte européenne : GNL, renouvelables, sobriété ⟹ dépendance ~15 % en 2023 : la leçon de HGGSP : une ressource concentrée entre les mains d'un fournisseur est un LEVIER stratégique : la diversification est une politique de sécurité autant qu'un choix climatique : l'interdépendance n'est pas symétrique.</div>"},
{"t": "Les ressources et la transition énergétique (HGGSP)", "q": "La Chine domine les terres rares surtout par :", "c": ["son raffinage (~85 % mondial)", "ses réserves géologiques uniquement", "son absence d'environnement", "l'ONU"], "a": 0, "e": "Mines : ~60 % : mais surtout ~85 % du RAFFINAGE : le maillon qui compte.", "d": "<b>Le raffinage</b> (~85 %).<div class='ex-detail'><u>Exemple rédigé</u> : la nuance décisive : les terres rares ne sont pas « rares » (des gisements existent partout : USA, Suède, Groenland) : mais le raffinage est POLLUANT et la Chine a accepté de le développer (prix bas) : aujourd'hui : fermer un téléphone ou une éolienne sans la Chine est quasi impossible : contrôle à l'export (gallium/germanium 2023) : la leçon géopolitique : dans une chaîne de valeur, le maillon rare (ici le RAFFINAGE) est celui qui donne le pouvoir, pas la mine.</div>"},
{"t": "Les ressources et la transition énergétique (HGGSP)", "q": "L'OPEP est :", "c": ["une agence de l'ONU", "un cartel de pays producteurs qui ajuste la production pour peser sur les prix", "une ONG écologiste", "un bureau d'études"], "a": 1, "e": "Créée en 1960 (Arabie, Iran, Irak, Koweït, Venezuela + extensions) : quotas de production.", "d": "<b>Un cartel producteur</b> ajustant l'offre.<div class='ex-detail'><u>Exemple rédigé</u> : le fonctionnement : en réduisant la production, l'offre se raréfie, les prix montent (2022-2023 : réductions alors que l'Occident cherchait à priver la Russie de revenus) : 1973 : embargo contre l'Occident pro-israélien : prix x4, récession : le contre-pouvoir des producteurs contre les consommateurs : la géopolitique du pétrole est un rapport de force COMMERCIAL permanent, parfois plus efficace que les armes.</div>"},
{"t": "Les ressources et la transition énergétique (HGGSP)", "q": "Le cobalt, essentiel aux batteries, provient majoritairement de :", "c": ["la Chine", "le Canada", "la République démocratique du Congo (~70 %)", "l'Australie"], "a": 2, "e": "RDC : 70 % de la production minière : enjeux éthiques (mines artisanales, enfants) et stratégiques.", "d": "<b>La RDC</b> (~70 %).<div class='ex-detail'><u>Exemple rédigé</u> : le dossier complet : gisements (Kolwezi), mines industrielles (glencore) ET artisanales (20 % : travail des enfants documenté) : les fabricants de voitures électriques auditent leurs chaînes (« cobalt responsable »), les États classent le cobalt « critique » : chaque voiture « propre » embarque une question morale congolaise : en HGGSP, la transition énergétique déplace les ENJEUX (des puits vers les mines) sans les supprimer : nouvelle carte, vieilles questions de pouvoir.</div>"},
{"t": "Les ressources et la transition énergétique (HGGSP)", "q": "Le « triangle du lithium » se trouve :", "c": ["au Tibet", "en Australie", "entre Argentine, Bolivie et Chili", "au Canada"], "a": 2, "e": "Le « Salar » de l'Altiplano : réserves majeures pour batteries : l'or blanc du XXIe siècle.", "d": "<b>Argentine-Bolivie-Chili</b> (Altiplano).<div class='ex-detail'><u>Exemple rédigé</u> : l'enjeu : le lithium se pompe dans les saumures des salars (l'eau s'évapore 12-18 mois) : le Chili (SQM), l'Argentine (Ouvert aux privés) et la Bolivie (monopole d'État, réserve la plus grande, exploitation difficile) suivent des modèles opposés : qui contrôle le lithium contrôlera le coût des batteries : les « OPEC du lithium » sont déjà rêvées : une ressource « verte » qui hérite de toutes les tensions des anciennes.</div>"},
{"t": "Les ressources et la transition énergétique (HGGSP)", "q": "Le traité de l'Indus (1960) entre Inde et Pakistan, pourtant en guerre plusieurs fois :", "c": ["concerne le pétrole", "a été dénoncé", "a toujours été respecté (partage de l'eau malgré les guerres)", "a été signé par la Chine"], "a": 2, "e": "Partage des fleuves Indus/Jhelum/Chenab : respecté même pendant les guerres : la diplomatie de l'eau.", "d": "<b>Toujours respecté</b>, même en guerre.<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe : l'Inde est en amont et POURRAIT fermer le robinet du Pakistan (80 % de son agriculture) : elle ne l'a jamais fait, même en 1965, 1971, 1999 : l'eau est un bien si vital que la riposte serait stratégiquement inacceptable (exception : tensions croissantes récemment) : la HGGSP retient : les ressources partagées peuvent rester coopératives quand le coût du conflit dépasse le gain : l'exception remarquable qui prouve que la guerre de l'eau n'est PAS une fatalité.</div>"},
{"t": "Les ressources et la transition énergétique (HGGSP)", "q": "Les États-Unis, avec 4 % de la population mondiale, ont émis environ :", "c": ["1 %", "25 % des émissions cumulées depuis 1850", "50 %", "4 % du CO₂ historique"], "a": 1, "e": "~25 % du CO₂ cumulé : la base du principe de « responsabilités communes mais différenciées » des COP.", "d": "<b>~25 % des émissions cumulées</b> (UE : ~22 %, Chine : ~13 %).<div class='ex-detail'><u>Exemple rédigé</u> : l'argument des pays du Sud : « vous vous êtes développés en brûlant le carbone, maintenant vous nous interdisez la même trajectoire ? » : la réponse Nord : fonds climat (100 Md $/an promis en 2009, lentement honorés), « pertes et dommages » (COP27) : la justice climatique est une NÉGOCIATION de l'Histoire : en HGGSP, toujours distinguer émissions CUMULÉES (responsabilité) et émissions ACTUELLES (urgence : la Chine est 1re aujourd'hui).</div>"},
{"t": "Les ressources et la transition énergétique (HGGSP)", "q": "Le GNL (gaz naturel liquéfié) permet :", "c": ["d'éviter la fracturation", "de stocker le gaz dans des bouteilles de camping", "de transporter le gaz par navire sans pipeline (–161 °C)", "de le transformer en pétrole"], "a": 2, "e": "Liquéfaction à –161 °C : méthaniers : le gaz devient une commodité mondiale flexibilisée.", "d": "<b>Transport par navire sans pipeline</b> (–161 °C).<div class='ex-detail'><u>Exemple rédigé</u> : la révolution géopolitique : un pipeline est un lien FIXE entre deux États (dépendance à vie) : un méthanier va VERS le plus offrant (spot market) : 2022 : l'Europe reroute son approvisionnement (GNL américain, qatari) : la Russie perd son levier : le GNL a fait au gaz ce que le conteneur a fait aux marchandises : mondialiser le flux : les infrastructures (terminaux) prennent 5 ans à construire : la géopolitique avance au rythme des bétonneuses.</div>"},
{"t": "Les ressources et la transition énergétique (HGGSP)", "q": "Le « fonds pertes et dommages » créé à la COP27 (2022) vise à :", "c": ["punir la Chine", "taxer le pétrole russe", "assurer les pétroliers", "financer les dégâts subis par les pays vulnérables (transfert Nord-Sud)"], "a": 3, "e": "Indemniser les dommages CLIMATIQUES (submersion, sécheresse) des pays pauvres émetteurs mineurs.", "d": "<b>Indemniser les pays vulnérables</b> (transfert Nord-Sud).<div class='ex-detail'><u>Exemple rédigé</u> : la rupture : les pays du Sud demandaient depuis 30 ans une réparation des DOMMAGES (différente de l'ADAPTATION : le mal déjà fait) : la COP27 (Charm el-Cheikh) acte le « fonds » : les questions (qui paie ? combien ? la Chine contributrice ?) restent ouvertes : le sujet est passé du « réduire les émissions » à la « dette climatique » : le climat devient un dossier de JUSTICE mondiale autant que de physique : un changement de nature des COP.</div>"},
{"t": "Les ressources et la transition énergétique (HGGSP)", "q": "Le premier choc pétrolier (1973) a été déclenché par :", "c": ["une crise bancaire", "la chute de l'URSS", "l'embargo des pays arabes lors de la guerre du Kippour", "un accident nucléaire"], "a": 2, "e": "Embargo + quadruplement des prix : récession occidentale : naissance du G7 et de l'Agence internationale de l'énergie.", "d": "<b>L'embargo de 1973</b> (guerre du Kippour).<div class='ex-detail'><u>Exemple rédigé</u> : la chronologie : octobre 1973 : Égypte-Syrie attaquent Israël (Kippour) : l'OPEP arabe réduit l'offre et embargue les soutiens d'Israël : le baril passe de ~3 à ~12 $ : croissance occidentale stoppée (1974-75) : LES conséquences géopolitiques : création du G7 (1975), de l'AIE, course au nucléaire, et un basculement : le Sud producteur goûte au pouvoir des ressources : le pétrole devient le premier acteur géopolitique de la deuxième moitié du XXe siècle.</div>"},
{"t": "Faire la guerre, faire la paix (HGGSP)", "q": "Les Casques bleus de l'ONU opèrent :", "c": ["comme une armée d'invasion", "avec le consentement des parties, en impartialité, force armée seulement en légitime défense", "sans consentement des parties", "depuis 1945 sans interruption"], "a": 1, "e": "Principes du maintien de la paix : consentement, impartialité, non-offensive.", "d": "<b>Consentement + impartialité + légitime défense</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la doctrine (Brahimi, Capstone) : les Casques bleus protègent (civils, convois), surveillent (cessez-le-feu), mais n'attaquent PAS (sauf légitime défense ou mandat robuste) : c'est ce qui les distingue d'une force d'imposition (chapitre VII, ex. Corée 1950) : l'efficacité est discutée (Srebrenica 1995 : enclave « protégée » tombe, 8000 morts : le Rwanda la même année) mais 11 missions actives restent le principal instrument de stabilisation : la paix se « maintient » plus qu'elle ne se « fait ».</div>"},
{"t": "Faire la guerre, faire la paix (HGGSP)", "q": "La « guerre hybride » (Crimée 2014) combine :", "c": ["des chars uniquement", "des mercenaires uniquement", "l'ONU", "des moyens militaires classiques + cyber + informationnels + irréguliers sans déclaration"], "a": 3, "e": "« Petits hommes verts » + cyberattaques + propagande : la guerre sous le seuil de l'article 51.", "d": "<b>Militaire + cyber + info + irrégulier, sans déclaration</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario de 2014 : soldats sans insignes prennent la Crimée, brouillage des médias, référendum expédié : Moscou nie toute implication (« ce sont des unités d'autodéfense locales ») : l'objectif : obtenir un fait accompli SANS déclencher l'Article 51 de l'ONU (légitime défense armée) ni l'article 5 de l'OTAN (riposte collective) : la stratégie du « plausible deniability » : la guerre sous le seuil : réponse occidentale : sanctions, aide militaire « létale »... à partir de 2022, la façade hybride tombe : l'invasion classique remplace la zone grise.</div>"},
{"t": "Faire la guerre, faire la paix (HGGSP)", "q": "La CPI (Cour pénale internationale) :", "c": ["juge les États", "juge des individus pour crimes les plus graves (génocide, crimes de guerre), depuis 2002", "peut contraindre les grandes puissances", "a été créée en 1945"], "a": 1, "e": "Tribunal des individus (statut de Rome 1998, en vigueur 2002) : limites : USA, Russie, Chine non parties.", "d": "<b>Juge des individus, depuis 2002</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le principe : compléter les juridictions nationales (complémentarité) : génocide, crimes contre l'humanité, guerre, agression : limites structurelles : 1) pas de rétroactivité, 2) les grandes puissances hors du tribunal (USA « dé-signés », Russie et Chine non ratifiées : l'OTAN s'est fait juger ? non), 3) mandat d'arrêt contre Poutine (2023) exécutoire nulle part où il est protégé : la justice internationale progresse (Milosevic, Taylor, témoignages) mais reste un droit ASYMÉTRIQUE : en HGGSP, la justice sans police n'est qu'un agenda.</div>"},
{"t": "Faire la guerre, faire la paix (HGGSP)", "q": "L'accord de paix colombo-FARC (2016) repose notamment sur :", "c": ["une justice transitionnelle (aveux complets contre peines alternatives)", "une amnistie générale", "l'oubli total", "la victoire militaire"], "a": 0, "e": "Système intégral de vérité : ni amnistie ni châtiment maximal : réinsertion politique (10 sièges garantis).", "d": "<b>La justice transitionnelle</b> (aveux contre peines alternatives).<div class='ex-detail'><u>Exemple rédigé</u> : l'équilibre : les coupables confessent publiquement (vérité des victimes) : sanctions restrictives (travaux, restrictions de liberté) au lieu de prison : 13 000 combattants désarmés, parti politique : le pari : la paix durable exige ni impunité totale (victimes révoltées) ni vengeance (guerre reprise) : les limites apparaissent vite : assassinats de chefs sociaux, dissidences armées, narcotrafic intact : la leçon HGGSP : un accord OUvre un processus, il ne le garantit pas : les institutions doivent le porter des décennies.</div>"},
{"t": "Faire la guerre, faire la paix (HGGSP)", "q": "Le veto au Conseil de sécurité de l'ONU appartient :", "c": ["au secrétaire général", "aux 5 membres permanents (USA, Russie, Chine, France, Royaume-Uni)", "à l'Assemblée générale", "aux 15 membres"], "a": 1, "e": "P5 : les vainqueurs de 1945 : chaque veto bloque toute résolution contraignante.", "d": "<b>Aux 5 membres permanents</b> (P5).<div class='ex-detail'><u>Exemple rédigé</u> : le blocage en action : Syrie : ~17 vetos russos-chinois bloquent des résolutions sur Damas : Ukraine : veto russe systématique : Israël-Palestine : veto américain protecteur : l'ONU est paralysée chaque fois qu'un intérêt vital du P5 est engagé : paradoxe assumé en 1945 (Yalta) : sans le veto, les grandes puissances n'auraient JAMAIS adhéré : l'organisation mondiale doit au grand État son existence ET son impuissance : la réforme (élargir le P5 ? limiter le veto ?) est bloquée... par le veto.</div>"},
{"t": "Faire la guerre, faire la paix (HGGSP)", "q": "La « responsabilité de protéger » (R2P, 2005) a été invoquée :", "c": ["jamais", "en Libye en 2011 (résolution 1973)", "en Irak en 2003", "pour annuler le TNP"], "a": 1, "e": "Libye : zone d'exclusion aérienne au nom de la protection des civils : dérive vers changement de régime.", "d": "<b>En Libye (2011)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la généalogie : après le Rwanda et Srebrenica (« plus jamais ça »), l'ONU adopte la R2P (sommet 2005) : si un État ne protège pas sa population, la communauté DE LA protéger (via le Conseil) : 2011 : la Libye en est le test : le mandat « protéger Benghazi » sert de couvert à la campagne de l'OTAN jusqu'à la chute de Kadhafi : les abstentionnistes (BRIC) se sentent trahis : la Syrie ensuite est bloquée par les vetos : la R2P est discréditée par son SEUL usage : l'instrument juridique le plus moderne de la paix meurt de son application : c'est LE cas d'école du chapitre.</div>"},
{"t": "Faire la guerre, faire la paix (HGGSP)", "q": "La guerre Russie-Ukraine (2022) a montré :", "c": ["la paix nucléaire garantie", "la fin des drones", "l'inutilité des alliances", "le retour de la guerre conventionnelle entre États, combinée aux drones, au cyber et à l'information"], "a": 3, "e": "Artillerie + tranchées + drones + sanctions + guerre de l'information : multi-domaines.", "d": "<b>Le retour de la guerre interétatique multi-domaines</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'inventaire : ancien (front figé, sièges, artillerie : des centaines de milliers d'obus/mois) : nouveau (drones FPV kamikazes à 400 € détruisant des chars à 4 M € : guerre asymétrique de l'information : appels, élections de la mémoire, sanctions : gel des avoirs, plafonnement du prix du pétrole) : géopolitique : candidature de l'UE par Kyiv, élargissement OTAN (Finlande, Suède) : la guerre « hybride » de 2014 est devenue totale SANS être mondiale : la dissuasion nucléaire CONTIENT le conflit sans l'empêcher : la nuance est un plan de dissertation complète.</div>"},
{"t": "Faire la guerre, faire la paix (HGGSP)", "q": "La résolution 377V « Union pour le maintien de la paix » (1950) permet :", "c": ["d'annuler les traités", "de supprimer le veto", "de créer une armée de l'ONU", "à l'Assemblée générale de recommander des actions collectives si le Conseil est bloqué"], "a": 3, "e": "« Resolution Uniting for Peace » : contournement du veto ( Corée 1950, utilisée pour l'Ukraine 2022).", "d": "<b>Contourner le veto par l'Assemblée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : si le Conseil manque d'unanimité sur une menace à la paix, l'Assemblée peut se saisir en session extraordinaire et recommander (Corée 1950 : pendant le boycott soviétique : le texte est né) : usages : Suez 1956, Palestine, Ukraine (2022 : condamnation de l'invasion à 141 voix) : MAIS : les recommandations ne sont pas contraignantes : l'arme est symbolique (légitimité, isolement diplomatique du coupable) : en HGGSP, la force de l'ONU sans le Conseil est la FORCE DU DROIT, pas la force des armes.</div>"},
{"t": "Faire la guerre, faire la paix (HGGSP)", "q": "Le Nobel de la paix 2016 a été attribué :", "c": ["à Poutine", "au président colombien Juan Manuel Santos (accord avec les FARC)", "à l'OTAN", "à l'ONU"], "a": 1, "e": "Santos récompensé pour l'accord de paix, référendum perdu quelques jours plus tôt.", "d": "<b>Juan Manuel Santos</b> (Colombie).<div class='ex-detail'><u>Exemple rédigé</u> : le contexte dramatique : le 2 octobre 2016, les Colombiens rejettent l'accord par référendum (50,2 % non) : le 7 octobre, le Nobel consacre Santos « pour sa résolution à poursuivre la paix » : l'accord révisé passe au Congrès : la leçon HGGSP : la paix signée par les élites doit être ACCEPTÉE par les peuples (d'où les référendums : risk : la Colombie comme l'Irlande du Nord 1998 (accord du Vendredi saint) : chaque cas enseigne le même point : la paix est un fait politique ET social, et le Nobel lui-même est un instrument diplomatique (pression, consécration).</div>"},
{"t": "Faire la guerre, faire la paix (HGGSP)", "q": "La « dissuasion nucléaire » repose sur :", "c": ["la certitude de représailles inacceptables (destruction assurée) qui rend l'attaque irrationnelle", "la supériorité conventionnelle", "les traités de commerce", "l'interdiction totale"], "a": 0, "e": "Équilibre de la terreur : frapper second suffit : d'où triade, survie des moyens, communications.", "d": "<b>La certitude de représailles inacceptables</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la logique : même attaqué « en premier », l'adversaire garde de quoi détruire l'agresseur (seconde frappe : sous-marins indétectables) : donc attaquer = suicide mutuel : la stabilité par la peur (paradoxe de la paix nucléaire : 1947-1991 : pas de guerre directe USA-URSS) : applications actuelles : la Russie brandit l'arme nucléaire pour dissuader l'Occident d'intervenir directement en Ukraine (le « parapluie » couvre l'agression) : la dissuasion protège qui la possède, pas qui l'arme protège : c'est exactement la nuance débattue en HGGSP.</div>"},
{"t": "La puissance : les États-Unis et la Chine (HGGSP)", "q": "Le « soft power » (Joseph Nye) désigne :", "c": ["le veto", "la puissance militaire", "la puissance économique", "la capacité à séduire et convaincre (culture, valeurs, modèle)"], "a": 3, "e": "Séduire plutôt que contraindre : cinéma, universités, langue, attractivité.", "d": "<b>Convaincre et séduire</b>, sans contrainte.<div class='ex-detail'><u>Exemple rédigé</u> : les instruments : Hollywood et Netflix (des récits que le monde regarde), Harvard et les Fulbright (les élites se forment aux USA), la langue anglaise, les marques : quand un manifestant chinois brandit la statue de la Liberté, c'est le soft power à l'œuvre : la Chine répond (Confucius Institutes, TikTok, « nouvelle route de la soie » généreuse) : en HGGSP, mesurer la puissance SANS le soft power, c'est rater la moitié du tableau : l'URSS avait le hard power et a perdu la guerre des idées.</div>"},
{"t": "La puissance : les États-Unis et la Chine (HGGSP)", "q": "Le dollar représente environ :", "c": ["25 %", "60 % des réserves mondiales", "10 % des réserves mondiales", "90 %"], "a": 1, "e": "~60 % des réserves de change mondiales : le yuan ~2 % : le cœur du privilège américain.", "d": "<b>~60 % des réserves mondiales</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le privilège en chaîne : les banques centrales stockent en $, le pétrole se facture en $, les emprunts souverains se libellent en $ : donc le monde doit détenir des dollars ⟹ les USA émettent sans limite de change et sanctionnent par le canal financier (SWIFT, avoirs) : c'est « l'Exorbitant privilège » (Giscard d'Estaing, 1965) : encore intact malgré les brics : mesurer la puissance monétaire est indissociable de la géopolitique des sanctions.</div>"},
{"t": "La puissance : les États-Unis et la Chine (HGGSP)", "q": "La Chine est devenue la 2e économie mondiale en :", "c": ["2001", "2020", "1990", "2010"], "a": 3, "e": "2010 (dépassement du Japon) : n°1 en parité de pouvoir depuis ~2016.", "d": "<b>2010</b> (Pib nominal, devant le Japon).<div class='ex-detail'><u>Exemple rédigé</u> : la trajectoire : 1978 : réformes de Deng Xiaoping (économie de marché « socialiste ») : 2001 : adhésion à l'OMC (l'usine du monde) : 2010 : n°2 : ~2016 : n°1 en PPA : 2049 : objectif de « puissance socialiste moderne » pour le centenaire de la RPC : la montée la plus rapide de l'Histoire (800 M sortis de la pauvreté) : mais le ralentissement (2022-24 : immobilier, démographie, défiance des investisseurs) rappelle qu'aucune trajectoire n'est écrite : en HGGSP, citer les DATES clés structure la copie.</div>"},
{"t": "La puissance : les États-Unis et la Chine (HGGSP)", "q": "Les « nouvelles routes de la soie » (BRI, 2013) consistent à :", "c": ["construire une muraille", "interdire le commerce", "vendre de la soie", "financer infrastructures et ports dans 150+ pays (influence par les prêts)"], "a": 3, "e": "Ports, rails, pipelines, prêts : étendre l'influence chinoise par l'infrastructure.", "d": "<b>Infrastructures + prêts dans 150+ pays</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la méthode : la Chine finance (prêts de la Banque chinoise de développement, entreprises chinoises, ouvriers chinois) le port du Pirée (Grèce : devenue la porte de l'Europe), Hambantota (Sri Lanka : bail 99 ans faute de remboursement), rails Nairobi-Mombasa : le débat : « piège de la dette » ou offre de développement que la Banque mondiale ne fait plus ? : les deux se discutent avec des CAS précis : la BRI est l'outil de projection le plus original du XXIe siècle : la puissance par les chantiers plutôt que par les bases.</div>"},
{"t": "La puissance : les États-Unis et la Chine (HGGSP)", "q": "Taïwan est stratégique notamment car :", "c": ["TSMC y produit ~90 % des puces les plus avancées au monde", "il y a du pétrole", "l'ONU y siège", "c'est une île touristique"], "a": 0, "e": "Le fondeur taïwanais domine les puces < 7 nm : le monde électronique dépend de l'île.", "d": "<b>TSMC : ~90 % des puces les plus avancées</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le « bouclier du silicium » : une invasion interromprait la production mondiale d'iPhone, de voitures, d'armes « intelligentes » : l'île est le goulot SINGULIER de la chaîne tech (avec les Pays-Bas d'ASML pour les machines) : ajouter l'histoire (1949, « une seule Chine ») et l'ambiguïté stratégique américaine : Taïwan est le dossier où se concentrent tous les attributs du chapitre : puissance technologique, lignes rouges, dissuasion, chaînes de valeur : LE sujet de dissertation le plus complet.</div>"},
{"t": "La puissance : les États-Unis et la Chine (HGGSP)", "q": "Les dépenses militaires mondiales sont dominées par :", "c": ["la Russie", "la Chine", "les États-Unis (~37 % du total mondial)", "la France"], "a": 2, "e": "USA ~900 Md $/an (37 %) : Chine n°2 (~300 Md) : Russie n°3 : France dans le top 10.", "d": "<b>Les États-Unis</b> (~37 % du total).<div class='ex-detail'><u>Exemple rédigé</u> : la lecture géopolitique : plus que le montant, la STRUCTURE : les USA dépensent pour la projection mondiale (11 porte-avions, ~750 bases, alliés intégrés) : la Chine dépense pour son voisinage (Taïwan, mer de Chine) et la modernisation : la Russie dépense peu mais se bat (Ukraine) et mise sur le nucléaire : l'OTAN cumule ~55 % du total mondial : la puissance militaire se mesure en capacités (projection, logistique, tech), pas seulement en milliards.</div>"},
{"t": "La puissance : les États-Unis et la Chine (HGGSP)", "q": "L'« ambiguïté stratégique » américaine sur Taïwan signifie :", "c": ["ne pas dire si les USA défendraient Taïwan, pour décourager l'attaque ET l'indépendance", "un traité signé", "l'abandon de Taïwan", "une garantie d'intervention"], "a": 0, "e": "Le flou dissuade les deux camps : ni encourage l'un ni rassure l'autre : politique inchangée depuis 1979.", "d": "<b>Le flou délibéré</b> sur l'intervention.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique dissuasive : si les USA garantissaient la défense : Taïwan proclamerait l'indépendance (provocation de Pékin) : s'ils garantissaient l'abandon : Pékin attaquerait sans risque : le flou maintient le statu quo : Biden a plusieurs fois glissé vers la garantie (« oui, engagement ») avant que la Maison Blanche ne recadre : les ventes d'armes continuent : en HGGSP, c'est l'exemple parfait d'une POLITIQUE D'INCERTITUDE comme instrument de stabilité... précaire.</div>"},
{"t": "La puissance : les États-Unis et la Chine (HGGSP)", "q": "L'adhésion de la Chine à l'OMC (2001) a eu pour effet :", "c": ["la chute de la Chine", "aucun effet", "l'essor de l'usine du monde et l'insertion dans la mondialisation", "la fermeture des marchés"], "a": 2, "e": "Accès aux marchés mondiaux : croissance à deux chiffres : l'arbitrage du travail mondial se déplace.", "d": "<b>L'essor de « l'usine du monde »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne : OMC ⟹ investissements étrangers ⟹ exportations ⟹ croissance ⟹ pouvoir d'achat ⟹ marché intérieur ⟹ entreprises mondiales (Huawei, BYD) : les Occidentaux espéraient aussi une démocratisation (théorie de la convergence) : elle n'est pas venue (Xi : durcissement) : le cas illustre le débat « commerce ET démocratie ? » : l'interdépendance économique n'entraîne PAS mécaniquement la convergence politique : c'est l'un des plus grands « ratés » stratégiques des analyses post-2001.</div>"},
{"t": "La puissance : les États-Unis et la Chine (HGGSP)", "q": "En parité de pouvoir d'achat (PPA), la Chine est :", "c": ["n°10", "derrière la France", "n°3", "n°1 mondiale depuis ~2016"], "a": 3, "e": "Le PIB en PPA dépasse les USA depuis ~2016 : le nominal les rattraperait vers 2030-2040 (incertain).", "d": "<b>N°1 mondiale en PPA</b> (depuis ~2016).<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi deux classements : le nominal compare au taux de change (distorsions) : la PPA compare le pouvoir d'achat réel (ce qu'un yuan achète EN Chine) : la PPA corrige le « sous-prix » chinois : donc PPA : Chine n°1 : nominal : USA n°1 : en dissertation, TOUJOURS préciser l'indicateur : « la Chine est la première économie mondiale » est faux en nominal, vrai en PPA : la précision methodologique EST la compétence attendue.</div>"},
{"t": "La puissance : les États-Unis et la Chine (HGGSP)", "q": "La « transition de puissance » USA-Chine est historiquement dangereuse car :", "c": ["les États ne changent jamais", "une puissance montante défie une puissance installée (Thucydide : piège associé à Graham Allison)", "c'est impossible", "l'ONU l'interdit"], "a": 1, "e": "16 transitions sur 16 étudiées, 12 ont débouché sur la guerre (Allison) : mais USA-GB (XXe) fut pacifique.", "d": "<b>Le « piège de Thucydide »</b> (Graham Allison).<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement : Athènes montante vs Sparte installée : la guerre du Péloponnèse (Allison : sur 16 cas similaires, 12 guerres) : MAIS l'exception : les USA succèdent à la Grande-Bretagne pacifiquement (culture, alliances, intérêts partagés) : la question HGGSP : la Chine et les USA sont-ils Athènes/Sparte ou USA/GB ? : les arguments pour chaque thèse (interdépendance économique actuelle ? nucléaire ? Taïwan comme Sarajevo ?) font une copie complète : le concept sert à PENSER le risque, pas à prédire la guerre.</div>"},
{"t": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)", "q": "La définition du terrorisme met l'accent sur :", "c": ["la violence contre des civils visant un effet politique par la terreur", "la victoire militaire", "le nombre de soldats", "l'occupation"], "a": 0, "e": "La cible visée n'est pas l'objectif : le public terrifié est le vrai « terrain ».", "d": "<b>Violence contre civils ⟹ effet politique par la terreur</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la logique théâtrale : un attentat ne gagne pas de terrain, il tue peu comparé à une guerre, mais il 1) fabrique la peur (chacun se sent cible), 2) force la réponse (qui peut être excessive et servir le terroriste : « l'ennemi se révèle »), 3) occupe les médias (publicité gratuite d'une cause) : Daech 2014-16 : attentats en Europe pour casser le soutien à l'intervention, recruter par la propagande (3 000 Européens partis) : la HGGSP analyse le terrorisme comme une STRATÉGIE du faible, pas une pathologie irrationnelle.</div>"},
{"t": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)", "q": "Stuxnet (2010) est :", "c": ["un virus de la grippe", "une sonde spatiale", "un réseau social", "un ver informatique qui a saboté physiquement des centrifugeuses iraniennes"], "a": 3, "e": "Première arme logicielle à détruire des installations physiques : le cyber entre en guerre.", "d": "<b>Sabotage physique par ver informatique</b> (Natanz, Iran).<div class='ex-detail'><u>Exemple rédigé</u> : la prouesse : le ver traverse les « discontinuités » par clé USB, reconnaît SA cible (contrôleurs Siemens des centrifugeuses), les fait dévier en affichant des valeurs NORMALES : les ingénieurs cherchent la panne mécanique pendant des années : ~1000 machines détruites, le programme nucléaire iranien retardé : la leçon HGGSP : le cyber n'est plus de l'espionnage : c'est une ARME de destruction (stratégique), aux effets réversibles ou non, sans tir ni retombées : le droit de la guerre (Genève) n'a PAS encore attrapé cette grammaire.</div>"},
{"t": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)", "q": "NotPetya (2017) a montré que :", "c": ["les rançongiciels sont inoffensifs", "une cyberattaque « locale » (Ukraine) peut causer des dégâts mondiaux (~10 Md $)", "l'OTAN riposte par des missiles", "les virus restent locaux"], "a": 1, "e": "Conçu contre l'Ukraine (logiciel fiscal M.E.Doc), il se propage par update et frappe Maersk, Merck... monde : 10 Md $.", "d": "<b>Les dégâts collatéraux mondiaux du cyber</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario : attaque russe visant des entreprises ukrainiennes via un logiciel comptable contaminé : la contagion (partage de fichiers, update) traverse Maersk (maritime mondial : terminaux arrêtés), Merck (pharma), la SNCF allemande... : 10 Md $ de dégâts en quelques jours, la « panne » la plus chère de l'Histoire (hors armes) : la leçon HGGSP : l'interconnexion fait qu'une attaque ciblée devient une ARME de destruction massive ÉCONOMIQUE : il n'existe plus de conflit « local » au sens propre.</div>"},
{"t": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)", "q": "Le principal problème juridique du cyberconflit est :", "c": ["le manque de virus", "l'attribution difficile (qui a attaqué ?)", "le coût", "l'absence de cibles"], "a": 1, "e": "Sans attribution solide, pas de riposte légitime : d'où le rôle des services et de l'« attribution publique » collective.", "d": "<b>L'attribution</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne du dilemme : une attaque part de serveurs « relais » (pays tiers, machines zombie) : la preuve est technique (code, horodatage, fautes d'orthographe d'un clavier !) mais un État exige des preuves PUBLICABLES avant de riposter (légitime défense article 51 ?) : solutions émergentes : attribution collective (l'UE désigne publiquement, les « Five Eyes » coordonnent), doctrine de la « riposte en dessous du seuil » : le droit international (Charte de 1945) n'a pas été écrit pour les armes logicielles : le cyber est le champ où le droit a LE PLUS de retard sur la pratique.</div>"},
{"t": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)", "q": "Une « infox » (fake news) se distingue d'une erreur par :", "c": ["sa longueur", "sa source officielle", "sa date", "son caractère délibéré et organisé de désinformation"], "a": 3, "e": "L'intention de tromper : la désinformation est une ARME, pas un accident.", "d": "<b>La délibération organisée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le triptyque du chercheur Wardle : disinformation (fausse, délibérée), misinformation (fausse, non intentionnelle), malinformation (vraie, sortie de contexte pour nuire) : l'usine à infox est un SYSTÈME : comptes automatisés, influenceurs, médias relais (RT, Sputnik : interdits en UE), amplification algorithmique (l'émotion voyage plus vite que la vérification) : la réponse (fact-checking, éducation aux médias, régulation DSA européenne) doit être systémique : une « infox » isolée est une rumeur : un écosystème d'infox est une machine de guerre informationnelle.</div>"},
{"t": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)", "q": "Le 11 septembre 2001 a entraîné entre autres :", "c": ["l'invocation unique de l'article 5 de l'OTAN et une « guerre contre le terrorisme » (Afghanistan, Irak)", "un traité de paix", "la fin de la CIA", "la dissolution de l'OTAN"], "a": 0, "e": "Article 5 invoqué une seule fois (12 sept. 2001) : interventions en Afghanistan (2001) puis Irak (2003, sans l'ONU).", "d": "<b>Article 5 + guerre contre le terrorisme</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la révolution du concept : l'OTAN (défense COLLECTIVE contre un État) déclare l'attaque d'un RÉSEAU non étatique comme casus foederis : s'ensuit un cadre de guerre SANS limites (pas de front, pas d'armistice possible, ennemi délocalisé) : Patriot Act (surveillance), Guantanamo (zone grise juridique), assassinats ciblés par drones (doctrine) : 20 ans après : retrait d'Afghanistan (2021 : talibans revenus) : la HGGSP doit évaluer : l'hyper-puissance a-t-elle gagné ? la réponse (non, coûts immenses, droits fragilisés, Middle-East destabilisé) illustre les LIMITES de la force contre la conflictualité nouvelle.</div>"},
{"t": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)", "q": "Daech (2014-2019) a innové en :", "c": ["construisant un « proto-État » (territoire, fiscalité, propagande) et une stratégie d'attentats de masse", "respectant les règles de la guerre", "refusant Internet", "signant des traités"], "a": 0, "e": "Un territoire (Syrie-Irak : ~8 M de personnes sous sa coupe), une administration, une propagande de recrutement mondiale, des attentats (Paris 2015, Nice 2016).", "d": "<b>Proto-État + propagande + attentats de masse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la triple dimension : 1) TERRITORIALE : un « califat » administré (fiscalité, polices, manuels) : première fois qu'un groupe terroriste TENAIT un territoire de la taille d'un pays : 2) NUMÉRIQUE : production vidéo professionnelle (incendies d'exécutions filmés), recrutement par réseaux, 30 000 combattants étrangers : 3) STRATÉGIQUE : la défaite militaire (Raqqa 2017, Baghouz 2019) n'a pas tué l'idéologie (attentats « loups solitaires » revendiqués par des branches) : le cas montre que la réponse à la conflictualité nouvelle doit être militaire ET informationnelle ET sociale (prévention, déradicalisation) : une seule dimension ne suffit jamais.</div>"},
{"t": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)", "q": "La riposte française aux cyberattaques est décrite comme :", "c": ["impossible", "exclusive au domaine militaire", "une « riposte en capacité » (cyberdéfense et options de représailles, doctrine assumée)", "l'abandon du cyber"], "a": 2, "e": "France : « riposte de droit » et capacités offensives assumées (LPM), ANSSI en protection des infrastructures critiques.", "d": "<b>« Riposte en capacité »</b> (doctrine assumée).<div class='ex-detail'><u>Exemple rédigé</u> : l'architecture française : l'ANSSI (agence) protège les « opérateurs d'importance vitale » (électricité, hôpitaux, défense : 200 interventions majeures/an), le COMCYBER militaire opère la défense des systèmes d'armes, et la doctrine officielle reconnaît la « riposte » (jusqu'aux « effets en profondeur ») sous autorité politique : l'important pour la copie : la France articule défense (protéger), dissuasion (afficher des capacités) et droit (riposter proportionnellement) : la cyberdéfense est une politique PUBLIQUE, pas une technique d'ingénieurs isolée.</div>"},
{"t": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)", "q": "Les « deepfakes » inquiètent la géopolitique car :", "c": ["ils sont amusants", "ils permettent de faire dire n'importe quoi à n'importe qui ( vidéos/voix synthétiques), brisant la preuve audiovisuelle", "ils coûtent cher", "ils sont interdits partout"], "a": 1, "e": "La « preuve par l'image » s'effondre : n'importe quel dirigeant peut « dire » n'importe quoi : le doute est une arme.", "d": "<b>Ils brisent la preuve audiovisuelle</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario redouté (répété dans les exercices de crise) : un deepfake d'un chef d'État annonçant une mobilisation quelques heures avant une vraie crise : les bourses, les populations et même les états-majors réagissent avant la correction : le « lier de la démocratie » (la preuve partagée) devient une cible : les réponses : filigranes cryptographiques (C2PA), détection (forensique), éducation (« la vidéo n'est plus une preuve ») : la HGGSP y voit la convergence des deux conflictualités : TECHNIQUE (le faux) et INFORMATIONNELLE (le doute) : l'arme du mensonge parfait, encore jamais utilisée à grande échelle — pour l'instant.</div>"},
{"t": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)", "q": "La « guerre de l'information » ukrainienne (2022) a notamment consisté pour Kyiv à :", "c": ["cacher la guerre", "attaquer les médias", "interdire Internet", "communiquer en continu (Zelensky, open-source, géolocalisation) pour mobiliser le soutien occidental"], "a": 3, "e": "Communication présidentielle quotidienne + journalisme open-source (Bellingcat) + images de drones : le récit comme front.", "d": "<b>Communiquer en continu pour mobiliser</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les techniques : le selfie « je suis à Kyiv » (contre la rumeur de fuite), les adresses vidéo au Congrès britannique/américain/japonais (chaque parlement, un discours adapté : Churchill, Martin Luther King..., la diffusion des frappes de drones en VIDEO (Bayraktar, hymne de la résistance) : résultat : sanctions, armes, candidature UE : la communication n'a pas gagné la guerre, mais elle a TENU l'alliance : c'est la démonstration que dans une guerre totale moderne, le récit est une LIGNE DE FRONT : en HGGSP, une « guerre de l'information » réussie se mesure à ce qu'elle OBTIENT (ici : l'aide occidentale), pas au nombre de vues.</div>"},
{"t": "L'ONU et la gouvernance mondiale (HGGSP)", "q": "Le Conseil de sécurité compte :", "c": ["193 membres", "15 membres dont 5 permanents avec droit de veto", "5 membres", "10 membres"], "a": 1, "e": "P5 (USA, Russie, Chine, France, RU) + 10 élus pour 2 ans : résolutions contraignantes.", "d": "<b>15 membres, 5 permanents au veto</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : 9 voix sur 15 pour adopter, MAIS chaque veto d'un P5 bloque tout (et l'abstention ne compte pas comme veto, cf. Corée 1950, abstention soviétique) : les 10 élus tournent (la France plaide l'Allemagne, l'Inde, le Brésil...) : le paradoxe fondateur à répéter en dissertation : l'organe le plus puissant est aussi le plus paralysé, parce que les vainqueurs de 1945 ont voulu garder les rênes : la réforme (limiter le veto en cas d'atrocités : initiative franco-mexicaine) se heurte... au veto.</div>"},
{"t": "L'ONU et la gouvernance mondiale (HGGSP)", "q": "Une résolution de l'Assemblée générale est :", "c": ["déclarative (recommandation : sa force est la légitimité du nombre)", "contraignante", "exécutoire par la force", "un traité"], "a": 0, "e": "Elle recommande : seule la contrainte (chap. VII du Conseil) oblige : l'Assemblée pèse par le vote (141 voix contre l'invasion de l'Ukraine).", "d": "<b>Déclarative</b> : recommandation politique.<div class='ex-detail'><u>Exemple rédigé</u> : l'usage correct : mars 2022, le Conseil est paralysé (veto russe) : l'Assemblée, saisie via la résolution 377V (« Union pour le maintien de la paix »), condamne l'invasion à 141 voix pour, 5 contre, 35 abstentions : la résolution ne déplace pas un char, mais elle : 1) établit la LÉGALITÉ (qui est l'agresseur), 2) isole diplomatiquement (les abstentionnistes sont nommés), 3) prépare les sanctions bilatérales : en HGGSP, la force de l'Assemblée est symbolique ET réelle (la légitimité est une monnaie géopolitique).</div>"},
{"t": "L'ONU et la gouvernance mondiale (HGGSP)", "q": "Le budget principal de l'ONU (hors agences) est de l'ordre de :", "c": ["300 milliards", "1000 milliards", "50 milliards", "3 milliards de dollars par an"], "a": 3, "e": "~3 Md $ : moins qu'un grand hôpital : l'ONU n'est PAS une super-puissance administrative.", "d": "<b>~3 Md $/an</b> (budget ordinaire).<div class='ex-detail'><u>Exemple rédigé</u> : la mise à l'échelle : 3 Md $ : le budget du NYPD est ~5 Md, celui d'un hôpital parisien ~2 Md : avec les agences (HCR : 10 Md, programmes de développement), le système onusien atteint ~50 Md : toujours moins de 0,05 % du PIB mondial : la leçon HGGSP : l'ONU fait des CHOSES énormes avec des moyens dérisoires (nourrir 100+ M de personnes par an, vacciner la moitié de l'humanité) : « l'ONU ne peut pas tout » est un fait BUDGÉTAIRE autant que politique : ses membres décident de sa puissance.</div>"},
{"t": "L'ONU et la gouvernance mondiale (HGGSP)", "q": "L'organe de règlement des différends de l'OMC est paralysé depuis 2019 car :", "c": ["l'OMC a fermé", "la Chine a un veto", "les USA bloquent la nomination des juges de l'organe d'appel", "il n'existe plus"], "a": 2, "e": "Washington conteste la jurisprudence (antidumping) et refuse les nouveaux juges : le commerce mondial perd son juge d'appel.", "d": "<b>Blocage américain des nominations</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cas d'école de la « gouvernance cassée » : l'organe d'appel (3 juges minimum sur 7) ne peut plus siéger : les différends restent en première instance ou s'éternisent : contournements : l'UE crée un « système d'appel alternatif » (MPIA avec ~50 membres, dont la Chine) : la leçon HGGSP : une institution sans juge n'est plus une institution : la règle devient négociation de force (le rapport de puissance commercial remplace le droit) : quand un grand membre refuse le jeu, toute la gouvernance vacille : le multilatéralisme n'est jamais garanti, il est entretenu.</div>"},
{"t": "L'ONU et la gouvernance mondiale (HGGSP)", "q": "L'OMS pendant le Covid-19 a surtout manqué de :", "c": ["budget technique", "scientifiques", "médicaments", "pouvoir de contrainte sur les États (alerte et normes seulement)"], "a": 3, "e": "Elle alerte, publie des normes, coordonne les recherches — mais les décisions (fermetures, vaccins) sont celles des États souverains.", "d": "<b>Pouvoir de contrainte</b> sur les États.<div class='ex-detail'><u>Exemple rédigé</u> : le contraste : d'un côté, la science mondiale (génome séquencé et publié en janvier 2020, vaccins en < 1 an, plateforme COVAX : 2 Md de doses) : de l'autre, l'urgence internationale déclarée le 30 janvier 2020 n'a été suivie par AUCUNE obligation pour les États (tests, fermetures, quotas vaccinaux : chacun a décidé seul) : les enquêtes sur l'origine (Wuhan) sont restées soumises à la coopération chinoise : le « traité pandémie » (en négociation) tente de donner à l'OMS des leviers (partage des données, production) : la gouvernance mondiale de la santé est UNE négociation permanente entre science et souveraineté.</div>"},
{"t": "L'ONU et la gouvernance mondiale (HGGSP)", "q": "L'accord de Paris (2015) repose sur :", "c": ["un impôt mondial", "des obligations contraignantes avec sanctions", "un gouvernement mondial du climat", "des contributions nationales volontaires (NDC) révisées tous les 5 ans"], "a": 3, "e": "Chaque État fixe son objectif : pas de sanction : la logique de confiance + révision périodique (« ratchet »).", "d": "<b>NDC volontaires, révisées tous les 5 ans</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le pourquoi du design : Kyoto (1997) était contraignant pour les pays riches : les USA ne l'ont jamais ratifié, le Canada s'en est retiré : Paris (2015) choisit l'UNIVERSALITÉ et la souplesse : tous in, chacun fixe son effort : la revue des NDC tous les 5 ans doit créer une pression par pairs (« ratchet up ») : le bilan : les engagements actuels mènent à ~2,5-2,9 °C (insuffisant), mais les énergies renouvelables décollent économiquement : en copie, présenter les DEUX faces (faiblesse juridique / dynamique de normes) est la clé : il n'y a pas de gouvernement du climat, il y a une négociation sans fin.</div>"},
{"t": "L'ONU et la gouvernance mondiale (HGGSP)", "q": "Le G20 a été promu au niveau des chefs d'État :", "c": ["en 1999 seulement (ministres)", "en 2008 (crise financière : coordination des économies majeures)", "en 1945", "jamais"], "a": 1, "e": "Le G20 « ministres » (1999) devient sommet des chefs d'État à Washington en 2008 : la gouvernance s'adapte aux crises.", "d": "<b>2008</b> (crise des subprimes).<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme d'apprentissage : la crise financière menace tout le monde : les dirigeants des 20 premières économies (80 % du PIB mondial) coordonnent (stimulus, régulation bancaire, FMI renforcé : triplement des ressources) : c'est la première gouvernance ÉCONOMIQUE de crise efficace (comparée à 1929) : les limites : ni traité ni secrétariat permanent : les engagements ne sont pas contraignants, et depuis 2014, la géopolitique (Ukraine, tensions USA-Chine) bloque les communiqués communs : le G20 est un « club » : utile en crise, impuissant en conflit : l'exemple parfait de la gouvernance informelle à géométrie variable.</div>"},
{"t": "L'ONU et la gouvernance mondiale (HGGSP)", "q": "Le secrétaire général de l'ONU (António Guterres) :", "c": ["commande les armées", "est élu par les peuples", "dirige l'économie mondiale", "alerte, médiatise et propose, sans pouvoir de décision"], "a": 3, "e": "« Nous vivons... une tempête parfaite de défis interconnectés » : il alerte (climat, Ukraine), propose des sommets, arbitre : sa force est morale et diplomatique.", "d": "<b>Alerte, médiatise, propose</b> — sans commandement.<div class='ex-detail'><u>Exemple rédigé</u> : les instruments réels : les « discours d'alarme » (climat : « code rouge pour l'humanité »), les bons offices (grain deal ukrainien de 2022 : négocié sous l'égide de l'ONU et de la Turquie : 30+ M de tonnes exportées), les sommets convoqués (pandémie, AI, climat) : il est nommé par l'Assemblée SUR désignation du Conseil (donc accepté par les 5) : le SG est le haut-commissaire à l'optimisme contraint : une gouvernance mondiale sans gouvernement a besoin d'un visage et d'une voix : c'est son vrai pouvoir.</div>"},
{"t": "L'ONU et la gouvernance mondiale (HGGSP)", "q": "Les BRICS (élargis en 2024) contestent surtout :", "c": ["la science", "l'Internet", "l'ordre institutionnel « occidental » (veto, dollar, FMI, notation)", "l'éducation"], "a": 2, "e": "Réforme du Conseil de sécurité, alternatives au dollar, Banque des BRICS (NDB), critiques du « droit coutumier occidental ».", "d": "<b>L'ordre institutionnel « occidental »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le programme : 1) politique : réforme du Conseil (l'Inde, le Brésil, l'Afrique du Sud réclament un siège), 2) monétaire : règlements en monnaies locales, nouvelle banque de développement (NDB), 3) narratif : « règle-based order » contre « ordre hégémonique » : les limites : hétérogénéité (Inde-Chine rivales, membres nouveaux très divers : Iran, Égypte, Émirats...) : le bloc n'est PAS une alliance, c'est une réclamation commune : en HGGSP, la montée des BRICS+ est le symptôme à analyser : la gouvernance de 1945 ne représente plus le monde réel : elle se réforme lentement... ou se fragmente.</div>"},
{"t": "L'ONU et la gouvernance mondiale (HGGSP)", "q": "L'ONU a été fondée en :", "c": ["1960", "1989", "1919", "1945 (conférence de San Francisco)"], "a": 3, "e": "Yalta (février 1945) prépare, San Francisco (juin) signe la Charte : succède à la SDN (échec des années 1930).", "d": "<b>1945</b> (San Francisco).<div class='ex-detail'><u>Exemple rédigé</u> : la généalogie : la SDN (1919) échoue (pas d'USA, veto paralysant, impuissance face au Japon, à l'Italie, à l'Allemagne) : 1945 : les Alliés veulent « préserver les générations futures du fléau de la guerre » : la Charte instaure la sécurité COLLECTIVE (chap. VII) : le paradoxe : pour éviter un nouveau cycle, les vainqueurs s'arrogent le veto (Yalta) : l'ONU naît avec sa blessure institutionnelle : 193 membres aujourd'hui (l'universalité que la SDN n'a jamais eue) : la comparaison SDN/ONU est un classique de dissertation : progrès de l'universalité, persistance de la loi du plus fort.</div>"},
{"t": "La propagation des idées et de l'information (HGGSP)", "q": "La Réforme de Luther (1517) illustre :", "c": ["l'absence de propagande avant Internet", "la puissance de l'imprimerie dans la diffusion d'une idée", "un mouvement purement religieux", "l'inefficacité des médias"], "a": 1, "e": "300 000 tracts en 3 ans : la première « viralité » de l'Histoire : une idée locale devenue continentale.", "d": "<b>La puissance de l'imprimerie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : 1517 : les 95 thèses sont imprimées, copiées, traduites : en 3 ans, toute l'Allemagne, en 10, l'Europe : sans presses, la dispute académique de Wittenberg serait restée une querelle de théologiens : la leçon structurelle du chapitre : chaque SAUT technologique de l'information (imprimerie, télégraphe, radio, plateformes) REconfigure la politique (guerres de religion, nationalités, totalitarismes, printemps arabes) : en HGGSP, l'infrastructure de l'info est une variable explicative MAJEURE, pas un détail.</div>"},
{"t": "La propagation des idées et de l'information (HGGSP)", "q": "Le printemps arabe (2011) montre que les réseaux sociaux :", "c": ["font les révolutions à eux seuls", "accélèrent et coordonnent des mobilisations aux causes profondes anciennes", "appartiennent aux États", "sont inutiles politiquement"], "a": 1, "e": "Tunisie/Égypte : coordination, contournement de la censure, effet domino visuel — mais la coupure d'Internet égyptienne n'a pas vidé la rue.", "d": "<b>Accélèrent, ne déclenchent pas</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve par le contre-exemple : le 28 janvier 2011, Moubarak COUPE Internet : la Place Tahrir se remplit PLUS encore (les gens descendent, ils n'ont plus rien à regarder) : les causes : chômage des diplômés, corruption, humiliation (Khaled Saïd), prix alimentaires : les réseaux ont servi à FIXER un rendez-vous et à diffuser les images : la formule d'une copie réussie : « condition accélérante, pas cause efficiente » : et le même outil a servi ensuite aux contre-révolutions (surveillance, propagande) : la technique n'a pas de camp.</div>"},
{"t": "La propagation des idées et de l'information (HGGSP)", "q": "L'« économie de l'attention » signifie :", "c": ["les plateformes optimisent le temps de vision (l'engagement), pas l'exactitude", "l'information est gratuite", "les plateformes vendent la vérité", "les médias publics dominent"], "a": 0, "e": "Le carburant de la viralité est l'émotion (colère en tête) : la recommandation mesure ce qui retient, pas ce qui est vrai.", "d": "<b>Optimiser l'engagement, pas la vérité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne : contenu émotionnel ⟹ plus de partages ⟹ plus de temps de vision ⟹ plus de publicité ⟹ l'algorithme recommande PLUS de ce type : les études internes de Facebook (rendues publiques par un lanceur d'alerte, 2021) montrent que l'algorithme de 2018 « distillait la colère » (les pages haineuses progressaient) : la conséquence géopolitique : les démocraties, qui vivent du débat, reçoivent une diète optimisée pour la division : le « design » des plateformes est un enjeu de GOUVERNEMENT — d'où les régulations (DSA) : l'architecture algorithmique n'est pas neutre, elle oriente le débat public.</div>"},
{"t": "La propagation des idées et de l'information (HGGSP)", "q": "La photo d'Alan Kurdi (2015) a prouvé :", "c": ["que l'ONU interdit les photos", "que les réfugiés n'existent pas", "que les images ne servent à rien", "la puissance d'agenda d'une image virale, aux effets politiques éphémères"], "a": 3, "e": "53 M de vues en 24 h, dons x100, ouverture des frontières : puis l'effet retombe : agenda ≠ politique de fond.", "d": "<b>La puissance d'agenda, l'effet éphémère</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chronologie fine : 2 septembre 2015 : la photo : 3 septembre : 53 M de vues : dons à la Croix-Rouge suédoise x50 en 3 jours : 4-7 septembre : Merkel ouvre, l'Autriche et l'Allemagne accueillent : PUIS : l'agenda tourne (attentats de novembre 2015), l'accord UE-Turquie (2016) ferme la route : la leçon en HGGSP : une image peut ouvrir une « fenêtre d'opportunité » politique (Kingdon), mais les forces structurelles (sécurité, électorats) referment la fenêtre : articuler le moment et la structure = le niveau attendu.</div>"},
