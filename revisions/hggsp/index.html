var PROGRAMME = [{"n": "Terminale — HGGSP", "ch": [{"t": "De nouveaux espaces de conflit ?", "id": "espaces-conflit"}, {"t": "Mers et océans : espaces de convoitises", "id": "mers-oceans"}, {"t": "Démographie, développement et richesse", "id": "demographie-developpement"}, {"t": "Les ressources et la transition énergétique", "id": "ressources-energie"}, {"t": "Faire la guerre, faire la paix", "id": "guerre-paix"}, {"t": "La puissance : les États-Unis et la Chine", "id": "puissance-usa-chine"}, {"t": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information", "id": "nouvelles-conflictualites"}, {"t": "L'ONU et la gouvernance mondiale", "id": "onu-gouvernance"}, {"t": "La propagation des idées et de l'information", "id": "propagation-idees"}, {"t": "L'Afrique : un continent en transformation", "id": "afrique"}]}];
var COURS_META = [
{"id": "espaces-conflit", "theme": "De nouveaux espaces de conflit ? (HGGSP)", "niveau": "Terminale — HGGSP", "titre": "De nouveaux espaces de conflit ?", "cours": "<div class=\"cours-head\"><h2>De nouveaux espaces de conflit ?</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Cartographier le monde : une vision qui engage</h3>\n<div class=\"tip\"><b>Une carte n'est jamais neutre :</b> projection (Mercator gonfle les hautes latitudes : le Groenland paraît immense), découpage, centre choisi, données retenues : la carte est un <b>acte géopolitique</b>.<br><b>Gerrymandering :</b> redécouper les circonscriptions pour gagner : manipuler l'espace, c'est manipuler le pouvoir.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire une carte critique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une carte des « pays en voie de développement » peint l'Afrique en rouge et l'Europe en vert. Quels choix visibles et invisibles orientent la lecture ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'indicateur</b> : « développement » mesuré par quoi ? PIB/hab. (l'Angola pétrolier « riche ») ou IDH (espérance de vie, école) ? Le choix change la carte.</div><div class=\"etu\"><b>Étape 2</b> — <b>La découpe</b> : par États (l'Algérie « rouge » masque les écours entre Alger et le Sud) ou par régions ? Le niveau d'analyse fabrique le message.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le seuil</b> : où placer la limite rouge/vert ? Déplacer le seuil d'un dollar change des millions d'habitants de couleur : en HGGSP, on TOUJOURS interroge : qui a fait cette carte, pour dire quoi ?</div></div></details>\n<h3>2. Frontières : lignes et zones de conflit</h3>\n<div class=\"tip\"><b>Frontière ≠ ligne nette :</b> 46 % des frontières terrestres sont mal définies ou contestées. <b>Types :</b> frontières héritées de la colonisation (couper au cordeau en Afrique : 44 % méridiennes), frontières naturelles contestées (fleuves qui changent de lit), frontières de la paix (RFA-RDA ? non : Allemagne-Pologne après 1945).<br><b>Zones grises :</b> le Kaliningrad, le Cachemire, la Corée du Nord : des espaces figés par l'Histoire.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le Cachemire, conflit emblématique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi le Cachemire est-il resté un espace de conflit depuis 1947 entre l'Inde et le Pakistan ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La faute coloniale</b> : en 1947, la Partition laisse aux États princiers le choix : le maharaja hindou d'un État majoritairement musulman hésite, l'invasion pachtoune le force à choisir l'Inde : le conflit est né d'un départ précipité.</div><div class=\"etu\"><b>Étape 2</b> — <b>Guerres et lignes</b> : trois guerres (1947, 1965, 1999), une « ligne de contrôle » de facto en 1972, mais aucune reconnaissance : deux puissances nucléaires se regardent sur un glacier (Siachen, 6000 m d'altitude : la guerre la plus haute du monde).</div><div class=\"etu\"><b>Étape 3</b> — <b>Lecture HGGSP</b> : le conflit est frontalier ET identitaire (musulmans/hindous) ET hydrique (l'Indus prend sa source au Cachemire) : un même espace concentre plusieurs conflictualités : c'est le concept de l'espace-miroir des complexités.</div></div></details>\n<h3>3. De nouveaux espaces de conflictualité</h3>\n<div class=\"tip\"><b>Le conflit s'est déplacé :</b> espaces traversiers (mers, détroits, cyberspace, espace extra-atmosphérique, Arctique) : des espaces APPARTENANT À PERSONNE devenus décisifs.<br><b>Espaces délaissés :</b> zones grises (Sahel, Somalie) où l'État est absent : de NOUVEAUX acteurs (jihadistes, trafiquants, milices) y prospèrent : le conflit suit le vide étatique.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'Arctique, l'eldorado gelé</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi l'Arctique devient-il un espace de convoitise depuis les années 2000, et selon quelles règles se joue la compétition ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La fonte</b> : le réchauffement ouvre des routes maritimes (passage du Nord-Est : Rotterdam-Yokohama réduit de 40 %) et donne accès à ~13 % du pétrole et 30 % du gaz « non découverts » (estimations USGS).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le cadre</b> : la convention de Montego Bay (1982) fixe des ZEE de 200 milles : le Danemark (via le Groenland), la Russie, le Canada « étendent » leurs plateaux : une compétition JURIDIQUE d'abord, avec dépôts de dossiers scientifiques auprès de l'ONU.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le signal militaire</b> : réinstallation de bases russes ( réactivation de bases soviétiques), exercices de l'OTAN, course aux brise-glaces : l'Arctique montre le NOUVEAU type d'espace de conflit : pas de guerre ouverte, mais un affrontement de DROIT, de SCIENCE et de PRÉSENCE : la conflictualité sans bataille.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> une carte n'est jamais neutre (interroger source, découpe, seuils) ; frontière ≠ ligne : souvent une zone contestée ; l'Arctique n'est pas « sans loi » : Montego Bay structure la compétition ; « nouveaux espaces » ne veut pas dire sans droit : le droit International tente de suivre, souvent en retard.</div>"},
{"id": "mers-oceans", "theme": "Mers et océans : espaces de convoitises (HGGSP)", "niveau": "Terminale — HGGSP", "titre": "Mers et océans : espaces de convoitises", "cours": "<div class=\"cours-head\"><h2>Mers et océans : espaces de convoitises</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La mare nostrum de la mondialisation</h3>\n<div class=\"tip\"><b>90 % du commerce mondial transite par mer</b> : conteneurs, hydrocarbures, câbles sous-marins (99 % de l'Internet intercontinental passe par ~400 câbles sous l'océan).<br><b>Points de passage stratégiques :</b> détroits d'Ormuz (20 % du pétrole mondial), de Malacca, canal de Suez (12 % du commerce), canal de Panama, Bab el-Mandeb : quelques goulets concentrent la circulation mondiale.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — Ormuz, le goulot du pétrole</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi le détroit d'Ormuz est-il le point le plus sensible du commerce mondial ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le goulot</b> : 33 km de large : tout le pétrole du Golfe (Arabie, Irak, Koweït, Émirats, Iran) doit y passer : ~20 millions de barils/jour, un cinquième du pétrole mondial.</div><div class=\"etu\"><b>Étape 2</b> — <b>La menace</b> : l'Iran riverain a menacé de fermer le détroit (torpillage de tankers en 2019, saisie de navires) : chaque incident fait bondir le prix du baril.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'assurance navale</b> : les primes d'assurance montent en fonction du risque : la mer est un espace LIBRE mais dont les goulets sont vulnérables : la mondialisation maritime tient sur quelques points : c'est le concept d'espace traversier stratégique.</div></div></details>\n<h3>2. ZEE : la course aux 200 milles</h3>\n<div class=\"tip\"><b>Montego Bay (1982) :</b> chaque État côtier obtient une ZEE de 200 milles (ressources), et peut l'ÉTENDRE (plateau continental, jusqu'à 350 milles) en prouvant scientifiquement la prolongation : ~40 % des océans sont ainsi « appropriés » économiquement.<br><b>Conséquence :</b> les micro-États insulaires deviennent immenses (ZEE française : 11 M km², la 2e du monde grâce aux outre-mer) : la géographie du pouvoir s'est marine.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — les îles Éparses, cailloux d'or</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Des îlots inhabités de l'océan Indien (îles Éparses, Tromelin) font l'objet d'une gestion attentive de la France : pourquoi ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le droit</b> : une île (même minuscule, si habitée ou habitable) génère une ZEE de 200 milles : quelques km² de corail ⟹ 400 000+ km² d'eaux économiques.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les enjeux</b> : pêche (thon), position (base entre Afrique et Asie), revendication de souveraineté (Madagascar sur les Éparses, Maurice sur Tromelin) : la France a créé des réserves naturelles : occuper sans peupler.</div><div class=\"etu\"><b>Étape 3</b> — <b>Généralisation</b> : la mer de Chine (rochers Spratleys/Paracels : China construit des îles artificielles sur des récifs pour générer des droits), l'Arctique (dossiers de plateaux) : la ZEE a transformé des cailloux en enjeux mondiaux : le droit fabrique de la géopolitique.</div></div></details>\n<h3>3. Mer de Chine méridionale : le laboratoire</h3>\n<div class=\"tip\"><b>Conflit latent :</b> la Chine revendique ~80 % de la mer (« ligne en 9 traits », héritée de 1947) contre les ZEE du Vietnam, des Philippines, de la Malaisie : pêcheries, hydrocarbures, 1/3 du commerce maritime.<br><b>2016 :</b> la Cour permanente d'arbitrage (saisie par Manille) invalide les droits « historiques » chinois : Pékin REJETE la sentence : le droit contre la force, tension permanente, incidents aériens/navals, milices « pêcheurs ».</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — polderiser le récif</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment la Chine transforme-t-elle des récifs en arguments juridiques et militaires ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La technique</b> : dragage : les dragues coupent le récif et fabriquent une ÎLE artificielle (3 000 m de piste à Fiery Cross, radars, missiles) : 2015-2017 : plusieurs km² créés.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le droit</b> : Montego Bay distingue île (droits pleins) et « haut-fond découvrant » (rien) : Pékin argue que ses constructions sont des îles : la sentence de 2016 répond que des installations artificielles ne créent AUCUN droit : le droit tranche, la puissance continue.</div><div class=\"etu\"><b>Étape 3</b> — <b>Lecture HGGSP</b> : l'affaire réunit tous les concepts du chapitre : un espace traversier (1/3 du commerce), des ressources (gaz, poissons), un droit issu de Montego Bay, une puissance qui conteste l'ordre : et une leçon : sans exécution forcée, une sentence reste un texte : la mer, miroir des rapports de force.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ZEE ≠ souveraineté (c'est un droit économique) : 12 milles = souveraineté, 200 = ressources ; une sentence internationale n'est pas exécutoire par la force (la Chine ignore celle de 2016) ; les câbles sous-marins, invisibles, sont LE socle du réseau ; « la liberté des mers » est un régime JURIDIQUE (Montego Bay), pas un état de nature.</div>"},
{"id": "demographie-developpement", "theme": "Démographie, développement et richesse (HGGSP)", "niveau": "Terminale — HGGSP", "titre": "Démographie, développement et richesse", "cours": "<div class=\"cours-head\"><h2>Démographie, développement et richesse</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La transition démographique : le modèle et ses exceptions</h3>\n<div class=\"tip\"><b>Modèle :</b> mortalité en baisse (médecine, hygiène) puis natalité en baisse (urbanisation, école, contraception) ⟹ explosion transitoire de population. <b>Monde :</b> 1 Md (1800) ⟹ 2 Md (1927) ⟹ 8 Md (2022) : 90 % de la croissance dans les pays du Sud.<br><b>Le pays le plus peuplé :</b> l'Inde (>1,4 Md) a dépassé la Chine (2023) dont la population DÉCROÎT (politique de l'enfant unique 1979-2015, vieillissement).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire une pyramide des âges</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pyramide étroite à la base, large au sommet (Allemagne, Japon) vs pyramide à base large (Niger). Que déduire de chacune ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Vieillissement</b> (Japon) : base étroite = peu de naissances : Sommet large = longévité : conséquences : retraites (2 actifs par retraité au Japon contre 4 en 1990), immigration, dette.</div><div class=\"etu\"><b>Étape 2</b> — <b>Jeunesse</b> (Niger : âge médian ~15 ans) : base large = boom : conséquences : écoles à bâtir, emplois à créer, risque d'instabilité si l'État ne suit pas (le chômage des jeunes » : levier social du printemps arabe).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le concept HGGSP</b> : la démographie est une donnée POLITIQUE : vieillir ou rajeunir change la puissance (économie, armée, retraites) : la carte du monde de 2050 se lit dans les pyramides d'aujourd'hui : l'Afrique doublera sa part de population mondiale.</div></div></details>\n<h3>2. Mesurer le développement : au-delà du PIB</h3>\n<div class=\"tip\"><b>PIB/hab :</b> richesse produite, mais ignore inégalités, non marchand, environnement. <b>IDH (PNUD) :</b> santé (espérance de vie) + éducation (durée) + revenu : 0-1.<br><b>Autres indicateurs :</b> Gini (inégalités), IPH (pauvreté multidimensionnelle), empreinte écologique : le choix d'indicateur est un CHOIX politique.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — deux pays, même PIB, mondes opposés</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le Qatar (PIB/hab ~60 000 $) et la Norvège (~90 000 $) ont des revenus élevés. Le développement est-il identique ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Critères sociaux</b> : Norvège : espérance de vie ~83 ans, école publique, IDH top 3 : Qatar : main-d'œuvre étrangère (95 % de la population active) sans droits politiques, kafala (sponsorat) critiqué.</div><div class=\"etu\"><b>Étape 2</b> — <b>Critères politiques</b> : Norvège : démocratie plurielle : Qatar : monarchie sans partis : le développement (Amartya Sen) = « élargissement des libertés », pas seulement le revenu.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : le revenu mesure la RICHESSE, pas le DÉVELOPPEMENT : deux pays « riches » peuvent être à des stades de développement opposés : en HGGSP, toujours croiser indicateurs économiques ET sociaux ET politiques.</div></div></details>\n<h3>3. Migrations : l'âge des mobilités</h3>\n<div class=\"tip\"><b>281 millions de migrants internationaux (3,6 % de l'humanité, ONU 2020)</b>, chiffre stable en proportion depuis 50 ans mais en hausse absolue. <b>Causes :</b> guerre (Syriens, Ukrainiens : 6+ Md), climat, travail, études.<br><b>Géographie :</b> corridors Asie du Sud-Golfe, Mexique-USA, Afrique-Europe : l'Europe n'est PAS la première destination (c'est l'Asie).<br><b>Débat :</b> fuite des cerveaux vs apport démographique et économique des pays vieillissants.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le corridor Mexique-États-Unis</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ~11 millions de Mexicains sans papiers aux USA (estimations) : comment ce corridor fonctionne-t-il géopolitiquement ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le moteur</b> : différentiel de salaire (×5-10) + proximité + réseaux familiaux : la migration est un fait de MARCHÉ et de RÉSEAU, pas seulement de misère.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les transferts</b> : les mandats des migrants (60+ Md $/an vers le Mexique) dépassent l'aide publique au développement : la migration est un ACTEUR du développement (écoles, maisons construites avec l'argent des mandats).</div><div class=\"etu\"><b>Étape 3</b> — <b>La tension</b> : mur, déportations, « Remain in Mexico » : la frontière devient un enjeu électoral américain : mais l'économie américaine (agriculture, BTP) emploie la main-d'œuvre : la boucle : besoin/défi, humanité/sécurité : le cas d'école de toutes les migrations.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> PIB ≠ développement (croiser IDH, Gini) : « surpeuplé » n'est pas un concept scientifique (densité vs ressources vs organisation : les Pays-Bas sont denses et riches) : les migrations ne vident pas les pays du Sud (3,6 % de l'humanité) : l'Inde a dépassé la Chine (2023) : vérifier les chiffres avant de citer.</div>"},
{"id": "ressources-energie", "theme": "Les ressources et la transition énergétique (HGGSP)", "niveau": "Terminale — HGGSP", "titre": "Les ressources et la transition énergétique", "cours": "<div class=\"cours-head\"><h2>Les ressources et la transition énergétique</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Ressources : géographie de la dépendance</h3>\n<div class=\"tip\"><b>La carte des ressources est disproportionnée :</b> pétrole (67 % des réserves dans 5 pays du Golfe + Russie), gaz (Russie, Qatar, Iran ~45 %), terres rares (Chine : 60 % de production, 85 % de raffinage), lithium (triangle Argentine-Bolivie-Chili), cobalt (RDC : 70 %).<br><b>Dépendance = vulnérabilité :</b> l'Europe importait 40 % de son gaz de Russie avant 2022 (dont 55 % pour l'Allemagne) : une arme économique.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le gaz russe, arme de la guerre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment le gaz est-il devenu une arme dans la guerre Russie-Ukraine (2022-2023) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La dépendance</b> : avant 2022 : 40 % du gaz européen vient de Russie : des contrats à long terme, des pipelines (Nord Stream 1-2) : interdépendance : l'Europe paie, la Russie encaisse (jusqu'à ~1 Md $/JOUR au pic).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'arme</b> : réductions de livraisons (printemps 2022), arrêt de Nord Stream (septembre, sabotage ?), maximalisme : les prix x5 (TTF ~340 €/MWh en août 2022) : l'arme de la pauvreté énergétique européenne.</div><div class=\"etu\"><b>Étape 3</b> — <b>La riposte</b> : l'Europe diversifie (GNL américain, qatari), accelere renouvelables, sobriété : hiver 2022-23 : PAS de blackout : la dépendance recule à ~15 % (2023) : la leçon : une ressource peut être une arme, mais l'arme s'émousse quand le client se diversifie : la transition énergétique est aussi une stratégie de SÉCURITÉ.</div></div></details>\n<h3>2. L'énergie, moteur des tensions et des transitions</h3>\n<div class=\"tip\"><b>Le pétrole structure l'ordre mondial depuis 1945 :</b> dollar-pétrole, chocs (1973 embargo, 6 x le prix : récessions), golfe Presique (guerres), OPEP (cartel : + et — de production : décision de réduire 2022 ⟹ prix hauts malgré la demande occidentale).<br><b>Transition énergétique :</b> COP 21 (2015 : 1,5-2 °C), UE : -55 % émissions 2030, neutralité 2050 : les énergies renouvelables (solaire, éolien) deviennent stratégiques : la géopolitique des hydrocarbures devient géopolitique des MÉTAUX.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — les terres rares, nerf de la guerre technologique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi les « terres rares » (17 métaux) sont-elles devenues un enjeu de conflit entre les USA et la Chine ?</div><div class=\"etu\"><b>Étape 1</b> — <b>À quoi elles servent</b> : aimants permanents (néodyme) des voitures électriques et éoliennes, batteries, écrans, lasers : SANS elles, pas de transition énergétique ni de défense moderne (guides de missiles).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le monopole chinois</b> : 60 % des mines, mais surtout ~85 % du RAFFINAGE : la Chine a organisé la dépendance (prix bas, tolérance environnementale) : 2010 : embargo informel vers le Japon (conflit des Senkaku) : 2023 : contrôles à l'export (gallium, germanium) : l'arme des métaux.</div><div class=\"etu\"><b>Étape 3</b> — <b>Réponses occidentales</b> : lois CHIPS/IRA (subventions), réouverture de mines, recyclage, substitution : mais une mine prend 10-15 ans à ouvrir : la géopolitique des métaux a l'inertie du siècle : qui tient le raffinage tient la transition des autres.</div></div></details>\n<h3>3. Climat et ressources : le rapport Nord-Sud</h3>\n<div class=\"tip\"><b>Responsabilités différenciées :</b> les pays du Nord ont émis l'essentiel du CO₂ historique (USA : 25 % des émissions cumulées pour 4 % de l'humanité) : les pays du Sud subissent (sécheresses, submersion) et veulent leur droit au développement.<br><b>COP :</b> le fonds « pertes et dommages » acté à la COP27 (2022) : le transfert Nord-Sud devient monétaire : le climat est un négociation PERMANENTE de justice.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'eau douce, ressource explosive</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le Nil, le Mékong, l'Indus : pourquoi ces fleuves sont-ils des dossiers géopolitiques brûlants ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Amont/aval</b> : celui qui bâtit le barrage tient le robinet : Éthiopie (Grand barrage de la Renaissance) vs Égypte (97 % de son eau vient du Nil) : la menace du « partage ou de la guerre ».</div><div class=\"etu\"><b>Étape 2</b> — <b>Chine continentale</b> : le barrage des barrages (Mékong) : les systèmes en aval (Vietnam, Cambodge) dépendent de la CRUE artificielle : la « diplomatie de l'eau » chinoise.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion HGGSP</b> : l'eau illustre le chapitre : une ressource locale devenue géopolitique quand elle CROISE la frontière (Indus : Inde-Pakistan, traité de 1960, toujours respecté malgré 3 guerres) : la ressource est un RAPPORT DE FORCE en puissance : sa gestion pacifique (traités) est l'exception remarquable à connaître.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> l'OPEP est un cartel producteur (prix) pas un syndicat de consommateurs : la transition ne supprime pas la géopolitique de l'énergie, elle la DÉPLACE (pétrole ⟹ métaux) : les réserves sont des données ÉCONOMIQUES (extraites au prix du moment), pas des stocks fixés : « rare » (terres rares) ne veut pas dire rare géologiquement, mais DISPERSÉ et coûteux à raffiner.</div>"},
{"id": "guerre-paix", "theme": "Faire la guerre, faire la paix (HGGSP)", "niveau": "Terminale — HGGSP", "titre": "Faire la guerre, faire la paix", "cours": "<div class=\"cours-head\"><h2>Faire la guerre, faire la paix</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Formes de guerre : la mutation des conflits</h3>\n<div class=\"tip\"><b>Du conflit interétatique au conflit asymétrique :</b> les guerres entre États deviennent rares (mais pas disparues : Russie-Ukraine 2022) : dominent les conflits INTRA-étatiques et transnationaux (guerres civiles, insurrections, terrorisme).<br><b>Guerre hybride :</b> mélange d'actions militaires conventionnelles, irrégulières, cyber, informationnelles (Crimée 2014 : « petites hommes verts », brouillage des médias).<br><b>Théâtres nouveaux :</b> cyber, espace, fonds marins.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — 2022, retour de la guerre conventionnelle en Europe</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La guerre Russie-Ukraine (2022) mêle formes anciennes et nouvelles : lesquelles ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Anciennes</b> : front, artillerie, sièges (Bakhmout), mobilisation, frappes sur les villes : la guerre de matériel (obus) revient.</div><div class=\"etu\"><b>Étape 2</b> — <b>Nouvelles</b> : drones (observation, FPV kamikazes : « la première guerre des drones »), frappes de précision, guerre de l'information (TikTok, Telegram), sanctions économiques comme arme, ciblage des infrastructures énergétiques.</div><div class=\"etu\"><b>Étape 3</b> — <b>Lecture HGGSP</b> : le conflit prouve que la guerre entre États n'a pas disparu ET qu'elle se mène désormais sur TOUTES les dimensions (terrestre, maritime, aérien, cyber, informationnel, économique) : le concept de « guerre totale » n'est pas revenu, mais la guerre COMPLETE (multi-domaines) est là : paix armée + escalade nucléaire contenue : la dissuasion encadre le conflit sans l'empêcher.</div></div></details>\n<h3>2. Faire la paix : acteurs et instruments</h3>\n<div class=\"tip\"><b>Maintien de la paix ONU :</b> Casques bleus (consentement des parties, impartialité, non-recours à la force sauf légitime défense : 11 missions actives, budget ~6 Md $). <b>Juridiction :</b> CPI (1998, Rome : juger génocides, crimes de guerre : pas de rétroactivité, limite : grandes puissances non parties).<br><b>Diplomatie :</b> médiateurs (Qatar, Turquie, Suède historique), accords (Oslo 1993, Minsk 2014-15...), désarmement (TNP, START).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — Colombie : négocier la paix après 50 ans de guerre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'accord FARC-gouvernement (2016) est présenté comme un « modèle » de sortie de conflit : pourquoi, et quelles limites ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le processus</b> : 4 ans de négociation à La Havane (Norvège + Cuba garants), traiter les 6 points (dont victimes, justice « transitionnelle »), référendum perdu de peu (2016) puis révision et vote au Congrès : prix Nobel de paix pour Santos (2016).</div><div class=\"etu\"><b>Étape 2</b> — <b>La justice transitionnelle</b> : ni amnistie ni vengeance : « Système intégral de vérité » : aveux complets contre peines alternatives : 13 000 FARC désarmés, réinsertion (parti politique : 10 sièges garantis 2 mandats).</div><div class=\"etu\"><b>Étape 3</b> — <b>Limites</b> : chefs jugés par la JEP (tribunal spécial) : certaines dissidences des FARC reprennent les armes, le narcotrafic continue, les chefs sociaux assassinés (plus de 400 depuis 2016) : la paix est un PROCESSUS, pas une date : la Colombie montre les deux : ce que la négociation peut et ce qu'elle ne peut pas seule.</div></div></details>\n<h3>3. L'ONU entre idéal et réalisme</h3>\n<div class=\"tip\"><b>Chapitre VII :</b> le Conseil de sécurité (5 permanents + 10 élus : VETO) peut autoriser la force : mais les 5 se bloquent souvent (Syrie : 17 vetos russes : Ukraine : veto systématique).<br><b>Résolutions :</b> non contraignantes (A. générale) vs contraignantes (C. sécurité) : le droit existe, son exécution dépend des États : « l'ONU n'a pas d'armée propre » : elle est ce que ses membres veulent qu'elle soit.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — 2011, la Libye : le piège de la « responsabilité de protéger »</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La résolution 1973 (2011) autorise une zone d'exclusion aérienne en Libye : l'OTAN la transforme : quel débat sur l'usage de la force ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le droit</b> : « responsabilité de protéger » (R2P, 2005) : quand un État massacre son peuple, la communauté peut intervenir : le C. sécurité vote 10-0 (5 abstentions : Chine, Russie, Inde, Brésil, Allemagne).</div><div class=\"etu\"><b>Étape 2</b> — <b>La dérive</b> : la protection des civils devient un appui LOGISTIQUE aux rebelles jusqu'au renversement et à la mort de Kadhafi : pour Moscou et Pékin, c'est le détournement d'un mandat humanitaire en changement de régime.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conséquences</b> : méfiance accrue (veto russes/chinois ensuite : Syrie), Libye enlisée dans la guerre civile depuis : le cas débat par excellence : l'ingérence humanitaire peut-elle rester LIMITÉE ? la réponse a servi de repoussoir à toutes les négociations suivantes (Syrie, Ukraine) : en HGGSP, un échec structure les blocages futurs.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « maintien de la paix » (consentement, légitime défense) ≠ « imposition de la paix » (chapitre VII, force) : la CPI ne juge que depuis 2002 et pas les non-parties (USA, Russie, Chine... ont signé mais pas ratifié ou retrait) : une résolution du Conseil ≠ une résolution de l'Assemblée (contraignante vs déclarative) : « dissuasion » (empêcher par la peur) ≠ « défense » (gagner si attaque).</div>"},
{"id": "puissance-usa-chine", "theme": "La puissance : les États-Unis et la Chine (HGGSP)", "niveau": "Terminale — HGGSP", "titre": "La puissance : les États-Unis et la Chine", "cours": "<div class=\"cours-head\"><h2>La puissance : les États-Unis et la Chine</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Mesurer la puissance : les attributs</h3>\n<div class=\"tip\"><b>Puissance = capacité d'un acteur à imposer sa volonté</b> : attributs classiques : territoire, population, économie (PIB), militaire, technologique, culturelle (soft power), diplomatique (alliances, sièges onusiens).<br><b>Joseph Nye :</b> hard power (contraindre) vs soft power (séduire : culture, valeurs, modèle) : les USA cumulent les deux : la Chine construit le second.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comparer les deux puissances, chiffre par chiffre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Tableau comparatif USA-Chine : PIB, dépenses militaires, monnaie, alliances, soft power : quelles forces et faibesses respectives ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Économie</b> : PIB nominal : USA ~25 000 Md $, Chine ~18 000 Md $ (n°2) : PIB en parité de pouvoir : la Chine est n°1 depuis 2016 : dépendance croisée (la Chine détient ~800 Md $ de dette US).</div><div class=\"etu\"><b>Étape 2</b> — <b>Militaire</b> : USA ~900 Md $/an (37 % mondial, 11 marines, ~750 bases) : Chine ~300 Md $ (n°2, modernisation rapide, marine la plus nombreuse en navires) : mais les USA ont l'expérience, les alliances (OTAN, traités Asie) et la projection mondiale.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le reste</b> : monnaie : le dollar (60 % des réserves) n'a pas de rival (le yuan ~2 %) : soft power : Hollywood, universités (top 20 mondial), langue : la Chine investit (Confucius, Belt and Road) mais reste en retard d'image : bilan : puissance établie multipolaire vs puissance montante incomplète : le débat est celui de la « transition de puissance », moment historiquement dangereux.</div></div></details>\n<h3>2. Les États-Unis : la puissance installée</h3>\n<div class=\"tip\"><b>La puissance américaine est TOUJOURS là :</b> dollar (pétrodollars, SWIFT : les sanctions coulent par là), tech (GAFAM : standards du monde), alliances (OTAN article 5, traités Japon/Corée/Australie), culture mondiale, capacités de projection (11 groupes aéronavals).<br><b>Fragilités :</b> polarisation interne (Capitole 2021), dette (120 % PIB), retraits chaotiques (Afghanistan 2021), contestation de l'ordre par les BRICS.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le dollar, monnaie géopolitique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi la domination du dollar donne-t-elle aux USA un pouvoir que personne d'autre n'a ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le privilège</b> : 60 % des réserves mondiales, 80 % du commerce en dollars : les États empruntent dans LEUR monnaie (la Fed peut créer sans limite de change) : « déficit sans douleur ».</div><div class=\"etu\"><b>Étape 2</b> — <b>L'arme</b> : SWIFT et le clearing passent par des banques américaines : toute transaction en $ est un levier de sanction (Iran : coupé de SWIFT, gel des avoirs de la Banque centrale de Russie 2022 : 300 Md $) : l' « extraterritorialité » : une entreprise européenne qui trade en $ avec l'Iran risque les sanctions américaines.</div><div class=\"etu\"><b>Étape 3</b> — <b>La contestation</b> : dédollarisation (paiements en yuan, rupees : pétrole saoudien en yuan discuté), Brics+ (2023-24 élargissement), alternatives à SWIFT (CIPS chinois, INSTEX européen, échec) : mais le réseau est difficile à remplacer (profondeur financière, confiance) : le dollar reste roi... et toute remise en question de son règne est l'objectif géopolitique le plus stratégique du siècle.</div></div></details>\n<h3>3. La Chine : la montée en puissance</h3>\n<div class=\"tip\"><b>Trajectoire :</b> 1978 (réformes de Deng : « la vérité vient des faits ») → 2001 (OMC) → 2e économie (2010) → « siècle chinois » proclamé (Xi, 2017 : « rejuvénation nationale »).<br><b>Belt and Road Initiative (2013) :</b> routes de la soie : ports (Piraeus, Hambantota), rails, prêts à 150+ pays : influence par les INFRASTRUCTURES : « diplomatie du piège de la dette » ? débattu.<br><b>Objectifs :</b> Taïwan (la « ligne rouge »), mer de Chine, premiers rangs technologiques (« China Standards 2035 »), armée « classe mondiale » en 2049.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — Taïwan, l'épine et le sili-con</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi Taïwan (23 M d'habitants) est-il le point le plus explosif du monde ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'histoire</b> : 1949 : les nationalistes vaincus s'y réfugient : Pékin la considère comme une « province rebellée » (une seule Chine) : les USA pratiquent l'« ambiguïté stratégique » (vendre des armes, sans garantie d'intervention).</div><div class=\"etu\"><b>Étape 2</b> — <b>La puce</b> : TSMC fabrique ~90 % des puces les plus avancées (moins de 7 nm) : une guerre = arrêt mondial de l'électronique (iPhone, autos, armes) : « le sili-con shield » : l'île est un point unique de la chaîne mondiale.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le calendrier</b> : Xi : la « réunification » comme « mission historique » : exercices blocus répétés (2022-24) : les USA arment l'île et formulent (2021+) des déclarations plus fermes : le scénario de guerre a des prix : économique (puces), militaire (les deux premières marines), nucléaire (extension de la dissuasion) : Taïwan concentre la question du chapitre : jusqu'où la transition de puissance peut-elle aller sans guerre ?</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> PIB nominal vs PPA (les classements changent) : la Chine n'a PAS les alliés des USA (corée, Japon, OTAN : la Chine a la Corée du Nord et le Pakistan) : le soft power chinois progresse mais reste en retard : la « dédollarisation » est amorcée mais très lente : la transition de puissance n'est pas automatiquement guerrière (les USA-GB au XXe siècle : transition pacifique).</div>"},
{"id": "nouvelles-conflictualites", "theme": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information (HGGSP)", "niveau": "Terminale — HGGSP", "titre": "Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information", "cours": "<div class=\"cours-head\"><h2>Les nouvelles conflictualités : cyber, terrorisme et guerres de l'information</h2><span class=\"niv\">HGGSP</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le terrorisme : une violence théâtrale</h3>\n<div class=\"tip\"><b>Définition :</b> violence illégitime (non-étatique ou d'État, débattu) contre des civils pour SEMER LA TERREUR et obtenir un effet politique : la cible n'est pas l'objectif : le public est la cible (médiatisation).<br><b>Vagues historiques :</b> anarchiste (fin XIXe), anticoloniale (FLN, OAS), d'extrême gauche (RAF, Brigades rouges), religieuse (Al-Qaïda 2001, Daech 2014-19 : « proto-État » et attentats de masse en Europe).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le 11-Septembre, basculement du monde</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le 11 septembre 2001 : quels effets géopolitiques durables ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'immédiat</b> : ~3 000 morts, l'hyper-puissance frappée au cœur : Article 5 de l'OTAN (unique invocation) : guerre d'Afghanistan (2001), puis Irak (2003, sans l'ONU, sur des bases fausses).</div><div class=\"etu\"><b>Étape 2</b> — <b>Les transformations</b> : « guerre contre le terrorisme » sans front ni ennemi déclaré : Guantanamo, légalisation de la torture (débattue), surveillance de masse (Patriot Act, Snowden 2013), drones d'assassinat ciblé.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'héritage</b> : retrait d'Afghanistan 2021 (retour des talibans), Daech né des cendres irakiennes, suspicion mondiale envers la puissance américaine : le « terrorisme » a redéfini la guerre ASYMÉTRIQUE : un acteur faible impose son agenda à l'hyper-puissance (et l'épuise : 2 000 Md $ dépensés en Afghanistan) : la terreur comme stratégie du faible.</div></div></details>\n<h3>2. Cyber : le champ sans front</h3>\n<div class=\"tip\"><b>Typologie :</b> espionnage (APT, groupes d'État), sabotage (Stuxnet 2010 : centrifugeuses iraniennes), influence (infox, piratage de médias), prédation criminelle (rançongiciels : Colonial Pipeline 2021, hôpitaux).<br><b>Problèmes :</b> ATTRIBUTION difficile (qui a attaqué ?), RIPORTE incertaine (escalade ?), PRIVATE sector en première ligne (Google, Microsoft : les « cerveaux » de la défense sont privés).<br><b>Doctrine française :</b> Riposte de droit (loi de programmation militaire : cyberdéfense, « riposte en capacité »).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — Stuxnet, première arme numérique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Stuxnet (2010) a détruit ~1000 centrifugeuses iraniennes de Natanz : pourquoi est-ce un tournant géopolitique ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'arme</b> : ver informatique traversant les « air gap » (clés USB), ciblant UN type de Siemens : les centrifugeuses accélèrent et s'autodétruisent TOUT en affichant des mesures normales (les ingénieurs cherchent une panne mécanique).</div><div class=\"etu\"><b>Étape 2</b> — <b>La révolution</b> : première arme purement LOGICIELLE détruisant des installations physiques : attribuée (jamais officiellement) aux USA + Israël : le cyber quitte l'espionnage pour la SABOTAGE militaire.</div><div class=\"etu\"><b>Étape 3</b> — <b>La suite</b> : NotPetya (2017 : attaque sur l'Ukraine qui se répand mondialement : 10 Md $ dégâts), rançongiciels sur les hôpitaux (2020-21) : la leçon HGGSP : le cyber est le premier champ de conflit où les DÉGÂTS COLLATÉRAUX sont mondiaux et où le code civil, l'armée et le privé sont mêlés : une nouvelle grammaire de la guerre, encore sans « droit de la guerre » abouti (les règles ONU de comportement sont embryonnaires).</div></div></details>\n<h3>3. Guerres de l'information : infox et brouillage</h3>\n<div class=\"tip\"><b>Infox (fake news, « information disorder ») :</b> fausses, trompeuses, contextes volés : visées : discréditer (les élites, les médias), diviser (amplifier les clivages), paralyser (doute sur TOUT).<br><b>Écosystème :</b> usines à trolls (Russie : Internet Research Agency de Saint-Pétersbourg), fermes d'influence, algorithmes de recommandation (TikTok), deepfakes. <b>Contre-mesures :</b> fact-checking, éducation aux médias, sanctions (interdictions, contrôles judiciaires).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le brouillage avant l'invasion</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Avant et pendant l'invasion de l'Ukraine (2022), l'information fut une arme : décrivez les stratégies des deux camps.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le côté russe</b> : nier (« exercice »), justifier (« dénazification », « protection des Russophones »), théories (armes biologiques), amplification par les diasporas et influenceurs payés : l'objectif : brouiller le public russe ET international.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le côté ukrainien</b> : communication présidentielle quotidienne (Zelensky « je suis à Kyiv » : selfie contredisant la désinformation de sa fuite), OPEN SOURCE (images de drones, géolocalisation, Bellingcat), offensives de récits (l' « héros du serpent » : moral + soutien occidental).</div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan</b> : la guerre de l'information n'a pas remplacé les obus, mais elle a : 1) soudé l'OTAN, 2) aidé l'Ukraine à obtenir l'aide, 3) échoué à briser la cohésion russe (contrôle du récit intérieur) : la HGGSP retient : la bataille du RÉCIT est une dimension de la guerre à part entière : « le premier casque, c'est la vérité » (militaire français).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le terrorisme vise l'effet POLITIQUE par la terreur, pas la victoire militaire : l'attribution cyber est difficile (on parle d'« attribution publique » par les services, pas de preuve judiciaire) : les GAFAM sont des acteurs du cybercombat (défense privée) : « infox » ≠ opinion erronée : désinformation DÉLIBÉRÉE : la guerre de l'information n'est pas NOUVELLE (propagande toujours), mais ses canaux (viralité, ciblage algorithmique) le sont.</div>"},

function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }

  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de HGGSP</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + h + '</section>';
})();

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
</script>
