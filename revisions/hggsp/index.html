{"t": "La propagation des idées et de l'information (HGGSP)", "q": "Le « Grand Pare-feu » chinois désigne :", "c": ["un moteur de recherche américain", "le système de censure et de souveraineté numérique chinoise (filtrage, plateformes nationales)", "un traité de l'ONU", "une installation militaire"], "a": 1, "e": "Modèle souverain : filtrage national, plateformes propres (Weibo, WeChat), contrôle des narratives.", "d": "<b>La souveraineté numérique chinoise</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'architecture : blocage (Google, Facebook, Wikipedia chinoise filtrée), substitution (Baidu, WeChat, Douyin — TikTok version chinoise, encore plus encadrée), surveillance (modération humaine massive + IA) et crédibilité sociale (couper les rumeurs ET organiser le consensus) : le résultat : un Internet national de 1 Md d'utilisateurs, cohérent avec le parti : la comparaison des trois modèles à connaître : USA (marché + 1er amendement), UE (droits + régulation), Chine (souveraineté + parti) : en dissertation, ces trois « mondes » de l'information structurent toute la question « qui gouverne la parole mondiale ? ».</div>"},
{"t": "La propagation des idées et de l'information (HGGSP)", "q": "Le « règlement sur les services numériques » (DSA, UE) impose :", "c": ["l'évaluation des risques systémiques et la transparence des très grandes plateformes", "la gratuité", "la suppression d'Internet", "l'anonymat total"], "a": 0, "e": "Responsabilité des plateformes, audits, accès des chercheurs aux données : sanctions jusqu'à 6 % du CA mondial.", "d": "<b>Risques systémiques + transparence</b> (et sanctions lourdes).<div class='ex-detail'><u>Exemple rédigé</u> : la logique : les « très grandes plateformes » (45 M+ d'utilisateurs UE) deviennent des acteurs SYSTEMIQUES (ils façonnent les élections, les débats) : elles doivent donc évaluer leurs risques (désinformation, atteintes aux mineurs), être auditées, donner les clés aux régulateurs et chercheurs : l'effet géopolitique : l'UE, marché de 450 M de consommateurs, EXPORTE ses normes (« effet Bruxelles » : le RGPD a inspiré 100+ lois) : les USA régulent peu (liberté d'expression), la Chine exclut (pare-feu) : trois voies, un seul enjeu : qui écrit les règles du discours mondial ?</div>"},
{"t": "La propagation des idées et de l'information (HGGSP)", "q": "WhatsApp joue un rôle d'information majeur :", "c": ["dans les ambassades", "nulle part", "en Afrique, en Inde et en Amérique latine (réseaux fermés, rumeurs et mobilisations)", "aux États-Unis uniquement"], "a": 2, "e": "2 Md d'utilisateurs : LE canal des groupes privés : info ET désinformation (lynchages en Inde, élections au Brésil).", "d": "<b>Afrique, Inde, Amérique latine</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe du « fermé » : les messages chiffrés de bout en bout passent DANS les groupes (famille, église, village) : crédibilité maximale (ça vient d'un proche), vérifiabilité nulle : Inde 2018 : rumeurs d'enlèvements d'enfants ⟹ dizaines de lynchages : Brésil 2018-22 : les « réseaux de panique » familiaux (des études montrent la surreprésentation des infos fausses sur WhatsApp) : la leçon HGGSP : la désinformation n'est pas (seulement) un problème de « grandes plateformes publiques » : les canaux PRIVÉS, chiffrés, insaisissables, sont devenus l'infrastructure de l'opinion dans le Sud global : un angle souvent oublié qui enrichit la copie.</div>"},
{"t": "La propagation des idées et de l'information (HGGSP)", "q": "L'affaire Cambridge Analytica (2018) concernait :", "c": ["le sport", "un virus informatique", "le prix du pétrole", "des élections américaines (données Facebook utilisées pour ciblage politique)"], "a": 3, "e": "87 M de profils exploités pour micro-ciblage : rôle contesté (Brexit, Trump) : le scandale qui a fait prendre au sérieux la « donnée politique ».", "d": "<b>Le micro-ciblage politique par les données</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : une application de « test de personnalité » récolte les données de l'utilisateur... ET de ses amis (87 M de profils) : les profils psychographiques servent à cibler des publicités politiques personnalisées (peur, colère : le message qui « marche » sur MOI) : les effets réels sont DÉBATTUS (l'influence de la pub politique est difficile à mesurer) : mais le scandale a produit : audits, RGPD accéléré, conscience publique de la « donnée » : en HGGSP, le cas illustre la transformation du CIBLAGE de masse (radio) au CIBLAGE individuel (moi) : la propagande devient « sur mesure » : le changement de nature, plus que le scandale, est le vrai sujet.</div>"},
{"t": "La propagation des idées et de l'information (HGGSP)", "q": "Pegasus (spyware, révélé 2021) a révélé :", "c": ["la fin des téléphones", "une norme de l'ONU", "un jeu vidéo", "la surveillance d'État ciblée (journaux, opposants, chefs d'État) par logiciels espions commerciaux"], "a": 3, "e": "NSO Group (Israël) : 50 000 numéros cibles (journalistes, ONG, présidents) : l'État achète la surveillance (marché privatif de la 0-day).", "d": "<b>La surveillance ciblée d'État, sous-traitée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne industrielle : des sociétés privées (NSO, Candiru) vendent à des États des logiciels qui infectent SANS clic (failles « 0-day ») : le téléphone devient une « oreille » dans la poche : le consortium de journalistes (2021 : 80 journalistes, diplomates, chefs d'État espionnés, dont Macron) : les réponses : sanctions US contre NSO, listes noires, procès : la leçon HGGSP : la propagation de l'information A UN SENS UNIQUE menacé (l'État lit tout) : le débat du chapitre (diffuser/contrôler) n'oppose pas seulement des IDÉES : il traverse des INFRASTRUCTURES marchandes (le marché de la surveillance est un marché GÉOPOLITIQUE : exportations, licences, diplomatie).</div>"},

var currentChap = null;
var META_BY_ID = {}; var FICHE_BY_ID = {};
COURS_META.forEach(function(c){ META_BY_ID[c.id] = c; });
FICHES_DATA.forEach(function(f){ FICHE_BY_ID[f.id] = f.fiche; });

function chapHeadHTML(m){
  return '<div class="chap-head"><span class="chap-title">⚗️ Physique-chimie — ' + esc(m.titre) + '</span>' +
    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();
  if (t === 'quiz') {
    var bar = document.getElementById('quiz-chapbar');
    if (currentChap && META_BY_ID[currentChap]) { bar.innerHTML = chapHeadHTML(META_BY_ID[currentChap]); startTraining(META_BY_ID[currentChap].theme); }
    else { bar.innerHTML = ''; state.mode = 'menu'; render(); }
  }
  if (t === 'prog' || t === 'cours') window.scrollTo({top:0});
}
function clearChap(){ currentChap = null; }

function goCours(id){
  currentChap = id;
  showTab('cours');
  window.scrollTo({top:0, behavior:'smooth'});
}
function goCoursList(){ currentChap = null; showTab('cours'); }

function ficheHTML(id, num, open){
  var m = META_BY_ID[id]; var f = FICHE_BY_ID[id];
  return '<details class="fiche" id="fiche-' + id + '"' + (open ? ' open' : '') + '>' +
    '<summary><span class="fiche-num">' + num + '</span> Fiche — ' + esc(m.titre) + ' <span class="niv" style="font-size:.7rem;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-weight:700;margin-left:6px">' + esc(m.niveau) + '</span></summary>' +
    '<div class="fiche-body">' +
    '<div class="fiche-actions"><button class="btn-pdf" onclick="printFiche(\'' + id + '\')">🖨️ Imprimer</button><button class="btn-pdf" onclick="fichePDF(\'' + id + '\')">📄 PDF</button></div>' +
    '<div class="print-title">Fiche synthétique — ' + esc(m.titre) + ' (' + esc(m.niveau) + ')</div>' +
    f +
    '</div></details>';
}

function renderFiches(){
  var z = document.getElementById('fiches-zone'); var h = '';
  if (currentChap && FICHE_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += ficheHTML(currentChap, 1, true);
  } else {
    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
    var i = 1;
    FICHES_DATA.forEach(function(f){ h += ficheHTML(f.id, i); i++; });
  }
  z.innerHTML = h;
}

var PDF_MATIERE = 'HGGSP';
var PDF_CP1252 = { 0x2018:0x91, 0x2019:0x92, 0x201A:0x82, 0x201C:0x93, 0x201D:0x94, 0x201E:0x84, 0x2013:0x96, 0x2014:0x97, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x20AC:0x80, 0x0152:0x8C, 0x0153:0x9C, 0x0160:0x8A, 0x0161:0x9A, 0x0178:0x9F, 0x017D:0x8E, 0x017E:0x9E, 0x192:0x83, 0x2C6:0x88, 0x2032:0xB4, 0x2039:0x8B, 0x203A:0x9B, 0x2022:0x95, 0x201E2:0 };
function pdfTranslit(s){
  return s.replace(/\u2212|\u2013|\u2014/g, '-').replace(/[\u2032\u2019]/g, "'")
    .replace(/\u2192|\u21D2|\u21A6/g, '->').replace(/\u2190/g, '<-')
    .replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u2260/g, '!=').replace(/\u2248/g, '~')
    .replace(/\u2208/g, ' in ').replace(/\u2205/g, 'vide').replace(/\u2286/g, 'incl.')
    .replace(/\u221A/g, 'V').replace(/\u00B7|\u2219|\u22C5/g, '*')
    .replace(/\u2124/g, 'Z').replace(/\u211D/g, 'R').replace(/\u2115/g, 'N').replace(/\u2119/g, 'P')
    .replace(/\u00A0/g, ' ').replace(/\u202F|\u2009|\u200B|\uFE0F/g, '')
    .replace(/[\u2460-\u2468]/g, function(c){ return (c.charCodeAt(0) - 0x2460 + 1) + ')'; })
    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
}
function pdfEnc(s){
  var out = '';
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }
    else if (PDF_CP1252[c] !== undefined) b = PDF_CP1252[c];
    if (b !== null && b !== undefined) out += String.fromCharCode(b);
  }
  return out;
}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
var PDF_INLINE = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, SMALL:1, SUB:1, SUP:1, A:1, CODE:1, ABBR:1 };
function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';
    } else if (c.nodeType === 1){
      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }
      else if (g === 'B' || g === 'STRONG') pdfSegs(c, true, out);
      else pdfSegs(c, bold, out);
    }
  }
}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;
  function walk(n){

        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;
        var cl = ' ' + (c.className || '') + ' ';
        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }
        emitP();
        if (/^H[1-6]$/.test(g)) emitBlock('h', c, indent);
        else if (g === 'LI') emitBlock('li', c, indent + 14);
        else if (g === 'UL' || g === 'OL') {
          for (var li = c.firstChild; li; li = li.nextSibling){
            if (li.nodeType === 1 && li.tagName === 'LI') {
              emitBlock('li', li, indent + 14);
              for (var sub = li.firstChild; sub; sub = sub.nextSibling){
                if (sub.nodeType === 1 && (sub.tagName === 'UL' || sub.tagName === 'OL')){
                  for (var sli = sub.firstChild; sli; sli = sli.nextSibling){
                    if (sli.nodeType === 1 && sli.tagName === 'LI') emitBlock('li', sli, indent + 30);
                  }
                }
              }
            }
          }
        }
        else if (g === 'TABLE'){
          var rows = [];
          (function collectTbl(tn){
            for (var r = tn.firstChild; r; r = r.nextSibling){
              if (r.nodeType !== 1) continue;

function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    if (b.type === 'title'){ lines.push({ banner: 1, title: b.segs.map(function(s){ return s.t; }).join(' ').replace(/\s+/g, ' ').trim() }); return; }
    if (b.type === 'table'){ lines.push({ table: b }); return; }
    var isTitle = b.type === 'title';
    var size = b.type === 'h' ? 12 : 10.5;
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [], spPend = false;
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) { words.push({ br: true }); spPend = false; }
        var toks = p.split(/( +)/);
        for (var ti = 0; ti < toks.length; ti++){
          var tk = toks[ti];
          if (tk === '') continue;
          if (/^ +$/.test(tk)) { spPend = true; continue; }
          words.push({ w: tk, b: s.b, sp: spPend });
          spPend = false;
        }
      });
    });
    var cur = [], len = 0, firstLn = true;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, h: b.type === 'h', li: (b.type === 'li' && firstLn), gap: (b.type === 'h' ? 10 : 5) }); cur = []; len = 0; firstLn = false; } }

      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last && wd.sp ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var COL = { ind: [0.31, 0.27, 0.90], lav: [0.93, 0.95, 1.00], bord: [0.80, 0.84, 0.88], gry: [0.45, 0.50, 0.60], wht: [1, 1, 1], blk: [0.13, 0.13, 0.15] };
  function rg(c){ return c[0] + ' ' + c[1] + ' ' + c[2] + ' rg'; }
  function RG(c){ return c[0] + ' ' + c[1] + ' ' + c[2] + ' RG'; }
  var pages = [], cur = [], y = TOP, curTitle = 'Fiche';
  function newPage(){ pages.push(cur); cur = []; y = TOP; }
  function T(x, yy, size, bold, s, col){
    var enc = pdfEnc(pdfTranslit(s));
    if (!enc) return;
    cur.push(rg(col) + ' BT 1 0 0 1 ' + x.toFixed(2) + ' ' + yy.toFixed(2) + ' Tm /F' + (bold ? 2 : 1) + ' ' + size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
  }
  function wrapCell(text, wpt, size){
    var budget = Math.max(6, Math.floor((wpt - 10) / (0.52 * size)));
    var outl = [], line = '';
    text.split(' ').forEach(function(w){
      if (w === '') return;
      if (line === '') line = w;
      else if ((line + ' ' + w).length <= budget) line += ' ' + w;
      else { outl.push(line); line = w; }
    });
    if (line !== '') outl.push(line);
    return outl.length ? outl : [''];
  }
  function renderTable(tbl){
    var rows = tbl.rows, indent = tbl.indent || 0, ts = 9, lh = ts * 1.35;
    var tw = W - 2 * M - indent;
    var ncol = 0; rows.forEach(function(r){ ncol = Math.max(ncol, r.cells.length); });
    var weights = [];
    for (var j = 0; j < ncol; j++){ var mx = 5; rows.forEach(function(r){ if (r.cells[j]) mx = Math.max(mx, r.cells[j].length); }); weights.push(mx); }
    var sum = 0; weights.forEach(function(w){ sum += w; });
    var widths = [], acc = 0;
    for (var j2 = 0; j2 < ncol; j2++){ var wpt = Math.max(52, tw * weights[j2] / sum); widths.push(wpt); acc += wpt; }
    var scale = tw / acc; widths = widths.map(function(w){ return w * scale; });
    var xs = [M + indent]; for (var j3 = 0; j3 < ncol; j3++) xs.push(xs[j3] + widths[j3]);
    rows.forEach(function(r){
      var wc = [], nl = 1;
      for (var j4 = 0; j4 < ncol; j4++){ var cl = wrapCell(r.cells[j4] || '', widths[j4], ts); wc.push(cl); nl = Math.max(nl, cl.length); }

      if (y - rowH < M + 22) newPage();
      var top = y, bot = y - rowH;
      if (r.head) cur.push(rg(COL.lav) + ' ' + (M + indent) + ' ' + bot.toFixed(2) + ' ' + tw.toFixed(2) + ' ' + rowH.toFixed(2) + ' re f');
      cur.push(RG(COL.bord) + ' 0.8 w');
      cur.push((M + indent) + ' ' + top.toFixed(2) + ' m ' + (M + indent + tw) + ' ' + top.toFixed(2) + ' l S');
      cur.push((M + indent) + ' ' + bot.toFixed(2) + ' m ' + (M + indent + tw) + ' ' + bot.toFixed(2) + ' l S');
      for (var j5 = 0; j5 <= ncol; j5++) cur.push(xs[j5].toFixed(2) + ' ' + top.toFixed(2) + ' m ' + xs[j5].toFixed(2) + ' ' + bot.toFixed(2) + ' l S');
      cur.push('0 0 0 RG 1 w');
      for (var j6 = 0; j6 < ncol; j6++){
        for (var k = 0; k < wc[j6].length; k++) T(xs[j6] + 5, top - ts - 4 - k * lh, ts, r.head, wc[j6][k], COL.blk);
      }
      y = bot;
    });
    y -= 6;
  }
  lines.forEach(function(ln){
    if (ln.banner){
      if (y - 46 < M) newPage();
      var bh = 42;
      curTitle = ln.title || 'Fiche';
      cur.push(rg(COL.ind) + ' ' + M + ' ' + (y - bh).toFixed(2) + ' ' + (W - 2 * M) + ' ' + bh + ' re f');
      T(M + 14, y - 21, 14, true, curTitle, COL.wht);
      T(M + 14, y - 33, 8.5, false, 'Fiche synth\u00e9tique' + (typeof PDF_MATIERE !== 'undefined' && PDF_MATIERE ? ' \u2014 ' + PDF_MATIERE : ''), COL.wht);
      y -= bh + 14;
      return;
    }
    if (ln.table){ renderTable(ln.table); return; }
    var lh2 = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh2 - (ln.h ? 12 : 0) < M + 22) newPage();
    y -= (ln.gap || 0);
    if (ln.h){
      y -= 2;
      var bh3 = ln.size + 10;
      cur.push(rg(COL.lav) + ' ' + M + ' ' + (y - ln.size - 3).toFixed(2) + ' ' + (W - 2 * M) + ' ' + bh3 + ' re f');
      y -= ln.size * 1.05;
      var hx = M + 8, prevEnd = true;
      ln.segs.forEach(function(s){
        if (!s.t) return;
        var enc2 = pdfEnc(pdfTranslit(s.t));
        if (!enc2) return;
        var gapSp = (hx > M + 8 && !prevEnd && s.t.charAt(0) !== ' ') ? 1 : 0;
        T(hx + 0.52 * ln.size * gapSp, y, ln.size, true, s.t, COL.ind);
        hx += 0.52 * ln.size * (enc2.length + gapSp);
        prevEnd = / $/.test(s.t);
      });
      y -= ln.size * 0.37 + 3;
      return;
    }
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    if (ln.li) T(x - 11, y, ln.size, false, '\u2022', COL.ind);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      T(x, y, ln.size, s.b, s.t, COL.blk);
      x += 0.52 * ln.size * pdfEnc(pdfTranslit(s.t)).length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  for (var p = 0; p < pages.length; p++){
    var pgFoot = 'Fiche synth\u00e9tique' + (typeof PDF_MATIERE !== 'undefined' && PDF_MATIERE ? ' \u2014 ' + PDF_MATIERE : '') + ' \u2014 ' + curTitle;
    var fx = M, fw = 0.52 * 7.5 * pdfEnc(pdfTranslit(pgFoot)).length;
    pages[p].push(rg(COL.gry) + ' BT 1 0 0 1 ' + fx + ' 30 Tm /F1 7.5 Tf (' + pdfEsc(pdfEnc(pdfTranslit(pgFoot))) + ') Tj ET');
    var pn = 'Page ' + (p + 1) + ' / ' + pages.length;
    var pw = 0.52 * 7.5 * pn.length;
    pages[p].push('BT 1 0 0 1 ' + (W - M - pw).toFixed(2) + ' 30 Tm /F1 7.5 Tf (' + pdfEsc(pn) + ') Tj ET');
  }
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');

  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p2 = 0; p2 < pages.length; p2++){
    var po = 5 + 2 * p2, co = 6 + 2 * p2;

      var st = objs[i2].slice(7);
      out += i2 + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i2 + ' 0 obj\n' + objs[i2] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i3 = 1; i3 < objs.length; i3++) out += ('0000000000' + offs[i3]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function printFiche(id){
  var el = document.getElementById('fiche-' + id);

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

// Cours : rendu contextuel

    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
