{"t": "Récursivité (Terminale)", "q": "Toute fonction récursive :", "c": ["est toujours plus rapide", "ne peut pas être écrite autrement", "possède une version ITÉRATIVE équivalente (boucle, éventuellement avec accumulateur ou pile explicite) — la question est lisibilité/structure, pas faisabilité", "est interdite en production"], "a": 2, "e": "La pile d'appels n'est qu'une pile : on peut la gérer à la main (boucle + tableau d'états) ⟹ toute récursion « se dé-récursifie » : récursif = élégant sur les structures récursives : itératif = économe et sans débordement.", "d": "<b>La conversion toujours possible</b> : récursif et itératif, même combat.<div class='ex-detail'><u>Exemple rédigé</u> : la conversion de fact : RÉCURSIF : if n == 0: return 1 : return n * fact(n-1) : ITÉRATIF (accumulateur !) : acc = 1 : for i in range(1, n+1): acc = acc * i : return acc — même résultat, aucune pile (!) : le cas qui résiste davantage : le parcours d'arbre (deux fils ⟹ deux « mondes en attente ») : le récursif empile naturellement, l'itératif doit gérer une PILE EXPLICITE (liste d'où on empile/dépile les nœuds à visiter !) : la règle de décision en pratique : structure récursive (arbre, définition mathématique auto-référentielle) OU lisibilité (Hanoï en 4 lignes !) ⟹ récursif : profondeur énorme (fact(100000) !!), perf critique, cumul trivial ⟹ itératif : les deux écritures coexistent dans tout code professionnel — l'ingénieur choisit, l'étudiant sait faire les DEUX.</div>"},
{"t": "Récursivité (Terminale)", "q": "def somme(l): if l == []: return 0 : return l[0] + somme(l[1:]). Le coût caché de cette version :", "c": ["le slicing l[1:] COPIE le reste à chaque étage ⟹ O(n²) au total (préférer un indice ou l'itératif)", "elle est en O(log n)", "aucun", "elle ne termine pas"], "a": 0, "e": "Chaque l[1:] construit une NOUVELLE liste de taille n-1, n-2... : la somme des copies = n(n-1)/2 : le résultat est juste, mais le modèle « joli » paie un quadratique invisible : avec un indice i, aucun recopiage.", "d": "<b>Le slicing facturé</b> : le beau code au coût caché.<div class='ex-detail'><u>Exemple rédigé</u> : la facture détaillée sur [5, 3, 8, 1] : étage 1 : somme([5,3,8,1]) fabrique l[1:] = [3,8,1] — une copie de 3 éléments : étage 2 : copie de [8,1] (2) : étage 3 : copie de [1] (1) : total copies : 3+2+1 = 6 = n(n-1)/2 (!) : sur 100 000 éléments : ~5 milliards d'éléments recopiés — des secondes pour une somme (!!) : la version sobre, même logique : somme(l, i=0) : if i == len(l): return 0 : return l[i] + somme(l, i+1) — l'indice avance SANS copie : O(n) : la nuance pédagogique : le modèle « tête + reste » est EXCELLENT pour penser (et c'est le modèle des langages fonctionnels optimisés pour ça !) : mais en Python, le slice a un prix : penser récursif, coder avec un indice — les deux compétences ensemble.</div>"},
{"t": "Récursivité (Terminale)", "q": "Les Tours de Hanoï (déplacer n disques) sont souvent citées en exemple récursif parce que :", "c": ["c'est un problème itératif en réalité", "la récursivité est obligatoire en Python", "c'est le seul cas possible", "la solution se FORMULE naturellement en récursion : déplacer n-1 disques, le grand, puis re-déplacer n-1 (le problème n-1 apparaît DEUX fois, itération pénible à écrire)"], "a": 3, "e": "La décomposition : (1) n-1 disques sur l'intermédiaire, (2) le grand sur l'arrivée, (3) n-1 disques par-dessus : la récursion capture ce plan en 3 lignes, là où l'itératif exige de simuler la pile à la main : la structure du problème EST récursive.", "d": "<b>Le problème né récursif</b> : pourquoi Hanoï convict.<div class='ex-detail'><u>Exemple rédigé</u> : la solution complète commentée : def hanoi(n, dep, arr, int) : if n == 0: return (BASE !) : hanoi(n-1, dep, int, arr) — dégager les n-1 petits sur l'intermédiaire : print('disque', n, ':', dep, '→', arr) — le GRAND passe enfin : hanoi(n-1, int, arr, dep) — les petits reviennent SE COUCHER dessus : TROIS lignes pour un problème qui embarrasse l'itératif (!!) : le comptage : hanoi(n) = 2·hanoi(n-1) + 1 déplacements ⟹ 2^n - 1 (64 disques : 18,4 trillions de coups — la légende de la fin du monde !) : la leçon de style : quand l'ÉNONCÉ du problème se raconte en « et refais la même chose, un cran plus petit », la récursion n'est pas une ASTUCE : c'est la TRADUCTION directe : les algorithmes sur les arbres, les retours-arrière (backtracking !) et les fractales sont de la même famille — des problèmes qui ne se pensent bien que dans leur propre langage.</div>"},
{"t": "Récursivité (Terminale)", "q": "Un appel récursif sur une instance qui ne devient jamais « plus petite » (ex. f(n) appelle f(n)) provoque :", "c": ["un résultat faux silencieux", "une RÉCURSION INFINIE : les cadres s'empilent jusqu'au débordement (RecursionError : maximum recursion depth exceeded)", "un résultat None", "une simple alerte"], "a": 1, "e": "La pile d'exécution reçoit un cadre par appel SANS jamais en dépiler : au bout de ~1000 cadres en Python, l'interpréteur s'arrête : c'est la trace d'un cas de base inatteignable — un des bugs les plus fréquents du récursif.", "d": "<b>L'empilement sans fin</b> : l'erreur la plus fidèle du récursif.<div class='ex-detail'><u>Exemple rédigé</u> : l'autopsie du bug : def compte(n): if n == 0: return 0 : return 1 + compte(n) — un seul caractère manquant (le -1 !) : compte(3) appelle compte(3) qui appelle compte(3)... : chaque appel EMPILE un cadre (ses variables locales, son point de reprise) : AUCUN ne rend la main : à ~1000 cadres, Python coupe : RecursionError : maximum recursion depth exceeded in comparison (!) : le diagnostic express : l'erreur de profondeur ⟹ 9 fois sur 10 : (a) base absente, (b) base inatteignable (pas de -1, saut de parité !), (c) condition mal écrite (if n &gt; 0 : ... return f(n-1) avec n négatif initial !) : l'outil pédagogique : print(n) au début de la fonction : si la colonne affichée ne descend PAS vers la base — le bug est trouvé en trois secondes.</div>"},
{"t": "Programmation orientée objet (Terminale)", "q": "Le rôle de self dans une méthode :", "c": ["c'est l'OBJET sur lequel la méthode est appelée (le destinataire : a.crediter(20) ⟹ crediter(a, 20))", "une variable globale", "c'est le nom de la classe", "le retour de la méthode"], "a": 0, "e": "self relie la méthode à SON objet : les attributs (self.solde) et l'identité de l'objet sont accessibles grâce à lui : Python le passe automatiquement à l'appel — ne JAMAIS l'écrire soi-même à l'appel !", "d": "<b>Le destinataire</b> : self, l'objet au bout de la flèche.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique complète : a = Compte('Anna', 100) : l = Compte('Léo', 50) : l'appel a.crediter(20) est INTERPRÉTÉ comme Compte.crediter(a, 20) — self reçoit a (!) : donc self.solde += 20 modifie le solde d'ANNA (120), celui de Léo intact (50) : le même appel l.crediter(20) ⟹ self reçoit l ⟹ c'est LÉO qui est crédité : les erreurs jumelles à repérer : 1. définir def crediter(montant): sans self ⟹ l'appel a.crediter(20) met a dans montant (!!) : TypeError : missing 1 argument — deux fournis (a, 20), un seul attendu ! : 2. écrire a.crediter(a, 20) ⟹ self reçu deux fois : TypeError là aussi : la règle en une ligne : self s'ÉCRIT dans la définition, ne s'ÉCRIT PAS à l'appel.</div>"},
{"t": "Programmation orientée objet (Terminale)", "q": "La méthode __init__ :", "c": ["détruit l'objet", "est le CONSTRUCTEUR : appelée automatiquement à la création (Compte('Anna', 100)), elle initialise les attributs de l'objet", "est optionnelle et inutile", "affiche l'objet"], "a": 1, "e": "L'instruction Compte('Anna', 100) fabrique l'objet PUIS exécute __init__(objet, 'Anna', 100) : les self.x = y y prennent vie : sans __init__, l'objet naît vide !", "d": "<b>Le constructeur</b> : la naissance de l'objet.<div class='ex-detail'><u>Exemple rédigé</u> : la chronologie exacte : Compte('Anna', 100) : 1. Python ALLUE l'objet en mémoire (un espace vide, étiqueté Compte !) : 2. Python APPELLE Compte.__init__(nouvel_objet, 'Anna', 100) — le self du constructeur EST cet objet tout neuf : 3. dans __init__, self.titulaire = 'Anna' et self.solde = 100 ATTACHENT les attributs à l'objet : 4. l'instruction d'origine renvoie l'objet prêt à servir (!) : le contrat d'__init__ : il ne RETURN pas l'objet (il le PRÉPARE : return None implicite — retourner autre chose serait une erreur !) : et la cohérence : tout attribut nécessaire au fonctionnement devrait y être initialisé (un solde jamais créé ⟹ AttributeError au premier a.solde !) : __init__ = le tour de chant de la naissance : ce qui n'y est pas mis n'existe pas.</div>"},
{"t": "Programmation orientée objet (Terminale)", "q": "L'encapsulation consiste à :", "c": ["cacher le code source", "tout mettre dans une seule fonction", "réunir données et méthodes dans l'objet et faire passer le code extérieur PAR les méthodes (l'objet protège ses attributs : invariants garantis !)", "utiliser l'héritage"], "a": 2, "e": "L'objet est un service : il expose des opérations (crediter, debiter) et cache l'intendance : l'extérieur ne modifie le solde QU'en demandant poliment — l'objet peut donc REFUSER et préserver ses invariants.", "d": "<b>Le service protégé</b> : l'objet maître de ses données.<div class='ex-detail'><u>Exemple rédigé</u> : le duo à comparer : SANS encapsulation : le code métier écrit partout a.solde = a.solde - 500 : un soir, une ligne oublie le contrôle ⟹ solde = -400 : l'invariant « jamais négatif » repose sur la DISCIPLINE de TOUS les programmeurs (!!) : AVEC : debiter vérifie et REFUSE : l'invariant repose sur UNE méthode, testée une fois pour toutes : l'analogie qui fixe : le distributeur de billets — l'argent est DANS la machine, on ne l'attrape pas par la fente : on dialogue avec elle (code, montant) et ELLE décide (!) : les bénéfices en cascade : maintenance (changer le stockage interne sans toucher les utilisateurs !) : débogage (le suspect est toujours dans la classe !) : évolution (ajouter des règles sans casser l'extérieur !) : l'encapsulation n'est pas de la coquetterie : c'est la localisation des responsabilités — LE principe qui tient les grands programmes debout.</div>"},
{"t": "Programmation orientée objet (Terminale)", "q": "class CompteEpargne(Compte): signifie que :", "c": ["CompteEpargne remplace Compte", "les deux classes sont identiques", "Compte hérite de CompteEpargne", "CompteEpargne HÉRITE de Compte (elle reçoit ses attributs et méthodes) : un CompteEpargne « EST UN » Compte"], "a": 3, "e": "La parenthèse crée le lien mère-fille : la fille reçoit TOUT de la mère (héritage !) et peut ajouter ou redéfinir : le sens : un CompteEpargne EST UN Compte (utilisable partout où un Compte l'est !).", "d": "<b>La fille et le legs</b> : l'héritage en une parenthèse.<div class='ex-detail'><u>Exemple rédigé</u> : le legs observé : class CompteEpargne(Compte): pass — RIEN écrit dans la fille : et pourtant : e = CompteEpargne('Anna', 1000, 2) : e.crediter(20) MARCHE (méthode héritée !) : e.solde se lit (attribut hérité !) (!!) : puis la spécialisation : ajouter taux via super().__init__ + self.taux = taux : ajouter interets() : redéfinir debiter (interdiction de débit !) — la version de la fille gagne sur celle de la mère (override !) : la grille de conception : DUPLICATION entre deux classes ⟹ factoriser dans une mère commune : le test de validité (capital !) : « un CompteEpargne EST-IL un Compte ? » OUI ⟹ héritage juste : « une Pile EST-ELLE une liste ? » — non, elle UTILISE une liste (→ composition, pas héritage !) : l'héritage exprime un SENS, pas un raccourci d'écriture.</div>"},
{"t": "Programmation orientée objet (Terminale)", "q": "Dans la fille, super().__init__(t, s) sert à :", "c": ["passer des arguments au hasard", "effacer la mère", "appeler le CONSTRUCTEUR DE LA MÈRE pour initialiser la partie héritée (éviter de dupliquer titulaire/solde)", "créer un deuxième objet"], "a": 2, "e": "La fille CONSTRUIT SON socle en déléguant à la mère (super() = « fais comme la mère ! »), puis ajoute ses propres attributs : zéro duplication, un seul endroit où le socle est défini.", "d": "<b>La mère d'abord</b> : super(), l'artisan du socle.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison qui condamne la duplication : VERSION MALADROITE : class CompteEpargne(Compte): def __init__(self, t, s, taux): self.titulaire = t : self.solde = s : self.taux = taux — le socle titulaire/solde est RECOPIÉ (!!) : si la mère ajoute un attribut (ex. historique !), la fille l'oublie ⟹ bugs silencieux : VERSION PROPRE : def __init__(self, t, s, taux): super().__init__(t, s) : self.taux = taux — la mère construit titulaire et solde (UNE SEULE définition, à jour automatiquement !), la fille n'écrit QUE son enrichissement : l'ordre importe : super() D'ABORD (le socle existe avant de bâtir dessus : accéder à self.solde avant super() ⟹ AttributeError si la mère y initialise !) : la devise : « la mère fait sa part, la fille ajoute la sienne » — l'usine à socles, réutilisée à chaque classe fille.</div>"},
{"t": "Programmation orientée objet (Terminale)", "q": "Deux objets a = Compte('Anna', 100) et b = Compte('Anna', 100) : a.solde += 50 modifie :", "c": ["UNIQUEMENT a : chaque objet porte SES PROPRES attributs (b.solde reste 100)", "aucun", "le plan de la classe", "les deux (attribut de classe)"], "a": 0, "e": "a et b sont deux réalisations DISTINCTES du plan : leurs attributs vivent séparément en mémoire : modifier l'un ne touche jamais l'autre — l'indépendance des instances est la base de l'objet.", "d": "<b>Chacun chez soi</b> : l'indépendance des objets.<div class='ex-detail'><u>Exemple rédigé</u> : l'image architecturale : la classe Compte = le PLAN d'appartement F4 : a et b = DEUX appartements construits d'après le plan : la même pièce « solde » existe dans chacun, avec SES meubles : rénover le solde de a ne repeint PAS celui de b (!) : la vérification mémoire : a.solde ⟹ 150 : b.solde ⟹ 100 : deux zones distinctes, deux vies : la nuance qui complète : le PLAN (la classe) porte aussi des éléments communs (les méthodes — le mode d'emploi de l'appartement !) et des attributs DE CLASSE (communs !) : mais les attributs d'INSTANCE (self.x) sont TOUJOURS par objet : l'erreur du débutant : « j'ai changé a, pourquoi b n'a pas bougé ? » — c'est exactement le but ! l'objet isole l'état, la classe partage le comportement : les deux ensemble = la puissance du modèle.</div>"},
{"t": "Programmation orientée objet (Terminale)", "q": "La méthode __str__(self) d'une classe sert à :", "c": ["convertir en entier", "trier les objets", "définir la REPRÉSENTATION en texte de l'objet (utilisée par print : print(objet) l'appelle automatiquement !)", "initialiser l'objet"], "a": 2, "e": "__str__ retourne la chaîne « élégante » de l'objet : print(a) et str(a) l'utilisent : sans elle, print affiche l'affreux <__main__.Compte object at 0x7f...> (!!)", "d": "<b>L'objet présentable</b> : __str__, le protocole d'affichage.<div class='ex-detail'><u>Exemple rédigé</u> : l'avant/après : SANS __str__ : print(a) ⟹ <__main__.Compte object at 0x7f3a...> — illisible, inutile en débogage (!!) : AVEC : def __str__(self): return f'Compte de {self.titulaire} : {self.solde} EUR' : print(a) ⟹ « Compte de Anna : 120 EUR » — le débogage devient une lecture (!) : le mécanisme (protocoles Python !) : print/str cherchent __str__ (et __repr__ en secours, orienté développeur !) : la famille des méthodes « à double underscore » (dunder !) : __init__ (naissance !), __str__ (texte !), __len__ (len(objet) !), __eq__ (== entre objets !) : les NOMMER, c'est brancher ses objets sur le LANGAGE lui-même (print, len, == ... s'adaptent à VOS objets !) : c'est le sens profond de l'objet : définir de nouveaux citoyens du langage, avec leurs us et coutumes.</div>"},
{"t": "Programmation orientée objet (Terminale)", "q": "L'appel a.debiter(30) sur la méthode def debiter(self, m): if self.solde - m &lt; 0: return False : self.solde -= m : return True — avec a.solde = 20 :", "c": ["modifie le solde sans condition", "retourne FALSE et le solde RESTE 20 (l'invariant « jamais négatif » est protégé PAR LA MÉTHODE)", "plante le programme", "retourne True et solde = -10"], "a": 1, "e": "20 - 30 &lt; 0 ⟹ la méthode REFUSE (return False) SANS toucher au solde : l'invariant est garanti par l'objet lui-même : c'est l'encapsulation en action.", "d": "<b>Le refus qui protège</b> : l'invariant défendu par la méthode.<div class='ex-detail'><u>Exemple rédigé</u> : le déroulé protecteur : a.debiter(30) : entrée : self = a, m = 30 : test : 20 - 30 = -10 &lt; 0 ⟹ VRAI ⟹ return False — et le self.solde -= m n'est JAMAIS exécuté (!) : a.solde vaut TOUJOURS 20 : l'appelant (le code métier !) reçoit False et SAIT que le débit a échoué : il peut en informer l'utilisateur (« solde insuffisant ! ») : le contrat complet de la méthode : True = opération faite : False = refus MOTIVÉ (l'état est inchangé — pas de demi-opération !) : la force du modèle : la règle « solde ≥ 0 » est écrite UNE fois (dans la classe !) et vécu PARTOUT (tous les appels passent par le garde-fou !) : à comparer avec la version « libre » a.solde -= 30 éparpillée dans dix fichiers : dix occasions d'oublier le test : l'objet est le gardien de sa cohérence.</div>"},
{"t": "Programmation orientée objet (Terminale)", "q": "Concevoir une classe Pile avec les méthodes empiler/depiler/est_vide est un exemple de :", "c": ["d'héritage multiple", "ENCAPSULATION d'une structure de données : l'UTILISATEUR de la pile manipule l'INTERFACE (empiler/depiler) sans connaître l'implémentation interne (liste, chaînée...)", "de programmation fonctionnelle", "sur-ingenierie"], "a": 1, "e": "La classe Pile EXPOSE un contrat (empiler/depiler/est_vide, discipline LIFO) et CACHE sa mécanique (une liste interne !) : l'utilisateur ne peut pas tricher avec l'ordre (pas d'accès direct au milieu !) : structure de données = interface + implémentation, réunies par l'objet.", "d": "<b>La structure chapeautée</b> : quand la classe protège la discipline LIFO.<div class='ex-detail'><u>Exemple rédigé</u> : la classe complète en cinq lignes : class Pile: def __init__(self): self._data = [] : def empiler(self, x): self._data.append(x) : def depiler(self): return self._data.pop() : def est_vide(self): return len(self._data) == 0 — l'underscore du _data signale « interne, ne pas toucher ! » (!) : le gain de discipline : une pile en LISTE LIBRE permet p[1], p.insert(0, x), p.sort() — toutes les violations du LIFO (!!) : la classe FERME ces portes : il ne reste que le contrat : l'utilisateur raisonne en TERME du problème (« j'empile, je dépile »), pas en termes de mécanique (« append ? pop ? index ? ») : et demain, l'implémentation passe à la liste chaînée (meilleure mémoire !) : AUCUN utilisateur touché (le contrat tient toujours !) : la POO est l'art de faire des structures de données des SERVICES fiables.</div>"},
{"t": "Programmation orientée objet (Terminale)", "q": "Choisir entre héritage et simple utilisation : une classe Pile qui UTILISE une liste (self.data = []) plutôt que d'en hériter, parce que :", "c": ["une pile N'EST PAS une liste (elle interdit l'accès au milieu !) : hériter EXPOSERAIT toutes les méthodes de liste, cassant la discipline LIFO", "c'est plus rapide", "l'héritage est déconseillé en Python", "les listes ne peuvent pas être héritées"], "a": 0, "e": "Le critère « EST UN » : une pile n'est pas une sorte de liste (c'est une liste RESTREINTE !) : hériter de list ouvrirait insert, sort, p[1]... violant le LIFO : la bonne relation : la pile CONTIENT une liste (composition !) et n'expose QUE son contrat.", "d": "<b>Être ou contenir</b> : le bon choix de relation entre classes.<div class='ex-detail'><u>Exemple rédigé</u> : l'héritage PIÈGE joué : class Pile(list): pass — en trois lettres, une pile « marche » : empiler = append, depiler = pop : MAIS la fille hérite de TOUT : p.insert(1, x) compile, p.sort() aussi, p[0] (le fond de la pile !) se lit (!!) : toutes les violations du LIFO sont OFFERTES — la discipline est morte, le contrat bafoué : la composition correcte : class Pile: def __init__(self): self._data = [] — la liste est un EMPLOYÉ interne, invisible dehors : seules empiler/depiler/est_vide sont publiques (!) : le test général à retenir : « B EST-IL un A, avec tout ce que ça implique ? » (CompteEpargne EST un Compte : OUI !) : « B a-t-il simplement BESOIN de A ? » (Pile a une liste : composition !) : choisir la bonne relation est LA décision de conception — fausse, le contrat se fissure : juste, la hiérarchie reste propre et durable.</div>"},
{"t": "Bases de données et SQL (Terminale)", "q": "La clé primaire d'une table :", "c": ["est toujours une chaîne de caractères", "identifie chaque ligne de façon UNIQUE (jamais doublon, jamais NULL) — la clé étrangère d'une autre table pointe vers elle", "sert au tri", "peut être nulle"], "a": 1, "e": "La clé primaire est l'identité de la ligne (id !) : unique et non nulle, elle peut être référencée de l'extérieur (clé étrangère !) : c'est la fondation du modèle relationnel.", "d": "<b>L'identité de la ligne</b> : la clé primaire, pivot du modèle.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario sans clé : deux 'Anna Hugo' dans auteurs — laquelle a écrit 'Nuit' ? AMBIGUÏTÉ, la jointure ne sait pas (!!) : avec id : (3, 'Hugo') et (7, 'Hugo') : le livre pointe id=3 : aucun doute, même nom, personnes distinctes (!) : les garanties du SGBD : INSERT d'un doublon d'id ⟹ refus (UNIQUE !) : INSERT avec id NULL ⟹ refus : l'intégrité est assurée PAR LA BASE, pas par la discipline des programmeurs : la clé artificielle (id auto-incrémenté !) est la pratique la plus sûre — stable même si une donnée « naturelle » (nom, ISBN !) change : et la clé ÉTRANGÈRE, c'est la même idée dans l'autre sens : livres.id_auteur ne peut contenir QUE des id qui EXISTENT côté auteurs — le lien est garanti sans rupture (intégrité référentielle !).</div>"},
{"t": "Bases de données et SQL (Terminale)", "q": "La clause WHERE d'un SELECT :", "c": ["filtre les LIGNES une à une (seules celles dont la condition est vraie sont gardées)", "choisit les colonnes à afficher", "trie les résultats", "crée une table"], "a": 0, "e": "Deux questions séparées : QUELLES colonnes ? (le SELECT) : QUELLES lignes ? (le WHERE !) : WHERE = le filtre ligne par ligne, avec =, &lt;&gt;, &gt;, AND/OR, LIKE, IN, BETWEEN.", "d": "<b>Le filtre ligne à ligne</b> : WHERE, le videur de la base.<div class='ex-detail'><u>Exemple rédigé</u> : la requête : SELECT titre FROM livres WHERE annee &gt; 2000 — lisible en 2 temps : 1. le SGBD passe chaque ligne au crible : (annee &gt; 2000 ?) vrai ⟹ gardée : faux ⟹ éjectée : 2. sur les survivantes, il ne retient que la colonne titre (!) : l'ordre mental à garder : FILTRER d'abord (WHERE), AFFICHER ensuite (SELECT) : les enrichissements courants : WHERE annee BETWEEN 1990 AND 2000 : WHERE titre LIKE '%nuit%' (contient 'nuit' !) : WHERE id_auteur = 3 AND annee &lt; 1850 : la confusion type : SELECT annee WHERE ... croit filtrer des colonnes — non ! le filtre est TOUJOURS sur les lignes : pour « filtrer » des colonnes, on... les écrit dans le SELECT, c'est tout (!) : la ligne est l'unité de vie d'une table : WHERE en est le crible.</div>"},
{"t": "Bases de données et SQL (Terminale)", "q": "SELECT COUNT(*) FROM livres donne :", "c": ["la première ligne", "le NOMBRE de lignes de la table (toutes comptées, NULL compris) — un agrégat condense toute la table en un seul résultat", "une erreur", "la valeur maximale"], "a": 1, "e": "Les agrégats (COUNT, SUM, AVG, MIN, MAX) réduisent N lignes à UN résultat : COUNT(*) compte les lignes : COUNT(colonne) ne compte que les valeurs NON NULL de la colonne !", "d": "<b>Le tableau résumé en un nombre</b> : COUNT, l'agrégat élémentaire.<div class='ex-detail'><u>Exemple rédigé</u> : la table avant/après : 40 lignes de livres : SELECT COUNT(*) FROM livres ⟹ 40 — une seule cellule de résultat (!) : l'agrégat DIGÈRE la table : SELECT AVG(annee) ⟹ la moyenne des années : SELECT MAX(annee) ⟹ la plus récente : SELECT SUM(prix) WHERE ... ⟹ le total du panier filtré : la nuance qui fait les questions pièges : COUNT(*) = toutes les lignes (40 !) : COUNT(id_auteur) = seulement celles où id_auteur est rempli (36 si 4 NULL !) : l'usage combiné avec WHERE : SELECT COUNT(*) FROM livres WHERE annee &gt; 2000 ⟹ « combien de livres récents ? » — le filtre PUIS le comptage (!) : la logique : WHERE prépare les lignes, l'agrégat les condense : SELECT ne montre plus DES lignes, mais LEUR résumé.</div>"},
{"t": "Bases de données et SQL (Terminale)", "q": "La jointure JOIN ... ON sert à :", "c": ["sauvegarder les tables", "trier deux tables ensemble", "RECOUDRE les lignes de deux tables via la clé étrangère (chaque ligne retrouve la ligne qu'elle référence)", "supprimer les doublons"], "a": 2, "e": "Le modèle relationnel découpe pour éviter la redondance : la jointure recoud À LA DEMANDE : livres JOIN auteurs ON livres.id_auteur = auteurs.id rend chaque livre avec SON auteur.", "d": "<b>La couture des tables</b> : JOIN, l'essence du relationnel.<div class='ex-detail'><u>Exemple rédigé</u> : le déroulé : livres (1, 'Nuit', 3), (2, 'Matin', 7) : auteurs (3, 'Hugo'), (7, 'Sand') : SELECT livres.titre, auteurs.nom FROM livres JOIN auteurs ON livres.id_auteur = auteurs.id : le moteur : pour 'Nuit' (id_auteur=3), chercher auteurs.id=3 ⟹ 'Hugo' : COLLER les deux : idem pour 'Matin'-'Sand' : résultat : ('Nuit','Hugo'), ('Matin','Sand') (!!) : les angles : 1. SANS ON : JOIN sans condition = produit CROISÉ (2×2 = 4 lignes, 'Nuit'-'Sand' n'importe quoi !!) : 2. jointure interne : une ligne sans correspondance DISPARAÎT (livre avec auteur inexistant !) : LEFT JOIN la garde (nom ⟹ NULL) : la philosophie : la base a coupé les liens pour économiser l'espace et la cohérence — la jointure les re-tisse à chaque lecture : c'est le geste SQL quotidien par excellence.</div>"},
{"t": "Bases de données et SQL (Terminale)", "q": "UPDATE livres SET annee = 1998 — sans WHERE :", "c": ["demande confirmation au SGBD", "affiche les lignes", "modifie TOUTES les lignes de la table (l'année de CHAQUE livre devient 1998 !) — le WHERE n'est jamais optionnel en pratique", "ne fait rien"], "a": 2, "e": "Sans WHERE, l'UPDATE s'applique à CHAQUE ligne — aucune confirmation, aucun retour arrière natif : TOUJOURS écrire (et tester !) le WHERE avant de lancer un UPDATE/DELETE.", "d": "<b>La table entière repeinte</b> : l'UPDATE sans filtre, la faute fatale.<div class='ex-detail'><u>Exemple rédigé</u> : le drame en direct : 5000 livres, des années allant de 1450 à 2024 : UPDATE livres SET annee = 1998 (le WHERE est oublié !) : le SGBD obéit SANS PRÉVENIR : les 5000 lignes passent à 1998 — 570 ans d'histoire effacés en 2 ms (!!!) : le même sort pour DELETE FROM livres (sans WHERE : table VIDÉE !) : les bonnes pratiques professionnelles : 1. écrire le WHERE AVANT le SET (le réflexe !) : 2. tester le filtre : SELECT * FROM livres WHERE ... et VÉRIFIER les lignes touchées : 3. si le SGBD le permet, transaction : UPDATE ... puis COMMIT seulement après vérification (ROLLBACK sinon !) : la devise : « le WHERE se teste en SELECT d'abord » — 10 secondes de précaution contre des heures de restauration de sauvegarde.</div>"},
{"t": "Bases de données et SQL (Terminale)", "q": "Dans livres(id, titre, annee, id_auteur), l'attribut id_auteur est :", "c": ["un index d'affichage", "la clé primaire de livres", "une clé ÉTRANGÈRE : sa valeur doit exister comme clé primaire dans auteurs (le lien entre les tables)", "un attribut calculé"], "a": 2, "e": "La clé étrangère matérialise la relation 1-n : chaque valeur doit référencer une ligne EXISTANTE (intégrité référentielle : le SGBD refuse un auteur inexistant !).", "d": "<b>Le lien garanti</b> : la clé étrangère, ambassadrice d'une autre table.<div class='ex-detail'><u>Exemple rédigé</u> : le contrat vécu : INSERT INTO livres (titre, annee, id_auteur) VALUES ('Bug', 2020, 99) — or auteurs ne contient PAS d'id 99 : le SGBD REFUSE ( FOREIGN KEY constraint failed !) : impossible de créer un livre « orphelin » (!!) : la vie du lien : un auteur, plusieurs livres : id_auteur répété côté livres (3, 3, 3...) : jamais l'inverse (une clé primaire unique !) : donc la relation 1-n porte l'étrangère côté n : les requêtes qui en découlent : « les livres de Hugo » ⟹ WHERE id_auteur = 3, ou via jointure sur le nom : les erreurs de conception type : stocker le NOM de l'auteur dans livres ('Hugo' × 500 !!) : redondance, fautes de frappe divergentes ('Hugo'/'hugo' : deux auteurs fantômes !), correction en 500 endroits : le petit entier qui pointe règle tout — l'économie fondamentale du relationnel.</div>"},
{"t": "Bases de données et SQL (Terminale)", "q": "La requête SELECT DISTINCT id_auteur FROM livres donne :", "c": ["un comptage", "la liste des auteurs ayant écrit au moins un livre, DÉDOUBLONNÉE (chaque valeur une seule fois)", "une erreur", "toutes les lignes"], "a": 1, "e": "DISTINCT élimine les doublons du résultat : 500 livres mais 40 auteurs distincts ⟹ 40 lignes : l'outil des « listes uniques » (combien de valeurs différentes ? !).", "d": "<b>La liste sans répétition</b> : DISTINCT, le dédoublonneur.<div class='ex-detail'><u>Exemple rédigé</u> : le besoin : « quels auteurs sont présents dans la bibliothèque ? » : la requête naïve SELECT id_auteur FROM livres rend 500 lignes avec 3 répété 60 fois (!!) : SELECT DISTINCT id_auteur FROM livres : le SGBD collecte, TRIE implicitement, éjecte les répétitions ⟹ 40 lignes, une par auteur (!) : les combinés utiles : SELECT COUNT(DISTINCT id_auteur) FROM livres ⟹ « combien d'auteurs différents ? » en une requête (!!) : la nuance : DISTINCT s'applique à la LIGNE ENTIÈRE du résultat (sur 2 colonnes : les PAIRES uniques !) : la lecture : SELECT ⟺ « quelles colonnes », DISTINCT ⟺ « lignes uniques », WHERE ⟺ « quelles lignes » : chaque mot-clé a son métier — la requête SQL est une petite phrase grammaticale.</div>"},
{"t": "Bases de données et SQL (Terminale)", "q": "Dans le modèle relationnel, éviter de stocker le nom de l'auteur dans la table livres sert à :", "c": ["accélérer le tri", "gagner du temps d'écriture", "éliminer la REDONDANCE : le nom vit une seule fois (dans auteurs), la correction se fait en UN endroit, aucune divergence possible", "crypter les données"], "a": 2, "e": "Dupliquer le nom 500 fois : place perdue, fautes divergentes ('Hugo'/'hugo' !), correction en 500 endroits : la clé étrangère stocke un entier, le nom vit une fois : cohérence garantie par construction.", "d": "<b>Une seule source de vérité</b> : la victoire anti-redondance.<div class='ex-detail'><u>Exemple rédigé</u> : le cauchemar dupliqué : la table unique livres(titre, annee, nom_auteur) : 'Hugo' apparaît 60 fois, parfois 'hugo', parfois 'V. Hugo' (!!) : les requêtes sont impossibles à écrire proprement (WHERE nom = 'Hugo' rate la moitié !) : l'orthographe change ? 60 UPDATE... ou un oubli : deux auteurs fantômes coexistent : la version normalisée : le nom vit dans auteurs (UNE ligne !) : livres stocke 3 (l'entier !) : la correction : UPDATE auteurs SET nom = 'Hugo, Victor' WHERE id = 3 — UNE ligne, et les 500 livres sont à jour (!!!) : le coût : une jointure à chaque lecture (JOIN ... ON !) — largement remboursé par la cohérence : c'est le pari gagnant du modèle relationnel de Codd (1970 !) : NE JAMAIS écrire deux fois la même information : la base est le gardien de la vérité unique.</div>"},
{"t": "Bases de données et SQL (Terminale)", "q": "Pour ajouter une ligne dans une table :", "c": ["SELECT ... WHERE", "INSERT INTO table (colonnes) VALUES (valeurs)", "ADD ROW", "UPDATE ... SET"], "a": 1, "e": "INSERT INTO ajoute des enregistrements : les colonnes citées reçoivent les valeurs dans l'ordre : la clé primaire est fournie (ou auto-incrémentée !), les contraintes (unique, étrangère !) sont vérifiées AVANT l'insertion.", "d": "<b>La naissance d'un enregistrement</b> : INSERT, l'écriture au monde.<div class='ex-detail'><u>Exemple rédigé</u> : l'insertion complète : INSERT INTO livres (titre, annee, id_auteur) VALUES ('Nuit', 1998, 3) : les vérifications du SGBD AVANT d'écrire : id auto-généré (non nul, unique ✓ !) : titre fourni ✓ : id_auteur = 3 existe dans auteurs (sinon REFUS !) : tout passe ⟹ la ligne naît à la fin de la table (!) : les variantes : plusieurs lignes d'un coup : VALUES (...), (...), (...) : colonnes omises ⟹ NULL (ou la valeur par défaut !) : la famille complète des écritures : INSERT (ajouter !), UPDATE ... SET ... WHERE (modifier, le WHERE pour CIBLER !), DELETE ... WHERE (retirer, le WHERE pour ne pas TOUT retirer !!) : et toujours la même discipline : le WHERE des UPDATE/DELETE se teste en SELECT d'abord — le réflexe du professionnel qui dort bien.</div>"},
{"t": "Bases de données et SQL (Terminale)", "q": "Un SGBD (SQLite, MySQL, PostgreSQL...) apporte notamment :", "c": ["un éditeur de texte", "un langage de programmation complet", "la GESTION du stockage et des contraintes d'intégrité (clés uniques, références valides), l'optimisation des requêtes, l'accès concurrent aux données", "un navigateur web"], "a": 2, "e": "Le SGBD garde la cohérence (refus des doublons de clés, des références cassées !), traduit et optimise le SQL (choisir les index !), gère plusieurs utilisateurs à la fois : l'application ne réinvente rien de tout ça.", "d": "<b>Le gardien professionnel</b> : le SGBD, garant de la vérité.<div class='ex-detail'><u>Exemple rédigé</u> : les services rendus, en situation : 1. INTÉGRITÉ : deux vendeurs enregistrent en même temps le même id de commande : le SGBD refuse le doublon (UNIQUE !) — sans lui, la discipline humaine seule, donc... les doublons (!!) : 2. OPTIMISATION : SELECT ... WHERE id_auteur = 3 : le SGBD utilise l'INDEX (pas de balayage des millions de lignes : quelques sauts !) : 3. CONCURRENCE : mille requêtes simultanées sans mélange (transactions !) : 4. DURABILITÉ : le crash de midi ? La sauvegarde du journal redresse la base (!) : la conséquence pour le codeur : l'application NE VÉRIFIE PLUS RIEN elle-même (refuser un id fantôme ? c'est le SGBD qui le fait !) : programmer AVEC le SGBD (déclarer les contraintes !) plutôt que contre lui (vérifications en Python dispersées !) — la base n'est pas un fichier : c'est un huissier de justice des données.</div>"},
{"t": "Graphes et plus courts chemins (Terminale)", "q": "Dans un graphe NON orienté, la matrice d'adjacence est :", "c": ["nulle sur la diagonale uniquement", "SYMÉTRIQUE (M[i][j] = M[j][i] : l'arête va dans les deux sens !)", "triangulaire", "remplie au hasard"], "a": 1, "e": "Une arête i-j relie i à j ET j à i : la matrice l'inscrit deux fois symétriquement : dans un graphe ORIENTÉ en revanche, M[i][j] ≠ M[j][i] en général !", "d": "<b>Le miroir de la matrice</b> : symétrie = non orienté.<div class='ex-detail'><u>Exemple rédigé</u> : le petit graphe : A relié à B (non orienté !) : M[A][B] = 1 ET M[B][A] = 1 — la symétrie est l'empreinte de la bidirectionnalité (!) : le contre-exemple orienté : « A suit B » (réseau social !) : M[A][B] = 1 mais M[B][A] = 0 (B ne suit pas A !) — la matrice n'est PLUS symétrique : les tests rapides : orienté ? regarder UNE paire : si un seul sens est à 1 ⟹ orienté (!!) : les conséquences pratiques : parcours non orienté : le voisin de mon voisin, c'est moi (le parcours doit sauter le sommet D'ORIGINE sinon il repart en arrière... les marqués visités gèrent ça !) : orienté : les chemins sont à sens unique (A→B n'implique rien pour le retour !) : la symétrie de la matrice n'est pas un détail : c'est la signature de la NATURE du graphe — la question qui ouvre tout exercice.</div>"},
{"t": "Graphes et plus courts chemins (Terminale)", "q": "Pour un graphe de 1000 sommets où chacun n'a que ~3 voisins, la meilleure représentation :", "c": ["la matrice 1000×1000", "une liste d'entiers", "une chaîne de caractères", "le DICTIONNAIRE de voisinage {sommet: [voisins]} — la matrice serait remplie à 0,3 % (gaspillage !)"], "a": 3, "e": "Matrice : 1 000 000 de cases pour ~3000 arêtes (99,7 % de zéros !) : dictionnaire : 3000 voisins listés, énumération immédiate : la règle : dense ⟹ matrice (test O(1) !) : clairsemé ⟹ dictionnaire.", "d": "<b>Le dictionnaire</b> : l'économie des graphes clairsemés.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul de place : matrice : 1000 lignes × 1000 colonnes = 10^6 cases (4 Mo en entier !) dont 997 000 zéros INUTILES : dictionnaire : {'Paris': ['Lyon', 'Lille', 'Rouen'], 'Lyon': ['Paris', 'Marseille', 'Nîmes'], ...} — 3000 noms au total, ~30 ko (!!!) : les temps d'accès : « i et j sont-ils reliés ? » : matrice M[i][j] en 1 opération (sa force !) : dictionnaire : j in g[i] (recherche dans ~3 éléments : quasi immédiat aussi !) : « quels sont les voisins de i ? » : dictionnaire g[i] DIRECT : matrice : balayer n cases pour trouver les 1 (!) — le parcours de graphe passe sa vie à énumérer des voisins ⟹ le dictionnaire gagne partout en clairsemé : la carte routière, le réseau social, le web : tous clairsemés (chacun ne connaît que quelques milliards de... non, quelques dizaines !) — d'où la représentation reine des réseaux réels.</div>"},
{"t": "Graphes et plus courts chemins (Terminale)", "q": "Le parcours en largeur (BFS) depuis un sommet permet d'obtenir :", "c": ["les poids maximaux", "les DISTANCES en nombre d'arêtes et les plus courts chemins (via le parent noté à la première visite !)", "le tri des sommets", "la liste des cycles"], "a": 1, "e": "La file traite les sommets par distance croissante : le premier contact avec un sommet se fait par un plus court chemin — noter le parent à ce moment reconstruit le chemin optimal à reculons !", "d": "<b>La distance offerte par la file</b> : BFS, le télémètre du graphe.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve par l'étage : la file enfile d'abord la source (dist. 0), puis ses voisins (dist. 1), puis les voisins des voisins (dist. 2)... TOUS les sommets à distance k sortent AVANT tout sommet à distance k+1 (!!) — c'est la discipline FIFO : conséquence : quand X est visité pour la première fois, c'est par un chemin de longueur minimale (tout ce qui est plus court est déjà passé !) : la reconstruction : parent[X] = le sommet d'où on l'a atteint : A → B (père A) → X (père B) : le chemin se lit à reculons X, B, A (!!) : l'application : le nombre minimal d'intermédiaires entre deux personnes (les « 6 degrés de séparation » !), le nombre minimal de coups aux échecs, le plus petit nombre de changements de bus : MAIS l'alerte : BFS mesure en ARÊTES — dès qu'un PRIX entre en jeu (km, minutes, péages !), il faut Dijkstra !</div>"},
{"t": "Graphes et plus courts chemins (Terminale)", "q": "La différence de structure entre BFS et DFS :", "c": ["BFS utilise une FILE (étage par étage), DFS une PILE ou la récursivité (plonger au plus loin, revenir)", "aucune", "BFS est récursif uniquement", "DFS utilise une file"], "a": 0, "e": "Le BFS élargit un cercle (frontière par frontière — la file !) : le DFS s'enfonce dans un couloir jusqu'au bout, remonte, prend le suivant (la pile !) : même complexité, explorations très différentes — et usages différents !", "d": "<b>Cercle ou couloir</b> : file contre pile, deux explorations.<div class='ex-detail'><u>Exemple rédigé</u> : le même labyrinthe, deux stratégies : BFS : explorer TOUTES les cases à 1 pas, puis à 2 pas, puis 3... — une nappe d'huile qui avance en cercle (!) : garantit le PLUS COURT chemin (premier contact = optimal !) : DFS : foncer dans un couloir jusqu'au mur, revenir au dernier embranchement, foncer ailleurs — l'explorateur d'une seule passion (!!) : trouve un chemin (pas forcément court !) mais excelle à : détecter les CYCLES (un sommet EN COURS de visite re-rencontré = cycle !!), trier des tâches dépendantes (tri topologique !), explorer les configurations (backtracking !) : le tableau de décision : « plus court chemin sans poids ? » ⟹ BFS : « existe-t-il un chemin ? des cycles ? » ⟹ DFS (ou BFS, les deux atteignent tout si connexe !) : les deux en O(S+A) avec le marquage visité — la structure de contrôle (file/pile !) EST la stratégie.</div>"},
{"t": "Graphes et plus courts chemins (Terminale)", "q": "Dans l'algorithme de Dijkstra, à chaque tour on fixe :", "c": ["le sommet de plus grand degré", "le sommet NON ENCORE FIXÉ de plus petite distance provisoire (sa distance devient définitive), puis on relâche ses arcs", "tous les sommets d'un coup", "un sommet au hasard"], "a": 1, "e": "Le paradigme glouton : le plus proche devient certain (poids positifs : aucun détour ne peut l'améliorer !) : puis on met à jour les voisins : d[v] = min(d[v], d[u] + poids) : répéter jusqu'à tout fixer.", "d": "<b>Le glouton certifié</b> : le petit provisoire devient grand définitif.<div class='ex-detail'><u>Exemple rédigé</u> : le tour de magie expliqué : pourquoi peut-on FIXER ? parce que tous les poids sont POSITIFS : si le sommet u a la plus petite distance provisoire, tout autre chemin vers u passerait par un sommet déjà PLUS LOIN (fixé plus tard !) puis ajouterait des poids positifs ⟹ forcément PIRE (!!) — la preuve tient en deux lignes : le relâchement qui suit : pour chaque voisin v : si d[u] + poids(u,v) &lt; d[v] : d[v] = d[u] + poids(u,v) ET parent[v] = u (noter le père : le chemin se reconstruira !) : la mécanique d'ensemble : une frontière de sommets « provisoires » qui se rétrécit, un tableau qui ne fait que DIMINUER : à la fin, chaque d[] est minimal ET le parent donne l'itinéraire : l'implémentation efficace : une file de priorité (tas !) donne le plus petit provisoire en O(log n) — le GPS dans votre téléphone exécute des variantes de cet algorithme, des millions de fois par jour (!).</div>"},
{"t": "Graphes et plus courts chemins (Terminale)", "q": "L'algorithme de Dijkstra ne fonctionne pas si :", "c": ["il y a plus d'arêtes que de sommets", "des poids sont NÉGATIFS (un détour « bonus » pourrait raccourcir un chemin déjà fixé — la preuve d'optimalité s'effondre !)", "le graphe a plus de 3 sommets", "le graphe est connexe"], "a": 1, "e": "La preuve de Dijkstra suppose : passer par plus de sommets ne peut que RALLONGER (poids positifs !) : une arête négative brise cette hypothèse — un sommet déjà « fixé » pourrait être amélioré en passant par l'arête bonus !", "d": "<b>Le bonus qui casse la preuve</b> : pourquoi négatif ⟹ interdit.<div class='ex-detail'><u>Exemple rédigé</u> : le contre-exemple minimal : A→B : poids 5 : B→C : poids -7 : A→C direct : poids 2 : Dijkstra fixe A (0) : relâche : d(B) = 5, d(C) = 2 : fixe C (2 !) — définitif ? PAS DU TOUT (!!) : fixe B (5) : relâche B→C : d(C) = min(2, 5 + (-7)) = -2 : la distance de C, DÉJÀ FIXÉE À 2, tombe à -2 : la garantie est morte (le sommet fixé n'était pas optimal !!) : la parade (hors programme mais à CITER) : Bellman-Ford, qui ne fixe rien et REPASSE les relâchements (n-1 fois !) jusqu'à stabiliser : l'intuition du monde réel : les poids négatifs modélisent des GAINS (profits, remises !) — les réseaux routiers, eux, n'ont JAMAIS de distance négative : c'est pourquoi Dijkstra suffit au GPS : l'algorithme n'est pas « magique » : il repose sur une HYPOTHÈSE — la vérifier, c'est la moitié du travail d'informaticien.</div>"},
{"t": "Graphes et plus courts chemins (Terminale)", "q": "Dans un parcours (BFS ou DFS), ne pas marquer les sommets visités provoque :", "c": ["un tri automatique", "un résultat trié", "une liste triée", "une BOUCLE INFINIE (on revisite sans cesse les mêmes voisins : A→B→A→B...)"], "a": 3, "e": "Sans le marquage, tout voisin est ré-enfilé/réempilé indéfiniment (chaque voisin nous renvoie l'un l'autre !) : le tableau des visités est LE garde-fou de tout parcours de graphe — O(S+A) devient éternité !", "d": "<b>Le trottinet sans fin</b> : le marquage, condition de survie du parcours.<div class='ex-detail'><u>Exemple rédigé</u> : la catastrophe inanimée : A et B reliés : parcours depuis A sans marquage : enfiler A : défiler A, enfiler B : défiler B, ses voisins : ... A (!!) : défiler A : re-enfiler B : défiler B : re-enfiler A... la file ne se vide JAMAIS — chaque visite re-fabrique les visites précédentes (!!!) : avec le marquage : vus = {A} : défiler A ⟹ enfiler B (non vu !) : vus = {A, B} : défiler B ⟹ voisins : A DÉJÀ VU, on passe (!) : file vide : terminé — chaque sommet et chaque arête traités UNE SEULE fois : le coût O(S + A) dépend ENTIÈREMENT de cette discipline : la bonne implémentation : marquer À L'ENFILAGE (pas à la visite !) sinon un sommet peut être enfilé deux fois avant d'être visité (la file double !) — un détail d'implémentation qui distingue le code qui tourne du code qui sature.</div>"},
{"t": "Graphes et plus courts chemins (Terminale)", "q": "Le « degré » d'un sommet :", "c": ["le nombre de chemins vers lui", "sa distance à la racine", "son numéro d'ordre", "le NOMBRE d'arêtes qui le touchent (voisins !)"], "a": 3, "e": "Le degré compte les voisins directs : un graphe connexe à n sommets a au moins n-1 arêtes (la somme des degrés = 2 × nombre d'arêtes !) : le degré mesure la « sociabilité » du sommet.", "d": "<b>Le compteur de voisins</b> : le degré, la sociabilité d'un sommet.<div class='ex-detail'><u>Exemple rédigé</u> : la lecture et le théorème : dans le graphe des livres (A-B, A-C, B-D !) : degré(A) = 2 (B et C !), degré(B) = 2, degré(C) = 1, degré(D) = 1 : la sommet de la somme : 2+2+1+1 = 6 = DEUX FOIS le nombre d'arêtes (chaque arête touche DEUX sommets — comptée deux fois !!) : Σ degrés = 2A : la trousse à outils qui en découle : « le graphe a-t-il un cycle ? » — si A ≥ S (arêtes ≥ sommets !) : oui obligatoirement : « combien d'arêtes max sans cycle ? » — S-1 (un ARBRE !) : le « lemme des poignées de mains » : un graphe a toujours un nombre PAIR de sommets de degré IMPAIR (la somme doit être paire : 2A !) — d'où l'impossibilité du « graphe à exactement 1 sommet de degré impair » (!!) : le degré n'est pas un simple comptage : c'est l'entrée des premiers théorèmes de la théorie des graphes.</div>"},
{"t": "Graphes et plus courts chemins (Terminale)", "q": "Sur un graphe pondéré (arêtes de poids variés), trouver le plus court chemin exige :", "c": ["un tri préalable", "DIJKSTRA (BFS ne mesure que le NOMBRE d'arêtes : un chemin de 2 arêtes longues peut être pire qu'un chemin de 3 arêtes courtes !)", "le BFS classique", "le DFS"], "a": 1, "e": "BFS optimise le NOMBRE d'étapes, pas le POIDS : dès que les arêtes valent différemment (km, minutes, coût !), il faut Dijkstra (distances provisoires, fixer/relâcher !) : BFS = Dijkstra avec tous les poids à 1.", "d": "<b>Étapes contre poids</b> : pourquoi BFS se déclarent insuffisant en pondéré.<div class='ex-detail'><u>Exemple rédigé</u> : le trajet qui ridiculise le comptage : A-B : 100 km : A-C : 40 km : C-D : 40 km : B-D : 100 km : le BFS (2 étapes !) choisit A-B-D : 200 km (!!!) : le vrai optimum : A-C-D : 3 arêtes... mais 80 km — DEUX FOIS PLUS COURT (!!) : le BFS a fixé D à « distance 2 » via B et n'a jamais regardé C (distance 2 aussi... mais via des arêtes longues !) : l'ordre de la file (par étages !) ne correspond PLUS à l'ordre des poids — tout l'édifice BFS s'effondre en pondéré : Dijkstra, lui, fixe B d'abord (40 ? non : comparons : d(B)=100, d(C)=40 ⟹ fixe C !), puis relâche, puis... et trouve 80 (!) : la phrase à retenir : « BFS compte les SAUTS, Dijkstra compte les PRIX » — choisir l'algorithme, c'est d'abord nommer ce qu'on optimise.</div>"},
{"t": "Graphes et plus courts chemins (Terminale)", "q": "Modéliser un problème par un graphe signifie :", "c": ["choisir ce que représentent les SOMMETS, les ARÊTES (et éventuellement les POIDS) — la modélisation guide tout le reste (carte : villes/routes/km : dépendances : tâches/arcs !)", "le dessiner joliment", "le trier par ordre alphabétique", "le stocker dans une base de données"], "a": 0, "e": "La question fondatrice : « qui est un sommet ? qui est une arête ? quel poids ? » : villes et routes (km !), personnes et liens (1 !), tâches et précédences (arcs orientés !) : la modélisation EST le cœur de l'exercice — l'algorithme suit.", "d": "<b>La traduction première</b> : modéliser, l'acte fondateur.<div class='ex-detail'><u>Exemple rédigé</u> : le même réseau, trois modélisations selon la question : 1. « plus courte distance en km ? » ⟹ sommets = villes, arêtes = routes, POIDS = kilomètres ⟹ Dijkstra (!) : 2. « combien de changements d'avion MINIMUM ? » ⟹ poids = 1 partout (compter les SAUTS !) ⟹ BFS suffit (!!) : 3. « dans quel ordre exécuter les tâches ? » ⟹ sommets = tâches, ARCS ORIENTÉS = précédences (B doit suivre A !) ⟹ tri topologique (DFS !) : l'art du modèle : changer la question change le graphe — l'informaticien ne « subit » pas le problème, il le TRADUIT dans la langue où il devient calculable : les exemples historiques : les 7 ponts de Königsberg (Euler !), le web (PageRank : sommets = pages, arcs = liens !), les réseaux sociaux (communautés !) : chaque grand problème contemporain est d'abord UN GRAPHE — le reste n'est que parcours.</div>"},
{"t": "Diviser pour régner et programmation dynamique (Terminale)", "q": "Les trois étapes du paradigme « diviser pour régner » :", "c": ["copier, coller, sauver", "trier, chercher, compter", "lire, écrire, fermer", "DIVISER en sous-problèmes, RÉGNER (résoudre récursivement), COMBINER les solutions"], "a": 3, "e": "Diviser (souvent en 2 !), régner (jusqu'au cas trivial !), combiner (fusion du tri fusion : le poste de coût !) : dichotomie, tri fusion, exponentiation rapide suivent tous ce plan.", "d": "<b>Le trio sacré</b> : diviser, régner, combiner.<div class='ex-detail'><u>Exemple rédigé</u> : le plan appliqué aux deux classiques : RECHERCHE DICHOTOMIQUE : diviser : la moitié utile (une seule branche !) : régner : chercher dedans : combiner : RIEN (la réponse remonte telle quelle !) ⟹ T(n) = T(n/2) + O(1) ⟹ O(log n) (!) : TRI FUSION : diviser : deux moitiés : régner : trier chaque moitié : combiner : FUSIONNER en O(n) ⟹ T(n) = 2T(n/2) + O(n) ⟹ O(n log n) (!!) : l'observation décisive : le coût du paradigme dépend presque toujours du COMBINER — dichotomie ne combine rien (d'où sa finesse en log n !), fusion recombine tout (d'où le facteur n !) : la grille d'examen : citer les trois étapes pour l'algorithme proposé, écrire la récurrence T(n), conclure sur la complexité — trois réflexes, toutes les questions du bac.</div>"},
{"t": "Diviser pour régner et programmation dynamique (Terminale)", "q": "La complexité du tri fusion est :", "c": ["O(log n) seulement", "O(n log n) — garantie même au pire cas (log2(n) étages de fusion à O(n) chacun !)", "O(n²)", "O(n)"], "a": 1, "e": "T(n) = 2·T(n/2) + O(n) : chaque étage divise par 2 (log n étages !) et chaque étage fusionne en O(n) ⟹ n log n : et cette borne est GARANTIE, quel que soit l'ordre initial !", "d": "<b>O(n log n) garanti</b> : la promesse du fusion, sans condition.<div class='ex-detail'><u>Exemple rédigé</u> : le décompte des étages : 8 éléments ⟹ 3 étages : étage 3 : 4 fusions de 2 : étage 2 : 2 fusions de 4 : étage 1 : 1 fusion de 8 : chaque étage COÛTE 8 (tous les éléments passent une fois !) ⟹ 3 × 8 = 24 ≈ n log2(n) (!!) : le contraste avec le quicksort (l'autre grand tri D&C !) : fusion : O(n log n) TOUJOURS (sa force !) : quicksort : O(n log n) en moyenne MAIS O(n²) si les pivots tombent mal (déjà trié !) — sa faiblesse : et le MUR THÉORIQUE : aucun tri PAR COMPARAISON ne peut battre O(n log n) en pire cas (l'argument : log2(n!) ≈ n log n ordres possibles à distinguer !) : le fusion est donc OPTIMAL à une constante près — pas une astuce : une limite de la nature.</div>"},
{"t": "Diviser pour régner et programmation dynamique (Terminale)", "q": "Fusionner [2, 8, 9] et [1, 5, 10] : la première valeur prise est :", "c": ["8", "9", "2", "1 (la plus petite des deux têtes : on avance dans la liste de droite)"], "a": 3, "e": "La fusion compare les deux TÊTES (2 vs 1) et prend la plus petite (1 !) : le duel se poursuit (2 vs 5 ⟹ 2...) : le riffle de deux paquets triés — O(n-1) comparaisons max !", "d": "<b>1</b> : le duel des têtes commence par le plus léger.<div class='ex-detail'><u>Exemple rédigé</u> : la fusion complète en duel : 2 vs 1 ⟹ 1 (droite avance !) : 2 vs 5 ⟹ 2 : 8 vs 5 ⟹ 5 : 8 vs 10 ⟹ 8 : 9 vs 10 ⟹ 9 : gauche épuisée ⟹ VERSER 10 : résultat [1,2,5,8,9,10] en 5 comparaisons (!) : l'invariant de la fusion : « le résultat est trié ET contient les plus petits éléments déjà pris » — chaque prise est la plus petite DES RESTANTS (les têtes sont les plus petites de leurs listes !) : les cas limites : une liste vide ⟹ retourner l'autre telle quelle : l'erreur classique : oublier le VERSEMENT final (la queue non vidée !) ⟹ résultat TRONQUÉ (!!) : la fusion est le cœur battant du tri fusion : triée par cœur, elle s'écrit en 8 lignes.</div>"},
{"t": "Diviser pour régner et programmation dynamique (Terminale)", "q": "L'exponentiation rapide calcule x^n en :", "c": ["O(1)", "O(n²)", "O(n)", "O(log n) : x^n = (x^(n/2))² — l'exposant est divisé par 2 à chaque étage (2^1000 : ~11 multiplications !)"], "a": 3, "e": "La récurrence T(n) = T(n/2) + O(1) : diviser l'exposant ⟹ log2(n) étages : le cas impair ajoute UN x (x^5 = (x^2)² × x !) : de 1000 multiplications à 11 — l'application dichotomique au calcul !", "d": "<b>Eleven coups pour mille</b> : l'exposant qui fond par deux.<div class='ex-detail'><u>Exemple rédigé</u> : le code complet : def expo(x, n): if n == 0: return 1 : demi = expo(x, n // 2) : if n % 2 == 0: return demi * demi : return demi * demi * x — la trace de 2^10 : demi = 2^5 : demi = 2^2 : demi = 2^1 : demi = 2^0 = 1 (BASE !) : remontée : 2, 4, 32, 1024 — 4 étages, 5 multiplications (!!) : l'oubli fatal : le cas IMPAIR (demi × demi × x — sans le × x, 2^5 = 16 FAUX !) : la portée réelle : la cryptographie RSA élève des nombres à des exposants de 1000 chiffres (2^3000 étages impossibles !... 3000 bits ⟹ ~3000 multiplications AVEC la méthode rapide !) : sans elle, aucun HTTPS, aucune carte bancaire — l'algorithmique pure qui rend le monde moderne calculable (!).</div>"},
{"t": "Diviser pour régner et programmation dynamique (Terminale)", "q": "La programmation dynamique se justifie par rapport au diviser-pour-régner quand :", "c": ["les sous-problèmes se CHEVAUCHANT (recalculs massifs !) : on les calcule une fois et on les réutilise (mémoïsation ou bottom-up !)", "il n'y a pas de récursion possible", "les données sont triées", "le problème est trop petit"], "a": 0, "e": "Le test de l'arbre d'appels : branches DISJOINTES (fusion !) ⟹ D&C pur : branches qui se REJOIGNENT (Fibonacci : fib(3) servi par plusieurs parents !) ⟹ dynamique : le cache (ou le tableau !) élimine les recalculs.", "d": "<b>Le chevauchement, sésame de la dynamique</b> : quand les branches se rejoignent.<div class='ex-detail'><u>Exemple rédigé</u> : le même arbre, deux regards : TRI FUSION : l'arbre d'appels sur [8,2,9,1] : gauche [8,2], droite [9,1] — AUCUN élément en commun : les branches ne se touchent JAMAIS : rien à cacher, tout à FUSIONNER (le coût est dans la recombinaison !) : FIBONACCI : fib(5) ⟹ fib(4) + fib(3), et fib(4) ⟹ fib(3) + fib(2)... fib(3) apparaît DEUX fois, fib(2) trois fois — les branches SE REJOIGNENT (!!) : chaque rejointure est un RECALCUL : la dynamique l'interdit : mémoïsation (top-down : le cache se remplit à la demande !) : bottom-up (le tableau f[0], f[1], f[2]... se remplit dans l'ordre des dépendances, CHAQUE case UNE fois !) : fib(50) : des milliards d'appels ⟹ 50 cases (!!!) : le diagnostic en une question : « mon arbre d'appels a-t-il des nœuds communs ? » — oui ⟹ dynamique : non ⟹ D&C + combiner.</div>"},
{"t": "Diviser pour régner et programmation dynamique (Terminale)", "q": "Fibonacci bottom-up (f[i] = f[i-1] + f[i-2], en remplissant de 2 à n) est préférable à la version récursive naïve parce que :", "c": ["il n'utilise pas de variables", "il est plus court", "chaque sous-problème est calculé UNE SEULE fois dans le BON ordre (O(n)) — le naïf recalcule fib(k) en O(1,6^n) appels", "il trie les valeurs"], "a": 2, "e": "Le bottom-up remplit le tableau dans l'ordre des DÉPENDANCES (f[2] a besoin de f[1] et f[0] : déjà là !) : chaque case coûte O(1), n cases ⟹ O(n) : contre le naïf : fib(3) recalculé des dizaines de fois — l'explosion de l'arbre !", "d": "<b>L'apprentissage ordonné</b> : le tableau qui ne se répète jamais.<div class='ex-detail'><u>Exemple rédigé</u> : les deux courses comparées sur fib(6) : NAÏF : appels fib(5), fib(4), fib(3) (2×), fib(2) (3×), fib(1) (5×), fib(0) (3×) — 15 appels pour 7 valeurs, et l'écart EXPLOSE (fib(40) : 331 millions d'appels !!) : BOTTOM-UP : f[0]=0, f[1]=1 : f[2] = 1 (ses deux dépendances sont PRÊTES !), f[3] = 2, f[4] = 3, f[5] = 5, f[6] = 8 — 6 additions, point final (!!) : l'optimisation d'espace : la récurrence ne regarde que 2 cases en arrière ⟹ deux variables (a, b = b, a+b) suffisent — O(n) temps, O(1) mémoire (!) : la transposition de l'esprit : le bottom-up transforme « la récursion qui redemande tout » en « la progression qui ne répond qu'une fois » — c'est la mécanique intérieure des sacs à dos, des distances d'édition et des alignements génétiques (!).</div>"},
{"t": "Diviser pour régner et programmation dynamique (Terminale)", "q": "La relation de récurrence du tri fusion est :", "c": ["T(n) = 2·T(n/2) + O(n) (deux moitiés à trier + une fusion linéaire)", "T(n) = n·T(n) + 1", "T(n) = T(n/2) + O(n)", "T(n) = T(n-1) + O(1)"], "a": 0, "e": "Deux appels sur n/2 (le « 2·T(n/2) ») plus la fusion O(n) : la résolution donne O(n log n) — le facteur 2 compte (dichotomie : UNE branche ⟹ log n sans le n !).", "d": "<b>2T(n/2) + O(n)</b> : la récurrence à écrire les yeux fermés.<div class='ex-detail'><u>Exemple rédigé</u> : la lecture terme à terme : « 2 » : DEUX appels récursifs (gauche ET droite !) : « T(n/2) » : chacun sur une moitié : « + O(n) » : la FUSION des deux résultats triés (chaque élément comparé une fois !) : la résolution par étages : étage 1 : 1 fusion de n : étage 2 : 2 fusions de n/2 (= n !) : étage 3 : 4 fusions de n/4 (= n !) : ... log2(n) étages TOUS à n ⟹ n × log2(n) (!!!) : le comparatif qui fait réviser : dichotomie : T(n) = T(n/2) + O(1) (UNE branche, RIEN à combiner !) ⟹ O(log n) : fusion : T(n) = 2T(n/2) + O(n) ⟹ O(n log n) : la nuance entre les deux récurrences est L'EXERCICE standard de l'épreuve — savoir les écrire ET les résoudre, c'est la moitié des points.</div>"},
{"t": "Diviser pour régner et programmation dynamique (Terminale)", "q": "La dichotomie peut se voir comme un diviser-pour-régner dont l'étape « combiner » :", "c": ["nécessite un tri", "n'existe pas du tout dans le paradigme", "est GRATUITE (la réponse de la bonne moitié EST la réponse — rien à recombiner !)", "coûte O(n)"], "a": 2, "e": "La dichotomie ne suit QU'UNE branche (la bonne moitié !) et ne combine rien : la réponse remonte telle quelle ⟹ T(n) = T(n/2) + O(1) ⟹ O(log n) : le tri fusion, lui, suit les DEUX branches et RECOMBINE en O(n) !", "d": "<b>La combinaison offerte</b> : pourquoi la dichotomie est un D&C « de luxe ».<div class='ex-detail'><u>Exemple rédigé</u> : le tableau comparatif des deux arbres : DICHTOMIE : l'arbre d'appels est un CHEMIN (1 nœud par étage !) : à chaque étage, on jette la moitié : la réponse (l'indice trouvé !) monte TELLE QUELLE — aucun travail au retour (!) : coût : nombre d'étages = log2(n) : FUSION : l'arbre est un ARBRE COMPLET (2 nœuds par étage !) : les DEUX moitiés sont triées (on garde tout !) : au retour, il faut FUSIONNER (O(n) par étage !) : coût : log2(n) étages × n = n log n (!!) : la morale algorithmique : GARDER UNE SEULE branche ⟹ logarithme pur : garder TOUTES les branches ⟹ le facteur n s'installe : le paradigme est le même, mais l'élagage (éliminer !) contre la conservation (fusionner !) change la CLASSE de complexité — le cœur de la réflexion D&C.</div>"},
{"t": "Diviser pour régner et programmation dynamique (Terminale)", "q": "La « mémoïsation » (top-down) consiste à :", "c": ["effacer la récursion", "trier les appels", "mémoriser les entrées du programme", "STOCKER chaque résultat de sous-problème (dictionnaire !) et le retourner tel quel au lieu de recalculer"], "a": 3, "e": "Un cache : « si n dans memo ⟹ retourner » : sinon : calculer, RANGER, retourner : la récursion naïve garde sa structure (top-down !) mais jamais ne recalcule — O(1,6^n) devient O(n) !", "d": "<b>Le cache à la rescousse</b> : mémoïser, c'est refuser de redemander.<div class='ex-detail'><u>Exemple rédigé</u> : le squelette complet : def fib(n, memo=None): if memo is None: memo = { } : if n in memo: return memo[n] (DÉJÀ SU !) : if n &lt;= 1: return n : memo[n] = fib(n-1, memo) + fib(n-2, memo) (calculer PUIS RANGER !) : return memo[n] (!) : la traque du gain : fib(5, memo) : fib(4) calcule fib(3) et fib(2), range tout : fib(3) ? DÉJÀ dans memo — retour immédiat (!!) : chaque valeur calculée exactement UNE fois ⟹ n calculs : la comparaison des deux dynamiques : MÉMOÏSATION : la structure récursive reste (lisible !), le cache se remplit À LA DEMANDE (seuls les sous-problèmes UTILES sont calculés — l'avantage sur les dépendances éparses !) : BOTTOM-UP : le tableau se remplit TOUT SEUL dans l'ordre (pas de pile, pas de risque de débordement — l'avantage sur les grandes profondeurs !) : les deux sont « de la dynamique » — le choix est un style, l'économie est la même.</div>"},
{"t": "Diviser pour régner et programmation dynamique (Terminale)", "q": "Le tri fusion reste O(n log n) sur une liste déjà triée, alors que le tri par insertion devient O(n) sur ce même cas. On en conclut que :", "c": ["le fusion est un mauvais tri", "chaque tri a son terrain : le fusion est GARANTI n log n partout (robustesse !), l'insertion excelle sur le quasi-trié (adaptativité !) — l'analyse au meilleur cas guide le choix selon l'usage", "l'insertion est toujours meilleur", "le fusion est cassé sur ce cas"], "a": 1, "e": "Aucun tri ne gagne PARTOUT : fusion = la garantie (pire cas n log n, stabilité — le choix des grandes données inconnues !) : insertion = l'adaptation (O(n) si quasi trié — le choix des petites listes et des finitions !) : Timsort (Python !) combine les deux intelligemment.", "d": "<b>Garantie contre adaptation</b> : le match des analyses.<div class='ex-detail'><u>Exemple rédigé</u> : le tableau du duel sur 100 000 éléments : DÉJÀ TRIÉ : insertion : ~100 000 comparaisons (chaque élément trouve sa place en 1 regard : O(n) !) : fusion : ~1,7 million (les étages et les fusions se font QUAND MÊME !) — l'insertion gagne 17 fois (!!) : ORDRE INVERSE (le cauchemar !) : insertion : ~5 milliards (chaque élément traverse TOUTE la partie triée : O(n²) !!) : fusion : ~1,7 million — le fusion gagne 3000 fois (!!!) : AU HASARD : fusion ~1,7 M, insertion ~2,5 M : l'ingénierie réelle : Timsort (le tri de Python !) DÉTECTE les longues séquences déjà triées (l'insertion les prolonge gratuitement !) et fusionne le reste (la garantie !) : la leçon d'analyse : comparer les tris, c'est comparer des pires cas ET des terrains — l'optimal est TOUJOURS relatif aux données attendues.</div>"},
{"t": "Sécurité et cryptographie (Terminale)", "q": "Dans le chiffrement symétrique :", "c": ["la MÊME clé sert à chiffrer et à déchiffrer (le problème : comment la transmettre sans canal sûr ? !)", "il y a deux clés différentes", "il n'y a pas de clé", "le destinataire seul invente la clé"], "a": 0, "e": "Une clé unique des deux côtés (César ! AES !) : simple et rapide, MAIS il faut ÉCHANGER la clé — d'où l'asymétrique (RSA !) qui résout le paradoxe de la distribution !", "d": "<b>Une clé pour deux serrures</b> : le symétrique et son paradoxe.<div class='ex-detail'><u>Exemple rédigé</u> : la force : Alice et Bob partagent 'clesupersecrete' : chiffrer : rapide (AES ! des Go/s !), éprouvé (des décennies !) : LE paradoxe fondateur : Alice doit D'ABORD envoyer la clé à Bob... sur quel canal ? Le courrier peut être lu, le réseau écouté (!!) : si un canal sûr existait, on n'aurait pas besoin de chiffrer ! : c'est le problème de la DISTRIBUTION des clés, résolu en 1976 (Diffie-Hellman !) puis RSA (1977 !) par l'ASYMÉTRIQUE : et l'architecture gagnante du web : l'asymétrique (lent, ~1000× moins rapide !) ne sert qu'à l'OUVERTURE — échanger une clé de session — puis le SYMÉTRIQUE (rapide !) chiffre tout le flux (!!) : les deux mondes ne sont pas concurrents : ils sont les DEUX ÉTAGES de la même maison.</div>"},
{"t": "Sécurité et cryptographie (Terminale)", "q": "Le chiffre de César est facilement cassé parce que :", "c": ["il est trop ancien", "il faut deux clés", "il utilise des nombres", "l'espace des clés est minuscule (26 décalages !) : la force brute teste tout en secondes, et l'analyse de fréquences le démasque en une lettre"], "a": 3, "e": "26 clés possibles = RIEN : essayer les 26 décalages et lire le seul texte cohérent ! : et l'analyse de fréquences (le E !) accélère : la sécurité moderne exige des clés de 128 bits (2^128 ≈ 3,4 × 10^38 essais !).", "d": "<b>26 essais et puis s'en va</b> : le César, le chiffre transparent.<div class='ex-detail'><u>Exemple rédigé</u> : les deux attaques en direct : 1. FORCE BRUTE : décalages 1, 2, ..., 25 : sur « YJGCEV », un des 26 textes se lit : le décalage gagnant saute aux yeux — quelques secondes à la main (!!) : 2. FRÉQUENCES : la lettre la plus fréquente du chiffré EST probablement le E (17 % du français !) : Q dominant ⟹ Q ↔ E ⟹ décalage déduit, tout le texte tombe (!) : la mesure moderne du contraste : César : log2(26) ≈ 4,7 bits de clé : AES-128 : 128 bits : à 1 MILLIARD d'essais par seconde, casser AES-128 ≈ 10^22 années (l'Univers en a 1,4 × 10^10 !!) — au-delà de toute énergie disponible (!!!) : la leçon : la sécurité ne se décrète pas, elle se MESURE en bits d'entropie.</div>"},
{"t": "Sécurité et cryptographie (Terminale)", "q": "Une fonction de hachage cryptographique (SHA-256) est :", "c": ["un chiffrement symétrique", "à SENS UNIQUE : de l'empreinte on ne remonte PAS au message — et deux messages différents ont quasi impossible la même empreinte (collision !)", "une compression sans perte", "réversible avec la bonne clé"], "a": 1, "e": "Le hash produit une empreinte de taille fixe, irréversible, avalanche (1 bit change ⟹ tout change !) : ce n'est PAS du chiffrement (pas de déchiffrement !) : c'est l'empreinte digitale du fichier.", "d": "<b>L'empreinte à sens unique</b> : le hash, l'ADN du fichier.<div class='ex-detail'><u>Exemple rédigé</u> : les propriétés vécues : sha256('Bonjour') = empreinte A (64 hex !) : sha256('bonjour') = empreinte B TOTALEMENT différente (1 lettre de casse : avalanche complète !!) : essayer de remonter : IMPOSSIBLE par construction (la fonction ÉCRASE l'information : des milliards de messages ⟹ 256 bits — irrémédiable !) : les usages quotidiens : 1. INTÉGRITÉ : le site publie l'empreinte du fichier à télécharger : après téléchargement, l'UTILISATEUR recalcule : identique ⟹ intact, différent ⟹ corrompu ou piégé (!!) : 2. MOTS DE PASSE : la base stocke hash(mdp) : le pirate vole des empreintes... inutilisables directement (sens unique !) : la nuance capitale : hash ≠ chiffrement — on ne DÉCHIFFRE pas une empreinte, il n'y a RIEN à déchiffrer (c'est une trace, pas un message !).</div>"},
{"t": "Sécurité et cryptographie (Terminale)", "q": "Le « sel » ajouté au hachage d'un mot de passe sert à :", "c": ["accélérer le calcul", "défendre contre les TABLES ARC-EN-CIEL : le même mot de passe produit des empreintes DIFFÉRENTES selon les sites/utilisateurs (les tables précalculées deviennent inutiles !)", "donner du goût", "compresser la base"], "a": 1, "e": "Sans sel : hash('azerty') = la MÊME empreinte partout — les tables précalculées des pirates la reconnaissent instantanément (!!) : avec : hash(azerty + aléa-unique) — l'empreinte est unique, l'attaque doit TOUT recalculer un par un !", "d": "<b>Le pincée d'aléa</b> : le sel, l'ennemi des tables précalculées.<div class='ex-detail'><u>Exemple rédigé</u> : l'attaque sans sel : les tables arc-en-ciel contiennent des MILLIARDS de hash('mot courant') précalculés : la base volée est comparée : 30 % des comptes ('azerty', '123456'...) tombent EN UNE SECONDE (!!!) : la parade : utilisateur A : hash('azerty' + 'X7k9') : utilisateur B : hash('azerty' + 'm2Qp') — MÊME mot de passe, empreintes DIFFÉRENTES (!!) : la table du pirate est INUTILE (elle contenait hash('azerty') tout court, jamais les variantes salées !) : il doit attaquer UN PAR UN, chaque compte avec SON sel : et la seconde ligne de défense : les fonctions LENTES (bcrypt, Argon2 : des milliers d'itérations par essai !) — chaque tentative coûte cher, le billion d'essais devient économiquement absurde : le trio gagnant : sel unique + fonction lente + mot de passe long (et unique !) — la sécurité en profondeur, appliquée aux secrets les plus banals.</div>"},
{"t": "Sécurité et cryptographie (Terminale)", "q": "Dans le chiffrement asymétrique (RSA) :", "c": ["la clé publique déchiffre", "les deux clés sont identiques", "il n'y a qu'une clé", "la clé PUBLIQUE chiffre (donnée à tous : cadenas ouverts !) et la clé PRIVÉE déchiffre (gardée secrète : la seule clé !)"], "a": 3, "e": "Le couple public/privée : tout le monde peut CHIFFRER pour vous (votre publique est dans l'annuaire !), SEUL VOUS pouvez lire (votre privée, jamais transmise !) : le paradoxe de la distribution des clés est résolu — plus de secret à échanger AVANT !", "d": "<b>Cadenas et clé</b> : le duo asymétrique, la double vie des clés.<div class='ex-detail'><u>Exemple rédigé</u> : l'image fondatrice : la clé PUBLIQUE = une boîte de cadenas OUVERTS : quiconque veut m'écrire prend UN cadenas, y enferme sa lettre, me l'envoie (chiffrer !) : UNE FOIS fermé, PERSONNE ne peut rouvrir — pas même l'expéditeur (!!) : MA clé PRIVÉE = la seule clé qui ouvre mes cadenas : je la garde, je ne la transmets JAMAIS : la magie mathématique : les DEUX clés sont LIÉES (l'une défait ce que l'autre fait !) MAIS déduire la privée de la publique demande de FACTORISER un nombre de 600 chiffres — des siècles de calcul (!!!) : le retournement élégant (la SIGNATURE !) : je chiffre AVEC MA PRIVÉE : quiconque vérifie avec MA publique est CERTAIN que c'est MOI (elle n'ouvre QUE mes cadenas !) — prouver l'identité SANS révéler la clé : le même couple, deux usages : confidentialité (publique chiffre !) et authenticité (privée signe !).</div>"},
{"t": "Sécurité et cryptographie (Terminale)", "q": "HTTPS utilise un chiffrement hybride parce que :", "c": ["l'asymétrique (lent !) sert UNIQUEMENT à échanger une clé de session, puis le SYMÉTRIQUE (rapide !) chiffre tout le flux", "le hash est trop long", "RSA ne marche pas sur le web", "le symétrique est interdit"], "a": 0, "e": "RSA est ~1000 fois plus lent qu'AES : on l'utilise pour son talent unique (établir le secret en canal PUBLIC !) quelques centaines de millisecondes, puis AES prend le relais pour les mégaoctets — chaque outil à sa place !", "d": "<b>Le relais élégant</b> : l'hybride, l'ouverture puis le sprint.<div class='ex-detail'><u>Exemple rédigé</u> : la poignée de main en 3 temps : 1. CERTIFICAT : le site envoie sa clé publique + le certificat signé par une autorité (le navigateur VÉRIFIE la signature avec les clés des autorités préinstallées ! si invalide : l'alerte rouge !) : 2. ÉCHANGE : le navigateur fabrique une clé de session AES aléatoire, l'envoie chiffrée avec la PUBLIQUE du site : seul le site ouvre (sa PRIVÉE !) — le secret est né en plein canal public (!!) : 3. FLUX : toute la session (pages, formulaires, cookies !) est chiffrée en AES avec cette clé — rapide, des Go/s (!) : le bilan des rôles : l'asymétrique : la CONFIANCE et l'ÉCHANGE (10 ms, une fois !) : le symétrique : la VITESSE et le VOLUME (toute la session !) : la comparaison qui le justifie : chiffrer 1 Go en RSA : ~heures (!!) : en AES : ~1 seconde — l'ingénierie, c'est l'art de payer chaque tâche au bon prix.</div>"},
