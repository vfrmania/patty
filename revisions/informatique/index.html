{"t": "Les réseaux sociaux (2de)", "q": "Le modèle économique dominant des réseaux « gratuits » :", "c": ["la publicité ciblée, rendue possible par les données et l'attention des utilisateurs", "les dons", "la vente des ordinateurs", "l'abonnement des vrais amis"], "a": 0, "e": "Le réseau monetise l'attention : plus les données sont fines, plus le ciblage est précis et cher : « si c'est gratuit, tu es (en partie) le produit ».", "d": "<b>La publicité ciblée</b> : l'attention vendue.<div class='ex-detail'><u>Exemple rédigé</u> : le circuit complet : l'utilisateur passe du temps (attention) ⟹ le réseau enregistre (goûts, horaires, interactions, parfois localisation) ⟹ les annonceurs achètent l'accès à des « audiences » très précises (« femmes 15-20 ans, intéressées par X, actives le soir ») : le prix monte avec la précision : d'où l'enjeu du RGPD (consentement, limitation) : conséquence directe sur TON fil : il est optimisé pour l'engagement (temps passé), pas pour ton information : c'est une machine à attention, et la connaître change l'usage.</div>"},
{"t": "Les réseaux sociaux (2de)", "q": "Deux internautes n'ont jamais le même fil d'actualité parce que :", "c": ["le réseau fait des erreurs", "un algorithme classe des milliers de publications selon leur profil et l'engagement attendu", "les internautes mentent", "les amis sont toujours les mêmes"], "a": 1, "e": "Il n'y a pas de « fil naturel » : un classement optimisé (rétention, interactions) compose un fil unique par personne : les « bulles de filtre » en découlent.", "d": "<b>Le fil est un classement</b> : une construction invisible.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : sur 2000 publications éligibles (amis, pages, recommandations), l'algorithme prédit ce qui te retiendra (selon ton historique : ce que tu regardes le plus, la durée, tes likes) : il ordonne : tu ne vois QUE le sommet : deux profils opposés ⟹ deux mondes recommandés : la « bulle de filtre » n'est pas un complot : c'est l'effet de bord de l'optimisation de l'engagement : les parades : varier volontairement les sources, demander « pourquoi me montre-t-on ceci ? », privilégier le fil chronologique quand l'option existe : un SNT doit pouvoir EXPLIQUER son propre fil.</div>"},
{"t": "Les réseaux sociaux (2de)", "q": "Pourquoi une rumeur s'y propage-t-elle plus vite que sa correction ?", "c": ["les vraies nouvelles sont chères", "la correction est toujours fausse", "structure du graphe (nœuds massifs) + partage émotionnel instantané : les études montrent ~10× plus d'interactions pour les fausses nouvelles", "le réseau bloque les corrections"], "a": 2, "e": "L'émotion fait cliquer avant de réfléchir, et le graphe offre des amplificateurs (influenceurs) : la vérification, elle, prend du temps.", "d": "<b>Structure + émotion</b> : l'asymétrie fatale.<div class='ex-detail'><u>Exemple rédigé</u> : les chiffres de l'étude fameuse (MIT, 126 000 rumeurs, 10 ans de données) : les fausses informations atteignent plus de personnes, PLUS VITE, et sont partagées ~6 à 10 fois plus : pourquoi : le contenu surprenant/émotionnel est plus « partageable », et le partage coûte 1 seconde quand la vérification en coûte 600 : la correction arrive tard sur un public déjà convaincu : les parades structurelles : friction avant partage (« voulez-vous lire ? »), étiquettes de vérification, éducation : le SNT est justement là pour installer cette friction mentale.</div>"},
{"t": "Les réseaux sociaux (2de)", "q": "En France, l'âge de la « majorité numérique » (consentement seul aux données) est :", "c": ["13 ans", "21 ans", "18 ans", "15 ans"], "a": 3, "e": "Avant 15 ans, l'accord d'un parent est requis pour qu'un mineur consente seul à l'utilisation de ses données (loi française de 2018, dans le cadre du RGPD).", "d": "<b>15 ans</b> : la clé de voûte française du RGPD mineurs.<div class='ex-detail'><u>Exemple rédigé</u> : l'architecture : le RGPD (Europe, 2018) protège les données de TOUS : la France fixe à 15 ans l'âge à partir duquel un mineur peut consentir SEUL (sinon : accord parental obligatoire — c'est pourquoi les plateformes demandent la date de naissance !) : en pratique, le contrôle est imparfait (âges déclarés faux), mais le PRINCIPE juridique tient : à 14 ans, un réseau doit théoriquement obtenir l'accord des parents : le droit adapte la protection à la vulnérabilité : une information à connaître pour savoir ce que TES données ont le droit de faire.</div>"},
{"t": "Les réseaux sociaux (2de)", "q": "« Publier, c'est renoncer au contrôle total » signifie :", "c": ["personne ne lit les publications", "la publication est annulable à tout moment", "captures, copies, partages et caches survivent à la suppression", "les réseaux suppriment vite"], "a": 2, "e": "Le bouton « supprimer » retire la publication du profil, pas les copies déjà faites (captures, enregistrements, partages privés) : la e-réputation gère l'irréversible.", "d": "<b>L'irréversible</b> : la leçon numéro un de la vie en ligne.<div class='ex-detail'><u>Exemple rédigé</u> : la démonstration vécue : une publication embarrassante ⟹ capture d'écran par un camarade en 2 secondes ⟹ suppression par l'auteur le soir même ⟹ la capture circule depuis des années : le contenu « n'est plus » mais il existe PARTOUT ailleurs : corollaires pratiques : 1. la règle des 3 questions avant de publier (vrai ? utile ? assumable devant parents et employeur ?) : 2. le droit à l'image permet d'exiger le retrait d'une photo publiée par un AUTRE : 3. le RGPD aide à l'effacement des données, pas à effacer les souvenirs des copies : prévenir plutôt que guérir.</div>"},
{"t": "Les réseaux sociaux (2de)", "q": "Face à une publication humiliante sur soi, la meilleure stratégie :", "c": ["demander le retrait (droit à l'image), documenter (captures datées), alerter un adulte et la plateforme, solliciter le 3018 si besoin", "attendre et espérer", "riposter sur le même mode", "supprimer son propre compte"], "a": 0, "e": "Droit à l'image (publier ta photo exige ton accord), preuves, signalement : la riposte à l'identique transforme la victime en auteur (juridiquement !).", "d": "<b>Retrait + preuves + signalement</b> : le protocole complet.<div class='ex-detail'><u>Exemple rédigé</u> : l'ordre des gestes : 1. CAPTURER (la preuve AVANT toute suppression : sans elle, plus rien à montrer) : 2. EXIGER le retrait (message calme, rappel du droit à l'image : la photo d'une personne ne se publie pas sans son accord) : 3. SIGNALER (plateforme, établissement) : 4. EN PARLER (parent, CPE, 3018 — le numéro français contre les violences numériques) : ce qui échoue : riposter (on devient auteur à son tour : la loi ne distingue pas « il a commencé »), endurer (l'épuisement est le vrai danger) : la dignité se défend avec des procédures, pas avec du feu.</div>"},
{"t": "Les réseaux sociaux (2de)", "q": "Le « degré » d'un nœud du graphe :", "c": ["son âge", "sa localisation", "sa vitesse de connexion", "son nombre de liens (amis, abonnements)"], "a": 3, "e": "C'est le compteur de relations : la distribution est très inégale (la plupart ~ quelques centaines, les influenceurs : millions) : les nœuds à très haut degré amplifient tout ce qui les touche.", "d": "<b>Le nombre de liens</b> : la mesure d'influence du graphe.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul d'impact : un nœud « ordinaire » (degré 300) partage une info ⟹ portée potentielle 300 : un nœud influenceur (degré 1 500 000) partage la MÊME info ⟹ portée 1,5 million, soit 5000 fois plus : c'est la définition même de l'amplification structurelle (pour le meilleur : mobilisation solidaire... et pour le pire : rumeurs) : les analystes utilisent aussi d'autres mesures (centralité : être le point de passage obligé) : comprendre le degré = comprendre pourquoi « le réseau » n'est pas une masse uniforme mais une structure à sommets.</div>"},
{"t": "Les réseaux sociaux (2de)", "q": "Une « bulle de filtre » désigne :", "c": ["un bug d'affichage", "le fait de ne voir que des contenus conformes à ses goûts précédents (filtre invisible du fil)", "un pare-feu", "un groupe privé"], "a": 1, "e": "Le classement par l'engagement attendu renvoie à chacun ce qu'il montre déjà d'intérêt : s'en extraire demande un effort volontaire (sources variées, chronologie).", "d": "<b>Le miroir de tes clics</b> : l'enfermement invisible.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience de pensée : deux amis aux opinions opposées regardent « le même » fil d'actualité sur un sujet : le premier ne voit que des contenus qui le confortent, le second l'inverse : chacun croit l'évidence de son côté : l'effet s'appuie sur une optimisation INNOCENTE (montrer ce qui plaît = plus d'engagement) mais produit un effets politique (clivages renforcés) : les sorties de bulle : suivre volontairement des sources de qualité d'opinions diverses, préférer le fil chronologique, lire des médias hors plateforme (sites d'info directement : le classement de la plateforme ne s'y applique pas) : la liberté d'information devient une discipline.</div>"},
{"t": "Les données structurées et leur traitement (2de)", "q": "Dans un tableur ou en Python, « 2 » + « 3 » (entre guillemets) donne :", "c": ["« 23 » (concaténation de textes)", "une erreur", "5", "23 (nombre)"], "a": 0, "e": "Les guillemets signalent du TEXTE : les textes se COLLent (« 23 ») : la somme 5 exige des NOMBRES (2 + 3) : tout le chapitre tient dans cette distinction de types.", "d": "<b>« 23 »</b> : le type commande l'opération.<div class='ex-detail'><u>Exemple rédigé</u> : le piège vécu : un CSV de notes arrive : tout est TEXTE (le format ne transporte que du texte !) : si on additionne sans convertir : « 12 » + « 15 » = « 1215 » (!!) : la moyenne devient absurde : le remède : CONVERTIR (int('12') ⟹ le nombre 12 : en tableur, vérifier l'alignement : à DROITE = nombre, à GAUCHE = texte !) : règle générale : AVANT tout calcul, vérifier le TYPE de chaque colonne : c'est l'erreur n°1 du traitement de données, et la première à traquer.</div>"},
{"t": "Les données structurées et leur traitement (2de)", "q": "La première ligne d'un fichier CSV contient :", "c": ["les données du premier élève", "les descripteurs (noms des colonnes : nom, note, ...)", "un checksum", "des métadonnées obligatoires"], "a": 1, "e": "L'en-tête nomme chaque colonne : les lignes suivantes sont les ENREGISTREMENTS : à l'exploitation, on lit puis on SAUTE cette ligne avant de traiter les données.", "d": "<b>Les descripteurs</b> : la clé de lecture du tableau.<div class='ex-detail'><u>Exemple rédigé</u> : le fichier type : ligne 1 : « nom;classe;note » : lignes 2+ : « Anna;3e2;15 » : le programme : reader = csv.reader(...) : en-tete = next(reader) (on le lit et l'écarte) : puis la boucle sur les lignes restantes : l[0] = nom, l[2] = note (les INDEX commencent à 0 !) : l'oubli de sauter l'en-tête est LE bug du débutant (la « note » du premier enregistrement vaut alors « note » : conversion int() impossible ⟹ crash révélateur) : lire la structure AVANT de calculer, toujours.</div>"},
{"t": "Les données structurées et leur traitement (2de)", "q": "Une valeur aberrante dans un jeu de données :", "c": ["une donnée manquante", "une valeur très fréquente", "une valeur impossible ou invraisemblable (ex. une note de -3 ou 200)", "un descripteur"], "a": 2, "e": "Elle signale une ERREUR de saisie (à corriger si possible) : la garder fausse tous les calculs (moyennes, min/max) : nettoyage obligatoire.", "d": "<b>L'impossible invraisemblable</b> : le faussaire silencieux.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul qui déraille : notes 12, 15, 18 et une saisie -3 : moyenne = (12+15-3+18)/4 = 10,5 : sans la faute : 15 ! : un demi-point volé à tous, avec des chiffres « exacts » : les aberrants attaquent aussi les extrêmes (le « max » d'une série de températures à 250 °C !) : la méthode : borne de validité (une note ∈ [0 : 20]), vérification de la SOURCE (erreur de frappe ? 13 ?), exclusion DOCUMENTÉE si non corrigeable : le professionnel note ce qu'il retire : la transparence fait partie du résultat.</div>"},
{"t": "Les données structurées et leur traitement (2de)", "q": "Le format JSON se distingue du CSV par :", "c": ["sa lisibilité exclusive par Python", "son absence de standards", "son poids toujours plus lourd", "sa structure emboîtée de paires clé/valeur (objets, listes imbriquées)"], "a": 3, "e": "CSV : plat (une grille) : JSON : emboîté (un élève peut contenir sa LISTE de notes) : c'est le format des API et du web (lisible par toutes les machines).", "d": "<b>L'emboîtement</b> : la structure arborescente.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison concrète : en CSV, « Anna, 12 » et « Anna, 15 » = DEUX lignes (la structure est aplatie, les répétitions de noms obligatoires) : en JSON : <code>{'nom': 'Anna', 'notes': [12, 15]}</code> = UN objet, avec la liste des notes DANS l'objet : c'est la différence plat/arborescent : quand l'utiliser : CSV pour les tableaux simples (échange, tableur, 1 ligne = 1 fait) : JSON pour les données riches (réponses d'API : météo, résultats de recherche, fichiers de configuration) : en Python, json.loads() transforme le texte en dictionnaires/listes exploitables.</div>"},
{"t": "Les données structurées et leur traitement (2de)", "q": "Le principe de minimisation (RGPD) :", "c": ["tout anonymiser sans exception", "garder les données 10 ans", "ne collecter que les données strictement nécessaires à la finalité déclarée", "collecter un maximum pour être complet"], "a": 2, "e": "À quoi servent les données ? On ne garde QUE ça (pas de « au cas où » !) : plus la collecte est réduite, plus le risque de fuite est réduit.", "d": "<b>Le strict nécessaire</b> : la première protection.<div class='ex-detail'><u>Exemple rédigé</u> : le cas d'école : une étude statistique sur les notes par classe a besoin de : classe + note : PAS du nom, PAS de la date de naissance (sauf besoin d'âge : alors garder l'ÂGE, moins précis) : le réflexe professionnel (privacy by design) : AVANT le traitement, lister la finalité ⟹ déduire le MINIMUM de colonnes ⟹ retirer le reste : la logique du risque : ce qui n'est pas collecté ne peut fuir, ni être volé, ni mal utilisé : la minimisation protège l'élève ET l'organisation : c'est aussi simple que lourd de conséquences.</div>"},
{"t": "Les données structurées et leur traitement (2de)", "q": "« Agréger » des données signifie :", "c": ["regrouper et résumer (moyenne par classe, effectif par ville, total par mois)", "les trier par ordre alphabétique", "les chiffrer", "les supprimer"], "a": 0, "e": "L'agrégation passe d'un détail (l'élève) à une vue (la classe) : c'est elle qui produit les tableaux de bord, les statistiques publiques, les indicateurs.", "d": "<b>Regrouper et résumer</b> : du détail à la vue.<div class='ex-detail'><u>Exemple rédigé</u> : l'opération sur 1000 lignes d'élèves : « moyenne de note PAR classe » = agréger : la table 1000 lignes ⟹ 8 lignes (une par classe, avec la moyenne de chacune) : le trio gagnant du chapitre : FILTRER (garder les notes >= 10), TRIER (par moyenne décroissante), AGRÉGER (résumer par groupe) : exemple réel : les indicateurs publics (taux de réussite PAR académie) sont des agrégats : ce qui compte : l'agrégat CACHE le détail (une moyenne de classe élevée peut coexister avec des élèves en grande difficulté !) : lire un statistique en connaissant ce qu'il masque = l'esprit critique du data literate.</div>"},
{"t": "Les données structurées et leur traitement (2de)", "q": "Les métadonnées d'une photo (EXIF) sont :", "c": ["un droit d'auteur", "un format d'image", "des données SUR la photo : date, appareil, réglages, parfois GPS", "les pixels de l'image"], "a": 2, "e": "Données = le contenu (l'image) : métadonnées = l'information SUR le fichier (l'enveloppe parle d'elle-même) : elles voyagent AVEC le fichier si rien ne les nettoie.", "d": "<b>Les données sur les données</b> : l'enveloppe informative.<div class='ex-detail'><u>Exemple rédigé</u> : la distinction en acte : le fichier photo DSC_0421.jpg contient : la DONNÉE (des millions de valeurs de pixels = l'image) : les MÉTADONNÉES (date/heure, modèle d'appareil, ouverture, sensibilité ISO... et parfois la position GPS !) : l'exemple journalistique : les vérificateurs de photos utilisent l'EXIF (dater, localiser, comparer) : l'exemple de vie privée : publier « une photo de plat » peut révéler à 200 m près où et quand elle fut prise : les métadonnées servent (classer ses photos par date !) et exposent (nettoyer l'EXIF avant publication publique : des outils le font en un clic).</div>"},
{"t": "Les données structurées et leur traitement (2de)", "q": "Une donnée manquante (« abs » dans une colonne de notes) doit être :", "c": ["supprimée du fichier sans rien dire", "traitée à part : l'exclure des calculs et le documenter (c'est une information, pas un zéro)", "remplacée par la moyenne", "remplacée par zéro"], "a": 1, "e": "Un zéro PUNIRAIT l'élève absent (moyenne faussée) : l'absence est un fait à part : le calcul porte sur les notes EXISTANTES, et le choix est noté dans l'analyse.", "d": "<b>À part, documentée</b> : l'honnêteté statistique.<div class='ex-detail'><u>Exemple rédigé</u> : le dilemme réel : Anna (12, abs, 15) : moyenne sur existantes : 13,5 : moyenne avec zéro : 9 (!!) : le zéro transforme une ABSENCE en SANCTION : et remplacer par la moyenne générale gonflerait artificiellement (biais inverse) : la règle professionnelle : calculer sur les valeurs disponibles ET SIGNALER (moyenne sur 2 notes sur 3 possibles) : le piège des logiciels : certains tableurs remplacent silencieusement les vides par 0 : toujours vérifier COMMENT le traitement réagit : la statistique honnête est une statistique TRANSPARENTE sur ses choix.</div>"},
{"t": "Les données structurées et leur traitement (2de)", "q": "Le motif de base d'un traitement de fichier en Python :", "c": ["imprimer, scanner, enregistrer", "lire ⟹ convertir les types ⟹ calculer (filtrer/trier/agréger)", "copier, coller, sauvegarder", "trier, supprimer, ignorer"], "a": 1, "e": "Lire (csv.reader), SAUTER l'en-tête, convertir (int, float : tout arrive en texte !), puis appliquer les traitements : ce squelette vaut pour 10 ou 10 millions de lignes.", "d": "<b>Lire ⟹ convertir ⟹ calculer</b> : le squelette universel.<div class='ex-detail'><u>Exemple rédigé</u> : le programme canonique du chapitre : <code>import csv : lignes = list(csv.reader(open('notes.csv'))) : entete = lignes[0] : notes = [int(l[1]) for l in lignes[1:]] : print(sum(notes)/len(notes))</code> : ligne par ligne : ouvrir et lire ⟹ écartier l'en-tête ⟹ CONVERTIR (le point critique : le CSV ne transporte que du texte !) ⟹ calculer (somme, moyenne, max, filtres, tris) : les erreurs types repérées par ce squelette : l'en-tête non écarté (int('note') échoue : bon signal !) : les types non convertis (concaténation au lieu d'addition) : la même logique passe à l'échelle professionnelle avec pandas (df['note'].mean()) : les outils changent, le squelette reste.</div>"},
{"t": "Les données structurées et leur traitement (2de)", "q": "Anonymiser un fichier d'élèves pour une étude consiste à :", "c": ["retirer ou remplacer les identifiants directs (nom, date de naissance) par des codes, en gardant ce qui sert à l'étude", "le chiffrer avec un mot de passe", "supprimer le fichier", "ajouter plus de détails"], "a": 0, "e": "L'anonymisation (pas de retour possible vers une personne) fait sortir le fichier du champ du RGPD : l'étude statistique peut alors se faire sur les données utiles.", "d": "<b>Coder ce qui identifie, garder ce qui sert</b> : la recette.<div class='ex-detail'><u>Exemple rédigé</u> : la transformation concrète du fichier « nom, classe, naissance, note » pour l'étude « notes par classe » : étape 1 (finalité) : il faut classe + note : étape 2 (retrait) : nom ⟹ E001, E002... (codes aléatoires, liste de correspondance conservée À PART par l'administrateur si besoin) : naissance ⟹ rien (ou âge si l'étude l'exige) : étape 3 (résultat) : « E001, 3e2, 15 » : plus personne ne peut relier la ligne à un élève : le fichier circule pour l'étude : la nuance importante : pseudonymiser (codes réversibles) ≠ anonymiser (irréversible) : seul le VRAI anonymat sort du champ du RGPD : un réflexe qui protège tout le monde.</div>"},
{"t": "Localisation, cartographie et mobilité (2de)", "q": "Le GPS positionne le récepteur par :", "c": ["le réseau téléphonique uniquement", "trilatération : mesure de DISTANCES à plusieurs satellites via le temps de parcours des signaux", "photographie de la Terre", "triangulation d'angles"], "a": 1, "e": "Chaque satellite émet sa position et l'heure : le décalage reçu donne la DISTANCE : l'intersection des sphères (au moins 4) donne la position : on mesure des distances, pas des angles.", "d": "<b>Trilatération</b> : le mot exact du chapitre.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme pas à pas : le satellite émet « je suis ici, il est exactement 12h00mn00,000000s » : le téléphone reçoit le message avec un léger retard (l'onde va à la vitesse de la lumière) : retard × vitesse = distance (ex. 0,07 s ⟹ ~20 000 km !) : le téléphone est donc sur une SPHÈRE de 20 000 km autour du satellite : 4 sphères se coupent en un point (3 pour la position, le 4e pour l'horloge !) : précision : quelques mètres en extérieur, dégradée en intérieur ou canyon urbain (signaux rebondis) : le mot « triangulation » (des angles) est le faux ami à bannir du contrôle.</div>"},
{"t": "Localisation, cartographie et mobilité (2de)", "q": "Pourquoi 4 satellites sont-ils nécessaires ?", "c": ["pour corriger l'horloge du récepteur (3 dimensions + l'écart d'horloge = 4 inconnues)", "pour la redondance en cas de panne", "parce que la Terre a 4 hémisphères", "pour augmenter la batterie"], "a": 0, "e": "L'horloge du téléphone n'est pas atomique : son écart fausserait toutes les distances : la 4e mesure résout cette inconnue supplémentaire.", "d": "<b>L'horloge du téléphone</b> : la 4e inconnue.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul de sensibilité : distance = temps × vitesse de la lumière : 1 ms d'erreur d'horloge = 300 km d'erreur de distance (!!) : les satellites portent des HORLOGES ATOMIQUES (exactes à la nanoseconde), le téléphone une horloge ordinaire : sa dérive est une INCONNUEDANS les équations : 3 satellites = 3 équations pour 4 inconnues (x, y, z, écart d'horloge) : insoluble ! : le 4e satellite apporte la 4e équation : tout se résout : conséquence pratique : avec 3 satellites captés, le GPS affiche « recherche » ou une position erronée de plusieurs km : la géométrie des satellites dans le ciel compte aussi : bien répartis = intersection nette.</div>"},
{"t": "Localisation, cartographie et mobilité (2de)", "q": "Le couple (48,85 : 2,35) désigne :", "c": ["une vitesse et un cap", "une latitude et une longitude (la position de Paris)", "une distance et un temps", "deux satellites"], "a": 1, "e": "Latitude (Nord-Sud : -90 à +90°) puis longitude (Est-Ouest : -180 à +180°) : ce couple désigne UN point unique sur Terre.", "d": "<b>Latitude, longitude</b> : l'adresse universelle.<div class='ex-detail'><u>Exemple rédigé</u> : le système : la latitude compte les degrés depuis l'équateur (Paris : 48,85° Nord), la longitude depuis le méridien de Greenwich (2,35° Est) : le couple désigne le toit d'un immeuble précis (48,858, 2,294 = la tour Eiffel !) : applications du chapitre : un fichier GPX de course à pied = des centaines de ces couples horodatés : une carte affiche la trace en reliant les points : et la DISTANCE entre deux points se calcule à partir de ces coordonnées (attention : sur une sphère, la formule diffère du plan : d'où l'approximation des projections pour les cartes plates !).</div>"},
{"t": "Localisation, cartographie et mobilité (2de)", "q": "Le calcul d'un itinéraire par une application de cartes :", "c": ["un balayage hasardeux", "une recherche DNS", "la recherche du plus court chemin dans un graphe pondéré (nœuds = intersections, arêtes = tronçons avec temps)", "une comparaison de photos satellites"], "a": 2, "e": "Le réseau routier est modélisé en graphe : les algorithmes (Dijkstra, A*) trouvent le chemin de poids minimal (temps, distance) : c'est un problème d'informatique classique.", "d": "<b>Un graphe pondéré</b> : la carte vue par l'algorithmicien.<div class='ex-detail'><u>Exemple rédigé</u> : la modélisation concrète : chaque rond-point = un nœud, chaque tronçon = une arête portant un poids (durée estimée, corrigée par le trafic en temps réel !) : Dijkstra : depuis l'origine, attribuer à chaque nœud la meilleure durée connue, étendre au plus prometteur, répéter jusqu'à la destination : A* accélère en orientant l'exploration (distance à vol d'oiseau : « ça sert de boussole ») : la boucle est bouclée avec les autres chapitres : le MÊME outil de graphe décrit les réseaux sociaux ET route Internet ET les itinéraires : trois problèmes, une abstraction.</div>"},
{"t": "Localisation, cartographie et mobilité (2de)", "q": "OpenStreetMap se distingue des cartes commerciales par :", "c": ["son coût élevé", "son absence de cartes d'Europe", "son modèle collaboratif et ouvert (données librement réutilisables, communauté de contributeurs)", "sa vitesse supérieure"], "a": 2, "e": "OSM est le « Wikipédia des cartes » : des bénévoles tracent les routes, ajoutent les commerces : les données sont ouvertes et réutilisables par tous (applications, études, humanitaire).", "d": "<b>La carte des communs</b> : la preuve qu'un autre modèle existe.<div class='ex-detail'><u>Exemple rédigé</u> : le dispositif : n'importe qui peut cartographier (tracés GPS, relevés de terrain, photos aériennes) : la base est sous licence libre : réutilisation totale (applis de randonnée, systèmes de navigation, études urbaines, cartographie humanitaire — Humanitarian OSM a cartographié des zones entières après des catastrophes !) : les usages SNT : télécharger des fonds de carte libres, produire une carte de son quartier : l'angle du chapitre : une infrastructure numérique PEUT être un bien commun, gouverné par une communauté plutôt que par un annonceur : un choix de société, démontrable.</div>"},
{"t": "Localisation, cartographie et mobilité (2de)", "q": "Une trace GPS « anonyme » d'un mois :", "c": ["illisible sans mot de passe", "totalement inoffensive", "peut réidentifier la personne (domicile = les points des nuits, travail = les jours, 4 points suffisent pour 95 % des gens)", "limitée à 24 h"], "a": 2, "e": "Les points d'ancrage (nuits, journées de semaine) identifient presque toujours : l'anonymat des traces brutes est un mythe : la protection se joue aux réglages et à la durée de conservation.", "d": "<b>La réidentification</b> : la régularité est une signature.<div class='ex-detail'><u>Exemple rédigé</u> : l'analyse du fichier : les points où la trace S'ARRÊTE chaque nuit (22h-6h) dessinent le DOMICILE : les points des journées de semaine dessinent le TRAVAIL : deux adresses + croisement simple (annuaire, réseaux) = l'identité : l'étude de référence (de Montjoye et al.) : 4 points spatio-temporels suffisent à distinguer 95 % des personnes d'un jeu de traces : les parades : localisation « pendant l'usage » seulement, revue des applications (un jeu de mots ne nécessite PAS la position !), historique des positions désactivé, agrégation plutôt que traces brutes pour les études : la géolocalisation est la donnée la plus sensible du téléphone : elle se gère comme une clé de chez soi.</div>"},
{"t": "Localisation, cartographie et mobilité (2de)", "q": "Le réglage de localisation le plus protecteur pour une application :", "c": ["« jamais » pour toutes", "« pendant l'utilisation de l'application » (et refuser les demandes sans rapport avec la fonction)", "partager sa position en public", "« toujours »"], "a": 1, "e": "L'application reçoit la position quand elle en a besoin (une carte pour naviguer) : pas en permanence (un jeu de mots, une lampe torche n'ont aucun besoin de te suivre !).", "d": "<b>À la demande</b> : le juste nécessaire.<div class='ex-detail'><u>Exemple rédigé</u> : l'audit type du téléphone : réglages ⟹ localisation ⟹ liste des applications : les questions à poser pour chacune : « quelle FONCTION utilise la position ? » : une carte ⟹ navigation : OUI pendant l'usage : une lampe torche ⟹ aucune : NON : un réseau social ⟹ peut-être pour « à proximité » : si tu n'utilises pas cette fonction : NON : le cas extrême « toujours » se justifie rarement (antivol, partage familial...) et chaque cas se pèse : l'effet cumulé : moins de collecte ⟹ moins de traces ⟹ moins de fuites possibles : la protection numérique tient souvent à trois réglages bien choisis plutôt qu'à des discours.</div>"},
{"t": "Localisation, cartographie et mobilité (2de)", "q": "Le format GPX d'une trace de randonnée contient :", "c": ["un seul point final", "des images des paysages", "des points horodatés (latitude, longitude, altitude, heure)", "des textes descriptifs"], "a": 2, "e": "C'est le carnet numérique du parcours : une suite de relevés : de là découlent les cartes de la trace, les profils d'altitude, les allures du sportif.", "d": "<b>Des points horodatés</b> : la boussole qui se souvient.<div class='ex-detail'><u>Exemple rédigé</u> : le contenu du fichier : <code>&lt;trkpt lat='45.9237' lon='6.8697'&gt;&lt;ele&gt;2363&lt;/ele&gt;&lt;time&gt;2024-07-14T09:42:10Z&lt;/time&gt;&lt;/trkpt&gt;</code> : et des centaines comme ça : les exploitations du chapitre : relier les points = la trace sur la carte : les altitudes = le profil du dénivelé : les temps = l'allure (km/h de chaque tronçon) : les outils : un tableur (import, calculs de distance) ou Python (parsing du XML, distance entre points) : le fil conducteur SNT : une trace n'est qu'un FICHIER DE DONNÉES structurées — on retrouve le chapitre « données structurées » en pleine montagne.</div>"},
{"t": "Localisation, cartographie et mobilité (2de)", "q": "En intérieur, le GPS se dégrade parce que :", "c": ["les cartes n'existent pas en intérieur", "les signaux sont bloqués ou rebondis par les structures (toits, murs) : le téléphone s'aide alors du Wi-Fi et du Bluetooth", "la batterie est faible", "les satellites s'arrêtent la nuit"], "a": 1, "e": "Il faut la vue sur plusieurs satellites : à l'intérieur, le téléphone combine d'autres indices (réseaux Wi-Fi proches, bornes Bluetooth) pour estimer la position.", "d": "<b>Signaux bloqués, solutions combinées</b> : la géolocalisation hybride.<div class='ex-detail'><u>Exemple rédigé</u> : la physique du problème : le signal satellite est FAIBLE (il traverse 20 000 km !) : un toit, des murs ou des étages l'affaiblissent ou le réfléchissent (multitrajets : positions qui « sautent ») : les astuces du téléphone : 1. les réseaux Wi-Fi proches (leur emplacement est connu : en voir 3 = une position approximative) : 2. le Bluetooth (les balises en magasin) : 3. en milieu dense, les cellules du réseau mobile : l'ensemble s'appelle la localisation HYBRIDE : le chapitre enseigne : le « GPS » du quotidien est un faisceau de techniques, et la précision annoncée dépend de l'endroit — le métro coupe le satellite, pas le Wi-Fi.</div>"},
{"t": "Localisation, cartographie et mobilité (2de)", "q": "La donnée de localisation est considérée comme :", "c": ["anodine car visible par tous", "impossible à stocker", "très sensible : elle révèle domicile, travail, habitudes, fréquentations (d'où le consentement RGPD spécifique)", "utile seulement pour la météo"], "a": 2, "e": "La position continue reconstitue une VIE (où tu dors, où tu vas, qui tu vois) : le RGPD la range parmi les données les plus protégées, avec consentement et finalité explicites.", "d": "<b>La donnée la plus intime</b> : le journal de bord involontaire.<div class='ex-detail'><u>Exemple rédigé</u> : la démonstration par dérivation : position régulière ⟹ domicile : position de jour ⟹ travail/école : horaires ⟹ rythme de vie : déplacements récurrents ⟹ loisirs, santé (cabinet médical !), fréquentations, engagement (lieux de culte, syndicats !) : une étude a montré qu'il est possible d'inférer la religion ou l'orientation à partir des seuls déplacements : c'est pour cela que la localisation est une catégorie PROTÉGÉE du RGPD (consentement explicite, finalité limitée, durée courte) : la posture SNT : la géolocalisation se manipule comme des clés de chez soi — on ne les prête qu'à bon escient, jamais « toujours ».</div>"},
{"t": "Informatique embarquée et objets connectés (2de)", "q": "Dans un système embarqué, la chaîne correcte :", "c": ["clavier ⟶ écran ⟶ souris", "capteurs ⟶ microcontrôleur (décision) ⟶ actionneurs", "actionneur ⟶ capteur ⟶ écran", "capteur ⟶ actionneur ⟶ décision"], "a": 1, "e": "Les capteurs MESURENT, le microcontrôleur DÉCIDE (programme), les actionneurs AGISSENT : la boucle mesurer-décider-agir décrit tout objet, du thermostat au drone.", "d": "<b>Mesurer ⟶ décider ⟶ agir</b> : le schéma universel.<div class='ex-detail'><u>Exemple rédigé</u> : l'anatomie du thermostat : la thermistance (CAPTEUR) traduit la température en tension, convertie en nombre : le microcontrôleur compare au seuil (DÉCISION : si < 19,5 alors chauffer) : le relais (ACTIONNEUR) ouvre le circuit du chauffage : l'exercice d'entraînement : prendre N'IMPORTE QUEL objet (lave-linge, ABS de voiture, montre) et dérouler les trois étages : capteurs ? (durée, masse, vitesse) : décision ? (programme embarqué) : actionneurs ? (vanne, frein, vibreur) : quand on sait décomposer, on comprend TOUT l'embarqué.</div>"},
{"t": "Informatique embarquée et objets connectés (2de)", "q": "Un système embarqué se distingue d'un ordinateur classique par :", "c": ["sa taille d'écran", "son prix", "son absence de processeur", "sa spécialisation : il exécute un nombre limité de tâches, avec peu de ressources (mémoire, énergie), sans réinitialisation possible"], "a": 3, "e": "L'embarqué fait UNE chose, en boucle, avec quelques Ko de mémoire et une fiabilité absolue (un frein ou un pacemaker ne peut pas « planter » puis « redémarrer » !).", "d": "<b>Spécialisé, contraint, fiable</b> : l'anti-ordinateur.<div class='ex-detail'><u>Exemple rédigé</u> : le tableau comparatif : l'ordinateur : généraliste (des milliers de logiciels), Go de mémoire, redémarrage banal : l'embarqué : une tâche dédiée, parfois quelques centaines de Ko, redémarrage INACCEPTABLE (l'ABS qui redémarre pendant un freinage ?!) : les conséquences de conception : le programme est vérifié et testé de façon extrême (automobile : normes de sûreté), le code est souvent « figé » (firmware) : l'ordre de grandeur : une voiture moderne = ~100 calculateurs embarqués et des centaines de millions de lignes de code — plus qu'un avion : l'informatique invisible qui fait tourner le monde.</div>"},
{"t": "Informatique embarquée et objets connectés (2de)", "q": "L'hystérésis dans un thermostat (allumer à 19,5 °C, éteindre à 20,5 °C) sert à :", "c": ["économiser l'écran", "éviter les allumages/extinctions en rafale autour du seuil (usure et inconfort)", "se connecter au cloud", "mesurer mieux"], "a": 1, "e": "Avec un seuil unique à 20,0, le système oscillerait sans arrêt : la bande morte (±0,5) stabilise la commande : une idée d'ingénieur à connaître (régulation « en dents de scie »).", "d": "<b>La bande morte</b> : la stabilité contre les dents de scie.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario sans hystérésis : seuil « chauffer si < 20 » : à 19,9 le chauffage s'allume ⟹ 20,1 il s'éteint ⟹ 19,9... dix cycles par minute : usure du relais, cliquetis, inconfort ! : avec la bande : chauffer si < 19,5, arrêter si > 20,5 : entre les deux, on ne change RIEN (le système « dort » dans la bande) : le concept se retrouve dans les régulations domestiques (frigo : on n'entend pas le compresseur s'arrêter à chaque dixième de degré !) et dans les interfaces (pourquoi le « mode sombre » ne bascule pas à chaque nuage : bande sur la luminosité !).</div>"},
{"t": "Informatique embarquée et objets connectés (2de)", "q": "Un capteur a pour rôle :", "c": ["mesurer une grandeur physique (température, lumière, mouvement...) et la traduire en signal exploitable", "agir sur le monde physique", "décider", "stocker des fichiers"], "a": 0, "e": "Le capteur est une ENTRÉE (il traduit le monde physique en données : souvent via une conversion analogique-numérique) : l'actionneur est la SORTIE (il agit).", "d": "<b>Mesurer et traduire</b> : la porte d'entrée de l'information.<div class='ex-detail'><u>Exemple rédigé</u> : le voyage du signal : l'air est à 18,3 °C : la thermistance varie sa résistance (grandeur ANALOGIQUE : continue) : le convertisseur analogique-numérique (CAN) du microcontrôleur l'échantillonne en NOMBRE (18,3) : le programme compare : à ce stade, la physique est devenue de l'INFORMATION traitable : quelques capteurs à connaître : photorésistance (lumière), accéléromètre (mouvement/choc), ultrasons (distance : le « parking » de la voiture !), anémomètre (vent) : une question de contrôle : « quel capteur choisir pour X ? » — toujours partir de la grandeur physique à mesurer.</div>"},
{"t": "Informatique embarquée et objets connectés (2de)", "q": "Le principal risque d'une caméra connectée laissée avec « admin/admin » :", "c": ["elle chauffe", "piratage en masse : balayage d'Internet, accès à l'image, ou enrôlement dans un botnet", "elle perd la connexion", "elle consomme trop"], "a": 1, "e": "Des pirates cataloguent les objets accessibles avec les codes d'usine : l'objet devient une porte d'entrée (espionnage) ou un soldat zombie (attaques massives) : d'où l'obligation de changer les mots de passe par défaut.", "d": "<b>La porte ouverte à tous</b> : le scénario documenté.<div class='ex-detail'><u>Exemple rédigé</u> : le cas réel (Mirai, 2016) : un malware scanne Internet, teste admin/admin et 60 codes d'usine sur les caméras et routeurs : des centaines de milliers d'objets infectés : l'« armée » attaque simultanément un fournisseur DNS : la moitié d'Internet américain inaccessible... par des FRIGOS et CAMÉAS piratés : les leçons concrètes : 1. changer le mot de passe DÈS l'installation (non négociable) : 2. mettre à jour le firmware (les failles connues sont corrigées par les fabricants sérieux) : 3. se demander AVANT l'achat : ai-je VRAIMENT besoin que cet objet soit connecté ? : chaque objet connecté = un petit ordinateur chez soi = une serrure de plus.</div>"},
{"t": "Informatique embarquée et objets connectés (2de)", "q": "Pour allumer une LED si luminosité < 40 ET mouvement détecté, le programme embarqué utilise :", "c": ["une variable texte", "une boucle permanente avec une condition composée (ET logique) lisant les deux capteurs", "une seule boucle sans test", "deux conditions séparées sans boucle"], "a": 1, "e": "La boucle permanente relit les capteurs en continu, la condition composée (ET) combine les deux mesures, et la LED suit : séquence + condition + boucle, encore et toujours.", "d": "<b>Condition composée dans une boucle</b> : les briques appliquées au monde physique.<div class='ex-detail'><u>Exemple rédigé</u> : le code équivalent en blocs et en Python : <code>while True: if light() < 40 and mouvement: led.on() else: led.off() : sleep(0.2)</code> : les points d'attention : le ET exige les DEUX (une lampe qui s'allume dans une pièce vide la nuit = détection seule : gaspillage !) : la PAUSE (200 ms) évite de saturer le processeur et économise la batterie : le seuil 40 se règle par ESSAIS (relevé de la valeur au crépuscule) : le pont avec le cours d'algorithmique est total : séquence, condition, boucle — les trois briques n'ont pas changé, seul le monde physique s'est ajouté.</div>"},
{"t": "Informatique embarquée et objets connectés (2de)", "q": "Une voiture moderne contient environ :", "c": ["uniquement des capteurs", "un seul ordinateur", "aucun ordinateur", "une centaine d'ordinateurs embarqués reliés par un réseau interne"], "a": 3, "e": "Moteur, ABS, airbags, climatisation, éclairage... : ~100 calculateurs coopèrent en continu : l'embarqué est invisible mais omniprésent (idem avion, train, carte bancaire, pacemaker).", "d": "<b>Une centaine</b> : l'informaticien invisible au volant.<div class='ex-detail'><u>Exemple rédigé</u> : l'inventaire vertigineux : calculateur moteur (injection, allumage : ~1 million de lignes de code), ABS/ESP (freinage, stabilité : quelques dizaines de milliers), airbags (détection de choc en ~15 ms !), boîte, climatisation, tableau de bord, éclairage, portières, GPS... : tous dialoguent sur des réseaux internes spécialisés (CAN bus, etc.) : la coordination est le défi (le frein doit obéir en toutes circonstances !) : l'ordre de grandeur à retenir : un Airbus ou une voiture récente contiennent plus de lignes de code qu'un système d'exploitation grand public : la plus grande réussite de l'embarqué : on ne la VOIT jamais.</div>"},
{"t": "Informatique embarquée et objets connectés (2de)", "q": "Un « botnet » est :", "c": ["un pare-feu", "un robot ménager", "un réseau social de robots", "un réseau d'objets infectés contrôlés à distance pour mener des attaques (souvent à l'insu des propriétaires)"], "a": 3, "e": "Des milliers d'objets mal sécurisés (caméras, routeurs, frigos...) deviennent des soldats zombies : leur force vient du NOMBRE (attaque distribuée DDOS).", "d": "<b>L'armée zombie</b> : la menace venue du salon.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : infection par codes d'usine non changés ⟹ chaque objet reçoit des ordres (envoyer des requêtes vers une cible) ⟹ à l'heure dite, 200 000 objets de 200 000 foyers frappent EN MÊME TEMPS : le site ciblé s'effondre (attaque par déni de service distribuée) : le propriétaire ne s'aperçoit de RIEN (sa caméra « marche normalement ») : la parade collective : chaque mot de passe d'usine changé retire un soldat de l'armée : c'est l'exemple parfait du lien micro/macro : UN geste bénin chez soi (changer « admin ») protège une infrastructure mondiale.</div>"},
{"t": "Informatique embarquée et objets connectés (2de)", "q": "Les cartes éducatives (micro:bit, Arduino, Raspberry Pi) servent à :", "c": ["naviguer plus vite", "apprendre en construant : programmer des capteurs/actionneurs, prototyper des objets", "remplacer un ordinateur de bureau", "jouer uniquement"], "a": 1, "e": "Ce sont des plateformes de prototypage : on y câble capteurs et actionneurs, on programme (blocs ou Python) et on APPREND la chaîne complète mesure-décision-action en manipulant.", "d": "<b>Apprendre en construisant</b> : la chaîne complète entre les mains.<div class='ex-detail'><u>Exemple rédigé</u> : le projet type : une station météo : capteur de température + humidité, écran, envoi des mesures : les étapes : câbler (attention au sens des broches !), lire les capteurs (bibliothèques fournies), afficher, éventuellement transmettre : ce que ça enseigne mieux qu'un cours : la boucle mesure-décision-action en vrai, la différence analogique/numérique en la touchant, la patience du débogage (une broche inversée = 3 h de recherche !) : les niveaux : Arduino = microcontrôleur pur (électronique), Raspberry Pi = mini-ordinateur complet (Linux, Python), micro:bit = conçue pour l'école (blocs + capteurs intégrés) : chaque prototypage réussi = une lueur de « je comprends comment le monde marche ».</div>"},
{"t": "Informatique embarquée et objets connectés (2de)", "q": "Un objet connecté peut fonctionner « en local » ou « dans le cloud » : la différence :", "c": ["le traitement se fait dans l'objet (local, rapide, privé) ou sur des serveurs distants (cloud : accès à distance, mais données qui partent)", "le prix de l'objet", "la couleur", "la marque du Wi-Fi"], "a": 0, "e": "Local : autonome et discret (les données restent chez toi) : cloud : fonctionnalités à distance (application, historique, IA distante) mais tes données voyagent chez un tiers : un vrai critère de choix à l'achat.", "d": "<b>Local vs cloud</b> : une question de localisation des données ET du traitement.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison sur un thermostat : LOCAL : la régulation marche SANS Internet (panne du réseau ⟹ le chauffage fonctionne quand même : les données restent à la maison) : CLOUD : l'application téléphone, l'historique, la détection de panne à distance... mais il FAUT le réseau, et chaque relevé part chez le fabricant (et chez ses partenaires ? lire la politique !) : le cas d'école : une enceinte vocale : le mot-clé est détecté LOCALEMENT, la requête part dans le CLOUD : pourquoi ça compte : fiabilité (que reste-t-il en panne de réseau ?) et vie privée (qui écoute quoi ?) : les deux questions doivent précéder TOUT achat connecté.</div>"},
{"t": "La photographie numérique (2de)", "q": "Sur un capteur, la lumière devient :", "c": ["un faisceau laser", "du son", "du film argentique", "des charges électriques dans des photosites, converties en nombres"], "a": 3, "e": "Chaque photosite convertit la lumière reçue en charge électrique : le convertisseur traduit en nombres : l'image numérique est un TABLEAU de valeurs, dès la capture.", "d": "<b>De la lumière aux nombres</b> : la naissance du pixel.<div class='ex-detail'><u>Exemple rédigé</u> : le trajet complet : le photon traverse l'objectif (l'ouverture f/2,8 règle la quantité admise) : l'obturateur limite la durée (1/500 s) : le photosite absorbe le photon et accumule une charge (plus de lumière ⟹ plus de charge) : le convertisseur mesure et traduit en nombre (0-255 par canal de couleur) : à la sortie : 12 millions de triplets RVB = l'image : la conséquence théorique du chapitre : photographier, c'est MESURER la lumière et en faire un fichier de données — tout le reste (retouche, filtres, mode nuit) est du traitement de ces nombres.</div>"},
{"t": "La photographie numérique (2de)", "q": "Le triangle d'exposition réunit :", "c": ["JPEG, PNG, GIF", "sensibilité ISO, ouverture, vitesse d'obturation", "poids, résolution, format", "rouge, vert, bleu"], "a": 1, "e": "Les trois leviers de la lumière : ISO (amplification ⟹ bruit), ouverture (taille du trou ⟹ zone nette), vitesse (durée ⟹ flou ou figé) : toute photo est un compromis entre eux.", "d": "<b>ISO, ouverture, vitesse</b> : les trois curseurs de la lumière.<div class='ex-detail'><u>Exemple rédigé</u> : l'arbitrage en salle sombre pour figer un danseur : vitesse élevée requise (1/500) : la lumière manque : on ouvre à fond (f/1,8 : la profondeur de netteté se réduit — l'arrière-plan floute, il faut VISER juste !) : et on monte l'ISO à 3200 (le grain apparaît) : le trio se règle ENSEMBLE : on ne peut pas tout avoir (lumière, netteté du mouvement, propreté) : le photographe choisit son défaut : c'est aussi ce que fait le téléphone automatiquement — et le mode manuel te laisse le choix, maintenant que tu sais ce qui se joue.</div>"},
{"t": "La photographie numérique (2de)", "q": "Une couleur de pixel est généralement codée par :", "c": ["10 nombres", "un seul nombre décimal", "1 bit", "3 nombres (R, V, B) de 0 à 255"], "a": 3, "e": "Rouge, Vert, Bleu : 3 × 8 bits = 24 bits ≈ 16,7 millions de couleurs : (255, 255, 255) = blanc, (255, 0, 0) = rouge pur.", "d": "<b>3 canaux × 256 niveaux</b> : le mélange additif.<div class='ex-detail'><u>Exemple rédigé</u> : le système RVB : chaque pixel = un triplet (R, V, B) : (255, 0, 0) rouge pur : (0, 255, 0) vert : (255, 255, 0) = rouge + vert = JAUNE (mélange additif de lumières, différent des peintures !) : (128, 128, 128) = gris moyen : (0, 0, 0) noir : la retouche devient calcul : « éclaircir » = ajouter, « saturer » = écarter les valeurs des canaux : c'est parce que tout est nombre qu'un filtre, un logiciel ou une IA peuvent transformer la photo : l'informatique fondamentale du chapitre données, appliquée à l'image.</div>"},
{"t": "La photographie numérique (2de)", "q": "Le poids brut d'une photo de 12 millions de pixels en couleur (24 bits) est d'environ :", "c": ["12 Go", "360 Mo", "36 Ko", "36 Mo (12 M × 3 octets)"], "a": 3, "e": "Largeur × hauteur × 3 octets : 12 000 000 × 3 = 36 Mo avant compression : le JPEG la réduit à ~3-5 Mo (avec perte).", "d": "<b>36 Mo</b> : le calcul à savoir refaire.<div class='ex-detail'><u>Exemple rédigé</u> : le décompte : 12 000 000 pixels × 3 octets (R, V, B) = 36 Mo : pourquoi le fichier final pèse 3 Mo : la compression JPEG repère les répétitions et jette les détails peu perceptibles (rapport ~10:1) : les usages qui en découlent : l'original (36 Mo, ou RAW) = l'archive à garder : le JPEG = la version à diffuser : le web recomprime encore (~1 Mo) : les applications : calculer le nombre de photos d'une carte de 64 Go (≈ 16 000 photos JPEG) : estimer le poids d'un dossier d'archive : l'ordre de grandeur est un outil de décision, pas de la culture générale.</div>"},
{"t": "La photographie numérique (2de)", "q": "Le « mode nuit » des téléphones fonctionne par :", "c": ["un empilement de plusieurs prises alignées et moyennées (le bruit s'annule, le signal s'additionne)", "un capteur magique", "une exposition de 10 minutes", "un flash invisible"], "a": 0, "e": "Une pose longue à main levée serait floue : le téléphone prend une rafle de photos courtes, aligne, moyenne : la clarté sans le flou — un calcul statistique en temps réel.", "d": "<b>L'empilement statistique</b> : la photo calculée.<div class='ex-detail'><u>Exemple rédigé</u> : l'astuce en 3 temps : 1. rafle de 10-15 images courtes (chacune NETTE mais sombre — une pose longue serait floue du bougé !) : 2. alignement (reconnaissance des points communs entre les vues) : 3. moyenne pixel par pixel : le BRUIT est aléatoire (différent à chaque prise : il s'annule dans la moyenne), le SIGNAL est stable (il s'additionne) : résultat : +2 à 3 « stops » de clarté : la même technique (dite d'empilement) sert en astronomie et en imagerie médicale : la leçon SNT : le téléphone ne voit pas mieux, il CALCULE mieux : la photographie moderne est devenue une branche du traitement du signal.</div>"},
{"t": "La photographie numérique (2de)", "q": "Le zoom « numérique » d'un téléphone :", "c": ["change la focale", "rapproche optiquement", "recadre et agrandit l'image existante (d'où la perte de qualité, du flou)", "allume le flash"], "a": 2, "e": "Il n'y a pas de déplacement de lentilles : le logiciel CROPE et agrandit : les pixels manquants sont inventés (interpolation) : seul le zoom optique (ou un capteur dédié) rapproche sans perte.", "d": "<b>Un recadrage déguisé</b> : la supercherie utile à comprendre.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison : zoom OPTIQUE = les lentilles rapprochent la projection AVANT la capture (l'information lumineuse est bien là) : zoom NUMÉRIQUE = on prend la photo PUIS on agrandit une zone : il faut créer des pixels qui n'ont jamais été capturés (interpolation : moyenne des voisins) : d'où le flou et le « peigné » : règle pratique : se rapprocher physiquement (deux pas valent mieux que ×2 de zoom numérique !), ou utiliser le capteur dédié (les téléphones multi-objectifs ont souvent une « vraie » focale 2×/3×) : au-delà de la focale native, on recadre.</div>"},
{"t": "La photographie numérique (2de)", "q": "Le flou d'arrière-plan (bokeh) du mode portrait :", "c": ["calculé : détection du visage/sujet puis floutage artificiel de l'arrière-plan", "toujours naturel", "un film plastique", "purement optique"], "a": 0, "e": "Le logiciel repère le sujet, estime la profondeur et floute le reste : les erreurs (cheveux avalés par le flou !) trahissent le calcul : un objectif « portrait » grand capteur produit un bokeh OPTIQUE, différent.", "d": "<b>Le bokeh algorithmique</b> : l'illusion de profondeur.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : l'appareil détecte le visage (apprentissage) : il construit une CARTE de profondeur (qu'est-ce qui est proche, loin) : il applique un flou croissant avec la distance (imitant l'optique des grands capteurs) : les failles du calcul sont visibles : une mèche de cheveux « avalée » par le flou, une oreille nette-sur-flou, un bord qui « saigne » : pourquoi le sujet : la profondeur de champ réelle exige un GRAND capteur (taille physique : les téléphones ont des capteurs minuscules ⟹ tout est net d'office ⟹ il faut SIMULER) : c'est un calcul d'images, pas une optique : connaître la différence = choisir et comprendre ses outils.</div>"},
{"t": "La photographie numérique (2de)", "q": "Le format JPEG, comparé au PNG :", "c": ["est illisible", "n'a pas de métadonnées", "est compressé AVEC perte (léger, diffusion) quand le PNG est sans perte (retouche, graphiques)", "est toujours sans perte"], "a": 2, "e": "JPEG : ~10× plus léger mais irréversible (les détails jetés ne reviennent pas) : PNG : intact mais plus lourd : photographie à diffuser ⟹ JPEG, image à retoucher/graphics ⟹ PNG.", "d": "<b>Perte vs sans perte</b> : le bon format au bon moment.<div class='ex-detail'><u>Exemple rédigé</u> : le piège du ré-enregistrement : ouvrir un JPEG, retoucher, enregistrer (recompression !), recommencer 5 fois : les artefacts s'accumulent (blocs, halos) : le fichier « se fatigue » : la stratégie pro : conserver l'original, retoucher une COPIE, exporter en JPEG pour diffuser, garder le projet en sans-perte : et pour le web (graphiques, captures, logos) : PNG (bords nets, transparence) : la compression n'est pas un détail technique : c'est un choix de conservation de l'information.</div>"},
{"t": "La photographie numérique (2de)", "q": "Les métadonnées EXIF d'une photo contiennent notamment :", "c": ["le prix de l'appareil", "le nom des personnes", "l'ADN du photographe", "date, réglages (vitesse, ISO), modèle d'appareil, parfois la position GPS"], "a": 3, "e": "Des données SUR la photo voyagent avec elle : pratiques pour classer... révélatrices pour la vie privée (localisation !) : les vérificateurs d'images les exploitent, et il faut les nettoyer avant une publication publique.", "d": "<b>Le carnet de bord du fichier</b> : la photo qui parle.<div class='ex-detail'><u>Exemple rédigé</u> : l'exploitation double : USAGE : trier par date, retrouver « quelle ouverture pour ce portrait ? », prouver qu'une photo est bien de SOI (droit d'auteur : l'EXIF porte la paternité technique) : RISQUE : « regarde mon plat » + EXIF = hier 19h42, à 200 m de chez moi (GPS !), avec mon téléphone précis : les vérificateurs d'images contrefaisantes utilisent aussi l'EXIF (incohérences entre réglages et scène...) : les gestes : désactiver la géolocalisation des photos, ou nettoyer l'EXIF (les réseaux sociaux le font souvent à la publication — mais pas tous !) : information ET exposition : les deux visages des métadonnées.</div>"},
{"t": "La photographie numérique (2de)", "q": "Le nombre de mégapixels détermine :", "c": ["la qualité de l'objectif", "la taille de l'image (le nombre de pixels), PAS à lui seul la qualité photo", "le prix", "le bruit uniquement"], "a": 1, "e": "Un capteur plus fourni n'est pas meilleur : la TAILLE physique des photosites (capteur plus grand = plus de lumière), l'objectif et le traitement logiciel pèsent davantage : la course aux mégapixels est un argument marketing.", "d": "<b>Une mesure parmi d'autres</b> : le mythe des mégapixels.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement physique : un capteur de téléphone (~ 50 mm²) répartit 50 Mpixels sur des photosites minuscules : chacun reçoit peu de lumière ⟹ bruit : un appareil photo à capteur « plein format » (~ 860 mm², 17× plus grand !) avec 24 M a des photosites ÉNORMES ⟹ netteté, couleur de nuit, faible bruit : la vraie hiérarchie : taille du capteur > qualité de l'objectif > traitement logiciel > nombre de pixels : c'est pour ça qu'un « 12 M » professionnel surpasse un « 200 M » de téléphone : savoir lire les publicités est aussi une compétence SNT.</div>"},
{"t": "Histoire et architecture des ordinateurs (1re)", "q": "L'apport décisif du modèle de von Neumann (1945) :", "c": ["l'écran couleur", "la souris", "Internet", "le programme est stocké en mémoire comme les données (machine universelle, plus de recâblage)"], "a": 3, "e": "Avant, programmer = recâbler (des jours sur l'ENIAC !) : après, changer de tâche = charger un autre programme : la machine devient universelle.", "d": "<b>Le programme enregistré</b> : l'idée qui fonde TOUT.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison avant/après : ENIAC (1945) : « programmer » = brancher des câbles et manipuler des commutateurs pendant des jours : changement de tâche = recommencer ! : modèle de von Neumann : instructions ET données dans la MÊME mémoire : la machine lit, décode, exécute : changer de tâche = charger un autre fichier : la conséquence en cascade : les programmes deviennent des données (copiables, compilables... et infectables : les virus exploitent exactement cette dualité !) : Turing avait posé la théorie (1936 : une machine universelle paramétrée par un programme) : von Neumann et son équipe en font l'architecture concrète encore utilisée aujourd'hui, dans chaque téléphone.</div>"},
{"t": "Histoire et architecture des ordinateurs (1re)", "q": "Ada Lovelace est célèbre pour :", "c": ["avoir inventé le transistor", "avoir écrit le premier algorithme destiné à une machine (pour la machine analytique de Babbage, 1843)", "le premier ordinateur portable", "avoir fondé Microsoft"], "a": 1, "e": "Sur la machine analytique (jamais achevée !), elle conçoit la suite d'opérations pour calculer les nombres de Bernoulli : le premier programme de l'histoire, un siècle avant les ordinateurs.", "d": "<b>Le premier algorithme</b> : 1843, pour une machine qui n'existera jamais.<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe fondateur : la machine analytique de Babbage restera au stade des plans (trop complexe pour la mécanique de l'époque) : Lovelace traduit et commente un article de Menabrea et y ajoute la méthode de calcul complète des nombres de Bernoulli — une suite d'opérations pour la machine : elle perçoit mieux que quiconque que la machine pourrait manipuler des SYMBOLES, pas seulement des nombres (une idée qui annonce l'informatique entière) : d'où sa place unique dans l'histoire : première personne à écrire un programme, pour un ordinateur imaginaire : l'abstraction précède la machine.</div>"},
{"t": "Histoire et architecture des ordinateurs (1re)", "q": "Dans l'architecture de von Neumann, l'UAL (unité arithmétique et logique) :", "c": ["effectue les calculs et les tests logiques (additions, comparaisons)", "gère le Wi-Fi", "stocke les fichiers", "affiche à l'écran"], "a": 0, "e": "C'est le calculate du processeur : l'unité de commande orchestre, l'UAL calcule, la mémoire stocke, les E/S communiquent : quatre organes, des bus.", "d": "<b>Le calculateur</b> : le bureau de travail du processeur.<div class='ex-detail'><u>Exemple rédigé</u> : la répartition sur « a = 3 : b = a + 2 » : l'unité de COMMANDE fetch l'instruction « additionne » : elle envoie à l'UAL les deux opérandes (3 et 2, venus de la mémoire) : l'UAL produit 5 : la commande range le résultat : l'UAL fait AUSSI la logique (ET, OU, comparaisons : le SI des programmes !) : l'analogie : la commande = le chef d'orchestre (lit la partition) : l'UAL = le soliste (exécute les passages techniques) : mémoire = le pupitre : le tout au rythme du cycle fetch-decode-execute, des milliards de fois par seconde.</div>"},
{"t": "Histoire et architecture des ordinateurs (1re)", "q": "Le cycle fondamental d'un processeur :", "c": ["allumer-exécuter-éteindre", "cliquer-glisser-déposer", "lire-écrire-imprimer", "fetch-decode-execute (chercher l'instruction, la décoder, l'exécuter), en boucle"], "a": 3, "e": "Chaque instruction suit ce cycle : chercher en mémoire (fetch), décoder (quelle opération ? quels opérandes ?), exécuter, puis passer à la suivante : des milliards de fois par seconde.", "d": "<b>Fetch-decode-execute</b> : le battement de cœur de la machine.<div class='ex-detail'><u>Exemple rédigé</u> : le déroulé précis : le compteur de programme (PC) indique l'adresse de la prochaine instruction : FETCH : lecture de l'instruction à cette adresse : DECODE : l'unité de commande identifie « c'est une addition, opérandes aux adresses X et Y » : EXECUTE : l'UAL calcule, le résultat est rangé : le PC s'incrémente et on recommence : l'enseignement : peu importe que le programme soit un jeu ou un tableur, la machine ne fait TOUJOURS QUE ÇA : la puissance vient de la répétition à GHz : comprendre ce cycle = comprendre pourquoi un processeur est bête et rapide, et pourquoi le logiciel (l'ordre des instructions) est toute l'intelligence.</div>"},
{"t": "Histoire et architecture des ordinateurs (1re)", "q": "La loi de Moore (1965) concerne :", "c": ["la vitesse des voitures", "le prix des logiciels", "le doublement du nombre de transistors par puce environ tous les 2 ans (observation, encore approximative des décennies)", "la taille des écrans"], "a": 2, "e": "C'est une OBSERVATION (pas une loi physique !) : elle a tenu ~50 ans : aujourd'hui, la miniaturisation se heurte aux limites physiques, d'où le passage aux cœurs multiples (parallélisme).", "d": "<b>La densité de transistors</b> : l'observation qui a défini une industrie.<div class='ex-detail'><u>Exemple rédigé</u> : la lecture correcte : Moore (cofondateur d'Intel) observe en 1965 que la densité DOUBLE environ tous les 2 ans : cela a tenu jusqu'aux années 2010 (un processeur : de quelques milliers de transistors en 1971 à des dizaines de MILLIARDS aujourd'hui !) : les limites actuelles : gravure à quelques nanomètres (presque la taille de quelques atomes !), chaleur, coûts : la réponse de l'industrie : multi-CŒURS (parallélisme), spécialisation (GPU, puces IA) : l'erreur à éviter au contrôle : « la loi de Moore dit que les ordinateurs doublent de vitesse tous les 2 ans » : NON, elle parle de densité de transistors : la vitesse en dépend... indirectement.</div>"},
{"t": "Histoire et architecture des ordinateurs (1re)", "q": "L'illusion que plusieurs programmes tournent « en même temps » s'explique par :", "c": ["la fréquence du bus", "le Wi-Fi", "la magie des écrans", "le partage du temps : l'OS découpe le processeur en tranches attribuées à tour de rôle aux processus"], "a": 3, "e": "Le processeur bascule entre processus toutes les quelques millisecondes (sauvegarde/restauration du contexte) : trop rapide pour être perçu : les cœurs multiples ajoutent du VRAI parallélisme.", "d": "<b>Le partage du temps</b> : l'orchestration invisible.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : musique ⟶ 4 ms ⟶ navigateur ⟶ 4 ms ⟶ musique... : à chaque bascule, l'OS SAUVEGARDE le contexte du processus sortant (registres, position) et restaure celui de l'entrant : l'humain ne voit rien (100 bascules par seconde) : et la musique ne saccade pas car elle lit en avance dans un tampon : les concepts à relier : processus (programme en cours d'exécution avec son contexte), ordonnanceur (l'arbitre de l'OS), mémoire protégée (chaque processus dans son espace : un plantage n'emporte pas les autres — d'où le gestionnaire des tâches qui peut TUER un seul processus) : quand « l'ordinateur rame » : trop de processus pour les tranches disponibles.</div>"},
{"t": "Histoire et architecture des ordinateurs (1re)", "q": "Le transistor (1947, Bell Labs) a remplacé :", "c": ["les disques durs", "l'écran", "le clavier", "les lampes (tubes à vide) : plus petit, plus fiable, moins chaud, moins gourmand"], "a": 3, "e": "Les lampes chauffaient, claquaient, encombraient (l'ENIAC : 18 000 tubes, 30 tonnes !) : le transistor, miniaturisable en série, rend possible... la loi de Moore et le microprocesseur.", "d": "<b>Le remplacement des lampes</b> : le basculement technologique décisif.<div class='ex-detail'><u>Exemple rédigé</u> : le avant/après chiffré : ENIAC (lampes) : 18 000 tubes, 30 tonnes, 160 kW (la consommation d'un immeuble !), pannes fréquentes (une lampe par jour à remplacer) : transistor : quelques millimètres (aujourd'hui quelques nanomètres !), quasi indestructible, milliwatts : la conséquence en chaîne : le circuit intégré (1958, Kilby/Noyce : plusieurs transistors sur une puce) ⟹ le microprocesseur (1971, Intel 4004 : un ordinateur de calcul sur une puce) ⟹ l'ordinateur personnel ⟹ le téléphone : le transistor est LE composant : il amplifie et commute (0/1) : toute l'informatique moderne est de la matière condensée qui bascule.</div>"},
{"t": "Histoire et architecture des ordinateurs (1re)", "q": "Assembler les niveaux de langage, du plus proche de la machine au plus humain :", "c": ["Python ⟶ assembleur ⟶ binaire", "assembleur ⟶ Python ⟶ binaire", "binaire ⟶ Python ⟶ assembleur", "binaire ⟵ assembleur ⟵ Python"], "a": 3, "e": "Python (haut niveau) est traduit vers l'assembleur (mnémoniques lisibles : MOV, ADD) puis le langage machine (binaire exécutable par l'UAL) : chaque couche abstrait la précédente.", "d": "<b>Binaire ⟵ assembleur ⟵ Python</b> : la chaîne de traduction.<div class='ex-detail'><u>Exemple rédigé</u> : la descente concrète de « b = a + 2 » : Python : lisible, une ligne : interpréteur Python : traduit vers du bytecode puis des instructions machine : assembleur : ADD R1, R2, 2 (mnémonique : encore humain) : langage machine : 10001011 (la seule langue de l'UAL) : la remontée historique : les premiers programmeurs écrivaient en binaire (des années 1940 !) : l'assembleur (années 50) : un cran de confort : Grace Hopper invente le COMPILATEUR (traduction automatique depuis un langage proche de l'anglais) : chaque étage gagné = des milliers de programmeurs en plus : l'abstraction EST l'histoire de l'informatique.</div>"},
{"t": "Histoire et architecture des ordinateurs (1re)", "q": "Alan Turing (1936) est l'auteur de :", "c": ["la formalisation de la machine universelle à calculer (ce qui est calculable par une machine, paramétrée par un programme)", "le langage Python", "le transistor", "le premier ordinateur"], "a": 0, "e": "Avant tout ordinateur réel, il définit mathématiquement ce qu'une machine PEUT calculer (et ce qu'elle ne peut pas !) : sa machine universelle, lue par une bande, est le modèle théorique de tout ordinateur.", "d": "<b>La machine universelle</b> : la théorie avant la machine.<div class='ex-detail'><u>Exemple rédigé</u> : le geste historique : en 1936, Turing répond à un problème de logique (la décision) en imaginant une machine abstraite : une bande, une tête de lecture, des états, des règles : il montre qu'EXISTER une machine UNIQUE qui, lue un programme sur sa bande, simule N'IMPORTE QUELLE autre machine (universalité !) : le programme EST la donnée (9 ans avant von Neumann) : les conséquences : l'ordinateur comme machine GÉNÉRIQUE (pas une machine par tâche) : et les limites (certains problèmes ne sont PAS calculables : l'arrêt d'un programme !) : sa vie : codebreaker (Enigma, Bletchley Park), père de l'IA (le « test de Turing », 1950) : le pont : sa théorie de 1936 court dans chaque smartphone.</div>"},
{"t": "Histoire et architecture des ordinateurs (1re)", "q": "UNIX (1969) a une descendance qui inclut :", "c": ["Linux, macOS, Android (mais pas Windows)", "uniquement Windows", "les calculatrices uniquement", "Python et Scratch"], "a": 0, "e": "Le noyau Linux (1991, Linus Torvalds) anime serveurs, Android, objets : macOS/iOS descendent de la famille BSD : Windows appartient à un autre lignage : la culture UNIX (fichiers, shell, small tools) façonne l'informatique actuelle.", "d": "<b>Linux, macOS, Android</b> : l'arbre généalogique.<div class='ex-detail'><u>Exemple rédigé</u> : la généalogie simplifiée : UNIX (Bell Labs, 1969 : Thompson, Ritchie) : idées fondatrices (tout est fichier, outils petits et composables, portabilité en C) : BSD (branche de Berkeley) ⟹ macOS/iOS : MINIX ⟹ inspiré par Linus Torvalds ⟹ Linux (1991) ⟹ serveurs du monde (~90 % du web !), Android, supercalculateurs, Raspberry Pi : Windows : lignage séparé (MS-DOS/NT) : pourquoi ça compte en NSI : le shell, le couple Python/Linux, les commandes (ls, cd, grep) viennent de cette culture : utiliser un terminal Linux, c'est toucher l'histoire VIVANTE de l'informatique.</div>"},
{"t": "Représentation binaire des données (1re)", "q": "Avec 8 bits, on peut coder :", "c": ["8 valeurs", "16 valeurs", "1024 valeurs", "256 valeurs (2^8)"], "a": 3, "e": "n bits ⟹ 2^n combinaisons : 8 bits ⟹ 256 (0 à 255) : c'est la règle qui ouvre tout le chapitre (adresses IPv4, couleurs RVB, entiers signés...).", "d": "<b>2^8 = 256</b> : la règle générale 2^n.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement à dérouler au contrôle : chaque bit a 2 états ⟹ 2 × 2 × ... × 2 (8 fois) = 256 : applications immédiates : un octet = 256 valeurs ⟹ un canal de couleur R, V, B (0-255 : 16,7 millions de couleurs en 24 bits !) : les bornes des entiers : non signés 8 bits : 0 à 255 : signés : -128 à +127 : et l'échelle : 4 bits = 16 (les chiffres hexadécimaux !), 16 bits = 65 536, 32 bits ≈ 4,3 milliards (d'où la fin des adresses IPv4 !) : mémoriser 2^8=256, 2^10=1024, 2^16, 2^32 évite 80 % des erreurs de calcul.</div>"},
{"t": "Représentation binaire des données (1re)", "q": "Le nombre binaire 1011 vaut en décimal :", "c": ["1011", "13", "11", "23"], "a": 2, "e": "Poids de droite à gauche : 1, 2, 4, 8 : 1011 = 8 + 0 + 2 + 1 = 11 : toujours additionner les poids des bits à 1.", "d": "<b>11</b> : la somme des poids.<div class='ex-detail'><u>Exemple rédigé</u> : la méthode visuelle : écrire les poids au-dessus des bits : 8 4 2 1 / 1 0 1 1 : additionner là où le bit vaut 1 : 8 + 2 + 1 = 11 : l'entraînement systématique : 1101 = 8+4+1 = 13 : 1000 = 8 : 1111 = 15 (tous les poids) : 10000 = 16 (un nouveau cran) : et la vérification inverse par divisions : 11 ÷ 2 = 5 r 1 : 5 ÷ 2 = 2 r 1 : 2 ÷ 2 = 1 r 0 : 1 ÷ 2 = 0 r 1 : restes lus de BAS en haut : 1011 ✓ : les deux sens doivent être aussi fluides l'un que l'autre.</div>"},
{"t": "Représentation binaire des données (1re)", "q": "Pour convertir 45 en binaire par divisions successives, on lit les restes :", "c": ["de bas en haut (du dernier reste au premier)", "en les additionnant", "au hasard", "de haut en bas"], "a": 0, "e": "On divise par 2 jusqu'à 0 en notant les restes : le PREMIER reste est le bit de poids faible : la lecture remonte donc du dernier calcul vers le premier.", "d": "<b>De bas en haut</b> : LE piège classique du chapitre.<div class='ex-detail'><u>Exemple rédigé</u> : le déroulé complet pour 45 : 45 ÷ 2 = 22 reste 1 : 22 ÷ 2 = 11 reste 0 : 11 ÷ 2 = 5 reste 1 : 5 ÷ 2 = 2 reste 1 : 2 ÷ 2 = 1 reste 0 : 1 ÷ 2 = 0 reste 1 : les restes DANS L'ORDRE d'obtention : 1,0,1,1,0,1 : la lecture correcte (du DERNIER au premier) : 101101 : vérification : 32+8+4+1 = 45 ✓ : pourquoi ce sens : chaque division révèle un bit de poids PLUS FORT : le premier reste est la case 2^0 (poids faible) : le réflexe examen : toujours vérifier par la somme des poids — 30 secondes qui sauvent la question.</div>"},
{"t": "Représentation binaire des données (1re)", "q": "L'encodage UTF-8 sert à :", "c": ["chiffrer les mots de passe", "représenter tous les caractères du monde (é, 你, 😊) sur 1 à 4 octets, en restant compatible ASCII", "compresser les photos", "accélérer le processeur"], "a": 1, "e": "ASCII (128 codes) ne suffit qu'à l'anglais : Unicode attribue un point de code à chaque écriture, UTF-8 l'encode en octets de longueur variable (les caractères ASCII restent sur 1 octet).", "d": "<b>Le codage universel</b> : la paix des écritures.<div class='ex-detail'><u>Exemple rédigé</u> : l'histoire du problème : ASCII (années 60) : 7 bits, 128 codes : parfait pour « Hello » : mais « é », « ç », le grec, le chinois ? Chaque pays bricolait ses codes « étendus » : le même fichier s'affichait différemment selon la machine (les caractères bizarres des vieux e-mails !) : Unicode : un catalogue universel (plus de 150 000 caractères : toutes les écritures, symboles, emojis) : UTF-8 : l'encodage astucieux (variable : 1 octet si ASCII, 2 pour é, 3 pour 你, 4 pour 😊) : le test Python : len('😊') = 1 caractère, mais 4 octets encodés : d'où les bugs classiques : couper un texte au mauvais octet = caractère cassé : compter en OCTETS pour la taille, en CARACTÈRES pour l'affichage.</div>"},
{"t": "Représentation binaire des données (1re)", "q": "Sur 8 bits en complément à 2, l'intervalle codable est :", "c": ["-255 à +255", "0 à 255", "-128 à +127", "-128 à +128"], "a": 2, "e": "256 combinaisons pour 255 nombres et... le 0 ! : la répartition : 128 négatifs, 128 positifs ou nuls : d'où -128 (et pas -127) comme borne basse.", "d": "<b>-128 à +127</b> : l'asymétrie du zéro.<div class='ex-detail'><u>Exemple rédigé</u> : le compte : 8 bits = 256 codes : avec signe : il faut caser le 0 (un code « inutile » côté positif !) : répartition : 00000000 = 0 : 01111111 = +127 : 10000000 = -128 : 11111111 = -1 : l'astuce du complément à 2 : -1 + 1 = 1111 1111 + 1 = 1 0000 0000 = 0 (le 9e bit déborde et s'ignore !) : d'où sa puissance : l'additionneur fait les soustractions SANS circuit spécial : l'erreur type : le dépassement (integer overflow) : 127 + 1 = -128 (!) : un bug célèbre (l'an 2038 des horloges 32 bits signées !) : quand un jeu affiche un score « négatif » à un niveau trop long : c'est exactement ça.</div>"},
{"t": "Représentation binaire des données (1re)", "q": "Une minute de son stéréo qualité CD (44,1 kHz, 16 bits) pèse environ :", "c": ["10 Ko", "1 Go", "100 Mo", "≈ 10 Mo (44 100 × 2 octets × 2 canaux × 60 s)"], "a": 3, "e": "44 100 relevés/s × 2 octets × 2 voies × 60 s ≈ 10,6 Mo : d'où l'intérêt des formats compressés (MP3 : ~1 Mo/min, en jetant l'inaudible).", "d": "<b>≈ 10 Mo par minute</b> : le calcul du naïf qui surprend.<div class='ex-detail'><u>Exemple rédigé</u> : le décompte exact : échantillonnage à 44 100 Hz (le standard CD, largement au-dessus du seuil d'audition ~20 kHz : le théorème de l'échantillonnage exige le double de la plus haute fréquence !) : chaque échantillon : 16 bits = 2 octets : deux canaux (stéréo) : total : 44 100 × 2 × 2 = 176 400 octets/s ≈ 176 Ko/s : × 60 = ~10,6 Mo/min : les conséquences historiques : un disque dur de 1995 (~500 Mo) = 47 minutes de musique brute (!) : d'où le MP3 (années 90 : compression « avec perte » psychoacoustique : on jette ce que l'oreille perçoit mal : ~10× plus léger) : le calcul explique l'INVENTION : c'est la démonstration que la taille des données façonne les technologies.</div>"},
{"t": "Représentation binaire des données (1re)", "q": "L'opération 170 ET 15 (170 &amp; 15) donne :", "c": ["170", "185", "10 (les 4 bits faibles de 170 : le masque isole la partie basse)", "0"], "a": 2, "e": "170 = 1010 1010 : 15 = 0000 1111 : le ET garde les bits à 1 des DEUX : résultat 0000 1010 = 10 : le masque isole une partie de l'octet.", "d": "<b>10</b> : le masque qui isole les bits faibles.<div class='ex-detail'><u>Exemple rédigé</u> : la manipulation bit à bit : 170 = 1010 1010 : 15 = 0000 1111 : ET colononne par colonne (1 seulement si les DEUX valent 1) : 0000 1010 = 10 : l'usage type : extraire les composantes d'un pixel (le bleu de 0x187126 : masque 0xFF ⟹ 0x26 = 38 !), lire des drapeaux (options codées en bits : le masque teste si l'option 4 est active !) : le vocabulaire : masque (AND), positionner (OR : x | 16 force le bit 5), inverser (XOR : x ^ 16 bascule le bit 5) : ces opérations vivent dans l'UAL, les réseaux (sous-réseaux IP), la cryptographie et le graphisme : c'est LA grammaire du bit.</div>"},
{"t": "Représentation binaire des données (1re)", "q": "Décaler un entier de 2 crans à gauche (n &lt;&lt; 2) :", "c": ["le multiplie par 4 (chaque cran = ×2)", "le divise par 4", "l'ajoute de 2", "ne change rien"], "a": 0, "e": "En binaire, décaler d'un cran à gauche = ×2 (comme ajouter un 0 en base 10 = ×10 !) : 2 crans = ×4 : à droite = division entière par 2.", "d": "<b>×4</b> : la multiplication gratuite.<div class='ex-detail'><u>Exemple rédigé</u> : l'analogie décimale qui éclaire : 13 en base 10 : ajouter un 0 à droite = 130 = ×10 : en base 2 : 1101 (13) : décaler d'un cran = 11010 (26 = ×2) : deux crans = 110100 = 52 (×4) ✓ : pourquoi les programmeurs l'aiment : le décalage est UNE opération matérielle ultra-rapide (là où la multiplication coûte plusieurs cycles !) : usages réels : calculer 2^n, aligner des champs de bits, les tables de hachage, les graphismes : et à droite : n >> 1 = division entière par 2 (n >> 2 par 4 : 13 >> 2 = 3) : à connaître absolument : les deux sens, et leur analogie avec les zéros en base 10.</div>"},
{"t": "Représentation binaire des données (1re)", "q": "L'hexadécimal est utilisé parce que :", "c": ["c'est du français", "il économise la batterie", "il est plus joli", "1 chiffre hexa = exactement 4 bits : la base 16 rend le binaire lisible (1101 1010 = 0xDA)"], "a": 3, "e": "2^4 = 16 : chaque groupe de 4 bits correspond à UN chiffre hexa (0-9, A-F) : les adresses, les couleurs (#FF7F00), les octets s'écrivent de façon compacte et alignée.", "d": "<b>1 chiffre hexa = 4 bits</b> : la notation du professionnel.<div class='ex-detail'><u>Exemple rédigé</u> : la conversion fluide à acquérir : découper l'octet en deux quartets : 1101 = 13 = D : 1010 = 10 = A ⟹ 0xDA = 218 : les usages quotidiens : les couleurs web (#FF7F00 : orange : chaque paire = un canal RVB !), les adresses MAC et IP, les affichages d'octets (dumps mémoire : DA 3F...), les codes d'erreur : l'argument de fond : l'humain lit mal 11011010 mais bien 0xDA : l'hexa est le MEETING POINT du binaire machine et de l'œil humain : c'est pour ça qu'il est partout — et que le réflexe « quartet ⟹ chiffre hexa » doit devenir automatique (table : 1010=A, 1011=B, 1100=C, 1101=D, 1110=E, 1111=F).</div>"},
{"t": "Représentation binaire des données (1re)", "q": "Un disque annoncé à « 1 To » affiche parfois 931 Go dans le système :", "c": ["une panne du disque", "la différence entre les préfixes : 1 To commercial = 10^12 octets, alors que le système compte en 2^40 (1 099 511 627 776) : 10^12 / 2^40 ≈ 0,909", "un virus", "les fichiers cachés"], "a": 1, "e": "Le fabricant compte en puissances de 10 (1 TB = 10^12), le système en puissances de 2 (1 Tio = 2^40) : les deux sont « corrects » selon la convention — d'où l'écart de ~9 %.", "d": "<b>Deux conventions</b> : la bataille des préfixes.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul qui explique tout : 1 TB commercial = 1 000 000 000 000 octets (10^12) : le système d'exploitation divise par 1024 trois fois (Go binaires : 2^30 = 1 073 741 824) : 10^12 ÷ 2^30 ≈ 931 « Go » : aucune arnaque, DEUX unités : décimales (kB, MB, GB, TB : ×1000 : le commerce, les débits réseaux !) et binaires (Kio, Mio, Gio, Tio : ×1024 : la mémoire !) : l'ordre de grandeur de l'écart : ~2,4 % au Go, ~4,8 % au To, ~9 % au Tio... : le réflexe NSI : préciser l'unité dans un calcul, et savoir convertir : les questions de débit (Mb/s = mégabits décimaux !) et de stockage se piègent exactement là.</div>"},
{"t": "Python : types, variables et instructions (1re)", "q": "La fonction input() renvoie :", "c": ["une chaîne de caractères (à convertir avec int() ou float() avant tout calcul)", "un booléen", "un entier", "un flottant"], "a": 0, "e": "Toute saisie arrive en TEXTE : int(input()) pour un entier, sinon '18' + 2 déclenche un TypeError.", "d": "<b>Du texte, toujours</b> : le réflexe fondateur.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario du bug : age = input() ⟹ l'utilisateur tape 18 : age vaut la CHAÎNE '18' (deux caractères, '1' et '8') : age + 1 ⟹ TypeError : can only concatenate str (et '181' avec age + '1' : concaténation surprise !) : la correction : age = int(input()) : la version flottante : taille = float(input()) (accepte '1.75') : la robustesse au programme : redemander tant que la conversion échoue (try/except, plus tard dans l'année) : l'erreur TypeError « str vs int » est LA première erreur du débutant : la connaître AVANT de la rencontrer fait gagner des heures.</div>"},
