var COURS_META = [
{"id": "ordinateur-composants", "theme": "L'ordinateur et ses composants (3e)", "niveau": "3e", "titre": "L'ordinateur et ses composants", "cours": "<div class=\"cours-head\"><h2>L'ordinateur et ses composants</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Un ordinateur : entrer, traiter, stocker, sortir</h3>\n<div class=\"tip\"><b>Modèle :</b> ENTRÉES (clavier, souris, écran tactile, micro) ⟶ TRAITEMENT (le processeur exécute les instructions) ⟶ SORTIES (écran, haut-parleurs, imprimante) + STOCKAGE (disque, mémoire).<br>Texte, image, son, vidéo ne sont QUE des nombres (des 0 et des 1) pour la machine : tout ce qui est calculable avec ces nombres peut y être traité.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — que se passe-t-il quand j'appuie sur « A » ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Suivre le voyage complet de la lettre « A » du clavier à l'écran.</div><div class=\"etu\"><b>Étape 1</b> — <b>L'entrée</b> : la touche enfoncée envoie un signal électrique : le contrôleur du clavier émet un code (le « scancode ») vers l'ordinateur.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le traitement</b> : le système d'exploitation reçoit le code, le logiciel de traitement de texte le transforme en caractère (selon la disposition AZERTY : la même touche donne « A » ou « Q » selon le clavier !).</div><div class=\"etu\"><b>Étape 3</b> — <b>La sortie</b> : le caractère rejoint le document en mémoire, la carte graphique calcule quels pixels allumer, l'écran affiche « A ». Trois composants clés ont travaillé : processeur (calcul), mémoire vive (rappel immédiat), carte graphique (affichage) : le tout en quelques millisecondes.</div></div></details>\n<h3>2. Les composants et leurs rôles</h3>\n<div class=\"tip\"><b>Processeur (CPU)</b> : le chef d'orchestre : il exécute les instructions (fréquence en GHz = milliards d'opérations par seconde). <b>Mémoire vive (RAM)</b> : le bureau de travail : rapide mais VOLATILE (tout s'efface à l'extinction). <b>Disque (SSD/HDD)</b> : l'armoire : plus lent mais PERMANENT (les fichiers survivent). <b>Carte graphique (GPU)</b> : calcul massif d'images. <b>Carte mère</b> : la route qui relie tout. <b>Alimentation</b> : l'énergie.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi ajouter de la RAM accélère l'ordinateur</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un ordinateur rame quand on ouvre beaucoup d'onglets. Expliquer avec RAM vs disque.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le bureau plein</b> : chaque onglet, chaque logiciel ouvert occupe de la RAM (le travail en cours) : quand la RAM est pleine, le système déborde sur le DISQUE (« mémoire virtuelle »).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le goulot</b> : le disque est ~1000 fois plus lent que la RAM : l'aller-retour constant ralentit TOUT (l'ordinateur « rame »).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le remède</b> : plus de RAM = un plus grand bureau = moins de débordement : le processeur, lui, n'est PAS en cause (il attend les données) : c'est le raisonnement complet du technicien : identifier le GOULOT D'ÉTRANGLEMENT avant d'acheter.</div></div></details>\n<h3>3. Système d'exploitation et logiciels</h3>\n<div class=\"tip\"><b>OS</b> (Windows, macOS, Linux, Android) : le chef qui gère matériel + fichiers + lance les applications : sans lui, la machine est inutilisable. <b>Logiciels</b> : des suites d'instructions qui disent au processeur quoi faire. <b>Langage machine</b> : des 0 et des 1 : les langages (Python, Scratch, C) sont traduits vers elle.<br><b>Règle :</b> utilisateur ⟶ logiciels ⟶ OS ⟶ matériel : chaque couche cache la complexité de celle d'en dessous (abstraction).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — classer une action dans la bonne couche</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Où classer : « enregistrer une photo », « gérer l'alimentation du disque », « appliquer un filtre » ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le tri</b> : enregistrer une photo = LOGICIEL (l'application demande une écriture) : l'OS traduit et commande le matériel.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le bas de la pile</b> : gérer l'alimentation = OS (il pilote le disque, décide des modes veille) : le filtre = logiciel (calcul de pixels).</div><div class=\"etu\"><b>Étape 3</b> — <b>La règle</b> : l'utilisateur parle aux logiciels, les logiciels parlent à l'OS, l'OS parle au matériel : on ne saute jamais une couche : c'est ce qui permet de changer de marque de disque sans réécrire le moindre logiciel (l'OS absorbe les différences) : c'est l'ABSTRACTION, mot-clé de l'informatique.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> RAM ≠ disque (volatile vs permanent : fermer sans enregistrer = tout perdu) : le processeur ne « pense » pas, il exécute : la fréquence seule ne mesure pas la vitesse (goulot, architecture, RAM) : l'OS n'est pas « un logiciel comme les autres » (c'est la couche de pilotage) : un ordinateur éteint garde ses fichiers (stockage permanent) mais pas son travail en cours.</div>"},
{"id": "reseaux-internet", "theme": "Le réseau et Internet (3e)", "niveau": "3e", "titre": "Le réseau et Internet", "cours": "<div class=\"cours-head\"><h2>Le réseau et Internet</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Du réseau local à Internet</h3>\n<div class=\"tip\"><b>Réseau</b> : des machines reliées qui échangent. <b>Réseau local</b> (maison, école : la box relie tout). <b>Internet</b> : le réseau des réseaux : des millions de réseaux interconnectés, sans patron, reliés par des « autoroutes » (câbles sous-marins, fibres !).<br><b>Client / serveur</b> : ma machine (cliente) DEMANDE : une machine (serveur) RÉPOND (page web, vidéo, jeu) : il n'y a pas de « cloud flottant » : des serveurs dans des datacenters.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le voyage d'une page web</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire les étapes entre la frappe d'une adresse et l'affichage de la page.</div><div class=\"etu\"><b>Étape 1</b> — <b>La traduction du nom</b> : « wikipedia.org » ne désigne pas une machine : le DNS (l'annuaire d'Internet) le traduit en adresse IP (ex. 91.198.174.192), le « numéro de téléphone » du serveur.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'acheminement</b> : ma requête est découpée en PAQUETS, étiquetés : les ROUTEURS les relaient de réseau en réseau (99 % du trafic intercontinental passe dans des câbles SOUS-MARINS !).</div><div class=\"etu\"><b>Étape 3</b> — <b>L'aller-retour</b> : le serveur renvoie la page (en paquets), mon navigateur les réassemble et affiche : le tout en ~0,1 s : chaque routeur décide localement : si un chemin meurt, on en prend un autre (résilience).</div></div></details>\n<h3>2. Adresses, protocoles, identités</h3>\n<div class=\"tip\"><b>IP</b> : l'adresse de chaque machine sur le réseau. <b>Protocole</b> : la langue commune (TCP/IP, HTTP : sans accord sur la forme des messages, rien ne marche). <b>URL</b> : l'adresse lisible d'une ressource (https://nom.fr/page). <b>Identifiant / mot de passe</b> : QUI je suis / PREUVE que c'est moi.<br><b>Wi-Fi</b> : liaison radio locale (vers la box) : la box (routeur) raccorde le local au monde : Wi-Fi ≠ Internet.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi un protocole est indispensable</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux machines de marques différentes échangent des données. Pourquoi ont-elles besoin d'un « protocole » ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le problème</b> : sans accord, machine A enverrait « BONJOUR42 » là où B attend « 42 : BONJOUR » : rien ne serait compris : la marque, le système, la vitesse diffèrent partout.</div><div class=\"etu\"><b>Étape 2</b> — <b>La solution</b> : un protocole FIXE les règles : format des paquets, ordre des champs, quoi faire si un paquet se perd (TCP : redemander !) : chacun l'implémente chez soi, tous se comprennent.</div><div class=\"etu\"><b>Étape 3</b> — <b>La conséquence</b> : un téléphone Android, un PC sous Windows et un serveur Linux coopèrent sans souci : le protocole EST l'accord universel : changer de langue sans prévenir = panne : c'est la grammaire d'Internet.</div></div></details>\n<h3>3. Naviguer en sécurité</h3>\n<div class=\"tip\"><b>HTTPS</b> : le cadenas (communications chiffrées) : éviter le HTTP nu sur les sites sensibles. <b>Mots de passe</b> : longs, uniques par site (une fuite = 1 compte touché, pas 20). <b>Phishing</b> : mails/sites d'imitation : vérifier l'adresse EXACTE, ne jamais envoyer ses codes. <b>Mises à jour</b> : boucher les failles connues.<br><b>Règle d'or :</b> ce qui voyage sur le réseau peut être intercepté : le chiffrement protège la confidentialité.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — décoder un mail de phishing</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Votre compte sera supprimé dans 24 h, cliquez ici pour le conserver : service-client@banque-secure-24h.com ». Repérer les signaux d'alerte.</div><div class=\"etu\"><b>Étape 1</b> — <b>L'urgence fabriquée</b> : « 24 h » : la panique fait cliquer avant de réfléchir : c'est le but.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'adresse truquée</b> : le domaine « banque-secure-24h.com » n'est PAS celui de la banque (la vraie écriture : banque.fr : vérifier APRÈS le @ et dans le lien) : une lettre de trop ou un tiret = usurpation.</div><div class=\"etu\"><b>Étape 3</b> — <b>Les réflexes</b> : ne jamais cliquer depuis le mail : ouvrir un onglet soi-même et taper l'adresse officielle, ou l'application : au moindre doute, contacter la banque par un canal connu : l'URGENCE + un LIEN = presque toujours une attaque.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> Wi-Fi ≠ Internet (le Wi-Fi est local) : le « cloud » est fait de serveurs bien physiques : une IP identifie une MACHINE, pas une personne : HTTP sans S = échanges en clair (lisibles sur le chemin) : la box n'est pas « Internet » : c'est la porte d'entrée vers lui.</div>"},
{"id": "donnees-cloud", "theme": "Les données numériques et le cloud (3e)", "niveau": "3e", "titre": "Les données numériques et le cloud", "cours": "<div class=\"cours-head\"><h2>Les données numériques et le cloud</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Tout est binaire : tout est nombre</h3>\n<div class=\"tip\"><b>Numérique</b> = codé en nombres (des 0 et des 1, deux états électriques) : texte, photo, son, vidéo : TOUT est transformé en suites de bits (binary digits).<br><b>Poids</b> : 1 octet (byte) = 8 bits = 256 valeurs possibles : un caractère ≈ 1 octet : une photo ≈ 1-5 Mo : une chanson ≈ 5 Mo : un film ≈ 1-2 Go. Unités : Ko, Mo, Go, To (×1024 à chaque étage, arrondi ×1000 en usage courant).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comment une photo devient des nombres</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer le passage d'un paysage perçu par l'œil à un fichier .jpg stocké sur une clé.</div><div class=\"etu\"><b>Étape 1</b> — <b>La grille de pixels</b> : le capteur découpe l'image en minuscules carrés (pixels : 12 millions pour une photo de téléphone) : chacun mesure la lumière reçue (valeur numérique).</div><div class=\"etu\"><b>Étape 2</b> — <b>La couleur en nombres</b> : chaque pixel = 3 nombres (R, V, B de 0 à 255 : ex. 255-0-0 = rouge pur) : la photo est devenue ~36 millions de nombres = ~36 Mo brut.</div><div class=\"etu\"><b>Étape 3</b> — <b>La compression</b> : le format JPEG repère les répétitions (ciel uniforme : on note « 5000 pixels identiques » au lieu de 5000 nombres) : le fichier tombe à 2-3 Mo : c'est pour ça qu'on « perd » un peu de finesse (compression dite « avec perte ») : tout fichier = des octets, rien d'autre.</div></div></details>\n<h3>2. Le cloud : des serveurs loués</h3>\n<div class=\"tip\"><b>Cloud (informatique en nuage)</b> : stocker ou traiter sur des SERVEURS DISTANTS via Internet, au lieu de son seul appareil. <b>Avantages</b> : accessible partout, sauvegardé automatiquement, partagé. <b>Ce qu'il faut savoir</b> : ce sont des DATA CENTERS (bâtiments de serveurs, énergie, climatisation) : mes données sont chez un PRESTATAIRE : contrat de confiance (qui peut les lire ? loi de quel pays ? que deviennent-elles si l'entreprise ferme ?).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — cloud ou clé USB, que choisir ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pour sauvegarder un dossier de travail important, comparer cloud et clé USB.</div><div class=\"etu\"><b>Étape 1</b> — <b>Clé USB</b> : sous ma main, pas de réseau requis : MAIS un seul exemplaire, volable, perdable, cassable (et pas de version antérieure si j'écrase le fichier !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Cloud</b> : copie automatique et continue, historique des versions, accessible partout : MAIS il faut le réseau, et je confie mes données à un tiers (lire les conditions : chiffrement, pays, réversibilité).</div><div class=\"etu\"><b>Étape 3</b> — <b>La règle professionnelle</b> : la règle « 3-2-1 » : 3 exemplaires, sur 2 supports différents, dont 1 DISTANT : cloud OU clé seule ne suffisent jamais : la sauvegarde est une STRATÉGIE de redondance, pas un objet.</div></div></details>\n<h3>3. Traces, identité numérique, droits</h3>\n<div class=\"tip\"><b>Trace</b> : toute action laisse des données (recherche, like, achat, localisation) : parfois volontaires (publication) parfois non (métadonnées, cookies). <b>Identité numérique</b> : l'ensemble de ce qui est rattaché à mon nom : elle me précède (recherche d'employeur !) et lui survivra.<br><b>Droits</b> : RGPD (Europe) : droit d'accès, de rectification, d'effacement, consentement pour les données personnelles : consentement = case à cocher volontaire, jamais pré-cochée.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — les métadonnées d'une simple photo</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Je publie une photo de mon salon. Quelles informations ai-je réellement diffusées ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le visible</b> : le salon, les objets, peut-être des proches : c'est ce que je VOIS donner.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'invisible (EXIF)</b> : date et heure exactes, modèle de téléphone, parfois la position GPS (les réglages peuvent l'éteindre... ou pas !) : les métadonnées voyagent AVEC le fichier si personne ne les nettoie.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon</b> : la donnée publiée n'est jamais « juste » la photo : c'est photo + contexte : les enquêtes journalistiques utilisent exactement ces métadonnées (vérification de faux) : réflexe : régler les options de géolocalisation des photos et nettoyer l'EXIF avant publication publique.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le « cloud » n'est pas immatériel (serveurs, électricité, chaleur) : octet ≠ bit (×8) : la compression « avec perte » dégrade (l'original ne revient pas) : une corbeille vidée ne garantit pas l'effacement des copies : le RGPD donne des droits sur les DONNÉES PERSONNELLES.</div>"},
{"id": "algorithmes-programmation", "theme": "Algorithmes et programmation (3e)", "niveau": "3e", "titre": "Algorithmes et programmation", "cours": "<div class=\"cours-head\"><h2>Algorithmes et programmation</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Qu'est-ce qu'un algorithme ?</h3>\n<div class=\"tip\"><b>Algorithme</b> : une suite FINIE et ORDONNÉE d'instructions pour résoudre un problème, exécutable SANS ambiguïté par une machine (ou un humain !). Une recette de cuisine est un algorithme... presque : il lui manque la précision totale (« une pincée » est ambigu pour un robot !).<br><b>Programme</b> = algorithme écrit dans un LANGAGE (Scratch, Python, blocs) que la machine exécute : la conception (l'algorithme) précède l'écriture (le programme).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — écrire l'algorithme « traverser la rue »</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire la traversée d'un piéton sous forme d'algorithme précis.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le squelette</b> : 1. arriver au bord du trottoir : 2. regarder à gauche : 3. regarder à droite : 4. SI une voiture approche, ATTENDRE qu'elle soit passée, SINON rien : 5. traverser : 6. rejoindre l'autre trottoir : FIN.</div><div class=\"etu\"><b>Étape 2</b> — <b>La structure</b> : des actions dans l'ORDRE (1, 2, 3 : séquence), un TEST (SI voiture : condition), une ATTENTE (répéter la vérification : boucle tant que) : on retrouve les 3 briques universelles des algorithmes : séquence, condition, répétition.</div><div class=\"etu\"><b>Étape 3</b> — <b>La rigueur</b> : le robot exige le tout : que voit « une voiture approche » ? à quelle distance ? combien de temps « attendre » ? Toute ambiguïté = panne : écrire un algorithme, c'est éliminer TOUTE l'ambiguïté : c'est un entraînement à la précision de pensée.</div></div></details>\n<h3>2. Variables, affectation, conditions, boucles</h3>\n<div class=\"tip\"><b>Variable</b> : une boîte étiquetée qui garde une valeur (age = 14 : on écrit AINSI : « age prend la valeur 14 »). <b>Condition</b> : SI... ALORS... SINON (test vrai/faux : le programme choisit son chemin). <b>Boucle</b> : RÉPÉTER n FOIS (boucle bornée : for) ou TANT QUE (boucle conditionnelle : while : ATTENTION : si la condition ne devient jamais fausse ⟹ boucle infinie !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer une moyenne avec un programme</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écrire le programme qui calcule la moyenne de trois notes : 12, 15, 9.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les variables</b> : note1 = 12 : note2 = 15 : note3 = 9 : trois boîtes nommées : puis somme = note1 + note2 + note3 (la machine calcule 36 et le range dans somme).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le calcul et l'affichage</b> : moyenne = somme / 3 (12.0) : AFFICHER moyenne : en Python : <code>moyenne = (12 + 15 + 9) / 3 : print(moyenne)</code> : trois instructions, résultat exact : la machine fait le travail pénible (vérifier, recalculer) sans jamais se tromper de calcul.</div><div class=\"etu\"><b>Étape 3</b> — <b>Généraliser avec une boucle</b> : pour 30 notes ? Une boucle : total = 0 : POUR i DE 1 À 30 : lire note : total = total + note (on AJOUTE au fur et à mesure) : FIN POUR : moyenne = total / 30 : la boucle transforme un programme « sur mesure » en OUTIL GÉNÉRIQUE : c'est toute la puissance : le même code traite 3 notes ou 3000.</div></div></details>\n<h3>3. Scratch, Python, événements</h3>\n<div class=\"tip\"><b>Scratch</b> : blocs à emboîter (idéal pour visualiser la structure : on voit les boucles et conditions) : <b>Python</b> : texte, langage pro utilisé partout. <b>Programmation événementielle</b> (jeux, interfaces) : le programme RÉAGIT : « QUAND la touche est pressée » ou « QUAND le drapeau cliqué » : on ne décrit pas un déroulé, on décrit des RÉACTIONS.<br><b>Instruction</b> = un pas : <b>script</b> = l'ensemble : <b>bogue (bug)</b> = erreur de conception (le programme fait autre chose que prévu) : <b>déboguer</b> = chercher pourquoi.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — déboguer un programme qui « saute une note »</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un programme doit afficher les nombres de 1 à 5 mais n'affiche que 1, 2, 3, 4. Où est le bogue ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'hypothèse</b> : la boucle s'arrête UN PAS TÔT : motif fréquent : « POUR i DE 1 À 4 » au lieu de « DE 1 À 5 », ou « TANT QUE i < 5 » au lieu de « i <= 5 » : la borne est mal écrite.</div><div class=\"etu\"><b>Étape 2</b> — <b>La méthode</b> : on EXÉCUTE À LA MAIN en suivant les variables (table de trace : i = 1... i = 4 : test « i < 5 » vrai : affiche 4 : puis i = 5 : test FAUX : stop) : la table de trace montre exactement quand la condition échoue.</div><div class=\"etu\"><b>Étape 3</b> — <b>La correction et la leçon</b> : remplacer par « i <= 5 » : PUIS re-tester aux BORNES (0, 1, 5, cas limites) : le réflexe du programmeur : les bogues vivent presque toujours aux BORNES et dans les conditions inversées (< au lieu de <=) : tester n'est pas optionnel, c'est la moitié du travail.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « = » en programmation signifie « prend la valeur » (affectation), pas égalité mathématique : une boucle infinie gèle le programme (vérifier que la condition peut devenir fausse !) : le programme fait EXACTEMENT ce qui est écrit, pas ce qu'on « voulait » dire : l'ordinateur ne « devine » pas : l'ordre des instructions change tout (sequence !).</div>"},
{"id": "impacts-numeriques", "theme": "Les impacts du numérique (3e)", "niveau": "3e", "titre": "Les impacts du numérique", "cours": "<div class=\"cours-head\"><h2>Les impacts du numérique</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Opportunités : ce que le numérique apporte</h3>\n<div class=\"tip\"><b>Accès au savoir</b> : cours en ligne, Wikipédia, musées virtuels. <b>Communication</b> : contacter partout, instantanément. <b>Santé</b> : imagerie, télémédecine, chirurgie assistée. <b>Travail</b> : télétravail, nouveaux métiers (développeur, data analyst, community manager...). <b>Inclusion</b> : outils d'accessibilité (synthèse vocale, sous-titres, commandes vocales) : le numérique OUVRE des portes impossibles autrement.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la synthèse vocale, une révolution d'accessibilité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment la synthèse vocale et la reconnaissance d'image changent la vie d'une personne malvoyante ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Avant</b> : lire un courrier exigeait une aide humaine ou du braille (si traduit : quelques jours de délai) : l'autonomie dépendait des autres.</div><div class=\"etu\"><b>Étape 2</b> — <b>Maintenant</b> : pointer le téléphone sur la lettre : la photo est lue à voix haute en 3 secondes : un menu de restaurant, un panneau de gare, une étiquette : la machine traduit le monde visuel en monde sonore.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon</b> : le même outil sert tous (GPS parlant, sous-titres auto, traduction instantanée) : c'est la CONCEPTION UNIVERSELLE : un numérique pensé pour les plus contraints profite à tous : l'impact du numérique ne se juge pas qu'en « confort », il se juge en AUTONOMIE rendue.</div></div></details>\n<h3>2. Risques : santé, attention, social</h3>\n<div class=\"tip\"><b>Santé physique</b> : sédentarité, sommeil décalé (la lumière des écrans retarde l'endormissement : la règle : pas d'écran au lit !), vue (pauses 20-20-20 : toutes les 20 min, regarder à 20 pieds — 6 m — pendant 20 s). <b>Attention</b> : les applications sont CONÇUES pour capter (notifications, défilement infini, récompenses aléatoires : la machine à sous du poignet !). <b>Social</b> : cyberharcèlement (contrairement aux rumeurs de cour, il laisse des PREUVES : captures, témoins — et sa violence est répétée et permanente : jamais de répit hors écran).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi on ne peut pas s'arrêter de scroller</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer pourquoi « 5 minutes » d'une application de vidéos durent souvent 1 heure.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le mécanisme</b> : le défilement infini supprime le signal d'arrêt naturel (la FIN de la page : comme la fin d'un chapitre) : il n'y a plus de moment où se demander « je continue ? ».</div><div class=\"etu\"><b>Étape 2</b> — <b>La récompense aléatoire</b> : une vidéo sur 10 est excellente : le cerveau anticipe un gain IMPRÉVISIBLE : c'est le circuit de la dopamine, exactement le principe de la machine à sous (B. F. Skinner l'a montré avec des pigeons : les récompenses aléatoires créent les comportements les plus tenaces).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les parades</b> : réinstaller les signaux d'arrêt (minuteur AVANT, pas après : l'application libre d'elle-même ne s'arrêtera JAMAIS : son modèle économique EST ton temps), couper les notifications non essentielles, mode noir et blanc : la lucidité sur les mécanismes est la première défense : ce n'est pas un manque de volonté, c'est une ingénierie.</div></div></details>\n<h3>3. Société : emploi, environnement,information, citoyenneté</h3>\n<div class=\"tip\"><b>Emplois</b> : des métiers disparaissent (certains gestes répétitifs), d'autres naissent (l'IA ne « remplace pas » : elle DÉPLACE les compétences : maîtriser les outils devient la compétence transversale). <b>Environnement</b> : le numérique consomme (fabrication des terminaux : 80 % de l'empreinte ! : métaux rares, data centers : la sobriété = garder son téléphone plus longtemps, réparer, recycler). <b>Information</b> : vrais/faux : vérifier la SOURCE, croiser, se méfier de l'émotion qui précipite le partage. <b>Citoyenneté</b> : le numérique n'est pas hors la loi (lois françaises et européennes : injure, diffamation, harcèlement punissables : la e-réputation dure).<br><b>Règle</b> : l'impact dépend de l'USAGE, pas de l'outil seul.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le vrai coût écologique d'un smartphone</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Où se situe l'essentiel de l'empreinte carbone d'un smartphone, et que faire ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le contre-intuitif</b> : ~80 % de l'empreinte est dans la FABRICATION (extraction des métaux — parfois rares ou conflictuels : fabrication en Asie, transport) : pas dans l'usage quotidien (charger 1 an ≈ quelques kg de CO2 seulement).</div><div class=\"etu\"><b>Étape 2</b> — <b>La conséquence</b> : changer de téléphone tous les ans est la pire pratique écologique du numérique : garder un téléphone 4 ans au lieu de 2 divise l'empreinte annuelle par ~2.</div><div class=\"etu\"><b>Étape 3</b> — <b>Les gestes qui comptent (par ordre)</b> : 1. garder SON appareil le plus longtemps possible : 2. faire RÉPARER (écran, batterie) : 3. acheter reconditionné : 4. recycler l'ancien (collecte : les métaux se récupèrent) : le vrai geste n'est pas « éteindre le Wi-Fi la nuit », c'est RETENIR son téléphone : le calcul chasse l'intuition.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « Le numérique est dématérialisé » (FAUX : serveurs, métaux, électricité : 1 e-mail avec pièce jointe lourde ≈ quelques grammes de CO2, et un data center consomme autant qu'une ville moyenne) : « le cerveau se dégrade » (les études montrent des changements d'ATTENTION, formulées avec prudence) : « l'IA remplace les humains » (elle DÉPLACE : les tâches changent) : « sur Internet on est anonyme » (tout laisse des traces : RGPD, tribunaux) : la bonne question n'est jamais « bien ou mal ? » mais « pour quel usage, à quelle dose, avec quel recul ? ».</div>"},
{"id": "internet-web", "theme": "Internet et le Web (2de)", "niveau": "2de", "titre": "Internet et le Web", "cours": "<div class=\"cours-head\"><h2>Internet et le Web</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Internet ≠ Web : réseau vs service</h3>\n<div class=\"tip\"><b>Internet</b> : le RÉSEAU (l'infrastructure : machines, câbles, routeurs, protocoles IP/TCP). <b>Le Web</b> : un SERVICE branché sur Internet : des pages reliées par des LIENS (HTTP/HTTPS, HTML). Le Web n'est qu'UN des services : e-mail (SMTP), messagerie, streaming, jeux, transfert de fichiers, objets connectés : tous voyagent sur Internet sans être « le Web ».<br><b>Métaphore</b> : Internet = le réseau routier : le Web = un camion de services parmi d'autres.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — qui utilise Internet sans le Web ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Classer : une page Wikipédia, un message WhatsApp, une consultation météo d'un objet connecté, un mail.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le Web uniquement</b> : la page Wikipédia (HTML + HTTP + liens : c'est la définition même du web).</div><div class=\"etu\"><b>Étape 2</b> — <b>Internet mais pas Web</b> : WhatsApp (messagerie : protocoles propres), le mail (SMTP/IMAP : plus ancien que le web !), l'objet connecté (requêtes directes vers un serveur, sans navigateur ni page).</div><div class=\"etu\"><b>Étape 3</b> — <b>La conclusion</b> : « être sur Internet » = être relié au réseau : « être sur le Web » = être une page liée consultée par navigateur : l'application météo du téléphone parle souvent à des API (des services qui répondent à des programmes, pas à des humains) : Internet est le socle, le Web une couche parmi d'autres.</div></div></details>\n<h3>2. Le voyage d'une requête</h3>\n<div class=\"tip\"><b>Étapes</b> : 1. URL tapée : 2. <b>DNS</b> traduit le domaine en <b>adresse IP</b> : 3. la requête part en <b>paquets</b> (TCP découpe, IP achemine) : 4. les <b>routeurs</b> font suivre de proche en proche (chaque paquet peut prendre un chemin différent !) : 5. le serveur répond : 6. le navigateur assemble et AFFICHE.<br><b>Adresses</b> : IPv4 (4 octets : 192.168.1.1 : ~4 milliards, épuisé !) et IPv6 (8 groupes hexadécimaux : 340 sextillions : la relève).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — tracer la route de ses paquets</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment observe-t-on le chemin réel d'une connexion vers un site ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'outil</b> : la commande traceroute (Linux/macOS) ou tracert (Windows) affiche, saut par saut, les routeurs traversés avec leur délai en millisecondes.</div><div class=\"etu\"><b>Étape 2</b> — <b>La lecture</b> : ligne 1 = la box : lignes suivantes = les routeurs du fournisseur, les points d'échange internationaux (souvent des villes : Paris, Marseille, New York...), puis le réseau du site cible.</div><div class=\"etu\"><b>Étape 3</b> — <b>Ce qu'on apprend</b> : une vidéo « américaine » peut passer par moins de sauts qu'un site français (le chemin est optimisé, pas géographique !) : un délai qui saute à une ligne = le goulot : c'est la network literacy : le web n'est pas un nuage, c'est un trajet mesurable, et on peut l'auditer soi-même.</div></div></details>\n<h3>3. Le Web : HTML, liens, moteurs, neutrality</h3>\n<div class=\"tip\"><b>HTML</b> : la langue des pages (structure : titres, paragraphes, images, LIENS <code>&lt;a href=\"...\"&gt;</code>) : le lien hypertexte EST l'invention fondatrice (Tim Berners-Lee, 1989-1991 : gratuité de la licence = le web appartient à tous). <b>URL</b> : https://domaine/chemin (protocole + serveur + ressource). <b>Moteur de recherche</b> : un index gigantesque (« bibliothèque qui aurait rédigé son catalogue à l'avance ») : il ne fouille PAS le web en direct. <b>Net neutrality</b> : principe (dégradé en droit selon les pays) : les opérateurs traitent les paquets sans privilégier tel service.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — construire sa première page HTML</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écrire une page minimale qui affiche un titre et un lien vers un site.</div><div class=\"etu\"><b>Étape 1</b> — <b>La structure</b> : <code>&lt;!DOCTYPE html&gt; &lt;html&gt; &lt;head&gt;&lt;title&gt;Ma page&lt;/title&gt;&lt;/head&gt; &lt;body&gt;...&lt;/body&gt; &lt;/html&gt;</code> : l'en-tête (head) porte les informations INVISIBLES (titre d'onglet), le corps (body) le contenu AFFICHÉ.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le contenu</b> : <code>&lt;h1&gt;Bonjour&lt;/h1&gt;</code> (titre), <code>&lt;p&gt;Un paragraphe.&lt;/p&gt;</code>, et le lien : <code>&lt;a href=\"https://exemple.fr\"&gt;Visiter&lt;/a&gt;</code> : la balise ouvre, la balise fermée avec / referme.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le test</b> : enregistrer en .html, ouvrir dans le navigateur : le HTML est INTERPRÉTÉ (le navigateur lit et rend) : le CSS décorera (couleurs, mise en page), le JavaScript rendra interactif : les trois langages du web côté client : tout ce qu'on visite est fait de ça.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « Internet = Web » (NON : web = un service) : le moteur de recherche ne « cherche pas en direct » (il interroge son index) : IPv4 épuisée (d'où IPv6) : le web a un inventeur (Berners-Lee) mais Internet est plus ancien (années 1970, TCP/IP : V. Cerf et B. Kahn) : une page peut exister sans être indexée (deep web ≠ web caché illégal !).</div>"},
{"id": "reseaux-sociaux", "theme": "Les réseaux sociaux (2de)", "niveau": "2de", "titre": "Les réseaux sociaux", "cours": "<div class=\"cours-head\"><h2>Les réseaux sociaux</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le graphe : amis, abonnés, influence</h3>\n<div class=\"tip\"><b>Modèle</b> : un réseau social = un GRAPHE (des personnes = nœuds, des relations = arêtes : amitié, abonnement, follow). <b>Degré</b> = nombre de liens d'une personne : la plupart ont ~100-500 « amis », quelques profils en ont des millions (influenceurs : nœuds très concentrés). <b>Petit monde</b> : par les amis d'amis, deux inconnus sont souvent reliés en 4-6 sauts (l'expérience de Milgram, les « 6 degrés de séparation »).<br><b>Certains liens sont réciproques</b> (amitié), d'autres <b>orientés</b> (je suis un influenceur, il ne me suit pas).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi une rumeur s'y propage si vite</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer la vitesse d'une rumeur sur un réseau social à l'aide de la structure du graphe.</div><div class=\"etu\"><b>Étape 1</b> — <b>La structure</b> : le réseau contient des nœuds à TRÈS haut degré (influenceurs : 1 million d'abonnés) : une information qui les atteint touche d'un coup un million de personnes : c'est une « contagion » amplifiée par la structure même.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'émotion comme carburant</b> : les contenus qui font peur ou indignent sont plus partagés (le partage est un geste émotionnel de 1 seconde, une vérification en demande 10 minutes : l'asymétrie joue à fond).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le correctif</b> : les vérificateurs réutilisent la même structure (partage massif des débunk) mais avec un RETARD : la rumeur a 10 fois plus d'interactions que sa correction (étude fameuse du MIT sur 126 000 rumeurs) : la leçon SNT : la vitesse est une PROPRIÉTÉ DU GRAPHE, pas une « bêtise humaine » : d'où les parades qui corrigent la structure (friction avant partage : « voulez-vous lire avant de relayer ? », étiquettes de vérification).</div></div></details>\n<h3>2. Modèle économique : toi, tu es (en partie) le produit</h3>\n<div class=\"tip\"><b>Gratuit apparent</b> : le financement vient de la PUBLICITÉ CIBLÉE : le réseau vend aux annonceurs l'accès à ton attention et à des données qui la rendent « ciblable ». <b>Engagement</b> : le fil est optimisé pour retenir (notifications, likes, défilement, contenus recommandés selon ton profil). <b>Ciblage</b> : plus les données sont fines, plus la publicité est efficace et chère.<br><b>Ce que tu payes vraiment</b> : ton attention, tes données, tes traces comportementales.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — décoder un fil d'actualité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi deux personnes n'ont jamais le même fil d'actualité ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le tri</b> : il n'existe AUCUN « fil naturel » : sur des milliers de publications éligibles (amis, pages, contenus recommandés), un ALGORITHME DE CLASSEMENT choisit ce que TU vois en premier : optimisé pour l'engagement (temps passé, interactions).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le profil</b> : le classement s'appuie sur ton historique (ce que tu regardes, aimes, partages, la durée...) : deux personnes aux goûts opposés reçoivent deux mondes recommandés différents (les « bulles de filtre », l'effet écho : on est renvoyé à ce qu'on montre déjà d'intérêt).</div><div class=\"etu\"><b>Étape 3</b> — <b>L'attitude SNT</b> : savoir que le fil est CONSTRUIT change la posture : varier ses sources volontairement, demander « pourquoi me montre-t-on ceci ? », utiliser les outils de contrôle du fil (liste chronologique quand elle existe) : la lucidité n'est pas de la paranoïa : c'est la compétence du siècle.</div></div></details>\n<h3>3. Identité, réputation, droits</h3>\n<div class=\"tip\"><b>Identité numérique</b> : tout ce qui est rattaché à toi (profils, publications, traces, métadonnées) : elle te PRECEDE (recherche d'emploi, d'école) et lui SURVIT. <b>E-réputation</b> : ce que les autres trouvent en te cherchant : <b>réfléchir AVANT de publier</b> (une capture d'écran survit à toute suppression !). <b>Droits</b> : RGPD (accès, rectification, effacement, consentement, majorité : 15 ans en France pour la majorité numérique), droit à l'image, délais de conservation : harcèlement = délit réel, preuves = captures datées, ressources : 3018 (France).<br><b>Règle</b> : publier = renoncer au contrôle total.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'audit de sa propre e-réputation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un employeur te tapera ton nom. Que va-t-il trouver ? Fais l'audit à sa place.</div><div class=\"etu\"><b>Étape 1</b> — <b>La recherche du recruteur</b> : recherche du prénom + nom, éventuellement la ville, navigation dans les images et les profils publics : noter ce qui apparaît dans les 10 premiers résultats (c'est ce qui « est » toi pour un tiers pressé).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le tri</b> : contenu neutre/valorisant (projets, sport, engagement) : ambigu (photos de soirées, propos excessifs) : nuisible (propos blessants, illégaux) : puis agir : restreindre les comptes privés, supprimer l'infamant, faire rectifier ce que d'autres publient (droit à l'image !).</div><div class=\"etu\"><b>Étape 3</b> — <b>La construction positive</b> : la e-réputation ne se subit pas, elle se CONSTRUIT : publier des projets, des réussites, un profil soigné (l'audit avant le stage de 2de : un exercice rentable) : la règle des 3 questions avant de publier : « est-ce vrai ? est-ce utile ? serais-je d'accord que mes parents ET mon futur employeur le voient ? »</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « le réseau est gratuit » (le financement est ailleurs : publicité, données) : « l'algorithme du fil est neutre » (il optimise l'engagement) : « supprimé = disparu » (captures, copies, caches) : « mes paramètres protègent tout » (les amis des amis, les tags, les fuites de données existent) : la loi s'applique (injure, diffamation, image) : la vitesse de rumeur est structurelle, pas « humaine ».</div>"},
{"id": "donnees-traitees", "theme": "Les données structurées et leur traitement (2de)", "niveau": "2de", "titre": "Les données structurées et leur traitement", "cours": "<div class=\"cours-head\"><h2>Les données structurées et leur traitement</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Données, types, métadonnées</h3>\n<div class=\"tip\"><b>Donnée</b> : une valeur enregistrée (nom, note, température, instant d'une connexion). <b>Type</b> : texte (str), entier (int), décimal (float), booléen (True/False), date : le type détermine les opérations valides (« 2 » + « 3 » = « 23 » en texte, 5 en nombres !). <b>Métadonnées</b> : des données SUR les données (auteur, date, format : l'EXIF d'une photo !).<br><b>Valeur manquante, doublon, valeur aberrante</b> : les trois ennemis du traitement : l'oublier fausse les résultats.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — corriger un fichier de notes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un tableau de notes contient : 12, 15, -3, 18, 15, « abs ». Quels problèmes et quel traitement ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le diagnostic</b> : -3 = valeur ABERRANTE (une note est entre 0 et 20) : 15 apparaît deux fois = DOUBLON (deux fois la même ligne ? ou deux élèves ? à vérifier !) : « abs » = absence = donnée MANQUANTE (c'est une information, pas une note).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le nettoyage</b> : -3 : vérifier la saisie (une inversion de frappe ? 13 ?) sinon EXCLURE (et le documenter) : doublon : vérifier si c'est la même évaluation saisie deux fois (alors n'en garder qu'une) : « abs » : traiter à part (moyenne calculée sur les notes EXISTANTES, documenté).</div><div class=\"etu\"><b>Étape 3</b> — <b>La règle d'or</b> : un résultat calculé sur des données sales est FAUX avec des chiffres exacts (moyenne : (12+15-3+18+15)/5 = 11,4 : après nettoyage : (12+15+18)/3 = 15 !) : l'étape de nettoyage (data cleaning) occupe la majorité du temps des professionnels : le tableur Python (pandas) ou le tableur (LibreOffice) : les deux font ce travail.</div></div></details>\n<h3>2. Fichiers : CSV et JSON</h3>\n<div class=\"tip\"><b>CSV</b> (comma-separated values) : lignes = enregistrements, valeurs séparées par des points-virgules ou virgules : la 1re ligne = les descripteurs (en-têtes : nom : note : ...). Lisible par TOUT (tableur, Python, calculette graphique !). <b>JSON</b> : structure emboîtée avec des paires clé/valeur <code>{'nom': 'Anna', 'notes': [12, 15]}</code> : le format des API et du web.<br><b>Table</b> : descripteurs (colonnes) × enregistrements (lignes) : la structure reine du traitement.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire un CSV en Python</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un fichier eleves.csv (ligne 1 : nom : note). Calculer la moyenne avec un petit programme.</div><div class=\"etu\"><b>Étape 1</b> — <b>Lire</b> : <code>import csv : lignes = list(csv.reader(open('eleves.csv')))</code> : lignes[0] = l'en-tête (['nom', 'note']), lignes[1:] = les données : chaque ligne est une LISTE.</div><div class=\"etu\"><b>Étape 2</b> — <b>Calculer</b> : <code>notes = [int(l[1]) for l in lignes[1:]] : moyenne = sum(notes) / len(notes)</code> : ATTENTION : tout arrive en TEXTE du CSV : il faut CONVERTIR (int()) avant de calculer, sinon la somme échoue !</div><div class=\"etu\"><b>Étape 3</b> — <b>Généraliser</b> : avec un tri (sorted), un comptage (len), un maximum (max) : les traitements classiques du chapitre : ce squelette (lire ⟹ convertir ⟹ calculer) est LE motif de base du traitement de données : sur 10 lignes comme sur 10 millions (avec pandas : <code>df['note'].mean()</code>).</div></div></details>\n<h3>3. Traitements : filtrer, trier, agréger</h3>\n<div class=\"tip\"><b>Filtrer</b> : garder les lignes qui vérifient une condition (note >= 10). <b>Trier</b> : ordonner selon une colonne (croissant/décroissant). <b>Agréger</b> : regrouper et résumer (moyenne PAR classe, compte PAR ville). <b>Croiser</b> : deux tables reliées par une clé commune (élèves × notes via l'identifiant).<br><b>Droits</b> : traiter des données personnelles est ENCADRÉ (RGPD : finalité déclarée, minimisation : ne collecter que le nécessaire, durée de conservation, anonymisation quand possible : « Emma, 3e2 » ⟹ « élève, 3e »).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — anonymiser un fichier avant exploitation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un fichier d'élèves (nom, classe, note, date de naissance) doit servir à une étude statistique. Que garder ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La question de finalité</b> : l'étude porte sur les notes par classe : le NOM et la DATE DE NAISSANCE ne servent à RIEN : la minimisation (RGPD) impose de les RETIRER (pas de « on garde au cas où » !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le remplacement</b> : nom ⟹ un identifiant aléatoire (E001, E002...) : la classe et la note suffisent : la date de naissance pourrait être remplacée par l'ÂGE (moins précis) si l'étude en a besoin.</div><div class=\"etu\"><b>Étape 3</b> — <b>La conclusion</b> : le fichier anonymisé (pas de retour possible vers une personne) sort du champ du RGPD : il peut circuler pour l'étude : la discipline à acquérir : AVANT tout traitement, se demander « de quoi ai-je VRAIMENT besoin ? » : c'est la protection par la conception (privacy by design), un réflexe professionnel.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « 2 » + « 3 » = « 23 » (concaténation de textes, pas une somme !) : une moyenne sur données sales est fausse (nettoyer AVANT) : le CSV reste « plat » (pas d'emboîtement : pour ça, JSON) : métadonnées ≠ données : ne pas confondre nombre de LIGNES et valeur d'une ligne : traiter des données personnelles sans finalité claire = hors la loi.</div>"},

var PDF_CP1252 = { 0x2018:0x91, 0x2019:0x92, 0x201A:0x82, 0x201C:0x93, 0x201D:0x94, 0x201E:0x84, 0x2013:0x96, 0x2014:0x97, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x20AC:0x80, 0x0152:0x8C, 0x0153:0x9C, 0x0160:0x8A, 0x0161:0x9A, 0x0178:0x9F, 0x017D:0x8E, 0x017E:0x9E, 0x192:0x83, 0x2C6:0x88, 0x2032:0xB4, 0x2039:0x8B, 0x203A:0x9B, 0x201E2:0 };
function pdfTranslit(s){
  return s.replace(/\u2212|\u2013|\u2014/g, '-').replace(/[\u2032\u2019]/g, "'")
    .replace(/\u2192|\u21D2|\u21A6/g, '->').replace(/\u2190/g, '<-')

    .replace(/\u2208/g, ' in ').replace(/\u2205/g, 'vide').replace(/\u2286/g, 'incl.')
    .replace(/\u221A/g, 'V').replace(/\u00B7|\u2219|\u22C5/g, '*').replace(/\u2022/g, '-')
    .replace(/\u2124/g, 'Z').replace(/\u211D/g, 'R').replace(/\u2115/g, 'N').replace(/\u2119/g, 'P')
    .replace(/\u00A0/g, ' ').replace(/\u202F|\u2009|\u200B|\uFE0F/g, '')
    .replace(/[\u2460-\u2468]/g, function(c){ return (c.charCodeAt(0) - 0x2460 + 1) + ')'; })
    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
}
function pdfEnc(s){
  var out = '';

    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }

    if (b !== null && b !== undefined) out += String.fromCharCode(b);
  }

}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
var PDF_INLINE = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, SMALL:1, SUB:1, SUP:1, A:1, CODE:1, ABBR:1 };
function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';
    } else if (c.nodeType === 1){
      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }
      else if (g === 'B' || g === 'STRONG') pdfSegs(c, true, out);
      else pdfSegs(c, bold, out);
    }
  }
}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'li') segs = [{ t: '- ', b: bold || false }].concat(segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;
  function walk(n){
    for (var c = n.firstChild; c; c = c.nextSibling){
      if (c.nodeType === 3){
        var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;
        var cl = ' ' + (c.className || '') + ' ';
        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }
        emitP();
        if (/^H[1-6]$/.test(g)) emitBlock('h', c, indent);
        else if (g === 'LI') emitBlock('li', c, indent + 16);
        else if (g === 'UL' || g === 'OL') {
          for (var li = c.firstChild; li; li = li.nextSibling){
            if (li.nodeType === 1 && li.tagName === 'LI') { emitBlock('li', li, indent + 16); walk(li); }
          }
        }

                if (td.nodeType === 1 && (td.tagName === 'TD' || td.tagName === 'TH')){
                  var cs = []; pdfSegs(td, td.tagName === 'TH', cs);
                  cells.push(cs.map(function(x){ return x.t; }).join('').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
                }
              }
              var line = cells.join('   |   ');
              if (line.replace(/\s/g, '') !== '') blocks.push({ type: 'p', segs: [{ t: line, b: false }], indent: indent + 8 });
            } else if (tr.tagName === 'THEAD' || tr.tagName === 'TBODY') walk(tr);
          }
        }
        else if (g === 'P') { emitBlock('p', c, indent); }

  walk(root);

}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    var isTitle = b.type === 'title';
    var size = isTitle ? 15 : (b.type === 'h' ? 12 : 10.5);
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [];
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) words.push({ br: true });
        p.split(' ').forEach(function(w){ if (w !== '') words.push({ w: w, b: s.b }); });
        if (pi < parts.length - 1) {} else { words.push({ sp: true, b: s.b }); }
      });
    });
    var cur = [], len = 0;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, gap: isTitle ? 0 : (b.type === 'h' ? 7 : 4) }); cur = []; len = 0; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      if (wd.sp) { continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;

}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var pages = [], cur = [], y = TOP;

    }

    var x = M + (ln.indent || 0);

      cur.push('BT 1 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Tm /F' + (s.b ? 2 : 1) + ' ' + ln.size + ' Tf (' + pdfEsc(enc) + ') Tj ET');

  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;

  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){

      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';

  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';

function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){

    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme d'informatique</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + h + '</section>';
})();

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
</script>
