{"id": "types-python", "theme": "Python : types, variables et instructions (1re)", "niveau": "1re", "titre": "Python : types, variables et instructions", "cours": "<div class=\"cours-head\"><h2>Python : types, variables et instructions</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Variables, affectation, typage</h3>\n<div class=\"tip\"><b>Affectation</b> : <code>x = 3</code> (« x prend la valeur 3 ») : la variable est une ÉTIQUETTE collée sur une valeur en mémoire (pas une « boîte » en Python !). <b>Types de base</b> : <code>int</code> (entiers, de taille illimitée !), <code>float</code> (décimaux APPROXIMÉS : 0,1 + 0,2 = 0,30000000000000004 !), <code>str</code> (texte, immuable), <code>bool</code> (True/False). <b>Typage dynamique</b> : le type appartient à la VALEUR, la variable peut en changer (mais c'est une mauvaise pratique !) : <code>type(x)</code> interroge, <code>int('12')</code> convertit.<br><b>Nommer</b> : clair, en minuscules_avec_underscores, jamais d'accents.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le piège des flottants</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi <code>0.1 + 0.2 == 0.3</code> répond False en Python ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La cause</b> : les décimaux sont stockés en binaire (norme IEEE 754) : or 0,1 n'a PAS d'écriture binaire exacte (comme 1/3 = 0,333... en base 10 !) : la machine stocke une approximation.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'accumulation</b> : 0,1 ≈ 0,1000000000000000055511... : 0,2 ≈ 0,200000000000000011102... : leur somme ≈ 0,30000000000000004 ≠ 0,3 (elle-même une approximation, mais DIFFÉRENTE !).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les parades</b> : ne JAMAIS comparer des flottants avec == : préférer <code>abs(a - b) &lt; 1e-9</code> (« assez proches ») : pour l'argent : des ENTIERS en centimes (1999 = 19,99 € !) : leçon : le type porte SES règles — le connaître évite des bugs qui coûtent très cher (Ariane 5, missile Patriot : des histoires réelles d'arrondis !).</div></div></details>\n<h3>2. Instructions : entrées, sorties, conditions, boucles</h3>\n<div class=\"tip\"><b>Lire/Afficher</b> : <code>n = int(input('Nombre : '))</code> (input renvoie du TEXTE : convertir !) : <code>print('x =', x)</code>. <b>Condition</b> : <code>if / elif / else</code> (l'INDENTATION délimite les blocs — 4 espaces, pas de hasard !). <b>Boucles</b> : <code>for i in range(5)</code> (0 à 4 : 5 tours, la borne est EXCLUE !) : <code>while condition:</code> (condition testée AVANT chaque tour : attention à la sortie !). <b>Opérateurs</b> : == != &lt; &gt; &lt;= &gt;=, and, or, not.<br><b>Importer</b> : <code>import math</code> puis <code>math.sqrt(2)</code> : les bibliothèques étendent le langage.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — écrire un programme complet pas à pas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Programme : demander un âge, afficher « mineur/majeur », puis compter de 1 à l'âge.</div><div class=\"etu\"><b>Étape 1</b> — <b>L'entrée convertie</b> : <code>age = int(input('Ton âge ? '))</code> : sans int(), âge serait du texte ('18') : la comparaison age &lt; 18 échouerait (TypeError : str vs int !).</div><div class=\"etu\"><b>Étape 2</b> — <b>La condition</b> : <code>if age &lt; 18: print('mineur') else: print('majeur')</code> : l'indentation indique ce qui dépend du if : une ligne de plus dans le bloc = 4 espaces de plus, Rien d'autre.</div><div class=\"etu\"><b>Étape 3</b> — <b>La boucle</b> : <code>for i in range(1, age + 1): print(i)</code> : le +1 est vital (range(1, 18) s'arrête à 17 !) : le squelette entrée ⟶ traitement ⟶ sortie est LE motif de tout programme : le maîtriser = écrire 80 % des exercices.</div></div></details>\n<h3>3. Chaînes et erreurs</h3>\n<div class=\"tip\"><b>Chaînes (str)</b> : immuables (aucune modification en place : chaque « modification » crée une NOUVELLE chaîne) : <code>s[i]</code> (index à partir de 0 !), <code>s[i:j]</code> (tranche, j exclu), <code>len(s)</code>, <code>s.upper()</code>, <code>s + t</code> (concaténation), <code>str(12)</code> pour assembler nombre et texte. <b>f-strings</b> : <code>f'valeur : {x}'</code> : lisible et pro.<br><b>Erreurs à lire</b> : SyntaxError (avant l'exécution : faute de frappe), TypeError (opération entre types incompatibles : '3' + 4 !), ValueError (conversion impossible : int('abc')), NameError (variable inconnue — souvent une FAUTE DE FRAPPE !), IndexError (indice hors limites).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — déboguer trois erreurs classiques</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Corriger : (1) <code>note = int('dix')</code> : (2) <code>print('Total : ' + 12)</code> : (3) <code>print(ma_varible)</code>.</div><div class=\"etu\"><b>Étape 1</b> — <b>ValueError</b> : « dix » n'est pas convertible : le MESSAGE dit tout (invalid literal for int()) : corriger la donnée ou la saisie (redemander, tester isinstance).</div><div class=\"etu\"><b>Étape 2</b> — <b>TypeError</b> : str + int est impossible : deux parades : <code>print('Total :', 12)</code> (print accepte plusieurs arguments) ou <code>print(f'Total : {12}')</code> (la f-string convertit !).</div><div class=\"etu\"><b>Étape 3</b> — <b>NameError</b> : « ma_varible » n'existe pas : la relecture révèle ma_variable (le i/abandonné !) : le réflexe : les erreurs Python sont des MESSAGES qui expliquent — les LIRE (ligne, type, cause) fait gagner 90 % du temps de débogage : copier l'erreur dans un moteur de recherche est légitime... après l'avoir lue.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> input() renvoie TOUJOURS du texte : range(a, b) exclut b : division / (flottant !) vs // (entière) vs % (reste) : 7 // 2 = 3, 7 % 2 = 1, 7 / 2 = 3.5 : « = » affecte, « == » compare : l'indentation fait partie de la syntaxe : str immuable : les flottants sont des approximations (jamais de == sur flottant !).</div>"},
{"id": "fonctions-python", "theme": "Fonctions et entrées/sorties en Python (1re)", "niveau": "1re", "titre": "Fonctions et entrées/sorties en Python", "cours": "<div class=\"cours-head\"><h2>Fonctions et entrées/sorties en Python</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Définir et appeler une fonction</h3>\n<div class=\"tip\"><b>Définition</b> : <code>def nom(parametres):</code> + corps indenté + (souvent) <code>return valeur</code>. <b>Appel</b> : <code>nom(arguments)</code> : le corps s'exécute, la valeur de retour REMPLACE l'appel dans l'expression.<br><b>Bénéfices</b> : réutiliser (écrire une fois, appeler cent fois), nommer (lire « moyenne(note1, note2) » plutôt qu'un calcul inline), tester (une brique isolée), factoriser. <b>Docstring</b> : <code>'''description'''</code> sous le def (pour l'utilisateur et help()).<br><b>return</b> termine la fonction ET livre la valeur : sans return, la fonction renvoie None.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — écrire est_valide(note) correctement</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écrire une fonction qui indique si une note est valide (entre 0 et 20).</div><div class=\"etu\"><b>Étape 1</b> — <b>Le squelette</b> : <code>def est_valide(note):</code> puis le test : <code>return 0 &lt;= note &lt;= 20</code> : la comparaison chaînée de Python rend le code lisible : la fonction renvoie un BOOLÉEN (True/False).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le docstring et les tests</b> : <code>'''Renvoie True si note est entre 0 et 20.'''</code> : puis vérifier : est_valide(15) ⟹ True : est_valide(-3) ⟹ False : est_valide(20) ⟹ True (la borne incluse !).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les erreurs de style à éviter</b> : <code>if ... : return True else: return False</code> (VERBEUX : renvoyer la condition directement !) : <code>print(note)</code> au lieu de return (afficher ≠ renvoyer : le print ne transmet RIEN au reste du programme !) : la fonction est une brique RÉUTILISABLE : elle communique par ses paramètres et son return, pas par des affichages.</div></div></details>\n<h3>2. Paramètres, portée, effets de bord</h3>\n<div class=\"tip\"><b>Paramètre</b> = la variable dans la définition : <b>argument</b> = la valeur transmise à l'appel. <b>Valeurs par défaut</b> : <code>def f(n, pas=1):</code> (f(10) ⟹ pas=1 : f(10, 2) ⟹ pas=2). <b>Portée</b> : une variable définie DANS la fonction est LOCALE (elle disparaît au retour) : les variables du programme principal sont visibles en lecture (mais modifier une liste passée en paramètre la modifie pour de vrai : effet de bord !).<br><b>Effet de bord</b> : la fonction agit sur l'extérieur (modifie une liste, écrit un fichier, affiche) : à limiter et DOCUMENTER.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi ma variable « n'a pas changé » ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> <code>def double(x): x = x * 2</code> puis <code>n = 5 : double(n)</code> : pourquoi n vaut toujours 5 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le monde local</b> : à l'appel, x reçoit une COPIE de la valeur de n (x = 5 : le paramètre est une nouvelle variable LOCALE) : x devient 10... dans le monde LOCAL de la fonction.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le retour</b> : la fonction se termine (sans return !) : TOUT son monde local disparaît : n, dans le programme principal, n'a jamais été touché.</div><div class=\"etu\"><b>Étape 3</b> — <b>Les deux solutions</b> : renvoyer : <code>def double(x): return x * 2</code> puis <code>n = double(n)</code> (le code propre !) : ou muter une structure (si le paramètre est une LISTE, les modifications ded persistent — c'est l'effet de bord, utile s'il est voulu et documenté !) : la règle : une fonction communique par return, sauf effet de bord explicite.</div></div></details>\n<h3>3. Fichiers : lire et écrire</h3>\n<div class=\"tip\"><b>Écrire</b> : <code>with open('notes.txt', 'w', encoding='utf-8') as f: f.write('12\\n')</code> : le <b>with</b> ferme le fichier TOUJOURS (même en cas d'erreur !). <b>Lire</b> : mode 'r' : <code>for ligne in f:</code> (ligne par ligne, se termine par \\n : le retirer avec <code>ligne.strip()</code> ou <code>ligne.rstrip()</code>).<br><b>Modes</b> : 'w' (écrase TOUT !), 'a' (ajoute à la fin), 'r' (lecture : erreur si absent). <b>Encodage</b> : préciser encoding='utf-8' (les accents !). <b>Fermer sans with</b> = fuites de ressources (le classique du débutant !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — traiter un fichier de notes complet</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un fichier notes.txt contient une note par ligne. Calculer la moyenne.</div><div class=\"etu\"><b>Étape 1</b> — <b>Lire et convertir</b> : <code>notes = []</code> : <code>with open('notes.txt', encoding='utf-8') as f: for ligne in f: notes.append(int(ligne))</code> : chaque ligne arrive en TEXTE avec son \\n : int() refuse '12\\n' ? NON : int() ignore les espaces de bord : int(' 12\\n ') = 12 (il faut le savoir : ça marche !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Calculer</b> : <code>if notes: moyenne = sum(notes) / len(notes)</code> : le garde-fou (fichier vide ⟹ division par zéro : ZeroDivisionError !) : le réflexe : toujours tester la liste non vide.</div><div class=\"etu\"><b>Étape 3</b> — <b>Écrire le résultat</b> : <code>with open('resultat.txt', 'w', encoding='utf-8') as f: f.write(f'Moyenne : {moyenne:.2f}\\n')</code> : le with garantit la fermeture : l'encodage garantit les accents : le motif complet lire-traiter-écrire est LE squelette de tout traitement de données (et il se réutilise à l'infini en NSI).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> print ≠ return (une fonction qui affiche sans renvoyer communique RIEN) : variables locales vs globales (le def crée un monde à part) : 'w' ÉCRASE le fichier (pour ajouter : 'a') : oublier encoding='utf-8' : 'œ' → caractères bizarres : lire les lignes \\n avec strip() : return None si pas de return : une fonction doit faire UNE chose, bien.</div>"},
{"id": "structures-lineaires", "theme": "Structures linéaires : listes, tuples, dictionnaires (1re)", "niveau": "1re", "titre": "Structures linéaires : listes, tuples, dictionnaires", "cours": "<div class=\"cours-head\"><h2>Structures linéaires : listes, tuples, dictionnaires</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Listes : la structure de travail</h3>\n<div class=\"tip\"><b>Liste</b> : collection ORDONNÉE et MUTABLE : <code>L = [12, 15, 9]</code>. <b>Index</b> : à partir de 0 (L[0] = 12) : index NÉGATIFS depuis la fin (L[-1] = dernier !). <b>Tranches</b> : <code>L[1:3]</code> (de l'index 1 au 3 EXCLU). <b>Opérations</b> : <code>append(x)</code> (ajoute à la fin, O(1)), <code>insert(i, x)</code>, <code>pop(i)</code> (retire et renvoie), <code>remove(x)</code>, <code>len(L)</code>, <code>in</code> (appartenance, O(n) !), <code>sorted(L)</code> (nouvelle liste) vs <code>L.sort()</code> (en place).<br><b>Parcours</b> : <code>for x in L</code> (les valeurs) ou <code>for i in range(len(L))</code> (les indices).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — choisir entre parcours par valeurs ou par indices</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> (1) Afficher toutes les notes : (2) remplacer chaque note &lt; 10 par 10.</div><div class=\"etu\"><b>Étape 1</b> — <b>Par valeurs (lecture seule)</b> : <code>for note in notes: print(note)</code> : le plus lisible quand on n'a pas besoin de la position.</div><div class=\"etu\"><b>Étape 2</b> — <b>Par indices (modification !)</b> : <code>for i in range(len(notes)): if notes[i] &lt; 10: notes[i] = 10</code> : OBLIGATOIRE ici : modifier une variable de boucle « note » ne changerait PAS la liste (la variable reçoit une copie de la valeur !).</div><div class=\"etu\"><b>Étape 3</b> — <b>La règle</b> : lire ⟹ for x in L : modifier EN PLACE ⟹ for i in range(len(L)) : c'est LA distinction qui évite le bug classique (« j'ai modifié dans la boucle mais rien n'a changé ») : à noter aussi : les parcours en compréhension <code>[x*2 for x in L]</code> construisent une NOUVELLE liste (élégant et puissant).</div></div></details>\n<h3>2. Tuples et dictionnaires</h3>\n<div class=\"tip\"><b>Tuple</b> : collection ordonnée IMMABLE : <code>t = (48.85, 2.35)</code> : idéal pour les données composites (coordonnées, couple (clé, valeur) !) : plus léger, « protégé » (rien ne bouge).<br><b>Dictionnaire</b> : association clé ⟹ valeur : <code>d = {'Anna': 15, 'Ben': 12}</code> : accès DIRECT par clé (d['Anna'] : rapide, indépendant de la taille !) : <code>d['nouveau'] = 18</code> (ajout), <code>'Anna' in d</code> (appartenance des CLÉS), <code>d.get('x', 0)</code> (valeur par défaut), <code>for cle in d:</code> (parcours des clés), <code>d.items()</code> (couples).<br><b>Choisir</b> : une suite ordonnée ⟹ liste : des données immuables ⟹ tuple : une association/clé ⟹ dictionnaire.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — compter les mots d'un texte</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Compter les occurrences de chaque mot d'une liste de mots.</div><div class=\"etu\"><b>Étape 1</b> — <b>La structure adaptée</b> : le dictionnaire mot ⟹ nombre d'apparitions : <code>compteur = {}</code> : pour chaque mot : l'incrémenter s'il existe, le créer sinon.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le code</b> : <code>for mot in mots: if mot in compteur: compteur[mot] += 1 else: compteur[mot] = 1</code> : la version raccourcie : <code>compteur[mot] = compteur.get(mot, 0) + 1</code> (get avec défaut 0 !).</div><div class=\"etu\"><b>Étape 3</b> — <b>Exploiter</b> : le mot le plus fréquent : <code>max(compteur, key=compteur.get)</code> : trier par fréquence : <code>sorted(compteur.items(), key=lambda c: c[1], reverse=True)</code> : ce motif « dictionnaire de comptage » est LE grand classique NSI (textes, ventes, génomes...) : il justifie à lui seul l'existence du dictionnaire : un dictionnaire Python est une TABLE DE HACHAGE : accès quasi instantané.</div></div></details>\n<h3>3. Imbrication et coût des opérations</h3>\n<div class=\"tip\"><b>Imbrication</b> : listes de listes (matrices : <code>M[i][j]</code>), liste de dictionnaires (table d'élèves !), dictionnaire de listes : la structure suit la donnée.<br><b>Coûts à connaître</b> (taille n) : append : O(1) (constant !) : accès L[i] ou d[cle] : O(1) : recherche x in L : O(n) (balayage !) : insertion en tête : O(n) (tout décaler !) : tri : O(n log n). <b>Copie</b> : <code>B = L[:]</code> copie (sinon B et L sont LA MÊME liste — piège n°1 !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le piège de la copie de liste</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> <code>A = [1, 2, 3] : B = A : B.append(4)</code> : que vaut A ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le choc</b> : A vaut [1, 2, 3, 4] (!!) : B = A n'a copie AUCUNE liste : les deux noms désignent la MÊME structure en mémoire (deux étiquettes sur un même objet).</div><div class=\"etu\"><b>Étape 2</b> — <b>La copie réelle</b> : <code>B = A[:]</code> (tranche complète) ou <code>B = list(A)</code> : cette fois, deux objets : modifier B ne touche plus A : <code>B.append(4)</code> ⟹ A reste [1, 2, 3].</div><div class=\"etu\"><b>Étape 3</b> — <b>La subtilité du double niveau</b> : pour une liste de LISTES, A[:] est une copie SUPERFICIELLE (les sous-listes restent partagées !) : la copie profonde : <code>copy.deepcopy(A)</code> : le test réflexe : après toute affectation de liste, modifier l'une et VÉRIFIER l'autre : ce piège explique la moitié des « bugs fantômes » du débutant — le connaître, c'est l'éradiquer.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> B = A ne copie PAS (même objet !) : L[1:3] exclut l'index 3 : modifier la variable de parcours ne change pas la liste (parcourir par indices !) : tuple immuable (t[0] = x ⟹ erreur) : d[cle] sur clé absente ⟹ KeyError (get() parer) : append est O(1) mais insert(0, x) est O(n) : itérer sur un d en modifie les clés ⟹ RuntimeError.</div>"},
{"id": "tris-recherche", "theme": "Tris et recherches : algorithmes fondamentaux (1re)", "niveau": "1re", "titre": "Tris et recherches : algorithmes fondamentaux", "cours": "<div class=\"cours-head\"><h2>Tris et recherches : algorithmes fondamentaux</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Recherche : linéaire vs dichotomie</h3>\n<div class=\"tip\"><b>Recherche linéaire (séquentielle)</b> : comparer un à un jusqu'à trouver : marche sur TOUTE liste : coût <b>O(n)</b> (n/2 en moyenne, n au pire).<br><b>Recherche dichotomique</b> : coupe en deux à chaque étape (milieu ? trop grand/petit ⟹ jeter la moitié !) : EXIGE une liste TRIÉE : coût <b>O(log n)</b> : sur 1 million d'éléments : ~20 étapes au lieu de 1 million !</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — dichotomie à la main</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Chercher 43 dans [2, 5, 9, 12, 18, 25, 31, 37, 43, 50, 56] (11 éléments) par dichotomie.</div><div class=\"etu\"><b>Étape 1</b> — <b>Coupe 1</b> : bornes 0-10 : milieu = indice 5 (valeur 25) : 43 &gt; 25 ⟹ tout ce qui est avant (25 compris) est éliminé : il reste [31, 37, 43, 50, 56].</div><div class=\"etu\"><b>Étape 2</b> — <b>Coupes suivantes</b> : milieu de [37, 43, 50, 56] → 43 ? : milieu = 50 : 43 &lt; 50 ⟹ élimine la droite : milieu = 43 ⟹ TROUVÉ à l'indice 8.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le décompte</b> : 3 comparaisons (au lieu de 9 en linéaire) : la preuve du gain : à chaque coupe, l'espace est divisé par 2 ⟹ log2(n) étapes : 1 million d'éléments = 20 coups, 1 milliard = 30 coups (!) : la contrepartie RÉELLE : la liste doit être TRIÉE (et trier coûte... d'où le chapitre suivant) : le compromis trier une fois / chercher mille fois.</div></div></details>\n<h3>2. Tris par sélection et par insertion</h3>\n<div class=\"tip\"><b>Tri par sélection</b> : chercher le MINIMUM de la partie non triée, l'échanger avec la première case libre, avancer : n-1 tours, chacun balayant le reste ⟹ <b>O(n²)</b> comparaisons (peu d'échanges : ~n !).<br><b>Tri par insertion</b> : prendre l'élément suivant, l'INSÉRER à sa place dans la partie déjà triée (comme ses cartes en main !) : <b>O(n²)</b> au pire, mais <b>O(n) si presque trié</b> ⟹ excellent sur les données quasi-triées (le tri des petites listes et des « finitions »).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — tri par insertion pas à pas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Trier [12, 5, 9, 2] par insertion, en montrant l'état après chaque insertion.</div><div class=\"etu\"><b>Étape 1</b> — <b>Insérer 5</b> : partie triée [12] : 5 &lt; 12 ⟹ décaler 12 : [5, 12, | 9, 2] : la main gauche (triée) grandit d'une carte.</div><div class=\"etu\"><b>Étape 2</b> — <b>Insérer 9</b> : 9 &lt; 12 ⟹ décaler 12 : 9 &gt; 5 ⟹ pose : [5, 9, 12, | 2] : 2 décalages. <b>Insérer 2</b> : décale 12, 9, 5 ⟹ [2, 5, 9, 12] : tri terminé.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'analyse</b> : total des décalages = 1 + 2 + 3 = 6 : c'est la somme 1+2+...+(n-1) = n(n-1)/2 ⟹ O(n²) au pire : MAIS sur une liste presque triée, chaque insertion ne décale presque rien ⟹ O(n) : c'est le tri des « petites touches » (ajouter un élément dans une liste déjà triée !) : le sélection, lui, fait TOUJOURS ses balayages complets : connaître les caractères = choisir le bon outil.</div></div></details>\n<h3>3. Coût, preuve, diviser pour régner</h3>\n<div class=\"tip\"><b>Comparer les coûts</b> : recherche dichotomique O(log n) : tris vus O(n²) : le tri fusion (diviser pour régner) atteint <b>O(n log n)</b> (le « mur » de tout tri par comparaison) : Python utilise Timsort (variante de fusion + insertion : les deux mondes !).<br><b>Preuve de terminaison et correction</b> : le variant (le compteur qui avance, l'espace qui rétrécit) garantit qu'on S'ARRÊTE : l'invariant (la partie triée reste triée) garantit qu'on aboutit AU BON résultat : l'invariant de la dichotomie : « si la cible est présente, elle est dans [g, d] ».</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi la dichotomie ne « perd » jamais la cible</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Prouver la correction de la dichotomie par son invariant.</div><div class=\"etu\"><b>Étape 1</b> — <b>L'invariant</b> : au début de chaque tour : SI la valeur cherchée est dans la liste, elle est dans la fenêtre [g, d].</div><div class=\"etu\"><b>Étape 2</b> — <b>L'entretien</b> : on compare au MILIEU : si égal ⟹ trouvé (fin) : si cible &lt; milieu : la liste étant TRIÉE, la cible ne peut être après le milieu ⟹ garder [g, milieu-1] : l'invariant SURVIT : symétrique à droite.</div><div class=\"etu\"><b>Étape 3</b> — <b>La terminaison</b> : la fenêtre rétrécit STRICTEMENT à chaque tour (d - g diminue) : elle finit vide (g &gt; d) ⟹ la cible est absente : conclusion : l'algorithme répond toujours, et juste : cette double preuve (invariant + variant) est le cœur du « prouver ses programmes », une exigence de NSI : savoir l'écrire sur la dichotomie = savoir la refaire sur tout algorithme.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> dichotomie SANS liste triée = résultats faux (pas de crash : le pire !) : le milieu se calcule (g + d) // 2 : O(log n) n'est PAS « plus rapide qu'O(n) pour n petit » (les constant comptent !) : sélection et insertion sont TOUS DEUX O(n²) au pire, mais pas même « au mieux » (insertion : O(n) !) : trier à chaque recherche peut coûter plus cher que le balayage (si une seule recherche : linéaire suffit !).</div>"},
{"id": "ihm-web", "theme": "IHM et web : HTML, CSS, JavaScript (1re)", "niveau": "1re", "titre": "IHM et web : HTML, CSS, JavaScript", "cours": "<div class=\"cours-head\"><h2>IHM et web : HTML, CSS, JavaScript</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. HTML : la structure</h3>\n<div class=\"tip\"><b>HTML</b> = le SQUELETTE (structure du contenu, zéro style !) : <code>&lt;h1&gt;&lt;/h1&gt;</code> titres, <code>&lt;p&gt;&lt;/p&gt;</code> paragraphes, <code>&lt;a href=\"...\"&gt;&lt;/a&gt;</code> liens, <code>&lt;img src=\"...\" alt=\"...\"&gt;</code> images, <code>&lt;ul&gt;&lt;li&gt;&lt;/li&gt;&lt;/ul&gt;</code> listes, <code>&lt;table&gt;&lt;/table&gt;</code> tableaux, <code>&lt;input&gt;</code> <code>&lt;button&gt;</code> formulaires, <code>&lt;div&gt;</code> <code>&lt;span&gt;</code> conteneurs neutres.<br><b>Attributs</b> : les réglages d'une balise (href, src, alt, id, class) : <b>id</b> = unique dans la page (l'identité), <b>class</b> = réutilisable (les groupes) : la structure recommandée : head (invisible : titre, styles), body (visible).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — une page de formulaire complète</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écrire le HTML d'un mini-formulaire : nom (champ texte), niveau (liste), bouton d'envoi.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le conteneur et les champs</b> : <code>&lt;form&gt;</code> puis <code>&lt;label for=\"nom\"&gt;Nom :&lt;/label&gt; &lt;input id=\"nom\" name=\"nom\" required&gt;</code> : le label relié par for=id (accessibilité ET clic sur le label !) : required = validation native du navigateur.</div><div class=\"etu\"><b>Étape 2</b> — <b>La liste et l'envoi</b> : <code>&lt;select id=\"niveau\"&gt;&lt;option&gt;Débutant&lt;/option&gt;&lt;option&gt;Confirmé&lt;/option&gt;&lt;/select&gt;</code> puis <code>&lt;button type=\"submit\"&gt;Envoyer&lt;/button&gt;&lt;/form&gt;</code> : chaque champ porte son name (le nom de la donnée envoyée !).</div><div class=\"etu\"><b>Étape 3</b> — <b>La séparation des rôles</b> : ce HTML ne STYLISE rien (aucune couleur, aucune position : c'est le CSS) et ne réagit à rien (c'est le JavaScript) : la règle d'or de l'IHM web : STRUCTURE (HTML) / PRÉSENTATION (CSS) / COMPORTEMENT (JS) — trois langages, trois responsabilités, jamais mélangées (pas de style inline, pas de onclick en pagaille !).</div></div></details>\n<h3>2. CSS : la présentation</h3>\n<div class=\"tip\"><b>CSS</b> = l'HABILLAGE : <code>sélecteur { propriété: valeur; }</code>. <b>Sélecteurs</b> : <code>p</code> (tous les p), <code>.classe</code> (une classe), <code>#id</code> (un id), <code>nav a</code> (les a DANS nav), <code>a:hover</code> (au survol !). <b>Propriétés clés</b> : color, background, font-size, font-family, margin (extérieur), padding (intérieur), border, display (block/inline/flex), text-align.<br><b>Cascade</b> : le style le plus SPÉCIFIQUE gagne (id &gt; classe &gt; balise) : d'où la discipline : styler par classes, réserver les id au JS.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — centrer une carte avec flexbox</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Centrer horizontalement et verticalement un bloc .carte dans la page.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le conteneur</b> : <code>body { display: flex; min-height: 100vh; justify-content: center; align-items: center; }</code> : flex transforme les enfants en items flexibles alignables sur 2 axes.</div><div class=\"etu\"><b>Étape 2</b> — <b>La carte</b> : <code>.carte { padding: 2rem; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); max-width: 400px; }</code> : padding = l'air INTÉRIEUR, margin = l'air EXTÉRIEUR (la confusion classique !).</div><div class=\"etu\"><b>Étape 3</b> — <b>La lisibilité d'abord</b> : le vrai critère d'une bonne IHM : contraste suffisant (texte lisible !), tailles cohérentes (une échelle : 1rem/1,25/1,5), espacements réguliers : la règle de lisibilité : le design « qui marche » est d'abord une HIÉRARCHIE claire (taille, gras, espacement guident l'œil) : les CSS modernes (flex, grid, variables) servent cette lisibilité, pas la décoration.</div></div></details>\n<h3>3. JavaScript : le comportement, et le trio au service de l'IHM</h3>\n<div class=\"tip\"><b>JavaScript</b> = la RÉACTION : <code>document.getElementById('id')</code> (attraper un élément), <code>el.addEventListener('click', fonction)</code> (écouter), <code>el.textContent = '...'</code> / <code>el.value</code> (lire/écrire), <code>el.classList.add('...')</code> (habiller dynamiquement). <b>Événements</b> : click, input (chaque frappe !), submit, mouseover.<br><b>Interaction type</b> : input ⟹ événement input ⟹ JS lit la valeur ⟹ calcule ⟹ modifie le DOM : la page vit SANS rechargement. <b>IHM (interface homme-machine)</b> : ergonomie = cohérence, retour visuel (le bouton pressé change !), états vides/explicites, accessibilité (clavier, contrastes, alt).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — un compteur de caractères en direct</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Afficher en temps réel le nombre de caractères d'un champ, et l'incruster dans le DOM.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le HTML</b> : <code>&lt;textarea id=\"msg\"&gt;&lt;/textarea&gt; &lt;p id=\"compteur\"&gt;0 caractère&lt;/p&gt;</code> : un id pour le champ, un pour la sortie.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le JS</b> : <code>const champ = document.getElementById('msg') : const sortie = document.getElementById('compteur') : champ.addEventListener('input', () => { sortie.textContent = champ.value.length + ' caractères' })</code> : l'événement input se déclenche à CHAQUE frappe.</div><div class=\"etu\"><b>Étape 3</b> — <b>La lecture du motif</b> : attraper (getElementById) ⟹ écouter (addEventListener) ⟹ lire (.value) ⟹ écrire (.textContent) : c'est LE motif de toute interaction web (formulaire validé en direct, somme calculée, filtre de tableau...) : et le retour utilisateur immédiat est le cœur de l'ergonomie (l'utilisateur voit l'effet de ses actions : pas de page figée !) : ce squelette, réutilisé et enrichi, écrit 90 % des interfaces.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> HTML ≠ langage de programmation (pas de logique, il STRUCTURE) : id unique (classList pour styler !) : margin (extérieur) vs padding (intérieur) : textContent (texte sûr) vs innerHTML (attention aux injections !) : le JS s'exécute côté CLIENT (tout est visible/contournable : la validation serveur reste indispensable) : la balise &lt;script&gt; se place en fin de body (le DOM est prêt !).</div>"},
{"id": "piles-files-arbres", "theme": "Piles, files et arbres (Terminale)", "niveau": "Terminale", "titre": "Piles, files et arbres", "cours": "<div class=\"cours-head\"><h2>Piles, files et arbres</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Piles et files : deux disciplines d'attente</h3>\n<div class=\"tip\"><b>Pile (stack, LIFO)</b> : Dernier Entré, Premier Sorti : une pile d'assiettes — on ne touche que le SOMMET : opérations <code>empiler(x)</code> / <code>depiler()</code> / <code>sommet()</code> : usages : appel de fonctions (pile d'exécution !), undo (Ctrl+Z), parcours en profondeur, expressions.<br><b>File (queue, FIFO)</b> : Premier Arrivé, Premier Servi : la file d'attente du cinéma — on entre derrière, on sort devant : opérations <code>enfiler(x)</code> / <code>defiler()</code> : usages : files d'impression, ordonnancement, parcours en largeur, tampons réseau. Toutes deux : des ACCÈS RESTREINTS (c'est leur force !) : en Python, une liste fait les deux (append/pop pour la pile : insert(0)/pop() ou deque pour la file).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — annuler des actions (undo) avec une pile</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un éditeur enregistre les actions 'A', 'B', 'C' : l'utilisateur fait Ctrl+Z deux fois. Quelles actions sont annulées, dans quel ordre ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'enregistrement</b> : empiler A : empiler B : empiler C : la pile (de bas en haut) : [A, B, C] : le sommet est C, la dernière action commise.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les annulations</b> : Ctrl+Z : depiler() ⟹ C annulée : Ctrl+Z : depiler() ⟹ B annulée : l'ordre est l'INVERSE de la saisie — exactement ce qu'on attend d'un undo !</div><div class=\"etu\"><b>Étape 3</b> — <b>Le redo, et la leçon</b> : les actions annulées sont... empilées dans une SECONDE pile (la pile redo : [C, B]) : refaire = depiler la redo : la structure double est le mécanisme réel des éditeurs (!) : la leçon : une pile ne « choisit » jamais : elle OBEIT au sommet — la discipline LIFO est précisément ce qui modélise « annuler la dernière action » : le même squelette pilera le retour-arrière des navigateurs et l'appel de fonctions (chapitre suivant).</div></div></details>\n<h3>2. Arbres : la hiérarchie</h3>\n<div class=\"tip\"><b>Arbre</b> : sommet (racine), nœuds, feuilles (sans enfants), arêtes : chaque nœud a des enfants (fils) : <b>hauteur</b> = nombre d'étages : <b>taille</b> = nombre de nœuds : l'arbre BINAIRE = au plus 2 fils par nœud (gauche/droite !).<br><b>Parcours en profondeur (DFS, avec une pile)</b> : <b>préfixe</b> (nœud, gauche, droite — l'écriture « opérent opérande opérande » !), <b>infixe</b> (gauche, nœud, droite — l'ordre naturel des expressions), <b>postfixe</b> (gauche, droite, nœud — la notation polonaise inverse des calculatrices !). <b>Parcours en largeur (BFS, avec une FILE)</b> : étage par étage. <b>ARBRE BINAIRE DE RECHERCHE (ABR)</b> : tout ce qui est à gauche &lt; racine &lt; tout ce qui est à droite ⟹ recherche/insertion en O(h).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — les trois parcours d'un même arbre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Racine 8 : fils gauche 3 (fils 1 et 6), fils droit 10 (fils droit 14). Donner les parcours préfixe, infixe et en largeur.</div><div class=\"etu\"><b>Étape 1</b> — <b>Préfixe (nœud d'abord)</b> : 8, puis tout le sous-arbre gauche, puis le droit : 8, 3, 1, 6, 10, 14 : c'est l'ordre d'une COPIE de l'arbre (racine connue avant ses fils !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Infixe (nœud au milieu)</b> : gauche, nœud, droite : 1, 3, 6, 8, 10, 14 — la liste TRIÉE (!) : sur un ABR, l'infixe rend les valeurs ordonnées : c'est LA propriété à retenir.</div><div class=\"etu\"><b>Étape 3</b> — <b>Largeur (file !)</b> : étage par étage : 8, 3, 10, 1, 6, 14 : le mécanisme : enfiler la racine : tant que la file est non vide : défiler un nœud, le visiter, enfiler ses fils : la FILE impose l'ordre « par niveaux » (le premier étage sortira en premier — discipline FIFO !) : l'usage type : trouver le plus court chemin en nombre d'arêtes, afficher un arbre « à la loupe » niveau par niveau.</div></div></details>\n<h3>3. Implémentations et coûts</h3>\n<div class=\"tip\"><b>Implémentations</b> : pile = list Python (append/pop en O(1) au bout !) : file = collections.deque (appendleft/popleft en O(1) : une liste ferait du O(n) avec pop(0) !) : arbre = classe Noeud (valeur, gauche, droite) ou dictionnaire. <b>Coûts</b> : pile et file : O(1) par opération : arbre équilibré : hauteur h = log2(n) ⟹ recherche O(log n) : arbre DÉGÉNÉRÉ (peigné !) : h = n ⟹ O(n) : d'où les arbres équilibrés (AVL, rouges-noirs). <b>Interface vs implémentation</b> : la pile/file définit CE qu'on peut faire (contrat) : la liste/deque choisit COMMENT (voiture : le volant partout, la mécanique selon le constructeur).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — bien parenthéser avec une pile</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Vérifier que « ( [ ] { } ) » est bien parenthésée, puis expliquer pourquoi « ( [ ) ] » échoue.</div><div class=\"etu\"><b>Étape 1</b> — <b>L'algorithme</b> : pile vide : à chaque ouvrante ( [ { ⟹ empiler : à chaque fermante ⟹ si la pile est vide : ERREUR : sinon si sommet() == la correspondante ⟹ depiler : sinon ERREUR : à la fin : pile doit être VIDE.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le premier cas</b> : ( [ : puis ] referre [ (sommet matche : depiler !) : { : } referre { : ) referre ( : pile vide à la fin ⟹ BIEN PARENTHÉSÉE.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le contre-exemple</b> : ( [ : puis ) — le sommet est [ mais ) attend ( : MISMATCH ⟹ erreur immédiate (!) : même si les comptes ouvrantes/fermantes tombent juste (une parenthèse de chaque !) : la leçon : compter ne suffit PAS, il faut respecter l'EMBRIQUAGE : seule la pile (qui se souvient du DERNIER ouvrant non refermé — LIFO !) capture cette discipline : c'est exactement ce que fait le compilateur/interpréteur de votre langage — la pile d'exécution en action.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> pile LIFO / file FIFO (ne pas inverser !) : sur une liste, pop(0) est O(n) — utiliser deque pour les files : l'infixe sur un ABR rend les valeurs TRIÉES (question piège favorite !) : hauteur ≠ taille (étages vs nœuds !) : un ABR dégénéré n'est meilleur qu'une liste ordonnée : le DFS utilise une PILE (ou la récursivité), le BFS une FILE.</div>"},
{"id": "recursivite", "theme": "Récursivité (Terminale)", "niveau": "Terminale", "titre": "Récursivité", "cours": "<div class=\"cours-head\"><h2>Récursivité</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Anatomie d'une fonction récursive</h3>\n<div class=\"tip\">Une fonction <b>récursive</b> s'appelle ELLE-MÊME. Deux ingrédients obligatoires : <b>le cas de base</b> (la condition d'arrêt : la plus petite instance, résolue SANS récursion : n == 0 ⟹ return 1) et <b>l'appel récursif</b> (une instance PLUS PETITE : n-1 : le « work in progress » du problème).<br><b>Forme type</b> : <code>def fact(n):<br>&nbsp;&nbsp;if n == 0: return 1&nbsp;&nbsp;# base<br>&nbsp;&nbsp;return n * fact(n-1)&nbsp;&nbsp;# récursion</code><br>Manquer le cas de base (ou ne pas RÉTRÉCIR l'instance) ⟹ récursion infinie ⟹ débordement de pile : <i>RecursionError: maximum recursion depth exceeded</i>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer 2^5 par récursion, trace complète</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Définir puissance(x, n) récursive (n entier naturel), et tracer l'exécution de puissance(2, 5).</div><div class=\"etu\"><b>Étape 1</b> — <b>La définition</b> : cas de base : n == 0 ⟹ 1 (x^0 = 1 !) : récursion : x * puissance(x, n-1) : chaque appel réduit n de 1 : la descente est garantie finie (n atteint 0).</div><div class=\"etu\"><b>Étape 2</b> — <b>La descente (empilement)</b> : 2 * puissance(2,4) : 2 * (2 * puissance(2,3)) : ... : jusqu'à puissance(2,0) = 1 : cinq appels empilés, chacun SUSPENDU en attendant le retour de son « enfant ».</div><div class=\"etu\"><b>Étape 3</b> — <b>La remontée (dépilement)</b> : puissance(2,0)=1 ⟹ puissance(2,1)=2 ⟹ (2,2)=4 ⟹ (2,3)=8 ⟹ (2,4)=16 ⟹ (2,5)=32 (!) : le mécanisme mental : « pour calculer le grand, FAIS CONFIANCE au petit » : chaque étage délègue, le cas de base répond, tout remonte : c'est la récursivité — la descente empile, la base arrête, la remontée compose.</div></div></details>\n<h3>2. Récursion sur les structures : listes et chaînes</h3>\n<div class=\"tip\">La récursivité brille sur les structures DÉFINIES récursivement : une liste = SOIT vide, SOIT (tête + reste-liste) ! <b>Motifs types</b> : <code>somme(l)</code> : liste vide ⟹ 0 : sinon l[0] + somme(l[1:]) : <code>longueur(l)</code> : vide ⟹ 0 : sinon 1 + longueur(reste) : <code>appartient(x, l)</code> : vide ⟹ False : sinon x == tête OU appartient(x, reste). <b>Attention</b> : l[1:] COPIE (coût O(n) par étage ⟹ O(n²) total) : en vrai code, on préfère un indice (somme(l, i)) ou la version itérative — mais le MODÈLE récursif est la clé de lecture des structures (arbres !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — renverser une chaîne récursivement</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écrire renverse(s) récursive et tracer renverse('abc').</div><div class=\"etu\"><b>Étape 1</b> — <b>Le cas de base et le pas</b> : chaîne vide ⟹ '' : sinon : renverse(s[1:]) + s[0] : « le reste renversé, PUIS la tête collée derrière » : le problème n-1 est le reste de la chaîne.</div><div class=\"etu\"><b>Étape 2</b> — <b>La trace</b> : renverse('abc') = renverse('bc') + 'a' : renverse('bc') = renverse('c') + 'b' : renverse('c') = renverse('') + 'c' : renverse('') = '' (BASE !) : la remontée : 'c', puis 'cb', puis 'cba' (!).</div><div class=\"etu\"><b>Étape 3</b> — <b>La lecture du motif</b> : la définition même d'une chaîne est récursive : « un caractère + une chaîne » : donc le traitement naturel suit la structure : TOUTE fonction « traite la tête + délègue le reste » (somme, miroir, recherche, palindrôme !) : la variante astucieuse à connaître : renverse(s[1:]) + s[0] vs s[-1] + renverse(s[:-1]) — deux lectures symétriques (par la tête ou la queue !) : la même grille mentale passera aux arbres (le roi des structures récursives : un arbre = une racine + deux arbres !).</div></div></details>\n<h3>3. Récursif vs itératif, et la pile d'appels</h3>\n<div class=\"tip\"><b>Toute</b> récursion a une version itérative (boucle + accumulateur, éventuellement une pile explicite) : la récursion coûte des appels empilés (pile d'exécution : cadre par appel !) et Python limite la profondeur (~1000). <b>Avantages récursif</b> : lisibilité sur les structures récursives (arbres, Tours de Hanoï !), découpage naturel du problème. <b>Avantages itératif</b> : pas de débordement, moins de mémoire, souvent plus rapide. <b>La bonne question</b> : « la structure est-elle récursive ? » ⟹ récursif : « c'est un simple cumul ? » ⟹ itératif.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — Fibonacci : le cas d'école du coût caché</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> fib(n) = fib(n-1) + fib(n-2), fib(0)=0, fib(1)=1 : combien d'appels pour fib(5) ? fib(30) ? Comment corriger ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'arbre des appels</b> : fib(5) appelle fib(4) et fib(3) : fib(4) rappelle fib(3) et fib(2)... : fib(3) est recalculé 2 fois, fib(2) 3 fois, fib(1) 5 fois (!) : le nombre d'appels EXPLOSE (≈ 1,6^n : la suite se calcule elle-même en cascade).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le constat</b> : fib(30) ≈ 1,6 million d'appels... et fib(50) ≈ 40 milliards : la version récursive NAÏVE est inutilisable au-delà de n ≈ 35 : la cause n'est pas la récursivité MAIS le recalcul massif (chaque sous-problème refait des sous-sous-problèmes déjà faits !).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les remèdes</b> : 1. MÉMOÏSATION : un dictionnaire des résultats déjà calculés (fib(30) ⟹ 30 appels, instantané !) — « ne recalcule jamais ce que tu as déjà su » : 2. version itérative : a, b = b, a+b en boucle (O(n), deux variables !) : la leçon d'analyse : le nombre D'APPELS est la vraie complexité d'un algorithme récursif : le dessiner en petit (n = 5) révèle le piège — toujours faire l'arbre d'appels avant de lancer un récursif « combinatoire ».</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> pas de cas de base ⟹ RecursionError : appel sur une instance qui ne RÉTRÉCIT PAS (n au lieu de n-1 !) : base ATTEIGNABLE (pas de saut : n-2 peut sauter au-delà de 0 !) : diviser pour régner = découpage en sous-problèmes INDÉPENDANTS (fusion) vs Fibonacci (sous-problèmes CHEVAUCHANTS ⟹ mémoïsation !) : la récursion n'est pas « plus courte à écrire » donc meilleure : comparer le nombre d'appels !</div>"},
{"id": "poo", "theme": "Programmation orientée objet (Terminale)", "niveau": "Terminale", "titre": "Programmation orientée objet", "cours": "<div class=\"cours-head\"><h2>Programmation orientée objet</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Classes, objets, attributs</h3>\n<div class=\"tip\">La <b>classe</b> = le PLAN (Compte, Point, Pile) : l'<b>objet</b> = la RÉALISATION construite d'après ce plan (mon compte, ton compte !). Syntaxe :<br><code>class Compte:<br>&nbsp;&nbsp;def __init__(self, titulaire, solde=0):<br>&nbsp;&nbsp;&nbsp;&nbsp;self.titulaire = titulaire<br>&nbsp;&nbsp;&nbsp;&nbsp;self.solde = solde</code><br><b>__init__</b> = le constructeur (appelé à la création !) : <b>self</b> = l'objet EN COURS de manipulation (le destinataire !) : <b>attributs</b> = les données internes (self.solde) : instanciation : <code>c = Compte('Anna', 100)</code>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — créer et manipuler deux objets indépendants</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Créer Compte('Anna', 100) et Compte('Léo', 50), créditer 20 sur Anna : que vaut chaque solde ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La construction</b> : a = Compte('Anna', 100) ⟹ __init__ s'exécute POUR cet objet : self désigne CE nouvel objet, qui reçoit titulaire='Anna', solde=100 : l = Compte('Léo', 50) ⟹ un SECOND __init__, self désigne l : DEUX objets distincts en mémoire.</div><div class=\"etu\"><b>Étape 2</b> — <b>La manipulation ciblée</b> : a.solde = a.solde + 20 (ou via une méthode crediter !) : seul l'objet a est touché : a.solde = 120, l.solde = 50 (!) : chaque objet vit SA vie : les attributs appartiennent à l'OBJET (pas à la classe !).</div><div class=\"etu\"><b>Étape 3</b> — <b>La lecture du vocabulaire</b> : classe = le moule (Compte) : objet/instance = ce qui en sort (a, l) : attribut = une donnée DANS un objet (a.solde) : méthode = une fonction DANS la classe, appelée SUR un objet (a.crediter(20) ⟹ crediter(a, 20) : le self !) : l'encapsulation (chapitre suivant) consistera à PROTEGER ces attributs — l'objet reprend la main sur ses données.</div></div></details>\n<h3>2. Méthodes et encapsulation</h3>\n<div class=\"tip\"><b>Méthode</b> : une fonction définie DANS la classe, premier paramètre <b>self</b> : <code>def crediter(self, montant): self.solde += montant</code> : appel : <code>a.crediter(20)</code> (self reçoit a automatiquement !). <b>Encapsulation</b> : réunir données (attributs) + opérations (méthodes) dans l'objet, et PROTEGER les données : le code extérieur passe par les méthodes (l'INTERFACE du service) au lieu de tripoter les attributs : un objet bien conçu ne se laisse modifier QUE par ses propres méthodes (invariants garantis : solde jamais négatif !). <b>__str__</b> : la méthode d'affichage personnalisé (print(objet) la utilise !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — protéger un invariant par les méthodes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Garantir qu'un solde de Compte ne devient jamais négatif : débiter 500 sur un solde de 100.</div><div class=\"etu\"><b>Étape 1</b> — <b>La méthode garde-fou</b> : <code>def debiter(self, montant):<br>&nbsp;&nbsp;if self.solde - montant &lt; 0:<br>&nbsp;&nbsp;&nbsp;&nbsp;return False&nbsp;&nbsp;# refus, invariant préservé<br>&nbsp;&nbsp;&nbsp;&nbsp;self.solde -= montant<br>&nbsp;&nbsp;&nbsp;&nbsp;return True</code> : la règle métier vit DANS l'objet.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le test</b> : a.debiter(500) : 100 - 500 &lt; 0 ⟹ return False, solde INTACT (100 !) : a.debiter(30) ⟹ True, solde = 70 : l'extérieur n'a plus AUCUN moyen (légal !) de casser l'invariant : TOUT passe par debiter.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le contre-exemple</b> : sans encapsulation : a.solde = a.solde - 500 (n'importe où dans le code !) ⟹ solde = -400 : l'invariant VOLE EN ÉCLATS, la débouillée est ouverte (!!) : la leçon d'architecture : l'objet est un SERVICE : il expose des opérations (créditer, débiter) et cache l'intendance : l'utilisateur du service ne doit pas OUVRIR la machine — le réparateur seul (les méthodes !) y a droit : c'est le contrat qui rend les gros programmes maintenables.</div></div></details>\n<h3>3. Héritage et réutilisation</h3>\n<div class=\"tip\"><b>Héritage</b> : une classe FILLE hérite des attributs/méthodes de sa classe MÈRE et ajoute/spécialise : <code>class CompteEpargne(Compte):</code> — CompteEpargne a déjà titulaire, solde, crediter ! <b>super()</b> : appeler la méthode de la mère : <code>def __init__(self, t, s, taux):<br>&nbsp;&nbsp;super().__init__(t, s)<br>&nbsp;&nbsp;self.taux = taux</code>. <b>Redéfinition (override)</b> : la fille réécrit une méthode de la mère (sa propre version gagne !). <b>Héritage = « EST UN »</b> : un CompteEpargne EST UN Compte (utilisable partout où un Compte l'est !) : la hiérarchie évite la DUPLICATION (factoriser une fois dans la mère !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — héritage et redéfinition</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> CompteEpargne hérite de Compte, ajoute taux et une méthode interets() qui crédite solde*taux/100 : tester sur 1000 à 2 %.</div><div class=\"etu\"><b>Étape 1</b> — <b>La construction enrichie</b> : <code>class CompteEpargne(Compte):<br>&nbsp;&nbsp;def __init__(self, t, s, taux):<br>&nbsp;&nbsp;&nbsp;&nbsp;super().__init__(t, s)&nbsp;&nbsp;# la mère construit le socle<br>&nbsp;&nbsp;&nbsp;&nbsp;self.taux = taux</code> : super() = « fais comme la mère, puis j'ajoute » : aucune duplication de titulaire/solde !</div><div class=\"etu\"><b>Étape 2</b> — <b>La spécialisation</b> : <code>def interets(self): self.crediter(self.solde * self.taux / 100)</code> : crediter est HÉRITÉ (pas réécrit !) : e = CompteEpargne('Anna', 1000, 2) : e.interets() ⟹ solde = 1020 (!).</div><div class=\"etu\"><b>Étape 3</b> — <b>La puissance du « EST UN »</b> : une fonction du programme attend un Compte (ex. afficher(c) ?) : on peut lui passer... e ! (un CompteEpargne EST UN Compte : toutes ses méthodes marchent !) : et la redéfinition : si la fille réécrit debiter (ex. interdiction de débit !), c'est SA version qui s'exécute, même appelée depuis le code de la mère (!!) : la grille de conception : dupliquer du code entre deux classes ⟹ le FACTORISER dans une mère : spécialiser un comportement ⟹ redéfinir dans la fille : l'héritage est une relation de SENS (est-un), pas un simple copier-coller de facilité.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> oublier self dans la définition (TypeError au premier appel !) : self n'est PAS passé à l'appel (a.crediter(20), pas a.crediter(a, 20) !) : les attributs vivent sur l'OBJET (modifier a ne touche pas b !) : __init__ ne « retourne » pas l'objet (il le PRÉPARE) : l'héritage ne remplace pas l'encapsulation (une mère protégée reste à protéger !) : nom de classe en majuscule par convention (Compte, pas compte !).</div>"},
{"id": "sql-bdd", "theme": "Bases de données et SQL (Terminale)", "niveau": "Terminale", "titre": "Bases de données et SQL", "cours": "<div class=\"cours-head\"><h2>Bases de données et SQL</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le modèle relationnel</h3>\n<div class=\"tip\">Une <b>base de données relationnelle</b> = des <b>TABLES</b> (relations) : lignes = <b>enregistrements</b> (tuples), colonnes = <b>attributs</b> : chaque table a une <b>clé primaire</b> (identifiant UNIQUE, jamais NULL : id !) et peut porter des <b>clés étrangères</b> (référence à la clé primaire d'une AUTRE table : le lien !).<br>Exemple : table <b>livres</b>(id, titre, annee, id_auteur) et <b>auteurs</b>(id, nom) : id_auteur (étrangère !) pointe vers auteurs.id : la redondance est évitée (le nom n'est écrit qu'UNE fois !) : l'<b>SGBD</b> (SQLite, MySQL...) gère stockage, requêtes, contraintes d'intégrité (pas de clé étrangère vers rien !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — modéliser une bibliothèque</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un livre a un auteur (nom, prénom) : un auteur peut écrire plusieurs livres. Concevoir les tables et clés.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les entités</b> : table auteurs(id, nom, prenom) : id = clé primaire (unique, jamais null !) : table livres(id, titre, annee, id_auteur) : id = clé primaire de livres.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le lien</b> : id_auteur = clé ÉTRANGÈRE : chaque valeur doit exister dans auteurs.id (l'intégrité référentielle !) : la relation 1-n se lit : UN auteur, PLUSIEURS livres — la clé étrangère vit du côté « n » (livres !).</div><div class=\"etu\"><b>Étape 3</b> — <b>Pourquoi ce découpage</b> : tout écrire dans une table unique (livre + nom d'auteur) dupliquerait l'auteur à CHAQUE livre (place perdue, erreurs de saisie divergentes : 'Hugo' vs 'hugo' !!) : la clé étrangère ne stocke qu'un PETIT entier, et le nom vit une seule fois : la modification se fait en UN endroit : c'est la victoire du modèle relationnel — éliminer la redondance, garantir la cohérence.</div></div></details>\n<h3>2. SELECT : lire les données</h3>\n<div class=\"tip\"><b>SELECT attributs FROM table WHERE condition ORDER BY critère LIMIT n</b>.<br>La clause <b>WHERE</b> filtre LIGNE PAR LIGNE (conditions =, &lt;, &gt;, &lt;&gt;, AND, OR, LIKE '%mot%', IN (..), BETWEEN a AND b) : <b>ORDER BY</b> trie (ASC/DESC) : <b>DISTINCT</b> dédoublonne : les fonctions d'agrégation <b>COUNT, SUM, AVG, MIN, MAX</b> condensent une table en un résultat (COUNT(*) = le nombre de lignes !).<br><code>SELECT titre FROM livres WHERE annee &gt; 2000 ORDER BY titre</code></div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — trois requêtes utiles sur la bibliothèque</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> (1) Titres des livres publiés après 2000, triés. (2) Nombre de livres. (3) Année du livre le plus ancien.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le filtre et le tri</b> : <code>SELECT titre FROM livres WHERE annee &gt; 2000 ORDER BY titre ASC</code> : WHERE GARDÉ les lignes, SELECT a choisi la colonne, ORDER BY a rangé.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'agrégat</b> : <code>SELECT COUNT(*) FROM livres</code> : toute la table se condense en UN nombre (!) : attention : COUNT(*) compte les lignes, COUNT(attribut) les valeurs NON NULL.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'extraction</b> : <code>SELECT MIN(annee) FROM livres</code> : le plus ancien en une ligne (!) : la lecture du FORMAT : SELECT ⟹ quoi afficher : FROM ⟹ où : WHERE ⟹ quelles lignes : ORDER BY/LIMIT ⟹ habillage : l'ordre des clauses est FIXE (SELECT... FROM... WHERE... ORDER BY...) : une requête n'est pas une phrase jetée, c'est un questionnement STRUCTURÉ à la base.</div></div></details>\n<h3>3. JOINTURE : croiser les tables, et modifier</h3>\n<div class=\"tip\"><b>JOINTURE</b> : recoller les lignes de deux tables via la clé étrangère : <code>SELECT livres.titre, auteurs.nom<br>FROM livres JOIN auteurs ON livres.id_auteur = auteurs.id</code> : chaque livre retrouve SON auteur (le lien devient lecture !).<br><b>Modification</b> : <code>INSERT INTO livres (titre, annee, id_auteur) VALUES ('...','', 3)</code> : <code>UPDATE livres SET annee = 1998 WHERE id = 5</code> : <code>DELETE FROM livres WHERE id = 5</code>. <b>⚠️ UPDATE/DELETE sans WHERE = TOUTE la table modifiée/supprimée !</b></div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la jointure pas à pas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> livres : (1, 'Nuit', 3), (2, 'Matin', 7) : auteurs : (3, 'Hugo'), (7, 'Sand'). Donner le résultat de la jointure.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le principe</b> : pour CHAQUE ligne de livres, le SGBD cherche la ligne de auteurs telle que livres.id_auteur = auteurs.id : les deux lignes se COLLENT en une seule, riche des deux côtés.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le résultat</b> : ('Nuit', 'Hugo') et ('Matin', 'Sand') (!) : la requête SELECT livres.titre, auteurs.nom FROM livres JOIN auteurs ON livres.id_auteur = auteurs.id rend le tableau titre + nom.</div><div class=\"etu\"><b>Étape 3</b> — <b>Les angles morts</b> : un livre avec id_auteur = 99 (auteur inexistant !) disparaît du résultat (jointure INTERNE : pas de correspondance, pas de ligne !) : un auteur SANS livre n'apparaît pas non plus (JOIN simple ne le recopie pas !) : pour les voir : LEFT JOIN (garde TOUS les livres, auteur manquant ⟹ NULL !) : la jointure est LE pont du modèle relationnel : sans elle, le découpage anti-redondance serait une prison — grâce à elle, tout se recoud à la demande.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> WHERE s'applique aux LIGNES, pas aux colonnes (choisir les colonnes = le SELECT !) : COUNT(*) vs COUNT(colonne) (null !) : UPDATE/DELETE sans WHERE ⟹ catastrophe silencieuse : la jointure SANS ON (produit croisé : toutes les combinaisons !!) : une clé primaire n'accepte ni doublon ni NULL : SQL n'est pas sensible à la casse pour les mots-clés (SELECT = select), mais les valeurs OUI ('hugo' ≠ 'Hugo' !).</div>"},
{"id": "graphes", "theme": "Graphes et plus courts chemins (Terminale)", "niveau": "Terminale", "titre": "Graphes et plus courts chemins", "cours": "<div class=\"cours-head\"><h2>Graphes et plus courts chemins</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Vocabulaire et représentations</h3>\n<div class=\"tip\">Un <b>graphe</b> = des <b>sommets</b> (nœuds) reliés par des <b>arêtes</b> (non orienté : routes) ou <b>arcs</b> (orienté : liens de suivi !). <b>Ordre</b> = nombre de sommets : <b>degré</b> d'un sommet = nombre d'arêtes incidentes. <b>Adjacent/voisin</b> : reliés directement. <b>Chemin</b> : suite d'arêtes : <b>connexe</b> : tout sommet rejoint tout autre.<br><b>Représentations</b> : matrice d'adjacence M[i][j] = 1 si arête (BOOLEAN, symétrique si non orienté !) : ou dictionnaire de listes de voisinage {s: [voisins]} (économe si le graphe est CLAIRSEMÉ !) : le graphe PONDÉRÉ porte un poids par arête (distance, coût, temps !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — choisir la représentation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un réseau de 1000 villes, chacune reliée à ~3 autres. Matrice ou liste de voisinage ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La matrice</b> : 1000×1000 = 1 000 000 de cases à stocker, dont seules ~3000 valent 1 (!!) : 99,7 % de zéros — du gaspillage pur.</div><div class=\"etu\"><b>Étape 2</b> — <b>La liste</b> : {ville: [3 voisins]} ⟹ 3000 entrées au total : ~300× moins de place (!) : et l'énumération des voisins est IMMÉDIATE (graphe[v] — direct !).</div><div class=\"etu\"><b>Étape 3</b> — <b>La règle de choix</b> : graphe DENSE (beaucoup d'arêtes, matrice presque pleine) ⟹ matrice (test d'arête en O(1) : M[i][j] !!) : graphe CLAIRSEMÉ (réseaux réels : cartes, web !) ⟹ dictionnaire : le réflexe : compter les arêtes par rapport à n² : c'est aussi le critère de complexité (le parcours explore les VOISINS : leur nombre, pas n, dicte le coût !).</div></div></details>\n<h3>2. Parcours : largeur (BFS) et profondeur (DFS)</h3>\n<div class=\"tip\"><b>Parcours en largeur (BFS, une FILE)</b> : visiter étage par étage, à partir d'une source : il fournit les <b>distances en nombre d'arêtes</b> (le premier moment où on atteint un sommet = sa distance minimale !) et l'<b>arbre des plus courts chemins</b> (via le « parent » noté !). <b>Parcours en profondeur (DFS, une PILE ou la récursivité)</b> : plonger le plus loin possible, revenir : il détecte les <b>cycles</b>, sert au tri topologique.<br>Les deux : complexes en O(sommets + arêtes) : marqués visités pour ne pas tourner en rond !</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — BFS et la distance</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Graphe : A-B, A-C, B-D, C-D. Parcours en largeur depuis A : distances ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le déroulé</b> : enfiler A (distance 0 !) : défiler A, visiter : enfiler B et C (distance 1, parents A !) : défiler B : voisin D ⟹ enfiler (distance 2, parent B !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le tableau final</b> : A : 0 : B : 1 : C : 1 : D : 2 : ET le parent de D est B ⟹ le plus court chemin A→D se lit à reculons : D, B, A (!!).</div><div class=\"etu\"><b>Étape 3</b> — <b>Pourquoi c'est OPTIMAL</b> : la file traite les sommets par distance CROISSANTE (tous les distance 1 AVANT les distance 2 !) : donc quand D est atteint par B (dist. 1), aucun chemin plus court ne pouvait exister — les sommets dist. 0 et 1 ont déjà été tous traités (!!) : c'est la preuve du BFS : le premier contact = la meilleure distance : le même squelette, en PONDÉRÉ, ne marche PLUS (une arête longue peut tromper l'ordre !) — c'est là que Dijkstra prend le relais.</div></div></details>\n<h3>3. Plus courts chemins pondérés : Dijkstra</h3>\n<div class=\"tip\"><b>Dijkstra</b> : le BFS généralisé aux poids POSITIFS. Idée : tenir une table des <b>distances provisoires</b> : à chaque tour, FIXER le sommet non visité de plus petite distance provisoire (il est définitivement optimal !), puis <b>relâcher</b> ses arcs : d[v] = min(d[v], d[u] + poids(u, v)).<br>Avec une file de priorité : O((S+A) log S). <b>⚠️ Ne marche PAS avec des poids négatifs</b> (un détour « bonus » pourrait améliorer un chemin déjà fixé !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — Dijkstra pas à pas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Arêtes pondérées : A-B : 1, A-C : 4, B-C : 2, B-D : 6, C-D : 3. Distances minimales depuis A ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'initialisation</b> : d(A)=0 (la source !), tous les autres à ∞ (inconnu !) : le graphe est entièrement « brumeux » sauf la source.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les tours</b> : T1 : le plus petit provisoire est A (0) ⟹ fixé : relâche : d(B)=1, d(C)=4 : T2 : fixe B (1) : relâche : d(C) = min(4, 1+2) = 3 (!) : d(D) = 1+6 = 7 : T3 : fixe C (3) : d(D) = min(7, 3+3) = 6 (!!) : T4 : fixe D.</div><div class=\"etu\"><b>Étape 3</b> — <b>La lecture des résultats</b> : d(B)=1, d(C)=3, d(D)=6 : et le chemin optimal A→D se retrouve par les parents : D ⟵ C ⟵ B ⟵ A : le trajet A-B-C-D (longueur 6) BAT le direct A-B-D (7 !) : la morale : le chemin « logique » (moins d'étapes !) n'est pas toujours le plus COURT — Dijkstra explore et PROUVE : chaque sommet fixé l'est définitivement (poids positifs : passer par plus de sommets ne peut que rallonger !) — la garantie qui fonde l'algorithme.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> BFS = distances en ARÊTES (non pondéré !) : Dijkstra exige des poids POSITIFS : oublier de marquer les visités ⟹ boucle infinie : matrice = O(n²) mémoire (clairsemé ⟹ dictionnaire !) : la file de BFS traite les distances dans l'ordre (premier contact = optimal !) : arête « orientée » vs « non orientée » (M[i][j] ≠ M[j][i] si orienté !) : dans Dijkstra, on ne fixe JAMAIS un sommet déjà fixé.</div>"},
{"id": "diviser-regner", "theme": "Diviser pour régner et programmation dynamique (Terminale)", "niveau": "Terminale", "titre": "Diviser pour régner et programmation dynamique", "cours": "<div class=\"cours-head\"><h2>Diviser pour régner et programmation dynamique</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le paradigme : diviser, régner, combiner</h3>\n<div class=\"tip\"><b>Diviser pour régner</b> (D&C) : trois étapes — <b>1. DIVISER</b> le problème en sous-problèmes plus petits (souvent en 2 !), <b>2. RÉGNER</b> : résoudre les sous-problèmes (récursivement, jusqu'à un cas trivial !), <b>3. COMBINER</b> les solutions (le coût du paradigme vit SOUVENT ici !).<br><b>Exemples</b> : recherche dichotomique (diviser : quelle moitié ? combiner : rien — O(log n) !) : tri fusion (diviser en 2 moitiés, trier, FUSIONNER en O(n) — O(n log n) !) : exponentiation rapide (x^n = (x^(n/2))² — O(log n) multiplications !). Le coût suit la <b>relation de récurrence</b> : T(n) = a·T(n/b) + f(n).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'exponentiation rapide</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer 2^10 par exponentiation rapide : combien de multiplications contre la méthode naïve ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La décomposition</b> : 2^10 = (2^5)² : 2^5 = 2^4 × 2 : 2^4 = (2^2)² : 2^2 = (2^1)² : 2^1 = 2^0 × 2 : 2^0 = 1 (CAS DE BASE !) : chaque étage DIVISE l'exposant par 2.</div><div class=\"etu\"><b>Étape 2</b> — <b>La remontée</b> : 2^1 = 2 : 2^2 = 4 : 2^4 = 16 : 2^5 = 32 : 2^10 = 1024 : 4-5 multiplications au lieu de 10 (!) : pour 2^1000 : ~11 multiplications contre 1000 (!!!).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le code et la leçon</b> : <code>def expo(x, n):<br>&nbsp;&nbsp;if n == 0: return 1<br>&nbsp;&nbsp;demi = expo(x, n // 2)<br>&nbsp;&nbsp;if n % 2 == 0: return demi * demi<br>&nbsp;&nbsp;return demi * demi * x</code> : la relation de récurrence T(n) = T(n/2) + O(1) ⟹ O(log n) : la leçon : diviser par 2 à chaque étage ⟹ log2(n) étages — la marque de fabrique du paradigme : la cryptographie (chapitre voisin !) repose sur ce calcul rapide... mais sur l'IMPOSSIBILITÉ de l'inverser : le paradigme en action dans la sécurité.</div></div></details>\n<h3>2. Le tri fusion : le grand classique</h3>\n<div class=\"tip\"><b>Tri fusion</b> : diviser la liste en 2 moitiés : trier récursivement chaque moitié : <b>FUSIONNER</b> les deux moitiés triées (le riffle de deux paquets de cartes ! : comparer les deux têtes, prendre la plus petite, avancer — O(n) !).<br><b>Coût</b> : T(n) = 2·T(n/2) + O(n) ⟹ <b>O(n log n)</b> (le mur optimal des tris par comparaison !) : le tableau des gains : n=100 000 : n² = 10 milliards, n log n = 1,7 million (!).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — fusionner pas à pas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Fusionner [2, 8, 9] et [1, 5, 10] en une liste triée.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le duel des têtes</b> : 2 vs 1 ⟹ prendre 1 (avancer dans la droite !) : 2 vs 5 ⟹ prendre 2 : 8 vs 5 ⟹ prendre 5 : 8 vs 10 ⟹ prendre 8 : 9 vs 10 ⟹ prendre 9.</div><div class=\"etu\"><b>Étape 2</b> — <b>La fin de course</b> : une liste épuisée ⟹ VERSER le reste de l'autre : 10 s'ajoute : résultat : [1, 2, 5, 8, 9, 10] — trié, en EXACTEMENT 5 comparaisons (n-1 max !).</div><div class=\"etu\"><b>Étape 3</b> — <b>L'analyse du tri complet</b> : tri fusion de [8,2,9,1,5,10] : moitié [8,2,9] → [2,8,9] : moitié [1,5,10] déjà : fusion (5 comparaisons !) : le coût total : chaque « étage » de fusion coûte n : il y a log2(n) étages ⟹ n log n (!!) : la force cachée : la fusion est STABLE (les égalités gardent leur ordre !) et le coût est GARANTI (O(n log n) même en pire cas — contrairement au quicksort !) : le tri de Python (Timsort) en est l'héritier direct.</div></div></details>\n<h3>3. Programmation dynamique : chevauchements et sous-structure</h3>\n<div class=\"tip\">Quand les sous-problèmes se <b>CHEVAUCHENT</b> (Fibonacci : fib(3) recalculé partout !), le diviser-pour-régner pur gaspille : la <b>programmation dynamique</b> calcule CHAQUE sous-problème UNE SEULE FOIS et le RÉUTILISE (mémoïsation top-down, ou tableau bottom-up !).<br><b>Conditions</b> : sous-structure optimale (la solution optimale se construit d'optimaux !) + chevauchement : <b>Exemple</b> : Fibonacci bottom-up : <code>f[0]=0 : f[1]=1 : for i in range(2, n+1): f[i] = f[i-1] + f[i-2]</code> — O(n) au lieu de O(1,6^n) (!!) : l'exemple roi des applications : le sac à dos, les distances d'édition, les alignements de séquences (bio-info !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — Fibonacci : de l'explosion au tableau</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparer les trois versions de Fibonacci : récursive naïve, mémoïsée, bottom-up.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le naïf et son arbre</b> : fib(5) = fib(4) + fib(3) : fib(4) refait fib(3)... : le nombre d'appels ≈ 1,6^n : fib(50) ≈ 40 milliards d'appels — des HEURES (!!).</div><div class=\"etu\"><b>Étape 2</b> — <b>La mémoïsation (top-down)</b> : un dictionnaire : si n dedans ⟹ retourner : sinon calculer PUIS RANGER : fib(50) ⟹ 50 calculs, instantané (!) — « ne recalcule jamais ce que tu as déjà su ».</div><div class=\"etu\"><b>Étape 3</b> — <b>Le bottom-up (l'esprit dynamique pur)</b> : remplir le tableau DANS L'ORDRE des dépendances : f[2] = f[1]+f[0], f[3] = f[2]+f[1]... chaque case en O(1), chaque case UNE fois ⟹ O(n) (!!) : et même l'optimisation d'espace : deux variables (a, b = b, a+b) suffisent — le tableau entier est inutile ! : la lecture du passage : le naïf « redécouvre » sans cesse, le dynamique APPREND et construit : c'est LE pont entre la récursion élégante et l'efficacité industrielle.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> diviser-pour-régner = sous-problèmes DISJOINTS (fusion !) : programmation dynamique = sous-problèmes CHEVAUCHANTS (cache/tableau !) : le coût du tri fusion est GARANTI (pire cas inclus !) : la fusion exige DEUX listes déjà triées (!) : exponentiation rapide : (x^(n/2))² pour n pair, × x pour n impair (ne pas oublier le cas impair !) : bottom-up remplit dans le BON ordre (les dépendances AVANT !).</div>"},
{"id": "securite-crypto", "theme": "Sécurité et cryptographie (Terminale)", "niveau": "Terminale", "titre": "Sécurité et cryptographie", "cours": "<div class=\"cours-head\"><h2>Sécurité et cryptographie</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Chiffrement symétrique</h3>\n<div class=\"tip\"><b>Chiffrer</b> = rendre un message illisible sans la clé : <b>déchiffrer</b> = retrouver le message avec la clé : <b>symétrique</b> = la MÊME clé chiffre et déchiffre (le Caesar : décaler les lettres !).<br><b>César</b> : A→D, B→E... (décalage 3 !) : cassé par <b>analyse de fréquences</b> (le E français le plus fréquent !) ou par force brute (26 décalages seulement !!). La force d'un chiffrement : la taille de l'espace des clés (César : 2^5 clés environ... AES : 2^128 !!) : les chiffrements modernes (AES !) : même symétriques mais à clé immense et mélanges non devinables.<br><b>XOR</b> (OU exclusif !) : la brique du chiffrement : clé ⊕ message = chiffré, chiffré ⊕ clé = message (!).<br><b>⚠️ sécurité de l'information</b> : mot de passe = JAMAIS en clair : on stocke un <b>hachage</b> (empreinte !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — casser un César par fréquences</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Intercepté : « YJGCEVQQN ». Trouver le décalage du César.</div><div class=\"etu\"><b>Étape 1</b> — <b>La lettre dominante</b> : le texte français a E pour lettre la plus fréquente : dans le chiffré, la lettre la plus fréquente est Q (3 fois sur 9 !).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'hypothèse</b> : si Q représente E : décalage = Q(16) - E(4) = 12 : déchiffrer avec -12 : Y→M, J→X (!?) — « MX... » : pas convaincant : tester : la 2e hypothèse (Q = A ? 16 : Y→I... « IQGCE... » non !).</div><div class=\"etu\"><b>Étape 3</b> — <b>La force brute, seule juge</b> : 26 décalages ⟹ 26 textes : on lit le seul FRANÇAIS : décalage 2 : « WINWATER »... : et le bon : « WITHLOVE » pour décalage... — la méthode systématique gagne TOUJOURS (l'espace de clés minuscule est la mort du César !) : la leçon moderne : un chiffrement sûr doit résister à la force brute jusqu'à la fin des temps (2^128 essais à 1 milliard/s ≈ 10^22 ANS !) : d'où AES et clés de 128+ bits !</div></div></details>\n<h3>2. Hachage : l'empreinte</h3>\n<div class=\"tip\">Une <b>fonction de hachage</b> (SHA-256 !) : message ⟹ <b>empreinte</b> (taille FIXE, 256 bits !) : <b>à sens unique</b> (de l'empreinte, IMPOSSIBLE de remonter au message !) : une modification d'1 bit ⟹ empreinte TOTALEMENT changée (effet avalanche !) : quasi-impossible de trouver DEUX messages de même empreinte (collision !).<br><b>Usages</b> : stocker les mots de passe (jamais le mot lui-même !), vérifier l'<b>intégrité</b> d'un téléchargement (comparer les empreintes !), signatures : <b>⚠️</b> contre l'attaque par table arc-en-ciel : hacher + SEL (un aléa ajouté !) et itérer (bcrypt !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — mots de passe et empreintes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un site stocke sha256('azerty') pour chaque compte : que voit un pirate qui vole la base ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le vol de la base</b> : il obtient des EMPREINTES hexadécimales (64 caractères !), PAS les mots de passe : impossible d'inverser (sens unique !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Mais l'attaque par dictionnaire</b> : il hache LUI-MÊME des mots courants ('azerty', '123456', 'motdepasse' !) et COMPARE avec la base : les correspondances révèlent les mots faibles (!!) : c'est la table arc-en-ciel (des milliards d'empreintes précalculées !).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les défenses</b> : 1. le <b>SEL</b> : un aléa unique par utilisateur, haché AVEC le mot de passe : le même 'azerty' donne des empreintes DIFFÉRENTES partout (les tables précalculées deviennent inutiles !) : 2. des fonctions LENTES (bcrypt : des milliers d'itérations !) pour que chaque essai coûte : 3. l'utilisateur : un mot de passe LONG et unique (le facteur humain !) : le trio sel + lenteur + longueur = la hygiène des mots de passe.</div></div></details>\n<h3>3. Asymétrique et confiance : le monde du web</h3>\n<div class=\"tip\"><b>Asymétrique</b> (RSA !) : DEUX clés — <b>publique</b> (chiffre ! donnée à tous : le cadenas ouvert !) et <b>privée</b> (déchiffre ! gardée secrète : la seule clé du cadenas !) : résout le PARADOXE du symétrique (comment échanger la clé secrète sans canal sûr ? !).<br><b>Signature</b> : chiffrer AVEC la privée = prouver l'identité (tout le monde vérifie avec la publique !) : <b>certificats</b> (HTTPS !) : l'autorité (CA !) certifie la clé publique d'un site — la CHAÎNE DE CONFIANCE : <b>chiffrement hybride</b> (le web réel !) : RSA pour échanger une clé de session, AES pour le flux (rapide !).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — HTTPS : la poignée de main</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Raconter la sécurisation d'une visite web en 4 temps (hybride !).</div><div class=\"etu\"><b>Étape 1</b> — <b>La certification</b> : le navigateur reçoit la clé PUBLIQUE du site + son CERTIFICAT (signé par une autorité reconnue !) : le navigateur VÉRIFIE la signature (clés des autorités préinstallées !) : si invalide ⟹ l'alerte « connexion non privée » (!).</div><div class=\"etu\"><b>Étape 2</b> — <b>La clé de session</b> : le navigateur fabrique une clé SYMÉTRIQUE éphémère (AES !) et l'envoie au site CHIFFRÉE AVEC la clé publique du site : seul le site (clé privée !) peut la lire (!!).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le flux rapide</b> : tout le reste de la session est chiffré en SYMÉTRIQUE (AES : rapide !) — l'asymétrique a joué SON rôle unique (l'échange de la clé en canal ouvert !) et se retire : c'est le HYBRIDE : la confiance (certificats !) + la distribution (RSA !) + la vitesse (AES !) — les trois piliers du HTTPS en une poignée de main.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le hash n'est PAS un chiffrement (pas de déchiffrement — sens unique !) : « crypter un mot de passe » est une erreur de vocabulaire (on le HACHE !) : César : 26 clés = cassé en quelques secondes (!) : la clé publique n'est PAS la clé privée en clair (deux clés LIÉES mais différentes !) : la sécurité repose sur la LONGUEUR des clés et la difficulté MATHÉMATIQUE (factoriser !), pas sur le secret de l'algorithme (Kerckhoffs : l'algorithme est PUBLIC !).</div>"},
];
