 {
  "id": "ordinateur-composants",
  "theme": "L'ordinateur et ses composants (3e)",
  "niveau": "3e",
  "titre": "L'ordinateur et ses composants",
  "cours": "<div class=\"cours-head\"><h2>L'ordinateur et ses composants</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. À quoi sert un ordinateur ?</h3>\n<ul>\n<li>Traiter de l'<b>information</b> : textes, images, sons, vidéos, calculs ;</li>\n<li>Un ordinateur est une machine <b>programmable</b> : il exécute des instructions données par l'humain (le programme) ;</li>\n<li>Il ne « comprend » rien : il <b>calcule</b> très vite et ne se fatigue pas.</li>\n</ul>\n\n<h3>2. Les composants matériels (le hardware)</h3>\n<table>\n<tr><th>Composant</th><th>Rôle</th></tr>\n<tr><td><b>Processeur</b> (CPU)</td><td>le « cerveau » : exécute les instructions</td></tr>\n<tr><td><b>Mémoire vive</b> (RAM)</td><td>travail temporaire — s'efface à l'extinction</td></tr>\n<tr><td><b>Stockage</b> (disque dur, SSD)</td><td>conserve les données durablement</td></tr>\n<tr><td><b>Carte mère</b></td><td>relie tous les composants</td></tr>\n<tr><td><b>Périphériques d'entrée</b></td><td>clavier, souris, écran tactile, micro</td></tr>\n<tr><td><b>Périphériques de sortie</b></td><td>écran, imprimante, haut-parleurs</td></tr>\n<tr><td><b>Périphériques d'entrée/sortie</b></td><td>écran tactile, clé USB, casque avec micro</td></tr>\n</table>\n<div class=\"tip\"><b>RAM ≠ stockage</b> : la RAM est rapide mais <b>volatile</b> (tout s'efface à l'arrêt) ; le stockage est plus lent mais <b>permanent</b>. C'est la différence clé du chapitre.</div>\n\n<h3>3. Le logiciel (le software)</h3>\n<ul>\n<li><b>Système d'exploitation</b> (Windows, macOS, Linux, Android, iOS) : le chef d'orchestre — gère le matériel et lance les programmes ;</li>\n<li><b>Applications</b> : programmes qui rendent des services (navigateur, traitement de texte, jeux) ;</li>\n<li><b>Pilotes</b> (drivers) : petits logiciels qui font dialoguer le système et un périphérique.</li>\n</ul>\n\n<h3>4. Tout est nombre : le codage binaire</h3>\n<ul>\n<li>Un ordinateur ne manipule que des <b>0 et des 1</b> (bits) — courant électrique : allumé/éteint ;</li>\n<li>Un <b>octet</b> (byte) = 8 bits → 256 valeurs possibles ;</li>\n<li>Unités : ko (≈ 1000 octets), Mo, Go, To — d'où la taille des fichiers et des disques.</li>\n</ul>\n<div class=\"formule\">Texte : chaque lettre = un nombre (code) ; Image : chaque pixel = 3 nombres (rouge, vert, bleu) ; Son : la vibration = une suite de mesures. Tout est codé en binaire.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — classer les périphériques</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Classer : scanner, écran, clavier, clé USB, imprimante, écran tactile.</div><div class=\"etu\"><b>Étape 1 — Se demander : information qui entre ou qui sort ?</b> Le scanner et le clavier <b>envoient</b> de l'information vers l'ordinateur : entrées.</div><div class=\"etu\"><b>Étape 2 — Les sorties</b> : l'écran et l'imprimante <b>reçoivent</b> de l'information de l'ordinateur : sorties.</div><div class=\"etu\"><b>Étape 3 — Les deux sens</b> : la clé USB et l'écran tactile fonctionnent dans <b>les deux sens</b> : entrée/sortie.</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : on imagine le trajet de l'information — vers l'ordinateur ? depuis ? les deux ? La classification est toujours la même.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La mémoire RAM stocke mes fichiers » : non, elle est <b>volatile</b> ; les fichiers vont sur le <b>disque</b>.</li>\n<li>« Le système d'exploitation est une application » : c'est le <b>logiciel de base</b> qui fait tourner les applications.</li>\n<li>« Un octet = 1 bit » : 1 octet = <b>8 bits</b>.</li>\n<li>« L'ordinateur réfléchit » : il exécute — la « réflexion » vient du programmeur.</li>\n<li>« On ne peut brancher qu'un périphérique à la fois » : la carte mère gère <b>plusieurs</b> périphériques simultanément.</li>\n</ul>\n</div>"
 },

  "niveau": "3e",
  "titre": "Le réseau et Internet",
  "cours": "<div class=\"cours-head\"><h2>Le réseau et Internet</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Un réseau : relier des machines</h3>\n<ul>\n<li><b>Réseau</b> : des machines reliées pour <b>échanger</b> des données ;</li>\n<li>Réseau <b>local</b> (maison, école : box, wifi) vs réseau <b>mondial</b> (Internet) ;</li>\n<li>Chaque machine a une <b>adresse IP</b> (ex. 192.168.1.10) — comme une adresse postale sur le réseau.</li>\n</ul>\n\n<h3>2. Comment voyagent les données ?</h3>\n<ol>\n<li>Un fichier est découpé en petits <b>paquets</b> ;</li>\n<li>Chaque paquet voyage <b>indépendamment</b>, par des chemins différents (routeurs = aiguilleurs) ;</li>\n<li>À l'arrivée, les paquets sont <b>réassemblés</b> dans l'ordre.</li>\n</ol>\n<div class=\"tip\"><b>Pourquoi des paquets ?</b> Si une route est coupée, les paquets passent par une autre — c'est le secret de la robustesse d'Internet (conçu pour résister à des pannes).</div>\n\n<h3>3. Internet vs le Web : ne pas confondre !</h3>\n<table>\n<tr><th></th><th>Internet</th><th>Le Web</th></tr>\n<tr><td><b>Nature</b></td><td>réseau de machines (l'infrastructure)</td><td>service qui tourne sur Internet (les pages)</td></tr>\n<tr><td><b>Exemples</b></td><td>web, messagerie, jeux en ligne, visio</td><td>sites consultés au navigateur</td></tr>\n</table>\n<div class=\"warn\"><b>Image utile</b> : Internet est le <b>réseau routier</b> ; le Web est un <b>service de livraison</b> qui l'emprunte. La messagerie, la visio ou les jeux utilisent Internet sans être du Web.</div>\n\n<h3>4. Protocoles : la langue commune</h3>\n<ul>\n<li>Un <b>protocole</b> = des règles communes pour que les machines se comprennent ;</li>\n<li><b>IP</b> : adressage des paquets ; <b>TCP</b> : fiabilité (accusés de réception, renvoi des paquets perdus) ;</li>\n<li><b>HTTP(S)</b> : échange de pages web ; <b>SMTP/IMAP</b> : courriels ; <b>DNS</b> : traduit un nom (exemple.fr) en adresse IP.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — comprendre une adresse web</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Que signifie chaque partie de <b>https://www.moncollege.fr/pages/cours.html</b> ?</div><div class=\"etu\"><b>Étape 1 — Le protocole</b> : <b>https</b> = échange web <b>sécurisé</b> (chiffré) ; sans le « s », la communication circule en clair.</div><div class=\"etu\"><b>Étape 2 — Le domaine</b> : <b>www.moncollege.fr</b> — le DNS le traduit en adresse IP pour trouver le serveur.</div><div class=\"etu\"><b>Étape 3 — Le chemin</b> : <b>/pages/cours.html</b> — le fichier demandé sur ce serveur.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : chaque morceau a un rôle précis ; savoir le décomposer aide à repérer les <b>arnaques</b> (ex. un faux site utilise un domaine différent).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Internet = le Web » : le Web est un service <b>parmi d'autres</b> sur Internet.</li>\n<li>« Le wifi, c'est Internet » : le wifi est un <b>réseau local</b> ; il faut en plus un accès (box, fibre) vers Internet.</li>\n<li>« Les paquets voyagent toujours par le même chemin » : chaque paquet peut suivre une <b>route différente</b>.</li>\n<li>« Une IP suffit à identifier une personne » : une IP identifie une <b>machine</b>, pas toujours son utilisateur.</li>\n<li>« http et https, pareil » : le « s » = <b>chiffrement</b> — regardons-le avant de saisir un mot de passe.</li>\n</ul>\n</div>"
 },

  "id": "donnees-cloud",

  "niveau": "3e",
  "titre": "Les données numériques et le cloud",
  "cours": "<div class=\"cours-head\"><h2>Les données numériques et le cloud</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Une donnée : qu'est-ce que c'est ?</h3>\n<ul>\n<li>Une <b>donnée</b> = une description d'un fait : un nom, une photo, une note, une position GPS ;</li>\n<li>Elle devient utile quand on l'<b>organise</b> et on l'<b>interprète</b> (une note seule ne dit rien ; avec les notes de tous, on classe) ;</li>\n<li>Une donnée a une <b>source</b>, une <b>date</b>, un <b>format</b> — toujours se demander d'où elle vient.</li>\n</ul>\n\n<h3>2. Les formats de fichiers</h3>\n<table>\n<tr><th>Type de contenu</th><th>Formats courants</th></tr>\n<tr><td>Texte</td><td>.txt, .docx, .pdf</td></tr>\n<tr><td>Image</td><td>.jpg, .png, .gif</td></tr>\n<tr><td>Son</td><td>.mp3, .wav</td></tr>\n<tr><td>Vidéo</td><td>.mp4, .avi</td></tr>\n<tr><td>Données tabulaires</td><td>.csv, .xlsx (tableur)</td></tr>\n</table>\n<div class=\"tip\"><b>Une extension = un format</b> : elle indique au système comment <b>ouvrir</b> le fichier. Renommer l'extension ne convertit pas le contenu !</div>\n\n<h3>3. Le cloud : mes fichiers ailleurs ?</h3>\n<ul>\n<li><b>Cloud</b> : stocker ses données sur des <b>serveurs distants</b>, accessibles par Internet ;</li>\n<li>Avantages : accessibles <b>partout</b>, sauvegarde automatique, partage facile ;</li>\n<li>Exemples : Drive, iCloud, OneDrive, Dropbox, sauvegardes de téléphone.</li>\n</ul>\n<div class=\"warn\"><b>Ce qu'il faut retenir</b> : « dans le cloud » = « sur l'ordinateur de quelqu'un d'autre ». Il faut donc lire <b>qui</b> héberge, <b>où</b> (droit du pays), et <b>quelles conditions</b> d'utilisation.</div>\n\n<h3>4. Les métadonnées : les données sur les données</h3>\n<ul>\n<li>Une photo contient l'image, mais aussi <b>quand</b>, <b>où</b> (GPS), avec <b>quel appareil</b> — ce sont les <b>métadonnées</b> ;</li>\n<li>Elles sont utiles (trier par date) mais <b>révèlent</b> beaucoup (déplacements, habitudes) ;</li>\n<li>Ex. : un fichier envoyé révèle parfois plus que ce que l'on croit (auteur, horodatage).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — choisir un emplacement de sauvegarde</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un dossier de travail doit être disponible sur téléphone, ordinateur et partagé avec un camarade. Cloud ou clé USB ?</div><div class=\"etu\"><b>Étape 1 — Lister les besoins</b> : 3 accès, 2 appareils, 1 partage, synchronisation fréquente.</div><div class=\"etu\"><b>Étape 2 — Comparer</b> : clé USB = une seule copie physique, à transporter, perte facile ; cloud = copies synchronisées, partage par lien.</div><div class=\"etu\"><b>Étape 3 — Décider</b> : le <b>cloud</b> répond mieux ici (synchronisation et partage).</div><div class=\"etu\"><b>Étape 4 — Condition</b> : régler les <b>droits de partage</b> (lecture seule ? édition ?) — la donnée partagée reste sous contrôle si les permissions sont justes.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le cloud est un nuage immatériel » : ce sont des <b>serveurs physiques</b>, quelque part, consommant de l'énergie.</li>\n<li>« Une sauvegarde suffit » : règle <b>3-2-1</b> (3 copies, 2 supports, 1 hors site) pour les fichiers importants.</li>\n<li>« Renommer .jpg en .pdf convertit l'image » : l'extension ne change <b>pas</b> le contenu.</li>\n<li>« Supprimé = disparu » : sur le cloud, des copies et sauvegardes peuvent <b>persister</b> ; sur un disque, la suppression est rarement immédiate.</li>\n<li>« Les métadonnées, c'est du détail » : elles tracent <b>horaires et positions</b> — à nettoyer avant un envoi sensible.</li>\n</ul>\n</div>"
 },
 {

  "theme": "Algorithmes et programmation (3e)",
  "niveau": "3e",
  "titre": "Algorithmes et programmation",
  "cours": "<div class=\"cours-head\"><h2>Algorithmes et programmation</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce qu'un algorithme ?</h3>\n<ul>\n<li>Un <b>algorithme</b> = une suite d'instructions <b>précises et ordonnées</b> pour résoudre un problème ;</li>\n<li>Comme une recette de cuisine : ingrédients (données d'entrée), étapes, résultat ;</li>\n<li>Il doit être <b>non ambigu</b> : chaque étape s'exécute sans hésitation possible.</li>\n</ul>\n<div class=\"tip\"><b>Tester partout</b> : une recette qui réussit une fois peut échouer avec d'autres ingrédients. Un algorithme doit marcher pour <b>tous</b> les cas prévus — d'où l'importance des tests.</div>\n\n<h3>2. Les briques de base</h3>\n<table>\n<tr><th>Brique</th><th>Rôle</th><th>Exemple</th></tr>\n<tr><td><b>Séquence</b></td><td>instructions l'une après l'autre</td><td>avancer, tourner</td></tr>\n<tr><td><b>Condition</b> (si... sinon)</td><td>choisir selon une situation</td><td>si feu rouge : stop</td></tr>\n<tr><td><b>Boucle</b> (répéter)</td><td>répéter des instructions</td><td>10 pas, puis s'arrêter</td></tr>\n<tr><td><b>Variable</b></td><td>retenir une valeur</td><td>score = score + 1</td></tr>\n</table>\n\n<h3>3. Un premier langage : Scratch (ou Python)</h3>\n<ul>\n<li><b>Scratch</b> : blocs colorés à assembler — parfait pour visualiser séquences, conditions, boucles ;</li>\n<li><b>Python</b> : le même raisonnement, en texte ;</li>\n<li>Dans les deux : on <b>conçoit</b> (algorithme), puis on <b>traduit</b> (programme), puis on <b>teste</b>.</li>\n</ul>\n<div class=\"formule\">Problème → algorithme (en français, étapes) → programme (Scratch/Python) → tests → corrections</div>\n\n<h3>4. Débuguer : l'art de corriger</h3>\n<ul>\n<li>Un <b>bug</b> = une erreur dans le programme ;</li>\n<li>Méthode : exécuter <b>pas à pas</b>, vérifier les variables, tester un <b>cas simple</b> puis un cas limite ;</li>\n<li>Le bug n'est pas un échec : c'est l'état <b>normal</b> de la programmation — ce qui compte, c'est la démarche de correction.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — écrire un algorithme de tri de sac</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écrire l'algorithme : « ranger les cahiers du plus grand au plus petit ».</div><div class=\"etu\"><b>Étape 1 — Entrées/sorties</b> : entrée = pile en désordre ; sortie = pile triée.</div><div class=\"etu\"><b>Étape 2 — Idée</b> : prendre le plus grand restant et le poser sur la pile résultat.</div><div class=\"etu\"><b>Étape 3 — Écrire avec une boucle</b> : TANT QUE la pile n'est pas vide : chercher le plus grand ; l'ajouter au résultat ; le retirer de la pile.</div><div class=\"etu\"><b>Étape 4 — Vérifier les limites</b> : pile vide au départ ? un seul cahier ? deux cahiers de même taille ? L'algorithme tient : il s'arrête (pile vide) et gère les égalités.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Un algorithme = un programme » : l'algorithme est la <b>méthode</b> ; le programme en est la <b>traduction</b> dans un langage.</li>\n<li>« Ça marche une fois, donc c'est bon » : il faut tester les <b>cas limites</b> (zéro, un élément, valeurs égales).</li>\n<li>« La boucle s'arrête toute seule » : sans condition de sortie correcte, elle tourne <b>indéfiniment</b> (boucle infinie).</li>\n<li>« = signifie égalité mathématique » : en programmation, <b>=</b> affecte une valeur ; == compare.</li>\n<li>« Le bug vient de la machine » : dans 99 % des cas, il vient de <b>l'instruction mal formulée</b> par l'humain.</li>\n</ul>\n</div>"
 },
 {
  "id": "impacts-numeriques",
  "theme": "Les impacts du numérique (3e)",
  "niveau": "3e",
  "titre": "Les impacts du numérique",
  "cours": "<div class=\"cours-head\"><h2>Les impacts du numérique</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les apports du numérique</h3>\n<ul>\n<li>Accès <b>démocratisé</b> au savoir (cours en ligne, Wikipédia, tutos) ;</li>\n<li>Communication instantanée dans le monde (visio, messagerie) ;</li>\n<li>Santé (télémédecine, imagerie), science (simulation), culture (musique, livres) ;</li>\n<li>Nouveaux métiers et services (développeurs, graphistes, data analysts).</li>\n</ul>\n\n<h3>2. Les limites : environnement</h3>\n<ul>\n<li>Fabrication : métaux <b>rares</b> (lithium, cobalt, terres rares), eau, énergie ;</li>\n<li>Usage : data centers et réseaux consomment de l'<b>électricité</b> (streaming vidéo = poste lourd) ;</li>\n<li>Fin de vie : <b>déchets électroniques</b> (e-déchets) souvent exportés et mal recyclés.</li>\n</ul>\n<div class=\"warn\"><b>Chiffre-clé</b> : fabriquer un smartphone représente environ <b>80 %</b> de son empreinte carbone totale — garder son téléphone plus longtemps est le geste le plus efficace.</div>\n\n<h3>3. Les limites : santé et social</h3>\n<table>\n<tr><th>Risque</th><th>Manifestation</th><th>Piste d'action</th></tr>\n<tr><td><b>Sédentarité</b>, sommeil</td><td>écrans tardifs, fatigue</td><td>règles d'usage, nuit sans écran</td></tr>\n<tr><td><b>Addiction</b> à l'attention</td><td>notifications, scroll infini</td><td>couper les notifs, temps d'écran</td></tr>\n<tr><td><b>Cyberharcèlement</b></td><td>moqueries, exclusion en ligne</td><td>capturer, bloquer, en parler à un adulte</td></tr>\n<tr><td><b>Désinformation</b></td><td>fausses nouvelles, images truquées</td><td>vérifier la source, croiser l'info</td></tr>\n</table>\n\n<h3>4. Numérique et citoyenneté : droits et devoirs</h3>\n<ul>\n<li><b>Données personnelles</b> : le RGPD encadre leur collecte — on a des droits (accès, suppression) ;</li>\n<li>Sur Internet, la loi s'applique comme ailleurs : injure, diffamation, piratage sont des <b>délits</b> ;</li>\n<li>Identité numérique : ce qu'on publie laisse des <b>traces durables</b> (employeurs, assureurs... y auront accès) ;</li>\n<li>Éthique : s'exprimer sans nuire, créditer les auteurs (droits d'auteur), respecter les autres.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — vérifier une info virale</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une publication annonce : « Une école ferme pendant 6 mois pour travaux, tous les élèves en distanciel ». Comment réagir ?</div><div class=\"etu\"><b>Étape 1 — Chercher la source primaire</b> : la presse locale ? le site de l'établissement ? un compte officiel ? Sinon : rumeur possible.</div><div class=\"etu\"><b>Étape 2 — Croiser</b> : deux sources <b>indépendantes et fiables</b> confirment-elles ?</div><div class=\"etu\"><b>Étape 3 — Repérer les signaux</b> : titre en majuscules, urgence émotionnelle, absence d'auteur — classiques de la désinformation.</div><div class=\"etu\"><b>Étape 4 — Agir</b> : ne pas relayer ; partager la version confirmée quand elle existe. Un internaute <b>responsable</b> ne relaie que ce qu'il a vérifié.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le numérique est dématérialisé donc propre » : serveurs, métaux, e-déchets — l'empreinte est <b>matérielle</b>.</li>\n<li>« Mes données n'intéressent personne » : elles ont une <b>valeur</b> (ciblage publicitaire, revente) et le RGPD les protège.</li>\n<li>« Sur Internet, on est anonyme » : pseudos et IP laissent des traces ; la loi s'applique.</li>\n<li>« Si c'est publié, c'est vrai » : la viralité n'est <b>pas</b> une preuve — c'est parfois l'inverse.</li>\n<li>« Supprimer un message efface tout » : captures et réactions déjà partagées <b>persister</b>.</li>\n</ul>\n</div>"
 },

  "id": "internet-web",

  "niveau": "2de",
  "titre": "Internet et le Web",
  "cours": "<div class=\"cours-head\"><h2>Internet et le Web</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Internet : l'infrastructure</h3>\n<ul>\n<li>Réseau de réseaux : des millions de machines interconnectées (câbles, fibres sous-marines, wifi, 4G/5G) ;</li>\n<li>Chaque machine est identifiée par une <b>adresse IP</b> (IPv4 : 4 nombres ; IPv6 : plus longue, pour pallier la pénurie) ;</li>\n<li>Le <b>DNS</b> fait le lien entre un nom lisible (exemple.fr) et l'adresse IP : l'annuaire du réseau.</li>\n</ul>\n\n<h3>2. Le Web : un service sur Internet</h3>\n<ul>\n<li>Le Web = l'ensemble des <b>pages</b> reliées par des <b>liens hypertextes</b>, consultées via un navigateur ;</li>\n<li>Modèle <b>client/serveur</b> : mon navigateur (client) demande, le serveur répond ;</li>\n<li>URL : <b>protocole</b> (https) + <b>domaine</b> (serveur) + <b>chemin</b> (page demandée).</li>\n</ul>\n<div class=\"tip\"><b>Hiérarchie à retenir</b> : Internet (réseau) &gt; services (Web, mail, visio, jeux) &gt; le Web (pages et liens). Un site web n'est qu'un service parmi d'autres.</div>\n\n<h3>3. HTML : le squelette des pages</h3>\n<ul>\n<li><b>HTML</b> = langage de <b>structure</b> : titres (&lt;h1&gt;), paragraphes (&lt;p&gt;), liens (&lt;a href&gt;), images (&lt;img&gt;) ;</li>\n<li><b>CSS</b> = langage de <b>style</b> : couleurs, tailles, mise en page (le HTML dit « quoi », le CSS dit « comment ça se présente ») ;</li>\n<li>Le navigateur <b>lit</b> ces fichiers et construit la page affichée (rendu).</li>\n</ul>\n<div class=\"formule\">Une page web = fichier HTML (structure) + fichier CSS (apparence) + fichiers (images, scripts) — tout téléchargé depuis le serveur.</div>\n\n<h3>4. Moteurs de recherche et indexation</h3>\n<ul>\n<li>Un moteur de recherche ne cherche pas « en direct » : il interroge un <b>index</b> (copie géante du web, construite par des robots d'exploration) ;</li>\n<li>Le <b>référencement</b> détermine la position d'une page dans les résultats (pertinence, popularité, etc.) ;</li>\n<li>Résultats sponsorisés ≠ résultats naturels : apprendre à les distinguer.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — suivre une requête web pas à pas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire le trajet complet quand on tape www.exemple.fr dans un navigateur.</div><div class=\"etu\"><b>Étape 1 — Résolution DNS</b> : le navigateur demande l'adresse IP correspondant au nom (annuaire DNS).</div><div class=\"etu\"><b>Étape 2 — Requête</b> : il envoie une requête HTTP(S) vers cette IP, à travers Internet (paquets, routeurs).</div><div class=\"etu\"><b>Étape 3 — Réponse</b> : le serveur renvoie les fichiers (HTML, CSS, images).</div><div class=\"etu\"><b>Étape 4 — Rendu</b> : le navigateur assemble et affiche la page. Si le serveur ne répond pas : erreur (404 = page introuvable, 500 = erreur serveur).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Chercher sur Internet » : on cherche dans l'<b>index d'un moteur</b>, pas sur Internet entier.</li>\n<li>« Le HTML fait la mise en page » : c'est le <b>CSS</b> ; le HTML structure.</li>\n<li>« Un site est hébergé chez moi » : les fichiers sont sur un <b>serveur</b>, joignable par son IP.</li>\n<li>« Le DNS stocke les pages » : il ne stocke que la correspondance <b>nom ↔ IP</b>.</li>\n<li>« Premier résultat = meilleur » : c'est le mieux <b>référencé</b> — parfois un lien sponsorisé.</li>\n</ul>\n</div>"
 },

  "niveau": "2de",
  "titre": "Les réseaux sociaux",
  "cours": "<div class=\"cours-head\"><h2>Les réseaux sociaux</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce qu'un réseau social ?</h3>\n<ul>\n<li>Une plateforme qui met en relation des <b>utilisateurs</b> pour créer et partager du <b>contenu</b> ;</li>\n<li>Deux facettes : le réseau <b>social</b> (amis, abonnés) et le réseau <b>de contenus</b> (flux, recommandations) ;</li>\n<li>Modèle économique quasi systématique : <b>gratuit pour l'utilisateur</b>, financé par la <b>publicité ciblée</b> sur ses données.</li>\n</ul>\n<div class=\"warn\"><b>Règle d'or</b> : « Si c'est gratuit, c'est vous le produit » — l'attention et les données de l'utilisateur sont la monnaie.</div>\n\n<h3>2. Le secret des flux : l'algorithme de recommandation</h3>\n<ul>\n<li>Le fil n'affiche pas « tout, dans l'ordre » : un <b>algorithme</b> sélectionne selon ce qui retient l'attention (likes, temps de lecture, interactions) ;</li>\n<li>Conséquence : on reçoit du contenu <b>adapté à nos goûts</b> — bulle de filtre, enfermement ;</li>\n<li>Contenus émotionnels et clivants sont favorisés : ils génèrent le plus de réactions.</li>\n</ul>\n\n<h3>3. Données personnelles et vie privée</h3>\n<table>\n<tr><th>Ce que je laisse</th><th>Ce que la plateforme en fait</th></tr>\n<tr><td>profil, likes, commentaires</td><td>construction d'un profil (goûts, opinions)</td></tr>\n<tr><td>localisation, horaires de connexion</td><td>habitudes, déplacements</td></tr>\n<tr><td>contacts, appareils</td><td>carte du réseau social réel</td></tr>\n</table>\n<ul>\n<li>Ce profil permet le <b>ciblage publicitaire</b> — parfois au-delà de ce qu'on imagine (inference de données sensibles) ;</li>\n<li><b>RGPD</b> : consentement, droit d'accès, de rectification, d'effacement (dans l'UE).</li>\n</ul>\n\n<h3>4. Usages : opportunités et risques</h3>\n<ul>\n<li><b>Positif</b> : lien social, créativité, information rapide, mobilisation (associations) ;</li>\n<li><b>Risques</b> : cyberharcèlement, comparaison sociale et estime de soi, désinformation, addiction (design de l'engagement) ;</li>\n<li>Réflexes : régler la visibilité en <b>privé</b>, penser avant de publier, vérifier avant de partager, signaler et <b>parler</b> en cas de harcèlement.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — comprendre sa bulle de filtre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux amis regardent le même sujet sur la même plateforme et voient des vidéos opposées. Pourquoi ?</div><div class=\"etu\"><b>Étape 1 — Identifier la cause</b> : chaque flux est <b>individualisé</b> par l'algorithme de recommandation.</div><div class=\"etu\"><b>Étape 2 — Expliquer le mécanisme</b> : les interactions passées de chacun (likes, visionnages) entraînent des prédictions différentes de « ce qui va retenir ».</div><div class=\"etu\"><b>Étape 3 — Conséquence</b> : chacun voit un monde renforcé par ses choix — c'est la <b>bulle de filtre</b> : s'exposer à des points de vue variés devient un effort volontaire.</div><div class=\"etu\"><b>Étape 4 — Agir</b> : suivre volontairement des sources diverses, nettoyer ses goûts, utiliser les outils « chronologique » quand ils existent — reprendre la main sur son flux.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le fil affiche tout le monde pareil » : chaque flux est <b>personnalisé</b>.</li>\n<li>« L'algorithme est neutre » : il optimise l'<b>engagement</b>, pas l'équilibre des points de vue.</li>\n<li>« Supprimer l'app supprime mes données » : le compte (et le profil) persistent côté serveur ; il faut <b>supprimer le compte</b>.</li>\n<li>« Mes stories disparaissent » : copies, captures et sauvegardes possibles.</li>\n<li>« Je n'ai rien à cacher » : le profil sert aussi à des <b>décisions</b> (assurances, employeurs, prix personnalisés).</li>\n</ul>\n</div>"
 },
 {
  "id": "donnees-traitees",
  "theme": "Les données structurées et leur traitement (2de)",
  "niveau": "2de",
  "titre": "Les données structurées et leur traitement",
  "cours": "<div class=\"cours-head\"><h2>Les données structurées et leur traitement</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Données structurées : tables et attributs</h3>\n<ul>\n<li>Une donnée <b>structurée</b> est rangée dans un <b>table</b> : lignes (enregistrements) et colonnes (attributs) ;</li>\n<li>Chaque colonne a un <b>type</b> : nombre, texte, date, booléen ;</li>\n<li>Formats courants : tableur (.csv, .xlsx), bases de données.</li>\n</ul>\n<table>\n<tr><th>nom</th><th>age</th><th>ville</th></tr>\n<tr><td>Alice</td><td>15</td><td>Paris</td></tr>\n<tr><td>Bruno</td><td>16</td><td>Lyon</td></tr>\n</table>\n<div class=\"tip\"><b>Métadonnées</b> : les informations <b>sur</b> la table (titre des colonnes, unités, source, date). Elles rendent la table interprétable — sans elles, des nombres ne veulent rien dire.</div>\n\n<h3>2. Nettoyer les données avant d'analyser</h3>\n<ul>\n<li>Valeurs <b>manquantes</b>, <b>fautes</b>, <b>doublons</b>, formats incohérents (15 ans vs « quinze ») ;</li>\n<li>Le traitement commence toujours par un <b>nettoyage</b> : sinon, les résultats sont faux (« garbage in, garbage out »).</li>\n</ul>\n\n<h3>3. Traiter : trier, filtrer, calculer</h3>\n<table>\n<tr><th>Opération</th><th>Question typique</th></tr>\n<tr><td><b>Trier</b></td><td>qui a le score le plus élevé ?</td></tr>\n<tr><td><b>Filtrer</b></td><td>uniquement les lignes vérifiant une condition (âge &lt; 16)</td></tr>\n<tr><td><b>Calculer</b></td><td>moyenne, somme, minimum, maximum, comptage</td></tr>\n<tr><td><b>Regrouper</b></td><td>combien par catégorie (par ville, par classe) ?</td></tr>\n</table>\n\n<h3>4. Interpréter : du résultat au sens</h3>\n<ul>\n<li>Un résultat n'est pas une conclusion : il faut le <b>replacer dans son contexte</b> (échantillon, date, biais de collecte) ;</li>\n<li>Corrélation ≠ causalité : deux colonnes qui montent ensemble ne prouvent pas que l'une cause l'autre ;</li>\n<li>Toujours citer la <b>source</b> et la <b>méthode</b> quand on présente un résultat.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser une table de notes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une table note : nom, note (0-20), matière. Question : « Quelle matière a la meilleure moyenne ? »</div><div class=\"etu\"><b>Étape 1 — Vérifier la table</b> : notes manquantes ? hors 0-20 ? doublons ? Nettoyer d'abord.</div><div class=\"etu\"><b>Étape 2 — Regrouper</b> : rassembler les lignes par <b>matière</b>.</div><div class=\"etu\"><b>Étape 3 — Calculer</b> : pour chaque groupe, la <b>moyenne</b> (somme ÷ nombre de notes).</div><div class=\"etu\"><b>Étape 4 — Interpréter prudemment</b> : si une matière n'a que 2 notes, sa « meilleure moyenne » est fragile — la taille de l'échantillon compte autant que le nombre.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Une moyenne résume tout » : elle cache la <b>dispersion</b> (notes très différentes peuvent avoir la même moyenne).</li>\n<li>« Corrélation = cause » : voir les deux évoluer ensemble ne prouve <b>rien</b> de causal.</li>\n<li>« Les données sont neutres » : elles ont été <b>collectées</b> par quelqu'un, avec des choix (que mesurer ? qui ?).</li>\n<li>« Le tableur calcule donc c'est juste » : si la formule est fausse ou les données sales, le résultat est faux <b>avec précision</b>.</li>\n<li>« Le tri change les données » : trier réordonne, il ne modifie <b>pas</b> les valeurs.</li>\n</ul>\n</div>"
 },

  "id": "localisation-cartographie",
  "theme": "Localisation, cartographie et mobilité (2de)",
  "niveau": "2de",
  "titre": "Localisation, cartographie et mobilité",
  "cours": "<div class=\"cours-head\"><h2>Localisation, cartographie et mobilité</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Se localiser : le GPS</h3>\n<ul>\n<li><b>GPS</b> : constellation de satellites ; le récepteur capte les signaux horodatés de plusieurs satellites ;</li>\n<li>À partir des <b>délais</b> de réception, il calcule sa position (latitude, longitude, altitude) — par <b>trilatération</b> ;</li>\n<li>Il faut au moins <b>4 satellites</b> pour une position précise (3 pour la position, 1 pour l'heure).</li>\n</ul>\n<div class=\"tip\"><b>Signal → position</b> : le satellite envoie l'heure d'émission ; le délai donne la distance ; trois distances croisent la position. La précision dépend de la géométrie des satellites visibles (et des obstacles : murs, tunnels).</div>\n\n<h3>2. Cartographier : du monde à la carte</h3>\n<ul>\n<li>Une carte = une <b>représentation réduite</b> et <b>codée</b> : projection (sphère → plan, toujours des déformations), échelle, légende ;</li>\n<li>Cartes numériques : données vectorielles (routes, points) ou images (satellite) superposées en <b>couches</b> ;</li>\n<li>Chaque objet a des <b>coordonnées</b> (lat/long) et des <b>attributs</b> (nom, type).</li>\n</ul>\n\n<h3>3. Calculer un itinéraire : le graphe</h3>\n<ul>\n<li>Le réseau routier est modélisé par un <b>graphe</b> : intersections (nœuds) et routes (arêtes), pondérées par distance, temps ou coût ;</li>\n<li>Un algorithme (ex. <b>Dijkstra</b>, A*) cherche le « plus court chemin » selon le critère choisi ;</li>\n<li>Le calcul dépend du <b>choix de pondération</b> : plus rapide ≠ plus court ≠ moins pollué.</li>\n</ul>\n<div class=\"formule\">Carte → graphe (nœuds, arêtes, poids) → algorithme de plus court chemin → itinéraire affiché</div>\n\n<h3>4. Mobilité : services et questions</h3>\n<ul>\n<li>Services : navigation temps réel (trafic), transports en commun, vélos partagés, covoiturage ;</li>\n<li>Conditions : données ouvertes (open data), capteurs, mise à jour continue ;</li>\n<li>Enjeux : <b>traces de localisation</b> (où je vais, quand, avec qui) — données très personnelles ;</li>\n<li>Éco-mobilité : les applications peuvent encourager des choix plus sobres (itinéraire vélo, transport en commun).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — comprendre un itinéraire surprenant</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'application propose un détour par l'autoroute alors que le trajet direct semble plus court. Pourquoi ?</div><div class=\"etu\"><b>Étape 1 — Identifier le critère</b> : par défaut, l'app optimise souvent le <b>temps</b>, pas la distance.</div><div class=\"etu\"><b>Étape 2 — Relire le graphe</b> : l'autoroute a des arêtes de <b>faible poids</b> en temps (vitesse élevée) ; la route directe a un poids temps plus grand.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : le « plus court chemin » dépend du <b>poids choisi</b> (temps, distance, coût, CO₂) — changer le critère change l'itinéraire.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : un même algorithme donne des réponses différentes selon la modélisation — le modèle compte autant que le calcul.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le GPS fait tout seul » : il reçoit des <b>signaux</b> ; c'est le récepteur qui <b>calcule</b> sa position.</li>\n<li>« La carte est la réalité » : c'est une <b>projection déformante</b> + des choix de représentation.</li>\n<li>« Le plus court chemin est unique » : il dépend du <b>critère</b> (distance, temps, coût).</li>\n<li>« Ma localisation ne regarde que moi » : les traces révèlent domicile, travail, <b>habitudes</b> — données sensibles.</li>\n<li>« Sans réseau, pas de GPS » : la position marche <b>sans Internet</b> (satellites) ; c'est la carte en ligne qui nécessite le réseau.</li>\n</ul>\n</div>"
 },

  "id": "objets-connectes",
  "theme": "Informatique embarquée et objets connectés (2de)",
  "niveau": "2de",
  "titre": "Informatique embarquée et objets connectés",
  "cours": "<div class=\"cours-head\"><h2>Informatique embarquée et objets connectés</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Informatique embarquée : un ordinateur dans l'objet</h3>\n<ul>\n<li>Un système <b>embarqué</b> = calculateur intégré dans un appareil (voiture, machine à laver, montre) ;</li>\n<li>Contrairement à un ordinateur, il a une <b>tâche dédiée</b>, des ressources limitées, et tourne souvent en <b>temps réel</b> ;</li>\n<li>Composition : <b>capteurs</b> (entrées) → microcontrôleur (traitement) → <b>actionneurs</b> (sorties).</li>\n</ul>\n<div class=\"formule\">Capteurs (mesurer) → traitement (programme embarqué) → actionneurs (agir) → retour des capteurs : une boucle</div>\n\n<h3>2. L'objet connecté : l'embarqué + le réseau</h3>\n<ul>\n<li>Un objet connecté = système embarqué + <b>communication</b> (wifi, Bluetooth, réseau mobile) ;</li>\n<li>Il <b>envoie</b> ses données (mesures) et <b>reçoit</b> des commandes (allumer, régler) ;</li>\n<li>Exemples : montre connectée, enceinte vocale, thermostat, balance, voiture connectée, carte de transport.</li>\n</ul>\n\n<h3>3. Capteurs et données</h3>\n<table>\n<tr><th>Capteur</th><th>Grande mesurée</th><th>Exemple d'usage</th></tr>\n<tr><td>thermique</td><td>température</td><td>thermostat</td></tr>\n<tr><td>accéléromètre</td><td>mouvement, secousses</td><td>podomètre, airbag</td></tr>\n<tr><td>GPS</td><td>position</td><td>montre, voiture</td></tr>\n<tr><td>optique</td><td>lumière, image</td><td>caméra, compteur</td></tr>\n<tr><td>micro</td><td>son</td><td>enceinte vocale</td></tr>\n</table>\n<div class=\"tip\"><b>Capteur ≠ donnée exploitable</b> : la mesure brute doit être <b>calibrée, filtrée, interprétée</b> par le programme — un capteur déréglé produit de fausses données.</div>\n\n<h3>4. Enjeux : confort, sécurité, vie privée</h3>\n<ul>\n<li><b>Confort</b> : domotique, santé (télé-suivi), optimisation énergétique ;</li>\n<li><b>Sécurité</b> : un objet connecté peut être <b>piraté</b> (caméras, voitures) — mots de passe par défaut à changer, mises à jour ;</li>\n<li><b>Vie privée</b> : un micro, une caméra ou une localisation permanente écoutent/voient en continu — dans la chambre, c'est un choix à mesurer ;</li>\n<li><b>Environnement</b> : objets énergivores (batteries, serveurs), obsolescence.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser une balance connectée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une balance connectée mesure le poids et l'envoie sur une application, qui conseille. Décrire la chaîne et ses enjeux.</div><div class=\"etu\"><b>Étape 1 — La chaîne</b> : capteur de force → microcontrôleur (conversion, calcul du poids) → module wifi → application (stockage, graphiques, conseils).</div><div class=\"etu\"><b>Étape 2 — Les traitements</b> : l'app calcule des <b>tendances</b> et des <b>règles</b> (conseils) : de simples programmes appliqués à vos données.</div><div class=\"etu\"><b>Étape 3 — Les enjeux</b> : données de <b>santé</b> (sensibles !) hébergées chez un tiers ; sécurité du compte ; dépendance psychologique possible aux chiffres.</div><div class=\"etu\"><b>Étape 4 — Conclusion</b> : pour chaque objet connecté, suivre la chaîne <b>capteur → réseau → serveur → application</b> et se demander : qui voit mes données, et qu'est-ce que ça dit de moi ?</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Un objet connecté, c'est juste un gadget » : c'est un <b>ordinateur</b> complet, avec ses failles.</li>\n<li>« L'objet est passif, il ne fait qu'envoyer » : il <b>reçoit</b> aussi des commandes — un canal dans les deux sens est un canal d'attaque dans les deux sens.</li>\n<li>« Mes données de santé restent chez moi » : elles partent vers les <b>serveurs</b> de l'éditeur (et parfois vers des tiers).</li>\n<li>« Le micro n'écoute que si je parle » : selon l'objet, il peut traiter le son <b>en permanence</b> (mot d'activation).</li>\n<li>« Pas de mise à jour, pas grave » : les objets non mis à jour sont la cible <b>privilégiée</b> des piratages.</li>\n</ul>\n</div>"
 },
 {
  "id": "photo-numerique",
  "theme": "La photographie numérique (2de)",
  "niveau": "2de",
  "titre": "La photographie numérique",
  "cours": "<div class=\"cours-head\"><h2>La photographie numérique</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. De la lumière au pixel</h3>\n<ul>\n<li>La lumière passe par l'objectif et frappe le <b>capteur</b> : une grille de photosites ;</li>\n<li>Chaque photosite mesure l'intensité lumineuse puis, grâce à la <b>matrice de filtres</b>, une couleur (rouge, vert ou bleu) ;</li>\n<li>L'image obtenue = une grille de <b>pixels</b>, chacun codé par 3 nombres (R, V, B) de 0 à 255.</li>\n</ul>\n<div class=\"formule\">Image numérique = grille de pixels ; pixel = (R, V, B) ; valeurs 0-255 → 256³ ≈ 16,7 millions de couleurs possibles par pixel</div>\n\n<h3>2. Traitement de l'image : des pixels aux effets</h3>\n<table>\n<tr><th>Traitement</th><th>Effet</th><th>Principe</th></tr>\n<tr><td><b>Luminosité</b></td><td>éclaircir / assombrir</td><td>ajouter/retrancher la même valeur à tous les pixels</td></tr>\n<tr><td><b>Noir et blanc</b></td><td>nuances de gris</td><td>remplacer R=V=B par la moyenne des 3</td></tr>\n<tr><td><b>Contraste</b></td><td>accuser les écarts</td><td>écarter les valeurs de la moyenne</td></tr>\n<tr><td><b>Miroir</b></td><td>retournement</td><td>réordonner les colonnes de pixels</td></tr>\n<tr><td><b>Rogner / redimensionner</b></td><td>recadrer</td><td>supprimer ou recalculer des pixels</td></tr>\n</table>\n<div class=\"tip\"><b>Tout traitement = un calcul sur les valeurs des pixels</b> : impossible de faire un effet « magique » ; seulement des opérations sur les nombres R, V, B.</div>\n\n<h3>3. Métadonnées : ce que la photo raconte d'elle-même</h3>\n<ul>\n<li>Format d'échange (EXIF) : <b>date, heure, appareil, réglages, parfois GPS</b> ;</li>\n<li>Utile (classer par lieu) mais <b>révélateur</b> : envoyer une photo, c'est souvent envoyer <b>où et quand</b> elle fut prise ;</li>\n<li>Les réseaux la retirent généralement — mais pas toujours : vérifier avant un envoi sensible.</li>\n</ul>\n\n<h3>4. Retouche, filtres et authenticité</h3>\n<ul>\n<li>Retouche légère (luminosité) ≠ manipulation (retirer/ajouter des éléments, assembler des images) ;</li>\n<li>Filtres et « beautification » automatiques : modification <b>systématique</b> du visage — effet sur l'image de soi ;</li>\n<li>Photos truquées et <b>deepfakes</b> : apprendre à repérer les signaux (lumière incohérente, bords, sources) et à vérifier l'origine ;</li>\n<li>Règle éthique : une image modifiée doit être signalée comme telle.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — coder un noir et blanc</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un pixel a pour valeurs (R=100, V=180, B=60). Quelle est sa valeur en niveaux de gris ?</div><div class=\"etu\"><b>Étape 1 — Choisir la méthode</b> : gris = moyenne des 3 composantes.</div><div class=\"etu\"><b>Étape 2 — Calculer</b> : (100 + 180 + 60) ÷ 3 = 340 ÷ 3 ≈ 113.</div><div class=\"etu\"><b>Étape 3 — Appliquer</b> : le pixel devient (113, 113, 113) — autant de rouge, de vert, de bleu = une teinte grise.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : appliquer à <b>tous</b> les pixels de l'image, dans une double boucle (lignes × colonnes) : c'est exactement ce que fait un logiciel, des millions de fois.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Une photo numérique est la réalité » : c'est une <b>interprétation codée</b> (réglages, traitements automatiques de l'appareil).</li>\n<li>« Le pixel est un point coloré physique » : c'est une <b>valeur</b> dans un tableau ; l'écran l'affiche.</li>\n<li>« Une photo envoyée ne montre que l'image » : les <b>métadonnées</b> voyagent souvent avec.</li>\n<li>« Plus de pixels = plus belle image » : la qualité dépend aussi de l'optique, de la lumière, du capteur.</li>\n<li>« Retoucher est malhonnête par nature » : tout le monde retouche (même l'appareil) ; la malhonnêteté commence quand la modification <b>trompe</b> sans être signalée.</li>\n</ul>\n</div>"
 },

  "theme": "Histoire et architecture des ordinateurs (1re)",
  "niveau": "1re",
  "titre": "Histoire et architecture des ordinateurs",
  "cours": "<div class=\"cours-head\"><h2>Histoire et architecture des ordinateurs</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Repères historiques</h3>\n<table>\n<tr><th>Époque</th><th>Événement</th><th>Idée-clé</th></tr>\n<tr><td>1837</td><td>Machine analytique de <b>Babbage</b> (Ada Lovelace : premier programme)</td><td>machine à calculer programmable</td></tr>\n<tr><td>1936</td><td>Machine de <b>Turing</b></td><td>modèle universel de calcul</td></tr>\n<tr><td>1945</td><td><b>ENIAC</b> ; von Neumann publie son architecture</td><td>programme enregistré en mémoire</td></tr>\n<tr><td>1947</td><td>Transistor (Bell Labs)</td><td>remplace les lampes : miniaturisation</td></tr>\n<tr><td>1965</td><td><b>Loi de Moore</b></td><td>densité des transistors double ≈ tous les 2 ans</td></tr>\n<tr><td>1971</td><td>Premier microprocesseur (Intel 4004)</td><td>ordinateur sur une puce</td></tr>\n<tr><td>1990s-</td><td>Web, smartphones, cloud, IA</td><td>réseau + données massives</td></tr>\n</table>\n<div class=\"tip\"><b>Ada Lovelace</b> a écrit le premier algorithme pour une machine qui n'existait pas encore : l'idée précède la machine. <b>Turing</b> a défini ce qu'est « calculable » avant les ordinateurs modernes.</div>\n\n<h3>2. L'architecture de von Neumann</h3>\n<ul>\n<li>Idée fondatrice : <b>programme et données dans la même mémoire</b> — l'ordinateur devient universel ;</li>\n<li>4 composants : <b>unité de commande</b> (pilote), <b>unité arithmétique et logique</b> (calcule), <b>mémoire</b> (programme + données), <b>entrées/sorties</b> ;</li>\n<li>Cycle : <b>fetch</b> (chercher l'instruction) → <b>decode</b> (décoder) → <b>execute</b> (exécuter) — répété des milliards de fois par seconde.</li>\n</ul>\n<div class=\"formule\">CPU = unité de commande + UAL + registres ; bus = autoroutes entre CPU, mémoire et périphériques</div>\n\n<h3>3. Du transistor au circuit intégré</h3>\n<ul>\n<li>Le <b>transistor</b> = interrupteur électronique (0/1) : la brique élémentaire ;</li>\n<li><b>Circuits intégrés</b> : des milliards de transistors gravés sur une puce (photolithographie) ;</li>\n<li>Conséquence de la miniaturisation : vitesse accrue, coût baissé, mais dissipation thermique et limites physiques (la loi de Moore plafonne).</li>\n</ul>\n\n<h3>4. Lois et limites</h3>\n<ul>\n<li><b>Loi de Moore</b> : tend à s'essouffler (limites quantiques, chaleur) ;</li>\n<li>Parallélisme : multiplier les cœurs plutôt qu'augmenter la fréquence ;</li>\n<li>Conclusion d'histoire : chaque bond technique vient d'une <b>idée</b> (programme enregistré, transistor) autant que d'une prouesse matérielle.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — comparer deux machines</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi l'ENIAC (1945, 30 tonnes) était-il moins puissant qu'une carte bancaire actuelle ?</div><div class=\"etu\"><b>Étape 1 — Technologie</b> : ENIAC = lampes (lentes, chaudes, fragiles) ; carte à puce = transistors gravés en nanomètres.</div><div class=\"etu\"><b>Étape 2 — Architecture</b> : l'ENIAC se « reprogrammait » par câbles ; la carte suit von Neumann (programme en mémoire) : reprogrammation instantanée.</div><div class=\"etu\"><b>Étape 3 — Ordres de grandeur</b> : facteur ≈ 10⁶ sur la fréquence, ≈ 10⁹ sur le nombre d'éléments de commutation — plus de 15 ordres de grandeur au total.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : le bond vient du duo <b>idée (architecture) + matériau (transistor)</b> — l'histoire de l'informatique est celle de ces deux moteurs.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le premier ordinateur est ancien et gros, donc rudimentaire » : l'ENIAC calculait des trajectoires — les <b>concepts</b> (von Neumann) restent les nôtres.</li>\n<li>« La loi de Moore est une loi physique » : c'est une <b>observation</b> de tendance, aujourd'hui freinée.</li>\n<li>« L'UAL commande la machine » : c'est l'<b>unité de commande</b> qui pilote ; l'UAL calcule.</li>\n<li>« Le CPU stocke les fichiers » : il travaille avec des <b>registres</b> et la RAM ; le stockage permanent est ailleurs.</li>\n<li>« Un cœur plus rapide = machine toujours plus rapide » : la mémoire et le disque freinent (goulot d'étranglement) — d'où le parallélisme.</li>\n</ul>\n</div>"
 },
 {
  "id": "binaire-donnees",
  "theme": "Représentation binaire des données (1re)",
  "niveau": "1re",
  "titre": "Représentation binaire des données",
  "cours": "<div class=\"cours-head\"><h2>Représentation binaire des données</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le bit : unité de base</h3>\n<ul>\n<li>Un <b>bit</b> = 0 ou 1 (état électrique : absent/présent) ;</li>\n<li>Avec n bits, on code <b>2<sup>n</sup></b> valeurs ; 1 octet = 8 bits = <b>256</b> valeurs (0 à 255) ;</li>\n<li>Toute donnée (texte, image, son, programme) finit en <b>suite de bits</b>.</li>\n</ul>\n\n<h3>2. Les entiers naturels : base 2</h3>\n<ul>\n<li>Poids des positions : 1, 2, 4, 8, 16, 32, 64, 128 (de droite à gauche) ;</li>\n<li>Exemple : <b>1101</b> = 8 + 4 + 0 + 1 = <b>13</b>.</li>\n</ul>\n<table>\n<tr><th>Binaire</th><th>Décimal</th><th>Binaire</th><th>Décimal</th></tr>\n<tr><td>0000</td><td>0</td><td>1000</td><td>8</td></tr>\n<tr><td>0001</td><td>1</td><td>1001</td><td>9</td></tr>\n<tr><td>0010</td><td>2</td><td>1010</td><td>10</td></tr>\n<tr><td>0100</td><td>4</td><td>1101</td><td>13</td></tr>\n<tr><td>0111</td><td>7</td><td>1111</td><td>15</td></tr>\n</table>\n<div class=\"formule\">n bits (non signés) → valeurs de 0 à 2<sup>n</sup> - 1 ; pour un entier relatif, 1 bit sert de <b>signe</b> (ou complément à 2).</div>\n\n<h3>3. Entiers relatifs : l'astuce du complément à 2</h3>\n<ul>\n<li>Le bit de poids fort encode le <b>signe</b> ; sur 8 bits : 0000 0101 = +5, <b>1111 1011 = -5</b> ;</li>\n<li>Avantage : l'addition fonctionne <b>tout seul</b>, signe compris ;</li>\n<li>Limite : sur 8 bits signés, on va de -128 à +127 → tout calcul qui déborde donne un <b>résultat faux</b> (dépassement/overflow).</li>\n</ul>\n<div class=\"warn\"><b>Concrètement</b> : quand un jeu affiche un score « -2 000 000 » au lieu d'un grand nombre, c'est un <b>débordement</b> : la valeur a dépassé la capacité du type.</div>\n\n<h3>4. Texte, image, son : tout est codé</h3>\n<table>\n<tr><th>Donnée</th><th>Codage</th></tr>\n<tr><td><b>Texte</b></td><td>table ASCII (128 caractères, 1 octet) puis Unicode (UTF-8 : accents, émojis, alphabets du monde)</td></tr>\n<tr><td><b>Image</b></td><td>matrice de pixels, chaque pixel = 3 octets (R, V, B) ; format compressé (JPEG, PNG)</td></tr>\n<tr><td><b>Son</b></td><td>échantillonnage : mesures du signal à intervalles réguliers (fréquence en hertz), chaque mesure quantifiée sur n bits</td></tr>\n</table>\n<div class=\"tip\"><b>Chaîne complète</b> : information réelle → codage (norme) → bits → stockage/transmission → décodage. Sans la <b>norme</b> (ASCII, UTF-8...), les bits ne veulent rien dire.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — convertir 42 en binaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écrire 42 en base 2, puis vérifier.</div><div class=\"etu\"><b>Étape 1 — Chercher le plus grand poids</b> : 32 ≤ 42 &lt; 64 → bit à 1 sur les 32.</div><div class=\"etu\"><b>Étape 2 — Compléter</b> : 42 - 32 = 10 ; 8 ≤ 10 → bit 1 sur les 8 ; 10 - 8 = 2 ; bit 1 sur les 2 ; reste 0.</div><div class=\"etu\"><b>Étape 3 — Écrire</b> : 32 + 8 + 2 → <b>101010</b>.</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : 32+8+2 = 42. Astuce de contrôle : le nombre de bits nécessaires = ⌈log₂(43)⌉ = 6 bits ici.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« 1 ko = 1000 octets, toujours » : en pratique commerciale, oui ; en informatique historique 1 kio = 1024 octets — <b>préciser</b>.</li>\n<li>« Les bits signifient quelque chose seuls » : sans la <b>norme</b> (UTF-8...), une suite de bits n'a pas de sens.</li>\n<li>« Plus de bits = plus précis, sans coût » : plus de bits = plus de place et de calcul ; on choisit un <b>compromis</b> (ex. audio 16 bits vs 24 bits).</li>\n<li>« Le complément à 2 est un détail » : il explique pourquoi les négatifs « fonctionnent » et pourquoi les débordements donnent des valeurs bizarres.</li>\n<li>« Le texte est stocké comme je l'écris » : chaque caractère = un <b>nombre</b> ; les accents exigent Unicode (1 à 4 octets en UTF-8).</li>\n</ul>\n</div>"
 },
 {
  "id": "types-python",
  "theme": "Python : types, variables et instructions (1re)",
  "niveau": "1re",
  "titre": "Python : types, variables et instructions",
  "cours": "<div class=\"cours-head\"><h2>Python : types, variables et instructions</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Variables et affectation</h3>\n<ul>\n<li>Une <b>variable</b> = un nom qui désigne une valeur stockée en mémoire ;</li>\n<li>Affectation : <b>x = 5</b> — on <b>range</b> 5 dans x (et non « x égale 5 » au sens mathématique) ;</li>\n<li>Nom valide : lettres, chiffres, _ ; pas d'espace, pas de mot réservé (if, for...) ; lisibilité : <b>moyenne_notes</b> plutôt que m.</li>\n</ul>\n<div class=\"formule\">x = 5      # affectation<br>x = x + 1  # on lit x, on ajoute 1, on range le résultat : x vaut maintenant 6</div>\n\n<h3>2. Les types de base</h3>\n<table>\n<tr><th>Type</th><th>Exemples</th><th>Usage</th></tr>\n<tr><td><b>int</b> (entier)</td><td>-3, 0, 42</td><td>comptages, indices</td></tr>\n<tr><td><b>float</b> (décimal)</td><td>3.14, -0.5, 2.0</td><td>mesures, moyennes</td></tr>\n<tr><td><b>bool</b> (booléen)</td><td>True, False</td><td>conditions</td></tr>\n<tr><td><b>str</b> (chaîne)</td><td>\"bonjour\", 'a'</td><td>texte</td></tr>\n<tr><td><b>list</b></td><td>[1, 2, 3]</td><td>collections ordonnées</td></tr>\n</table>\n<div class=\"tip\"><b>type(x)</b> renvoie le type ; <b>int(\"5\")</b>, <b>str(5)</b>, <b>float(\"2.5\")</b> convertissent. Attention : <b>\"5\" + \"3\" = \"53\"</b> (texte !) alors que 5 + 3 = 8.</div>\n\n<h3>3. Instructions et structures</h3>\n<ul>\n<li><b>Condition</b> : if / elif / else — l'indentation (4 espaces) délimite le bloc ;</li>\n<li><b>Boucle bornée</b> : for i in range(n) — n répétitions (i de 0 à n-1) ;</li>\n<li><b>Boucle conditionnelle</b> : while condition — tant que vrai (risque de boucle infinie) ;</li>\n<li>Opérateurs de comparaison : ==, !=, &lt;, &gt;, &lt;=, &gt;= ; logiques : and, or, not.</li>\n</ul>\n<div class=\"formule\">if note &gt;= 15 :<br>&nbsp;&nbsp;&nbsp;&nbsp;print(\"très bien\")<br>elif note &gt;= 10 :<br>&nbsp;&nbsp;&nbsp;&nbsp;print(\"passable\")<br>else :<br>&nbsp;&nbsp;&nbsp;&nbsp;print(\"à revoir\")</div>\n\n<h3>4. Erreurs courantes et bonnes pratiques</h3>\n<ul>\n<li><b>TypeError</b> : mélanger les types (\"5\" + 3) → convertir d'abord ;</li>\n<li><b>IndentationError</b> : bloc mal aligné — l'indentation est <b>syntaxique</b> en Python, pas décorative ;</li>\n<li>Division : <b>/</b> donne un float (7/2 = 3.5) ; <b>//</b> la partie entière ; <b>%</b> le reste ;</li>\n<li>Bonnes pratiques : noms parlants, commentaires utiles, tester avec des cas limites (0, liste vide...).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — déboguer un programme de moyenne</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le programme affiche 6.0 au lieu de 6,5 pour les notes 5 et 8 :<br>s = \"5\" + \"8\"<br>m = s / 2</div><div class=\"etu\"><b>Étape 1 — Repérer l'anomalie</b> : une moyenne à 6.0 sur des notes 5 et 8 est impossible (attendu 6,5) → bug de calcul.</div><div class=\"etu\"><b>Étape 2 — Remonter</b> : s = \"5\" + \"8\" est une <b>concaténation</b> (\"58\") ; s / 2 échouerait... sauf si s a été converti : le mélange str/int est la cause profonde.</div><div class=\"etu\"><b>Étape 3 — Corriger</b> : s = 5 + 8 (ou int(\"5\") + int(\"8\")), puis m = s / 2 → 6.5.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : en cas de résultat aberrant, vérifier d'abord les <b>types</b> des variables (print(type(x)) est le premier réflexe du débugueur).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« = et == c'est pareil » : <b>=</b> affecte, <b>==</b> compare — les confondre est LE bug classique.</li>\n<li>« \"5\" est un nombre » : non, une <b>chaîne</b> ; \"5\" + \"3\" = \"53\".</li>\n<li>« range(3) donne 1, 2, 3 » : non, <b>0, 1, 2</b> — range(n) s'arrête à n-1.</li>\n<li>« L'indentation est facultative » : elle <b>remplace</b> les accolades ; mal indenter change le programme.</li>\n<li>« / et // pareil » : 7/2 = 3.5 ; 7//2 = 3 ; 7%2 = 1 (parité !).</li>\n</ul>\n</div>"
 },
 {
  "id": "fonctions-python",
  "theme": "Fonctions et entrées/sorties en Python (1re)",
  "niveau": "1re",
  "titre": "Fonctions et entrées/sorties en Python",
  "cours": "<div class=\"cours-head\"><h2>Fonctions et entrées/sorties en Python</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Pourquoi des fonctions ?</h3>\n<ul>\n<li>Une <b>fonction</b> = un bloc nommé, réutilisable, qui prend des <b>paramètres</b> et <b>renvoie</b> (ou affiche) un résultat ;</li>\n<li>Avantages : <b>ne pas répéter</b>, tester séparément, clarifier le programme, travailler à plusieurs ;</li>\n<li>Principe : une fonction = <b>une tâche</b>, bien nommée (verbe + objet : calculer_moyenne).</li>\n</ul>\n\n<h3>2. Définir et appeler</h3>\n<div class=\"formule\">def calculer_moyenne(a, b):<br>&nbsp;&nbsp;&nbsp;&nbsp;return (a + b) / 2<br><br>m = calculer_moyenne(12, 15)   # m vaut 13.5</div>\n<ul>\n<li><b>def</b> définit ; l'appel exécute avec des <b>arguments</b> (12, 15) ;</li>\n<li><b>return</b> renvoie la valeur <b>et sort</b> de la fonction ;</li>\n<li>Variables locales : définies <b>dans</b> la fonction, invisibles à l'extérieur.</li>\n</ul>\n<div class=\"tip\"><b>print ≠ return</b> : print <b>affiche</b> (l'humain voit), return <b>renvoie</b> (le programme peut réutiliser). Une fonction qui print sans return renvoie... None.</div>\n\n<h3>3. Portée des variables</h3>\n<table>\n<tr><th>Variable</th><th>Où elle existe</th><th>Exemple</th></tr>\n<tr><td><b>locale</b></td><td>dans la fonction uniquement</td><td>x dans def f(): x = 1</td></tr>\n<tr><td><b>globale</b></td><td>partout dans le programme</td><td>SCORE = 0 au début du fichier</td></tr>\n</table>\n<ul>\n<li>Une fonction lit les globales mais, pour les <b>modifier</b>, il faut le déclarer (global) — à éviter au maximum : les fonctions <b>reçoivent</b> des paramètres et <b>rendent</b> des résultats.</li>\n</ul>\n\n<h3>4. Entrées/sorties</h3>\n<ul>\n<li><b>input()</b> lit une saisie clavier — mais renvoie <b>toujours une chaîne</b> : convertir (n = int(input(\"Note ? \"))) ;</li>\n<li><b>print()</b> affiche ; <b>f-strings</b> pour formater : print(f\"Moyenne : {m:.1f}\") ;</li>\n<li>Fichiers : open(nom, \"r\"/\"w\"), lire/écrire, <b>fermer</b> (ou with open(...) as f : fermeture automatique).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — écrire une fonction propre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écrire une fonction qui indique si un nombre est pair, puis l'utiliser pour compter les pairs d'une liste.</div><div class=\"etu\"><b>Étape 1 — Concevoir</b> : entrée = un entier ; sortie = un booléen (True/False) ; nom : est_pair.</div><div class=\"etu\"><b>Étape 2 — Écrire</b> : def est_pair(n): return n % 2 == 0 — une ligne, un return, pas de print.</div><div class=\"etu\"><b>Étape 3 — Réutiliser</b> : compteur = 0 ; for x in liste : if est_pair(x) : compteur += 1 — la fonction s'intègre naturellement.</div><div class=\"etu\"><b>Étape 4 — Tester</b> : est_pair(0) → True ; est_pair(-3) → False ; liste vide → 0. Les cas limites passent : la fonction est solide et <b>réutilisable</b> partout.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« print dans la fonction, ça suffit » : sans <b>return</b>, le résultat n'est pas réutilisable (None).</li>\n<li>« input renvoie un nombre » : toujours — une <b>chaîne</b> ; convertir avant tout calcul.</li>\n<li>« Deux return successifs s'exécutent » : le premier <b>sort</b> de la fonction ; le code après n'est jamais exécuté.</li>\n<li>« Le paramètre modifié change l'original » : les <b>int/str</b> ne sont pas modifiés ; les <b>listes</b>, si (mutation) — piège classique.</li>\n<li>« Une fonction fait plein de choses » : une tâche, un nom, un return — sinon c'est un programme déguisé.</li>\n</ul>\n</div>"
 },
 {
  "id": "structures-lineaires",
  "theme": "Structures linéaires : listes, tuples, dictionnaires (1re)",
  "niveau": "1re",
  "titre": "Structures linéaires : listes, tuples, dictionnaires",
  "cours": "<div class=\"cours-head\"><h2>Structures linéaires : listes, tuples, dictionnaires</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Listes : la collection ordonnée</h3>\n<ul>\n<li>Création : notes = [12, 8, 15] ; <b>indices</b> à partir de <b>0</b> ;</li>\n<li>Accès : notes[0] = 12 ; dernier : notes[-1] ou notes[len(notes)-1] ;</li>\n<li>Tranche : notes[1:3] = [8, 15] (exclut l'indice de fin) ;</li>\n<li>Modification : notes[1] = 10 ; ajout : append(14) ; longueur : len().</li>\n</ul>\n<div class=\"formule\">notes = [12, 8, 15]<br>notes[0] → 12 ; notes[-1] → 15 ; notes.append(14) ; len(notes) → 4</div>\n\n<h3>2. Parcourir une liste</h3>\n<ul>\n<li>Par <b>valeurs</b> : for n in notes : ... ;</li>\n<li>Par <b>indices</b> : for i in range(len(notes)) : notes[i]... ;</li>\n<li>Cas classiques : somme (s = 0 ; s += n), maximum (m = notes[0] ; if n &gt; m...), comptage.</li>\n</ul>\n\n<h3>3. Tuples : la liste verrouillée</h3>\n<ul>\n<li>Un <b>tuple</b> = liste <b>non modifiable</b> : point = (2, 3) ;</li>\n<li>Accès identique (point[0] = 2) mais interdiction d'affectation — erreur si on essaie ;</li>\n<li>Usage : données fixes (coordonnées, dates, retour multiple d'une fonction : return mini, maxi).</li>\n</ul>\n\n<h3>4. Dictionnaires : clé → valeur</h3>\n<table>\n<tr><th>Structure</th><th>Accès par</th><th>Ordre</th><th>Modifiable</th></tr>\n<tr><td><b>liste</b></td><td>indice (position)</td><td>oui</td><td>oui</td></tr>\n<tr><td><b>tuple</b></td><td>indice</td><td>oui</td><td><b>non</b></td></tr>\n<tr><td><b>dictionnaire</b></td><td><b>clé</b> (nom)</td><td>ordre d'insertion (depuis 3.7)</td><td>oui</td></tr>\n</table>\n<ul>\n<li>Exemple : eleve = {\"nom\": \"Alice\", \"age\": 15} ; accès : eleve[\"nom\"] ;</li>\n<li>Ajout/modification : eleve[\"ville\"] = \"Paris\" ; test : \"age\" in eleve ;</li>\n<li>Parcours : for cle, valeur in eleve.items() ;</li>\n<li>Choix : une <b>séquence</b> ordonnée → liste ; une <b>association</b> nommée → dictionnaire.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — choisir la bonne structure</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Stocker : (a) les notes d'une classe dans l'ordre ; (b) les coordonnées d'un point ; (c) le téléphone de chaque contact.</div><div class=\"etu\"><b>Étape 1 — (a)</b> : une suite ordonnée, modifiable (on ajoute des notes) → <b>liste</b>.</div><div class=\"etu\"><b>Étape 2 — (b)</b> : un couple fixe, jamais modifié → <b>tuple</b> (protection contre les erreurs).</div><div class=\"etu\"><b>Étape 3 — (c)</b> : associer un nom (clé) à un numéro (valeur), chercher par nom → <b>dictionnaire</b>.</div><div class=\"etu\"><b>Étape 4 — Règle générale</b> : ordre + positions → liste ; figure immuable → tuple ; recherche par nom → dictionnaire. Se poser d'abord la question : <b>comment vais-je y accéder ?</b></div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le premier élément est notes[1] » : c'est <b>notes[0]</b> — les indices démarrent à 0.</li>\n<li>« liste[1:3] renvoie 3 éléments » : de l'indice 1 <b>au 2 inclus</b> (le 3 est exclu).</li>\n<li>« Un tuple se modifie comme une liste » : non, <b>immuable</b> — l'affectation lève une erreur.</li>\n<li>« Un dictionnaire se parcourt par indices » : non, par <b>clés</b> (items(), keys(), values()).</li>\n<li>« len() donne le dernier indice » : len() = <b>nombre</b> d'éléments ; dernier indice = len()-1.</li>\n</ul>\n</div>"
 },

  "id": "tris-recherche",
  "theme": "Tris et recherches : algorithmes fondamentaux (1re)",
  "niveau": "1re",
  "titre": "Tris et recherches : algorithmes fondamentaux",
  "cours": "<div class=\"cours-head\"><h2>Tris et recherches : algorithmes fondamentaux</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Recherche dans un tableau non trié : la recherche linéaire</h3>\n<ul>\n<li>On parcourt toutes les cases jusqu'à trouver (ou pas) : recherche <b>séquentielle</b> ;</li>\n<li>Coût : jusqu'à <b>n</b> comparaisons ;</li>\n<li>Fonctionne toujours, même en désordre — c'est l'algorithme « prêt-à-tout ».</li>\n</ul>\n\n<h3>2. Recherche dichotomique (dans un tableau trié)</h3>\n<ol>\n<li>Regarder l'élément <b>du milieu</b> ;</li>\n<li>Si c'est la cible : fini ;</li>\n<li>Sinon, éliminer <b>la moitié</b> où la cible ne peut pas être ;</li>\n<li>Répéter jusqu'à trouver ou plus rien à chercher.</li>\n</ol>\n<div class=\"formule\">Recherche dichotomique : ≈ log₂(n) étapes — n = 1000 : ~10 ; n = 1 000 000 : ~20 ; n = 10⁹ : ~30. Chaque étape divise le problème par 2.</div>\n<div class=\"warn\"><b>Condition absolue</b> : le tableau doit être <b>trié</b> — dichotomie sur tableau en désordre = résultat faux, sans erreur signalée.</div>\n\n<h3>3. Tris : le principe et deux exemples</h3>\n<table>\n<tr><th>Tri</th><th>Idée</th><th>Coût (ordre de grandeur)</th></tr>\n<tr><td><b>par sélection</b></td><td>chercher le minimum, le placer en tête, recommencer</td><td>≈ n² comparaisons (toujours)</td></tr>\n<tr><td><b>par insertion</b></td><td>insérer chaque élément à sa place dans la partie déjà triée (comme des cartes en main)</td><td>≈ n² ; quasi n si presque trié</td></tr>\n<tr><td>fusion (Terminale)</td><td>couper en deux, trier chaque moitié, fusionner</td><td>≈ n·log₂(n)</td></tr>\n</table>\n<ul>\n<li>Le coût n² « explose » : trier 10× plus de données demande ≈ 100× plus de travail ;</li>\n<li>Coût dichotomique vs linéaire : pour 1 million d'éléments, ~20 vs ~1 000 000 — l'algorithme <b>compte</b>.</li>\n</ul>\n\n<h3>4. Prouver et tester</h3>\n<ul>\n<li>Un tri est correct s'il rend une <b>permutation triée</b> des données (aucun élément perdu/ajouté) ;</li>\n<li>Tests : liste vide, 1 élément, doublons, déjà triée, triée à l'envers ;</li>\n<li>Compter les comparaisons (variable compteur) pour <b>mesurer</b> le coût, pas seulement le deviner.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — deviner un nombre par dichotomie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Je pense à un nombre entre 1 et 100. Combien de questions « plus grand / plus petit ? » suffisent, au pire ?</div><div class=\"etu\"><b>Étape 1 — Stratégie</b> : couper toujours <b>la moitié</b> restante (« plus grand que 50 ? »).</div><div class=\"etu\"><b>Étape 2 — Compter</b> : 100 → 50 → 25 → 12 → 6 → 3 → 1 : chaque réponse élimine la moitié.</div><div class=\"etu\"><b>Étape 3 — Conclusion</b> : ⌈log₂(100)⌉ = <b>7 questions maximum</b>.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : 1000 nombres → 10 questions ; un million → 20. La <b>dichotomie</b> rend possibles des recherches quasi instantanées à l'échelle du web (dictionnaires, index, corrections).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La dichotomie marche sur n'importe quel tableau » : seulement s'il est <b>trié</b>.</li>\n<li>« Trier une fois ne sert qu'une fois » : trier <b>une</b> fois puis dichotomier mille fois est plus efficace que mille recherches linéaires.</li>\n<li>« Le tri par sélection est rapide car simple » : simple ≠ rapide : son coût <b>n²</b> croît très vite.</li>\n<li>« n·log(n) et n², pareil à petite échelle » : à 10⁶ éléments, l'écart est <b>énorme</b> (~20 ns vs ~s en pratique).</li>\n<li>« L'élément absent se détecte toujours » : la recherche doit aussi <b>gérer l'échec</b> (renvoyer -1/None) — penser au cas négatif.</li>\n</ul>\n</div>"
 },
 {
  "id": "ihm-web",
  "theme": "IHM et web : HTML, CSS, JavaScript (1re)",
  "niveau": "1re",
  "titre": "IHM et web : HTML, CSS, JavaScript",
  "cours": "<div class=\"cours-head\"><h2>IHM et web : HTML, CSS, JavaScript</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Une page web = trois langages, trois rôles</h3>\n<table>\n<tr><th>Langage</th><th>Rôle</th><th>Analogie</th></tr>\n<tr><td><b>HTML</b></td><td>structure et contenu</td><td>les murs et les pièces</td></tr>\n<tr><td><b>CSS</b></td><td>présentation</td><td>la peinture et le décor</td></tr>\n<tr><td><b>JavaScript</b></td><td>interactivité et comportement</td><td>l'électricité et les interrupteurs</td></tr>\n</table>\n<div class=\"tip\"><b>Règle d'or</b> : ne pas mélanger les rôles — le contenu dans le HTML, l'apparence dans le CSS, le comportement dans le JS. C'est ce trio qui rend une page maintenable.</div>\n\n<h3>2. HTML : structurer</h3>\n<ul>\n<li>Balises : &lt;h1&gt;...&lt;/h1&gt; (titres), &lt;p&gt; (paragraphe), &lt;a href=\"...\"&gt; (lien), &lt;img src=\"...\" alt=\"...\"&gt; (image) ;</li>\n<li>Attributs : href, src, alt, class, id ;</li>\n<li>Une page valide : DOCTYPE, html, head (métadonnées, titre, lien CSS), body (contenu).</li>\n</ul>\n\n<h3>3. CSS : mettre en forme</h3>\n<div class=\"formule\">selecteur { propriete: valeur; }<br>h1 { color: navy; font-size: 24px; }<br>.warning { background: #ffefc2; }</div>\n<ul>\n<li>Sélecteurs : balise (p), <b>classe</b> (.warning, réutilisable), <b>id</b> (#menu, unique) ;</li>\n<li>Couleurs : noms (red) ou hexadécimal (#00aabb) ;</li>\n<li>Boîte : chaque élément = contenu + padding + border + margin ;</li>\n<li>Le CSS <b>sépare</b> la forme du fond : changer le style sans toucher au contenu.</li>\n</ul>\n\n<h3>4. JavaScript : rendre interactif</h3>\n<ul>\n<li>Le navigateur exécute le JS <b>côté client</b> (dans la page) ;</li>\n<li>On sélectionne un élément (document.getElementById), on <b>écoute</b> un événement (clic, saisie), on <b>modifie</b> la page (textContent, classList) ;</li>\n<li>Exemple : vérifier un formulaire, afficher/masquer une section, mettre à jour un compteur — sans recharger la page.</li>\n</ul>\n<div class=\"warn\"><b>Client vs serveur</b> : le JS du navigateur est visible et modifiable par l'utilisateur : toute <b>vérification de sécurité</b> doit être refaite <b>côté serveur</b>. Le JS rend l'expérience fluide, pas le site sûr.</div>\n\n<h3>5. IHM : concevoir pour l'utilisateur</h3>\n<ul>\n<li>Une interface réussie : <b>clair</b> (on comprend l'action), <b>efficace</b> (peu de clics), <b> indulgente</b> (erreurs explicites, retour arrière possible) ;</li>\n<li>Accessibilité : alt sur les images, contrastes, navigation clavier — l'accessibilité est une <b>obligation légale</b>, pas un bonus ;</li>\n<li>Réactivité : la page s'adapte à l'écran (téléphone, tablette) — mobile d'abord.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — concevoir un formulaire de saisie de note</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un formulaire demande une note de 0 à 20. Quelles vérifications, où ?</div><div class=\"etu\"><b>Étape 1 — HTML</b> : input de type number avec min=0 max=20 : le navigateur guide déjà (clavier adapté sur mobile).</div><div class=\"etu\"><b>Étape 2 — JavaScript</b> : à la saisie, vérifier la valeur et afficher un message <b>explicite</b> (« La note doit être entre 0 et 20 ») — retour immédiat pour l'utilisateur.</div><div class=\"etu\"><b>Étape 3 — Serveur</b> : re-vérifier à la réception, car le client est <b>modifiable</b> — jamais faire confiance au navigateur.</div><div class=\"etu\"><b>Étape 4 — IHM</b> : message d'erreur précis et sans blame, bouton actif seulement si la saisie est valide : l'utilisateur n'a pas à deviner les règles.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« HTML sert à la couleur » : c'est le <b>CSS</b> — garder chaque rôle à sa place.</li>\n<li>« Le JavaScript du client protège les données » : il est <b>contournable</b> ; la sécurité vit côté serveur.</li>\n<li>« Un id peut servir à plusieurs éléments » : non — <b>id unique</b> ; pour réutiliser un style : une classe.</li>\n<li>« L'accessibilité est un plus optionnel » : c'est une exigence (alt, contrastes, clavier) qui bénéficie à tous.</li>\n<li>« Une jolie interface est une bonne interface » : la <b>clarté</b> prime : une page belle mais confuse est ratée.</li>\n</ul>\n</div>"
 },
 {
  "id": "piles-files-arbres",
  "theme": "Piles, files et arbres (Terminale)",
  "niveau": "Terminale",
  "titre": "Piles, files et arbres",
  "cours": "<div class=\"cours-head\"><h2>Piles, files et arbres</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Structures abstraites : l'interface avant l'implémentation</h3>\n<ul>\n<li>Une <b>structure de données abstraite</b> se définit par ses <b>opérations</b> (que peut-on faire ?) avant sa réalisation (comment ?) ;</li>\n<li>Une même structure peut être implémentée avec un tableau ou une liste chaînée — le <b>choix d'implémentation</b> change la performance, pas la logique.</li>\n</ul>\n\n<h3>2. Pile : LIFO (dernier entré, premier sorti)</h3>\n<table>\n<tr><th>Opération</th><th>Effet</th></tr>\n<tr><td><b>empiler</b> (push)</td><td>ajouter au sommet</td></tr>\n<tr><td><b>dépiler</b> (pop)</td><td>retirer <b>le dernier</b> ajouté</td></tr>\n<tr><td><b>sommet</b> / <b>est_vide</b></td><td>consulter / tester</td></tr>\n</table>\n<ul>\n<li>Image : une pile d'assiettes — on ne prend que celle du dessus ;</li>\n<li>Usages : annuler (Ctrl+Z), historique de navigation, appels de fonctions (pile d'exécution), vérification de parenthésage.</li>\n</ul>\n\n<h3>3. File : FIFO (premier entré, premier sorti)</h3>\n<table>\n<tr><th>Opération</th><th>Effet</th></tr>\n<tr><td><b>enfiler</b></td><td>ajouter à l'arrière</td></tr>\n<tr><td><b>défiler</b></td><td>retirer <b>le premier</b> arrivé</td></tr>\n</table>\n<ul>\n<li>Image : une file d'attente — équité par ordre d'arrivée ;</li>\n<li>Usages : files d'impression, traitement des requêtes, parcours en largeur d'un arbre/graphe (BFS), buffers.</li>\n</ul>\n<div class=\"tip\"><b>Moyen mnémotechnique</b> : <b>LIFO</b> = pile d'assiettes (Last In, First Out) ; <b>FIFO</b> = file d'attente (First In, First Out). Dans les deux cas, on ne retire <b>jamais</b> au milieu.</div>\n\n<h3>4. Arbres : la hiérarchie</h3>\n<ul>\n<li>Un <b>arbre</b> = nœuds reliés par des arêtes ; un nœud <b>racine</b> (sans parent), des nœuds <b>feuilles</b> (sans enfant) ;</li>\n<li>Chaque nœud a des <b>fils</b> ; arbre <b> binaire</b> : au plus 2 fils par nœud ;</li>\n<li><b>Hauteur</b> : longueur du chemin racine → feuille la plus profonde ; un arbre équilibré à n nœuds a une hauteur ≈ log₂(n) — d'où l'efficacité des opérations ;</li>\n<li>Exemples : arborescence de fichiers, arbres de décision, expressions arithmétiques, ABR (arbre binaire de recherche).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — vérifier un parenthésage avec une pile</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'expression ( [ ] ( ) ) est-elle bien parenthésée ? Dérouler l'algorithme à pile.</div><div class=\"etu\"><b>Étape 1 — Règle</b> : à chaque ouvrante, empiler ; à chaque fermante, dépiler et vérifier que les deux se correspondent.</div><div class=\"etu\"><b>Étape 2 — Dérouler</b> : ( empilé ; [ empilé ; ] dépile [ → correspond ; ( empilé ; ) dépile ( → correspond ; ) dépile ( → correspond ; pile vide à la fin.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : pile vide et aucune erreur → expression <b>valide</b>.</div><div class=\"etu\"><b>Étape 4 — Contre-exemples</b> : \")(\" échoue (dépile sur pile vide) ; \"(( ) \" échoue (pile non vide à la fin). La pile détecte <b>exactement</b> ces deux familles d'erreurs — c'est pourquoi les éditeurs l'utilisent.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre pile (LIFO) et file (FIFO) — la file garantit l'<b>équité</b>, la pile la <b>trace inverse</b>.</li>\n<li>« On peut retirer au milieu d'une pile » : non — uniquement au <b>sommet</b> (sinon ce n'est plus une pile).</li>\n<li>« Un arbre peut avoir plusieurs racines » : non — <b>une seule</b> racine ; plusieurs racines = une forêt.</li>\n<li>« La hauteur et la taille, c'est pareil » : taille = <b>nombre de nœuds</b> ; hauteur = <b>profondeur maximale</b>.</li>\n<li>« Implémentation et structure abstraite se confondent » : une pile peut être un tableau ou une liste chaînée ; ce qui compte, c'est la <b>discipline d'accès</b>.</li>\n</ul>\n</div>"
 },
