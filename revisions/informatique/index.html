{"id": "ordinateur-composants", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Modèle :</b> entrées ⟶ traitement (CPU) ⟶ sorties, avec stockage : tout est codé en 0 et 1.</p>\n<p><b>Composants :</b> CPU (exécute), RAM (rapide, volatile), disque (lent, permanent), GPU (images), carte mère, alimentation.</p>\n<p><b>Couches :</b> utilisateur ⟶ logiciels ⟶ OS ⟶ matériel : l'abstraction isole chaque étage.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Diagnostiquer une lenteur :</b> identifier le goulot (RAM pleine ? disque ? processeur ?).</li>\n<li><b>Classer une fonction :</b> matériel, OS ou logiciel selon la couche concernée.</li>\n<li><b>Suivre un événement :</b> entrée ⟶ traitement ⟶ sortie, composant par composant.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>RAM volatile ≠ disque permanent.</li>\n<li>GHz seul ≠ performance (goulot).</li>\n<li>OS = couche de pilotage, pas un simple logiciel.</li>\n</ul>"},
{"id": "reseaux-internet", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Internet = réseau des réseaux</b> : client/serveur, paquets routés, DNS (annuaire), IP (adresses), protocoles (langue commune).</p>\n<p><b>Le trajet :</b> nom ⟹ DNS ⟹ IP ⟹ paquets ⟹ routeurs (câbles sous-marins !) ⟹ serveur ⟹ retour.</p>\n<p><b>Sécurité :</b> HTTPS, mots de passe uniques, anti-phishing (urgence + lien = piège), mises à jour.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Décoder une URL :</b> protocole, domaine exact, page.</li>\n<li><b>Repérer un phishing :</b> urgence, adresse truquée, canal officiel.</li>\n<li><b>Distinguer local / mondial :</b> Wi-Fi et box = chez soi : Internet = au-delà.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Wi-Fi ≠ Internet.</li>\n<li>IP = machine, pas personne.</li>\n<li>HTTP sans S = échanges en clair.</li>\n</ul>"},
{"id": "donnees-cloud", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Tout est binaire</b> : texte, photo, son = suites d'octets : 1 o = 8 bits : Ko ⟶ Mo ⟶ Go ⟶ To.</p>\n<p><b>Cloud = serveurs distants</b> : data centers, avantages (partout, sauvegarde) et conditions (tiers, contrat, réseau).</p>\n<p><b>Traces et droits :</b> métadonnées (EXIF, cookies) : RGPD : accès, rectification, effacement, consentement.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Estimer un poids :</b> caractère ≈ 1 o : photo ≈ 2-5 Mo : film ≈ 1-2 Go.</li>\n<li><b>Choisir une sauvegarde :</b> règle 3-2-1 (3 copies, 2 supports, 1 distant).</li>\n<li><b>Auditer ses traces :</b> visible + métadonnées + historique des droits (RGPD).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Cloud = physique (data centers).</li>\n<li>Octet = 8 bits.</li>\n<li>Suppression ≠ disparition totale des copies.</li>\n</ul>"},
{"id": "algorithmes-programmation", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Algorithme</b> = suite finie d'instructions sans ambiguïté : programme = algorithme écrit dans un langage (Scratch, Python).</p>\n<p><b>3 briques :</b> séquence, condition (SI... SINON), boucle (RÉPÉTER n fois / TANT QUE).</p>\n<p><b>Variable</b> = boîte nommée : affectation = « prend la valeur » : débogage = table de trace + tests aux bornes.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Écrire un algorithme :</b> dérouler les étapes à la main d'abord, éliminer toute ambiguïté.</li>\n<li><b>Déboguer :</b> exécuter à la main en traçant les variables, vérifier les bornes des boucles.</li>\n<li><b>Généraliser :</b> remplacer les valeurs en dur par des variables + une boucle.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Boucle infinie si la condition ne change jamais.</li>\n<li>« = » = affectation, pas égalité.</li>\n<li>La machine exécute à la lettre, sans deviner.</li>\n</ul>"},
{"id": "impacts-numeriques", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Opportunités :</b> savoir, santé, accessibilité (synthèse vocale, sous-titres), nouveaux métiers.</p>\n<p><b>Risques :</b> sommeil, attention (défilement infini, récompenses aléatoires), cyberharcèlement : parades = signal d'arrêt, preuves, adult de confiance.</p>\n<p><b>Société :</b> 80 % de l'empreinte d'un smartphone = fabrication (garder, réparer, reconditionner) : la loi s'applique en ligne.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Réguler son usage :</b> minuteur posé AVANT, notifications triées, pauses 20-20-20, écrans hors du lit.</li>\n<li><b>Agir pour la planète :</b> retenir son appareil, réparer, reconditionné, recycler.</li>\n<li><b>Vérifier une info :</b> source, croisement, date, méfiance envers l'émotion qui pousse au partage.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Le numérique a un corps (métaux, électricité, serveurs).</li>\n<li>Les applications sont conçues pour retenir (pas un manque de volonté).</li>\n<li>Cyberharcèlement = délit réel, documentable, punissable.</li>\n</ul>"},
{"id": "internet-web", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Internet</b> = le réseau (TCP/IP, routeurs, paquets) : <b>Web</b> = un service de pages liées (HTML, HTTP, liens) : mail, messageries, streaming, IoT voyagent aussi sur Internet.</p>\n<p><b>Requête :</b> URL ⟹ DNS ⟹ IP ⟹ paquets ⟹ routeurs ⟹ serveur ⟹ réponse assemblée par le navigateur.</p>\n<p><b>Repères :</b> IPv4 épuisée ⟹ IPv6 : web inventé en 1989 par Berners-Lee : moteur de recherche = index, pas fouille en direct.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b> Lire une URL :</b> protocole (https), domaine, chemin, requêtes (?q=...).</li>\n<li><b> Mesurer le trajet :</b> traceroute : sauts, délais, goulot.</li>\n<li><b> Débuter en HTML :</b> head/body, balises ouvrantes/fermantes, lien &lt;a href&gt;.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Internet ≠ Web.</li>\n<li>Le lien hypertexte = l'invention fondatrice du web.</li>\n<li>Le moteur interroge son index, pas le web en direct.</li>\n</ul>"},
{"id": "reseaux-sociaux", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Graphe</b> : nœuds (personnes), arêtes (relations), degrés très inégaux (influenceurs) : petit monde (4-6 sauts) : contagion amplifiée par la structure.</p>\n<p><b>Modèle économique</b> : publicité ciblée ⟹ l'attention est le produit : le fil est un classement optimisé pour l'engagement (bulles de filtre).</p>\n<p><b>Identité / droits :</b> e-réputation auditée (recherche de soi), RGPD, majorité numérique 15 ans (France), captures = preuves, 3018.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Auditer sa e-réputation :</b> se chercher, trier (neutre / ambigu / nuisible), corriger, construire.</li>\n<li><b>Lire son fil :</b> demander « pourquoi me montre-t-on ceci ? », varier les sources, outils de contrôle.</li>\n<li><b>Réagir au harcèlement :</b> captures datées, adulte de confiance, signalement, 3018.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Gratuit apparent = tu es (en partie) le produit.</li>\n<li>Suppression ≠ disparition (captures).</li>\n<li>La rumeur court plus vite que sa correction : structurel.</li>\n</ul>"},
{"id": "donnees-traitees", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Types</b> : texte, entier, décimal, booléen, date : le type commande les opérations (« 2 »+« 3 »=« 23 » !).</p>\n<p><b>Formats</b> : CSV (lignes, en-têtes, tout est texte : convertir !) : JSON (clé/valeur, emboîtement) : table = descripteurs × enregistrements.</p>\n<p><b>Traitements</b> : nettoyer (aberrant, doublon, manquant), filtrer, trier, agréger, croiser : RGPD : finalité, minimisation, anonymisation.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Nettoyer avant de calculer :</b> repérer aberrants/doublons/manquants, documenter les choix.</li>\n<li><b>Lire un CSV en Python :</b> csv.reader, sauter l'en-tête, CONVERTIR les types, puis calculer.</li>\n<li><b>Anonymiser :</b> identifier la finalité, retirer l'inutile, remplacer par des identifiants.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Texte + texte = concaténation, pas somme.</li>\n<li>Le CSV ne s'emboîte pas (JSON si besoin).</li>\n<li>Minimisation : ne garder que le nécessaire.</li>\n</ul>"},
{"id": "localisation-cartographie", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>GPS</b> : satellites horloge-datables ⟹ décalage de temps ⟹ distance ⟹ trilatération : 4 satellites (3 coordonnées + correction d'horloge) : précision : quelques mètres en extérieur.</p>\n<p><b>Cartes</b> : latitude/longitude, tuiles, couches : itinéraire = plus court chemin dans un graphe pondéré (Dijkstra, A*).</p>\n<p><b>Traces</b> : points horodatés (GPX) : domicile/travail/habitudes ⟹ dé-anonymisation : réglages « pendant l'usage », revue des applications.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Choisir ses réglages :</b> localisation à la demande, historique des positions désactivé.</li>\n<li><b>Lire une trace :</b> points d'arrêt longs = ancrages, régularités = signature.</li>\n<li><b>Raisonner l'itinéraire :</b> traduire la carte en graphe (nœuds, arêtes, poids).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Trilatération, pas triangulation.</li>\n<li>1 ms d'horloge = 300 km.</li>\n<li>4 points spatio-temporels identifient 95 % des personnes.</li>\n</ul>"},
{"id": "objets-connectes", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Chaîne embarquée</b> : capteurs (mesurent) ⟶ microcontrôleur (décide) ⟶ actionneurs (agissent) : boucle mesurer-décider-agir.</p>\n<p><b>IoT</b> : objets communicants : intérêts (automatisation, mesure à distance) et risques (mots de passe d'usine, botnets, vie privée) : mettre à jour, changer les codes.</p>\n<p><b>Programmation</b> : mêmes trois briques (séquence, condition, boucle), sur blocs ou Python : contraintes : énergie, mémoire, fiabilité.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Analyser un objet :</b> lister capteurs, décision, actionneurs.</li>\n<li><b>Sécuriser son IoT :</b> changer les mots de passe par défaut, mettre à jour, désactiver l'inutile.</li>\n<li><b>Programmer une boucle :</b> lire capteur ⟶ tester condition (avec hystérésis) ⟶ commander.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Embarqué = spécialisé et contraint, pas généraliste.</li>\n<li>Un objet connecté = un ordinateur = des failles possibles.</li>\n<li>Ne pas commander en dents de scie : hystérésis.</li>\n</ul>"},
{"id": "photo-numerique", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Chaîne</b> : lumière ⟶ objectif ⟶ obturateur ⟶ capteur ⟹ pixels : triangle d'exposition (ISO, ouverture, vitesse) = compromis lumineux.</p>\n<p><b>Fichier</b> : pixel = 3 nombres RVB : brut = L×H×3 octets (12 M ⟹ 36 Mo) : JPEG (avec perte) vs PNG : EXIF = métadonnées (date, réglages, GPS).</p>\n<p><b>Traitement</b> : retouche = modifier les nombres : mode nuit = empilement de prises, bokeh = calcul : mégapixels ≠ qualité.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Choisir ses réglages :</b> arbitrer vitesse/ouverture/ISO selon la scène (flou, bruit, sous-exposition).</li>\n<li><b> Calculer un poids :</b> pixels × 3 octets, puis effet de la compression.</li>\n<li><b>Publier sereinement :</b> vérifier/nettoyer l'EXIF, garder l'original, retoucher sur copie.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Zoom numérique = recadrage (flou), pas optique.</li>\n<li>JPEG ré-enregistré se dégrade.</li>\n<li>Le bokeh du téléphone est calculé.</li>\n</ul>"},
{"id": "histoire-ordinateurs", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Jalons</b> : Babbage/Lovelace (1837-43) ⟶ Turing (1936) ⟶ von Neumann (1945, programme enregistré) ⟶ transistor (1947) ⟶ microprocesseur (1971) ⟶ Moore (transistors ×2 / ~2 ans).</p>\n<p><b>Architecture</b> : processeur (commande + UAL), mémoire (instructions ET données, adresses), E/S, bus : cycle fetch-decode-execute.</p>\n<p><b>Système</b> : partage du temps, mémoire protégée, UNIX (1969) et descendance : parallélisme aujourd'hui.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b> Lire un schéma von Neumann :</b> suivre une instruction du fetch au rangement.</li>\n<li><b>Dater et relier :</b> associer chaque invention à sa conséquence (programme enregistré ⟹ universalité).</li>\n<li><b>Expliquer une illusion</b> (multitâche, performances) par le fonctionnement réel.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Moore = densité de transistors, pas vitesse directe.</li>\n<li>Programme enregistré = instructions stockées comme données.</li>\n<li>« Bug » antérieur à l'insecte de 1947.</li>\n</ul>"},
{"id": "binaire-donnees", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Puissances</b> : n bits ⟹ 2^n valeurs : octet = 8 bits = 256 : poids = puissances de 2 (droite ⟹ faible).</p>\n<p><b>Encodages</b> : entiers signés (complément à 2 : -128 à +127 sur 8 bits) : ASCII ⟹ UTF-8 (1 à 4 octets/caractère) : pixels = 3 octets RVB : son = échantillons (44,1 kHz × 2 octets).</p>\n<p><b>Logique</b> : ET/OU/XOR/NON bit à bit, masques, décalages (≪ : ×2 par cran) : hexa = binaire lisible (1 chiffre = 4 bits).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Convertir</b> : binaire⟹décimal (somme des poids) : décimal⟹binaire (divisions, restes lus de bas en haut).</li>\n<li><b> Extraire un champ</b> : divisions/modulo ou masque + décalage (pixel ⟹ R, V, B).</li>\n<li><b>Chiffrer</b> ses tailles : caractères ≠ octets (UTF-8), 1024 ≠ 1000.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>n bits ⟹ 2^n (pas 2n).</li>\n<li>Restes de bas en haut.</li>\n<li>Signé sur 8 bits : -128 à +127.</li>\n</ul>"},
{"id": "types-python", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Types</b> : int (exact, illimité), float (approché : 0,1+0,2≠0,3 !), str (immuable), bool : typage dynamique, int()/str()/float() convertissent.</p>\n<p><b>Instructions</b> : input() ⟹ du texte : if/elif/else (indentation !) : for i in range(a,b) (b exclu) : while (sortie à garantir).</p>\n<p><b>Outils</b> : f-strings, tranches s[i:j], len, + pour concaténer, import : erreurs à lire : Syntax/Type/Value/Name/Index.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b> Structurer :</b> entrée (input + conversion) ⟶ traitement (conditions, boucles) ⟶ sortie (print, f-string).</li>\n<li><b>Déboguer :</b> lire le message d'erreur (type, ligne), vérifier types et bornes.</li>\n<li><b>Éviter les pièges flottants :</b> tolérance d'égalité, entiers en centimes.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>input() = str, convertir avant calcul.</li>\n<li>range(b exclu), = vs ==.</li>\n<li>str immuable, float approché.</li>\n</ul>"},
{"id": "fonctions-python", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Fonction</b> : def nom(param): ... return valeur : réutilisation, lisibilité, tests : docstring : sans return ⟹ None.</p>\n<p><b>Portée</b> : variables LOCALES dans le def : la fonction communique par paramètres et return : modifier une liste passée = effet de bord.</p>\n<p><b>Fichiers</b> : with open(nom, 'w'/'a'/'r', encoding='utf-8') : 'w' écrase ! : lignes ⟹ strip() : fermeture automatique par with.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b> Écrire une fonction :</b> docstring, return direct de la condition, tests aux bornes.</li>\n<li><b>Choisir print ou return</b> : communiquer au programme ⟹ return, informer l'humain ⟹ print.</li>\n<li><b>Traiter un fichier :</b> with open ⟹ lire/convertir ⟹ traiter (gardes) ⟹ écrire.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Local vs global : n modifié dans le def reste local.</li>\n<li>'w' écrase tout le fichier.</li>\n<li>Une ligne lue finit par \\n.</li>\n</ul>"},
{"id": "structures-lineaires", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Liste</b> : ordonnée, mutable : index 0, négatifs, tranches (fin exclue) : append/insert/pop/sort : parcours par valeurs ou par indices.</p>\n<p><b>Tuple</b> : immuable (données composites) : <b>dictionnaire</b> : clé ⟹ valeur, accès O(1), get(cle, defaut), items() : comptage = LE motif classique.</p>\n<p><b>Coûts</b> : append O(1), accès O(1), recherche in O(n), tri O(n log n) : copie : B = L[:] (pas B = L !), deepcopy pour l'imbrication.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Choisir la structure :</b> ordre + modifications ⟹ liste : figé ⟹ tuple : association ⟹ dictionnaire.</li>\n<li><b>Parcourir juste :</b> lire ⟹ for x in L : modifier ⟹ for i in range(len(L)).</li>\n<li><b>Compter :</b> d[mot] = d.get(mot, 0) + 1, puis max/sorted par valeur.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>B = A = même objet (copier avec [:]).</li>\n<li>Clé absente ⟹ KeyError (get parer).</li>\n<li>Tranches : borne haute exclue.</li>\n</ul>"},
{"id": "tris-recherche", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Recherches</b> : linéaire O(n) (toute liste) : dichotomique O(log n) (EXIGE liste triée : 1 million ⟹ ~20 étapes).</p>\n<p><b>Tris</b> : sélection (min → échange : O(n²), peu d'échanges) : insertion (cartes en main : O(n²) au pire, O(n) si presque trié).</p>\n<p><b>Preuves</b> : variant (terminaison) + invariant (correction) : dichotomie : « si présente, dans [g, d] » : tri fusion O(n log n) = diviser pour régner.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Dérouler une dichotomie :</b> fenêtre, milieu, comparaison, élimination — compter les étapes.</li>\n<li><b> Dérouler un tri :</b> état après chaque tour, compter échanges/décalages.</li>\n<li><b>Prouver :</b> identifier invariant (correction) et variant (terminaison).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Dichotomie sur liste non triée : faux résultats.</li>\n<li>Milieu = (g + d) // 2.</li>\n<li>Une seule recherche ⟹ tri inutile (linéaire gagne).</li>\n</ul>"},
{"id": "ihm-web", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Trois rôles</b> : HTML = structure (balises, attributs, id unique / classes) : CSS = présentation (sélecteur { propriété: valeur }) : JavaScript = comportement (DOM, événements).</p>\n<p><b>JS motif</b> : getElementById ⟹ addEventListener (click, input, submit) ⟹ .value / .textContent ⟹ classList : la page réagit sans rechargement.</p>\n<p><b>IHM</b> : hiérarchie lisible, retour visuel immédiat, cohérence, accessibilité (label for, alt, contrastes, clavier).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b> Construire une page :</b> structure d'abord (HTML), style ensuite (classes CSS), réaction enfin (JS séparé).</li>\n<li><b>Brancher une interaction :</b> id sur les éléments, écouteur sur l'entrée, écriture sur la sortie.</li>\n<li><b>Styler propre :</b> classes (pas d'id), marges intérieures/extérieures distinguées, une échelle de tailles.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>HTML structure, il ne calcule pas.</li>\n<li>id unique dans la page.</li>\n<li>Validation JS côté client ≠ sécurité (le serveur revalide !).</li>\n</ul>"},
{"id": "piles-files-arbres", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Pile (LIFO)</b> : empiler/depiler au sommet : undo, pile d'appels, DFS. <b>File (FIFO)</b> : enfiler derrière, défiler devant : files d'attente, BFS, tampons.</p>\n<p><b>Arbre</b> : racine, nœuds, feuilles : hauteur (étages) ≠ taille (nœuds) : parcours préfixe/infixe/postfixe (DFS, pile) et en largeur (BFS, file) : infixe d'un ABR = trié !</p>\n<p><b>ABR</b> : gauche &lt; racine &lt; droite ⟹ O(h) : équilibré O(log n), dégénéré O(n).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Simuler</b> : dessiner la pile/file étape par étape sur un exemple.</li>\n<li><b>Parcours</b> : préfixe = nœud d'abord : infixe = nœud au milieu (trié sur ABR) : largeur = file, étage par étage.</li>\n<li><b>Implémenter</b> : pile = liste (append/pop) : file = deque : arbre = classe Noeud.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>pop(0) sur une liste : O(n) — deque !</li>\n<li>Hauteur ≠ taille.</li>\n<li>Bien parenthéser : compter ne suffit pas, l'embriquage doit matcher (pile !).</li>\n</ul>"},
{"id": "recursivite", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Deux ingrédients</b> : cas de base (arrêt, sans récursion) + appel récursif sur une instance PLUS PETITE : sinon ⟹ RecursionError (débordement de pile, ~1000 en Python).</p>\n<p><b>Descente ⟹ base ⟹ remontée</b> : les appels s'empilent (pile d'exécution), la base répond, les résultats se composent en remontant.</p>\n<p><b>Structures récursives</b> : liste = vide ou (tête + reste) : chaîne = (caractère + chaîne) : arbre = (racine + sous-arbres) : Fibonacci naïf : appels en 1,6^n ⟹ mémoïsation ou itératif.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Écrire un récursif :</b> (1) cas de base, (2) hypothèse « l'appel petit marche », (3) composer.</li>\n<li><b>Tracer :</b> dessiner l'empilement/dépilement des appels, ou l'arbre d'appels si plusieurs.</li>\n<li><b>Choisir :</b> structure récursive ⟹ récursif : cumul simple ⟹ boucle : recalculs massifs ⟹ mémoïsation.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Instance qui ne rétrécit pas ⟹ récursion infinie.</li>\n<li>Compter le nombre d'appels (arbre d'appels !).</li>\n<li>l[1:] copie : coût caché O(n²).</li>\n</ul>"},
{"id": "poo", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Vocabulaire</b> : classe = plan : objet = réalisation : attribut = donnée interne : méthode = fonction interne (premier paramètre self) : __init__ = constructeur.</p>\n<p><b>Encapsulation</b> : données + opérations dans l'objet : l'extérieur passe PAR les méthodes (invariants garantis : solde ≥ 0 !) : __str__ pour l'affichage.</p>\n<p><b>Héritage</b> : la fille hérite et spécialise : super() appelle la mère : redéfinition = la version de la fille gagne : héritage = « EST UN » (factoriser, pas dupliquer).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Écrire une classe :</b> __init__(self, ...), attributs self.x, méthodes avec self.</li>\n<li><b>Appeler :</b> objet.methode(arg) — self est passé AUTOMATIQUEMENT (ne pas l'écrire !).</li>\n<li><b>Concevoir l'héritage :</b> factoriser le commun dans la mère, super().__init__, redéfinir au besoin.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>self oublié dans la définition ou écrit à l'appel.</li>\n<li>Chaque objet a SES attributs (indépendance !).</li>\n<li>Hériter sans protected ⟹ invariants de la mère menacés.</li>\n</ul>"},
{"id": "sql-bdd", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Modèle relationnel</b> : tables (lignes = enregistrements, colonnes = attributs) : clé PRIMAIRE (identifiant unique, non null) : clé ÉTRANGÈRE (lien vers une autre table : élimine la redondance).</p>\n<p><b>Lire</b> : SELECT cols FROM table WHERE condition ORDER BY ... : agrégats COUNT/SUM/AVG/MIN/MAX, DISTINCT, LIKE, BETWEEN.</p>\n<p><b>Croiser et écrire</b> : JOIN ... ON cle = cle (recoudre les tables !) : INSERT INTO ... VALUES : UPDATE ... SET ... WHERE : DELETE ... WHERE (sans WHERE : TOUTE la table !).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Concevoir :</b> une table par entité, clé primaire, clé étrangère du côté « n » des relations 1-n.</li>\n<li><b>Écrire une requête :</b> quelles colonnes ? quelle table ? quel filtre ? quel ordre ? — dans CET ordre de clauses.</li>\n<li><b>Jointure :</b> citer les DEUX tables, la condition ON, et qualifier (livres.titre) si besoin.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>UPDATE/DELETE sans WHERE = table entière.</li>\n<li>Jointure sans ON = produit croisé.</li>\n<li>COUNT(*) compte les lignes, COUNT(col) les non-null.</li>\n</ul>"},
{"id": "graphes", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Vocabulaire</b> : sommets, arêtes/arcs, degré, adjacent, chemin, connexe : pondéré = poids sur les arêtes : matrice d'adjacence (dense, test O(1)) vs liste de voisinage (clairsemé, économe !).</p>\n<p><b>Parcours</b> : BFS (FILE : étage par étage : distance en arêtes + parents = plus courts chemins !) : DFS (PILE/récursif : cycles, exploration profonde !) : O(S + A) : marquer les visités !</p>\n<p><b>Dijkstra</b> (poids positifs) : distances provisoires : fixer le plus petit : relâcher d[v] = min(d[v], d[u]+p) : parents = chemin.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Modéliser :</b> qui sont les sommets ? les liens ? les poids ? (cartes, réseaux, dépendances !).</li>\n<li><b>Simuler BFS :</b> file, visiter, enregistrer distance + parent.</li>\n<li><b>Simuler Dijkstra :</b> tableau des distances, fixer/relâcher tour par tour, tracer les parents.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Visités non marqués ⟹ boucle infinie.</li>\n<li>Poids négatifs ⟹ Dijkstra invalide.</li>\n<li>BFS ≠ plus court chemin PONDÉRÉ.</li>\n</ul>"},
{"id": "diviser-regner", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Diviser pour régner</b> : 1. diviser (en 2 !), 2. régner (récursivement), 3. combiner (fusion !) : dichotomie O(log n) : tri fusion T(n) = 2T(n/2) + O(n) ⟹ O(n log n) : exponentiation rapide (x^(n/2))² ⟹ O(log n).</p>\n<p><b>Programmation dynamique</b> : sous-problèmes CHEVAUCHANTS ⟹ calculer une fois, réutiliser : mémoïsation (top-down, cache !) ou bottom-up (tableau dans l'ordre des dépendances !).</p>\n<p><b>Conditions de la dynamique</b> : sous-structure optimale + chevauchement : Fibonacci O(1,6^n) ⟹ O(n) (!).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Reconnaître le paradigme :</b> l'arbre d'appels : branches disjointes ⟹ D&C (+ combiner !) : branches qui se rejoignent ⟹ dynamique (+ cache !).</li>\n<li><b>Écrire la récurrence :</b> T(n) = a·T(n/b) + f(n), puis conclure (log n si f petit !).</li>\n<li><b>Dynamique bottom-up :</b> ordre des dépendances, tableau (ou 2 variables si la récurrence est courte !).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Exponentiation : oublier le cas impair (× x !).</li>\n<li>Fusion : les deux listes doivent DÉJÀ être triées.</li>\n<li>Bottom-up : ordre de remplissage faux ⟹ dépendances manquantes !</li>\n</ul>"},
{"id": "securite-crypto", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Symétrique</b> : une clé pour chiffrer/déchiffrer (César : décalage, cassé par fréquences/force brute ! : AES moderne : clés 128+ bits !).</p>\n<p><b>Hash (SHA-256)</b> : empreinte à sens unique, avalanche, quasi sans collisions : stocker les mots de passe (avec SEL !), vérifier l'intégrité.</p>\n<p><b>Asymétrique (RSA)</b> : publique (chiffre, cadenas !) + privée (déchiffre !) : signature = privée ⟹ vérifiée par publique : certificats = chaîne de confiance (HTTPS !) : hybride : RSA échange la clé de session, AES chiffre le flux.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Chiffrer/déchiffrer César</b> : décaler de k, décaler de -k (et mod 26 !).</li>\n<li><b>Casser César</b> : fréquence du E, puis force brute sur 26 décalages.</li>\n<li><b>Raisonner la sécurité</b> : espace des clés (2^n !), sens unique (hash !), deux clés (RSA !), hybride (HTTPS !).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Hash ≠ chiffrement (pas de retour !).</li>\n<li>Mot de passe : haché + sel + lent (bcrypt !), jamais en clair.</li>\n<li>La sécurité vit dans la clé, pas dans le secret de l'algorithme.</li>\n</ul>"},
];

{"t": "L'ordinateur et ses composants (3e)", "q": "Le rôle du processeur (CPU) :", "c": ["stocker les fichiers", "afficher les images", "refroidir la machine", "exécuter les instructions des programmes (calculs et commandes)"], "a": 3, "e": "C'est le chef d'orchestre : il lit les instructions en mémoire et les exécute, des milliards de fois par seconde (GHz).", "d": "<b>Exécuter les instructions</b> : le moteur de la machine.<div class='ex-detail'><u>Exemple rédigé</u> : le voyage d'un clic : le logiciel demande « additionne ces deux nombres » : le processeur charge les valeurs depuis la RAM, fait l'addition dans ses registres (cases ultra-rapides), range le résultat : il enchaîne : ~3 milliards d'opérations élémentaires par seconde pour un CPU à 3 GHz : il ne décide RIEN (il exécute aveuglément l'ordre des instructions) : c'est le logiciel qui « pense », le CPU qui « court ». Piège : le CPU ne stocke pas les fichiers (c'est le disque) et n'affiche rien (c'est la carte graphique).</div>"},
{"t": "L'ordinateur et ses composants (3e)", "q": "La mémoire vive (RAM) est :", "c": ["permanente", "rapide mais volatile : son contenu s'efface à l'extinction", "un disque dur", "lente et permanente"], "a": 1, "e": "Elle accueille le travail en cours (logiciels ouverts, documents non enregistrés) : coupure de courant = perte immédiate.", "d": "<b>Rapide et volatile</b> : le bureau de travail.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve quotidienne : un traitement de texte non enregistré + coupure = document PERDU (il vivait en RAM) : le même document enregistré = présent sur le DISQUE (permanent) : la RAM est ~1000× plus rapide que le SSD : on travaille en RAM et on ARCHIVE sur disque (« enregistrer » = copier de la RAM vers le disque) : voilà pourquoi on sauvegarde souvent. Piège : « mon ordinateur a tout perdu » : non, il a perdu le NON-enregistré seulement.</div>"},
{"t": "L'ordinateur et ses composants (3e)", "q": "Où sont conservés les fichiers quand l'ordinateur est éteint ?", "c": ["dans le stockage permanent (SSD, disque dur, clé USB)", "nulle part", "dans la RAM", "dans le processeur"], "a": 0, "e": "Le stockage non volatil garde les données sans alimentation : c'est sa définition même.", "d": "<b>Dans le stockage permanent</b> : l'armoire qui garde tout.<div class='ex-detail'><u>Exemple rédigé</u> : le test simple : éteindre, redémarrer : les fichiers, photos, jeux sont là : ils vivent sur le SSD/HDD (mémoires « flash » ou « magnétiques » : elles gardent l'information sans courant) : la comparaison utile : la RAM = tableau blanc effacé chaque soir : le disque = classeur qui reste : une clé USB = la même technologie flash que le SSD, transportable. Conséquence : « perdre ses données » = panne du DISQUE (d'où la sauvegarde sur un DEUXIÈME support : la règle d'or des pros).</div>"},
{"t": "L'ordinateur et ses composants (3e)", "q": "L'ordre correct des couches, du matériel vers l'utilisateur :", "c": ["utilisateur ⟶ matériel ⟶ OS ⟶ logiciels", "logiciels ⟶ utilisateur ⟶ OS ⟶ matériel", "OS ⟶ matériel ⟶ utilisateur ⟶ logiciels", "matériel ⟵ OS ⟵ logiciels ⟵ utilisateur"], "a": 3, "e": "Le matériel obéit à l'OS, qui sert les logiciels, qui servent l'utilisateur : chaque couche masque la précédente (abstraction).", "d": "<b>Matériel ⟵ OS ⟵ logiciels ⟵ utilisateur</b> : la pile des couches.<div class='ex-detail'><u>Exemple rédigé</u> : l'exemple du filtre photo : l'utilisateur clique (logiciel) : le logiciel demande un calcul de pixels : l'OS transmet au processeur et à la carte graphique : le résultat remonte jusqu'à l'écran : personne ne parle au matériel en direct : c'est l'INTÉRÊT : remplacer le disque ou la marque d'écran ne change RIEN pour le logiciel (l'OS absorbe les différences) : c'est l'abstraction, la première grande idée de l'informatique.</div>"},
{"t": "L'ordinateur et ses composants (3e)", "q": "Le rôle du système d'exploitation (OS) :", "c": ["créer des documents", "remplacer le processeur", "gérer le matériel, les fichiers et lancer les applications", "naviguer sur Internet"], "a": 2, "e": "Sans OS (Windows, Linux, macOS, Android), le matériel est inutilisable : il fait le lien et répartit les ressources.", "d": "<b>Le chef d'orchestre invisible</b> : la couche de pilotage.<div class='ex-detail'><u>Exemple rédigé</u> : les preuves de son travail : appuyer sur une touche (il capte le clavier et route vers le bon logiciel), ouvrir un fichier (il sait où il est sur le disque), lancer deux logiciels (il partage le processeur à tour de rôle : l'illusion du « en même temps »), brancher une clé (il la reconnaît) : c'est LUI qui sait parler à chaque composant : les logiciels, eux, ne connaissent que lui. Piège : l'OS n'est pas « un logiciel de plus » : c'est la COUCHE qui tient tout.</div>"},
{"t": "L'ordinateur et ses composants (3e)", "q": "Un ordinateur « rame » dès qu'on ouvre beaucoup d'onglets. Le composant à augmenter en priorité :", "c": ["la carte son", "le clavier", "la RAM (le débordement sur le disque lent est le goulot)", "l'écran"], "a": 3, "e": "RAM pleine ⟹ le système déborde sur le disque (~1000× plus lent) : plus de RAM = plus de place de travail immédiate.", "d": "<b>La RAM</b> : agrandir le bureau.<div class='ex-detail'><u>Exemple rédigé</u> : le diagnostic : 20 onglets ouverts : chacun occupe de la RAM : la RAM se remplit : le système déverse sur le disque (mémoire virtuelle) : chaque consultation du disque coûte ~1000× plus cher : l'ordinateur attend, l'utilisateur rage : le processeur, lui, tourne à vide (il ATTEND les données) : la leçon d'ingénieur : on ne répare pas le symptôme (« changer de PC ») : on identifie le GOULOT d'abord (ici : la quantité de RAM).</div>"},
{"t": "L'ordinateur et ses composants (3e)", "q": "La carte graphique (GPU) sert surtout à :", "c": ["connecter Internet", "stocker les jeux", "refroidir le processeur", "calculer rapidement les images et vidéos (des millions de pixels en parallèle)"], "a": 3, "e": "Elle est spécialisée dans le calcul massif d'images : jeux, 3D, vidéo (et aujourd'hui l'intelligence artificielle !).", "d": "<b>Le calcul d'images en parallèle</b> : le spécialiste des pixels.<div class='ex-detail'><u>Exemple rédigé</u> : le chiffre : un écran 4K = 8,3 millions de pixels, rafraîchis 60 fois par seconde = 500 millions de calculs de couleur PAR SECONDE : le CPU, généraliste, serait débordé : le GPU contient des milliers de petits cœurs simples qui calculent tous EN MÊME TEMPS (parallélisme) : c'est pour ça que les jeux exigent une « carte graphique » : et c'est le même circuit qui accélère aujourd'hui l'IA (les réseaux de neurones aiment aussi les calculs en parallèle).</div>"},
{"t": "L'ordinateur et ses composants (3e)", "q": "Une instruction en langage machine :", "c": ["une phrase en français", "une image", "un mot de passe", "une suite de 0 et de 1 que le processeur exécute directement"], "a": 3, "e": "Le matériel ne comprend QUE le binaire : les langages de programmation (Python, Scratch) sont traduits vers lui.", "d": "<b>Des 0 et des 1</b> : la seule langue du processeur.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne de traduction : on écrit « print() » en Python : un TRADUCTEUR (interpréteur) le convertit en instructions machines (des suites binaires : ex. 10110000) : le CPU exécute : l'écran affiche : chaque couche de langage (Python ⟶ C ⟶ assembleur ⟶ binaire) rapproche de la machine : c'est encore l'ABSTRACTION : programmer en binaire serait invivable (les pionniers des années 1950 l'ont fait !). Piège : l'ordinateur ne « comprend » pas Python : il reçoit du binaire traduit.</div>"},
{"t": "L'ordinateur et ses composants (3e)", "q": "Une action « appliquer un filtre à une photo » relève de :", "c": ["du logiciel (calcul des pixels), en passant par l'OS pour accéder au matériel", "d'aucune couche", "de l'OS uniquement", "du matériel uniquement"], "a": 0, "e": "Le logiciel calcule, l'OS fait transiter les données, le matériel exécute : les trois couches coopèrent.", "d": "<b>Logiciel ⟶ OS ⟶ matériel</b> : les trois à la fois.<div class='ex-detail'><u>Exemple rédigé</u> : le décompte : le FILTRE est une FORMULE mathématique appliquée à chaque pixel (logiciel) : la photo vit sur le disque (l'OS la lit : matériel) : le résultat s'affiche (carte graphique) : le même tri pour « enregistrer un document » (logiciel : écrire : OS : fichier : matériel : disque) : l'erreur classique : croire qu'une action appartient à UNE couche : presque tout traverse les trois, chacune dans son rôle.</div>"},
{"t": "L'ordinateur et ses composants (3e)", "q": "Le clavier et l'écran sont respectivement :", "c": ["une entrée et une sortie", "une sortie et une entrée", "deux stockages", "deux sorties"], "a": 0, "e": "Le clavier ENVOIE des informations vers la machine (entrée) : l'écran RENVOIE l'information vers l'humain (sortie) : certains objets sont mixtes (écran tactile !).", "d": "<b>Entrée / sortie</b> : les deux sens de l'information.<div class='ex-detail'><u>Exemple rédigé</u> : le classement complet : ENTRÉES : clavier, souris, micro, webcam, scanner, écran tactile : SORTIES : écran, haut-parleurs, imprimante, casque : MIXTES (les deux) : écran tactile, casque-micro, clé USB (on y écrit et on y lit) : l'intérêt du classement : comprendre qu'un ordinateur est une MACHINE À TRANSFORMER DE L'INFORMATION : elle entre sous une forme (touches), elle est transformée (calculs), elle sort sous une autre (pixels).</div>"},
{"t": "Le réseau et Internet (3e)", "q": "Internet est :", "c": ["un seul ordinateur géant", "un logiciel", "le Wi-Fi", "le réseau des réseaux : des millions de réseaux interconnectés, sans centre de commandement"], "a": 3, "e": "Des réseaux locaux reliés entre eux par des routeurs et des câbles (99 % du trafic intercontinental dans des câbles sous-marins).", "d": "<b>Le réseau des réseaux</b> : personne ne le possède.<div class='ex-detail'><u>Exemple rédigé</u> : l'image correcte : pas de « super-ordinateur central » (une légende tenace !) : des millions de réseaux (de la box familiale au datacenter) raccordés en mailles : chaque routeur décide localement vers qui transmettre : si un chemin casse, le trafic contourne (conçu pour résister aux pannes !) : c'est la RÉSILIENCE, la grande force d'Internet. Piège : le Wi-Fi n'est PAS Internet (c'est la liaison radio jusqu'à la box) : Internet commence au-delà.</div>"},
{"t": "Le réseau et Internet (3e)", "q": "Le rôle du DNS :", "c": ["filtrer les virus", "chiffrer les données", "traduire un nom de domaine (wikipedia.org) en adresse IP (le « numéro » du serveur)", "stocker les sites"], "a": 2, "e": "C'est l'annuaire d'Internet : on tape un nom lisible, le DNS donne l'IP technique que les routeurs exploitent.", "d": "<b>L'annuaire d'Internet</b> : du nom au numéro.<div class='ex-detail'><u>Exemple rédigé</u> : l'analogie parfaite : le téléphone : on retient « Maman » (le nom : wikipedia.org), le réseau exige « 06 12 34 56 78 » (l'IP : 91.198.174.192) : le DNS fait la traduction en quelques millisecondes : test visible : si le DNS tombe en panne, TOUT semble mort (plus aucun nom ne fonctionne) alors que le réseau va bien : on peut même contourner en tapant l'IP directement (si on la connaît) : c'est un maillon critique et discret.</div>"},
{"t": "Le réseau et Internet (3e)", "q": "En client/serveur :", "c": ["le client demande, le serveur répond (page, fichier, service)", "personne ne parle", "les deux attendent", "le serveur réclame, le client répond"], "a": 0, "e": "Mon navigateur (client) demande : la machine distante (serveur) fournit : le web est bâti sur ce modèle.", "d": "<b>Le client demande, le serveur répond</b> : le sens de la conversation.<div class='ex-detail'><u>Exemple rédigé</u> : le décompte d'une vidéo en ligne : mon navigateur (CLIENT) envoie « donne-moi la vidéo X » : le SERVEUR de la plateforme (une armoire de machines dans un datacenter) découpe la vidéo et l'expédie : mon appareil l'assemble et la joue : le serveur ne m'« écrit » jamais de lui-même : il RÉPOND : cette asymétrie structure tout le web. Piège : le serveur n'est pas « plus intelligent » : il est au service.</div>"},
{"t": "Le réseau et Internet (3e)", "q": "Les données sur Internet voyagent :", "c": ["par la poste", "découpées en paquets étiquetés, routés indépendamment puis réassemblés", "d'un bloc, en une seule fois", "en Wi-Fi uniquement"], "a": 1, "e": "Le découpage en paquets permet de partager les lignes entre tous et de contourner les pannes : à l'arrivée, tout est remis dans l'ordre.", "d": "<b>En paquets</b> : le puzzle acheminé morceau par morceau.<div class='ex-detail'><u>Exemple rédigé</u> : la logistique : une image de 1 Mo part en ~700 paquets, chacun avec son étiquette (destinataire + numéro d'ordre) : les routeurs les envoient chacun par le meilleur chemin du moment : deux paquets voisins peuvent passer par des chemins différents... et arriver quand même dans l'ordre (le protocole TCP vérifie les numéros et redemande les manquants) : bénéfice énorme : une panne d'un chemin = les autres paquets passent ailleurs : l'acheminement survit aux ruptures.</div>"},
{"t": "Le réseau et Internet (3e)", "q": "Le HTTPS (le cadenas) garantit que :", "c": ["le site est gratuit", "le site est le meilleur", "les échanges sont chiffrés (illisibles pour un intercepteur sur le chemin)", "il n'y a pas de publicité"], "a": 2, "e": "Le chiffrement protège la confidentialité en transit (mot de passe, carte bancaire) : sans le S, tout circule « en clair ».", "d": "<b>Des échanges chiffrés</b> : le rideau opaque sur la route.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience de pensée : sur un HTTP nu, un espion placé sur le réseau (Wi-Fi public, piratage d'équipement) lit le mot de passe TEL QUEL : en HTTPS, il ne voit que du brouillis illisible : PRÉCISION IMPORTANTE : le cadenas ne prouve pas que le site est honnête (un site de phishing peut être en HTTPS !) : il prouve que le TUNNEL est privé : honnêteté du site = vérifier le domaine soi-même.</div>"},
{"t": "Le réseau et Internet (3e)", "q": "Un mot de passe solide :", "c": ["123456", "noté sur un post-it", "le prénom du chat partout", "long, unique pour chaque site, avec variété de caractères"], "a": 3, "e": "La longueur rend le « cassage » par essais très coûteux : l'unicité limite les dégâts d'une fuite : un gestionnaire de mots de passe aide.", "d": "<b>Long et unique</b> : la double assurance.<div class='ex-detail'><u>Exemple rédigé</u> : la comptabilité du risque : un mot de 6 caractères = des milliards de combinaisons à essayer : UNE JOURNÉE pour un logiciel de cassage : 12 caractères variés = des siècles ! : deuxième règle : si le site X est piraté (fuite), le pirate essaie « ton » mot de passe sur 20 autres sites : si tu le réutilisais partout : 20 comptes tombent : d'où UN PAR SITE + un gestionnaire qui les retient pour toi : la règle pro actuelle : longue phrase mémorisable + double authentification.</div>"},
{"t": "Le réseau et Internet (3e)", "q": "Le Wi-Fi est :", "c": ["un câble", "Internet en entier", "une liaison radio courte portée entre l'appareil et la box", "un moteur de recherche"], "a": 2, "e": "Le Wi-Fi relie l'appareil à la box : c'est la box qui raccorde au réseau mondial : Wi-Fi = local, Internet = global.", "d": "<b>La liaison locale</b> : la dernière centaine de mètres.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience : couper Internet à la box : le Wi-Fi marche ENCORE (l'imprimante réseau, les appareils se voient) mais plus rien ne va au-delà : le Wi-Fi est la route d'accès : Internet est l'autoroute : de même, le Bluetooth est encore plus local (périphériques) : hiérarchie : Bluetooth (périphérique) < Wi-Fi (maison) < Internet (monde) : confondre Wi-Fi et Internet est LA confusion classique à éliminer.</div>"},
{"t": "Le réseau et Internet (3e)", "q": "Une adresse IP identifie :", "c": ["une machine (interface) sur le réseau", "un site uniquement", "une personne", "un mot de passe"], "a": 0, "e": "C'est le « numéro » technique de l'appareil pour cet instant : il peut changer (attribution dynamique) et plusieurs personnes peuvent partager une même IP.", "d": "<b>Une machine</b> : une plaque technique, pas une carte d'identité.<div class='ex-detail'><u>Exemple rédigé</u> : les nuances : à la maison, tous les appareils partagent l'IP publique de la box (une seule pour toute la famille) : à l'hôtel ou au lycée, des centaines d'utilisateurs derrière une même IP : une IP « désigne » donc un POINT DE RACCORDEMENT : les enquêtes qui « remontent » une IP ne trouvent que la box, pas la personne (d'où l'importance des autres preuves) : et l'IP change à chaque reconnexion (attribution dynamique par la box).</div>"},
{"t": "Le réseau et Internet (3e)", "q": "Le signal d'alerte principal d'un mail de phishing :", "c": ["il y a une pièce jointe", "il arrive la nuit", "il est en français", "l'urgence + un lien à cliquer + une adresse d'expéditeur qui n'est pas le domaine officiel"], "a": 3, "e": "La panique programmée (« 24 h sinon suppression ») pousse à cliquer : vérifier l'adresse EXACTE après le @ et passer par le canal officiel déjoue le piège.", "d": "<b>Urgence + lien + adresse truquée</b> : la signature de l'arnaque.<div class='ex-detail'><u>Exemple rédigé</u> : l'autopsie d'un vrai piège : « votre compte sera supprimé dans 24 h » (peur) : « cliquez ici » (réflexe) : expéditeur : service@banque-secure-24h.com (le domaine n'est PAS banque.fr : usurpation) : le réflexe professionnel : NE PAS cliquer : ouvrir soi-même l'application/l'onglet officiel et vérifier le compte directement : 99 fois sur 100, il n'y a rien : la banque réelle ne demande JAMAIS un mot de passe par mail (règle absolue).</div>"},
{"t": "Le réseau et Internet (3e)", "q": "Un protocole (TCP/IP, HTTP...) est :", "c": ["un virus", "l'ensemble des règles communes de communication (format, ordre, gestion des pertes)", "un type de câble", "une marque de box"], "a": 1, "e": "Sans langage commun, aucune machine ne comprendrait une autre, quelles que soient leurs marques : le protocole EST l'accord universel.", "d": "<b>La grammaire d'Internet</b> : les règles du dialogue.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve par l'échec : si un fabricant décidait d'envoyer « BONJOUR42 » quand le monde attend « 42 : BONJOUR » : personne ne le comprendrait : le protocole FIXE : qui parle quand, sous quelle forme, quoi faire si un paquet se perd (TCP : « redemande ! »), comment ouvrir la page (HTTP) : c'est ce qui permet à un téléphone Android de parler à un serveur Linux : l'accord précède les marques : changer les règles sans prévenir = casser le monde entier.</div>"},
{"t": "Les données numériques et le cloud (3e)", "q": "Un bit peut prendre :", "c": ["2 valeurs (0 ou 1)", "8 valeurs", "10 valeurs", "256 valeurs"], "a": 0, "e": "Un bit = binary digit = un choix binaire (tension basse/haute) : c'est l'alphabet entier de l'informatique.", "d": "<b>2 valeurs</b> : l'unité minimale d'information.<div class='ex-detail'><u>Exemple rédigé</u> : le fondement : un bit est un interrupteur (éteint/allumé : 0/1) : avec 1 bit : 2 messages possibles : avec 8 bits (un octet) : 2×2×2×2×2×2×2×2 = 256 : c'est pour ça qu'un caractère se code sur un octet (assez pour toutes les lettres et accents !) : avec N bits : 2^N possibilités : 10 bits = 1024 valeurs, 16 bits = 65 536... la progression EXPLOSE.</div>"},
{"t": "Les données numériques et le cloud (3e)", "q": "1 octet (byte) vaut :", "c": ["1 bit", "8 bits", "1024 bits", "100 bits"], "a": 1, "e": "8 bits = 256 combinaisons : de quoi coder un caractère : les tailles de fichiers se comptent en octets (Ko, Mo, Go).", "d": "<b>8 bits</b> : le mot de 8 lettres binaires.<div class='ex-detail'><u>Exemple rédigé</u> : l'usage : un fichier texte de 1000 caractères ≈ 1000 octets ≈ 1 Ko : une photo ≈ 2 Mo : le piège d'examen : confondre bit et octet (facteur 8 !) : exemple de débit : « 100 Mb/s » de fibre = mégabits ≈ 12,5 Mo/s réels : les FAI annoncent en bits (chiffre plus gros), les fichiers se mesurent en octets : vérifier l'unité AVANT de calculer.</div>"},
{"t": "Les données numériques et le cloud (3e)", "q": "Une photo numérique est stockée comme :", "c": ["un dessin au crayon", "une image miniature", "une grille de pixels, chacun codé par des nombres (ex. 3 valeurs R, V, B)", "du texte"], "a": 2, "e": "Le capteur mesure la lumière par cellule (pixel) : couleur = 3 nombres de 0 à 255 : le fichier n'est qu'une longue suite de nombres.", "d": "<b>Des nombres par pixel</b> : l'image est un tableau de valeurs.<div class='ex-detail'><u>Exemple rédigé</u> : le décompte : photo 12 Mpixels : chaque pixel : 3 octets (R : 0-255, V : 0-255, B : 0-255 : 255-0-0 = rouge, 255-255-255 = blanc) : brut : 36 Mo ! : la compression JPEG regroupe les répétitions (« ciel : 5000 pixels identiques ») et tombe à 2-3 Mo : c'est aussi pour ça qu'on peut RETOUCHER une photo (changer les nombres = changer la couleur) et pourquoi un « zoom » ne crée pas de détails perdus (les séries policières exagèrent !).</div>"},
{"t": "Les données numériques et le cloud (3e)", "q": "Le « cloud » désigne :", "c": ["des nuages de vapeur", "un type d'écran", "un logiciel", "des serveurs distants (data centers) accessibles par Internet, chez un prestataire"], "a": 3, "e": "On loue de l'espace et de la puissance ailleurs : avantages (accès partout, sauvegarde auto) et questions (tiers de confiance, réseau, pays de stockage).", "d": "<b>Des serveurs bien physiques</b> : la dématérialisation est un mythe.<div class='ex-detail'><u>Exemple rédigé</u> : la réalité : un data center = hangars de milliers de serveurs, alimentés, refroidis 24h/24 (l'électricité et la chaleur sont bien réelles : ~1-2 % de l'électricité mondiale !) : quand « mes photos sont dans le nuage », elles sont sur DES DISQUES PRÉCIS, dans un pays précis, soumis à une loi précise : les questions avant de confier : qui peut y accéder (employés, justice, pirates) : que se passe-t-il si je cesse de payer ou si la société ferme (réversibilité, export) : le cloud est un CONTRAT, pas une magie.</div>"},
{"t": "Les données numériques et le cloud (3e)", "q": "La sauvegarde « 3-2-1 » recommande :", "c": ["2 ordinateurs identiques", "3 mots de passe", "1 seul exemplaire très protégé", "3 exemplaires des données, sur 2 supports différents, dont 1 hors site (distant)"], "a": 2, "e": "Toute copie unique finira par se perdre (panne, vol, erreur) : la redondance répartie est la seule stratégie sérieuse.", "d": "<b>3 copies, 2 supports, 1 distant</b> : la stratégie anti-catastrophe.<div class='ex-detail'><u>Exemple rédigé</u> : la logique du risque : un disque meurt statistiquement (un jour) : une clé se perd (un jour) : un incendie ou un vol emporte TOUT ce qui est au même endroit : la règle couvre chaque scénario : exemplaire de travail (PC) + copie locale (disque externe) + copie DISTANTE (cloud ou clé chez un proche) : les pertes arrivent aux AUTRES... jusqu'au jour où : la sauvegarde est une assurance, jamais une perte de temps.</div>"},
{"t": "Les données numériques et le cloud (3e)", "q": "Les métadonnées (EXIF) d'une photo peuvent contenir :", "c": ["la date, l'heure, le modèle d'appareil et parfois la position GPS", "le nom de tous les amis", "rien du tout", "uniquement les couleurs"], "a": 0, "e": "Des informations INVISIBLES sur l'image voyagent avec le fichier : date/heure, appareil, localisation éventuelle.", "d": "<b>Date, appareil, GPS parfois</b> : l'arrière-plan invisible du fichier.<div class='ex-detail'><u>Exemple rédigé</u> : la démonstration : publier « juste une photo de plat » peut révéler : prise hier 19h42, à 200 m de chez moi (GPS), avec mon téléphone précis : une personne qui suit mes publications peut reconstituer mes horaires et mes lieux : les journalistes d'investigation utilisent ces métadonnées (vérifier une fausse photo) : les réflexes : désactiver la géolocalisation des photos dans les réglages, ou nettoyer l'EXIF avant de publier.</div>"},
{"t": "Les données numériques et le cloud (3e)", "q": "Le RGPD (Europe) garantit notamment :", "c": ["l'anonymat total sur Internet", "le droit à un ordinateur neuf", "le droit d'accès, de rectification et d'effacement de ses données personnelles", "le droit de télécharger gratuitement"], "a": 2, "e": "Droit d'accéder aux données détenues sur soi, de les faire corriger, de demander leur effacement, et consentement clair pour la collecte.", "d": "<b>Accès, rectification, effacement</b> : les droits sur SES données.<div class='ex-detail'><u>Exemple rédigé</u> : la mise en œuvre : un site doit dire CLAIREMENT ce qu'il collecte et pourquoi (case à cocher vide : le consentement ne peut pas être « pré-coché ») : sur demande, un service doit fournir l'ensemble des données qu'il détient sur moi (export) : je peux exiger la correction d'une erreur ou l'effacement (exceptions : obligations légales) : les sanctions existent (amendes record déjà infligées) : précision : le RGPD protège les données PERSONNELLES (qui me désignent) : il s'agit de CONTRÔLE, pas de disparition.</div>"},
{"t": "Les données numériques et le cloud (3e)", "q": "Une trace numérique volontaire est par exemple :", "c": ["un cookie", "une publication sur un réseau social", "l'adresse IP", "les métadonnées d'une photo"], "a": 1, "e": "Volontaire : je choisis de publier (post, photo, commentaire) : involontaire : métadonnées, cookies, historique de localisation collectés en arrière-plan.", "d": "<b>La publication choisie</b> : la trace assumée.<div class='ex-detail'><u>Exemple rédigé</u> : la distinction structurante du chapitre : VOLONTAIRE : posts, photos, commentaires, profil (je décide : même si je sous-estime la portée !) : INVOLONTAIRE : EXIF, cookies (ils me suivent de site en site pour la pub), historique de recherche, localisation des applications : l'ensemble des deux = mon IDENTITÉ NUMÉRIQUE, consultable par un employeur, un assureur, un camarade : la question réflexe avant de publier : « serais-je d'accord que ma famille, mon banquier ET mon futur employeur voient ceci ? » : si NON : ne pas publier.</div>"},
{"t": "Les données numériques et le cloud (3e)", "q": "Un fichier de 2 Mo représente environ :", "c": ["un film entier", "une photo compressée ou une chanson de qualité moyenne", "une bibliothèque", "2 caractères"], "a": 1, "e": "Ordres de grandeur : texte 1 Ko/page : photo 1-5 Mo : chanson 3-5 Mo : film 1-2 Go : ces repères s'apprennent.", "d": "<b>Une photo ou une chanson</b> : le bon ordre de grandeur.<div class='ex-detail'><u>Exemple rédigé</u> : l'échelle à mémoriser : 1 caractère = 1 octet : une page de texte ≈ 2 Ko : une photo de téléphone (JPEG) ≈ 2-5 Mo : une chanson (MP3) ≈ 4 Mo : un film HD ≈ 2 Go : la clé de 32 Go ≈ 15 films ou 8000 photos : avec ces repères, on peut DÉTECTER les anomalies (une « photo » de 2 Go ? une arnaque ou une erreur) : l'ordre de grandeur est un outil de contrôle, pas de la coquetterie.</div>"},
{"t": "Les données numériques et le cloud (3e)", "q": "La compression « avec perte » (JPEG, MP3) :", "c": ["réduit la taille en dégradant irréversiblement certains détails", "chiffre les données", "récupère le fichier original à l'identique", "augmente la taille"], "a": 0, "e": "On jette des détails que l'œil/l'oreille perçoit mal : plus léger, mais retour impossible : le PNG/WAV (sans perte) conserve tout.", "d": "<b>Plus léger, retour impossible</b> : le pari de l'ingénieur.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement : l'œil voit mal les fines différences de couleurs dans une zone uniforme : le JPEG SUPPRIME ces informations (schéma : ciel noté « 5000 pixels quasi identiques ») : résultat : 10× plus léger, quasi identique à l'œil : MAIS si on compresse FORT (ou plusieurs fois), les artefacts apparaissent (blocs, halos) et l'original EST PERDU pour toujours : l'alternative : PNG (sans perte, plus lourd) pour les images à garder : archiver en qualité max : diffuser en compressé.</div>"},
{"t": "Algorithmes et programmation (3e)", "q": "Un algorithme est :", "c": ["une erreur de calcul", "une suite finie et ordonnée d'instructions sans ambiguïté pour résoudre un problème", "un ordinateur puissant", "un langage de programmation"], "a": 1, "e": "L'algorithme est le PLAN (les étapes), le programme en est l'ÉCRITURE dans un langage : la machine l'exécute à la lettre.", "d": "<b>Le plan de résolution</b> : la méthode avant l'écriture.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve par la recette : « ajouter une pincée de sel » est ambigu pour un robot (quelle quantité ?) : l'algorithme exige : « ajouter 2 g de sel » : chaque étape doit être exécutable SANS interprétation : l'intérêt du découpage : on peut vérifier la logique AVANT d'écrire la moindre ligne de code (sur papier !) : la discipline d'ingénieur : d'abord la méthode, ensuite le code : programmer sans algorithme = écrire une dissertation sans plan.</div>"},
{"t": "Algorithmes et programmation (3e)", "q": "Les trois structures de base de tout algorithme :", "c": ["séquence, condition (test), boucle (répétition)", "addition, soustraction, multiplication", "copier, coller, sauvegarder", "clavier, écran, souris"], "a": 0, "e": "Tous les programmes du monde, de la calculatrice aux jeux 3D, se construisent avec ces trois briques uniquement.", "d": "<b>Séquence, condition, boucle</b> : la boîte de LEGO universelle.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve : un jeu vidéo = des actions dans l'ordre (séquence) + « SI le joueur touche la pièce ALORS score = score + 10 » (condition) + « TANT QUE la partie dure, afficher la scène » (boucle) : il n'y a PAS de 4e brique : cette découverte (les années 1950-60) est le théorème fondamental de la programmation : tout le reste (fonctions, objets, IA) est de l'ORGANISATION de ces trois briques.</div>"},
{"t": "Algorithmes et programmation (3e)", "q": "L'instruction « score = score + 10 » signifie :", "c": ["une égalité mathématique fausse", "la variable score PREND sa nouvelle valeur : ancienne + 10 (affectation)", "une erreur de syntaxe", "que score vaut toujours 10"], "a": 1, "e": "Le « = » de programmation est une AFFECTION : on range dans la boîte le résultat du calcul de droite : la valeur de droite est calculée d'abord, PUIS rangée.", "d": "<b>Affectation</b> : la boîte est mise à jour.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme précis : si score contenait 30, l'ordinateur : 1. calcule « score + 10 » (l'ANCIENNE valeur : 30 + 10 = 40) : 2. EFFACE la boîte score : 3. range 40 : lecture à droite avec l'ancienne valeur, écriture à gauche : c'est pour ça que l'ordre est vital : écrire d'abord « score = 0 » PUIS « score = score + 10 » fonctionne : dans l'ordre inverse, le score repart de zéro à chaque fois ! Piège : le « = » mathématique (égalité) s'écrit « == » en test.</div>"},
{"t": "Algorithmes et programmation (3e)", "q": "Une boucle « TANT QUE la souris n'est pas sortie » tourne dangereusement si :", "c": ["elle s'exécute 3 fois", "elle affiche un texte", "la condition ne devient jamais fausse (boucle infinie)", "elle contient une condition"], "a": 2, "e": "TANT QUE exige que le programme FASSE évoluer la situation : sinon il tourne à l'infini et gèle la machine.", "d": "<b>La boucle infinie</b> : la malédiction du TANT QUE.<div class='ex-detail'><u>Exemple rédigé</u> : l'anatomie du plantage : « TANT QUE la souris est dans le labyrinthe : avancer » : si « avancer » est mal écrit (la souris tourne en rond face au mur !), la condition reste TOUJOURS vraie : le programme boucle sans fin, l'écran se fige : le remède conceptuel : Toute boucle TANT QUE doit contenir une action qui RAPPROCHE de la sortie : c'est l'invariant à vérifier AVANT de lancer : la boucle RÉPÉTER n FOIS, elle, est bornée par construction : d'où la règle : nombre d'itérations connu d'avance ? for : sinon while, avec preuve de sortie.</div>"},
{"t": "Algorithmes et programmation (3e)", "q": "Dans un jeu Scratch, « QUAND la flèche droite est pressée → avancer de 10 » relève :", "c": ["du hasard", "d'une variable", "de la programmation événementielle (le programme réagit à un événement)", "d'une boucle"], "a": 2, "e": "Le programme ne déroule pas une liste : il ATTEND des événements (clic, touche, message) et réagit : c'est le modèle des interfaces et des jeux.", "d": "<b>Événementiel</b> : le programme à l'écoute.<div class='ex-detail'><u>Exemple rédigé</u> : la différence de logique : le programme classique : « fais les étapes 1, 2, 3 » (il impose son rythme) : l'événementiel : « je monte la garde : SI on te touche, voici la parade » (il attend) : un jeu = une boucle d'attente permanente + des réactions : chaque touche pressée déclenche SA parcelle de code : c'est le modèle de TOUT logiciel moderne (clic, frappe, notification) : l'utilisateur commande le rythme.</div>"},
{"t": "Algorithmes et programmation (3e)", "q": "Un bogue (bug) est :", "c": ["un câble débranché", "un virus venu d'Internet", "une erreur dans le programme : il fait autre chose que ce qui était prévu", "une panne d'écran"], "a": 2, "e": "Le bogue est une erreur de CONCEPTION ou d'écriture : le programme s'exécute parfaitement... selon ce qui est écrit, qui est faux !", "d": "<b>Le programme fait, mais fait mal</b> : la faute de logique.<div class='ex-detail'><u>Exemple rédigé</u> : l'exemple historique du nom : un insecte (bug !) coincé dans un relais en 1947 faisait dérailler la machine : depuis, « bug » = défaut de conception : l'exemple du programme qui saute la note 5 : la machine n'est « pas cassée », elle exécute une boucle bornée à 4 au lieu de 5 : le débogage = COMPARER « ce que je voulais » et « ce qui est écrit » : méthode : la table de trace (suivre les variables pas à pas) + tests aux BORNES.</div>"},
{"t": "Algorithmes et programmation (3e)", "q": "Pour calculer la moyenne de 30 notes, la meilleure structure :", "c": ["une condition SI", "une boucle qui lit chaque note et accumule le total, puis total / 30", "une variable texte", "écrire 30 lignes une par une"], "a": 1, "e": "La boucle + l'accumulation (total = total + note) transforme un code « sur mesure » en outil générique : 3 notes ou 3000, mêmes 4 lignes.", "d": "<b>La boucle d'accumulation</b> : le motif roi du traitement de données.<div class='ex-detail'><u>Exemple rédigé</u> : le squelette à connaître par cœur : total = 0 : POUR i DE 1 À 30 : lire note : total = total + note : FIN POUR : moyenne = total / 30 : la beauté du motif : la ligne « total = total + note » répétée fait GRANDIR la somme (escalier) : et le même squelette calcule des sommes de prix, de distances, de points de jeu... : le réflexe de generalisation : voir 3 lignes qui se répètent = écrire une boucle.</div>"},
{"t": "Algorithmes et programmation (3e)", "q": "L'algorithme « chercher le plus grand de 5 nombres » fonctionne par :", "c": ["moyenne", "multiplication de tous les nombres", "comparaison successive : garder le plus grand rencontré jusqu'ici (champion en place)", "tri décroissant obligatoire"], "a": 2, "e": "On balaye : à chaque nombre, SI il dépasse le champion courant, IL devient le champion : à la fin, le champion est le maximum : O(n), sans tri.", "d": "<b>Le champion en place</b> : l'algorithme du maximum.<div class='ex-detail'><u>Exemple rédigé</u> : le déroulé (12, 7, 25, 3, 18) : champion = 12 : 7 > 12 ? non : 25 > 12 ? OUI, champion = 25 : 3 ? non : 18 ? non : réponse 25 : 4 comparaisons, aucun tri, aucun stockage supplémentaire : le motif se généralise : minimum (challenger si plus petit !), comptage (SI note >= 10 : reçus = reçus + 1), recherche d'une valeur (SI note == 15 : trouvé !) : un seul balayage suffit pour presque toutes les questions simples : c'est LE réflexe algorithmique.</div>"},
{"t": "Algorithmes et programmation (3e)", "q": "La « table de trace » sert à :", "c": ["traduire en Python", "suivre pas à pas l'évolution des variables pour localiser un bogue", "mesurer la vitesse", "dessiner le programme"], "a": 1, "e": "On exécute le programme À LA MAIN en notant chaque variable à chaque étape : la divergence entre attendu et constaté révèle la ligne fautive.", "d": "<b>L'exécution manuelle</b> : le microscope du débogueur.<div class='ex-detail'><u>Exemple rédigé</u> : la maquette : colonnes = variables (i, total, score), lignes = tours de boucle : on remplit en calculant SOI-MÊME : i=1 : total=12 : i=2 : total=27... : puis on compare à ce que le programme affiche : premier écart = ligne du bogue : c'est aussi la MEILLEURE préparation aux exercices d'examen (« que vaut la variable après la boucle ? ») : la rigueur du papier complète le test machine : les deux font le programmeur.</div>"},
{"t": "Algorithmes et programmation (3e)", "q": "L'instruction conditionnelle complète est :", "c": ["SI condition ALORS action", "TANT QUE condition", "SI condition ALORS action SINON autre action", "SINON action"], "a": 2, "e": "Le test complet ouvre DEUX chemins (vrai → action : faux → autre action) : le programme choisit l'un des deux à chaque passage.", "d": "<b>SI... ALORS... SINON</b> : l'aiguillage à deux voies.<div class='ex-detail'><u>Exemple rédigé</u> : l'exemple du seuil : SI moyenne >= 10 ALORS afficher « reçue » SINON afficher « à retravailler » : la condition est un énoncé VRAI/FAUX (comparaison : >=, <, ==) : l'exécution suit UNE branche, jamais les deux : les tests s'imbriquent pour des cas multiples (SI note >= 16 : mention BIEN : SINON SI note >= 14 : bien : SINON...) : l'erreur fréquente : confondre = (affectation) et == (égalité-test) : l'ordinateur prendra le = au pied de la lettre.</div>"},
{"t": "Les impacts du numérique (3e)", "q": "L'essentiel de l'empreinte carbone d'un smartphone vient :", "c": ["des textos envoyés", "de sa fabrication (extraction des métaux, usines, transport : ~80 %)", "de le charger chaque nuit", "du Wi-Fi de la maison"], "a": 1, "e": "80 % de l'empreinte se joue AVANT le premier allumage : garder son téléphone longtemps est donc le geste écologique n°1.", "d": "<b>La fabrication</b> : le pari contre-intuitif.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul qui surprend : fabriquer un smartphone ≈ 30-60 kg de CO2 (minerai extrait, souvent en Asie, fonderie, assemblage, transport) : l'utiliser UN AN ≈ 2-4 kg : conclusion nette : l'empreinte est dans le REMPLACEMENT : garder 4 ans au lieu de 2 = empreinte annuelle divisée par ~2 : les gestes utiles par ordre décroissant : retenir, réparer, reconditionné, recycler : pas « éteindre son ordinateur chaque soir ». Piège : « le numérique est dématérialisé » : il a un corps, des mines et des usines.</div>"},
{"t": "Les impacts du numérique (3e)", "q": "Le défilement infini et les notifications sont conçus pour :", "c": ["nous faire gagner du temps", "économiser la batterie", "protéger la vue", "capter et retenir l'attention (modèle économique : ton temps = leurs revenus)"], "a": 3, "e": "Pas de signal d'arrêt (fin de page), récompenses aléatoires : l'ingénierie de la rétention n'est pas un hasard, c'est un métier.", "d": "<b>Capter l'attention</b> : le temps capté est le produit vendu.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme honnêtement décrit : pas de « fin de page » = pas de moment où se demander « je continue ? » : 1 vidéo sur 10 excellente = récompense IMPRÉVISIBLE = dopamine = machine à sous (l'expérience de Skinner sur les pigeons l'a établi : les récompenses aléatoires sont les plus accrochantes) : et l'application vend TON attention aux annonceurs : les parades efficaces : minuteur posé AVANT (elle ne s'arrêtera pas d'elle-même), notifications coupées, écran en noir et blanc : ce n'est pas un manque de volonté, c'est une ingénierie qui joue contre toi.</div>"},
{"t": "Les impacts du numérique (3e)", "q": "Face au cyberharcèlement, l'attitude correcte :", "c": ["répondre plus fort pour se défendre", "ne rien dire, ça passera : capturer les preuves (captures avec dates), ne pas rester seul, en parler à un adulte de confiance et signaler/bloquer", "attendre que l'auteur se lasse", "supprimer son compte par honte"], "a": 1, "e": "Le silence profite à l'auteur : les preuves (captures datées) permettent le signalement (plateforme, établissement, police si besoin) : la loi punit ces faits.", "d": "<b>Preuves + parole + signalement</b> : le trio qui protège.<div class='ex-detail'><u>Exemple rédigé</u> : le protocole éprouvé : 1. CAPTURER (captures d'écran avec date et pseudo : sans ça, « parole contre parole ») : 2. NE PAS RESTER SEUL (ami, parent, CFA, numéro 3018 en France : la honte est l'arme de l'auteur, la parole la désarme) : 3. SIGNALER (la plateforme, l'établissement : harcèlement = délit réel, punissable) : 4. PROTÉGER (bloquer, restreindre) : ce qui NE marche pas : riposter (on devient auteur à son tour : juridiquement !), endurer (la répétition permanente épuise). Piège : « c'est virtuel » : la souffrance, elle, est bien réelle.</div>"},
{"t": "Les impacts du numérique (3e)", "q": "La synthèse vocale et les sous-titres automatiques illustrent :", "c": ["l'accessibilité : une conception pensée pour les plus contraints profite à tous", "un gadget", "un risque pour l'emploi", "une mode passagère"], "a": 0, "e": "Malvoyants, malentendants, dyslexiques... et TOUS les autres dans le métro bruyant : la conception universelle est une des grandes réussites sociales du numérique.", "d": "<b>La conception universelle</b> : l'ascenseur du numérique.<div class='ex-detail'><u>Exemple rédigé</u> : l'analogie qui frappe : les trottoirs abaissés, pensés pour les fauteuils, servent AUSSI les poussettes, les valises, les livreurs : de même : la synthèse vocale (malvoyants) sert qui conduit : les sous-titres (malentendants) servent en salle de sport : la traduction instantanée ouvre des mondes : l'impact du numérique se mesure en AUTONOMIE rendue : un courrier lu à voix haute en 3 secondes = ne plus dépendre d'un tiers : c'est une question de dignité autant que de technique.</div>"},
{"t": "Les impacts du numérique (3e)", "q": "Sur l'emploi, l'effet le mieux documenté du numérique :", "c": ["il ne change rien", "il déplace les compétences : des tâches disparaissent, d'autres se transforment, de nouveaux métiers naissent", "il supprime uniquement les métiers manuels", "il remplace tous les humains"], "a": 1, "e": "L'histoire technique est constante (ATM ⟹ moins de caissiers, plus de conseillers : tableur ⟹ moins de saisie, plus d'analyse) : la compétence transversale devient : maîtriser les outils.", "d": "<b>Déplacement des compétences</b> : l'histoire se répète utilement.<div class='ex-detail'><u>Exemple rédigé</u> : les précédents : distributeurs automatiques (moins de caisses, PLUS de conseillers bancaires et d'ingénieurs) : tableur (moins de saisie, plus d'analystes) : IA générative aujourd'hui (moins de rédaction repetitive, plus de relecture experte et de pilotage) : les métiers qui disparaissent le plus vite sont les TÂCHES répétitives, pas les MÉTIERS entiers : et les métiers qui montent exigent tous une base numérique (du soudeur au soignant) : la conclusion pragmatique pour un élève de 3e : la question n'est pas « mon futur métier existera-t-il ? » mais « quels outils saurai-je maîtriser ? ».</div>"},
{"t": "Les impacts du numérique (3e)", "q": "Pour protéger son sommeil face aux écrans :", "c": ["dormir avec la télé allumée", "arrêter les écrans avant le coucher (la lumière retard l'endormissement) et sortir les appareils de la chambre", "regarder jusqu'à l'endormissement", "augmenter la luminosité"], "a": 1, "e": "La lumière des écrans (surtout bleue) retarde la mélatonine : et les contenus stimulants entretiennent l'éveil : la chambre doit rester un repère de sommeil.", "d": "<b>Écrans hors de la chambre</b> : la frontière sanitaire la plus rentable.<div class='ex-detail'><u>Exemple rédigé</u> : le double mécanisme : 1. La LUMIÈRE, surtout bleue, signale « il fait jour » au cerveau : la mélatonine (l'hormone du sommeil) se décale : on s'endort plus tard, on dort moins : 2. Le CONTENU (une vidéo de plus, une notification) maintient l'éveil émotionnel : et le réveil ? le téléphone vibre à 7h, la journée part sur les sollicitations : la règle simple et tenable : pas d'écran 30-60 min avant le coucher, appareil chargé HORS de la chambre (un réveil à 5 € le remplace) : ceux qui essaient constatent l'effet en une semaine.</div>"},
{"t": "Les impacts du numérique (3e)", "q": "La règle « 20-20-20 » contre la fatigue visuelle :", "c": ["2 h d'écran maximum par jour", "20 s d'écran toutes les 20 min", "20 min de pause toutes les 2 h", "toutes les 20 minutes, regarder au loin (~6 m) pendant 20 secondes"], "a": 3, "e": "L'œil « fixe en proche » se crispe : le regard lointain relâche l'accommodation : cligner (on cligne moins devant un écran : yeux secs !) et se souvenir que 6 m est la distance de repos.", "d": "<b>20 min / 6 m / 20 s</b> : la micro-pause qui décrispe l'œil.<div class='ex-detail'><u>Exemple rédigé</u> : le déroulé réel : on lit un écran : l'œil accommode en permanence (muscles crispés, clignements divisés par ~3 : la cornée sèche, picotements) : la pause : lever les yeux vers la fenêtre, le bout de la rue : les muscles relâchent, les larmes s'étalent : à mettre en place avec un support concret : minuteur, pause placée au moment de réfléchir (pas seulement au moment d'ennuyer) : compléments : écran à hauteur des yeux (pas en bas !), luminosité adaptée à la pièce.</div>"},
{"t": "Les impacts du numérique (3e)", "q": "« Le numérique est dématérialisé » :", "c": ["vrai si on trie ses e-mails", "vrai", "vrai uniquement pour le cloud", "faux : il a un corps (métaux rares, usines, data centers, électricité : l'équivalent de villes pour les plus grands)"], "a": 3, "e": "Serveurs, climatisation, métaux : le « sans papier » n'est pas « sans matière » : chaque requête a une empreinte, et l'IA la fait exploser.", "d": "<b>Faux</b> : le cloud a des usines, des mines et des factures d'électricité.<div class='ex-detail'><u>Exemple rédigé</u> : l'inventaire du concret : ton e-mail voyage par des câbles (dont sous-marins !), des routeurs, des serveurs dans des bâtiments refroidis 24h/24 : les data centers consomment ~1-2 % de l'électricité mondiale (l'entraînement des IA fait monter la courbe) : un smartphone contient ~50 métaux, dont des « terres rares » aux mines discutées : les ordres de grandeur à retenir pour réfléchir (pas pour culpabiliser) : 1 e-mail court ≈ 0,2 g CO2 : 1 Go de stockage 1 an ≈ quelques dizaines de kg : l'objectif du chapitre : usage LUCIDE (garder son appareil, éviter le tout-jeter) : usage PARALYSÉ (ne plus rien envoyer).</div>"},
{"t": "Les impacts du numérique (3e)", "q": "Un article choquant, sans source, partagé avec « URGENT » : le réflexe correct :", "c": ["le commenter avec colère", "vérifier la source, croiser avec d'autres médias, et se méfier : l'émotion est l'outil classique de la désinformation", "partager vite pour prévenir les autres", "le supprimer sans le lire"], "a": 1, "e": "La précipitation émotionnelle est le carburant des fausses informations : dater, sourcer, croiser : trois gestes avant tout partage.", "d": "<b>Vérifier avant de partager</b> : l'hygiène informationnelle.<div class='ex-detail'><u>Exemple rédigé</u> : la méthode en 4 gestes : 1. La SOURCE (qui parle ? un média identifiable ? un site inconnu ?) : 2. La DATE (une vraie photo d'il y a 10 ans « re-contextualisée » est une désinformation classique) : 3. Le CROISEMENT (aucun autre média n'en parle ? suspect) : 4. L'ÉMOTION (la colère et la peur font cliquer AVANT de réfléchir : c'est recherché !) : le test de l'intention : « est-ce que je partage parce que c'est vérifié, ou parce que ça m'indigne ? » : les organismes de fact-checking (AFP, etc.) font ce travail gratuitement.</div>"},
{"t": "Les impacts du numérique (3e)", "q": "Sur Internet, la loi :", "c": ["s'applique (injures, diffamation, menaces, harcèlement sont punissables : avec des preuves numériques)", "ne s'applique pas", "s'applique seulement aux adultes", "s'applique seulement aux achats"], "a": 0, "e": "Pseudonyme ≠ impunité : les faits commis en ligne relèvent des mêmes qualifications, avec des preuves plus faciles à conserver (captures datées).", "d": "<b>La loi s'applique en ligne</b> : le pseudo n'est pas un bouclier.<div class='ex-detail'><u>Exemple rédigé</u> : les principes : une injure publiée en ligne est une injure PUBlique (circonstance aggravante : l'ampleur de la diffusion compte !) : la diffamation, les menaces, le harcèlement répété (y compris entre mineurs, avec un régime adapté) sont punissables : les traces (IP, identifiants, captures) rendent les enquêtes possibles : le RGPD garantit aussi SES droits d'effacement sur ses propres données : la règle de conduite la plus rentable : « dirais-je cela en face, signé de mon nom ? » : si NON, la pudeur juridique rejoint la pudeur sociale.</div>"},
{"t": "Internet et le Web (2de)", "q": "La différence entre Internet et le Web :", "c": ["aucune, ce sont deux noms du même objet", "le Web est le réseau, Internet le service", "le Web est plus ancien qu'Internet", "Internet est le réseau (infrastructure) : le Web est un service de pages liées qui l'utilise"], "a": 3, "e": "Internet (années 1970, TCP/IP) est le socle : le Web (1989, Berners-Lee) est une couche au-dessus, comme le mail ou la messagerie.", "d": "<b>Réseau vs service</b> : la hiérarchie à retenir.<div class='ex-detail'><u>Exemple rédigé</u> : la métaphore qui fixe l'idée : Internet = le réseau routier (routes, panneaux, règles communes) : le Web = UN type de véhicule de services, à côté du camion du mail, de la messagerie, du streaming, des objets connectés : la preuve : on peut envoyer un mail sans JAMAIS ouvrir une page web : et les objets connectés « sur Internet » ne consultent aucune page : ils parlent directement aux serveurs. Piège d'examen : « le Web a été inventé en 1969 » : NON, c'est le réseau ancêtre d'Internet (ARPANET) : le Web date de 1989-1991.</div>"},
{"t": "Internet et le Web (2de)", "q": "Le rôle du DNS :", "c": ["accélérer les pages", "traduire le nom de domaine en adresse IP", "crypter les données", "stocker les sites"], "a": 1, "e": "L'annuaire : on désigne les machines par des noms lisibles, le réseau exige des IP numériques : le DNS fait la traduction en quelques millisecondes.", "d": "<b>Le traducteur nom ⟹ IP</b> : l'annuaire universel.<div class='ex-detail'><u>Exemple rédigé</u> : le test du quotidien : taper « wikipedia.org » : le navigateur interroge un serveur DNS : réponse « 91.198.174.192 » : la requête part vers l'IP : page affichée : c'est invisible et vital (panne de DNS = plus AUCUN nom ne fonctionne, alors que les IP marchent encore !) : à retenir aussi : plusieurs machines peuvent répondre pour un même nom (répartition de charge : des millions de requêtes réparties) : et le DNS a une mémoire (cache : pourquoi un site « met du temps à revenir » après un changement d'adresse !).</div>"},
{"t": "Internet et le Web (2de)", "q": "Une page web est écrite principalement en :", "c": ["HTML (structure) + CSS (style) + JavaScript (interactivité)", "français", "Python", "binaire pur"], "a": 0, "e": "Le trio du web : HTML structure, CSS habille, JavaScript anime : le navigateur interprète les trois côté client.", "d": "<b>HTML + CSS + JavaScript</b> : les trois briques du navigateur.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve visible : clic droit sur n'importe quelle page → « Afficher la source » : le HTML apparaît (<h1> pour les titres, <p> pour les paragraphes, <a href> pour les LIENS hypertextes — l'invention fondatrice de 1989 !) : le CSS vit souvent dans un fichier séparé (couleurs, tailles, disposition) : le JavaScript réagit (clic, vérification de formulaire) : un exercice SNT classique : écrire une page minimale dans un fichier .html et l'ouvrir : 10 lignes suffisent pour faire partie du Web, pas seulement le consulter.</div>"},
{"t": "Internet et le Web (2de)", "q": "Le lien hypertexte est l'élément :", "c": ["une nouveauté des années 2010", "un type d'adresse IP", "un virus", "l'invention fondatrice du Web (1989, Berners-Lee) : relier les documents entre eux"], "a": 3, "e": "Avant le web, on cherchait les documents les uns après les autres : le lien permet de SAUTER : et la licence du web a été laissée gratuite par son inventeur.", "d": "<b>L'invention qui a tout changé</b> : le saut instantané.<div class='ex-detail'><u>Exemple rédigé</u> : le monde d'avant : retrouver un document = connaître SA localisation exacte (le FTP d'un serveur précis) : l'idée de Berners-Lee au CERN (1989) : chaque document pointe vers d'autres par des liens cliquables (&lt;a href='https://...'&gt;) et une URL UNIQUE le désigne : en 2 ans, le web se répand : et le geste fondateur qui mérite d'être connu : la licence de l'invention a été déposée GRATUITEMENT dans le domaine public (contrairement au brevet possible !) : le web appartient à tous : c'est un choix politique autant que technique, et il explique son adoption mondiale.</div>"},
