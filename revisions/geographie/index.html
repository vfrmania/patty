{"t": "La mondialisation : flux et réseaux (Lycée)","q": "Une zone franche (par exemple les ZES chinoises des années 1980) fonctionne comme :","c": ["un parc national","un territoire aux règles économiques dérogatoires (impôts allégés, douanes facilitées) conçu pour attirer les IDE et s'insérer dans la mondialisation","un espace militaire","un espace agricole"],"a": 1,"e": "Shenzhen, villages il y a quarante ans, est devenue une mégapole de 17 millions d'habitants grâce à son statut de zone économique spéciale : la mondialisation se « prend » aussi par des dispositifs juridiques localisés.","d": "<b>Prendre la mondialisation par le droit.</b><div class='ex-detail'><u>Exemple rédigé</u> : une zone franche combine détaxation, douanes allégées et procédures simplifiées pour attirer les investisseurs. Cas d'école : les ZES chinoises (Shenzhen, 1980) : usines, capitaux de Hong Kong, main-d'œuvre migrante — la ville passe de 30 000 à 17 millions d'habitants et devient la « Silicon Valley matérielle » chinoise (Huawei, Tencent). Autres exemples : les zones franches de Dubaï (Jebel Ali), les maquiladoras mexicaines, les zones économiques spéciales africaines. Analyse critique : les effets d'entraînement sont réels mais inégaux (concurrence entre zones, dumping social et fiscal, situations de travail contestées). <b>Piège</b> : une zone franche n'est pas « hors la loi » : c'est un droit d'exception créé par l'État pour capter les flux — le paradoxe d'une mondialisation faite de règles locales.</div>"},
{"t": "La mondialisation : flux et réseaux (Lycée)","q": "Les « marges » de la mondialisation sont :","c": ["les bordures de feuilles","les aéroports","des territoires faiblement connectés aux flux : États enclavés (Nepal, Bolivie, pays sahéliens), régions enclavées du Nord, espaces enclavés dans les pays","les capitales"],"a": 2,"e": "L'enclavement (sans accès à la mer, à un corridor, à haut débit) coûte cher : les pays enclavés d'Afrique paient leurs importations nettement plus cher ; les marges existent aussi au cœur du Nord (« diagonale du vide » française, Appalaches américaines).","d": "<b>Les oubliés du réseau.</b><div class='ex-detail'><u>Exemple rédigé</u> : les marges se définissent par le rapport aux flux : un État enclavé comme le Tchad doit importer à travers plusieurs frontières (surcoûts de transport, dépendance aux corridors et aux voisins), un Sahel peu câblé reste hors des circuits financiers. Mais la marge n'est pas seulement géographique : la « diagonale du vide » française, les Appalachiens américains ou le Mezzogiorno italien sont des marges DANS le Nord — déindustrialisation, éloignement des métropoles, exode des jeunes. Nuance importante : une marge peut devenir une ressource (le tourisme au Nepal, les données au Kazakhstan) et une périphérie peut réintégrer le réseau (les nouvelles routes transsahariennes). <b>Piège</b> : ne pas confondre « marge » et « pauvreté » : la marge est une position dans le réseau — l'explication doit toujours être relationnelle.</div>"},
{"t": "Mers et océans : un monde maritimisé (Lycée)","q": "La « maritimisation » désigne :","c": ["un sport nautique","le poids croissant des mers dans l'économie et la société : commerce, ressources, littoralisation des populations","la disparition des océans","la pêche aux crustacés"],"a": 1,"e": "Environ 80 % du commerce mondial passe par la mer, plus de 95 % des données par câbles sous-marins, 40 % de l'humanité vit près d'une côte : les mers concentrent les enjeux.","d": "<b>Le monde tourné vers la mer.</b><div class='ex-detail'><u>Exemple rédigé</u> : la maritimisation se lit sur trois cartes. 1) Le commerce : les autoroutes de la mer (Asie-Europe via Suez, transpacifiques) et leurs goulots (Ormuz, Malacca, Suez, Panama). 2) Les ressources : un quart du pétrole vient de l'offshore, la pêche nourrit des milliards de personnes, les nodules polymétalliques des grands fonds alimentent les appétits miniers. 3) Les hommes : les littoraux se peuplent (littoralisation), les façades maritimes (l'Asie orientale, la Northern Range, la côte Est américaine) concentrent métropoles et richesses. <b>Piège</b> : la maritimisation n'est pas seulement économique : c'est aussi une attractivité résidentielle et touristique qui met les populations en danger (la montée des eaux) — toujours présenter les deux faces.</div>"},
{"t": "Mers et océans : un monde maritimisé (Lycée)","q": "Selon la convention de Montego Bay (1982), la zone économique exclusive (ZEE) s'étend jusqu'à :","c": ["1 mille marin","500 milles","1000 kilomètres","200 milles marins depuis la côte : l'État côtier y a des droits économiques (exploration, exploitation des ressources)"],"a": 3,"e": "Dans les 12 premiers milles (eaux territoriales), la souveraineté est totale ; dans la ZEE (jusqu'à 200 milles), l'État n'a que des droits économiques ; au-delà commence la haute mer, bien commun de l'humanité.","d": "<b>Droits économiques, pas souveraineté.</b><div class='ex-detail'><u>Exemple rédigé</u> : Montego Bay (1982) découpe l'océan en étages : les eaux territoriales (12 milles : souveraineté totale, navigation innocente garantie pour les tiers), la ZEE (jusqu'à 200 milles : droits souverains pour l'exploration et l'exploitation des ressources de l'eau, du sol et du sous-sol ; le pavillon et la circulation des tiers restent libres), le plateau étendu (jusqu'à 350 milles, sur dossier scientifique prouvé devant la Commission des limites), puis la haute mer (liberté de navigation, les fonds gérés comme « patrimoine commun de l'humanité » par l'Autorité internationale des fonds marins). Exemple d'application : la France, grâce à ses outre-mer, cumule la deuxième ZEE du monde (environ 10,2 millions de km², 97 % ultramarine). <b>Piège</b> : écrire que la France est « souveraine » sur sa ZEE est faux : elle y exerce des droits économiques — la souveraineté s'arrête aux eaux territoriales.</div>"},
{"t": "Mers et océans : un monde maritimisé (Lycée)","q": "Les « biens communs de l'humanité » en mer désignent surtout :","c": ["les plages privées","la haute mer et les grands fonds : des espaces gérés sous l'égide de l'ONU (AIFM) pour le bénéfice de tous et pas appropriables par un État","les ports militaires","les piscines"],"a": 1,"e": "Le principe (partie XI de Montego Bay) : les ressources des fonds marins au-delà des juridictions nationales appartiennent à l'humanité ; l'Autorité internationale des fonds marins délivre les permis d'exploration minière.","d": "<b>Un bien, pas un vide.</b><div class='ex-detail'><u>Exemple rédigé</u> : le droit de la mer repose sur le principe de liberté de la haute mer (navigation, survol, câbles) mais les ressources des grands fonds y sont déclarées « patrimoine commun de l'humanité » : elles ne peuvent être appropriées par aucun État et leur exploitation doit bénéficier à tous (avec un mécanisme de partage des avantages). L'Autorité internationale des fonds marins (AIFM, la Jamaïque) délivre les permis d'exploration des nodules polymétalliques — un régime aujourd'hui contesté : des États (Nauru) et des entreprises pressent d'exploiter, les scientifiques alertent sur les écosystèmes des grands fonds, et l'accord de 2023 sur la haute mer (BBNJ) crée enfin des outils d'aires protégées en haute mer. <b>Piège</b> : la haute mer n'est pas un « no man's law » ni un espace libre d'appropriation : c'est un bien commun juridiquement qualifié — le vocabulaire exact compte.</div>"},
{"t": "Mers et océans : un monde maritimisé (Lycée)","q": "Les détroits (Ormuz, Malacca) sont stratégiques car :","c": ["ce sont des points de passage obligés des routes maritimes : leur blocage ou leur contrôle paralyse des flux majeurs (pétrole, conteneurs)","ils sont jolis","ils sont très larges","ils séparent deux lacs"],"a": 0,"e": "Environ 20 % du pétrole mondial passe par Ormuz et environ un tiers du commerce conteneurisé par Malacca : des goulots de quelques kilomètres de large portent la mondialisation.","d": "<b>Des goulots mondiaux.</b><div class='ex-detail'><u>Exemple rédigé</u> : un détroit est un passage resserré entre deux terres, obligé sur une route maritime. Chiffres : Ormuz (entre l'Iran et Oman) voit passer environ 20 % du pétrole mondial ; Malacca (entre l'Indonésie, la Malaisie et Singapour) un tiers du commerce conteneurisé et l'essentiel des approvisionnements de l'Asie orientale ; les canaux de Suez et de Panama (artificiels) sont les raccourcis des routes Asie-Europe et transaméricaines. La géopolitique : le blocage de l'Ever Given dans Suez (2021) a coûté des milliards ; l'Iran menace régulièrement Ormuz ; les États-Unis et la Chine se disputent l'influence autour de Malacca ; Singapour est née de ce détroit. <b>Piège</b> : ne pas confondre un détroit (passage naturel) et un canal (creusé) : l'un relève de la géographie, l'autre d'un choix d'ingénierie et de souveraineté (le canal de Suez est égyptien).</div>"},
{"t": "Mers et océans : un monde maritimisé (Lycée)","q": "La mer de Chine méridionale est un point chaud car :","c": ["il n'y a aucun commerce","la Chine y revendique une aire démesurée (les « neuf traits ») face aux ZEE des voisins (Vietnam, Philippines...), avec miliciarisation d'îlots et le refus d'un arbitrage international","elle appartient aux États-Unis","elle est très froide"],"a": 1,"e": "Un tiers du commerce mondial transite par ces eaux : la pêche, les hydrocarbures supposés et la position face à Malacca alimentent la revendication chinoise et la réponse des États-Unis (« liberté de navigation »).","d": "<b>Neuf traits, des dizaines de conflits.</b><div class='ex-detail'><u>Exemple rédigé</u> : la ligne des « neuf traits » (une carte chinoise de 1947) découpe environ 80-90 % de la mer de Chine méridionale, chevauchant les ZEE du Vietnam, des Philippines, de la Malaisie et du Brunei. Les faits : la Chine artificialise et militarise des récifs (îles-pistes, radars) ; un arbitrage de la CPIJ (2016, saisi par les Philippines) a invalidé les droits « historiques » chinois — Pékin rejette la sentence. Les enjeux : un tiers du commerce mondial, les stocks halieutiques vitaux pour les riverains, les hydrocarbures supposés, la maîtrise de l'accès à Malacca. La réponse américaine : les opérations de « liberté de navigation » (FONOPs) défient les limites chinoises. <b>Piège</b> : ne pas écrire « la Chine possède la mer de Chine méridionale » : la phrase exacte attendue est « revendique » — le droit international ne lui a jamais donné raison.</div>"},
{"t": "Mers et océans : un monde maritimisé (Lycée)","q": "L'ouverture du passage du Nord-Est (Arctique) :","c": ["refroidit le climat","réduit le trajet Asie-Europe et ouvre des ressources (hydrocarbures, minerais), d'où une course des États riverains et une demande de régulation","n'a aucun effet","ferme la route de Suez"],"a": 1,"e": "La fonte estivale de la banquise ouvre quelques semaines de navigation entre l'Europe et l'Asie via le nord de la Russie (un tiers de trajet en moins) et rend accessibles des ressources arctiques : routes maritimes russes, ZEE étendues, présence militaire, coopération du Conseil arctique.","d": "<b>La route qui se dégelé.</b><div class='ex-detail'><u>Exemple rédigé</u> : avec le recul de la banquise estivale, la route du Nord-Est le long de la Sibérie raccourcit Rotterdam-Shanghai d'environ un tiers par rapport à Suez. Conséquences : la Russie développe sa route maritime du Nord (brise-glaces nucléaires, ports, taxe de transit), les transporteurs de gaz (le gaz naturel liquéfié) l'empruntent déjà, et les ressources arctiques (hydrocarbures, nickel, terres rares) se rapprochent. Le cadre : les cinq États riverains (Russie, Canada, États-Unis, Danemark, Norvège) ont déposé des dossiers de plateau étendu, l'Arctique est découpé en ZEE, et le Conseil arctique gère la coopération (sous tension depuis 2022). Les critiques : la rentabilité du transit reste modeste, les risques écologiques d'une marée noire arctique seraient catastrophiques. <b>Piège</b> : ne pas écrire que « l'Arctique est terra nullius à saisir » : il est juridiquement découpé comme n'importe quel océan — les conflits sont des conflits de limites, pas de possession.</div>"},
{"t": "Mers et océans : un monde maritimisé (Lycée)","q": "La surpêche se définit comme :","c": ["une technique de cuisine","une pratique sportive","l'élevage de poissons","le prélèvement au-delà de la capacité de renouvellement des stocks : environ un tiers des stocks mondiaux est surexploité"],"a": 3,"e": "Les chiffres de la FAO : environ un tiers des stocks exploités au-delà du seuil biologique et la plupart des autres pleinement exploités : les réponses sont les quotas (la politique commune des pêches de l'UE), les aires marines protégées et la lutte contre la pêche INN (illégale, non déclarée, non réglementée).","d": "<b>Pêcher plus que la mer ne donne.</b><div class='ex-detail'><u>Exemple rédigé</u> : la surpêche se produit quand les captures dépassent la croissance biologique du stock : la population s'effondre (le cas emblématique : la morue de Terre-Neuve, effondrée en 1992 et toujours pas reconstituée malgré le moratoire). Aujourd'hui : environ un tiers des stocks suivis par la FAO sont surexploités, le reste est pour l'essentiel pleinement exploité — peu de marge. Les réponses : quotas (la politique commune des pêches européenne interdit de rejeter les captures), aires marines protégées (l'objectif 30 % en 2030, « 30x30 »), lutte contre la pêche INN (illégale, non déclarée, non réglementée : la traque des navires pirates par satellites), labels (MSC) et aquaculture (qui fournit désormais plus de la moitié du poisson consommé — avec ses propres problèmes : farines de poisson sauvage, pollution des cages). <b>Piège</b> : ne pas confondre « pêche » et « aquaculture » : la seconde dépend souvent de la première (les farines issues de la pêche sauvage nourrissent les cages).</div>"},
{"t": "Mers et océans : un monde maritimisé (Lycée)","q": "La piraterie contemporaine (golfe de Guinée, corne de l'Afrique) :","c": ["concerne uniquement la Méditerranée","a disparu","est un mythe médiéval","sévit sur des routes stratégiques : attaques de pétroliers et de cargos, prises d'otages, et provoque des réponses internationales (escorts, zones à risque, BMP)"],"a": 3,"e": "Le golfe de Guinée est devenu le premier point chaud mondial (le Nigeria et ses delta pétroliers) : les réponses : patrouilles internationales, meilleures pratiques des armateurs (BMP), corridors escortés, forteresses flottantes (les citadelles des équipages).","d": "<b>Attaquer le flux pour rançon.</b><div class='ex-detail'><u>Exemple rédigé</u> : la piraterie moderne prospère là où le flux est riche et l'État faible : la corne de l'Afrique (les Somalie des années 2000-2010 : les pirates du Exxon Valdez de la mondialisation, rançonnant les tankers de Suez) puis le golfe de Guinée (aujourd'hui le premier point chaud : les pétroliers du delta du Niger, prises d'otages des équipages pour rançon). Les causes : l'effondrement étatique (la Somalie), la misère des littoraux pétroliers (les villages du delta, la pollution de Shell comme grievance), les dérèglements de la pêche (les pêcheurs appauvris reconvertis). Les réponses : les coalitions navales (l'opération Atalanta de l'UE, les patrouilles internationales), les mesures d'autoprotection (les « meilleures pratiques » BMP, les citadelles blindées des équipages, les escortes privées) — la piraterie somalienne a été presque éradiquée par la combinaison de tout cela. <b>Piège</b> : ne pas écrire « les pirates » sans les localiser : le golfe de Guinée aujourd'hui, pas « la Somalie » (la géographie du risque bouge — un exercice daté attend des exemples à jour).</div>"},
{"t": "Mers et océans : un monde maritimisé (Lycée)","q": "La littoralisation des populations :","c": ["concerne les fonds marins","correspond à l'installation croissante des hommes sur les littoraux (environ 40 % à moins de 100 km d'une côte), attirés par le commerce, le tourisme et les activités maritimes","est une rumeur","signifie la fin des villes"],"a": 1,"e": "Les côtes attirent (ports, emplois, tourisme, retraite au soleil) mais l'installation se fait parfois sur des zones exposées (les basses terres deltaïques : le Bangladesh, les deltas du Nil et du Mékong) : la concentration et le risque augmentent ensemble.","d": "<b>Vivre au bord.</b><div class='ex-detail'><u>Exemple rédigé</u> : environ 40 % de l'humanité vit à moins de 100 km d'une côte et la part augmente : les ports attirent les industries et les emplois, le tourisme balnéaire transforme les côtes (la Méditerranée, la Costa del Sol, les stations asiatiques), les retraités s'installent (les littoraux français et espagnols gagnent des habitants chaque decade). L'envers : l'artificialisation des côtes (plus d'un tiers du littoral méditerranéen est bétonné), la disparition des milieux (les mangroves défrichées pour les crevettes, les dunes urbanisées) et surtout l'exposition au risque : les deltas (le Bangladesh, le Nil, le Mékong) concentrent population, agriculture et submersion marine — la montée du niveau marin de plusieurs dizaines de centimètres d'ici 2100 met en péril des centaines de millions de personnes. <b>Piège</b> : la littoralisation n'est pas qu'une chance : c'est aussi l'installation du risque — la double lecture est exigée.</div>"},
{"t": "Mers et océans : un monde maritimisé (Lycée)","q": "Les aires marines protégées (AMP) :","c": ["désignent des espaces marins où les usages sont réglementés pour protéger les écosystèmes : l'objectif mondial est de protéger 30 % des océans en 2030","sont des zoos aquatiques","sont des bases militaires","n'existent pas"],"a": 0,"e": "De la réserve intégrale au parc multit usage, les AMP protègent les « nurseries » (mangroves, récifs, herbiers) qui stockent aussi le carbone (« puits bleus ») : leurs faiblesses : les « parcs de papier » sans moyens de contrôle.","d": "<b>Protéger en mer aussi.</b><div class='ex-detail'><u>Exemple rédigé</u> : une AMP est un espace marin où la réglementation limite ou interdit les usages (pêche, ancrage, extraction) pour restaurer les écosystèmes. Exemples : le parc national des Calanques, la réserve naturelle des Bouches de Bonifacio, le parc naturel de la mer de Corail en Nouvelle-Calédonie (l'un des plus grands au monde), la Papahānaumokuākea hawaïenne. Les fonctions : protéger les nurseries (mangroves, récifs, herbiers), reconstituer les stocks de pêche (les « réservoirs » débordent vers les zones exploitées), stocker le carbone (« puits bleus » des littoraux). Les faiblesses : les « parcs de papier » (déclarés mais sans moyens ni contrôles), la pression du tourisme et le moratoire des engins destructeurs. L'agenda : l'objectif « 30x30 » (protéger 30 % de la planète en 2030, dont les océans) et l'accord de 2023 sur la haute mer qui permet enfin de créer des AMP au-delà des juridictions nationales. <b>Piège</b> : une AMP n'est pas un espace « interdit à tout le monde » : c'est un espace réglementé, du noyau strict aux zones d'usages — le mot « protégé » ne veut pas dire « fermé ».</div>"},
{"t": "La France : territoires et aménagement (Lycée)","q": "La zone économique exclusive (ZEE) de la France :","c": ["n'existe pas","est minuscule","concerne uniquement la Bretagne","est la deuxième du monde (environ 10,2 millions de km²), grâce aux outre-mer qui en forment 97 %"],"a": 3,"e": "La convention de Montego Bay (1982) donne à chaque territoire côtier sa ZEE : les DROM et COM (Guadeloupe, Polynésie, Nouvelle-Calédonie, Kerguelen...) cumulent les zones : l'essentiel du domaine maritime français est ultramarin.","d": "<b>La puissance maritime oubliée.</b><div class='ex-detail'><u>Exemple rédigé</u> : grâce à la règle des 200 milles appliquée à chaque territoire habité, la France cumule environ 10,2 millions de km² de ZEE — la deuxième mondiale derrière les États-Unis, devant l'Australie. Clés : la Polynésie française (une ZEE grande comme l'Europe), la Nouvelle-Calédonie, Clipperton, les Kerguelen, Mayotte, la Réunion... : 97 % du domaine maritime est ultramarin. Les enjeux : pêche (le thon du Pacifique), ressources minérales (les nodules autour de la Polynésie), biodiversité (les récifs, les mangroves), surveillance (la Marine nationale, les satellites, les mouvements de protection des océans), influence dans l'Indo-Pacifique (3 millions de Français y vivent avec l'outre-mer). <b>Piège</b> : écrire que la France est « un pays moyennement étendu » en regardant la seule métropole est l'erreur classique : sa véritable superficie, maritime, en fait un des plus grands espaces du monde.</div>"},
{"t": "La France : territoires et aménagement (Lycée)","q": "La métropolisation française se traduit par :","c": ["l'égalité parfaite des territoires","la concentration croissante des habitants, des emplois qualifiés et des fonctions de commandement dans les plus grandes aires urbaines","la fin des campagnes","la disparition des métropoles"],"a": 1,"e": "Paris, Lyon, Marseille, Toulouse, Bordeaux, Nantes, Lille gagnent habitants, sièges sociaux, universités et liaisons internationales — tandis que villes moyennes et espaces ruraux profonds peinent à retenir les jeunes.","d": "<b>Les grandes aires raflent tout.</b><div class='ex-detail'><u>Exemple rédigé</u> : la métropolisation désigne la concentration des fonctions rares (sièges, recherche, industries de conception, aéroports) dans les plus grandes aires urbaines. En France : l'aire parisienne (environ 13 millions d'habitants, la seule ville mondiale française), puis Lyon, Marseille, Toulouse, Bordeaux, Nantes, Lille concentrent universités, laboratoires et emplois supérieurs ; les 22 métropoles institutionnalisées par la loi de 2010-2015 portent les métropoles. L'envers : les villes moyennes (Arles, Nevers, les sous-préfectures) perdent emplois et services, le rural profond se vide — alimentant le débat sur la « France périphérique » et la fracture territoriale. Nuance : la France reste, en Europe, un des pays les moins dominés par sa capitale (le poids de Paris y est plus faible que Londres au Royaume-Uni). <b>Piège</b> : ne pas confondre métropolisation (concentration des fonctions) et urbanisation (part croissante des citadins) : les deux avancent ensemble mais ne se définissent pas pareil.</div>"},
{"t": "La France : territoires et aménagement (Lycée)","q": "La « diagonale du vide » ou « désert français » désigne :","c": ["un quartier de Paris","une autoroute","un désert de sable","les espaces ruraux en déprise du diagonal sud-ouest/nord-est (Massif central, sud du Bassin parisien) où densités et services reculent"],"a": 3,"e": "Un espace de faible densité (les cartes montrent le « S » inversé des densités sous 30 hab/km²) : le raccourci médiatique (« France périphérique ») est à nuancer car ces espaces gardent des atouts et des dynamiques.","d": "<b>Les vides qui débattent.</b><div class='ex-detail'><u>Exemple rédigé</u> : sur les cartes de densité, un « S » inversé traverse la France du sud-ouest ardéchois au nord-est : les densités y sont souvent sous 30 hab/km² (la Creuse ~30, la Lozère ~15). Les réalités : vieillissement, fermeture des services (école, poste, médecin), déprise agricole... mais aussi des dynamiques récentes : néo-ruraux, télétravail post-Covid, tourisme vert, label « villages » des plus beaux, retorn à la terre des jeunes agriculteurs bio. Le débat : le concept de « France périphérique » (Christophe Guilluy) nourrit la lecture politique des gilets jaunes et des votes ; les géographes discutent le terme « désert » (il n'y a pas de désert sans vie, mais des espaces recomposés : la nuance est un exercice en soi). <b>Piège</b> : ne jamais écrire « le désert français est vide » : c'est un espace de faible densité, pas un espace sans habitants ni dynamiques — la nuance est exigée.</div>"},
{"t": "La France : territoires et aménagement (Lycée)","q": "La décentralisation française (lois Defferre 1982-1983, actes I à III) :","c": ["est un traité européen","concerne uniquement Paris","supprime l'État","transfère des compétences des services de l'État vers les collectivités territoriales (régions, départements, communes et intercommunalités)"],"a": 3,"e": "Les régions gagnent le développement économique et les transports (la loi NOTRe de 2015 redécoupe les régions), les départements les routes et la solidarité, les communes et intercommunalités l'urbanisme : l'État garde l'éducation, la justice, la défense.","d": "<b>Partager, pas abandonner.</b><div class='ex-detail'><u>Exemple rédigé</u> : les lois Defferre (1982-83) créent les régions comme collectivités et transfèrent l'exécutif départemental et régional aux élus (les préfets perdent le contrôle a priori). Les actes suivants : l'acte II (2003) inscrit la décentralisation dans la Constitution et crée le référendum local ; l'acte III (2014-2015) fusionne les régions (de 22 à 13 métropolitaines, la loi NOTRe) et renforce les métropoles et les intercommunalités. Le partage actuel : régions (développement économique, lycées, trains TER), départements (routes, collèges, solidarité : le RSA), communes et intercommunalités (urbanisme, écoles primaires), État (éducation nationale, justice, défense, grandes politiques nationales). <b>Piège</b> : la décentralisation n'est pas un « retrait de l'État » : les contrats de plan État-région et les grands projets (LGV, réindustrialisation) montrent que l'État reste l'architecte des grands équilibres.</div>"},
{"t": "La France : territoires et aménagement (Lycée)","q": "Le Grand Paris Express est :","c": ["le réseau de métro automatique de la région parisienne (environ 200 km, 68 gares) destiné à relier les territoires périphériques sans passer par le centre","un bateau","un quartier d'affaires","un autoroutier"],"a": 0,"e": "Le plus grand chantier d'Europe : 4 lignes de métro automatique (les lignes 15, 16, 17, 18) pour mieux relier les pôles (La Défense, Saclay, Roissy, Seine-Amont) : l'ambition : désenclaver les banlieues et mieux répartir l'activité dans la métropole.","d": "<b>Reconfigurer la métropole.</b><div class='ex-detail'><u>Exemple rédigé</u> : le Grand Paris Express : environ 200 km de métro automatique et 68 gares nouvelles (lignes 15, 16, 17, 18), en chantier depuis les années 2010 pour mise en service progressive — le plus grand projet de transport d'Europe. La logique : aujourd'hui, les trajets de banlieue à banlieue imposent de passer par le centre (le modèle en étoile hérité de Haussmann et des chemins de fer) ; le réseau en rocade relie directement les pôles : La Défense, le pôle de Saclay (la « Silicon Valley » française), Roissy, les territoires enclavés de Seine-Saint-Denis et de l'Est. Les débats : les coûts (plus de 35 milliards d'euros), les retards, la question des gares et de l'urbanisation autour, la relégation persistante de certains quartiers (le métro ne suffit pas sans emploi et logement). <b>Piège</b> : le Grand Paris Express n'est pas une simple extension du métro parisien classique : c'est un nouveau réseau de rocade — l'innovation est dans la topologie (relier les périphéries entre elles).</div>"},
{"t": "La France : territoires et aménagement (Lycée)","q": "Les espaces touristiques français :","c": ["n'existent qu'en hiver","se limitent à Paris","sont variés (littoraux, montagnes, villes patrimoniales) : la France est la première destination mondiale (environ 100 millions de visiteurs internationaux par an) et le tourisme pèse environ 7-8 % du PIB","ne concernent pas l'économie"],"a": 2,"e": "Les littoraux (la Côte d'Azur, le Languedoc aménagé par la mission Racine dans les années 1960), les montagnes (les stations créées par l'État, le « Plan neige » de 1964), les villes patrimoniales (Paris, les châteaux de la Loire, les villes d'art) : un tourisme massif qui façonne les territoires.","d": "<b>Le premier pays visité du monde.</b><div class='ex-detail'><u>Exemple rédigé</u> : avec environ 100 millions d'arrivées internationales, la France est la première destination mondiale et le tourisme pèse environ 7-8 % du PIB. Trois aménagements emblématiques : 1) les stations balédures : la mission Racine (1963-1983) aménage le Languedoc-Roussillon (la Grande-Motte, Port-Camargue) — l'État aménageur « tourné vers la mer » ; les critiques actuelles (bétonnage, submersion marine avec la montée des eaux, érosion) alimentent les projets de « recul stratégique » (le renoncement à défendre certaines plages). 2) les montagnes : le « Plan neige » (1964) crée les stations intégrées (les Arcs, Avoriaz, Tignes) ; aujourd'hui le changement climatique met en danger le ski (le manque de neige, les canons à neige, la diversification estivale : le vélo, la randonnée). 3) les villes patrimoniales : Paris, le Mont-Saint-Michel, les châteaux de la Loire : la fréquentation pose le problème de la « sur-tourisme » (Barcelone, Venise, mais aussi les gorges du Verdon ou le Mont-Saint-Michel (les navettes obligatoires). <b>Piège</b> : le tourisme n'est pas une « économie secondaire » : c'est un secteur majeur mais saisonnier et fragile (la pandémie l'a prouvé : la première filière sinistrée).</div>"},
{"t": "La France : territoires et aménagement (Lycée)","q": "Les fonds européens (fonds structurels, FEDER) servent à :","c": ["soutenir les régions européennes en retard de développement : la France en reçoit pour ses régions les moins dynamiques","rembourser les États","financer les Jeux olympiques","financer uniquement les agriculteurs"],"a": 0,"e": "La politique de cohésion de l'UE (environ un tiers du budget européen) finance les régions les moins développées (les Outre-mer français, les anciennes régions industrielles) : un acteur de l'aménagement souvent oublié mais essentiel.","d": "<b>Bruxelles, aménageur discret.</b><div class='ex-detail'><u>Exemple rédigé</u> : la politique régionale de l'UE (politique de cohéson) représente environ un tiers du budget européen : le FEDER (infrastructures, innovation), le FSE (formation et emploi) et le FEAER (rural) ciblent les régions en retard. En France : les Outre-mer (les régions ultramarines sont éligibles aux fonds de convergence, les plus dotés), les anciennes régions industrielles (le Nord, la Lorraine), les zones rurales en reconversion. Les effets : les fonds cofinancent des routes, des pôles de compétitivité, des reconversions (les friches du bassin minier, le Louvre-Lens comme équipement culturel régional financé en partie par l'Europe). <b>Piège</b> : l'UE n'a pas de compétence d'« aménagement du territoire » au sens national : elle agit par des cofinancements conditionnés — la réponse attendue précise que l'argent européen accompagne (il ne remplace pas) les politiques nationales et régionales.</div>"},
{"t": "La France : territoires et aménagement (Lycée)","q": "La « fracture territoriale » désigne :","c": ["un jeu télévisé","la séparation des départements","les écarts perçus et réels entre les territoires dynamiques (métropoles connectées) et les espaces qui se sentent oubliés (villes moyennes, périphéries, zones rurales) : services publics, santé, transports","une faille géologique"],"a": 2,"e": "Les manifestations : les « déserts médicaux » (les médecins manquent dans les zones rurales et les quartiers), la fermeture des services publics, la couverture mobile insuffisante : le sentiment de relégation a nourlu des mobilisations comme les gilets jaunes, nés justement des territoires périurbains dépendants de la voiture.","d": "<b>Le sentiment d'être oublié.</b><div class='ex-detail'><u>Exemple rédigé</u> : la fracture territoriale combine des écarts objectifs (espérance de vie, accès aux soins (les déserts médicaux : les zones sans médecin (les patients conduisent une heure pour un spécialiste : les médias (les cartes des déserts médicaux (les régions (le privé (les installations (les incitations financières (les zones (les résultats (le débat)))))))) et une expérience vécue : la fermeture des services (école, poste, gendarmerie, banque), la couverture mobile et la fibre en retard, la dépendance automobile. Le mouvement des gilets jaunes (2018) en est l'illustration : né des rond-points des zones périurbaines et rurales, il a imposé le thème des « territoires oubliés » dans le débat public. Les réponses : maisons France services, plan fibre, incitations pour les médecins, une partie du plan de relance et des programmes comme « Action cœur de ville » (les villes moyennes) ou « Petites villes de demain ». <b>Piège</b> : la fracture n'est pas seulement objective (les chiffres) mais perçue (le sentiment de relégation) : les deux dimensions doivent figurer dans une réponse complète.</div>"},
{"t": "La France : territoires et aménagement (Lycée)","q": "Les territoires ultramarins français (DROM, COM) :","c": ["sont des colonies britanniques","n'ont aucune particularité","sont tous indépendants","cumulent handicaps (éloignement, chômage, coûts de la vie) et atouts (ZEE, jeunesse, biodiversité) avec des statuts variés allant de l'intégration (la loi commune) à l'autonomie (la Nouvelle-Calédonie)"],"a": 3,"e": "Guadeloupe, Martinique, Guyane, La Réunion, Mayotte (DROM) et les COM (Polynésie, Saint-Pierre-et-Miquelon, Wallis-et-Futuna...) : des situations contrastées (la Guyane et le Centre spatial guyanais, la Nouvelle-Calédonie et son avenir institutionnel, Mayotte et l'immigration).","d": "<b>La France des cinq océans.</b><div class='ex-detail'><u>Exemple rédigé</u> : les outre-mer offrent à la France une présence sur tous les océans (la devise « La France des cinq océans »). Les handicaps : l'éloignement (les coûts), le chômage supérieur à l'hexagone, la vie chère (l'insularité), les contraintes (les distances de la Guyane : la taille de l'Autriche pour 300 000 habitants). Les atouts : la deuxième ZEE mondiale (97 % ultramarine), la biodiversité (les récifs, la forêt amazonienne de la Guyane), la jeunesse de la population, des positions stratégiques (Kourou et le Centre spatial guyanais, la base militaire de Djibouti pour La Réunion et Mayotte dans l'océan Indien, la Polynésie dans le Pacifique). Les statuts : les DROM suivent les lois nationales avec adaptations ; les COM ont plus d'autonomie ; la Nouvelle-Calédonie vit un processus institutionnel inédit (les accords de Matignon et de Nouméa, les référendums d'indépendance rejetés de justesse mais la question reste ouverte). <b>Piège</b> : ne pas écrire « les colonies françaises » : le vocabulaire officiel (DROM, COM) reflète des statuts juridiques précis — l'erreur de vocabulaire coûte des points.</div>"},
{"t": "La France : territoires et aménagement (Lycée)","q": "L'aménagement du territoire, en France, se définit comme :","c": ["le partage des terres agricoles","l'action volontaire des pouvoirs publics pour réduire les écarts entre les territoires et améliorer l'attractivité : un objectif ancien (la DATAR, 1963) devenu un partage État/collectivités","la construction de stades","une politique européenne uniquement"],"a": 1,"e": "De la DATAR (1963, les grands équilibres nationaux) aux contrats de plan État-région et aux lois de décentralisation, l'aménagement vise l'équité (l'accès aux services partout) et la compétitivité (les pôles de compétitivité, les métropoles) : deux objectifs parfois en tension.","d": "<b>Réduire les écarts, renforcer l'attractivité.</b><div class='ex-detail'><u>Exemple rédigé</u> : l'aménagement du territoire naît en France avec la DATAR (1963, Délégation à l'aménagement du territoire et à l'action régionale) : l'État volontariste des Trente Glorieuses (les villes nouvelles, les zones industrielles portuaires comme Fos-sur-Mer et le Verdon, la décentralisation industrielle). Les outils évoluent : après la décentralisation, les contrats de plan État-région (l'État et les régions cofinancent les projets), les pôles de compétitivité (2004, pour la compétitivité), les programmes récents (Action cœur de ville, Petites villes de demain, France Très Haut Débit). Les deux philosophies en tension : l'équité (le même accès aux services partout : le masque de la fracture territoriale) et la compétitivité (concentrer les moyens là où ça gagne : le débat métropoles/villes moyennes). <b>Piège</b> : l'aménagement n'est plus « l'État seul » : c'est un système multi-acteurs (État, régions, intercommunalités, UE, privés) — une réponse qui ne cite que l'État est incomplète.</div>"}];

    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();
  if (t === 'quiz') {
    var bar = document.getElementById('quiz-chapbar');
    if (currentChap && META_BY_ID[currentChap]) { bar.innerHTML = chapHeadHTML(META_BY_ID[currentChap]); startTraining(META_BY_ID[currentChap].theme); }

  if (t === 'prog' || t === 'cours') window.scrollTo({top:0});
}

    h += chapHeadHTML(m);
    h += ficheHTML(currentChap, 1, true);
  } else {
    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
    var i = 1;
    FICHES_DATA.forEach(function(f){ h += ficheHTML(f.id, i); i++; });
  }
  z.innerHTML = h;

// ===== Générateur PDF autonome (A4, Helvetica) — aucune dépendance externe =====
var PDF_CP1252 = { 0x2018:0x91, 0x2019:0x92, 0x201A:0x82, 0x201C:0x93, 0x201D:0x94, 0x201E:0x84, 0x2013:0x96, 0x2014:0x97, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x20AC:0x80, 0x0152:0x8C, 0x0153:0x9C, 0x0160:0x8A, 0x0161:0x9A, 0x0178:0x9F, 0x017D:0x8E, 0x017E:0x9E, 0x192:0x83, 0x2C6:0x88, 0x2032:0xB4, 0x2039:0x8B, 0x203A:0x9B, 0x201E2:0 };
function pdfTranslit(s){
  return s.replace(/\u2212|\u2013|\u2014/g, '-').replace(/[\u2032\u2019]/g, "'")
    .replace(/\u2192|\u21D2|\u21A6/g, '->').replace(/\u2190/g, '<-')
    .replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u2260/g, '!=').replace(/\u2248/g, '~')
    .replace(/\u2208/g, ' in ').replace(/\u2205/g, 'vide').replace(/\u2286/g, 'incl.')
    .replace(/\u221A/g, 'V').replace(/\u00B7|\u2219|\u22C5/g, '*').replace(/\u2022/g, '-')
    .replace(/\u2124/g, 'Z').replace(/\u211D/g, 'R').replace(/\u2115/g, 'N').replace(/\u2119/g, 'P')
    .replace(/\u00A0/g, ' ').replace(/\u202F|\u2009|\u200B|\uFE0F/g, '')
    .replace(/[\u2460-\u2468]/g, function(c){ return (c.charCodeAt(0) - 0x2460 + 1) + ')'; })
    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
}
function pdfEnc(s){
  var out = '';
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }
    else if (PDF_CP1252[c] !== undefined) b = PDF_CP1252[c];
    if (b !== null && b !== undefined) out += String.fromCharCode(b);
  }
  return out;
}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
var PDF_INLINE = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, SMALL:1, SUB:1, SUP:1, A:1, CODE:1, ABBR:1 };
function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';
    } else if (c.nodeType === 1){
      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }
      else if (g === 'B' || g === 'STRONG') pdfSegs(c, true, out);
      else pdfSegs(c, bold, out);
    }
  }
}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'li') segs = [{ t: '- ', b: bold || false }].concat(segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;
  function walk(n){
    for (var c = n.firstChild; c; c = c.nextSibling){
      if (c.nodeType === 3){
        var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;
        var cl = ' ' + (c.className || '') + ' ';
        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }
        emitP();
        if (/^H[1-6]$/.test(g)) emitBlock('h', c, indent);
        else if (g === 'LI') emitBlock('li', c, indent + 16);
        else if (g === 'UL' || g === 'OL') {
          for (var li = c.firstChild; li; li = li.nextSibling){
            if (li.nodeType === 1 && li.tagName === 'LI') { emitBlock('li', li, indent + 16); walk(li); }
          }
        }
        else if (g === 'TABLE' || g === 'THEAD' || g === 'TBODY'){
          for (var tr = c.firstChild; tr; tr = tr.nextSibling){
            if (tr.nodeType !== 1) continue;
            if (tr.tagName === 'TR'){
              var cells = [];
              for (var td = tr.firstChild; td; td = td.nextSibling){
                if (td.nodeType === 1 && (td.tagName === 'TD' || td.tagName === 'TH')){
                  var cs = []; pdfSegs(td, td.tagName === 'TH', cs);
                  cells.push(cs.map(function(x){ return x.t; }).join('').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
                }
              }
              var line = cells.join('   |   ');
              if (line.replace(/\s/g, '') !== '') blocks.push({ type: 'p', segs: [{ t: line, b: false }], indent: indent + 8 });
            } else if (tr.tagName === 'THEAD' || tr.tagName === 'TBODY') walk(tr);
          }
        }
        else if (g === 'P') { emitBlock('p', c, indent); }
        else { var keep = indent; walk(c); indent = keep; }
      }
    }
    emitP();
  }
  walk(root);
  return blocks;
}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    var isTitle = b.type === 'title';
    var size = isTitle ? 15 : (b.type === 'h' ? 12 : 10.5);
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [];
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) words.push({ br: true });
        p.split(' ').forEach(function(w){ if (w !== '') words.push({ w: w, b: s.b }); });
        if (pi < parts.length - 1) {} else { words.push({ sp: true, b: s.b }); }
      });
    });
    var cur = [], len = 0;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, gap: isTitle ? 0 : (b.type === 'h' ? 7 : 4) }); cur = []; len = 0; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      if (wd.sp) { continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
    if (isTitle) lines.push({ rule: true });
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var pages = [], cur = [], y = TOP;
  lines.forEach(function(ln){
    if (ln.rule){
      if (y - 14 < M) { pages.push(cur); cur = []; y = TOP; }
      y -= 12;
      cur.push('0.29 0.27 0.9 RG 1.5 w ' + M + ' ' + y.toFixed(2) + ' m ' + (W - M) + ' ' + y.toFixed(2) + ' l S\n0 0 0 RG 1 w');
      y -= 8;
      return;
    }
    var lh = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh < M) { pages.push(cur); cur = []; y = TOP; }
    y -= (ln.gap || 0);
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      var enc = pdfEnc(pdfTranslit(s.t));
      if (!enc) return;
      cur.push('BT 1 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Tm /F' + (s.b ? 2 : 1) + ' ' + ln.size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
      x += 0.52 * ln.size * enc.length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de géographie</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p><div style="margin:12px 0 0"><input type="text" id="prog-search" oninput="progSearchList(this.value)" placeholder="🔎 Rechercher dans les cours..." style="width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.9rem;font-family:inherit;outline:none"></div><div id="prog-search-results"></div>' + h + '</section>';
})();
// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
</script>
