<script>
var PROGRAMME = [{"n":"Collège","ch":[{"t":"Habiter une métropole","id":"habiter-metropole"},{"t":"Habiter un espace rural","id":"habiter-rural"},{"t":"Habiter un espace de faible densité","id":"habiter-faible-densite"},{"t":"La population mondiale : croissance et répartition","id":"population-mondiale"},{"t":"L'urbanisation du monde","id":"urbanisation"},{"t":"Développement et inégalités dans le monde","id":"developpement-inegalites"}]},{"n":"Lycée","ch":[{"t":"La mondialisation : flux et réseaux","id":"mondialisation"},{"t":"Mers et océans : un monde maritimisé","id":"mers-oceans"},{"t":"La France : territoires et aménagement","id":"france-territoires"}]}];
var COURS_META = [
  {
    "id": "habiter-metropole",
    "theme": "Habiter une métropole (Collège)",
    "niveau": "Collège",
    "titre": "Habiter une métropole",
    "cours": "<div class=\"cours-head\"><h2>Habiter une métropole</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce qu'une métropole ?</h3>\n<ul>\n<li>Une <b>métropole</b> est une grande ville qui concentre population, activités, pouvoirs et liaisons (transports, réseaux) ;</li>\n<li>Exemples : <b>Paris</b> (12 millions d'habitants dans l'aire urbaine), <b>Tokyo</b> (37 millions), <b>Lagos</b> (Nigéria, une des plus grandes d'Afrique).</li>\n</ul>\n\n<h3>2. Les espaces de la métropole</h3>\n<table>\n<tr><th>Espace</th><th>Caractéristiques</th><th>Exemple</th></tr>\n<tr><td><b>centre</b> (quartier d'affaires)</td><td>tours de bureaux, monuments, commerce de luxe ; prix très élevés</td><td>La Défense, Manhattan</td></tr>\n<tr><td><b>quartiers d'habitation</b></td><td>immeubles, maisons ; populations variées</td><td>quartiers pavillonnaires</td></tr>\n<tr><td><b>banlieues</b></td><td>grands ensembles, cités ; parfois difficultés sociales</td><td>banlieues populaires</td></tr>\n<tr><td><b>périphérie / franges</b></td><td>zones commerciales, lotissements récents</td><td>centres commerciaux</td></tr>\n</table>\n\n<h3>3. Vivre en métropole : avantages et inconvénients</h3>\n<ul>\n<li><b>Avantages</b> : emplois, universités, culture (musées, salles), transports en commun, hôpitaux ;</li>\n<li><b>Inconvénients</b> : coût du logement, embouteillages, pollution, bruit, inégalités entre quartiers.</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Métropole » ≠ « capitale » : Tokyo et Lagos sont des métropoles ; toutes les capitales ne le sont pas forcément à l'échelle mondiale.</li>\n<li>Ne pas opposer « ville riche » / « ville pauvre » : les <b>inégalités existent à l'intérieur</b> de chaque métropole.</li>\n<li>« Banlieue » ne veut pas dire « pauvre » : il y a des banlieues très résidentielles (à l'ouest de Paris par exemple).</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('habiter-rural')\">Cours suivant<span class=\"nc-t\"> : Habiter un espace rural</span> →</a></div>"
  },
  {
    "id": "habiter-rural",
    "theme": "Habiter un espace rural (Collège)",
    "niveau": "Collège",
    "titre": "Habiter un espace rural",
    "cours": "<div class=\"cours-head\"><h2>Habiter un espace rural</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce qu'un espace rural ?</h3>\n<ul>\n<li>Un espace <b>rural</b> est un espace à faible densité de population et d'activité <b>agricole</b> dominante (champs, prairies, forêts, villages) ;</li>\n<li>En France, une commune sur quatre environ est rurale et les campagnes accueillent aussi des villes petites et moyennes.</li>\n</ul>\n\n<h3>2. Vivre à la campagne</h3>\n<ul>\n<li><b>Avantages</b> : paysages, calme, coût du logement plus faible que dans les villes ;</li>\n<li><b>Contraintes</b> : distances (aller au collège, au médecin), services plus rares (commerces, médecins), transports en commun limités → la <b>voiture</b> est souvent indispensable.</li>\n</ul>\n\n<h3>3. Des campagnes qui changent</h3>\n<ul>\n<li>L'<b>agriculture</b> reste l'activité visible mais les campagnes se diversifient : tourisme, artisanat, industries légères ;</li>\n<li>De nouveaux habitants s'y installent (<b>néo-ruraux</b>, télétravailleurs) ; certaines campagnes proches des villes « s'urbanisent » (périurbanisation).</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La campagne est vide » : les espaces ruraux sont <b>habités</b> et actifs, avec des densités faibles, pas nulles.</li>\n<li>« Rural = agriculture uniquement » : tourisme, services, artisans, résidentiels…</li>\n<li>Confondre densité (hab./km²) et nombre total d'habitants.</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('habiter-faible-densite')\">Cours suivant<span class=\"nc-t\"> : Habiter un espace de faible densité</span> →</a></div>"
  },
  {
    "id": "habiter-faible-densite",
    "theme": "Habiter un espace de faible densité (Collège)",
    "niveau": "Collège",
    "titre": "Habiter un espace de faible densité",
    "cours": "<div class=\"cours-head\"><h2>Habiter un espace de faible densité</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Des espaces contraignants mais habités</h3>\n<ul>\n<li>Espaces de <b>faible densité</b> : déserts chauds (Sahara), déserts froids (Groenland, Sibérie), hautes montagnes (Alpes, Himalaya), forêts denses (Amazonie) ;</li>\n<li>Contraintes naturelles : <b>chaleur ou froid extrême</b>, sécheresse, altitude, enclavement ;</li>\n<li>Pourtant, ces espaces sont <b>habités</b> : les sociétés s'adaptent (villes oasis, villages de montagne).</li>\n</ul>\n\n<h3>2. Vivre dans un espace de faible densité</h3>\n<ul>\n<li>Habitations adaptées (maisons épaisses au Sahara, chalets en montagne) ; modes de vie liés aux ressources locales ;</li>\n<li>Activités : <b>agriculture irriguée</b> dans les oasis, <b>élevage</b> en montagne (transhumance), <b>tourisme</b> (stations de ski, déserts), <b>ressources</b> (mines, pétrole) ;</li>\n<li>L'<b>État</b> investit parfois pour garder ces territoires habités (routes, écoles, subventions de la politique de la montagne).</li>\n</ul>\n\n<h3>3. Atouts actuels</h3>\n<ul>\n<li>Énergies renouvelables : panneaux solaires au Sahara, éolien, barrages ;</li>\n<li>Tourisme de nature et de culture ;</li>\n<li>Une biodiversité remarquable à protéger.</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Ces espaces sont vides » : <b>faiblement peuplés</b> ≠ inhabités.</li>\n<li>Confondre faible densité (hab./km²) et faible population totale.</li>\n<li>« Le froid/chaleur interdisent toute activité » : les sociétés <b>s'adaptent</b>.</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('population-mondiale')\">Cours suivant<span class=\"nc-t\"> : La population mondiale : croissance et répartition</span> →</a></div>"
  },
  {
    "id": "population-mondiale",
    "theme": "La population mondiale : croissance et répartition (Collège)",
    "niveau": "Collège",
    "titre": "La population mondiale : croissance et répartition",
    "cours": "<div class=\"cours-head\"><h2>La population mondiale : croissance et répartition</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. 8 milliards d'hommes : une croissance récente et spectaculaire</h3>\n<p>La Terre compte environ <b>8 milliards d'habitants</b> (2022). Mais cette population n'a pas toujours été aussi nombreuse ni aussi rapidement croissante :</p>\n<div class=\"fig\"><svg viewBox=\"0 0 430 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Croissance de la population mondiale\">\n  <line x1=\"60\" y1=\"170\" x2=\"410\" y2=\"170\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"60\" y1=\"170\" x2=\"60\" y2=\"20\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"30\" y=\"100\" font-size=\"10\" fill=\"#64748b\" transform=\"rotate(-90 30 100)\">milliards</text>\n  <rect x=\"60\" y=\"155\" width=\"42\" height=\"15\" rx=\"3\" fill=\"#6366f1\"/><text x=\"81\" y=\"149\" font-size=\"10.5\" fill=\"#334155\" text-anchor=\"middle\">1 Md</text><text x=\"81\" y=\"186\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">1800</text><rect x=\"124\" y=\"145\" width=\"42\" height=\"25\" rx=\"3\" fill=\"#6366f1\"/><text x=\"145\" y=\"139\" font-size=\"10.5\" fill=\"#334155\" text-anchor=\"middle\">1.65 Md</text><text x=\"145\" y=\"186\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">1900</text><rect x=\"188\" y=\"132\" width=\"42\" height=\"38\" rx=\"3\" fill=\"#6366f1\"/><text x=\"209\" y=\"126\" font-size=\"10.5\" fill=\"#334155\" text-anchor=\"middle\">2.50 Md</text><text x=\"209\" y=\"186\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">1950</text><rect x=\"252\" y=\"78\" width=\"42\" height=\"92\" rx=\"3\" fill=\"#6366f1\"/><text x=\"273\" y=\"72\" font-size=\"10.5\" fill=\"#334155\" text-anchor=\"middle\">6.10 Md</text><text x=\"273\" y=\"186\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">2000</text><rect x=\"316\" y=\"50\" width=\"42\" height=\"120\" rx=\"3\" fill=\"#6366f1\"/><text x=\"337\" y=\"44\" font-size=\"10.5\" fill=\"#334155\" text-anchor=\"middle\">8 Md</text><text x=\"337\" y=\"186\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">2022</text><rect x=\"380\" y=\"24\" width=\"42\" height=\"146\" rx=\"3\" fill=\"#a5b4fc\" opacity=\".65\" stroke-dasharray=\"5 3\"/><text x=\"401\" y=\"18\" font-size=\"10.5\" fill=\"#334155\" text-anchor=\"middle\">9.70 Md</text><text x=\"401\" y=\"186\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">2050</text>\n  <text x=\"235\" y=\"195\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">2050 : projection ONU (hypothèse moyenne)</text>\n</svg><span class=\"fig-cap\">La population mondiale de 1800 à 2050 : il a fallu des dizaines de milliers d'années pour atteindre 1 milliard d'humains (vers 1800)… et 200 ans de plus pour en compter 8. La croissance s'est accélérée surtout après 1950.</span></div>\n<p>Les étapes de cette croissance à connaître :</p>\n<ul>\n<li>pendant des millénaires, la population mondiale progresse <b>très lentement</b> : environ 1 milliard d'habitants vers 1800 ;</li>\n<li>la <b>révolution industrielle</b> (XIXe siècle) accélère la croissance : 1,65 milliard en 1900 ;</li>\n<li>après 1950, la croissance devient <b>explosive</b> : 2,5 milliards en 1950, 6 milliards en 2000 — on a parlé de « baby-boom mondial » ou d'<b>explosion démographique</b> ;</li>\n<li>aujourd'hui, la croissance <b>ralentit</b> : environ 8 milliards en 2022, et l'ONU projette un plateau vers 10-11 milliards à la fin du XXIe siècle.</li>\n</ul>\n<table>\n<tr><th>Jalon</th><th>Date</th><th>Population mondiale</th></tr>\n<tr><td>1 milliard d'habitants</td><td>vers 1800</td><td>1 Md</td></tr>\n<tr><td>2 milliards</td><td>vers 1927</td><td>2 Md</td></tr>\n<tr><td>3 milliards</td><td>1959</td><td>3 Md</td></tr>\n<tr><td>6 milliards</td><td>1999</td><td>6 Md</td></tr>\n<tr><td>7 milliards</td><td>2011</td><td>7 Md</td></tr>\n<tr><td>8 milliards</td><td>2022</td><td>8 Md</td></tr>\n</table>\n\n<h3>2. Pourquoi cette croissance ? La transition démographique</h3>\n<p>L'explication tient en un modèle : la <b>transition démographique</b>. Toute population passe (ou passera) par quatre phases :</p>\n<ol>\n<li><b>Phase 1 — Ancien régime</b> : natalité et mortalité sont toutes deux élevées ; la population stagne.</li>\n<li><b>Phase 2 — Explosion</b> : la mortalité chute (médecine, hygiène, vaccins, alimentation) alors que la natalité reste élevée : l'écart entre les deux provoque une croissance très rapide.</li>\n<li><b>Phase 3 — Ralentissement</b> : la natalité baisse à son tour (éducation, urbanisation, contraception, place des femmes) ; la croissance faiblit.</li>\n<li><b>Phase 4 — Régime moderne</b> : natalité et mortalité sont basses ; la population est stable (Europe, Japon) voire en déclin.</li>\n</ol>\n<div class=\"fig\"><svg viewBox=\"0 0 430 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Transition demographique\">\n  <line x1=\"60\" y1=\"140\" x2=\"410\" y2=\"140\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"416\" y=\"144\" font-size=\"10\" fill=\"#64748b\">t</text>\n  <line x1=\"60\" y1=\"140\" x2=\"60\" y2=\"15\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <path d=\"M 60 40 C 150 45 220 115 400 118\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/>\n  <text x=\"380\" y=\"112\" font-size=\"10\" fill=\"#dc2626\">mortalit&#233;</text>\n  <path d=\"M 60 38 C 180 42 300 55 400 85\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/>\n  <text x=\"375\" y=\"80\" font-size=\"10\" fill=\"#16a34a\">natalit&#233;</text>\n  <path d=\"M 60 40 L 160 40 C 250 42 320 60 400 100\" fill=\"none\" stroke=\"#6366f1\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n  <text x=\"70\" y=\"30\" font-size=\"9.5\" fill=\"#4f46e5\">population totale</text>\n  <rect x=\"95\" y=\"60\" width=\"120\" height=\"18\" rx=\"4\" fill=\"#4f46e5\" opacity=\".12\"/>\n  <text x=\"155\" y=\"73\" font-size=\"9.5\" fill=\"#4f46e5\" text-anchor=\"middle\">croissance rapide (phase 2)</text>\n</svg><span class=\"fig-cap\">La transition démographique : la mortalité (rouge) chute avant la natalité (vert). L'écart entre les deux courbes correspond à la phase de croissance très rapide de la population (flèche violette).</span></div>\n<div class=\"warn\"><b>Tous les pays n'y sont pas au même stade :</b> l'Europe et le Japon ont terminé leur transition (population vieillissante) ; l'Afrique subsaharienne est encore en phase 2 (forte croissance) ; la Chine et l'Inde sont en phase 3-4. C'est ce décalage qui explique les grandes différences actuelles de croissance entre les régions du monde.</div>\n\n<h3>3. Une répartition très inégale sur la planète</h3>\n<p>Les 8 milliards d'humains ne se répartissent pas uniformément : certaines zones sont très densément peuplées, d'autres quasi vides. Les grands foyers de peuplement concentrent l'essentiel de l'humanité :</p>\n<table>\n<tr><th>Foyer principal</th><th>Population approximative</th><th>Pays concernés</th></tr>\n<tr><td><b>Asie de l'Est</b></td><td>≈ 1,6 milliard</td><td>Chine (deuxième population mondiale depuis 2023), Japon, Corées</td></tr>\n<tr><td><b>Asie du Sud</b></td><td>≈ 2 milliards</td><td>Inde (première population mondiale depuis 2023), Pakistan, Bangladesh</td></tr>\n<tr><td><b>Europe</b></td><td>≈ 750 millions</td><td>de l'Atlantique à l'Oural</td></tr>\n<tr><td><b>Nord-Est américain</b></td><td>≈ 200 millions</td><td>côte Est des États-Unis et sud du Canada</td></tr>\n</table>\n<p>À l'inverse, des espaces presque vides occupent de très grandes surfaces :</p>\n<ul>\n<li>les <b>zones froides</b> (Sibérie, nord du Canada, Groenland, Antarctique) ;</li>\n<li>les <b>zones arides</b> (Sahara, déserts d'Arabie, d'Australie, de Mongolie) ;</li>\n<li>les <b>zones de très haute montagne</b> et la forêt équatoriale dense (Amazonie, Congo).</li>\n</ul>\n\n<h3>4. Pourquoi cette inégale répartition ?</h3>\n<p>Le peuplement s'explique par des <b>contraintes naturelles</b> et surtout par une longue <b>histoire</b> :</p>\n<ul>\n<li><b>Contraintes naturelles</b> : l'eau douce, un climat tempéré, des terres agricoles et des côtes favorables attirent les hommes ; le froid, l'aridité, la malaria des zones humides les repoussent ;</li>\n<li><b>Histoire du peuplement</b> : l'humanité est née en Afrique ; les grandes civilisations agricoles (Mésopotamie, Chine, Inde, vallée du Nil) ont permis de nourrir des populations denses dès l'Antiquité ;</li>\n<li><b>Faits économiques et politiques</b> : les villes, les industries et les ports attirent les migrations internes (ex. littoralisation : de plus en plus d'hommes vivent près des côtes) ;</li>\n<li>Résultat étonnant à retenir : environ <b>90 % de la population mondiale vit dans l'hémisphère nord</b>, et la moitié de l'humanité vit en Asie.</li>\n</ul>\n\n<h3>5. Les défis d'un monde peuplé : nourrir, loger, préserver</h3>\n<p>Une population nombreuse et urbaine pose des défis que la géographie étudie :</p>\n<ul>\n<li><b>Nourrir</b> 8 milliards d'hommes : la révolution verte (engrais, irrigation, semences sélectionnées) a multiplié les rendements après 1950 — mais la faim persiste dans certaines régions (Afrique subsaharienne) alors que d'autres gaspillent ;</li>\n<li><b>Loger et équiper</b> : l'urbanisation galopante (plus de la moitié de l'humanité vit en ville) crée des mégapoles (> 10 millions d'habitants : Tokyo, Delhi, Shanghai…) et des bidonvilles ;</li>\n<li><b>Préserver l'environnement</b> : la croissance démographique, combinée à la croissance économique, pèse sur les ressources (eau, terres, énergie) et le climat ;</li>\n<li><b>Gérer les déséquilibres</b> : régions vieillissantes (Europe, Japon) face à des régions très jeunes (Afrique : âge médian ≈ 19 ans) — ce décalage alimente les débats sur les migrations internationales.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire un croquis de répartition de la population mondiale</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur une carte du monde, comment représenter et légender les grands foyers de peuplement et les espaces quasi vides ?</div><div class=\"etu\"><b>Étape 1 — Choisir la figuré</b> : les foyers se représentent par des taches de couleur forte (rouge) proportionnées à leur population ; les zones vides par des hachures claires ; les villes de plus de 10 millions par des cercles noirs.</div><div class=\"etu\"><b>Étape 2 — Hiérarchiser</b> : Asie du Sud et de l'Est en premier (≈ 3,6 Md réunis), puis Europe, puis foyer américain ; ne pas oublier les foyers secondaires (vallée du Nil, côte atlantique brésilienne).</div><div class=\"etu\"><b>Étape 3 — Légender avec des noms précis</b> : « foyers principaux de peuplement », « espaces faiblement peuplés (contraintes naturelles) », « mégapoles ».</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : un bon croquis montre l'inégalité du peuplement ET en donne les causes (climat, histoire) dans le titre, ex. « Un monde inégalement peuplé, concentré dans quelques foyers ».</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>La population mondiale croît encore, mais de plus en plus <b>lentement</b> : ne pas écrire qu'elle « explose » encore aujourd'hui.</li>\n<li>L'Inde a dépassé la Chine en 2023 : la Chine n'est plus le pays le plus peuplé du monde.</li>\n<li>Densité ≠ population absolue : un petit pays peut être très peuplé en nombre d'habitants mais peu dense s'il est vaste, et inversement (Bangladesh très dense).</li>\n<li>Les espaces vides ne sont pas « inutiles » : le Sahara regorge de ressources (pétrole, gaz, soleil) — la population n'est pas le seul facteur géographique.</li>\n<li>Transition démographique : c'est la <b>mortalité</b> qui baisse d'abord, pas la natalité — l'ordre compte.</li>\n<li>Ne pas confondre <b>accroissement naturel</b> (naissances − décès) et <b>solde migratoire</b> (immigrations − émigrations) : deux moteurs différents de la croissance d'une population.</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('urbanisation')\">Cours suivant<span class=\"nc-t\"> : L'urbanisation du monde</span> →</a></div>"
  },
  {
    "id": "urbanisation",
    "theme": "L'urbanisation du monde (Collège)",
    "niveau": "Collège",
    "titre": "L'urbanisation du monde",
    "cours": "<div class=\"cours-head\"><h2>L'urbanisation du monde</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Un monde majoritairement urbain</h3>\n<p>Depuis 2007, plus de la moitié de l'humanité vit en ville :</p>\n<ul>\n<li><b>57 %</b> de la population mondiale est urbaine aujourd'hui (contre 30 % en 1950) ; l'ONU projette environ <b>68 % en 2050</b> ;</li>\n<li>la croissance urbaine est surtout <b> Sud</b> : l'Afrique et l'Asie concentrent l'essentiel des nouveaux citadins ;</li>\n<li>les <b>métropoles</b> concentrent les fonctions de commandement : finance (la City, Wall Street), sièges sociaux, pouvoir politique, culture ;</li>\n<li>vocabulaire précis :</li>\n</ul>\n<table>\n<tr><th>Terme</th><th>Définition</th><th>Exemples</th></tr>\n<tr><td><b>Mégapole</b></td><td>plus de 10 millions d'habitants (une trentaine, surtout dans le Sud)</td><td>Tokyo (~37 M), Delhi, Shanghai, São Paulo, Lagos</td></tr>\n<tr><td><b>Mégalopole</b></td><td>axe urbain continu de métropoles fusionnées</td><td>Boston-Washington, Tokaido (Japon)</td></tr>\n<tr><td><b>Aire urbaine</b></td><td>ville + couronne périurbaine sous son influence</td><td>aire urbaine de Paris (~13 M habitants)</td></tr>\n</table>\n<div class=\"fig\"><svg viewBox=\"0 0 440 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Part de la population urbaine mondiale\">\n  <line x1=\"45\" y1=\"140\" x2=\"415\" y2=\"140\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"45\" y1=\"140\" x2=\"45\" y2=\"20\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"40\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"end\">100 %</text>\n  <text x=\"40\" y=\"90\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"end\">50 %</text>\n  <text x=\"40\" y=\"145\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"end\">0 %</text>\n  <line x1=\"45\" y1=\"90\" x2=\"415\" y2=\"90\" stroke=\"#e2e8f0\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <polyline points=\"45,127 115,120 185,103 255,90 325,73 395,60\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <circle cx=\"45\" cy=\"127\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"115\" cy=\"120\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"185\" cy=\"103\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"255\" cy=\"90\" r=\"3.5\" fill=\"#4f46e5\" stroke-width=\"0\"/><circle cx=\"325\" cy=\"73\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"395\" cy=\"60\" r=\"3.5\" fill=\"#4f46e5\"/>\n  <text x=\"115\" y=\"155\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">1950</text><text x=\"185\" y=\"155\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">1970</text><text x=\"255\" y=\"155\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">2007</text><text x=\"325\" y=\"155\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">2025</text><text x=\"395\" y=\"155\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">2050</text>\n  <text x=\"255\" y=\"82\" font-size=\"9\" fill=\"#4f46e5\" text-anchor=\"middle\">2007 : bascule, 50 % urbain</text>\n</svg><span class=\"fig-cap\">Part de la population mondiale vivant en ville : 30 % en 1950, 50 % en 2007, 57 % aujourd'hui, environ 68 % projetés en 2050.</span></div>\n\n<h3>2. Villes du Nord et villes du Sud : des modèles différents</h3>\n<p><b>Dans les pays du Nord</b>, la ville s'étale et se recompose :</p>\n<ul>\n<li>le <b>centre ancien</b> : monuments, prix du foncier élevés, <b>gentrification</b> (des populations aisées rénovent les quartiers populaires et en chassent les anciens habitants) ;</li>\n<li>les <b>banlieues</b> : grands ensembles, quartiers prioritaires, politique de la ville ;</li>\n<li>le <b>périurbain</b> : maisons individuelles, dépendance à la voiture, étalement urbain qui consomme les terres agricoles ;</li>\n<li>les réponses : la <b>ville durable</b> — transports en commun (tramways, vélo), densification, réhabilitation des friches, écoquartiers.</li>\n</ul>\n<p><b>Dans les pays du Sud</b>, l'urbanisation est plus rapide que le développement :</p>\n<ul>\n<li>l'<b>exode rural</b> et la forte croissance naturelle gonflent les villes (Lagos : de 300 000 habitants en 1950 à plus de 15 millions aujourd'hui) ;</li>\n<li>environ <b>1 milliard de personnes vivent dans des bidonvilles</b> (Makoko à Lagos, Dharavi à Mumbai) : logement précaire, eau, électricité manquants ;</li>\n<li>l'<b>économie informelle</b> (petits métiers, commerce de rue) est le premier employeur urbain ;</li>\n<li>les services n'ont pas suivi la croissance : l'urbanisation <b>précède</b> le développement.</li>\n</ul>\n\n<h3>3. Des villes inégales</h3>\n<p>Toutes les villes, du Nord comme du Sud, cumulent richesse et pauvreté :</p>\n<ul>\n<li>quartiers dorés (gated communities, records du prix au m²) à côté de bidonvilles ou de quartiers pauvres ;</li>\n<li>les inégalités se lisent dans les prix immobiliers, l'accès aux services, aux écoles, aux espaces verts : les quartiers pauvres sont aussi les moins arborés et les plus exposés aux <b>îlots de chaleur</b> ;</li>\n<li>la géographie sociale d'une ville se <b>cartographie</b> rue par rue : c'est le travail du géographe.</li>\n</ul>\n<div class=\"warn\"><b>Vocabulaire à ne pas confondre :</b> « mégapole » est un seuil chiffré (plus de 10 millions d'habitants), pas un superlatif ; « mégalopole » désigne un axe continu de métropoles fusionnées ; le périurbain n'est pas la campagne (ce sont des urbains en habitat dispersé) ; les classements varient selon les définitions (ville administrative ou aire urbaine).</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la croissance d'une ville du Sud : Lagos</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Lagos (Nigeria) est passée d'environ 300 000 habitants en 1950 à plus de 15 millions : raconter et expliquer cette explosion.</div><div class=\"etu\"><b>Étape 1 — Les chiffres</b> : un doublement tous les 15 ans environ, l'un des rythmes les plus rapides du monde ; les projections évoquent 40 millions vers 2050.</div><div class=\"etu\"><b>Étape 2 — Les moteurs</b> : l'exode rural (les campagnes pauvres du Nigeria), l'explosion démographique naturelle, le rôle économique (le port, le pétrole, Nollywood, l'économie informelle massive).</div><div class=\"etu\"><b>Étape 3 — Les défis</b> : logements (les bidonvilles comme Makoko), transports (les « go-slow » légendaires), eau, électricité, inondations. Ici, l'urbanisation précède le développement : les services n'ont pas suivi la croissance.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : Lagos illustre le modèle urbain du Sud : croissance très rapide, informel dominant, inégalités fortes — mais aussi une ville mondiale en puissance (finance, culture, innovation).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Mégapole = plus de <b>10 millions</b> d'habitants (seuil), pas « très grande ville ».</li>\n<li>Le périurbain n'est pas rural : des habitants urbains en habitat dispersé, dépendants de la voiture.</li>\n<li>Mégalopole = axe continu de métropoles (Boston-Washington, Tokaido), pas une mégapole.</li>\n<li>En 2007, le monde devient urbain à plus de 50 % — pas « depuis toujours » ni en 1950.</li>\n<li>Les Suds ne sont pas les seuls à avoir des bidonvilles : l'habitat précaire existe aussi au Nord (camps, bidonvilles périphériques).</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('developpement-inegalites')\">Cours suivant<span class=\"nc-t\"> : Développement et inégalités dans le monde</span> →</a></div>"
  },
  {
    "id": "developpement-inegalites",
    "theme": "Développement et inégalités dans le monde (Collège)",
    "niveau": "Collège",
    "titre": "Développement et inégalités dans le monde",
    "cours": "<div class=\"cours-head\"><h2>Développement et inégalités dans le monde</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Mesurer le développement : le PIB ne suffit pas</h3>\n<p>Le <b>PIB</b> mesure la richesse produite par un pays — mais pas les conditions de vie. L'<b>IDH</b> (indice de développement humain, PNUD, 1990) combine trois dimensions :</p>\n<ol>\n<li>la <b>santé</b> : espérance de vie à la naissance ;</li>\n<li>l'<b>éducation</b> : années de scolarisation ;</li>\n<li>le <b>niveau de vie</b> : revenu par habitant (en PPA, parité de pouvoir d'achat).</li>\n</ol>\n<p>L'IDH est un indice entre 0 et 1 : environ <b>0,97 pour la Norvège</b>, environ <b>0,40 pour le Niger</b>.</p>\n<div class=\"fig\"><svg viewBox=\"0 0 440 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"IDH comparés\">\n  <line x1=\"60\" y1=\"130\" x2=\"415\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <rect x=\"80\" y=\"40\" width=\"40\" height=\"90\" rx=\"4\" fill=\"#16a34a\"/>\n  <rect x=\"160\" y=\"85\" width=\"40\" height=\"45\" rx=\"4\" fill=\"#eab308\"/>\n  <rect x=\"240\" y=\"95\" width=\"40\" height=\"35\" rx=\"4\" fill=\"#f97316\"/>\n  <rect x=\"320\" y=\"120\" width=\"40\" height=\"10\" rx=\"4\" fill=\"#dc2626\"/>\n  <text x=\"100\" y=\"28\" font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\">0,97</text>\n  <text x=\"180\" y=\"73\" font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\">0,85</text>\n  <text x=\"260\" y=\"83\" font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\">0,75</text>\n  <text x=\"340\" y=\"108\" font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\">0,40</text>\n  <text x=\"100\" y=\"145\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">Norvège</text>\n  <text x=\"180\" y=\"145\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">France</text>\n  <text x=\"260\" y=\"145\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">Inde</text>\n  <text x=\"340\" y=\"145\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">Niger</text>\n  <text x=\"40\" y=\"40\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"end\">1,0</text><text x=\"40\" y=\"90\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"end\">0,5</text><text x=\"40\" y=\"135\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"end\">0</text>\n</svg><span class=\"fig-cap\">IDH comparés (ordres de grandeur) : l'écart Norvège-Niger illustre les contrastes de développement ; la France et l'Inde se situent entre les deux, dans des groupes différents.</span></div>\n<div class=\"warn\"><b>Limite majeure de l'IDH :</b> c'est une <b>moyenne</b> qui masque les inégalités internes (le Qatar riche mais peu scolarisé, les travailleurs migrants invisibles dans les statistiques). D'où les indices complémentaires : IDH ajusté des inégalités, pauvreté multidimensionnelle, ODD.</div>\n\n<h3>2. Des Nords et des Suds multiples</h3>\n<p>Le monde n'est pas binaire ; il faut distinguer, à l'intérieur même du « Sud » :</p>\n<ul>\n<li>les <b>pays émergents</b> (BRICS : Brésil, Russie, Inde, Chine, Afrique du Sud) : croissance forte, montée en puissance — mais pauvretés et inégalités internes massives ;</li>\n<li>les pays en développement « classiques » : IDH moyen, dépendances économiques ;</li>\n<li>les <b>PMA</b> (44 pays les moins avancés, critères de l'ONU : revenu bas, capital humain faible, vulnérabilité — majorité au Sahel).</li>\n</ul>\n<p>Côté « Nord », les contrastes existent aussi : les vieilles puissances qui vieillissent, les pétromonarchies riches mais peu diversifiées. Et dans <b>chaque</b> pays : quartiers pauvres du Nord, ghettos de richesse du Sud.</p>\n\n<h3>3. Pauvreté et inégalités : les grandes tendances</h3>\n<ul>\n<li>la <b>pauvreté extrême</b> (moins de 2,15 $/jour, seuil Banque mondiale 2022) a fortement reculé depuis 1990 — la Chine en a sorti des centaines de millions ;</li>\n<li>mais les inégalités <b>internes</b> augmentent presque partout : le monde devient plus égal <b>entre</b> pays et plus inégal <b>à l'intérieur</b> de chaque pays ;</li>\n<li>les réponses internationales :</li>\n</ul>\n<table>\n<tr><th>Acteur</th><th>Outil</th><th>Objectif</th></tr>\n<tr><td>ONU</td><td>les 17 <b>ODD</b> (2015)</td><td>développement durable pour 2030</td></tr>\n<tr><td>États donneurs</td><td>aide publique au développement</td><td>0,7 % du revenu national (rarement atteint)</td></tr>\n<tr><td>Migrants</td><td>transferts privés (argent envoyé au pays)</td><td>supérieurs à l'aide publique</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — comparer deux pays avec l'IDH</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La Norvège (IDH ~0,97) et le Niger (IDH ~0,40) : expliquer l'écart et ce que l'IDH montre et ne montre pas.</div><div class=\"etu\"><b>Étape 1 — Les composantes</b> : Norvège : espérance de vie ~83 ans, 13 années de scolarisation en moyenne, revenu élevé. Niger : ~62 ans, ~2 ans de scolarisation, revenu très bas : chaque ligne contribue à l'écart.</div><div class=\"etu\"><b>Étape 2 — Ce que l'IDH montre</b> : le développement n'est pas que l'argent — santé et éducation pèsent autant : un pays pétrolier riche mais peu scolarisé ne peut pas « tricher ».</div><div class=\"etu\"><b>Étape 3 — Les limites</b> : moyenne masquant les écarts internes (les travailleurs migrants du Qatar), ignorance de l'environnement et des libertés.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : compléter l'IDH avec d'autres indices (IDH ajusté, pauvreté multidimensionnelle) : c'est la démarche du géographe face aux statistiques.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li><b>Développement ≠ croissance</b> : la croissance produit de la richesse ; le développement améliore les vies (le pétrole sans écoles fait l'un sans l'autre).</li>\n<li>Le PIB/habitant se compare en <b>PPA</b> : un dollar achète plus de choses au Niger qu'en Norvège.</li>\n<li>Les « Suds » ne sont pas tous pauvres : les émergents (Chine) sont des Suds puissants.</li>\n<li>L'IDH est une <b>moyenne</b> : il ne dit rien des inégalités internes.</li>\n<li>Seuil de pauvreté extrême actuel : 2,15 $/jour (Banque mondiale 2022) — pas 1,90 $ (ancien seuil).</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('mondialisation')\">Cours suivant<span class=\"nc-t\"> : La mondialisation : flux et réseaux</span> →</a></div>"

  {
    "id": "mondialisation",
    "theme": "La mondialisation : flux et réseaux (Lycée)",
    "niveau": "Lycée",
    "titre": "La mondialisation : flux et réseaux",
    "cours": "<div class=\"cours-head\"><h2>La mondialisation : flux et réseaux</h2><span class=\"niv\">Lycée</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Des flux massifs et asymétriques</h3>\n<p>La mondialisation est la mise en relation généralisée des territoires par des <b>flux</b> :</p>\n<ul>\n<li><b>marchandises</b> : environ 80 % du commerce mondial voyage par mer (porte-conteneurs géants) ;</li>\n<li><b>capitaux</b> : les places financières (New York, Londres, Tokyo) sont reliées en continu ;</li>\n<li><b>informations</b> : les câbles sous-marins transportent plus de 95 % des données ;</li>\n<li><b>personnes</b> : tourisme international (~1,4 milliard de touristes), migrations de travail et d'études.</li>\n</ul>\n<div class=\"warn\"><b>Des flux asymétriques :</b> 80 % des flux partent, transitent ou arrivent dans les pays du Nord et les émergents ; l'Afrique reste en marge des flux maritimes et financiers. La mondialisation met en relation, mais pas sur un pied d'égalité.</div>\n<div class=\"fig\"><svg viewBox=\"0 0 440 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"La part du transport maritime\">\n  <circle cx=\"220\" cy=\"75\" r=\"52\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"24\"/>\n  <path d=\"M 220 23 A 52 52 0 1 1 219.9 23\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"24\"/>\n  <text x=\"220\" y=\"80\" font-size=\"20\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">80 %</text>\n  <text x=\"220\" y=\"98\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">du commerce mondial par mer</text>\n  <text x=\"220\" y=\"140\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">le reste : air (valeur), terre, pipelines</text>\n</svg><span class=\"fig-cap\">Environ 80 % du commerce mondial (en volume) transite par voie maritime : conteneurisation, porte-conteneurs géants, hubs portuaires (Shanghai, Singapour, Rotterdam).</span></div>\n\n<h3>2. Les acteurs et les réseaux</h3>\n<p>Les acteurs de la mondialisation :</p>\n<ul>\n<li>les <b>FTN</b> (firmes transnationales — Apple, Toyota) : plus de la moitié du commerce mondial est <b>intra-firme</b> (entre filiales d'une même entreprise) ;</li>\n<li>les <b>États</b> : régulation, accords commerciaux, mais aussi protectionnisme ;</li>\n<li>les <b>organisations internationales</b> : OMC (1995), FMI ;</li>\n<li>les <b>villes mondiales</b> : les nœuds du réseau (New York, Londres, Tokyo, Paris, Singapour).</li>\n</ul>\n<p>La structure du réseau mondial :</p>\n<ol>\n<li>les <b>métropoles</b> reliées entre elles forment un « archipel mondial » ;</li>\n<li>les <b>interfaces</b> concentrent les passages : ports, frontières, détroits stratégiques (Ormuz, Malacca, Gibraltar) ;</li>\n<li>les <b>marges</b> restent mal connectées : États enclavés du Sahel, enclaves, territoires en guerre.</li>\n</ol>\n\n<h3>3. Réguler et contester la mondialisation</h3>\n<ul>\n<li>la mondialisation n'est pas un processus naturel : elle est <b>régulée</b> (OMC depuis 1995, accords régionaux, règles sanitaires) ;</li>\n<li>elle est <b>contestée</b> : altermondialisme, souverainisme, critiques des délocalisations ;</li>\n<li>les tensions actuelles : guerre commerciale sino-américaine, « découplages », relocalisations stratégiques (semi-conducteurs, pharmacie), régionalisation des chaînes (nearshoring) ;</li>\n<li>bilan : la mondialisation se poursuit mais se <b>recompose</b> — on parle de « slowbalisation ».</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le trajet d'un smartphone</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire la mondialisation à travers le trajet et la fabrication d'un smartphone.</div><div class=\"etu\"><b>Étape 1 — Les composants</b> : silicium taïwanais (TSMC), écrans coréens ou japonais, mémoires, batteries au lithium (Chili, Australie), assemblage en Chine ou au Vietnam : une chaîne de valeur mondiale fragmentée, chaque étape placée là où elle est la plus compétitive.</div><div class=\"etu\"><b>Étape 2 — La logistique</b> : transport maritime conteneurisé, hubs portuaires (Shanghai, Singapour, Rotterdam), plateformes logistiques, livraison finale : le coût du transport reste marginal dans le prix final.</div><div class=\"etu\"><b>Étape 3 — L'analyse</b> : la valeur se concentre en amont (conception, brevets) et en aval (marque, services) : l'assemblage ne capte qu'une faible part du prix.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la mondialisation est un système de mise en relation <b>inégale</b> — des territoires gagnants (métropoles du Nord et des émergents) et des marges.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>La mondialisation n'est pas homogène : flux asymétriques, marges mal connectées.</li>\n<li>Elle ne date pas de 1990 : première mondialisation au XIXe siècle (chemin de fer, télégraphe, paquebots).</li>\n<li>La « fin de la mondialisation » est un raccourci : les flux se <b>recomposent</b> (régionalisation, réorientation) plus qu'ils ne disparaissent.</li>\n<li>La moitié du commerce mondial est intra-firme : les FTN ne « vendent » pas tout sur un marché ouvert.</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('mers-oceans')\">Cours suivant<span class=\"nc-t\"> : Mers et océans : un monde maritimisé</span> →</a></div>"
  },
  {
    "id": "mers-oceans",
    "theme": "Mers et océans : un monde maritimisé (Lycée)",
    "niveau": "Lycée",
    "titre": "Mers et océans : un monde maritimisé",
    "cours": "<div class=\"cours-head\"><h2>Mers et océans : un monde maritimisé</h2><span class=\"niv\">Lycée</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Un monde maritimisé</h3>\n<p>Les mers concentrent aujourd'hui les enjeux économiques et stratégiques :</p>\n<ul>\n<li>environ <b>80 % du commerce mondial</b> transite par voie maritime ;</li>\n<li>les <b>câbles sous-marins</b> transportent plus de 95 % des données numériques ;</li>\n<li>la <b>pêche</b> : environ 90 millions de tonnes par an ;</li>\n<li>les <b>ressources</b> : un quart des hydrocarbures vient de l'offshore ; les nodules polymétalliques des grands fonds (nickel, cobalt) alimentent les technologies vertes.</li>\n</ul>\n<p>Les littoraux se peuplent : environ <b>40 % de l'humanité vit à moins de 100 km d'une côte</b>. Les façades maritimes (Asie orientale, Northern Range européenne, côte Est américaine) concentrent métropoles et villes mondiales : c'est la <b>littoralisation</b>.</p>\n\n<h3>2. Le droit de la mer et les tensions</h3>\n<p>La convention de <b>Montego Bay</b> (1982) organise l'espace maritime :</p>\n<table>\n<tr><th>Zone</th><th>Limite</th><th>Régime</th></tr>\n<tr><td>Eaux territoriales</td><td>12 milles marins</td><td>souveraineté de l'État côtier</td></tr>\n<tr><td><b>ZEE</b> (zone économique exclusive)</td><td>200 milles</td><td>droits économiques (pêche, ressources) — pas de souveraineté pleine</td></tr>\n<tr><td>Plateau étendu</td><td>jusqu'à 350 milles</td><td>sur dossier scientifique déposé à l'ONU</td></tr>\n<tr><td>Haute mer</td><td>au-delà</td><td>« biens communs de l'humanité » (Autorité internationale des fonds marins)</td></tr>\n</table>\n<ul>\n<li><b>tensions</b> : mer de Chine méridionale (les « neuf traits » chinois face aux voisins), Arctique (ouverture du passage du Nord-Est), piraterie (golfe de Guinée, corne de l'Afrique) ;</li>\n<li><b>surpêche</b> : environ un tiers des stocks est exploité au-delà du seuil de renouvellement ;</li>\n<li>la maritimisation est aussi <b>stratégique</b> : marines de guerre, surveillance des ZEE, route des matières premières.</li>\n</ul>\n\n<h3>3. Littoralisation et pression sur les milieux</h3>\n<ul>\n<li>les littoraux s'<b>artificialisent</b> : ports, aménagements, bétonnage (plus d'un tiers des côtes méditerranéennes) ;</li>\n<li>les villes du littoral s'exposent : montée du niveau marin, submersions marines (tempêtes, cyclones) ;</li>\n<li>les réponses : <b>aires marines protégées</b> (objectif 10 % en 2020, 30 % en 2030), restauration des mangroves et récifs (« infrastructures naturelles »), réglementation de la pêche (quotas).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Les étages du droit de la mer\">\n  <rect x=\"30\" y=\"30\" width=\"40\" height=\"100\" fill=\"#4f46e5\"/>\n  <rect x=\"70\" y=\"30\" width=\"160\" height=\"100\" fill=\"#818cf8\"/>\n  <rect x=\"230\" y=\"30\" width=\"60\" height=\"100\" fill=\"#c7d2fe\"/>\n  <rect x=\"290\" y=\"30\" width=\"130\" height=\"100\" fill=\"#e0e7ff\"/>\n  <text x=\"50\" y=\"24\" font-size=\"9\" fill=\"#475569\" text-anchor=\"middle\">0-12 milles</text>\n  <text x=\"150\" y=\"24\" font-size=\"9\" fill=\"#475569\" text-anchor=\"middle\">12-200 milles : ZEE</text>\n  <text x=\"260\" y=\"24\" font-size=\"9\" fill=\"#475569\" text-anchor=\"middle\">plateau étendu</text>\n  <text x=\"355\" y=\"24\" font-size=\"9\" fill=\"#475569\" text-anchor=\"middle\">haute mer</text>\n  <text x=\"50\" y=\"90\" font-size=\"8.5\" fill=\"#fff\" text-anchor=\"middle\">eaux</text><text x=\"50\" y=\"102\" font-size=\"8.5\" fill=\"#fff\" text-anchor=\"middle\">territoriales</text>\n  <text x=\"150\" y=\"84\" font-size=\"9\" fill=\"#fff\" text-anchor=\"middle\">droits</text><text x=\"150\" y=\"96\" font-size=\"9\" fill=\"#fff\" text-anchor=\"middle\">économiques</text>\n  <text x=\"260\" y=\"90\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">sur dossier</text><text x=\"260\" y=\"102\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">ONU</text>\n  <text x=\"355\" y=\"90\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">biens communs</text><text x=\"355\" y=\"102\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">de l'humanité</text>\n  <text x=\"220\" y=\"146\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">la convention de Montego Bay (1982) découpe l'espace maritime en étages juridiques</text>\n</svg><span class=\"fig-cap\">Les étages du droit de la mer : la souveraineté s'arrête à 12 milles ; la ZEE donne des droits économiques jusqu'à 200 milles ; la haute mer appartient à tous.</span></div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la ZEE française, deuxième du monde</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer pourquoi la France possède la deuxième zone économique exclusive du monde (environ 10,2 millions de km²) et ce que cela représente.</div><div class=\"etu\"><b>Étape 1 — La construction juridique</b> : la convention de Montego Bay (1982) donne à tout État côtier une ZEE de 200 milles ; la France, avec ses outre-mer (Clipperton, Kerguelen, Nouvelle-Calédonie, Polynésie…), cumule les zones autour de chaque territoire — <b>97 % de sa ZEE est ultramarine</b>.</div><div class=\"etu\"><b>Étape 2 — Les ressources</b> : pêche (thon pacifique), nodules polymétalliques, possibles hydrocarbures, biodiversité (récifs, mangroves) : un patrimoine à surveiller (surveillance maritime, Marine nationale, satellites).</div><div class=\"etu\"><b>Étape 3 — Les responsabilités</b> : protéger ces immensités (aires marines protégées, lutte contre la pêche illégale) et en tirer des richesses : un enjeu de souveraineté et d'influence dans l'Indo-Pacifique.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : grâce à l'outre-mer, la France est une puissance maritime mondiale : la « francophonie des mers » complète son statut diplomatique.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>La maritimisation n'est pas la « conquête des océans » : c'est une <b>mise en valeur multiple</b> (transport, ressources, loisirs, stratégies).</li>\n<li>La ZEE n'est <b>pas un territoire souverain</b> : la souveraineté ne s'exerce que dans les 12 milles ; au-delà, des droits économiques.</li>\n<li>Plateau continental juridique ≠ plateau étendu : le second doit être prouvé devant l'ONU (dossier scientifique).</li>\n<li>Montego Bay = <b>1982</b> ; ZEE = <b>200 milles</b> ; eaux territoriales = <b>12 milles</b> : les trois chiffres vont ensemble.</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('france-territoires')\">Cours suivant<span class=\"nc-t\"> : La France : territoires et aménagement</span> →</a></div>"

    "cours": "<div class=\"cours-head\"><h2>La France : territoires et aménagement</h2><span class=\"niv\">Lycée</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Un territoire original : l'Hexagone et l'outre-mer</h3>\n<p>La France métropolitaine (environ 552 000 km², « l'Hexagone ») possède deux atouts géographiques majeurs :</p>\n<ul>\n<li>une situation d'<b>interface</b> : façades atlantique et méditerranéenne, ouverture vers l'Europe du Nord et du Sud ;</li>\n<li>une <b>double ouverture</b> : maritime (ports, littoraux) et continentale (axes rhodaniens, aquitains, nord-européens).</li>\n</ul>\n<p>À l'Hexagone s'ajoutent les <b>DROM</b> (Guadeloupe, Martinique, Guyane, La Réunion, Mayotte) et les <b>COM</b> (Polynésie, Nouvelle-Calédonie, etc.) : avec la deuxième ZEE mondiale (environ 10,2 millions de km², à 97 % ultramarine), le territoire français est à la fois européen, atlantique, méditerranéen — et <b>mondial</b> par l'outre-mer.</p>\n\n<h3>2. Les dynamiques : métropolisation, littoralisation, périurbanisation</h3>\n<ul>\n<li>la France se <b>métropolise</b> : les plus grandes aires urbaines (Paris, Lyon, Marseille, Toulouse, Bordeaux, Nantes, Lille) concentrent habitants, emplois supérieurs, universités, fonctions de commandement ;</li>\n<li>elle se <b>littoralise</b> : les côtes attirent résidents, retraités et touristes ;</li>\n<li>le <b>périurbain</b> s'étend : habitat dispersé, dépendance automobile ; le télétravail post-Covid renouvelle certaines campagnes (« néo-ruraux ») ;</li>\n<li>les espaces en difficulté : villes moyennes fragiles, rural profond vieillissant (la « diagonale du vide »), quartiers prioritaires.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Hiérarchie urbaine française\">\n  <rect x=\"40\" y=\"20\" width=\"60\" height=\"100\" rx=\"4\" fill=\"#4f46e5\"/>\n  <rect x=\"120\" y=\"55\" width=\"50\" height=\"65\" rx=\"4\" fill=\"#818cf8\"/>\n  <rect x=\"190\" y=\"75\" width=\"50\" height=\"45\" rx=\"4\" fill=\"#818cf8\"/>\n  <rect x=\"260\" y=\"90\" width=\"50\" height=\"30\" rx=\"4\" fill=\"#c7d2fe\"/>\n  <rect x=\"330\" y=\"100\" width=\"50\" height=\"20\" rx=\"4\" fill=\"#e0e7ff\"/>\n  <text x=\"70\" y=\"14\" font-size=\"9\" fill=\"#475569\" text-anchor=\"middle\">Paris (~13 M)</text>\n  <text x=\"145\" y=\"49\" font-size=\"9\" fill=\"#475569\" text-anchor=\"middle\">Lyon (2,3 M)</text>\n  <text x=\"215\" y=\"69\" font-size=\"9\" fill=\"#475569\" text-anchor=\"middle\">Marseille (1,9 M)</text>\n  <text x=\"285\" y=\"84\" font-size=\"9\" fill=\"#475569\" text-anchor=\"middle\">Lille (1,2 M)</text>\n  <text x=\"355\" y=\"94\" font-size=\"9\" fill=\"#475569\" text-anchor=\"middle\">villes moyennes</text>\n  <text x=\"220\" y=\"140\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">aires urbaines : une hiérarchie dominée par Paris, mais relayée par de grandes métropoles régionales</text>\n</svg><span class=\"fig-cap\">La hiérarchie urbaine française : Paris domine nettement (macrocéphalie relative), mais les métropoles régionales (Lyon, Marseille, Lille, Toulouse, Bordeaux, Nantes) forment un véritable réseau de contrepoids.</span></div>\n\n<h3>3. Aménager : acteurs, outils, débats</h3>\n<p>Les acteurs de l'aménagement :</p>\n<ul>\n<li>l'<b>État</b> : grands projets (LGV, autoroutes, réindustrialisation), péréquation ;</li>\n<li>les <b>collectivités territoriales</b> : régions, départements, intercommunalités — budgets et compétences accrus depuis les lois de décentralisation (1982, 2015) ;</li>\n<li>l'<b>Union européenne</b> : fonds structurels pour les régions en retard ;</li>\n<li>les <b>acteurs privés</b> : entreprises, promoteurs, associations.</li>\n</ul>\n<p>Les outils : les documents de planification (SCOT, PLU), les stratégies régionales (SRDE), les <b>contrats de plan État-région</b>. Les grands débats :</p>\n<ol>\n<li>le <b>Grand Paris</b> : le plus grand chantier d'Europe (le Grand Paris Express — un métro automatique de 200 km) ;</li>\n<li>métropoles contre villes moyennes : qui finance qui ?</li>\n<li>l'<b>égalité des territoires</b> : services publics en recul dans les zones peu denses (« fracture territoriale ») ;</li>\n<li>la transition écologique des territoires : trame verte, sobriété de l'étalement urbain.</li>\n</ol>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — les contrastes territoriaux français</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le territoire français est-il homogène ? Montrer les contrastes et l'action de l'État.</div><div class=\"etu\"><b>Étape 1 — Les contrastes</b> : l'axe majeur Paris-Lyon-Marseille concentre les hommes et les activités ; les métropoles régionales (Toulouse, Bordeaux, Nantes, Lille) gagnent ; les espaces ruraux vieillissants (« diagonale du vide ») perdent ; les outre-mer cumulent handicaps (éloignement, chômage) et atouts (ZEE, jeunesse, biodiversité).</div><div class=\"etu\"><b>Étape 2 — L'action de l'État</b> : aménagement du territoire, décentralisation (lois 1982-2015), métropolisation encouragée (les 22 métropoles), rééquilibrage (maisons France services, plan fibre), politique de la ville pour les quartiers prioritaires.</div><div class=\"etu\"><b>Étape 3 — Bilan nuancé</b> : les écarts persistent (les aires urbaines gagnent toujours), mais la France reste un des pays européens les moins macrocéphales comparée à ses voisins.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : le territoire français est un système inégal mais polarisé et aménagé : l'État et les collectivités tentent de concilier compétitivité des métropoles et égalité des territoires.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>La France n'est pas « uniquement hexagonale » : les outre-mer sont des territoires français à part entière (2e ZEE mondiale).</li>\n<li>« Désert français » : un raccourci à nuancer — des espaces dynamiques existent hors métropoles (littoraux, villes moyennes attractives, régions frontalières).</li>\n<li>Le <b>Grand Paris Express est un métro</b> automatique, pas un train classique.</li>\n<li>Décentralisation ≠ retrait de l'État : c'est un <b>partage</b> des compétences (l'État garde l'aménagement stratégique, les grandes infrastructures).</li>\n</ul>\n</div>"

    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
// ===== Progression QCM (enregistrement local, navigateur uniquement) =====
var PG_MATIERE = 'geographie';
function pgHash(s){ var h = 5381; for (var i = 0; i < s.length; i++){ h = ((h << 5) + h + s.charCodeAt(i)) | 0; } return (h >>> 0).toString(36); }
function pgKey(){ return 'patty-qcm-pg-' + PG_MATIERE; }
function pgLoad(){ try { return JSON.parse(localStorage.getItem(pgKey()) || '{}'); } catch(e){ return {}; } }
function pgSave(q, ok){
  try {
    var d = pgLoad(); var t = q.t;
    if (!d[t]) d[t] = { n: 0, q: {} };
    d[t].n = QUESTIONS.filter(function(x){ return x.t === t; }).length;
    if (!d[t].q) d[t].q = {};
    d[t].q[pgHash(q.q)] = ok ? 1 : 0;
    localStorage.setItem(pgKey(), JSON.stringify(d));
    pgResume();
  } catch(e) {}
}
function pgReset(){ if (!window.confirm('Réinitialiser la progression de cette matière ?')) return; try { localStorage.removeItem(pgKey()); } catch(e){} pgResume(); }
function pgChap(theme){
  for (var i = 0; i < COURS_META.length; i++){ if (COURS_META[i].theme === theme){ currentChap = COURS_META[i].id; break; } }
  showTab('quiz'); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function pgToggle(){ var e = document.getElementById('pg-chaps'); if (e) e.style.display = (e.style.display === 'none') ? 'flex' : 'none'; }
function pgResume(){
  var el = document.getElementById('pg-resume'); if (!el) return;
  var d = pgLoad(); var ans = 0, ok = 0;
  Object.keys(d).forEach(function(t){ var qq = (d[t] && d[t].q) || {}; Object.keys(qq).forEach(function(h){ ans++; if (qq[h]) ok++; }); });
  if (!ans) { el.style.display = 'none'; return; }
  var tot = QUESTIONS.length || 1;
  var pctA = Math.round(100 * Math.min(ans, tot) / tot);
  var pctR = Math.round(100 * ok / ans);
  var col = pctR >= 70 ? '#4ade80' : (pctR >= 50 ? '#fbbf24' : '#f87171');
  var c = (2 * Math.PI * 14).toFixed(1);
  var h = '<div class="pg-top">';
  h += '<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="5"/><circle cx="17" cy="17" r="14" fill="none" stroke="' + col + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + (c * pctA / 100).toFixed(1) + ' ' + c + '" transform="rotate(-90 17 17)"/></svg>';
  h += '<span><b>' + ans + ' / ' + tot + '</b> questions répondues (' + pctA + ' %) · réussite <b style="color:' + col + '">' + pctR + ' %</b></span>';
  h += '<button class="pg-toggle" onclick="pgToggle()">chapitres ▾</button>';
  h += '<button class="pg-rz" onclick="pgReset()" title="Réinitialiser la progression de cette matière">réinitialiser</button>';
  h += '</div>';
  var byT = {}; QUESTIONS.forEach(function(q){ byT[q.t] = (byT[q.t] || 0) + 1; });
  h += '<div class="pg-chaps" id="pg-chaps" style="display:none">';
  COURS_META.forEach(function(cm){
    var t = cm.theme, n = byT[t] || 0;
    var dt = d[t]; var qa = 0, qo = 0;
    if (dt && dt.q) { Object.keys(dt.q).forEach(function(k){ qa++; if (dt.q[k]) qo++; }); }
    var isOk = n > 0 && qa >= n && (100 * qo / qa) >= 70;
    var cls = qa === 0 ? '' : (isOk ? ' ok' : ' mid');
    var sym = qa === 0 ? '⬜' : (isOk ? '✅' : '🟡');
    var tip = t + ' — ' + qa + '/' + n + ' question' + (n > 1 ? 's' : '') + ' répondues' + (qa ? ' (' + Math.round(100 * qo / qa) + ' % de réussite)' : '');
    h += '<button class="pg-dot' + cls + '" title="' + tip.replace(/"/g, '&quot;') + '" onclick="pgChap(\'' + t.replace(/'/g, "\\'") + '\')">' + sym + ' ' + cm.titre + '</button>';
  });
  h += '</div>';
  el.style.display = 'block';
  el.innerHTML = h;
}

function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  pgSave(state.qs[state.idx], i === state.qs[state.idx].a);
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de géographie</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p><div style="margin:12px 0 0"><input type="text" id="prog-search" oninput="progSearchList(this.value)" placeholder="🔎 Rechercher dans les cours..." style="width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.9rem;font-family:inherit;outline:none"></div><div id="prog-search-results"></div>' + h + '</section>';
})();
// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

function nextCoursHTML(m){
  var i = -1; for (var k = 0; k < COURS_META.length; k++){ if (COURS_META[k].id === m.id){ i = k; break; } }
  var n = COURS_META[i + 1];
  if (!n) return '';
  return '<div class="cours-next"><a onclick="goCours(\'' + n.id + '\')">Cours suivant : <span class="cn-name">' + esc(n.titre) + '</span> →</a></div>';
}
// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + nextCoursHTML(m) + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + nextCoursHTML(c) + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
pgResume();
</script>
