<script>
var PROGRAMME = [{"n": "Collège","ch": [{"t": "La population mondiale : croissance et répartition","id": "population-mondiale"},{"t": "L'urbanisation du monde","id": "urbanisation"},{"t": "Développement et inégalités dans le monde","id": "developpement-inegalites"}]},
{"n": "Lycée","ch": [{"t": "La mondialisation : flux et réseaux","id": "mondialisation"},{"t": "Mers et océans : un monde maritimisé","id": "mers-oceans"},{"t": "La France : territoires et aménagement","id": "france-territoires"}]}];
var COURS_META = [{"id": "population-mondiale","theme": "La population mondiale : croissance et répartition (Collège)","niveau": "Collège","titre": "La population mondiale : croissance et répartition","cours": "<div class=\"cours-head\"><h2>La population mondiale : croissance et répartition</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Où vivent les hommes ? Une répartition inégale</h3>\n<div class=\"tip\">La Terre compte <b>8 milliards d'habitants</b> (2022), mais ils sont très inégalement répartis. Les <b>foyers de peuplement</b> majeurs sont l'Asie de l'Est et du Sud (la Chine, l'Inde : plus d'un tiers de l'humanité), l'Europe et le Nord-Est américain. Les <b>vides</b> sont les déserts chauds (le Sahara), froids (la Sibérie, l'Antarctique), les hautes montagnes et les forêts denses (l'Amazonie). Les <b>facteurs explicatifs</b> : le climat, l'eau (les vallées du Gange et du Yangzi), les sols agricoles, les littoraux et les activités économiques. Plus de la moitié de l'humanité vit à moins de 200 km d'une côte.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire une carte de densité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur une carte de la densité de population mondiale, comment repérer et expliquer les contrastes ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Lire la légende</b> : repérer les seuils de densité (habitants/km²). Les zones de forte densité (plus de 100 hab/km²) apparaissent en foncé : l'Asie du Sud et de l'Est, l'Europe.</div><div class=\"etu\"><b>Étape 2</b> — <b>Localiser</b> : citer trois foyers (l'Asie de l'Est autour du Yangzi, l'Asie du Sud autour du Gange, l'Europe de l'Ouest) et trois vides (le Sahara, la Sibérie, l'Amazonie).</div><div class=\"etu\"><b>Étape 3</b> — <b>Expliquer</b> : la répartition suit d'abord les conditions naturelles (l'eau, le climat), mais aussi l'histoire (les anciennes civilisations agraires) et l'économie. Conclusion : l'eau et l'agriculture structurent le peuplement, et la littoralisation s'accentue.</div></div></details>\n<h3>2. La croissance : transition et vieillissement</h3>\n<div class=\"tip\">La population a explosé (1 milliard vers 1800, 2 en 1927, 8 en 2022) grâce à la <b>transition démographique</b> : la mortalité baisse d'abord (médecine, hygiène, vaccination), la natalité suit avec un décalage, d'où une forte croissance entre les deux. Aujourd'hui, la croissance se concentre en <b>Afrique</b> (le Niger : plus de 6 enfants par femme) tandis que l'Europe, la Chine et le Japon <b>vieillissent</b> : financement des retraites, dépenses de santé, besoin de migrations. Le pic mondial (environ 10 milliards) est attendu vers 2080.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la transition démographique en deux pays</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparer la situation démographique du Niger et celle de la France.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les indicateurs</b> : au Niger, l'indice de fécondité dépasse 6 enfants par femme, l'espérance de vie ~62 ans, la population double en environ 25 ans, la pyramide est large (beaucoup de jeunes). En France, l'IDF ~1,8, l'espérance de vie ~82 ans, la croissance faible, la pyramide « en toupie ».</div><div class=\"etu\"><b>Étape 2</b> — <b>Expliquer</b> : le Niger est en pleine transition (la mortalité a baissé, la natalité reste haute) : pression sur l'école, l'emploi et la nourriture. La France a achevé sa transition : retraites à financer, dépendance des âgés, migrations comme réponse.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : deux mondes démographiques coexistent (les jeunes du Sud, les vieux du Nord) — un des grands déséquilibres du XXIe siècle.</div></div></details>\n<h3>3. Les migrations</h3>\n<div class=\"tip\">Plus de <b>280 millions de migrants internationaux</b> (2020) : les flux vont des Suds vers les Nords (les États-Unis, l'Europe, les pays du Golfe) mais aussi de Sud en Sud. Les causes : les écarts de développement, les conflits (plus de 100 millions de déplacés forcés), le climat (les « migrants environnementaux »), le travail. Les effets : les transferts d'argent vers les pays d'origine (plus de 650 milliards de dollars par an), les diasporas, les débats dans les pays d'accueil.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « surpopulation » est trompeur : la question est la concentration et les ressources. La croissance mondiale ralentit (pic attendu vers 2080). Ne pas confondre migrant (départ volontaire) et réfugié (fuite d'un danger, protégé par la convention de Genève).</div>"},
{"id": "urbanisation","theme": "L'urbanisation du monde (Collège)","niveau": "Collège","titre": "L'urbanisation du monde","cours": "<div class=\"cours-head\"><h2>L'urbanisation du monde</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Un monde urbain</h3>\n<div class=\"tip\">Plus de <b>57 % de l'humanité vit en ville</b> (contre 30 % en 1950), et l'ONU projette environ 68 % en 2050. Les <b>métropoles</b> (Tokyo ~37 millions, Delhi, Shanghai, São Paulo) concentrent les fonctions de commandement : finance (la City, Wall Street), sièges sociaux, politique, culture. Les <b>mégapoles</b> (plus de 10 millions d'habitants : une trentaine, surtout dans le Sud) et les <b>mégalopoles</b> (axes urbains continus : Boston-Washington, Tokaido au Japon) illustrent l'ampleur du phénomène.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la croissance d'une ville du Sud : Lagos</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Lagos (Nigeria) est passée d'environ 300 000 habitants en 1950 à plus de 15 millions : raconter et expliquer cette explosion.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les chiffres</b> : un doublement tous les 15 ans environ, l'un des rythmes les plus rapides du monde ; les projections évoquent 40 millions vers 2050.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les moteurs</b> : l'exode rural (les campagnes pauvres du Nigeria), l'explosion démographique naturelle, le rôle économique (le port, le pétrole, Nollywood, l'économie informelle massive).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les défis</b> : logements (les bidonvilles comme Makoko), transports (les « go-slow » légendaires), eau, électricité, inondations. Ici, l'urbanisation précède le développement : les services n'ont pas suivi la croissance.</div></div></details>\n<h3>2. Villes du Nord : centres, banlieues, périurbain</h3>\n<div class=\"tip\">La ville européenne juxtapose le centre ancien (monuments, prix du foncier élevés, <b>gentrification</b> : les populations aisées rénovent les quartiers populaires et en chassent les anciens habitants), les <b>banlieues</b> (grands ensembles, quartiers prioritaires, politique de la ville) et le <b>périurbain</b> (maisons individuelles, dépendance à la voiture, étalement urbain qui consomme les terres agricoles). Les réponses : la <b>ville durable</b> — transports en commun (tramways, vélo), densification, réhabilitation des friches, écoquartiers.</div>\n<h3>3. Les inégalités urbaines</h3>\n<div class=\"tip\">Toutes les villes cumulent richesse (quartiers dorés, gated communities, records du prix au m²) et pauvreté : environ <b>1 milliard de personnes vivent dans des bidonvilles</b>. Les inégalités se lisent dans les prix immobiliers, l'accès aux services et aux espaces verts (les quartiers pauvres sont aussi les moins arborés et les plus exposés aux îlots de chaleur) : la géographie sociale d'une ville se cartographie rue par rue.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « mégapole » est un seuil chiffré (plus de 10 millions), pas un superlatif. Le périurbain n'est pas la campagne (des urbains en habitat dispersé). « Mégalopole » désigne un axe continu de métropoles fusionnées, pas une très grande ville. Les définitions (ville administrative ou aire urbaine) changent les classements.</div>"},
{"id": "developpement-inegalites","theme": "Développement et inégalités dans le monde (Collège)","niveau": "Collège","titre": "Développement et inégalités dans le monde","cours": "<div class=\"cours-head\"><h2>Développement et inégalités dans le monde</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Mesurer le développement : l'IDH et au-delà</h3>\n<div class=\"tip\">Le <b>PIB</b> (la richesse produite) est insuffisant. L'<b>IDH</b> (indice de développement humain, PNUD 1990) combine trois dimensions : la <b>santé</b> (espérance de vie), l'<b>éducation</b> (années de scolarisation) et le <b>niveau de vie</b> (revenu par habitant). Un indice entre 0 et 1 : la Norvège ~0,97, le Niger ~0,40. Limite majeure : une moyenne masque les inégalités internes — d'où les indices complémentaires (IDH ajusté des inégalités, pauvreté multidimensionnelle).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comparer deux pays avec l'IDH</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La Norvège (IDH ~0,97) et le Niger (IDH ~0,40) : expliquer l'écart et ce que l'IDH montre et ne montre pas.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les composantes</b> : Norvège : espérance de vie ~83 ans, 13 années de scolarisation en moyenne, revenu élevé. Niger : ~62 ans, ~2 ans de scolarisation secondaire, revenu très bas. Chaque ligne contribue à l'écart.</div><div class=\"etu\"><b>Étape 2</b> — <b>Ce que l'IDH montre</b> : le développement n'est pas que l'argent — santé et éducation pèsent autant. Un pays pétrolier riche mais peu scolarisé (le Qatar) ne peut pas « tricher ».</div><div class=\"etu\"><b>Étape 3</b> — <b>Les limites</b> : l'IDH est une moyenne qui masque les écarts internes (les travailleurs migrants du Qatar sont invisibles dans la moyenne) et ignore l'environnement et les libertés. D'où les indices complémentaires.</div></div></details>\n<h3>2. Des Nords et des Suds multiples</h3>\n<div class=\"tip\">Le monde n'est pas binaire. Côté Suds : les <b>pays émergents</b> (BRICS : croissance forte, montée en puissance, mais pauvretés et inégalités internes massives), les pays en développement « classiques » et les <b>PMA</b> (44 pays les moins avancés, critères de l'ONU : revenu bas, capital humain faible, vulnérabilité — majorité au Sahel). Côté Nords : les vieilles puissances qui vieillissent et les pétromonarchies riches mais peu diversifiées. Les contrastes existent aussi DANS chaque pays : quartiers pauvres du Nord, ghettos de richesse du Sud.</div>\n<h3>3. Pauvreté et inégalités : les grandes tendances</h3>\n<div class=\"tip\">La pauvreté extrême (moins de 2,15 $/jour, seuil Banque mondiale 2022) a fortement reculé depuis 1990 — la Chine en a sorti des centaines de millions — mais les inégalités <b>internes</b> explosent presque partout : le monde devient plus égal entre pays et plus inégal à l'intérieur de chaque pays. Les réponses internationales : les <b>ODD</b> (17 objectifs de l'ONU pour 2030), l'aide publique au développement (objectif historique de 0,7 % du revenu national, rarement atteint), aux côtés des transferts privés des migrants qui la dépassent.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> développement ≠ croissance (la croissance produit de la richesse ; le développement améliore les vies : le pétrole sans écoles fait l'un sans l'autre). Le PIB/habitant se compare en <b>PPA</b> (parité de pouvoir d'achat) : un dollar achète plus de choses au Niger qu'en Norvège. Les « Suds » ne sont pas tous pauvres.</div>"},
{"id": "mondialisation","theme": "La mondialisation : flux et réseaux (Lycée)","niveau": "Lycée","titre": "La mondialisation : flux et réseaux","cours": "<div class=\"cours-head\"><h2>La mondialisation : flux et réseaux</h2><span class=\"niv\">Lycée</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Des flux massifs et asymétriques</h3>\n<div class=\"tip\">La mondialisation est la mise en relation généralisée des territoires par des <b>flux</b> : marchandises (environ 80 % par mer, porte-conteneurs géants), capitaux (les places financières reliées en continu), informations (câbles sous-marins : plus de 95 % des données), personnes (tourisme : 1,4 milliard de touristes internationaux, migrations de travail). Ces flux sont <b>asymétriques</b> : 80 % partent, transitent ou arrivent dans les pays du Nord et les émergents ; l'Afrique reste en marge des flux maritimes et financiers.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le trajet d'un smartphone</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire la mondialisation à travers le trajet et la fabrication d'un smartphone.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les composants</b> : silicium taïwanais (TSMC), écrans coréens ou japonais, mémoires, batteries au lithium (Chili, Australie), assemblage en Chine ou au Vietnam : une chaîne de valeur mondiale fragmentée, chaque étape placée là où elle est la plus compétitive.</div><div class=\"etu\"><b>Étape 2</b> — <b>La logistique</b> : transport maritime conteneurisé, hubs portuaires (Shanghai, Singapour, Rotterdam), plateformes logistiques, livraison finale : le coût du transport reste marginal dans le prix final.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'analyse</b> : la valeur se concentre en amont (conception, brevets) et en aval (marque, services) : l'assemblage ne capte qu'une faible part du prix. Conclusion : la mondialisation est un système de mise en relation inégale — des territoires gagnants (les métropoles du Nord et des émergents) et des marges.</div></div></details>\n<h3>2. Les acteurs et les réseaux</h3>\n<div class=\"tip\">Les acteurs : les <b>FTN</b> (firmes transnationales — Apple, Toyota : plus de la moitié du commerce mondial est intra-firme), les États (régulation, accords, protectionnisme), les organisations (OMC, FMI), les villes mondiales (les nœuds du réseau). Le réseau : les <b>métropoles</b> reliées entre elles (New York, Londres, Tokyo, Paris, Singapour) forment l'archipel mondial ; les <b>interfaces</b> (ports, frontières, détroits stratégiques : Ormuz, Malacca, Gibraltar) concentrent les passages ; les <b>marges</b> (enclaves, États enclavés d'Afrique sahélienne, AfPak) restent mal connectées.</div>\n<h3>3. Réguler et contester la mondialisation</h3>\n<div class=\"tip\">La mondialisation n'est pas un processus naturel : elle est <b>régulée</b> (OMC depuis 1995, accords régionaux, règles sanitaires) et <b>contestée</b> : altermondialisme, souverainisme, remises en cause des délocalisations. Les tensions actuelles : guerre commerciale sino-américaine, « découplages », relocalisations stratégiques (semi-conducteurs, pharmacie), régionalisation des chaînes (nearshoring). La mondialisation se poursuit mais se recompose : « slowbalisation ».</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la mondialisation n'est pas homogène (des flux asymétriques et des marges) ; elle ne date pas de 1990 (première mondialisation au XIXe siècle) ; la « fin de la mondialisation » est un raccourci médiatique : les flux se recomposent plus qu'ils ne disparaissent (recomposition régionale, réorientation des flux).</div>"},
{"id": "mers-oceans","theme": "Mers et océans : un monde maritimisé (Lycée)","niveau": "Lycée","titre": "Mers et océans : un monde maritimisé","cours": "<div class=\"cours-head\"><h2>Mers et océans : un monde maritimisé</h2><span class=\"niv\">Lycée</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Un monde maritimisé</h3>\n<div class=\"tip\">Les mers concentrent les enjeux : environ <b>80 % du commerce mondial</b> transite par voie maritime, les câbles sous-marins (plus de 95 % des données), la pêche (environ 90 millions de tonnes par an), les ressources énergétiques et minérales (un quart des hydrocarbures provient de l'offshore, les nodules polymétalliques des grands fonds). Les littoraux se peuplent : environ 40 % de l'humanité vit à moins de 100 km d'une côte, et les façades maritimes (l'Asie orientale, la Northern Range européenne, la côte Est américaine) concentrent les métropoles et les villes mondiales.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la ZEE française, deuxième du monde</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer pourquoi la France possède la deuxième zone économique exclusive du monde (environ 10,2 millions de km²) et ce que cela représente.</div><div class=\"etu\"><b>Étape 1</b> — <b>La construction juridique</b> : la convention de Montego Bay (1982) donne à tout État côtier une ZEE de 200 milles marins : la France, avec ses outre-mer (Clipperton, Kerguelen, Nouvelle-Calédonie, Polynésie...), cumule les zones autour de chaque territoire — 97 % de sa ZEE est ultramarine.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les ressources</b> : pêche (thon pacifique), nodules polymétalliques, possibles hydrocarbures, biodiversité (récifs, mangroves) : un patrimoine à surveiller (surveillance maritime, Marine nationale, satellites).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les responsabilités</b> : la France doit protéger ces immensités (aires marines protégées, lutte contre la pêche illégale) et en tirer des richesses : un enjeu de souveraineté et d'influence dans l'Indo-Pacifique.</div></div></details>\n<h3>2. Le droit de la mer et les tensions</h3>\n<div class=\"tip\">La convention de <b>Montego Bay</b> (1982) organise l'espace maritime : eaux territoriales (12 milles), ZEE (200 milles : exploration et exploitation des ressources), plateau étendu (jusqu'à 350 milles sur dossier scientifique), la haute mer (les « biens communs de l'humanité » : l'Autorité internationale des fonds marins). Les tensions : la mer de Chine méridionale (les « neuf traits » chinois face aux revendications des voisins), le passage du Nord-Est (ouverture arctique), les courses aux ressources des grands fonds (les nodules), la piraterie (golfe de Guinée, corne de l'Afrique) et la surpêche (le tiers des stocks exploités au-delà du seuil de renouvellement).</div>\n<h3>3. Littoralisation et pression sur les milieux</h3>\n<div class=\"tip\">Les littoraux s'artificialisent (ports, aménagements, bétonnage des côtes : plus d'un tiers des côtes méditerranéennes sont artificialisées), les villes du littoral s'exposent (la montée du niveau marin, les submersions : le risque s'installe avec la maritimisation). Les réponses : la trame verte et bleue, les Aires marines protégées (objectif de 10 % en 2020, 30 % en 2030), la restauration des mangroves et des récifs (les « infrastructures naturelles »), les réglementations de pêche (quotas, aires interdites).</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la maritimisation n'est pas la « conquête des océans » mais leur mise en valeur multiple (transport, ressources, loisirs, stratégies) ; la ZEE n'est pas un territoire souverain (la souveraineté ne s'exerce que dans les 12 milles : au-delà, ce sont des droits économiques) ; ne pas confondre plateau continental juridique et plateau étendu (le second doit être prouvé devant l'ONU).</div>"},
{"id": "france-territoires","theme": "La France : territoires et aménagement (Lycée)","niveau": "Lycée","titre": "La France : territoires et aménagement","cours": "<div class=\"cours-head\"><h2>La France : territoires et aménagement</h2><span class=\"niv\">Lycée</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Un territoire original : la « hexagonale » et l'outre-mer</h3>\n<div class=\"tip\">La France métropolitaine (environ 552 000 km², la « Hexagone ») offre une situation de <b>interface</b> (façades atlantique et méditerranéenne, isthme européen) et une <b>double ouverture</b> (maritime et continentale). À cela s'ajoutent les <b>DROM</b> (Guadeloupe, Martinique, Guyane, La Réunion, Mayotte) et les <b>COM</b> (Polynésie, Nouvelle-Calédonie, etc.) : la deuxième ZEE du monde (environ 10,2 millions de km²) — 97 % ultramarine. Le territoire français est donc à la fois européen, atlantique, méditerranéen, et mondial par l'outre-mer.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — les contrastes territoriaux français</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le « territoire français » est-il homogène ? Montrer les contrastes et l'action de l'État.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les contrastes</b> : l'axe majeur Paris-Lyon-Marseille concentre les hommes et les activités ; les métropoles régionales (Toulouse, Bordeaux, Nantes, Lille) gagnent ; les espaces ruraux vieillissants (« diagonale du vide ») perdent ; les outre-mer cumulent handicaps (éloignement, chômage) et atouts (ZEE, jeunesse, biodiversité).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'action de l'État</b> : aménagement du territoire : décentralisation (lois 1982-2015), métropolisation encouragée (les 22 métropoles), rééquilibrage (les maisons France services dans les campagnes, le plan fibre), politiques de la ville pour les quartiers prioritaires.</div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan nuancé</b> : les écarts persistent (les aires urbaines gagnent toujours), mais la France reste un des pays européens les moins « macrocéphales » comparée à ses voisins.</div></div></details>\n<h3>2. Les dynamiques : métropolisation, littoralisation, périurbanisation</h3>\n<div class=\"tip\">La France se <b>métropolise</b> (les plus grandes aires urbaines gagnent habitants et fonctions : commandement, universités, emplois supérieurs) et se <b>littoralise</b> (les côtes attirent résidents et touristes). Les espaces en difficulté : les villes moyennes et le rural profond. Les recompositions : le périurbain (l'habitat dispersé automobile) se démocratise, le télétravail post-Covid renouvelle certaines campagnes (les « néo-ruraux »), et les outrages de la « France périphérique » alimentent le débat politique sur les territoires oubliés.</div>\n<h3>3. Aménager : acteurs, outils, débats</h3>\n<div class=\"tip\">Les acteurs : l'État (grands projets : LGV, autoroutes, réindustrialisation), les <b>collectivités territoriales</b> (régions, départements, intercommunalités : le budget et les compétences depuis les lois de décentralisation), l'Union européenne (les fonds structurels pour les régions en retard), les acteurs privés. Les outils : le <b>plan (SCOT, PLU)</b>, les documents stratégiques (SRDE), les contrats de plan État-région. Les débats : le Grand Paris (le plus grand chantier d'Europe : le métropolitain, les Jeux olympiques), la place des métropoles contre les villes moyennes, l'égalité des territoires (les services publics en recul dans les zones peu denses : la « fracture territoriale »).</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la France n'est pas « uniquement hexagonale » (les outre-mer sont des territoires français à part entière, la ZEE est la deuxième mondiale) ; « désert français » : un raccourci à nuancer (des espaces dynamiques existent hors des métropoles : les villes moyennes attractives, les littoraux, les régions frontalières) ; le Grand Paris Express est un métro (pas un train « classique »), et la décentralisation ne veut pas dire « retrait de l'État » mais partage des compétences.</div>"}];
var FICHES_DATA = [{"id": "population-mondiale","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Répartition</b> : 8 milliards ; les foyers (Asie de l'Est et du Sud, Europe, NE américain) contre les vides (déserts, froid, montagnes, forêts).</p>\n<p><b>Croissance</b> : transition démographique (la mortalité baisse, puis la natalité) ; l'Afrique jeune, l'Europe vieille ; pic ~10 milliards vers 2080.</p>\n<p><b>Migrations</b> : plus de 280 millions de migrants ; Suds vers Nords ; réfugiés et travail ; transferts d'argent massifs.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Lire une carte de densité</b> : légende, localisation, explication.</li>\n<li><b>Comparer deux pyramides</b> : large = jeune, toupie = vieille.</li>\n<li><b>Distinguer migrant et réfugié</b> : le droit change tout.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Densité ne veut pas dire surpopulation : tout dépend des ressources.</li>\n<li>La croissance mondiale ralentit déjà.</li>\n<li>Migrant et réfugié : deux statuts, deux droits.</li>\n</ul>"},
{"id": "urbanisation","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Un monde urbain</b> : 57 % de citadins (68 % attendus en 2050) ; métropoles, mégapoles (plus de 10 millions), mégalopoles (axes continus).</p>\n<p><b>Le Nord</b> : centres gentrifiés, banlieues et périurbain ; projets de ville durable (densité, transports en commun).</p>\n<p><b>Le Sud</b> : croissance explosive (Lagos), bidonvilles (1 milliard de personnes), informel, services en retard.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Classer les villes</b> : métropole (fonctions), mégapole (seuil 10 millions), mégalopole (axe).</li>\n<li><b>Analyser une photo de bidonville</b> : matériaux, site, services manquants.</li>\n<li><b>Discuter l'étalement urbain</b> : coûts (terres, voiture) et solutions (densité, transports).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Mégapole = seuil chiffré, pas une « très grande capitale ».</li>\n<li>Le périurbain n'est pas rural.</li>\n<li>Gentrification = revitalisation ET exclusion : toujours discuter les deux faces.</li>\n</ul>"},
{"id": "developpement-inegalites","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Mesurer</b> : PIB (insuffisant) → IDH (santé + éducation + revenu, PNUD 1990) ; catégories ONU : PMA (44 pays) ; émergents (BRICS).</p>\n<p><b>Nords/Suds multiples</b> : émergents, PMA du Sahel, pétromonarchies ; contrastes internes à chaque pays.</p>\n<p><b>Tendances</b> : pauvreté extrême en recul (seuil 2,15 $/jour) ; inégalités internes en hausse ; ODD (17 objectifs 2030) ; APD (objectif 0,7 %).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Lire un IDH</b> : les trois composantes et leurs valeurs.</li>\n<li><b>Comparer deux pays</b> avec plusieurs indicateurs (IDH, Gini, PPA).</li>\n<li><b>Distinguer croissance et développement</b> avec des exemples.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Développement ≠ croissance (Nigeria pétrolier contre Costa Rica).</li>\n<li>PIB/habitant : toujours corriger en PPA.</li>\n<li>Les moyennes (IDH) masquent les inégalités internes.</li>\n</ul>"},
{"id": "mondialisation","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Flux</b> : marchandises (80 % par mer), capitaux, informations (câbles sous-marins), personnes — asymétriques, concentrés sur l'axe Nord/émergents.</p>\n<p><b>Acteurs</b> : FTN (plus de la moitié du commerce intra-firme), États, OMC, métropoles mondiales ; interfaces et détroits (Ormuz, Malacca).</p>\n<p><b>Régulation et contestation</b> : OMC, accords régionaux ; altermondialisme, souverainisme ; « slowbalisation » et relocalisations stratégiques.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Analyser une carte des flux</b> : volume, direction, asymétrie.</li>\n<li><b>Étudier une chaîne de valeur</b> : où se crée la valeur (amont/aval contre assemblage).</li>\n<li><b>Distinguer mondialisation et globalisation</b> : extension des flux contre uniformisation.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Pas une « fin » mais une recomposition (régionalisation).</li>\n<li>Les marges existent toujours (États enclavés, enclaves du Nord).</li>\n<li>Ne pas confondre flux commerciaux et flux financiers.</li>\n</ul>"},
{"id": "mers-oceans","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Maritimisation</b> : 80 % du commerce maritime, 95 % des données par câbles, 40 % de l'humanité à moins de 100 km d'une côte.</p>\n<p><b>Droit de la mer</b> : Montego Bay 1982 — eaux territoriales 12 milles, ZEE 200 milles, plateau étendu, haute mer = bien commun.</p>\n<p><b>Tensions</b> : mer de Chine méridionale, Arctique, nodules des grands fonds, piraterie, surpêche ; littoralisation et montée des eaux.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Lire une carte des routes maritimes</b> : les détroits et canaux comme goulots.</li>\n<li><b>Calculer/lire une ZEE</b> : les règles Montego Bay, l'exemple français.</li>\n<li><b>Décrire une façade maritime</b> : métropoles, ports, aménagements.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>ZEE = droits économiques, pas souveraineté.</li>\n<li>Haute mer = bien commun de l'humanité (pas « no man's land »).</li>\n<li>La montée des eaux rend le littoral attractif ET exposé : la double lecture.</li>\n</ul>"},
{"id": "france-territoires","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Territoire</b> : l'Hexagone (552 000 km²) en interface + DROM/COM : deuxième ZEE mondiale (10,2 millions de km², 97 % ultramarine).</p>\n<p><b>Dynamiques</b> : métropolisation (les grandes aires gagnent), littoralisation, périurbanisation ; en difficulté : villes moyennes et rural profond.</p>\n<p><b>Aménagement</b> : État + collectivités (décentralisation) + UE (fonds structurels) ; outils : SCOT, PLU, contrats de plan ; débats : Grand Paris, fracture territoriale.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Lire une carte des dynamiques démographiques</b> : les aires qui gagnent/perdent.</li>\n<li><b>Présenter un acteur de l'aménagement</b> : compétences, budget, projet.</li>\n<li><b>Décrire un aménagement local</b> (LGV, tramway, zone d'activité) : objectifs, acteurs, effets.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>La France est aussi ultramarine (ZEE n°2 mondiale).</li>\n<li>Le « désert français » : une nuance à discuter, pas une évidence.</li>\n<li>Décentralisation = partage des compétences, pas retrait de l'État.</li>\n</ul>"}];
var QUESTIONS = [{"t": "La population mondiale : croissance et répartition (Collège)","q": "Les principaux foyers de peuplement mondiaux sont :","c": ["l'Amérique du Sud et l'Australie","l'Antarctique et le Groenland","le Sahara","l'Asie de l'Est et du Sud, l'Europe et le Nord-Est américain"],"a": 3,"e": "L'Asie de l'Est et du Sud concentre plus d'un tiers de l'humanité (vallées du Yangzi et du Gange) ; l'Europe et le NE américain complètent les grands foyers.","d": "<b>Trois foyers, des vides.</b><div class='ex-detail'><u>Exemple rédigé</u> : l'Asie de l'Est (bassin du Yangzi, rizières nourricières) et l'Asie du Sud (plaine du Gange, sols fertiles, mousson) totalisent plus de 3 milliards d'habitants. L'Europe de l'Ouest forme un foyer ancien (« cœur européen » de Londres à Milan). Le NE américain (mégalopole Boston-Washington) s'est peuplé par l'industrialisation et l'immigration. À l'opposé, les vides : Sahara (aridité), Sibérie (froid), Amazonie (forêt), Antarctique (inhabitée). Conclusion : la répartition suit l'eau, le climat et les activités, et la moitié de l'humanité vit près des côtes. <b>Piège</b> : l'Amérique du Sud est un vide relatif (populations littorales, intérieur presque vide) — ne pas la citer comme foyer majeur.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "La transition démographique se définit comme :","c": ["une migration massive","le passage d'un régime ancien (forte natalité ET forte mortalité) à un régime moderne (les deux faibles), avec une forte croissance entre les deux","une politique de natalité","la fin des naissances"],"a": 1,"e": "La mortalité baisse d'abord (médecine, hygiène), la natalité suit avec un décalage : l'écart entre les deux crée l'explosion de la croissance.","d": "<b>Le décalage créateur d'explosion.</b><div class='ex-detail'><u>Exemple rédigé</u> : au départ, régime ancien : natalité et mortalité hautes, croissance quasi nulle. Puis la mortalité s'effondre (vaccination, eau potable, antibiotiques) tandis que la natalité reste haute quelques décennies : l'accroissement naturel atteint 3 % par an, la population double en 25 ans. Enfin, la natalité baisse à son tour : croissance faible ou négative, vieillissement (Europe, Japon). Application : la France a transitionné vers 1800-1900 ; le Niger est au milieu de sa transition ; la Corée du Sud est déjà au stade final (IDF ~0,8). <b>Piège</b> : la transition est un processus, pas une politique (les politiques peuvent l'accélérer mais pas la créer).</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "Le vieillissement en Europe pose surtout le problème :","c": ["du financement des retraites et des dépenses de santé, avec moins d'actifs pour plus d'inactifs","du logement des étudiants","de la surpopulation scolaire","de l'armée"],"a": 0,"e": "La part des 65 ans et plus dépasse 20 % en Italie ou en Allemagne : le rapport actifs/retraités se dégrade, d'où les réformes et le débat sur les migrations.","d": "<b>Le rapport actifs/retraités.</b><div class='ex-detail'><u>Exemple rédigé</u> : le système de retraites par répartition fait payer les pensions des retraités par les cotisations des actifs. Avec l'IDF ~1,5 (sous le seuil de renouvellement de 2,1) et l'arrivée à la retraite des générations du baby-boom, le rapport passe de 4 actifs pour 1 retraité à moins de 2 : il faut cotiser plus, travailler plus longtemps ou accueillir des migrants. S'ajoutent les dépenses de santé (maladies chroniques, dépendance, soignants manquants). Conclusion : le vieillissement est un défi silencieux mais structurant du siècle. <b>Piège</b> : ce n'est pas une crise passagère mais une tendance profonde (l'espérance de vie gagne environ 2 ans par décennie).</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "Un réfugié se distingue d'un migrant économique car :","c": ["il est plus riche","il n'a pas de nationalité","il voyage pour du tourisme","il fuit un danger (guerre, persécution) et bénéficie d'une protection internationale (convention de Genève, 1951)"],"a": 3,"e": "Le réfugié traverse une frontière pour échapper à une persécution ; il bénéficie du principe de non-refoulement. Le migrant économique choisit de partir pour travailler.","d": "<b>Deux statuts, deux droits.</b><div class='ex-detail'><u>Exemple rédigé</u> : le migrant économique part par choix pour un meilleur salaire (les États-Unis, le Golfe) ; il est soumis aux visas et quotas, et peut rentrer. Le réfugié part sous la contrainte (Syrie 2015, Ukraine 2022) ; la convention de Genève lui interdit d'être renvoyé vers le danger (non-refoulement), et le HCR l'assiste (camps, statut, procédures d'asile comme l'OFPRA en France). En réalité, les flux sont « mixtes » : des économiques et des réfugiés voyagent ensemble, d'où la difficulté des contrôles aux frontières. <b>Piège</b> : le vocabulaire juridique compte — le réfugié est protégé, l'économique est soumis aux décisions de l'État d'accueil.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "La population mondiale devrait :","c": ["tripler d'ici 2050","rester à 8 milliards pour toujours","atteindre un pic d'environ 10 milliards vers 2080 puis se stabiliser","diminuer dès 2030"],"a": 2,"e": "Selon l'ONU, le pic est attendu vers 2080 (~10,3 milliards) : la fécondité mondiale baisse, la croissance se concentre sur l'Afrique subsaharienne.","d": "<b>Le pic puis le plateau.</b><div class='ex-detail'><u>Exemple rédigé</u> : historiquement : 1 milliard vers 1800, 2 en 1927, 8 en 2022. Aujourd'hui, l'IDF mondial est ~2,3 et baisse presque partout (Inde ~2, Afrique subsaharienne ~4,5 mais en recul). Les scénarios de l'ONU projettent ~10,3 milliards en 2080 puis un plateau, avec des incertitudes (scénarios bas 8,7, haut plus de 12). Les leviers : l'éducation des filles et l'accès à la contraception sont les facteurs numéro un de baisse de fécondité. <b>Piège</b> : le mot « explosion » date du XXe siècle ; le mot juste aujourd'hui est « ralentissement » (les repères attendus : 10 milliards, 2080, stabilisation).</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "La densité de population se calcule :","c": ["au recensement des voitures","en additionnant les naissances","en comptant les maisons","en divisant la population par la superficie (habitants/km²) — une moyenne qui masque les contrastes locaux"],"a": 3,"e": "Densité = population ÷ superficie. La moyenne mondiale est ~60 hab/km², mais les écarts vont de 2 (Australie) à plus de 7 000 (Singapour).","d": "<b>Population ÷ superficie.</b><div class='ex-detail'><u>Exemple rédigé</u> : la France métropolitaine : 68 millions ÷ 552 000 km² ≈ 123 hab/km². Ordres de grandeur : Europe ~110, Bangladesh ~1 300 (record), déserts ~0. Mais la moyenne masque tout : Paris intra-muros dépasse 20 000 hab/km² tandis que la Lozère en compte moins de 15. La densité sert donc de point de départ à une description, jamais de conclusion : il faut ensuite expliquer (l'eau, l'agriculture, les villes). <b>Piège</b> : densité ne veut pas dire surpeuplement — le Bangladesh nourrit sa population avec ses rizières, tandis que des pays « vides » connaissent des difficultés alimentaires. C'est le rapport population/ressources qui compte.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "L'Afrique subsaharienne se distingue aujourd'hui par :","c": ["l'absence de villes","une population vieillissante","une population en baisse","une croissance démographique très forte (IDF élevé, plus de la moitié de la croissance mondiale d'ici 2050, une extrême jeunesse)"],"a": 3,"e": "L'IDF ~4,5, une population qui double en ~30 ans, plus de 60 % de moins de 25 ans : les défis de l'école, de l'emploi et de la nourriture — mais aussi un « dividende démographique » possible si l'éducation suit.","d": "<b>La jeunesse du monde.</b><div class='ex-detail'><u>Exemple rédigé</u> : les chiffres : Niger IDF 6,7, Mali 6 ; les moins de 15 ans représentent 40-45 % de la population, et le Nigeria approchera 400 millions d'habitants (3e rang mondial). Les défis : scolariser des classes qui doublent, créer des emplois pour les jeunes arrivant sur le marché, nourrir des villes en explosion (Lagos). L'opportunité : le « dividende démographique », c'est-à-dire une main-d'œuvre abondante qui a fait la fortune des « dragons » asiatiques — à condition d'investir dans l'éducation et la santé. <b>Piège</b> : ne pas écrire « l'Afrique est pauvre parce que trop peuplée » ; ce sont les institutions et l'éducation qui déterminent le décollage, pas la seule démographie.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "Les « migrants environnementaux » partent à cause de :","c": ["la mode","les réseaux sociaux","un amour des voyages","les dégradations de leur milieu liées au changement climatique (montée des eaux, sécheresses, cyclones, désertification)"],"a": 3,"e": "Deltas du Gange, îles du Pacifique (Kiribati, Tuvalu), Sahel : la Banque mondiale craint des centaines de millions de déplacés internes d'ici 2050 — et le statut juridique manque encore.","d": "<b>Le climat comme cause de départ.</b><div class='ex-detail'><u>Exemple rédigé</u> : les îles du Pacifique (Kiribati, Tuvalu) : la montée du niveau marin salinise l'eau douce et noie les cultures ; des négociations de relocation sont engagées avec l'Australie et la Nouvelle-Zélande. Les deltas (Bangladesh) : cyclones et inondations poussent les habitants vers Dhaka. Le Sahel : la désertification oppose pasteurs et agriculteurs et alimente les conflits. Le problème juridique : la convention de Genève ne protège que les persécutés — le « déplacé climatique » n'a pas encore de statut international (des conventions régionales comme celle de Kampala font figure d'avancée). <b>Piège</b> : ne pas écrire que le déplacé climatique est « protégé comme un réfugié » — c'est justement la nuance juridique qui est attendue.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "L'espérance de vie à la naissance mesure :","c": ["la durée moyenne de vie d'une génération : un indicateur de développement et de santé","la taille moyenne","le nombre d'enfants par femme","le nombre d'écoles"],"a": 0,"e": "En moyenne mondiale ~73 ans (Japon ~84, Niger ~62, France ~82) : elle dépend de la santé, de la nourriture, de l'hygiène et de la richesse.","d": "<b>L'indicateur santé.</b><div class='ex-detail'><u>Exemple rédigé</u> : l'espérance de vie résume les conditions de santé d'une population. Les progrès du XXe siècle (+30 ans en France) viennent des antibiotiques, de la vaccination et de la sécurité sociale. Les écarts actuels (Japon 84, Niger 62) s'expliquent par la mortalité infantile, l'accès aux soins et à l'eau potable. Subtilité utile : on distingue désormais l'espérance de vie « en bonne santé », car allonger la vie ne suffit plus : il faut aussi des années sans dépendance. <b>Piège</b> : l'espérance de vie n'est pas un âge maximum mais une moyenne statistique calculée pour une génération donnée.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "Les transferts d'argent des migrants vers leurs pays d'origine :","c": ["représentent plus de 650 milliards de dollars par an, souvent plus que l'aide publique au développement","sont négligeables","ne servent à rien","sont interdits par l'ONU"],"a": 0,"e": "Les Philippines, le Maroc, le Mexique, le Sénégal reçoivent des milliards : la nourriture, l'école, les maisons et les micro-entreprises — une « aide privée internationale ».","d": "<b>Les flux invisibles.</b><div class='ex-detail'><u>Exemple rédigé</u> : les migrants envoient chaque année plus de 650 milliards de dollars vers leur famille — plus du triple de l'aide publique au développement. Exemples : l'Inde reçoit plus de 100 milliards (record mondial), les Philippines environ 10 % de leur PIB (les infirmières et marins de la diaspora), le Mexique des flux massifs depuis les États-Unis qui construisent les « maisons des migrants ». Cet argent va directement aux ménages : nourriture, scolarisation, santé, micro-entreprises — un filet de sécurité auto-organisé. <b>Piège</b> : ne pas confondre transferts privés des migrants et aide publique des États : ce sont deux colonnes différentes de la solidarité internationale.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "Une mégapole est :","c": ["une ville très belle","un village","une capitale européenne","une aire urbaine de plus de 10 millions d'habitants (Tokyo, Delhi, Lagos...)"],"a": 3,"e": "Le mot est chiffré : l'ONU retient le seuil de 10 millions d'habitants ; on en compte une trentaine, majoritairement dans le Sud.","d": "<b>Un seuil, pas un jugement.</b><div class='ex-detail'><u>Exemple rédigé</u> : le seuil de 10 millions s'applique à l'aire urbaine (l'agglomération continue), pas à la ville administrative — c'est pourquoi les classements varient selon les définitions. Exemples : Tokyo ~37 millions (la plus grande), Delhi ~32, Shanghai, São Paulo, Mexico, Le Caire, Mumbai, Lagos ~15. À distinguer : métropole = fonctions de commandement (une ville moyenne peut en avoir : Francfort) ; mégalopole = axe urbain continu (Boston-Washington). <b>Piège</b> : « mégapole » ne veut pas dire « capitale » — Lagos n'est PAS la capitale du Nigeria (c'est Abuja) : le mot renvoie à la taille, pas au statut administratif.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "L'exode rural désigne :","c": ["un type de carte","les vacances à la campagne","le départ des populations campagnardes vers les villes, attirées par les emplois et les services","la fin des moissons"],"a": 2,"e": "Moteurs : les écarts de salaires, l'école, l'hôpital, les loisirs. Effets : campagnes qui vieillissent et perdent leurs services, villes qui gonflent.","d": "<b>La campagne qui se vide, la ville qui gonfle.</b><div class='ex-detail'><u>Exemple rédigé</u> : les causes du départ (les « push ») : mécanisation agricole, petites exploitations, sécheresses et dettes. Les attractions urbaines (les « pull ») : un salaire urbain vaut plusieurs revenus agricoles ; s'ajoutent l'école, l'hôpital et les réseaux familiaux déjà installés (les « chaînes migratoires »). Conséquences côté campagnes : vieillissement, écoles et commerces qui ferment, déserts médicaux — une spirale. Côté villes : afflux de population, tension sur le logement (banlieues au Nord, bidonvilles au Sud). <b>Piège</b> : les campagnes ne se « vident » pas partout : le périurbain et le télétravail recomposent les espaces ruraux, et les navettes quotidiennes relient désormais ville et campagne.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "Les bidonvilles du Sud se caractérisent par :","c": ["l'habitat précaire et l'informel (matériaux de récupération, pas d'eau courante ni d'égouts, occupations illégales) abritant environ 1 milliard de personnes","des châteaux","des tours modernes","des villas de luxe"],"a": 0,"e": "Les slums cumulent : pas de titre de propriété, pas d'adresse, services privés coûteux (l'eau vendue en bidons) — mais aussi une vraie économie informelle organisée.","d": "<b>L'informe qui loge un milliard de personnes.</b><div class='ex-detail'><u>Exemple rédigé</u> : le portrait : autoconstruction en tôle, carton et parpaing sur des terrains risqués (pentes, fonds inondables, bordures de voies ferrées). Les manques : eau (bornes-fontaines payantes, l'eau revient plus chère qu'au robinet municipal), assainissement (latrines partagées, maladies), électricité (raccordements pirates), et surtout l'adresse : sans adresse, pas de courrier, de compte bancaire ni parfois d'école. Mais le bidonville n'est pas un chaos : Dharavi (Mumbai) abrite de vraies filières (recyclage, cuir) qui produisent des centaines de millions de dollars. Les trois politiques possibles : éradication (souvent un échec social), régularisation (titres de propriété, réseaux) ou réhabilitation sur place (eau, voirie, écoles). <b>Piège</b> : ne pas écrire que le bidonville est un « désordre » — c'est une organisation réelle, avec ses hiérarchies et même ses loyers.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "La gentrification correspond à :","c": ["la construction d'églises","l'arrivée de populations aisées dans des quartiers populaires réhabilités : les loyers montent et les anciens habitants sont repoussés","la disparition des villes","un événement sportif"],"a": 1,"e": "Le processus : un quartier dévalorisé devient attractif (artistes, rénovation, cafés), les investisseurs suivent, les prix s'envolent : revitalisation pour les uns, exclusion pour les autres.","d": "<b>Le tri social par le foncier.</b><div class='ex-detail'><u>Exemple rédigé</u> : le cycle en trois étapes. 1) Le quartier dévalorisé : loyers bas, artistes et étudiants qui s'installent. 2) L'attraction : la rénovation, les cafés, la visibilité médiatique — les investisseurs spéculent, les prix montent. 3) Le remplacement : les anciens locataires ne peuvent plus payer et partent, les commerces changent. Exemples : le Marais et le canal Saint-Martin à Paris, Williamsburg à Brooklyn. Le débat : pour les uns, c'est de la rénovation utile (services, attractivité, recettes fiscales) ; pour les autres, une exclusion organisée. Les outils de régulation : encadrement des loyers, quotas de logement social. <b>Piège</b> : toujours présenter les deux faces (revitalisation ET exclusion) — c'est la nuance qui est évaluée.</div>"},
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de géographie</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + h + '</section>';
})();

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
</script>
