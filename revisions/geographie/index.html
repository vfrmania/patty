<script>
var PROGRAMME = [{"n": "Collège","ch": [{"t": "La population mondiale : croissance et répartition","id": "population-mondiale"},{"t": "L'urbanisation du monde","id": "urbanisation"},{"t": "Développement et inégalités dans le monde","id": "developpement-inegalites"}]},
{"n": "Lycée","ch": [{"t": "La mondialisation : flux et réseaux","id": "mondialisation"},{"t": "Mers et océans : un monde maritimisé","id": "mers-oceans"},{"t": "La France : territoires et aménagement","id": "france-territoires"}]}];
var COURS_META = [{"id": "population-mondiale","theme": "La population mondiale : croissance et répartition (Collège)","niveau": "Collège","titre": "La population mondiale : croissance et répartition","cours": "<div class=\"cours-head\"><h2>La population mondiale : croissance et répartition</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Où vivent les hommes ? Une répartition inégale</h3>\n<div class=\"tip\">La Terre compte <b>8 milliards d'habitants</b> (2022), mais ils sont très inégalement répartis. Les <b>foyers de peuplement</b> majeurs sont l'Asie de l'Est et du Sud (la Chine, l'Inde : plus d'un tiers de l'humanité), l'Europe et le Nord-Est américain. Les <b>vides</b> sont les déserts chauds (le Sahara), froids (la Sibérie, l'Antarctique), les hautes montagnes et les forêts denses (l'Amazonie). Les <b>facteurs explicatifs</b> : le climat, l'eau (les vallées du Gange et du Yangzi), les sols agricoles, les littoraux et les activités économiques. Plus de la moitié de l'humanité vit à moins de 200 km d'une côte.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire une carte de densité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur une carte de la densité de population mondiale, comment repérer et expliquer les contrastes ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Lire la légende</b> : repérer les seuils de densité (habitants/km²). Les zones de forte densité (plus de 100 hab/km²) apparaissent en foncé : l'Asie du Sud et de l'Est, l'Europe.</div><div class=\"etu\"><b>Étape 2</b> — <b>Localiser</b> : citer trois foyers (l'Asie de l'Est autour du Yangzi, l'Asie du Sud autour du Gange, l'Europe de l'Ouest) et trois vides (le Sahara, la Sibérie, l'Amazonie).</div><div class=\"etu\"><b>Étape 3</b> — <b>Expliquer</b> : la répartition suit d'abord les conditions naturelles (l'eau, le climat), mais aussi l'histoire (les anciennes civilisations agraires) et l'économie. Conclusion : l'eau et l'agriculture structurent le peuplement, et la littoralisation s'accentue.</div></div></details>\n<h3>2. La croissance : transition et vieillissement</h3>\n<div class=\"tip\">La population a explosé (1 milliard vers 1800, 2 en 1927, 8 en 2022) grâce à la <b>transition démographique</b> : la mortalité baisse d'abord (médecine, hygiène, vaccination), la natalité suit avec un décalage, d'où une forte croissance entre les deux. Aujourd'hui, la croissance se concentre en <b>Afrique</b> (le Niger : plus de 6 enfants par femme) tandis que l'Europe, la Chine et le Japon <b>vieillissent</b> : financement des retraites, dépenses de santé, besoin de migrations. Le pic mondial (environ 10 milliards) est attendu vers 2080.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la transition démographique en deux pays</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparer la situation démographique du Niger et celle de la France.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les indicateurs</b> : au Niger, l'indice de fécondité dépasse 6 enfants par femme, l'espérance de vie ~62 ans, la population double en environ 25 ans, la pyramide est large (beaucoup de jeunes). En France, l'IDF ~1,8, l'espérance de vie ~82 ans, la croissance faible, la pyramide « en toupie ».</div><div class=\"etu\"><b>Étape 2</b> — <b>Expliquer</b> : le Niger est en pleine transition (la mortalité a baissé, la natalité reste haute) : pression sur l'école, l'emploi et la nourriture. La France a achevé sa transition : retraites à financer, dépendance des âgés, migrations comme réponse.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : deux mondes démographiques coexistent (les jeunes du Sud, les vieux du Nord) — un des grands déséquilibres du XXIe siècle.</div></div></details>\n<h3>3. Les migrations</h3>\n<div class=\"tip\">Plus de <b>280 millions de migrants internationaux</b> (2020) : les flux vont des Suds vers les Nords (les États-Unis, l'Europe, les pays du Golfe) mais aussi de Sud en Sud. Les causes : les écarts de développement, les conflits (plus de 100 millions de déplacés forcés), le climat (les « migrants environnementaux »), le travail. Les effets : les transferts d'argent vers les pays d'origine (plus de 650 milliards de dollars par an), les diasporas, les débats dans les pays d'accueil.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « surpopulation » est trompeur : la question est la concentration et les ressources. La croissance mondiale ralentit (pic attendu vers 2080). Ne pas confondre migrant (départ volontaire) et réfugié (fuite d'un danger, protégé par la convention de Genève).</div>"},
{"id": "urbanisation","theme": "L'urbanisation du monde (Collège)","niveau": "Collège","titre": "L'urbanisation du monde","cours": "<div class=\"cours-head\"><h2>L'urbanisation du monde</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Un monde urbain</h3>\n<div class=\"tip\">Plus de <b>57 % de l'humanité vit en ville</b> (contre 30 % en 1950), et l'ONU projette environ 68 % en 2050. Les <b>métropoles</b> (Tokyo ~37 millions, Delhi, Shanghai, São Paulo) concentrent les fonctions de commandement : finance (la City, Wall Street), sièges sociaux, politique, culture. Les <b>mégapoles</b> (plus de 10 millions d'habitants : une trentaine, surtout dans le Sud) et les <b>mégalopoles</b> (axes urbains continus : Boston-Washington, Tokaido au Japon) illustrent l'ampleur du phénomène.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la croissance d'une ville du Sud : Lagos</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Lagos (Nigeria) est passée d'environ 300 000 habitants en 1950 à plus de 15 millions : raconter et expliquer cette explosion.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les chiffres</b> : un doublement tous les 15 ans environ, l'un des rythmes les plus rapides du monde ; les projections évoquent 40 millions vers 2050.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les moteurs</b> : l'exode rural (les campagnes pauvres du Nigeria), l'explosion démographique naturelle, le rôle économique (le port, le pétrole, Nollywood, l'économie informelle massive).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les défis</b> : logements (les bidonvilles comme Makoko), transports (les « go-slow » légendaires), eau, électricité, inondations. Ici, l'urbanisation précède le développement : les services n'ont pas suivi la croissance.</div></div></details>\n<h3>2. Villes du Nord : centres, banlieues, périurbain</h3>\n<div class=\"tip\">La ville européenne juxtapose le centre ancien (monuments, prix du foncier élevés, <b>gentrification</b> : les populations aisées rénovent les quartiers populaires et en chassent les anciens habitants), les <b>banlieues</b> (grands ensembles, quartiers prioritaires, politique de la ville) et le <b>périurbain</b> (maisons individuelles, dépendance à la voiture, étalement urbain qui consomme les terres agricoles). Les réponses : la <b>ville durable</b> — transports en commun (tramways, vélo), densification, réhabilitation des friches, écoquartiers.</div>\n<h3>3. Les inégalités urbaines</h3>\n<div class=\"tip\">Toutes les villes cumulent richesse (quartiers dorés, gated communities, records du prix au m²) et pauvreté : environ <b>1 milliard de personnes vivent dans des bidonvilles</b>. Les inégalités se lisent dans les prix immobiliers, l'accès aux services et aux espaces verts (les quartiers pauvres sont aussi les moins arborés et les plus exposés aux îlots de chaleur) : la géographie sociale d'une ville se cartographie rue par rue.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « mégapole » est un seuil chiffré (plus de 10 millions), pas un superlatif. Le périurbain n'est pas la campagne (des urbains en habitat dispersé). « Mégalopole » désigne un axe continu de métropoles fusionnées, pas une très grande ville. Les définitions (ville administrative ou aire urbaine) changent les classements.</div>"},
{"id": "developpement-inegalites","theme": "Développement et inégalités dans le monde (Collège)","niveau": "Collège","titre": "Développement et inégalités dans le monde","cours": "<div class=\"cours-head\"><h2>Développement et inégalités dans le monde</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Mesurer le développement : l'IDH et au-delà</h3>\n<div class=\"tip\">Le <b>PIB</b> (la richesse produite) est insuffisant. L'<b>IDH</b> (indice de développement humain, PNUD 1990) combine trois dimensions : la <b>santé</b> (espérance de vie), l'<b>éducation</b> (années de scolarisation) et le <b>niveau de vie</b> (revenu par habitant). Un indice entre 0 et 1 : la Norvège ~0,97, le Niger ~0,40. Limite majeure : une moyenne masque les inégalités internes — d'où les indices complémentaires (IDH ajusté des inégalités, pauvreté multidimensionnelle).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — comparer deux pays avec l'IDH</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La Norvège (IDH ~0,97) et le Niger (IDH ~0,40) : expliquer l'écart et ce que l'IDH montre et ne montre pas.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les composantes</b> : Norvège : espérance de vie ~83 ans, 13 années de scolarisation en moyenne, revenu élevé. Niger : ~62 ans, ~2 ans de scolarisation secondaire, revenu très bas. Chaque ligne contribue à l'écart.</div><div class=\"etu\"><b>Étape 2</b> — <b>Ce que l'IDH montre</b> : le développement n'est pas que l'argent — santé et éducation pèsent autant. Un pays pétrolier riche mais peu scolarisé (le Qatar) ne peut pas « tricher ».</div><div class=\"etu\"><b>Étape 3</b> — <b>Les limites</b> : l'IDH est une moyenne qui masque les écarts internes (les travailleurs migrants du Qatar sont invisibles dans la moyenne) et ignore l'environnement et les libertés. D'où les indices complémentaires.</div></div></details>\n<h3>2. Des Nords et des Suds multiples</h3>\n<div class=\"tip\">Le monde n'est pas binaire. Côté Suds : les <b>pays émergents</b> (BRICS : croissance forte, montée en puissance, mais pauvretés et inégalités internes massives), les pays en développement « classiques » et les <b>PMA</b> (44 pays les moins avancés, critères de l'ONU : revenu bas, capital humain faible, vulnérabilité — majorité au Sahel). Côté Nords : les vieilles puissances qui vieillissent et les pétromonarchies riches mais peu diversifiées. Les contrastes existent aussi DANS chaque pays : quartiers pauvres du Nord, ghettos de richesse du Sud.</div>\n<h3>3. Pauvreté et inégalités : les grandes tendances</h3>\n<div class=\"tip\">La pauvreté extrême (moins de 2,15 $/jour, seuil Banque mondiale 2022) a fortement reculé depuis 1990 — la Chine en a sorti des centaines de millions — mais les inégalités <b>internes</b> explosent presque partout : le monde devient plus égal entre pays et plus inégal à l'intérieur de chaque pays. Les réponses internationales : les <b>ODD</b> (17 objectifs de l'ONU pour 2030), l'aide publique au développement (objectif historique de 0,7 % du revenu national, rarement atteint), aux côtés des transferts privés des migrants qui la dépassent.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> développement ≠ croissance (la croissance produit de la richesse ; le développement améliore les vies : le pétrole sans écoles fait l'un sans l'autre). Le PIB/habitant se compare en <b>PPA</b> (parité de pouvoir d'achat) : un dollar achète plus de choses au Niger qu'en Norvège. Les « Suds » ne sont pas tous pauvres.</div>"},
{"id": "mondialisation","theme": "La mondialisation : flux et réseaux (Lycée)","niveau": "Lycée","titre": "La mondialisation : flux et réseaux","cours": "<div class=\"cours-head\"><h2>La mondialisation : flux et réseaux</h2><span class=\"niv\">Lycée</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Des flux massifs et asymétriques</h3>\n<div class=\"tip\">La mondialisation est la mise en relation généralisée des territoires par des <b>flux</b> : marchandises (environ 80 % par mer, porte-conteneurs géants), capitaux (les places financières reliées en continu), informations (câbles sous-marins : plus de 95 % des données), personnes (tourisme : 1,4 milliard de touristes internationaux, migrations de travail). Ces flux sont <b>asymétriques</b> : 80 % partent, transitent ou arrivent dans les pays du Nord et les émergents ; l'Afrique reste en marge des flux maritimes et financiers.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le trajet d'un smartphone</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire la mondialisation à travers le trajet et la fabrication d'un smartphone.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les composants</b> : silicium taïwanais (TSMC), écrans coréens ou japonais, mémoires, batteries au lithium (Chili, Australie), assemblage en Chine ou au Vietnam : une chaîne de valeur mondiale fragmentée, chaque étape placée là où elle est la plus compétitive.</div><div class=\"etu\"><b>Étape 2</b> — <b>La logistique</b> : transport maritime conteneurisé, hubs portuaires (Shanghai, Singapour, Rotterdam), plateformes logistiques, livraison finale : le coût du transport reste marginal dans le prix final.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'analyse</b> : la valeur se concentre en amont (conception, brevets) et en aval (marque, services) : l'assemblage ne capte qu'une faible part du prix. Conclusion : la mondialisation est un système de mise en relation inégale — des territoires gagnants (les métropoles du Nord et des émergents) et des marges.</div></div></details>\n<h3>2. Les acteurs et les réseaux</h3>\n<div class=\"tip\">Les acteurs : les <b>FTN</b> (firmes transnationales — Apple, Toyota : plus de la moitié du commerce mondial est intra-firme), les États (régulation, accords, protectionnisme), les organisations (OMC, FMI), les villes mondiales (les nœuds du réseau). Le réseau : les <b>métropoles</b> reliées entre elles (New York, Londres, Tokyo, Paris, Singapour) forment l'archipel mondial ; les <b>interfaces</b> (ports, frontières, détroits stratégiques : Ormuz, Malacca, Gibraltar) concentrent les passages ; les <b>marges</b> (enclaves, États enclavés d'Afrique sahélienne, AfPak) restent mal connectées.</div>\n<h3>3. Réguler et contester la mondialisation</h3>\n<div class=\"tip\">La mondialisation n'est pas un processus naturel : elle est <b>régulée</b> (OMC depuis 1995, accords régionaux, règles sanitaires) et <b>contestée</b> : altermondialisme, souverainisme, remises en cause des délocalisations. Les tensions actuelles : guerre commerciale sino-américaine, « découplages », relocalisations stratégiques (semi-conducteurs, pharmacie), régionalisation des chaînes (nearshoring). La mondialisation se poursuit mais se recompose : « slowbalisation ».</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la mondialisation n'est pas homogène (des flux asymétriques et des marges) ; elle ne date pas de 1990 (première mondialisation au XIXe siècle) ; la « fin de la mondialisation » est un raccourci médiatique : les flux se recomposent plus qu'ils ne disparaissent (recomposition régionale, réorientation des flux).</div>"},
{"id": "mers-oceans","theme": "Mers et océans : un monde maritimisé (Lycée)","niveau": "Lycée","titre": "Mers et océans : un monde maritimisé","cours": "<div class=\"cours-head\"><h2>Mers et océans : un monde maritimisé</h2><span class=\"niv\">Lycée</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Un monde maritimisé</h3>\n<div class=\"tip\">Les mers concentrent les enjeux : environ <b>80 % du commerce mondial</b> transite par voie maritime, les câbles sous-marins (plus de 95 % des données), la pêche (environ 90 millions de tonnes par an), les ressources énergétiques et minérales (un quart des hydrocarbures provient de l'offshore, les nodules polymétalliques des grands fonds). Les littoraux se peuplent : environ 40 % de l'humanité vit à moins de 100 km d'une côte, et les façades maritimes (l'Asie orientale, la Northern Range européenne, la côte Est américaine) concentrent les métropoles et les villes mondiales.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la ZEE française, deuxième du monde</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer pourquoi la France possède la deuxième zone économique exclusive du monde (environ 10,2 millions de km²) et ce que cela représente.</div><div class=\"etu\"><b>Étape 1</b> — <b>La construction juridique</b> : la convention de Montego Bay (1982) donne à tout État côtier une ZEE de 200 milles marins : la France, avec ses outre-mer (Clipperton, Kerguelen, Nouvelle-Calédonie, Polynésie...), cumule les zones autour de chaque territoire — 97 % de sa ZEE est ultramarine.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les ressources</b> : pêche (thon pacifique), nodules polymétalliques, possibles hydrocarbures, biodiversité (récifs, mangroves) : un patrimoine à surveiller (surveillance maritime, Marine nationale, satellites).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les responsabilités</b> : la France doit protéger ces immensités (aires marines protégées, lutte contre la pêche illégale) et en tirer des richesses : un enjeu de souveraineté et d'influence dans l'Indo-Pacifique.</div></div></details>\n<h3>2. Le droit de la mer et les tensions</h3>\n<div class=\"tip\">La convention de <b>Montego Bay</b> (1982) organise l'espace maritime : eaux territoriales (12 milles), ZEE (200 milles : exploration et exploitation des ressources), plateau étendu (jusqu'à 350 milles sur dossier scientifique), la haute mer (les « biens communs de l'humanité » : l'Autorité internationale des fonds marins). Les tensions : la mer de Chine méridionale (les « neuf traits » chinois face aux revendications des voisins), le passage du Nord-Est (ouverture arctique), les courses aux ressources des grands fonds (les nodules), la piraterie (golfe de Guinée, corne de l'Afrique) et la surpêche (le tiers des stocks exploités au-delà du seuil de renouvellement).</div>\n<h3>3. Littoralisation et pression sur les milieux</h3>\n<div class=\"tip\">Les littoraux s'artificialisent (ports, aménagements, bétonnage des côtes : plus d'un tiers des côtes méditerranéennes sont artificialisées), les villes du littoral s'exposent (la montée du niveau marin, les submersions : le risque s'installe avec la maritimisation). Les réponses : la trame verte et bleue, les Aires marines protégées (objectif de 10 % en 2020, 30 % en 2030), la restauration des mangroves et des récifs (les « infrastructures naturelles »), les réglementations de pêche (quotas, aires interdites).</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la maritimisation n'est pas la « conquête des océans » mais leur mise en valeur multiple (transport, ressources, loisirs, stratégies) ; la ZEE n'est pas un territoire souverain (la souveraineté ne s'exerce que dans les 12 milles : au-delà, ce sont des droits économiques) ; ne pas confondre plateau continental juridique et plateau étendu (le second doit être prouvé devant l'ONU).</div>"},
{"id": "france-territoires","theme": "La France : territoires et aménagement (Lycée)","niveau": "Lycée","titre": "La France : territoires et aménagement","cours": "<div class=\"cours-head\"><h2>La France : territoires et aménagement</h2><span class=\"niv\">Lycée</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Un territoire original : la « hexagonale » et l'outre-mer</h3>\n<div class=\"tip\">La France métropolitaine (environ 552 000 km², la « Hexagone ») offre une situation de <b>interface</b> (façades atlantique et méditerranéenne, isthme européen) et une <b>double ouverture</b> (maritime et continentale). À cela s'ajoutent les <b>DROM</b> (Guadeloupe, Martinique, Guyane, La Réunion, Mayotte) et les <b>COM</b> (Polynésie, Nouvelle-Calédonie, etc.) : la deuxième ZEE du monde (environ 10,2 millions de km²) — 97 % ultramarine. Le territoire français est donc à la fois européen, atlantique, méditerranéen, et mondial par l'outre-mer.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — les contrastes territoriaux français</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le « territoire français » est-il homogène ? Montrer les contrastes et l'action de l'État.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les contrastes</b> : l'axe majeur Paris-Lyon-Marseille concentre les hommes et les activités ; les métropoles régionales (Toulouse, Bordeaux, Nantes, Lille) gagnent ; les espaces ruraux vieillissants (« diagonale du vide ») perdent ; les outre-mer cumulent handicaps (éloignement, chômage) et atouts (ZEE, jeunesse, biodiversité).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'action de l'État</b> : aménagement du territoire : décentralisation (lois 1982-2015), métropolisation encouragée (les 22 métropoles), rééquilibrage (les maisons France services dans les campagnes, le plan fibre), politiques de la ville pour les quartiers prioritaires.</div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan nuancé</b> : les écarts persistent (les aires urbaines gagnent toujours), mais la France reste un des pays européens les moins « macrocéphales » comparée à ses voisins.</div></div></details>\n<h3>2. Les dynamiques : métropolisation, littoralisation, périurbanisation</h3>\n<div class=\"tip\">La France se <b>métropolise</b> (les plus grandes aires urbaines gagnent habitants et fonctions : commandement, universités, emplois supérieurs) et se <b>littoralise</b> (les côtes attirent résidents et touristes). Les espaces en difficulté : les villes moyennes et le rural profond. Les recompositions : le périurbain (l'habitat dispersé automobile) se démocratise, le télétravail post-Covid renouvelle certaines campagnes (les « néo-ruraux »), et les outrages de la « France périphérique » alimentent le débat politique sur les territoires oubliés.</div>\n<h3>3. Aménager : acteurs, outils, débats</h3>\n<div class=\"tip\">Les acteurs : l'État (grands projets : LGV, autoroutes, réindustrialisation), les <b>collectivités territoriales</b> (régions, départements, intercommunalités : le budget et les compétences depuis les lois de décentralisation), l'Union européenne (les fonds structurels pour les régions en retard), les acteurs privés. Les outils : le <b>plan (SCOT, PLU)</b>, les documents stratégiques (SRDE), les contrats de plan État-région. Les débats : le Grand Paris (le plus grand chantier d'Europe : le métropolitain, les Jeux olympiques), la place des métropoles contre les villes moyennes, l'égalité des territoires (les services publics en recul dans les zones peu denses : la « fracture territoriale »).</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la France n'est pas « uniquement hexagonale » (les outre-mer sont des territoires français à part entière, la ZEE est la deuxième mondiale) ; « désert français » : un raccourci à nuancer (des espaces dynamiques existent hors des métropoles : les villes moyennes attractives, les littoraux, les régions frontalières) ; le Grand Paris Express est un métro (pas un train « classique »), et la décentralisation ne veut pas dire « retrait de l'État » mais partage des compétences.</div>"}];
var FICHES_DATA = [{"id": "population-mondiale","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Répartition</b> : 8 milliards ; les foyers (Asie de l'Est et du Sud, Europe, NE américain) contre les vides (déserts, froid, montagnes, forêts).</p>\n<p><b>Croissance</b> : transition démographique (la mortalité baisse, puis la natalité) ; l'Afrique jeune, l'Europe vieille ; pic ~10 milliards vers 2080.</p>\n<p><b>Migrations</b> : plus de 280 millions de migrants ; Suds vers Nords ; réfugiés et travail ; transferts d'argent massifs.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Lire une carte de densité</b> : légende, localisation, explication.</li>\n<li><b>Comparer deux pyramides</b> : large = jeune, toupie = vieille.</li>\n<li><b>Distinguer migrant et réfugié</b> : le droit change tout.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Densité ne veut pas dire surpopulation : tout dépend des ressources.</li>\n<li>La croissance mondiale ralentit déjà.</li>\n<li>Migrant et réfugié : deux statuts, deux droits.</li>\n</ul>"},
{"id": "urbanisation","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Un monde urbain</b> : 57 % de citadins (68 % attendus en 2050) ; métropoles, mégapoles (plus de 10 millions), mégalopoles (axes continus).</p>\n<p><b>Le Nord</b> : centres gentrifiés, banlieues et périurbain ; projets de ville durable (densité, transports en commun).</p>\n<p><b>Le Sud</b> : croissance explosive (Lagos), bidonvilles (1 milliard de personnes), informel, services en retard.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Classer les villes</b> : métropole (fonctions), mégapole (seuil 10 millions), mégalopole (axe).</li>\n<li><b>Analyser une photo de bidonville</b> : matériaux, site, services manquants.</li>\n<li><b>Discuter l'étalement urbain</b> : coûts (terres, voiture) et solutions (densité, transports).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Mégapole = seuil chiffré, pas une « très grande capitale ».</li>\n<li>Le périurbain n'est pas rural.</li>\n<li>Gentrification = revitalisation ET exclusion : toujours discuter les deux faces.</li>\n</ul>"},
{"id": "developpement-inegalites","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Mesurer</b> : PIB (insuffisant) → IDH (santé + éducation + revenu, PNUD 1990) ; catégories ONU : PMA (44 pays) ; émergents (BRICS).</p>\n<p><b>Nords/Suds multiples</b> : émergents, PMA du Sahel, pétromonarchies ; contrastes internes à chaque pays.</p>\n<p><b>Tendances</b> : pauvreté extrême en recul (seuil 2,15 $/jour) ; inégalités internes en hausse ; ODD (17 objectifs 2030) ; APD (objectif 0,7 %).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Lire un IDH</b> : les trois composantes et leurs valeurs.</li>\n<li><b>Comparer deux pays</b> avec plusieurs indicateurs (IDH, Gini, PPA).</li>\n<li><b>Distinguer croissance et développement</b> avec des exemples.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Développement ≠ croissance (Nigeria pétrolier contre Costa Rica).</li>\n<li>PIB/habitant : toujours corriger en PPA.</li>\n<li>Les moyennes (IDH) masquent les inégalités internes.</li>\n</ul>"},
{"id": "mondialisation","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Flux</b> : marchandises (80 % par mer), capitaux, informations (câbles sous-marins), personnes — asymétriques, concentrés sur l'axe Nord/émergents.</p>\n<p><b>Acteurs</b> : FTN (plus de la moitié du commerce intra-firme), États, OMC, métropoles mondiales ; interfaces et détroits (Ormuz, Malacca).</p>\n<p><b>Régulation et contestation</b> : OMC, accords régionaux ; altermondialisme, souverainisme ; « slowbalisation » et relocalisations stratégiques.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Analyser une carte des flux</b> : volume, direction, asymétrie.</li>\n<li><b>Étudier une chaîne de valeur</b> : où se crée la valeur (amont/aval contre assemblage).</li>\n<li><b>Distinguer mondialisation et globalisation</b> : extension des flux contre uniformisation.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Pas une « fin » mais une recomposition (régionalisation).</li>\n<li>Les marges existent toujours (États enclavés, enclaves du Nord).</li>\n<li>Ne pas confondre flux commerciaux et flux financiers.</li>\n</ul>"},
{"id": "mers-oceans","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Maritimisation</b> : 80 % du commerce maritime, 95 % des données par câbles, 40 % de l'humanité à moins de 100 km d'une côte.</p>\n<p><b>Droit de la mer</b> : Montego Bay 1982 — eaux territoriales 12 milles, ZEE 200 milles, plateau étendu, haute mer = bien commun.</p>\n<p><b>Tensions</b> : mer de Chine méridionale, Arctique, nodules des grands fonds, piraterie, surpêche ; littoralisation et montée des eaux.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Lire une carte des routes maritimes</b> : les détroits et canaux comme goulots.</li>\n<li><b>Calculer/lire une ZEE</b> : les règles Montego Bay, l'exemple français.</li>\n<li><b>Décrire une façade maritime</b> : métropoles, ports, aménagements.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>ZEE = droits économiques, pas souveraineté.</li>\n<li>Haute mer = bien commun de l'humanité (pas « no man's land »).</li>\n<li>La montée des eaux rend le littoral attractif ET exposé : la double lecture.</li>\n</ul>"},
{"id": "france-territoires","fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Territoire</b> : l'Hexagone (552 000 km²) en interface + DROM/COM : deuxième ZEE mondiale (10,2 millions de km², 97 % ultramarine).</p>\n<p><b>Dynamiques</b> : métropolisation (les grandes aires gagnent), littoralisation, périurbanisation ; en difficulté : villes moyennes et rural profond.</p>\n<p><b>Aménagement</b> : État + collectivités (décentralisation) + UE (fonds structurels) ; outils : SCOT, PLU, contrats de plan ; débats : Grand Paris, fracture territoriale.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Lire une carte des dynamiques démographiques</b> : les aires qui gagnent/perdent.</li>\n<li><b>Présenter un acteur de l'aménagement</b> : compétences, budget, projet.</li>\n<li><b>Décrire un aménagement local</b> (LGV, tramway, zone d'activité) : objectifs, acteurs, effets.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>La France est aussi ultramarine (ZEE n°2 mondiale).</li>\n<li>Le « désert français » : une nuance à discuter, pas une évidence.</li>\n<li>Décentralisation = partage des compétences, pas retrait de l'État.</li>\n</ul>"}];
var QUESTIONS = [{"t": "La population mondiale : croissance et répartition (Collège)","q": "Les principaux foyers de peuplement mondiaux sont :","c": ["l'Amérique du Sud et l'Australie","l'Antarctique et le Groenland","le Sahara","l'Asie de l'Est et du Sud, l'Europe et le Nord-Est américain"],"a": 3,"e": "L'Asie de l'Est et du Sud concentre plus d'un tiers de l'humanité (vallées du Yangzi et du Gange) ; l'Europe et le NE américain complètent les grands foyers.","d": "<b>Trois foyers, des vides.</b><div class='ex-detail'><u>Exemple rédigé</u> : l'Asie de l'Est (bassin du Yangzi, rizières nourricières) et l'Asie du Sud (plaine du Gange, sols fertiles, mousson) totalisent plus de 3 milliards d'habitants. L'Europe de l'Ouest forme un foyer ancien (« cœur européen » de Londres à Milan). Le NE américain (mégalopole Boston-Washington) s'est peuplé par l'industrialisation et l'immigration. À l'opposé, les vides : Sahara (aridité), Sibérie (froid), Amazonie (forêt), Antarctique (inhabitée). Conclusion : la répartition suit l'eau, le climat et les activités, et la moitié de l'humanité vit près des côtes. <b>Piège</b> : l'Amérique du Sud est un vide relatif (populations littorales, intérieur presque vide) — ne pas la citer comme foyer majeur.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "La transition démographique se définit comme :","c": ["une migration massive","le passage d'un régime ancien (forte natalité ET forte mortalité) à un régime moderne (les deux faibles), avec une forte croissance entre les deux","une politique de natalité","la fin des naissances"],"a": 1,"e": "La mortalité baisse d'abord (médecine, hygiène), la natalité suit avec un décalage : l'écart entre les deux crée l'explosion de la croissance.","d": "<b>Le décalage créateur d'explosion.</b><div class='ex-detail'><u>Exemple rédigé</u> : au départ, régime ancien : natalité et mortalité hautes, croissance quasi nulle. Puis la mortalité s'effondre (vaccination, eau potable, antibiotiques) tandis que la natalité reste haute quelques décennies : l'accroissement naturel atteint 3 % par an, la population double en 25 ans. Enfin, la natalité baisse à son tour : croissance faible ou négative, vieillissement (Europe, Japon). Application : la France a transitionné vers 1800-1900 ; le Niger est au milieu de sa transition ; la Corée du Sud est déjà au stade final (IDF ~0,8). <b>Piège</b> : la transition est un processus, pas une politique (les politiques peuvent l'accélérer mais pas la créer).</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "Le vieillissement en Europe pose surtout le problème :","c": ["du financement des retraites et des dépenses de santé, avec moins d'actifs pour plus d'inactifs","du logement des étudiants","de la surpopulation scolaire","de l'armée"],"a": 0,"e": "La part des 65 ans et plus dépasse 20 % en Italie ou en Allemagne : le rapport actifs/retraités se dégrade, d'où les réformes et le débat sur les migrations.","d": "<b>Le rapport actifs/retraités.</b><div class='ex-detail'><u>Exemple rédigé</u> : le système de retraites par répartition fait payer les pensions des retraités par les cotisations des actifs. Avec l'IDF ~1,5 (sous le seuil de renouvellement de 2,1) et l'arrivée à la retraite des générations du baby-boom, le rapport passe de 4 actifs pour 1 retraité à moins de 2 : il faut cotiser plus, travailler plus longtemps ou accueillir des migrants. S'ajoutent les dépenses de santé (maladies chroniques, dépendance, soignants manquants). Conclusion : le vieillissement est un défi silencieux mais structurant du siècle. <b>Piège</b> : ce n'est pas une crise passagère mais une tendance profonde (l'espérance de vie gagne environ 2 ans par décennie).</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "Un réfugié se distingue d'un migrant économique car :","c": ["il est plus riche","il n'a pas de nationalité","il voyage pour du tourisme","il fuit un danger (guerre, persécution) et bénéficie d'une protection internationale (convention de Genève, 1951)"],"a": 3,"e": "Le réfugié traverse une frontière pour échapper à une persécution ; il bénéficie du principe de non-refoulement. Le migrant économique choisit de partir pour travailler.","d": "<b>Deux statuts, deux droits.</b><div class='ex-detail'><u>Exemple rédigé</u> : le migrant économique part par choix pour un meilleur salaire (les États-Unis, le Golfe) ; il est soumis aux visas et quotas, et peut rentrer. Le réfugié part sous la contrainte (Syrie 2015, Ukraine 2022) ; la convention de Genève lui interdit d'être renvoyé vers le danger (non-refoulement), et le HCR l'assiste (camps, statut, procédures d'asile comme l'OFPRA en France). En réalité, les flux sont « mixtes » : des économiques et des réfugiés voyagent ensemble, d'où la difficulté des contrôles aux frontières. <b>Piège</b> : le vocabulaire juridique compte — le réfugié est protégé, l'économique est soumis aux décisions de l'État d'accueil.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "La population mondiale devrait :","c": ["tripler d'ici 2050","rester à 8 milliards pour toujours","atteindre un pic d'environ 10 milliards vers 2080 puis se stabiliser","diminuer dès 2030"],"a": 2,"e": "Selon l'ONU, le pic est attendu vers 2080 (~10,3 milliards) : la fécondité mondiale baisse, la croissance se concentre sur l'Afrique subsaharienne.","d": "<b>Le pic puis le plateau.</b><div class='ex-detail'><u>Exemple rédigé</u> : historiquement : 1 milliard vers 1800, 2 en 1927, 8 en 2022. Aujourd'hui, l'IDF mondial est ~2,3 et baisse presque partout (Inde ~2, Afrique subsaharienne ~4,5 mais en recul). Les scénarios de l'ONU projettent ~10,3 milliards en 2080 puis un plateau, avec des incertitudes (scénarios bas 8,7, haut plus de 12). Les leviers : l'éducation des filles et l'accès à la contraception sont les facteurs numéro un de baisse de fécondité. <b>Piège</b> : le mot « explosion » date du XXe siècle ; le mot juste aujourd'hui est « ralentissement » (les repères attendus : 10 milliards, 2080, stabilisation).</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "La densité de population se calcule :","c": ["au recensement des voitures","en additionnant les naissances","en comptant les maisons","en divisant la population par la superficie (habitants/km²) — une moyenne qui masque les contrastes locaux"],"a": 3,"e": "Densité = population ÷ superficie. La moyenne mondiale est ~60 hab/km², mais les écarts vont de 2 (Australie) à plus de 7 000 (Singapour).","d": "<b>Population ÷ superficie.</b><div class='ex-detail'><u>Exemple rédigé</u> : la France métropolitaine : 68 millions ÷ 552 000 km² ≈ 123 hab/km². Ordres de grandeur : Europe ~110, Bangladesh ~1 300 (record), déserts ~0. Mais la moyenne masque tout : Paris intra-muros dépasse 20 000 hab/km² tandis que la Lozère en compte moins de 15. La densité sert donc de point de départ à une description, jamais de conclusion : il faut ensuite expliquer (l'eau, l'agriculture, les villes). <b>Piège</b> : densité ne veut pas dire surpeuplement — le Bangladesh nourrit sa population avec ses rizières, tandis que des pays « vides » connaissent des difficultés alimentaires. C'est le rapport population/ressources qui compte.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "L'Afrique subsaharienne se distingue aujourd'hui par :","c": ["l'absence de villes","une population vieillissante","une population en baisse","une croissance démographique très forte (IDF élevé, plus de la moitié de la croissance mondiale d'ici 2050, une extrême jeunesse)"],"a": 3,"e": "L'IDF ~4,5, une population qui double en ~30 ans, plus de 60 % de moins de 25 ans : les défis de l'école, de l'emploi et de la nourriture — mais aussi un « dividende démographique » possible si l'éducation suit.","d": "<b>La jeunesse du monde.</b><div class='ex-detail'><u>Exemple rédigé</u> : les chiffres : Niger IDF 6,7, Mali 6 ; les moins de 15 ans représentent 40-45 % de la population, et le Nigeria approchera 400 millions d'habitants (3e rang mondial). Les défis : scolariser des classes qui doublent, créer des emplois pour les jeunes arrivant sur le marché, nourrir des villes en explosion (Lagos). L'opportunité : le « dividende démographique », c'est-à-dire une main-d'œuvre abondante qui a fait la fortune des « dragons » asiatiques — à condition d'investir dans l'éducation et la santé. <b>Piège</b> : ne pas écrire « l'Afrique est pauvre parce que trop peuplée » ; ce sont les institutions et l'éducation qui déterminent le décollage, pas la seule démographie.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "Les « migrants environnementaux » partent à cause de :","c": ["la mode","les réseaux sociaux","un amour des voyages","les dégradations de leur milieu liées au changement climatique (montée des eaux, sécheresses, cyclones, désertification)"],"a": 3,"e": "Deltas du Gange, îles du Pacifique (Kiribati, Tuvalu), Sahel : la Banque mondiale craint des centaines de millions de déplacés internes d'ici 2050 — et le statut juridique manque encore.","d": "<b>Le climat comme cause de départ.</b><div class='ex-detail'><u>Exemple rédigé</u> : les îles du Pacifique (Kiribati, Tuvalu) : la montée du niveau marin salinise l'eau douce et noie les cultures ; des négociations de relocation sont engagées avec l'Australie et la Nouvelle-Zélande. Les deltas (Bangladesh) : cyclones et inondations poussent les habitants vers Dhaka. Le Sahel : la désertification oppose pasteurs et agriculteurs et alimente les conflits. Le problème juridique : la convention de Genève ne protège que les persécutés — le « déplacé climatique » n'a pas encore de statut international (des conventions régionales comme celle de Kampala font figure d'avancée). <b>Piège</b> : ne pas écrire que le déplacé climatique est « protégé comme un réfugié » — c'est justement la nuance juridique qui est attendue.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "L'espérance de vie à la naissance mesure :","c": ["la durée moyenne de vie d'une génération : un indicateur de développement et de santé","la taille moyenne","le nombre d'enfants par femme","le nombre d'écoles"],"a": 0,"e": "En moyenne mondiale ~73 ans (Japon ~84, Niger ~62, France ~82) : elle dépend de la santé, de la nourriture, de l'hygiène et de la richesse.","d": "<b>L'indicateur santé.</b><div class='ex-detail'><u>Exemple rédigé</u> : l'espérance de vie résume les conditions de santé d'une population. Les progrès du XXe siècle (+30 ans en France) viennent des antibiotiques, de la vaccination et de la sécurité sociale. Les écarts actuels (Japon 84, Niger 62) s'expliquent par la mortalité infantile, l'accès aux soins et à l'eau potable. Subtilité utile : on distingue désormais l'espérance de vie « en bonne santé », car allonger la vie ne suffit plus : il faut aussi des années sans dépendance. <b>Piège</b> : l'espérance de vie n'est pas un âge maximum mais une moyenne statistique calculée pour une génération donnée.</div>"},
{"t": "La population mondiale : croissance et répartition (Collège)","q": "Les transferts d'argent des migrants vers leurs pays d'origine :","c": ["représentent plus de 650 milliards de dollars par an, souvent plus que l'aide publique au développement","sont négligeables","ne servent à rien","sont interdits par l'ONU"],"a": 0,"e": "Les Philippines, le Maroc, le Mexique, le Sénégal reçoivent des milliards : la nourriture, l'école, les maisons et les micro-entreprises — une « aide privée internationale ».","d": "<b>Les flux invisibles.</b><div class='ex-detail'><u>Exemple rédigé</u> : les migrants envoient chaque année plus de 650 milliards de dollars vers leur famille — plus du triple de l'aide publique au développement. Exemples : l'Inde reçoit plus de 100 milliards (record mondial), les Philippines environ 10 % de leur PIB (les infirmières et marins de la diaspora), le Mexique des flux massifs depuis les États-Unis qui construisent les « maisons des migrants ». Cet argent va directement aux ménages : nourriture, scolarisation, santé, micro-entreprises — un filet de sécurité auto-organisé. <b>Piège</b> : ne pas confondre transferts privés des migrants et aide publique des États : ce sont deux colonnes différentes de la solidarité internationale.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "Une mégapole est :","c": ["une ville très belle","un village","une capitale européenne","une aire urbaine de plus de 10 millions d'habitants (Tokyo, Delhi, Lagos...)"],"a": 3,"e": "Le mot est chiffré : l'ONU retient le seuil de 10 millions d'habitants ; on en compte une trentaine, majoritairement dans le Sud.","d": "<b>Un seuil, pas un jugement.</b><div class='ex-detail'><u>Exemple rédigé</u> : le seuil de 10 millions s'applique à l'aire urbaine (l'agglomération continue), pas à la ville administrative — c'est pourquoi les classements varient selon les définitions. Exemples : Tokyo ~37 millions (la plus grande), Delhi ~32, Shanghai, São Paulo, Mexico, Le Caire, Mumbai, Lagos ~15. À distinguer : métropole = fonctions de commandement (une ville moyenne peut en avoir : Francfort) ; mégalopole = axe urbain continu (Boston-Washington). <b>Piège</b> : « mégapole » ne veut pas dire « capitale » — Lagos n'est PAS la capitale du Nigeria (c'est Abuja) : le mot renvoie à la taille, pas au statut administratif.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "L'exode rural désigne :","c": ["un type de carte","les vacances à la campagne","le départ des populations campagnardes vers les villes, attirées par les emplois et les services","la fin des moissons"],"a": 2,"e": "Moteurs : les écarts de salaires, l'école, l'hôpital, les loisirs. Effets : campagnes qui vieillissent et perdent leurs services, villes qui gonflent.","d": "<b>La campagne qui se vide, la ville qui gonfle.</b><div class='ex-detail'><u>Exemple rédigé</u> : les causes du départ (les « push ») : mécanisation agricole, petites exploitations, sécheresses et dettes. Les attractions urbaines (les « pull ») : un salaire urbain vaut plusieurs revenus agricoles ; s'ajoutent l'école, l'hôpital et les réseaux familiaux déjà installés (les « chaînes migratoires »). Conséquences côté campagnes : vieillissement, écoles et commerces qui ferment, déserts médicaux — une spirale. Côté villes : afflux de population, tension sur le logement (banlieues au Nord, bidonvilles au Sud). <b>Piège</b> : les campagnes ne se « vident » pas partout : le périurbain et le télétravail recomposent les espaces ruraux, et les navettes quotidiennes relient désormais ville et campagne.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "Les bidonvilles du Sud se caractérisent par :","c": ["l'habitat précaire et l'informel (matériaux de récupération, pas d'eau courante ni d'égouts, occupations illégales) abritant environ 1 milliard de personnes","des châteaux","des tours modernes","des villas de luxe"],"a": 0,"e": "Les slums cumulent : pas de titre de propriété, pas d'adresse, services privés coûteux (l'eau vendue en bidons) — mais aussi une vraie économie informelle organisée.","d": "<b>L'informe qui loge un milliard de personnes.</b><div class='ex-detail'><u>Exemple rédigé</u> : le portrait : autoconstruction en tôle, carton et parpaing sur des terrains risqués (pentes, fonds inondables, bordures de voies ferrées). Les manques : eau (bornes-fontaines payantes, l'eau revient plus chère qu'au robinet municipal), assainissement (latrines partagées, maladies), électricité (raccordements pirates), et surtout l'adresse : sans adresse, pas de courrier, de compte bancaire ni parfois d'école. Mais le bidonville n'est pas un chaos : Dharavi (Mumbai) abrite de vraies filières (recyclage, cuir) qui produisent des centaines de millions de dollars. Les trois politiques possibles : éradication (souvent un échec social), régularisation (titres de propriété, réseaux) ou réhabilitation sur place (eau, voirie, écoles). <b>Piège</b> : ne pas écrire que le bidonville est un « désordre » — c'est une organisation réelle, avec ses hiérarchies et même ses loyers.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "La gentrification correspond à :","c": ["la construction d'églises","l'arrivée de populations aisées dans des quartiers populaires réhabilités : les loyers montent et les anciens habitants sont repoussés","la disparition des villes","un événement sportif"],"a": 1,"e": "Le processus : un quartier dévalorisé devient attractif (artistes, rénovation, cafés), les investisseurs suivent, les prix s'envolent : revitalisation pour les uns, exclusion pour les autres.","d": "<b>Le tri social par le foncier.</b><div class='ex-detail'><u>Exemple rédigé</u> : le cycle en trois étapes. 1) Le quartier dévalorisé : loyers bas, artistes et étudiants qui s'installent. 2) L'attraction : la rénovation, les cafés, la visibilité médiatique — les investisseurs spéculent, les prix montent. 3) Le remplacement : les anciens locataires ne peuvent plus payer et partent, les commerces changent. Exemples : le Marais et le canal Saint-Martin à Paris, Williamsburg à Brooklyn. Le débat : pour les uns, c'est de la rénovation utile (services, attractivité, recettes fiscales) ; pour les autres, une exclusion organisée. Les outils de régulation : encadrement des loyers, quotas de logement social. <b>Piège</b> : toujours présenter les deux faces (revitalisation ET exclusion) — c'est la nuance qui est évaluée.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "L'étalement urbain pose surtout problème de :","c": ["couleur des toits","manque de place pour les stades","consommation des terres agricoles et dépendance à la voiture dans le périurbain","odeurs"],"a": 2,"e": "Le périurbain bétonne les ceintures maraîchères et rend la voiture obligatoire : budgets, embouteillages, émissions — d'où les réponses : densification, transports en commun, PLU.","d": "<b>La ville qui s'étale.</b><div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : le rêve du pavillon avec jardin, rendu possible par le foncier périphérique moins cher et l'automobile — un cercle : la voiture permet l'éloignement, l'éloignement oblige la voiture. Les coûts : terres agricoles perdues (les ceintures maraîchères repoussées), sols imperméabilisés (crues et ruissellement), budgets familiaux consacrés aux trajets, coûts publics des réseaux dispersés. Les réponses : les plans locaux d'urbanisme (PLU) qui protègent les terres, la densification le long des axes de transport (le modèle « transit-oriented development », comme les « doigts de la main » de Copenhague), les transports en commun. <b>Piège</b> : le périurbain n'est pas « la campagne » — ce sont des résidents urbains en habitat dispersé, dépendants de la voiture.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "Une métropole se définit surtout par :","c": ["sa superficie","son climat","son équipe de football","ses fonctions de commandement (finance, sièges sociaux, politique, culture, transports) et son rayonnement"],"a": 3,"e": "Bourse de New York, City de Londres, sièges des multinationales, ministères, grandes universités : la métropole décide et rayonne au-delà de sa taille.","d": "<b>Commander, pas seulement habiter.</b><div class='ex-detail'><u>Exemple rédigé</u> : la grille d'analyse. Fonctions économiques : places financières (New York, Londres, Tokyo se relaient pour faire « le jour qui ne finit jamais »), sièges sociaux, services avancés (droit, comptabilité, conseil). Fonctions politiques et culturelles : capitales, organisations internationales (New York, Genève, Bruxelles pour l'UE), musées, universités, festivals — le « soft power » urbain. La mesure : les classements (GaWC) fondés sur les connexions aériennes, les flux et les services avancés. <b>Piège</b> : une métropole n'est pas forcément une mégapole — Francfort ou Zurich, de taille modeste, commandent des flux immenses : le mot désigne une fonction, pas une taille.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "La « ville durable » vise à :","c": ["agrandir les parkings","construire plus vite","rapprocher les fonctions, développer les transports en commun et préserver les ressources (écoquartiers, densité maîtrisée, biodiversité)","supprimer les parcs"],"a": 2,"e": "Principes : sobriété des déplacements (vélo, marche, tramway), mixité des fonctions (logement-travail-services), nature en ville contre les îlots de chaleur.","d": "<b>La ville sobre.</b><div class='ex-detail'><u>Exemple rédigé</u> : les principes : densité maîtrisée (lutter contre l'étalement), report modal de la voiture vers le bus, le tram et le vélo (Copenhague : environ 60 % des trajets domicile-travail à vélo), mixité fonctionnelle pour réduire les distances, végétalisation contre les îlots de chaleur et pour l'infiltration des pluies (villes « éponges »). Exemples français : réhabilitation de friches (Lyon-Confluence), écoquartiers, plans canopée de plantation d'arbres. <b>Piège</b> : « écoquartier » n'est pas un label garanti — certains sont des vitrines de promoteurs critiquées pour leur « greenwashing » ; il faut évaluer l'écart entre le discours et la réalité.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "En 2050, la population urbaine mondiale devrait atteindre environ :","c": ["68 % de l'humanité, l'urbanisation continuant surtout en Afrique et en Asie","95 %","40 %","10 %"],"a": 0,"e": "L'ONU projette environ 68 % de citadins en 2050 : environ 90 % de la croissance urbaine viendra d'Afrique et d'Asie — l'enjeu : bâtir les services avant l'arrivée des populations.","d": "<b>Le siècle urbain.</b><div class='ex-detail'><u>Exemple rédigé</u> : les trajectoires : 30 % de citadins en 1950, le cap des 50 % franchi en 2007, 57 % aujourd'hui, environ 68 % attendus en 2050 (soit 2,5 milliards de citadins en plus). L'essentiel de la croissance concernera l'Afrique subsaharienne et l'Asie du Sud : des villes qui doublent en vingt ans, où il faut bâtir eau, écoles et transports avant l'arrivée des populations. Les innovations (« sauts ») sont possibles : le mobile-banking a parfois devancé les réseaux fixes. <b>Piège</b> : le seuil des 50 % est déjà dépassé depuis 2007 — ne pas écrire que « les villes vont bientôt dépasser la moitié » : vérifier les dates.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "La « mégalopole » désigne :","c": ["un désert","une île","une très grande tour","un axe urbain continu formé par la fusion de plusieurs métropoles (Boston-Washington, Tokaido)"],"a": 3,"e": "Le mot (Gottmann, « Megalopolis », 1961) décrit d'abord le corridor Boston-Washington (~50 millions d'habitants) ; au Japon, la Tokaido relie Tokyo à Osaka.","d": "<b>La fusion des villes.</b><div class='ex-detail'><u>Exemple rédigé</u> : Gottmann décrit en 1961 la côte Est américaine : les banlieues de Boston, New York, Philadelphie, Baltimore et Washington se touchent le long de 800 km, formant une entité fonctionnelle de ~50 millions d'habitants, chaque métropole gardant sa spécialité (la finance à New York, la politique à Washington, la recherche à Boston). Au Japon, la Tokaido relie Tokyo, Nagoya et Osaka le long du Shinkansen. Candidats plus récents : la « banane bleue » européenne (Liverpool-Milan) et le delta du Pearl River chinois (Hong Kong-Shenzhen-Guangzhou). <b>Piège</b> : mégalopole (axe continu) ≠ mégapole (seuil de 10 millions) — les deux mots se ressemblent mais désignent des formes différentes.</div>"},
{"t": "L'urbanisation du monde (Collège)","q": "Les inégalités dans une même ville se manifestent surtout par :","c": ["les mêmes logements partout","les écarts de prix de l'immobilier, l'accès aux services et la ségrégation spatiale entre quartiers","la météo","le même salaire"],"a": 1,"e": "Frontières invisibles : une rue peut séparer des prix au m² du simple au décuple ; s'ajoutent les écarts d'écoles, d'espaces verts et d'exposition à la chaleur.","d": "<b>Les frontières invisibles.</b><div class='ex-detail'><u>Exemple rédigé</u> : les marqueurs : le prix du m² (à Paris, le facteur 10 entre arrondissements), la carte des écoles (les résultats varient fortement d'un quartier à l'autre, alimentant les stratégies familiales de déménagement), et désormais les données environnementales : les quartiers pauvres sont moins arborés et plus exposés aux îlots de chaleur — une « double peine ». À l'autre extrême, les gated communities (communautés fermées) des États-Unis ou du Brésil : la ségrégation se protège derrière des murs. Les réponses : quartiers prioritaires, contrats de ville, mixité sociale imposée. <b>Piège</b> : la ségrégation n'est pas « naturelle » — elle résulte de mécanismes (marchés, choix, politiques) : c'est l'explication qui est attendue.</div>"},
{"t": "Développement et inégalités dans le monde (Collège)","q": "L'IDH (indice de développement humain) combine :","c": ["la santé (espérance de vie), l'éducation (scolarisation) et le niveau de vie (revenu par habitant)","l'armée et la superficie","le PIB seul","le nombre de villes"],"a": 0,"e": "Créé par le PNUD (1990) pour dépasser le PIB : un indice entre 0 et 1 (Norvège ~0,97, Niger ~0,40).","d": "<b>Trois dimensions.</b><div class='ex-detail'><u>Exemple rédigé</u> : l'IDH est né des travaux d'Amartya Sen (« le développement comme liberté ») : la richesse n'est qu'un moyen, la fin est ce que les gens peuvent faire de leur vie. La méthode : un indice de santé (espérance de vie à la naissance), un indice d'éducation (années de scolarisation des adultes et années attendues pour les enfants) et un indice de revenu (PIB/habitant en PPA, avec des rendements décroissants : un dollar compte plus au Niger qu'en Norvège). Lecture : très élevé au-dessus de 0,8, faible en dessous de 0,55. Surprise utile : le Qatar, très riche, n'a qu'un IDH moyen (école et statut des travailleurs migrants). <b>Piège</b> : l'IDH n'est pas une « note de richesse » — c'est justement l'argument pour lequel il a été créé.</div>"},
{"t": "Développement et inégalités dans le monde (Collège)","q": "La différence entre croissance et développement :","c": ["aucune","la croissance est l'augmentation de la richesse produite ; le développement est l'amélioration des conditions de vie (santé, éducation, libertés)","une question de géographie","un nom différent pour l'IDH"],"a": 1,"e": "La croissance est un moyen, le développement une fin : un pays peut croître sans développer (le pétrole sans écoles) ou bien développer avec une croissance modérée.","d": "<b>Moyen contre fin.</b><div class='ex-detail'><u>Exemple rédigé</u> : la croissance mesure l'augmentation du PIB (production de biens et services). Le développement, défini par le PNUD, englobe la santé, l'éducation, les libertés — « l'ensemble des possibles » d'une vie. Contre-exemple : le Nigeria, pétrolier, a connu des décennies de croissance sans développement (corruption, « malédiction des ressources »), tandis que la Norvège a converti le même pétrole en fonds souverain et en IDH record. Exemple inverse : le Costa Rica, croissance modeste, mais IDH remarquable (santé, école, paix, armée abolie en 1948). <b>Piège</b> : ne jamais définir le développement comme « plus d'argent » : les deux exemples attendus (Nigeria, Costa Rica) font la différence.</div>"},
{"t": "Développement et inégalités dans le monde (Collège)","q": "Les PMA (pays les moins avancés) sont :","c": ["les États-Unis et la Chine","les pays d'Europe","une catégorie de l'ONU pour les pays les plus pauvres et fragiles (environ 44, majorité au Sahel et en Afrique subsaharienne)","les pays du Golfe"],"a": 2,"e": "Trois critères (revenu bas, capital humain faible, vulnérabilité économique) : le statut donne accès à des avantages commerciaux et financiers (allègements de dette, préférences).","d": "<b>La catégorie officielle de la fragilité.</b><div class='ex-detail'><u>Exemple rédigé</u> : les trois critères de l'ONU (UNCTAD) : le revenu (RNB par habitant sous un seuil), le capital humain (santé des mères et des enfants, scolarisation), la vulnérabilité économique (exportations concentrées, chocs, désastres naturels). La liste est révisée : le Botswana a été le premier « diplômé », suivis du Cap-Vert et des Maldives. Les avantages du statut : traitements commerciaux préférentiels, allègements de dette (initiative PPTE), ciblage de l'aide. <b>Piège</b> : retenir les exemples (Niger, Tchad, Haïti) et les trois critères — une question classique demande les deux.</div>"},
{"t": "Développement et inégalités dans le monde (Collège)","q": "Les « pays émergents » (BRICS...) se caractérisent par :","c": ["un PIB en baisse","une population vieillissante","l'absence de villes","une croissance économique forte et une montée en puissance mondiale, tout en gardant des pauvretés et inégalités internes"],"a": 3,"e": "Croissance rapide, industrialisation, classes moyennes naissantes, puissance politique revendiquée (sommets BRICS, banque de développement) — mais bidonvilles et inégalités records persistent.","d": "<b>Entre le Sud et le Nord.</b><div class='ex-detail'><u>Exemple rédigé</u> : les critères : croissance rapide (la Chine à 6-10 % pendant des décennies), industrialisation exportatrice, marchés internes massifs, classes moyennes naissantes, poids politique revendiqué (les BRICS réclament plus de voix au FMI et créent leurs institutions). Les preuves : la Chine, environ 18 % du PIB mondial, a sorti 800 millions de personnes de la pauvreté depuis 1980 — le plus grand mouvement de l'histoire. Les limites : inégalités internes records (le Brésil et son Gini élevé), bidonvilles à côté des gratte-ciel, « pièges du revenu intermédiaire ». <b>Piège</b> : les trajectoires divergent (l'Inde accélère, la Russie et l'Afrique du Sud peinent) — parler des « BRICS » comme bloc homogène est un raccourci à nuancer.</div>"},
{"t": "Développement et inégalités dans le monde (Collège)","q": "Le PPA (parité de pouvoir d'achat) sert à :","c": ["classer les villes","mesurer la pluie","corriger les comparaisons de revenus en tenant compte des prix locaux","calculer les impôts"],"a": 2,"e": "Sans correction, un revenu indien paraît plus petit qu'il ne « vit » réellement : 1 000 $ achètent beaucoup plus de choses à Delhi qu'à New York.","d": "<b>Comparer honnêtement.</b><div class='ex-detail'><u>Exemple rédigé</u> : le problème : les comparaisons en dollars courants utilisent les taux de change, qui ignorent les prix locaux. Or un repas, une coupe de cheveux ou un loyer coûtent trois à cinq fois moins à Delhi qu'à New York : le même revenu « vaut » des vies très différentes. La solution PPA : comparer le prix d'un panier de biens identique dans chaque pays et en déduire un facteur de correction (les programmes internationaux de comparaison de prix actualisent ces facteurs). Effet spectaculaire : en PPA, la Chine dépasse les États-Unis en PIB total — un basculement médiatisé mais souvent mal expliqué. <b>Piège</b> : c'est pourquoi le revenu de l'IDH est calculé en PPA — et pourquoi une comparaison « brute » en dollars est une erreur classique à éviter dans un exercice.</div>"},
{"t": "Développement et inégalités dans le monde (Collège)","q": "Les Objectifs de développement durable (ODD) de l'ONU :","c": ["sont 17 objectifs pour 2030 (pauvreté, climat, éducation...), adoptés en 2015","sont des lois européennes","concernent le sport","sont 3 objectifs"],"a": 0,"e": "Les 17 ODD (Agenda 2030, 193 pays) succèdent aux 8 objectifs du millénaire (2000-2015) : des cibles chiffrées, suivies d'indicateurs — mais des engagements politiques, pas des lois.","d": "<b>L'Agenda 2030.</b><div class='ex-detail'><u>Exemple rédigé</u> : l'histoire : les 8 objectifs du millénaire (2000) avaient obtenu des résultats mitigés — progrès sur l'eau et l'école primaire, lenteurs sur la santé maternelle. Les leçons ont nourri les 17 ODD (2015) : plus universels (le Nord aussi est concerné), intégrant le climat, avec 169 cibles et des indicateurs suivis par des données ouvertes. Les points faibles : le financement (l'objectif de 0,7 % du RNB pour l'aide est rarement atteint) et les revers des pandémies et conflits. <b>Piège</b> : les ODD ne sont pas juridiquement contraignants — ce sont des engagements politiques (le « soft law »), suivis par la comparaison internationale : la nuance juridique rapporte des points.</div>"},
{"t": "Développement et inégalités dans le monde (Collège)","q": "Un coefficient de Gini élevé signifie :","c": ["un climat chaud","beaucoup d'habitants","de fortes inégalités de revenus dans le pays","une population égale"],"a": 2,"e": "Le Gini va de 0 (égalité parfaite) à 1 (une personne concentre tout) : pays nordiques ~0,25, Afrique du Sud ~0,63 (record mondial).","d": "<b>Mesurer l'écart des revenus.</b><div class='ex-detail'><u>Exemple rédigé</u> : la construction : on cumule les pourcentages de population et de revenus (courbe de Lorenz) ; plus la courbe s'écarte de la diagonale d'égalité, plus le Gini monte. Repères : 0,25 pour les pays nordiques, ~0,3 en Europe, ~0,4 aux États-Unis, ~0,6 en Afrique du Sud. Usage précieux : comparer le Gini « avant » et « après » redistribution : l'impôt et les services publics réduisent fortement les inégalités en France, beaucoup moins aux États-Unis. Les travaux de Piketty ont montré la hausse séculaire des inégalités mondiales depuis 1980. <b>Piège</b> : le Gini ne dit rien du niveau de vie — un pays pauvre peut être égalitaire ; il faut toujours croiser les deux informations.</div>"},
{"t": "Développement et inégalités dans le monde (Collège)","q": "La pauvreté « extrême » est définie par la Banque mondiale comme :","c": ["vivre à la campagne","vivre avec moins de 2,15 dollars par jour (seuil actualisé en 2022)","avoir plus de 3 enfants","ne pas avoir de téléphone"],"a": 1,"e": "Le seuil (2,15 $/jour, actualisé de l'ancien 1,90 $) concerne environ 700 millions de personnes : un recul historique depuis 1990, fragilisé par les pandémies et les conflits.","d": "<b>Le seuil mondial.</b><div class='ex-detail'><u>Exemple rédigé</u> : la genèse : les économistes ont regroupé les lignes de pauvreté des pays les plus pauvres pour obtenir un seuil international (le « dollar par jour »), actualisé périodiquement pour les prix : 2,15 $ depuis 2022. La mesure repose sur les enquêtes ménages (consommation, revenu). La grande histoire : environ 2 milliards de personnes sont sorties de la pauvreté extrême depuis 1990, surtout grâce à la Chine — mais l'Afrique subsaharienne reste à la traîne, et les pandémies et conflits ont replongé des dizaines de millions de personnes. <b>Piège</b> : ce seuil ne sert qu'aux comparaisons internationales ; chaque pays définit aussi sa pauvreté nationale (en France, le seuil est relatif : 60 % du revenu médian) — ne pas mélanger les échelles.</div>"},
{"t": "Développement et inégalités dans le monde (Collège)","q": "Les inégalités « Nord-Sud » aujourd'hui :","c": ["n'existent que dans les livres","persistent entre pays, mais les plus fortes inégalités sont devenues internes à chaque pays","concernent le climat seulement","ont disparu"],"a": 1,"e": "Le grand basculement : les écarts entre pays reculent (convergence des émergents) tandis que les écarts internes explosent (le « 1 % » gagne partout).","d": "<b>Le grand basculement.</b><div class='ex-detail'><u>Exemple rédigé</u> : la courbe « de l'éléphant » de Milanovic montre les gains mondiaux par tranche de population : les classes moyennes émergentes (Chine, Inde) ont beaucoup gagné depuis 1988, les classes moyennes occidentales stagnent, et le top 1 % mondial gagne partout : le monde devient plus égal ENTRE les pays et plus inégal À L'INTÉRIEUR de presque tous. Causes discutées : mondialisation (délocalisations), technologie (automatisation), politiques fiscales. <b>Piège</b> : ne jamais écrire « les inégalités diminuent » sans préciser l'échelle — entre pays elles baissent, dans les pays elles montent : c'est exactement la nuance attendue.</div>"},
{"t": "Développement et inégalités dans le monde (Collège)","q": "L'« aide publique au développement » (APD) :","c": ["désigne les transferts publics des pays riches vers les pays en développement (objectif historique : 0,7 % du revenu national, rarement atteint)","concerne les banques uniquement","est un impôt mondial","est la même chose que le PIB"],"a": 0,"e": "Environ 200 milliards de dollars par an (dons et prêts concessionnels) : les pays nordiques dépassent l'objectif de 0,7 %, la France tourne autour de 0,4-0,5 %.","d": "<b>Les flux publics solidaires.</b><div class='ex-detail'><u>Exemple rédigé</u> : la définition (critères du comité d'aide au développement de l'OCDE) : dons et prêts à conditions très favorables — les prêts commerciaux et les investissements privés n'en font pas partie. L'objectif de 0,7 % du revenu national date d'une promesse de l'ONU en 1970 : seuls les pays nordiques et quelques autres le dépassent. Les débats : efficacité contestée, dépendance, « aide liée » (l'argent doit être dépensé chez le donateur), opposition classique Easterly/Sachs sur l'aide massive contre les projets ciblés (micro-crédits, évaluations randomisées — prix Nobel 2019). <b>Piège</b> : les transferts privés des migrants (plus de 650 milliards de dollars) dépassent largement l'APD mais n'en font PAS partie : deux colonnes distinctes.</div>"},
{"t": "La mondialisation : flux et réseaux (Lycée)","q": "La mise en réseau du monde se caractérise par :","c": ["l'absence de transports","des flux massifs mais asymétriques : les métropoles et les interfaces connectées concentrent les échanges, des marges restent à l'écart","un monde sans frontières","des flux égaux entre tous les territoires"],"a": 1,"e": "Les flux (marchandises, capitaux, données, personnes) se concentrent sur l'archipel métropolitain et les grands corridors : les marges (États enclavés du Sahel, régions oubliées) restent mal connectées.","d": "<b>Un réseau, pas une nappe.</b><div class='ex-detail'><u>Exemple rédigé</u> : la mondialisation connecte tout, mais pas uniformément. Les nœuds : les métropoles mondiales (New York, Londres, Tokyo, Singapour) concentrent les fonctions de commandement, les sièges et les bourses. Les interfaces : les détroits (Ormuz pour le pétrole, Malacca pour les porte-conteneurs), les grands ports (Shanghai, Singapour, Rotterdam). Les marges : les États enclavés d'Afrique sahélienne (le Tchad paie plus cher ses importations), les régions en déprise du Nord même. La carte des câbles sous-marins est celle du pouvoir : plus de 95 % des données passent par quelques centaines de câbles reliant les mêmes nœuds. <b>Piège</b> : ne jamais écrire que la mondialisation « uniformise » les territoires : elle hiérarchise — c'est le mot-clé attendu.</div>"},
{"t": "La mondialisation : flux et réseaux (Lycée)","q": "Les firmes transnationales (FTN) :","c": ["organisent une part majeure du commerce mondial à l'intérieur de leurs réseaux : plus de la moitié des échanges est intra-firme","sont de petites entreprises locales","n'ont aucun lien avec la mondialisation","vendent uniquement dans leur pays d'origine"],"a": 0,"e": "Apple conçoit en Californie, fait assembler en Chine, vend dans le monde : les échanges entre filiales (composants, produits finis) représentent plus de la moitié du commerce mondial de marchandises.","d": "<b>Le commerce fait maison.</b><div class='ex-detail'><u>Exemple rédigé</u> : une FTN fonctionne en chaîne de valeur mondiale : R&D et conception dans les pays innovants (la vallée de la Silicon), composants des pays spécialisés (écrans coréens, silicium taïwanais), assemblage dans les pays à bas salaires (Chine, Vietnam), marketing et services dans les métropoles. Les flux « intra-firme » (filiale vers filiale) dépassent la moitié du commerce mondial : le commerce international est d'abord une affaire d'organisation interne aux entreprises. Conséquence géographique : chaque étape se fixe là où elle est la plus compétitive, dessinant une carte de la division internationale du travail. <b>Piège</b> : les États comptent toujours (fiscalité, régulation, protectionnisme) — l'entreprise n'évolue pas dans un monde « sans frontières ».</div>"},
{"t": "La mondialisation : flux et réseaux (Lycée)","q": "La conteneurisation a révolutionné les échanges car elle :","c": ["ralentit les ports","a permis de diviser massivement les coûts de transport maritime : les porte-conteneurs géants (plus de 20 000 EVP) font du fret un coût marginal dans le prix final","concerne uniquement les voyageurs","est interdite"],"a": 1,"e": "L'invention du conteneur (Malcom McLean, 1956) standardise le chargement : plus de grues ni de sack-à-dos de dockers, des navires géants, des ports à terre (les hubs) : c'est la condition matérielle de la mondialisation des marchandises.","d": "<b>La boîte qui a rétréci le monde.</b><div class='ex-detail'><u>Exemple rédigé</u> : avant le conteneur, charger un navire prenait une semaine de dockers ; aujourd'hui, les portiques chargent un porte-conteneurs géant en une journée. Effets : effondrement du coût du fret (transporter une paire de chaussées d'Asie en Europe ne coûte que quelques centimes), gigantisme naval (plus de 20 000 conteneurs par navire), et bascule des ports vers des hubs à terre avec d'immenses zones logistiques (Rotterdam, Singapour, Shanghai en tête). C'est le levier matériel de la fragmentation des chaînes de valeur : sans fret marginal, « fabriquer partout pour vendre partout » devient rentable. <b>Piège</b> : la conteneurisation a aussi créé des points de passage critiques : un navire bloqué dans le canal de Suez (Ever Given, 2021) paralyse le commerce mondial pendant une semaine — la fluidité dépend de quelques goulots.</div>"},
{"t": "La mondialisation : flux et réseaux (Lycée)","q": "Une « chaîne de valeur » mondiale se définit comme :","c": ["la chaîne de télévision","une route maritime uniquement","la fragmentation des étapes de production entre plusieurs pays, chaque étape étant localisée là où elle est la plus compétitive","un chemin de randonnée"],"a": 2,"e": "Conception (amont, forte valeur), composants, assemblage (faible valeur), marketing et services (aval, forte valeur) : la géographie du produit épouse la carte des coûts et des compétences.","d": "<b>Le produit fragmenté.</b><div class='ex-detail'><u>Exemple rédigé</u> : le cas du smartphone : la conception et les brevets (amont) captent la valeur aux États-Unis et en Corée ; les composants viennent de Taïwan (le silicium de TSMC) et du Japon ; l'assemblage à faible valeur ajoutée se fait en Chine ou au Vietnam ; la marque et les services (aval) raflent la marge. Leçon géographique : la valeur se concentre aux deux extrémités (le « sourire de la valeur »), l'assemblage au milieu capte peu. Application : un pays qui n'a que l'assemblage reste dépendant ; c'est pourquoi la Chine monte en gamme (robots, brevets, « made in China 2025 »). <b>Piège</b> : ne pas confondre chaîne de valeur et « délocalisation » : le mot juste décrit une fragmentation organisée, pas un simple transfert d'usine.</div>"},
{"t": "La mondialisation : flux et réseaux (Lycée)","q": "Les espaces de la mondialisation incluent les « interfaces », c'est-à-dire :","c": ["les déserts","les plages de vacances","les lieux de contact et d'échange entre territoires : détroits, canaux, ports, frontières actives","les écrans d'ordinateur"],"a": 2,"e": "Les interfaces concentrent les passages : détroit d'Ormuz (pétrole), de Malacca (conteneurs), canal de Suez et de Panama, hubs portuaires et aéroportuaires, frontières actives (Maquiladoras, Mexique-États-Unis).","d": "<b>Les points de passage du monde.</b><div class='ex-detail'><u>Exemple rédigé</u> : une interface est un lieu de contact où des flux traversent une limite (maritime, terrestre, juridique). Exemples : le détroit d'Ormuz (environ 20 % du pétrole mondial), le détroit de Malacca (le tiers du commerce maritime conteneurisé), les canaux de Suez et de Panama (raccourcis vitaux), la frontière Mexique-États-Unis avec ses maquiladoras (usines d'assemblage côté mexicain), les hubs portuaires (Rotterdam, la porte de l'Europe). Enjeu stratégique : qui contrôle l'interface contrôle le flux — d'où les tensions en mer de Chine méridionale et autour d'Ormuz. <b>Piège</b> : une interface n'est pas seulement un lieu « de passage » : c'est aussi une zone d'accumulation (zones franches, zones logistiques) qui transforme le passage en richesse locale.</div>"},
{"t": "La mondialisation : flux et réseaux (Lycée)","q": "Le concept d'« archipel métropolitain » (ou « archipel mondial ») désigne :","c": ["un parc d'attractions","les îles du Pacifique","l'ensemble des métropoles mondiales plus connectées entre elles qu'à leur propre arrière-pays, formant comme un archipel de pôles dans un monde de marges","une chaîne de montagnes"],"a": 2,"e": "New York, Londres, Tokyo, Paris, Singapour, Hong Kong : ces villes échangent entre elles capitaux, savoirs et gens plus qu'avec leurs régions environnantes : le monde s'organise en pôles reliés par des ponts aériens et numériques.","d": "<b>Des îles connectées.</b><div class='ex-detail'><u>Exemple rédigé</u> : l'image est de l'économiste Christian Grataloup : les métropoles mondiales fonctionnent comme les îles d'un archipel — chacune très liée aux autres (vols quotidiens, câbles, marchés financiers en continu), moins liée à son propre hinterland. Exemple : les liaisons New York-Londres (les plus denses du monde) ou Paris-Francfort n'ont pas d'équivalent avec les villes moyennes. Conséquence : la carte de la mondialisation est celle des nœuds — les classements (GaWC) hiérarchisent les villes en Alpha (New York, Londres), Beta, Gamma. <b>Piège</b> : l'archipel ne veut pas dire que le reste du monde n'existe pas : les marges alimentent les pôles (matières premières, migrations) — il faut toujours décrire la relation entre l'archipel et ses marges.</div>"},
{"t": "La mondialisation : flux et réseaux (Lycée)","q": "La mondialisation est aujourd'hui :","c": ["interdite par l'ONU","contestée et recomposée : tensions commerciales, relocalisations stratégiques, régionalisation (« slowbalisation ») mais les flux restent massifs","identique à la fin du XIXe siècle","achevée et sans contestation"],"a": 1,"e": "Guerre commerciale sino-américaine, relocalisation des secteurs stratégiques (semi-conducteurs, pharmacie), nearshoring : la mondialisation se poursuit mais se réorganise autour de blocs régionaux.","d": "<b>Recomposer, pas disparaître.</b><div class='ex-detail'><u>Exemple rédigé</u> : les signaux : guerre commerciale sino-américaine (droits de douane, restrictions sur les semi-conducteurs), relocalisations stratégiques (le CHIPS Act américain, l'Europe et les médicaments), nearshoring (les entreprises américaines rapatrient au Mexique, les européennes au Maroc ou en Europe de l'Est), pandémie qui a révélé la fragilité des chaînes trop longues. Mais les flux restent massifs : le commerce mondial continue de croître, autour de blocs (régionalisation). Le concept de « slowbalisation » (racheter la vitesse de la mondialisation) résume le moment. <b>Piège</b> : « la fin de la mondialisation » est un raccourci médiatique — la réponse attendue est « recomposition », pas « disparition ».</div>"},
{"t": "La mondialisation : flux et réseaux (Lycée)","q": "Les câbles sous-marins sont stratégiques car :","c": ["ils remplacent les bateaux","ils transportent des poissons","ils transportent plus de 95 % des données internationales : la « société numérique » repose sur cette infrastructure maîtrisée par quelques acteurs","ils sont décoratifs"],"a": 2,"e": "Google, Meta, Microsoft et Amazon possèdent ou louent une part croissante des capacités : la géographie du numérique suit les routes des empires du passé (New York-Londres, transpacifiques) et crée de nouveaux enjeux de souveraineté.","d": "<b>Le monde sous les mers.</b><div class='ex-detail'><u>Exemple rédigé</u> : contrairement au satellite (coûteux, latence), plus de 95 % des données internationales (Internet, transactions financières, cloud) passent par environ 500 câbles sous-marins posés au fond des océans. Cartographie du pouvoir : les routes densest New York-Londres, Los Angeles-Tokyo, les nouvelles « routes de la soie numériques » vers l'Afrique. Deux évolutions : les Gafam possèdent désormais leurs propres câbes (capacité privée supérieure à celle des États), et la souveraineté numérique devient un enjeu géopolitique (l'Europe finance des « corridors de données », la Chine ses câbles). <b>Piège</b> : ne pas écrire que le numérique « abolit la géographie » : les données suivent au contraire des routes matérielles très localisées — et des points de fragilité (les coupes de câbles suspects en mer du Nord sont des incidents géopolitiques).</div>"},
