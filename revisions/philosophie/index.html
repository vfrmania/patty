{"t": "Le travail et la technique : contrainte ou réalisation ? (Terminale)", "q": "Selon Hegel, dans la dialectique du maître et de l'esclave, c'est l'esclave qui devient libre parce que :", "c": ["il dort plus", "il est le plus fort", "il obéit", "en travaillant, il transforme le monde et SE RECONNAÎT dans ses produits (la conscience se forme en œuvrant) alors que le maître jouit passivement"], "a": 3, "e": "Le maître dépend de la reconnaissance d'un esclave qu'il méprise : l'esclave, lui, s'ÉDUQUE par le travail (il apprivoise la nature : il se retrouve dans l'objet).", "d": "<b>Le travail forme la conscience</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme (Phénoménologie de l'esprit, 1807) : ① la lutte pour la reconnaissance : deux consciences s'affrontent : l'une risque la mort jusqu'au bout (devient MAÎTRE), l'autre cède par peur (devient ESCLAVE) ② le maître fait travailler : il JOUIT d'objets qu'il n'a pas faits (sa conscience s'atrophie : dépendre du travail d'un être méprisé n'est pas être reconnu) ③ l'esclave TRAVAILLE : il apprivoise la nature (le détour par l'outil), il DISCIPLINE sa peur (le travail « retarde » : il apprend la patience) et SURTOUT il se CONTEMPLLE dans l'objet (« ceci, c'est MOI qui l'ai fait » : la preuve objective de soi) : la culture (Bildung) vient du travail : le retournement final : l'histoire appartient à celui qui œuvre. Piège : Hegel ne parle pas des « esclaves » historiques seulement : il parle de NOUS (toute conscience se forme par le détour du travail : l'élève qui rédige se forme : le copieur ne se forme pas : le maître paresseux de la copie est l'esclave de la note) : c'est LA référence du sujet « le travail libère-t-il ? ».</div>"},
{"t": "Le travail et la technique : contrainte ou réalisation ? (Terminale)", "q": "L'aliénation au sens de Marx désigne :", "c": ["la fatigue", "la situation où le travailleur devient ÉTRANGER à ce qu'il fait (produit possédé par un autre, tâche parcellisée, activité subie : il ne se reconnaît nulle part)", "un métier artistique", "un voyage"], "a": 1, "e": "Alienare = rendre autre : le travail, au lieu de RÉALISER l'homme, le DESSAISIT de lui-même (le produit, le geste, le temps, les collègues : tout lui échappe).", "d": "<b>Devenir étranger à son activité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les 4 aliénations (Manuscrits de 1844) : ① du PRODUIT (l'ouvrier fabrique des maisons et loge dans des taudis : l'objet se dresse contre lui : plus il produit, plus il s'appauvrit) ② de l'ACTIVITÉ (le geste parcellisé : 10 secondes par opération : Smith : la fabrique d'épingles : productivité x240 : mais l'homme complet disparaît : « appendice de la machine ») ③ de l'ÊTRE GÉNÉRIQUE (le travail devrait être VIE libre : il n'est que MOYEN de survivre : le travail moderne le déshumanise) ④ d'AUTRUI (la coopération est commandée : la concurrence règne) : le concept aujourd'hui : le préparateur de commandes chronométré (le portable compte ses secondes : les toilettes « loggées » : il ne décide de RIEN : il ne reconnaît RIEN). Piège : l'aliénation n'est pas un simple « malaise au travail » (stress : fatigue : c'est une STRUCTURE de dépossession) : les remèdes discutés (autonomie : sens : coopératives : la « quête de sens » actuelle) prolongent le débat au bac.</div>"},
{"t": "Le travail et la technique : contrainte ou réalisation ? (Terminale)", "q": "La division du travail (Smith, la fabrique d'épingles) illustre :", "c": ["le GAIN de productivité par la spécialisation des tâches — au prix de la parcellisation du geste ouvrier (un homme ne fait plus qu'une opération : il ne comprend plus l'ensemble)", "une erreur de calcul", "une perte de qualité", "la fin des usines"], "a": 0, "e": "Productivité multipliée : mais l'ouvrier devient « appendice de la machine » (Marx) : le gain économique contre la formation de soi.", "d": "<b>GAIN productif, Perte humaine</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'exemple canonique (Richesse des nations, 1776) : la manufacture d'épingles : 1 ouvrier seul : ~20 épingles/jour : 10 ouvriers spécialisés (un tire le fil : un autre aiguise : etc.) : 48 000 épingles/jour : la productivité EXPLOSE (le gain : l'habileté sur UN geste : le temps de changement économisé : les machines possibles) : MAIS la face sombre : l'ouvrier n'a plus l'ŒUVRE : il a un FRAGMENT (le geste répété : ni conception, ni produit fini, ni fierté : Taylor le chronométrera ensuite : Ford : la chaîne : Charlie Chaplin dans les Temps modernes : le corps vissé au rythme) : le dilemme moderne : COMMENT garder le gain SANS perdre le sens ? (rotation : enrichissement des tâches : équipes autonomes : économie de la connaissance : mais aussi : les plateformes qui re-fragmentent (le livreur « indépendant » : l'appli impose) : c'est le sujet « la technique dégrade-t-elle le travail ? » avec ses deux faces. Piège : la machine n'est pas coupable en soi : c'est l'ORGANISATION du travail (qui décide du geste, du rythme, du sens) qui libère ou abîme.</div>"},
{"t": "Le travail et la technique : contrainte ou réalisation ? (Terminale)", "q": "Hannah Arendt distingue travail, œuvre et action. L'œuvre se définit par :", "c": ["la politique", "la consommation", "la répétition biologique", "la construction d'un MONDE durable (l'artisanat, l'art : des objets qui SURVIVENT à l'usage et à leur producteur : Homo faber)"], "a": 3, "e": "Travail = cycle vital (produire/consommer : pain : la nature), œuvre = bâtir le monde (la table : le livre : l'usage permanent : la mémoire), action = la pluralité humaine (parler, agir ENSEMBLE : la politique).", "d": "<b>Bâtir des objets durables</b> (Homo faber).<div class='ex-detail'><u>Exemple rédigé</u> : la triade (Condition de l'homme moderne, 1958) : ① TRAVAIL : la sphère de la nécessité biologique (produire pour consommer : le pain est fait pour être mangé : le cycle recommence : rien ne reste : l'animal laborans) ② ŒUVRE : la fabrication du monde ARTIFICIEL (la maison : la table : le pont : le livre : des objets DURABLES qui survivent à l'usage et à l'artisan : le monde humain stabilisé : l'homo faber) ③ ACTION : la sphère politique (parler et agir entre égaux : la reconnaissance : le récit : la pluralité) : la modernité selon Arendt a fait TRIOMPHER le travail (la société de consommateurs/travailleurs : tout devient « fonction du processus vital » : la consommation) : l'œuvre (la stabilité du monde) s'efface et l'action (la politique) se retire (le « règne de personne » : la bureaucratie). Piège : la distinction éclaire le débat moderne « fin du travail » : ce qui disparaît peut-être, c'est le travail (le labeur nécessaire : automatisable) : ce qu'il faut SAUVER, c'est l'œuvre (le monde bâti) et l'action (la cité) : une copie qui distingue gagne en précision.</div>"},
{"t": "Le travail et la technique : contrainte ou réalisation ? (Terminale)", "q": "Selon Heidegger, le danger de la technique moderne est :", "c": ["le prix", "l'ARRIMAGE (Gestell) : tout étant devient STOCK disponible (le Rhin « fournisseur de pression hydraulique » : l'homme lui-même devient « ressource humaine »)", "l'ennui", "la panne"], "a": 1, "e": "La technique ne se réduit pas à des outils : elle est une manière de DÉVOILER le monde comme réserve exploitable : le risque : ne plus voir le monde qu'en stock (l'homme inclus).", "d": "<b>L'arrimage : le monde comme stock</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'analyse (La question de la technique, 1953) : la technique moderne n'est pas un simple OUTIL neutre : c'est un mode de dévoilement (la manière dont le monde se montre) : le Rhin devient « fournisseur de pression hydraulique » (plus le fleuve chanté par Hölderlin : le fleuve-énergie) : l'agriculture devient « agrobusiness » (la terre : stock), l'homme devient « ressource humaine » (le CV : stock de compétences : l'IA de matching : stock de candidats) : le DANGER n'est pas la machine elle-même mais l'UNIFORMISATION du regard (ne plus voir que du calculable) : la « sauvegarde » : l'ART (la contemplation : le dévoilement non-forçant : la poésie : la technique qui laisse être). Piège : Heidegger ne « refuse » pas la technique (on ne détruit pas les centrales) : il éclaire ce qu'elle FAIT à la manière de voir (l'essence de la technique n'est rien de technique) : c'est la profondeur du sujet « la technique est-elle neutre ? » (réponse : l'outil est neutre : le RAPPORT technique au monde, non).</div>"},
{"t": "Le travail et la technique : contrainte ou réalisation ? (Terminale)", "q": "L'expression « ressource humaine » est philosophiquement discutée parce qu'elle :", "c": ["traite l'HOMME comme un stock (un moyen disponible : la finalité étant la production) : le langage révèle l'arrimage technique", "est jolie", "est moderne", "est anglaise"], "a": 0, "e": "Le vocabulaire managerial dit l'ontologie (ce que le langage fait être) : l'homme « ressource » s'use et se remplace (le stock) : Kant disait déjà : jamais un simple MOYEN.", "d": "<b>Réduit l'homme à un stock</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'analyse du vocabulaire : « RESSOURCE » : ① une ressource s'EXPLOITE (on puise dans un gisement) ② s'use et se REMPLACE (le stock se renouvelle : la rotation du personnel) ③ se CHIFFRE (le « coût » : le « capital humain » : l'homme au bilan) : la formule kantienne retournée : la personne devient un simple MOYEN (la production : la rentabilité : la fin) : le symptôme : le langage de l'entreprise (« flexibilité » : la machine : « vivier » : la pêche : « parc de candidats » : l'immobilier !) : l'enjeu du débat RH moderne : la « bienveillance » proclamée coexiste avec l'hyper-chronométrage (le logiciel de surveillance des cadres : le « People Analytics ») : la question de bac : le langage du travail TRAHIT la conception de l'homme : c'est l'analyse la plus fine du chapitre (critique du vocabulaire = critique du monde). Piège : il ne suffit pas de changer les mots (dire « collaborateur » au lieu d'« employé ») : sans changer les rapports, le vocabulaire cache la même chose.</div>"},
{"t": "Le travail et la technique : contrainte ou réalisation ? (Terminale)", "q": "L'automatisation qui « libère du travail » pose la question :", "c": ["du bruit", "des impôts", "de la RECONNAISSANCE sociale : si le travail formait l'identité (métier, dignité, lien social), que devient une société sans travail ? (le chômage technique : revenu universel : « quête de sens »)", "des vacances"], "a": 2, "e": "Le travail n'est pas que pénible : il donne le statut, la reconnaissance, la temporalité sociale : la « fin du travail » exige une refondation du lien (Rifkin : Keynes déjà : la semaine de 15h).", "d": "<b>La reconnaissance sociale sans emploi ?</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement en deux temps : ① la LIBÉRATION : le travail pénible (chaîne : caisse : manutention) délégué aux machines : le temps libre rendu (Keynes, 1930 : « les petits-fils : la semaine de 15 heures ») : le soulagement de la nécessité ② la PERTE : le travail donnait plus qu'un salaire : un RÔLE (je suis boulanger : une identité), une reconnaissance (le salaire social : le « prix de la personne » : le chômage détruit l'estime même bien payé : les « inactifs » s'ennuient), une temporalité (la journée : la semaine : la retraite structurées), un lien (les collègues : la coopération) : les réponses en débat : le revenu universel (découpler la SURVIE de l'EMPLOI), le travail volontaire (le care : l'associatif : l'art : la « quête de sens » : les coopératives d'activité), la réduction du temps (la semaine de 4 jours testée) : aucune n'est neutre : c'est un sujet de bac contemporain PARFAIT (« faut-il vouloir la fin du travail ? » : distinguer la fin de la PÉNIBLE nécessité et la fin de l'ACTIVITÉ formatrice). Piège : le travail ne se réduit pas à l'emploi : le care, l'art, l'engagement sont du travail au sens plein (activité formatrice) : « libérer du travail » ne doit pas vider la vie d'activité.</div>"},
{"t": "Le travail et la technique : contrainte ou réalisation ? (Terminale)", "q": "Marx dit que dans le travail, l'homme « s'objective » : cela signifie que :", "c": ["il prie", "il se RÉALISE hors de lui (l'homme se lit dans ses produits : le travail est humanisation : l'histoire de l'homme = l'histoire de ses productions)", "il se cache", "il se met en colère"], "a": 1, "e": "L'essence humaine n'est pas une âme cachée mais une PUISSANCE qui se réalise (l'architecture, le langage, les outils : l'homme se prouve en produisant : contre l'aliénation qui DESSAISIT).", "d": "<b>L'homme se réalise dans ses œuvres</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'anthropologie marxienne (Idéologie allemande : l'histoire commence avec le premier outil : « en produisant, les hommes produisent leurs conditions d'existence ET eux-mêmes ») : la différence animale (Marx : l'architecte diffère de l'abeille : il CONÇOIT d'abord dans sa tête : le plan : le projet) : d'où la DOUBLE face : le travail est GÉNÉRIQUEMENT humanisant (il forme l'homme : l'histoire : la culture) MAIS historiquement aliénant (le mode de production capitaliste détourne cette puissance : le producteur devient appendice) : la promesse : réconcilier la puissance et l'acte (le travail « devenu » liberté : le « royaume de la liberté » au-delà du travail nécessaire : au-delà du règne du besoin). Piège : Marx n'idéalise PAS le travail (il connaît la pénibilité) : il dit que le travail DEVRAIT être réalisation (l'aliénation est un ÉTAT HISTORIQUE : pas une essence du travail : c'est l'espoir politique) : le sujet « le travail n'est-il qu'une contrainte ? » reçoit ici sa réponse dialectique : nécessité, formation, aliénation à SURMONTER.</div>"},
{"t": "Le travail et la technique : contrainte ou réalisation ? (Terminale)", "q": "Le « sale boulot » (les métiers pénibles : nettoyage, abattoirs, care des autres) interroge :", "c": ["la mode", "le climat", "le sport", "la répartition des tâches socialement dévalorisées : qui fait ce que personne ne veut faire ? (la justice du partage de la pénibilité : la reconnaissance due aux « invisibles »)"], "a": 3, "e": "Une société vit de travaux invisibles (le care : l'entretien : la maintenance) : les rendre visibles et supportables (salaires, statuts, rotation) est une question de JUSTICE sociale.", "d": "<b>La justice du partage de la pénibilité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le constat (les sociologues : les « invisibles » du Covid : les caissières : les éboueurs : les aides-soignantes : le « sale boulot » (Dirty Work, Hughes : les métiers STIGMATISÉS : nécessaires mais méprisés : paradoxe social : on a BESOIN de ce qu'on MÉPRISE) : les questions : ① qui se retrouve au sale boulot ? (les dominés : femmes : migrants : la statistique des métiers pénibles) ② pourquoi le mépris ? (le contact avec le « sale » (sang : déchets) : la servilité ressentie : l'idéologie du « propre » bourgeois) ③ la justice : valoriser (salaire : statut : reconnaissance publique : les « héros » de la pandémie… qui repartent dans l'ombre) ou automatiser/rotations ? (sans toucher à la structure, la robotisation déplace le problème) : c'est l'axe du chapitre : la TECHNIQUE et le TRAVAIL sont aussi des questions de CLASSE. Piège : le sujet de bac « faut-il supprimer les métiers pénibles ? » exige de traiter : ① qui ferait le reste ? (le care ne s'automatise pas entièrement) ② la reconnaissance n'est pas qu'un salaire (la dignité sociale : l'honneur des métiers : la joie du travail bien fait).</div>"},
{"t": "Le travail et la technique : contrainte ou réalisation ? (Terminale)", "q": "Le travail peut être une « réalisation de soi » surtout quand :", "c": ["on ne fait rien", "on gagne au loto", "l'activité requiert et forme une COMPÉTENCE que le sujet reconnaît sienne (l'artisan, le médecin, l'enseignant : l'œuvre où l'on se retrouve)", "le salaire est élevé"], "a": 2, "e": "Le salaire paie la nécessité : la réalisation vient de l'OUVRER (apprendre, maîtriser, produire du durable : le plaisir du travail bien fait : l'estime de soi par l'objet).", "d": "<b>La compétence reconnue dans l'œuvre</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test de la réalisation : l'ébéniste qui livre sa commode (il a CONÇU : il a PENSÉ le bois : il CORRIGE : il livre : le client sourit) : dans l'objet, il se RETROUVE (sa patience : son goût : son habileté) : les conditions : ① AUTONOMIE (décider du geste : l'artisan : le professionnel réglé par le métier, pas par le chrono) ② COMPÉTENCE (la courbe d'apprentissage : la fierté de la maîtrise : le « flow » de l'expert) ③ ŒUVRE (un résultat identifiable : durable : signé) ④ UTILITÉ sociale (le soin : l'enseignement : la reconnaissance d'autrui donne la valeur) : contre-modèle : la tâche parcellisée chronométrée (aucune des 4 conditions) : la leçon politique : ORGANISER le travail pour la réalisation (autonomie : sens : formation continue : la « quête de sens » n'est pas un caprice de génération : c'est l'exigence philosophique du travail) : la conclusion de dissertation type : le travail n'est PAS nécessairement contrainte : il l'est DEVENU par organisation : il peut redevenir formation (l'enjeu est politique autant qu'existentiel). Piège : le salaire paie la nécessité : la réalisation vient de l'OUVRER : confondre les deux fait accepter n'importe quelle tâche « bien payée ».</div>"},
{"t": "L'État et le droit : obéir, gouverner, juger (Terminale)", "q": "Selon Hobbes, l'état de nature est :", "c": ["un village", "la « guerre de tous contre tous » (égalité de vulnérabilité : la peur) que le contrat SORT en instituant le souverain", "un paradis", "une démocratie"], "a": 1, "e": "Sans pouvoir commun, chacun menace chacun : la vie est « solitaire, misérable, dangereuse, animale et brève » : le Léviathan garantit la paix.", "d": "<b>La guerre de tous contre tous</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement (Léviathan, 1651 : pendant la guerre civile anglaise !) : ① l'état de nature : égalité des forces (le plus faible peut tuer le plus fort « par ruse ou par alliance ») et égalité des espérances (chacun veut ce que l'autre a : la COMPÉTITION : la DÉFIANCE : la GLOIRE) ② la conséquence : la guerre diffuse (pas des batailles : une insécurité permanente : nulle industrie : nulle culture : la vie « solitaire, misérable, dangereuse, animale et brève ») ③ la sortie : le contrat (chacun renonce à son droit sur tout au profit d'un SOUVERAIN commun : le Léviathan : le « dieu mortel » : irrévocable) : la paix par l'ABSOLU (Hobbes justifie l'absolutisme NON par le droit divin mais par la PAIX : c'est un contractuel : le souverain n'est sacré QUE comme garant). Piège : Hobbes n'est pas « totalitaire » par goût : il répond à la CIVIL WAR (l'État mort = la guerre) : le contre-modèle : Locke (l'État de nature est déjà social : l'État est LIMITÉ par les droits : il peut être renversé) : le couple Hobbes/Locke structure le sujet « pourquoi obéir ? ».</div>"},
{"t": "L'État et le droit : obéir, gouverner, juger (Terminale)", "q": "Selon Locke, si l'État viole les droits naturels (vie, liberté, propriété),", "c": ["rien", "on doit émigrer", "on doit prier", "le peuple a le DROIT DE RÉSISTANCE (déposer le gouvernement : les droits précèdent l'État qui doit les protéger)"], "a": 3, "e": "Le contrat est CONDITIONNEL : l'État est institué POUR les droits : s'il les détruit, il perd sa légitimité (la confiance révocable : l'Amérique de 1776 en découle).", "d": "<b>Le droit de résistance</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'argument (Second Traité du gouvernement civil, 1689) : ① l'état de nature n'est PAS la guerre hobbesienne : il est régi par la LOI NATURELLE (chacun a des droits : vie, liberté, PROPRIÉTÉ : mixte de son travail : le verger planté) ② l'État est institué par CONFIANCE (protéger ces droits mieux que l'état de nature : le gouvernement est un FIDUCIAIRE : un gérant) ③ si le gouvernant trahit (dépouille, tue, arbitraire), il RETOMBE dans l'état de guerre (agresseur comme un autre) : le peuple peut le déposer (la dissolution du gouvernement : le droit de résistance : la Glorieuse Révolution anglaise : 1688 !) : l'influence : la Déclaration d'indépendance américaine (« quand une longue suite d'abus… c'est leur DEVOIR de jeter ce gouvernement »). Piège : le droit de résistance lockéen n'est pas l'anarchie perpétuelle (il intervient contre l'ABUS SYSTÉMATIQUE : la « longue série » : pas contre une politique qui déplaît) : le distinguo Locke/Rousseau/Marx éclaire les régimes : libéral (l'État limité) : démocratique (le peuple législateur) : révolutionnaire (le conflit moteur) : c'est la richesse du chapitre.</div>"},
{"t": "L'État et le droit : obéir, gouverner, juger (Terminale)", "q": "Montesquieu justifie la séparation des pouvoirs par :", "c": ["le constat que « tout homme qui a du pouvoir est porté à en abuser » : il faut que « le pouvoir arrête le pouvoir »", "l'économie", "l'efficacité", "la tradition"], "a": 0, "e": "Législatif, exécutif, judiciaire : trois fonctions, trois organes : la liberté politique est la quiétude face à l'arbitraire (pas l'absence de règles).", "d": "<b>L'abus de pouvoir à prévenir</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le dispositif (De l'esprit des lois, 1748 : la « constitution d'Angleterre ») : ① le principe psychologique (l'expérience : « tout homme qui a du pouvoir est porté à en abuser : jusqu'à ce qu'il trouve des limites ») ② la solution STRUCTURALE : confondre les pouvoirs (le législateur qui juge ET exécute : le despote) : séparer les ORGANES (le Parlement fait la loi : le prince exécute : les tribunaux jugent (des jurés tirés du peuple (pas une caste de juges)) ③ l'équilibre dynamique (les pouvoirs s'ARRÊTENT mutuellement : le veto : la censure : l'accusation : la balance des ambitions) : la liberté n'est pas l'absence d'État mais la TEMPÉRANCE de l'État par sa propre division. Piège : Montesquieu ne sépare pas pour la PARALYSIE : il distingue aussi les RÉGIMES par leur PRINCIPE (la vertu républicaine : l'honneur monarchique : la peur despotique) : l'esprit des lois est RELATIF au climat, aux mœurs, à l'histoire (pas un universalisme abstrait) : c'est le premier grand comparatiste politique.</div>"},
{"t": "L'État et le droit : obéir, gouverner, juger (Terminale)", "q": "Selon Weber, la domination « légale-rationnelle » repose sur :", "c": ["la croyance en la LÉGALITÉ des règles impersonnelles (lois votées, procédures : l'obéissance au statut, pas à la personne)", "la tradition ancestrale", "la peur", "le charisme du chef"], "a": 0, "e": "L'État moderne administre par des RÈGLES abstraites (la bureaucratie : les dossiers : les fonctions) : on obéit au poste, pas au prince : c'est la légitimité des démocraties administratives.", "d": "<b>La légalité impersonnelle</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la typologie weberienne (Économie et société) : ① TRADITIONNELLE : la coutume (le roi héréditaire : les anciens : on obéit « parce que c'est ainsi ») ② CHARISMATIQUE : la personnalité extraordinaire (le prophète : le chef de guerre : le tribun : la légitimité dépend du SUCCÈS reconnu : fragile : la « routinisation » la banalise) ③ LÉGALE-RATIONNELLE : la règle abstraite, votée, appliquée par des PROCÉDURES (le fonctionnaire, le juge, l'élu : l'obéissance « au chef légal » : PAS à la personne) : le propre de la modernité (l'État : le « monopole de la violence légitime » : la définition célèbre : la police, l'armée, l'impôt : la contrainte AUTORISÉE par le droit) : l'avantage : la prévisibilité (le dossier : pas la faveur) : le risque : la « cage d'acier » bureaucratique (le règne sans maître : personne ne décide : tout est procédure : Eichmann le bureaucrate : Arendt !). Piège : Weber DÉCRIT (le sociologue ne glorifie pas : il documente les trois légitimités et leurs tensions) : le sujet bac « la force fait-elle seule le droit ? » se nourrit de cette distinction (la légitimité n'est PAS la force brute : elle est la croyance partagée).</div>"},
{"t": "L'État et le droit : obéir, gouverner, juger (Terminale)", "q": "La « tyrannie de la majorité » (Tocqueville) désigne le risque que :", "c": ["la minorité gouverne", "les rois reviennent", "le vote soit interdit", "la majorité ÉLUE écrase les droits des minorités (les décisions votées peuvent être injustes : la démocratie exige des garde-fous : droits, contre-pouvoirs)"], "a": 3, "e": "La règle majoritaire est une MÉTHODE de décision, pas un critère de justice : 51 % peuvent opprimer 49 % (Socrate condamné par un vote) : d'où l'État de droit (les droits fondamentaux intangibles).", "d": "<b>La majorité écrase les minorités</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le diagnostic (De la démocratie en Amérique, 1835) : ① le pouvoir du nombre devient ABSOLU (l'opinion majoritaire rend intenable la dissidence : la tyrannie de l'opinion : le conformisme social : « je ne connais pas de pays où il règne moins d'indépendance d'esprit et de véritable liberté de discussion qu'en Amérique » !) ② le RISQUE : 51 % votant la spoliation, l'exclusion, la persécution d'une minorité (la procédure démocratique est respectée : la justice NON) ③ les garde-fous : la Constitution (les droits fondamentaux : l'égalité devant la loi : les tribunaux : le contrôle juridictionnel : la liberté de la presse : la société civile : les corps intermédiaires : l'avocat : le syndicat) : la démocratie LIBÉRALE est ce mariage (le peuple souverain MAIS borné par les droits : la règle majoritaire pour les décisions COURANTES : les seuils protégés : les droits intangibles). Piège : distinguer la démocratie (PROCÉDURE : le vote : la délibération) et l'État de droit (SUBSTANCE : les droits) : une « démocratie » qui vote l'abolition des droits des uns n'est plus une démocratie au sens plein (les régimes qui démantèlent la justice commencent toujours par l'effacer au nom de la « majorité »).</div>"},
{"t": "L'État et le droit : obéir, gouverner, juger (Terminale)", "q": "L'État de droit signifie :", "c": ["l'État propriétaire", "l'absence d'État", "la loi du prince", "l'État SOUMIS au droit (ses organes obéissent à des règles générales, publiques, contrôlées par un juge indépendant)"], "a": 3, "e": "Même le gouvernant est justiciable (le président peut être jugé : l'administration perd ses procès) : la généralité de la loi protège des arbitraires.", "d": "<b>L'État soumis au droit</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la définition en trois traits : ① la loi GÉNÉRALE et abstraite (pas de mesure nominative « contre X » : la règle vaut pour tous : la prévisibilité) ② la HIÉRARCHIE des normes (la Constitution > les traités > la loi > les règlements : ce qui empêche le règlement d'outrepasser la loi) ③ le CONTRÔLE juridictionnel (le juge indépendant : l'administration peut PERDRE : le Conseil d'État annule des arrêtés : la CEDH condamne des États : le président peut être mis en accusation) : les garanties : la publicité des débats (pas de loi secrète), la non-rétroactivité pénale (pas de punir ce qui était permis), le procès équitable (l'avocat : le contradictoire). Piège : l'État de droit n'est pas un État mou (l'État conserve la contrainte légitime : police : impôt : armée : c'est même sa définition weberienne) : il est la CONTRAINTE CANALISÉE par le droit (la force au service de règles publiques, contrôlées) : le sujet de bac « la force fait-elle le droit ? » reçoit ici la réponse moderne (le droit SANS force est impuissant : la force SANS droit est la guerre civile : l'État de droit est l'articulation des deux).</div>"},
{"t": "L'État et le droit : obéir, gouverner, juger (Terminale)", "q": "La désobéissance civile se distingue de la délinquance ordinaire en ce qu'elle :", "c": ["se cache", "ment", "vole", "est PUBLIQUE, non-violente, argumentée (invoquant la justice contre une loi précise) et ASSUME la sanction (respect du droit général)"], "a": 3, "e": "Le désobéissant ne cherche pas l'impunité mais le TÉMOIGNAGE (la visibilité : le procès : la conscience publique) : il respecte le droit d'ensemble en brisant une loi injuste.", "d": "<b>Publique, non-violente, assumant la sanction</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les critères (Rawls : Théorie de la justice : la définition canonique : la désobéissance civile est « publique, non violente, consciente, illégale » : une adresse au sens de la justice de la communauté) : ① PUBLIQUE (on prévient, on se montre : le refuge des clandestins n'est pas une « manifestation » : mais les Justes ASSUMaient) ② NON-VIOLENTE (le corps offensé sans offenser : la souffrance consentie éveille la conscience adverse : Gandhi : les marches : les arrestations massives) ③ JUSTIFIÉE PAR LA JUSTICE (une loi précise dénoncée comme injuste : la ségrégation : le monopole du sel : les essais nucléaires : pas un « je n'aime pas les impôts ») ④ LA SANCTION ASSUMÉE (on ne fuit pas : le procès devient la tribune : le respect du droit général distingue le témoin du voyou) : la fonction : éveiller la majorité (la minorité agissante devient l'éducateur du peuple : King : « une loi injuste n'est pas une loi » : en citant Augustin). Piège : la désobéissance civile n'est pas la violence révolutionnaire (elle veille à rester DANS l'horizon du droit : le « fidelity to law » : Rawls) : quand elle réussit, elle MODIFIE le droit (les lois de Jim Crow abrogées : l'indépendance indienne : 1947) : c'est le sujet bac le plus fécond (« peut-on désobéir à la loi ? » : réponse : OUI, sous conditions : et cette réponse conditionnelle EST philosophique).</div>"},
{"t": "L'État et le droit : obéir, gouverner, juger (Terminale)", "q": "La souveraineté du peuple (Rousseau) signifie que :", "c": ["l'armée décide", "le roi gouverne", "les juges font la loi", "la LOI est l'expression de la volonté générale (le peuple légifère : directement ou par ses représentants contrôlés) : le gouvernement n'est qu'un COMMISSAIRE"], "a": 3, "e": "Le peuple est SOUVERAIN (il fait la loi : inaliénable) : le gouvernement n'exécute (il peut être révoqué : le mandat impératif discuté) : la légitimité vient d'en bas.", "d": "<b>Le peuple légifère</b> (le gouvernement exécute).<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique (Du contrat social, 1762) : ① le pacte : chacun se donne à TOUS (et à personne en particulier : l'aliénation totale réciproque : l'égalité rétablie) : le peuple devient SOUVERAIN (le « Moi commun ») ② la loi = l'acte de la volonté GÉNÉRALE (non la somme des intérêts : la délibération sur le bien commun : la loi vise l'UNIVERSALITÉ : des sujets en général : « la loi regarde des sujets en masse ») ③ le GOUVERNEMENT ≠ le souverain : le roi, les ministres : des COMMISSAIRES (exécutants révocables : la souveraineté ne se DÉLÈGUE pas (Rousseau contre l'électeur-représenté : « les Anglais croient être libres : ils se trompent : ils ne le sont que pendant l'élection » : la question moderne de la représentation) : conséquence : la légitimité (les lois) vient du peuple : l'efficacité (l'application) du gouvernement : confondre les deux (l'exécutant qui légifère) corrompt le système. Piège : la volonté générale n'est PAS l'opinion majoritaire (elle se délibère : elle peut errer : Rousseau : le peuple « veut toujours son bien : mais ne le voit pas toujours ») : d'où la question du sujet de bac « le peuple peut-il se tromper ? » (réponse rousseauiste : sur la volonté : non : sur les moyens : oui : l'éducation publique corrige).</div>"},
{"t": "L'État et le droit : obéir, gouverner, juger (Terminale)", "q": "Distinguer « légal » et « légitime » permet de :", "c": ["ronronner", "traduire", "analyser les cas où le droit positif (voté, en vigueur) contredit la justice (l'analyse distingue l'obéissance DUE au droit et la CRITIQUE morale des lois)", "gagner un procès"], "a": 2, "e": "Légal = conforme aux lois en vigueur : légitime = moralement justifié : la distinction arme la désobéissance civile ET la vigilance citoyenne (les lois peuvent être injustes).", "d": "<b>Conforme au droit ≠ moralement justifié</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les cas d'école : ① les lois de Vichy (léales : votées : publiées) livraient des enfants : MORALEMENT nulles (l'analyse rétrospective : le procès Barbie : « les ordres n'excusent pas » : les lois iniques ne créent pas d'obligation morale) ② la désobéissance civile : Rosa Parks ILLÉGALE (elle viole la loi de ségrégation) mais LÉGITIME (la loi violée était injuste : le mouvement assume : la sanction : la visibilité : la loi CHANGE : 1964) ③ le sens de la distinction : le droit positif (légal : le fait de la loi) se nourrit d'une PRÉTENTION à la légitimité (la justice : la morale) : quand la prétention se vide (lois arbitraires : persécution), le citoyen voit apparaître un DEVOIR de refus (la résistance : les Justes) — MAIS le risque de l'abus (chacun invoquant « sa » conscience : l'anarchie des jugements privés : d'où les CONDITIONS de la désobéissance civile : publique : non-violente : assumée) : la distinction légal/légitime est l'OUTIL du chapitre (elle évite deux naïvetés : le légalisme (tout légal est juste) et l'anarchisme (toute loi qui me déplaît est injuste). Piège : invoquer sa conscience n'autorise pas tout : la désobéissance civile est ENCADRÉE (publique, non-violente, assumant la sanction) précisément pour rester un appel à la justice, pas un privilège.</div>"},
{"t": "L'État et le droit : obéir, gouverner, juger (Terminale)", "q": "Weber définit l'État moderne comme détenant :", "c": ["la religion", "la mode", "la science", "le MONOPOLE de la violence physique légitime (police, armée : la contrainte autorisée par le droit sur un territoire)"], "a": 3, "e": "La définition : sur un territoire donné, l'État seul peut légitimement contraindre (le citoyen peut se défendre dans les cas prévus par la légitime défense, mais pas se faire justice) : la paix publique vient de ce monopole.", "d": "<b>Le monopole de la violence légitime</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la définition (Le Savant et le Politique, 1919 : la conférence) : « l'État est cette communauté humaine qui, dans les limites d'un territoire déterminé, REVENDIQUE AVEC SUCCÈS pour son propre compte le monopole de la violence physique LÉGITIME » : l'analyse du trio : ① TERRITOIRE (l'État est local : la frontière) ② MONOPOLE (lui seul peut : les autres violences — vendetta : milices : mafia : brigandage — sont « privées » donc illégitimes) ③ LÉGITIME (la force n'est pas le fait : la CROYANCE de la population (les légitimités weberiennes) autorise : la police qui arrête est obéie parce que le droit la mandate) : les corollaires : la « police du monde » (l'ONU : le dilemme du monopole international inexistant) : la privatisation de la force (les sociétés militaires privées : les vigiles : la question de la frontière public/privé) : la définition reste l'outil d'analyse n°1 des sciences politiques. Piège : « violence » chez Weber = la CONTRAINTE physique (pas la « brutalité » : l'État de droit canalise : la force réglée : proportionnée : contrôlée par le juge) : l'enjeu du chapitre : garder la force AU service du droit (sinon : le despotisme : l'État-prédateur).</div>"},
];

function chapHeadHTML(m){
  return '<div class="chap-head"><span class="chap-title">🕯️ Philosophie — ' + esc(m.titre) + '</span>' +
    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();
  if (t === 'quiz') {
    var bar = document.getElementById('quiz-chapbar');
    if (currentChap && META_BY_ID[currentChap]) { bar.innerHTML = chapHeadHTML(META_BY_ID[currentChap]); startTraining(META_BY_ID[currentChap].theme); }
    else { bar.innerHTML = ''; state.mode = 'menu'; render(); }
  }
  if (t === 'prog' || t === 'cours') window.scrollTo({top:0});
}
function clearChap(){ currentChap = null; }

function goCours(id){
  currentChap = id;
  showTab('cours');
  window.scrollTo({top:0, behavior:'smooth'});
}
function goCoursList(){ currentChap = null; showTab('cours'); }

function ficheHTML(id, num, open){

    '<div class="fiche-body">' +
    '<div class="fiche-actions"><button class="btn-pdf" onclick="printFiche(\'' + id + '\')">🖨️ Imprimer</button><button class="btn-pdf" onclick="fichePDF(\'' + id + '\')">📄 PDF</button></div>' +
    '<div class="print-title">Fiche synthétique — ' + esc(m.titre) + ' (' + esc(m.niveau) + ')</div>' +
    f +
    '</div></details>';

function renderFiches(){
  var z = document.getElementById('fiches-zone'); var h = '';
  if (currentChap && FICHE_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += ficheHTML(currentChap, 1, true);
  } else {
    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
    var i = 1;
    FICHES_DATA.forEach(function(f){ h += ficheHTML(f.id, i); i++; });

// ===== Générateur PDF autonome (A4, Helvetica) — aucune dépendance externe =====
var PDF_MATIERE = 'Philosophie';
var PDF_CP1252 = { 0x2018:0x91, 0x2019:0x92, 0x201A:0x82, 0x201C:0x93, 0x201D:0x94, 0x201E:0x84, 0x2013:0x96, 0x2014:0x97, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x20AC:0x80, 0x0152:0x8C, 0x0153:0x9C, 0x0160:0x8A, 0x0161:0x9A, 0x0178:0x9F, 0x017D:0x8E, 0x017E:0x9E, 0x192:0x83, 0x2C6:0x88, 0x2032:0xB4, 0x2039:0x8B, 0x203A:0x9B, 0x2022:0x95, 0x201E2:0 };
function pdfTranslit(s){
  return s.replace(/\u2212|\u2013|\u2014/g, '-').replace(/[\u2032\u2019]/g, "'")
    .replace(/\u2192|\u21D2|\u21A6/g, '->').replace(/\u2190/g, '<-')
    .replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u2260/g, '!=').replace(/\u2248/g, '~')
    .replace(/\u2208/g, ' in ').replace(/\u2205/g, 'vide').replace(/\u2286/g, 'incl.')
    .replace(/\u221A/g, 'V').replace(/\u00B7|\u2219|\u22C5/g, '*')
    .replace(/\u2124/g, 'Z').replace(/\u211D/g, 'R').replace(/\u2115/g, 'N').replace(/\u2119/g, 'P')
    .replace(/\u00A0/g, ' ').replace(/\u202F|\u2009|\u200B|\uFE0F/g, '')
    .replace(/[\u2460-\u2468]/g, function(c){ return (c.charCodeAt(0) - 0x2460 + 1) + ')'; })
    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');

function pdfEnc(s){
  var out = '';

    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }
    else if (PDF_CP1252[c] !== undefined) b = PDF_CP1252[c];
    if (b !== null && b !== undefined) out += String.fromCharCode(b);
  }

}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
var PDF_INLINE = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, SMALL:1, SUB:1, SUP:1, A:1, CODE:1, ABBR:1 };
function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';
    } else if (c.nodeType === 1){
      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }
      else if (g === 'B' || g === 'STRONG') pdfSegs(c, true, out);
      else pdfSegs(c, bold, out);
    }
  }
}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;

    for (var c = n.firstChild; c; c = c.nextSibling){
      if (c.nodeType === 3){
        var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;

        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }

        else if (g === 'LI') emitBlock('li', c, indent + 14);

            if (li.nodeType === 1 && li.tagName === 'LI') {

              for (var sub = li.firstChild; sub; sub = sub.nextSibling){
                if (sub.nodeType === 1 && (sub.tagName === 'UL' || sub.tagName === 'OL')){
                  for (var sli = sub.firstChild; sli; sli = sli.nextSibling){
                    if (sli.nodeType === 1 && sli.tagName === 'LI') emitBlock('li', sli, indent + 30);
                  }
                }
              }
            }
          }
        }
        else if (g === 'TABLE'){
          var rows = [];
          (function collectTbl(tn){
            for (var r = tn.firstChild; r; r = r.nextSibling){
              if (r.nodeType !== 1) continue;
              if (r.tagName === 'TR'){
                var cells = [], head = false;
                for (var td = r.firstChild; td; td = td.nextSibling){
                  if (td.nodeType !== 1) continue;
                  if (td.tagName === 'TD' || td.tagName === 'TH'){
                    if (td.tagName === 'TH') head = true;
                    var cs = []; pdfSegs(td, td.tagName === 'TH', cs);
                    cells.push(cs.map(function(x){ return x.t; }).join('').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());

                }

              } else if (r.tagName === 'THEAD' || r.tagName === 'TBODY') collectTbl(r);
            }
          })(c);
          if (rows.length) blocks.push({ type: 'table', rows: rows, indent: indent });
        }
        else if (g === 'P') { emitBlock('p', c, indent); }
        else { var keep = indent; walk(c); indent = keep; }
      }
    }
    emitP();
  }
  walk(root);
  return blocks;
}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    if (b.type === 'title'){ lines.push({ banner: 1, title: b.segs.map(function(s){ return s.t; }).join(' ').replace(/\s+/g, ' ').trim() }); return; }
    if (b.type === 'table'){ lines.push({ table: b }); return; }
    var isTitle = b.type === 'title';
    var size = b.type === 'h' ? 12 : 10.5;
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [], spPend = false;
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) { words.push({ br: true }); spPend = false; }
        var toks = p.split(/( +)/);
        for (var ti = 0; ti < toks.length; ti++){
          var tk = toks[ti];
          if (tk === '') continue;
          if (/^ +$/.test(tk)) { spPend = true; continue; }
          words.push({ w: tk, b: s.b, sp: spPend });
          spPend = false;
        }
      });
    });
    var cur = [], len = 0, firstLn = true;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, h: b.type === 'h', li: (b.type === 'li' && firstLn), gap: (b.type === 'h' ? 10 : 5) }); cur = []; len = 0; firstLn = false; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last && wd.sp ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var COL = { ind: [0.31, 0.27, 0.90], lav: [0.93, 0.95, 1.00], bord: [0.80, 0.84, 0.88], gry: [0.45, 0.50, 0.60], wht: [1, 1, 1], blk: [0.13, 0.13, 0.15] };
  function rg(c){ return c[0] + ' ' + c[1] + ' ' + c[2] + ' rg'; }
  function RG(c){ return c[0] + ' ' + c[1] + ' ' + c[2] + ' RG'; }
  var pages = [], cur = [], y = TOP, curTitle = 'Fiche';
  function newPage(){ pages.push(cur); cur = []; y = TOP; }
  function T(x, yy, size, bold, s, col){
    var enc = pdfEnc(pdfTranslit(s));
    if (!enc) return;
    cur.push(rg(col) + ' BT 1 0 0 1 ' + x.toFixed(2) + ' ' + yy.toFixed(2) + ' Tm /F' + (bold ? 2 : 1) + ' ' + size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
  }
  function wrapCell(text, wpt, size){
    var budget = Math.max(6, Math.floor((wpt - 10) / (0.52 * size)));
    var outl = [], line = '';
    text.split(' ').forEach(function(w){
      if (w === '') return;
      if (line === '') line = w;
      else if ((line + ' ' + w).length <= budget) line += ' ' + w;
      else { outl.push(line); line = w; }
    });
    if (line !== '') outl.push(line);
    return outl.length ? outl : [''];
  }
  function renderTable(tbl){
    var rows = tbl.rows, indent = tbl.indent || 0, ts = 9, lh = ts * 1.35;
    var tw = W - 2 * M - indent;
    var ncol = 0; rows.forEach(function(r){ ncol = Math.max(ncol, r.cells.length); });
    var weights = [];
    for (var j = 0; j < ncol; j++){ var mx = 5; rows.forEach(function(r){ if (r.cells[j]) mx = Math.max(mx, r.cells[j].length); }); weights.push(mx); }
    var sum = 0; weights.forEach(function(w){ sum += w; });
    var widths = [], acc = 0;
    for (var j2 = 0; j2 < ncol; j2++){ var wpt = Math.max(52, tw * weights[j2] / sum); widths.push(wpt); acc += wpt; }
    var scale = tw / acc; widths = widths.map(function(w){ return w * scale; });
    var xs = [M + indent]; for (var j3 = 0; j3 < ncol; j3++) xs.push(xs[j3] + widths[j3]);
    rows.forEach(function(r){
      var wc = [], nl = 1;
      for (var j4 = 0; j4 < ncol; j4++){ var cl = wrapCell(r.cells[j4] || '', widths[j4], ts); wc.push(cl); nl = Math.max(nl, cl.length); }

      var top = y, bot = y - rowH;
      if (r.head) cur.push(rg(COL.lav) + ' ' + (M + indent) + ' ' + bot.toFixed(2) + ' ' + tw.toFixed(2) + ' ' + rowH.toFixed(2) + ' re f');
      cur.push(RG(COL.bord) + ' 0.8 w');
      cur.push((M + indent) + ' ' + top.toFixed(2) + ' m ' + (M + indent + tw) + ' ' + top.toFixed(2) + ' l S');
      cur.push((M + indent) + ' ' + bot.toFixed(2) + ' m ' + (M + indent + tw) + ' ' + bot.toFixed(2) + ' l S');
      for (var j5 = 0; j5 <= ncol; j5++) cur.push(xs[j5].toFixed(2) + ' ' + top.toFixed(2) + ' m ' + xs[j5].toFixed(2) + ' ' + bot.toFixed(2) + ' l S');
      cur.push('0 0 0 RG 1 w');
      for (var j6 = 0; j6 < ncol; j6++){
        for (var k = 0; k < wc[j6].length; k++) T(xs[j6] + 5, top - ts - 4 - k * lh, ts, r.head, wc[j6][k], COL.blk);

    if (ln.banner){
      if (y - 46 < M) newPage();
      var bh = 42;
      curTitle = ln.title || 'Fiche';
      cur.push(rg(COL.ind) + ' ' + M + ' ' + (y - bh).toFixed(2) + ' ' + (W - 2 * M) + ' ' + bh + ' re f');
      T(M + 14, y - 21, 14, true, curTitle, COL.wht);
      T(M + 14, y - 33, 8.5, false, 'Fiche synth\u00e9tique' + (typeof PDF_MATIERE !== 'undefined' && PDF_MATIERE ? ' \u2014 ' + PDF_MATIERE : ''), COL.wht);

    }
    if (ln.table){ renderTable(ln.table); return; }
    var lh2 = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh2 - (ln.h ? 12 : 0) < M + 22) newPage();
    y -= (ln.gap || 0);
    if (ln.h){
      y -= 2;
      var bh3 = ln.size + 10;
      cur.push(rg(COL.lav) + ' ' + M + ' ' + (y - ln.size - 3).toFixed(2) + ' ' + (W - 2 * M) + ' ' + bh3 + ' re f');
      y -= ln.size * 1.05;
      var hx = M + 8, prevEnd = true;
      ln.segs.forEach(function(s){
        if (!s.t) return;
        var enc2 = pdfEnc(pdfTranslit(s.t));
        if (!enc2) return;
        var gapSp = (hx > M + 8 && !prevEnd && s.t.charAt(0) !== ' ') ? 1 : 0;
        T(hx + 0.52 * ln.size * gapSp, y, ln.size, true, s.t, COL.ind);
        hx += 0.52 * ln.size * (enc2.length + gapSp);
        prevEnd = / $/.test(s.t);
      });
      y -= ln.size * 0.37 + 3;
      return;
    }
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    if (ln.li) T(x - 11, y, ln.size, false, '\u2022', COL.ind);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      T(x, y, ln.size, s.b, s.t, COL.blk);
      x += 0.52 * ln.size * pdfEnc(pdfTranslit(s.t)).length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  for (var p = 0; p < pages.length; p++){
    var pgFoot = 'Fiche synth\u00e9tique' + (typeof PDF_MATIERE !== 'undefined' && PDF_MATIERE ? ' \u2014 ' + PDF_MATIERE : '') + ' \u2014 ' + curTitle;
    var fx = M, fw = 0.52 * 7.5 * pdfEnc(pdfTranslit(pgFoot)).length;

    var pw = 0.52 * 7.5 * pn.length;

  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';

}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var PG_MATIERE = 'philosophie';
function pgHash(s){ var h = 5381; for (var i = 0; i < s.length; i++){ h = ((h << 5) + h + s.charCodeAt(i)) | 0; } return (h >>> 0).toString(36); }
function pgKey(){ return 'patty-qcm-pg-' + PG_MATIERE; }
function pgLoad(){ try { return JSON.parse(localStorage.getItem(pgKey()) || '{}'); } catch(e){ return {}; } }
function pgSave(q, ok){
  try {
    var d = pgLoad(); var t = q.t;

    d[t].n = QUESTIONS.filter(function(x){ return x.t === t; }).length;
    if (!d[t].q) d[t].q = {};
    d[t].q[pgHash(q.q)] = ok ? 1 : 0;
    localStorage.setItem(pgKey(), JSON.stringify(d));
    pgResume();
  } catch(e) {}
}
function pgReset(){ if (!window.confirm('Réinitialiser la progression de cette matière ?')) return; try { localStorage.removeItem(pgKey()); } catch(e){} pgResume(); }
function pgChap(theme){
  for (var i = 0; i < COURS_META.length; i++){ if (COURS_META[i].theme === theme){ currentChap = COURS_META[i].id; break; } }
  showTab('quiz'); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function pgToggle(){ var e = document.getElementById('pg-chaps'); if (e) e.style.display = (e.style.display === 'none') ? 'flex' : 'none'; }
function pgResume(){
  var el = document.getElementById('pg-resume'); if (!el) return;
  var d = pgLoad(); var ans = 0, ok = 0;
  Object.keys(d).forEach(function(t){ var qq = (d[t] && d[t].q) || {}; Object.keys(qq).forEach(function(h){ ans++; if (qq[h]) ok++; }); });
  if (!ans) { el.style.display = 'none'; return; }
  var tot = QUESTIONS.length || 1;
  var pctA = Math.round(100 * Math.min(ans, tot) / tot);
  var pctR = Math.round(100 * ok / ans);
  var col = pctR >= 70 ? '#4ade80' : (pctR >= 50 ? '#fbbf24' : '#f87171');
  var c = (2 * Math.PI * 14).toFixed(1);
  var h = '<div class="pg-top">';
  h += '<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="5"/><circle cx="17" cy="17" r="14" fill="none" stroke="' + col + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + (c * pctA / 100).toFixed(1) + ' ' + c + '" transform="rotate(-90 17 17)"/></svg>';
  h += '<span><b>' + ans + ' / ' + tot + '</b> questions répondues (' + pctA + ' %) · réussite <b style="color:' + col + '">' + pctR + ' %</b></span>';
  h += '<button class="pg-toggle" onclick="pgToggle()">chapitres ▾</button>';
  h += '<button class="pg-rz" onclick="pgReset()" title="Réinitialiser la progression de cette matière">réinitialiser</button>';
  h += '</div>';
  var byT = {}; QUESTIONS.forEach(function(q){ byT[q.t] = (byT[q.t] || 0) + 1; });
  h += '<div class="pg-chaps" id="pg-chaps" style="display:none">';
  COURS_META.forEach(function(cm){
    var t = cm.theme, n = byT[t] || 0;
    var dt = d[t]; var qa = 0, qo = 0;
    if (dt && dt.q) { Object.keys(dt.q).forEach(function(k){ qa++; if (dt.q[k]) qo++; }); }
    var isOk = n > 0 && qa >= n && (100 * qo / qa) >= 70;
    var cls = qa === 0 ? '' : (isOk ? ' ok' : ' mid');
    var sym = qa === 0 ? '⬜' : (isOk ? '✅' : '🟡');
    var tip = t + ' — ' + qa + '/' + n + ' question' + (n > 1 ? 's' : '') + ' répondues' + (qa ? ' (' + Math.round(100 * qo / qa) + ' % de réussite)' : '');
    h += '<button class="pg-dot' + cls + '" title="' + tip.replace(/"/g, '&quot;') + '" onclick="pgChap(\'' + t.replace(/'/g, "\\'") + '\')">' + sym + ' ' + cm.titre + '</button>';
  });
  h += '</div>';
  el.style.display = 'block';
  el.innerHTML = h;
}

function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  pgSave(state.qs[state.idx], i === state.qs[state.idx].a);
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de philosophie</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p><div style="margin:12px 0 0"><input type="text" id="prog-search" oninput="progSearchList(this.value)" placeholder="🔎 Rechercher dans les cours..." style="width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.9rem;font-family:inherit;outline:none"></div><div id="prog-search-results"></div>' + h + '</section>';
})();
// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
pgResume();
</script>
