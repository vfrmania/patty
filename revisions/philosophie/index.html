var PROGRAMME = [{"n": "Terminale — La méthode", "ch": [{"t": "La démarche philosophique : questionner et argumenter", "id": "intro-philo"}]}, {"n": "Terminale — La connaissance", "ch": [{"t": "La vérité : la chercher, la dire", "id": "verite"}, {"t": "La science et la raison", "id": "science"}]}, {"n": "Terminale — Le sujet", "ch": [{"t": "La conscience et l'inconscient", "id": "conscience"}, {"t": "La liberté : choisir et agir", "id": "liberte"}]}, {"n": "Terminale — La morale", "ch": [{"t": "La morale et la justice : fondement et obligation", "id": "morale"}, {"t": "Le bonheur : bien vivre et plaisir", "id": "bonheur"}]}, {"n": "Terminale — La culture", "ch": [{"t": "L'art : créer, interpréter, juger", "id": "art"}, {"t": "Le travail et la technique : contrainte ou réalisation ?", "id": "travail"}]}, {"n": "Terminale — La politique", "ch": [{"t": "L'État et le droit : obéir, gouverner, juger", "id": "etat"}]}];
var COURS_META = [
{"id": "intro-philo", "theme": "La démarche philosophique : questionner et argumenter (Terminale)", "niveau": "Terminale", "titre": "La démarche philosophique : questionner et argumenter", "cours": "<div class=\"cours-head\"><h2>La démarche philosophique : questionner et argumenter</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'étonnement et la question philosophique</h3>\n<div class=\"tip\">La philosophie naît de l'ÉTONNEMENT devant ce qui semble évident (Platon, Aristote) : « qu'est-ce que la justice ? », « ai-je un corps ou suis-je un corps ? ». La question philosophique est OUVERTE (pas de réponse par oui/non), CONCEPTUELLE (elle interroge les notions : liberté, vérité) et NORMATIVE (elle cherche ce qui doit être, pas seulement ce qui est).<br>Philosophie ≠ opinion : une opinion se subit ; une thèse philosophique se CONSTRUIT et se DISCUTE.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — transformer une question en problématique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sujet : « Faut-il toujours dire la vérité ? » Construire la problématique.</div><div class=\"etu\"><b>Étape 1</b> — <b>Définir</b> : « vérité » (adéquation du discours au réel ? sincérité ?) ; « toujours » (y compris quand cela blesse, quand cela met en danger ?) ; « faut-il » (morale, prudence, droit ?).</div><div class=\"etu\"><b>Étape 2</b> — <b>Trouver la tension</b> : la morale exige la sincérité MAIS la vérité peut détruire (cruauté, trahison) : devoir de vérité vs devoir de bonté.</div><div class=\"etu\"><b>Étape 3</b> — <b>Problématiser</b> : « La sincérité est-elle un absolu moral ou le mensonge par humanité est-il parfois juste ? » : la question devient un CONFLIT de principes : c'est la marque du sujet philosophique : sans tension, pas de problème, pas de philosophie.</div></div></details>\n<h3>2. Argumenter : thèse, arguments, objections</h3>\n<div class=\"tip\">Une argumentation philosophique : ① une THÈSE (position claire) ② des ARGUMENTS (raisons) ③ des EXEMPLES (situations concrètes) ④ la discussion des OBJECTIONS (la thèse adverse, prise au sérieux puis discutée).<br>Les grands types d'arguments : déduction (du général au particulier), induction (accumulation de cas), analogie, réduction par l'absurde (montrer que la thèse adverse aboutit à une conséquence absurde : Descartes, Kant).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — construire un raisonnement par l'absurde</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Thèse : « nos sensations nous trompent toujours. » Discuter par l'absurde.</div><div class=\"etu\"><b>Étape 1</b> — <b>Assumer la thèse adverse</b> : si toutes les sensations trompent, alors le monde n'existe pas comme je le perçois, et même ma douleur est douteuse.</div><div class=\"etu\"><b>Étape 2</b> — <b>Contraindre la conséquence</b> : or, fuir le feu, éviter le précipice : la sensation de douleur GUIDE la survie : se fier à elle n'est pas absurde (Descartes lui-même distingue la sensation « en tant qu'elle rapporte » le vrai). </div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure nuancé</b> : les sensations sont globalement FIABLES pour la vie pratique, mais trompeuses pour juger de la réalité ultime (le bâton brisé dans l'eau) : la thèse initiale, absolue, tombe : une NUANCE la remplace : c'est le mouvement type d'une discussion philosophique : renforcer en affaiblissant l'absolu.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> l'opinion (« je pense que ») n'est pas un argument ; l'argument d'autorité (« Kant l'a dit ») doit être accompagné d'une RAISON ; l'exemple ne prouve pas une thèse universelle (il ILLUSTRE) ; attention aux questions de fait (« combien ? ») qui ne sont pas philosophiques : la question philosophique est une question de DROIT (que faut-il ? que devons-nous ?).</div>"},
{"id": "verite", "theme": "La vérité : la chercher, la dire (Terminale)", "niveau": "Terminale", "titre": "La vérité : la chercher, la dire", "cours": "<div class=\"cours-head\"><h2>La vérité : la chercher, la dire</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Qu'est-ce que le vrai ?</h3>\n<div class=\"tip\"><b>Définition classique</b> : VERITAS EST ADEQUATIO REI ET INTELLECTUS (la vérité est l'adéquation de la chose et de l'esprit : Thomas d'Aquin) : vrai = ce qui EST comme le dit mon jugement. <b>Autres critères</b> : cohérence (non-contradiction), utilité (pragmatisme : le vrai est ce qui réussit), évidence (Descartes : idée claire et distincte).<br>Distinctions : vérité MATÉRIELLE (les faits) / formelle (validité du raisonnement) ; vérité vs SINCÉRITÉ (dire ce qu'on croit vrai) ; vérité vs CERTITUDE (croire vrai n'est pas être dans le vrai).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — tester l'adéquation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « La Terre toure autour du Soleil. » « 2 + 2 = 4. » « Mentir est mal. » Trois vérités de même type ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Premier énoncé</b> : vérité FACTUELLE : adéquation au réel (vérifiable : observation, calculs : Kepler). Elle est EMPIRIQUE : elle dépend du monde.</div><div class=\"etu\"><b>Étape 2</b> — <b>Deuxième</b> : vérité FORMELLE : pure cohérence interne des définitions (indépendante du monde : nécessaire, non vérifiable par l'expérience).</div><div class=\"etu\"><b>Étape 3</b> — <b>Troisième</b> : proposition NORMATIVE (un jugement de valeur : « mal ») : ni fait, ni cohérence : elle se DISCUTE (fondement de la morale) : distinguer ces trois plans évite le sophisme qui fait passer une norme pour un fait : c'est la base de la rigueur philosophique.</div></div></details>\n<h3>2. Peut-on dire toute la vérité ? Le mensonge et le doute</h3>\n<div class=\"tip\"><b>Kant</b> : le mensonge est toujours immoral (universalisé, il détruit la parole : plus personne ne croit personne). <b>Constant</b> : le « mensonge par humanité » (cacher un fugitif au meurtrier qui le cherche) est le devoir réel : la vérité n'est pas due au mal. <b>Nietzsche</b> : la « vérité » est une « armée de métaphores » (conventions utiles : nous ne possédons pas la vérité nue).<br>Le relativisme (« chacun sa vérité ») : s'il se prend au sérieux, il se réfute (affirmer le relativisme comme vrai, c'est postuler une vérité absolue : Platon contre Protagoras).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le dilemme du mensonge humanitaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un ami meurt 5 ans à vivre : me demande « je vais guérir ? ». Dois-je dire toute la vérité ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Pour Kant</b> : la véracité est un devoir INCONDITIONNEL (je ne peux pas disposer de la vérité : autrui a droit à un discours conforme à ma croyance) : mentir, même par bonté, corrompt le lien social.</div><div class=\"etu\"><b>Étape 2</b> — <b>Contre</b> : la vérité n'est pas seulement DITE : elle est REÇUE (un mourant peut vivre ses derniers mois dans l'espoir ou le désespoir) : la sincérité absolue ignore la VULNÉRABILITÉ du destinataire.</div><div class=\"etu\"><b>Étape 3</b> — <b>Dépassement</b> : distinguer MENTIR (affirmer le faux) et TAIRE / modérer (ne pas tout dire : la franchise brutale n'est pas la vérité, c'est parfois de la violence) : la parole humaine a plusieurs devoirs (vérité, humanité) : la sagesse les hiérarchise selon la situation : c'est exactement ce que la dissertation doit problématiser.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ne pas confondre « vrai » (le jugement), « réel » (le monde) et « réel vécu » ; l'opinion n'est ni vraie ni fausse tant qu'elle n'est pas ARGUMENTÉE ; le fait (est) ne fonde pas la norme (doit être) ; le doute n'est pas le nihilisme : c'est l'hygiène de la vérité.</div>"},
{"id": "science", "theme": "La science et la raison (Terminale)", "niveau": "Terminale", "titre": "La science et la raison", "cours": "<div class=\"cours-head\"><h2>La science et la raison</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Qu'est-ce qu'une science ?</h3>\n<div class=\"tip\">Une science = un savoir ORGANISÉ : des OBJECTIFS (objets définis : la matière, le vivant), une MÉTHODE (observation, hypothèse, expérimentation, loi), un CRITÈRE de scientificité. <b>Claude Bernard</b> : la méthode expérimentale (observation ⟹ hypothèse ⟹ expérience contradictoire ⟹ loi). <b>Popper</b> : une théorie est scientifique si elle est FALSIFIABLE (réfutable) : la psychanalyse ou l'astrologie, irréfutables par principe, ne sont pas scientifiques.<br>Une loi scientifique est GÉNÉRALE et NÉCESSAIRE (elle vaut partout, tout le temps : dans les limites du modèle).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la falsifiabilité en action</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Tous les cygnes sont blancs. » Pourquoi Popper dit-il que cette proposition est scientifique ? Et pourquoi l'astrologie ne l'est-elle pas ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Cygnes</b> : la proposition EXCLUT quelque chose (un cygne noir la réfuterait) : elle peut être TESTÉE : en effet, un cygne noir a été observé (Australie) : la proposition est tombée : c'est SA scientificité (être réfutable, même réfutée).</div><div class=\"etu\"><b>Étape 2</b> — <b>Astrologie</b> : quelle que soit l'observation (le prédictif échoue ? c'est « l'interprétation » qui était fausse, jamais la doctrine), le système EXPLIQUE TOUT et son contraire : irréfutable = infalsifiable = non scientifique.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le critère inversé</b> : la scientificité n'est pas la VÉRITÉ (une théorie fausse peut être scientifique : le phlogistique) : c'est la POSSIBILITÉ D'ÊTRE CONTREDITE : une science qui ne risque rien ne sait rien : le risque logique fait la valeur scientifique.</div></div></details>\n<h3>2. Les limites de la science : ce que la raison ne peut pas (seule) dire</h3>\n<div class=\"tip\">La science répond à « comment ça marche ? », pas à « que dois-je faire ? » (Hume : pas de norme déduite du fait). Elle est INDÉTERMINÉE sur les valeurs. <b>Kant</b> : la connaissance scientifique (entendement) s'arrête aux PHÉNOMÈNES : la chose en soi (métaphysique, liberté, Dieu) échappe à la science, objet de la RAISON PRATIQUE (morale).<br>Technoscience : le savoir donne du POUVOIR (bombes, biotechnologies) : la question éthique surgit APRÈS la science (et parfois AVANT : précaution) : la science se dit, la technique se décide.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la révolution copernicienne comme rupture</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi parle-t-on de « révolution scientifique » pour Copernic-Galilée ? Qu'est-ce qui change dans la rationalité ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le contenu</b> : la Terre quitte le centre (héliocentrisme) : les apparences (le Soleil « se lève ») sont sauvées par un modèle mathématique (le mouvement relatif).</div><div class=\"etu\"><b>Étape 2</b> — <b>La méthode</b> : la vérité ne se lit plus dans l'AUTHORITÉ (Aristote, Écriture interprétée littéralement) ni dans l'évidence sensible : elle se CONSTRUIT par le calcul et l'observation instrumentée (lunette de Galilée) : la raison cherche, l'autorité cède.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le statut de la théorie</b> : un modèle n'est pas une « image » du réel : c'est une CONSTRUCTION à la fois contraignante (prédictions vérifiées) et provisoire (Kuhn : elle pourra être remplacée par un nouveau « paradigme » : Einstein ne « corrige » pas Newton, il le RELATIVISE) : la science vit de ses révolutions internes : c'est sa force et son humilité.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le scientisme (« la science suffit à tout dire ») est une position PHILOSOPHIQUE contestable, pas un énoncé scientifique ; une théorie scientifique n'est jamais « prouvée » absolument (elle est CORROBORÉE : jamais définitive) ; ne pas confondre LOI (toujours vraie dans un modèle : Kepler) et THÉORIE (structure explicative large : la relativité).</div>"},
{"id": "conscience", "theme": "La conscience et l'inconscient (Terminale)", "niveau": "Terminale", "titre": "La conscience et l'inconscient", "cours": "<div class=\"cours-head\"><h2>La conscience et l'inconscient</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La conscience : présence à soi et prise de conscience</h3>\n<div class=\"tip\"><b>Conscience</b> = à la fois la présence immédiate à soi (sentir que je sens) et le savoir moral (avoir conscience = se savoir responsable). <b>Deux sens</b> : conscience SPONTANÉE (accompagnement immédiat des vécus : le cogito) et conscience RÉFLÉCHIE (retour sur soi : se connaître).<br>La conscience fait la DIGNITÉ (Kant : l'humanité comme fin) et le TOURMENT (Pascal : « l'homme est un roseau pensant » : savoir qu'on mourra : la conscience est aussi BURDEN).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — conscience spontanée et réfléchie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Je marche en réfléchissant à un problème : où est ma conscience ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Spontanée</b> : j'ai conscience de marcher (sinon je tomberais : la perception règle le pas) sans y PENSER : la conscience accompagne sans déployer.</div><div class=\"etu\"><b>Étape 2</b> — <b>Réfléchie</b> : si je trébuche, je DEVIENTS conscient que je marchais en pensant à autre chose : le retour sur soi éclaire a posteriori.</div><div class=\"etu\"><b>Étape 3</b> — <b>Portée</b> : la conscience n'est pas un « plein » permanent : elle est attentive, variable, et surtout : elle n'est pas TOUT le psychisme (les réflexes, les habitudes, les désirs fonctionnent sans elle) : préparer la question de l'INCONSCIENT : peut-il y avoir du psychique sans conscience ?</div></div></details>\n<h3>2. L'inconscient : l'hypothèse Freud</h3>\n<div class=\"tip\"><b>Freud</b> : le psychisme n'est pas réductible à la conscience : il existe un INCONSCIENT (refoulé : désirs, souvenirs inadmissibles) qui AGIT (lapsus, rêves, actes manqués, symptômes). « Le moi n'est pas maître dans sa propre maison. »<br>Structure : ça (pulsions), surmoi (interdits intériorisés), moi (arbitre).<br><b>Objections</b> : l'inconscient freudien est-il SCIENTIFIQUE (falsifiable ? Popper doute) ? La conscience reste le LIEU de la responsabilité (se connaître pour se guérir : la cure ramène à la conscience).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire un lapsus</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un orateur ouvre un discours officiel par « Mesdames, messieurs… je suis heureux de déclarer CLOSE la séance ». Simple erreur ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le phénomène</b> : l'erreur n'est pas aléatoire : « close » est le MOT DE LA FIN (de séance) : le désir (en finir, être ailleurs, saboter?) s'exprime à l'insu du locuteur.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'interprétation freudienne</b> : le lapsus est une FORMATION DE COMPROMIS : le refoulé passe (mot interdit) sous couvert de l'erreur « innocente » : le sens n'est pas caché derrière : il est DANS le raté.</div><div class=\"etu\"><b>Étape 3</b> — <b>La discussion</b> : l'interprétation est-elle PROBANTE ou CONVENIENTE ? Le risque : une herméneutique qui « explique » tout (donc ne risque rien : Popper) : la psychanalyse exige le consentement de l'analysé (le sens doit RÉSONNER pour lui) : c'est une lecture du sens, pas une loi expérimentale : la discussion fait le sujet de bac type.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> l'inconscient freudien n'est pas le « subconscient » banal (automatismes) : c'est un REFUSÉ actif (avec intentions) ; avoir conscience n'est pas se connaître (l'introspection trompe : Compte : les rationalisations) ; la conscience reste le tribunal de la responsabilité juridique et morale : l'inconscient EXPLIQUE, il n'EXCUSE pas tout.</div>"},
{"id": "liberte", "theme": "La liberté : choisir et agir (Terminale)", "niveau": "Terminale", "titre": "La liberté : choisir et agir", "cours": "<div class=\"cours-head\"><h2>La liberté : choisir et agir</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Trois sens de la liberté</h3>\n<div class=\"tip\"><b>Liberté d'action</b> : absence d'obstacle EXTÉRIEUR (je suis libre si personne ne m'empêche : le prisonnier n'est pas libre). <b>Liberté de la volonté</b> (libre arbitre) : pouvoir choisir SANS être causé (dilemme : mes désirs me déterminent-ils ?). <b>Autonomie</b> (Kant) : se donner à soi-même sa loi (agir selon des raisons que j'approuve) : la liberté n'est pas l'absence de règle mais la règle CHOISIE.<br>Contraires : contrainte (force extérieure), nécessité (déterminisme), alienation (se croire libre en exécutant des volontés étrangères : le fumeur « libre »).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'esclave et le tyran</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Épictète (esclave) écrit : « tu peux me charger de chaînes, pas ma volonté ». Qui est libre, de l'esclave enchaîné ou du tyran qui a tout pouvoir ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'esclave</b> : sa liberté D'ACTION est nulle (chaînes) mais sa volonté reste (il peut refuser INTÉRIEUREMENT de consentir : la liberté stoïcienne est intouchable).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le tyran</b> : tous les pouvoirs extérieurs, mais esclave de ses peurs (paranoïa : il ne peut pas dormir sans garde) et de ses désirs : sa liberté INTÉRIEURE est moindre que celle de l'esclave.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon</b> : la liberté n'est pas d'abord la PUISSANCE (pouvoir faire) mais le JUGEMENT (ne dépendre que de soi sur ce qui dépend de nous) : Épictète : distinguer ce qui dépend de nous (jugement, désir) de ce qui n'en dépend pas (corps, réputation) : la sagesse réduit l'esclavage aux choses indifférentes : c'est le programme stoïcien de la liberté.</div></div></details>\n<h3>2. Déterminisme, responsabilité, liberté politique</h3>\n<div class=\"tip\"><b>Déterminisme</b> : tout événement a des causes : si mes actes sont causés (gènes, éducation, inconscient), ai-je un libre arbitre ? <b>Spinoza</b> : la liberté n'est pas l'absence de causes, c'est l'INTÉRIORITÉ des causes (agir par sa propre nature) et leur CONNAISSANCE (le libre est celui qui comprend ses déterminations).<br><b>Liberté politique</b> : les libertés (droits garantis : expression, vote) et la LIBERTÉ comme institution (la loi qui protège au lieu d'opprimer : Montesquieu : « la liberté est le droit de faire ce que les lois permettent »).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — liberté et loi</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le feu rouge restreint mon mouvement : la loi limite-t-elle ou FONDE-t-elle ma liberté ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'évidence trompeuse</b> : au premier regard, la loi ENTRAVE (interdits) : la liberté serait « sans loi » (l'anarchie du caprice).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'argument de Rousseau/Kant</b> : sans loi, la liberté des plus forts dévore celle des faibles (la loi du plus fort n'est pas la liberté : c'est la guerre) : la loi ÉGALE protège la liberté de tous (obéir à la loi qu'on s'est donnée : autonomie : Rousseau : « l'obéissance à la loi qu'on s'est prescrite est liberté »).</div><div class=\"etu\"><b>Étape 3</b> — <b>La nuance finale</b> : TOUTE loi ne libère pas : seule la loi JUSTE (égalité, généralité, consentement) : la loi d'un tyran opprime : d'où la question politique : qui fait la loi ? (démocratie) : la liberté civile est un ARTISANAT institutionnel, pas une absence de règles.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ne pas confondre liberté et caprice (faire n'importe quoi : l'aliénation du désir) ; la contrainte n'est pas la seule servitude (la suggestion, la publicité, l'habitude) ; « libre arbitre » est un PROBLÈME (dilemme) pas un dogme : les deux positions sont défendables ; liberté des Modernes (droits, sécurité : Constant) ≠ liberté des Anciens (participation directe).</div>"},
{"id": "morale", "theme": "La morale et la justice : fondement et obligation (Terminale)", "niveau": "Terminale", "titre": "La morale et la justice : fondement et obligation", "cours": "<div class=\"cours-head\"><h2>La morale et la justice : fondement et obligation</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La morale : d'où viennent les règles ?</h3>\n<div class=\"tip\"><b>Morale</b> (règles intérieures de ce qui est bien/valable) vs <b>justice</b> (règles sociales, institutionnelles : le droit). Trois familles de fondements : ① <b>le devoir</b> (Kant : la morale est la forme de la LOI universelle : impératif catégorique : « agis comme si la maxime de ton action devait être érigée en loi universelle ») ② <b>les conséquences</b> (utilitarisme : Bentham, Mill : est bien ce qui maximise le bien-être du plus grand nombre) ③ <b>les vertus</b> (Aristote : la morale est l'excellence du caractère : le courage, la justice, appris par l'habitude).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — trois morales jugent le même cas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un médecin peut mentir à un patient mourant « pour son bien ». Juger selon les trois morales.</div><div class=\"etu\"><b>Étape 1</b> — <b>Déontologique (Kant)</b> : mentir est interdit par la forme universelle (la véracité est un devoir inconditionnel) : juger par l'INTENTION conforme au devoir : le mensonge reste interdit (même « charitable »).</div><div class=\"etu\"><b>Étape 2</b> — <b>Conséquentialiste (utilitarisme)</b> : calculer les effets (le désespoir affaiblit l'immunité ? l'espoir prolonge ?) : juger par les RÉSULTATS : le mensonge peut être MORAL s'il maximise le bien-être global.</div><div class=\"etu\"><b>Étape 3</b> — <b>Éthique des vertus (Aristote)</b> : que ferait le SAGE (le médecin excellent) ? Il adapte (phronesis : la sagesse pratique : il n'y a pas de règle absolue : ni mensonge brutal, ni vérité brutale : la mesure juste au moment juste). Trois morales, trois jugements : la dissertation les fait dialoguer.</div></div></details>\n<h3>2. La justice : le droit, l'égalité, la punition</h3>\n<div class=\"tip\"><b>Justice</b> : rendre à chacun son dû (Aristote) ; distributive (répartir les biens selon un critère : mérite, besoin, égalité) / commutative (égalité des échanges). <b>Rawls</b> : le voile d'ignorance (les règles justes sont celles que choisirait quelqu'un qui ignore sa place dans la société). <b>Punir</b> : pourquoi ? rétribution (le châtiment rend la justice : Kant), dissuasion (Bentham : l'efficacité), réhabilitation (réinsérer socialement) : trois logiques qui peuvent s'opposer.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le voile d'ignorance de Rawls</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Faut-il autoriser une école privée d'élite financée par les riches ? Test avec le voile d'ignorance.</div><div class=\"etu\"><b>Étape 1</b> — <b>La position originelle</b> : imaginez que vous ne savez PAS si vous naîtrez riche ou pauvre, doué ou non : quelles règles d'école choisiriez-vous ?</div><div class=\"etu\"><b>Étape 2</b> — <b>Le choix rationnel</b> : prudents, nous choisirions ① une école de base EXCELLENTE pour tous (si je suis pauvre, j'y ai droit) ② des inégalités d'élite tolérées seulement si elles PROFITENT aux plus défavorisés (les découvertes de l'élite enrichissent l'école publique).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le critère</b> : une société juste n'est pas nécessairement ÉGALE : elle est arrangée pour que les inégalités servent les plus bas (le « principe de différence » : libéralisme égalitaire) : c'est un exemple PARFAIT pour un sujet sur la justice sociale : un critère formel qui ne dit pas « égalité absolue » mais « bénéfice minimal pour les plus fragiles ».</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le droit peut être IMMORAL (lois injustes : la désobéissance civile : Thoreau, Gandhi, King) ; la morale ne se déduit pas des faits (Hume) ; l'égalité a plusieurs sens (devant la loi ≠ égalité des conditions) ; distinguer égalité formelle et équité.</div>"},
{"id": "bonheur", "theme": "Le bonheur : bien vivre et plaisir (Terminale)", "niveau": "Terminale", "titre": "Le bonheur : bien vivre et plaisir", "cours": "<div class=\"cours-head\"><h2>Le bonheur : bien vivre et plaisir</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Plaisir, bonheur, joie : distinguer</h3>\n<div class=\"tip\"><b>Plaisir</b> : satisfaction immédiate d'un désir (ponctuel, passif). <b>Bonheur</b> : état durable de satisfaction GLOBAL (Épicure : l'ataraxie : absence de trouble : « le bonheur est le souverain bien »). <b>Joie</b> (Spinoza) : augmentation de notre puissance d'agir (active, pas subie).<br>Le plaisir est un INGRÉDIENT possible du bonheur, pas le bonheur lui-même (l'hédonisme exclusif rate la durée : l'île de Cythère : le vernis des plaisirs s'écaille).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le hédonisme en excès</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Mangeons, buvons, demain nous mourrons » : le plaisir est-il la clef du bonheur ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le pari hédoniste</b> : la vie est brève : maximiser les plaisirs (vin, festins : l'hédonisme vulgaire de Calliclès dans le Gorgias : « laisser croître ses désirs »).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'objection (Socrate puis Épicure)</b> : ① les plaisirs intempérants engendrent leurs douleurs (la gueule de bois, la dette, la maladie : le calcul : certains plaisirs coûtent plus qu'ils ne donnent) ② l'insatiabilité rend esclave (toujours plus : jamais assez : le désir sans mesure est une soif de tonneau des Danaïdes).</div><div class=\"etu\"><b>Étape 3</b> — <b>La réponse épicurienne</b> : calculer ! (Épicure : la lettre à Ménécée : le choix raisonné des plaisirs : préférer un plaisir stable à un plaisir intense mais ruineux : le JARDIN : l'amitié, la tranquillité, les désirs NATURELS ET NÉCESSAIRES) : le bonheur est une ÉCONOMIE du désir, pas une explosion : c'est déjà presque la sagesse stoïcienne.</div></div></details>\n<h3>2. Le bonheur peut-il être une fin directe ?</h3>\n<div class=\"tip\"><b>Paradoxe</b> : le bonheur FUIT quand on le poursuit directement (il est un SOUS-PRODUIT : Mill : « ceux seulement sont heureux qui ont un objet qui les absorbe »). <b>Kant</b> : le bonheur est un IDEAL de l'imagination (indéfinissable : chacun le veut sans savoir ce que c'est) : la morale doit viser le DEVOIR, pas le bonheur (être digne du bonheur).<br><b>Stoïciens</b> : viser la VERTU (ce qui dépend de nous) : le bonheur suit (l'eudémonisme : le bonheur est l'activité de l'âme conforme à la vertu : Aristote).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le paradoxe de Mill</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi ceux qui cherchent le bonheur directement sont-ils souvent malheureux ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le regard sur soi</b> : se demander « suis-je heureux ? » en permanence, c'est se SURVEILLER (l'introspection obsessionnelle détruit l'immersion : le bonheur se vit, se vérifie rarement).</div><div class=\"etu\"><b>Étape 2</b> — <b>La comparaison</b> : viser le bonheur comme une norme (celle des autres : réseaux sociaux) le convertit en ANXIÉTÉ (mesurer, jalouser : la jalousie tue la jouissance).</div><div class=\"etu\"><b>Étape 3</b> — <b>La solution</b> : viser des OBJETS (une œuvre, des liens, un jardin : ce qui nous ABSORBE) : le bonheur arrive « pendant qu'on regarde ailleurs » (paradoxe hedonique : le flow : Csikszentmihalyi) : en dissertation, ce paradoxe n'interdit pas le bonheur : il réoriente la VOLONTÉ (ne pas viser l'état, viser les ACTES qui le produisent).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> confondre plaisir et bonheur (le sujet de bac type) ; le bonheur n'est pas un DROIT (l'État garantit la poursuite, pas le résultat) ; distinguer bonheur (état subjectif) et FÉLICITÉ (le bonheur parfait : la béatitude : inaccessible ? Aristote : l'activité contemplative) ; l'illusion du « il me manque quelque chose » : le conditionnel du bonheur (« je serais heureux SI… ») est un pièce mental.</div>"},
{"id": "art", "theme": "L'art : créer, interpréter, juger (Terminale)", "niveau": "Terminale", "titre": "L'art : créer, interpréter, juger", "cours": "<div class=\"cours-head\"><h2>L'art : créer, interpréter, juger</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Qu'est-ce que l'art ? Imitation, expression, forme</h3>\n<div class=\"tip\">Trois grandes théories : ① <b>IMITATION</b> (mimesis : Platon, Aristote : l'art représente le monde : le peintre imite le lit de l'ébéniste : Platon le condamne (copie de copie), Aristote le valorise (la catharsis : la purge des passions par la représentation) ② <b>EXPRESSION</b> (l'art exprime une intériorité : l'âme, l'époque : Van Gogh : « l'art est l'homme ajouté à la nature ») ③ <b>FORME</b> (l'art est une organisation SIGNIFICATIVE : Clive Bell : la « forme signifiante » : l'art moderne assume l'autonomie de la forme : la non-figuration).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi un ready-made est de l'art ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Duchamp expose un urinoir signé « R. Mutt » (Fontaine, 1917). Selon quelles théories est-ce de l'art ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Contre l'imitation</b> : l'urinoir ne REPRÉSENTE rien (théorie de la mimesis : inapte à juger) : le ready-made force la question.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le geste et l'institution</b> : l'art n'est pas dans l'OBJET (industriel : identique en magasin) mais dans le CHOIX + le CONTEXTE (exposé, signé, daté) : la proposition artistique est un GESTE (Danto : « l'art est ce que le monde de l'art désigne ») : l'institution (le musée, le public) participe de la définition.</div><div class=\"etu\"><b>Étape 3</b> — <b>La théorie esthétique en acte</b> : Fontaine QUESTIONNE l'art (« qu'est-ce qui fait l'art ? ») : l'œuvre d'art moderne peut être sa propre théorie : Duchamp ne dit pas « c'est beau » : il dit « voyez comme votre idée d'art est fragile et intéressante » : c'est exactement ce que la dissertation doit saisir : l'art moderne DÉPLACE la question esthétique.</div></div></details>\n<h3>2. Interpréter et juger : le beau est-il subjectif ?</h3>\n<div class=\"tip\"><b>Kant</b> : le jugement de goût est SUBJECTIF mais prétend à l'UNIVERSALITÉ (« c'est beau » n'est pas « ça me plaît » : je réclame l'assentiment d'autrui SANS le prouver). <b>Hume</b> : le goût se FORME (les normes du chef-d'œuvre : le jugement des experts). <b>Bourdieu</b> : le goût est SOCIALEMENT construit (la « distinction » : l'art légitime est un capital : le goût « naturel » est une illusion sociologique).<br>Le jugement esthétique ne se prouve pas (comme une loi), il se DISCUTE (l'argumentation critique : Kant : la « critique » n'est pas dogmatique).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — « c'est beau » : que dis-je ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Devant un coucher de soleil, je dis « c'est beau ». Devant un gâteau, « j'aime ça ». Quelle différence ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le gâteau</b> : « j'aime » est un énoncé d'AGRÉABLE (privé : purement subjectif : je ne reproche à personne de préférer la fraise).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le coucher de soleil</b> : « c'est beau » prétend à l'universel (je suis étonné que d'autres ne le trouvent pas beau : je DISCUTE) sans pouvoir le DÉMONTRER (pas de concept qui prouve la beauté : Kant : le « sans concept »).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le paradoxe kantien</b> : le jugement de goût est « subjectif dans son principe, universel dans sa prétention » : c'est ce « désintéressement » (je ne veux pas posséder le coucher de soleil : je le contemple) qui fonde l'universalité (tout homme DEVRAIT le voir ainsi : l'humanité commune) : la discussion esthétique est possible (et c'est toute la culture : la critique d'art).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « c'est subjectif » n'interdit pas la DISCUSSION (Kant : l'universalité sans preuve) ; l'art n'est pas que la beauté (le sublime, le laid expressif : Baudelaire : « la laideur peut être artistique ») ; ne pas confondre jugement de goût et jugement DE VALEUR artistique (le chef-d'œuvre n'est pas « ce qui plaît ») ; l'imitation (photo) n'est pas automatiquement de l'art (l'intention et la forme comptent).</div>"},
{"id": "travail", "theme": "Le travail et la technique : contrainte ou réalisation ? (Terminale)", "niveau": "Terminale", "titre": "Le travail et la technique : contrainte ou réalisation ?", "cours": "<div class=\"cours-head\"><h2>Le travail et la technique : contrainte ou réalisation ?</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le travail : punition, nécessité, réalisation de soi</h3>\n<div class=\"tip\"><b>Mythe</b> : le travail comme punition (la Genèse : « à la sueur de ton front » : le mythe grec : l'âge d'or perdu). <b>Nécessité</b> : produire pour vivre (la rareté : travailler n'est pas spécifiquement humain : l'abeille travaille). <b>Spécificité humaine</b> : Hegel, Marx : le travail TRANSFORME le monde ET l'homme (l'outil : l'intelligence objectivée : dans le travail, l'homme se CONTEMPLLE dans ce qu'il a produit : la conscience se forme en œuvrant : la dialectique du maître et de l'esclave).<br>Le travail est AMBIVALENT : aliénation (Marx : le travailleur moderne se perd dans la chaîne) OU réalisation (le travail bien fait : l'artisan : l'œuvre).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la dialectique du maître et de l'esclave</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi, selon Hegel, l'ESCLAVE (qui travaille) devient-il plus libre que le MAÎTRE (qui jouit) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le maître</b> : il fait travailler l'autre pour jouir : il reçoit des objets sans les PRODUIRE : sa conscience dépend de la reconnaissance d'un esclave qu'il méprise : sa liberté s'atrophie (ne rien faire, c'est se déserter).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'esclave</b> : travaillant (contraint, d'abord), il APPRIVOISE la nature (il découvre qu'il peut la transformer : la technique : il « retarde » la peur de la mort dans le travail) : dans l'objet produit, il SE RECONNAÎT (c'est MOI qui ai fait ça : la conscience se prouve en œuvrant).</div><div class=\"etu\"><b>Étape 3</b> — <b>La conclusion</b> : la vraie liberté ne vient pas de la jouissance passive mais de la FORMATION par le travail (la culture : Bildung : Marx reprendra : le travail forme l'homme) : le retournement : celui qui paraît soumis (travailler) devient le sujet de l'histoire : le maître paresseux devient dépendant de son esclave. C'est l'argument central de toute dissertation « le travail libère-t-il ? ».</div></div></details>\n<h3>2. Aliénation, division du travail, technique</h3>\n<div class=\"tip\"><b>Marx</b> : l'aliénation du travailleur moderne : ① il ne possède pas son produit ② il ne se reconnaît pas dans la tâche parcellisée (la division du travail : Smith : la fabrique d'épingles : productivité x240 : mais l'ouvrier devient « appendice de la machine ») ③ le travail est subi (pas réalisé).<br><b>La technique</b> : Hannah Arendt distingue travail (reproduire la vie), œuvre (bâtir le monde), action (la politique) : Heidegger : la technique moderne est un « ARRIMAGE » (tout devient stock exploitable : le Rhin devient fournisseur de pression hydraulique) : la question : la technique nous LIBÈRE-t-elle du travail ou nous transforme-t-elle en ingénieurs du calcul ?</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire l'aliénation aujourd'hui</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un préparateur de commandes scanne des colis 8h/jour, chronométré par un portable. Est-ce du « travail » au sens plein ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Nécessité oui</b> : il produit (des colis partent : il est payé : la société fonctionne) : le plan de la nécessité est respecté.</div><div class=\"etu\"><b>Étape 2</b> — <b>Réalisation non</b> : il ne conçoit RIEN (le rythme est imposé : le geste : dix secondes : le logiciel surveille : les toilettes chronométrées !) : il ne se RECONNAÎT pas dans un objet (aucun produit n'est « sien » : aucune prouesse apprise : aucune fierté d'artisan) : les 4 aliénations de Marx sont là (produit : geste : être générique : autrui).</div><div class=\"etu\"><b>Étape 3</b> — <b>La discussion moderne</b> : les correctifs possibles : la rotation des tâches, l'autonomie d'équipe, le sens (soigner : enseigner : l'utilité sociale reconnue : le « sale boulot » assumé par d'autres : le travail émotionnel (Hochschild) : la question politique : peut-on ORGANISER le travail pour qu'il reste formation de soi ? (les expériences d'autogestion : les coopératives : la « quête de sens » des nouvelles générations) : c'est le sujet de bac « le travail n'est-il qu'une contrainte ? ».</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ne pas confondre travail (répétitif : Arendt), œuvre (durable : l'artisanat) et action (politique) ; le chômage technique : la fin du travail « subi » est-elle une LIBÉRATION (Keynes : la semaine de 15h ?) ou une perte de reconnaissance sociale ? ; la technique n'est ni neutre ni diabolique : elle DEPEND des usages (le marteau construit ou frappe).</div>"},
{"id": "etat", "theme": "L'État et le droit : obéir, gouverner, juger (Terminale)", "niveau": "Terminale", "titre": "L'État et le droit : obéir, gouverner, juger", "cours": "<div class=\"cours-head\"><h2>L'État et le droit : obéir, gouverner, juger</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Pourquoi obéir ? L'État et la légitimité</h3>\n<div class=\"tip\"><b>Hobbes</b> : sans État, la « guerre de tous contre tous » (l'état de nature : égalité de vulnérabilité : d'où la peur) : le CONTRAT transfère la force au souverain en échange de la SÉCURITÉ (le Léviathan, 1651). <b>Locke</b> : l'État protège les DROITS NATURELS (vie, liberté, propriété) : s'il les viole, le peuple peut le déposer (le droit de résistance). <b>Rousseau</b> : la souveraineté appartient au PEUPLE (la volonté générale) : la loi juste est celle qu'on s'est prescrite.<br><b>Weber</b> : trois types de domination légitime : traditionnelle (les anciens), charismatique (le prophète), légale-rationnelle (la règle élue). Obéir n'est légitime que si l'autorité l'est.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi payer ses impôts ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'impôt me retire mon argent par la contrainte : pourquoi est-il légitime (et pas un vol) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La thèse du vol</b> (l'anarcho-libéral : « c'est MON argent : l'État le prend par la menace ») : l'impôt serait un racket légalisé.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'argument du contrat</b> : je ne paie pas UNE taxe isolée : je contribue à un SYSTÈME dont je bénéficie (routes : école : hôpital : sécurité : la monnaie elle-même ! : l'argent que je détiens ne VAUT que par l'État qui le garantit) : l'impôt est le PRIX du monde civil (le « prix de la civilisation » : Holmes).</div><div class=\"etu\"><b>Étape 3</b> — <b>La condition de légitimité</b> : l'impôt est légitime si ① il est DÉCIDÉ par les représentants (pas de confiscation arbitraire : le consentement : la Révolution française contre les privilèges fiscaux !) ② il sert le bien commun (pas la clientèle du prince) ③ il est ÉGAL selon les capacités (la progressivité) : la légitimité n'est pas l'efficacité : c'est la JUSTICE de la procédure et de l'usage : c'est l'objet du débat démocratique permanent.</div></div></details>\n<h3>2. Gouverner et juger : séparation des pouvoirs, démocratie</h3>\n<div class=\"tip\"><b>Montesquieu</b> : « tout homme qui a du pouvoir est porté à en abuser » : d'où la SÉPARATION des pouvoirs (législatif, exécutif, judiciaire) : « le pouvoir arrête le pouvoir » (l'Esprit des lois, 1748). <b>La démocratie</b> : le peuple souverain (élections : la contestation pacifique : l'opposition) MAIS : la tyrannie de la majorité (Tocqueville : la minorité doit être protégée) : la démocratie est un RÉGIME de procédures (la règle de droit : la publicité : le contre-pouvoir : la presse).<br><b>Juger</b> : l'indépendance de la justice (l'impartialité : la procédure contradictoire) est la condition de l'État de droit.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le pouvoir arrête le pouvoir</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un président, élu à 60 %, veut réformer les retraites par ordonnance en contournant le Parlement. La majorité électorale suffit-elle à le légitimer ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'argument de la majorité</b> : 60 % ont voté pour lui : un mandat est un POUVOIR de gouverner (l'efficacité : l'action).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'objection institutionnelle</b> : l'élection donne une COMPÉTENCE bornée (le président gouverne DANS la Constitution : le Parlement légifère : le juge contrôle) : contourner le Parlement, c'est dissoudre la délibération (la loi n'est plus discutée : décrétée) : la démocratie n'est pas seulement l'urne : c'est le PROCESSUS (Tocqueville : la lenteur délibérative est le prix de la liberté).</div><div class=\"etu\"><b>Étape 3</b> — <b>La balance</b> : les contre-pouvoirs (le Conseil constitutionnel : la presse : la rue : le syndicat) ne « bloquent » pas la démocratie : ils LA RÉALISENT (le peuple n'est pas seulement une simple urne : il délibère sans cesse) : Montesquieu : le pouvoir arrête le pouvoir : l'équilibre (et non l'efficacité seule) définit l'État de droit.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> l'obéissance n'est pas la soumission (la désobéissance civile : loi injuste) ; la démocratie n'est pas la seule règle majoritaire (les DROITS protègent les minorités) ; l'État de droit n'est pas l'absence d'État (c'est l'État SOUMIS au droit) ; distinguer légal (conforme au droit) et légitime (justifié moralement).</div>"},

{"id": "intro-philo", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Question philosophique</b> : ouverte, conceptuelle, normative : elle naît de l'étonnement.</p>\n<p><b>Problématique</b> = la tension entre deux réponses plausibles (« certes… mais »).</p>\n<p><b>Argumentation</b> : thèse + arguments + exemples + objections discutées.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Définir chaque terme</b> du sujet avant d'écrire.</li>\n<li><b>Type d'argument</b> : déduction, induction, analogie, absurde.</li>\n<li><b>Toujours traiter l'objection</b> : elle structure l'antithèse.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Opinion ≠ thèse (une thèse se défend par raisons).</li>\n<li>L'exemple illustre : il ne prouve pas une loi.</li>\n<li>Question de fait ≠ question philosophique (de droit).</li>\n</ul>"},
{"id": "verite", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Vérité</b> = adéquation de l'esprit et de la chose (Aquin) ; critères : cohérence, évidence, utilité.</p>\n<p><b>Distinctions :</b> vérité/sincérité ; vérité/certitude ; fait/norme ; réel/vrai.</p>\n<p><b>Débat :</b> Kant (jamais mentir) vs Constant (mensonge par humanité) ; Nietzsche (vérité = convention).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Trier les énoncés</b> : factuel, formel, normatif.</li>\n<li><b>Relativisme</b> : se réfute en s'énonçant (Platon contre Protagoras).</li>\n<li><b>Mentir ≠ taire</b> : la parole a plusieurs devoirs.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« Chacun sa vérité » confond vérité et opinion.</li>\n<li>Certitude (psychologique) ≠ vérité (logique).</li>\n<li>Un fait ne prouve pas une norme.</li>\n</ul>"},
{"id": "science", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Science</b> = savoir organisé : objet, méthode (Bernard), critère (Popper : falsifiabilité).</p>\n<p><b>Loi</b> = générale et nécessaire (dans les limites du modèle) ; théorie = structure explicative provisoire.</p>\n<p><b>Limites :</b> le fait ne fonde pas la norme (Hume) ; Kant : la science s'arrête aux phénomènes.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Test popperien</b> : que faudrait-il pour réfuter cette théorie ? Si « rien » ⟹ non scientifique.</li>\n<li><b>Méthode expérimentale</b> : observation, hypothèse, expérience, loi.</li>\n<li><b>Distinguer</b> science, scientisme, technique.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Une théorie vraie n'est pas « prouvée » : elle est corroborée.</li>\n<li>Le savoir ne dit pas seul le devoir-être.</li>\n<li>Le paradigme (Kuhn) : la science change de cadre, pas seulement de détails.</li>\n</ul>"},

function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}
