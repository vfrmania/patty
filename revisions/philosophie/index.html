<script>
var PROGRAMME = [{"n": "Terminale — La méthode", "ch": [{"t": "La démarche philosophique : questionner et argumenter", "id": "intro-philo"}]}, {"n": "Terminale — La connaissance", "ch": [{"t": "La vérité : la chercher, la dire", "id": "verite"}, {"t": "La science et la raison", "id": "science"}]}, {"n": "Terminale — Le sujet", "ch": [{"t": "La conscience et l'inconscient", "id": "conscience"}, {"t": "La liberté : choisir et agir", "id": "liberte"}]}, {"n": "Terminale — La morale", "ch": [{"t": "La morale et la justice : fondement et obligation", "id": "morale"}, {"t": "Le bonheur : bien vivre et plaisir", "id": "bonheur"}]}, {"n": "Terminale — La culture", "ch": [{"t": "L'art : créer, interpréter, juger", "id": "art"}, {"t": "Le travail et la technique : contrainte ou réalisation ?", "id": "travail"}]}, {"n": "Terminale — La politique", "ch": [{"t": "L'État et le droit : obéir, gouverner, juger", "id": "etat"}]}];
var COURS_META = [
 {
  "id": "intro-philo",
  "theme": "La démarche philosophique : questionner et argumenter (Terminale)",
  "niveau": "Terminale",
  "titre": "La démarche philosophique : questionner et argumenter",
  "cours": "<div class=\"cours-head\"><h2>La démarche philosophique : questionner et argumenter</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'étonnement et la question philosophique</h3>\n<p>La philosophie naît de l'<b>étonnement</b> devant ce qui semble évident (Platon, Aristote) : « qu'est-ce que la justice ? », « ai-je un corps ou suis-je un corps ? ». Une question philosophique a trois caractères :</p>\n<ul>\n<li>elle est <b>ouverte</b> : pas de réponse par oui/non ;</li>\n<li>elle est <b>conceptuelle</b> : elle interroge les notions (liberté, vérité, justice) ;</li>\n<li>elle est <b>normative</b> : elle cherche ce qui <i>doit</i> être, pas seulement ce qui est.</li>\n</ul>\n<div class=\"tip\"><b>Philosophie ≠ opinion :</b> une opinion se subit ; une thèse philosophique se <b>construit</b> et se <b>discute</b>. « Je pense que… » n'est pas un argument.</div>\n\n<h3>2. Argumenter : thèse, arguments, objections</h3>\n<p>Une argumentation philosophique comporte quatre éléments :</p>\n<ol>\n<li>une <b>thèse</b> : une position clairement énoncée ;</li>\n<li>des <b>arguments</b> : les raisons qui la soutiennent ;</li>\n<li>des <b>exemples</b> : des situations concrètes qui l'illustrent ;</li>\n<li>la discussion des <b>objections</b> : la thèse adverse, prise au sérieux puis discutée.</li>\n</ol>\n<p>Les grands types d'arguments :</p>\n<ul>\n<li>la <b>déduction</b> : du général au particulier ;</li>\n<li>l'<b>induction</b> : l'accumulation de cas ;</li>\n<li>l'<b>analogie</b> : le raisonnement par comparaison ;</li>\n<li>la <b>réduction par l'absurde</b> : montrer que la thèse adverse aboutit à une conséquence absurde (Descartes, Kant).</li>\n</ul>\n\n<h3>3. De la question au problème</h3>\n<p>Une question devient philosophique quand elle révèle une <b>tension</b> : deux principes valables qui s'opposent (le devoir de vérité contre le devoir d'humanité, la liberté contre l'égalité). Sans tension, pas de problème — et pas de philosophie. C'est ce qu'on appelle la <b>problématisation</b>.</p>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — transformer une question en problématique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sujet : « Faut-il toujours dire la vérité ? » Construire la problématique.</div><div class=\"etu\"><b>Étape 1 — Définir</b> : « vérité » (adéquation du discours au réel ? sincérité ?) ; « toujours » (y compris quand cela blesse, quand cela met en danger ?) ; « faut-il » (morale, prudence, droit ?).</div><div class=\"etu\"><b>Étape 2 — Trouver la tension</b> : la morale exige la sincérité MAIS la vérité peut détruire (cruauté, trahison) : devoir de vérité contre devoir de bonté.</div><div class=\"etu\"><b>Étape 3 — Problématiser</b> : « La sincérité est-elle un absolu moral, ou le mensonge par humanité est-il parfois juste ? » La question devient un conflit de principes.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : c'est la marque du sujet philosophique : sans tension, pas de problème, pas de philosophie.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — construire un raisonnement par l'absurde</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Thèse : « nos sensations nous trompent toujours. » Discuter par l'absurde.</div><div class=\"etu\"><b>Étape 1 — Assumer la thèse adverse</b> : si toutes les sensations trompent, alors le monde n'existe pas comme je le perçois, et même ma douleur est douteuse.</div><div class=\"etu\"><b>Étape 2 — Contraindre la conséquence</b> : or fuir le feu, éviter le précipice : la sensation de douleur guide la survie ; s'y fier n'est pas absurde (Descartes distingue la sensation « en tant qu'elle rapporte » le vrai).</div><div class=\"etu\"><b>Étape 3 — Conclure nuancé</b> : les sensations sont globalement fiables pour la vie pratique, mais trompeuses pour juger de la réalité ultime (le bâton brisé dans l'eau) : la thèse absolue tombe, une nuance la remplace.</div><div class=\"etu\"><b>Étape 4 — Retenir le mouvement</b> : renforcer une thèse en affaiblissant l'absolu de l'adverse : c'est le schéma type de la discussion philosophique.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>l'opinion (« je pense que ») n'est pas un argument ;</li>\n<li>l'argument d'autorité (« Kant l'a dit ») doit être accompagné d'une <b>raison</b> ;</li>\n<li>l'exemple ne <b>prouve</b> pas une thèse universelle : il l'illustre ;</li>\n<li>les questions de fait (« combien ? ») ne sont pas philosophiques : la question philosophique est une question de <b>droit</b> (que faut-il ? que devons-nous ?).</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('verite')\">Cours suivant<span class=\"nc-t\"> : La vérité : la chercher, la dire</span> →</a></div>"

  "cours": "<div class=\"cours-head\"><h2>La vérité : la chercher, la dire</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce que le vrai ?</h3>\n<p><b>Définition classique</b> : <i>veritas est adaequatio rei et intellectus</i> — la vérité est l'adéquation de la chose et de l'esprit (Thomas d'Aquin) : est vrai ce qui <b>est</b> comme le dit mon jugement. Autres critères du vrai :</p>\n<ul>\n<li>la <b>cohérence</b> : la non-contradiction interne ;</li>\n<li>l'<b>utilité</b> : le pragmatisme — le vrai est ce qui réussit ;</li>\n<li>l'<b>évidence</b> : Descartes — l'idée claire et distincte.</li>\n</ul>\n<table>\n<tr><th>Notions</th><th>Distinguer</th></tr>\n<tr><td>Vérité matérielle / formelle</td><td>les faits / la validité du raisonnement</td></tr>\n<tr><td>Vérité / sincérité</td><td>dire le vrai / dire ce qu'on croit vrai</td></tr>\n<tr><td>Vérité / certitude</td><td>être dans le vrai / croire être dans le vrai</td></tr>\n</table>\n\n<h3>2. Peut-on dire toute la vérité ? Mensonge et doute</h3>\n<ul>\n<li><b>Kant</b> : le mensonge est toujours immoral — universalisé, il détruit la parole (plus personne ne croit personne) ;</li>\n<li><b>Benjamin Constant</b> : le « mensonge par humanité » (cacher un fugitif au meurtrier qui le cherche) est le devoir réel : la vérité n'est pas due au mal ;</li>\n<li><b>Nietzsche</b> : la « vérité » est une « armée de métaphores » : des conventions utiles ; nous ne possédons pas la vérité nue ;</li>\n<li><b>le relativisme</b> (« chacun sa vérité ») se réfute lui-même : affirmer le relativisme comme vrai, c'est postuler une vérité absolue (Platon contre Protagoras).</li>\n</ul>\n<div class=\"tip\"><b>Le doute n'est pas le nihilisme :</b> douter est l'hygiène de la vérité (Descartes : douter pour trouver l'indubitable), pas la destruction de toute vérité.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — tester l'adéquation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « La Terre tourne autour du Soleil. » « 2 + 2 = 4. » « Mentir est mal. » Trois vérités de même type ?</div><div class=\"etu\"><b>Étape 1 — Premier énoncé</b> : vérité <b>factuelle</b> : adéquation au réel, vérifiable (observation, calculs : Kepler) : elle dépend du monde.</div><div class=\"etu\"><b>Étape 2 — Deuxième</b> : vérité <b>formelle</b> : pure cohérence interne des définitions : indépendante du monde, nécessaire.</div><div class=\"etu\"><b>Étape 3 — Troisième</b> : proposition <b>normative</b> (un jugement de valeur) : ni fait ni cohérence : elle se discute.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : distinguer ces trois plans évite le sophisme qui fait passer une norme pour un fait : c'est la base de la rigueur philosophique.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le dilemme du mensonge humanitaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un ami, condamné médicalement, me demande : « je vais guérir ? ». Dois-je dire toute la vérité ?</div><div class=\"etu\"><b>Étape 1 — Pour Kant</b> : la véracité est un devoir inconditionnel : mentir, même par bonté, corrompt le lien social.</div><div class=\"etu\"><b>Étape 2 — Contre</b> : la vérité n'est pas seulement dite : elle est <b>reçue</b> ; la sincérité absolue ignore la vulnérabilité du destinataire.</div><div class=\"etu\"><b>Étape 3 — Dépassement</b> : distinguer mentir (affirmer le faux) et taire / modérer : la franchise brutale n'est pas la vérité, c'est parfois de la violence.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la parole humaine a plusieurs devoirs (vérité, humanité) : la sagesse les hiérarchise selon la situation.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>ne pas confondre « vrai » (le jugement), « réel » (le monde) et « vécu » (l'expérience) ;</li>\n<li>l'opinion n'est ni vraie ni fausse tant qu'elle n'est pas <b>argumentée</b> ;</li>\n<li>le fait (ce qui est) ne fonde pas la norme (ce qui doit être) ;</li>\n<li>le doute n'est pas le nihilisme : c'est l'hygiène de la vérité.</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('science')\">Cours suivant<span class=\"nc-t\"> : La science et la raison</span> →</a></div>"

  "cours": "<div class=\"cours-head\"><h2>La science et la raison</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce qu'une science ?</h3>\n<p>Une science est un savoir <b>organisé</b> : des <b>objets</b> définis (la matière, le vivant), une <b>méthode</b> (observation, hypothèse, expérimentation, loi), un <b>critère</b> de scientificité :</p>\n<ul>\n<li><b>Claude Bernard</b> : la méthode expérimentale — observation → hypothèse → expérience contradictoire → loi ;</li>\n<li><b>Popper</b> : une théorie est scientifique si elle est <b>falsifiable</b> (réfutable) : l'astrologie, irréfutable par principe, n'est pas scientifique ;</li>\n<li>une loi scientifique est <b>générale et nécessaire</b> : elle vaut partout et toujours (dans les limites du modèle).</li>\n</ul>\n\n<h3>2. Les limites de la science</h3>\n<ul>\n<li>la science répond à « comment ça marche ? », pas à « que dois-je faire ? » (Hume : pas de norme déduite du fait) ;</li>\n<li><b>Kant</b> : la connaissance scientifique s'arrête aux <b>phénomènes</b> ; la chose en soi (liberté, Dieu) échappe à la science et relève de la raison pratique (morale) ;</li>\n<li><b>technoscience</b> : le savoir donne du pouvoir (bombes, biotechnologies) : la question éthique surgit après — et parfois avant (principe de précaution) ;</li>\n<li><b>la science se dit, la technique se décide.</b></li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Cycle expérimental\">\n<rect x=\"20\" y=\"30\" width=\"90\" height=\"40\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/><text x=\"65\" y=\"55\" font-size=\"10\" fill=\"#4f46e5\" text-anchor=\"middle\">Observation</text>\n<rect x=\"140\" y=\"30\" width=\"90\" height=\"40\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/><text x=\"185\" y=\"55\" font-size=\"10\" fill=\"#4f46e5\" text-anchor=\"middle\">Hypothèse</text>\n<rect x=\"260\" y=\"30\" width=\"90\" height=\"40\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/><text x=\"305\" y=\"55\" font-size=\"10\" fill=\"#4f46e5\" text-anchor=\"middle\">Expérience</text>\n<rect x=\"260\" y=\"100\" width=\"90\" height=\"40\" rx=\"8\" fill=\"#c7d2fe\" stroke=\"#4f46e5\"/><text x=\"305\" y=\"125\" font-size=\"10\" fill=\"#312e81\" text-anchor=\"middle\">Loi</text>\n<line x1=\"110\" y1=\"50\" x2=\"140\" y2=\"50\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/><polygon points=\"140,50 133,46 133,54\" fill=\"#4f46e5\"/>\n<line x1=\"230\" y1=\"50\" x2=\"260\" y2=\"50\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/><polygon points=\"260,50 253,46 253,54\" fill=\"#4f46e5\"/>\n<line x1=\"305\" y1=\"70\" x2=\"305\" y2=\"100\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/><polygon points=\"305,100 301,93 309,93\" fill=\"#4f46e5\"/>\n<text x=\"220\" y=\"140\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">le cycle expérimental (Claude Bernard) : une loi reste soumise à réfutation (Popper)</text>\n</svg><span class=\"fig-cap\">La méthode expérimentale : l'expérience « contradictoire » teste l'hypothèse ; la loi qui en sort n'est jamais définitive — elle est corroborée, pas prouvée.</span></div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la falsifiabilité en action</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Tous les cygnes sont blancs. » Pourquoi Popper dit-il que cette proposition est scientifique ? Et pourquoi l'astrologie ne l'est-elle pas ?</div><div class=\"etu\"><b>Étape 1 — Cygnes</b> : la proposition exclut quelque chose (un cygne noir la réfuterait) : elle peut être testée ; un cygne noir a été observé (Australie) : la proposition est tombée — c'est précisément sa scientificité (être réfutable, même réfutée).</div><div class=\"etu\"><b>Étape 2 — Astrologie</b> : si la prédiction échoue, c'est « l'interprétation » qui était fausse, jamais la doctrine : le système explique tout et son contraire : irréfutable = non scientifique.</div><div class=\"etu\"><b>Étape 3 — Le critère inversé</b> : la scientificité n'est pas la vérité (une théorie fausse peut être scientifique : le phlogistique) : c'est la possibilité d'être contredite.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : une science qui ne risque rien ne sait rien : le risque logique fait la valeur scientifique.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la révolution copernicienne comme rupture</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi parle-t-on de « révolution scientifique » pour Copernic-Galilée ? Qu'est-ce qui change dans la rationalité ?</div><div class=\"etu\"><b>Étape 1 — Le contenu</b> : la Terre quitte le centre (héliocentrisme) : les apparences (le Soleil « se lève ») sont sauvées par un modèle mathématique.</div><div class=\"etu\"><b>Étape 2 — La méthode</b> : la vérité ne se lit plus dans l'autorité (Aristote, Écriture interprétée littéralement) ni dans l'évidence sensible : elle se construit par le calcul et l'observation instrumentée (la lunette de Galilée).</div><div class=\"etu\"><b>Étape 3 — Le statut de la théorie</b> : un modèle n'est pas une « image » du réel : une construction contraignante (prédictions vérifiées) et provisoire (Kuhn : les « paradigmes » se remplacent ; Einstein ne « corrige » pas Newton, il le relativise).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la science vit de ses révolutions internes : c'est sa force et son humilité.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>le <b>scientisme</b> (« la science suffit à tout dire ») est une position philosophique contestable, pas un énoncé scientifique ;</li>\n<li>une théorie scientifique n'est jamais « prouvée » absolument : elle est <b>corroborée</b> ;</li>\n<li>ne pas confondre <b>loi</b> (toujours vraie dans un modèle : Kepler) et <b>théorie</b> (structure explicative large : la relativité) ;</li>\n<li>falsifiable ne veut pas dire « fausse » : cela veut dire « réfutable en principe ».</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('conscience')\">Cours suivant<span class=\"nc-t\"> : La conscience et l'inconscient</span> →</a></div>"

  "cours": "<div class=\"cours-head\"><h2>La conscience et l'inconscient</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La conscience : présence à soi et prise de conscience</h3>\n<p>La <b>conscience</b> a deux sens à distinguer :</p>\n<ul>\n<li>la conscience <b>spontanée</b> : le compagnon immédiat de mes vécus (sentir que je sens : le cogito de Descartes) ;</li>\n<li>la conscience <b>réfléchie</b> : le retour sur soi, l'effort pour se connaître.</li>\n</ul>\n<p>La conscience fait la <b>dignité</b> (Kant : l'humanité comme fin en soi) et le <b>tourment</b> (Pascal : « l'homme est un roseau pensant » : savoir qu'on mourra).</p>\n\n<h3>2. L'inconscient : l'hypothèse Freud</h3>\n<ul>\n<li><b>Freud</b> : le psychisme n'est pas réductible à la conscience : il existe un <b>inconscient</b> (le refoulé : désirs, souvenirs inadmissibles) qui <b>agit</b> : lapsus, rêves, actes manqués, symptômes ;</li>\n<li>« Le moi n'est pas maître dans sa propre maison » ;</li>\n<li>structure du psychisme : <b>ça</b> (pulsions), <b>surmoi</b> (interdits intériorisés), <b>moi</b> (arbitre) ;</li>\n<li><b>objections</b> : l'inconscient freudien est-il scientifique (falsifiable ? Popper doute) ; la conscience reste le lieu de la responsabilité (la cure ramène à la conscience).</li>\n</ul>\n<table>\n<tr><th>Manifestation</th><th>Ce que Freud y lit</th></tr>\n<tr><td>lapsus</td><td>formation de compromis : le refoulé passe sous couvert de l'erreur</td></tr>\n<tr><td>rêve</td><td>accomplissement (déguisé) d'un désir</td></tr>\n<tr><td>acte manqué</td><td>intention refoulée qui détourne l'action</td></tr>\n<tr><td>symptôme</td><td>message chiffré d'un conflit psychique</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — conscience spontanée et réfléchie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Je marche en réfléchissant à un problème : où est ma conscience ?</div><div class=\"etu\"><b>Étape 1 — Spontanée</b> : j'ai conscience de marcher (sinon je tomberais) sans y penser : la conscience accompagne sans déployer.</div><div class=\"etu\"><b>Étape 2 — Réfléchie</b> : si je trébuche, je deviens conscient que je marchais en pensant à autre chose : le retour sur soi éclaire a posteriori.</div><div class=\"etu\"><b>Étape 3 — Portée</b> : la conscience n'est pas un « plein » permanent : elle est attentive, variable — et elle n'est pas tout le psychisme (réflexes, habitudes, désirs fonctionnent sans elle).</div><div class=\"etu\"><b>Étape 4 — Ouvrir</b> : peut-il y avoir du psychique sans conscience ? C'est la question de l'inconscient.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire un lapsus</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un orateur ouvre un discours officiel par « Mesdames, messieurs… je suis heureux de déclarer close la séance ». Simple erreur ?</div><div class=\"etu\"><b>Étape 1 — Le phénomène</b> : l'erreur n'est pas aléatoire : « close » est le mot de la fin de séance : le désir (en finir) s'exprime à l'insu du locuteur.</div><div class=\"etu\"><b>Étape 2 — L'interprétation freudienne</b> : le lapsus est une formation de compromis : le refoulé passe sous couvert de l'erreur « innocente » : le sens n'est pas caché derrière, il est dans le raté.</div><div class=\"etu\"><b>Étape 3 — La discussion</b> : l'interprétation est-elle probante ou seulement « convenable » ? Le risque : une lecture qui explique tout (donc ne risque rien : Popper).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la psychanalyse exige le consentement de l'analysé (le sens doit résonner pour lui) : c'est une lecture du sens, pas une loi expérimentale.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>l'inconscient freudien n'est pas le « subconscient » banal (automatismes) : c'est un <b>refoulé actif</b> ;</li>\n<li>avoir conscience n'est pas se connaître : l'introspection trompe (les rationalisations) ;</li>\n<li>la conscience reste le tribunal de la responsabilité : l'inconscient <b>explique</b>, il n'excuse pas tout.</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('liberte')\">Cours suivant<span class=\"nc-t\"> : La liberté : choisir et agir</span> →</a></div>"

  "cours": "<div class=\"cours-head\"><h2>La liberté : choisir et agir</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce que la liberté ? Trois sens à distinguer d'emblée</h3>\n<p>Le mot « liberté » paraît simple, mais il recouvre des réalités différentes selon que l'on parle d'un acte, d'un statut ou d'une situation. Distinguer ces sens est le premier réflexe philosophique du chapitre :</p>\n<table>\n<tr><th>Sens</th><th>Définition</th><th>Exemple</th><th>Discipline concernée</th></tr>\n<tr><td><b>Libre-arbitre</b></td><td>la capacité de choisir par soi-même, sans y être déterminé (ou contraint)</td><td>je peux choisir mes études, mes amis</td><td>métaphysique, psychologie</td></tr>\n<tr><td><b>Liberté d'action</b></td><td>le fait de pouvoir faire ce que l'on a décidé, sans obstacle extérieur</td><td>circuler, s'exprimer, voter</td><td>politique, droit</td></tr>\n<tr><td><b>Liberté civile/politique</b></td><td>un statut juridique : ne pas être esclave, être reconnu comme citoyen</td><td>l'abolition de l'esclavage (1848), les droits civiques</td><td>politique, droit</td></tr>\n</table>\n<div class=\"tip\"><b>Définition possible au baccalauréat :</b> être libre, c'est être cause de ses propres actes — pouvoir faire ce que l'on veut (absence de contrainte extérieure), et vouloir ce que l'on fait (absence de contrainte intérieure : passions, conditionnement, ignorance).</div>\n\n<h3>2. Première difficulté : suis-je vraiment libre ? (le problème du déterminisme)</h3>\n<p>Une action semble libre quand elle aurait pu ne pas être : j'aurais pu choisir autrement. Mais tout dans l'univers obéit à des causes — et moi aussi : mon éducation, mes gènes, mon entourage, mes émotions… Si tout est déterminé, ma « liberté » n'est-elle pas une <b>illusion</b> ?</p>\n<ul>\n<li><b>Le déterminisme</b> : chaque événement a des causes ; mes « choix » sont les effets de causes qui me précèdent et me dépassent. Un joueur « choisit » de rejouer : est-ce un choix ?</li>\n<li><b>Spinoza</b> pousse le paradoxe : « Les hommes se croient libres parce qu'ils sont conscients de leurs actions et ignorants des causes qui les déterminent. » La liberté vécue serait un aveuglement sur nos causes.</li>\n<li><b>La riposte de Descartes</b> : même si des influences pèsent, le doute et la conscience me permettent de suspendre mon jugement et de dire non. S'il y a un acte indubitablement nôtre, c'est le jugement : je peux toujours ne pas affirmer ce que je ne connais pas clairement.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — construire un paragraphe sur le libre-arbitre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Mes choix sont-ils vraiment les miens ? » Rédiger un paragraphe argumenté mobilisant au moins deux auteurs.</div><div class=\"etu\"><b>Étape 1 — Problématiser</b> : si mes actes ont des causes (éducation, désirs, cerveau), en quel sens puis-je encore dire que je « choisis » ?</div><div class=\"etu\"><b>Étape 2 — Thèse déterministe (Spinoza)</b> : je me crois libre parce que j'ignore les causes qui me déterminent ; la conscience ne suffit pas à prouver la liberté.</div><div class=\"etu\"><b>Étape 3 — Objection (Descartes, Sartre)</b> : l'homme est le seul être qui peut dire non, suspendre son jugement, prendre distance avec ses penchants. Pour Sartre, nous sommes « condamnés à être libres » : même ne pas choisir, c'est encore choisir.</div><div class=\"etu\"><b>Étape 4 — Nuancer</b> : la liberté n'est peut-être pas un donné mais une conquête : s'informer, se connaître, délibérer — c'est se rendre plus libre qu'hier. <b>Transition</b> : mais être libre de faire suffit-il ? Ne faut-il pas aussi être libre de vouloir ?</div></div></details>\n\n<h3>3. Deuxième difficulté : liberté et passions (l'esclavage intérieur)</h3>\n<p>Être sans contrainte extérieure ne suffit pas : je peux être l'esclave de mes propres désirs.</p>\n<ul>\n<li><b>Platon</b> : l'âme est comparable à un char tiré par deux chevaux (le courage et les appétits) et mené par un cocher (la raison). Si les appétits prennent les rênes, je suis intérieurement tyrannisé — le despote est en moi.</li>\n<li><b>Épictète</b> (stoïcien, ancien esclave) : la liberté ne dépend pas de ce qui m'arrive mais de mon <b>jugement</b> sur ce qui m'arrive. Distinguer ce qui dépend de moi (mes jugements, mes désirs) et ce qui n'en dépend pas (mon corps, ma réputation) : c'est le début de la sagesse.</li>\n<li><b>Le paradoxe de l'addiction</b> : le joueur « fait ce qu'il veut » (jouer) mais ne peut pas vouloir autrement : il illustre la différence entre « faire ce que l'on veut » et « vouloir ce que l'on fait ».</li>\n</ul>\n<div class=\"formule\"><b>Idée-force :</b> se vouloir libre, c'est apprendre à désirer selon sa raison — non par élimination de tout désir, mais par hiérarchie des désirs.</div>\n\n<h3>4. Troisième difficulté : ma liberté s'arrête-t-elle où commence celle des autres ?</h3>\n<p>La liberté ne se pense pas seulement en solitaire : vivre avec les autres pose une limite — mais peut-être aussi une condition — à ma liberté.</p>\n<ul>\n<li><b>La formule juridique classique</b> : « La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui » (Déclaration de 1789, article 4). Ma liberté est limitée par celle d'autrui.</li>\n<li><b>La réponse de Rousseau</b> : la liberté civile n'est pas une restriction de la liberté naturelle mais son <b>accomplissement</b> : en obéissant à la loi que je me suis donnée (la volonté générale), je n'obéis qu'à moi-même. L'obéissance à la loi commune est alors le plus haut degré de liberté.</li>\n<li><b>Kant</b> : la vraie liberté n'est pas faire n'importe quoi, mais agir selon une loi que je me donne moi-même en tant qu'être raisonnable (l'autonomie) — se donner sa propre loi est plus libre que suivre ses penchants (l'hétéronomie).</li>\n<li><b>Le contrepoint de Mill</b> : dans une société libre, la seule raison légitime de me limiter est d'empêcher que je nuise à autrui — pas de me « forcer à être heureux » selon la conception du bonheur des autres.</li>\n</ul>\n<table>\n<tr><th>Auteur</th><th>Idée-clé sur la liberté</th><th>Formule à retenir</th></tr>\n<tr><td>Descartes</td><td>le libre-arbitre se manifeste dans le jugement</td><td>« la liberté se connaît sans preuve, par la seule expérience »</td></tr>\n<tr><td>Spinoza</td><td>illusion de la liberté vécue ; comprendre les causes</td><td>« les hommes se croient libres parce qu'ils ignorent les causes »</td></tr>\n<tr><td>Rousseau</td><td>obéir à la loi qu'on s'est prescrite, c'est être libre</td><td>« l'obéissance à la loi qu'on s'est prescrite est liberté »</td></tr>\n<tr><td>Kant</td><td>autonomie = se donner sa propre loi rationnelle</td><td>« le premier principe de la liberté est l'autonomie de la volonté »</td></tr>\n<tr><td>Sartre</td><td>l'homme est entièrement libre, donc responsable</td><td>« l'homme est condamné à être libre »</td></tr>\n<tr><td>Épictète</td><td>liberté intérieure par maîtrise des jugements</td><td>« il y a ce qui dépend de nous, ce qui ne dépend pas de nous »</td></tr>\n</table>\n\n<h3>5. Méthode : rédiger une dissertation sur la liberté</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — de la question au plan (fiche méthode)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sujet type : « Suis-je d'autant plus libre que je suis seul maître de mes choix ? » Construire le plan détaillé.</div><div class=\"etu\"><b>Étape 1 — Analyser le sujet</b> : repérer les présupposés — « seul maître » suppose que la liberté exclut toute influence extérieure ; « d'autant plus » invite à graduer. Le sujet interroge la définition <b>individuelle</b> de la liberté.</div><div class=\"etu\"><b>Étape 2 — Problématiser</b> : plus d'indépendance = plus de liberté ? Mais l'homme solitaire est-il plus libre ou plus exposé (peur, besoin, ignorance) ? Et si certaines « dépendances » (lois, éducation) augmentaient au contraire ma liberté effective ?</div><div class=\"etu\"><b>Étape 3 — Plan en trois moments</b> : ① Oui, être maître de soi est le cœur de la liberté (Descartes, libre-arbitre) ; ② Mais la solitude ne libère pas : sans lois ni éducation, ma liberté reste formelle (Rousseau : la société civile la rend réelle ; Mill : ses limites) ; ③ Synthèse : la liberté comme conquête de soi dans et par les liens — autonomie, non indépendance (Kant).</div><div class=\"etu\"><b>Étape 4 — Rédiger l'intro</b> : accroche (exemple concret : choisir ses études sous l'influence des parents) ; définition des termes ; problématique ; annonce du plan.</div></div></details>\n\n<h3>6. Le concept en une image : la pyramide de la liberté</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 430 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Pyramide de la liberte\">\n  <polygon points=\"215,20 285,70 145,70\" fill=\"#eef2ff\" stroke=\"#6366f1\"/>\n  <text x=\"215\" y=\"55\" font-size=\"10.5\" fill=\"#4f46e5\" text-anchor=\"middle\">Libert&#233; int&#233;rieure</text>\n  <text x=\"215\" y=\"68\" font-size=\"8.5\" fill=\"#64748b\" text-anchor=\"middle\">(ma&#238;trise de soi, autonomie)</text>\n  <polygon points=\"135,75 295,75 315,125 115,125\" fill=\"#f5f3ff\" stroke=\"#7c3aed\"/>\n  <text x=\"215\" y=\"100\" font-size=\"10.5\" fill=\"#7c3aed\" text-anchor=\"middle\">Libert&#233; d&#8217;action</text>\n  <text x=\"215\" y=\"113\" font-size=\"8.5\" fill=\"#64748b\" text-anchor=\"middle\">(absence de contrainte ext&#233;rieure)</text>\n  <rect x=\"105\" y=\"130\" width=\"220\" height=\"45\" rx=\"8\" fill=\"#fef3c7\" stroke=\"#f59e0b\"/>\n  <text x=\"215\" y=\"150\" font-size=\"10.5\" fill=\"#b45309\" text-anchor=\"middle\">Libert&#233; civile et politique</text>\n  <text x=\"215\" y=\"164\" font-size=\"8.5\" fill=\"#64748b\" text-anchor=\"middle\">(droits, lois, &#233;galit&#233; devant la loi)</text>\n  <text x=\"215\" y=\"184\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">Chaque &#233;tage conditionne celui du dessus : sans droits, pas d&#8217;action ; sans action possible, la ma&#238;trise de soi reste th&#233;orique.</text>\n</svg><span class=\"fig-cap\">Les trois étages de la liberté : la liberté politique (fondation), la liberté d'action (mise en œuvre), la liberté intérieure (sommet). Un sujet de dissertation peut consister à interroger les relations entre ces étages.</span></div>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Ne pas confondre <b>liberté</b> et <b>libertinage / licence</b> : faire tout ce qui me passe par la tête n'est pas la liberté (esclavage des désirs).</li>\n<li>Ne pas traiter la question uniquement en droit (« en France on a le droit de… ») : la dissertation exige un traitement <b>conceptuel</b> (le libre-arbitre, le déterminisme).</li>\n<li>Citer les auteurs avec précision : Spinoza ne « nie pas » la liberté, il en propose une autre définition (comprendre la nécessité) ; Rousseau ne dit pas que toute loi limite la liberté, mais que la bonne loi l'accomplit.</li>\n<li>« Être libre, c'est n'avoir aucune contrainte » : faux pour Kant et Rousseau — se donner une loi peut être l'acte le plus libre.</li>\n<li>Distinguer liberté <b>de</b> (faire, dire, penser) et liberté <b>face à</b> (la peur, l'ignorance, la nécessité) dans vos analyses.</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('morale')\">Cours suivant<span class=\"nc-t\"> : La morale et la justice : fondement et obligation</span> →</a></div>"

  "cours": "<div class=\"cours-head\"><h2>La morale et la justice : fondement et obligation</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La morale : d'où viennent les règles ?</h3>\n<p>La <b>morale</b> (les règles intérieures du bien) et la <b>justice</b> (les règles sociales, institutionnelles : le droit) ne se fondent pas de la même façon. Trois familles de fondements :</p>\n<ol>\n<li><b>le devoir</b> — Kant : la morale est la forme de la loi universelle ; impératif catégorique : « agis comme si la maxime de ton action devait être érigée en loi universelle » ;</li>\n<li><b>les conséquences</b> — l'utilitarisme (Bentham, Mill) : est bien ce qui maximise le bien-être du plus grand nombre ;</li>\n<li><b>les vertus</b> — Aristote : la morale est l'excellence du caractère (le courage, la justice), apprise par l'habitude.</li>\n</ol>\n\n<h3>2. La justice : le droit, l'égalité, la punition</h3>\n<ul>\n<li><b>justice</b> : rendre à chacun son dû (Aristote) — distributive (répartir les biens selon un critère : mérite, besoin, égalité) ou commutative (l'égalité des échanges) ;</li>\n<li><b>Rawls</b> : le voile d'ignorance — les règles justes sont celles que choisirait quelqu'un qui ignore sa place dans la société ;</li>\n<li><b>punir</b> : trois logiques — rétribution (le châtiment rend la justice : Kant), dissuasion (l'efficacité : Bentham), réhabilitation (réinsérer socialement).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — trois morales jugent le même cas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un médecin peut mentir à un patient mourant « pour son bien ». Juger selon les trois morales.</div><div class=\"etu\"><b>Étape 1 — Déontologique (Kant)</b> : mentir est interdit par la forme universelle (la véracité est un devoir inconditionnel) : on juge par l'intention conforme au devoir : le mensonge reste interdit, même « charitable ».</div><div class=\"etu\"><b>Étape 2 — Conséquentialiste (utilitarisme)</b> : calculer les effets (le désespoir affaiblit ? l'espoir prolonge ?) : on juge par les résultats : le mensonge peut être moral s'il maximise le bien-être global.</div><div class=\"etu\"><b>Étape 3 — Éthique des vertus (Aristote)</b> : que ferait le sage (le médecin excellent) ? Il adapte (la sagesse pratique : la mesure juste au moment juste).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : trois morales, trois jugements : la dissertation les fait dialoguer.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le voile d'ignorance de Rawls</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Faut-il autoriser une école privée d'élite financée par les riches ? Test avec le voile d'ignorance.</div><div class=\"etu\"><b>Étape 1 — La position originelle</b> : imaginez que vous ne savez pas si vous naîtrez riche ou pauvre, doué ou non : quelles règles d'école choisiriez-vous ?</div><div class=\"etu\"><b>Étape 2 — Le choix rationnel</b> : prudents, nous choisirions une école de base excellente pour tous, et des inégalités d'élite tolérées seulement si elles profitent aux plus défavorisés.</div><div class=\"etu\"><b>Étape 3 — Le critère</b> : une société juste n'est pas nécessairement égale : elle est arrangée pour que les inégalités servent les plus bas (le « principe de différence »).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : un critère formel qui ne dit pas « égalité absolue » mais « bénéfice minimal pour les plus fragiles » : parfait pour un sujet sur la justice sociale.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>le droit peut être <b>immoral</b> (lois injustes : la désobéissance civile — Thoreau, Gandhi, King) ;</li>\n<li>la morale ne se déduit pas des faits (Hume) ;</li>\n<li>l'égalité a plusieurs sens : devant la loi ≠ égalité des conditions ; distinguer égalité formelle et équité ;</li>\n<li>légal (conforme au droit) ≠ légitime (justifié moralement).</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('bonheur')\">Cours suivant<span class=\"nc-t\"> : Le bonheur : bien vivre et plaisir</span> →</a></div>"

  "cours": "<div class=\"cours-head\"><h2>Le bonheur : bien vivre et plaisir</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Plaisir, bonheur, joie : distinguer</h3>\n<ul>\n<li>le <b>plaisir</b> : la satisfaction immédiate d'un désir (ponctuel, passif) ;</li>\n<li>le <b>bonheur</b> : un état durable de satisfaction globale (Épicure : l'ataraxie, l'absence de trouble : « le bonheur est le souverain bien ») ;</li>\n<li>la <b>joie</b> (Spinoza) : l'augmentation de notre puissance d'agir (active, pas subie).</li>\n</ul>\n<div class=\"tip\"><b>Le plaisir est un ingrédient possible du bonheur, pas le bonheur lui-même :</b> l'hédonisme exclusif rate la durée (le « vernis des plaisirs s'écaille »).</div>\n\n<h3>2. Le bonheur peut-il être une fin directe ?</h3>\n<ul>\n<li><b>le paradoxe</b> : le bonheur fuit quand on le poursuit directement — il est un sous-produit (Mill : « ceux seulement sont heureux qui ont un objet qui les absorbe ») ;</li>\n<li><b>Kant</b> : le bonheur est un idéal de l'imagination (chacun le veut sans savoir ce que c'est) : la morale doit viser le devoir, pas le bonheur (être <b>digne</b> du bonheur) ;</li>\n<li><b>les stoïciens</b> : viser la vertu (ce qui dépend de nous) : le bonheur suit ;</li>\n<li><b>l'eudémonisme</b> (Aristote) : le bonheur est l'activité de l'âme conforme à la vertu.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le hédonisme en excès</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Mangeons et buvons, car demain nous mourrons » : le plaisir est-il la clef du bonheur ?</div><div class=\"etu\"><b>Étape 1 — Le pari hédoniste</b> : la vie est brève : maximiser les plaisirs (Calliclès, dans le Gorgias de Platon : « laisser croître ses désirs »).</div><div class=\"etu\"><b>Étape 2 — L'objection</b> : les plaisirs intempérants engendrent leurs douleurs (la gueule de bois, la dette, la maladie) ; et l'insatiabilité rend esclave : toujours plus, jamais assez.</div><div class=\"etu\"><b>Étape 3 — La réponse épicurienne</b> : calculer ! (la lettre à Ménécée) : préférer un plaisir stable à un plaisir intense mais ruineux ; le Jardin : l'amitié, la tranquillité, les désirs naturels et nécessaires.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : le bonheur est une économie du désir, pas une explosion : c'est déjà presque la sagesse stoïcienne.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le paradoxe de Mill</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi ceux qui cherchent le bonheur directement sont-ils souvent malheureux ?</div><div class=\"etu\"><b>Étape 1 — Le regard sur soi</b> : se demander « suis-je heureux ? » en permanence, c'est se surveiller : le bonheur se vit, se vérifie rarement.</div><div class=\"etu\"><b>Étape 2 — La comparaison</b> : viser le bonheur comme une norme (celle des autres, des réseaux sociaux) le convertit en anxiété : la jalousie tue la jouissance.</div><div class=\"etu\"><b>Étape 3 — La solution</b> : viser des objets (une œuvre, des liens, un jardin : ce qui nous absorbe) : le bonheur arrive « pendant qu'on regarde ailleurs ».</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : le paradoxe n'interdit pas le bonheur : il réoriente la volonté — ne pas viser l'état, viser les actes qui le produisent.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>confondre plaisir et bonheur (le sujet de bac type) ;</li>\n<li>le bonheur n'est pas un <b>droit</b> : l'État garantit la poursuite, pas le résultat ;</li>\n<li>distinguer bonheur (état subjectif) et félicité (le bonheur parfait : inaccessible ?) ;</li>\n<li>l'illusion du « il me manque quelque chose » : le conditionnel du bonheur (« je serais heureux SI… ») est un piège mental.</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('art')\">Cours suivant<span class=\"nc-t\"> : L'art : créer, interpréter, juger</span> →</a></div>"

  "cours": "<div class=\"cours-head\"><h2>L'art : créer, interpréter, juger</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce que l'art ? Imitation, expression, forme</h3>\n<p>Trois grandes théories de l'art :</p>\n<ol>\n<li><b>l'imitation</b> (la mimésis : Platon, Aristote) : l'art représente le monde. Platon condamne le peintre (copie de copie) ; Aristote valorise la <b>catharsis</b> : la purge des passions par la représentation ;</li>\n<li><b>l'expression</b> : l'art exprime une intériorité (l'âme, l'époque : Van Gogh : « l'art est l'homme ajouté à la nature ») ;</li>\n<li><b>la forme</b> : l'art est une organisation significative (Clive Bell : la « forme signifiante ») : l'art moderne assume l'autonomie de la forme (la non-figuration).</li>\n</ol>\n\n<h3>2. Interpréter et juger : le beau est-il subjectif ?</h3>\n<ul>\n<li><b>Kant</b> : le jugement de goût est subjectif mais prétend à l'universalité — « c'est beau » n'est pas « ça me plaît » : je réclame l'assentiment d'autrui sans pouvoir le prouver ;</li>\n<li><b>Hume</b> : le goût se forme (les normes du chef-d'œuvre : le jugement des experts) ;</li>\n<li><b>Bourdieu</b> : le goût est socialement construit (la « distinction » : l'art légitime est un capital : le goût « naturel » est une illusion sociologique) ;</li>\n<li>le jugement esthétique ne se prouve pas comme une loi : il se <b>discute</b> (la critique).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi un ready-made est de l'art ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Duchamp expose un urinoir signé « R. Mutt » (Fontaine, 1917). Selon quelles théories est-ce de l'art ?</div><div class=\"etu\"><b>Étape 1 — Contre l'imitation</b> : l'urinoir ne représente rien (la mimésis est inapte à le juger) : le ready-made force la question.</div><div class=\"etu\"><b>Étape 2 — Le geste et l'institution</b> : l'art n'est pas dans l'objet (industriel, identique en magasin) mais dans le choix et le contexte (exposé, signé, daté) : la proposition artistique est un geste (Danto : « l'art est ce que le monde de l'art désigne »).</div><div class=\"etu\"><b>Étape 3 — La théorie esthétique en acte</b> : Fontaine questionne l'art (« qu'est-ce qui fait l'art ? ») : l'œuvre moderne peut être sa propre théorie.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : Duchamp ne dit pas « c'est beau » : il dit « voyez comme votre idée d'art est fragile et intéressante » : l'art moderne déplace la question esthétique.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — « c'est beau » : que dis-je ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Devant un coucher de soleil, je dis « c'est beau ». Devant un gâteau, « j'aime ça ». Quelle différence ?</div><div class=\"etu\"><b>Étape 1 — Le gâteau</b> : « j'aime » est un énoncé d'agréable (privé : je ne reproche à personne de préférer la fraise).</div><div class=\"etu\"><b>Étape 2 — Le coucher de soleil</b> : « c'est beau » prétend à l'universel (je suis étonné qu'on ne le trouve pas beau) sans pouvoir le démontrer (pas de concept qui prouve la beauté).</div><div class=\"etu\"><b>Étape 3 — Le paradoxe kantien</b> : le jugement de goût est « subjectif dans son principe, universel dans sa prétention » ; c'est le désintéressement (je ne veux pas posséder le coucher de soleil) qui fonde l'universalité.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la discussion esthétique est possible — et c'est toute la culture (la critique d'art).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« c'est subjectif » n'interdit pas la discussion (Kant : l'universalité sans preuve) ;</li>\n<li>l'art n'est pas que la beauté (le laid expressif : Baudelaire : « la laideur peut être artistique ») ;</li>\n<li>ne pas confondre jugement de goût et jugement de valeur artistique (le chef-d'œuvre n'est pas « ce qui plaît ») ;</li>\n<li>l'imitation (la photo) n'est pas automatiquement de l'art : l'intention et la forme comptent.</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('travail')\">Cours suivant<span class=\"nc-t\"> : Le travail et la technique : contrainte ou réalisation ?</span> →</a></div>"

  "cours": "<div class=\"cours-head\"><h2>Le travail et la technique : contrainte ou réalisation ?</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le travail : punition, nécessité, réalisation de soi</h3>\n<ul>\n<li><b>le mythe</b> : le travail comme punition (la Genèse : « à la sueur de ton front » ; l'âge d'or perdu des Grecs) ;</li>\n<li><b>la nécessité</b> : produire pour vivre — mais travailler n'est pas spécifiquement humain (l'abeille travaille) ;</li>\n<li><b>la spécificité humaine</b> (Hegel, Marx) : le travail transforme le monde ET l'homme : l'outil est une intelligence objectivée ; dans le travail, l'homme se contemple dans ce qu'il a produit.</li>\n</ul>\n<div class=\"tip\"><b>Le travail est ambivalent :</b> aliénation (Marx : le travailleur moderne se perd dans la chaîne) OU réalisation de soi (le travail bien fait : l'artisan, l'œuvre).</div>\n\n<h3>2. Aliénation, division du travail, technique</h3>\n<p><b>Marx</b> : l'aliénation du travailleur moderne a plusieurs visages :</p>\n<ol>\n<li>il ne possède pas son produit ;</li>\n<li>il ne se reconnaît pas dans la tâche parcellisée (la division du travail : Smith, la fabrique d'épingles : productivité ×240, mais l'ouvrier devient « appendice de la machine ») ;</li>\n<li>le travail est subi, pas réalisé.</li>\n</ol>\n<ul>\n<li><b>Arendt</b> distingue : le <b>travail</b> (reproduire la vie), l'<b>œuvre</b> (bâtir le monde durable), l'<b>action</b> (la politique) ;</li>\n<li><b>Heidegger</b> : la technique moderne est un « arrimage » : tout devient stock exploitable (le Rhin devient fournisseur de pression hydraulique) ;</li>\n<li>la question : la technique nous libère-t-elle du travail, ou nous transforme-t-elle en ingénieurs du calcul ?</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la dialectique du maître et de l'esclave</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi, selon Hegel, l'esclave (qui travaille) devient-il plus libre que le maître (qui jouit) ?</div><div class=\"etu\"><b>Étape 1 — Le maître</b> : il fait travailler l'autre pour jouir : il reçoit des objets sans les produire ; sa conscience dépend de la reconnaissance d'un esclave qu'il méprise : sa liberté s'atrophie.</div><div class=\"etu\"><b>Étape 2 — L'esclave</b> : travaillant (contraint, d'abord), il apprivoise la nature (il découvre qu'il peut la transformer) ; dans l'objet produit, il se reconnaît : « c'est moi qui ai fait ça ».</div><div class=\"etu\"><b>Étape 3 — La conclusion</b> : la vraie liberté vient de la formation par le travail (Marx le reprendra) : celui qui paraît soumis devient le sujet de l'histoire.</div><div class=\"etu\"><b>Étape 4 — Retenir</b> : c'est l'argument central de toute dissertation « le travail libère-t-il ? ».</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire l'aliénation aujourd'hui</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un préparateur de commandes scanne des colis 8h/jour, chronométré par un portable. Est-ce du « travail » au sens plein ?</div><div class=\"etu\"><b>Étape 1 — Nécessité, oui</b> : il produit, il est payé, la société fonctionne : le plan de la nécessité est respecté.</div><div class=\"etu\"><b>Étape 2 — Réalisation, non</b> : il ne conçoit rien (le rythme est imposé, le logiciel surveille) ; il ne se reconnaît dans aucun produit : les aliénations de Marx sont là (produit, geste, être générique, autrui).</div><div class=\"etu\"><b>Étape 3 — Les correctifs</b> : rotation des tâches, autonomie d'équipe, sens (soigner, enseigner), travail émotionnel (Hochschild), coopératives, autogestion.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : peut-on organiser le travail pour qu'il reste formation de soi ? C'est le sujet « le travail n'est-il qu'une contrainte ? ».</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>ne pas confondre travail (répétitif : Arendt), œuvre (durable : l'artisanat) et action (politique) ;</li>\n<li>la fin du travail « subi » : libération (Keynes : la semaine de 15 h ?) ou perte de reconnaissance sociale ? ;</li>\n<li>la technique n'est ni neutre ni diabolique : elle dépend des usages (le marteau construit ou frappe).</li>\n</ul>\n</div>\n<div class=\"next-cours\"><a onclick=\"goCours('etat')\">Cours suivant<span class=\"nc-t\"> : L'État et le droit : obéir, gouverner, juger</span> →</a></div>"

 {

  "cours": "<div class=\"cours-head\"><h2>L'État et le droit : obéir, gouverner, juger</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Pourquoi obéir ? L'État et la légitimité</h3>\n<table>\n<tr><th>Penseur</th><th>Thèse</th></tr>\n<tr><td><b>Hobbes</b></td><td>sans État, la « guerre de tous contre tous » : le contrat transfère la force au souverain en échange de la sécurité (le Léviathan, 1651)</td></tr>\n<tr><td><b>Locke</b></td><td>l'État protège les droits naturels (vie, liberté, propriété) ; s'il les viole, le peuple peut le déposer (droit de résistance)</td></tr>\n<tr><td><b>Rousseau</b></td><td>la souveraineté appartient au peuple (la volonté générale) : la loi juste est celle qu'on s'est prescrite</td></tr>\n<tr><td><b>Weber</b></td><td>trois types de domination légitime : traditionnelle, charismatique, légale-rationnelle</td></tr>\n</table>\n<div class=\"tip\"><b>Obéir n'est légitime que si l'autorité l'est :</b> la force fait obéir, seule la légitimité fait que l'obéissance est due.</div>\n\n<h3>2. Gouverner et juger : séparation des pouvoirs, démocratie</h3>\n<ul>\n<li><b>Montesquieu</b> : « tout homme qui a du pouvoir est porté à en abuser » : d'où la séparation des pouvoirs (législatif, exécutif, judiciaire) — « le pouvoir arrête le pouvoir » (De l'esprit des lois, 1748) ;</li>\n<li><b>la démocratie</b> : le peuple souverain (élections, opposition, contestation pacifique) MAIS : risque de la tyrannie de la majorité (Tocqueville : la minorité doit être protégée) ;</li>\n<li>la démocratie est un régime de <b>procédures</b> : la règle de droit, la publicité, les contre-pouvoirs (la presse) ;</li>\n<li><b>juger</b> : l'indépendance de la justice (l'impartialité, la procédure contradictoire) est la condition de l'État de droit.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi payer ses impôts ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'impôt me retire mon argent par la contrainte : pourquoi est-il légitime (et pas un vol) ?</div><div class=\"etu\"><b>Étape 1 — La thèse du vol</b> : « c'est mon argent, l'État le prend par la menace » : l'impôt serait un racket légalisé.</div><div class=\"etu\"><b>Étape 2 — L'argument du contrat</b> : je contribue à un système dont je bénéficie (routes, école, hôpital, sécurité, la monnaie elle-même) : l'impôt est le prix du monde civil (Holmes).</div><div class=\"etu\"><b>Étape 3 — La condition de légitimité</b> : l'impôt est légitime s'il est décidé par les représentants, s'il sert le bien commun, s'il est égal selon les capacités (la progressivité).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la légitimité n'est pas l'efficacité : c'est la justice de la procédure et de l'usage — l'objet du débat démocratique permanent.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le pouvoir arrête le pouvoir</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un président, élu à 60 %, veut réformer les retraites par ordonnance en contournant le Parlement. La majorité électorale suffit-elle à le légitimer ?</div><div class=\"etu\"><b>Étape 1 — L'argument de la majorité</b> : 60 % ont voté pour lui : un mandat est un pouvoir de gouverner.</div><div class=\"etu\"><b>Étape 2 — L'objection institutionnelle</b> : l'élection donne une compétence bornée : contourner le Parlement, c'est dissoudre la délibération : la loi n'est plus discutée, mais décrétée.</div><div class=\"etu\"><b>Étape 3 — La balance</b> : les contre-pouvoirs (Conseil constitutionnel, presse, syndicats) ne bloquent pas la démocratie : ils la réalisent (Tocqueville : la lenteur délibérative est le prix de la liberté).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : Montesquieu : le pouvoir arrête le pouvoir ; c'est l'équilibre, et non l'efficacité seule, qui définit l'État de droit.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>l'obéissance n'est pas la soumission (la désobéissance civile face à une loi injuste) ;</li>\n<li>la démocratie n'est pas la seule règle majoritaire : les droits protègent les minorités ;</li>\n<li>l'État de droit n'est pas l'absence d'État : c'est l'État soumis au droit ;</li>\n<li>distinguer légal (conforme au droit) et légitime (justifié moralement).</li>\n</ul>\n</div>"
 }

  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li><b>Distinguer</b> : plaisir (immédiat), bonheur (durable, global : Épicure, l'ataraxie), joie (Spinoza : puissance d'agir).</li>\n<li><b>Paradoxe</b> : le bonheur est un sous-produit (Mill) ; Kant : idéal indéfinissable, viser le devoir.</li>\n<li><b>Eudémonisme</b> (Aristote) : le bonheur = activité de l'âme conforme à la vertu ; stoïciens : viser ce qui dépend de nous.</li>\n<li><b>Épicure</b> : calculer les plaisirs, préférer les désirs naturels et nécessaires.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Étudier un désir : naturel ? nécessaire ? à quel prix ?</li>\n<li>Expliquer le paradoxe du bonheur-poursuite avec des exemples.</li>\n<li>Distinguer viser des actes et viser un état.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Plaisir ≠ bonheur.</li>\n<li>Le bonheur n'est pas un droit garanti.</li>\n<li>« Je serais heureux SI… » : le piège du conditionnel.</li>\n</ul>"
 },

{"t": "La démarche philosophique : questionner et argumenter (Terminale)", "q": "Selon Aristote, la philosophie naît de :", "c": ["la peur", "l'ennui", "l'autorité", "l'étonnement (s'étonner de ce qui semble aller de soi)"], "a": 3, "e": "On ne philosophe que sur ce qu'on ne tient plus pour évident : l'étonnement initiateur.", "d": "<b>L'étonnement</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement d'Aristote (Métaphysique, A) : les hommes commencent par s'étonner (les phénomènes célestes, le vivant) puis, délivrés des besoins immédiats, ils cherchent le POURQUOI des choses : l'étonnement est le MOTEUR (qui fait sortir des évidences reçues) : « nul n'a philosophe' qui n'a d'abord été étonné » : la question philosophique commence là où la réponse commune s'arrête. Piège : l'étonnement philosophique n'est pas la surprise (emotion) : c'est une DISTANCE prise avec l'usage : demander « qu'est-ce que la justice ? » à quelqu'un qui « sait » ce que c'est.</div>"},
{"t": "La démarche philosophique : questionner et argumenter (Terminale)", "q": "Une question philosophique se reconnaît à ce qu'elle est :", "c": ["fermée (oui/non)", "ouverte, conceptuelle et normative (elle porte sur ce qui doit être)", "technique", "de fait (mesurable)"], "a": 1, "e": "« Faut-il ? » « Qu'est-ce que ? » : ouverte (plusieurs réponses défendables), conceptuelle, normative.", "d": "<b>Ouverte, conceptuelle, normative</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le tri : « combien de pays abolissent la peine de mort ? » (question de FAIT : statistique : pas philosophique en soi) vs « la peine de mort est-elle JUSTE ? » (question de DROIT : normative) : la question philosophique interroge la NOTION (justice, liberté) et appelle une DÉLIBÉRATION argumentée, pas une mesure. Piège : un sujet de dissertation peut PARTIR d'un fait, mais son traitement philosophe interroge la LÉGITIMITÉ (le droit) du fait : passer du « est » au « doit être » est le geste philosophique par excellence.</div>"},
{"t": "La démarche philosophique : questionner et argumenter (Terminale)", "q": "La différence entre une opinion et une thèse philosophique est :", "c": ["la thèse est défendue par des arguments et discutée (l'opinion se borne à affirmer)", "la thèse est religieuse", "aucune", "la thèse est majoritaire"], "a": 0, "e": "Une opinion est une croyance héritée ou ressentie ; une thèse est une opinion RAISONNÉE : le passage de l'une à l'autre est la tâche philosophique.", "d": "<b>La thèse est argumentée et discutée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la transformation type : opinion « la liberté, c'est faire ce qu'on veut » (assertion) ⟶ travail philosophique : DÉFINIR (vouloir : désir ou raison ?), OBJECTION (le caprice est-il liberté ou esclavage des désirs ? cf. Épictète : l'esclave intérieur), thèse RAFFINÉE : « la liberté est l'autonomie : agir selon des règles que je me donne » (Kant) : l'opinion est le MATÉRIAU brut : la philosophie le TRAVAILLE (Spinoza : ne pas se moquer ni s'indigner des hommes, les COMPRENDRE). Piège : au bac, affirmer sans raison est éliminatoire : chaque idée doit « porter » son argument.</div>"},
{"t": "La démarche philosophique : questionner et argumenter (Terminale)", "q": "L'argument par réduction à l'absurde consiste à :", "c": ["insulter l'adversaire", "faire une analogie", "citer un auteur ancien", "assumer la thèse adverse et montrer qu'elle aboutit à une conséquence inacceptable"], "a": 3, "e": "On ACCEPTE l'hypothèse adverse, on en TIRE les conséquences : si elles sont absurdes, la thèse tombe.", "d": "<b>Tirer une conséquence inacceptable de la thèse adverse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : thèse adverse : « il faut toujours céder à ses désirs » ⟶ si tout désir doit être suivi, alors je dois céder aux désirs qui me détruisent (boire sans fin, voler ce qui me plaît) ⟶ conséquence : la vie même devient impossible : la thèse (absolue) est RÉFUTÉE par ses propres effets. Piège : la réduction doit être LOYALE (bien représenter la thèse adverse avant de la contraindre : sinon c'est un homme de paille) : c'est l'arme cartésienne du doute (pousser une hypothèse jusqu'à son excès pour la tester) et le ressort de toute antithèse de dissertation.</div>"},
{"t": "La démarche philosophique : questionner et argumenter (Terminale)", "q": "Un argument d'autorité (« Kant l'affirme ») est recevable en philosophie si :", "c": ["il est seul", "c'est en latin", "il est accompagné de la raison kantienne (on expose l'argument de Kant et on le discute)", "Kant est récent"], "a": 2, "e": "Citer un philosophe doit introduire SA RAISON : l'autorité orne, l'argument démontre.", "d": "<b>Accompagné de sa raison</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mauvaise copie : « Kant dit qu'il faut toujours dire la vérité, donc c'est vrai » (argument d'autorité NU : zéro pensée) : la bonne copie : « Kant défend le devoir de véracité PARCE QUE le mensonge, universalisé, détruit la parole elle-même (plus personne ne croit personne) » : la RAISON est exposée… et elle peut être DISCUTÉE (le pieux mensonge : Constant contre Kant) : le philosophe est une SOURCE de raisons, pas un gourou. Piège : au bac, citer sans raisonner est un maquillage : le correcteur note la PENSÉE, pas l'érudition.</div>"},
{"t": "La démarche philosophique : questionner et argumenter (Terminale)", "q": "Définir un concept (par ex. la liberté) en philosophie exige :", "c": ["une étymologie seulement", "une opinion personnelle", "un dictionnaire recopié", "un travail de distinctions (liberté d'action / liberté de la volonté ; faire / pouvoir)"], "a": 3, "e": "Définir = DÉCOUPER : distinguer les sens, les degrés, les contraires : la définition philosophique est une ANALYSE.", "d": "<b>Un travail de distinctions</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'art de définir : « la liberté » : ① liberté d'ACTION (absence d'obstacle extérieur : le prisonnier n'est pas libre) ② liberté de la VOLONTÉ (absence de contrainte INTÉRIEURE : l'addict n'est pas libre même dehors : Stoïciens, Spinoza) ③ autonomie morale (se donner sa propre loi : Kant) : trois plans, trois problèmes différents : DUPLIER la notion évite de parler à côté de soi-même. Piège : commencer une dissertation sans décomposer le concept = répondre à une question floue par des idées floues : la DEFINITION est la première opération philosophique (Socrate : dialogues qui cherchent l'eidos de la vertu).</div>"},
{"t": "La démarche philosophique : questionner et argumenter (Terminale)", "q": "La problématique d'un sujet philosophique est :", "c": ["une citation", "une question de culture générale", "un plan résumé", "la tension du sujet : la confrontation de deux réponses plausibles qu'il faut départager"], "a": 3, "e": "Sans tension (certes… mais…), pas de problème : la copie devient un catalogue.", "d": "<b>La tension à départager</b>.<div class='ex-detail'><u>Exemple rédigé</u> : sujet « faut-il toujours dire la vérité ? » : la tension : ① le devoir de sincérité (la parole existe pour dire le vrai : mentir, c'est violer autrui dans sa confiance : Kant) ② MAIS la vérité absolue peut blesser, détruire (le mensonge par humanité : le médecin, l'ami) : problématique : « la sincérité est-elle un devoir inconditionnel ou la bienveillance peut-elle suspendre le vrai ? » : les deux thèses sont CRÉDIBLES : la copie les fait travailler l'une contre l'autre. Piège : la fausse problématique qui s'annonce résolue (« nous montrerons que Kant a raison ») : si la réponse est évidente, il n'y a pas de sujet : la problématisation ENTRETIENT la difficulté jusqu'à la résolution nuancée.</div>"},
{"t": "La démarche philosophique : questionner et argumenter (Terminale)", "q": "Le « doute méthodique » de Descartes est :", "c": ["un scepticisme définitif", "une croyance religieuse", "une maladie", "un doute PROVISOIRE et volontaire, outil pour atteindre une certitude (méthode, pas doctrine)"], "a": 3, "e": "Douter méthodiquement = suspendre tout ce qui est douteux UNE FOIS pour trouver l'indubitable : le doute est un INSTRUMENT.", "d": "<b>Un doute méthodique (provisoire)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le dispositif : Descartes (Discours de la méthode, 1637 : Méditations, 1641) doute de tout ce qui peut être DOUTÉ (sens trompeurs : le bâton brisé : rêve : impossible de distinguer le rêve du vrai : malin génie : un dieu trompeur?) jusqu'à ce qui RÉSISTE : « je pense, donc je suis » (le doute lui-même est une pensée : je ne peux pas douter que je doute) : la certitude première est atteinte PAR le doute : c'est une méthode, pas un désespoir. Piège : distinguer le doute MÉTHODIQUE (volontaire, fécond) du doute SCEPTIQUE (Pyrrhon : fin de la recherche : on s'arrête au « je ne sais pas ») : le cartésien doute POUR savoir : le sceptique doute POUR suspendre.</div>"},
{"t": "La démarche philosophique : questionner et argumenter (Terminale)", "q": "Le cogito (« je pense, donc je suis ») est :", "c": ["une certitude première obtenue par intuition immédiate (le doute atteint tout sauf le je qui doute)", "une prière", "un syllogisme logique", "une définition de l'âme"], "a": 0, "e": "Quand je doute, je pense ; quand je pense, je suis : la première vérité indubitable, fondement du savoir.", "d": "<b>La première certitude</b> (intuition, pas syllogisme).<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement vécu : même si un malin génie me trompe sur TOUT, il faut bien que JE sois trompé : l'acte de penser (douter, errer, affirmer) atteste MON existence au moment même où je la pense : d'où « je pense, donc je suis » : certitude INTUITIVE (immédiate : chaque esprit la voit en se la disant), pas un raisonnement formel (contre l'objection de Gassendi : pas de syllogisme avec majeure cachée). Piège : le cogito n'est pas une preuve de l'immortalité ou de l'âme-substance immédiate : il fonde le SUJET PENSANT comme point de départ du savoir : la suite (preuves de Dieu, clarté des idées) découle de ce point d'Archimède.</div>"},
{"t": "La démarche philosophique : questionner et argumenter (Terminale)", "q": "En dissertation, l'exemple joue le rôle de :", "c": ["illustration et test concret de l'argument (il rend la thèse sensible, sans la démontrer seul)", "preuve absolue", "preuve par l'émotion", "décoration obligatoire"], "a": 0, "e": "L'exemple rend sensible : l'argument démontre : ensemble ils persuadent : la philosophie sans exemple est vide, sans arguments est aveugle.", "d": "<b>Illustration et test concret</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le duo gagnant : argument : « la liberté suppose la connaissance de ses déterminations » (Spinoza) + exemple-test : le fumeur qui « choisit » librement sa cigarette (il croit choisir : il obéit au manque : il n'est libre qu'en CONNAISSANT le mécanisme pour le traiter) : l'exemple ne prouve pas la thèse (un cas ne fait pas une loi) mais il la REND PENSABLE et il la MET À L'ÉPREUVE (si un cas la contredit, l'argument doit être raffiné). Piège : la copie « catalogue d'exemples » (journal, films, anecdotes) sans arguments : au bac de philo, la RÉFLEXION mène, l'exemple sert : inverser les rôles fait perdre des points.</div>"},
{"t": "La vérité : la chercher, la dire (Terminale)", "q": "La définition classique de la vérité comme « adéquation » dit que :", "c": ["le vrai est ce qui plaît", "le vrai est ce qui est cohérent avec mes désirs", "le vrai est majoritaire", "une proposition est vraie quand ce qu'elle énonce est tel qu'elle le dit (correspondance au réel)"], "a": 3, "e": "Adaequatio rei et intellectus : le jugement vrai « colle » à ce qui est.", "d": "<b>Correspondance entre le dire et l'être</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test : « il pleut » : je regarde dehors : s'il pleut, la proposition est VRAIE (adéquation du discours au fait) : la vérité est une RELATION (entre un énoncé et le réel), pas une propriété des choses (une pierre n'est ni vraie ni fausse : un ÉNONCÉ l'est). Piège : distinguer les CRITÈRES de la vérité : correspondance (Aquin), cohérence (un système non contradictoire : mathématiques), évidence (Descartes : l'idée claire), utilité (pragmatistes : « le vrai est ce qui réussit » : contesté) : un énoncé peut être cohérent SANS être vrai (un roman : fiction parfaitement cohérente) : la cohérence ne suffit pas à l'adéquation.</div>"},
{"t": "La vérité : la chercher, la dire (Terminale)", "q": "La différence entre vérité et sincérité est :", "c": ["la vérité est une opinion", "nulle", "la sincérité = dire ce qu'on CROIT vrai ; la vérité = ce qui EST vrai", "la sincérité est religieuse"], "a": 2, "e": "On peut être sincèrement dans l'erreur (dire faux en croyant vrai) : la sincérité est une vertu morale, la vérité un statut logique.", "d": "<b>Croire vrai ≠ être dans le vrai</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cas : Ptolémée croyait sincèrement que le Soleil tournait autour de la Terre : sincère (il disait ce qu'il croyait) MAIS dans le faux (le fait est autre) : la sincérité relève de l'INTENTION (morale : ne pas vouloir tromper) : la vérité relève de la RELATION au réel (logique : être adéquat). Conséquence : une erreur sincère n'est pas un mensonge (le mensonge EXIGE l'intention de tromper) : un mensonge technique (dire vrai pour tromper) corrompt encore la confiance : les deux plans (moral, logique) structurent le sujet bac « faut-il toujours dire la vérité ? ». Piège : la sincérité ne suffit pas au savoir (on peut être sincèrement dans l'erreur) : et la vérité nue peut blesser (la tactique du dire reste une question morale).</div>"},
{"t": "La vérité : la chercher, la dire (Terminale)", "q": "Selon Kant, mentir est toujours immoral parce que :", "c": ["universalisé, le mensonge détruit la possibilité même de la parole (plus personne ne croit personne)", "Dieu le interdit", "le mensonge est légal", "la vérité est parfois cruelle"], "a": 0, "e": "L'impératif catégorique : ce qui ne peut pas être universalisé sans contradiction n'est pas moral : la parole présuppose la confiance.", "d": "<b>Universalisé, le mensonge détruit la parole</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme kantien : imaginez une règle générale : « mensonge universel » : si chacun ment par principe, la parole perd sa valeur (chaque énoncé serait soupçonné) : même la communication du mensonge devient impossible (personne n'est cru) : la MAXIME se contredit elle-même en étant universalisée : d'où le devoir de véracité INCONDITIONNEL (« même au meurtrier qui demande où est ta victime » : Kant contre Constant : la vérité n'est pas « due » seulement à l'ami, elle est due à l'HUMANITÉ dans la parole). Piège : la réponse kantienne choque : c'est SON INTÉRÊT philosophique : la discussion (Constant : la vérité n'est pas due au crime) fait le VIVANT du sujet de dissertation.</div>"},
{"t": "La vérité : la chercher, la dire (Terminale)", "q": "Benjamin Constant objecte à Kant que :", "c": ["Kant est trop jeune", "la vérité n'existe pas", "la vérité n'est pas due à tous dans toutes les situations (le mensonge par humanité peut être un devoir)", "la morale est inutile"], "a": 2, "e": "« Dire la vérité n'est un devoir qu'envers ceux qui ont droit à la vérité » : cacher le fugitif au meurtrier.", "d": "<b>La vérité n'est pas due à tous</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cas de Constant (1797, « Des réactions politiques ») : le meurtrier demande où se cache l'ami : Kant exige de dire vrai (véracité inconditionnelle) : Constant : mentir ici n'est pas seulement permis, c'est le DEVOIR réel (la véracité vaut pour un pacte social réciproque : le meurtrier y renonce) : la morale n'est pas un rituel formaliste, elle protège des PERSONNES. Piège : le débat Kant/Constant n'est pas un match à trancher par vote : la dissertation évalue la FORCE de chaque position (la protection du lien social vs la protection de la vie concrète) puis propose une HIÉRARCHIE réfléchie : c'est la problématique type du chapitre.</div>"},
{"t": "La vérité : la chercher, la dire (Terminale)", "q": "« Chacun sa vérité » (relativisme) se réfute notamment parce que :", "c": ["les anciens l'ont dit", "c'est un slogan moderne", "l'énoncé « toute vérité est relative » se prétend lui-même absolu (contradiction performative)", "c'est vrai"], "a": 2, "e": "Affirmer le relativisme comme VRAI pour tous, c'est postuler une vérité absolue : le relativisme tombe dans son propre piège (Platon contre Protagoras).", "d": "<b>Contradiction performative</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'objection de Platon (Théétète : contre Protagoras : « l'homme est la mesure de toutes choses ») : Protagoras prétend QUE SA THÈSE est vraie : or, si toute vérité est relative, la sienne aussi : elle ne vaut alors QUE pour lui : pourquoi l'enseigner aux autres ? : le relativisme UNIVERSEL se détruit en s'énonçant (il parle de LA vérité comme s'il la possédait). Piège : distinguer le relativisme TOTAL (incohérent) du pluralisme RAISONNÉ (certaines questions — goût, valeurs discutées — tolèrent la pluralité, d'autres — faits, logique — non) : la nuance sauve la réflexion du dogmatisme ET du nihilisme.</div>"},
{"t": "La vérité : la chercher, la dire (Terminale)", "q": "Selon Nietzsche, nos « vérités » sont :", "c": ["des dons divins", "des erreurs punies", "des maths", "des métaphores usées, des conventions utiles que nous avons oubliées d'être des métaphores"], "a": 3, "e": "« Vérité et mensonge au sens extra-moral » : la vérité est une « armée de métaphores » : le langage conventionnalise, l'oubli fait le rest.", "d": "<b>Des conventions-métaphores oubliées</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le texte (1873) : le « chercheur de vérité » nerveusement honnête découvre que les désignations (le mot « pierre » pour la chose) sont des métaphores arbitraires devenues obligatoires par l'USAGE et l'OUBLI (nous ne sentons plus la métaphore) : les « vérités » sont des « illusions dont on a oublié qu'elles le sont » : le perspectivisme : chaque vie connaît un angle. Piège : Nietzsche ne dit PAS « tout se vaut » : il DÉPLACE la question (d'où viennent nos vérités ? qui parle ? au nom de quelle force ?) : c'est une GENEALOGIE (critique des valeurs), pas un scepticisme paresseux : le réutiliser au bac exige cette précision.</div>"},
{"t": "La vérité : la chercher, la dire (Terminale)", "q": "Distinguer le fait (« est ») et la norme (« doit être ») sert à :", "c": ["traduire", "embrouiller", "éviter le sophisme qui déduit une norme d'un simple fait (l'IS n'implique pas l'OUGHT)", "rompre le texte"], "a": 2, "e": "« Tout le monde ment, donc mentir est permis » : INVALIDE : le fait ne fonde pas la norme (Hume : la guillotine de Hume).", "d": "<b>Éviter le sophisme natureliste</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la « guillotine » de Hume (Traité de la nature humaine) : aucun « doit » ne se déduit logiquement d'un « est » : les moralistes qui déduisent une loi morale de la nature (ou de la tradition) commettent une RUPTURE logique : « les hommes ont toujours fait la guerre ⟹ la guerre est légitime » : non sequitur (le fait n'implique pas le droit). Piège : la distinction n'interdit pas de chercher des FAITS POUR la délibération (les conséquences réelles comptent) : elle impose seulement de passer par l'ARGUMENT NORMATIF (pourquoi ce fait devrait-il compter ?) : la rigueur philosophique EST cette discipline du passage.</div>"},
{"t": "La vérité : la chercher, la dire (Terminale)", "q": "Le doute philosophique (à la différence du doute sceptique) :", "c": ["est un INSTRUMENT provisoire pour mieux atteindre le vrai (méthode)", "est une maladie", "arrête la recherche", "est la foi"], "a": 0, "e": "Douter pour savoir (Descartes) : le doute est l'HYGIÈNE de la vérité, pas sa tombe.", "d": "<b>Un instrument au service du vrai</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la différence de régime : le SCEPTIQUE (Pyrrhon) suspend le jugement POUR ATTEINDRE LA TRANQUILLITÉ (ataraxie : le doute est un ÉTAT : on s'y repose) : le MÉTHODIQUE (Descartes) met le doute en ROUTINE (critère : rejeter tout ce qui est « le moins que peu » douteux pour trouver l'INDUBITABLE) : le doute est un MOYEN. Piège : confondre les deux fait écrire des contradictions (« Descartes ne croit à rien » ✗ : il doute précisément POUR fonder la science) : la dialectique du chapitre : le doute NI nihiliste NI crédule : méthodique.</div>"},
{"t": "La vérité : la chercher, la dire (Terminale)", "q": "Une certitude peut être :", "c": ["interdite", "une opinion", "toujours vraie", "fausse (je peux être certain… et me tromper : la certitude est un état psychologique, pas une garantie)"], "a": 3, "e": "Le fanatique est certain : la certitude subjective n'est pas la vérité : douter de ses certitudes est le début du savoir.", "d": "<b>Psychologiquement certain, logiquement fausse possible</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cas d'école : pendant des siècles, on était CERTAIN que la Terre était immobile au centre : certitude (état de conviction sans doute) ≠ vérité (adéquation au réel) : la certitude est un FAIT psychique (mesurable : intensité de conviction) : la vérité est un STATUT logique (vérifiable) : la confusion des deux est le moteur du fanatisme (tuer pour une certitude). Piège : la science avance justement en TRAITANT ses certitudes comme des hypothèses (falsifiables : Popper) : l'humilité épistémique (douter de soi) n'est pas la faiblesse : c'est la CONDITION de la découverte.</div>"},
{"t": "La vérité : la chercher, la dire (Terminale)", "q": "Une proposition normative (« mentir est mal ») se distingue d'une proposition factuelle parce qu'elle :", "c": ["est plus longue", "ne décrit pas un fait mais prescrit/évalue (elle se discute par des RAISONS morales, pas par l'expérience seule)", "est toujours fausse", "rime"], "a": 1, "e": "Le normatif prescrit (doit être), le factuel décrit (est) : les confondre est le sophisme de base.", "d": "<b>Prescrit/évalue au lieu de décrire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la carte des propositions : « il ment » (fait : vérifiable : il a dit X sachant non-X) vs « il ne DOIT pas mentir » (norme : fondée sur des raisons : la confiance, le respect d'autrui) : la norme ne se teste PAS en laboratoire : elle se DISCUTE (quelles raisons ? pour qui ? universellement ?) : c'est le terrain de la MORALE (chapitre suivant) et le fil rouge du bac (« peut-on… ? faut-il… ? »). Piège : réduire le normatif à un fait caché (« c'est mal parce que ça fait fuir les gens ») ne dit pas POURQUOI fuir serait mal : la norme exige une FONDATION, pas seulement une description de conséquences.</div>"},
{"t": "La science et la raison (Terminale)", "q": "Selon Popper, une théorie est scientifique si :", "c": ["elle est réfutable (falsifiable) : une observation possible pourrait la contredire", "elle est ancienne", "elle est vraie", "elle est utile"], "a": 0, "e": "Une théorie qui n'exclut rien (irréfutable) ne dit rien de testable : l'astrologie n'est pas scientifique.", "d": "<b>Falsifiable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test du cygne : « tous les cygnes sont blancs » est scientifique PARCE QU'EXCLUANTE (un cygne noir la tuerait : et il est venu : la proposition est morte, mais elle était scientifique) : l'astrologie, elle, explique tout et son contraire (l'échec devient « mauvaise interprétation ») : RIEN ne peut la contredire : elle ne fait aucune PRÉDICTION RISQUÉE : donc pas scientifique (selon ce critère). Piège : le critère popperien ne mesure pas la VÉRITÉ (une théorie réfutée reste scientifique) : il mesure l'HONNÊTETÉ ÉPISTÉMIQUE (assumer qu'on pourrait avoir tort) : c'est une éthique du savoir autant qu'une logique.</div>"},
