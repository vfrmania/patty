{"t": "La science et la raison (Terminale)", "q": "La méthode expérimentale (Claude Bernard) suit l'ordre :", "c": ["croire, obéir, répéter", "observation ⟹ hypothèse ⟹ expérience (test contradictoire) ⟹ loi", "expérience ⟹ observation ⟹ opinion", "loi ⟹ hypothèse ⟹ prière"], "a": 1, "e": "L'expérience est une observation PROVOQUÉE et CONTRÔLÉE pour tester l'hypothèse (l'expérience « pour voir » sans hypothèse ne prouve rien).", "d": "<b>Observation, hypothèse, expérience, loi</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cas Bernard : les lapins nourris normalement ont une urine trouble (OBSERVATION inattendue) : HYPOTHÈSE : ils jeûnent en réalité, l'urine change avec le jeûne : EXPÉRIENCE contradictoire : nourrir un lapin à l'herbe fraîche ⟹ urine claire : LOI physiologique (le régime contrôle l'urine : voie du foie : la découverte du glycogène) : l'idée maîtresse : l'expérience doit être CONÇUE POUR CONTREDIRE l'hypothèse (si elle résiste, elle est solide) : c'est l'ancêtre du test popperien. Piège : « expérimenter » sans hypothèse (bricoler) n'est pas de la science : c'est du bricolage.</div>"},
{"t": "La science et la raison (Terminale)", "q": "Une loi scientifique (par ex. la chute des corps) est :", "c": ["une opinion majoritaire", "un conseil moral", "une relation GÉNÉRALE et NÉCESSAIRE, valide dans le domaine du modèle (toujours, partout, aux conditions données)", "une prière"], "a": 2, "e": "La loi dit : dans telles conditions, il arrive TOUJOURS ceci : elle permet la PRÉDICTION (c'est sa force) et l'EXPlication (pourquoi).", "d": "<b>Générale et nécessaire (dans le modèle)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la loi de la chute (Galilée : v = gt : la distance varie comme le carré du temps) : VALEUR : générale (tous les corps, tous les lieux terrestres) et nécessaire (pas d'exception dans les conditions du modèle : vide, champ uniforme) : OR la plume tombe moins vite (l'air !) : la loi vaut DANS SON DOMAINE (modèle sans frottement) : c'est pourquoi la physique avance par MODÈLES successivement affinés (Newton inclut, Einstein relativise). Piège : « la loi est vraie » ne veut pas dire « absolument » : elle est CORROBORÉE dans son champ : le savoir scientifique est un savoir BORNOÉ (des conditions) — c'est sa rigueur, pas sa faiblesse.</div>"},
{"t": "La science et la raison (Terminale)", "q": "Le scientisme est :", "c": ["la science elle-même", "une méthode de cuisine", "une religion officielle", "la position philosophique (contestée) selon laquelle la science peut et suffira à tout dire (y compris valeurs, sens)"], "a": 3, "e": "« Science » (savoir borné) ≠ « scientisme » (foi dans l'omniscience) : confondre les deux est une confusion de plans.", "d": "<b>La foi dans l'omni-science</b> (position philosophique).<div class='ex-detail'><u>Exemple rédigé</u> : le glissement type : « la science découvrira un jour pourquoi il faut être bon » : confusion : la science décrit des FAITS (l'empathie active telle zone cérébrale) mais de ce fait ne se DÉDUIT aucune norme (« il FAUT être empathique » : guillotine de Hume) : le scientisme est une POSITION MÉTAPHYSIQUE (tout est réductible au mesurable) qui se présente abusivement comme une évidence scientifique. Piège : critiquer le scientisme n'est pas S'OPPOSER à la science (c'est la défendre dans ses LIMITES : en nommant ce qu'elle ne peut pas dire, on clarifie ce qu'elle seule peut dire) : c'est le geste kantien (limiter pour asseoir).</div>"},
{"t": "La science et la raison (Terminale)", "q": "Selon Kant, la connaissance scientifique porte :", "c": ["sur rien", "sur les idées de la métaphysique", "sur les PHÉNOMÈNES (ce qui apparaît à nos formes de sensibilité et d'entendement : temps, espace, catégories)", "sur les choses en soi"], "a": 2, "e": "La science connait les phénomènes (structurés par notre esprit) : la chose en soi, Dieu, la liberté : objets de la raison PRATIQUE, pas de la science.", "d": "<b>Sur les phénomènes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la révolution copernicienne kantienne : l'objet connu CONFORMÉ aux structures du connaissant (l'espace et le temps comme FORMES de notre sensibilité : les catégories comme formes de l'entendement) : la science est donc POSSIBLE et certaine… dans les limites de l'EXPÉRIENCE POSSIBLE : au-delà (l'âme, le monde comme totalité, Dieu), la connaissance ne peut ni prouver ni réfuter : c'est le terrain de la FOI RAISONNABLE et de la MORALE. Piège : Kant ne dit pas « nous ne connaissons rien » : il dit « nous connaissons EXACTEMENT : c'est pourquoi nous connaissons les limites » : la Critique EST une théorie de la science (fondant Newton) autant qu'une garde-fou de la métaphysique.</div>"},
{"t": "La science et la raison (Terminale)", "q": "Une théorie scientifique n'est jamais « prouvée » définitivement, seulement :", "c": ["devinée", "votée", "révélée", "corroborée (renforcée par les tests réussis, en attendant mieux)"], "a": 3, "e": "L'induction ne garantit jamais l'universel (le soleil s'est levé 10 000 fois : rien ne PROUVE qu'il se lèvera demain : Popper : on ne vérifie pas, on tente de réfuter).", "d": "<b>Corroborée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le problème de l'induction (Hume) : 10 000 cygnes blancs ne PROUVENT pas « tous les cygnes sont blancs » (l'observation passée ne borne pas l'avenir) : la solution popperienne : INVERSER la logique : chercher le cygne noir (réfuter) : une théorie qui SURVIT aux tentatives de meurtre est CORROBORÉE (jamais « vraie pour toujours ») : Newton a « survécu » 200 ans : Einstein l'a RELATIVISÉ (aux grandes vitesses, il faut de nouveaux modèles). Piège : l'humilité scientifique (« provisoire ») n'est pas du relativisme (« tout se vaut ») : les théories se HIÉRARCHISENT par puissance prédictive : la provision est METHODOLOGIQUE, l'inégalité est RATIONNELLE.</div>"},
{"t": "La science et la raison (Terminale)", "q": "La révolution copernicienne a modifié le rapport :", "c": ["au sport", "à la langue", "à l'autorité et aux apparences (le calcul et l'observation instrumentée l'emportent sur l'évidence sensible et la tradition)", "à la mode"], "a": 2, "e": "La Terre quitte le centre : la vérité se CONSTRUIT (calculs, instruments) au lieu de se LIRE dans l'apparence ou l'autorité.", "d": "<b>Rupture avec l'autorité et l'apparence</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le triptyque : ① contenu (héliocentrisme : la Terre tourne : contre le sens commun) ② méthode (la lunette de Galilée : voir PLUS LOIN que l'œil nu : l'instrument prolonge la raison) ③ statut (un modèle mathématique peut SAUVER les apparences (expliquer pourquoi le Soleil semble tourner) sans ÊTRE l'apparence) : la science devient CONSTRUCTION contre l'évidence. Piège : la révolution ne fut pas immédiate ni pure (résistances religieuses : l'affaire Galilée, 1633) : la scientificité est aussi une histoire SOCIALE (communautés, institutions : le savoir se négocie) : en dissertation, l'exemple Galilée illustre le thème « raison et réel » ET « liberté de penser ».</div>"},
{"t": "La science et la raison (Terminale)", "q": "La technique moderne se distingue de l'ancienne parce qu'elle :", "c": ["coûte moins cher", "s'appuie sur la science théorique (le savoir FOND le pouvoir-faire : technoscience)", "est interdite", "est plus jolie"], "a": 1, "e": "Autrefois l'artisan améliorait par essais (métier : savoir-faire) : aujourd'hui le laboratoire précède l'usine (la théorie de l'électricité précède la dynamo).", "d": "<b>La science fonde la technique</b> (technoscience).<div class='ex-detail'><u>Exemple rédigé</u> : le basculement (courant XIXe-XXe) : l'ancienne technique était EMPIRIQUE (le forgeron transmet un geste qui marche sans savoir pourquoi) : la moderne est THÉORIQUE D'ABORD (on comprend l'électron, puis on fabrique le transistor : la fission nucléaire est prédite par la physique AVANT la bombe : Manhattan) : conséquence philosophique : le pouvoir-faire court PLUS VITE que le devoir-faire (la question éthique est débordée : le nucléaire, le clonage : Hans Jonas : le principe responsabilité) : la technique moderne POSE une question morale qu'elle ne peut pas résoudre seule. Piège : au bac, ne pas confondre le chapitre « science » (connaître) et « technique » (agir) : leurs problèmes se recoupent (la vérité, le pouvoir) mais distincts.</div>"},
{"t": "La science et la raison (Terminale)", "q": "Les « paradigmes » de Kuhn désignent :", "c": ["des lois éternelles", "les cadres dominants de la recherche à une époque (les révolutions scientifiques = changements de paradigme)", "des erreurs", "des exercices de sport"], "a": 1, "e": "Un paradigme (newtonien, einsteinien) définit ce qui compte comme problème, méthode, solution légitimes : la science normale l'applique, la crise le renverse.", "d": "<b>Les cadres dominants de recherche</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique de Newton : PARADIGME (univers de forces dans un espace absolu) : la « science normale » résout des énigmes DANS ce cadre : l'anomalie persistante (l'orbite de Mercure : l'avance du périhélie) fait CRISE : Einstein propose un NOUVEAU cadre (espace-temps courbe) : révolution (changement de paradigme) : les concepts eux-mêmes (masse, temps) changent de sens. Piège : Kuhn ne dit pas « la science est irrationnelle » : il dit que la rationalité est située (dans un cadre) : contre l'image popperienne du tester permanent, il montre des POQUETES de rupture : les deux lectures s'opposent productivement (c'est un sujet de bac fécond).</div>"},
{"t": "La science et la raison (Terminale)", "q": "La raison scientifique est dite « désintéressée » parce que :", "c": ["elle vise la connaissance pour elle-même (indépendamment de l'utilité immédiate : la curiosité comme moteur)", "elle ment", "elle ne veut rien", "elle est gratuite"], "a": 0, "e": "La science moderne s'est constituée contre l'utilitarisme immédiat (les académies : « savoir pour savoir ») : mais son efficacité technique est venue le récompenser.", "d": "<b>Elle vise le savoir pour lui-même</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe fécond : Faraday étudie l'électromagnétisme PAR CURIOSITÉ (à quoi ça sert ? « un nouveau-né, à quoi sert-il ? ») : un siècle plus tard, la dynamo alimente le monde : le désintéressement est la CONDITION de la découverte profonde (l'utilité immédiate oriente vers le court terme : le marché ne finance pas les « anomalies » de Mercure). Piège : le désintéressement n'est pas la NAÏVETÉ : la science moderne vit aussi de FINANCEMENTS (militaires, industriels) : la question politique du chapitre : QUI finance la vérité ? vers quels objets dérive-t-elle ? : l'épistémologie rejoint l'éthique (la vérité a des conditions sociales : c'est un axe de dissertation « vérité et pouvoir »).</div>"},
{"t": "La conscience et l'inconscient (Terminale)", "q": "La conscience réfléchie se distingue de la conscience spontanée en ce qu'elle :", "c": ["est corporelle", "est un RETOUR sur soi (se prendre pour objet : connaître ses vécus au lieu de les vivre)", "endort", "est inconsciente"], "a": 1, "e": "Vivre (spontané) vs se savoir vivant (réfléchi) : l'introspection, la mémoire, le projet : la conscience peut se replier sur elle-même.", "d": "<b>Se prend elle-même pour objet</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la nuance : je marche (conscience spontanée : le pas se règle sans pensée) : je TRÉBUCHE : soudain je PENSE ma marche (« je pensais à autre chose ») : la conscience réfléchie (Hegel : le savoir de soi) construit le MOI (une identité qui se raconte) et rend possible la RESPONSABILITÉ (répondre de ses actes suppose de s'en savoir l'auteur). Piège : la conscience réfléchie n'est pas permanente ni infaillible : l'attention se déplace (clôture : le choix réfléchi) et l'auto-justification la trompe (rationalisations : le chapitre freudien en tire parti) : se connaître est un TRAVAIL, pas un donné.</div>"},
{"t": "La conscience et l'inconscient (Terminale)", "q": "« L'homme n'est qu'un roseau, mais c'est un roseau pensant » (Pascal) dit :", "c": ["la conscience fait la grandeur ET la misère de l'homme (dignité de la pensée, angoisse de la mort)", "l'homme est une plante", "la pensée est inutile", "la nature est divine"], "a": 0, "e": "L'homme est fragile (roseau : la nature l'écrase) mais supérieur par la conscience (il SAIT qu'il meurt) : grandeur ET misère.", "d": "<b>Grandeur et misère de la conscience</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe : l'univers peut écraser l'homme (misère : fragilité cosmique) MAIS l'homme, en sachant qu'il meurt, est « supérieur » à ce qui l'écrase (grandeur : la pensée vaut plus que l'univers muet) : d'où la DOUBLE face de la conscience : dignité (responsabilité : Kant) ET tourment (angoisse, divertissement pascalien : fuir cette pensée dans les distractions). Piège : Pascal ne fait pas de la conscience un instrument de pouvoir (comme Descartes : maîtrise) : il en fait un RAPPEL de condition (croire, miser : la conscience avoue ses limites) : les deux usages de la conscience (maîtriser / s'interroger) structurent le chapitre.</div>"},
{"t": "La conscience et l'inconscient (Terminale)", "q": "Selon Freud, l'inconscient est :", "c": ["une zone de stockage neutre", "un réservoir actif de pulsions et de refoulés qui INFLUENCE nos actes (rêves, lapsus, symptômes)", "le cerveau", "la mort"], "a": 1, "e": "Le refoulé n'est pas supprimé : il revient (le retour du refoulé) sous des formes déguisées : il AGIT sans être reconnu.", "d": "<b>Actif et influant</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la découverte clinique : l'hystérique ne « fait pas semblant » (Charcot : le symptôme est réel mais sans cause organique) : l'hypnose, la cure par la parole font remonter des SOUVENIRS refoulés (traumas, désirs interdits) : le symptôme disparaît : preuve indirecte de l'AGIR du refoulé (« le moi n'est pas maître dans sa propre maison » : Freud, Une difficulté…) : les formations de compromis (lapsus, actes manqués, rêves) sont les chemins du retour. Piège : l'inconscient n'est pas un « sous-sol » muet : il est INTENTIONNEL (désirs, défenses) : c'est une seconde psyché qui négocie : d'où le mot de Freud : « le rêve est la voie royale vers l'inconscient ».</div>"},
{"t": "La conscience et l'inconscient (Terminale)", "q": "La structure freudienne du psychisme comprend :", "c": ["ça (pulsions), surmoi (interdits), moi (arbitre)", "raison, foi, loi", "conscience, cerveau, âme", "corps, esprit, cœur"], "a": 0, "e": "Le ça exige, le surmoi interdit, le moi arbitre (sous la contrainte du réel) : conflit permanent et compromis.", "d": "<b>Ça / surmoi / moi</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique du conflit : le ÇA pousse (faim, désir : « je veux »), le SURMOI interdit (la voix intériorisée des parents et de la culture : « tu ne dois pas »), le MOI cherche un compromis possible dans le réel (travailler pour manger sans voler : la sublimation : canaliser la pulsion en œuvre sociale : l'art, la science) : le psychisme est un CHAMP DE BATAILLE (névrose = conflit figé) : la cure vise à élargir le moi (« Wo Es war, soll Ich werden » : là où était le ça, le moi doit advenir). Piège : ne pas confondre surmoi et conscience morale : le surmoi est PUNITIF (culpabilité obscurantiste parfois) : la morale mature n'est pas un simple héritage d'interdits (c'est un axe de dissertation : psychanalyse et morale).</div>"},
{"t": "La conscience et l'inconscient (Terminale)", "q": "L'objection de Popper à la psychanalyse porte sur :", "c": ["son âge", "son prix", "sa falsifiabilité (toute observation, même contraire, est réinterprétée : la théorie ne risque rien)", "son efficacité"], "a": 2, "e": "Une théorie qui explique tout et son contraire n'est pas réfutable : selon le critère popperien, la psychanalyse ne serait pas scientifique (débat ouvert).", "d": "<b>L'irréfutabilité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : le patient nie ? c'est une « résistance » (qui CONFIRME l'analyste) : il accepte ? c'est l'« insight » (qui confirme aussi) : toute issue confirme : la théorie est-elle alors un OUTIL d'interprétation (herméneutique féconde : riche en SENS) plutôt qu'une science expérimentale (lois réfutables) ? C'est la position popperienne (épistémologie des sciences : falsifiabilité comme critère). Piège : la discussion moderne NUANCE : la psychanalyse clinique produit des observations (transfert, mécanismes de défense : aujourd'hui partiellement intégrés aux sciences cognitives) et certains énoncés psychanalytiques SONT testables : le débat fécond : la copie doit le PRÉSENTER comme débat, pas comme verdict.</div>"},
{"t": "La conscience et l'inconscient (Terminale)", "q": "« Avoir conscience » au sens moral signifie :", "c": ["rêver", "dormir", "se savoir RESPONSABLE de ses actes (la conscience comme tribunal intérieur)", "être somnambule"], "a": 2, "e": "La conscience morale juge nos actes (remords, responsabilité) : c'est le sens pratique de la conscience (distinct du sens psychologique).", "d": "<b>Se savoir responsable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la double face du mot : psychologiquement, « avoir conscience » = percevoir (je suis conscient du bruit) : moralement = répondre de (je prends conscience de ma faute : le remords est une expérience morale : Rousseau : la conscience comme « instinct divin » qui juge) : le droit PUNIT sur cette base (la responsabilité suppose la conscience : dormir, hypnotiser, aliéner : atténuantes). Piège : la question de bac classique : si l'inconscient agit en nous, sommes-nous encore responsables ? La réponse de Freud lui-même : la cure AUGMENTE la liberté (savoir ce qui nous pousse = cesser d'en être le jouet) : l'inconscient EXPLIQUE, il n'EXCUSE pas : la conscience reste le tribunal dernier.</div>"},
{"t": "La conscience et l'inconscient (Terminale)", "q": "L'argument principal contre « la conscience se connaît entièrement par introspection » est :", "c": ["l'introspection est interdite", "l'auto-observation est trompeuse (rationalisations, angles morts, influence des désirs sur le « portrait » de soi)", "le corps décide tout", "l'âme existe"], "a": 1, "e": "L'introspection suppose un point de vue SUR soi : or ce point de vue est DANS la psyché (biais, défenses : nous nous racontons un « moi » favorable) : l'auto-illusion est documentée.", "d": "<b>L'auto-observation est faillible</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les preuves du quotidien : la « rationalisation » (je rate un examen : « de toute façon, cette école ne me plaisait pas » : reconstruction logique APRÈS coup d'un échec non choisi) : la « théorie des biais » contemporaine (l'auto-attribution généreuse : 90 % des conducteurs se croient au-dessus de la moyenne) : l'introspection n'est pas un microscope : c'est un PORTRAIT (partiel et partial). Piège : cette faillibilité ne condamne pas la conscience : elle CONDAMNE son narcissisme (se croire transparent à soi-même) : la lucidité (l'aveu des angles morts) est une conquête DE la conscience : c'est exactement le pari de la cure analytique (Freud : rendre conscient l'inconscient pour agrandir la liberté).</div>"},
{"t": "La conscience et l'inconscient (Terminale)", "q": "Le « retour du refoulé » désigne :", "c": ["un retour en arrière politique", "une punition divine", "la réapparition déguisée du contenu refoulé (symptôme, rêve, lapsus) malgré le refoulement", "une mode"], "a": 2, "e": "Le refoulement ne supprime pas : il ENFouit sous pression : la pression fait revenir le contenu sous forme déguisée (compromis).", "d": "<b>Le retour déguisé du refoulé</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : un désir inadmissible (vouloir la mort d'un rival) ne peut ni se vivre (interdit) ni se dire (honte) : il est REFU-LÉ (maintenu hors conscience par une censure qui coûte de l'énergie psychique) : la pression monte : le désir REVIENT déguisé (un rêve où le rival tombe « par accident » : un lapsus le blessant : un symptôme : la phobie de l'arme) : la cure écoute ces déguisements (l'interprétation déchiffre le compromis). Piège : le refoulé n'est pas « oublié » (l'oubli ordinaire est neutre : le refoulé reste AGISSANT, chargé d'affect : c'est la différence entre l'oubli banal et le refoulement : le second revient TOUJOURS).</div>"},
{"t": "La conscience et l'inconscient (Terminale)", "q": "La cure analytique vise (selon Freud) :", "c": ["à plaire", "à rendre conscient l'inconscient (élargir le moi : plus de liberté sur ses propres déterminismes)", "à punir", "à endormir le patient"], "a": 1, "e": "« Wo Es war, soll Ich werden » : là où était le ça, le moi doit advenir : savoir pour se libérer (pas seulement se pardonner).", "d": "<b>Rendre conscient l'inconscient</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le pari freudien : le symptôme (compulsion, phobie) est un MESSAGE chiffré : la cure (association libre, analyse du transfert) déchiffre : quand le sens devient CONSCIENT (le patient se l'approprie : « ah, c'est ÇA que je fuyais »), la pression retombe (le symptôme perd sa fonction) : le moi s'AGRANDIT (l'arbitrage remplace la compulsion) : c'est une ÉMANCIPATION par la connaissance (Spinoza déjà : ne plus être esclave de ses causes ignorées). Piège : la cure ne SUPPRIME pas les pulsions (elles restent : c'est la vie) : elle change le RAPPORT (les savoir au lieu d'être leur chose) : promouvoir la liberté INTÉRIEURE, c'est l'axe « inconscient et liberté » du programme.</div>"},
{"t": "La conscience et l'inconscient (Terminale)", "q": "Pour Sartre, l'homme est condamné à être libre parce que :", "c": ["il est riche", "la liberté est un don", "la conscience est néant : elle prend distance sur tout déterminisme (même nos pulsions, nous décidons de leur poids)", "il est faible"], "a": 2, "e": "« L'existence précède l'essence » : rien en moi ne me détermine sans que je fasse mien le projet : même l'inconscient, dit Sartre, est une « mauvaise foi » (je me leurre).", "d": "<b>La conscience se décolle de tout</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'argument sartrien : la conscience n'est jamais une CHOSEN (elle est toujours AUSSITÔT distance par rapport à ce qu'elle est : je suis triste, mais je SAIS que je suis triste : cette distance est une liberté) : donc aucun fait (caractère, inconscient, passé) ne me détermine comme une cause détermine un effet : je le PRIS en projet (« l'homme est condamné à être libre » : L'existentialisme est un humanisme) : contre Freud : l'inconscient est une notion commode pour se déresponsabiliser (la « mauvaise foi » : se mentir en se croyant déterminé). Piège : le débat Sartre/Freud est un SUJET DE BAC PARFAIT (« suis-je maître de moi ? ») : la copie doit faire travailler les deux positions (la force clinique de Freud contre la force morale de Sartre) puis proposer sa propre hiérarchie argumentée.</div>"},
{"t": "La liberté : choisir et agir (Terminale)", "q": "La liberté d'action se définit comme :", "c": ["l'obéissance", "l'absence d'obstacles EXTÉRIEURS à l'action (personne/rien ne m'empêche de faire)", "le pouvoir de vouloir", "la richesse"], "a": 1, "e": "Le prisonnier (entravé extérieurement) n'est pas libre d'aller et venir : c'est la liberté « négative » (sans entrave).", "d": "<b>Absence d'obstacles extérieurs</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la définition en acte : je veux traverser la rue : ① si la porte est ouverte et la rue libre, mon action est LIBRE (rien ne l'entrave extérieurement) ② si je suis enchaîné, retenu, interdit, elle ne l'est pas : cette liberté est dite « négative » (libre DE quelque chose : absence de) : c'est la liberté juridique/politique (les droits : circuler, exprimer). Piège : cette liberté peut exister SANS liberté intérieure (le toxicomane dehors est « libre d'agir » mais esclave de son désir) : d'où la distinction avec la liberté de la VOLONTÉ (2e sens) et l'autonomie (3e) : la copie qui distingue les sens évite de répondre à côté.</div>"},
{"t": "La liberté : choisir et agir (Terminale)", "q": "L'autonomie (au sens de Kant) signifie :", "c": ["la solitude", "faire tout seul", "la paresse", "se donner à SOI-MÊME sa loi (agir selon une règle que ma raison approuve : non par peur ou intérêt)"], "a": 3, "e": "Auto-nomos : la loi que JE me donne (par ma raison) : s'oppose à l'hétéronomie (recevoir sa loi d'ailleurs : la mode, l'autorité, la pulsion).", "d": "<b>Se donner sa propre loi</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'étymologie active : AUTOS (soi) + NOMOS (loi) : l'hétéronomie, c'est la loi de l'AUTRE (je ne mens QUE par peur du gendarme : je suis l'hétéronome) : l'autonomie : je ne mens pas parce que la raison elle-même l'interdit (l'universel : la maxime doit pouvoir être loi pour tous) : la morale kantienne EST la liberté (agir moralement = agir librement) : on ne « perd » rien à être moral : on se réalise comme ÊTRE RAISONNABLE. Piège : l'autonomie n'est pas le caprice (« ma loi à moi » serait une loi d'humeur) : c'est la loi de la RAISON en moi (universelle) : sinon, n'importe quel fantasme deviendrait moral : ce serait confondre autonomie et arbitraire.</div>"},
{"t": "La liberté : choisir et agir (Terminale)", "q": "Selon Spinoza, la liberté consiste à :", "c": ["être sans causes", "agir par la seule nécessité de sa propre nature ET comprendre ses déterminations (la liberté est la CONNAISSANCE de la nécessité)", "choisir au hasard", "voter"], "a": 1, "e": "Le libre n'échappe pas aux causes : il les INTÉRIORISE et les COMPREND (le sage : libre parce que lucide : la pierre qui roule ignore pourquoi).", "d": "<b>Connaître sa nécessité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la formule : « la liberté, c'est la nécessité comprise » (Spinoza, Éthique : la pierre qui roule, si elle était CONSCIENTE, se croirait libre : elle ignore que la pente la fait rouler) : l'homme « libre » ordinaire = la pierre : il suit ses désirs en croyant les choisir : le SAGE comprend le mécanisme (les affects, leurs causes : la tristesse vient de…) et agit avec son propre vouloir (que ce soit en le CONNAISSANT) : la liberté est un travail de RAISON (de la servitude des passions à la liberté par la connaissance). Piège : Spinoza ne défend pas le fatalisme paresseux (« tout est écrit ») : il redéfinit la liberté (compatibilité du déterminisme et de la liberté : un débat contemporain : les neurosciences) : c'est une POSITION argumentée dans le dilemme du libre arbitre, pas une reddition.</div>"},
{"t": "La liberté : choisir et agir (Terminale)", "q": "L'aliénation (au sens psychologique et politique) désigne :", "c": ["la situation de celui qui se croit libre en exécutant des volontés qui ne sont pas les siennes (le fumeur, le manipulé, le travailleur exploité)", "un sentiment de joie", "un voyage", "un divorce"], "a": 0, "e": "Aliénus = « autre » : être devenu autre que soi : la servitude VOLONTAIRE (on aime ses chaînes : La Boétie) est la plus efficace.", "d": "<b>Exécuter des volontés étrangères en se croyant libre</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les trois cas : ① psychologique : le fumeur « choisit » sa cigarette (le désir choisit, le moi obéit : Rousseau déjà : « il faut consulter non ce qu'on fait mais ce qu'on voudrait ») ② social : la mode, la publicité (désirer l'objet désiré par tous : Girard : désir mimétique) ③ politique : la servitude volontaire (La Boétie, 1548 : pourquoi les peuples OBÉISSENT-ils au tyran qui les dépouille ? Parce qu'ils y trouvent des compensations (faveurs, distractions) et qu'ils ignorent leur propre force : le tyran est « fait » par l'obéissance. Piège : l'aliénation n'est pas seulement la contrainte : c'est la CAPTURE du désir (je VEUX ce qu'on me fait vouloir) : la libération ne suffit pas à libérer (il faut réformer le DÉSIR : la critique des « faux besoins » : le sujet bac moderne par excellence).</div>"},
{"t": "La liberté : choisir et agir (Terminale)", "q": "Selon Rousseau, « l'obéissance à la loi qu'on s'est prescrite est liberté » signifie :", "c": ["la liberté est la solitude", "la loi démocratique (que je me suis donnée comme citoyen) ne me dépossède pas : elle est ma volonté GÉNÉRALISÉE", "les lois sont inutiles", "obéir toujours"], "a": 1, "e": "La volonté générale : en obéissant à la loi que le peuple (dont je suis) a faite, j'obéis à MA propre raison collective : autonomie politique.", "d": "<b>La loi démocratique est ma loi généralisée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : quand la loi est faite PAR le peuple (souveraineté : le contrat : chacun donne sa volonté à la volonté GÉNÉRALE : non la somme des égoïsmes, mais le bien commun délibéré), l'obéissance n'est pas la soumission : je suis la règle que ma raison citoyenne a approuvée (autonomie collective) : Rousseau : « à la force, le nom de loi n'appartient pas » (une loi imposée par un maître n'est pas une loi : c'est un ordre) : c'est la fondation de la LÉGITIMITÉ démocratique. Piège : la formule suppose que le processus législatif soit réellement PARTICIPATIF et ÉGAL (sinon « ma loi » devient celle d'un parti qui parle en mon nom) : la question moderne (représentation, contre-pouvoirs) prolonge le débat : le sujet bac « la limite-t-elle ? » se nourrit de cette distinction loi juste/loi imposée.</div>"},
{"t": "La liberté : choisir et agir (Terminale)", "q": "Le dilemme du libre arbitre peut se formuler ainsi :", "c": ["le bien ou le mal", "si tout événement a des causes, mes « choix » sont-ils encore des choix (ou des effets causés que je prends pour des décisions) ?", "manger ou dormir", "voter ou non"], "a": 1, "e": "Déterminisme universel vs expérience du choix : la responsabilité morale (imputer, punir, louer) en dépend : c'est LE dilemme métaphysique.", "d": "<b>Choix ou effets causés ?</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mise en place : ① thèse déterministe : mon cerveau, mes gènes, mon histoire causent ma « décision » (les neurosciences : Libet : le potentiel de préparation précède la conscience du choix) ② l'expérience vécue : je délibère, je pèse, je décide (l'impression forte du choix) : ③ l'enjeu : si le déterminisme est total, la responsabilité morale est-elle un mythe (punir un coupable « causé ») ? Les réponses : compatibilisme (Spinoza, Hume : liberté redéfinie comme action selon ses motifs CONNUS) ou libertarisme (Kant : la liberté est postulée par la morale : le nouménal) : la copie doit PRESENTER le dilemme et discuter les solutions. Piège : la question n'est pas résolue scientifiquement (Libet discuté : la conscience peut « veto ») : dogmatiser dans un sens ou l'autre est une faute philosophique.</div>"},
{"t": "La liberté : choisir et agir (Terminale)", "q": "Constant oppose la liberté des Modernes à celle des Anciens :", "c": ["c'est la même liberté", "les Anciens étaient plus libres", "les Modernes ne sont pas libres", "les Anciens : participation politique DIRECTE (mais vie privée soumise à la cité) ; les Modernes : libertés INDIVIDUELLES (opinion, propriété, commerce) avec représentation"], "a": 3, "e": "Le citoyen athénien vote tout lui-même (mais Socrate est condamné pour ses opinions !) : le moderne délègue (mais jouit des droits privés).", "d": "<b>Anciens : participation directe / Modernes : libertés individuelles</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la double face : le citoyen d'Athènes participe à TOUTES les décisions (liberté politique maximale : l'isegoria : égalité de parole) MAIS la cité contrôle sa vie privée (ostracisme, mœurs : le procès de Socrate : la démocratie directe peut opprimer l'individu) : le moderne jouit de droits protégés (opinion, culte, propriété) mais n'intervient que par REPRÉSENTANTS (Constant, De la liberté chez les Modernes, 1819 : avertissement : le danger moderne est l'apolitisme : jouir en privé pendant que les décisions se prennent ailleurs) : Piège : les deux libertés se COMPLÈTENT (une démocratie moderne qui néglige la participation s'atrophie : une cité qui écrase l'individu se trahit) : c'est le sujet bac parfait « la liberté est-elle une idée moderne ? ».</div>"},
{"t": "La liberté : choisir et agir (Terminale)", "q": "La « servitude volontaire » (La Boétie) décrit :", "c": ["les élections", "l'esclavage légal", "la guerre civile", "le paradoxe des peuples qui OBÉISSENT au tyran sans y être forcés (l'obéissance fabrique le pouvoir)"], "a": 3, "e": "Un seul homme ne peut rien contre tous : si le tyran règne, c'est que les nombreux CONSENTENT (par intérêt, habitude, divertissement) : la liberté se perd par la démission.", "d": "<b>Le consentement des peuples au tyran</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement de La Boétie (Discours de la servitude volontaire, 1548 : écrit à 18 ans !) : le tyran est UN : le peuple est des milliers : pourquoi obéit-il ? ① l'habitude (la première génération se souvient, la deuxième s'habitue, la troisième naît dedans) ② les faveurs (quelques-uns profitent : ils défendent le système : le tyran « s'achète » une cour) ③ les distractions (jeux, spectacles : occuper pour régner) : conclusion : la liberté ne s'enlève pas : elle SE DONNE (par démission) : et elle SE REPREND (par le refus concerté : désobéir, c'est déjà être libre). Piège : le texte n'excuse pas le tyran : il DÉPLACE la question (comment devient-on esclave ? : en ne refusant pas) : c'est la racine de la désobéissance civile moderne (Gandhi, Thoreau).</div>"},
{"t": "La liberté : choisir et agir (Terminale)", "q": "Sartre écrit « l'homme est condamné à être libre » pour dire que :", "c": ["la liberté est facile", "même dans les pires situations, je CHOISIS le sens (y compris refuser : je ne peux pas ne pas choisir)", "la liberté est un château", "il faut suivre les lois"], "a": 1, "e": "Pas de nature humaine qui me programme (« l'existence précède l'essence ») : je suis ce que je fais de ce qu'on a fait de moi : même l'inaction est un choix.", "d": "<b>Impossible de ne pas choisir</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cas limite : l'otage : ses chaînes sont réelles (liberté d'action nulle) mais il lui reste le choix du SENS (se mentir en « croyant » qu'il n'a pas le choix : le tortionnaire l'attend : ou affirmer sa dignité dans le refus intérieur) : Sartre : l'homme se DÉFINIT par ses choix, non par une essence donnée (« condamné » : il ne peut pas se retirer du jeu : l'abstention est une prise de position) : la « mauvaise foi » : se croire obligé (le fonctionnaire « je n'avais pas le choix » : il a choisi de ne pas choisir). Piège : la liberté sartrienne n'est pas l'omnipotence (les situations pèsent : facticité) : c'est l'INCONDITIONNALITÉ de la réinterprétation (choisir ce que les faits signifient pour moi) : sujet de bac : « suis-je ce qu'on a fait de moi ? » (réponse sartrienne : non : je suis ce que j'en fais).</div>"},
{"t": "La liberté : choisir et agir (Terminale)", "q": "Pour Épictète, la clé de la liberté est de :", "c": ["distinguer ce qui dépend de nous (jugements, désirs) de ce qui n'en dépend pas (corps, réputation, richesse)", "gagner de l'argent", "obéir aux dieux", "éviter les autres"], "a": 0, "e": "La dépendance aux choses qui ne dépendent pas de nous EST la servitude : vouloir maîtriser l'immaitrisable = esclavage : l'ataraxie stoïcienne.", "d": "<b>Distinguer dépend de nous / ne dépend pas</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la diction stoïcienne (Manuel, I) : DEPENDENT DE NOUS : le jugement (ce que je pense de l'événement), l'impulsion (ce que je veux), l'assentiment (ce que j'approuve) : NE DÉPENDENT PAS : le corps (maladie), la richesse, la réputation, le pouvoir : les hommes s'asservissent en TENDANT vers le second groupe (être riche, être applaudi : dépend des autres) : le sage place sa volonté dans le premier (juger, vouloir selon la nature) : invincible (chacun peut entraver son corps, pas son jugement : l'esclave Épictète, affranchi, l'écrit de l'intérieur). Piège : le stoïcisme n'est pas du renoncement paresseux (agir reste requis : dans ce qui dépend de nous) : c'est une STRATÉGIE de liberté (concentrer son pouvoir là où il est réel) : c'est la réponse grecque antique au dilemme que Spinoza renouvellera.</div>"},
{"t": "La morale et la justice : fondement et obligation (Terminale)", "q": "L'impératif catégorique kantien exige :", "c": ["d'obéir à la mode", "de suivre ses sentiments", "de plaire", "d'agir selon une maxime que la raison peut vouloir UNIVERSALISER (que vaudrait un monde où chacun agirait ainsi ?)"], "a": 3, "e": "Le test : « agis comme si la maxime de ton action devait être érigée en loi universelle » : la forme de la loi fait la moralité, pas les conséquences.", "d": "<b>L'universalisabilité de la maxime</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test en acte : maxime du menteur : « quand ça m'arrange, je mens » ⟶ universalisée : plus personne ne croit personne (même le menteur n'est pas cru) : la maxime se DÉTRUIT (le mensonge exige la confiance générale qu'il ruine) ⟶ immorale : à l'inverse : « aide autrui en détresse » universalisée tient debout : le test est FORMEL (la cohérence de la volonté), pas empirique (pas de calcul de conséquences). Piège : Kant n'exige pas d'agir « pour le plus grand nombre » (utilitarisme : autre famille) mais de pouvoir se vouloir LOI : deux morales opposées sur le même cas (le mensonge charitable : Kant l'interdit, Mill le permet parfois) : la copie doit montrer le conflit.</div>"},
{"t": "La morale et la justice : fondement et obligation (Terminale)", "q": "L'utilitarisme (Bentham, Mill) juge une action morale selon :", "c": ["sa beauté", "ses CONSÉQUENCES sur le bien-être (maximiser le bonheur du plus grand nombre)", "son intention", "sa tradition"], "a": 1, "e": "Une action est juste si elle produit le plus grand bonheur possible pour le plus grand nombre : le calcul des effets remplace la règle absolue.", "d": "<b>Ses conséquences</b> (le plus grand bonheur du plus grand nombre).<div class='ex-detail'><u>Exemple rédigé</u> : le calcul utilitariste : un mensonge charitable ? Si la vérité brutale détruit le patient (désespoir : aggravation) et que le mensonge prolonge une vie de qualité, l'utilitarisme le PERMET (l'effet compte, non la règle) : révolution éthique : juger par les RÉSULTATS (mesurables : Bentham : l'arithmétique du plaisir) : application politique : les institutions doivent maximiser le bien-être (l'utilité publique fonde les lois). Piège : l'objection classique : la minorité peut être SACRIFIÉE au bonheur du plus grand nombre (l'innocent condamné « pour l'exemple » : si ça calme la ville ? Mill répond : les règles utilitaires à long terme PROSCRIVENT l'injustice (la terreur générale détruit le bien-être) : la discussion fait le sujet de bac.</div>"},
{"t": "La morale et la justice : fondement et obligation (Terminale)", "q": "Selon Aristote, la vertu s'acquiert par :", "c": ["un cours magistral", "un décret", "un don inné", "l'HABITUDE (répéter des actes justes jusqu'à devenir juste : l'excellence du caractère)"], "a": 3, "e": "On devient juste en FAISANT des actes justes (comme on devient bâtisseur en bâtissant) : la morale est un entraînement, guidé par la phronesis (sagesse pratique).", "d": "<b>L'habitude (hexis)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cercle vertueux (Éthique à Nicomaque, II) : l'enfant ne peut être « moral » par théorie (il n'a pas l'expérience) : il fait des actes justes PAR IMITATION (parents, lois de la cité : l'habitude) : le PLAISIR de bien faire apparaît (le vertueux JOUIT d'agir bien : sinon ce n'est pas encore la vertu) : la phronesis juge le CAS (le courage juste : ni lâcheté ni témérité : le JUSTE MILIEU relatif à nous) : l'éthique est un artisanat de soi (excellence : arete). Piège : la morale aristotélicienne n'est ni absolutiste (règles universelles : Kant) ni calculatrice (utilitarisme) : elle est FORMATIVE (devenir le genre de personne qui agit bien) : le sujet de bac « peut-on apprendre à être moral ? » reçoit ici sa réponse la plus forte.</div>"},
{"t": "La morale et la justice : fondement et obligation (Terminale)", "q": "La désobéissance civile (Thoreau, Gandhi, King) se justifie quand :", "c": ["la loi coûte cher", "on perd une élection", "on n'aime pas une loi", "la loi est MORALEMENT injuste et la désobéissance est publique, non-violente, argumentée (acceptant la sanction)"], "a": 3, "e": "Désobéir POUR rendre témoignage (éveiller la conscience de la majorité) : le refus de la ségrégation (Rosa Parks), la marche du sel : la loi injuste n'a pas de titre moral, même si elle reste légale.", "d": "<b>Loi injuste : désobéissance publique et non-violente</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme (King, Lettre de la prison de Birmingham, 1963) : une loi juste est « faite par l'homme : selon la loi éternelle/morale » : une loi SÉGRÉGATIONNISTE impose (la majorité commande) sans être égalitaire : MORALEMENT nulle : la désobéissance civile : briser la loi PUBIQUEMENT (pas en cachette : on veut être VU : l'arrestation témoigne), NON-VIOLEMMENT (le corps offensé sans offenser : éveiller la conscience de l'adversaire), en ACCEPTANT la sanction (montrer le respect de la règle de droit général : ce n'est pas l'anarchie) : Gandhi : la marche du sel (1930) : briser le monopole britannique en ramassant le sel de mer : des milliers arrêtés : l'Empire ébranlé. Piège : la désobéissance civile n'est pas la révolte privée ni la violence : elle est un APPEL à la justice rendu visible par la souffrance consentie : elle présuppose un État de droit qu'elle veut AMÉLIORER (et non détruire).</div>"},
{"t": "La morale et la justice : fondement et obligation (Terminale)", "q": "Le « voile d'ignorance » de Rawls sert à :", "c": ["trouver les règles justes en raisonnant SANS savoir quelle place on occupera dans la société (ni riche ni pauvre)", "dormir", "tromper l'examinateur", "cacher la vérité"], "a": 0, "e": "Derrière le voile, personne ne peut biaiser les règles en sa faveur : l'équité procédurale (position originelle) produit des principes justes.", "d": "<b>Raisonner sans connaître sa place sociale</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la procédure : imaginez choisir la structure de votre société AVANT de naître (vous ignorez : talents, famille, sexe, fortune : le voile) : ① vous exigerez des libertés de base ÉGALES pour tous (si je suis minoritaire, je veux être protégé) ② vous tolérerez les inégalités économiques SEULEMENT si elles bénéficient aux plus défavorisés (je pourrais être pauvre : je veux que la richesse « déborde » sur moi : le principe de différence) : c'est un CONTRAT d'équité (le choix sous incertitude produit le juste : pas l'égoïsme). Piège : Rawls ne promeut pas l'égalitarisme absolu : il ORDONNE les principes (liberté d'abord : on ne peut pas « acheter » les droits) : c'est un cadre parfait pour les sujets « justice sociale », « égalité et équité », « l'école doit-elle être égale ? ».</div>"},
{"t": "La morale et la justice : fondement et obligation (Terminale)", "q": "L'égalité « devant la loi » et l'égalité « des conditions » sont :", "c": ["contraires", "identiques", "distinctes : la première (formelle) garantit les mêmes droits ; la seconde (matérielle) viserait la même situation pour tous", "religieuses"], "a": 2, "e": "La France républicaine garantit la 1re (principe : les mêmes règles pour tous) : la 2e exigerait la redistribution jusqu'à l'homogénéité des situations (autre débat : Tocqueville l'observait comme tendance des sociétés démocratiques).", "d": "<b>Formelle ≠ matérielle</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la nuance en acte : l'école publique donne à tous les MÊMES examens (égalité formelle : droits égaux) MAIS les élèves n'arrivent pas égaux (livres à la maison, cours particuliers : inégalités de conditions) : la politique éducative peut CORRIGER (égalité des chances : bourses, internats d'excellence, quotas discutés : équité : donner plus à ceux qui ont moins) : le débat : jusqu'où corriger sans casser la liberté (l'excellence ? le mérite ?) ? Piège : l'équité (traiter DIFFÉREMMENT pour égaliser) n'est pas une trahison de l'égalité : c'est sa mise en œuvre intelligente (Aristote : « traiter les égaux également et les inégaux différemment… proportionnellement » : la justice distributive) : c'est LE sujet de bac sur l'égalité.</div>"},
{"t": "La morale et la justice : fondement et obligation (Terminale)", "q": "Punir un coupable « pour l'exemple » (pour calmer la société) est moralement :", "c": ["dangereux selon Kant (punir l'individu comme MOYEN de l'ordre social contredit la dignité : la personne n'est jamais un simple moyen)", "obligatoire", "interdit par la physique", "toujours juste"], "a": 0, "e": "Kant : la punition est juste seulement si le coupable la MÉRITE (rétribution : la loi morale rend le châtiment proportionné) : le punir pour l'UTILITÉ générale fait de lui un instrument.", "d": "<b>Indigne selon Kant (la personne n'est pas un moyen)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cas d'école (critique kantienne de Beccaria) : supposons qu'exiler publiquement un innocent calme une émeute (l'utilitarisme pur pourrait le tolérer si le calcul est bon) : Kant : IMPOSSIBLE (l'homme ne peut jamais être sacrifié comme MOYEN : la dignité n'a pas de prix) : la punition n'est JUSTE que si elle répond à une FAUTE (rétribution : le lien moral entre faute et peine) : MAIS le débat utilitariste existe : la dissuasion sauve des vies (Bentham : « toute punition est un mal : elle ne se justifie que si elle exclut un plus grand mal ») : les systèmes réels MÉLANGENT (la peine répond à la faute ET vise la réinsertion) : la copie analyse les LOGIQUES (et leurs tensions). Piège : dissuader sans punir ressort du calcul : punir sans faute ressort de la force : la peine juste exige la FAUTE (le lien moral).</div>"},
{"t": "La morale et la justice : fondement et obligation (Terminale)", "q": "La morale et le droit peuvent s'OPPOSER quand :", "c": ["le juge dort", "la loi est neuve", "une loi valide (légale) contredit la conscience morale (lois de Vichy, ségrégation) : le droit n'est pas toujours juste", "jamais"], "a": 2, "e": "« Légal » n'est pas « légitime » : la résistance (juste) à la loi injuste (Sophie Scholl, les Justes) fonde la supériorité éventuelle de la morale sur le droit positif.", "d": "<b>La loi légale peut être moralement injuste</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cas extrême : sous Vichy, la loi EXIGEAIT de livrer les Juifs (statut des Juifs, 1940 : légal au sens formel : voté, publié) : les « Justes » ont DÉSOBÉI (cacher, sauver : au péril de leur vie : Sophie Scholl : « la loi du cœur contre la loi de l'État ») : le procès de Nuremberg (1945) : le tribunal juge des actes LÉGAUX selon le droit allemand : le principe : il existe un droit SUPÉRIEUR (droit naturel/humanité) au-dessus du droit positif (« obéissance aux ordres » n'excuse pas : hier comme au procès d'Eichmann : Arendt). Piège : la doctrine « droit naturel » (il y a des lois non écrites : Antigone : « les lois non écrites des dieux » contre Créon) fonde la résistance MAIS doit être mani avec prudence (qui décide de la « vraie » morale ?) : c'est pourquoi la désobéissance civile est ENCADRÉE (publique, non-violente : assumant la sanction : King) : la discussion est le cœur du chapitre.</div>"},
{"t": "La morale et la justice : fondement et obligation (Terminale)", "q": "Le principe kantien selon lequel la personne humaine ne doit jamais être traitée :", "c": ["comme un enfant", "avec gentillesse", "comme un citoyen", "comme un simple MOYEN mais toujours EN MÊME TEMPS comme une FIN (dignité : ce qui a un prix s'échange : ce qui a une dignité vaut sans équivalent)"], "a": 3, "e": "L'humanité, en moi comme en autrui, a une DIGNITÉ (valeur inconditionnelle) : fonde les droits de l'homme et l'interdiction de l'esclavage, de la torture.", "d": "<b>Jamais seulement comme un moyen</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la formule de l'humanité (Fondements de la métaphysique des mœurs, 1785) : « agis de telle sorte que tu traites l'humanité, aussi bien dans ta personne que dans toute autre, EN MÊME TEMPS comme une fin, et jamais simplement comme un moyen » : distinction : ce qui a un PRIX (échangeable : une chaussure, un salaire) / ce qui a une DIGNITÉ (au-dessus de tout prix : incommensurable) : applications : l'esclavage (l'homme vendu = chosifié : interdit absolu), la torture (le corps forcé pour extraire une information : pur moyen), le mensonge (la victime manipulée : son consentement rationnel contourné) : même le TRAVAIL doit rester un rapport de personnes (contrat : jamais pur outil). Piège : « en même temps comme une fin » : Kant n'interdit pas d'employer autrui comme moyen (le boulanger me vend du pain : chacun est moyen des échanges) : il interdit d'abandonner la reconnaissance de sa dignité (payer, respecter, ne pas tromper) : la nuance sauve la doctrine d'une caricature.</div>"},
{"t": "La morale et la justice : fondement et obligation (Terminale)", "q": "La différence entre égalité et équité est :", "c": ["nulle", "l'égalité applique la MÊME règle à tous ; l'équité ADAPTE (donner plus à ceux qui partent avec moins pour égaliser réellement)", "l'équité est sportive", "l'égalité est illégale"], "a": 1, "e": "L'égalité formelle (même traitement) peut PRODUIRE des inégalités réelles (des examens égaux pour des inégalités de départ) : l'équité corrige.", "d": "<b>Même règle / traitement adapté</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'image classique (le « voile d'ignorance » déjà vu : et l'équité d'Aristote : la justice CORRECTIVE) : une course : égalité formelle : tout le monde part de la même ligne ? Mais l'un a des chaussures, l'autre pas : équité : donner des chaussures à celui qui n'en a pas (l'aide n'est pas un privilège : c'est la correction d'un désavantage) : l'école : le soutien renforcé, les bourses : la santé : la protection maladie universelle (payer selon ses moyens, recevoir selon ses besoins) : le débat politique : où s'arrête la correction (et où commence l'écrasement des mérites ?) ? Piège : l'équité n'est pas une préférence arbitraire : c'est une EXIGENCE de l'égalité réelle (sans elle, l'égalité formelle consacre les écarts de départ) : le sujet « l'égalité est-elle juste ? » reçoit ici sa clé : préciser DE QUELLE égalité on parle.</div>"},
{"t": "Le bonheur : bien vivre et plaisir (Terminale)", "q": "Selon Épicure, la condition du bonheur est :", "c": ["l'ATARAXIE (absence de trouble de l'âme) obtenue en limitant les désirs aux NATURELS ET NÉCESSAIRES", "de satisfaire tous les désirs", "de devenir riche", "de souffrir"], "a": 0, "e": "Le bonheur est la tranquillité (corps sans douleur : aponie : âme sans trouble : ataraxie) : d'où la triade des désirs et le calcul.", "d": "<b>L'ataraxie par la limitation des désirs</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la méthode du Jardin (Lettre à Ménécée) : classer les désirs : ① NATURELS ET NÉCESSAIRES (boire, manger, l'amitié : à satisfaire simplement : l'eau et le pain suffisent : la frugalité) ② NATURELS NON NÉCESSAIRES (mets raffinés : à modérer : ils trouble) ③ VAINS (richesse, gloire, immortalité : à ABANDONNER : ils sont sans limite et empoisonnent) : résultat : le corps apaisé, l'âme sans peur (la mort n'est rien : « quand nous sommes, la mort n'est pas là ») : le bonheur épicurien est SOBRE et AMICAL (le jardin : la communauté : l'amitié comme « le plus grand bien »). Piège : Épicure n'est PAS l'hédoniste vulgaire (le mythe du « ripailleur » : il mange du pain et de l'eau : il refuse la débauche QUI TROUBLE) : c'est le paradoxe : un hédonisme ascétique (le plaisir par la tempérance).</div>"},
{"t": "Le bonheur : bien vivre et plaisir (Terminale)", "q": "La « joie » au sens de Spinoza se définit comme :", "c": ["une surprise", "un devoir", "un divertissement", "le PASSAGE à une plus grande perfection (augmentation de notre puissance d'agir et de penser)"], "a": 3, "e": "La joie est ACTIVE : elle mesure l'accroissement de notre puissance (apprendre, créer, aimer : comprendre augmente la joie) : à distinguer de la passive « joie » de la chance.", "d": "<b>Le passage à une plus grande puissance</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la définition (Éthique, III) : la joie = « le passage de l'homme d'une moindre à une plus grande perfection » : le test : quand je COMPRENDS un problème (l'illumination : l'idée s'assemble : je deviens plus capable : la joie est l'AFFECT de cette croissance) : contre la pseudo-joie passive (l'ivresse : la loterie : un état SUBI qui ne m'augmente pas : une modification sans puissance) : la joie véritable SIGNALE que je deviens plus moi-même (l'activité : comprendre, créer, agir en accord avec sa nature). Piège : le bonheur spinoziste n'est pas un bien-être végétatif : c'une VIE ACTIVE en joies croissantes (l'amour intellectuel de Dieu/nature : la béatitude du sage qui comprend la nécessité) : plus près de « épanouissement » que de « détente ».</div>"},
{"t": "Le bonheur : bien vivre et plaisir (Terminale)", "q": "Selon Kant, le bonheur ne peut pas être le but de la morale parce que :", "c": ["il coûte cher", "il est indéfinissable (un « idéal de l'imagination » : chacun le veut sans savoir précisément ce qu'il veut)", "il est collectif", "il est interdit"], "a": 1, "e": "Impossible de légiférer universellement vers un but que personne ne peut définir : la morale vise le DEVOIR (l'être digne du bonheur), le bonheur suit selon la vie.", "d": "<b>Indéfinissable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'argument (Fondements…) : le concept de bonheur est EMPIRIQUE (composé d'éléments sensibles variables : la santé ? l'honneur ? l'argent ? chacun change) : « l'idéal n'est pas un concept de la raison mais de l'IMAGINATION » : nul ne peut déterminer SÛREMENT ce qui le rendra heureux (le médicament guérit et ruine la santé ? la richesse apporte les soucis) : une loi morale ne peut pas prescrire un but si indéterminé : elle prescrit l'universalisable (le devoir) : d'où l'expression célèbre : « être HEUREUX est nécessairement l'aspiration de tout être raisonnable fini, mais la moralité consiste à être DIGNE du bonheur » : la dignité d'abord, la récompense ensuite (et même pas garantie). Piège : Kant ne méprise pas le bonheur (il le veut aussi) : il REFUSE d'en faire la FONDATION de la morale (le fondement est la forme de la loi : la dignité) : le débat avec l'eudémonisme (le bien = le bonheur) structure les deux grandes traditions éthiques.</div>"},
{"t": "Le bonheur : bien vivre et plaisir (Terminale)", "q": "Pour Aristote, le bonheur (eudaimonia) est :", "c": ["un hasard", "une ACTIVITÉ de l'âme conforme à la vertu (vivre en exerçant l'excellence : dans une vie complète)", "un état passif", "un don des dieux seulement"], "a": 1, "e": "Le bonheur n'est pas une sensation, c'est une manière de VIVRE (l'agir excellent de l'homme raisonnable : la contemplation au sommet : appuyée sur les biens extérieurs : santé, amis, cité).", "d": "<b>Une activité vertueuse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la définition (Éthique à Nicomaque, I) : « le bonheur est une activité de l'âme CONFORME À LA VERTU » (et si plusieurs vertus : la meilleure : la contemplation : l'activité de notre partie la plus haute : l'intellect) : le bonheur est UN AGIR (pas un état : pas le plaisir : le plaisir accompagne l'activité parfaite : « le plaisir complète l'activité comme la fleur de la jeunesse ») : il exige une VIE COMPLÈTE (une hirondelle ne fait pas le printemps : on ne juge heureux qu'au terme) et des biens extérieurs MINIMAUX (l'ami, la santé : le bonheur n'est pas autarcie totale). Piège : Aristote contre l'illusion contemporaine : le bonheur n'est ni une émotion ni une possession : c'est une PRATIQUE de vie (l'excellence exercée) : les « recettes » du développement personnel retrouvent parfois cette leçon (le flow : l'engagement actif) : l'exploiter en copie est un argument fort.</div>"},
{"t": "Le bonheur : bien vivre et plaisir (Terminale)", "q": "Le « paradoxe hédoniste » enseigne que :", "c": ["le plaisir croît quand on le cherche", "le bonheur est physique", "la joie est pécheresse", "viser le plaisir directement le détruit (le plaisir est un sous-produit d'activités investies : Mill)"], "a": 3, "e": "Ceux qui « chassent » le bonheur le ratent : il vient pendant que l'esprit est ailleurs (absorbé par une œuvre, un lien, une tâche) : la poursuite directe est un mauvais protocole.", "d": "<b>Le bonheur fuit la poursuite directe</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le constat de Mill (autobiographie) : la question posée « suis-je heureux ? » suffit à fermer la parenthèse (l'interrogation est un ANTIDOTE du bonheur : il faut un objet qui ABSORBE : la réflexion devient dépressive quand elle se prend pour but) : la psychologie contemporaine confirme : le « flow » (Csikszentmihalyi : l'immersion active : l'escalade, le jeu, la création) produit le sentiment de plénitude LÀ où l'on oublie de le chercher. Piège : le paradoxe n'est pas une condamnation du bonheur : c'est un CONSEIL DE MÉTHODE : viser les ACTES qui le produisent (l'engagement, l'amitié, la vertu : Aristote : la question du « comment » est plus féconde que la quête de l'état) : sujet de bac type : « le bonheur se cherche-t-il ? » : réponse : indirectement.</div>"},
{"t": "Le bonheur : bien vivre et plaisir (Terminale)", "q": "Le stoïcien place le bonheur dans :", "c": ["la VERTU seule (ce qui dépend de nous) : le bonheur suit la vertu, jamais les biens extérieurs (qui ne dépendent pas de nous)", "la santé", "la gloire", "la richesse"], "a": 0, "e": "Épictète, Marc Aurèle : la vertu (le bon jugement) suffit : les biens extérieurs sont « indifférents » (préférables, mais non nécessaires) : invincible, le sage est heureux par sa seule rectitude.", "d": "<b>La vertu seule</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le dogme stoïcien : seuls les actes de la volonté (jugement, assentiment) sont des BIENS (le reste : corps, richesse, réputation : des indifférents « préférables » : la santé vaut mieux que la maladie… mais ne conditionne PAS le bonheur) : d'où le sage est heureux MÊME dans la tempête (la vertu ne dépend que de lui : Épictète : la jambe malade du sage) : la sagesse = l'indépendance morale (distinguer dépend de nous/ne dépend pas) : le bonheur est l'harmonie de la volonté avec la nature des choses. Piège : le stoïcisme n'est pas un renoncement à AGIR (les devoirs sociaux demeurent : Marc Aurèle empereur et philosophe : agir sans être troublé par l'issue) : c'est une THÉRAPEUTIQUE du jugement (les troubles viennent des jugements faux : « ce ne sont pas les choses qui troublent, mais les jugements sur les choses » : Épictète : le fameux manuel) : les thérapies cognitives et comportementales modernes s'en réclament.</div>"},
{"t": "Le bonheur : bien vivre et plaisir (Terminale)", "q": "Le bonheur est-il un droit que l'État doit garantir ?", "c": ["la Déclaration d'indépendance américaine vise la POURSUITE du bonheur (le droit de chercher), pas son résultat (l'État garantit les conditions, pas l'état d'âme)", "oui absolument", "non jamais", "seulement en été"], "a": 0, "e": "Le droit garantit les LIBERTÉS (poursuivre) : nul ne peut garantir l'état intérieur : confondre les deux mène à l'État « bonheur officiel » (dangereux : il impose sa définition).", "d": "<b>La poursuite, pas le résultat</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la nuance juridico-philosophique : le droit protège des CONDITIONS (liberté, sécurité, propriété : le cadre où chacun cherche à sa manière) : l'état de bonheur est SUBJECTIF (l'État ne peut ni le fabriquer ni le vérifier : « le bonheur est un concept de l'imagination » : Kant) : le danger inverse : un État qui promet le bonheur (les totalitarismes : « le peuple heureux » imposé : les récits obligatoires du sourire) : la leçon libérale : l'État donne les MOYENS (éducation, santé : les « capacités » : Sen), pas la finalité vécue. Piège : l'objection moderne : l'État DOIT-il s'occuper des conditions de bien-être (l'économie du bonheur : le PIB vs le BNB du Bhoutan) ? La discussion publique existe : mais elle porte sur les CONDITIONS (réduire la misère : le malheur évitable), pas sur l'état d'âme : c'est exactement ce que la copie doit distinguer.</div>"},
{"t": "Le bonheur : bien vivre et plaisir (Terminale)", "q": "L'objection majeure contre l'hédonisme (« vivre pour le plaisir ») est :", "c": ["le plaisir est cher", "le plaisir est privé", "les plaisirs intempérants engendrent leurs propres douleurs (le calcul : certains plaisirs coûtent plus qu'ils ne donnent) et l'insatiabilité rend esclave", "le plaisir est ancien"], "a": 2, "e": "Socrate contre Calliclès (Gorgias) : la vie de démesure est un TONNEAU PERCÉ : plus on remplit, plus il fuit : la tempérance est plus savoureuse que l'excès.", "d": "<b>L'excès s'auto-détruit</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le dialogue du Gorgias : Calliclès : « l'homme plein de désirs, qui sait les satisfaire, c'est la vraie vie » (l'intempérance comme vigueur) : Socrate : ① la comparaison du tonneau : une âme indisciplinée est un PERCÉ : remplir (jouir) sans cesse exige de remplir TOUJOURS (l'esclavage du désir : la dépendance) ② les douleurs attachées (le lendemain de la fête : la maladie : la ruine) ③ la mesure (l'harmonie musicale de l'âme ordonnée : la vraie joie est dans la tempérance) : Épicure radicalisera : c'est le CALCUL du plaisir (intensité x durée x douleur évitée) qui distingue le sage du glouton. Piège : la condamnation du plaisir brut n'est pas une détestation du corps (Épicure : le plaisir EST le début et la fin de la vie heureuse) : c'est une QUESTION DE STRATÉGIE (quel plaisir : à quel prix : durable ?) : le sujet « faut-il se méfier du plaisir ? » reçoit ici les deux voix.</div>"},
{"t": "Le bonheur : bien vivre et plaisir (Terminale)", "q": "Le « conditionnel du bonheur » (« je serai heureux quand… ») est un piège parce que :", "c": ["il est grammatical", "l'esprit repousse sans cesse la condition atteinte (l'objectif atteint devient la nouvelle ligne de départ : la comparaison et l'insatisfaction se déplacent)", "la langue française l'interdit", "il est trop court"], "a": 1, "e": "L'« avoir plus » devient un « toujours plus » : la niveau de base psychologique (l'adaptation hédonique : la loterie et les paraplégiques reviennent à la baseline : Brickman) documente l'illusion.", "d": "<b>La cible recule indéfiniment</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le protocole : ① « je serai heureux QUAND j'aurai ce diplôme » : l'obtenu ⟹ « oui, mais il me faut ce poste » ② obtenu ⟹ « cette voiture, cette maison » : la référence saute toujours (l'adaptation hédonique : chaque gain devient la nouvelle norme : il n'est plus un plaisir mais une simple norme) : la publicité CULTIVE exactement ce décalage (le désir maintenu par le manque permanent) : les philosophies antiques répondent : ① Épicure : vérifier si le désir est naturel ET nécessaire (la plupart des « quand » sont vains) ② Stoïciens : se déprendre du jugement « il me FAUT » (la richesse ne dépend pas de nous) ③ Spinoza : comprendre le mécanisme (le désir est la conscience d'une conatus : l'orgueilleux est l'esclave d'une image). Piège : la réponse n'est PAS de ne rien vouloir (la vie est conatus : désirer est être) : c'est de désirer CLAIREMENT (savoir pourquoi, pour quoi : ajuster le désir à la nature : le sage est l'homme du désir bien fondé).</div>"},
{"t": "Le bonheur : bien vivre et plaisir (Terminale)", "q": "L'amitié, selon Épicure et Aristote, contribue au bonheur parce qu'elle :", "c": ["est utile pour affaires", "donne du pouvoir", "est à la mode", "est un bien qui s'exerce et se partage : activité commune (vivre ensemble, penser ensemble : les plaisirs les plus sûrs : les plus durables)"], "a": 3, "e": "Le Jardin d'Épicure est une communauté d'amis : « de tout ce que la sagesse procure, le plus grand bien est l'acquisition de l'amitié » : le bonheur est RELATIONNEL.", "d": "<b>Une activité partagée, durable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'argument double : ① Épicure : l'amitié sécurise (l'aide : la confiance) et surtout elle JOUIT (vivre entre amis : la conversation : le pain partagé vaut un festin solitaire) : ② Aristote : l'ami est « un autre soi-même » (le bien de l'ami voulu POUR LUI : la vertu commune : la vie contemplative se partage) : le bonheur exige l'ami car l'homme est un « animal politique » (il s'accomplit EN commun : même le sage a besoin d'amis pour EXERCER sa bonté) : la confirmation moderne : les études sur le bien-être (Harvard : la 1re variable : la QUALITÉ des relations, avant l'argent et la gloire). Piège : le « bonheur solitaire » (l'indépendance totale) est une idée reçue fragile : même les tenants de la sagesse solitaire (les cyniques… à leur chien !) écrivent à leurs amis : la condition humaine du bonheur est CONVIVIALE : c'est le contre-argument des « possessions » (l'avoir n'accompagne pas : l'ami, si).</div>"},
{"t": "L'art : créer, interpréter, juger (Terminale)", "q": "Selon Platon, l'art est une copie de copie parce que :", "c": ["il coûte cher", "le peintre imite les objets, qui sont eux-mêmes des imitations des Idées (le lit peint : 3e degré après le lit de l'ébéniste et l'Idée du lit)", "il est moderne", "il est subjectif"], "a": 1, "e": "Le monde sensible imite les Idées : l'art imite le sensible : double éloignement de la vérité : d'où la défiance platonicienne (l'artiste « éloigné de trois degrés »).", "d": "<b>Copie de copie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la fable des trois lits (République, X) : ① l'IDÉE du lit (le modèle éternel : créé par le dieu) ② le LIT DE L'ÉBÉNISTE (copie de l'Idée : usage réel) ③ le LIT PEINT (imitation de l'apparence du lit : trompe l'œil : sans usage ni vérité) : le peintre fait « des apparitions » : l'art éloigne de la vérité ET corrompt (la poésie flatte la partie irrationnelle de l'âme : les poètes sont chassés de la cité juste… sauf les poètes « utiles »). Piège : Platon n'est pas un « brûleur d'art » nihiliste : il INFLIGE une exigence à l'art (l'art doit servir la vérité et la cité : la querelle philosophie/poésie) : Aristote répondra par la CATHARSIS (l'art purge au lieu de corrompre) : le couple Platon/Aristote structure toute dissertation sur l'art « utile ou dangereux ».</div>"},
{"t": "L'art : créer, interpréter, juger (Terminale)", "q": "La catharsis aristotélicienne désigne :", "c": ["la PURGE des passions opérée par la représentation (la tragédie fait éprouver peur et pitié à distance : le spectateur s'en libère)", "une méthode de nettoyage", "un genre musical", "un prix"], "a": 0, "e": "Tragédie = mimèsis + épuration : éprouver à distance (fiction) purge et éduque les émotions : l'art fait du bien psychologique (contre Platon).", "d": "<b>La purge des passions par la représentation</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme (Poétique) : la tragédie représente des actions terribles (Œdipe : l'inceste : la reconnaissance : la péripétie) : le spectateur ressent PEUR (pour soi : voilà ce qui pourrait m'arriver) et PITIÉ (pour le héros) : ces émotions à DISTANCE (théâtrale : sans danger réel) trouvent leur « décharge » (la katharsis : purgation médicale du terme) : le retour au calme est une HYGIÈNE émotionnelle : l'art n'est pas la corruption platonicienne : c'est un APPRENTISSAGE du pathos (éprouver juste, à dose, en sûreté). Piège : la catharsis n'est pas un « divertissement » creux (le plaisir tragique est spécifique : celui de la compréhension et de la décharge) : et elle suppose la BONNE fabrication (l'intrigue bien nouée : la mimesis sérieuse) : c'est la première grande théorie de la fonction psychologique de l'art.</div>"},
{"t": "L'art : créer, interpréter, juger (Terminale)", "q": "Selon Kant, le jugement « c'est beau » se distingue de « ça me plaît » en ce qu'il :", "c": ["PRÉTEND à l'universel (je réclame l'assentiment des autres sans pouvoir le démontrer)", "est religieux", "est démontrable", "est privé"], "a": 0, "e": "Le jugement de goût est « sans concept » (pas de règle qui prouve la beauté) mais « désintéressé » et « universel sans preuve » : voilà le paradoxe du beau.", "d": "<b>Universel sans preuve</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison : « ce gâteau me plaît » (agréable : purement subjectif : nul débat : chacun son goût) vs « ce tableau est beau » (je m'ÉTONNE qu'on ne le voie pas : je DISCUTE : je produis des RAISONS sans preuve : l'équilibre, la couleur) : le jugement de goût est DÉSINTÉRESSÉ (je ne veux pas posséder/consommer : je contemple) et prétend valoir pour tout homme (l'assentiment réclamé) : c'est pourquoi la critique d'art EXISTE (on argumente sans démontrer : la « critique » au sens kantien) : la beauté fonde une COMMUNAUTÉ de sentiment à construire, pas une donnée. Piège : Kant ne dit pas que le beau est OBJECTIF (démontrable) : il dit que sa prétention est universelle : le sujet de bac « le goût est-il subjectif ? » doit faire ce détour (subjectivité qui dialogue).</div>"},
{"t": "L'art : créer, interpréter, juger (Terminale)", "q": "Le ready-made de Duchamp (Fontaine, 1917) défend l'idée que :", "c": ["la sculpture est morte", "il faut copier la nature", "l'art peut être un GESTE de désignation (le choix + le contexte créent l'œuvre : l'urinoir exposé questionne l'art)", "tout objet industriel est beau"], "a": 2, "e": "L'objet est banal : le geste (choisir, signer, exposer) déplace la question : qu'est-ce qui fait l'art ? (l'institution et l'idée : Danto : l'atmosphère théorique).", "d": "<b>Le geste de désignation</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'analyse : ① l'objet : un urinoir en porcelaine ACHETÉ (série industrielle : identique) ② le geste : signature « R. Mutt », titre « Fontaine », SOUMISSION à une exposition (la Société des artistes indépendants : qui refusa… alors que son règlement interdisait de refuser !) ③ l'œuvre EST le geste : une PROPOSITION théorique (« si ceci est exposé, qu'est-ce qui fait l'art ? ») : l'esthétique analytique (Danto : « le monde de l'art ») : un même objet change de statut par le contexte et la théorie. Piège : le ready-made ne dit pas « tout se vaut » : il dit que la question de l'art s'est DÉPLACÉE (de l'objet : habileté : beauté : vers le concept : l'intention : la question) : cent ans plus tard, l'art contemporain vit dans cet élargissement : le sujet bac « l'artiste est-il un artisan ? » reçoit ici sa réponse moderne : non plus seulement une habileté, une PROPOSITION.</div>"},
{"t": "L'art : créer, interpréter, juger (Terminale)", "q": "Selon Bourdieu, le goût « naturel » pour les œuvres légitimes est :", "c": ["un hasard", "inné", "un don", "une CONSTRUCTION SOCIALE (la familiarité avec l'art dépend du milieu : le goût est une « distinction » de classe)"], "a": 3, "e": "La « vérité du goût » cache une sociologie : les codes (le musée, le lexique, la posture « naturelle ») s'acquièrent dans les familles et l'école : l'ouvrier se sent « déplacé » au musée : c'est un effet de classe, pas un manque d'âme.", "d": "<b>Une construction sociale</b> (la distinction).<div class='ex-detail'><u>Exemple rédigé</u> : la démonstration (La Distinction, 1979) : l'enquête : les pratiques (musées, jazz vs variétés, lectures) se répartissent selon l'origine sociale : la « disposition esthétique » (l'art pour l'art : la distance au fonctionnel) s'apprend (le foyer lettré, les études) : le goût légitime s'impose comme « naturel » alors qu'il est un CAPITAL (culturel : accumulé : transmis) : l'effet : l'ouvrier « de goût simple » n'est pas moins doué : il est MOINS ÉQUIPPÉ (il n'a pas les codes : la photographie « de prestige » : le vocabulaire : la tranquillité du « c'est fait pour moi ») : le snobisme est l'illusion d'un don qui est un héritage. Piège : Bourdieu ne dit pas que l'art est « un complot de riches » : il DÉNATURALISE le goût (l'accès : l'éducation : l'effort politique de démocratisation culturelle ont un SENS) : c'est le contrepoint sociologique du chapitre kantien (l'universalité RÉCLAMÉE vs ses conditions SOCIALES réelles) : une discussion bac type.</div>"},
{"t": "L'art : créer, interpréter, juger (Terminale)", "q": "L'« expression » comme théorie de l'art (Van Gogh, l'expressionnisme) dit que :", "c": ["l'art est un métier sans âme", "l'art doit copier", "l'art est un calcul", "l'œuvre MANIFESTE une intériorité (l'émotion, la vision de l'artiste : la forme est le corps du vécu : « l'art est l'homme ajouté à la nature »)"], "a": 3, "e": "Le tournesol de Van Gogh ne « ressemble » pas seulement : il TRANSMET la ferveur du regard : la subjectivité devient visible (la « expression » : Croce : l'intuition exprimée).", "d": "<b>L'œuvre manifeste une intériorité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cas Van Gogh : les tournesols : les cyprès tourmentés : la chambre simple rendue BRÛLANTE (les couleurs : la torsion des coups de pinceau : l'empâtement) : la « ressemblance » photographique importe peu : ce qui PASSE est le vécu (l'ardeur : la détresse : l'éblouissement de la lumière du midi) : la théorie de l'expression (l'expressionnisme : Munch : le Cri : l'intériorité CRIE par la forme) : « l'art est l'homme ajouté à la nature » (Van Gogh : lettres à Theo : la nature peinte est la nature + le peintre). Piège : l'expression n'est pas la simple « émotion lâchée » (le gribouillage nerveux n'exprime rien s'il n'ORGANISE pas : la forme fait l'expression : Tolstoï : l'art infecte par la sincérité ET la maîtrise) : c'est le sujet « l'artiste exprime-t-il ou transforme-t-il ? » (l'expression est un TRAVAIL, pas une transpiration).</div>"},
{"t": "L'art : créer, interpréter, juger (Terminale)", "q": "La « forme signifiante » (Clive Bell) désigne :", "c": ["un style de danse", "l'organisation des formes (lignes, couleurs, sons) qui PROVOQUE l'émotion esthétique indépendamment de toute représentation", "un formulaire administratif", "un timbre fiscal"], "a": 1, "e": "Ce qui émeut dans un tableau, ce n'est pas « l'histoire racontée » mais la structure formelle : d'où la légitimité de l'art ABSTRAIT (qui ne représente rien).", "d": "<b>L'organisation formelle émouvante</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le pari de Bell (Art, 1914) : pourquoi des toiles non figuratives (Cézanne : les nus déjà presque abstraits : puis Kandinsky, Mondrian : les compositions) nous émeuvent-elles ? Parce que la COMBINAISON des formes (relations spatiales : rythmes : couleurs) touche une sensibilité esthétique QUI N'A PAS BESOIN D'HISTOIRE (le sujet « chrétien » du tableau de la Renaissance n'est pas ce qui émeut : la structure formelle l'est) : la théorie JUSTIFIE l'art moderne (l'abstraction n'est pas un manque : elle est la mise à nu du puissant formel). Piège : la théorie a ses limites (la « signification » des formes reste mystérieuse : Bell avoue ne pas pouvoir l'expliquer) et néglige l'HISTOIRE de l'art (contenu : contexte : intention) : la copie doit l'utiliser comme UNE théorie (fructueuse pour l'abstraction) parmi d'autres (imitation : expression).</div>"},
{"t": "L'art : créer, interpréter, juger (Terminale)", "q": "L'art « désintéressé » (Kant) signifie que :", "c": ["l'art est gratuit donc inutile", "l'art n'intéresse personne", "l'art ne doit pas être vendu", "la contemplation esthétique ne vise NI possession NI consommation (je peux admirer ce que je ne veux pas avoir : le beau se contemple)"], "a": 3, "e": "Le désintérêt distingue le beau de l'agréable ET de l'utile : la contemplation libre (le « libre jeu » de l'imagination et de l'entendement) fait la spécificité esthétique.", "d": "<b>Contempler sans vouloir posséder ni consommer</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test : un tableau DANS un musée (contemplation : je peux rester une heure sans l'acheter ni le manger : le désintéressement) vs un gâteau (l'appétit veut consommer) vs une publicité (l'image veut me FAIRE faire quelque chose : l'intérêt) : le jugement de goût exige cette LIBERTÉ (l'objet n'est pas un moyen : la même structure que la dignité kantienne : l'art se contemple, ne s'utilise pas) : le « libre jeu » des facultés (imagination : entendement sans concept) produit le plaisir spécifique du beau (sans but : sans règle : sans possession). Piège : le désintéressement n'interdit pas d'AIMER l'art (ni de le payer : le marché existe) : il décrit la STRUCTURE du jugement (ce qui se passe quand je dis « c'est beau ») : l'art « engagé » (Sartre : l'art qui prend parti) DISCUTE ce point (peut-on tout à fait « ne pas vouloir » ?) : c'est un débat de bac.</div>"},
{"t": "L'art : créer, interpréter, juger (Terminale)", "q": "La position de Hume sur le goût est que :", "c": ["il est figé à la naissance", "il faut l'interdire", "le goût se FORME et se raffine (il existe des jugements EXPERTS : les normes du beau s'établissent par la pratique et la comparaison)", "il n'existe pas"], "a": 2, "e": "Hume : « de la norme du goût » : la pratique, la comparaison, la liberté de préjugé forment les bons juges : le goût n'est ni arbitraire ni démontrable : il s'ÉDUQUE.", "d": "<b>Le goût se forme</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la thèse de Hume (1757) : les gens divergent sur le goût (le fait) MAIS personne ne dit que Milton est un écrivain médiocre (la norme existe : les œuvres canoniques résistent au temps : le TEST des siècles) : les bons juges (pratique : comparaison : absence de préjugé : finesse : sang-froid) convergent : le goût n'est pas l'humeur (je peux avoir des raisons de GOÛTER mieux) : l'éducation esthétique est RÉELLE (l'oreille se forme pour la fugue : l'œil pour la composition) : contre le « chacun son goût » paresseux ET contre le dogmatisme (la norme sans preuve). Piège : la convergence des experts est-elle une PREUVE ou une sociologie (Bourdieu la relativisera : les experts sont-ils un milieu ?) ? La copie fait dialoguer Hume (la norme se forme par la pratique) et Bourdieu (la « norme » peut être un pouvoir) : c'est le conflit moderne du chapitre.</div>"},
{"t": "L'art : créer, interpréter, juger (Terminale)", "q": "Baudelaire écrivant « la laideur peut être artistique » montre que :", "c": ["la beauté est absurde", "l'art est religieux", "l'art doit être laid", "la valeur artistique n'est pas la beauté (le laid, si FORMÉ et signifiant, peut être une matière d'art : les Fleurs du mal)"], "a": 3, "e": "Le poète moderne cultive le laid formel (le cadavre : l'ennui : la boue) : la « modernité » (Baudelaire : « le transitoire, le fugitif, le contingent ») devient matière d'art : le beau n'est plus le critère unique.", "d": "<b>Le laid peut être une matière d'art</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le geste baudelairien (Les Fleurs du mal, 1857 : le procès pour « outrage à la morale » !) : « Une Charogne » (le cadavre putride : en verbes somptueux) : la matière répugnante devient POÈME par la forme : la valeur artistique se déplace du SUJET (noble : le modèle classique) vers le TRAVAIL (tout peut être transfiguré : la boue : l'ennui : la prostituée : le vieillard) : c'est la MODERNITÉ (« le peintre de la vie moderne » : Delacroix, Guys : « la modernité, c'est le transitoire, le fugitif : la moitié de l'art : l'autre moitié est l'éternel ») : l'art du XXe siècle prolongera (l'art brut : le ready-made : Bacon : les visages hurlants). Piège : la thèse n'est pas « tout ce qui est laid est de l'art » (il faut la FORME : l'organisation : l'intensité) : c'est le sujet de bac « l'art peut-il tout se permettre ? » : la réponse exige de distinguer la MATIÈRE (libre) et la FORME (exigeante).</div>"},
