{"t": "La laïcité : liberté, neutralité, séparation (EMC)", "q": "Un élève porte une petite croix au cou au collège public :", "c": ["c'est interdit seulement en cours de morale", "c'est interdit par la loi de 2004", "c'est admis : la loi vise les signes OSTENSIBLES, pas les signes discrets", "cela dépend de la région"], "a": 2, "e": "La loi de 2004 interdit ce qui « manifeste ostensiblement » l'appartenance : le signe discret (petite croix, main de Fatma, étoile) est licite.", "d": "<b>Ostensible vs discret</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le seuil est la VISIBILITÉ REVENDICATIVE : un pendentif minuscule : admis (conviction privée) : un voile couvrant les cheveux, une kippa visible, une croix de grande taille : interdit (affichage ostensible dans un cadre qui doit rester commun) : la circulaire d'application précise que le dialogue pédagogique précède toute sanction : c'est un critère d'interprétation, pas une police du bijou — le raisonnement juridique (discret/ostensible, dialogue préalable) est exactement ce qu'un sujet d'EMC attend.</div>"},
{"t": "La laïcité : liberté, neutralité, séparation (EMC)", "q": "La laïcité française, dite « de séparation », se distingue du modèle anglais ou allemand qui :", "c": ["organisent des cultes reconnus et financés par l'État (Église d'Angleterre, impôt religieux allemand)", "sont athées officiels", "interdisent les religions", "n'ont aucun rapport à la religion"], "a": 0, "e": "Comparaison : Angleterre (Église d'État), Allemagne (impôt d'églie recouvré par l'État), Scandinavie (Églises nationales récemment séparées) : des démocraties qui financent des cultes sans conflit majeur.", "d": "<b>Deux voies vers la même tolérance</b>.<div class='ex-detail'><u>Exemple rédigé</u> : modèle français (séparation stricte : la religion est une affaire privée, l'État aveugle aux cultes) : modèle « coopératif » (l'État reconnaît et finance plusieurs cultes, subventionne les écoles confessionnelles) : les DEUX protègent la liberté religieuse — par des chemins opposés (l'un en se retirant, l'autre en régulant) : le comparatisme vaut en EC : pourquoi la France interdit-elle le foulard à l'école alors que l'Allemagne l'accepte parfois (Land par Land) ? Des histoires différentes : guerre de religion catholique/laïque en France, pas en Allemagne : montrer cette relativité historique est le signe d'une copie de haut niveau.</div>"},
{"t": "La laïcité : liberté, neutralité, séparation (EMC)", "q": "Les aumôneries dans les établissements scolaires publics :", "c": ["existent uniquement en Alsace-Moselle", "concernent seulement le catholicisme", "sont contraires à la laïcité", "sont possibles dans les internats si les parents en font la demande (art. L. 511-2 du Code de l'éducation, héritage de la loi Debré)"], "a": 3, "e": "La laïcité n'interdit pas l'accompagnement religieux : des aumôneries existent (internats, hôpitaux, armées) à la demande des familles et financées par les cultes.", "d": "<b>La laïcité, ce n'est pas l'effacement total</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'article 1er de la loi de 1905 garantit le libre exercice des cultes — donc l'État doit permettre l'exercice même dans ses services (hôpitaux, prisons, armées : aumôniers) : à l'école, la loi Debré (1959) organise les aumôneries dans les internats, à la demande écrite des parents, avec des locaux prêtés (pas financés) : conclusion : la laïcité n'est pas la disparition de la religion, c'est son ORGANISATION par la loi commune — l'argument parfait pour répondre à « la laïcité est-elle une laïcité anti-religieuse ? ».</div>"},
{"t": "La laïcité : liberté, neutralité, séparation (EMC)", "q": "La loi du 24 août 2021 dite « séparatisme », rebaptisée « confortant les principes de la République », vise notamment à :", "c": ["interdire les cultes", "renforcer le contrôle des financements étrangers des cultes, exiger des associations un « engagement républicain » et protéger la neutralité des services publics", "supprimer les écoles privées", "financer les lieux de culte"], "a": 1, "e": "Loi 2021 : associations cultuelles contrôlées (financements étrangers), engagement républicain des associations, protection des agents publics, extensions de la laïcité (piscines, sortie scolaire...).", "d": "<b>Adapter la loi aux menaces actuelles</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la loi de 2021 répond à l'islam radical et à l'assassinat de Samuel Paty (2020) : outils : contrôle des subventions publiques (engagement républicain : une association qui conteste la loi commune peut perdre ses subventions), contrôle des financements étrangers (plafonds, transparence), dissolution possible des associations coupables, fermeture des écoles privées hors contrat dangereuses : le débat : certains y voient un risque de « suspicion » généralisée envers les musulmans, d'autres une mise à jour nécessaire du droit : en EMC, exposer le texte ET la controverse (dans le respect de la laïcité du débat scolaire) est exactement la posture attendue.</div>"},
{"t": "Droits et devoirs du citoyen (EMC)", "q": "Est citoyen français :", "c": ["toute personne ayant la nationalité française (droit du sang, double droit du sol ou naturalisation) et participant à la souveraineté nationale", "toute personne née en France", "toute personne résidant en France", "tout Européen vivant en France"], "a": 0, "e": "La citoyenneté politique suppose la nationalité : droit du sang, double droit du sol (né en France d'un parent né en France) ou naturalisation.", "d": "<b>Nationalité et citoyenneté</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un enfant né en France de parents étrangers nés à l'étranger est FRANÇAIS à 18 ans s'il a résidé en France (attribution automatique à la majorité, art. 21-11 du Code civil) : c'est le « double droit du sol » : un Britannique résidant à Paris paie des impôts locaux mais ne vote PAS aux nationales (il vote aux européennes et municipales depuis Maastricht) : le citoyen est le membre du PEUPLE souverain : nationalité (l'appartenance) + droits politiques (la participation) — cette distinction nationalité/citoyenneté est un point d'examen récurrent.</div>"},
{"t": "Droits et devoirs du citoyen (EMC)", "q": "Les droits sociaux (2e génération) ont été constitutionnalisés principalement par :", "c": ["la DDHC de 1789", "le préambule de la Constitution de 1946 (droit au travail, à la santé, à l'instruction)", "la Charte de l'environnement", "la loi de 1905"], "a": 1, "e": "Le préambule de 1946 (héritage du CNR) constitutionnalise les droits sociaux ; le Conseil constitutionnel les utilise depuis 1971.", "d": "<b>1946 : le social entre dans la Constitution</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 1789 : l'individu libre face à l'État (droits-libertés) : 1848 : suffrage universel masculin (droit politique de masse) : 1944 : vote des femmes : 1946 : « chacun a le devoir de travailler et le droit d'obtenir un emploi », « la Nation garantit l'égal accès de l'enfant et de l'adulte à l'instruction, à la formation professionnelle et à la culture » — les droits-créances (l'État DOIT fournir) : ils fondent la Sécurité sociale, l'école gratuite, les conventions collectives : la logique a changé : on ne demande plus seulement à l'État de ne pas gêner (1789) mais d'AGIR pour rendre les droits réels — c'est la matrice de l'État social français.</div>"},
{"t": "Droits et devoirs du citoyen (EMC)", "q": "Parmi ces « devoirs », lequel n'est PAS juridiquement obligatoire en France ?", "c": ["se faire recenser à la mairie à 16 ans", "répondre à une convocation de jury d'assises", "voter aux élections", "participer à la Journée défense et citoyenneté (JDC)"], "a": 2, "e": "Le vote est un DROIT (non obligatoire, abstention non sanctionnée) ; recensement, JDC et jury sont des obligations légales.", "d": "<b>Droit vs obligation : la grille à connaître</b>.<div class='ex-detail'><u>Exemple rédigé</u> : juré d'assises : convocation obligatoire (jusqu'à 1 200 € d'amende en cas d'absence non justifiée !) : recensement à 16 ans : obligatoire (sinon impossible d'être inscrit sur les listes) : JDC : obligatoire avant 25 ans (sinon pas de permis ni d'examens avant régularisation) : vote : DROIT — l'abstention est légale (contrairement à la Belgique ou à l'Australie, où le vote obligatoire se traduit par des taux > 90 %) : cette distinction droit/devoir est un piège de QCM classique — la version anglaise en a fait une question d'anthologie (« the citizen's duty to vote » n'existe pas en droit français).</div>"},
{"t": "Droits et devoirs du citoyen (EMC)", "q": "La citoyenneté de l'Union européenne (Maastricht, 1992) donne notamment le droit de :", "c": ["voter aux élections présidentielles françaises", "ne pas payer d'impôts", "changer de nationalité automatiquement", "voter et être élu aux élections municipales et européennes dans son pays de résidence, circuler librement et bénéficier d'une protection consulaire"], "a": 3, "e": "Le citoyen européen résidant dans un autre État membre vote aux municipales et européennes (pas aux nationales/présidentielles).", "d": "<b>Un étage supranational de citoyenneté</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un Portugais vivant à Lyon vote aux municipales lyonnaises et aux européennes (inscrit sur une liste complémentaire), MAIS pas à la présidentielle française (la souveraineté nationale reste protégée) : il circule sans contrôle aux frontières (Schengen), peut être aidé par l'ambassade de tout État membre dans un pays tiers (protection consulaire) : la citoyenneté européenne est ADDITIVE : elle s'ajoute à la citoyenneté nationale sans la remplacer — modèle unique au monde, souvent cité en dissertation sur « la citoyenneté peut-elle être postnationale ? ».</div>"},
{"t": "Droits et devoirs du citoyen (EMC)", "q": "L'inscription sur les listes électorales en France est aujourd'hui :", "c": ["obligatoire sous peine d'amende", "réservée aux propriétaires", "automatique à 18 ans (depuis 1997)", "facultative et à la charge du citoyen"], "a": 2, "e": "Depuis la loi de 1997, tout jeune atteignant 18 ans est inscrit d'office (déclaration de nationalité et recensement à 16 ans le permettent).", "d": "<b>L'État fait le premier pas</b>.<div class='ex-detail'><u>Exemple rédigé</u> : avant 1997 : chacun devait aller à la mairie s'inscrire (parfois découvert trop tard, la veille d'un vote !) : depuis : le recensement à 16 ans déclenche l'inscription automatique à 18 ans — une démarche administrative au service du droit de vote : MAIS l'inscription ne fait pas tout : encore faut-il VOULER voter (l'abstention des jeunes aux élections est un débat civique majeur : ~60-70 % d'abstention aux européennes chez les 18-25) : l'automatisation de l'inscription est donc un outil d'accessibilité, pas une réponse à la crise de la participation — nuance attendue en EC sur « le droit de vote suffit-il à faire le citoyen ? ».</div>"},
{"t": "Droits et devoirs du citoyen (EMC)", "q": "La Charte de l'environnement (2004) constitutionnalisée reconnaît notamment :", "c": ["le droit de vivre dans un environnement équilibré et respectueux de la santé et le principe de précaution", "l'interdiction de toute activité industrielle", "un droit exclusivement animalier", "le droit de polluer moyennant paiement"], "a": 0, "e": "Charte adossée à la Constitution (2004) : environnement sain, développement durable, principe de précaution, participation aux décisions environnementales.", "d": "<b>La 3e génération entre à la Constitution</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la Charte de 2004 (sous l'impulsion du président Chirac) met l'environnement au même rang constitutionnel que 1789 et 1946 : articles clés : droit à un environnement équilibré et respectueux de la santé (art. 1), principe de précaution (art. 5 : à défaut de certitude scientifique, ne pas retarder les mesures), participation du public (art. 7), éducation à l'environnement (art. 8) : depuis, le Conseil constitutionnel censure des lois au nom de la Charte (ex. : la loi sur les OGM en 2008) : un droit « de solidarité » (envers les générations futures) qui renouvelle l'idée même de citoyenneté — argument de dissertation contemporaine.</div>"},
{"t": "Droits et devoirs du citoyen (EMC)", "q": "Le fait d'être tiré au sort pour être juré d'assises est :", "c": ["réservé aux diplômés de droit", "un privilège réservé aux fonctionnaires", "une obligation légale : le juré participe au jugement des crimes au nom de la société (sauf excuses légitimes)", "une possibilité laissée au citoyen"], "a": 2, "e": "Le jury d'assises illustre la participation directe du citoyen à la justice (démocratie participative) : convocation obligatoire.", "d": "<b>Juger, comme citoyen</b>.<div class='ex-detail'><u>Exemple rédigé</u> : chaque année, des dizaines de milliers de Français sont tirés au sort sur les listes électorales pour siéger aux assises : 6 jurés en première instance (3 en appel) délibèrent avec les 3 juges professionnels, décident de la culpabilité et participent à la peine : obligation légale, sous peine d'amende : l'institution remonte à la Révolution (1791 : « juger par ses pairs ») : elle démocratise la justice pénale — même le prof d'EMC, s'il est tiré au sort, DEVRA y aller : un exemple vif de « démocratie par tirage au sort » à citer dès qu'on parle participation citoyenne (avec les assemblées citoyennes de convention climat).</div>"},
{"t": "Droits et devoirs du citoyen (EMC)", "q": "Le service civique en France :", "c": ["remplace le service militaire", "est un engagement VOLONTAIRE indemnisé (16-25 ans, 6-12 mois) au service de l'intérêt général", "est réservé aux étudiants en droit", "est obligatoire pour tous les jeunes"], "a": 1, "e": "Créé en 2010 : mission d'intérêt général, indemnité, tutorat — une forme moderne d'engagement civique rémunérée par l'État.", "d": "<b>Le volontariat républicain 2.0</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le service militaire (suspendu en 1997) avait pour héritiers : la JDC (journée d'appel) et le service civique (2010) : le jeune signe un contrat (indemnité ~600 €/mois), s'engage 24 h/semaine minimum dans une association, un service public, une structure d'aide : l'objectif : « un grand rendez-vous civique » (mixité sociale, rencontre de l'intérêt général) : des dizaines de milliers de missions (solidarité, éducation, environnement, santé) : c'est un exemple parfait de « devoir civique » ADAPTATIF : ni obligatoire ni marchand — l'engagement républicain modernisé, à citer en dissertation sur la jeunesse et la citoyenneté.</div>"},
{"t": "Droits et devoirs du citoyen (EMC)", "q": "« Contribuer aux charges publiques » est un devoir du citoyen : il signifie que :", "c": ["l'impôt est facultatif pour les mineurs", "chaque citoyen participe au financement des services publics selon ses facultés contributives (principe d'égalité devant l'impôt)", "l'impôt est une punition", "seuls les riches paient l'impôt"], "a": 1, "e": "L'article 13 de la DDHC : contribution commune proportionnelle aux facultés de chacun — l'impôt finance l'école, la justice, la sécurité : c'est le « prix du vivre-ensemble ».", "d": "<b>L'impôt, acte civique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la TVA payée sur un sandwich, l'impôt sur le revenu, la taxe foncière : tout citoyen contribue (même le mineur qui achète un vêtement !) : les services publics (routes, école, hôpital, justice, armée) coûtent ~57 % du PIB français : le principe constitutionnel : égale répartition des charges publiques selon les facultés contributives (donc progressivité admise) : la fraude fiscale n'est pas seulement un délit : c'est un manquement au contrat civique — un angle original pour une EC sur « l'impôt est-il un acte patriotique ? ».</div>"},
{"t": "Droits et devoirs du citoyen (EMC)", "q": "Un étranger résidant en France, citoyen de l'UE, peut :", "c": ["voter aux élections municipales et européennes en France (citoyenneté européenne)", "ne pas payer d'impôts locaux", "voter à l'élection présidentielle", "se présenter à toutes les élections"], "a": 0, "e": "Maastricht : les résidents européens votent (et sont éligibles) aux municipales et européennes — pas aux nationales.", "d": "<b>Une citoyenneté à géométrie variable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : Mme Rossi, italienne, vit à Bordeaux depuis 10 ans : elle vote aux municipales (listes complémentaires) et aux européennes : elle NE PEUT PAS voter à la présidentielle ou aux législatives (la souveraineté nationale est réservée aux nationaux) : elle peut être ELUE conseillère municipale, mais pas maire ni députée : le débat récurrent : le droit de vote des étrangers NON européens aux municipales (promesse jamais tenue depuis 1981, révision constitutionnelle nécessaire) : la grille « ce que l'étranger UE peut / ne peut pas » est une question d'examen typique — la connaître parfaitement vaut des points sûrs.</div>"},
{"t": "Démocratie et régimes politiques (EMC)", "q": "Selon Montesquieu, la séparation des pouvoirs vise à :", "c": ["supprimer le Parlement", "éviter l'arbitraire en empêchant qu'un même organe détienne légiférer, exécuter et juger", "augmenter le nombre de ministres", "rendre le gouvernement plus rapide"], "a": 1, "e": "« Pour qu'on ne puisse abuser du pouvoir, il faut que, par la disposition des choses, le pouvoir arrête le pouvoir » (De l'esprit des lois, 1748).", "d": "<b>Le pouvoir arrête le pouvoir</b>.<div class='ex-detail'><u>Exemple rédigé</u> : si le même homme fait la loi, l'applique et juge les litiges, nul frein ne l'arrête (Montesquieu : « tout homme qui a du pouvoir est porté à en abuser ») : d'où la tripartition : législatif (Parlement), exécutif (gouvernement), judiciaire (tribunaux indépendants) : applications concrètes : un ministre ne peut pas être juge dans une affaire où il est partie : une loi votée peut être censurée par le Conseil constitutionnel : la question du « pouvoir des juges » est le revers de la médaille — le débat contemporain (justice « gouvernante » ?) prolonge Montesquieu, il ne le dément pas.</div>"},
{"t": "Démocratie et régimes politiques (EMC)", "q": "Le régime de la Ve République française est qualifié de :", "c": ["présidentiel", "parlementaire", "semi-présidentiel (président élu au SU avec pouvoirs propres + gouvernement responsable devant l'Assemblée)", "monarchique"], "a": 2, "e": "Dualité de l'exécutif (président + PM) + responsabilité du gouvernement devant l'Assemblée (49-2) : la définition du semi-présidentialisme selon Duverger.", "d": "<b>Pourquoi « semi »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : présidentiel pur (USA) : le président n'est responsable devant personne (sauf impeachment), le Congrès ne peut être dissous : parlementaire pur (Allemagne) : le chancelier est élu par le Bundestag, responsable devant lui, le président est effacé : la France a un président PUISSANT (art. 8, 11, 12, 16, élu au SU depuis 1962) MAIS un gouvernement responsable devant l'Assemblée (motion de censure : la preuve en 1962 et 2024) : le « fait majoritaire » (législatives après la présidentielle) rend le président dominant EN PRATIQUE, mais la Constitution reste semi-présidentielle : cette distinction droit/pratique est LA nuance qui rapporte des points.</div>"},
{"t": "Démocratie et régimes politiques (EMC)", "q": "Une « motion de censure » (art. 49 al. 2) :", "c": ["permet au président de renvoyer un député", "peut renverser le gouvernement si elle obtient la majorité ABSOLUE des députés", "est une simple déclaration d'opinion", "concerne seulement le Sénat"], "a": 1, "e": "Déposée par 1/10 des députés : vote à la majorité absolue : si elle passe, le gouvernement doit démissionner (ex. : 1962, 2024).", "d": "<b>L'arme ultime des députés</b>.<div class='ex-detail'><u>Exemple rédigé</u> : décembre 2024 : le gouvernement engage sa responsabilité sur le budget : l'opposition dépose une motion de censure qui PASSE (majorité absolue) : le gouvernement Barnier démissionne — première censure votée depuis 1962 : pourquoi le seuil de la majorité absolue : pour éviter qu'une coalition fluide ne renverse à la majorité simple des présents (la « censure facile » de la IIIe/IVe République, qui a vu des gouvernements tomber tous les quelques mois) : la Ve République a voulu stabiliser l'exécutif : la censure est donc possible mais COÛTEUSE politiquement — un équilibre à expliquer en EC.</div>"},
{"t": "Démocratie et régimes politiques (EMC)", "q": "Le référendum d'initiative partagée (RIP, révision de 2008) :", "c": ["permet aux citoyens seuls d'imposer un référendum", "concerne tous les sujets", "permet qu'un cinquième du Parlement soutenu par un dixième des électeurs propose l'inscription d'un projet à l'ordre du jour (référendum sur l'organisation des pouvoirs publics)", "est un plébiscite présidentiel"], "a": 2, "e": "1/5 des parlementaires + 1/10 du corps électoral (≈ 4,87 M signatures) : le Congrès doit d'abord examiner : aucun RIP n'est encore abouti (l'outil reste inutilisé à ce jour).", "d": "<b>Une usine à gaz encore inutilisée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le RIP (art. 11 al. 3) tente de répondre au déficit de participation : un projet de loi sur les « décisions publiques » peut être proposé si 185 parlementaires et ~4,87 millions d'électeurs le soutiennent : SAUF que le Congrès garde la main (il peut examiner le texte en priorité... et l'enterrer) : aucune des tentatives (sur la privatisation des aéroports, sur l'assurance chômage...) n'est parvenue au stade final : conclusion en EC : le RIP illustre les LIMITES de la démocratie semi-directe française : outil existant mais quasi inutilisable — comparer avec l'Italie (abrogative) ou la Suisse (votation fédérale) nourrit la réflexion.</div>"},
{"t": "Démocratie et régimes politiques (EMC)", "q": "Le suffrage « universel » en France est complet depuis :", "c": ["1962", "1944 (droit de vote des femmes)", "1848", "1789"], "a": 1, "e": "1848 : suffrage universel MASCULIN ; 1944 : les femmes votent (première fois en 1945) ; l'âge de vote passe à 18 ans en 1974 (avant : 21 ans).", "d": "<b>Une universalité tardive</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 1789 : « citoyens actifs » payant un impôt (cens) : 1848 (Seconde République) : tous les hommes majeurs : 1944 : les femmes (après un siècle et demi de combats — Condorcet, Olympe de Gouges, Hubertine Auclert...) : 1974 : passage de 21 à 18 ans : 1992 : citoyens européens aux municipales/européennes : le « suffrage universel » a donc une HISTOIRE : chaque extension (propriété → sexe → âge → nationalité européenne) a été un combat — un plan chronologique imparable pour toute question sur « qui vote et depuis quand ? ».</div>"},
{"t": "Démocratie et régimes politiques (EMC)", "q": "Un régime totalitaire (Hannah Arendt) se caractérise par :", "c": ["un roi héréditaire", "une élection libre", "une idéologie totalisante, un parti unique, la terreur et la propagande visant toute la société", "un fédéralisme"], "a": 2, "e": "Totalitarisme (nazisme, stalinisme) : prétention à transformer l'homme et la société ENTIÈRE par l'idéologie, le parti unique, la propagande, la terreur (police politique, camps).", "d": "<b>Contrôle total, et pas seulement du gouvernement</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'autoritarisme classique (dictature militaire) prend le pouvoir politique et laisse la société vivre (en général) : le totalitarisme prétend à la société ENTIÈRE : jeunesses obligatoires (Hitlerjugend, Komsomol), économie dirigée, arts officiels, police politique (Gestapo, NKVD), camps (Goulag, camps de concentration) : Hannah Arendt (Les Origines du totalitarisme, 1951) y voit la « désolation » (isolement atomisé des individus) comme terreau : la distinction autoritaire/totalitaire est une question d'examen classique — elle empêche de tout mélanger (une dictature militaire n'est pas Auschwitz, et le confondre affaiblit l'analyse).</div>"},
{"t": "Démocratie et régimes politiques (EMC)", "q": "La « démocratie illibérale » (Hongrie, Turquie) désigne :", "c": ["des démocraties parfaites", "des pays qui maintiennent des élections tout en affaiblissant les contre-pouvoirs (justice, presse, opposition)", "des monarchies constitutionnelles", "des pays sans élections"], "a": 1, "e": "L'élection subsiste, mais l'État de droit recule : constitution révisée, justice contrôlée, médias acquis, société civile étouffée.", "d": "<b>Élections oui, libertés non</b>.<div class='ex-detail'><u>Exemple rédigé</u> : en Hongrie, depuis 2010 : révision constitutionnelle en bloc, Cour constitutionnelle remaniée, médias publics devenus propagande, ONG harcelées — tout en GAGNANT des élections (avantage médiatique, découpage des circonscriptions) : la leçon de science politique : la démocratie ne se réduit PAS au vote : elle est un ÉCOSSYSTÈME (justice indépendante, information libre, opposition protégée, alternance possible) : les indicateurs (V-Dem, Freedom House) appellent ce phénomène « autocratisation électorale » : en EMC, c'est l'argument central contre l'idée reçue « il y a des élections, donc c'est démocratique ».</div>"},
{"t": "Démocratie et régimes politiques (EMC)", "q": "La cohabitation (France) :", "c": ["une coalition au Parlement", "deux présidents gouvernent ensemble", "le président et le Premier ministre sont de bords politiques opposés (1986-88, 1993-95, 1997-2002)", "un gouvernement avec l'opposition"], "a": 2, "e": "Le président garde ses domaines réservés (défense, diplomatique), le Premier ministre gère la politique intérieure : le régime « redevient » parlementaire.", "d": "<b>La Constitution en mode parlementaire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 1986 : Mitterrand (gauche) doit nommer Chirac (droite) — majorité inverse : : le président ne peut gouverner : il garde l'armée, la diplomatie (domaines réservés), le refus possible (refus de signer les ordonnances, « veille ») : le PM Chirac dirige la politique intérieure : trois cohabitations (1986, 1993, 1997) : depuis le quinquennat (2000) et l'inversion du calendrier (législatives juste après la présidentielle), la cohabitation est improbable : MAIS la théorie constitutionnelle la garde possible — la souplesse de la Constitution est un argument de dissertation : un régime qui peut s'adapter sans révision (nuance précieuse contre l'idée reçue « la Ve est une monarchie républicaine »).</div>"},
{"t": "Démocratie et régimes politiques (EMC)", "q": "Les conventions citoyennes (ex. : convention climat 2019-2020) illustrent la démocratie :", "c": ["communautaire", "participative : des citoyens tirés au sort délibèrent et formulent des propositions", "plébiscitaire", "délégitimée"], "a": 1, "e": "150 citoyens tirés au sort ont délibéré 9 mois sur le climat : 146 propositions — dont certaines reprises (dont un éventuel référendum et le crime d'écocide, discuté).", "d": "<b>Le tirage au sort au pouvoir (de proposition)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la convention citoyenne pour le climat (CCC) : 150 citoyens tirés au sort, 9 week-ends, audition d'experts, 146 propositions (« réduire de 40 % nos émissions ») : le président s'était engagé à reprendre les propositions « sans filtre » — quelques-unes ont abouti (loi Climat), d'autres ont été écartées (l'écocide pénal, le prix du carbone) : le débat : légitimité (tous profils confondus, éclairés) vs redevabilité (non élus, donc pas « responsables » devant personne) : c'est un exemple contemporain parfait pour comparer représentation et tirage au sort (avec le jury d'assises, les CVC lycéens) — le grand classique des EC de 2020 à aujourd'hui.</div>"},
{"t": "Démocratie et régimes politiques (EMC)", "q": "Le pluralisme politique suppose notamment que :", "c": ["un seul parti peut exister librement", "l'opposition est interdite", "plusieurs partis et opinions peuvent concourir librement aux élections (liberté d'association politique, égalité des chances, pluralisme médiatique)", "l'État finance un seul parti"], "a": 2, "e": "Sans pluralisme (partis, médias, candidats), l'élection n'est pas concurrentielle : ce n'est plus une démocratie au sens de Dahl.", "d": "<b>Le droit d'avoir des adversaires</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la liberté d'association politique (loi 1901, partis) et la loi électorale encadrent : accès équitable aux médias (temps de campagne réglementé en France), financement public des campagnes (remboursement si seuil de voix), parrainages d'élus pour la présidentielle (500 signatures pour éviter les candidatures fantaisistes) : le test du pluralisme : l'ALTERNANCE est-elle possible ? pouvoir changer les gouvernants sans changer la Constitution : quand un parti unique bloque l'alternance (Russie), l'élection devient une cérémonie : en EC, définir la démocratie par « alternance possible + libertés + minorités respectées » est une grille d'analyse complète et citable.</div>"},
{"t": "Justice et droit : l'État de droit (EMC)", "q": "La pyramide des normes (Kelsen) classe les règles par :", "c": ["ordre alphabétique", "hiérarchie : la Constitution en haut, puis les traités, les lois, les règlements en bas", "ordre chronologique", "importance politique"], "a": 1, "e": "Chaque norme doit respecter la norme supérieure : un décret ne peut contredire une loi, une loi ne peut contredire la Constitution.", "d": "<b>Une architecture, pas un catalogue</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un maire prend un arrêté (règlement) interdisant une manifestation : si l'arrêté viole la loi ou la Constitution (liberté de manifestation, CEDH), le tribunal administratif l'annule : la loi elle-même peut être censurée par le Conseil constitutionnel (via la QPC) : les traités européens priment sur les lois françaises (CE 1990, Nicolo) : cette mécanique fait qu'aucune règle n'est « souveraine » en soi : tout est contrôlé par rapport à une norme supérieure — c'est LA définition de l'État de droit, et une grille d'analyse applicable à tout sujet d'examen.</div>"},
{"t": "Justice et droit : l'État de droit (EMC)", "q": "Un État de droit se caractérise par :", "c": ["l'absence de lois", "le pouvoir absolu du législatif", "des élections sans justice", "la soumission de tous les pouvoirs au droit, avec un juge indépendant pour contrôler leur respect"], "a": 3, "e": "État de droit : le pouvoir est limité par le droit et contrôlé par la justice (indépendante) — personne n'est au-dessus de la loi, pas même la majorité.", "d": "<b>Le pouvoir limité par ses propres règles</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un président ne peut pas emprisonner un adversaire sans procès (art. 66 : l'autorité judiciaire est « gardienne de la liberté individuelle ») : une loi votée par 100 % du Parlement peut être censurée si elle viole la Constitution : l'administration peut être condamnée à payer un citoyen : dans un État de police (autocratique), le droit est un INSTRUMENT du pouvoir : dans un État de droit, il en est la LIMITE : la nuance est l'objet même de l'EMC — distinguer ce qui relève de la force et ce qui relève du droit.</div>"},
{"t": "Justice et droit : l'État de droit (EMC)", "q": "La présomption d'innocence signifie que :", "c": ["l'accusé est coupable tant qu'il n'a pas prouvé son innocence", "l'accusé est considéré innocent jusqu'à ce que sa culpabilité soit légalement établie (charge de la preuve sur l'accusation)", "le juge choisit librement", "les témoins sont innocents"], "a": 1, "e": "Article 9-1 du Code civil et art. 6-2 CEDH : le doute profite à l'accusé — c'est à l'accusation de prouver, pas à l'accusé de se justifier.", "d": "<b>Le doute profite à l'accusé</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un homme est jugé pour vol : il n'a PAS à prouver qu'il était ailleurs — c'est au procureur d'apporter des preuves décisives : si le doute subsiste, la relaxe est obligatoire (« intime conviction » fondée sur des preuves, pas sur des soupçons) : pourquoi cette règle : mieux vaut dix coupables libres qu'un innocent condamné (Blackstone) — l'erreur judiciaire (Dreyfus, Outreau) détruit la confiance en la justice pour des décennies : la présomption d'innocence protège donc TOUT citoyen (chacun peut être accusé un jour) : c'est un pis-aller coûteux mais nécessaire — un débat de niveau terminale parfaitement balisé.</div>"},
{"t": "Justice et droit : l'État de droit (EMC)", "q": "La Question Prioritaire de Constitutionnalité (QPC), créée en 2010, permet :", "c": ["à un justiciable de contester la loi appliquée dans son procès, jusqu'à sa censure par le Conseil constitutionnel", "au président de changer la Constitution", "au Parlement de censurer le juge", "aux juges de créer des lois"], "a": 0, "e": "Filtre : Cour de cassation ou Conseil d'État : décision : Conseil constitutionnel (la loi est conforme ou censurée, avec effet sur le litige).", "d": "<b>Le citoyen, censeur des lois</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un justiciable perd un procès en appel à cause d'une loi qu'il estime contraire à la Constitution : il soulève une QPC : la Cour de cassation vérifie le sérieux (filtre) : le Conseil constitutionnel statue : si la loi est censurée, elle disparaît de l'ordre juridique (et le litige est rejugé sans elle) : ex. réel : la QPC a fait tomber des dispositions sur la rétention de sûreté, l'égalité successorale, les perquisitions de nuit : bilan : des centaines de lois corrigées — l'œuvre de justiciables ordinaires, pas de politiques : un exemple massue pour illustrer « l'État de droit au service du citoyen ».</div>"},
{"t": "Justice et droit : l'État de droit (EMC)", "q": "En France, les litiges avec l'administration (ex. : refus d'un permis) relèvent :", "c": ["du maire", "du juge administratif (tribunal administratif, cour administrative d'appel, Conseil d'État)", "du médiateur seul", "du tribunal judiciaire"], "a": 1, "e": "L'État est soumis à son propre juge : le citoyen peut attaquer une décision administrative et obtenir son annulation (recours pour excès de pouvoir) ou des dommages-intérêts.", "d": "<b>Juger l'État, c'est possible</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une préfecture refuse un titre de séjour : le requérant saisit le tribunal administratif (procédure gratuite, avocat pas toujours obligatoire) : si la décision est illégale (motivation insuffisante, erreur de droit), elle est ANNULÉE — l'administration doit rejuger : cette juridiction remonte à la Révolution (loi 1790 : « les fonctions judiciaires sont distinctes et demeureront toujours séparées des fonctions administratives » — par peur des juges d'Ancien Régime, les Révolutionnaires ont créé un juge SPÉCIALISÉ) : aujourd'hui, c'est une protection du citoyen : l'administration n'est pas au-dessus du droit — l'argument central de tout exposé sur l'État de droit à la française.</div>"},
{"t": "Justice et droit : l'État de droit (EMC)", "q": "L'article 66 de la Constitution fait de l'autorité judiciaire :", "c": ["une simple administration", "la gardienne de la liberté individuelle (nul ne peut être détenu arbitrairement : contrôle obligatoire du juge)", "un pouvoir au service du gouvernement", "un organisme consultatif"], "a": 1, "e": "Toute privation de liberté doit être ordonnée ou contrôlée par un juge (détention provisoire, garde à vue, psychiatrie...)) — c'est le rempart contre l'arbitraire.", "d": "<b>Le juge, rempart de la liberté</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une garde à vue : 24 h (renouvelable 24 h, plus pour terrorisme/stupéfiants), avec avocat dès le début (2011, réforme CEDH), notification des droits, contrôle du procureur PUIS du juge : la rétention administrative (immigration) : contrôle du juge des libertés et de la détention (JLD) : l'hospitalisation psychiatrique sans consentement : certificat + juge informé : tout cela découle de l'art. 66 : l'État peut priver de liberté, mais seulement PAR et DEVANT le juge — l'histoire (lettres de cachet, Vichy) justifie cette vigilance : un point de cours très souvent évalué au bac.</div>"},
{"t": "Justice et droit : l'État de droit (EMC)", "q": "Le principe de non-rétroactivité de la loi pénale signifie :", "c": ["le juge invente les délits", "une loi peut punir un fait passé", "les peines changent tous les ans", "nul ne peut être condamné pour un fait qui n'était pas puni par la loi au moment où il a été commis"], "a": 3, "e": "Art. 8 DDHC et art. 7 CEDH : pas de peine sans loi (pas d'infraction ni de sanction rétroactive) — seule la loi la plus douce peut être rétroactive (si elle améliore le condamné).", "d": "<b>Nul n'est puni pour un crime que la loi n'a pas prévu</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un comportement devient un délit le 1er janvier : toute personne ayant agi ainsi en décembre est PÉNALEMENT INNOCENTE (même si le fait est moralement condamnable) : réciproquement, si une loi adoucit la peine (décriminalisation), les condamnés en bénéficient : pourquoi : le citoyen doit pouvoir savoir, AVANT d'agir, ce que la loi interdit (sécurité juridique, prévisibilité) : un État qui punirait rétroactivement serait un État arbitraire (les lois rétroactives de Vichy en ont fait la démonstration) : c'est un exemple d'examen idéal — simple, tranchant, avec texte à l'appui.</div>"},
{"t": "Justice et droit : l'État de droit (EMC)", "q": "Le double degré de juridiction garantit :", "c": ["un jury double", "que tous les juges siègent deux fois", "deux peines différentes", "la possibilité de faire appel d'une décision pour la faire réexaminer (droit fondamental tiré de l'art. 6 CEDH, même s'il connaît des exceptions)"], "a": 3, "e": "Toute décision de première instance peut être portée en appel (faits ET droit réexaminés) — sauf procès spécifiques (assises en appel, petites affaires).", "d": "<b>Se tromper une fois, se corriger deux fois</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un tribunal condamne à tort un commerçant (faussement accusé d'escroquerie) : il fait appel : la cour d'appel réexamine TOUT (témoignages, pièces, droit) et peut l'acquitter : au pénal, l'assises en première instance est depuis 2000 suivie d'un assises en appel : la Cour de cassation, elle, ne rejuge pas les faits : elle contrôle l'application du DROIT et renvoie devant une nouvelle cour si la loi a été mal appliquée : pourquoi c'est fondamental : l'erreur judiciaire est humaine : l'institution doit se corriger — une garantie au cœur de l'État de droit (le coût : des procédures longues, d'où les condamnations de la France pour « délai raisonnable » par la CEDH — la nuance à connaître).</div>"},
{"t": "Justice et droit : l'État de droit (EMC)", "q": "L'indépendance des magistrats du siège (juges) est garantie par :", "c": ["leur appartenance à un parti politique", "un statut protecteur (inamovibilité, gestion par le CSM) et l'interdiction de recevoir des instructions du gouvernement", "leur élection par le peuple", "la nomination par le maire"], "a": 1, "e": "Les juges du siège sont inamovibles (pas de sanction/déplacement arbitraire) ; le Conseil supérieur de la magistrature gère carrières et discipline ; le ministère public (procureurs) obéit au garde des Sceaux (nuance à connaître).", "d": "<b>Protéger le juge pour protéger le justiciable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un juge qui instruit une affaire embarrassante pour le gouvernement : le régime ne peut NI le révoquer (inamovibilité, art. 64 de la Constitution), NI le déplacer punitivement (le CSM, art. 65, doit être consulté et propose) : MAIS nuance : le ministère public (procureurs) est HIÉRARCHISÉ et dépend du ministre de la Justice (révision constitutionnelle 2008 : les procureurs relèvent du garde des Sceaux, qui peut leur donner des instructions écrites dans les cas prévus) : cette dualité siège/parquet alimente un débat récurrent (indépendance totale du parquet ?) : la connaître avec précision est un vrai plus en EMC comme en SES (polices, justice).</div>"},
{"t": "Justice et droit : l'État de droit (EMC)", "q": "L'aide juridictionnelle (AJ) contribue à l'État de droit en :", "c": ["permettant aux personnes modestes d'accéder à un avocat et à la justice gratuitement ou à coût réduit (selon ressources)", "finançant les avocats des riches", "réservant les tribunaux aux fonctionnaires", "accélérant les procès"], "a": 0, "e": "L'égalité devant la loi suppose l'égalité d'accès au droit : l'AJ prend en charge tout ou partie des frais de justice sous conditions de ressources.", "d": "<b>Un droit sans accès n'est qu'un mot</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une mère seule, sans ressources, doit contester un licenciement abusif : sans AJ, renoncement (le droit reste théorique) : avec AJ (plafonds de revenus), l'État paie l'avocat (contribution de l'ordre de 185 € en matière civile pour l'avocat, compléments possibles) : chiffres : des centaines de milliers de dossiers AJ par an — et pourtant une part importante de la population renonce à ses droits (« renoncement juridictionnel », études du CREDOC) : l'accès au droit est donc la CONDITION RÉELLE de l'égalité proclamée — un exemple concret et chiffré, idéal pour une EC sur « l'égalité devant la justice est-elle réelle ? ».</div>"},
{"t": "Égalité et discriminations (EMC)", "q": "Une discrimination (au sens du droit français) suppose :", "c": ["une conversation désagréable", "une différence de traitement fondée sur un critère interdit par la loi (origine, sexe, handicap...) dans un domaine visé (emploi, logement...)", "une différence de salaire selon le mérite", "toute préférence personnelle"], "a": 1, "e": "Trois éléments : un critère interdit (art. 225-1 Code pénal), un domaine visé (embauche, location, éducation, services), un traitement défavorable.", "d": "<b>La définition à trois éléments</b>.<div class='ex-detail'><u>Exemple rédigé</u> : refuser un appartement à cause du « bruit des enfants » (situation de famille : critère interdit) = discrimination : refuser un logement à quelqu'un qui ne présente pas de garanties financières suffisantes = légal (critère objectif, non interdit) : un syndicaliste écarté d'une promotion (activité syndicale) = discrimination : un candidat moins expérimenté écarté = licite : la méthode d'analyse : identifier le CRITÈRE (interdit ?), le DOMAINE (visé ?), le TRAITEMENT (défavorable ?) — si les trois sont réunis, la discrimination est caractérisée : cette grille résout 90 % des sujets d'examen sur la question.</div>"},
{"t": "Égalité et discriminations (EMC)", "q": "Une discrimination INDIRECTE se produit quand :", "c": ["la loi elle-même est injuste", "une règle en apparence neutre désavantage un groupe protégé (ex. : imposer la coupe de cheveux, une hauteur minimale, la disponibilité à plein temps)", "on annonce ouvertement son refus", "le refus vient d'un ami"], "a": 1, "e": "La neutralité apparente masque l'effet : la jurisprudence exige que la règle soit objectivement justifiée par un but légitime et proportionnée.", "d": "<b>Le racisme des règles « neutres »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une entreprise exige une taille minimale de 1,80 m pour un poste de vendeur : en apparence neutre — MAIS cela exclut massivement les femmes (et certaines origines) sans nécessité professionnelle : discrimination indirecte (à moins de prouver que la taille est indispensable au poste) : autre exemple : des horaires de réunions uniquement le soir, défavorables aux parents (femmes surtout) : la loi et la CJUE sanctionnent l'effet disproportionné sans justification : en EC, expliquer directe/indirecte avec un exemple est la marque d'une vraie compréhension (beaucoup d'élèves ne connaissent que la discrimination « à visage découvert »).</div>"},
{"t": "Égalité et discriminations (EMC)", "q": "La loi du 16 novembre 2001 a introduit en matière d'embauche :", "c": ["la suppression des entretiens", "des quotas ethniques", "l'interdiction des CV anonymes obligatoires", "le renversement de la charge de la preuve : le candidat prouve des faits laissant présumer la discrimination, l'employeur doit prouver une décision fondée sur des éléments objectifs"], "a": 3, "e": "Adaptation du droit européen : face à une discrimination invisible, la preuve devient possible (testing, statistiques) — l'employeur doit se justifier.", "d": "<b>Quand l'invisible devient prouvable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le problème : comment prouver qu'un recruteur a écarté un CV à cause du nom ? Il invoquera toujours « un profil inadapté » : la solution 2001 : le candidat n'a plus à prouver l'INTENTION : il présente des faits « laissant présumer » (testing à l'appui, CV identiques, statistiques d'entretiens) : la charge bascule sur l'employeur (éléments objectifs, étrangers au critère interdit) : si l'employeur ne prouve pas, la discrimination est établie : le testing, longtemps contesté, est désormais admis comme mode de preuve — et le Défenseur des droits l'utilise : un exemple de mécanisme juridique ADAPTÉ à la réalité sociologique : parfait pour illustrer « le droit peut-il corriger les discriminations ? ».</div>"},
{"t": "Égalité et discriminations (EMC)", "q": "Le Défenseur des droits (2011) est :", "c": ["un tribunal", "un syndicat", "un ministre", "une autorité indépendante qui protège les droits et libertés, reçoit les réclamations, enquête et recommande (fusion de plusieurs instances dont la HALDE)"], "a": 3, "e": "Autorité constitutionnelle (art. 71-6) : lutte contre les discriminations, défense des droits de l'enfant, éthique publique, orientation des usagers des services publics.", "d": "<b>Un recours gratuit et accessible</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une personne s'estime discriminée à l'embauche (ou un enfant maltraité, un usager spolié) : elle saisit le Défenseur des droits (gratuit, en ligne, pas d'avocat) : il enquête, propose une médiation, recommande des sanctions, publie des rapports annuels thématiques (discriminations dans l'accès à l'emploi, à l'éducation, à la santé) : son avis n'est PAS une décision de justice, mais il a une force de conviction (rapports publics, instructions aux administrations) : l'institution fusionne plusieurs anciens dispositifs (Médiateur de la République, HALDE, délégation enfants, CNDSR) : à retenir : une autorité INDEPENDANTE (pas un organe gouvernemental), saisissable par tous — c'est LA réponse institutionnelle française aux discriminations.</div>"},
{"t": "Égalité et discriminations (EMC)", "q": "La loi sur la parité (2000) impose :", "c": ["un pourcentage égal de candidats hommes et femmes sur les listes électorales (sanction : retrait de financement public)", "des femmes ministres obligatoires", "des quotas dans l'enseignement", "50 % de femmes dans les entreprises"], "a": 0, "e": "La révision constitutionnelle de 1999 permet la parité ; la loi de 2000 l'impose aux listes (municipales, régionales, législatives partiellement) sous peine de sanctions financières.", "d": "<b>Choisir la différence pour atteindre l'égalité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : avant 2000, l'Assemblée comptait ~10-12 % de femmes (l'une des plus basses d'Europe malgré le suffrage de 1944 !) : la loi de 2000 oblige chaque liste à alterner les candidats (le fameux « zipper ») : sanction : amputation des subventions publiques en cas de non-respect : résultat : les assemblées locales deviennent quasi paritaires, l'Assemblée nationale progresse (~37-38 % en 2022) : MAIS l'exécutif reste masculin (maires : ~14-20 % de femmes, présidences : une seule élue en 2022 !) : la parité illustre la thèse forte de l'égalité réelle : traiter différemment pour égaliser — un débat de fond pour l'EC (universalisme abstrait vs corrective concrète).</div>"},
{"t": "Égalité et discriminations (EMC)", "q": "Les statistiques ethniques sont en France :", "c": ["autorisées depuis 2000", "obligatoires dans les recensements", "largement interdites : le Conseil constitutionnel censure la reconnaissance de « communautés » (indivisibilité), seule l'INSEE mesure indirectement (via la nationalité, le pays de naissance des parents)", "réservées aux entreprises"], "a": 2, "e": "Le modèle républicain refuse de classer les individus par « race » ou ethnie : la CNIL autorise des études de « discriminations » par des méthodes indirectes (testing, enquêtes de perception).", "d": "<b>L'universalisme contre les catégories</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le débat : pour mesurer (et combattre) les discriminations, ne faudrait-il pas des statistiques ethniques (comme les USA ou le Royaume-Uni) ? l'argument contre : l'indivisibilité (« la République ne reconnaît que des individus »), le risque de figer des « communautés », la mémoire de Vichy (fichiers) : l'argument pour : sans mesure, pas de politique efficace (le testing pallie en partie) : le compromis : la CNIL et la loi de 1978 encadrent ; les études utilisent la nationalité, le lieu de naissance des parents (CES 2007), le testing direct : cette controverse mesure classique est souvent demandée en dissertation EMC ou SES — les deux positions avec leurs arguments forts, c'est la clé.</div>"},
{"t": "Égalité et discriminations (EMC)", "q": "Les écarts salariaux entre femmes et hommes persistent (~15 % à temps plein comparable) : parmi les causes documentées :", "c": ["des freins objectifs (temps partiel subi, interruptions de carrière, plafond de verre, métiers féminins moins valorisés)", "le hasard", "l'absence de loi sur le sujet", "une différence biologique de compétences"], "a": 0, "e": "Les facteurs : ségrégation professionnelle (métiers féminisés moins payés), temps partiel subi, maternité (pénalité de carrière), négociation salariale, plafond de verre dans les promotions.", "d": "<b>L'égalité proclamée, l'écart constaté</b>.<div class='ex-detail'><u>Exemple rédigé</u> : à poste égal et expérience égale, l'écart tombe à ~5 % — mais le reste s'explique par : 1) la VALEUR des métiers féminins (aide-soignante < technicien) : 2) le temps partiel majoritairement subi par les femmes : 3) la « pénalité de maternité » (une première enfant baisse durablement les revenus féminins, pas masculins) : 4) le plafond de verre (moins de 10 %-15 % de dirigeantes) : les réponses : loi 2006 (égalité salariale obligatoire de négociation), index égalité professionnelle (2019 : les entreprises de 50+ salariés doivent publier un index, sous peine d'amendes), rupture conventionnelle pour les parents : l'analyse causale est le cœur d'une bonne EC : lister les mécanismes, pas seulement le chiffre.</div>"},
{"t": "Égalité et discriminations (EMC)", "q": "Le harcèlement sexuel (pénalisé depuis 1992, renforcé 2012-2018) se définit par :", "c": ["un flirt réciproque", "une conversation privée", "des propos ou comportements à connotation sexuelle répétés (ou tout acte de pression, même unique, en vue d'obtenir un acte sexuel) qui portent atteinte à la dignité ou créent une situation intimidante", "un seul propos déplacé"], "a": 2, "e": "Loi de 2012 : définition élargie ; 2018 : harcèlement de rue verbalisé (contravention), délai de prescription étendu ; 2021-2022 : extension aux cyberspace, protection des témoins.", "d": "<b>La loi rattrape la société</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la loi de 2012 introduit la définition UE (répétition OU acte unique de pression) : 2018 : à la suite de #MeToo, le harcèlement de rue (sifflets, commentaires, suivis) devient une contravention d'amende (450 €) : l'obligation de protection dans l'entreprise (nouvelle obligation de prévention en 2023) : la charge de la preuve est aménagée, la prescription prolongée (jusqu'à 30 ans pour les mineurs) : la dynamique : droit initial (1992) → retouche (2003) → refonte (2012) → renforcement (2018) : c'est l'illustration du droit qui évolue AVEC les mobilisations sociales — un exemple historique vivant, parfait pour la dissertation « la loi suit-elle les mœurs ? ».</div>"},
{"t": "Égalité et discriminations (EMC)", "q": "La notion d'« intersectionnalité » (Crenshaw) désigne :", "c": ["la parité hommes-femmes", "la discrimination positive unique", "l'addition des impôts", "l'articulation de plusieurs discriminations pour une même personne (ex. : une femme noire handicapée), produisant des effets spécifiques"], "a": 3, "e": "Les discriminations ne s'additionnent pas simplement : elles se combinent (le genre ET l'origine ET le handicap), ce que ne voit pas une approche critère par critère.", "d": "<b>Quand les discriminations se combinent</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une étude emblématique (Crenshaw, 1989, sur l'embauche aux USA) : ni les politiques « femmes » (pensées pour des femmes blanches) ni les politiques « noirs » (pensés pour des hommes noirs) ne représentent les femmes noires : l'intersection crée une expérience SPÉCIFIQUE : en France, la notion alimente les débats (mouvements sociaux, universités) et les critiques (risque de fragmentation de l'universel républicain, « catalogue » de minorités) : en EMC, la position équilibrée : comprendre l'OUTIL d'analyse (une seule personne peut cumuler des désavantages) sans nécessairement adopter toutes ses déclinaisons politiques : la nuance fait la différence entre une copie moyenne et une copie excellente.</div>"},
{"t": "Égalité et discriminations (EMC)", "q": "Les « cordées de la réussite » ou les bourses au mérite relèvent de :", "c": ["la discrimination (illégale)", "une politique d'égalité des chances : un traitement différencié pour compenser des handicaps sociaux de départ", "des quotas ethniques interdits", "la sélection naturelle"], "a": 1, "e": "Égalité formelle (« même loi ») ≠ égalité réelle : les dispositifs ciblés (bourses, ZEP, cordées) traitent différemment pour égaliser les chances — légitimes car fondés sur des critères objectifs (ressources, territoire), non interdits.", "d": "<b>Traiter différemment pour égaliser</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une bourse versée aux familles modestes « discrimine » les riches ? NON : le critère (les revenus) est objectif et le but est l'égalité RÉELLE (compenser un désavantage subi, non choisi) : cette distinction (critère interdit/permit) structure tout le droit : un handicapé obtient un aménagement (légal, compensation) : un loisir réservé à une « race » (interdit) : le débat philosophique : jusqu'où corriger ? Rawls (égalité des chances + différence au bénéfice des plus défavorisés) vs l'égalité formelle stricte : une EC sur « l'égalité est-elle l'uniformité ? » trouve ici tous ses arguments.</div>"},
{"t": "L'engagement citoyen (EMC)", "q": "La loi du 1er juillet 1901 sur les associations :", "c": ["garantit la liberté d'association (création par simple déclaration) : socle de l'engagement associatif français", "interdit les associations", "concerne uniquement le sport", "crée les syndicats"], "a": 0, "e": "Adoptée par Waldeck-Rousseau : quiconque peut créer une association par déclaration en préfecture (1,5 million d'associations aujourd'hui).", "d": "<b>Une liberté majeure, une déclaration</b>.<div class='ex-detail'><u>Exemple rédigé</u> : avant 1901, toute association de plus de 20 membres nécessitait une AUTORISATION gouvernementale (précaution héritée de la Révolution : la loi Le Chapelier 1791 interdisait les corporations !) : 1901 : déclaration simple, personnalité juridique, contrat libre entre membres : résultat : le tissu associatif français (sport, culture, parents d'élèves, humanitaire, environnement) est l'un des plus denses du monde : 13 millions de bénévoles : en EMC, la loi 1901 est LE point de départ de tout sujet sur l'engagement — c'est le droit qui a OUVERT l'espace de l'engagement.</div>"},
{"t": "L'engagement citoyen (EMC)", "q": "Le taux d'abstention élevé chez les jeunes Français s'explique notamment par :", "c": ["l'impossibilité juridique de voter avant 25 ans", "l'absence d'inscription sur les listes", "le vote obligatoire", "la défiance envers les partis et les institutions, le sentiment d'inefficacité du vote, la concurrence des modes d'engagement alternatifs"], "a": 3, "e": "L'inscription est automatique depuis 1997 : les causes sont politiques et sociales (défiance, désaffiliation partisane, engagement par d'autres canaux).", "d": "<b>Un rapport renouvelé à la politique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : chiffres : aux européennes, l'abstention des 18-24 ans dépasse souvent 60-70 % : aux législatives, elle progresse aussi : l'inscription est automatique, le droit existe — donc l'explication est SOCIOLOGIQUE : défiance (baromètres CEVIPOF : la majorité des jeunes pensent que « voter ne change rien »), rejet des appareils partisans, individualisation des parcours : MAIS les mêmes jeunes marchent pour le climat, signent des pétitions (plusieurs millions de signatures sur les plateformes), achètent éthique : ils déplacent l'engagement du vote-vers-la-cause : l'analyse correcte en EC : distinguer abstention (faiblesse DÉMOCRATIQUE) et nouvelles formes (recomposition de l'engagement) — la nuance qui fait la différence.</div>"},
{"t": "L'engagement citoyen (EMC)", "q": "Le droit de grève en France :", "c": ["est réservé aux salariés du privé", "est un droit constitutionnel (préambule de 1946), exercé collectivement, avec des limites (service minimum dans certains services publics, préavis pour les agents publics)", "doit être autorisé par l'employeur", "n'existe pas"], "a": 1, "e": "Droit garanti par le préambule de 1946, encadré par la loi (préavis, interdiction de grève politique pour les fonctionnaires, retenue sur salaire).", "d": "<b>La vieille arme collective</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la grève : cesser le travail collectivement pour faire pression : droit reconnu en 1864 (coalitions), 1884 (syndicats), 1946 (constitutionnalisation) : limites : pour les fonctionnaires, préavis de 5 jours, interdiction des grèves « politiques » (sur des revendications salariales/travail uniquement) : retenue sur traitement (1/30 par jour) : services minimums (transport, santé, éducation — lois récentes pour certaines catégories) : la grève illustre l'engagement CONFLICTUEL : la négociation collective suppose la menace crédible de l'arrêt du travail — un classique des EC sur « les conflits sont-ils utiles à la démocratie ? ».</div>"},
{"t": "L'engagement citoyen (EMC)", "q": "Un « lanceur d'alerte » (whistleblower) est :", "c": ["un délateur rémunéré", "une personne qui signale, de bonne foi et de manière désintéressée, des faits graves (illégalité, atteinte à l'environnement, danger sanitaire) qu'elle a constatés dans son cadre professionnel", "un journaliste qui publie n'importe quoi", "un fonctionnaire en grève"], "a": 1, "e": "Définition de la loi Sapin II (2016) et Waserman (2022) : signalement en interne d'abord, protection contre les représailles, dispositifs de signalements sécurisés (CIIA).", "d": "<b>Signaler, sans être détruit</b>.<div class='ex-detail'><u>Exemple rédigé</u> : exemples emblématiques : l'affaire du sang contaminé (1980-90s), l'affaire du Mediator (Irène Frachon), LuxLeaks (Antoine Deltour), le dieselgate (chercheurs qui ont documenté les émissions de VW) : avant la protection, le lanceur était licencié, poursuivi : aujourd'hui : signalement hiérarchisé (interne → autorités → public en dernier recours), protection contre le licenciement, circonstances aggravantes si représailles : pourquoi c'est fondamental : les fraudes et dangers sont visibles D'ABORD par les insiders — sans protection, silence permanent : l'engagement de vigilance est désormais un DROIT protégé — un exemple de copie parfait pour « l'engagement citoyen prend-il de nouvelles formes ? ».</div>"},
{"t": "L'engagement citoyen (EMC)", "q": "La socialisation politique (famille, école, pairs) :", "c": ["n'influence pas les choix de vote", "concerne uniquement les mineurs", "n'existe pas en démocratie", "influence fortement les orientations et l'engagement (transmission des valeurs, effet des parents engagés, expérience scolaire)"], "a": 3, "e": "Les études (CEVIPOF, électoraux) montrent une transmission parentale significative (vote, sensibilité politique), complétée par l'école, les pairs et les événements (événements clés : guerre, crise, mouvement social).", "d": "<b>On ne naît pas citoyen engagé, on le devient</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un enfant de parents syndiqués discussant politique à table : probabilité d'engagement accru, débat précoce : un jeune dont l'école organise un conseil de la vie lycéenne et des débats : apprentissage de la prise de parole, du vote, du compromis : des études confirment : la transmission parentale (corrélation des choix de vote parents-enfants), l'effet des événements de jeunesse (génération 68, génération climat) : conséquence pour l'EMC : l'engagement n'est pas un don, c'est un APPRENTISSAGE — d'où le rôle central de l'école (CVC/CVL, délégués, débats argumentés, simulation de procès, conseil municipal des jeunes) : c'est la thèse de la « citoyenneté apprise » — un argument d'examen qui se place partout.</div>"},
{"t": "L'engagement citoyen (EMC)", "q": "Les marches pour le climat (2019) illustrent :", "c": ["une mobilisation de masse à faible coût militant, qui impose un thème à l'agenda politique sans passer par les partis", "un mouvement syndical", "l'inefficacité totale de l'engagement", "l'interdiction de manifester"], "a": 0, "e": "Centaines de milliers de jeunes : pression dans la rue + réseaux : le climat devient priorité politique (conventions, plans, lois) — même si la conversion en décisions reste lente.", "d": "<b>Imposer l'agenda : un pouvoir réel</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mobilisation « Fridays for Future » (inspirée par Greta Thunberg) : marches scolaires hebdomadaires, tribunes, pétitions massives : effets : couverture médiatique continue, réponses politiques (grand débat, convention citoyenne climat en France, objectifs européens renforcés, plans de relance « verts ») : limites : pas de décision directe, essoufflement, conflits internes sur les tactiques : l'analyse en EC : une mobilisation peut gagner la BATAILLE DE L'AGENDA (le sujet devient central) tout en perdant la BATAILLE DES DÉCISIONS (les mesures concrètes) : cette distinction est exactement le genre d'analyse fine attendue au lycée.</div>"},
{"t": "L'engagement citoyen (EMC)", "q": "Le service civique (2010) permet aux 16-25 ans :", "c": ["de s'engager 6 à 12 mois, indemnisé, dans une mission d'intérêt général (solidarité, éducation, environnement)", "de remplacer le service militaire au combat", "d'être payés au SMIC", "de voter deux fois"], "a": 0, "e": "Volontariat rémunéré (indemnité ~600 €/mois) : l'État finance l'engagement de masse (des dizaines de milliers de volontaires par an).", "d": "<b>L'État finance l'engagement des jeunes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : créé pour offrir un « grand rendez-vous civique » de la jeunesse (après la suspension du service militaire en 1997) : le jeune signe un contrat avec un organisme (association, collectivité, service public), reçoit une indemnité et une formation civique : missions : accompagnement scolaire, solidarité, mémoire, environnement, santé : bilan : des dizaines de milliers de jeunes par an, satisfaction élevée, insertion aidée : le débat : service civique UNIVERSAL (proposition récurrente) ? coût énorme, risque de « main-d'œuvre gratuite » concurrençant l'emploi : en EC, exposer l'outil ET le débat de généralisation est le réflexe attendu.</div>"},
{"t": "L'engagement citoyen (EMC)", "q": "Les « gilets jaunes » (2018-2019) ont illustré :", "c": ["la fin de la démocratie", "un vote blanc massif", "une forme d'engagement NON partisane (mouvement social auto-organisé, hors syndicats et partis), utilisant les ronds-points et les réseaux", "l'interdiction de manifester"], "a": 2, "e": "Mouvement social inédit : sans affiliation, assemblées locales, pétition en ligne massive, blocages — impose le grand débat national et des mesures (retrait de la taxe carbone, prime d'activité).", "d": "<b>La participation sans les partis</b>.<div class='ex-detail'><u>Exemple rédigé</u> : déclencheur : la hausse de la taxe carbone sur le carburant : réaction : gilets fluorescents (obligation d'avoir un gilet dans la voiture !), blocages de ronds-points, manifestations massives, pétition de plus d'un million de signatures : organisation : sans leaders officiels, assemblées, listes de doléances, réseaux sociaux : résultats : retrait de la taxe, grand débat national, prime d'activité (+100 €), référendum d'initiative citoyenne (RIC) demandé : la leçon pour la copie : l'engagement peut être SAUVAGE (hors institutions) et pourtant décisif — mais aussi éphémère et parfois violent (débordements, morts) : l'analyse équilibrée (efficacité + limites) est ce qui est attendu, pas la condamnation ou l'idéalisation.</div>"},
{"t": "L'engagement citoyen (EMC)", "q": "À l'école, l'engagement citoyen s'exerce notamment par :", "c": ["les punitions", "l'élection des délégués de classe, le CVC/CVL, la MDL, les projets citoyens et les journées d'engagement", "les notes", "le brevet"], "a": 1, "e": "", "d": "<b>L'école, une mini-démocratie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le délégué élu au scrutin uninominal (apprentissage du vote), le CVL (conseil de la vie lycéenne : propositions sur la vie du lycée), la MDL (association lycéenne, budget), les clubs, les journaux (loi 1890 sur la liberté de l'écriture lycéenne), les journées d'engagement, la presse au lycée, les débats : toutes ces instances enseignent la démocratie EN PRATIQUANT : élections, budgets, débats, compromis : les études montrent que les élèves engagés dans ces instances votent plus tard plus souvent : la citoyenneté se pratique, elle ne se récite pas — l'argument central de toute l'EMC scolaire.</div>"},
{"t": "L'engagement citoyen (EMC)", "q": "La consommation engagée (boycott, « buycott », commerce équitable) est une forme d'engagement :", "c": ["interdite par la loi", "sans aucun effet", "réservée aux adultes", "économique : agir par ses choix d'achat pour influencer les pratiques (environnement, travail des enfants, droits)"], "a": 3, "e": "", "d": "<b>Voter avec son portefeuille</b>.<div class='ex-detail'><u>Exemple rédigé</u> : boycott de marque (travail des enfants, publicité sexiste) : buycott (acheter solidaire, équitable, local) : impact documenté : le « éthique » pèse des milliards (maxi-discounts mis en difficulté sur le textile, filières équitables normalisées) : limites : coût (les produits éthiques coûtent plus cher — inégalité sociale de l'engagement), info imparfaite (greenwashing), effet dilué face aux géants : néanmoins l'effet agrégé (des millions de consommateurs) modifie l'offre (labels, filières) : en EC, c'est l'exemple parfait d'engagement « quotidien » accessible dès l'adolescence — la transition de la « petite décision » au « grand effet collectif » est une belle conclusion de copie.</div>"},
{"t": "Médias et liberté d'expression (EMC)", "q": "La liberté d'expression en France est protégée notamment par :", "c": ["l'article 2 de la Constitution", "la loi de 1905", "l'article 11 de la DDHC et la loi de 1881 sur la liberté de la presse", "un décret de 1958"], "a": 2, "e": "Art. 11 DDHC (« un des droits les plus précieux de l'homme ») + loi du 29 juillet 1881 (régime de la presse : liberté, responsabilité a posteriori) + art. 10 CEDH.", "d": "<b>Une liberté cardinale, un régime juridique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 1789 : la censure royale abolie, la libre communication proclamée : 1881 : le régime répressif d'avant (autorisations, cautionnements) est remplacé par la responsabilité APRÈS publication (on peut tout dire, on répond de ses propos devant un juge) : aujourd'hui : critique des religions protégée (le blasphème n'est PAS un délit depuis 1791 !), satire et caricature protégées, mais diffamation et haine punies : l'équilibre : une liberté LARGE avec des limites précises, jugées par un juge (pas par un ministre, pas par une foule, pas par une plateforme) : en EC, citer 1881 + 1789 montre la maîtrise des textes fondateurs.</div>"},
{"t": "Médias et liberté d'expression (EMC)", "q": "La diffamation (art. 29 loi 1881) se définit comme :", "c": ["une allégation ou imputation d'un fait précis qui porte atteinte à l'honneur, SANS preuve de véracité (ou sans légitimité)", "une opinion défavorable", "un article critique", "une blague"], "a": 0, "e": "", "d": "<b>Le fait précis, sans preuve</b>.<div class='ex-detail'><u>Exemple rédigé</u> : écrire « ce maire est incompétent » = opinion (protégée, même blessante) : écrire « ce maire a détourné 50 000 € » = allégation de FAIT : si l'auteur prouve la vérité (documents, enquête) → pas de diffamation : si non → diffamation (amende, jusqu'à prison dans certains cas aggravés) : nuances : la bonne foi (enquête sérieuse), le droit de réponse, les genres protégés (satire, roman à clef) : la diffamation encadre le RISQUE de la parole publique sans l'interdire : la ligne de partage FAIT (prouvable) / OPINION (libre) est un outil d'analyse redoutablement efficace en EMC comme en français (l'argumentation factuelle).</div>"},
{"t": "Médias et liberté d'expression (EMC)", "q": "Le journalisme d'investigation (Panama Papers, 2016) illustre le rôle de « contre-pouvoir » des médias :", "c": ["vrai : la publication vérifiée d'informations confidentielles peut déclencher démissions et enquêtes judiciaires, contrôlant ainsi les puissants", "réservé aux journalistes d'État", "vrai seulement aux USA", "faux : les journalistes n'ont aucun droit"], "a": 0, "e": "L'ICIJ a coordonné 400 journalistes : démissions, enquêtes fiscales, agenda mondial sur les paradis fiscaux : l'information comme contrôle.", "d": "<b>Informer, c'est contrôler</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 11,5 millions de documents (fuite « Mossack Fonseca » : sociétés offshore) : le consortium ICIJ vérifie pendant des mois (pas de publication à chaud, croisement des sources) : publication simultanée dans des dizaines de médias (2016) : effets : chute du Premier ministre islandais, enquêtes dans des dizaines de pays, lois anti-paradis fiscaux (transparence des bénéficiaires effectifs) : la leçon : une démocratie sans contre-pouvoir médiatique ne peut PAS corriger ses puissants (le Watergate a fait tomber Nixon, les révélations des « Luxembourg Leaks » ont fait plier des multinationales) — le journalisme d'enquête est coûteux (heures, avocats, risques) : le modèle économique fragile (presse en crise) menace donc la démocratie elle-même : argument fort en dissertation.</div>"},
{"t": "Médias et liberté d'expression (EMC)", "q": "Selon l'étude du MIT (2018) sur Twitter, les fausses informations :", "c": ["ne se propagent pas", "concernent uniquement la politique", "se propagent plus vite et plus loin que les vraies (70 % plus susceptibles d'être retransmises), portées par la surprise et le dégoût", "se propagent moins vite que les vraies"], "a": 2, "e": "Vosoughi, Roy et Aral (Science, 2018) : 126 000 rumeurs analysées : le faux gagne la viralité, surtout politiques, par l'émotion (surprise, dégoût) — pas principalement par les bots, mais par les humains.", "d": "<b>Le faux court plus vite</b>.<div class='ex-detail'><u>Exemple rédigé</u> : méthode : 126 000 contes/rumeurs vérifiés (2006-2017) : résultat : les fausses nouvelles atteignent 1 500 personnes six fois plus vite que les vraies : l'émotion (étonnement, dégoût) prédit le partage — la vérité, elle, est souvent banale (moins « partageable ») : les BOTS ne sont pas les principaux vecteurs : ce sont les humains (l'émotion humaine est le carburant) : implication civique : avant de partager une info CHOQUANTE, se méfier DOUBLEMENT (l'émotion est le signal de viralité, pas de véracité) — croiser, attendre, vérifier : l'étude du MIT est LA référence chiffrée à citer dans toute EC sur la désinformation.</div>"},
{"t": "Médias et liberté d'expression (EMC)", "q": "La loi française de 2018 relative à la lutte contre la manipulation de l'information vise notamment :", "c": ["à censurer les réseaux sociaux en permanence", "à interdire la critique du gouvernement", "à supprimer l'anonymat", "à permettre de suspendre la diffusion de fausses informations (plates-formes, chaînes contrôlées par une puissance étrangère) en période électorale, avec transparence des contenus sponsorisés"], "a": 3, "e": "La loi (22 décembre 2018) : période électorale (3 mois avant un scrutin), saisine du juge, devoirs de transparence des plateformes (identifiers les sponsors), refus de publicité politique étrangère pendant les campagnes.", "d": "<b>Réguler, sans censurer</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la cible : les manipulations MASSIVES et DÉLIBÉRÉES en période électorale (comptes automatisés, publicités mensongères, relais de puissance étrangère — l'exemple des interférences documentées depuis 2016 aux USA et en Europe) : les outils : obligation des plateformes (transparence des contenus sponsorisés et des algorithmes de recommandation), possibilité de saisir le juge pour suspendre une diffusion (contrôle JUDICIAIRE, pas gouvernemental), information des électeurs : le débat : efficace (durée limitée, critères flous — « manipulation » ?) et liberticide ? la France a choisi un équilibre : la sanction passe par le JUGE — le garde-fou démocratique : à confronter avec le DSA européen (2022 : obligations structurelles des plateformes) : la comparaison des modèles est un sujet d'examen très apprécié.</div>"},
{"t": "Médias et liberté d'expression (EMC)", "q": "L'éducation aux médias et à l'information (EMI) recommande notamment :", "c": ["de ne lire que la presse internationale", "de croire les sources officielles sans vérifier", "d'éviter complètement les réseaux sociaux", "de croiser les sources, distinguer fait et opinion, vérifier la provenance avant de partager, utiliser le fact-checking"], "a": 3, "e": "L'EMI : identifier la source (qui, quel intérêt ?), croiser, contextualiser, distinguer fait/opinion, repérer les émotions manipulatrices — les outils : AFP Factuel, Vrai ou Fake, les décryptages.", "d": "<b>L'esprit critique est une méthode, pas un don</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la routine EMI en 4 gestes : 1) LA SOURCE : quel média ? quel auteur ? depuis quand ? (un site anonyme ou un média avec rédaction et corrections) : 2) LE CROISEMENT : au moins deux médias indépendants rapportent-ils le fait ? : 3) LE CONTEXTE : la date, le lieu, la citation complète (le «quote-mining » — sortir une phrase de son contexte — est la manipulation la plus fréquente) : 4) L'ÉMOTION : le titre me met en colère ? signal ALARME (la colère est le carburant du faux) : ces gestes, enseignés dès le collège (CLEMI, Semaine de la presse), sont LE capital civique numérique — un plan de EC tout trouvé sur « comment devenir un citoyen éclairé à l'ère numérique ? ».</div>"},
{"t": "Médias et liberté d'expression (EMC)", "q": "En France, le pluralisme médiatique est encadré par :", "c": ["les plateformes elles-mêmes", "l'Arcom (ex-CSA) : équité des temps d'antenne, contrôle des campagnes, respect du pluralisme politique ; la loi limite la concentration des médias", "le ministère de l'Information", "le Conseil constitutionnel uniquement"], "a": 1, "e": "L'Arcom (fusion CSA + Hadopi, 2022) veille à l'équité, au pluralisme, à la protection des mineurs ; la loi de 1986 encadre la concentration (seuils de diffusion).", "d": "<b>Un marché encadré pour une opinion libre</b>.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi réguler : si un seul groupe contrôle les chaînes, les radios et les journaux, l'opinion publique perd son pluralisme (l'exemple de démocraties où les médias sont aux mains du pouvoir) : les outils français : temps de parole des politiques mesuré et équilibré (pendant les campagnes : égalité puis temps proportionnel), débats obligatoires, seuils de concentration (un groupe ne peut dépasser un certain % de l'audience), chaînes publiques (France Télévisions, Radio France) financées par la redevance (aujourd'hui contribution à l'audiovisuel public intégrée à l'impôt) : les limites : les groupes privés (industriels, tech) restent puissants : en EC, l'argument : le pluralisme n'est pas un luxe, il est la CONDITION du débat démocratique — et il se défend par le droit ET par la consommation (soutenir une presse diverse).</div>"},
{"t": "Médias et liberté d'expression (EMC)", "q": "L'apologie du terrorisme et l'incitation à la haine raciale :", "c": ["sont protégées par la liberté d'expression", "sont des opinions comme les autres", "ne concernent que la presse écrite", "sont des délits : la liberté d'expression s'arrête quand elle prêche la violence ou la haine envers des personnes (lois de 1972, 1986, 2017)"], "a": 3, "e": "La protection couvre la critique des IDÉES (y compris religieuses) mais pas l'incitation à la VIOLENCE ou à la HAINE envers des PERSONNES (art. 24 loi 1881, loi Pleven 1972, loi de 2017 sur le cyberharcèlement).", "d": "<b>Des idées aux personnes : la frontière</b>.<div class='ex-detail'><u>Exemple rédigé</u> : protégé : « je critique cette religion, cette doctrine, cette politique » (même violemment, même en caricaturant) : puni : « il faut s'attaquer aux adeptes de... », « les X sont des sous-hommes », l'appel à la violence : la distinction juridique : la critique des IDÉES est le cœur de la liberté (sans elle, pas de débat) : l'incitation à la HAINE/VIOLENCE contre des PERSONNES détruit les conditions mêmes du débat (peur, exclusion) : les lois (Pleven 1972 contre le racisme, 1986 puis 2014-2017 contre l'apologie du terrorisme) traduisent l'expérience historique (Dreyfus, génocides, terrorisme récent) : cette grille « idées/personnes » est LA clé de raisonnement des sujets d'expression — elle évite deux erreurs symétriques : tout interdire (censure) et tout autoriser (complicité de haine).</div>"},
{"t": "Médias et liberté d'expression (EMC)", "q": "Le « clickbait » (ou « putaclic ») désigne :", "c": ["une erreur de journalisme", "un réseau social", "des titres sensationnalistes conçus pour provoquer le clic (souvent trompeurs sur le contenu réel de l'article)", "une catégorie juridique"], "a": 2, "e": "Le titre vend l'émotion (curiosité, colère) plus que l'information : le modèle économique (publicité au clic) pousse à la viralité plutôt qu'à la véracité.", "d": "<b>Quand l'économie de l'attention déforme l'information</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : les recettes publicitaires dépendent des clics : donc le titre doit PROVOQUER (curiosité : « vous ne devinerez jamais... » ; colère : « ce qu'il a dit est inadmissible ») : le contenu, lui, est souvent plus modeste (d'où le sentiment de tromperie) : les conséquences civiques : hiérarchie de l'information faussée (les sujets « clicables » écrasent les sujets importants), fatigue et méfiance envers les médias : les réponses : modèles de financement alternatifs (abonnement, mécénat, aide publique), médias « lents » (longform, décryptage), éducation au repérage du clickbait (le titre promet-il plus que l'article ne donne ?) : un exemple d'analyse économique appliquée à la démocratie — parfait pour une EC interdisciplinaire EMC/SES.</div>"},
