var PROGRAMME = [{"n": "Collège/Lycée — EMC", "ch": [{"t": "Valeurs et principes de la République", "id": "valeurs-principes"}, {"t": "La laïcité : liberté, neutralité, séparation", "id": "laicite"}, {"t": "Droits et devoirs du citoyen", "id": "droits-devoirs"}, {"t": "Démocratie et régimes politiques", "id": "democratie-regimes"}, {"t": "Justice et droit : l'État de droit", "id": "justice-droit"}, {"t": "Égalité et discriminations", "id": "egalite-discriminations"}, {"t": "L'engagement citoyen", "id": "engagement"}, {"t": "Médias et liberté d'expression", "id": "medias-liberte-expression"}, {"t": "La défense nationale et l'armée", "id": "defense-nationale"}]}];
var COURS_META = [
{"id": "valeurs-principes", "theme": "Valeurs et principes de la République (EMC)", "niveau": "Collège/Lycée — EMC", "titre": "Valeurs et principes de la République", "cours": "<div class=\"cours-head\"><h2>Valeurs et principes de la République</h2><p>Liberté, égalité, fraternité ; laïcité ; indivisibilité : d'où viennent ces principes, que signifient-ils, comment s'appliquent-ils ?</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Devise : Liberté, Égalité, Fraternité (1848, héritage de 1789).<br>— Symboles : drapeau tricolore, Marseillaise, Marianne, 14 Juillet.<br>— Principes : République indivisible, laïque, démocratique et sociale.<br>— Constitution de 1958, article 1er.</div>\n<h3>1. La devise républicaine</h3>\n<div class=\"tip\"><b>Liberté</b> : liberté de conscience, d'expression, de circulation, d'association — limitée par la loi et par la liberté d'autrui (art. 4 DDHC : « la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui »).<br><b>Égalité</b> : devant la loi (art. 1er DDHC : « les hommes naissent et demeurent libres et égaux en droits »), égalité des chances, égalité femme-homme (le mot « citoyenne » n'apparaît qu'en 1946 dans le préambule).<br><b>Fraternité</b> : solidarité entre citoyens (l'école gratuite, la Sécurité sociale, l'impôt progressif en sont des traductions concrètes).<br><b>Histoire :</b> devise de 1789 formalisée en 1848 (Deuxième République) ; inscrite dans les constitutions de 1946 et 1958 ; exigée par le Conseil constitutionnel comme principe fondamental.</div>\n<h3>2. Les symboles de la République</h3>\n<table><tr><th>Symbole</th><th>Origine</th><th>Statut</th></tr>\n<tr><td>Drapeau tricolore</td><td>1789 (union du roi et de Paris : bleu et rouge entourant le blanc)</td><td>Constitution art. 2</td></tr>\n<tr><td>Marseillaise (Rouget de Lisle, 1792)</td><td>Chant de guerre de l'armée du Rhin</td><td>Hymne national</td></tr>\n<tr><td>Marianne</td><td>Allégorie de la République (buste dans les mairies)</td><td>Symbole officiel</td></tr>\n<tr><td>14 Juillet</td><td>Fête nationale (1880 ; double souvenir : 1789 et 1790)</td><td>Fête légale</td></tr>\n<tr><td>Coq, devise, faisceau</td><td>Emblèmes complémentaires</td><td>Usage officiel</td></tr></table>\n<h3>3. Les principes structurants</h3>\n<div class=\"tip\"><b>Article 1er de la Constitution de 1958 :</b> « La France est une République indivisible, laïque, démocratique et sociale. »<br><b>Indivisibilité :</b> une seule loi sur tout le territoire (pas de lois locales), une seule langue officielle (le français — art. 2), un seul peuple. Exception : la Corse dispose d'un statut particulier discuté, la Nouvelle-Calédonie d'un statut spécifique.<br><b>Démocratique :</b> la souveraineté appartient au peuple (élections, référendum — art. 3).<br><b>Sociale :</b> la République organise la solidarité (préambule de 1946 : droit au travail, à la santé, à l'instruction).<br><b>Laïque :</b> liberté de conscience, séparation des Églises et de l'État (1905), neutralité de l'État (chapitre suivant).</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> la devise n'est pas « Liberté, Égalité, Propriété » (projet de 1793 non retenu) et l'ordre des mots a un sens : la fraternité complète et équilibre les deux autres — chaque valeur limite les excès des autres (la liberté absolue détruirait l'égalité, l'égalité absolue étoufferait la liberté).</div>\n<h3>4. Comment ces valeurs se traduisent concrètement</h3>\n<div class=\"tip\"><b>À l'école :</b> laïcité et neutralité des enseignants, gratuité, mixité, obligation scolaire (loi Ferry 1881-1882, lois Jules Ferry).<br><b>Dans la justice :</b> égalité devant la loi, présomption d'innocence, justice gratuite partiellement (aide juridictionnelle).<br><b>Dans la vie civique :</b> vote, jury d'assises, parrainage républicain, JDC (Journée défense et citoyenneté).</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la fraternité, valeur oubliée puis centrale</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi la fraternité, absente de la DDHC de 1789, est-elle devenue le troisième mot de la devise ? Donne deux exemples concrets de sa traduction juridique.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>L'histoire</b> : 1789 proclame la liberté et l'égalité des droits ; la fraternité émerge dans les clubs et l'armée (1792 : « tous frères ») et s'impose en 1848 (République sociale) — elle a longtemps été la valeur « oubliée » des constitutions (absente des textes de 1958 jusqu'à une loi de 2021 qui l'inscrit dans le Code de l'éducation comme principe de la neutralité et du vivre-ensemble).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>La traduction juridique</b> : 1) la Sécurité sociale (1945) : « la fraternité institutionnalisée » (solidarité organisée par le droit, pas laissée à la charité) : 2) le délit de non-assistance à personne en danger (art. 223-6 Code pénal) : la loi OBLIGE au secours d'autrui : 3) l'impôt progressif et le RSA (droit à un minimum d'existence).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : la fraternité est le ciment qui rend compatibles la liberté et l'égalité : sans elle, la société se réduit à un marché d'individus ; avec elle, elle devient une communauté de citoyens. Exemple d'argumentaire transposable en dissertation d'EMC ou de philo.</div></div></details>"},
{"id": "laicite", "theme": "La laïcité : liberté, neutralité, séparation (EMC)", "niveau": "Collège/Lycée — EMC", "titre": "La laïcité : liberté, neutralité, séparation", "cours": "<div class=\"cours-head\"><h2>La laïcité</h2><p>Un principe à trois faces : liberté de conscience, neutralité de l'État, séparation des Églises et de l'État. Histoire, droit, débats.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— 1882 : école laïque (Ferry). 1886 : personnel laïque (Goblet).<br>— 1905 : loi de séparation des Églises et de l'État.<br>— 2004 : loi sur les signes religieux ostensibles à l'école.<br>— Laïcité = liberté de croire ou non + neutralité des services publics.</div>\n<h3>1. L'histoire : d'une République en conflit à une République pacifiée</h3>\n<div class=\"tip\"><b>XIXe siècle :</b> l'Église catholique et la République s'affrontent (syllabus, « drapeau blanc » : l'anticléricalisme de combat). Les lois Ferry (1881-1882) rendent l'école publique gratuite et laïque (morale substituée au catéchisme) ; loi Goblet (1886) : personnel enseignant laïque.<br><b>1889-1905 :</b> l'affaire Dreyfus (1894-1906) creuse la fracture ; le « combattisme » culmine (loi de 1901 sur les associations, loi de 1904 interdisant l'enseignement congréganiste).<br><b>9 décembre 1905 :</b> <b>loi de séparation des Églises et de l'État</b> (Aristide Briand, Émile Combes) : « La République assure la liberté de conscience. Elle garantit le libre exercice des cultes. » (art. 1er) et « La République ne reconnaît, ne salarie ni ne subventionne aucun culte » (art. 2).<br><b>Régime concordataire en Alsace-Moselle</b> (droit local de 1802, maintenu après 1918 : cultes reconnus et financés) — exception territoriale tolérée par le Conseil constitutionnel.</div>\n<h3>2. Le contenu du principe</h3>\n<div class=\"tip\"><b>Trois piliers</b> (charte de la laïcité, 2013) :<br>1) <b>Liberté de conscience</b> : croire, ne pas croire, changer de religion (art. 1er loi 1905 + art. 10 et 18 DUDH).<br>2) <b>Égalité des citoyens devant la loi</b>, quelle que soit leur conviction : l'État ne privilégie aucun culte.<br>3) <b>Neutralité de l'État</b> : les services publics, les agents publics et l'école sont neutres ; l'État ne finance aucun culte.<br><b>À l'école :</b> la Charte de la laïcité (2013) est affichée ; la loi du 15 mars 2004 interdit les signes et tenues « manifestant ostensiblement une appartenance religieuse » dans les écoles, collèges et lycées publics ; la loi de 2010 interdit la dissimulation du visage dans l'espace public.</div>\n<div class=\"piege\">⚠️ <b>Piège fréquent :</b> la laïcité n'est PAS la restriction des religions : elle protège la liberté de croire ET de ne pas croire ; la limite ne s'applique qu'aux signes OSTENSIBLES dans l'enceinte scolaire, pas aux convictions privées ni à l'« exercice du culte ».</div>\n<h3>3. Les débats actuels</h3>\n<div class=\"tip\"><b>Signes religieux :</b> élèves : interdits à l'école publique (2004) : agents publics : neutralité totale (y compris laïcité « de service » : le contractuel aussi, quand il représente le service) : à l'université, la loi 2004 ne s'applique pas (liberté des étudiants majeurs) : en entreprise privée : seulement si clause du règlement intérieur justifiée ( CJUE 2017).<br><b>Financement des cultes :</b> l'État entretient les églises antérieures à 1905 (affectataires) : les cultes vivent de dons déductibles : la question de l'islam de France (associations culturelles, formation des imams, contrôle étranger des financements — loi de 2021 « séparatisme » renommée « respect des principes de la République ») est un débat récurrent.<br><b>Laïcité et vivre-ensemble :</b> la laïcité comme cadre du débat rationnel à l'école (la morale laïque ne remplace pas les familles, elle forme le citoyen).</div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la loi de 1905 en trois articles</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Montre que la loi de 1905 repose sur deux principes apparemment opposés (garantie et non-reconnaissance) et explique comment ils se complètent.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Les deux articles fondateurs</b> : art. 1er : la République ASSURE la liberté de conscience et GARANTIT le libre exercice des cultes : art. 2 : elle ne RECONNAÎT, ne SALARIE ni ne SUBVENTIONNE aucun culte : d'un côté une protection, de l'autre un désengagement.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>La complémentarité</b> : c'est PARCE QUE l'État ne finance et ne reconnaît aucun culte qu'il peut garantir ÉGALEMENT tous les cultes (et l'athéisme) : s'il finançait un culte, il devrait le favoriser en droit : la neutralité crée l'égalité : exemples d'application : aumôneries dans les internats (possible si demandé), aumôneries militaires, cantine sans porc (service, pas obligation), jours fériés chrétiens (héritage historique toléré comme « fait culturel »).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : la laïcité n'est ni une religion d'État ni une interdiction : c'est un cadre d'arbitrage : l'État arbitre entre les libertés (de culte, d'expression, de ne pas subir) en restant tiers — c'est ce qu'on appelle l'État « séparateur » ou « protecteur » selon les époques : un raisonnement à reprendre pour toute dissertation sur « la laïcité est-elle encore adaptée ? ».</div></div></details>"},
{"id": "droits-devoirs", "theme": "Droits et devoirs du citoyen (EMC)", "niveau": "Collège/Lycée — EMC", "titre": "Droits et devoirs du citoyen", "cours": "<div class=\"cours-head\"><h2>Droits et devoirs du citoyen</h2><p>Citoyenneté : appartenance, droits (civils, politiques, sociaux) et devoirs. Comment devient-on citoyen ? Que doit-on à la communauté ?</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Citoyen = membre du peuple souverain (nationalité + droits politiques).<br>— Droits : civils (1789), politiques (1848/1944), sociaux (1946).<br>— Devoirs : impôt, jury d'assises, école obligatoire, défense.<br>— Citoyenneté européenne (Maastricht, 1992).</div>\n<h3>1. Qu'est-ce que la citoyenneté ?</h3>\n<div class=\"tip\"><b>Définition :</b> statut juridique et politique du membre d'une communauté nationale : il combine <b>nationalité</b> (appartenance), <b>droits</b> (libertés publiques, vote, protection sociale) et <b>devoirs</b> (respect de la loi, impôt, participation).<br><b>Citoyenneté française :</b> par le sang (droit du sang : au moins un parent français), le sol (double droit du sol : né en France d'un parent lui-même né en France), la naturalisation (5 ans de résidence, assimilation linguistique et civique).<br><b>Citoyenneté européenne (1992) :</b> tout citoyen d'un État membre est citoyen de l'Union : vote municipal et européen dans sa commune de résidence, protection consulaire, libre circulation.</div>\n<h3>2. Les trois générations de droits</h3>\n<table><tr><th>Génération</th><th>Droits</th><th>Textes clés</th><th>Exemples</th></tr>\n<tr><td><b>Civiles et politiques (1re)</b></td><td>Liberté, propriété, vote, égalité devant la loi</td><td>DDHC 1789 ; suffrage universel 1848 ; femmes 1944</td><td>Liberté d'expression, éligibilité</td></tr>\n<tr><td><b>Sociales (2e)</b></td><td>Travail, santé, éducation, syndicats</td><td>Préambule de 1946</td><td>Sécu, école gratuite, SMIC</td></tr>\n<tr><td><b>Environnementales et solidarités (3e)</b></td><td>Environnement sain, biodiversité, développement durable</td><td>Charte de l'environnement 2004 (constitutionnalisée)</td><td>Principe de précaution</td></tr></table>\n<h3>3. Les devoirs du citoyen</h3>\n<div class=\"tip\"><b>Devoirs juridiques :</b> respecter la loi (contrat social), payer l'impôt (contribution selon ses facultés contributives — chaque citoyen contribue au financement des services publics), l'instruction obligatoire (6-16 ans), la <b>JDC</b> (Journée défense et citoyenneté), être juré d'assises (tirage au sort, des dizaines de milliers de Français concernés chaque année), recensement à 16 ans, témoignage de solidarité (non-assistance à personne en danger).<br><b>Devoirs civiques non contraignants :</b> voter (depuis 2022, délit de non-inscription ? NON : l'inscription est AUTOMATIQUE à 18 ans depuis 1997, le vote reste un droit non obligatoire en France — contrairement à la Belgique ou l'Australie), s'informer, s'engager (bénévolat, vie associative), dénoncer les injustices (lanceur d'alerte protégé depuis 2013/2022).</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> « le vote est obligatoire en France » : FAUX — c'est un droit (et un devoir moral), pas une obligation légale : l'inscription sur les listes est automatique à 18 ans, mais l'abstention n'est pas sanctionnée (contrairement à la Belgique, l'Australie...).</div>\n<h3>4. Citoyenneté active et engagement</h3>\n<div class=\"tip\"><b>Formes d'engagement :</b> politique (partis, mandats locaux), associative (loi 1901 : 1,5 million d'associations), syndical, humanitaire, numérique (pétitions en ligne, veille civique), écologiste.<br><b>Budget participatif, CVC (conseils de la vie collégienne/lycéenne), CSE :</b> la citoyenneté s'apprend en pratiquant — l'école est une « école de la démocratie » (projet École de la confiance).<br><b>Volontariat :</b> service civique (16-25 ans, indemnité), réserve citoyenne, garde nationale.</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le parcours d'une jeune Française vers la citoyenneté pleine</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Léa, 17 ans, née en France de parents nés à l'étranger (naturalisés avant sa naissance). Étape par étape : quels sont ses droits et devoirs à 16, 18 et 25 ans ?</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>À 16 ans</b> : Léa est française (droit du sang — ses parents naturalisés français avant sa naissance... ou double droit du sol si son aîné est né en France) : recensement obligatoire (mairie) : l'école jusqu'à 16 ans est obligatoire (devoir) : elle peut adhérer à une association (loi 1901 dès 16 ans pour certaines formes), s'engager bénévolement.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>À 18 ans</b> : inscription AUTOMATIQUE sur les listes électorales (1997) : Léa peut voter à toutes les élections (droit politique), être candidate (à 18 ans pour la plupart des mandats), prononcer le juré d'assises si tirée au sort (obligation, sauf excuses valables), payer l'impôt si elle a des revenus.</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>À 25 ans</b> : service civique possible (jusqu'à 25 ans), engagements associatifs et politiques, éligibilité à l'Assemblée nationale (18 ans depuis 2011, la révision constitutionnelle de 2008 a abaissé à 18 ans la candidature)... La citoyenneté est un statut EVOLUTIF : le citoyen « plein » combine l'exercice des droits et l'accomplissement des devoirs — un plan tout prêt pour l'oral du grand oral ou la dissertation EMC.</div></div></details>"},
{"id": "democratie-regimes", "theme": "Démocratie et régimes politiques (EMC)", "niveau": "Collège/Lycée — EMC", "titre": "Démocratie et régimes politiques", "cours": "<div class=\"cours-head\"><h2>Démocratie et régimes politiques</h2><p>Démocratie représentative, semi-directe, participative ; régimes parlementaire, présidentiel, semi-présidentiel : vocabulaire et mécanismes.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Démocratie = gouvernement du peuple (élections libres, pluralisme, droits).<br>— Représentation : le peuple élit des représentants (mandat représentatif).<br>— France : régime semi-présidentiel (président fort + Parlement).<br>— Contre-pouvoirs : presse, justice, société civile.</div>\n<h3>1. Qu'est-ce que la démocratie ?</h3>\n<div class=\"tip\"><b>Étymologie :</b> demos (peuple) + kratos (pouvoir). <b>Définition minimale (Dahl, « polyarchie ») :</b> 1) élections libres, régulières et concurrentielles ; 2) suffrage universel ; 3) libertés d'expression, d'association, d'information ; 4) sources d'information pluralistes ; 5) autonomie des candidats.<br><b>Principes :</b> souveraineté du peuple, majorité + respect des minorités, État de droit (tout pouvoir est limité par le droit), séparation des pouvoirs (Montesquieu), pluralisme politique.<br><b>Démocratie ≠ seulement des élections :</b> une élection sans libertés ni justice indépendante peut être une « dictature électorale » (ex. : scrutins organisés dans des régimes autoritaires).</div>\n<h3>2. Les formes de démocratie</h3>\n<table><tr><th>Forme</th><th>Mécanisme</th><th>Exemples</th></tr>\n<tr><td><b>Représentative</b></td><td>Le peuple élit des représentants qui décident en son nom</td><td>Élections législatives, députés</td></tr>\n<tr><td><b>Semi-directe</b></td><td>Représentation + outils de participation (référendum)</td><td>Référendum (art. 11), RIP (référendum d'initiative partagée, 2008)</td></tr>\n<tr><td><b>Participative</b></td><td>Citoyens impliqués dans la décision ou le débat</td><td>Budgets participatifs, CVC/CVL, conventions citoyennes (climat 2019-2020), pétitions</td></tr></table>\n<h3>3. Les régimes politiques</h3>\n<div class=\"tip\"><b>Régime parlementaire (ex. : Espagne, Allemagne, Italie) :</b> l'exécutif émane du Parlement ; le Premier ministre est responsable devant lui ; chef de l'État ceremonial. Équilibre : dissolution / responsabilité.<br><b>Régime présidentiel (USA) :</b> séparation stricte : le président n'est pas responsable devant le Congrès (pas de dissolution), mandat fixe. Risque : blocages (shutdowns) si majorité présidentielle et congressionnelle divergent.<br><b>Régime semi-présidentiel (France Ve République) :</b> président élu au suffrage universel direct (1962) avec des pouvoirs propres (nomination du PM, dissolution, art. 16, référendum) + gouvernement responsable devant l'Assemblée. Le <b>fait majoritaire</b> (élection du président puis législatives) a fait « présidentialiser » le régime ; la cohabitation (1986-88, 1993-95, 1997-2002) en a montré la souplesse.<br><b>Distinction totale/autoritaire :</b> régime totalitaire (parti unique, idéologie, terreur, propagande : URSS stalinienne, Allemagne nazie) ; autoritaire (pouvoir concentré sans idéologie totalisante).</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> la Ve République n'est PAS un régime présidentiel : le gouvernement EST responsable devant l'Assemblée (motion de censure, art. 49). La confusion vient du « fait majoritaire » — mais juridiquement, le régime reste semi-présidentiel (dualité de l'exécutif + responsabilité).</div>\n<h3>4. Les dangers et les remparts</h3>\n<div class=\"tip\"><b>Dangers :</b> populisme (appeler au peuple contre les corps intermédiaires), personnalisation, abstention et défiance, capture des médias et désinformation, révision constitutionnelle biaisée (démocratie « illibérale » : Hongrie, Turquie : élections maintenues, contre-pouvoirs affaiblis).<br><b>Remparts :</b> constitutionnalisme (contrôle de constitutionnalité), justice indépendante, presse libre (4e pouvoir), société civile (syndicats, associations), organisations internationales (CEDH : recours individuel).<br><b>Indicateurs :</b> rapports Freedom House, V-Dem : déclin mondial de la liberté depuis ~2006.</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — une motion de censure, mode d'emploi</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'Assemblée nationale estime que la politique du gouvernement est mauvaise. Quels sont ses moyens juridiques ? Illustre avec 1962 et 2024.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Les instruments</b> : questions au gouvernement (hebdomadaire), résolutions, commissions d'enquête... et surtout la <b>motion de censure</b> (art. 49 al. 2 : déposée par au moins 1/10 des députés, votée à la majorité ABSOLUE : si elle passe, le gouvernement DOIT démissionner).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>1962</b> : le gouvernement Pompidou engage sa responsabilité sur la réforme de l'élection présidentielle au suffrage universel direct : motion de censure votée (280 voix) : de Gaulle dissout l'Assemblée (art. 12) : les électeurs RÉÉLISENT une majorité gaulliste : le peuple arbitre le conflit entre assemblée et gouvernement — la dissolution comme réponse démocratique.</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>2024</b> : la motion de censure (après l'engagement de responsabilité sur le budget) renverse le gouvernement Barnier (première censure votée depuis 1962 !) : le président nomme un nouveau gouvernement sans dissolution possible dans l'immédiat (pas de double dissolution en moins d'un an) : la mécanique constitutionnelle (censure → nouveau gouvernement → arbitrages) montre que la Ve République contient des soupapes — mais aussi des blocages : exactement le genre de cas concret à mobiliser en EC ou en dissertation.</div></div></details>"},
{"id": "justice-droit", "theme": "Justice et droit : l'État de droit (EMC)", "niveau": "Collège/Lycée — EMC", "titre": "Justice et droit : l'État de droit", "cours": "<div class=\"cours-head\"><h2>Justice et droit</h2><p>Droit, justice, État de droit : comment le droit organise la société et comment la justice protège le citoyen.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Droit = ensemble des règles de conduite sanctionnées par l'État.<br>— État de droit : tout pouvoir est soumis au droit.<br>— Justice : judiciaire (tribunaux), administrative (Conseil d'État).<br>— Principes : égalité devant la loi, présomption d'innocence, double degré, procès équitable.</div>\n<h3>1. Le droit : normes et hiérarchie</h3>\n<div class=\"tip\"><b>Sources du droit :</b> la Constitution (bloc de constitutionnalité : DDHC 1789, préambules 1946, Charte 2004) > les traités internationaux (CEDH, droit de l'UE) > les lois > les règlements (décrets, arrêtés).<br><b>Branches :</b> droit civil (personnes, contrats, famille), pénal (infractions et peines), public (État, collectivités, fonction publique), social (travail), commercial.<br><b>Pyramide des normes (Kelsen) :</b> une norme inférieure doit respecter la norme supérieure — le Conseil constitutionnel censure les lois contraires à la Constitution ; le Conseil d'État annule les actes illégaux de l'administration.</div>\n<h3>2. L'État de droit</h3>\n<div class=\"tip\"><b>Définition :</b> un État dans lequel <b>tous</b> — gouvernants et gouvernés, majorité et minorités — sont soumis au même droit, contrôlé par un juge indépendant.<br><b>Garanties :</b> séparation des pouvoirs (Montesquieu), indépendance de la justice (statut des magistrats), contrôle de constitutionnalité (QPC depuis 2010 : tout justiciable peut contester une loi), recours devant le juge administratif (le citoyen peut attaquer l'État et gagner — annulation d'un acte, réparation).<br><b>Distinction :</b> État de droit ≠ État de justice totalitaire (le droit n'est pas neutre : il peut être injuste — lois de Vichy) : d'où l'importance des droits fondamentaux et du contrôle du législateur.</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> « la loi est toujours juste » : FAUX — une loi peut être contraire à la Constitution ou à la CEDH : c'est précisément le rôle des juges (Conseil constitutionnel, CEDH) de la censurer. La légalité et la légitimité ne se confondent pas.</div>\n<h3>3. L'organisation judiciaire française</h3>\n<table><tr><th>Juridiction</th><th>Compétence</th><th>Exemples</th></tr>\n<tr><td><b>Tribunaux judiciaires</b></td><td>Litiges entre personnes, infractions</td><td>Conseil de prud'hommes, tribunal correctionnel, assises (crimes, avec jury)</td></tr>\n<tr><td><b>Juge administratif</b></td><td>Litiges avec l'administration</td><td>Tribunal administratif, Conseil d'État</td></tr>\n<tr><td><b>Juges constitutionnel et européen</b></td><td>Contrôle des lois</td><td>Conseil constitutionnel (QPC), CEDH, CJUE</td></tr></table>\n<div class=\"tip\"><b>Ordres de juridiction :</b> judiciaire (conflits entre particuliers et avec l'État quand il agit comme personne privée — art. 66 : « l'autorité judiciaire, gardienne de la liberté individuelle ») et administratif (l'État en tant que puissance publique) ; le Tribunal des conflits arbitre les compétences.<br><b>Double degré :</b> toute décision peut être appelée (sauf exceptions) — la Cour de cassation contrôle le droit (pas les faits) ; le Conseil d'État est juge d'appel administratif en dernier ressort.</div>\n<h3>4. Les principes du procès équitable (art. 6 CEDH)</h3>\n<div class=\"tip\">— <b>Présomption d'innocence :</b> l'accusé est présumé innocent jusqu'à preuve de sa culpabilité (charge de la preuve à l'accusation).<br>— <b>Droits de la défense :</b> avocat (aide juridictionnelle si besoin), temps pour préparer sa défense.<br>— <b>Indépendance et impartialité du tribunal :</b> juge indépendant du pouvoir politique, récusation possible.<br>— <b>Publicité et célérité :</b> audience publique (sauf exceptions), délai raisonnable (la France a été condamnée pour durée excessive de procès).<br>— <b>Non-rétroactivité :</b> pas de peine sans loi antérieure (art. 7 CEDH et 8 DDHC) : « nul n'est punissable que pour ce qu'il a fait, et selon la loi de son temps ».</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — de l'affaire Dreyfus à la QPC : le juge au secours du citoyen</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Montre comment l'affaire Dreyfus (1894-1906) et la Question Prioritaire de Constitutionnalité (2010) illustrent, à un siècle d'écart, le rôle protecteur de la justice dans l'État de droit.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Dreyfus : les failles du système</b> : un capitaine juif condamné à tort pour trahison (faux dossier, procès à huis clos) : la Cour de cassation finit par le réhabiliter (1906) — après l'engagement de Zola (« J'accuse... ! », 1898) et la mobilisation des intellectuels : leçon : la justice militaire soumise à l'exécutif avait failli ; la réhabilitation par le juge civil fonde l'indépendance moderne.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>La QPC (2010) : le citoyen censeur des lois</b> : lors d'un procès, un justiciable peut contester la constitutionnalité de la loi appliquée : le Conseil d'État ou la Cour de cassation transmet (filtre), le Conseil constitutionnel statue (abrogation de la loi) : ex. : la garde alternée imposée, la loi de rétention des détenus : des dizaines de lois ont été corrigées ou censurées depuis — à l'initiative de simples justiciables.</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : dans un État de droit, le juge n'est pas un obstacle au pouvoir : il est le gardien des promesses du droit — l'affaire Dreyfus a fondé la légitimité du juge (séparation justice/armée) ; la QPC l'a donné au citoyen : une trame parfaite pour l'oral comme la dissertation sur « à quoi sert un juge ? ».</div></div></details>"},
{"id": "egalite-discriminations", "theme": "Égalité et discriminations (EMC)", "niveau": "Collège/Lycée — EMC", "titre": "Égalité et discriminations", "cours": "<div class=\"cours-head\"><h2>Égalité et discriminations</h2><p>Égalité formelle et réelle ; discriminations interdites ; politiques de lutte et leurs débats (positivisme, parité, points de départ).</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Égalité formelle (devant la loi) ≠ réelle (des chances et conditions).<br>— Discrimination : traitement défavorable fondé sur un critère interdit (origine, sexe, handicap...).<br>— Défenseur des droits (2011) ; loi 2001 sur les faits de discrimination.<br>— Débats : parité, discrimination positive, intersectionnalité.</div>\n<h3>1. Les dimensions de l'égalité</h3>\n<div class=\"tip\"><b>Égalité formelle (juridique) :</b> même loi pour tous — l'égalité « devant la loi » (art. 1er DDHC), quelles que soient les caractéristiques.<br><b>Égalité réelle :</b> égalité des chances (l'origine ne doit pas déterminer le destin), égalité des situations (réduction des écarts de revenus, de patrimoine).<br><b>Égalité des droits vs égalité des faits :</b> l'égalité proclamée depuis 1789 coexiste avec des inégalités persistantes (revenus, patrimoine, territoire : un enfant des quartiers prioritaires n'a pas les mêmes chances qu'un enfant des beaux quartiers — « reproduction sociale », Bourdieu).<br><b>Tension :</b> corriger les inégalités réelles suppose de TRAITER DIFFÉREMMENT (bourses, quotas, parité) — en apparence contraire à l'égalité formelle : tout le débat de la discrimination positive.</div>\n<h3>2. Les discriminations : définition et critères</h3>\n<div class=\"tip\"><b>Définition (loi du 27 mai 2008) :</b> toute distinction directe ou indirecte fondée sur un critère interdit (origine, sexe, situation de famille, grossesse, apparence physique, patronyme, lieu de résidence, état de santé, handicap, caractéristiques génétiques, mœurs, orientation sexuelle, identité de genre, âge, opinions politiques, activités syndicales, appartenance ou non-appartenance à une ethnie, une nation, une race, une religion).<br><b>Discrimination directe</b> (« je ne loue pas aux Arabes ») vs <b>indirecte</b> (une règle en apparence neutre désavantage un groupe : test de fréquence de vacances, exigence de taille minimale pour un emploi sans nécessité).<br><b>Statistiques :</b> les testing CV (étude INSEE/CEE de 2015, 2016 : un candidat au nom à consonance maghrébine doit envoyer plus de CV pour obtenir un entretien) documentent la discrimination à l'embauche ; les écarts salariaux femmes-hommes persistent (~15-20 % à temps complet comparable, horstemps partiel).</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> toute différence de traitement n'est PAS une discrimination : les différences légitimes (bourses selon les revenus, priorité médicale selon la gravité) sont légales ; la discrimination suppose un critère INTERDIT et un lien avec une situation visée (emploi, logement, éducation, services).</div>\n<h3>3. L'arsenal juridique</h3>\n<div class=\"tip\">— <b>Constitution :</b> art. 1er : égalité ; préambule 1946 : la France « garantit à la femme des droits égaux » ; révision 1999 (parité : la loi favorise l'égal accès des femmes et des hommes aux mandats).<br>— <b>Code pénal (art. 225-1 et suivants) :</b> discrimination punie (jusqu'à 3 ans d'emprisonnement, 45 000 € d'amende envers un particulier) ; harcèlement moral et sexuel punis.<br>— <b>Code du travail :</b> égalité salariale, obligation de négocier, sanctions pour l'employeur.<br>— <b>Défenseur des droits (2011) :</b> autorité indépendante qui reçoit les réclamations, enquête, recommande — succède au Médiateur de la République, HALDE et délégations aux droits des femmes.<br>— <b>Loi de 2001 :</b> renverse la charge de la preuve en matière d'embauche (le candidat établit des faits qui « laissent présumer » la discrimination, l'employeur prouve le contraire).<br>— <b>Lois récentes :</b> mariage pour tous (2013), PMA (2021), interdiction des thérapies de conversion (2022), reconnaissance des violences intrafamiliales, lois contre les violences sexistes et sexuelles (harcèlement de rue verbalisé depuis 2018).</div>\n<h3>4. Politiques correctrices et débats</h3>\n<div class=\"tip\"><b>Parité :</b> loi du 6 juin 2000 (50 % de candidats de chaque sexe sur les listes) : les assemblées locales sont quasi paritaires : l'Assemblée nationale est passée de ~12 % (avant 1997) à ~37-38 % (2022-2024) — mais les exécutifs (maires, présidentielles) restent déséquilibrés.<br><b>Discrimination positive :</b> aux USA (affirmative action), en Inde (réservations pour les intouchables) : en France : dispositifs ciblés (bourses, zones d'éducation prioritaire, cordées de la réussite, « Paris-Connecté ») mais refus des quotas ethniques (incompatibles avec le principe d'indivisibilité — le Conseil constitutionnel censure les statistiques ethniques).<br><b>Débat :</b> corriger les inégalités de départ (Bourdieu : l'école reproduit) ou traiter tout le monde identiquement (risque de figer les inégalités) ?<br><b>Intersectionnalité :</b> les discriminations se combinent (une femme handicapée immigrée) — notion débattue en France (utilisée par les mouvements sociaux, critiquée comme fragmentation de l'universel).</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le testing CV et le renversement de la preuve</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Explique comment les expériences de testing (envoi de CV fictifs) documentent la discrimination à l'embauche, et pourquoi la loi de 2001 renverse la charge de la preuve.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>La méthode</b> : deux CV identiques (formation, expérience) ne diffèrent que par le nom : « Yannis Belkacem » vs « Alexandre Moreau » : résultat robuste des études (CEE 2015 : à diplôme égal, un candidat perçu comme maghrébin doit envoyer ~1,5 fois plus de candidatures pour un entretien — jusqu'à 3-4 fois dans certains secteurs/segments) : la discrimination est mesurée, pas seulement alléguée.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Le problème de la preuve</b> : une discrimination est invisible dans l'acte (l'employeur invoque « un profil plus adapté ») : le candidat ne peut pas prouver l'intention — obstacle quasi insurmontable.</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>La solution juridique</b> : depuis 2001 (transposition du droit européen), le candidat établit des FAITS qui laissent présumer la discrimination (testing, statistiques internes) : c'est alors à l'EMPLOYEUR de prouver que sa décision repose sur des éléments objectifs (expérience, compétences) — sinon discrimination établie : le testing devient une preuve recevable : l'État (ACSE, puis Défenseur des droits) utilise cette méthode pour documenter et sanctionner : conclusion en EC : la règle s'adapte à la réalité de la preuve — un bel exemple de droit efficace.</div></div></details>"},
{"id": "engagement", "theme": "L'engagement citoyen (EMC)", "niveau": "Collège/Lycée — EMC", "titre": "L'engagement citoyen", "cours": "<div class=\"cours-head\"><h2>L'engagement citoyen</h2><p>Voter, s'engager, militer : les formes de l'engagement politique, associatif, syndical et numérique — pourquoi s'engager, et comment ?</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Engagement politique : vote, partis, mandats.<br>— Engagement associatif : loi 1901 (1,5 M d'associations).<br>— Engagement syndical, humanitaire, écologique.<br>— Nouvelles formes : pétitions, réseaux sociaux, consommation engagée.<br>— Défiance et abstention : le défi de la démocratie.</div>\n<h3>1. Les formes de l'engagement</h3>\n<div class=\"tip\"><b>Politique :</b> vote (et éligibilité dès 18 ans), adhésion à un parti, mandat local (conseiller municipal dès 18 ans), campagnes, referendums.<br><b>Associatif (loi 1901) :</b> 1,5 million d'associations : sportives, culturelles, humanitaires, parents d'élèves, défense des droits : 13 millions de bénévoles déclarés + 1,8 million d'emplois salariés.<br><b>Syndical :</b> défense des salariés (négociation, grève — droit constitutionnel, préambule 1946), représentativité, sections syndicales : taux de syndicalisation ~8-11 % (faible, mais couverture conventionnelle quasi totale).<br><b>Humanitaire et solidaire :</b> Restos du cœur, Secours populaire, Secours catholique, Croix-Rouge, Médecins du monde : la France a une forte tradition associative caritative.<br><b>Écologique et consumériste :</b> marches pour le climat (2019 : centaines de milliers de jeunes), l'exemple emblématique : la consommation engagée (boycotts, buycotts), la finance solidaire.</div>\n<h3>2. Pourquoi s'engager ?</h3>\n<div class=\"tip\"><b>Motivations :</b> valeurs (solidarité, justice), intérêt (défense d'un statut, d'un quartier), socialisation (famille engagée, école, pairs), conviction religieuse ou politique, réaction à une injustice (l'indignation, Hessel).<br><b>Fonctions sociales :</b> socialisation (rencontres, compétences), intégration (sentiment d'utilité), contre-pouvoir (vigilance citoyenne), production de biens collectifs (solidarité, environnement).<br><b>Effets démocratiques :</b> l'engagement structure le débat public (attention aux causes), forme les élites militantes, alimente les politiques publiques (lois sur la faim, la bioéthique, le climat portées par des mobilisations).</div>\n<h3>3. Les obstacles et le désengagement</h3>\n<div class=\"tip\"><b>Abstention :</b> élections récentes : 50-70 % d'abstention chez les jeunes (européennes, législatives), ~25-30 % à la présidentielle (mais bien plus aux locales) : la démocratie française souffre d'une crise de la représentation (défiance envers les politiques ~2/3 des Français « les politiciens ne s'intéressent pas à nous », CEVIPOF).<br><b>Causes :</b> défiance, sentiment d'inefficacité, dépolitisation, individualisation, concurrence des loisirs et des réseaux, rejet des partis (désaffiliation).<br><b>Mais nouvelles formes :</b> pétitions en ligne (des millions de signatures), marches, fronts d'opinion (mouvements sociaux : gilets jaunes — participation non partisane), engagement local (crise sanitaire a boosté le bénévolat de proximité : « réserve civique »).<br><b>Militantisme 2.0 :</b> faible coût (signature, partage), mais aussi faible profondeur (slactivisme/« slacktivism ») et fragilité (désengagement rapide) : la mobilisation climat étudiante a montré les deux faces (massivité, puis essoufflement).</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> « les jeunes ne s'engagent pas » : ils s'engagent AUTREMENT : moins dans les partis, plus dans des causes ponctuelles (climat, droits, justice sociale), locales et internationales : la crise de la représentation n'est pas la mort de l'engagement.</div>\n<h3>4. Devenir engagé : les voies</h3>\n<div class=\"tip\"><b>À l'école :</b> CVC/CVL (conseils de vie collégienne/lycéenne), délégués de classe, MDL (maison des lycéens), journées d'engagement, projets citoyens.<br><b>Jeunesse :</b> service civique (16-25 ans), réserve citoyenne (accompagnement scolaire), scouts/guides, juniors associations.<br><b>Adulte :</b> bénévolat associatif (2-3 h/semaine en moyenne), syndicat, conseil de quartier, budget participatif, juré d'assises (tirage au sort), élections (candidat !).<br><b>Protection :</b> le lanceur d'alerte (loi Sapin II 2016, renforcée 2022 : protection, signal en interne d'abord, dispositif CIIA) : le droit protège l'engagement de vigilance.</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la trajectoire d'une militante climat</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Camille, 17 ans, veut agir pour le climat. Compare trois voies d'engagement (marches et réseaux, association locale, candidature) et leurs forces/limites.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>La marche et les réseaux</b> : coût faible, visibilité massive (mobilisation de 2019 : centaines de milliers de lycéens) : limites : pas de décision prise, essoufflement, récupération médiatique : force : imposer l'agenda (le climat est devenu LA question politique — preuve d'efficacité indirecte).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>L'association locale</b> : réparation concrète (végétalisation, cantine bio, repair cafés) : limites : portée locale, dépendance aux subventions et aux bénévoles : force : l'effet est mesurable, l'apprentissage démocratique réel (gestion, débats, compromis).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>La candidature</b> : déléguée puis conseillère municipale à 18 ans (possible) : limites : lenteur, jeux de pouvoir, « saucissonnage » des convictions : force : accès direct à la décision (budget, plan climat local). <b>Conclusion</b> : l'engagement efficace COMBINE les registres (pression dans la rue, expertise associative, décision institutionnelle) — c'est la thèse d'une EC complète sur « comment agir efficacement ? » : multiplier les canaux plutôt que d'opposer le « pur » militantisme et la compromission politique.</div></div></details>"},
{"id": "medias-liberte-expression", "theme": "Médias et liberté d'expression (EMC)", "niveau": "Collège/Lycée — EMC", "titre": "Médias et liberté d'expression", "cours": "<div class=\"cours-head\"><h2>Médias et liberté d'expression</h2><p>Liberté d'expression, pluralisme, « quatrième pouvoir » : le rôle des médias en démocratie — et les défis : désinformation, concentration, réseaux sociaux.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Art. 11 DDHC : libre communication des pensées et des opinions.<br>— Limites : diffamation, injure, incitation à la haine, apologie du terrorisme.<br>— Médias : contre-pouvoir, pluralisme encadré (CSA/Arcom).<br>— Défis : concentration, fake news, bulles de filtre, deepfakes.</div>\n<h3>1. La liberté d'expression : fondement et limites</h3>\n<div class=\"tip\"><b>Textes :</b> art. 11 DDHC (« la libre communication des pensées et des opinions est un des droits les plus précieux de l'homme »), art. 10 CEDH, art. 19 DUDH ; encadré par la loi de 1881 (liberté de la presse).<br><b>Protections renforcées :</b> la critique des religions, des politiques, des idées est pleinement protégée (blasphème n'est PAS un délit en France depuis la Révolution) ; l'humour, la caricature, la satire sont protégés (Charlie Hebdo) ; la liberté d'informer couvre les journalistes (protection des sources).<br><b>Limites (délictuelles) :</b> diffamation (allégation de fait portant atteinte à l'honneur SANS preuve), injure (expression outrageante), incitation à la haine ou à la violence (racisme, antisémitisme, homophobie...), apologie du terrorisme, négationnisme (loi Gayssot 1990), diffusion de fausses nouvelles manipulateur... : la limite se juge AU CAS PAR CAS par le juge (équilibre des droits).<br><b>Principe de tolérance :</b> la liberté protège aussi ce qui heurte, choque, inquiète (CEDH) — sinon elle ne protège que l'orthodoxie du moment.</div>\n<h3>2. Les médias, « quatrième pouvoir »</h3>\n<div class=\"tip\"><b>Rôles :</b> informer (vérité des faits, mise en contexte), enquêter (scandales : Watergate, Panama papers, investigations françaises), être le « chien de garde » de la démocratie (watchdog : contrôler les puissants), former l'opinion publique et créer l'espace du débat (Habermas : l'espace public).<br><b>Statut :</b> loi de 1881 (liberté, responsabilité a posteriori), secret des sources, statut de journaliste (carte de presse), clauses de conscience, arbitrages financiers (aides à la presse).<br><b>Pluralisme encadré :</b> Arcom (ex-CSA, fusionné avec le CSA en 2022 avec le Hadopi) : équité du temps de parole (campagnes : égalité, puis temps de campagne réglementé), propriété des médias (concentration limitée : ex. seuils de diffusion pour la presse), chaînes publiques (information non marchande, redevance).<br><b>Indépendance réelle ?</b> concentration des groupes (Bolloré, Dassault, Niel : propriétaires d'entreprises avec intérêts), dépendance publicitaire, subventions d'État : tension permanente entre indépendance et économie.</div>\n<h3>3. Les défis du numérique</h3>\n<div class=\"tip\"><b>Désinformation :</b> fake news (fabrication délibérée), rumeurs, théories du complot (complotisme : flat earth, anti-vaccins...) : effets documentés (élections, santé publique — l'OMS parle d'« infodémie » pendant le covid).<br><b>Mécanismes :</b> bulles de filtre (algorithmes qui montrent ce qu'on aime), chambres d'écho (on n'entend que des gens qui pensent comme nous), biais de confirmation, viralité émotionnelle (le faux se propage plus vite que le vrai — étude du MIT, 2018 : 70 % plus rapide).<br><b>Réponses :</b> éducation aux médias (EMI : identifier les sources, cross-checking, fact-checking — AFP Factuel, Vrai ou Fake), lois françaises (2018 : manipulation électorale, « fake news » en période électorale ; 2023 : cyberharcèlement renforcé), régulation européenne (DSA : devoir de modération des plateformes, transparence des algorithmes), détection (EUvsDisinfo, Viginum).<br><b>Deepfakes et IA :</b> la voix et l'image synthétiques rendent la preuve audiovisuelle contestable — défi majeur pour la confiance (la « crise de la preuve »).</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> la liberté d'expression n'est PAS absolue (elle s'arrête aux droits d'autrui : diffamation, haine, apologie) — et l'interdiction d'une expression (racisme, haine) n'est PAS une censure illégitime : c'est la protection d'autres droits. L'équilibre se décide par le juge, pas par la foule ni par les plateformes seules.</div>\n<h3>4. Être un citoyen « éclairé » : l'esprit critique</h3>\n<div class=\"tip\"><b>Réflexes :</b> identifier la SOURCE (qui parle ? quel intérêt ?), croiser les sources (au moins deux médias indépendants), vérifier la DATE et le CONTEXTE, distinguer FAIT et OPINION, se méfier des titres (« clickbait »), lire l'article ENTIER (pas seulement le titre partagé), repérer les émotions manipulatrices (la colère rend crédule).<br><b>En pratique :</b> avant de partager : 30 secondes de vérification (l'URL, le média, l'auteur) ; utiliser les outils de fact-checking ; accepter de ne pas savoir (suspendre le jugement) — la sagesse civique numérique.</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — de Panama Papers aux deepfakes : le journaliste à l'épreuve</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Compare le rôle du journalisme d'investigation (Panama Papers, 2016) et le défi des deepfakes (2023-2024) pour la confiance démocratique.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Le journalisme d'enquête</b> : 11,5 millions de documents financiers (fuite du cabinet Mossack Fonseca) : 400 journalistes de 80 pays, coordination (ICIJ), vérification croisée, publication simultanée (2016) : résultats : démissions (Premier ministre islandais), enquêtes judiciaires, paradis fiscaux sur l'agenda mondial — le journalisme comme « puissance d'État » soft : informer pour faire agir.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Le défi deepfake</b> : des vidéos truquées par IA (voix clonée d'un politique, fausses images de guerre) : la limite : la « crise de la preuve » — quand tout peut être fabriqué, le déni devient facile (« c'est un fake ! ») et la désinformation se banalise : les réponses : technologies de détection (watermarks, C2PA), droit (loi 2023 sur les deepfakes pornographiques), médias qui documentent leurs méthodes.</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : la confiance démocratique repose sur une COMMUNAUTÉ DE PREUVE : journalistes qui vérifient, institutions qui publient, citoyens qui croisent — l'EMI (éducation aux médias) est donc une compétence civique AUSSI importante que le vote : la trame d'une EC complète sur « l'information est-elle en danger ? ».</div></div></details>"},
{"id": "defense-nationale", "theme": "La défense nationale et l'armée (EMC)", "niveau": "Collège/Lycée — EMC", "titre": "La défense nationale et l'armée", "cours": "<div class=\"cours-head\"><h2>Défense nationale</h2><p>Défense globale, professionnalisation, engagement international : pourquoi une armée, pour quoi faire, à quelles conditions ?</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Défense : militaire, civile, économique, culturelle (« défense globale »).<br>— Armée professionnelle depuis la suspension du service militaire (1997).<br>— JDC : Journée défense et citoyenneté (obligatoire avant 25 ans).<br>— Missions : dissuasion, protection, interventions extérieures, gestion de crise (Opext, Sentinelle).<br>— Fonction dissuasion : nucléaire (quatre missions : dissuasion, prévention, protection, projection).</div>\n<h3>1. La défense : un concept global</h3>\n<div class=\"tip\"><b>Définition :</b> ensemble des moyens (militaires et non militaires) mobilisés pour protéger la population, le territoire, les intérêts et les valeurs de la France.<br><b>Défense globale (livre blanc) :</b> militaire (forces armées), civile (sécurité, protection des populations, résilience), économique (protection des approvisionnements, sécurisation des technologies), culturelle et informationnelle (lutte contre la propagande, protection du débat public), cybersécurité (ANSSI, commandement de la cyberdéfense).<br><b>Levée en masse et service militaire :</b> l'armée de conscription (1793 : « la levée en masse », loi Jourdan) a duré jusqu'en 1997 (suspension du service national).<br><b>Aujourd'hui :</b> armée PROFESSIONNELLE (volontariat) + réserve (opérationnelle et citoyenne : des dizaines de milliers de réservistes) + JDC.</div>\n<h3>2. Les missions des armées</h3>\n<div class=\"tip\">— <b>Dissuasion nucléaire :</b> « la dissuasion, c'est empêcher la guerre » (de Gaulle) : la France maintient un arsenal minimal (2 composantes : sous-marins océaniques SNLE, aviation) pour décourager toute agression majeure (« faire croire au pire » : le principe : pas d'emploi, mais la menace rend l'emploi ennemi irrationnel).<br>— <b>Protection du territoire et des populations :</b> plan Vigipirate, opération Sentinelle (depuis 2015), aide aux populations (crises sanitaires, catastrophes : « résilience »).<br>— <b>Interventions extérieures :</b> opérations extérieures (« opex ») : Sahel (Barkhane), Libye (2011), Irak (Chammal), ONU (casques bleus : 1948-toujours actuels), RCA (Sangaris).<br>— <b>Renseignement et cyberdéfense :</b> DGSE, DRM, ANSSI (agence nationale de sécurité des systèmes d'information) : la cyberguerre est un champ permanent (attaques contre les hôpitaux, les élections, les entreprises).<br>— <b>Coopération :</b> ONU, OTAN (la France en est membre, quitte le commandement intégré en 1966, y revient en 2009), UE (PSDC, article 42-7 TUE), bilatérales.</div>\n<h3>3. Le citoyen et la défense</h3>\n<div class=\"tip\"><b>JDC (Journée défense et citoyenneté) :</b> obligatoire (recensement à 16 ans, JDC avant 25 ans), sensibilisation : défense, devoirs du citoyen, secourisme, tests : elle conditionne l'inscription aux examens (permis, bac...).<br><b>Réserve :</b> réserve opérationnelle (militaires du rang, engagements de 1-5 ans) et réserve citoyenne (soutien, enseignement de défense, mentorat) : la « réserve citoyenne » de l'Éducation nationale (interventions en classe sur la défense, les valeurs, la mémoire).<br><b>les livres blancs et les LPM (lois de programmation militaire) :</b> le Parlement vote les moyens (démocratie : le pouvoir civil contrôle l'armée — art. 20 et 53 de la Constitution : le Parlement autorise les interventions, vote la déclaration de guerre).<br><b>Principe démocratique :</b> l'armée est SOUS le contrôle du pouvoir civil : le président est chef des armées (art. 15), le Premier ministre « responsable de la défense nationale » (art. 21), le Parlement vote les crédits et est informé des interventions (réforme 2008 : au-delà de 4 mois, autorisation du Parlement).</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> la France n'est PLUS membre du commandement militaire intégré de l'OTAN ? FAUX — elle y est revenue en 2009 (sous Sarkozy) : elle en était sortie en 1966 (de Gaulle) : elle reste toutefois un pays « indépendant » de fait pour la dissuasion (pas de plan nucléaire intégré OTAN).</div>\n<h3>4. Les défis contemporains</h3>\n<div class=\"tip\"><b>Budget :</b> la France dépense ~2 % de son PIB (objectif OTAN) : la LPM 2024-2030 vise 413 Md€ — l'effort de guerre ukrainien (drones, munitions, réarmement européen) a repris le rythme des investissements après les « dividendes de la paix » des années 1990.<br><b>Hyperspaces :</b> espace (satellites : surveillance, communications — la France dispose d'une « doctrine spatiale », commandement de l'espace 2019) et profondeur (fond marin : câbles sous-marins, hydrographie).<br><b>Hybridation :</b> manipulation de l'information, cyberattaques, sabotages : la frontière guerre/paix devient poreuse (« gray zones ») : d'où la refonte du concept de « guerre hybride » et les réponses (Viginum pour repérer les ingérences numériques, loi 2024 sur l'ingérence).<br><b>Recrutement :</b> l'armée recrute (métiers : 25 000-30 000 postes/an) : des difficultés (secteurs techniques, réserves) : débat récurrent sur un « service national universel » (SNU : volontariat mixte, semaine de défense).</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la dissuasion nucléaire : un raisonnement à maîtriser</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Explique le raisonnement de la dissuasion nucléaire (« rendre l'agression irrationnelle »), ses conditions et ses critiques.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Le mécanisme</b> : un État A menace un État B : B déclare que toute agression majeure provoquerait des représailles « inacceptables » (destruction de ses villes) : le coût attendu de l'agression devient supérieur au gain espéré : A renonce : la paix par la menace, non par la confiance.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Les conditions</b> : crédibilité (moyens réels : sous-marins indétectables — la « composante océanique » garantit la riposte même après une frappe ennemie), rationalité de l'adversaire, communication claire (« pas d'ambiguïté ») : la France : ~290 têtes, doctrine de « suffisance » (minimal, pas de parité avec les grands).<br><b>Étape 3</b> — <b>Les critiques</b> : moral (tenir des villes en otage — cf. l'argument du « glaive et du bouclier »), risque d'escalade, prolifération incitée, coût (milliards d'euros) : les réponses : l'emploi N'A JAMAIS eu lieu entre puissances nucléaires (l'argument empirique : la « paix nucléaire » depuis 1945) : une EC sur « la dissuasion protège-t-elle la paix ? » peut déployer tout ce raisonnement — mécanisme, conditions, critiques, bilan.</div></div></details>"},

{"id": "laicite", "fiche": "<b>L'essentiel</b><br>— Laïcité = liberté de conscience + égalité des convictions + neutralité de l'État.<br>— Loi du 9 décembre 1905 : art. 1 (garantie des cultes), art. 2 (non-reconnaissance, non-financement).<br>— École : lois Ferry (1882), Goblet (1886), loi 15 mars 2004 (signes ostensibles), Charte 2013.<br>— Agents publics : neutralité stricte ; élèves : pas de signes ostensibles à l'école publique.<br><b>Méthodes</b><br>— Toujours citer les deux faces : garantir ET séparer.<br>— Distinguer école publique (contrainte) / privé sous contrat (specificité) / université (liberté étudiante).<br><b>Pièges</b><br>— La laïcité n'interdit pas la religion : elle interdit sa manifestation ostensible dans le cadre scolaire public et la neutralité fait appel à la seule loi commune.<br>— L'Alsace-Moselle est concordataire (exception historique maintenu).<br>— La loi 2004 ne s'applique ni à l'université ni à la rue."},
{"id": "droits-devoirs", "fiche": "<b>L'essentiel</b><br>— Citoyenneté = nationalité + droits + devoirs + participation.<br>— 3 générations de droits : civils/politiques (1789-1944), sociaux (1946), environnementaux (Charte 2004).<br>— Devoirs : loi, impôt, école obligatoire, JDC, jury d'assises, recensement à 16 ans.<br>— Vote : droit non obligatoire ; inscription automatique à 18 ans (depuis 1997).<br>— Citoyenneté européenne depuis Maastricht (1992).<br><b>Méthodes</b><br>— Toujours classer les droits par génération (et citer le texte fondateur).<br>— Distinguer devoirs juridiquement sanctionnables et devoirs civiques moraux.<br><b>Pièges</b><br>— Le vote n'est PAS obligatoire en France.<br>— Jury d'assises = obligation légale (pas un choix).<br>— La citoyenneté n'est pas réservée aux majeurs : l'élève est déjà citoyen (CVC, droits, obligations scolaires)."},
{"id": "democratie-regimes", "fiche": "<b>L'essentiel</b><br>— Démocratie (Dahl) : élections libres + libertés + pluralisme + État de droit + séparation des pouvoirs.<br>— Formes : représentative, semi-directe (référendum, RIP), participative (budgets, conventions).<br>— Régimes : parlementaire (PM responsable), présidentiel (séparation stricte), semi-présidentiel (France : président élu + responsabilité).<br>— Totalitaire (idéologie + terreur) ≠ autoritaire (pouvoir concentré sans totalisation).<br>— Remparts : justice, presse, société civile, contrôle de constitutionnalité, CEDH.<br><b>Méthodes</b><br>— Toujours définir avant de comparer (démocratie ≠ république ≠ État de droit).<br>— Pour la France : citer les articles (49-2, 12, 11, 16).<br><b>Pièges</b><br>— La Ve République n'est pas présidentielle : le gouvernement est responsable devant l'Assemblée.<br>— Référendum ≠ toujours démocratique (plébiscite : le peuple approuve un chef).<br>— Une élection ne suffit pas : cf. démocraties illibérales."},
{"id": "justice-droit", "fiche": "<b>L'essentiel</b><br>— Hiérarchie des normes : Constitution > traités > lois > règlements (Kelsen).<br>— État de droit : le pouvoir lui-même est soumis au droit et contrôlé par un juge indépendant.<br>— Deux ordres de juridiction : judiciaire (conflits privés + autorité judiciaire, gardienne des libertés) et administratif (actes de l'État).<br>— Procès équitable (art. 6 CEDH) : présomption d'innocence, droits de la défense, impartialité, délai raisonnable.<br>— QPC (2010) : le justiciable peut contester une loi devant le Conseil constitutionnel.<br><b>Méthodes</b><br>— Toujours identifier la norme en cause (loi ? décret ? contrat ?) et le juge compétent.<br>— Distinguer annulation (l'acte disparaît) et réparation (dommages-intérêts).<br><b>Pièges</b><br>— Légal ≠ légitime : une loi peut être inconstitutionnelle ou contraire à la CEDH.<br>— La Cour de cassation ne juge pas les faits, seulement le droit.<br>— Le Conseil constitutionnel ne juge pas les particuliers : il juge les lois."},
{"id": "egalite-discriminations", "fiche": "<b>L'essentiel</b><br>— Égalité formelle (loi) ≠ réelle (chances et situations).<br>— Discrimination : traitement défavorable sur critère interdit (directe ou indirecte).<br>— Textes : art. 1er Constitution, Code pénal (225-1), loi 2001 (renversement de la charge de la preuve), Défenseur des droits (2011).<br>— Parité (2000) ; discrimination positive débattue ; quotas ethniques censurés (indivisibilité).<br><b>Méthodes</b><br>— Distinguer différence légitime (bourses) et discrimination (critère interdit).<br>— Prouver : testing, statistiques, témoins — et l'aide du Défenseur des droits.<br><b>Pièges</b><br>— « On ne peut pas mesurer la discrimination » : faux (testing, écarts salariaux).<br>— L'égalité réelle peut exiger de traiter différemment (parité) : ce n'est pas une exception à l'égalité, c'est sa condition.<br>— Harcèlement ≠ discrimination (proche mais distinct)."},

{"t": "Valeurs et principes de la République (EMC)", "q": "La devise « Liberté, Égalité, Fraternité » a été adoptée officiellement par la République en :", "c": ["1789", "1880", "1946", "1848"], "a": 3, "e": "La devise apparaît en 1789 comme mot d'ordre, mais c'est la Deuxième République (1848) qui en fait la devise officielle.", "d": "<b>Une devise héritière de la Révolution</b>.<div class='ex-detail'><u>Exemple rédigé</u> : en 1789, les révolutionnaires utilisent les trois mots séparément (liberté et égalité dans la DDHC, la fraternité dans les sociétés populaires) : en 1848, la Révolution qui proclame la République adopte le triptyque complet comme devise officielle — il orne les monuments publics : ce n'est qu'en 1946 puis 1958 que la Constitution l'inscrit dans son article 2 : la chronologie (1789 → 1848 → 1946) est LE repère à connaître — beaucoup d'élèves confondent l'origine du mot (1789) et l'adoption officielle (1848).</div>"},
{"t": "Valeurs et principes de la République (EMC)", "q": "Selon l'article 1er de la Constitution de 1958, la France est une République :", "c": ["fédérale, monarchique et libre", "indivisible, laïque, démocratique et sociale", "parlementaire et égalitaire", "catholique et libérale"], "a": 1, "e": "Article 1er : « La France est une République indivisible, laïque, démocratique et sociale. »", "d": "<b>Les quatre adjectifs fondamentaux</b>.<div class='ex-detail'><u>Exemple rédigé</u> : indivisible : une seule loi s'applique de Lille à Perpignan (pas de lois régionales comme en Espagne ou en Allemagne) : laïque : l'État ne reconnaît et ne finance aucun culte : démocratique : le peuple est souverain (élections et référendum) : sociale : la République doit organiser la solidarité (école gratuite, Sécurité sociale — l'héritage du Conseil national de la Résistance) : chacun de ces quatre adjectifs peut faire l'objet d'une question de cours — les apprendre ENSEMBLE évite de n'en citer que deux sous le stress de l'examen.</div>"},
{"t": "Valeurs et principes de la République (EMC)", "q": "La liberté selon l'article 4 de la DDHC (1789) :", "c": ["consiste à pouvoir faire tout ce qui ne nuit pas à autrui : elle n'a d'autres bornes que la loi", "concerne uniquement l'expression", "est absolue et sans limite", "n'existe qu'en démocratie"], "a": 0, "e": "La liberté s'arrête où commence la nuisance à autrui ; la loi fixe ces limites.", "d": "<b>Ma liberté s'arrête où commence la tienne</b>.<div class='ex-detail'><u>Exemple rédigé</u> : je peux organiser une fête (liberté) mais pas au point d'empêcher mes voisins de dormir (nuisance) : la loi encadre (tapage nocturne), le juge arbitre : la liberté n'est donc pas l'absence de règle, mais une règle AU SERVICE de tous : dans une copie d'EMC, citer l'article 4 (« la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui ») transforme une opinion en argument juridique — la marque d'une réponse solide.</div>"},
{"t": "Valeurs et principes de la République (EMC)", "q": "Le principe d'indivisibilité de la République signifie que :", "c": ["tous les partis doivent s'unir", "les collectivités votent leurs propres lois", "la France ne peut pas quitter l'UE", "une seule loi s'applique sur tout le territoire, pour un seul peuple"], "a": 3, "e": "Le peuple français est un, la loi est la même partout : pas de statuts locaux législatifs (sauf exceptions constitutionnalisées : Alsace-Moselle, outre-mer, Nouvelle-Calédonie).", "d": "<b>Une loi, un peuple, un territoire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le Parlement vote des lois qui s'appliquent à Marseille comme à Strasbourg — contrairement à l'Espagne (pays des autonomies) ou à l'Allemagne (Länder) : conséquence concrète : la « chasse » ne peut pas être interdite dans une seule région par une assemblée locale : MAIS des aménagements existent (Alsace-Moselle : droit local concordataire, enseignement religieux ; Nouvelle-Calédonie : statut spécifique) : le principe s'apprécie avec ses exceptions — montrer cette nuance fait gagner des points à l'examen.</div>"},
{"t": "Valeurs et principes de la République (EMC)", "q": "Le caractère « social » de la République (art. 1er) se traduit notamment par :", "c": ["la nationalisation des entreprises", "la liberté d'entreprendre", "la Sécurité sociale, l'école gratuite et la solidarité organisée par le droit", "la suppression des impôts"], "a": 2, "e": "République sociale = l'État organise la solidarité : protection sociale, services publics, éducation gratuite.", "d": "<b>La solidarité institutionnalisée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : en 1945, la Sécurité sociale (plans du Conseil national de la Résistance) : chacun cotise selon ses moyens, reçoit selon ses besoins : l'école gratuite (lois Ferry) garantit l'égalité des chances : le RSA (1988-2009) assure un minimum d'existence : tout cela n'est pas de la « charité » mais du DROIT — le citoyen peut réclamer devant un tribunal : c'est la différence entre une République « sociale » et une République qui se contenterait de proclamer l'égalité formelle : l'exemple parfait pour l'oral du bac de français comme pour l'EMC.</div>"},
{"t": "Valeurs et principes de la République (EMC)", "q": "La Marianne est :", "c": ["une reine de France", "un personnage de la Marseillaise", "une personnalité politique", "l'allégorie (symbole) de la République, présente dans les mairies"], "a": 3, "e": "Marianne est l'allégorie de la République — un buste coiffé d'un bonnet phrygien orne les mairies.", "d": "<b>Une femme, un bonnet, une République</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le bonnet phrygien était celui des esclaves affranchis de Rome (symbole de liberté) : la Révolution le reprend : Marianne apparaît en 1792 et devient le visage officiel de la République : depuis 1969, un timbre « Marianne » est émis à chaque présidence, et des personnalités ont prêté leurs traits (Brigitte Bardot, Catherine Deneuve, Sophie Marceau) : à retenir : Marianne n'est PAS dans la Constitution — la Constitution cite le drapeau, l'hymne et la devise ; Marianne est un usage officiel — cette distinction est un piège de QCM classique.</div>"},
{"t": "Valeurs et principes de la République (EMC)", "q": "Le drapeau tricolore actuel vient de :", "c": ["l'Empire romain", "Napoléon", "la Restauration", "la Révolution : le blanc royal entouré du bleu et du rouge de Paris"], "a": 3, "e": "En 1789, le roi se pare des couleurs de Paris (bleu et rouge) autour du blanc royal : le tricolore devient le drapeau national.", "d": "<b>L'union du roi et du peuple</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le 17 juillet 1789, le roi se rend à Paris : on lui remet une cocarde où le bleu et le rouge (couleurs de la ville, de la garde) entourent le blanc (couleur royale) — le symbole de la réconciliation nationale : le tricolore traverse les régimes (sauf la Restauration qui revient au drapeau blanc, 1815-1830) : depuis 1830, c'est LE drapeau de la France : l'anecdote de la cocarde est une illustration parfaite du symbole né d'un compromis politique — utilisable en dissertations sur les symboles républicains.</div>"},
{"t": "Valeurs et principes de la République (EMC)", "q": "La fraternité dans la devise républicaine est la valeur qui :", "c": ["a été inscrite dès la DDHC de 1789", "a été supprimée en 1958", "concerne uniquement la famille", "complète et équilibre la liberté et l'égalité, en imposant la solidarité entre citoyens"], "a": 3, "e": "La fraternité (absente de la DDHC) relie les deux autres valeurs : sans elle, liberté et égalité restent abstraites.", "d": "<b>Le mot qui relie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la liberté sans fraternité = l'égoïsme (chacun pour soi) : l'égalité sans fraternité = l'uniformité (l'égalité « par le bas ») : la fraternité ajoute la dimension du LIEN (citoyenneté, solidarité) : traductions : Sécurité sociale, délit de non-assistance, fraternité inscrite dans le Code de l'éducation (2021) : en EC ou dissertation, un plan « liberté / égalité / fraternité » avec leurs tensions internes (liberté vs égalité, résolues par la fraternité) est un classique qui marche — à condition de préciser que la fraternité n'est entrée dans les textes constitutionnels qu'avec le préambule de 1946 (elle y est associée au principe de solidarité).</div>"},
{"t": "Valeurs et principes de la République (EMC)", "q": "Les trois piliers de la devise républicaine présentent une tension interne entre :", "c": ["la liberté et la fraternité", "il n'y en a aucune", "l'égalité et la fraternité", "la liberté et l'égalité (l'égalité absolue limiterait la liberté, la liberté absolite créerait des inégalités)"], "a": 3, "e": "L'exemple type : la liberté économique crée des inégalités ; l'égalité absolue (uniformité) limiterait les libertés individuelles — la fraternité cherche l'équilibre.", "d": "<b>Des valeurs en débat</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'égalité stricte des résultats imposerait de limiter la liberté d'entreprendre et de transmettre (100 % d'impôt successoral ?) : la liberté totale laisse les inégalités se creuser (les amis des uns, les armes des autres) : la République tranche pragmatiquement : école gratuite et obligatoire (égalité), impôt progressif (fraternité), liberté d'expression (liberté) : la tension est donc permanente et réglée par le débat démocratique — montrer cette tension, plutôt que d'affirmer que les trois valeurs sont « parfaites », est la marque d'une réflexion de niveau lycée.</div>"},
{"t": "Valeurs et principes de la République (EMC)", "q": "L'égalité entre femmes et hommes est explicitement affirmée dans le préambule de la Constitution :", "c": ["de 1848", "de 1791", "de 1958", "de 1946 (le mot « citoyenne » y apparaît)"], "a": 3, "e": "Le préambule de 1946 proclame l'égalité des femmes et des hommes — avant même le vote des lois concrètes (les femmes n'ont obtenu le droit de vote qu'en 1944).", "d": "<b>1946 : le mot « citoyenne »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 1789 proclame l'égalité des « hommes » — Olympe de Gouges riposte avec la Déclaration des droits de la femme (1791) : « si la femme peut monter sur l'échafaud, elle doit pouvoir monter à la tribune » : il faut attendre 1944 (droit de vote, ordonnance d'Alger) et 1946 (préambule constitutionnel : « la loi garantit à la femme des droits égaux à ceux de l'homme ») : la parité en politique ne sera exigée qu'en 2000 (loi sur la parité) : la chronologie des droits des femmes est un classique de l'EMC (et du sujet de dissertation « l'égalité est-elle un principe accompli ? »).</div>"},
{"t": "La laïcité : liberté, neutralité, séparation (EMC)", "q": "La loi du 9 décembre 1905 établit que :", "c": ["l'État reconnaît les cultes", "la religion est interdite à l'école", "tous les cultes sont financés par l'État", "la République assure la liberté de conscience et garantit le libre exercice des cultes, mais ne reconnaît, ne salarie ni ne subventionne aucun culte"], "a": 3, "e": "Articles 1 et 2 : garantie du libre exercice + non-reconnaissance et non-financement des cultes.", "d": "<b>La constitution de la paix religieuse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : avant 1905, le Concordat de 1801 : l'État salariait les prêtres et nommait les évêques — au prix d'un contrôle politique des cultes : 1905 inverse la logique : l'État se retire des cultes pour protéger ÉGALEMENT toutes les croyances : Aristide Briand négocie pour éviter la guerre religieuse (associations cultuelles pour les églises, déclarations des édifices) : le pape Pie X condamne la loi... puis la pratique s'installe : la France est devenue l'un des pays où les cultes sont les plus libres — PARADOXE : en refusant de financer la religion, l'État en a fait une affaire strictement privée, protégée de l'arbitraire politique.</div>"},
{"t": "La laïcité : liberté, neutralité, séparation (EMC)", "q": "La laïcité à l'école publique signifie notamment que :", "c": ["les enseignants peuvent porter des signes religieux discrets", "les élèves n'ont pas le droit de parler de religion", "les signes et tenues manifestant ostensiblement une appartenance religieuse sont interdits aux élèves (loi du 15 mars 2004)", "les cours de religion sont obligatoires"], "a": 2, "e": "La loi de 2004 vise les signes OSTENSIBLES (grands croix, voiles, kippas) ; les signes discrets restent admis ; les enseignants, eux, sont soumis à la neutralité totale.", "d": "<b>Ostensible : la clé du texte</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une médaille au cou, une petite croix : discret, admis : un voile intégral, une kippa visible, une grande croix : ostensible, interdit : la loi de 2004 (préparée par la commission Stasi) visait à protéger la liberté de conscience des filles (pressions familiales) et l'ordre scolaire : à l'université, la loi NE S'APPLIQUE PAS (les étudiants sont majeurs, la liberté académique protège) : en entreprise privée : possible seulement par clause du règlement intérieur justifiée par la tâche : cette grille d'application (école/université/public/privé) est un plan de réponse tout prêt pour un sujet d'examen.</div>"},
{"t": "La laïcité : liberté, neutralité, séparation (EMC)", "q": "La neutralité des agents publics signifie que :", "c": ["ils s'abstiennent de tout signe et propos religieux ou politique dans l'exercice de leurs fonctions", "ils peuvent refuser certains usagers selon leurs convictions", "ils doivent être athées", "ils peuvent exprimer leurs opinions religieuses hors du travail"], "a": 0, "e": "Fonctionnaires (loi 1983) et contractuels en contact avec le public : neutralité religieuse ET politique, égalité de traitement des usagers.", "d": "<b>Le service, pas la personne</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une professeure porte un foulard : interdit (elle représente l'État neutre devant des mineurs) : un agent refuse de serrer la main d'une collègue femme : non plus (l'égalité femme-homme prime sur la conviction) : MAIS l'usager, lui, n'est pas soumis à la neutralité : la laïcité est une obligation du SERVICE, pas du citoyen : c'est ce renversement qu'il faut toujours préciser : l'État s'impose des limites pour laisser le citoyen libre — la laïcité est d'abord une discipline de l'État, pas une police des individus (le principe du « laïcité de service » a été renforcé par la loi de 2021).</div>"},
{"t": "La laïcité : liberté, neutralité, séparation (EMC)", "q": "L'exception alsacienne-mosellane concordataire implique que :", "c": ["l'enseignement religieux y est interdit", "les cultes catholique, luthérien, réformé et israélite sont reconnus et financés dans ces départements", "la laïcité y est supprimée", "seul le catholicisme y est reconnu"], "a": 1, "e": "Après le rattachement de 1918, le droit local a gardé le Concordat de 1802 : cultes reconnus, financés, enseignement religieux possible dans les écoles publiques primaires.", "d": "<b>Une exception historique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'Alsace-Moselle était allemande en 1905 : la loi française de séparation ne s'y est jamais appliquée : en 1918, la France récupère les territoires — et choisit de MAINTENIR le Concordat (laïciser aurait été vu comme une punition !) : résultat : les ministres des cultes y sont salariés, l'enseignement religieux existe dans les écoles publiques primaires (avec dispense) : le Conseil constitutionnel tolère cette anomalie au nom de la « situation particulière » locale : c'est LE contre-exemple qui montre que la laïcité est une CONSTRUCTION historique, pas un dogme intemporel — excellent exemple de nuance en dissertation.</div>"},
{"t": "La laïcité : liberté, neutralité, séparation (EMC)", "q": "La Charte de la laïcité à l'École (2013) affirme notamment que :", "c": ["les repas de cantine doivent être sans viande", "la République laïque est chrétienne", "la laïcité garantit la liberté de conscience et le respect de tous les croyants et non-croyants", "les parents doivent être informés de la religion des enseignants"], "a": 2, "e": "La Charte (15 articles) réaffirme : liberté de conscience, égalité, neutralité du cadre scolaire, libre expression dans le respect du pluralisme.", "d": "<b>Un texte affiché, un texte citable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la Charte de 2013 a été écrite après les débats de 2004 et les attentats : ses articles tiennent en phrases courtes : « la République est laïque » ; « la laïcité assure la liberté de conscience » ; « nul ne peut se prévaloir de ses convictions religieuses pour s'affranchir des règles communes » : à l'examen, citer un article précis (le n° 1, le n° 9 sur la neutralité, le n° 10 sur les obligations scolaires) montre qu'on sait aller au texte : la Charte s'affiche dans toutes les écoles publiques — la connaître fait partie de la culture civique attendue au brevet comme au bac.</div>"},
{"t": "La laïcité : liberté, neutralité, séparation (EMC)", "q": "La loi du 15 mars 2004 a été préparée par la commission Stasi (2003), qui a défini la laïcité comme :", "c": ["une religion d'État", "un principe uniquement scolaire", "une interdiction de la religion dans l'espace public", "la traduction juridique du principe de séparation et de neutralité : l'État protège la liberté de conscience et garantit l'égalité des convictions"], "a": 3, "e": "Commission Stasi : la laïcité repose sur trois valeurs — liberté de conscience, égalité des citoyens, neutralité de l'État.", "d": "<b>Stasi, ou la laïcité repensée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : en 2003, le président Chirac installe une commission (Bernard Stasi) après des conflits de foulard : ses préconisations : maintenir le droit commun, interdire les signes ostensibles à l'école, ajouter un article de loi (le 15 mars 2004), instituer un jour férié (Aïd) — non retenu : la commission définissait la laïcité comme un principe à trois étages (liberté, égalité, neutralité) — définition reprise dans la Charte de 2013 : citer Stasi comme étape du débat démocratique (commission → débat parlementaire → loi) est un argument de méthode : la laïcité s'adapte par le droit, pas par les ukases.</div>"},
