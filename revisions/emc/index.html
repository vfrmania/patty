{"t": "Médias et liberté d'expression (EMC)", "q": "La « crise de la preuve » liée aux deepfakes signifie que :", "c": ["les tribunaux sont fermés", "les journalistes ont disparu", "les preuves judiciaires n'existent plus", "la facilité de fabrication de fausses images/sons rend plus difficile d'établir ce qui est authentique — d'où les technologies de traçabilité et de détection"], "a": 3, "e": "Voix et visages synthétiques : le déni devient facile (« c'est un fake ») : réponses : watermarking, standards de provenance (C2PA), détection, droit (loi 2023 sur les deepfakes intimes).", "d": "<b>Quand voir n'est plus croire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un candidat filmé « en train de dire » une phrase honteuse... qui n'a jamais été dite (deepfake de qualité) : le démenti ne suffit plus (« c'est un fake ! ») car TOUT peut être dénoncé comme fake, y compris l'authentique : la réaction : traçabilité (signer les contenus dès la production : standards C2PA, watermarks), vérification (projets de détection, forensics), droit (pénaliser les deepfakes intimes — loi de 2023 ; transparence des IA — AI Act européen), journalisme qui documente ses méthodes (montrer ses preuves) : la conclusion civique : la confiance démocratique se RECONSTRUIT techniquement et juridiquement — et la compétence d'esprit critique du citoyen (exiger les sources, la provenance) devient le premier rempart : sujet d'actualité total, idéal pour l'examen.</div>"},
{"t": "La défense nationale et l'armée (EMC)", "q": "La Journée défense et citoyenneté (JDC) :", "c": ["concerne uniquement les garçons", "est facultative", "remplace l'engagement militaire", "est obligatoire pour tous les jeunes recensés (avant 25 ans) : elle conditionne l'inscription aux examens et permis"], "a": 3, "e": "Le recensement à 16 ans déclenche la convocation à la JDC : sensibilisation à la défense, aux devoirs du citoyen, secourisme : obligatoire pour passer le permis et les examens.", "d": "<b>Le rendez-vous civique obligatoire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : depuis la suspension du service militaire (1997, décision de Jacques Chirac — professionnalisation), la JDC (créée en 1998) maintient le LIEN armée-nation : une journée : présentation des missions (dissuasion, protection, opex), tests, initiation au secourisme, information sur les réserves et les métiers : sans JDC (ou régularisation), pas de permis ni d'inscription aux examens scolaires : le principe : la défense est l'affaire de TOUS les citoyens (l'armée protège la société, la société la connaît et la contrôle) : une question d'examen classique sur le lien armée-nation et l'après-conscription.</div>"},
{"t": "La défense nationale et l'armée (EMC)", "q": "La doctrine française de dissuasion nucléaire repose sur :", "c": ["la promesse de ne jamais riposter", "la capacité à infliger des représailles inacceptables à tout agresseur, même après une frappe ennemie (suffisance, composante océanique indétectable)", "la parité numérique avec les USA", "l'interdiction des armes nucléaires"], "a": 1, "e": "« Tous azimuts » (aucune direction privilégiée), suffisance (arsenal minimal), composantes SNLE + aviation : la crédibilité repose sur la CERTITUDE de la riposte (sous-marins indétectables).", "d": "<b>Empêcher la guerre par la menace crédible</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement : un agresseur potentiel calcule : « si j'attaque, je perds mes villes » → l'agression devient irrationnelle → paix : les conditions : la riposte doit être CERTAINE (d'où les sous-marins lanceurs d'engins : impossibles à localiser, la « composante océanique » garantit la seconde frappe) : la France : ~290 têtes (doctrine de « suffisance » : pas la quantité, la certitude) : les critiques : moral (des villes en otage), risque de prolifération, coût : la défense empirique : aucune guerre directe entre puissances nucléaires depuis 1945 : un raisonnement complet — mécanisme, conditions, critiques — est exactement ce qu'attend une EC sur la dissuasion.</div>"},
{"t": "La défense nationale et l'armée (EMC)", "q": "En France, le contrôle démocratique de l'armée s'exerce notamment par :", "c": ["le vote des crédits militaires par le Parlement, l'autorisation parlementaire des interventions extérieures prolongées (réforme 2008) et la responsabilité du pouvoir civil", "les référendums militaires", "l'élection des officiers", "les sondages"], "a": 0, "e": "", "d": "<b>L'armée sous le pouvoir civil</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les textes : art. 15 (le président, chef des armées, « veille à la sécurité nationale »), art. 21 (le Premier ministre, « responsable de la défense nationale »), art. 35 (la déclaration de guerre est votée par le Parlement) : la réforme de 2008 : si une intervention extérieure dépasse 4 mois, le Parlement doit l'autoriser (la loi vote la prolongation) : le Parlement vote aussi les crédits (LPM : loi de programmation militaire, pluriannuelle — 2024-2030 : 413 Md€) : les principes : pas d'armée « privée » du pouvoir, pas de « praetorienne » décidant seule : la pratique (contrôle des missions, information des commissions de la défense) perfectible mais réelle — un sujet d'EMC typique : « une armée obéit-elle en démocratie ? » (réponse : oui, par le droit et le budget).</div>"},
{"t": "La défense nationale et l'armée (EMC)", "q": "La France a quitté le commandement militaire intégré de l'OTAN en 1966 et :", "c": ["l'a quitté définitivement en 2017", "n'en a jamais été membre", "n'y est jamais revenue", "y est revenue en 2009"], "a": 3, "e": "De Gaulle retire la France du commandement intégré (1966) ; Sarkozy annonce le retour complet en 2009 : la France reste indépendante pour la dissuasion (pas de plan nucléaire OTAN).", "d": "<b>L'indépendance ET l'alliance</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 1949 : la France est membre fondatrice de l'OTAN (alliance défensive : « un pour tous, tous pour un », article 5) : 1966 : de Gaulle estime que la France doit garder la maîtrise de sa défense (retrait du commandement INTÉGRÉ — les troupes et quartiers généraux quittent la France, le SHAPE déménage à Mons) : 2009 : la France réintègre pleinement les structures de commandement (en tirant les leçons des opérations balkaniques : la coopération était pénalisante) : la France reste SOUVERAINE pour le nucléaire (pas de partage des codes, doctrine propre) : cette trajectoire (dans l'alliance, hors commandement, puis retour) est un classique des questions sur la France et l'OTAN — piège fréquent : « la France n'est pas dans l'OTAN » (FAUX depuis 2009).</div>"},
{"t": "La défense nationale et l'armée (EMC)", "q": "L'opération Sentinelle (depuis 2015) illustre la mission :", "c": ["d'interdiction aérienne", "de protection du territoire et des populations (soldats déployés dans les lieux sensibles après les attentats)", "de cyberdéfense", "de dissuasion nucléaire"], "a": 1, "e": "Après les attentats de janvier 2015, des milliers de militaires (terre, air, mer, gendarmerie) patrouillent les sites sensibles (écoles, lieux de culte, transport) en complément de Vigipirate et de la police.", "d": "<b>L'armée au service de la protection civile</b>.<div class='ex-detail'><u>Exemple rédigé</u> : janvier 2015 : attentats : le président active l'opération Sentinelle : jusqu'à 10 000 militaires mobilisés (rotations régulières depuis), patrouilles dans les gares, les écoles juives, les lieux touristiques : l'effet : présence rassurante, détection, liens avec les forces de police (l'armée intervient en APPUI du ministère de l'Intérieur) : la controverse : fatigue des soldats (rotations, missions prolongées), coût, risque de « banalisation » : la leçon EMC : la défense ne se limite pas au combat extérieur : la « protection des populations » est une mission constitutionnelle (art. 15, sécurité nationale) — un exemple concret, daté, chiffré : idéal pour une EC sur « à quoi sert une armée en temps de paix ? ».</div>"},
{"t": "La défense nationale et l'armée (EMC)", "q": "La « défense globale » comprend notamment :", "c": ["les dimensions militaire, civile, économique, informationnelle et cyber (la protection de la société dans tous ses domaines)", "la diplomatie seule", "seulement l'armée de terre", "uniquement la police"], "a": 0, "e": "Concept issu des livres blancs : la sécurité nationale mobilise tous les secteurs (énergies, transports, numérique, esprits) — l'ANSSI/Coordination nationale de la cybersécurité en est un exemple opérationnel.", "d": "<b>Une société entière mobilisée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : militaire : forces armées, dissuasion : civile : plan Vigipirate, protection sanitaire, gestion des catastrophes : économique : sécuriser les approvisionnements (énergie, semi-conducteurs — la leçon des pénuries 2020-2022), protéger les entreprises critiques (filiales de défense, infrastructures) : informationnelle : contre les manipulations (Viginum, les « ingérences »), éducation civique : cyber : l'ANSSI (créée 2009) coordonne la réponse aux attaques (hôpitaux, collectivités frappés) : pendant le covid, l'opération Résilience a mobilisé l'armée pour la logistique sanitaire : la défense globale traduit une évidence : une société moderne est un SYSTEME INTERCONNECTÉ — le protéger demande plus que des chars : un argument de copie puissant pour lier EMC, SES et géopolitique.</div>"},
{"t": "La défense nationale et l'armée (EMC)", "q": "Le service militaire en France a été :", "c": ["réservé aux militaires de carrière", "remplacé par l'OTAN", "suspendu en 1997 (professionnalisation) : la conscription reste inscrite dans les textes (réactivable par décret), et le SNU (service national universel) a été créé en volontariat partiel", "supprimé définitivement en 1997"], "a": 2, "e": "La loi de 1997 suspend (ne supprime pas) l'appel : armée de métier depuis 2001 : la JDC et le SNU (2019, volontariat, deux semaines puis missions) perpétuent l'esprit du lien armée-nation.", "d": "<b>Suspendu, pas aboli</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le choix de 1997 (J. Chirac / A. Juppé) : la conscription (10 mois, avant 12) ne correspondait plus aux besoins (armée professionnelle, technologies complexes, budgets réduits — la « paix » des années 1990) : la loi (28 octobre 1997) SUSPEND l'appel (la durée du service, les modalités) mais la conscription reste dans la Constitution et le Code : le président peut la RÉACTIVER (décret en conseil des ministres) : l'héritage : JDC (1998), réserve citoyenne, SNU (2019 : volontariat, 15 jours puis mission d'intérêt général — généralisation débattue, coût considérable) : cette précision juridique (suspendre ≠ supprimer) est un piège d'examen corrigé une fois pour toutes en apprenant les mots exacts de la loi.</div>"},
{"t": "La défense nationale et l'armée (EMC)", "q": "Les opérations extérieures (« opex ») de la France :", "c": ["ne concernent que la défense du territoire", "sont décidées par le président (chef des armées) dans le cadre des engagements internationaux (ONU, UE, coalition), avec information puis autorisation du Parlement au-delà de 4 mois", "sont interdites par la Constitution", "sont décidées par l'OTAN seule"], "a": 1, "e": "Exemples : Barkhane (Sahel), Chammal (Irak/Syrie), missions ONU : le Parlement est informé et doit autoriser la prolongation au-delà de 4 mois (réforme constitutionnelle de 2008).", "d": "<b>Des décisions exécutives sous contrôle parlementaire renforcé</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une opex commence : décision présidentielle (art. 15 : chef des armées, diplomatie), décret éventuel, engagement dans un cadre (ONU : résolution, auto-défense collective ; UE : art. 42-7 ; coalition ad hoc) : au-delà de 4 mois, le Gouvernement informe le Parlement et la prolongation est autorisée par le Parlement (loi de 2008, pratique depuis : les interventions du Sahel, de Libye (2011) ont fait l'objet de débats et de votes) : le débat récurrent : l'information en amont (souvent limitée) et la confidentialité (renseignement) : la tendance : renforcer le contrôle (commissions, documents de référence, « parallélisme des formes ») : en EC, montrer l'ÉQUILIBRE (réactivité exécutive + légitimité parlementaire) est l'analyse attendue.</div>"},
{"t": "La défense nationale et l'armée (EMC)", "q": "La « guerre hybride » désigne :", "c": ["une guerre uniquement nucléaire", "la guerre du passé", "une guerre entre alliés", "un mélange de moyens conventionnels et NON conventionnels : cyberattaques, désinformation, sabotages, milices, pression économique — sous le seuil de la guerre déclarée"], "a": 3, "e": "Exemples : ingérences électorales, attaques contre les câbles sous-marins, groupes paramilitaires (Wagner), fake news massives : la difficulté juridique : attribuer l'attaque (la « zone grise » : ni guerre ni paix).", "d": "<b>La guerre sous le seuil de la guerre</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un Etat veut affaiblir un adversaire SANS déclencher une riposte de l'OTAN (article 5 : casus foederis en cas d'attaque armée) : donc : cyberattaque contre les hôpitaux (paralysie), propagande massive (division), sabotage de câbles, milices non-revendiquées (déni plausible), pression sur les minorités : le droit reste en retard (une guerre « non-déclarée » : attributions scientifiques complexes, les « faits établis » contestés) : les réponses : doctrine de contre-ingérence, Viginum (détection), loi de 2024 (répression des ingérences), doctrine française de cyberdéfense (réponse par « effets » possibles) : sujet brûlant, exactement au programme EMC/SES — la définition + un exemple concret suffisent pour une excellente réponse.</div>"},

var PDF_CP1252 = { 0x2018:0x91, 0x2019:0x92, 0x201A:0x82, 0x201C:0x93, 0x201D:0x94, 0x201E:0x84, 0x2013:0x96, 0x2014:0x97, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x20AC:0x80, 0x0152:0x8C, 0x0153:0x9C, 0x0160:0x8A, 0x0161:0x9A, 0x0178:0x9F, 0x017D:0x8E, 0x017E:0x9E, 0x192:0x83, 0x2C6:0x88, 0x2032:0xB4, 0x2039:0x8B, 0x203A:0x9B, 0x201E2:0 };
function pdfTranslit(s){
  return s.replace(/\u2212|\u2013|\u2014/g, '-').replace(/[\u2032\u2019]/g, "'")
    .replace(/\u2192|\u21D2|\u21A6/g, '->').replace(/\u2190/g, '<-')
    .replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u2260/g, '!=').replace(/\u2248/g, '~')
    .replace(/\u2208/g, ' in ').replace(/\u2205/g, 'vide').replace(/\u2286/g, 'incl.')
    .replace(/\u221A/g, 'V').replace(/\u00B7|\u2219|\u22C5/g, '*').replace(/\u2022/g, '-')
    .replace(/\u2124/g, 'Z').replace(/\u211D/g, 'R').replace(/\u2115/g, 'N').replace(/\u2119/g, 'P')
    .replace(/\u00A0/g, ' ').replace(/\u202F|\u2009|\u200B|\uFE0F/g, '')
    .replace(/[\u2460-\u2468]/g, function(c){ return (c.charCodeAt(0) - 0x2460 + 1) + ')'; })
    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
}
function pdfEnc(s){
  var out = '';
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }
    else if (PDF_CP1252[c] !== undefined) b = PDF_CP1252[c];
    if (b !== null && b !== undefined) out += String.fromCharCode(b);
  }
  return out;
}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
var PDF_INLINE = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, SMALL:1, SUB:1, SUP:1, A:1, CODE:1, ABBR:1 };
function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';
    } else if (c.nodeType === 1){
      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }
      else if (g === 'B' || g === 'STRONG') pdfSegs(c, true, out);
      else pdfSegs(c, bold, out);
    }
  }
}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'li') segs = [{ t: '- ', b: bold || false }].concat(segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;
  function walk(n){
    for (var c = n.firstChild; c; c = c.nextSibling){
      if (c.nodeType === 3){
        var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;
        var cl = ' ' + (c.className || '') + ' ';
        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }
        emitP();
        if (/^H[1-6]$/.test(g)) emitBlock('h', c, indent);
        else if (g === 'LI') emitBlock('li', c, indent + 16);
        else if (g === 'UL' || g === 'OL') {
          for (var li = c.firstChild; li; li = li.nextSibling){
            if (li.nodeType === 1 && li.tagName === 'LI') { emitBlock('li', li, indent + 16); walk(li); }
          }
        }
        else if (g === 'TABLE' || g === 'THEAD' || g === 'TBODY'){
          for (var tr = c.firstChild; tr; tr = tr.nextSibling){
            if (tr.nodeType !== 1) continue;
            if (tr.tagName === 'TR'){
              var cells = [];
              for (var td = tr.firstChild; td; td = td.nextSibling){
                if (td.nodeType === 1 && (td.tagName === 'TD' || td.tagName === 'TH')){
                  var cs = []; pdfSegs(td, td.tagName === 'TH', cs);
                  cells.push(cs.map(function(x){ return x.t; }).join('').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
                }
              }
              var line = cells.join('   |   ');
              if (line.replace(/\s/g, '') !== '') blocks.push({ type: 'p', segs: [{ t: line, b: false }], indent: indent + 8 });
            } else if (tr.tagName === 'THEAD' || tr.tagName === 'TBODY') walk(tr);
          }
        }
        else if (g === 'P') { emitBlock('p', c, indent); }
        else { var keep = indent; walk(c); indent = keep; }
      }
    }
    emitP();
  }
  walk(root);
  return blocks;
}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    var isTitle = b.type === 'title';
    var size = isTitle ? 15 : (b.type === 'h' ? 12 : 10.5);
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [];
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) words.push({ br: true });
        p.split(' ').forEach(function(w){ if (w !== '') words.push({ w: w, b: s.b }); });
        if (pi < parts.length - 1) {} else { words.push({ sp: true, b: s.b }); }
      });
    });
    var cur = [], len = 0;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, gap: isTitle ? 0 : (b.type === 'h' ? 7 : 4) }); cur = []; len = 0; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      if (wd.sp) { continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
    if (isTitle) lines.push({ rule: true });
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var pages = [], cur = [], y = TOP;
  lines.forEach(function(ln){
    if (ln.rule){
      if (y - 14 < M) { pages.push(cur); cur = []; y = TOP; }
      y -= 12;
      cur.push('0.29 0.27 0.9 RG 1.5 w ' + M + ' ' + y.toFixed(2) + ' m ' + (W - M) + ' ' + y.toFixed(2) + ' l S\n0 0 0 RG 1 w');
      y -= 8;
      return;
    }
    var lh = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh < M) { pages.push(cur); cur = []; y = TOP; }
    y -= (ln.gap || 0);
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      var enc = pdfEnc(pdfTranslit(s.t));
      if (!enc) return;
      cur.push('BT 1 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Tm /F' + (s.b ? 2 : 1) + ' ' + ln.size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
      x += 0.52 * ln.size * enc.length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';

function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme d&#39;EMC</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p><div style="margin:12px 0 0"><input type="text" id="prog-search" oninput="progSearchList(this.value)" placeholder="🔎 Rechercher dans les cours..." style="width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.9rem;font-family:inherit;outline:none"></div><div id="prog-search-results"></div>' + h + '</section>';
})();
// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
</script>
