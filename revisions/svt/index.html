{"id": "fecondation-grossesse", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Fécondation (trompe) :</b> spermatozoïde (23) + ovule (23) ⟶ cellule-œuf (46).</p>\n<p><b>Développement :</b> divisions ⟶ blastocyste ⟶ nidation (utérus, ~J21) ⟶ différenciation ⟶ fœtus (8 sem.).</p>\n<p><b>Grossesse :</b> placenta (échanges, sans mélange des sangs), cordon, liquide amniotique.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Caryotype du sexe :</b> XX fille, XY garçon : l'ovule donne toujours X.</li>\n<li><b>Frise du début :</b> fécondation J14 ⟶ divisions ⟶ nidation J21 ⟶ HCG (test +).</li>\n<li><b>Schéma placenta :</b> deux circulations séparées, flèches d'échange.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Nidation = utérus, fécondation = trompe.</li>\n<li>Placenta = filtre imparfait (alcool, virus passent).</li>\n<li>Divisions initiales : nombre ↑, taille constante.</li>\n</ul>"},
{"id": "contraception-ist", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Contraception :</b> préservatif (barrière + IST), pilule (bloque l'ovulation), DIU, implant, urgence.</p>\n<p><b>IST :</b> certaines guérissables (chlamydia, syphilis) ; VIH contrôlable (trithérapie, I=I).</p>\n<p><b>Consentement :</b> libre, éclairé, réversible : le silence n'est pas un oui.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Choisir sa protection :</b> rapport avec IST possibles ⟹ préservatif, toujours.</li>\n<li><b>Dépistage :</b> TROD (VIH, gratuit), frottis/HPV, bilan régulier.</li>\n<li><b>Urgence :</b> contraception d'urgence dans les 3-5 jours (le plus tôt = le plus efficace).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Pilule ⟹ pas de protection IST.</li>\n<li>IST souvent SANS symptômes.</li>\n<li>VIH : salive/toilettes = aucune transmission.</li>\n</ul>"},
{"id": "systeme-nerveux", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Arc réflexe :</b> récepteur ⟶ neurone sensitif ⟶ MOELLE ⟶ motoneurone ⟶ muscle (rapide, automatique).</p>\n<p><b>Acte volontaire :</b> ordre du cortex (plus lent).</p>\n<p><b>Neurone :</b> signal électrique dans l'axone, chimique à la synapse (neurotransmetteurs).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma arc réflexe :</b> 5 étiquettes + flèches, moelle au centre.</li>\n<li><b>Anatomie :</b> cerveau (décisions), cervelet (équilibre), tronc (automatique), moelle (autoroute + réflexes).</li>\n<li><b>Cas clinique :</b> localiser une lésion par la fonction perdue (AVC de Broca ⟹ mutisme).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Centre du réflexe = moelle (le cerveau est informé APRÈS).</li>\n<li>Synapse = relais chimique, pas électrique.</li>\n<li>Cervelet ≠ cerveau (équilibre vs décisions).</li>\n</ul>"},
{"id": "genetique-heredite", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>46 ch. (23 paires)</b> ; gamètes : 23 (méiose). Gène ⟶ protéine ⟶ caractère.</p>\n<p><b>Allèles :</b> dominant (s'exprime en 1 exemplaire), récessif (en 2). Génotype ≠ phénotype.</p>\n<p><b>Croisement Mb × Mb :</b> 25 % récessif à chaque enfant.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Remonter au génotype :</b> sujet récessif ⟹ ses 2 parents porteurs.</li>\n<li><b>Grille de Punnett :</b> gamètes parents en tête de lignes/colonnes, compter les cases.</li>\n<li><b>Lecture clinique :</b> récessive « cachée » (mucoviscidose) vs liée à X (myopathie : garçons).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Marron « pur » ou « porteur » : même visage.</li>\n<li>1/4 par enfant, PAS 1/4 par famille.</li>\n<li>Mutation ≠ toujours maladie (parfois avantage).</li>\n</ul>"},
{"id": "immunite-vaccins", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Inné (rapide, non spécifique)</b> : barrières, phagocytes, fièvre. <b>Adaptatif (lent, spécifique)</b> : LB ⟶ anticorps, LT ⟶ destruction : + MÉMOIRE.</p>\n<p><b>Vaccin :</b> antigène inoffensif ⟶ mémoire (actif, durable). <b>Sérum :</b> anticorps d'un autre (passif, éphémère).</p>\n<p><b>Dérèglements :</b> allergie (ennemi imaginaire), rejet de greffe (immunosuppresseurs), VIH (LT4 détruits).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma réponse adaptative :</b> antigène ⟶ sélection LB ⟶ prolifération ⟶ anticorps ⟶ mémoire.</li>\n<li><b>Comparer vaccin/sérum :</b> tableau délai/durée/origine des anticorps.</li>\n<li><b>Lire un calendrier vaccinal :</b> doses + rappels (maintenir la mémoire).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Vaccin = entraînement, pas injection d'anticorps.</li>\n<li>Fièvre = défense, pas maladie à casser à tout prix.</li>\n<li>Allergie = immunité mal ciblée (pas de faiblesse).</li>\n</ul>"},
{"id": "evolution-especes", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Sélection naturelle :</b> variation héritable ⟹ lutte pour la vie ⟹ les mieux adaptés se reproduisent ⟹ accumulation sur les générations.</p>\n<p><b>Preuves :</b> fossiles (strates), homologies anatomiques, embryologie, ADN.</p>\n<p><b>Homme :</b> cousin des grands singes (ancêtre commun ~7 Ma) : bipédie, crâne, outils, culture.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Modèle pinson :</b> variation ⟹ filtre du milieu ⟹ déplacement de la moyenne.</li>\n<li><b>Lire des strates :</b> plus bas = plus ancien ; index fossiles ⟹ datation.</li>\n<li><b>Arbre du vivant :</b> distances ADN ⟹ parenté (cousins ≠ descendants).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Sélection = tri, pas création ni intention.</li>\n<li>« Descendre du singe » = faux (ancêtre commun).</li>\n<li>Chimpanzé aussi « évolué » que nous.</li>\n</ul>"},
{"id": "ecosystemes-3e", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Écosystème</b> = biotope + biocénose + interactions. Chaîne : producteur ⟶ consommateurs ⟶ décomposeurs (recyclage).</p>\n<p><b>~10 %</b> de l'énergie passe par étage : pyramide trophique.</p>\n<p><b>Relations :</b> prédation, compétition, mutualisme (abeille/plante), parasitisme. Espèce clef de voûte : effet cascade.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Construire un réseau :</b> flèches « est mangé par », commencer par le végétal.</li>\n<li><b>Prédire une population :</b> ressources + prédateurs + climat = équilibre dynamique.</li>\n<li><b>Analyser un impact :</b> fragmentation, invasives, pollutions : chercher l'effet cascade.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Matière = boucle fermée, énergie = flux ouvert.</li>\n<li>Symbiose : les DEUX gagnent.</li>\n<li>Chaîne commence par le producteur.</li>\n</ul>"},
{"id": "terre-tectonique", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Couches :</b> croûte ⟶ manteau (solide ductile) ⟶ noyau externe LIQUIDE (champ magnétique) + interne solide. Lithosphère sur asthénosphère.</p>\n<p><b>3 frontières :</b> divergente (dorsale : création), convergente (subduction/collision), transformante (coulissage).</p>\n<p><b>Preuves :</b> ondes sismiques, âges des fonds, paléomagnétisme, GPS.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Lire une carte de sismicité :</b> les alignements de séismes = frontières.</li>\n<li><b>Dater un fond océanique :</b> jeune à la dorsale, vieilli en s'éloignant.</li>\n<li><b>Identifier une zone :</b> fosse + volcans = subduction : chaîne + fossiles marins = collision.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Manteau solide (pas un océan de magma).</li>\n<li>Ondes S arrêtées par le noyau externe liquide.</li>\n<li>Vitesse des plaques : qq cm/an.</li>\n</ul>"},
{"id": "adn-proteines", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>ADN :</b> double hélice, appariement A-T / G-C : la séquence code l'information.</p>\n<p><b>Expression :</b> transcription (ADN ⟶ ARNm, noyau) puis traduction (ARNm ⟶ protéine, ribosomes, codons = triplets).</p>\n<p><b>Cellule :</b> procaryote (pas de noyau) vs eucaryote (noyau + organites : mitochondries = énergie).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Brin complémentaire :</b> A⟷T, G⟷C (et U dans l'ARN).</li>\n<li><b>Traduire :</b> découper l'ARNm en codons, chercher les acides aminés.</li>\n<li><b>Analyser une mutation :</b> substitution (lettre changée) vs décalage (insertion/délétion : cadre cassé).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Transcription ≠ traduction (sens et lieux).</li>\n<li>Codon = 3 nucléotides, pas 1.</li>\n<li>Le gène code : la protéine agit.</li>\n</ul>"},
{"id": "biodiversite-evolution", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>3 niveaux :</b> espèces, gènes, écosystèmes. Critère d'espèce : reproduction fertile entre individus.</p>\n<p><b>Spéciation :</b> isolement géographique ⟹ divergence ⟹ isolement reproductif : espèces nouvelles.</p>\n<p><b>Érosion actuelle :</b> ×100-1000 le taux naturel (habitats, invasives, climat) : 6e crise de masse.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Test d'espèce :</b> descendance fertile ? oui = même espèce.</li>\n<li><b>Scénario de spéciation :</b> barrière ⟹ isolation ⟹ divergence ⟹ isolement reproductif.</li>\n<li><b>Argumenter l'enjeu :</b> services écosystémiques (pollinisation, médicaments, climat).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Évolution en cours (résistances aux antibiotiques).</li>\n<li>Sous-espèce ≠ espèce (croisement fertile).</li>\n<li>Spéciation sans « projet » : isolement + temps.</li>\n</ul>"},
{"id": "climat-ges", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Effet de serre :</b> naturel et vital (-18 ⟶ +15 °C) : amplifié par nos GES (CO₂ 280 ⟶ ~420 ppm).</p>\n<p><b>Cycle du carbone :</b> fossiles ⟹ atmosphère (≈ moitié absorbée : océans/forêts : moitié accumulée).</p>\n<p><b>Conséquences :</b> +1,2 °C, glaces, mers, extrêmes, acidification : réponses : atténuation + adaptation (Paris 2015 : +1,5/+2 °C).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma bilan radiatif :</b> entrée solaire, sortie infrarouge, rétention GES.</li>\n<li><b>Lire la courbe de Keeling :</b> oscillation saisonnière + tendance.</li>\n<li><b>Comparer archives :</b> bulles d'air des glaces ⟹ CO₂/temperatures passés.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Effet de serre = vital : c'est l'excès qui dérèle.</li>\n<li>Temps ≠ climat (un froid ponctuel ne réfute rien).</li>\n<li>Trou d'ozone ≠ réchauffement (2 problèmes distincts).</li>\n</ul>"},
{"id": "immunite-1re", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>LB</b> ⟶ plasmocytes ⟶ anticorps (humorale) : <b>LTc</b> ⟶ lyse des cellules infectées (cellulaire) : <b>LT4</b> ⟶ interleukines (coordination).</p>\n<p><b>Mémoire :</b> clones mémoire ⟶ réponse 2e contact rapide/massive ⟶ base de la vaccination.</p>\n<p><b>Frontières :</b> greffe (HLA, rejet), allergie (IgE), auto-immunité (diabète 1 : cellules ß).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma sélection clonale :</b> bibliothèque ⟹ tri ⟹ amplification ⟶ plasmocytes + mémoire.</li>\n<li><b>Comparer 1re/2e réponse :</b> délai, amplitude, durée (courbes d'anticorps).</li>\n<li><b>Diagnostic immunitaire :</b> LT4 effondrés ⟹ VIH : cellules ß détruites ⟹ diabète 1.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Anticorps = étiquettes, pas tueurs.</li>\n<li>Le clône préexiste : le système TRIE.</li>\n<li>Tolérance au soi = active (son échec = auto-immunité).</li>\n</ul>"},
{"id": "genome-expression", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Même génome</b> partout (Dolly le prouve) : la différenciation = expression différentielle.</p>\n<p><b>Régulation :</b> promoteurs + facteurs de transcription ⟶ gène on/off : épissage alternatif = 1 gène ⟶ plusieurs protéines.</p>\n<p><b>Outils :</b> thérapie génétique, CRISPR-Cas9 (ARN guide + coupe + réparation).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Argumenter l'identité des génomes :</b> clonage, greffe, QPCR comparées.</li>\n<li><b>Prévoir une réponse hormonale :</b> quels récepteurs la cellule exprime.</li>\n<li><b>Résumer CRISPR :</b> guide ⟶ coupe ⟶ réparation dirigée.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Différenciation = expression, pas perte de gènes.</li>\n<li>Mutation = polymorphisme OU maladie.</li>\n<li>Promoteur = interrupteur, pas codeur.</li>\n</ul>"},
{"id": "risques-geologiques", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Risque = aléa × enjeux × vulnérabilité</b> : l'aléa est subi, la vulnérabilité se réduit (normes, éducation, zonage).</p>\n<p><b>Magnitude</b> = énergie (log : +1 = ×30) : <b>intensité</b> = effets selon les lieux.</p>\n<p><b>Surveillance :</b> sismomètres, GPS, déformation, gaz ⟶ alerte (volcans : prévisible : séismes : localisation d'aléa).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Analyser un cas :</b> distinguer aléa / enjeux / vulnérabilité dans un texte de presse.</li>\n<li><b>Comparer 2 séismes :</b> magnitude ×30 par cran : expliquer l'écart des bilans.</li>\n<li><b>Lire une carte d'aléa :</b> période de retour + normes de construction associées.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Magnitude ≠ intensité (source vs effets).</li>\n<li>Pas de prédiction sismique : prévention.</li>\n<li>Digue = protection calculée : la mémoire complète.</li>\n</ul>"},
{"id": "genetique-evolution", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Évolution = Δ fréquences d'allèles. Moteurs :</b> sélection (directionnelle, adaptative) + dérive (aléatoire, petits effectifs) + mutation + migration.</p>\n<p><b>Hardy-Weinberg (p² : 2pq : q²)</b> : modèle nul : un écart ⟹ force évolutive (ex. avantage hétérozygote : drépanocytose/paludisme).</p>\n<p><b>Phylogénie :</b> nœud = ancêtre commun : l'arbre ≠ échelle.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Distinguer sélection/dérive :</b> adaptation ⟹ sélection : perte aléatoire en petit effectif ⟹ dérive.</li>\n<li><b>Utiliser Hardy-Weinberg :</b> calculer p, q, génotypes attendus : comparer à l'observé.</li>\n<li><b>Lire un arbre :</b> repérer les nœuds, évaluer la parenté, refuser la lecture « échelle ».</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Dérive ≠ adaptation (hasard pur).</li>\n<li>Population évolue, pas l'individu.</li>\n<li>Avantage hétérozygote maintient des allèles « à risque ».</li>\n</ul>"},
{"id": "immunite-adaptative", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Trio :</b> LT4 (interleukines), LB ⟶ plasmocytes ⟶ anticorps, LTc ⟶ lyse. Diversité = recombinaison VDJ (aléatoire, pré-équipée).</p>\n<p><b>Vaccination :</b> mémoire sans maladie : immunité collective (seuil 1-1/R₀) : mise à jour face aux variants (co-évolution).</p>\n<p><b>Évasion microbienne :</b> mutation rapide (VIH : pas de correction : pas de vaccin), drift (grippe), biofilms.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma coopération :</b> cellule dendritique ⟶ LT4 ⟶ {LB ⟶ Ac : LTc ⟶ lyse}.</li>\n<li><b>Calcul de seuil collectif :</b> 1-1/R₀ (rougeole ~93 %).</li>\n<li><b>Analyser un échappement :</b> identifier la pression (vaccin/anticorps) et la réponse (variant).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>CMH-I ⟶ LTc : CMH-II ⟶ LT4.</li>\n<li>Diversité AVANT rencontre (VDJ).</li>\n<li>Pas de vaccin VIH : mutation + cible immunitaire elle-même.</li>\n</ul>"},
{"id": "climat-histoire", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Archives</b> : glaces (CO₂/T sur 800 000 ans), sédiments, cernes. <b>Forçages naturels</b> : Milanković (glaciations lentes).</p>\n<p><b>Attribution actuelle :</b> CO₂ fossile (signature isotopique), +1,2 °C, refroidissement stratosphérique ⟹ GES anthropiques (GIEC : « sans équivoque »).</p>\n<p><b>Futurs :</b> scénarios SSP (+1,5 à +5 °C) : atténuation + adaptation.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Dater un forçage :</b> comparer vitesses (Milanković : 1000 ans : actuel : 100 ans).</li>\n<li><b>Lire une courbe Keeling/glaces :</b> tendance + variations saisonnières.</li>\n<li><b>Décoder une projection :</b> scénario + médiane + plage : décision sous incertitude.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« Toujours changé » ≠ vitesse actuelle.</li>\n<li>Soleil fort ⟹ stratosphère chaude (l'inverse est observé).</li>\n<li>Projection ≠ prophétie (dépend des émissions).</li>\n</ul>"},
{"id": "ecosystemes-humanite", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Anthropocène :</b> 75 % des terres transformées, cycles (azote ×2) bouleversés : empreinte > biocapacité (jour du dépassement).</p>\n<p><b>IPBES :</b> 1 M espèces menacées : causes : usage des terres (1), exploitation, climat, pollution, invasives.</p>\n<p><b>Solutions :</b> protection (30×30), restauration (cascades trophiques, corridors), sobriété.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Analyser un impact humain :</b> remonter la chaîne (azote : engrais ⟹ lessivage ⟹ zone morte).</li>\n<li><b>Argumenter avec les services :</b> pollinisation, épuration, régulation chiffrés.</li>\n<li><b>Gérer un conflit écologique :</b> science (cascade) + technique (mesures) + social (équité).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Cause n°1 = usage des terres (pas le climat, pas encore).</li>\n<li>Biodiversité ordinaire s'effondre aussi.</li>\n<li>Protection ≠ restauration : il faut les deux.</li>\n</ul>"},
{"id": "homeostasie-sante", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Homéostasie :</b> paramètres constants par boucle : capteurs ⟶ centre (hypothalamus...) ⟶ effecteurs ⟶ rétroaction négative.</p>\n<p><b>Glycémie ~1 g/L :</b> insuline (↓ stockage) / glucagon (↑ déstockage) : diabète 1 (ß détruites) vs 2 (résistance).</p>\n<p><b>Autres boucles :</b> température (frissons/sueur), pression (baroréflexe), pH (tampons/reins), hydratation (ADH/soif).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Analyser une boucle :</b> identifier paramètre, capteur, centre, effecteurs, rétroaction.</li>\n<li><b>Prédire une panne :</b> si l'insuline manque ⟹ glycémie ↑, cellules affamées, cétose.</li>\n<li><b>Distinguer compensation :</b> rapide (respiration) vs lente (rein).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Insuline ↓ glycémie : glucagon ↑ (ne pas inverser).</li>\n<li>Rétroaction NÉGATIVE = correction.</li>\n<li>Boucles pannées = pathologie (diabète).</li>\n</ul>"},
{"id": "cellule-vivant", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Tout vivant est cellulaire</b> : 1 cellule (bactérie) à 30 000 milliards (humain) : pas de vivant plus petit qu'une cellule.</p>\n<p><b>Organites :</b> noyau (information : ADN), membrane (frontière), cytoplasme, mitochondries (énergie) : végétal en plus : paroi, chloroplastes, vacuole.</p>\n<p><b>Niveaux :</b> molécule ⟶ organite ⟶ cellule ⟶ tissu ⟶ organe ⟶ système ⟶ organisme.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Identifier une cellule :</b> membrane + noyau + cytoplasme (grossissement ×400).</li>\n<li><b>Distinguer animal/végétal :</b> vert + paroi + forme géométrique = végétal.</li>\n<li><b>Ordonner les niveaux :</b> du plus petit (molécule) au plus grand (organisme).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Paroi = EN PLUS de la membrane.</li>\n<li>Virus = pas une cellule.</li>\n<li>Cellule géante (fibre) = toujours UNE cellule.</li>\n</ul>"},
{"id": "milieux-vie", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Milieu = caractéristiques</b> (lumière, eau, sol...) <b>+ peuplement</b> : les occupants sont ADAPTÉS aux caractéristiques.</p>\n<p><b>Chaîne :</b> producteur ⟹ consommateur ⟹ décomposeur : les flèches vont du mangé au mangeur : la matière circule.</p>\n<p><b>L'Homme modifie les milieux</b> (aménage, dégrade, restaure) : le peuplement est un INDICATEUR des changements.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Décrire un milieu :</b> lister caractéristiques PUIS occupants, relier par des adaptations.</li>\n<li><b>Construire une chaîne :</b> trier producteur/décomposeurs, orienter les flèches « est mangé par ».</li>\n<li><b>Interpréter un changement :</b> variation de peuplement ⟹ chercher la variation du milieu.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Sens des flèches (mangé ⟹ mangeur).</li>\n<li>Producteur = végétal vert (photosynthèse).</li>\n<li>Décomposeurs = fin de TOUTES les chaînes.</li>\n</ul>"},
{"id": "reproduction-vivants", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Cycle :</b> naissance ⟶ croissance ⟶ adulte ⟶ reproduction ⟶ mort : développement parfois spectaculaire (grenouille : têtard ⟶ métamorphose).</p>\n<p><b>Sexuée :</b> 2 parents + gamètes + fécondation ⟹ jeunes variés. <b>Asexuée :</b> 1 parent ⟹ clones (bouture, division).</p>\n<p><b>Vivipare</b> (petit dans la mère) vs <b>ovipare</b> (œuf pondu) : quantité vs soins.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Identifier le mode :</b> gamètes/fécondation ⟹ sexuée : fragment unique ⟹ asexuée.</li>\n<li><b>Décrire un développement :</b> ordre des stades + métamorphose éventuelle.</li>\n<li><b>Comparer les stratégies :</b> nombre de nés vs nombre de survivants.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Gamètes = cellules (fécondation = fusion).</li>\n<li>Bouture = clone (asexuée).</li>\n<li>Ovipare ≠ « sans soin » systématique (les oiseaux couvent).</li>\n</ul>"},
];
var QUESTIONS = [
{"t": "La biodiversité et le vivant (6e)", "q": "Un être vivant se reconnaît à :", "c": ["sa couleur", "sa taille", "sa dureté", "sa capacité à naître, se nourrir, grandir, se reproduire"], "a": 3, "e": "Les critères du vivant : naître, se nourrir, respirer, grandir, se reproduire, réagir, mourir.", "d": "<b>Naître, se nourrir, grandir, se reproduire…</b> : la combinaison des critères.<div class='ex-detail'><u>Exemple rédigé</u> : test sur une voiture : elle « se déplace » mais ne grandit pas, ne se reproduit pas, ne se nourrit pas : non vivante. Une graine immobile : elle GERME (croissance) : vivante. Piège : un seul critère ne suffit jamais : le feu « grandit » et « consomme » mais ne respire ni ne se reproduit : c'est L'ENSEMBLE des critères qui définit le vivant.</div>"},
{"t": "La biodiversité et le vivant (6e)", "q": "La biodiversité inclut :", "c": ["seulement le nombre d'espèces", "les espèces, la variété au sein des espèces et les milieux de vie", "seulement les forêts", "seulement les animaux"], "a": 1, "e": "Trois niveaux : spécifique (espèces), génétique (intra-espèce), écosystèmes (milieux).", "d": "<b>Espèces + variété interne + milieux</b> : les trois étages.<div class='ex-detail'><u>Exemple rédigé</u> : dans un square : 12 oiseaux, 9 plantes (espèces) ; pas deux pissenlits identiques (génétique) ; sol, haie, mare (écosystèmes) : la biodiversité d'un lieu = tout ce vivant à toutes les échelles. Piège : « seulement le nombre d'espèces » : c'est l'erreur fréquente : la diversité GÉNÉTIQUE (chiens d'une même race, variétés de pommes) et la diversité des MILIEUX en font partie : trois niveaux, jamais un seul.</div>"},
{"t": "La biodiversité et le vivant (6e)", "q": "La baleine est classée parmi :", "c": ["les mammifères", "les crustacés", "les poissons", "les reptiles"], "a": 0, "e": "Poumons, poils, allaitement : attributs de mammifère, malgré le milieu aquatique.", "d": "<b>Les mammifères</b> : les attribents hérités décident.<div class='ex-detail'><u>Exemple rédigé</u> : raisonnement : la baleine vit dans l'eau et a des nageoires (ressemblance avec le requin), MAIS elle respire par des POUMONS (elle remonte respirer), possède des poils (très peu !) et allaute ses petits avec du lait : trois attributs de mammifère : elle descend d'ancêtres terrestres revenus à l'eau il y a 50 millions d'années. Piège : le MILIEU ne classe pas : les NAGEOIRS du requin (n'ont pas d'os) et de la baleine (os de membres !) se ressemblent sans prouver une parenté : se ressembler n'est pas être apparenté.</div>"},
{"t": "La biodiversité et le vivant (6e)", "q": "Les champignons sont :", "c": ["des végétaux", "des minéraux", "ni des végétaux ni des animaux (règne à part)", "des animaux"], "a": 2, "e": "Règne distinct : ils ne photosynthétisent pas et ne mangent pas comme nous.", "d": "<b>Un règne à part</b> : ni végétal ni animal.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi : les végétaux fabriquent leur matière par photosynthèse (énergie lumineuse) ; les animaux mangent d'autres êtres ; les champignons ABSORBENT leur nourriture en décomposant la matière organique autour d'eux (c'est pour ça qu'ils poussent sur le bois, le pain, le sol humide) : mode de nutrition unique ⟹ règne fongique à part (plus proche des animaux que des plantes, fait amusant). Piège : « végétaux car ils poussent » : pousser ne définit pas un végétal : le critère est le MODE DE NUTRITION.</div>"},
{"t": "La biodiversité et le vivant (6e)", "q": "Deux organismes sont apparentés si :", "c": ["ils vivent au même endroit", "ils ont la même taille", "ils partagent des attributs hérités d'un ancêtre commun", "ils ont la même couleur"], "a": 2, "e": "La parenté se lit dans les caractères hérités (poumons, poils, vertèbres), pas dans l'habitat.", "d": "<b>Ils partagent des attributs hérités</b> d'un ancêtre commun.<div class='ex-detail'><u>Exemple rédigé</u> : comparaison : dauphin (mer) et chauve-souris (air) : milieux opposés, MAIS poumons, poils, allaitement, squelette de membre à 5 doigts : mammifères apparentés. Le requin (mer, comme le dauphin) : branchies, pas de poils : parenté LOINTAINE malgré le milieu. Piège : « même endroit » : l'évolution COPIE des solutions (nageoires) chez des lignées sans parenté : l'habitat ressemble, l'hérédité apparente.</div>"},
{"t": "La biodiversité et le vivant (6e)", "q": "Combien d'espèces estime-t-on sur Terre ?", "c": ["une infinité connue", "environ 100 000", "environ 10 000", "environ 2 millions décrites, 8-10 millions estimées"], "a": 3, "e": "~2 millions décrites ; les estimations montent à 8-10 millions (surtout insectes et océans inexplorés).", "d": "<b>~2 millions décrites, 8-10 millions estimées</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le fossé : les insectes (≈ 80 % des espèces animales décrites !) et la vie marine profonde restent massivement inexplorés : chaque année, ~15 000 nouvelles espèces sont décrites : la biodiversité est encore largement INCONNUE : c'est l'un des grands chantiers de la biologie (inventaire des océans, ADN environnemental). Piège : « une infinité connue » : la science AVANCE mais reste prudente : un comptage vivant, jamais fini.</div>"},
{"t": "La biodiversité et le vivant (6e)", "q": "Les micro-organismes du sol dans un carré de jardin :", "c": ["disparaissent en hiver", "sont inutiles", "sont tous des maladies", "sont innombrables et indispensables (décomposition, recyclement)"], "a": 3, "e": "Une poignée de terre contient plus de microbes qu'il n'y a d'humains : ils décomposent et recyclent.", "d": "<b>Indispensables et innombrables</b> : les recycleurs de l'écosystème.<div class='ex-detail'><u>Exemple rédigé</u> : le travail caché : bactéries et champignons décomposent les feuilles mortes en humus, rendent les nutriments aux racines, fixent même l'azote de l'air : sans eux, la matière morte S'ACCUMULERAIT et les plantes manqueraient de nourriture : la biodiversité invisible fait vivre la visible. Piège : « tous des maladies » : quelques microbes pathogènes existent, mais l'immense majorité est NECESSAIRE à la vie (sol, digestion, fromage, yaourt !).</div>"},
{"t": "La biodiversité et le vivant (6e)", "q": "Une graine sèche immobile depuis 2 ans est :", "c": ["morte", "un minéral", "impossible à dire", "vivante (en dormance : elle peut germer)"], "a": 3, "e": "La vie peut être en attente : mis dans l'eau, elle germe : elle était vivante.", "d": "<b>Vivante</b> : la dormance est une vie ralentie.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience décisive : arroser et chauffer la graine : elle GERME (racine, tige, croissance) : un objet mort ne ressuscite pas : la graine était en vie ralentie (métabolisme quasi arrêté, protection par son enveloppe). Record : des graines de dattier vieux de 2000 ans (Masada) ont germé ! Piège : « immobile ⟹ morte » : l'immobilité n'est pas un critère : c'est la CAPACITÉ à relancer les fonctions (germination) qui prouve la vie.</div>"},
{"t": "La biodiversité et le vivant (6e)", "q": "Dans la classification emboîtée, le chat appartient à :", "c": ["plusieurs groupes emboîtés : félin, mammifère, vertébré, animal", "le groupe des « terrestres »", "aucun groupe", "un seul groupe"], "a": 0, "e": "Les groupes s'emboîtent : le chat est félin ET mammifère ET vertébré ET animal à la fois.", "d": "<b>Plusieurs groupes emboîtés</b> à la fois.<div class='ex-detail'><u>Exemple rédigé</u> : les poupées russes : « animal » contient « vertébré » qui contient « mammifère » qui contient « félin » qui contient « chat » : chaque niveau ajoute des attributs partagés (vertèbres, poils+allaitement, griffes rétractiles) : plus le groupe est petit, plus les attributs sont précis. Piège : « un seul groupe » : la classification n'est pas une série de tiroirs mais une HIÉRARCHIE : tout Félin est aussi Mammifère : c'est le sens du mot « emboîté ».</div>"},
{"t": "La biodiversité et le vivant (6e)", "q": "Deux vrais jumeaux illustrent :", "c": ["une très faible diversité génétique entre deux individus d'une même espèce", "la biodiversité des milieux", "l'absence de biodiversité", "la classification"], "a": 0, "e": "Même espèce, patrimoine génétique quasi identique : la biodiversité intra-espèce est variable.", "d": "<b>Une diversité génétique quasi nulle entre eux</b> (cas exceptionnel).<div class='ex-detail'><u>Exemple rédigé</u> : comparaison : deux humains quelconques partagent 99,9 % de leur ADN : vrais jumeaux : 100 % (même ovule, même fécondation) : ils montrent par contraste que la biodiversité GÉNÉTIQUE (le 0,1 % de différence) fait l'unicité de chacun : c'est le 2e étage de la biodiversité : au sein d'une même espèce, chacun (sauf jumeaux vrais) est unique. Piège : « l'absence de biodiversité » : même entre jumeaux, les milieux et l'expérience font deux personnes distinctes : la biodiversité génétique est faible, jamais la diversité des individus.</div>"},
{"t": "La digestion et les nutriments (5e)", "q": "La digestion chimique commence dans :", "c": ["l'estomac uniquement", "l'intestin", "le gros intestin", "la bouche (salive et amylase)"], "a": 3, "e": "L'amylase salivaire découpe déjà l'amidon en sucres.", "d": "<b>La bouche</b> : la salive agit dès la mastication.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience : mâcher un morceau de pain blanc pendant 2 minutes : le goût devient SUCRÉ : l'amylase salivaire a coupé l'amidon en glucose pendant que les dents broyaient. Piège : « l'estomac uniquement » : l'estomac est surtout un malaxeur acide (meat killer), mais le découpage des glucides démarre AVANT, dans la bouche : la digestion est un travail d'équipe du premier au dernier étage.</div>"},
{"t": "La digestion et les nutriments (5e)", "q": "Les nutriments issus de la digestion passent dans le sang au niveau de :", "c": ["l'estomac", "l'intestin grêle", "l'œsophage", "le gros intestin"], "a": 1, "e": "L'absorption a lieu dans l'intestin grêle, via les villosités.", "d": "<b>L'intestin grêle</b> : la grande éponge absorbante.<div class='ex-detail'><u>Exemple rédigé</u> : le trajet complet : bol alimentaire ⟶ estomac (malaxé) ⟶ grêle : là, les derniers sucs terminent le découpage ET les nutriments traversent la paroi plissée vers les capillaires : ~30 m² de surface d'échange. Le gros intestin derrière ne fait que récupérer l'eau et abriter le microbiote. Piège : « le gros intestin » : c'est le siège des selles, pas de l'absorption des nutriments.</div>"},
{"t": "La digestion et les nutriments (5e)", "q": "Les enzymes digestives servent à :", "c": ["tuer tous les microbes", "transporter le sang", "découper les grosses molécules en petites absorbables", "stocker les aliments"], "a": 2, "e": "Chaque enzyme coupe une classe précise : amidon⟶glucose, protéines⟶acides aminés, lipides⟶acides gras.", "d": "<b>Découper</b> les molécules pour les rendre absorbables.<div class='ex-detail'><u>Exemple rédigé</u> : le pourquoi : la paroi intestinale est un filtre à petites molécules : l'amidon (chaîne de centaines de glucose) est trop GROS pour traverser : l'amylase coupe la chaîne maillon par maillon : le glucose seul passe. Piège : « tuer les microbes » : c'est le RÔLE DE L'ACIDE de l'estomac (pH 2), pas des enzymes : une enzyme est une paire de ciseaux moléculaire, pas un désinfectant.</div>"},
{"t": "La digestion et les nutriments (5e)", "q": "Amidon, protéines et lipides deviennent respectivement :", "c": ["glucose, acides aminés, acides gras", "acides, bases, sels", "glucose, graisses, protéines", "sucres, sels, vitamines"], "a": 0, "e": "Amidon⟶glucose ; protéines⟶acides aminés ; lipides⟶acides gras + glycérol.", "d": "<b>Glucose, acides aminés, acides gras</b> : les trios du chapitre.<div class='ex-detail'><u>Exemple rédigé</u> : logique : chaque famille alimentaire est découpée en ses briques : les sucres lents en sucres simples, les protéines en briques d'acides aminés (que le corps réutilisera pour ses propres protéines), les graisses en acides gras (stockage, membranes). Le corps RECYCLE les briques, il ne répare pas les aliments. Piège : « glucose, graisses, protéines » : ce triplet mélange produits et aliments de départ : à l'arrivée dans le sang, il n'y a plus que des BRIQUES.</div>"},
{"t": "La digestion et les nutriments (5e)", "q": "Le rôle de l'estomac :", "c": ["absorber les nutriments", "stocker la bile", "brasser les aliments et les mélanger au suc gastrique acide", "fabriquer les enzymes intestinales"], "a": 2, "e": "Malaxage + acidité (pH ~2) : bouillie (chyme) et destruction des microbes.", "d": "<b>Brasser + acidifier</b> : le mélangeur du corps.<div class='ex-detail'><u>Exemple rédigé</u> : le double travail : MÉCANIQUE (muscles qui malaxent le repas en chyme) et CHIMIQUE (HCl à pH 2 : dénature les protéines, tue la plupart des microbes ingérés) : l'estomac ne fait quasiment PAS d'absorption (sauf l'alcool !). Piège : « absorber les nutriments » : c'est le grêle : l'estomac prépare, l'intestin récupère : chaque organe, son métier.</div>"},
{"t": "La digestion et les nutriments (5e)", "q": "Les villosités intestinales servent à :", "c": ["digérer les graisses uniquement", "sécréter l'acide", "embellir l'intestin", "augmenter la surface d'absorption (~30 m²)"], "a": 3, "e": "Les replis multiplient la surface d'échange : absorption plus rapide.", "d": "<b>Augmenter la surface</b> d'absorption.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul de la nature : un tube lisse de 6 m : ~2 m² ; avec plis + villosités + microvillosités : ×15 : ~30 m² (un studio !) : chaque repli est bordé de capillaires sanguins collés à la paroi : distance minimale, échange maximal. Preuve par la maladie : la maladie coeliaque (gluten) aplatit les villosités : surface ÷10 : malnutrition malgré des repas normaux : la structure EST la fonction.</div>"},
{"t": "La digestion et les nutriments (5e)", "q": "La bile, fabriquée par le foie, sert à :", "c": ["absorber l'eau", "digérer les protéines", "neutraliser l'acidité uniquement", "émulsionner les graisses (les découper en gouttelettes)"], "a": 3, "e": "La bile ne « digère » pas les lipides : elle les émulsionne pour que la lipase travaille mieux.", "d": "<b>Émulsionner les graisses</b> : le détergent naturel.<div class='ex-detail'><u>Exemple rédigé</u> : l'image : la vaisselle grasse : le liquide vaisselle découpait la pellicule d'huile en gouttelettes : la bile fait pareil dans le duodénum : les gouttelettes offrent PLUS de surface à la lipase (qui finit le découpage chimique). Piège : « digérer les protéines » : la bile ne coupe AUCUNE molécule : elle SÉPARE mécaniquement (comme les dents à échelle microscopique) : sans bile (cholestase), les graisses mal émulsionnées partent dans les selles : selles claires, floaters.</div>"},
{"t": "La digestion et les nutriments (5e)", "q": "Le gros intestin (côlon) sert principalement à :", "c": ["absorber les nutriments", "digérer l'amidon", "sécréter la bile", "récupérer l'eau et abriter le microbiote"], "a": 3, "e": "Il récupère l'eau du contenu l'eau : les milliards de bactéries y vivent (microbiote).", "d": "<b>Récupérer l'eau + héberger le microbiote</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le chiffre : chaque jour, ~9 L de liquide traversent le tube digestif (boisson + sucs) : le grêle en réabsorbe l'essentiel, le côlon finit le travail : s'il échoue (gastro-entérite), l'eau reste dans les selles : DIARRHÉE et risque de déshydratation. Le microbiote du côlon (~10¹⁴ bactéries !) fabrique des vitamines et entraîne le système immunitaire. Piège : « absorber les nutriments » : le travail nutritionnel est fini en amont.</div>"},
{"t": "La digestion et les nutriments (5e)", "q": "Une digestion mécanique, c'est par exemple :", "c": ["les dents qui broient et l'estomac qui malaxe", "la bile qui coupe les graisses", "le glucose qui passe dans le sang", "l'amylase qui coupe l'amidon"], "a": 0, "e": "Tout découpage PHYSIQUE est mécanique ; les enzymes font la digestion chimique.", "d": "<b>Les dents et le brassage gastrique</b> : le physique.<div class='ex-detail'><u>Exemple rédigé</u> : le tri : MÉCANIQUE = réduire en morceaux sans changer les molécules (dents, malaxage) ; CHIMIQUE = couper les molécules (enzymes, bile pour disperser). Attention : la bile émulsionne (dispersion physique) mais ne coupe pas les lipides : c'est un geste MÉCANIQUE microscopique rendu possible par une substance chimique : le classement se fait sur CE QUI est transformé (des positions, pas des molécules).</div>"},
{"t": "La digestion et les nutriments (5e)", "q": "Après un repas, les nutriments rejoignent les cellules par :", "c": ["l'air", "le sang (capillaires intestinaux ⟶ circulation)", "la lymphe uniquement", "les nerfs"], "a": 1, "e": "Glucose et acides aminés passent dans les capillaires sanguins de l'intestin puis circulent.", "d": "<b>Le sang</b> : le réseau de livraison du corps.<div class='ex-detail'><u>Exemple rédigé</u> : l'itinéraire : nutriments ⟶ capillaires de l'intestin ⟶ veine porte ⟶ FOIE (le trieur : stocke le glucose en glycogène, neutralise les toxines) ⟶ cœur ⟶ artères ⟶ cellules (respiration cellulaire : énergie). Les graisses prennent un chemin spécial (lymphe) avant de rejoindre le sang. Piège : « la lymphe uniquement » : seule une PARTIE des lipides emprunte la lymphe : la voie principale des nutriments est SANGUINE.</div>"},
{"t": "La respiration et les échanges gazeux (5e)", "q": "Les échanges gazeux entre l'air et le sang ont lieu dans :", "c": ["la trachée", "les bronches", "le diaphragme", "les alvéoles pulmonaires"], "a": 3, "e": "Les alvéoles : parois ultrafines, tapissées de capillaires : diffusion O₂/CO₂.", "d": "<b>Les alvéoles</b> : la station d'échange.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi elles : 300 millions de sacs de ~0,2 mm : surface totale ~70 m² (un court de tennis !) : paroi alvéole-capillaire : 0,5 µm (25× plus fine qu'un cheveu) : le O₂ diffuse vers le sang, le CO₂ dans l'autre sens. Piège : « la trachée » : c'est un simple TUYAU rigide de transit : aucun vaisseau d'échange à cet étage : structure = fonction.</div>"},
{"t": "La respiration et les échanges gazeux (5e)", "q": "À l'inspiration, le diaphragme :", "c": ["tourne", "remonte", "descend (la cage s'agrandit, l'air entre)", "ne bouge pas"], "a": 2, "e": "Il descend et s'aplatit : le volume thoracique augmente : l'air est aspiré.", "d": "<b>Descend</b> : l'aspiration du souffle.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience : main sur le ventre, une inspiration profonde : la main SE SOULÈVE : le diaphragme (muscle en dôme au repos) s'aplatit vers le bas : le volume du thorax augmente : la pression y baisse : l'air extérieur (plus pressé) afflue : comme retirer le piston d'une seringue. Piège : « remonte » : c'est l'EXPIRATION (le repos du muscle) : le sens du diaphragme est le réflexe n°1 du chapitre.</div>"},
{"t": "La respiration et les échanges gazeux (5e)", "q": "L'air expiré par rapport à l'air inspiré contient :", "c": ["moins d'O₂ (16 %) et beaucoup plus de CO₂", "la même chose", "du pur CO₂", "plus d'O₂ et moins de CO₂"], "a": 0, "e": "O₂ 21 ⟶ 16 % ; CO₂ 0,04 ⟶ ~4,5 % : l'organisme a pris de l'O₂ et rejeté du CO₂.", "d": "<b>Moins d'O₂, beaucoup plus de CO₂</b> : la signature de la respiration.<div class='ex-detail'><u>Exemple rédigé</u> : les chiffres : inspiré : 21 % O₂, 0,04 % CO₂ ; expiré : 16 % O₂, 4,5 % CO₂ (+ vapeur d'eau + chaleur) : le poumon est une station d'échange : le sang dépose, prélève. Piège : « du pur CO₂ » : l'air expiré garde ENCORE 16 % d'O₂ (les ¾ de l'O₂ respiré repartent !) : c'est exactement pour ça que le bouche-à-bouche sauve des vies : l'air expiré contient largement assez d'O₂ pour un inconscient.</div>"},
{"t": "La respiration et les échanges gazeux (5e)", "q": "La respiration cellulaire, c'est :", "c": ["la ventilation des poumons", "glucose + O₂ ⟶ CO₂ + H₂O + énergie, dans chaque cellule", "respirer vite", "le battement du cœur"], "a": 1, "e": "Toutes les cellules brûlent du glucose avec l'O₂ pour produire leur énergie.", "d": "<b>Glucose + O₂ ⟶ CO₂ + H₂O + énergie</b>, dans les mitochondries.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne complète : poumons ⟶ sang ⟶ cellule : dans la cellule, le « moteur » mitochondrial combine nutriments et O₂ : il rejette CO₂ et H₂O et libère l'énergie (mouvement, chaleur, pensée !). Respirer (poumons) ne sert QU'À alimenter cette combustion : le souffle est le tuyau, la cellule est la cheminée. Piège : « respirer vite » : c'est la VENTILATION (le transport), pas la respiration cellulaire (la combustion) : deux niveaux à ne pas confondre.</div>"},
{"t": "La respiration et les échanges gazeux (5e)", "q": "L'O₂ est transporté dans le sang par :", "c": ["les plaquettes", "les globules blancs", "l'hémoglobine des globules rouges", "le plasma seul"], "a": 2, "e": "L'hémoglobine fixe l'O₂ dans les poumons et le libère dans les tissus.", "d": "<b>L'hémoglobine des globules rouges</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la logistique : l'O₂ dissous seul dans le plasma ne suffirait pas : l'hémoglobine (protéine riche en FER, d'où la couleur rouge) fixe 4 O₂ par molécule : un globule rouge transporte ~1 milliard d'O₂ ! Le CO₂, lui, voyage surtout dissous sous forme de bicarbonate. Piège : « le plasma seul » : il ne transporte que ~1,5 % de l'O₂ : sans globules rouges, l'apport serait 70 fois trop faible : l'anémie (manque de fer) traduit exactement ce que le cours décrit.</div>"},
{"t": "La respiration et les échanges gazeux (5e)", "q": "Pendant un sprint, la ventilation et le rythme cardiaque augmentent car :", "c": ["les muscles consomment plus d'O₂ et produisent plus de CO₂", "les poumons grossissent", "c'est un réflexe inutile", "le corps veut se refroidir uniquement"], "a": 0, "e": "Les centres respiratoires détectent le CO₂ en hausse et pilotent la ventilation et le cœur.", "d": "<b>La demande musculaire augmente</b> : le corps adapte l'apport.<div class='ex-detail'><u>Exemple rédigé</u> : la régulation : cellules musculaires au travail ⟶ CO₂ ↑ dans le sang ⟶ capteurs (centre respiratoire du tronc cérébral) ⟶ ordre : respiration plus ample et rapide + cœur accéléré : la livraison suit la demande. À la limite : la filière anaérobie prend le relais : lactate (jambes lourdes). Piège : « se refroidir » : la sueur fait ça, pas le souffle : l'essoufflement est une réponse à un BESOIN d'O₂, pas à la chaleur.</div>"},
{"t": "La respiration et les échanges gazeux (5e)", "q": "La paroi entre alvéole et capillaire est :", "c": ["osseuse", "épaisse et imperméable", "ultrafine (~0,5 µm) pour permettre la diffusion", "constituée de plusieurs millimètres de muscle"], "a": 2, "e": "La finesse est la condition de l'échange : gaz et sang presque au contact.", "d": "<b>Ultrafine (~0,5 µm)</b> : la frontière minimale.<div class='ex-detail'><u>Exemple rédigé</u> : l'argument : la diffusion est efficace sur de COURTES distances : la nature a tout mis en œuvre pour rapprocher l'air et le sang : 300 millions d'alvéoles (surface ~70 m²), parois de 0,5 µm (25× plus fines qu'un cheveu), capillaires collés : chaque poumon est un échangeur optimisé. Contre-exemple : la fumée de cigarette épaissit cette paroi (emphysème) : les échanges deviennent laborieux : l'essoufflement du fumeur est la maladie de cette microstructure.</div>"},
{"t": "La respiration et les échanges gazeux (5e)", "q": "La voie aérienne complète, dans l'ordre :", "c": ["nez ⟶ trachée ⟶ bronches ⟶ bronchioles ⟶ alvéoles", "nez ⟶ bronches ⟶ trachée ⟶ alvéoles", "trachée ⟶ nez ⟶ alvéoles ⟶ bronches", "alvéoles ⟶ trachée ⟶ nez"], "a": 0, "e": "L'ordre de plus en plus fin : tuyaux qui se divisent jusqu'aux sacs d'échange.", "d": "<b>Nez ⟶ trachée ⟶ bronches ⟶ bronchioles ⟶ alvéoles</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la logique de l'arbre : un tronc (trachée), deux grosses branches (bronches, une par poumon), ~20 générations de branches de plus en plus fines (bronchioles), et les FEUILLES = les alvéoles : 300 millions de sacs : la structure d'un arbre POUR l'échange : le nez, en amont, réchauffe, humidifie et filtre l'air : chaque étage prépare le suivant.</div>"},
{"t": "La respiration et les échanges gazeux (5e)", "q": "Le CO₂ rejeté provient :", "c": ["des poumons qui le fabriquent", "de l'eau bue", "de l'air inspiré stocké", "de l'activité des cellules (déchet de la respiration cellulaire)"], "a": 3, "e": "Le CO₂ est le déchet de combustion des cellules, rapporté au poumon par le sang.", "d": "<b>Des cellules</b> : le déchet de leur combustion.<div class='ex-detail'><u>Exemple rédigé</u> : l'itinéraire inversé : cellule (CO₂ produit) ⟶ sang ⟶ poumon ⟶ expiration : le poumon ne FABRIQUE rien : c'est une douane d'échange. Conséquence clinique : le souffle à retenir (apnée) fait monter le CO₂ sanguin : c'est LUI le signal du manque d'air (pas le manque d'O₂ !) : la sensation de brûler dans les yeux quand on retient son souffle est un excès de CO₂, mesuré en permanence par l'organisme.</div>"},
{"t": "La respiration et les échanges gazeux (5e)", "q": "Les poumons se gonflent car :", "c": ["ils possèdent des muscles internes", "le diaphragme et les côtes agrandissent la cage thoracique (l'air est aspiré)", "le cœur les poussent", "l'air veut entrer tout seul"], "a": 1, "e": "Pas de muscles propres aux poumons : c'est la cage thoracique qui crée la dépression.", "d": "<b>La cage thoracique les aspire</b> : des ballons dans une seringue.<div class='ex-detail'><u>Exemple rédigé</u> : l'image juste : les poumons sont des éponges ÉLASTIQUES collées à la plèvre : quand le diaphragme descend et que les côtes s'écartent, la cavité s'agrandit : la pression intra-pulmonaire baisse SOUS la pression atmosphérique : l'air s'engouffre. Si la plèvre est perforée (pneumothorax), le poumon se DÉGONFLE : la « colle » mécanique est rompue : respirer est une affaire de pressions, pas de muscles pulmonaires.</div>"},
{"t": "La circulation sanguine (5e)", "q": "Une artère est un vaisseau qui :", "c": ["sort du cœur", "transporte toujours du sang riche en O₂", "revient au cœur", "est un capillaire"], "a": 0, "e": "Définition par le SENS : qui sort du cœur (aorte, artère pulmonaire...).", "d": "<b>Sort du cœur</b> : le sens, rien d'autre.<div class='ex-detail'><u>Exemple rédigé</u> : le piège : « transporte du sang riche en O₂ » : FAUX comme définition : l'artère pulmonaire SORT du cœur droit et transporte du sang PAUVRE en O₂ : c'est toujours une artère ! La richesse en O₂ varie, le sens ne change jamais : artère = sort, veine = revient. Les deux exceptions pulmonaires (artère pauvre, veine riche) font tomber la fausse définition.</div>"},
{"t": "La circulation sanguine (5e)", "q": "La petite circulation relie :", "c": ["le cœur aux organes", "le cœur aux poumons", "les poumons au cerveau", "le foie au cœur"], "a": 1, "e": "Cœur droit ⟶ poumons (recharge en O₂) ⟶ cœur gauche.", "d": "<b>Le cœur aux poumons</b> : le voyage de rechargement.<div class='ex-detail'><u>Exemple rédigé</u> : l'itinéraire : ventricule droit ⟶ artère pulmonaire ⟶ capillaires pulmonaires (O₂ chargé, CO₂ lâché) ⟶ veine pulmonaire ⟶ oreillette gauche : la goutte n'a visité QUE les poumons : le reste du corps attend la grande circulation : deux pompes en série dans un seul cœur.</div>"},
{"t": "La circulation sanguine (5e)", "q": "Les échanges entre sang et cellules ont lieu dans :", "c": ["les veines", "les artères", "les capillaires", "le cœur"], "a": 2, "e": "Les capillaires : paroi d'une cellule, vitesse minimale : le glucose, l'O₂ filtrent.", "d": "<b>Les capillaires</b> : l'étage de la livraison.<div class='ex-detail'><u>Exemple rédigé</u> : le pourquoi : les échanges exigent des parois fines et un écoulement LENT : les capillaires (diamètre d'une cellule sanguine !) remplissent les deux conditions : le sang y serpente au ralenti : O₂ et nutriments traversent, CO₂ et déchets entrent : les artères/veines sont des AUTOROUTES de transit, aucun échange n'y est prévu.</div>"},
{"t": "La circulation sanguine (5e)", "q": "Le sang pauvre en O₂ arrive au cœur par :", "c": ["la veine cave (oreillette droite)", "les coronaires", "la veine pulmonaire", "l'aorte"], "a": 0, "e": "Les veines caves ramènent le sang des organes, chargé en CO₂, à l'oreillette droite.", "d": "<b>La veine cave ⟶ oreillette droite</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le grand retour : organes (sang appauvri en O₂, enrichi en CO₂) ⟶ veines ⟶ veines caves (supérieure et inférieure) ⟶ oreillette droite ⟶ ventricule droit ⟶ poumons : le cœur droit est l'étage de la RECOUVRE (avant la purification pulmonaire). Piège : « la veine pulmonaire » : elle arrive bien au cœur, mais côté GAUCHE, chargée d'O₂ fraîchement capté : c'est l'entrée du sang RICHE.</div>"},
{"t": "La circulation sanguine (5e)", "q": "L'infarctus du myocarde survient quand :", "c": ["le sang manque de plaquettes", "les poumons s'arrêtent", "une artère coronaire (qui nourrit le cœur) se bouche", "le cœur bat trop vite"], "a": 2, "e": "Le muscle cardiaque, privé d'O₂ par l'obstruction coronaire, meurt localement.", "d": "<b>Une coronaire se bouche</b> : le cœur affamé d'O₂.<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe à comprendre : le cœur baigne dans le sang, mais il est nourri par ses PROPRES artères (les coronaires, posées à sa surface) : si un caillot ou une plaque de cholestérol obstrue une coronaire, la zone irriguée meurt : douleur en étau, irradiation bras/mâchoire : chaque minute compte (dégagement urgent). Facteurs de risque : tabac, cholestérol, sédentarité : le cours devient un geste de santé publique.</div>"},
{"t": "La circulation sanguine (5e)", "q": "Les valvules des veines servent à :", "c": ["empêcher le sang de refluer (anti-retour)", "pousser le sang", "filtrer les microbes", "emballir le sang"], "a": 0, "e": "Le sang veineux circule à basse pression : les valvules le bloquent s'il reflue.", "d": "<b>Empêcher le reflux</b> : des clapets anti-retour.<div class='ex-detail'><u>Exemple rédigé</u> : le problème veineux : le sang revient au cœur à BASSE pression, parfois contre la gravité (jambes !) : les valvules se ferment si le sang tente de reculer : la contraction des muscles des jambes « presse » le sang vers le haut. Piège clinique : si les valvules fuient (varices), le sang stagne : jambes lourdes, œdème : marcher aide PRÉCISÉMENT la pompe veineuse.</div>"},
{"t": "La circulation sanguine (5e)", "q": "Le rôle des globules rouges :", "c": ["digérer", "coaguler le sang", "transporter l'O₂ (hémoglobine)", "défendre contre les microbes"], "a": 2, "e": "L'hémoglobine fixe l'O₂ aux poumons et le libère dans les organes.", "d": "<b>Transporter l'O₂</b> : les camions-citernes du sang.<div class='ex-detail'><u>Exemple rédigé</u> : la répartition du travail : globules ROUGES ⟶ O₂ ; globules BLANCS ⟶ défense (immunité) ; PLAQUETTES ⟶ colmatage (coagulation) ; PLASMA ⟶ transport liquide (nutriments, déchets, hormones). Anémie (manque de fer/rouges) : moins de transporteurs : fatigue, pâleur : le manque d'O₂ cellulaire expliqué.</div>"},
{"t": "La circulation sanguine (5e)", "q": "Un sportif au repos a une fréquence cardiaque plus basse car :", "c": ["il ne respire plus", "son cœur éjecte plus de sang par battement (cœur plus efficace)", "son sang est plus rapide", "son cœur est fatigué"], "a": 1, "e": "L'entraînement muscle le cœur : chaque battement éjecte davantage : moins de battements suffisent.", "d": "<b>Son cœur éjecte plus par battement</b> : la pompe musclée.<div class='ex-detail'><u>Exemple rédigé</u> : les chiffres : sédentaire : 70 bpm × 70 mL = ~5 L/min ; sportif au repos : 45-50 bpm × 100+ mL = le MÊME débit avec presque moitié moins de battements : le cœur s'entraîne comme un muscle : cavités plus grandes, paroi plus épaisse : il travaille « en économique » : c'est l'argument du sport d'endurance pour la santé.</div>"},
{"t": "La circulation sanguine (5e)", "q": "Le sang traverse les cavités du cœur dans l'ordre :", "c": ["ventricule gauche ⟶ oreillette gauche", "oreillette ⟶ ventricule (côté droit puis côté gauche)", "au hasard", "ventricule ⟶ oreillette"], "a": 1, "e": "Chaque côté : oreillette (réception) puis ventricule (pompage) : jamais l'inverse.", "d": "<b>Oreillette puis ventricule</b> : la salle d'attente puis la pompe.<div class='ex-detail'><u>Exemple rédigé</u> : la logique hydraulique : l'oreillette est une petite cavité de RÉCEPTION à basse pression ; le ventricule, plus musclé, ÉJECTE à haute pression : les valvules (mitrale, tricuspide) garantissent le sens unique : un souffle cardiaque = une valvule qui fuit : le sang refluant brouille l'ordre oreillette⟶ventricule⟶artère : l'ordre est chirurgical.</div>"},
{"t": "La circulation sanguine (5e)", "q": "Le pouls que l'on sent au poignet correspond à :", "c": ["l'onde de pression artérielle à chaque battement du cœur", "la respiration", "le reflux veineux", "les plaquettes"], "a": 0, "e": "Chaque éjection ventriculaire crée une onde qui se propage dans les artères.", "d": "<b>L'onde de pression artérielle</b> : l'écho du battement.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience : deux doigts sur l'artère radiale : une pulsation par battement : compter 15 s ×4 = fréquence/min (au repos : 60-80). Piège : le pouls se prend sur une ARTÈRE (sous pression) : sur une veine, rien de perceptible (basse pression, pas d'onde) : le pouls EST la grande circulation qui frappe à la porte du poignet.</div>"},
{"t": "Les reins et l'élimination des déchets (5e)", "q": "L'urée, déchet éliminé par les reins, provient de :", "c": ["l'eau bue", "la respiration", "les graisses brûlées", "la dégradation des protéines"], "a": 3, "e": "Les protéines usées sont démontées : leur azote devient de l'urée, toxique si elle s'accumule.", "d": "<b>De la dégradation des protéines</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne : protéines cellulaires usées ⟶ démontage en acides aminés ⟶ le groupe azoté est transformé en URÉE par le foie ⟶ sang ⟶ reins ⟹ urines. Sans rein, l'urée monte dans le sang (urémie) : fatigue, nausées, coma : d'où la dialyse. Piège : « la respiration » : elle produit CO₂ et H₂O, éliminés par les POUMONS : chaque déchet a sa sortie désignée.</div>"},
{"t": "Les reins et l'élimination des déchets (5e)", "q": "Les reins filtrent 180 L de plasma par jour mais ne produisent que 1,5 L d'urine car :", "c": ["ils réabsorbent l'essentiel (eau, glucose, sels)", "ils fuient", "ils stockent le reste", "l'urine est recyclée"], "a": 0, "e": "Le néphron trie : filtration massive puis réabsorption de 99 % de l'eau et des molécules utiles.", "d": "<b>Ils réabsorbent</b> : des trieurs, pas des passoires.<div class='ex-detail'><u>Exemple rédigé</u> : le néphron en 2 temps : ① FILTRATION (le sang traverse le glomérule : eau, sels, glucose ET urée passent) ② RÉABSORPTION (le tubule reprend glucose en totalité, sels selon les besoins, 99 % de l'eau) : l'urine finale est le concentré du superflu. Piège : croire que tout ce qui est filtré part : sans réabsorption, on perdrait 180 L d'eau par jour : la mort en quelques heures.</div>"},
{"t": "Les reins et l'élimination des déchets (5e)", "q": "Le glucose présent dans l'urine signe :", "c": ["un rein très efficace", "un diabète (la glycémie dépasse le seuil rénal)", "une bonne hydratation", "un excès de sport"], "a": 1, "e": "Normalement 100 % du glucose est réabsorbé : sa présence = débordement du tri rénal.", "d": "<b>Un diabète sucré</b> : le débordement du trieur.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : le seuil rénal ~1,8 g/L de glycémie : en dessous, tout le glucose filtré est réabsorbé (urines SUCRÉES = zéro) : au-dessus (diabète non contrôlé), les transporteurs saturent : le sucre déborde dans l'urine, entraînant l'eau (diurèse osmotique) : d'où les 3 signes : urine abondante, soif, sucre. Le nom « diabète sucré » vient de là : les médecins goûtaient autrefois les urines.</div>"},
{"t": "Les reins et l'élimination des déchets (5e)", "q": "La vessie sert à :", "c": ["fabriquer l'urine", "produire l'urée", "stocker l'urine avant l'émission", "filtrer le sang"], "a": 2, "e": "Elle est un réservoir (400-600 mL) : la fabrication est le travail des reins.", "d": "<b>Stocker l'urine</b> : le réservoir du circuit.<div class='ex-detail'><u>Exemple rédigé</u> : la répartition : REIN (production goutte à goutte, en continu) ⟶ URÉTÈRE (le tuyau) ⟶ VESSIE (le stockage : l'envie vers 200-300 mL) ⟶ URÈTRE (l'émission contrôlée par deux sphincters) : un organe par métier. Piège : « fabriquer » : une confusion fréquente : quand la vessie est pleine, c'est le REIN qui a déjà tout fabriqué depuis des heures.</div>"},
{"t": "Les reins et l'élimination des déchets (5e)", "q": "Une urine foncée et peu abondante indique :", "c": ["une infection uniquement", "un diabète", "une déshydratation (le rein économise l'eau)", "une surhydratation"], "a": 2, "e": "Le rein concentre l'urine pour garder l'eau : signal clair : il faut boire.", "d": "<b>Une déshydratation</b> : le mode économie du rein.<div class='ex-detail'><u>Exemple rédigé</u> : la régulation : moins d'eau buue (ou pertes : chaleur, sport, fièvre) ⟹ le rein réabsorbe PLUS d'eau (grâce à l'ADH, l'hormone antidiurétique) ⟹ urine concentrée : foncée, faible volume, odeur forte. Boire abondamment ⟹ urine claire et abondante : la couleur est un indicateur d'hydratation GRATUIT et permanent.</div>"},
{"t": "Les reins et l'élimination des déchets (5e)", "q": "En cas d'insuffisance rénale, la dialyse :", "c": ["greffe un rein", "remplace le cœur", "filtre le sang hors du corps (rein artificiel)", "fabrique de l'urine artificielle"], "a": 2, "e": "Le sang circule dans un filtre à membrane : l'urée diffuse vers le bain de dialyse.", "d": "<b>Filtre le sang hors du corps</b> : le cours appliqué.<div class='ex-detail'><u>Exemple rédigé</u> : le principe : sang ⟶ machine (membranes semi-perméables baignées dans un liquide de dialyse) : l'urée passe du sang vers le bain (diffusion), le glucose et les sels utiles restent (bain calibré) : le sang épuré revient au patient : 4 h, 3 fois/semaine. La machine imite FILTRATION + TRI du néphron : elle ne remplace ni la régulation hormonale ni la greffe : seule la greffe restaure tout.</div>"},
{"t": "Les reins et l'élimination des déchets (5e)", "q": "Combien de néphrons par rein (environ) ?", "c": ["10", "1 million", "100 millions", "100"], "a": 1, "e": "~1 million de néphrons par rein : autant d'unités de filtration microscopiques.", "d": "<b>~1 million par rein</b> : l'usine en miniature.<div class='ex-detail'><u>Exemple rédigé</u> : l'ampleur : 2 millions d'unités filtrantes au total : chaque néphron est un mini-rein complet (filtre + tubule de tri) : le sang entier (~5 L) passe ~300 fois par jour dans les reins ! Donner un rein (donneur vivant) est possible car les nephrons restant prennent le relais : ~75 % de la fonction suffit à une vie normale.</div>"},
{"t": "Les reins et l'élimination des déchets (5e)", "q": "Le CO₂ produit par les cellules est éliminé par :", "c": ["le foie", "les reins", "les poumons", "la peau"], "a": 2, "e": "Respiration : le CO₂ diffuse du sang vers les alvéoles puis est expiré.", "d": "<b>Les poumons</b> : chaque déchet a sa porte de sortie.<div class='ex-detail'><u>Exemple rédigé</u> : la carte des déchets : CO₂ ⟶ POUMONS (expiré) ; urée ⟶ REINS (urine) ; bilirubine ⟶ FOIE (bile) ; chaleur ⟶ PEAU (sueur, rayonnement) : l'organisme est une ville avec plusieurs bennes de collecte : confondre les sorties est l'erreur classique : le rein ne touche JAMAIS au CO₂.</div>"},
{"t": "Les reins et l'élimination des déchets (5e)", "q": "Le rein participe aussi à :", "c": ["la production de bile", "la régulation de la pression artérielle et de l'équilibre en eau et sels", "la vision", "la digestion"], "a": 1, "e": "En ajustant l'eau et le sel excrétés (et via la rénine), le rein règle la pression du sang.", "d": "<b>Pression artérielle + équilibre eau/sels</b> : le régulateur caché.<div class='ex-detail'><u>Exemple rédigé</u> : la logique : plus d'eau et de sel retenus ⟹ plus de volume sanguin ⟞ plus de pression : le rein est un GRAND joueur de la tension (d'où les régimes sans sel pour les hypertendus : on attaque la rétention rénale). Il active aussi la vitamine D et une hormone du sang (EPO) : l'organe le plus sous-estimé du corps.</div>"},
{"t": "Les reins et l'élimination des déchets (5e)", "q": "L'ordre du trajet de l'urine :", "c": ["vessie ⟶ rein ⟶ urètre", "rein ⟶ vessie ⟶ uretère", "rein ⟶ uretère ⟶ vessie ⟶ urètre", "urètre ⟶ vessie ⟶ rein"], "a": 2, "e": "Production (rein), tuyau (uretère), réservoir (vessie), sortie (urètre).", "d": "<b>Rein ⟶ uretère ⟶ vessie ⟶ urètre</b> : les 4 étages.<div class='ex-detail'><u>Exemple rédigé</u> : l'astuce mémorielle : R-U-V-U : « Rein – Uretère – Vessie – Urètre » : la fabrication est CONTINUE (le rein ne dort jamais) mais l'émission est programmée (sphincters) : c'est la vessie qui découple les deux : sans elle, il faudrait perdre l'urine en continu, goutte à goutte : l'évolution a inventé le réservoir pour la vie sociale !</div>"},
{"t": "La puberté et les organes reproducteurs (4e)", "q": "La puberté est déclenchée par :", "c": ["les gonades seules", "la croissance des os uniquement", "les règles elles-mêmes", "le cerveau (hypothalamus et hypophyse) qui stimule les gonades"], "a": 3, "e": "GnRH ⟶ FSH/LH ⟶ stimulation des ovaires/testicules : c'est le cerveau qui commande.", "d": "<b>Le cerveau</b> : la cascade de commande.<div class='ex-detail'><u>Exemple rédigé</u> : l'ordre des événements : ① hypothalamus (GnRH) ② hypophyse (FSH, LH) ③ gonades réveillées : hormones sexuelles + gamètes ④ effets visibles (pilosité, croissance, règles, mue de voix). Piège : « les gonades seules » : elles restent SILENCIEUSES tant que le cerveau ne leur envoie pas le signal : la puberté est un événement NEURO-hormonal, pas seulement sexuel.</div>"},
{"t": "La puberté et les organes reproducteurs (4e)", "q": "La fécondation a lieu dans :", "c": ["l'utérus", "la trompe (tube de Fallope)", "le vagin", "l'ovaire"], "a": 1, "e": "Le spermatozoïde rencontre l'ovule dans la trompe ; l'embryon descend ensuite se nider dans l'utérus.", "d": "<b>La trompe</b> : le lieu de la rencontre.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario : ovulation (J14) ⟶ l'ovule est capté par la trompe ⟶ fécondation dans la trompe (l'ovule n'atteint JAMAIS l'utérus s'il n'est pas fécondé : il y meurt) ⟶ l'embryon formé descend pendant ~5-7 jours ⟶ NIDATION dans la muqueuse utérine préparée. Piège : « l'utérus » : c'est le LIEU D'ACCUEIL de la grossesse, pas du rendez-vous : distinguer fécondation (trompe) et implantation (utérus) est LA question classique.</div>"},
{"t": "La puberté et les organes reproducteurs (4e)", "q": "Les règles correspondent à :", "c": ["la destruction de la muqueuse utérine non utilisée (fin de cycle)", "une infection mensuelle", "l'évacuation d'un ovule non fécondé uniquement", "le début de l'ovulation"], "a": 0, "e": "Sans fécondation, la muqueuse qui s'était épaissie se dégrade et s'évacue : le cycle repart.", "d": "<b>La fin d'un cycle</b> : le nid inutilisé s'évacue.<div class='ex-detail'><u>Exemple rédigé</u> : le décompte : muqueuse épaissie pendant 3 semaines (nidation prévue ~J21-25) : si aucun embryon ne s'implante, la progestérone s'effondre : la muqueuse se désagrège : règles J1 du cycle SUIVANT. Piège : « l'ovule non fécondé » : l'ovule est MICROSCOPIQUE (0,1 mm) : il est réabsorbé dans la trompe : les règles, c'est la MUQUEUSE (le sang est utérin, pas ovarien).</div>"},
{"t": "La puberté et les organes reproducteurs (4e)", "q": "Chez la fille, l'ovulation a lieu environ :", "c": ["le jour des règles", "n'importe quand", "7 jours après les règles", "14 jours avant les règles suivantes"], "a": 3, "e": "La 2e phase du cycle est fixe (~14 jours) : l'ovulation est à J14 d'un cycle de 28 jours.", "d": "<b>14 jours avant les règles suivantes</b> : la règle d'or du cycle.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi cette règle : après l'ovulation, la phase lutéale dure TOUJOURS ~14 jours (le corps jaune impose ce délai) : c'est la 1re phase qui varie ! Cycle de 35 jours : ovulation ~J21, pas J14 : les applications de suivi de cycle utilisent exactement cette règle. Piège : « J14 pour tous » : valable uniquement pour un cycle-référence de 28 jours.</div>"},
{"t": "La puberté et les organes reproducteurs (4e)", "q": "Les hormones sexuelles principales sont :", "c": ["insuline et glucagon", "FSH et GnRH uniquement", "œstrogènes et testostérone", "adrénaline et cortisol"], "a": 2, "e": "Œstrogènes/progestérone (ovaires) et testostérone (testicules) : elles créent les caractères secondaires.", "d": "<b>Œstrogènes et testostérone</b> : les hormones des gonades.<div class='ex-detail'><u>Exemple rédigé</u> : le classement : FSH/LH = hormones du CERVEAU (les ordres de marche) ; œstrogènes/testostérone = hormones des GONADES (les exécutants : pilosité, voix, muscles, seins, sperme) ; insuline = pancréas (glycémie) : ne pas mélanger les familles. Un détail qui compte : la testostérone est aussi produite en petite quantité chez la fille, et l'œstrogène chez le garçon : c'est la DOMINANCE qui fait la différence.</div>"},
{"t": "La puberté et les organes reproducteurs (4e)", "q": "Les caractères sexuels SECONDAIRES sont par exemple :", "c": ["les gamètes", "les chromosomes", "les testicules et les ovaires", "la pilosité, la mue de la voix, le développement des seins"], "a": 3, "e": "Ils apparaissent À LA PUBERTÉ (pilosité, seins, voix, morphologie) : les organes génitaux existent eux depuis la naissance.", "d": "<b>Pilosité, voix, seins</b> : ce qui apparaît à l'adolescence.<div class='ex-detail'><u>Exemple rédigé</u> : la distinction primaire/secondaire : PRIMAIRES = les organes reproducteurs eux-mêmes (présents dès la naissance, matures à la puberté) ; SECONDAIRES = les signes extérieurs qui distinguent les sexes adultes SANS être des organes génitaux (barbe, voix grave, hanches, poitrine) : ils sont induits par les hormones de la puberté : si l'on coupe la testostérone, la barbe cesse de pousser : la preuve que le secondaire est HORMONAL.</div>"},
{"t": "La puberté et les organes reproducteurs (4e)", "q": "Les ovules sont produits :", "c": ["chaque jour par milliers", "en continu après la puberté", "par les testicules", "dès la vie embryonnaire (stock limité) puis libérés un par cycle"], "a": 3, "e": "Le stock ovarien se constitue AVANT la naissance : ~1 million, dont ~400 libérés au cours de la vie.", "d": "<b>Un stock constitué avant la naissance</b> : la dot de la fille.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison : FEMME : le stock d'ovules est figé (méiose en pause) : à la naissance, tout est déjà là : la puberté ne fait que LIBÉRER un ovule par cycle : épuisement = ménopause. HOMME : production continue (~/s, toute la vie) : pas d'équivalent de la ménopause. Piège : « en continu » : c'est la version masculine : les deux systèmes sont FONDAMENTALEMENT asymétriques.</div>"},
{"t": "La puberté et les organes reproducteurs (4e)", "q": "Le pic de LH au milieu du cycle provoque :", "c": ["les règles", "la nidation", "la croissance de la barbe", "l'ovulation (libération de l'ovule)"], "a": 3, "e": "Le pic de LH fait rompre le follicule mûr : l'ovule est libéré.", "d": "<b>L'ovulation</b> : le déclencheur central du cycle.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : le follicule (cavité ovarienne contenant l'ovule) mûrit sous FSH : à maturité, il émet de l'œstrogène en masse : le cerveau réagit par un PIC DE LH (~36 h avant l'ovulation) : le follicule ROMPT : l'ovule part dans la trompe : le test d'ovulation (vente libre) détecte exactement ce pic de LH. Piège : « les règles » : elles surviennent QUATORZE JOURS APRÈS, si rien ne s'est implanté : ordre : pic LH ⟶ ovulation ⟶ (fécondation ?) ⟶ règles.</div>"},
{"t": "La puberté et les organes reproducteurs (4e)", "q": "La fenêtre fertile d'un cycle de 28 jours est environ :", "c": ["J10-J15 (autour de l'ovulation)", "tout le mois", "J20-J28", "J1-J5 (les règles)"], "a": 0, "e": "Ovule 24 h + spermatozoïdes 3-5 jours : rapports féconds possibles ~J10-J15.", "d": "<b>J10-J15</b> : l'ovulation à J14 ± 2.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul de la fenêtre : le spermatozoïde survit jusqu'à 5 jours DANS le corps de la femme, l'ovule ~24 h : rapports entre J10 et J15 peuvent aboutir (spermatozoïdes attendent l'ovule) : en dehors : l'ovule n'existe pas encore ou plus. Piège : « pendant les règles » : quasi-impossible (ovule absent) : la méthode « calendrier » est d'ailleurs peu fiable (cycles irréguliers) : les vraies méthodes de contraception reposent sur d'autres principes (voir le chapitre contraception).</div>"},
{"t": "La puberté et les organes reproducteurs (4e)", "q": "L'utérus sert à :", "c": ["accueillir et nourrir l'embryon pendant la grossesse", "produire les ovules", "stocker les hormones", "fabriquer les spermatozoïdes"], "a": 0, "e": "Sa muqueuse s'épaissit chaque cycle pour l'implantation, puis la grossesse s'y développe.", "d": "<b>Accueillir la grossesse</b> : la chambre de l'embryon.<div class='ex-detail'><u>Exemple rédigé</u> : la spécialisation : OVaires = production des ovules et des hormones du cycle ; TROMPES = carrefour de la fécondation ; UTÉRUS = le berceau (muqueuse nourricière puis placenta) ; VAGIN = voie de sortie : chaque organe a UN métier. Pendant 9 mois, le muscle utérin s'étire jusqu'à ×20, puis accouche par ses contractions : le même organe qui faisait « nid mensuel » devient une chambre climatisée puis une pompe d'expulsion.</div>"},
{"t": "La fécondation, la grossesse et le développement (4e)", "q": "La cellule-œuf contient :", "c": ["23 chromosomes", "92 chromosomes", "des chromosomes au hasard", "46 chromosomes (23 de chaque parent)"], "a": 3, "e": "Fusion des deux gamètes haploïdes (23) : 46 chromosomes, une paire de chaque gène.", "d": "<b>46 chromosomes</b> : le patrimoine complet.<div class='ex-detail'><u>Exemple rédigé</u> : l'addition : spermatozoïde 23 + ovule 23 = 46 (23 paires) : chaque gène existe en 2 versions (allèles), une de chaque parent (sauf chez le garçon pour les gènes portés par X/Y) : la fécondation restaure l'espèce humaine (46) après le passage par les gamètes (23). Piège : « 92 » : doubler encore : la cellule-œuf est DIPLOÏDE comme toutes les cellules du corps, pas plus.</div>"},
{"t": "La fécondation, la grossesse et le développement (4e)", "q": "Le sexe d'un enfant dépend :", "c": ["de l'alimentation", "de l'ovule", "du spermatozoïde (X ou Y)", "de la mère"], "a": 2, "e": "L'ovule apporte toujours un X : le spermatozoïde apporte X (fille) ou Y (garçon).", "d": "<b>Du spermatozoïde</b> : X + X = fille, X + Y = garçon.<div class='ex-detail'><u>Exemple rédigé</u> : la logique chromosomique : la mère est XX : ses ovules ne peuvent porter QUE X ; le père est XY : ses spermatozoïdes sont X ou Y à 50/50 : le tirage au sort se fait au moment de la fécondation : statistiquement, la probabilité est égale à chaque grossesse (les « familles de 5 garçons » : (1/2)⁵ ≈ 3 % : pas si rare !). Piège : toutes les croyances anciennes qui chargeaient la mère n'ont aucun fondement génétique.</div>"},
{"t": "La fécondation, la grossesse et le développement (4e)", "q": "La nidation, c'est :", "c": ["l'implantation de l'embryon dans la muqueuse utérine", "la première division", "l'ovulation", "la fusion des gamètes"], "a": 0, "e": "~7 jours après la fécondation : le blastocyste s'installe dans l'utérus : début de la grossesse.", "d": "<b>L'implantation utérine</b> : l'installation.<div class='ex-detail'><u>Exemple rédigé</u> : la frise : J14 : fécondation (TROMPE) ⟶ divisions pendant la descente ⟶ J21 : NIDATION (UTÉRUS) ⟶ J24-26 : HCG détectable (test de grossesse positif) : la grossesse « officielle » commence à la nidation, pas à la fécondation (une majorité des fécondations ne nichent jamais !). Piège : confondre fécondation et nidation : deux événements, deux lieux, une semaine d'écart : question de contrôle assurée.</div>"},
{"t": "La fécondation, la grossesse et le développement (4e)", "q": "Le placenta permet :", "c": ["la respiration du fœtus dans l'air", "les échanges (O₂, nutriments/déchets) SANS mélange des sangs", "le mélange du sang de la mère et du fœtus", "la digestion du fœtus"], "a": 1, "e": "Deux circulations séparées par une barrière d'échange : l'O₂ et les nutriments diffusent.", "d": "<b>Des échanges sans mélange</b> : la douane placentaire.<div class='ex-detail'><u>Exemple rédigé</u> : la structure : sang maternel (espaces lacunaires) et sang fœtal (capillaires du cordon) se frôlent sans jamais se toucher : ~15 m² de surface d'échange pour un bébé à terme : O₂ et glucose entrent, CO₂ et urée sortent. Si les sangs se mélangEAIENT (rare accident : hémorragie fœto-maternelle), le système immunitaire maternel attaquerait les globules rouges fœtaux : le NON-mélange est une condition de survie.</div>"},
{"t": "La fécondation, la grossesse et le développement (4e)", "q": "Les toutes premières divisions de la cellule-œuf :", "c": ["détruisent des cellules", "font grossir l'embryon", "augmentent le nombre de cellules sans changer la taille totale", "fabriquent le placenta directement"], "a": 2, "e": "1 ⟶ 2 ⟶ 4 ⟶ 8 : on découpe la même masse en cellules de plus en plus petites.", "d": "<b>Nombre ↑, taille constante</b> : le découpage.<div class='ex-detail'><u>Exemple rédigé</u> : l'image : un gâteau coupé en 2, 4, 16 parts : plus de parts, pas plus de gâteau : les premières divisions (toutes les 12-20 h) découpent sans synthèse nette : la masse reste ~celle de l'ovule (0,1 mm) : la croissance viendra APRÈS la nidation, avec la nutrition maternelle. Piège : « font grossir » : le blastocyste de 100 cellules est à peine plus gros que l'ovule initial : les débuts de la vie sont microscopiques.</div>"},
{"t": "La fécondation, la grossesse et le développement (4e)", "q": "L'alcool bu pendant la grossesse :", "c": ["est filtré entièrement par le placenta", "est sans effet", "ne passe que le 3e trimestre", "traverse le placenta et atteint le fœtus (risque de malformations)"], "a": 3, "e": "Le placenta ne filtre pas l'alcool : aucune quantité n'est prouvée sûre : zéro alcool pendant la grossesse.", "d": "<b>Traverse le placenta</b> : le filtre n'est pas un mur.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement de santé publique : l'alcool passe librement la barrière : le fœtus, sans foie mature, le subit à pleine dose, surtout pendant l'organogenèse (les 8 premières semaines, la construction des organes) : risque de troubles du développement (syndrome d'alcoolisation fœtale) : aucune dose sûre n'ayant été établie, la recommandation est ZÉRO : c'est l'exemple le plus net que le placenta laisse passer des molécules (nicotine, certains médicaments, virus aussi).</div>"},
{"t": "La fécondation, la grossesse et le développement (4e)", "q": "Le liquide amniotique sert à :", "c": ["remplacer le placenta", "nourrir le fœtus", "protéger le fœtus (amortissement des chocs, température constante)", "oxygéner le fœtus"], "a": 2, "e": "C'est un coussin liquide : les chocs et la température sont amortis ; la nutrition et l'O₂ viennent du placenta.", "d": "<b>Protéger</b> : la piscine du fœtus.<div class='ex-detail'><u>Exemple rédigé</u> : le rôle mécanique : le fœtus flotte dans ~800 mL à terme : les coups extérieurs sont répartis par le liquide (comme un emballage de bulles), la température reste stable, et les mouvements musculaires s'y font sans frottement : il permet même l'entraînement des muscles et des poumons (le fœtus « respire » le liquide). Piège : « nourrir » : la nutrition passe par le PLACENTA : le liquide amniotique est une ceinture de sécurité, pas un cordon d'approvisionnement.</div>"},
{"t": "La fécondation, la grossesse et le développement (4e)", "q": "Un seul spermatozoïde féconde l'ovule car :", "c": ["la membrane de l'ovule se modifie dès le premier contact (blocage des suivants)", "l'ovule choisit le plus rapide", "les autres meurent avant d'arriver", "le sperme n'en contient qu'un"], "a": 0, "e": "La fusion déclenche la « réaction membranaire » : la coque de l'ovule devient imperméable aux autres.", "d": "<b>Blocage dès le premier</b> : la réaction membranaire.<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe apparent : des centaines de millions partent, UN seul fusionne : dès que la tête du premier touche la membrane, l'ovule durcit instantanément sa zone pellucide (et des réactions chimiques écartent les autres) : l'unicité du spermatozoïde garantit 46 chromosomes PAS PLUS : si deux fusionnaient (rare accident : triploïdie), le développement échoue quasi toujours : le blocage est une garantie du caryotype.</div>"},
{"t": "La fécondation, la grossesse et le développement (4e)", "q": "À 8 semaines de développement, l'embryon devient :", "c": ["un placenta", "un ovule", "un fœtus (tous les organes sont ébauchés)", "un bébé"], "a": 2, "e": "L'organogenèse est achevée : on parle de fœtus : la suite est surtout croissance et maturation.", "d": "<b>Un fœtus</b> : le passage de témoin.<div class='ex-detail'><u>Exemple rédigé</u> : la frontière : embryon (jusqu'à 8 semaines) = la CONSTRUCTION : les organes se forment, chacun à sa place, à partir de cellules qui se spécialisent (différenciation) ; fœtus (après) = la CROISSANCE : les organes grossissent et mûrissent (les poumons mûrissent jusqu'à la fin !). Conséquence médicale : les 8 premières semaines sont les plus sensibles aux perturbateurs (virus, alcool, médicaments) : tout s'y joue avant même que la grossesse soit visible.</div>"},
{"t": "La fécondation, la grossesse et le développement (4e)", "q": "Le test de grossesse détecte :", "c": ["l'ovule dans les urines", "l'hormone HCG (sécrétée par l'embryon nidé)", "la testostérone", "les spermatozoïdes"], "a": 1, "e": "L'embryon implanté sécrète la HCG, qui passe dans le sang et les urines : le test devient positif.", "d": "<b>La HCG</b> : la signature de l'embryon.<div class='ex-detail'><u>Exemple rédigé</u> : la logique du test : la HCG (gonadotrophine chorionique) est produite par les cellules du blastocyste APRÈS la nidation, elle maintient le corps jaune (donc la progestérone, donc la muqueuse : pas de règles) : elle double toutes les 48 h : détectable dans les urines ~10 jours après la fécondation : c'est pour ça qu'un test trop tôt peut être négatif alors que la fécondation a eu lieu : l'hormone n'est pas encore assez concentrée.</div>"},
{"t": "La contraception, la sexualité et les IST (4e)", "q": "La pilule contraceptive empêche la grossesse en :", "c": ["bloquant l'ovulation (pas de pic de LH)", "bouchant les trompes", "tuant les spermatozoïdes", "détruisant la muqueuse"], "a": 0, "e": "Les hormones de la pilule maintiennent un taux constant : le pic de LH n'a pas lieu ⟹ pas d'ovule libéré.", "d": "<b>Bloque l'ovulation</b> : l'ordre hormonal inversé.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : la pilule apporte œstrogène + progestatif en continu : le cerveau croit que le cycle est déjà « en route » : il n'envoie pas le pic de LH : le follicule ne rompt pas : PAS D'OVULE : sans ovule, pas de fécondation possible. S'y ajoutent une muqueuse peu accueillante et une glaire infranchissable : triple sécurité. Piège : elle ne crée AUCUNE barrière contre les IST : le préservatif reste indispensable avec un partenaire non dépisté.</div>"},
