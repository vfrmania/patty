istoire et avenir","id":"climat-histoire"},{"t":"Les écosystèmes et l'espèce humaine","id":"ecosystemes-humanite"},{"t":"Le corps humain et l'homéostasie","id":"homeostasie-sante"}]}];
var COURS_META = [
  {
    "id": "biodiversite-6e",
    "theme": "La biodiversité et le vivant (6e)",
    "niveau": "6e",
    "titre": "La biodiversité et le vivant",
    "cours": "<div class=\"cours-head\"><h2>La biodiversité et le vivant</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce qu'un être vivant ?</h3>\n<ul>\n<li>Il <b>naît</b>, se <b>nourrit</b>, <b>respire</b>, <b>grandit</b>, se <b>reproduit</b> et <b>meurt</b> ;</li>\n<li>Il est constitué de <b>cellules</b> (unité du vivant) ;</li>\n<li>Il réagit à son <b>milieu</b> (sensibilité) et échange de la matière et de l'énergie avec lui.</li>\n</ul>\n<div class=\"tip\"><b>Les fonctions communes à tout vivant</b> : nutrition, respiration, reproduction, croissance. Une roche ou l'eau ne font rien de tout cela : elles ne sont pas vivantes.</div>\n\n<h3>2. Classer le vivant : les grands groupes</h3>\n<table>\n<tr><th>Groupe</th><th>Caractères</th><th>Exemples</th></tr>\n<tr><td><b>Animaux</b></td><td>se nourrissent d'autres êtres vivants, se déplacent souvent</td><td>chien, papillon, ver de terre</td></tr>\n<tr><td><b>Végétaux</b></td><td>fabriquent leur matière organique par photosynthèse</td><td>chêne, fougère, mousse</td></tr>\n<tr><td><b>Champignons</b></td><td>absorbent leur nourriture, ni photosynthèse ni déplacement</td><td>champignon de Paris, levure</td></tr>\n</table>\n<p>À l'intérieur des animaux, on distingue les <b>vertébrés</b> (squelette interne avec colonne vertébrale : mammifères, oiseaux, reptiles, amphibiens, poissons) des <b>invertébrés</b> (insectes, mollusques, vers, arachnides).</p>\n\n<h3>3. La biodiversité : la variété du vivant</h3>\n<ul>\n<li><b>Biodiversité</b> = variété des <b>espèces</b> (diversité interspécifique) + variété <b>au sein d'une même espèce</b> (diversité intraspécifique, comme les races de chiens) + variété des <b>milieux</b> (écosystèmes) ;</li>\n<li>Elle se mesure notamment par le <b>nombre d'espèces</b> d'un milieu (richesse spécifique) ;</li>\n<li>Elle est <b>menacée</b> : déforestation, pollution, urbanisation, chasse, introduction d'espèces envahissantes.</li>\n</ul>\n<div class=\"warn\"><b>Attention :</b> une forêt plantée d'une seule essence d'arbre n'est pas un milieu très riche en biodiversité, même si elle contient des milliers d'individus — c'est le <b>nombre d'espèces</b> qui compte, pas le nombre d'individus.</div>\n\n<h3>4. Pourquoi protéger la biodiversité ?</h3>\n<ul>\n<li>Chaque espèce a un <b>rôle</b> dans son écosystème (pollinisation, décomposition, chaîne alimentaire) ;</li>\n<li>Elle fournit des <b>ressources</b> : nourriture, médicaments, matériaux ;</li>\n<li>Moyens de protection : <b>réserves naturelles</b>, <b>parcs nationaux</b>, <b>trames vertes</b>, <b>listes rouges</b> des espèces menacées (UICN).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — comparer la biodiversité de deux milieux</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans une haie champêtre, on compte 12 espèces d'oiseaux sur 40 individus. Dans un champ de maïs, 2 espèces sur 300 individus. Quel milieu est le plus riche en biodiversité ? Pourquoi ?</div><div class=\"etu\"><b>Étape 1 — Comparer la richesse spécifique</b> : 12 espèces contre 2 → la haie est plus riche.</div><div class=\"etu\"><b>Étape 2 — Ne pas se laisser piéger par le nombre d'individus</b> : 300 individus mais tous pareils = faible diversité.</div><div class=\"etu\"><b>Étape 3 — Expliquer</b> : la haie offre abris, nourriture variée et corridors ; le champ monoculture offre peu de niches écologiques.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la biodiversité se mesure par la variété (espèces), pas par l'abondance (individus).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Classer les champignons parmi les végétaux : faux, ce sont un <b>règne à part</b> (pas de photosynthèse).</li>\n<li>Confondre <b>richesse spécifique</b> (nombre d'espèces) et <b>abondance</b> (nombre d'individus).</li>\n<li>« Un être vivant immobile est forcément un végétal » : non — corail, éponge, champignon.</li>\n<li>Oublier que la biodiversité inclut aussi la <b>diversité génétique</b> au sein d'une espèce.</li>\n<li>« La disparition d'une espèce n'a pas d'effet » : si — chaque maillon déstabilise la chaîne alimentaire et les fonctions de l'écosystème.</li>\n</ul>\n</div>"

    "id": "digestion",
    "theme": "La digestion et les nutriments (5e)",
    "niveau": "5e",
    "titre": "La digestion et les nutriments",
    "cours": "<div class=\"cours-head\"><h2>La digestion et les nutriments</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Pourquoi se nourrir ?</h3>\n<ul>\n<li>Les aliments apportent l'<b>énergie</b> et les <b>matériaux</b> nécessaires à la croissance, à l'entretien et au fonctionnement du corps ;</li>\n<li>Nutriments essentiels : <b>glucides</b> (énergie), <b>lipides</b> (réserves, membranes), <b>protéines</b> (construction), vitamines, eau, sels minéraux.</li>\n</ul>\n\n<h3>2. Le trajet des aliments : le tube digestif</h3>\n<table>\n<tr><th>Organe</th><th>Rôle</th></tr>\n<tr><td><b>Bouche</b></td><td>mastication, salive (début digestion de l'amidon)</td></tr>\n<tr><td><b>Œsophage</b></td><td>transport par contractions (péristaltisme)</td></tr>\n<tr><td><b>Estomac</b></td><td>brassage, suc gastrique acide (début digestion des protéines)</td></tr>\n<tr><td><b>Intestin grêle</b></td><td>digestion terminale + <b>absorption des nutriments</b></td></tr>\n<tr><td><b>Gros intestin (côlon)</b></td><td>résorption de l'eau, formation des selles</td></tr>\n</table>\n\n<h3>3. La digestion : transformer les aliments en nutriments</h3>\n<ul>\n<li>Les aliments (pain, viande) sont des <b>molécules complexes</b> trop grosses pour traverser la paroi intestinale ;</li>\n<li>La digestion = <b>découpe</b> de ces molécules en <b>nutriments</b> simples (glucose, acides aminés, acides gras) ;</li>\n<li>La découpe se fait par les <b>enzymes digestives</b> (amylase, protéases, lipases) contenues dans les sucs digestifs ;</li>\n<li>Chaque enzyme est <b>spécifique</b> : l'amylase ne coupe que l'amidon, la protéase ne coupe que les protéines.</li>\n</ul>\n<div class=\"formule\">Amidon --amylase--&gt; glucose · Protéines --protéases--&gt; acides aminés · Lipides --lipases--&gt; acides gras + glycérol</div>\n\n<h3>4. L'absorption intestinale</h3>\n<ul>\n<li>Les nutriments traversent la paroi de l'intestin grêle et passent dans le <b>sang</b> ;</li>\n<li>La paroi intestinale est <b>plissée</b> et tapissée de <b>villosités</b> : une immense surface d'échange (≈ 200 m²) ;</li>\n<li>Le sang distribue ensuite les nutriments à <b>tous les organes</b> (les cellules les utilisent pour produire de l'énergie ou se construire).</li>\n</ul>\n<div class=\"tip\"><b>Expérience-clé</b> : l'eau iodée devient bleu-noir en présence d'amidon. Sur un tube à essai d'eau + amylase : après un temps de réaction, plus de coloration → l'amidon a été découpé en glucose. C'est la preuve expérimentale de la digestion.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — interpréter un test à l'eau iodée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On mélange de l'eau + amidon dans 2 tubes. Au tube A, on ajoute de l'amylase ; au tube B rien. Après 30 min à 37 °C, l'eau iodée colore le tube B en bleu-noir mais pas le tube A. Conclusion ?</div><div class=\"etu\"><b>Étape 1 — Rappeler le test</b> : coloration bleu-noir = présence d'<b>amidon</b>.</div><div class=\"etu\"><b>Étape 2 — Lire les résultats</b> : B contient encore de l'amidon (rien ne l'a transformé) ; A n'en contient plus.</div><div class=\"etu\"><b>Étape 3 — Expliquer</b> : l'amylase (enzyme) a découpé l'amidon en glucose — nutriment absorbable.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : la digestion est une <b>transformation chimique</b> enzymatique — le rôle des sucs digestifs est expérimentalement démontré.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre <b>aliments</b> (complexes, dans le tube digestif) et <b>nutriments</b> (simples, dans le sang).</li>\n<li>La digestion n'est pas qu'un « broyage » mécanique : c'est d'abord une <b>réaction chimique</b> enzymatique.</li>\n<li>« L'estomac digère tout » : non — la plus grande part de la digestion et <b>toute</b> l'absorption ont lieu dans l'<b>intestin grêle</b>.</li>\n<li>Le rôle de 37 °C dans les expériences : température du corps = optimum des enzymes ; trop froid, la réaction ralentit.</li>\n<li>Les nutriments ne « nourrissent » pas directement les organes : ils passent d'abord <b>dans le sang</b>.</li>\n</ul>\n</div>"
  },

    "id": "respiration",
    "theme": "La respiration et les échanges gazeux (5e)",
    "niveau": "5e",
    "titre": "La respiration et les échanges gazeux",
    "cours": "<div class=\"cours-head\"><h2>La respiration et les échanges gazeux</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Respiration : une histoire de gaz</h3>\n<ul>\n<li>Toutes nos cellules <b>consomment du dioxygène (O₂)</b> et <b>rejettent du dioxyde de carbone (CO₂)</b> pour produire de l'énergie ;</li>\n<li>Les organes <b>échangeurs</b> prélèvent l'O₂ du milieu et y rejettent le CO₂ : les <b>poumons</b> chez l'homme, les <b>branchies</b> chez le poisson, la <b>peau</b> (humide) chez le ver de terre, les <b>trachées</b> chez l'insecte.</li>\n</ul>\n\n<h3>2. Le trajet de l'air</h3>\n<table>\n<tr><th>Étape</th><th>Structure</th><th>Rôle</th></tr>\n<tr><td>1</td><td>nez / bouche, trachée</td><td>filtrage, réchauffement, humidification</td></tr>\n<tr><td>2</td><td>bronches, bronchioles</td><td>conduction de l'air</td></tr>\n<tr><td>3</td><td><b>alvéoles pulmonaires</b></td><td>échanges gazeux avec le sang</td></tr>\n</table>\n<div class=\"tip\"><b>Le poumon : une éponge</b> ≈ 300 millions d'alvéoles, soit ≈ 100 m² de surface d'échange — l'équivalent d'un appartement ! Parois ultra-fines (0,5 µm) et entourées de capillaires : O₂ et CO₂ traversent en un clin d'œil.</div>\n\n<h3>3. Ventilation pulmonaire</h3>\n<ul>\n<li><b>Inspiration</b> : le diaphragme descend, les côtes se soulèvent → le volume de la cage augmente → l'air entre (pompe aspirante) ;</li>\n<li><b>Expiration</b> : relâchement → volume plus petit → l'air sort ;</li>\n<li>Le poumon <b>ne se remplit pas activement</b> : c'est le mouvement de la cage thoracique qui fait entrer/sortir l'air.</li>\n</ul>\n\n<h3>4. Les échanges au niveau des alvéoles</h3>\n<ul>\n<li>L'air inspiré : riche en O₂, pauvre en CO₂ ; l'air expiré : appauvri en O₂, enrichi en CO₂ ;</li>\n<li>Dans les capillaires des alvéoles : le sang se <b>charge en O₂</b> et se <b>décharge en CO₂</b> ;</li>\n<li>Les chiffres-clés : air inspiré ≈ 21 % O₂ / 0,04 % CO₂ ; air expiré ≈ 16 % O₂ / 4 % CO₂.</li>\n</ul>\n<div class=\"warn\"><b>Attention :</b> la ventilation (mouvement d'air) n'est pas la <b>respiration cellulaire</b> (production d'énergie dans les cellules). La première alimente la seconde : ce sont deux niveaux différents, souvent confondus.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser l'air expiré</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On souffle dans de l'eau de chaux : elle se trouble. On place un sac respiratoire devant la bouche d'un sujet au repos, puis après un sprint : le trouble est plus rapide après l'effort. Interprétez.</div><div class=\"etu\"><b>Étape 1 — Eau de chaux troublée</b> = présence de <b>CO₂</b> dans l'air expiré (preuve du rejet).</div><div class=\"etu\"><b>Étape 2 — Après l'effort</b> : trouble plus rapide → l'air expiré contient <b>plus de CO₂</b> : les muscles consomment plus d'O₂ et rejettent plus de CO₂.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : la quantité de CO₂ expiré reflète l'activité métabolique : au repos, les échanges gazeux sont plus faibles.</div><div class=\"etu\"><b>Étape 4 — En déduire</b> : le système ventilatoire adapte son rythme (respiration rapide après un sprint) pour compenser la demande des cellules.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le poumon aspire l'air » : non — c'est le diaphragme et les côtes qui créent le flux.</li>\n<li>« L'air expiré est du CO₂ pur » : non — il contient encore 16 % d'O₂ (l'organisme n'utilise pas tout).</li>\n<li>Confondre <b>branchies</b> et <b>poumons</b> : le poisson respire l'O₂ <b>dissous dans l'eau</b>.</li>\n<li>« On respire pour vider le CO₂ » : les deux à la fois — prélever O₂ <b>et</b> rejeter CO₂.</li>\n<li>« Le ver de terre ne respire pas » : il respire par la <b>peau</b> (cutanée), d'où l'obligation d'humidité.</li>\n</ul>\n</div>"
  },

    "id": "circulation-sanguine",
    "theme": "La circulation sanguine (5e)",
    "niveau": "5e",
    "titre": "La circulation sanguine",
    "cours": "<div class=\"cours-head\"><h2>La circulation sanguine</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le sang : liquide de transport</h3>\n<ul>\n<li>Le <b>sang</b> transporte les <b>nutriments</b>, le <b>dioxygène</b>, les <b>déchets</b> (CO₂, urée), les hormones ;</li>\n<li>Il circule dans un réseau fermé : le <b>cœur</b> pompe, les <b>artères</b> éloignent du cœur, les <b>veines</b> y ramènent, les <b>capillaires</b> desservent les organes.</li>\n</ul>\n<div class=\"tip\"><b>Mnémo</b> : les <b>A</b>rtères partent du cœur (A comme Away), les <b>V</b>eines y <b>V</b>iennent. Artère = sang « sortant », veine = sang « revenant » — peu importe l'oxygénation !</div>\n\n<h3>2. Le cœur : une double pompe</h3>\n<ul>\n<li><b>Oreillettes</b> (reçoivent) → <b>ventricules</b> (éjectent) ;</li>\n<li><b>Cœur gauche</b> : pompe le sang oxygéné vers tout le corps (circulation <b>grande</b>) ;</li>\n<li><b>Cœur droit</b> : pompe le sang appauvri vers les poumons (circulation <b>petite</b>) ;</li>\n<li>Le sang traverse le cœur <b>une fois par tour</b> : la circulation est dite « double ».</li>\n</ul>\n\n<h3>3. Le trajet du sang (à savoir refaire de mémoire)</h3>\n<ol>\n<li>Organes → <b>veines caves</b> → oreillette droite → ventricule droit ;</li>\n<li>Ventricule droit → <b>artère pulmonaire</b> → poumons (le sang se charge en O₂) ;</li>\n<li>Poumons → <b>veines pulmonaires</b> → oreillette gauche → ventricule gauche ;</li>\n<li>Ventricule gauche → <b>aorte</b> → artères → organes.</li>\n</ol>\n<div class=\"warn\"><b>Le piège du chapitre :</b> l'artère pulmonaire transporte du sang <b>pauvre en O₂</b>, et la veine pulmonaire du sang <b>riche en O₂</b> — c'est l'exception qui démontre que artère/veine se définissent par la <b>direction</b> (par rapport au cœur), pas par le gaz transporté.</div>\n\n<h3>4. Échanges au niveau des organes</h3>\n<ul>\n<li>Dans chaque organe, les <b>capillaires</b> sont le lieu d'échange : le sang abandonne O₂ et nutriments, récupère CO₂ et déchets ;</li>\n<li>Au niveau des <b>alvéoles</b>, c'est l'inverse pour les gaz : le sang se charge en O₂, perd son CO₂.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — suivre une goutte de sang</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une goutte de sang se trouve dans le ventricule gauche. Décrivez son trajet jusqu'au rein, puis son retour au ventricule gauche.</div><div class=\"etu\"><b>Étape 1 — Départ ventricule gauche</b> → aorte → artère rénale → capillaires du rein.</div><div class=\"etu\"><b>Étape 2 — Dans le rein</b> : le sang se décharge de déchets (urée) ; il est appauvri en O₂, enrichi en CO₂.</div><div class=\"etu\"><b>Étape 3 — Retour</b> : veine rénale → veine cave → oreillette droite → ventricule droit → artère pulmonaire → poumons (recharge en O₂).</div><div class=\"etu\"><b>Étape 4 — Boucler</b> : veines pulmonaires → oreillette gauche → ventricule gauche : le tour est complet (circulation double).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Toutes les artères transportent du sang riche en O₂ » : faux — l'artère pulmonaire transporte du sang pauvre.</li>\n<li>« La circulation se fait de la même façon partout » : le sang traverse <b>deux</b> réseaux en série (poumons puis corps).</li>\n<li>« Le cœur est un organe plein » : il a <b>4 cavités</b> avec des valvules qui empêchent le reflux.</li>\n<li>« Les capillaires ne servent qu'aux poumons » : ils sont le lieu d'échange <b>dans tous les organes</b>.</li>\n<li>« Le sang revenant du rein est propre à nouveau » : non, il est <b>nettoyé des déchets</b> mais encore pauvre en O₂ — les fonctions (reins, poumons) sont complémentaires.</li>\n</ul>\n</div>"
  },

    "id": "reins-excretion",
    "theme": "Les reins et l'élimination des déchets (5e)",
    "niveau": "5e",
    "titre": "Les reins et l'élimination des déchets",
    "cours": "<div class=\"cours-head\"><h2>Les reins et l'élimination des déchets</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Pourquoi éliminer des déchets ?</h3>\n<ul>\n<li>Le fonctionnement des cellules produit des <b>déchets</b> : CO₂ (éliminé par les poumons) et <b>urée</b> (issu de l'utilisation des protéines) ;</li>\n<li>Accumulés dans le sang, ces déchets deviennent <b>toxiques</b> : l'organisme doit les éliminer — c'est le rôle des <b>reins</b>.</li>\n</ul>\n\n<h3>2. Le rein : un filtre biologique</h3>\n<ul>\n<li>Chaque rein contient environ <b>1 million de néphrons</b> (unités de filtration) ;</li>\n<li>Étapes : <b>filtration</b> du sang (l'eau, les déchets et les nutriments passent) → <b>récupération</b> (réabsorption de l'eau, du glucose et des sels utiles) → <b>urine</b> (eau + urée + sels en excès) ;</li>\n<li>L'urine s'écoule par les <b>uretères</b> vers la <b>vessie</b>, puis est expulsée par l'<b>urètre</b>.</li>\n</ul>\n<div class=\"tip\"><b>Comparaison parlante</b> : le rein fonctionne comme une station d'épuration — il filtre tout, récupère l'utile et rejette le toxique dans l'urine. ≈ 180 L de sang filtrés chaque jour, 1,5 L d'urine produite : les reins recyclent 98 % de l'eau filtrée.</div>\n\n<h3>3. Comparer sang et urine : la preuve de la fonction</h3>\n<table>\n<tr><th>Substance</th><th>Dans le sang</th><th>Dans l'urine</th><th>Interprétation</th></tr>\n<tr><td>Urée</td><td>présente (faible)</td><td><b>très concentrée</b></td><td>déchet éliminé</td></tr>\n<tr><td>Glucose</td><td>présent</td><td><b>absent</b> (sain)</td><td>nutriment récupéré</td></tr>\n<tr><td>Eau</td><td>présente</td><td>présente</td><td>équilibre hydrique régulé</td></tr>\n</table>\n<div class=\"warn\"><b>Glucose dans l'urine = alerte</b> : chez une personne saine, tout le glucose est réabsorbé. Sa présence dans l'urine (comme dans le diabète non contrôlé) signale un dysfonctionnement — c'est un exemple de diagnostic par analyse d'urine.</div>\n\n<h3>4. Les autres organes d'élimination</h3>\n<ul>\n<li><b>Poumons</b> : CO₂ et vapeur d'eau ;</li>\n<li><b>Peau</b> (sueur) : eau et sels minéraux — refroidissement du corps ;</li>\n<li><b>Foie</b> : transforme certains toxiques avant que les reins ne les éliminent.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — interpréter une analyse d'urine</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une analyse d'urine révèle : glucose présent, protéines présentes. Le patient a-t-il un fonctionnement rénal normal ?</div><div class=\"etu\"><b>Étape 1 — Glucose</b> : normalement <b>réabsorbé</b> → sa présence anormale (hyperglycémie probable : diabète).</div><div class=\"etu\"><b>Étape 2 — Protéines</b> : trop grosses pour être filtrées → leur présence signe une <b>atteinte de la filtration</b> (syndrome néphrotique, infection).</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : non, deux marqueurs anormaux — un bilan sanguin complètera (glycémie, créatinine).</div><div class=\"etu\"><b>Étape 4 — Relier structure et fonction</b> : l'urine « anormale » renseigne sur la <b>santé du filtre rénal</b> et sur la composition du sang.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le rein filtre seulement les déchets » : non, il <b>réabsorbe</b> aussi l'essentiel (eau, glucose, sels) — sinon on mourrait de déshydratation.</li>\n<li>Confondre <b>urètre</b> (conduit d'expulsion) et <b>uretère</b> (rein → vessie).</li>\n<li>« L'urée est inutile » : elle est le déchet de l'utilisation des protéines — toxique si elle s'accumule.</li>\n<li>« La sueur élimine les déchets comme les reins » : la sueur évacue surtout eau et sels (rôle thermique), pas l'urée en quantité.</li>\n<li>« Boire moins économise les reins » : au contraire, une bonne hydratation facilite la filtration.</li>\n</ul>\n</div>"
  },

    "id": "puberte-reproduction",
    "theme": "La puberté et les organes reproducteurs (4e)",
    "niveau": "4e",
    "titre": "La puberté et les organes reproducteurs",
    "cours": "<div class=\"cours-head\"><h2>La puberté et les organes reproducteurs</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La puberté : le corps change</h3>\n<ul>\n<li>La puberté est la période (≈ 10-15 ans) où l'organisme devient <b>capable de se reproduire</b> ;</li>\n<li>Elle est déclenchée par une activation cérébrale : l'<b>hypothalamus</b> commande l'hypophyse, qui libère des hormones stimulant les <b>gonades</b> (testicules, ovaires) ;</li>\n<li>Les gonades produisent alors les <b>hormones sexuelles</b> : testostérone (garçons), œstrogènes et progestérone (filles).</li>\n</ul>\n<table>\n<tr><th>Caractères</th><th>Fille</th><th>Garçon</th></tr>\n<tr><td><b>Primaires</b> (organes reproducteurs)</td><td>premières règles, maturation des ovaires</td><td>premières émissions de spermatozoïdes</td></tr>\n<tr><td><b>Secondaires</b> (signes visibles)</td><td>développement des seins, pilosité, élargissement des hanches</td><td>mue de la voix, pilosité, musculature</td></tr>\n</table>\n\n<h3>2. Les organes reproducteurs féminins</h3>\n<ul>\n<li><b>Ovaires</b> : produisent les <b>ovules</b> (un par cycle) et les hormones ;</li>\n<li><b>Trompes de Fallope</b> : conduites où a lieu la fécondation ;</li>\n<li><b>Utérus</b> : héberge l'embryon ; sa paroi (endomètre) s'épaissit chaque cycle en préparation ;</li>\n<li><b>Vagin</b> : conduit de sortie (règles, accouchement) et lieu du rapport sexuel.</li>\n</ul>\n\n<h3>3. Les organes reproducteurs masculins</h3>\n<ul>\n<li><b>Testicules</b> : produisent les <b>spermatozoïdes</b> (en continu, des millions par jour) et la testostérone ;</li>\n<li><b>Épididyme</b> : stockage et maturation des spermatozoïdes ;</li>\n<li><b>Canaux déférents</b> puis <b>urètre</b> : trajet du sperme ;</li>\n<li><b>Vésicules séminales, prostate</b> : produisent le liquide séminal (le sperme = spermatozoïdes + liquide séminal).</li>\n</ul>\n<div class=\"tip\"><b>Rôle des hormones</b> : la puberté est une <b>cascade hormonale</b> — cerveau (hypothalamus → hypophyse) → gonades → caractères sexuels. Retenir cette chaîne, elle structure tout le chapitre.</div>\n\n<h3>4. Chacun son rythme</h3>\n<ul>\n<li>L'âge de la puberté <b>varie</b> selon les individus (hérédité, nutrition, mode de vie) : aucune inquiétude si l'on est « en avance » ou « en retard » ;</li>\n<li>Les changements s'accompagnent de bouleversements (croissance rapide, peau, émotions) : c'est <b>normal</b> et transitoire.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — expliquer un caractère pubertaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi la voix d'un garçon mue-t-elle à la puberté ?</div><div class=\"etu\"><b>Étape 1 — Chercher la cause hormonale</b> : les testicules produisent la <b>testostérone</b> dès la puberté.</div><div class=\"etu\"><b>Étape 2 — Relier à l'effet</b> : la testostérone provoque la croissance du larynx et l'épaississement des cordes vocales.</div><div class=\"etu\"><b>Étape 3 — Expliquer le son</b> : des cordes vocales plus longues et épaisses vibrent plus lentement → voix plus grave (comme une corde de guitare plus longue).</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : tout caractère sexuel secondaire découle de l'action d'une <b>hormone sexuelle</b> sur des cellules cibles.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre <b>caractères sexuels primaires</b> (organes/gamètes) et <b>secondaires</b> (signes visibles).</li>\n<li>« Les hormones sont fabriquées par les gonades seules » : la commande vient du <b>cerveau</b> (hypothalamus-hypophyse).</li>\n<li>« Un seul ovule est produit par rapport sexuel » : un ovule par <b>cycle</b>, indépendamment du rapport.</li>\n<li>Sperme ≠ spermatozoïdes : le sperme est le <b>mélange</b> (gamètes + liquide séminal).</li>\n<li>« La puberté arrive à un âge fixe » : non, la variabilité est grande et normale.</li>\n</ul>\n</div>"
  },
  {
    "id": "fecondation-grossesse",
    "theme": "La fécondation, la grossesse et le développement (4e)",
    "niveau": "4e",
    "titre": "La fécondation, la grossesse et le développement",
    "cours": "<div class=\"cours-head\"><h2>La fécondation, la grossesse et le développement</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Fécondation : la rencontre des gamètes</h3>\n<ul>\n<li>Après un rapport sexuel, les spermatozoïdes remontent du vagin vers les <b>trompes</b> ;</li>\n<li>Si un ovule y est présent, un <b>seul</b> spermatozoïde le pénètre : c'est la <b>fécondation</b> ;</li>\n<li>Fusion des noyaux → <b>cellule-œuf</b> (zygote), première cellule du nouvel individu ;</li>\n<li>La fécondation a lieu dans la <b>trompe</b>, pas dans l'utérus.</li>\n</ul>\n\n<h3>2. De la cellule-œuf à l'embryon</h3>\n<ol>\n<li><b>Divisions</b> : la cellule-œuf se divise (2, 4, 8... cellules) en descendant la trompe ;</li>\n<li><b>Nidation</b> : la petite boule de cellules s'implante dans l'endomètre de l'utérus (≈ 6-7 jours après la fécondation) ;</li>\n<li><b>Embryon</b> : les cellules se spécialisent (nerveuses, musculaires...) — c'est l'embryon jusqu'à 2 mois, puis on parle de <b>fœtus</b> ;</li>\n<li>Le <b>cordon ombilical</b> et le <b>placenta</b> se mettent en place : le placenta assure les échanges (O₂, nutriments ↔ déchets) entre la mère et le fœtus, <b>sans mélanger les sangs</b>.</li>\n</ol>\n<div class=\"tip\"><b>Retenir la chronologie</b> : rapport → fécondation (trompe) → divisions → nidation (utérus) → embryon (2 mois) → fœtus → naissance ≈ 9 mois (38 semaines). Les premiers mois sont les plus critiques pour la formation des organes.</div>\n\n<h3>3. Le rôle du placenta</h3>\n<ul>\n<li>Apporte au fœtus <b>O₂ et nutriments</b>, évacue ses <b>déchets</b> ;</li>\n<li>Barrière <b>partielle</b> : certaines substances passent (alcool, nicotine, certains virus et médicaments) — d'où les précautions de grossesse ;</li>\n<li>Sécrète des hormones qui maintiennent la grossesse (HCG, progestérone).</li>\n</ul>\n<div class=\"warn\"><b>Attention :</b> le sang de la mère et celui du fœtus ne se <b>mélangent jamais</b> : les échanges se font par diffusion à travers le placenta. Le fœtus ne « respire pas » dans le liquide amniotique : ses poumons ne fonctionnent qu'à la naissance.</div>\n\n<h3>4. Naissance et premiers jours</h3>\n<ul>\n<li>Les contractions de l'utérus (déclenchées par des hormones, dont l'ocytocine) expulsent le bébé ;</li>\n<li>Première respiration autonome à la naissance ;</li>\n<li><b>Allaitement</b> : le lait maternel apporte nutriments et <b>anticorps</b> (immunité transmise) — le nouveau-né est entièrement dépendant des adultes.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — dater les événements d'un début de grossesse</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un rapport a lieu le jour J. Sachant que l'ovulation a eu lieu à J+1 et que la nidation réussit à J+7, situez fécondation, divisions et nidation.</div><div class=\"etu\"><b>Étape 1 — Fécondation</b> : l'ovule ne vit que ≈ 24 h ; spermatozoïdes viables ≈ 3-5 jours → fécondation vers <b>J+1</b> dans la trompe.</div><div class=\"etu\"><b>Étape 2 — Divisions</b> : de J+1 à J+7, pendant la descente de la trompe vers l'utérus.</div><div class=\"etu\"><b>Étape 3 — Nidation</b> : à <b>J+7</b>, dans l'endomètre qui s'est épaissi sous l'effet de la progestérone.</div><div class=\"etu\"><b>Étape 4 — Conséquence</b> : le test de grossesse (HCG) ne devient positif qu'<b>après</b> la nidation, quand le placenta naissant sécrète l'hormone.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La fécondation a lieu dans l'utérus » : non — dans la <b>trompe</b>.</li>\n<li>« Le placenta mélange les sangs » : non — échanges par diffusion, barrière partielle.</li>\n<li>« L'embryon respire par le cordon » : le cordon <b>conduit</b> ; ce sont les échanges placentaires qui fournissent l'O₂.</li>\n<li>« Deux spermatozoïdes peuvent féconder » : un seul ; sinon (rare) grossesse gémellaire dizygote issue de <b>deux ovules</b>.</li>\n<li>Embryon (jusqu'à 2 mois) ≠ fœtus (après).</li>\n</ul>\n</div>"
  },

    "id": "contraception-ist",
    "theme": "La contraception, la sexualité et les IST (4e)",
    "niveau": "4e",
    "titre": "La contraception, la sexualité et les IST",
    "cours": "<div class=\"cours-head\"><h2>La contraception, la sexualité et les IST</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Contraception : empêcher la fécondation ou la nidation</h3>\n<table>\n<tr><th>Moyen</th><th>Mécanisme</th><th>Efficacité contre les IST ?</th></tr>\n<tr><td><b>Préservatif</b> (masculin/féminin)</td><td>barrière physique</td><td>✔️ <b>oui — le seul double protection</b></td></tr>\n<tr><td><b>Pilule (hormonale)</b></td><td>bloque l'ovulation</td><td>❌ non</td></tr>\n<tr><td><b>DIU/implant</b></td><td>modifie l'endomètre / hormones locales</td><td>❌ non</td></tr>\n</table>\n<div class=\"tip\"><b>Le message-clé</b> : la pilule protège d'une grossesse, <b>pas</b> des infections. Seul le préservatif protège des deux : c'est pourquoi on l'impose au début d'une relation et en cas de partenaire multiple ou non testé.</div>\n\n<h3>2. Contraception d'urgence</h3>\n<ul>\n<li>Après un rapport non ou mal protégé (≤ 3-5 jours selon le produit) : <b>contraception d'urgence</b> (Lévonelle ≤ 3 j, EllaOne ≤ 5 j) ;</li>\n<li>Elle <b>retarde l'ovulation</b> — plus efficace si prise tôt ; elle n'interrompt pas une grossesse commencée (ce n'est pas un avortement) ;</li>\n<li>Gratuite en pharmacie pour les mineures, sans ordonnance pour la majorité.</li>\n</ul>\n\n<h3>3. IST : infections sexuellement transmissibles</h3>\n<table>\n<tr><th>IST</th><th>Symptômes possibles</th><th>Conséquences sans traitement</th></tr>\n<tr><td><b>Chlamydia</b></td><td>souvent <b>aucun</b></td><td>stérilité</td></tr>\n<tr><td><b>Gonorrhée</b></td><td>brûlures, écoulements</td><td>stérilité</td></tr>\n<tr><td><b>Herpès</b></td><td>vésicules douloureuses récidivantes</td><td>poussées à vie (incurable)</td></tr>\n<tr><td><b>VIH/SIDA</b></td><td>grippe, puis rien pendant des années</td><td>défaut immunitaire (traitement à vie)</td></tr>\n<tr><td><b>Hépatite B</b></td><td>fatigue, ictère (parfois silencieuse)</td><td>maladie chronique du foie (vaccin !)</td></tr>\n</table>\n<div class=\"warn\"><b>Attention :</b> une IST peut être transmise <b>sans symptôme</b> — c'est le cas de la majorité des chlamydioses, notamment chez les jeunes filles. D'où l'importance du <b>dépistage</b> régulier et du traitement du/de la partenaire.</div>\n\n<h3>4. Prévention et dépistage</h3>\n<ul>\n<li><b>Préservatif systématique</b> au début et avec tout nouveau partenaire ;</li>\n<li><b>Dépistage</b> : gratuit et anonyme (CeGGID, planning familial) au moindre doute et après tout rapport à risque ;</li>\n<li><b>Vaccination</b> : hépatite B (obligatoire), HPV (recommandée dès 11-14 ans, filles et garçons) ;</li>\n<li><b>Trousses de prévention</b> dans les lycées et CROUS.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser une situation à risque</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Léa, sous pilule, a eu un rapport sans préservatif avec un nouveau partenaire dont elle ignore l'état de santé. Quels sont les risques et les bons réflexes ?</div><div class=\"etu\"><b>Étape 1 — Identifier les risques</b> : pas de risque de grossesse (pilule bien prise), mais risque d'<b>IST</b> (chlamydia, VIH, hépatite B...).</div><div class=\"etu\"><b>Étape 2 — Réflexe immédiat</b> : rendez-vous au CeGGID ou chez le médecin pour un <b>dépistage</b> ; en parler au partenaire.</div><div class=\"etu\"><b>Étape 3 — Prévention future</b> : rétablir le préservatif en plus de la pilule (« double protection »).</div><div class=\"etu\"><b>Étape 4 — Nuancer</b> : certains virus ne sont détectables que plusieurs semaines après le rapport (fenêtre sérologique) → dépistage à refaire.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La pilule protège des IST » : non — <b>seul le préservatif</b> protège.</li>\n<li>« Pas de symptôme = pas d'infection » : la plupart des IST sont <b>silencieuses</b>, surtout chez la femme.</li>\n<li>« La contraception d'urgence est un avortement » : non — elle retarde l'ovulation, elle n'interrompt rien.</li>\n<li>« Une IST ne guérit pas seule » : sans traitement → stérilité, maladies chroniques.</li>\n<li>« Le retrait protège » : risque de grossesse ET d'IST — aucune fiabilité.</li>\n</ul>\n</div>"
  },
  {
    "id": "systeme-nerveux",
    "theme": "Le système nerveux et la communication (4e)",
    "niveau": "4e",
    "titre": "Le système nerveux et la communication",
    "cours": "<div class=\"cours-head\"><h2>Le système nerveux et la communication</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Deux systèmes de communication dans l'organisme</h3>\n<ul>\n<li><b>Système nerveux</b> : messages <b>rapides</b> (millisecondes), par influx nerveux — réaction immédiate (retirer la main) ;</li>\n<li><b>Système hormonal</b> : messages <b>lents</b> (secondes à heures), par le sang — durables (croissance, glycémie).</li>\n</ul>\n\n<h3>2. Le système nerveux : centres et nerfs</h3>\n<ul>\n<li><b>Centres nerveux</b> : encéphale (cerveau, cervelet, tronc cérébral) dans le crâne + <b>moelle épinière</b> dans la colonne vertébrale ;</li>\n<li><b>Nerfs</b> : « câbles » formés de fibres (axones) reliant les centres au reste du corps ;</li>\n<li>Le nerf contient des fibres <b>sensitives</b> (vers les centres : informations) et <b>motrices</b> (vers les muscles : ordres).</li>\n</ul>\n\n<h3>3. Le réflexe : le circuit type</h3>\n<ol>\n<li><b>Récepteur</b> (peau, œil) : capte le stimulus ;</li>\n<li>Message <b>sensible</b> → nerf sensitif → <b>centre nerveux</b> (moelle épinière pour les réflexes médullaires) ;</li>\n<li>Message <b>moteur</b> → nerf moteur → <b>effecteur</b> (muscle : contraction).</li>\n</ol>\n<div class=\"formule\">Stimulus → récepteur → nerf sensitif → centre (moelle) → nerf moteur → effecteur (muscle) = <b>arc réflexe</b></div>\n<div class=\"tip\"><b>Réflexe vs acte volontaire</b> : dans le réflexe (genou, retrait de la main), la moelle épinière commande <b>seule</b> — le cerveau est informé <b>après</b> (on sent la douleur une fois la main retirée). L'acte volontaire, lui, part du cerveau.</div>\n\n<h3>4. Message nerveux et vitesse</h3>\n<ul>\n<li>Le message se propage sous forme d'<b>influx nerveux</b> — signal électrique, ≈ 100 m/s dans les fibres rapides ;</li>\n<li>La <b>myéline</b> (gaine des fibres rapides) accélère la propagation ;</li>\n<li>Au niveau de la jonction nerveux-muscle (plaques motrices), le message est transmis par un messager chimique (acétylcholine) — vue simplifiée.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — localiser une lésion nerveuse</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un patient ressent normalement une piqûre au pied mais ne peut pas bouger le pied. Où se situe probablement le problème ?</div><div class=\"etu\"><b>Étape 1 — Analyser les deux voies</b> : la sensibilité (piqûre ressentie) fonctionne → fibres et centres sensitifs intacts.</div><div class=\"etu\"><b>Étape 2 — La commande manque</b> : le mouvement est impossible → atteinte de la voie <b>motrice</b>.</div><div class=\"etu\"><b>Étape 3 — Localiser</b> : lésion probable de la <b>voie motrice</b> (fibre motrice d'un nerf, ou voie descendante de la moelle/du cerveau).</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : toujours tester séparément sensibilité et motricité — le système nerveux est fait de <b>circuits distincts</b>.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le réflexe passe par le cerveau » : non — par la <b>moelle épinière</b> (le cerveau est informé ensuite).</li>\n<li>Confondre nerf <b>sensitif</b> (informations vers le centre) et <b>moteur</b> (ordres vers le muscle).</li>\n<li>« Le nerf est un organe plein » : c'est un faisceau de <b>fibres nerveuses</b> (axones).</li>\n<li>« Seul le système nerveux commande les muscles » : les hormones aussi les influencent, plus lentement.</li>\n<li>« Tous les messages vont au cerveau » : les réflexes sont traités localement — c'est leur intérêt (rapidité).</li>\n</ul>\n</div>"
  },

    "id": "genetique-heredite",
    "theme": "La génétique et l'hérédité (3e)",
    "niveau": "3e",
    "titre": "La génétique et l'hérédité",
    "cours": "<div class=\"cours-head\"><h2>La génétique et l'hérédité</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les chromosomes : les livres de recettes</h3>\n<ul>\n<li>Dans le <b>noyau</b> de chaque cellule : des <b>chromosomes</b> porteurs de l'information génétique ;</li>\n<li>L'humain en a <b>46</b> (23 paires) : une paire héritée du père, une de la mère ;</li>\n<li>Un chromosome porte des <b>gènes</b> : des portions d'ADN qui codent des caractères (couleur des yeux, groupe sanguin...).</li>\n</ul>\n\n<h3>2. Les allèles : les versions d'un gène</h3>\n<ul>\n<li>Chaque gène existe en plusieurs versions : les <b>allèles</b> ;</li>\n<li>Les <b>2 allèles</b> d'un gène (un par chromosome de la paire) forment le <b>génotype</b> ;</li>\n<li>Le caractère visible = <b>phénotype</b> ;</li>\n<li>Allèle <b>dominant</b> (s'exprime même en un seul exemplaire, noté A) vs allèle <b>récessif</b> (exprimé seulement en double exemplaire, noté a).</li>\n</ul>\n<div class=\"formule\">Génotype AA ou Aa → phénotype [A] · Génotype aa → phénotype [a]</div>\n\n<h3>3. La transmission : la méiose et la fécondation</h3>\n<ol>\n<li>Les cellules reproductrices (gamètes) naissent par <b>méiose</b> : chaque gamète reçoit <b>un seul</b> chromosome de chaque paire (23 chromosomes) ;</li>\n<li>À la <b>fécondation</b> : 23 (père) + 23 (mère) = 46 : la cellule-œuf reçoit une version des gènes de chaque parent ;</li>\n<li>Chaque enfant reçoit donc <b>la moitié</b> de ses chromosomes de chaque parent — mais une combinaison <b>unique</b>.</li>\n</ol>\n\n<h3>4. Prévoir la descendance : les croisements</h3>\n<p>Exemple : gène à 2 allèles A (dominant) / a (récessif). Croisement de deux parents Aa :</p>\n<table>\n<tr><th></th><th>A (de parent 2)</th><th>a (de parent 2)</th></tr>\n<tr><td><b>A (de parent 1)</b></td><td>AA</td><td>Aa</td></tr>\n<tr><td><b>a (de parent 1)</b></td><td>Aa</td><td>aa</td></tr>\n</table>\n<ul>\n<li>Descendance : <b>3/4 [A]</b> et <b>1/4 [a]</b> — c'est le rapport 3:1 typique d'un croisement entre hétérozygotes ;</li>\n<li>Croisement Aa × aa : <b>1/2 [A], 1/2 [a]</b>.</li>\n</ul>\n<div class=\"tip\"><b>Méthode du tableau de croisement (échiquier)</b> : 1) noter les allèles de chaque parent ; 2) lister les gamètes possibles ; 3) remplir les 4 cases ; 4) compter les phénotypes. Toujours justifier avec l'échiquier, jamais « au hasard ».</div>\n\n<h3>5. Garçons et filles : la paire sexuelle</h3>\n<ul>\n<li>Paire <b>XX</b> = fille ; paire <b>XY</b> = garçon (le chromosome Y vient du père) ;</li>\n<li>Le père détermine donc le sexe de l'enfant : ses gamètes portent X ou Y ; ceux de la mère toujours X.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — interpréter un arbre généalogique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux parents au front lisse (caractère dominant [L]) ont un enfant au front ridé [l]. Comment est-ce possible ?</div><div class=\"etu\"><b>Étape 1 — Poser les faits</b> : l'enfant [l] est homozygote <b>ll</b> — il a reçu un allèle l de chaque parent.</div><div class=\"etu\"><b>Étape 2 — En déduire les parents</b> : chaque parent est lisse mais porte l : génotype <b>Ll</b> (hétérozygotes).</div><div class=\"etu\"><b>Étape 3 — Vérifier avec l'échiquier</b> : Ll × Ll → 3/4 [lisse] + 1/4 [ridé] : la naissance d'un enfant ridé est possible.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : un caractère récessif peut « sauter » des générations : il est porté, masqué par l'allèle dominant.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Deux parents lisses ne peuvent pas avoir un enfant ridé » : si — s'ils sont tous deux hétérozygotes.</li>\n<li>Confondre <b>génotype</b> (allèles) et <b>phénotype</b> (caractère visible).</li>\n<li>« Chaque gamète contient tous les chromosomes » : non — <b>la moitié</b> (23 chez l'humain).</li>\n<li>« L'allèle dominant est le plus fréquent » : la dominance (expression) n'a rien à voir avec la fréquence dans la population.</li>\n<li>« La mère détermine le sexe » : non — le chromosome <b>Y</b> vient du père.</li>\n</ul>\n</div>"
  },

    "titre": "L'immunité et les vaccins",
    "cours": "<div class=\"cours-head\"><h2>L'immunité et les vaccins</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Se défendre contre les microbes</h3>\n<ul>\n<li>Nos corps abritent des <b>micro-organismes</b> (bactéries, virus, champignons) ; la plupart sont inoffensifs, certains sont des <b>pathogènes</b> ;</li>\n<li>Barrières naturelles : <b>peau</b>, <b>mucus</b>, larmes, acidité gastrique ;</li>\n<li>Si un pathogène franchit ces barrières, le système immunitaire entre en jeu.</li>\n</ul>\n\n<h3>2. La réaction immunitaire : reconnaître et détruire</h3>\n<table>\n<tr><th>Acteur</th><th>Rôle</th></tr>\n<tr><td><b>Phagocytes</b></td><td>« mangent » les microbes (phagocytose) — réponse rapide, non spécifique</td></tr>\n<tr><td><b>Lymphocytes B</b></td><td>produisent des <b>anticorps</b> spécifiques d'un antigène</td></tr>\n<tr><td><b>Lymphocytes T</b></td><td>détruisent les cellules infectées, coordonnent la réponse</td></tr>\n</table>\n<ul>\n<li>À la surface du microbe : des <b>antigènes</b> (marqueurs moléculaires) — c'est leur reconnaissance qui déclenche la réponse spécifique ;</li>\n<li>Les <b>anticorps</b> se fixent sur l'antigène « comme une clé dans une serrure » et neutralisent le microbe.</li>\n</ul>\n\n<h3>3. La mémoire immunitaire</h3>\n<ol>\n<li><b>1re rencontre</b> (infection ou vaccin) : production d'anticorps lente et faible (quelques jours), puis formation de <b>lymphocytes mémoires</b> ;</li>\n<li><b>2e rencontre</b> avec le même antigène : réaction <b>rapide et massive</b> — le microbe est éliminé avant de rendre malade ;</li>\n<li>C'est la <b>mémoire immunitaire</b> : on est « immunisé » contre cette maladie.</li>\n</ol>\n\n<h3>4. Le vaccin : une répé́tition générale</h3>\n<ul>\n<li>Un <b>vaccin</b> introduit un antigène inoffensif (microbe tué, atténué, fragment) sans la maladie ;</li>\n<li>L'organisme fabrique anticorps et mémoires → à la vraie rencontre, la réponse est immédiate ;</li>\n<li>Les <b>rappels</b> entretiennent la mémoire ; la <b>couverture vaccinale</b> élevée protège aussi les non-vaccinés (immunité de groupe).</li>\n</ul>\n<div class=\"warn\"><b>Attention :</b> le vaccin ne « met pas » d'anticorps tout faits : il <b>apprend</b> à l'organisme à les produire. Un antibiotique (contre les bactéries) n'a rien à voir : il ne prévient rien et n'agit pas sur les virus.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire un graphique d'anticorps</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un graphique montre la quantité d'anticorps dans le sang après une 1re injection d'antigène au jour 0 et une 2e au jour 30. La 2e courbe est plus haute et plus rapide. Expliquez.</div><div class=\"etu\"><b>Étape 1 — 1re injection</b> : production lente et modérée (réaction primaire) ; mise en place des <b>lymphocytes mémoires</b>.</div><div class=\"etu\"><b>Étape 2 — 2e injection</b> : les mémoires reconnaissent l'antigène → réponse <b>rapide, intense et durable</b> (réaction secondaire).</div><div class=\"etu\"><b>Étape 3 — Interpréter</b> : c'est exactement le principe du <b>rappel vaccinal</b>.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la mémoire immunitaire rend la 2e rencontre plus efficace que la 1re — base de la vaccination.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le vaccin contient la maladie » : il contient un antigène <b>inoffensif</b> (atténué/tué/fragment).</li>\n<li>Confondre <b>antigène</b> (marqueur du microbe) et <b>anticorps</b> (produit par nos lymphocytes B).</li>\n<li>« Un vaccin guérit » : il <b>prévient</b> ; les traitements curatifs sont autres (antibiotiques, antiviraux).</li>\n<li>« Les anticorps attaquent tout » : ils sont <b>spécifiques</b> d'un antigène précis.</li>\n<li>« L'immunité est immédiate » : après la 1re rencontre, il faut plusieurs jours — d'où l'incubation des maladies.</li>\n</ul>\n</div>"
  },

    "id": "evolution-especes",
    "theme": "L'évolution des espèces (3e)",
    "niveau": "3e",
    "titre": "L'évolution des espèces",
    "cours": "<div class=\"cours-head\"><h2>L'évolution des espèces</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les espèces se transforment</h3>\n<ul>\n<li>Les <b>fossiles</b> prouvent que les espèces du passé diffèrent des espèces actuelles : la vie <b>évolue</b> ;</li>\n<li>Exemples emblématiques : ammonites disparues, cheval dont la taille et les doigts ont changé sur 55 millions d'années, baleines dont les ancêtres avaient des pattes.</li>\n</ul>\n\n<h3>2. Darwin : la sélection naturelle</h3>\n<ol>\n<li><b>Variabilité</b> : au sein d'une espèce, les individus diffèrent (allèles différents) ;</li>\n<li><b>Héritabilité</b> : ces caractères se transmettent aux descendants ;</li>\n<li><b>Sélection</b> : le milieu « trie » — les individus les mieux adaptés survivent et se reproduisent <b>davantage</b> ;</li>\n<li>Résultat : les caractères avantageux deviennent plus fréquents — <b>l'espèce évolue de génération en génération</b>.</li>\n</ol>\n<div class=\"tip\"><b>Exemple classique</b> : phalènes du bouleau — sur les troncs noircis par la pollution industrielle, les phalènes sombres sont moins repérées par les oiseaux : elles survivent mieux → en quelques décennies, la population est devenue majoritairement sombre. Une sélection <b>observée en temps réel</b>.</div>\n\n<h3>3. D'où vient la variabilité ?</h3>\n<ul>\n<li>Les <b>mutations</b> (erreurs de copie de l'ADN, aléatoires) créent de nouveaux allèles ;</li>\n<li>La <b>reproduction sexuée</b> (brassage des allèles) crée des combinaisons nouvelles ;</li>\n<li>La sélection naturelle ne « crée » rien : elle <b>trie</b> parmi les variantes existantes.</li>\n</ul>\n\n<h3>4. Spéciation : la naissance des espèces</h3>\n<ul>\n<li>Deux populations séparées (géographie, barrière) accumulent des différences indépendamment ;</li>\n<li>Quand elles ne peuvent plus se reproduire ensemble : <b>espèces distinctes</b> — c'est la <b>spéciation</b> ;</li>\n<li>Exemples : pinsons des Galápagos (Darwin), mouettes autour du pôle Nord.</li>\n</ul>\n\n<h3>5. Des taux d'évolution variés</h3>\n<ul>\n<li><b>Lent</b> : lignées continues sur des millions d'années (coelacanthe, « fossile vivant ») ;</li>\n<li><b>Rapide</b> : résistances aux antibiotiques ou aux pesticides (quelques années — sélection naturelle accélérée par l'homme) ;</li>\n<li>Les <b>crises biologiques</b> (extinctions de masse) renouvellent les formes de vie (disparition des dinosaures non-aviens il y a 66 Ma).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — expliquer une résistance aux antibiotiques</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une population de bactéries devient résistante à un antibiotique en quelques années. Expliquez par la sélection naturelle.</div><div class=\"etu\"><b>Étape 1 — Variabilité initiale</b> : par mutation, quelques bactéries portent un allèle de résistance (rares au départ).</div><div class=\"etu\"><b>Étape 2 — Sélection</b> : l'antibiotique tue les non-résistantes ; les résistantes survivent et se multiplient seules.</div><div class=\"etu\"><b>Étape 3 — Résultat</b> : en quelques générations (très rapides chez les bactéries), la population est majoritairement résistante.</div><div class=\"etu\"><b>Étape 4 — Nuancer</b> : c'est l'<b>usage massif et prolongé</b> de l'antibiotique qui exerce la pression de sélection — d'où les règles : cure complète, pas d'automédication.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Les individus s'adaptent » : ce sont les <b>populations</b> qui évoluent — un individu ne change pas ses allèles.</li>\n<li>« La sélection crée les mutations utiles » : les mutations sont <b>aléatoires</b> ; la sélection trie après coup.</li>\n<li>« L'évolution vise un but » : elle n'a ni but ni direction — seulement la survie différenciée.</li>\n<li>« Les fossiles prouvent que les espèces actuelles n'existaient pas » : beaucoup de lignées actuelles sont anciennes ; l'évolution ne remplace pas tout.</li>\n<li>« Une nouvelle espèce naît d'un individu » : la spéciation concerne des <b>populations isolées</b>.</li>\n</ul>\n</div>"
  },

    "titre": "Les écosystèmes et l'environnement",
    "cours": "<div class=\"cours-head\"><h2>Les écosystèmes et l'environnement</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Écosystème : le tout vivant + milieu</h3>\n<ul>\n<li><b>Écosystème</b> = êtres vivants (biocénose) + milieu physique (biotope) + interactions ;</li>\n<li>Les relations trophiques (qui mange qui) forment des <b>réseaux alimentaires</b> ;</li>\n<li>Niveaux : <b>producteurs</b> (végétaux) → <b>consommateurs</b> (herbivores, carnivores) → <b>décomposeurs</b> (bactéries, champignons).</li>\n</ul>\n\n<h3>2. Circulation de la matière</h3>\n<ul>\n<li>La matière (carbone, azote, eau) <b>circule en cycle</b> : producteurs → consommateurs → décomposeurs → retour au sol/air ;</li>\n<li>Rien ne se perd : la matière est <b>recyclée</b> en permanence dans l'écosystème ;</li>\n<li>Exemple : le carbone — CO₂ atmosphérique → photosynthèse → chaîne alimentaire → respiration/décomposition → retour au CO₂.</li>\n</ul>\n\n<h3>3. Circulation de l'énergie</h3>\n<ul>\n<li>L'énergie, elle, <b>entre</b> (lumière du soleil), traverse (photosynthèse, chaînes alimentaires) et <b>sort</b> (chaleur) : elle ne cycle pas ;</li>\n<li>À chaque maillon, ≈ <b>90 % de l'énergie est perdue</b> (respiration, chaleur) — d'où les pyramides alimentaires : peu de grands prédateurs ;</li>\n<li>C'est pour cela qu'il faut beaucoup de végétaux pour nourrir peu de carnivores.</li>\n</ul>\n<div class=\"tip\"><b>Distinction-clé du chapitre</b> : la <b>matière</b> se recycle en boucle fermée ; l'<b>énergie</b> circule en ligne droite (du soleil vers la chaleur). Le confondre est l'erreur la plus fréquente.</div>\n\n<h3>4. Équilibres et perturbations</h3>\n<ul>\n<li>Un écosystème est <b>résilient</b> : il se rétablit après une perturbation modérée ;</li>\n<li>Perturbations : <b>naturelles</b> (incendie, tempête) ou <b>humaines</b> (pollution, déforestation, espèces introduites) ;</li>\n<li>Les <b>décomposeurs</b> sont un maillon critique : sans eux, la matière cesserait de se recycler ;</li>\n<li>La <b>biodiversité</b> augmente la stabilité : un écosystème varié résiste mieux.</li>\n</ul>\n\n<h3>5. L'homme dans l'écosystème</h3>\n<ul>\n<li>Empreinte écologique : surfaces, ressources, déchets ;</li>\n<li>Solutions : <b>recyclage</b>, <b>agroécologie</b>, <b>restauration écologique</b> (haies, zones humides), réduction de l'artificialisation des sols.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — interpréter une pyramide alimentaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un écosystème de prairie : 1 000 t d'herbe, 100 t de vaches, 1 t de loups. Comment expliquer ces masses ?</div><div class=\"etu\"><b>Étape 1 — Lire la pyramide</b> : chaque niveau ne pèse que ≈ 10 % du précédent.</div><div class=\"etu\"><b>Étape 2 — Expliquer la règle des 10 %</b> : à chaque repas, ≈ 90 % de l'énergie part en respiration/chaleur, déjections ; seuls 10 % deviennent de la biomasse du prédateur.</div><div class=\"etu\"><b>Étape 3 — Conséquence</b> : peu de ressources pour les niveaux supérieurs → petits prédateurs en nombre ; les chaînes longues sont rares.</div><div class=\"etu\"><b>Étape 4 — Application</b> : consommer « plus bas » dans la chaîne (végétaux plutôt que viande) consomme moins de surfaces agricoles.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« L'énergie se recycle » : non — seule la <b>matière</b> cycle ; l'énergie se dissipe en chaleur.</li>\n<li>Confondre <b>producteur</b> (végétal, photosynthèse) et <b>consommateur</b>.</li>\n<li>« Les décomposeurs sont en bout de chaîne inutile » : ils referment le cycle de la matière — indispensable.</li>\n<li>« La pyramide mesure le nombre d'individus » : c'est la <b>biomasse</b> (masse), pas l'effectif.</li>\n<li>« Un écosystème est figé » : il évolue en permanence (saisons, successions) ; l'équilibre est dynamique.</li>\n</ul>\n</div>"
  },

    "id": "terre-tectonique",
    "theme": "La Terre : structure et tectonique des plaques (2de)",
    "niveau": "2de",
    "titre": "La Terre : structure et tectonique des plaques",
    "cours": "<div class=\"cours-head\"><h2>La Terre : structure et tectonique des plaques</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'intérieur de la Terre : une structure en couches</h3>\n<table>\n<tr><th>Enveloppe</th><th>Profondeur</th><th>État / composition</th></tr>\n<tr><td><b>Croûte</b> (continentale / océanique)</td><td>0 - 70 km</td><td>solide, rigide (silice : granit / basalte)</td></tr>\n<tr><td><b>Manteau</b></td><td>≈ 70 - 2900 km</td><td>roches solides ; partie supérieure ductile (asthénosphère)</td></tr>\n<tr><td><b>Noyau</b> (externe liquide / interne solide)</td><td>2900 - 6371 km</td><td>fer + nickel ; source du champ magnétique</td></tr>\n</table>\n<ul>\n<li>La <b>lithosphère</b> (croûte + partie rigide du manteau) est découpée en <b>plaques</b> ;</li>\n<li>Elle repose sur l'<b>asthénosphère</b>, plus ductile, où circulent des courants de convection.</li>\n</ul>\n<div class=\"tip\"><b>Preuves directes</b> : forages (12 km max — très superficiels) ; <b>roches remontées</b> (kimberlites, xénolites) ; <b>preuves indirectes</b> : ondes sismiques, champ magnétique, météorites (analogues du noyau).</div>\n\n<h3>2. Le moteur : la convection du manteau</h3>\n<ul>\n<li>Le noyau chauffe le manteau : les roches chaudes <b>remontent</b>, les roches refroidies <b>plongent</b> — convection lente (cm/an) ;</li>\n<li>Ces mouvements entraînent les plaques lithosphériques : c'est le <b>moteur de la tectonique</b>.</li>\n</ul>\n\n<h3>3. Les frontières de plaques : 3 types</h3>\n<table>\n<tr><th>Type</th><th>Mouvement</th><th>Conséquences</th><th>Exemples</th></tr>\n<tr><td><b>Divergente</b></td><td>les plaques s'écartent</td><td>création de croûte océanique (dorsales), volcanisme, séismes superficiels</td><td>dorsale médio-atlantique, rift est-africain</td></tr>\n<tr><td><b>Convergente</b></td><td>les plaques se rapprochent</td><td><b>subduction</b> (plongement) ou <b>collision</b> : montagnes, séismes profonds, volcans explosifs</td><td>Andes, Himalaya, Japon</td></tr>\n<tr><td><b>Coulissante</b> (transformante)</td><td>glissement latéral</td><td>séismes superficiels violents, pas de volcanisme</td><td>faille de San Andreas</td></tr>\n</table>\n\n<h3>4. Les preuves de la dérive des continents</h3>\n<ul>\n<li>Géométrie des marges (Wegener : Amérique du Sud / Afrique) ;</li>\n<li>Fossiles et roches identiques de part et d'autre de l'Atlantique ;</li>\n<li><b>Anomalies magnétiques</b> symétriques des dorsales : la croûte enregistre les inversions du champ magnétique — preuve de son expansion ;</li>\n<li>GPS et mesures directes : déplacements de qq cm/an (vitesse d'ongle qui pousse !).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — identifier une frontière de plaques</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une région présente : une fosse océanique profonde, des volcans explosifs, des séismes jusqu'à 600 km de profondeur. Quel type de frontière ?</div><div class=\"etu\"><b>Étape 1 — Analyser les indices</b> : fosse + volcans explosifs + séismes profonds → une plaque <b>plonge</b> sous l'autre.</div><div class=\"etu\"><b>Étape 2 — Nommer</b> : frontière <b>convergente</b> de type <b>subduction</b> (océan sous plaque).</div><div class=\"etu\"><b>Étape 3 — Rattacher un exemple</b> : Andes (Nazca sous Amérique du Sud), Japon (Pacifique sous plaques).</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : chaque indice (profondeur des séismes, volcanisme, relief) caractérise un type de frontière — c'est une clé de lecture du globe.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre <b>croûte</b> et <b>lithosphère</b> : la lithosphère = croûte + manteau supérieur rigide.</li>\n<li>« Les plaques flottent sur un océan de magma » : le manteau est <b>solide</b> mais ductile — il flue sur des millions d'années.</li>\n<li>« L'Himalaya est une subduction » : non — une <b>collision</b> (deux croûtes continentales, aucune ne plonge).</li>\n<li>« Les séismes profonds existent partout » : ils signalent la <b>subduction</b> (plaque froide qui plonge).</li>\n<li>« La dérive est rapide » : qq cm/an — imperceptible à l'échelle humaine.</li>\n</ul>\n</div>"
  },

    "niveau": "2de",
    "titre": "L'ADN, les protéines et la cellule",
    "cours": "<div class=\"cours-head\"><h2>L'ADN, les protéines et la cellule</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La cellule : une machinerie miniaturisée</h3>\n<ul>\n<li><b>Membrane</b> (échanges), <b>cytoplasme</b> (siège des réactions), <b>noyau</b> (ADN) ;</li>\n<li>Autres constituants : <b>mitochondries</b> (énergie), ribosomes (synthèse des protéines), chloroplastes (photosynthèse, végétaux) ;</li>\n<li>La cellule est délimitée et <b>autonome</b> : c'est l'unité de structure et de fonction du vivant.</li>\n</ul>\n\n<h3>2. L'ADN : le support de l'information</h3>\n<ul>\n<li>Structure : <b>2 brins en double hélice</b> ; chaque brin est une succession de <b>nucléotides</b> (A, T, G, C) ;</li>\n<li><b>Appariements complémentaires</b> : A–T et G–C — c'est la clé de la copie (réplication) et de la lecture ;</li>\n<li>Un <b>gène</b> = une portion d'ADN qui code une <b>protéine</b>.</li>\n</ul>\n<div class=\"formule\">ADN --(transcription)--&gt; ARN messager --(traduction, ribosome)--&gt; protéine</div>\n\n<h3>3. Les protéines : des acteurs polyvalents</h3>\n<table>\n<tr><th>Rôle</th><th>Exemple</th></tr>\n<tr><td><b>Enzyme</b> (accélère une réaction)</td><td>amylase (digestion de l'amidon)</td></tr>\n<tr><td><b>Structural</b> (construction)</td><td>collagène, kératine</td></tr>\n<tr><td><b>Transport</b></td><td>hémoglobine (O₂)</td></tr>\n<tr><td><b>Défense</b></td><td>anticorps</td></tr>\n<tr><td><b>Mouvement</b></td><td>actine, myosine (muscle)</td></tr>\n<tr><td><b>Messager</b></td><td>hormones (insuline)</td></tr>\n</table>\n\n<h3>4. De la séquence à la forme</h3>\n<ul>\n<li>L'ordre des nucléotides (gène) détermine l'ordre des <b>acides aminés</b> de la protéine ;</li>\n<li>La séquence d'acides aminés détermine le <b>repliement</b> (structure 3D) ;</li>\n<li>La forme 3D détermine la <b>fonction</b> : une modification (mutation) peut changer la fonction — c'est le cas de la drépanocytose (une seule substitution → hémoglobine défectueuse).</li>\n</ul>\n<div class=\"tip\"><b>Expérience-clé</b> : les expériences de <b>Griffith puis Avery</b> (transformation bactérienne) ont prouvé que c'est l'ADN — et pas les protéines — qui porte l'information génétique. Structure en double hélice : Watson, Crick, Franklin (photo 51), 1953.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — prédire l'effet d'une mutation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une mutation remplace un nucléotide d'un gène de l'hémoglobine. Quelles conséquences possibles ?</div><div class=\"etu\"><b>Étape 1 — Au niveau de l'ARN</b> : un nucléotide changé peut modifier un codon → un <b>acide aminé différent</b> inséré dans la protéine.</div><div class=\"etu\"><b>Étape 2 — Au niveau de la protéine</b> : la séquence modifiée peut altérer le repliement → forme 3D changée → fonction perturbée.</div><div class=\"etu\"><b>Étape 3 — Au niveau du phénotype</b> : hémoglobine moins efficace → anémie (drépanocytose si l'allèle est en double exemplaire).</div><div class=\"etu\"><b>Étape 4 — Nuancer</b> : certaines mutations sont <b>silencieuses</b> (codon équivalent, acide aminé inchangé) : tout changement n'est pas pathologique.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« L'ADN fabrique directement les protéines » : non — il passe par l'<b>ARN messager</b> (transcription puis traduction).</li>\n<li>Confondre <b>gène</b> (portion d'ADN) et <b>protéine</b> (produit) ; le gène « code », la protéine « agit ».</li>\n<li>Appariements : A avec <b>T</b> (ADN) ; dans l'ARN, A avec <b>U</b>.</li>\n<li>« Une mutation est forcément néfaste » : elle peut être silencieuse, voire avantageuse (moteur de l'évolution).</li>\n<li>« Toutes les cellules ont le même ADN mais les mêmes protéines » : même ADN, <b>protéines différentes</b> selon l'activité de chaque cellule.</li>\n</ul>\n</div>"
  },
  {
    "id": "biodiversite-evolution",
    "theme": "La biodiversité et son évolution (2de)",
    "niveau": "2de",
    "titre": "La biodiversité et son évolution",
    "cours": "<div class=\"cours-head\"><h2>La biodiversité et son évolution</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Mesurer la biodiversité</h3>\n<ul>\n<li>Trois niveaux : <b>génétique</b> (allèles au sein d'une espèce), <b>spécifique</b> (espèces d'un milieu), <b>écosystémique</b> (milieux) ;</li>\n<li>Indicateurs : <b>richesse spécifique</b>, <b>abondance relative</b>, indices de diversité ;</li>\n<li>Évaluer un état : <b>échantillonnage</b> (quadrats, transects), suivi temporel.</li>\n</ul>\n\n<h3>2. Évoluer : le moteur génétique</h3>\n<ul>\n<li><b>Mutations</b> (aléatoires) + <b>brassage</b> (méiose, fécondation) créent la diversité des allèles ;</li>\n<li>La <b>sélection naturelle</b> (milieu) et la <b>dérive génétique</b> (hasard, petites populations) modifient leurs fréquences ;</li>\n<li>Résultat : les populations se transforment — <b>l'évolution</b>, dont la spéciation (nouvelles espèces).</li>\n</ul>\n\n<h3>3. Les crises de la biodiversité</h3>\n<table>\n<tr><th>Événement</th><th>Conséquence</th></tr>\n<tr><td>5 grandes <b>extinctions de masse</b></td><td>disparition massive (ex. fin des dinosaures non-aviens, 66 Ma)</td></tr>\n<tr><td>Après chaque crise</td><td><b>radiation</b> : les groupes survivants se diversifient (mammifères après 66 Ma)</td></tr>\n<tr><td><b>6e extinction</b> actuelle</td><td>causée par l'homme (destructions de milieux, espèces introduites, surexploitation, climat)</td></tr>\n</table>\n<div class=\"warn\"><b>Attention :</b> l'érosion actuelle de la biodiversité est <b>plus rapide</b> que les extinctions naturelles : les taux d'extinction mesurés dépassent largement le taux de fond. C'est un fait mesuré, pas une opinion.</div>\n\n<h3>4. Préserver : connaître pour agir</h3>\n<ul>\n<li>Inventaires (listes rouges UICN), <b>conservation in situ</b> (parcs, réserves, trames) et <b>ex situ</b> (banques de graines, zoos) ;</li>\n<li>La biodiversité rend des <b>services écosystémiques</b> : pollinisation, purification de l'eau, sols, médicaments, climat.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — comparer deux mesures de biodiversité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Prairie A : 4 espèces, toutes abondantes et équilibrées. Prairie B : 4 espèces, dont une représente 90 % des individus. Laquelle est la plus « diversifiée » ?</div><div class=\"etu\"><b>Étape 1 — Richesse identique</b> : 4 espèces partout — l'indice de richesse ne distingue pas.</div><div class=\"etu\"><b>Étape 2 — Regarder l'équilibre</b> : A est régulière (équitabilité forte) ; B est dominée par une espèce (équitable faible).</div><div class=\"etu\"><b>Étape 3 — Conclusion</b> : A est plus diversifiée <b>au sens de la structure</b> : la diversité dépend de la richesse <b>et</b> de l'équitabilité.</div><div class=\"etu\"><b>Étape 4 — Enjeu</b> : une population dominante unique rend l'écosystème fragile (une maladie peut tout emporter).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Réduire la biodiversité au « nombre d'espèces » : elle est aussi <b>génétique</b> et <b>écosystémique</b>.</li>\n<li>« L'évolution a été continue et paisible » : elle est marquée de <b>crises</b> et de radiations.</li>\n<li>« La dérive génétique est une sélection » : la dérive est due au <b>hasard</b>, la sélection au milieu — deux moteurs distincts.</li>\n<li>« Les zoos suffisent à sauver les espèces » : la conservation <b>in situ</b> (dans le milieu) reste prioritaire.</li>\n<li>« Une espèce disparue peut revenir » : l'extinction est <b>définitive</b>.</li>\n</ul>\n</div>"
  },
  {
    "id": "climat-ges",
    "theme": "Le climat, l'atmosphère et les gaz à effet de serre (2de)",
    "niveau": "2de",
    "titre": "Le climat, l'atmosphère et les gaz à effet de serre",
    "cours": "<div class=\"cours-head\"><h2>Le climat, l'atmosphère et les gaz à effet de serre</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'atmosphère : une fine enveloppe</h3>\n<ul>\n<li>Composition actuelle : <b>78 % N₂, 21 % O₂</b>, traces de gaz (CO₂ ≈ 0,04 %, vapeur d'eau, méthane) ;</li>\n<li>Couches : troposphère (0-12 km, météo), stratosphère (ozone), mésosphère, thermosphère ;</li>\n<li>Elle protège (ozone UV, météorites), fait vivre (respiration) et régule le climat.</li>\n</ul>\n\n<h3>2. L'effet de serre : un mécanisme naturel</h3>\n<ol>\n<li>Le Soleil chauffe la Terre (rayonnement visible) ;</li>\n<li>La Terre renvoie de la chaleur (rayonnement <b>infrarouge</b>) ;</li>\n<li>Les <b>gaz à effet de serre</b> (CO₂, H₂O, CH₄, N₂O) piègent une partie de ces infrarouges → l'atmosphère se réchauffe ;</li>\n<li>Sans effet de serre : ≈ <b>-18 °C</b> de moyenne terrestre (au lieu de +15 °C) : c'est un phénomène <b>indispensable à la vie</b>.</li>\n</ol>\n<div class=\"tip\"><b>L'effet de serre n'est pas l'ennemi</b> : c'est son <b>renforcement</b> par nos émissions qui dérègle le climat. Toujours distinguer « effet de serre » et « excès d'effet de serre ».</div>\n\n<h3>3. Climat du passé : les archives</h3>\n<table>\n<tr><th>Archive</th><th>Ce qu'elle révèle</th></tr>\n<tr><td><b>Carottes de glace</b> (Vostok, EPICA)</td><td>bulles d'air anciennes → teneurs en CO₂/CH₄ ; δ(18O) → températures</td></tr>\n<tr><td><b>Sédiments marins</b></td><td>coquilles (foraminifères) → température, niveau marin</td></tr>\n<tr><td><b>Anneaux d'arbres, coraux, spéléothèmes</b></td><td>variations régionales récentes</td></tr>\n</table>\n<ul>\n<li>Résultat : CO₂ et température évoluent <b>ensemble</b> sur les derniers 800 000 ans (cycles glaciaires-interglaciaires, ≈ 100 000 ans) ;</li>\n<li>Mais aujourd'hui, le CO₂ atteint des niveaux <b>jamais vus</b> sur 800 000 ans (≈ 420 ppm, et l'augmentation est ~100× plus rapide qu'aux transitions naturelles).</li>\n</ul>\n\n<h3>4. Causes humaines et conséquences</h3>\n<ul>\n<li>Causes : <b>combustion d'énergies fossiles</b> (charbon, pétrole, gaz), déforestation, agriculture, ciment ;</li>\n<li>Conséquences mesurées : hausse des températures (+1,1 °C depuis l'ère industrielle), montée des mers, événements extrêmes plus fréquents, acidification des océans ;</li>\n<li>Réponses : atténuation (réduction des émissions, énergies renouvelables, sobriété) et adaptation.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire une carotte de glace</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une carotte de glace montre, à -800 m : CO₂ ≈ 180 ppm et δ(18O) faible ; à -400 m : CO₂ ≈ 280 ppm et δ(18O) plus élevé. Comment interpréter ?</div><div class=\"etu\"><b>Étape 1 — Relier âge et profondeur</b> : plus profond = plus ancien ; -800 m = période glaciaire, -400 m = période plus tempérée.</div><div class=\"etu\"><b>Étape 2 — CO₂ et climat</b> : 180 ppm = période glaciaire ; 280 ppm = interglaciaire : CO₂ et température varient ensemble.</div><div class=\"etu\"><b>Étape 3 — Comparer au présent</b> : aujourd'hui ≈ 420 ppm — au-dessus du maximum naturel (300 ppm sur 800 000 ans).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : l'augmentation actuelle sort du cadre naturel → origine <b>anthropique</b> (combustibles fossiles : carbone fossile dépourvu de 14C).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« L'effet de serre est une invention humaine » : naturel et indispensable ; le problème est son <b>excès</b>.</li>\n<li>« Le CO₂ a déjà été élevé avant » : oui sur des <b>millions d'années</b>, mais jamais avec une <b>vitesse</b> actuelle ni pendant la présence humaine.</li>\n<li>Confondre <b>météo</b> (jour, lieu) et <b>climat</b> (moyennes, tendances longues).</li>\n<li>« La couche d'ozone cause le réchauffement » : deux problèmes distincts (trou d'ozone = CFC ; climat = GES).</li>\n<li>« Corrélation = causalité » : CO₂ et température sont couplés par des <b>boucles</b> (rétroactions), pas une simple causalité univoque — mais l'excès actuel de CO₂ est bien la cause du réchauffement (physique connue depuis le XIXe siècle).</li>\n</ul>\n</div>"
  },
