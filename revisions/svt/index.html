3>2. Comment naissent les espèces : la spéciation</h3>\n<div class=\"tip\"><b>Scénario de spéciation (allopathique) :</b> ① une population se trouve SCINDÉE par une barrière (montagne, bras de mer, climat) ; ② les deux moitiés accumulent des DIFFÉRENCES (mutations, sélections locales) ; ③ même réunies plus tard, elles ne peuvent plus se reproduire ensemble : <b>espèces distinctes</b>.<br>Le facteur clef : l'<b>ISOLEMENT</b> (sans échanges de gènes, les divergences s'accumulent).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — les pinsons de Darwin : 1 espèce ⟶ 13</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Reconstituer la spéciation des pinsons des Galápagos depuis un ancêtre continental.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le départ</b> : un pinson d'Amérique du Sud est déporté sur une île (tempête) : population fondatrice ISOLÉE.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les isolements successifs</b> : d'une île à l'autre (bras de mer infranchissables pour un pinson), chaque population subit sa sélection locale (becs selon les graines disponibles) : les différences s'accumulent.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le résultat</b> : les populations ne se recroisent plus (chants, rituels, becs différents) : 13 espèces : la diversité est née de POPULATIONS SÉPARÉES + du TEMPS + du TRI local : le même scénario (masqué) a produit les ~1000 espèces de Drosophiles d'Hawaii ou les cichlidés des grands lacs africains.</div></div></details>\n<h3>3. Érosion actuelle et enjeux</h3>\n<div class=\"tip\"><b>Le taux d'extinction actuel est 100 à 1000 fois supérieur</b> au taux « naturel » (fondus : ~1 espèce/million d'années en moyenne) : causes : destruction des habitats (n°1), espèces invasives, pollution, surexploitation, climat.<br>Cinq crises de masse ont déjà eu lieu (la plus célèbre : -66 Ma : dinosaures) : la SIXIÈME, en cours, est la première causée par une espèce : la nôtre. La biodiversité est une ressource (alimentation, médicaments, pollinisation, régulation) ET un patrimoine.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — les services écosystémiques chiffrés</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Montrer par 3 exemples que la biodiversité « travaille » pour l'humanité, et pourquoi son érosion est un enjeu économique direct.</div><div class=\"etu\"><b>Étape 1</b> — <b>Pollinisation</b> : ~75 % des cultures dépendent des pollinisateurs : service estimé à ~150-500 milliards €/an (gratuit : jusqu'à quand ?).</div><div class=\"etu\"><b>Étape 2</b> — <b>Pharmacie</b> : une part majeure des médicaments vient du vivant (pénicilline : moisissure : aspirine : saule : antipaludéens : quinquina, artemisia...) : chaque espèce perdue = une recette brûlée avant lecture.</div><div class=\"etu\"><b>Étape 3</b> — <b>Régulation</b> : les forêts et océans absorbent ~la moitié de nos émissions de CO₂ : les mangroves et récifs protègent les côtes des vagues (amortissement équivalent à des digues) : dégrader la biodiversité, c'est casser des machines gratuites et irremplaçables : le coût du déclin dépasse celui de la protection.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> l'évolution n'est pas « finie » (elle continue sous nos yeux : résistances aux antibiotiques) ; spéciation = isolement + divergence, pas « volonté de changer » ; extinction et spéciation coexistent en permanence (l'arbre pousse et perd des branches) ; « théorie » de l'évolution = cadre scientifique validé, pas une opinion.</div>"},
{"id": "climat-ges", "theme": "Le climat, l'atmosphère et les gaz à effet de serre (2de)", "niveau": "2de", "titre": "Le climat, l'atmosphère et les gaz à effet de serre", "cours": "<div class=\"cours-head\"><h2>Le climat, l'atmosphère et les gaz à effet de serre</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'atmosphère et l'effet de serre</h3>\n<div class=\"tip\"><b>Atmosphère :</b> 78 % N₂, 21 % O₂, et des traces : vapeur d'eau, <b>CO₂</b> (0,04 % : mais quel pouvoir !), méthane, ozone. <br><b>Effet de serre :</b> le Soleil réchauffe le sol (rayonnement visible) : la Terre renvoie de la chaleur (infrarouge) : les GES la captent et la renvoient en partie vers le sol : sans eux, la température moyenne serait de <b>-18 °C au lieu de +15 °C</b> : c'est un phénomène NATUREL et VITAL, que nos émissions amplifient.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — comprendre l'effet de serre avec une voiture</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi une voiture au soleil, vitres fermées, monte-t-elle à 50 °C alors que dehors il fait 25 °C ? Faire le parallèle avec l'atmosphère.</div><div class=\"etu\"><b>Étape 1</b> — <b>L'entrée</b> : les vitres laissent passer la lumière du Soleil (visible) : elle chauffe les sièges et le tableau de bord.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le piège</b> : les objets chauds émettent de l'INFRAROUGE : les vitres (le verre) sont opaques à l'infrarouge : la chaleur ne peut PAS sortir : la température monte.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le parallèle</b> : les GES jouent le rôle des vitres : ils laissent entrer le visible, retiennent l'infrarouge : plus de GES = vitres plus épaisses = déséquilibre : le bilan radiatif de la Terre devient positif : la planète stocke de la chaleur (+0,2 °C par décennie).</div></div></details>\n<h3>2. Le carbone : un cycle perturbé</h3>\n<div class=\"tip\"><b>Réservoirs de carbone :</b> atmosphère (~850 Gt C), océans (~38 000, le plus grand), sols et végétation (~2000), sous-sol (charbon, pétrole, gaz : le carbone « fossile », stocké depuis des millions d'années).<br>Les flux naturels sont ÉQUILIBRÉS (respiration ↔ photosynthèse) : nos combustions INJECTENT du carbone fossile supplémentaire : +40 Gt CO₂/an : la moitié est absorbée (océans : acidification !, forêts), le reste s'accumule : la concentration de CO₂ passe de 280 ppm (préindustriel) à <b>~420 ppm aujourd'hui</b> (mesure directe à Mauna Loa depuis 1958 : la courbe de Keeling, qui oscille avec les saisons et monte, monte).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — les glaces, archives du climat</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment les carottes de glace du Groenland et de l'Antarctique reconstituent-elles le climat des 800 000 dernières années ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La bulle d'air</b> : la neige emprisonne l'air du moment : en se compactant en glace, elle fabrique des échantillons d'atmosphère ANCIENTE : on mesure CO₂ et méthane fossile directement.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le thermomètre</b> : les isotopes de l'oxygène/hydrogène de la glace dépendent de la température du moment : les couches successives (comme les anneaux d'un arbre) donnent une frise climatique.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le résultat</b> : 8 cycles glaciaires/interglaciaires : le CO₂ oscille entre 180 et 280 ppm AVEC la température : aujourd'hui : 420 ppm, hors de toute la plage des 800 000 ans : la vitesse actuelle (ce qui normalement prend des millénaires) se fait en un siècle : c'est la VITESSE, plus encore que l'amplitude, qui dérègle les écosystèmes.</div></div></details>\n<h3>3. Conséquences et réponses</h3>\n<div class=\"tip\"><b>Conséquences observées :</b> +1,2 °C depuis l'ère industrielle, fonte des glaces, montée des océans (~20 cm, accélération), vagues de chaleur et pluies extrêmes plus intenses, acidification (corail en danger), déplacements d'espèces.<br><b>Réponses :</b> atténuation (réduire les émissions : énergies décarbonées, sobriété, puits de carbone) + adaptation (se préparer : villes fraîches, côtes, agriculture). Objectifs internationaux : <b>Accord de Paris (2015) : limiter à +2 °C, viser +1,5 °C</b>.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'océan, allié menacé</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'océan absorbe ~un quart de nos émissions de CO₂ et 90 % de l'excès de chaleur. Quels services rend-il, et à quel prix ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le service carbone</b> : le CO₂ dissous dans l'eau forme de l'acide carbonique : l'océan « avale » nos émissions : sans lui, le réchauffement serait bien pire.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le prix</b> : acidification (pH baisse de 0,1 : ~30 % d'acidité en plus) : les organismes calcificateurs (coraux, huîtres, plancton) ne construisent plus leurs coquilles : les récifs (25 % des espèces marines) blanchissent et meurent.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon systémique</b> : il n'y a pas de « poubelle » gratuite : chaque service rendu par un réservoir a un coût (chaleur stockée ⟹ dilatation + fonte ⟹ montée des eaux : ~20 cm déjà, 3-10 mm/an aujourd'hui) : le climat, l'océan et la biodiversité forment un seul système couplé : le traiter par bouts est une erreur d'analyse.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> l'effet de serre est naturel et vital (sans lui : -18 °C) : c'est son AMPLIFICATION qui pose problème ; le CO₂ n'est pas le seul GES (vapeur d'eau, méthane : plus puissant, N₂O) ; « temps » ≠ « climat » (un hiver froid ne réfute pas un réchauffement moyen) ; l'ozone stratosphérique (trou d'ozone) est un autre problème (protection UV), souvent confondu à tort.</div>"},
{"id": "immunite-1re", "theme": "Le système immunitaire et sa mémoire (1re)", "niveau": "1re", "titre": "Le système immunitaire et sa mémoire", "cours": "<div class=\"cours-head\"><h2>Le système immunitaire et sa mémoire</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les lymphocytes : la défense ciblée</h3>\n<div class=\"tip\"><b>Lymphocytes B (LB)</b> : portent des récepteurs (BCR) reconnaissant UN antigène : après sélection et multiplication (avec l'aide des LT4), ils deviennent des <b>plasmocytes</b> : usines à <b>anticorps</b> (immunité humorale).<br><b>Lymphocytes T8 cytotoxiques (LTc)</b> : tuent au contact les cellules infectées (immunité cellulaire) : elles présentent à leur surface des fragments du virus (la « plaque d'immatriculation » du crime).<br>Les <b>LT4</b> sécrètent des interleukines : les ordres qui coordonnent tout (chef d'orchestre : cible du VIH).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la sélection clonale d'un LB</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur ~1 million de spécificités différentes, comment le système immunitaire mobilise-t-il les bons LB contre le virus de la grippe ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La bibliothèque</b> : chaque LB porte UNE spécificité (son récepteur, assemblé au hasard lors de sa fabrication dans la moelle : recombinaison VDJ) : l'immunité est PRE-ÉQUIPÉE contre tout ce qui existe ou existera.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le tri</b> : seul le (rare) LB dont le récepteur épouse l'antigène grippal est ACTIVÉ (double signal : antigène + interleukines des LT4) : il se multiplie en quelques jours : du soldat isolé à l'armée.</div><div class=\"etu\"><b>Étape 3</b> — <b>La différenciation</b> : la plupart deviennent plasmocytes (anticorps en masse : 2000 molécules/s), quelques-uns restent en <b>LB mémoire</b> : la sélection clonale explique à la fois la spécificité (un seul clône mobilisé), le délai de la 1re réponse (~5-7 jours) et la mémoire (les clones survivent).</div></div></details>\n<h3>2. La mémoire immunitaire : cœur de la vaccination</h3>\n<div class=\"tip\"><b>2e contact :</b> les lymphocytes mémoire se réactivent en quelques heures : production d'anticorps massive (×10) et rapide : les LTc mémoire tuent avant que les cellules infectées ne libèrent le virus : la maladie ne se déclare PAS.<br><b>Vaccins :</b> présenter l'antigène (tué, atténué, sous-unité, ARN) SANS la maladie : le corps construit sa mémoire : rappels = entretien. <b>Tropisme du VIH :</b> destruction des LT4 : l'orchestre sans chef : SIDA, dépistage, trithérapies.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — vacciner contre un virus qui mute (grippe, COVID)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le virus de la grippe change ses antigènes chaque année. Pourquoi faut-il un vaccin annuel alors que la mémoire immunitaire dure des décennies ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le camouflage</b> : la grippe mute ses protéines de surface (hémagglutinine : l'antigène clef) : les anticorps anciens ne reconnaissent plus exactement la nouvelle version.</div><div class=\"etu\"><b>Étape 2</b> — <b>La réponse mémoire décalée</b> : la mémoire reste, mais elle cible l'ANCIENNE forme : un léger recouvrement protège partiellement : la nouvelle variante a une longueur d'avance.</div><div class=\"etu\"><b>Étape 3</b> — <b>La parade sanitaire</b> : chaque année, l'OMS choisit les souches attendues (surveillance mondiale) : le vaccin réentraîne le système sur les formes ACTUELLES : pour le COVID, c'est la même logique (mises à jour des vaccins ARN) : la mémoire est fidèle, pas devineresse.</div></div></details>\n<h3>3. Greffes, allergies, maladies auto-immunes : la frontière du soi</h3>\n<div class=\"tip\"><b>Greffe :</b> les molécules HLA (marqueurs d'identité) du donneur = du non-soi ⟹ rejet : compatibilité + immunosuppresseurs.<br><b>Allergie :</b> réponse IgE contre un antigène inoffensif : histamine : symptômes (jusqu'au choc anaphylactique).<br><b>Auto-immunité :</b> le système attaque le SOI (diabète de type 1 : les LTc détruisent les cellules ß du pancréas : sclérose en plaques : myéline) : la tolérance au soi s'est brisée.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — diabète de type 1 : l'erreur de ciblage</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans le diabète de type 1, les LTc détruisent les cellules ß des îlots de Langerhans (les seules à produire l'insuline). Reconstituer le mécanisme et la différence avec le type 2.</div><div class=\"etu\"><b>Étape 1</b> — <b>La rupture de tolérance</b> : normalement, les lymphocytes auto-réactifs sont éliminés ou neutralisés (tolérance centrale et périphérique) : ici, des LTc échappent au contrôle et identifient la cellule ß comme une infectée.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'attaque</b> : les LTc (aidés par des anticorps) détruisent progressivement les îlots : l'insuline disparaît : le glucose s'accumule dans le sang (hyperglycémie, cétose) : l'injection d'insuline remplace la production perdue (à vie).</div><div class=\"etu\"><b>Étape 3</b> — <b>Type 1 vs type 2</b> : type 1 = DESTRUCTION (auto-immun, jeune, insulinodépendant) ; type 2 = RESISTANCE (l'insuline est produite mais les cellules y répondent mal : terrain, mode de vie) : mêmes symptômes, mécanismes opposés : la recherche vise aujourd'hui à rééduquer le système immunitaire (thérapies anti-réjection, greffe d'îlots : la frontière greffe/auto-immunité se croise : les immunosuppresseurs protègent les îlots greffés... du patient lui-même).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> les anticorps ne « tuent » pas : ils neutralisent et marquent (l'extermination est le travail des LTc, phagocytes, complément) ; la spécificité vient de la sélection d'un clone PRÉEXISTANT (le système ne « fabrique pas sur mesure » : il TRIE) ; LT4 = chefs, LTc = tueurs, LB/plasmocytes = usines à anticorps ; la mémoire est cellulaire (elle survit aux anticorps).</div>"},
{"id": "genome-expression", "theme": "Le génome et l'expression des gènes (1re)", "niveau": "1re", "titre": "Le génome et l'expression des gènes", "cours": "<div class=\"cours-head\"><h2>Le génome et l'expression des gènes</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le génome : le même dans chaque cellule</h3>\n<div class=\"tip\"><b>Génome</b> = l'ensemble de l'ADN d'une cellule (~3 milliards de paires de bases, ~20 000 gènes) : PRÉSENT ET IDENTIQUE dans presque toutes les cellules du corps (exceptions : globules rouges matures sans noyau, lymphocytes réarrangés).<br>Le génome est CONSTANT : c'est son <b>EXPRESSION</b> (quels gènes sont lus) qui varie : une cellule musculaire et un neurone ont le même ADN, mais pas les mêmes protéines : c'est la <b>différenciation</b>.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — cloning par transfert de noyau</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La brebis Dolly (1996) est née du transfert du noyau d'une cellule de mamelle dans un ovule énucléé. Que prouve cette expérience sur le génome ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'expérience</b> : noyau d'une cellule DIFFÉRENCIÉE (mamelier adulte : pas une cellule souche) + ovule sans noyau ⟹ embryon ⟹ brebis complète.</div><div class=\"etu\"><b>Étape 2</b> — <b>La preuve</b> : le noyau d'une cellule spécialisée contient TOUS les gènes nécessaires pour reconstruire un individu entier : l'ADN n'a pas été perdu ni définitivement figé pendant la différenciation.</div><div class=\"etu\"><b>Étape 3</b> — <b>La conclusion</b> : la différenciation est donc une affaire d'EXPRESSION (gènes éteints/allumés), pas de gènes supprimés : chaque cellule détient le plan complet : elle n'en lit que sa spécialité.</div></div></details>\n<h3>2. Régulation de l'expression : allumer/éteindre les gènes</h3>\n<div class=\"tip\"><b>Transcription contrôlée :</b> des <b>facteurs de transcription</b> (protéines) se fixent sur les <b>promoteurs/régulateurs</b> des gènes : ils recrutent (ou bloquent) l'ARN polymérase : gène ALLUMÉ ou ÉTEINT.<br><b>Répression/épissage :</b> les histones (enroulement de l'ADN) rendent certaines zones illisibles ; l'épissage alternatif permet à UN gène de produire PLUSIEURS protéines.<br>Résultat : des milliers de types cellulaires avec un seul génome.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — une seule hormone, des réponses différentes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'adrénaline accélère le cœur, dilate les bronches et ferme les vaisseaux digestifs. Même molécule, trois effets opposés : comment ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le récepteur décide</b> : l'adrénaline circule partout, mais seules les cellules portant SON récepteur répondent : cœur (récepteur β1 : accélère), bronches (β2 : dilate), digestif (α : resserre).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le patrimoine d'expression</b> : chaque type cellulaire EXPRISE un jeu de gènes qui lui est propre (ses récepteurs, ses enzymes) : c'est l'expression qui « programme » la sensibilité de chaque organe.</div><div class=\"etu\"><b>Étape 3</b> — <b>Généralisation</b> : hormones, neurotransmetteurs, facteurs de croissance : le message est BANAL (une molécule), la réponse est LOCALE (le répertoire exprimé) : la régulation de l'expression est le véritable langage du corps : une même consigne, des métiers différents.</div></div></details>\n<h3>3. Mutations, variantes et ingénierie génétique</h3>\n<div class=\"tip\"><b> Mutation</b> (substitution, insertion, délétion) : source de <b>polymorphisme</b> (variantes normales : la couleur des yeux) ou de <b>maladies</b> (drépanocytose, mucoviscidose, cancer : proto-oncogènes hyperactivés).<br><b>Thérapie génique :</b> introduire une version saine d'un gène (ex. : ADA-SCID : « enfants-bulles ») : <b>CRISPR-Cas9</b> : les « ciseaux moléculaires » : couper l'ADN à un endroit choisi pour corriger, insérer, désactiver (prix Nobel 2020) : un outil puissant qui pose des questions éthiques (embryons, transmission à la descendance).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — CRISPR en 3 étapes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire comment CRISPR-Cas9 corrige une mutation responsable d'une maladie génétique.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le GPS</b> : on fabrique un ARN guide dont la séquence est COMPLÉMENTAIRE de la zone à corriger (repérage : la séquence cible existe une seule fois dans le génome).</div><div class=\"etu\"><b>Étape 2</b> — <b>La coupe</b> : l'enzyme Cas9 suit l'ARN guide et COUPE les deux brins à l'endroit exact désigné.</div><div class=\"etu\"><b>Étape 3</b> — <b>La réparation</b> : la cellule répare la coupure : soit avec le modèle fourni (correction : HDR), soit de façon approximative (désactivation d'un gène : NHEJ : utile pour éteindre un récepteur viral) : Applications : drépanocytose (essais concluants), immunité au VIH : et la question éthique : où s'arrête la correction ?</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> toutes les cellules ont (presque) le même génome : la différenciation est l'expression DIFFÉRENTIELLE des gènes, pas une perte d'ADN ; promotteur = interrupteur, facteur de transcription = doigt sur l'interrupteur ; mutation ≠ toujours maladie (la plupart sont neutres : elles fondent le polymorphisme) ; CRISPR coupe : la cellule répare (c'est la réparation qui est dirigée).</div>"},
{"id": "risques-geologiques", "theme": "La tectonique et les risques géologiques (1re)", "niveau": "1re", "titre": "La tectonique et les risques géologiques", "cours": "<div class=\"cours-head\"><h2>La tectonique et les risques géologiques</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Aléa, exposition, vulnérabilité : le trio du risque</h3>\n<div class=\"tip\"><b>Aléa</b> = le phénomène naturel (séisme de magnitude X, éruption, glissement) : il est INÉVITABLE. <b>Enjeux</b> = ce qui est exposé (habitants, bâtiments, infrastructures). <b>Vulnérabilité</b> = la fragilité de ces enjeux (construction parasismique ? alerte ? culture du risque ?).<br><b>Risque = aléa × enjeux × vulnérabilité</b> : on ne peut pas empêcher l'aléa : on peut réduire enjeux (zonage) et vulnérabilité (normes, éducation) : c'est TOUTE la politique de prévention.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — même magnitude, morts très différentes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Haïti 2010 : magnitude 7, ~200 000 morts. Chili 2010 : magnitude 8,8 (500× plus d'énergie), ~500 morts. Expliquer l'écart.</div><div class=\"etu\"><b>Étape 1</b> — <b>La construction</b> : Haïti : bâtiments non parasismiques, densité élevée : la vulnérabilité maximale. Chili : normes parasismiques strictes (pays pionnier, « code sismique ») : la vulnérabilité réduite.</div><div class=\"etu\"><b>Étape 2</b> — <b>La préparation</b> : Chili : exercices d'évacuation, alerte tsunami rodée, mémoire du séisme de 1960 (le plus fort enregistré : 9,5) : une culture du risque transmise.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon</b> : l'ALÉA chilien était PLUS fort, le RISQUE bien plus faible : le risque n'est pas une fatalité naturelle : il se construit (ou se déconstruit) socialement : la prévention est la variable que nous maîtrisons.</div></div></details>\n<h3>2. Séismes et volcans : prévoir, surveiller</h3>\n<div class=\"tip\"><b>Séismes :</b> la contrainte s'accumule le long des failles (plaques bloquées par friction) : rupture brutale : ondes. <b>Magnitude</b> (énergie : Mw, échelle LOGARITHMIQUE : +1 = ×30 en énergie) ≠ <b>intensité</b> (effets ressentis en un lieu).<br><b>Prévision</b> : impossible à court terme (date) : la prévision sismique reste un horizon : mais on sait localiser les zones, estimer les probabilités (cartes d'aléa), bâtir parasismique.<br><b>Volcans :</b> signes précurseurs (essaims de séismes, déformation, gaz) : l'observation permet d'anticiper les éruptions (Pinatubo 1991 : 60 000 évacués : un succès de l'observation).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la magnitude est logarithmique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un séisme de magnitude 7 libère combien de fois plus d'énergie qu'un magnitude 5 ? Pourquoi la différence magnitude/intensité ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le calcul</b> : +1 magnitude ≈ ×30 en énergie : de 5 à 7 : ×30 ×30 = <b>×900</b> d'énergie.</div><div class=\"etu\"><b>Étape 2</b> — <b>Magnitude</b> : UNE valeur par séisme : l'énergie libérée à la source (mesurée sur les sismogrammes). <b>Intensité</b> : une CARTE : les effets (secousse, dégâts) décroissants avec la distance (échelle macrosismique).</div><div class=\"etu\"><b>Étape 3</b> — <b>Application</b> : un « petit » séisme proche et superficiel peut être plus destructeur (intensité locale élevée) qu'un grand séisme lointain : la communication grand public sur « l'échelle de Richter » confond les deux : les cartes d'aléa utilisent la magnitude-probabilité (PEG : période de retour).</div></div></details>\n<h3>3. Tsunamis, glissements et risques gravitaires</h3>\n<div class=\"tip\"><b>Tsunami</b> : déplacement brusque d'une colonne d'eau (séisme sous-marin, glissement, éruption) : en pleine mer : faible hauteur, vitesse ~800 km/h : près des côtes : la vague ralentit et se DRESSE (5-30 m). Système d'alerte du Pacifique : détecter (marégraphes, DART), modéliser, alerter (sirènes : le Japon : minutes).<br><b>Glissements, effondrements</b> : gravité + eau + roche altérée : surveillance par inclinomètres, radar, cartographie des aléas : le risque gravitaire est le plus meurtrier en France (séismes modérés mais montagnes habitées).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la mémoire des côtes japonaises</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Les « pierres du tsunami » (demandes gravées : « ne pas construire en dessous ») datent de séismes anciens. Pourtant Fukushima 2011 a submergé des digues de 6-10 m. Analyser.</div><div class=\"etu\"><b>Étape 1</b> — <b>La mémoire matérielle</b> : les pierres marquent la limite atteinte par les tsunamis de 1896 et 1933 (~30 m) : un savoir populaire codé dans le paysage.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'oubli économique</b> : la côte urbanisée (digue de 6-10 m) : l'implantation s'est faite sur la BASE du 20e siècle, pas du pire historique : l'oubli du précédent est une décision de vulnérabilité.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon</b> : 2011 : vague ~15-40 m : la digue fut franchie (nucléaire submergé) : la protection « dure » se calcule toujours sur un scénario choisi : l'éducation au risque, la mémoire (pierres, exercices, repères de crue) et le zonage sont des protections COMPLÉMENTAIRES : la digue seule invite à l'oubli (effet paradoxe : sécurité perçue ⟹ urbanisation ⟹ risque accru).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> magnitude (énergie, UNE valeur, échelle log) ≠ intensité (effets, CARTE, décroît avec la distance) ; on ne sait PAS prédire la date d'un séisme (prévention = construire + s'exercer + alerter) ; « échelle ouverte » de magnitude : pas de maximum à 10 ; le risque n'est pas l'aléa : il se réduit côté humain.</div>"},
{"id": "genetique-evolution", "theme": "La génétique et l'évolution (Terminale)", "niveau": "Terminale", "titre": "La génétique et l'évolution", "cours": "<div class=\"cours-head\"><h2>La génétique et l'évolution</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Dérive génétique et sélection : les moteurs de l'évolution</h3>\n<div class=\"tip\"><b>Évolution = changement des fréquences d'allèles</b> dans une population au fil des générations. Deux moteurs principaux :<br><b>La sélection naturelle</b> (directionnelle) : les allèles qui avantagent survie/reproduction deviennent plus fréquents (adaptation : papillons, antibio-résistances).<br><b>La dérive génétique</b> (aléatoire) : dans une PETITE population, le hasard des reproductions fait fluctuer les fréquences (des allèles disparaissent sans « raison » adaptative) : effet de fondation, goulots d'étranglement.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le goulot d'étranglement du guépard</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Les guépards actuels sont quasi des clones génétiques (greffes acceptées entre individus !). Reconstituer l'histoire et distinguer sélection/dérive.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le goulot</b> : il y a ~10 000-12 000 ans, la population a été réduite à quelques individus (changement climatique ?) : la diversité génétique a été DÉCAPITÉE par le hasard (dérive) : ce n'était PAS une sélection.</div><div class=\"etu\"><b>Étape 2</b> — <b>La conséquence</b> : les descendants actuels portent un échantillon appauvri du patrimoine ancestral : homozygotie élevée, fertilité réduite, sensibilité aux maladies : la variabilité, matière première de l'adaptation future, manque.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon</b> : la dérive est un moteur SANS adaptation (perte aléatoire) : la sélection TRIE (adaptation), la dérive LANCE LES DÉS (perte) : dans les petites populations (espèces menacées !), la dérive domine : c'est l'argument scientifique des programmes de conservation (maintenir des effectifs grands ET connectés).</div></div></details>\n<h3>2. Mesurer l'évolution : équilibre de Hardy-Weinberg</h3>\n<div class=\"tip\">Dans une population grande, panmictique, sans mutation ni sélection ni dérive ni migration : les fréquences d'allèles sont STABLES (p et q, p+q=1) : les fréquences de génotypes suivent <b>p² : 2pq : q²</b>.<br>Un ÉCART mesuré ⟹ une force évolutive agit (sélection : avantage des hétérozygotes du paludisme : drépanocytose !). C'est l'OUTIL de détection de l'évolution.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'exception drépanocytose/paludisme</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> En Afrique de l'Ouest, la fréquence de l'allèle S (drépanocytose) atteint 10-20 %, alors que SS est létal. Expliquer avec Hardy-Weinberg et l'avantage hétérozygote.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le paradoxe</b> : si l'allèle S est désavantageux (SS meurt avant de se reproduire), la sélection devrait l'éliminer : or il se maintient ÉLEVÉ : l'équilibre de Hardy-Weinberg est violé : une force le maintient.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'avantage hétérozygote</b> : les hétérozygotes AS (porteurs sains) résistent MIEUX au paludisme (l'hémoglobine S gêne le parasite) : dans les zones impaludées, AS a un avantage sur AA.</div><div class=\"etu\"><b>Étape 3</b> — <b>La sélection d'équilibre</b> : l'allèle S est défavorable à l'état homozygote mais favorable à l'état hétérozygote : fréquence d'équilibre proportionnelle au coût/bénéfice : c'est un POLYMORPHISME ÉQUILIBRÉ, la signature génétique de la coévolution hôte-parasite : l'évolution se lit dans les statistiques génétiques des populations.</div></div></details>\n<h3>3. Spéciation et phylogénie</h3>\n<div class=\"tip\"><b>Spéciation</b> : isolement (géographique puis reproductif) ⟹ divergence. <b>Phylogénie</b> : l'arbre qui traduit la parenté (caractères partagés, ADN) : un NŒUD = un ancêtre commun ; la LONGUEUR des branches peut coder le temps.<br>La lignée humaine : un buisson (Australopithèque, Paranthrope, Homo habilis, erectus, Néandertal, Denisova, Sapiens) : toutes ces espèces sont COUSINES à des degrés divers, et Sapiens est le seul représentant actuel du genre Homo.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire un arbre phylogénétique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur un arbre, le chimpanzé et l'homme partagent un nœud plus récent que celui qu'ils partagent avec le gorille. Que dit ce schéma, et que NE dit-il PAS ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Ce qu'il dit</b> : homme et chimpanzé ont un ancêtre commun PLUS RÉCENT (branche commune il y a ~7 Ma) : ils sont plus proches parents entre eux qu'avec le gorille.</div><div class=\"etu\"><b>Étape 2</b> — <b>Ce qu'il ne dit PAS</b> : l'ordre des « branches » latérales ne montre PAS une progression : l'homme n'est pas « au sommet » : l'arbre n'est PAS une échelle : chaque espèce actuelle est également « évoluée » (elle a survécu à la même durée de sélection depuis le nœud).</div><div class=\"etu\"><b>Étape 3</b> — <b>La méthode</b> : on construit l'arbre par caractères partagés DÉRIVÉS (synapomorphies : ADN, anatomie) : plus les caractères nouveaux partagés sont nombreux, plus le nœud est récent : l'arbre est une HYPOTHÈSE testable, améliorée par chaque nouveau génome séquencé.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la dérive est aléatoire (elle ne fabrique pas d'adaptation) : la sélection est directionnelle ; Hardy-Weinberg est un MODÈLE NUL (une violation indique une force évolutive, pas une erreur) ; un arbre phylogénétique ne se lit pas de gauche à droite comme une échelle ; l'individu n'évolue pas : la POPULATION évolue (changement de fréquences).</div>"},
{"id": "immunite-adaptative", "theme": "L'immunité adaptative et la vaccination (Terminale)", "niveau": "Terminale", "titre": "L'immunité adaptative et la vaccination", "cours": "<div class=\"cours-head\"><h2>L'immunité adaptative et la vaccination</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'immunité adaptative : coopération cellulaire</h3>\n<div class=\"tip\"><b>Le trio</b> : <b>LT4</b> (helpers) : coordonnateurs (interleukines) : <b>LB</b> ⟶ plasmocytes ⟶ anticorps (immunité humorale) : <b>LTc</b> ⟶ lyse des cellules infectées (immunité cellulaire).<br><b>Diversité des récepteurs</b> : recombinaison VDJ (au hasard) : des centaines de millions de spécificités : la sélection clonale ne fait que TRIER. <b>Présentation de l'antigène</b> : par les cellules dendritiques (CMH-II ⟶ LT4) et par toute cellule infectée (CMH-I ⟶ LTc).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la recombinaison VDJ</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment ~20 000 gènes suffisent-ils à produire ~10¹¹ récepteurs différents d'anticorps ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le lego génétique</b> : les gènes des anticorps existent en morceaux (V, D, J : banques de ~40, 25, 6 variantes) : chaque LB en ASSEMBLE un au hasard (recombinaison somatique, à la fabrication du LB, dans la moelle).</div><div class=\"etu\"><b>Étape 2</b> — <b>La combinatoire</b> : 40 × 25 × 6 ≈ 6000 combinaisons lourdes × diversité légère × jonctions imprécises (addition/suppression de lettres) ⟶ ~10¹¹ : un arsenal colossal, fabriqué AVANT toute rencontre.</div><div class=\"etu\"><b>Étape 3</b> — <b>La conséquence</b> : le système immunitaire est PRÉ-ÉQUIPÉ contre des antigènes qu'il n'a jamais vus (et même des antigènes synthétiques futurs !) : la sélection clonale (tri) + les hypermutations somatiques (affinage pendant la réponse : les anticorps s'améliorent en quelques jours) : l'immunité adaptative EST une évolution darwinienne en accéléré dans le corps.</div></div></details>\n<h3>2. Vaccination : stratégie et société</h3>\n<div class=\"tip\"><b>Vaccin :</b> faire construire la mémoire immunitaire SANS la maladie : antigènes (tués, atténués, sous-unités, conjugués, ARNm), adjuvants (amplifient la réponse), rappels (entretien de la mémoire).<br><b>Immunité collective</b> : au-delà d'un seuil de vaccinés, le virus ne circule plus : les non-vaccinés (nourrissons, immunodéprimés) sont protégés INDIRECTEMENT. Seuil ≈ 1 - 1/R₀ (rougeole R₀~15 ⟹ ~93 %) : c'est la dimension SOCIALE de la vaccination.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le vaccin pneumocoque conjugué</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le vaccin contre le pneumocoque cible quelques sérotypes (sur ~90) : depuis la vaccination, les otites sont dues à d'autres sérotypes. Analyser ce phénomène.</div><div class=\"etu\"><b>Étape 1</b> — <b>La réussance</b> : les sérotypes vaccinaux ont quasi disparu des infections (les enfants vaccinés ne les portent plus) : la maladie ciblée recule spectaculairement.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le remplacement</b> : les sérotypes non couverts OCCUPENT la niche libérée (dans le nez des enfants) : les otites baissent moins que les méningites : c'est le « vaccine escape » (sérotypes) : l'évolution darwinienne s'applique aussi aux bactéries.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon</b> : un vaccin est une PRESION de sélection : les pathogènes répondent (variantes d'échappement du COVID : le vaccin se met à jour) : la vaccination n'est pas un acte unique : c'est une CO-ÉVOLUTION gérée, un bras de fer dynamique avec le monde microbien.</div></div></details>\n<h3>3. VIH, immunité et évasion microbienne</h3>\n<div class=\"tip\"><b>VIH</b> : cible les LT4 (CD4) ⟹ effondrement de la coordination ⟹ SIDA : mutation rapide (pas de correction : ~1 mutation par replication !) ⟹ escape aux anticorps : la trithérapie bloque la réplication (charge indétectable : I=I).<br><b>Autres stratégies d'évasion</b> : antigenic drift (grippe), variation antigénique (trypanosomes), biofilms (résistance aux antibiotiques), se déguiser en « soi » (fœtus, certaines tumeurs).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi pas (encore) de vaccin contre le VIH ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Nous avons vacciné la variole, la polio, le COVID... mais pas le VIH (40 ans d'efforts). Quelles propriétés du virus expliquent cet échec ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La mutation fulgurante</b> : l'enzyme du VIH (transcriptase inverse) ne corrige pas ses erreurs : la diversité virale dans UN patient dépasse celle de la grippe mondiale en une année : les anticorps appris sont toujours en retard.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'attaque du système lui-même</b> : le virus détruit les LT4, les cellules qui DEVRAIENT apprendre à le combattre : le professeur est l'otage : la réponse vaccinale n'a pas de prof pour la diriger.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'intégration et la latence</b> : l'ADN viral s'insère dans nos chromosomes (réservoirs dormants) : invisible au système : aucune exposition à l'antigène : les pistes actuelles (anticorps larges, PrEP, essais d'ARNm) attaquent le problème autrement : la prévention non vaccinale a fait chuter l'épidémie : dépistage + PrEP + traitement.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la diversité des anticorps précède l'antigène (sélection clonale) ; CMH-I ⟶ LTc (toutes cellules) / CMH-II ⟶ LT4 (cellules présentatrices) : ne pas croiser ; immunité collective = protection INDIRECTE des non-répondants : elle exige un seuil, pas une majorité vague ; le vaccin entraîne : il ne contient pas les anticorps.</div>"},
{"id": "climat-histoire", "theme": "Le climat : histoire et avenir (Terminale)", "niveau": "Terminale", "titre": "Le climat : histoire et avenir", "cours": "<div class=\"cours-head\"><h2>Le climat : histoire et avenir</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'histoire du climat : archives et forçages</h3>\n<div class=\"tip\"><b>Archives</b> : carottes de glace (CO₂, températures : 800 000 ans), sédiments (foraminifères : isotopes ¹⁸O), anneaux d'arbres, traces de glaciers.<br><b>Forçages naturels</b> : paramètres astronomiques de <b>Milanković</b> (excentricité ~100 000 ans, obliquité ~41 000, précession ~23 000 ans : les cycles glaciaires du Quaternaire), activité solaire, volcanisme : ils expliquent les entrées/sorties de glaciations : le rythme, pas l'excès actuel.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le cycle de Milanković et les glaciations</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi les glaciations reviennent-elles environ tous les 100 000 ans ? Et pourquoi ce rythme N'EXPLIQUE PAS le réchauffement actuel ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le mécanisme</b> : l'orbite et l'inclinaison terrestres oscillent : la quantité de soleil reçu aux hautes latitudes en ÉTÉ varie : moins d'ensoleillement estival ⟹ la neige de l'hiver ne fond pas ⟹ la glace s'accumule : glaciation (rétroactions : albédo, CO₂ océanique).</div><div class=\"etu\"><b>Étape 2</b> — <b>La vérification</b> : les archives (δ¹⁸O, CO₂ des glaces) montrent 8 cycles sur 800 000 ans, au rythme calculé : la théorie est VALIDÉE.</div><div class=\"etu\"><b>Étape 3</b> — <b>La limite</b> : Milanković travaille à l'échelle de DIZAINES DE MILLÉNAIRES : le réchauffement actuel est ×100 PLUS RAPIDE : et les paramètres astronomiques actuels prédisaient une légère... STABILITÉ (voire refroidissement) : la cause actuelle est ailleurs : les GES anthropiques.</div></div></details>\n<h3>2. Le réchauffement actuel : attribué aux activités humaines</h3>\n<div class=\"tip\"><b>Attribution</b> : +1,2 °C depuis 1850 : coincidences impossibles : le CO₂ (fossile : signature isotopique du carbone ancien !) monte AVEC la courbe des émissions ; l'océan (90 % de l'excès de chaleur) réchauffe (pas le Soleil : la stratosphère se REFROIDIT pendant que la surface se réchauffe : c'est la signature des GES, pas d'un soleil plus fort).<br>Le GIEC (IPCC) : 6 rapports, consensus : l'influence humaine est « sans équivoque » : projections : +2 à +5 °C selon les scénarios d'émissions (SSP).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la preuve isotopique du carbone fossile</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment prouve-t-on que le CO₂ en excès vient des combustibles fossiles et non des volcans ou des océans ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'empreinte du très vieux</b> : le carbone fossile est dépourvu de ¹⁴C (isotope radioactif éteint après des millions d'années) et appauvri en ¹³C : le CO₂ atmosphérique actuel montre exactement ces deux signatures.</div><div class=\"etu\"><b>Étape 2</b> — <b>La comptabilité</b> : les volcans émettent ~0,3 Gt C/an : nous, ~10 Gt (30× : le volcanisme est marginal) : l'océan, lui, est un PUITS (il absorbe) : la répartition verticale du réchauffement (surface ⟹ profondeurs) colle à un forçage GES.</div><div class=\"etu\"><b>Étape 3</b> — <b>La convergence</b> : physique de base (radiatif : spectroscopie du CO₂ connue depuis Tyndall, 1859), isotopes, budgets, refroidissement stratosphérique, empreintes spatiales : toutes les lignes d'enquête indépendantes convergent : c'est le sens du consensus du GIEC (signature de « l'influence humaine sans équivoque »).</div></div></details>\n<h3>3. Futurs : scénarios, impacts, solutions</h3>\n<div class=\"tip\"><b>Scénarios d'émissions (SSP)</b> : de la trajectoire sobre (SSP1 : +1,5-2 °C) au « business as usual » (SSP5 : +4-5 °C : trajectoire actuelle ≈ +2,5-3 °C). <b>Impacts</b> : extrêmes (canicules ×5-10 déjà), montée des mers (projections 0,5-1 m en 2100 : + mètres à long terme si les calottes décrochent), déplacements d'espèces et de rendements.<br><b>Réponses</b> : atténuation (décarbonation : sobriété + renouvelables + nucléaire + puits), <b>adaptation</b> (villes fraîches, agriculture, côtes), géo-ingénierie (discutée, risquée : dernier recours discuté, pas une solution). Le carbone budgété restant est le chiffre politique central.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — décoder une projection</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Que signifie une projection « +2,7 °C en 2100 » avec une « plage d'incertitude +2,1 à +3,5 » ? Comment la décoder honnêtement ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La médiane</b> : +2,7 °C suppose les engagements actuels TENUS : c'est la trajectoire « promesses » (pas le pire : SSP5-8,5 : ni le mieux : SSP1).</div><div class=\"etu\"><b>Étape 2</b> — <b>La plage</b> : elle vient de la physique (rétroactions des nuages, sensibilité : ±0,5 °C) : elle n'inclut PAS les surprises géophysiques (décrochage des calottes : queues de distribution fatales) : la science est honnête sur ce qu'elle sait et ce qu'elle ignore.</div><div class=\"etu\"><b>Étape 3</b> — <b>La décision sous incertitude</b> : les projections ne sont pas des prophéties : ce sont des CONSÉQUENCES DE NOS CHOIX : chaque dixième de degré évité = impacts évités : la bonne question n'est pas « quel chiffre ? » mais « quelle trajectoire CHOISISONS-NOUS ? » : c'est un enjeu de décision dans l'incertain, pas de divination.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> Milanković explique les glaciations lentes, PAS le réchauffement rapide actuel ; « le climat a toujours changé » est VRAI mais la VITESSE actuelle est inédite ; le Soleil ne peut pas expliquer le refroidissement simultané de la stratosphère ; les projections sont conditionnelles aux scénarios d'émissions : pas des prophéties.</div>"},
{"id": "ecosystemes-humanite", "theme": "Les écosystèmes et l'espèce humaine (Terminale)", "niveau": "Terminale", "titre": "Les écosystèmes et l'espèce humaine", "cours": "<div class=\"cours-head\"><h2>Les écosystèmes et l'espèce humaine</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'espèce humaine, force géologique</h3>\n<div class=\"tip\"><b>Anthropocène</b> (concept discuté formellement) : l'humain a transformé ~75 % des terres émergées (agriculture, villes, routes), les océans (surpêche, plastiques), l'atmosphère (CO₂), les cycles (azote doublé par les engrais !) : une espèce devenue force géologique à l'échelle d'un siècle.<br>Le coefficient <b>empreinte écologique</b> compare nos prélèvements à la biocapacité : depuis les années 1970 : dépassement (~1,7 Terre serait nécessaire) : le « jour du dépassement » tombe plus tôt chaque année.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le cycle de l'azote bouleversé</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'humanité a plus que DOUBLÉ la fixation d'azote atmosphérique (engrais de synthèse, Haber-Bosch, légumineuses cultivées). Quelles conséquences en cascade ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'injection</b> : le procédé Haber-Bosch (~1913) transforme N₂ atmosphérique en ammoniac : la moitié de l'azote de notre alimentation vient de ces engrais : sans lui, ~la moitié de l'humanité ne serait pas nourrie.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le débordement</b> : l'azote lessivé (nitrates) fuit vers rivières et côtes : eutrophisation : proliférations d'algues : la décomposition épuise l'O₂ : « zones mortes » (Golfe du Mexique : ~20 000 km² chaque été) : nitrates dans l'eau potable, N₂O (GES) émis.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon</b> : un cycle planétaire (l'azote) a été modifié à l'échelle d'un siècle, plus vite que le carbone en proportion relative : c'est l'un des 9 « limites planétaires » franchies (Rockström) : le problème n'est pas la technique MAIS son dosage : agriculture de précision, rotations, réduction des pertes.</div></div></details>\n<h3>2. Services écosystémiques et dépendance</h3>\n<div class=\"tip\"><b>Services</b> : approvisionnement (aliments, bois, eau), régulation (climat, inondations, pollinisateurs, épuration), culture (paysages, récréation), soutien (sols, cycles).<br>Le rapport <b>IPBES</b> (2019) : ~1 million d'espèces menacées : les taux d'extinction « sans précédent depuis 66 Ma » : les causes directes par ordre : <b>changement d'usage des terres (n°1)</b>, exploitation directe, climat, pollution, espèces invasives.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'effondrement des insectes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Les études (dont le « Krefeld study » sur 27 ans de pièges) montrent des pertes de 50-80 % de biomasse d'insectes volants. Pourquoi EST-CE un problème pour l'humanité ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La base des chaînes</b> : les insectes nourrissent oiseaux, poissons, batraciens : leur effondrement remonte la chaîne (perte de ~50 % des oiseaux des campagnes françaises en 30 ans).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le service pollinisation</b> : ~75 % des cultures (et ~85 % des plantes sauvages) dépendent de pollinisateurs : ~150-500 Mds $/an : sans eux, rendements effondrés.</div><div class=\"etu\"><b>Étape 3</b> — <b>Les causes cumulées</b> : pesticides (néonicotinoïdes : neurotoxiques pour les abeilles), herbicides (les « mauvaises herbes » nourrissent les insectes : champs « propres » = déserts), urbanisation, lumières nocturnes : la bonne nouvelle : les insectes se rétablissent VITE quand on cesse (interdiction des néonics : rebonds mesurés) : c'est l'un des enjeux les plus réparables.</div></div></details>\n<h3>3. Agir : conservation, restauration, sobriété</h3>\n<div class=\"tip\"><b>Protection</b> : aires protégées (30×30 : 30 % des terres et mers d'ici 2030, objectif COP biodiversité Montréal 2022), corridors, espèces emblématiques ET ordinaires (la biodiversité « commune » décline aussi !).<br><b>Restauration</b> : renaturation de rivières, replantation, réensauvagement (loups, castors : ingénieurs d'écosystèmes), agriculture (agroécologie, haies, surfaces enherbées).<br><b>Sobriété</b> : réduire l'empreinte (alimentation, consommation) : le levier individuel collectif.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le retour du loup : le débat écologique complet</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le loup est revenu en France (1992) : ~1000 individus. Présenter les arguments scientifiques POUR (cascade trophique) et la gestion des conflits.</div><div class=\"etu\"><b>Étape 1</b> — <b>La cascade</b> : prédateur du cerf : les populations de cerfs se régulent (moins de dégâts aux jeunes arbres) : les corridors forestiers se rétablissent : oiseaux, castors suivent (Yellowstone 1995 : le modèle documenté du « trophic cascade »).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le conflit</b> : prédation sur les troupeaux (montagne : élevage extensif) : le monde rural vit la contrainte pendant que la société urbaine vote « pour » : enjeu de justice spatiale et de politique publique.</div><div class=\"etu\"><b>Étape 3</b> — <b>La gestion</b> : mesures agro-environnementales (chiens de protection, bergers, clôtures : 80 % de réduction des attaques là où bien déployées), protocoles de tir (encadrement, quotas encadrés (Convention de Berne)) : la coexistence est un TRAVAIL technique et social : l'écologie appliquée n'est pas un combat de tracts : c'est de l'ingénierie de compromis.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la cause n°1 d'érosion = le changement d'usage des terres (avant le climat, pour l'instant) ; « l'espèce emblématique » séduit mais la biodiversité ORDINAIRE (insectes, oiseaux communs) s'effondre aussi ; l'empreinte écologique n'est pas une mesure physique exacte : c'est un indicateur de communication (pour des mesures physiques précises : limites planétaires, IPBES) ; protéger sans restaurer ne suffit pas (les aires protégées subissent aussi le climat).</div>"},
{"id": "homeostasie-sante", "theme": "Le corps humain et l'homéostasie (Terminale)", "niveau": "Terminale", "titre": "Le corps humain et l'homéostasie", "cours": "<div class=\"cours-head\"><h2>Le corps humain et l'homéostasie</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'homéostasie : maintenir la constante</h3>\n<div class=\"tip\"><b>Homéostasie</b> : le maintien des paramètres internes dans une FOURCHETTE (température ~37 °C, glycémie ~1 g/L, pH sanguin ~7,4, pression artérielle...) malgré les variations externes.<br><b>Schéma de régulation</b> (réflexe) : <b>capteurs</b> (mesurent l'écart à la consigne) ⟶ <b>centre d'intégration</b> (comparateur, souvent hypothalamus/medulla) ⟶ <b>effecteurs</b> (réponse correctrice) ⟶ <b>rétroaction négative</b> : la correction s'arrête quand le paramètre revient : c'est un thermostat biologique.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la régulation de la température</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un skieur se refroidit (-10 °C) puis entre dans un chalet surchauffé. Décrire la double régulation.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le froid</b> : thermorécepteurs ⟶ hypothalamus ⟳ effeteurs : frissons (muscles : production de chaleur), vasoconstriction périphérique (garde le sang au centre), piloérection (poils : isolant ancestral : chair de poule !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le chaud</b> : vasodilatation (la chaleur rayonne), sueur (évaporation : refroidissement puissant : ~580 kcal/L !), halètement canin (les chiens : évaporation linguale).</div><div class=\"etu\"><b>Étape 3</b> — <b>La rétroaction</b> : dès que 37 °C est atteint, les réponses s'arrêtent (rétroaction négative : le retour à la consigne coupe la commande) : si le système échoue : hypothermie (<35 °C) ou hyperthermie (coup de chaleur : sueur insuffisante : urgence : la régulation a des LIMITES physiques).</div></div></details>\n<h3>2. La glycémie : le couple insuline/glucagon</h3>\n<div class=\"tip\"><b>Consigne : glycémie ~1 g/L</b> (0,8-1,2). Après un repas : glycémie ↑ ⟹ <b>insuline</b> (cellules ß du pancréas) : glucose entre dans les cellules (muscle, gras) et stocké (glycogène, graisse) : glycémie ↓.<br>Jeûne : glycémie ↓ ⟹ <b>glucagon</b> (cellules α) : libère le glucose du glycogène hépatique (glycogénolyse) : glycémie ↑. <b>Deux hormones antagonistes</b> = régulation fine : le cerveau (qui ne stocke rien) est garanti en glucose en permanence.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le diabète : quand la boucle casse</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparer les mécanismes du diabète de type 1 et de type 2, et expliquer les complications communes.</div><div class=\"etu\"><b>Étape 1</b> — <b>Type 1</b> : les cellules ß sont DÉTRUITES (auto-immunité) : zéro insuline : le glucose reste hors des cellules (hyperglycémie, cellules « affamées » qui brûlent les graisses : cétose, amaigrissement) : traitement : insuline injectée (boucle artificielle).</div><div class=\"etu\"><b>Étape 2</b> — <b>Type 2</b> : l'insuline est produite mais les cellules y RÉSISTENT (obésité, sédentarité, gènes : le récepteur répond mal) : le pancréas s'épuise à compenser : le bilan s'aggrave : traitements : mode de vie, metformine, puis insuline.</div><div class=\"etu\"><b>Étape 3</b> — <b>Les complications</b> : l'excès de glucose « caramélise » les vaisseaux (rétine : cécité : reins : dialyse : nerfs : neuropathie : artères : infarctus, AVC) : c'est la CHRONICITÉ de l'hyperglycémie qui détruit, d'où l'enjeu du contrôle au long cours (HbA1c : la mémoire de la glycémie sur 3 mois).</div></div></details>\n<h3>3. Pression, pH, hydratation : d'autres boucles</h3>\n<div class=\"tip\"><b>Pression artérielle</b> : barorécepteurs ⟹ medulla ⟹ cœur (rythme) et vaisseaux (vasoconstriction/dilatation) + hormones (rénine-angiotensine-aldostérone : rétention d'eau/sel).<br><b>pH sanguin</b> (~7,4, fourchette vitale 7,0-7,8) : tampon bicarbonate + respiration (le CO₂ expiré) + reins : un pH déplacé = enzymes hors service.<br><b>Hydratation/osmose</b> : soif (hypothalamus) + ADH (rétention rénale : urines concentrées) : l'alcool inhibe l'ADH (d'où la déshydratation du lendemain).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'effet de l'altitude sur l'homéostasie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> En altitude (moins d'O₂), la respiration s'accélère : le CO₂ (acide) chute : le pH sanguin monte. Comment le corps rétablit-il l'équilibre, et sur quels délais ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le conflit</b> : hyperventiler apporte de l'O₂ MAIS souffle trop de CO₂ : alcalose respiratoire (pH ↑, fourchette vitale dépassée : vertiges, picotements).</div><div class=\"etu\"><b>Étape 2</b> — <b>La compensation rénale</b> : les reins excrètent des bicarbonates (sur 1-3 jours) : le pH revient : c'est la compensation lente : le système respiratoire est rapide, le rénal est précis.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'acclimatation</b> : sur des semaines : EPO (plus de globules rouges : l'hématocrite des montagnards des Andes : ~60 % vs ~45 %), 2,3-DPG (l'hémoglobine relâche l'O₂), densité capillaire musculaire : le corps REPROGRAMME sa consigne : l'homéostasie n'est pas un dogme figé : c'est une négociation adaptative.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> insuline fait DESCENDRE la glycémie (stockage) : glucagon la fait MONTER (déstockage) : ne pas inverser ; la rétroaction est NÉGATIVE (elle corrige : la « positive » emballe : fièvre de l'inflammation : mise à jour de la consigne, pas perte de contrôle) ; la glycémie normale est ~1 g/L (5 mmol/L) : les « valeurs à jeun >1,26 » = diabète ; l'homéostasie a des limites (hyperthermie, hypothermie : la régulation n'est pas magique).</div>"},
{"id": "cellule-vivant", "theme": "La cellule, unité du vivant (6e)", "niveau": "6e", "titre": "La cellule, unité du vivant", "cours": "<div class=\"cours-head\"><h2>La cellule, unité du vivant</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Tout ce qui est vivant est fait de cellules</h3>\n<div class=\"tip\"><b>La cellule</b> est l'unité de structure du vivant : une bactérie = 1 cellule : un humain = ~30 000 milliards de cellules (30 000 000 000 000 !). Il n'existe pas de « demi-cellule » vivante : en deçà, ce n'est plus vivant.<br>Tous les êtres vivants (animaux, végétaux, champignons, bactéries) sont cellulaires : les virus, eux, NE sont PAS des cellules (pas de vie autonome : ils doivent parasiter une cellule).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — observer des cellules au microscope</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On frotte l'intérieur d'une joue avec un coton-tige, on dépose sur une lame, on colore au bleu de méthylène. Que voit-on au microscope (×400) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La préparation</b> : quelques gouttes sur la lame, une goutte de colorant (le bleu rend le noyau visible), une lamelle posée doucement (chasser les bulles).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'observation</b> : des cellules à peu près hexagonales, bien séparées : un noyau bleu foncé au centre : la membrane plasmique borde chaque cellule (elle délimite, c'est la frontière).</div><div class=\"etu\"><b>Étape 3</b> — <b>La conclusion</b> : la joue est faite de cellules (épithéliales) : on n'a PAS vu de « morceaux de joue » plus petits qui seraient vivants : la cellule est la plus petite brique : multiplier le grossissement ne révèle PAS un plus petit vivant.</div></div></details>\n<h3>2. Les organites : les organes de la cellule</h3>\n<div class=\"tip\"><b>Noyau</b> : le chef (il contient l'information génétique : ADN). <b>Membrane plasmique</b> : la frontière (elle contrôle les entrées/sorties). <b>Cytoplasme</b> : le liquide intérieur où baignent les organites. <b>Mitochondries</b> : les centrales (elles libèrent l'énergie). Chez les végétaux en plus : <b>paroi</b> (rigide : le carton), <b>chloroplastes</b> (la photosynthèse), <b>vacuole</b> (le réservoir d'eau).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — cellule animale ou végétale ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Au microscope : une cellule rectangulaire, bien alignée avec ses voisines, contenant des structures vertes. L'autre préparation montre une cellule arrondie avec juste un noyau net. Identifier chaque préparation.</div><div class=\"etu\"><b>Étape 1</b> — <b>La verte</b> : les structures vertes = chloroplastes (chlorophylle : la couleur) : forme rectangulaire et alignée = paroi rigide : c'est une cellule VÉGÉTALE (épinard ou oignon).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'arrondie</b> : pas de vert, pas de forme géométrique (la membrane est souple) : cellule ANIMALE (joue, sang). La différence ne sont PAS les organites de base (noyau, membrane, cytoplasme : les deux les ont !) mais les spécialisations.</div><div class=\"etu\"><b>Étape 3</b> — <b>La logique</b> : la cellule végétale est autonome pour son énergie (photosynthèse ⟹ sucre) : l'animale doit la manger : les organites sont l'équipement qui correspond au mode de vie. Retenir : vert + paroi = végétal.</div></div></details>\n<h3>3. De la cellule à l'organisme : les niveaux d'organisation</h3>\n<div class=\"tip\"><b>Imbrication</b> : <b>atome</b> ⟶ <b>molécule</b> ⟶ <b>organite</b> ⟶ <b>CELLULE</b> ⟶ <b>tissu</b> (cellules identiques ensemble : le muscle) ⟶ <b>organe</b> (le cœur) ⟶ <b>système</b> (cœur + vaisseaux + sang) ⟶ <b>organisme</b>.<br>Une fonction (ex. digérer) mobilise plusieurs organes : la cellule est l'unité de FONCTION aussi : chaque cellule vit (se nourrit, respire, se reproduit), même dans un organisme géant.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — remonter du muscle à la cellule</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Ranger du plus petit au plus grand : cellule musculaire, muscle, fibre musculaire (une cellule géante), molécule de myosine, bras.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le classement</b> : molécule (myosine : la « corde » qui tire) < fibre musculaire (= LA cellule du muscle : longue et géante, mais UNE cellule) < muscle (des milliers de fibres + vaisseaux + nerfs) < bras (muscle + os + peau : un membre).</div><div class=\"etu\"><b>Étape 2</b> — <b>La cohérence</b> : chaque niveau a une fonction qui n'existe pas au niveau d'en dessous : la myosine ne « contracte » rien seule : la fibre, si : le bras lève des charges, pas la fibre isolée.</div><div class=\"etu\"><b>Étape 3</b> — <b>La règle à retenir</b> : quand on zoome sur un vivant, on finit TOUJOURS par rencontrer des cellules : c'est la grande unification de la biologie (Schleiden, Schwann, Virchow, XIXe) : « omnis cellula e cellula » : toute cellule vient d'une cellule.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le noyau n'est pas « le cerveau » (image : il contient l'information) ; la membrane plasmique existe chez TOUTES les cellules (la paroi végétale est EN PLUS, à l'extérieur) ; les virus ne sont pas des cellules ; une cellule géante (fibre musculaire, œuf) reste UNE cellule ; le mot « organite » (dans la cellule) ≠ « organe » (dans l'organisme).</div>"},
{"id": "milieux-vie", "theme": "Les milieux de vie et leurs occupants (6e)", "niveau": "6e", "titre": "Les milieux de vie et leurs occupants", "cours": "<div class=\"cours-head\"><h2>Les milieux de vie et leurs occupants</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Un milieu de vie = caractéristiques + occupants</h3>\n<div class=\"tip\"><b>Milieu de vie</b> : forêt, mare, haie, plage, rivière... Chacun se décrit par ses <b>caractéristiques physiques</b> (lumière, température, humidité, nature du sol) et ses <b>occupants</b> (le peuplement).<br><b>Règle d'or</b> : les occupants sont adaptés aux caractéristiques du milieu : on ne trouve pas les mêmes êtres vivants dans une mare et dans une friche sèche : le peuplement EST une conséquence du milieu.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — peuplement d'une mare</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire le milieu « mare » et relier chaque occupant à une caractéristique.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le milieu</b> : eau douce stagnante, peu profonde, ensoleillée en bordure, fond vaseux riche en débris, oxygène dissous (variable selon la journée).</div><div class=\"etu\"><b>Étape 2</b> — <b>Les occupants et leurs adaptations</b> : larves de libellule (respirent dans l'eau : branchies rectales !) : têtards (queue à nager, mode de vie aquatique avant la métamorphose) : dytiques (patte en rame : nage) : lentilles d'eau (flottent : la surface apporte la lumière) : héron (pattes longues : chasse en eaux peu profondes).</div><div class=\"etu\"><b>Étape 3</b> — <b>La relation</b> : chaque adaptation répond à une caractéristique : enlever l'eau ⟹ le peuplement s'effondre : le milieu COMMANDE, les occupants s'arrangent.</div></div></details>\n<h3>2. Relations entre occupants : chaîne alimentaire</h3>\n<div class=\"tip\"><b>Chaîne alimentaire</b> : producteur (végétal : produit sa matière par photosynthèse) ⟶ consommateur (herbivore) ⟶ consommateur (carnivore) ⟶ décomposeur (champignons, bactéries : recyclent les débris en sels minéraux).<br>Les flèches vont du MANGÉ vers le MANGEUR (herbe ⟹ sauterelle ⟹ lézard ⟹ serpent) : tout revient aux producteurs, qui ont besoin de lumière, d'eau, de sels minéraux et de CO₂.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — construire une chaîne correcte</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Ordre donné en vrac : renard, herbe, lapin. Construire la chaîne et justifier le sens des flèches.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le tri</b> : qui produit ? L'herbe (producteur : photosynthèse). Qui mange qui ? Le lapin mange l'herbe, le renard mange le lapin.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le sens</b> : herbe ⟹ lapin ⟹ renard : chaque flèche se lit « est mangé par » : elle montre aussi le sens de circulation de la MATIÈRE (la chair de l'herbe devient la chair du lapin).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les décomposeurs</b> : quand le renard meurt, vers et bactères le décomposent : la matière retourne au sol : sels minéraux ⟹ nouvelle herbe : le cycle est bouclé (rien ne se perd : la matière circule).</div></div></details>\n<h3>3. Influence de l'Homme : aménager, dégrader, restaurer</h3>\n<div class=\"tip\"><b>Actions humaines</b> : positives (mare aménagée, haie plantée, prairie fauchée tardivement : la biodiversité y gagne), négatives (drainage, remblai, pesticides, urbanisation : le peuplement change ou disparaît).<br>On interprète TOUJOURS un changement de peuplement par un changement du MILIEU : polluer la mare ⟹ les oxygène-dépendants disparaissent, quelques résistants prolifèrent.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la mare polluée : lire le peuplement</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une mare reçoit des engrais lessivés d'un champ. Peu à peu : disparition des libellules et des poissons, prolifération d'algues vertes en surface. Expliquer.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les engrais nourrissent les algues</b> : les nitrates font proliférer les algues (la mare « engraisse ») : l'eau devient opaque verte : la lumière ne passe plus en profondeur.</div><div class=\"etu\"><b>Étape 2</b> — <b>La nuit, ça se gâte</b> : les algues produisent de l'O₂ le jour mais le CONSOMMENT la nuit (respiration) : au petit matin, l'O₂ dissous s'effondre : les poissons et larves sensibles asphyxiés meurent.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon</b> : le peuplement est un INDICATEUR : sans mesure, la disparition des libellules SUFFIT à signaler un dérangement : les biologistes lisent les mares comme des tableaux de bord : la solution : bande enherbée (filtre) entre champ et mare.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> les flèches de la chaîne vont du mangé au mangeur (erreur ultra-fréquente : « lion ⟹ gazelle » est FAUX) ; le producteur n'est jamais « l'animal le plus gros » mais le végétal vert ; les décomposeurs terminent TOUTES les chaînes ; une mare asséchée n'est pas « vide de vie » (le sol garde graines et larves) : le peuplement se lit, il ne se devine pas.</div>"},
{"id": "reproduction-vivants", "theme": "La reproduction des êtres vivants (6e)", "niveau": "6e", "titre": "La reproduction des êtres vivants", "cours": "<div class=\"cours-head\"><h2>La reproduction des êtres vivants</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Devenir adulte : croissance et développement</h3>\n<div class=\"tip\"><b>Tout être vivant naît, grandit (croissance), devient adulte (développement), se reproduit, puis meurt.</b> Chez l'humain : naissance ⟶ croissance ⟶ puberté (le corps devient capable de se reproduire) ⟶ vieillissement.<br>Les jeunes ressemblent aux parents (transmission) MAIS ne sont pas des copies exactes : la reproduction fabrique du NOUVEAU (c'est la base de la diversité du vivant).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le cycle de la grenouille</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire le développement de la grenouille : pourquoi parle-t-on de métamorphose ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Les œufs</b> : pontes en grappes dans l'eau (des centaines d'œufs gélatineux : beaucoup sont mangés : c'est prévu !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le têtard</b> : complètement aquatique (branchies, queue pour nager, bouche à racler les algues) : il grandit en quelques semaines.</div><div class=\"etu\"><b>Étape 3</b> — <b>La métamorphose</b> : pattes puis bras, la queue est résorbée, les poumons remplacent les branchies : l'animal CHANGE DE MILIEU (aquatique ⟶ terrestre) : la bouche s'élargit (insectes). Un seul individu, deux vies : c'est le plus spectaculaire développement du programme.</div></div></details>\n<h3>2. Deux modes de reproduction</h3>\n<div class=\"tip\"><b>Sexuée</b> : deux parents (mâle + femelle) ⟹ gamètes (cellules reproductrices : spermatozoïde, ovule) ⟹ fécondation (fusion : 1 cellule-œuf) : le jeune ressemble aux parents SANS être une copie : c'est le mode des mammifères, des fleurs (pollen ⟹ ovule), etc.<br><b>Asexuée</b> : UN seul parent, sans gamète : le jeune est un CLONE (bouture de géranium, bulbille d'oignon, division de la levure ou de l'amibe, stolon du fraisier). Les deux modes peuvent coexister chez la même espèce.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — bouture et graine : comparer</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On multiplie un rosier par bouture ET par graines. Quelles différences chez les descendants ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La bouture</b> (asexuée) : un fragment de tige racine : la plante est identique au pied-mère (clone) : toutes les boutures du rosier 'Madame A. Meilland' sont le MÊME individu, dupliqué depuis 1945 !</div><div class=\"etu\"><b>Étape 2</b> — <b>La graine</b> (sexuée) : pollen + ovule ⟹ fécondation ⟹ graine : chaque graine donne une plante un peu différente des deux parents (mélange des informations) : c'est pour ça qu'on ne sème PAS les pépins des variétés d'arbres fruitiers (le fruit serait décevant : on greffe).</div><div class=\"etu\"><b>Étape 3</b> — <b>La conclusion</b> : asexué = fidélité (clone), rapide, sans fécondation : sexuée = nouveauté (mélange), plus lente, large dispersion des graines : les jardiniers et la nature utilisent les deux selon le besoin.</div></div></details>\n<h3>3. Reproduction sexuée chez les vivipares et les ovipares</h3>\n<div class=\"tip\"><b>Vivipare</b> : le petit se développe DANS le corps de la mère (mammifères : gestation) : peu de jeunes, beaucoup de soins.<br><b>Ovipare</b> : le développement se fait dans un ŒUF pondu à l'extérieur (oiseaux, poissons, grenouilles, insectes) : beaucoup d'œufs, peu de soins (souvent). Les œufs contiennent les réserves (jaune) : la chaleur (couvaison ou soleil) déclenche le développement.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi tant d'œufs chez la morue ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une morue pond des millions d'œufs : une éléphante un seul petit tous les 4-5 ans. Comparer les stratégies.</div><div class=\"etu\"><b>Étape 1</b> — <b>La morue</b> : œufs minuscules, abandonnés au courant : presque tous sont mangés : il suffit que 2 survivent (sur des millions) pour que la population remplace les parents : stratégie de la QUANTITÉ.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'éléphant</b> : 1 petit, gestation de 22 mois, allaitement 2 ans, protection des décennies : chaque petit compte : stratégie de la QUALITÉ (investissement par petit).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le bilan</b> : les deux stratégies « marchent » (les deux espèces ont survécu) : le nombre de descendants qui SURVIVENT est ce qui compte, pas le nombre de nés : l'espèce choisit sa voie par son mode de vie (aquatique dispersé vs terrestre social).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le spermatozoïde et l'ovule sont des CELLULES (gamètes) : la fécondation = fusion en UNE cellule-œuf ; le têtard n'est pas « un petit poisson » (c'est un stade de grenouille) ; la bouture n'est PAS une reproduction sexuée (pas de gamètes : clone) ; vivipare/ovipare se réfère au LIEU de développement du petit, pas à la présence de lait (seuls les mammifères allaitent).</div>"},

{"id": "biodiversite-6e", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Vivant :</b> naître, se nourrir, respirer, grandir, se reproduire, réagir, mourir.</p>\n<p><b>Biodiversité :</b> espèces + variété intra-espèce + milieux (écosystèmes).</p>\n<p><b>Classification :</b> regrouper par attributs hérités : groupes emboîtés.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Tester le vivant :</b> parcourir les critères un par un (une graine en dormance reste vivante).</li>\n<li><b>Inventaire :</b> lister les espèces d'un milieu, y compris micro-organismes.</li>\n<li><b>Classer :</b> chercher les attributs hérités (poumons, poils, fleurs), pas l'habitat.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Baleine et chauve-souris = mammifères (attributs, pas milieu ni ailes !).</li>\n<li>Champignons et bactéries : règles à part, ni végétal ni animal.</li>\n<li>Biodiversité ≠ que « grands animaux emblématiques » : surtout des insectes et microbes.</li>\n</ul>"},
{"id": "digestion", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Trajets :</b> bouche ⟶ œsophage ⟶ estomac ⟶ grêle ⟶ gros intestin.</p>\n<p><b>Digestion :</b> mécanique (dents, brassage) + chimique (enzymes) : grosses ⟶ petites molécules.</p>\n<p><b>Absorption :</b> nutriments ⟶ sang (grêle, villosités, ~30 m²).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma tube digestif :</b> étiqueter organes + glandes (salivaires, foie, pancréas).</li>\n<li><b>Tableau aliments/nutriments :</b> amidon⟶glucose ; protéines⟶acides aminés ; lipides⟶acides gras.</li>\n<li><b>Argument absorption :</b> seules les petites molécules traversent la paroi.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Digestion commence en bouche (amylase salivaire).</li>\n<li>Absorption = grêle, PAS le gros intestin (eau).</li>\n<li>Nutriments ≠ aliments : mots différents, réalités différentes.</li>\n</ul>"},
{"id": "respiration", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Trajets :</b> nez ⟶ trachée ⟶ bronches ⟶ bronchioles ⟶ alvéoles.</p>\n<p><b>Échanges :</b> O₂ alvéole ⟶ sang ; CO₂ sang ⟶ alvéole (diffusion à travers parois fines).</p>\n<p><b>Respiration cellulaire :</b> glucose + O₂ ⟶ CO₂ + H₂O + énergie.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma poumon :</b> alvéoles + capillaires avec flèches O₂/CO₂.</li>\n<li><b>Comparer airs :</b> inspiré (21 % O₂) vs expiré (16 % O₂, 4,5 % CO₂).</li>\n<li><b>Chaîne effort :</b> muscle ⟶ CO₂ ⟺ centres ⟺ ventilation/ cœur accélèrent.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Échanges = alvéoles (pas trachée ni bronches).</li>\n<li>Air expiré : encore 16 % d'O₂ (secourisme possible).</li>\n<li>Inspiration : diaphragme DESCEND, cage s'agrandit.</li>\n</ul>"},
{"id": "circulation-sanguine", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Double circulation :</b> petite (cœur⟶poumons⟶cœur) + grande (cœur⟶organes⟶cœur).</p>\n<p><b>Vaisseaux :</b> artères (sortent du cœur, pressions) ; veines (reviennent, valvules) ; capillaires (échanges).</p>\n<p><b>Sang :</b> plasma + globules rouges (O₂) + blancs (défense) + plaquettes (coagulation).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma cœur :</b> 4 cavités, colorer sang riche/pauvre en O₂, flèches.</li>\n<li><b>Classer un vaisseau :</b> sens : sort du cœur = artère ; revient = veine.</li>\n<li><b>Mesurer le pouls</b> : 15 s ×4 = fréquence/min.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Artère pulmonaire : sang PAUVRE en O₂ (l'exception).</li>\n<li>Échanges = capillaires, jamais artères.</li>\n<li>Coronaires = artères du CŒUR (infarctus).</li>\n</ul>"},
{"id": "reins-excretion", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Déchets :</b> CO₂ (poumons) ; urée (reins, issue des protéines).</p>\n<p><b>Néphron :</b> filtration (180 L/j) + réabsorption (99 %) ⟹ 1,5 L d'urine.</p>\n<p><b>Trajet :</b> rein ⟶ uretère ⟶ vessie ⟶ urètre.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma néphron :</b> filtration ⟶ réabsorption ⟶ excrétion.</li>\n<li><b>Lire une urine :</b> couleur (hydratation), glucose (diabète), protéines.</li>\n<li><b>Chaîne déchet :</b> cellule ⟶ sang ⟶ organe d'élimination ⟶ dehors.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Rein = trieur (garde l'utile), pas passoire.</li>\n<li>Vessie = stockage, rein = production.</li>\n<li>CO₂ = poumons, urée = reins : ne pas mélanger.</li>\n</ul>"},
{"id": "puberte-reproduction", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Cascade :</b> cerveau (hypothalamus-hypophyse) ⟶ FSH/LH ⟶ gonades ⟶ hormones sexuelles ⟶ puberté.</p>\n<p><b>Fille :</b> cycle ~28 j ; ovulation ~J14 (pic LH) ; muqueuse utérine puis règles si pas de fécondation.</p>\n<p><b>Garçon :</b> testicules ⟶ spermatozoïdes en continu dès la puberté.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma cascade :</b> cerveau ⟶ gonades ⟶ effets.</li>\n<li><b>Lire un cycle :</b> repérer règles, ovulation, fenêtre fertile (J10-J15).</li>\n<li><b>Comparer gamètes :</b> stock fermé (ovules) vs production continue (spermatozoïdes).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Fécondation = TROMPE (l'utérus accueille).</li>\n<li>Règles = fin de cycle (muqueuse non utilisée).</li>\n<li>Puberté : commandée par le cerveau.</li>\n</ul>"},
