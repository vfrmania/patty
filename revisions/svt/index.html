ination", "id": "immunite-adaptative"}, {"t": "Le climat : histoire et avenir", "id": "climat-histoire"}, {"t": "Les écosystèmes et l'espèce humaine", "id": "ecosystemes-humanite"}, {"t": "Le corps humain et l'homéostasie", "id": "homeostasie-sante"}]}];
var COURS_META = [
{"id": "biodiversite-6e", "theme": "La biodiversité et le vivant (6e)", "niveau": "6e", "titre": "La biodiversité et le vivant", "cours": "<div class=\"cours-head\"><h2>La biodiversité et le vivant</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Qu'est-ce qu'un être vivant ?</h3>\n<div class=\"tip\"><b>Critères du vivant :</b> naître, se <b>nourrir</b>, respirer, <b>grandir</b>, se reproduire, réagir à son environnement, et mourir. Un objet non vivant (une pierre, une voiture) ne fait AUCUNE de ces choses tout seul.<br><b>Frontières :</b> une graine en dormance paraît inerte mais est vivante (elle peut germer) ; le feu grandit et « mange » mais n'est pas vivant : il ne se reproduit pas ni ne respire.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — classer ce qui est vivant</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Parmi : un chien, une graine de blé, une pierre, une voiture, du corail, une flamme : lesquels sont vivants ? Justifier.</div><div class=\"etu\"><b>Étape 1</b> — <b>Évidents</b> : le chien (nourriture, croissance, reproduction ✓) ; le corail = COLONIE d'animaux vivants (on le confond avec une roche !).</div><div class=\"etu\"><b>Étape 2</b> — <b>La graine</b> : en apparence inerte, mais elle GERME (croissance) et donne une plante qui se reproduira : vivante (la vie peut être « en attente »).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les pièges</b> : la pierre (aucun critère) ; la voiture (bouge mais est pilotée, ne grandit pas, ne se reproduit pas) ; la flamme (grandit et « consomme », mais ni respiration ni reproduction) : la vie exige TOUS les critères, pas un seul.</div></div></details>\n<h3>2. La biodiversité : la variété du vivant</h3>\n<div class=\"tip\"><b>Biodiversité =</b> la diversité des <b>espèces</b> (animaux, végétaux, champignons, micro-organismes), la diversité <b>au sein d'une même espèce</b> (pas deux humains identiques, sauf vrais jumeaux) et la diversité des <b>milieux de vie</b> (écosystèmes).<br>On connaît ~2 millions d'espèces décrites, et on estime qu'il en existe 8 à 10 millions : la plupart des insectes et des océans restent à explorer.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — mesurer la biodiversité d'un square</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans un square de ville, on relève : 12 espèces d'oiseaux, 9 de plantes à fleurs, 4 de champignons, 3 de papillons, des lombrics, ~200 espèces de micro-organismes dans le sol. ① Que montre ce relevé ? ② Pourquoi les micro-organismes comptent-ils ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Lecture</b> : même un petit square urbain abrite 200+ espèces : la biodiversité est PARTOUT, pas seulement « en Amazonie » : l'inventaire (recensement) est l'outil du biologiste.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les invisibles</b> : le sol d'une poignée de terre contient plus de micro-organismes qu'il n'y a d'humains sur Terre : bactéries et champignons décomposent, recyclent, nourrissent les racines : la biodiversité cachée fait TOURNER l'écosystème.</div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan</b> : biodiversité spécifique (espèces) + génétique (variation interne) + écosystèmes (le square, son sol, ses arbres) : les trois étages de la biodiversité dans un seul carré d'herbe.</div></div></details>\n<h3>3. Classer : la classification du vivant</h3>\n<div class=\"tip\"><b>Classer</b> les êtres vivants = les regrouper selon leurs <b>attributs</b> (caractères) communs : vertébrés / sans vertébres, à fleurs / sans fleurs, plumés, à poils, à écailles...<br><b>Groupes emboîtés :</b> le chat est à la fois un mammifère, un vertébré, un animal : les groupes s'emboîtent comme des poupées russes, pas comme des tiroirs séparés.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la baleine est-elle un poisson ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La baleine vit dans l'eau, a une forme de poisson et des nageoires. Est-elle un poisson ? Construire le raisonnement.</div><div class=\"etu\"><b>Étape 1</b> — <b>Attributs observés</b> : milieu aquatique, corps fuselé, nageoires : ressemblances SUPERFICIELLES (adaptation au même milieu).</div><div class=\"etu\"><b>Étape 2</b> — <b>Attribents décisifs</b> : la baleine respire avec des POUMONS (pas des branchies), a des poils (quelques-uns !), allaite ses petits : <b>mammifère</b> (elle descend de mammifères terrestres revenus à l'eau).</div><div class=\"etu\"><b>Étape 3</b> — <b>Moralité</b> : on classe sur les attributs HÉRITÉS (poumons, poils, allaitement), pas sur le mode de vie : les ressemblances d'adaptation (nageoires du requin et de la baleine) NE prouvent PAS la parenté : c'est toute la différence entre « se ressembler » et « être apparenté ».</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la biodiversité ne se limite pas au nombre d'espèces (elle inclut la variété interne et les milieux) ; champignons et bactéries ne sont NI des végétaux NI des animaux (règles à part) ; la baleine est un mammifère, la chauve-souris aussi (mammifère volant !) ; classer = regrouper par attributs communs hérités, pas par ressemblance de mode de vie.</div>"},
{"id": "digestion", "theme": "La digestion et les nutriments (5e)", "niveau": "5e", "titre": "La digestion et les nutriments", "cours": "<div class=\"cours-head\"><h2>La digestion et les nutriments</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le trajet des aliments</h3>\n<div class=\"tip\"><b>Tube digestif :</b> bouche ⟶ œsophage ⟶ estomac ⟶ intestin grêle ⟶ gros intestin ⟶ anus. <b>Glandes annexes :</b> glandes salivaires, foie et pancréas (versent leurs sucs dans l'intestin).<br>Le parcours dure 24 à 72 h : chaque étage a son travail : broyer (dents), stocker + tuer les microbes (estomac), ABSORBER (intestin grêle).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — suivre un sandwich</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire le trajet et les transformations d'un morceau de pain dans l'organisme.</div><div class=\"etu\"><b>Étape 1</b> — <b>Bouche</b> : les dents broient (mécanique), la salive commence à couper l'amidon en sucres (chimique : on sent le pain devenir sucré si on le mâche longtemps !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Estomac</b> : brassage + suc gastrique acide (pH ~2 : tue la plupart des microbes) : le pain devient une bouillie, le chyme.</div><div class=\"etu\"><b>Étape 3</b> — <b>Intestin grêle</b> : sucs pancréatique et intestinal terminent le découpage chimique : les nutriments (glucose, acides aminés...) TRAVERSENT la paroi vers le sang : c'est l'absorption : le gros intestin ne récupère plus que l'eau.</div></div></details>\n<h3>2. Digestion mécanique et chimique</h3>\n<div class=\"tip\"><b>Mécanique :</b> dents, brassage de l'estomac (découpage physique). <b>Chimique :</b> les <b>enzymes</b> découpent les grosses molécules en petites : amidon ⟶ glucose ; protéines ⟶ acides aminés ; lipides ⟶ acides gras + glycérol.<br><b>Règle d'or :</b> les nutriments (petites molécules) passent seuls dans le sang : les aliments (grosses molécules) ne le peuvent PAS : c'est TOUT l'intérêt de la digestion.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi digérer ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le starch (amidon) ne traverse pas la paroi intestinale ; le glucose oui. Pourquoi l'organisme doit-il découper l'amidon ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Taille</b> : l'amidon est une LONGUE chaîne de glucose ; la paroi intestinale ne laisse passer que de petites molécules.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'enzyme</b> : l'amylase coupe la chaîne maillon par maillon : amidon + eau ⟶ n glucose : réaction de découpage (hydrolyse) à température du corps.</div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan</b> : sans découpage, l'amidon traverserait intact... et serait perdu : digérer = rendre absorbable : chaque classe d'aliment a ses enzymes (protéases, lipases) : l'intestin est une usine de découpe précise.</div></div></details>\n<h3>3. L'absorption intestinale</h3>\n<div class=\"tip\"><b>Villusités intestinales :</b> la paroi de l'intestin grêle est plissée en millions de replis microscopiques : la surface d'absorption atteint ~30 m² (l'équivalent d'un studio !).<br>Les nutriments passent dans les <b>capillaires sanguins</b> (glucose, acides aminés) ou dans les <b>vaisseaux lymphatiques</b> (graisses) : ils rejoignent ensuite les cellules du corps pour nourrir et fournir de l'énergie.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'intestin est plissé pour absorber</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi l'intestin grêle est-il tapissé de villosités plutôt que lisse ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Surface</b> : un tuyau lisse de 6 m offrirait ~2 m² : les plis, villosités et microvillosités multiplient la surface ×15 : ~30 m².</div><div class=\"etu\"><b>Étape 2</b> — <b>Intérêt</b> : plus de surface = plus d'échanges par seconde : le repas est absorbé en quelques heures, pas en jours.</div><div class=\"etu\"><b>Étape 3</b> — <b>Maladie témoin</b> : la maladie coeliaque (intolérance au gluten) détruit les villosités : surface réduite : malnutrition malgré des repas normaux : la structure EST la fonction : c'est l'argument biologique du cours.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la digestion commence DÉJÀ dans la bouche (salive), pas dans l'estomac ; les aliments deviennent des nutriments (à ne pas confondre) ; l'absorption a lieu dans l'intestin GRÊLE (le gros intestin ne récupère que l'eau) ; les enzymes découpent, elles ne « mangent » pas.</div>"},
{"id": "respiration", "theme": "La respiration et les échanges gazeux (5e)", "niveau": "5e", "titre": "La respiration et les échanges gazeux", "cours": "<div class=\"cours-head\"><h2>La respiration et les échanges gazeux</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'appareil respiratoire et le trajet de l'air</h3>\n<div class=\"tip\"><b>Trajets de l'air :</b> nez/bouche ⟶ trachée ⟶ bronches ⟶ bronchioles ⟶ <b>alvéoles pulmonaires</b> (les sacs d'échange).<br>Le diaphragme et les côtes font entrer et sortir l'air (inspiration/expiration) : les poumons ne possèdent pas de muscles propres : c'est le thorax qui les gonfle.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — sentir sa respiration</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Poser une main sur le ventre, une autre sur les côtes : décrire ce qui se passe à l'inspiration puis à l'expiration.</div><div class=\"etu\"><b>Étape 1</b> — <b>Inspiration</b> : le diaphragme DESCEND (la main du ventre se soulève), les côtes s'écartent : le volume de la cage augmente : l'air entre (dépression).</div><div class=\"etu\"><b>Étape 2</b> — <b>Expiration</b> : diaphragme remonte, côtes retombent : l'air ressort (l'air expiré est plus chaud et chargé en vapeur d'eau).</div><div class=\"etu\"><b>Étape 3</b> — <b>Mécanique du souffle</b> : l'air ne « choisit » pas d'entrer : c'est le volume du thorax qui l'ASPIRE (comme une seringue) : la respiration est un phénomène de pression, pas de volonté musculaire pulmonaire.</div></div></details>\n<h3>2. Les échanges alvéolaires</h3>\n<div class=\"tip\"><b>Lieu des échanges :</b> les ALVÉOLES, sacs minuscules (~300 millions !) tapissés de capillaires. <b>Diffusion :</b> l'O₂ passe des alvéoles vers le sang ; le CO₂ fait le trajet inverse, à travers des parois ultrafines (0,5 µm).<br>Air inspiré : 21 % O₂, ~0,04 % CO₂ ; air expiré : ~16 % O₂, ~4-5 % CO₂ : l'organisme a PRIS de l'O₂ et rejeté du CO₂.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser l'air expiré</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On analyse l'air inspiré et l'air expiré : O₂ 21 % ⟶ 16 % ; CO₂ 0,04 % ⟶ 4,5 % ; vapeur d'eau en hausse. Conclusions ?</div><div class=\"etu\"><b>Étape 1</b> — <b>O₂</b> : il DIMINUE : le sang en a emporté 5 points de pourcentage vers les cellules (respiration cellulaire).</div><div class=\"etu\"><b>Étape 2</b> — <b>CO₂</b> : il AUGMENTE énormément (×100 !) : c'est le déchet produit par les cellules qui brûlent les nutriments.</div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan</b> : le poumon est un LIEU D'ÉCHANGE : il ne « fabrique » ni ne « consomme » : il met en contact l'air et le sang : tout le reste est circulation : les chiffres d'air expiré sont la signature d'un organisme qui respire.</div></div></details>\n<h3>3. La respiration cellulaire : pourquoi on respire</h3>\n<div class=\"tip\"><b>Dans chaque cellule :</b> glucose + O₂ ⟶ CO₂ + H₂O + <b>ÉNERGIE</b> : c'est la respiration cellulaire. Le sang transporte l'O₂ (fixé sur l'hémoglobine des globules rouges) et rapporte le CO₂.<br><b>Quand l'effort augmente :</b> les muscles consomment plus : la ventilation et le cœur accélèrent (essoufflement) : le corps suit la demande.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi on s'essouffle en courant</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Au repos : 12-16 respirations/min ; en sprint : jusqu'à 40-50. Fréquence cardiaque : 70 ⟶ 150. Expliquer la chaîne complète.</div><div class=\"etu\"><b>Étape 1</b> — <b>La demande</b> : les muscles qui travaillent consomment plus de glucose et d'O₂ (et produisent plus de CO₂).</div><div class=\"etu\"><b>Étape 2</b> — <b>La réponse</b> : le cerveau (centre respiratoire) détecte le CO₂ en hausse : il ordonne une ventilation plus rapide et profonde ; le cœur accélère pour livrer plus d'O₂.</div><div class=\"etu\"><b>Étape 3</b> — <b>La limite</b> : si la demande dépasse l'apport, le muscle travaille en anaérobie : production de lactate (courbatures, jambes lourdes) : l'essoufflement n'est pas un « manque de souffle » mais une gestion de l'approvisionnement.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> les échanges gazeux se font dans les ALVÉOLES, pas dans la trachée ou les bronches ; l'air expiré contient ENCORE de l'O₂ (16 % : c'est pour ça que le bouche-à-bouche fonctionne) ; le CO₂ est rejeté mais l'air expiré n'est pas « du pur CO₂ » ; les poumons ne se gonflent pas tout seuls : c'est le diaphragme et les côtes.</div>"},
{"id": "circulation-sanguine", "theme": "La circulation sanguine (5e)", "niveau": "5e", "titre": "La circulation sanguine", "cours": "<div class=\"cours-head\"><h2>La circulation sanguine</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le cœur et la double circulation</h3>\n<div class=\"tip\"><b>Le cœur :</b> une pompe musculaire à 4 cavités (2 oreillettes, 2 ventricules) qui bat ~70 fois/min, ~100 000 fois/jour, sans jamais se reposer.<br><b>Deux circuits :</b> la <b>petite circulation</b> (cœur ⟶ poumons ⟶ cœur : se charger en O₂) et la <b>grande circulation</b> (cœur ⟶ organes ⟶ cœur : distribuer O₂ et nutriments).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — suivre une goutte de sang</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire le trajet complet d'une goutte de sang partie du ventricule droit, jusqu'à son retour.</div><div class=\"etu\"><b>Étape 1</b> — <b>Petite circulation</b> : ventricule droit ⟶ artère pulmonaire ⟶ poumons : la goutte charge O₂, décharge CO₂.</div><div class=\"etu\"><b>Étape 2</b> — <b>Retour</b> : veine pulmonaire ⟶ oreillette gauche ⟶ ventricule gauche (la chambre la plus musclée).</div><div class=\"etu\"><b>Étape 3</b> — <b>Grande circulation</b> : aorte ⟶ artères ⟶ capillaires des organes (livraison) ⟶ veines ⟶ oreillette droite : le tour est bouclé : une goutte met ~1 minute à faire le grand circuit.</div></div></details>\n<h3>2. Artères, veines, capillaires</h3>\n<div class=\"tip\"><b>Artères :</b> partent du cœur, parois élastiques et musclées, sang sous pression. <b>Veines :</b> reviennent au cœur, parois fines, valvules anti-retour. <b>Capillaires :</b> ultrafins (une cellule de large !) : LIEU des échanges avec les cellules.<br><b>Pouls :</b> l'onde de pression dans les artères à chaque battement : ~70/min au repos.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — artère ou veine ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Classer : aorte, veine cave, artère pulmonaire, veine pulmonaire, capillaire du muscle. Attention aux pièges.</div><div class=\"etu\"><b>Étape 1</b> — <b>Règle</b> : artère = qui SORT du cœur ; veine = qui REVIENT au cœur (le sens du sang, pas la richesse en O₂ !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Les pièges</b> : l'artère pulmonaire est une artère qui transporte du sang PAUVRE en O₂ (vers les poumons) ; la veine pulmonaire est une veine RICHE en O₂ (des poumons vers le cœur) : les deux exceptions célèbres.</div><div class=\"etu\"><b>Étape 3</b> — <b>Capillaires</b> : ni artère ni veine : le lieu de l'ÉCHANGE : paroi d'une cellule : le glucose et l'O₂ filtrent vers les cellules musculaires : c'est l'étage où le sang « travaille ».</div></div></details>\n<h3>3. La composition du sang et les vaisseaux qui nourrissent le cœur</h3>\n<div class=\"tip\"><b>Le sang (~5 L) :</b> plasma (55 %, eau + nutriments + déchets) ; <b>globules rouges</b> (transport O₂) ; <b>globules blancs</b> (défense) ; <b>plaquettes</b> (coagulation).<br><b>Les coronaires :</b> les artères qui nourrissent LE CŒUR lui-même : bouchées (cholestérol, tabac) : infarctus : le muscle cardiaque meurt faute d'irrigation.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le bilan de l'effort</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Au repos : 70 battements/min, 5 L/min de débit. En effort intense : 180 battements/min, 25 L/min. Pourquoi le sport renforce-t-il le cœur ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La demande</b> : muscles en effort ⟶ plus d'O₂ : le débit cardiaque doit ×5 : fréquence ET volume d'éjection montent.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'entraînement</b> : un cœur d'entraîné grossit ses cavités et son muscle : à chaque battement il éjecte PLUS : sa fréquence de REPOS descend (un sportif peut être à 45/min !).</div><div class=\"etu\"><b>Étape 3</b> — <b>Santé</b> : un cœur plus fort à chaque battement = moins de fatigue pour un même travail : d'où la recommandation de 30 min d'activité/jour : la pompe se muscle comme le biceps.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> artère = qui SORT du cœur (pas « sang riche en O₂ » : l'artère pulmonaire dément) ; les échanges se font dans les CAPILLAIRES, pas dans les artères ; la petite circulation traverse les POUMONS ; les coronaires irriguent le cœur, pas les poumons.</div>"},
{"id": "reins-excretion", "theme": "Les reins et l'élimination des déchets (5e)", "niveau": "5e", "titre": "Les reins et l'élimination des déchets", "cours": "<div class=\"cours-head\"><h2>Les reins et l'élimination des déchets</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Pourquoi éliminer ? Les déchets du corps</h3>\n<div class=\"tip\"><b>La cellule produit des déchets :</b> CO₂ (éliminé par les poumons) et <b>urée</b> (déchet azoté des protéines, toxique si elle s'accumule).<br>Les reins filtrent le sang en PERMANENCE (~180 L/jour !) pour fabriquer ~1,5 L d'urine : le reste est réabsorbé : l'essentiel est GARDÉ, seul le superflu part.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — les chiffres du rein</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Les reins filtrent 180 L de plasma par jour mais ne produisent que 1,5 L d'urine. Où passent les 178,5 L ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Filtration</b> : dans chaque néphron (~1 million par rein !), le sang est filtré : eau, glucose, sels, urée passent dans la capsule.</div><div class=\"etu\"><b>Étape 2</b> — <b>Réabsorption</b> : le long du tubule, le corps REPREND ce qui est utile : la quasi-totalité du glucose, la plupart des sels et 99 % de l'eau repartent dans le sang.</div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan</b> : l'urine finale = eau excédentaire + urée + sels en excès : le rein n'est pas une « passoire » qui jette : c'est un TRIEUR qui garde : boire plus ⟹ urine plus claire (surplus d'eau) : la couleur de l'urine lit l'hydratation.</div></div></details>\n<h3>2. Le trajet de l'urine</h3>\n<div class=\"tip\"><b>Rein ⟶ uretères ⟶ vessie (stockage, ~400-600 mL) ⟶ urètre (émission)].</b> Les deux reins, en permanence, goutte à goutte, alimentent la vessie : l'envie d'uriner apparaît vers 200-300 mL.<br>Le rein régale aussi la <b>pression artérielle</b> et l'équilibre en eau et sels : un organe bien plus large que la seule urine.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la dialyse : le rein artificiel</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un patient en insuffisance rénale est sous dialyse 3 fois/semaine, 4 h. Comment la machine remplace-t-elle le rein ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le filtre</b> : le sang du patient circule dans des tubes à membrane semi-perméable baignés dans un liquide de dialyse : les déchets (urée) diffusent du sang vers le bain.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le réglage</b> : le bain est calculé pour que glucose et sels utiles ne partent PAS : la machine imite la réabsorption du néphron.</div><div class=\"etu\"><b>Étape 3</b> — <b>La limite</b> : 12 h de dialyse par semaine contre 168 h de rein réel : d'où le régime strict (eau, sel) et la greffe, seul traitement complet : la dialyse EST le cours appliqué : filtration + tri.</div></div></details>\n<h3>3. Les déséquilibres et l'hydratation</h3>\n<div class=\"tip\"><b>Déshydratation :</b> reins économisent l'eau ⟹ urine foncée et peu abondante : boire ! <b>Surhydratation :</b> urines claires abondantes.<br><b>Le diabète sucré</b> fait passer du GLUCOSE dans l'urine (il déborde du tri rénal) : « sucré » : les médecins goûtaient l'urine avant les tests ! Les mouches autour des urines diabétiques : le diagnostic ancien.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le test des urines</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une bandelette urinaire révèle du glucose chez un patient qui boit et urine beaucoup. Que suspecte-t-on ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le signe</b> : glucose dans l'urine = le reins n'a pas pu réabsorber TOUT le glucose sanguin (trop élevé) : il déborde.</div><div class=\"etu\"><b>Étape 2</b> — <b>La cause probable :</b> un diabète : sans insuline fonctionnelle, la glycémie monte si haut que le seuil rénal (~1,8 g/L) est dépassé : le sucre passe dans l'urine, qui entraîne l'eau : d'où les urines abondantes ET la soif permanente.</div><div class=\"etu\"><b>Étape 3</b> — <b>La sagesse du corps</b> : l'urine est un état des lieux : couleur (hydratation), odeur, glucose, protéines : la bandelette est le laboratoire de poche : le rein publie la santé.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le rein FILTRE 180 L mais n'excrète que 1,5 L : réabsorption ! ; l'urée vient de la dégradation des PROTÉINES ; la vessie stocke, le rein FABRIQUE (rôles distincts) ; le CO₂ est éliminé par les POUMONS, pas par les reins.</div>"},
{"id": "puberte-reproduction", "theme": "La puberté et les organes reproducteurs (4e)", "niveau": "4e", "titre": "La puberté et les organes reproducteurs", "cours": "<div class=\"cours-head\"><h2>La puberté et les organes reproducteurs</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La puberté : le corps devient capable de se reproduire</h3>\n<div class=\"tip\"><b>Puberté :</b> la période (filles ~10-13 ans, garçons ~12-15 ans) où le cerveau (hypothalamus) réveille les <b>glandes sexuelles</b> (ovaires, testicules) par des hormones (FSH, LH) : les organes produisent alors leurs hormones (œstrogènes, testostérone) : caractères sexuels secondaires + production de gamètes.<br><b>Déclencheur :</b> c'est le CERVEAU qui commande (les gonades ne démarrent pas seules) : nutrition et hérédité influencent l'âge de départ.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la cascade hormonale</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer la chaîne de commande qui transforme un enfant en adulte sexué.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le cerveau</b> : l'hypothalamus libère la GnRH, qui ordonne à l'hypophyse de sécréter FSH et LH.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les gonades réveillées</b> : FSH/LH stimulent ovaires (œstrogènes) et testicules (testostérone).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les effets</b> : croissance, pilosité, mue de la voix (garçons), développement des seins et des règles (filles), production de spermatozoïdes et maturation des ovules : la boucle est complète : le corps devient fertile.</div></div></details>\n<h3>2. Appareil reproducteur féminin et cycle</h3>\n<div class=\"tip\"><b>Organes :</b> ovaires (stock d'ovules dès la naissance), trompes (lieu de la fécondation), <b>utérus</b> (accueil de la grossesse, muqueuse utérine qui s'épaissit), vagin.<br><b>Cycle menstruel (~28 jours) :</b> ovulation (~14e jour, déclenchée par un pic de LH) ; si pas de fécondation : la muqueuse se dégrade : <b>règles</b> ; si fécondation : nidation et l'embryon prend le relais hormonal.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire un cycle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur un cycle de 28 jours : règles J1-J5, ovulation J14, muqueuse maximale ~J21. Situer la période fertile et expliquer pourquoi la muqueuse s'épaissit puis tombe.</div><div class=\"etu\"><b>Étape 1</b> — <b>Fertilité</b> : l'ovule survit ~24 h, les spermatozoïdes ~3-5 jours : fenêtre fertile ≈ J10-J15 : les rapports de cette période peuvent conduire à une fécondation dans la TROMPE.</div><div class=\"etu\"><b>Étape 2</b> — <b>La muqueuse</b> : sous l'œstrogène puis la progestérone, elle s'épaissit et vascularise : un nid prêt pour l'embryon (c'est l'implantation, ~J21-25).</div><div class=\"etu\"><b>Étape 3</b> — <b>Si rien ne s'implante</b> : la progestérone chute : la muqueuse se dégrade et s'évacue : les règles (le corps « annule le nid ») : le cycle recommence : les règles sont la FIN d'un cycle, pas le début d'un problème.</div></div></details>\n<h3>3. Appareil reproducteur masculin</h3>\n<div class=\"tip\"><b>Organes :</b> testicules (production de spermatozoïdes, ~1000/s ! + testostérone), épididyme (maturation), vésicules séminales et prostate (liquide séminal), verge.<br>La production de spermatozoïdes démarre à la puberté et DURE toute la vie (contrairement aux ovules, tous présents dès la naissance).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — deux stratégies de gamètes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparer la production des gamètes féminins et masculins.</div><div class=\"etu\"><b>Étape 1</b> — <b>Femelle</b> : ~1 million d'ovules à la naissance, ~400 seront libérés dans la vie : UN par cycle, en une brève fenêtre : qualité > quantité.</div><div class=\"etu\"><b>Étape 2</b> — <b>Mâle</b> : production CONTINUE après la puberté : ~100 millions de spermatozoïdes par jour, renouvelés : quantité > qualité (la sélection se fait à la course).</div><div class=\"etu\"><b>Étape 3</b> — <b>Conséquence</b> : la fertilité féminine a une date de fermeture (ménopause : stock épuisé) ; la masculine persiste plus tard : biologie des deux sexes, dès le gamète : les deux systèmes partagent le même principe hormonal (cerveau ⟶ gonades).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la puberté démarre par le CERVEAU, pas par les gonades ; l'ovulation a lieu ~14 jours AVANT les règles (pas le jour 14 « magique » de tout cycle : règle valable pour un cycle de 28 jours) ; la fécondation a lieu dans la TROMPE, pas dans l'utérus ; les caractères sexuels SECONDAIRES apparaissent à la puberté, les organes reproducteurs (PRIMAIRES) existent dès la naissance.</div>"},
{"id": "fecondation-grossesse", "theme": "La fécondation, la grossesse et le développement (4e)", "niveau": "4e", "titre": "La fécondation, la grossesse et le développement", "cours": "<div class=\"cours-head\"><h2>La fécondation, la grossesse et le développement</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La fécondation : deux gamètes, une cellule</h3>\n<div class=\"tip\"><b>Fécondation :</b> fusion d'un spermatozoïde (23 chromosomes) et d'un ovule (23) dans la TROMPE : cellule-œuf à <b>46 chromosomes</b> (23 paires : une de chaque parent).<br>Seul UN spermatozoïde fusionne (les autres sont bloqués par la réaction membranaire) : le sexe de l'enfant dépend du spermatozoïde (X ou Y), jamais de l'ovule (toujours X).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi une fille ou un garçon ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer ce qui détermine le sexe d'un futur enfant, et pourquoi la mère n'y participe pas.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les gamètes</b> : l'ovule porte TOUJOURS un chromosome X (23e). Le spermatozoïde porte X ou Y (50/50 à la production).</div><div class=\"etu\"><b>Étape 2</b> — <b>La combinaison</b> : X + X = fille (44+XX) ; X + Y = garçon (44+XY) : c'est le tirage du spermatozoïde vainqueur qui tranche.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conséquence</b> : « faire des garçons ou des filles » ne dépend biologiquement que du PÈRE : l'ovule apporte toujours un X : la croyance inverse n'a aucun fondement génétique.</div></div></details>\n<h3>2. De la cellule-œuf à l'embryon</h3>\n<div class=\"tip\"><b>Développement :</b> cellule-œuf ⟶ divisions (2, 4, 8... cellules) ⟶ blastocyste ⟶ <b>nidation</b> dans la muqueuse utérine (~J21, une semaine après la fécondation).<br>Les cellules se SPÉCIALISENT ensuite (neurones, muscles, peau...) : c'est la différenciation : à 8 semaines, tous les organes sont ébauchés : on parle de FŒTUS.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — les divisions du début</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La cellule-œuf se divise toutes les 12-20 h au début. Combien de cellules après ~5 jours et pourquoi si petites ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le calcul</b> : 1 ⟶ 2 ⟶ 4 ⟶ 8 ⟶ 16 ⟶ 32... : après ~7-8 divisions : ~100 cellules (blastocyste) sans avoir GROSSI : les divisions découpent, elles n'ajoutent pas de matière.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le voyage</b> : pendant ces divisions, l'embryon DESCEND la trompe vers l'utérus (~5-7 jours de trajet).</div><div class=\"etu\"><b>Étape 3</b> — <b>La nidation</b> : le blastocyste se fixe dans la muqueuse épaissie : il s'y nourrit directement : la grossesse commence (test de grossesse : HCG détectée dès ~J24-26 du cycle).</div></div></details>\n<h3>3. La grossesse : échanges et protection</h3>\n<div class=\"tip\"><b>Placenta :</b> organe d'échange (surface ~15 m² !) entre le sang de la mère et celui du fœtus : O₂ et nutriments entrent, CO₂ et déchets sortent : les deux sangs ne se MÉLANGENT JAMAIS.<br><b>Cordon ombilical :</b> le tuyau. <b>Liquide amniotique :</b> la piscine protectrice (chocs, température).<br>9 mois : le fœtus passe de 0,1 mm à ~3 kg et ~50 cm.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi le placenta filtre-t-il ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le placenta laisse passer O₂ et nutriments mais arrête la plupart des microbes. Pourquoi certains virus et molécules passent-ils quand même ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le filtre</b> : la barrière placentaire empêche le mélange des sangs et bloque les BACTÉRIES : la plupart des microbes restent dehors.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les limites</b> : certains virus (rubéole, CMV, Zika) et des molécules (alcool, nicotine, certains médicaments, thalidomide dans les années 60) TRAVERSENT : ils atteignent l'embryon en pleine construction.</div><div class=\"etu\"><b>Étape 3</b> — <b>Santé publique</b> : zéro alcool pendant la grossesse (aucun seuil sûr), vaccins avant la grossesse, avis médical pour tout médicament : le placenta est un filtre, pas un mur : d'où les interdictions de grossesse.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la fécondation a lieu dans la TROMPE, la nidation dans l'UTÉRUS (deux lieux, une semaine d'écart) ; les sangs maternel et fœtal ne se mélangent pas ; le sexe dépend du spermatozoïde ; les divisions initiales ne font pas GROSSIR l'embryon (elles découpent) ; les premières semaines (organogenèse) sont les plus sensibles aux perturbateurs.</div>"},
{"id": "contraception-ist", "theme": "La contraception, la sexualité et les IST (4e)", "niveau": "4e", "titre": "La contraception, la sexualité et les IST", "cours": "<div class=\"cours-head\"><h2>La contraception, la sexualité et les IST</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les moyens de contraception</h3>\n<div class=\"tip\"><b>Contraception :</b> empêcher volontairement une grossesse. <b>Le préservatif</b> : barrière : seul à protéger AUSSI des IST. <b>La pilule</b> : hormones qui bloquent l'ovulation (le pic de LH n'a plus lieu). <b>Autres :</b> DIU/« pilule du lendemain » (urgence, dans les 3-5 jours), implant, stérilet.<br><b>Aucune méthode contraceptive n'est efficace à 100 %</b> : le préservatif à double usage protège à la fois des IST et de la grossesse.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — comment agit la pilule ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer le mécanisme hormonal de la pilule combinée.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le principe</b> : elle apporte chaque jour œstrogènes et progestatif : le cerveau lit un taux constant d'hormones.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'effet</b> : pas de pic de LH ⟹ PAS d'ovulation (l'ovule n'est jamais libéré) : + muqueuse utérine peu épaissie + glaire cervicale infranchissable : trois verrous.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le rappel</b> : l'oubli de pilule ouvre la porte à un pic de LH : d'où l'importance de la régularité (la pilule ne protège PAS des IST : le préservatif reste nécessaire avec un nouveau partenaire).</div></div></details>\n<h3>2. Les IST : repérer, prévenir, traiter</h3>\n<div class=\"tip\"><b>IST (infections sexuellement transmissibles) :</b> chlamydia, gonorrhée, syphilis, herpès, <b>VIH/SIDA</b>, hépatite B, HPV... Certaines sont <b>guérissables</b> (antibiotiques : chlamydia, syphilis) ; d'autres <b>incurables mais contrôlables</b> (VIH : trithérapie ; herpès : récidives).<br><b>Symptômes parfois ABSENTS</b> : on peut transmettre sans le savoir : le dépistage est la seule preuve.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le VIH en clair</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire le VIH : mode de transmission, cible, traitement actuel, prévention.</div><div class=\"etu\"><b>Étape 1</b> — <b>Transmission</b> : sang, sperme, sécrétions vaginales (rapports non protégés, partage de seringues ; de mère à enfant) : PAS par la salive, les poignées de main, les toilettes.</div><div class=\"etu\"><b>Étape 2</b> — <b>La cible</b> : le virus détruit les lymphocytes T4, les chefs d'orchestre de l'immunité : sans eux, les infections opportunistes s'installent (c'est le SIDA, stade avancé).</div><div class=\"etu\"><b>Étape 3</b> — <b>Aujourd'hui</b> : trithérapie = charge virale indétectable ⟹ santé préservée ET plus de transmission sexuelle (I = Indétectable = Intransmissible) : dépistage régulier, TROD gratuits, PrEP pour les personnes exposées : le préservatif et le dépistage restent les fondations.</div></div></details>\n<h3>3. Consentement et respect</h3>\n<div class=\"tip\"><b>Consentement :</b> un accord LIBRE, ÉCLAIRÉ, RÉVERSIBLE (on peut changer d'avis à tout moment), donné SANS pression ni contrainte. Le silence n'est pas un oui. La loi fixe un âge minimum de consentement.<br><b>Un rapport non consenti est un délit</b> : aucune tenue, aucun contexte, aucune relation passée ne vaut consentement : le respect et la parole sont au centre de la santé sexuelle.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — dire non, entendre non</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi dit-on que le consentement doit être « libre, éclairé et réversible » ? Donner un exemple de chaque.</div><div class=\"etu\"><b>Étape 1</b> — <b>Libre</b> : sans chantage ni pression (« si tu m'aimais, tu accepterais » = pression ⟹ pas de consentement libre).</div><div class=\"etu\"><b>Étape 2</b> — <b>Éclairé</b> : en connaissance de cause (protection, dépistage, contraception) : accepter sans savoir les risques n'est pas un choix complet.</div><div class=\"etu\"><b>Étape 3</b> — <b>Réversible</b> : valable pour un moment, pas pour toujours : changer d'avis en cours de route est un DROIT : l'autre doit s'arrêter immédiatement : le consentement est un dialogue continu, pas un contrat signé une fois.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la pilule protège des grossesses, PAS des IST (seul le préservatif fait les deux) ; une IST peut être muette (sans symptôme) : dépistage indispensable ; le VIH ne se transmet ni par la salive ni par les contacts ordinaires ; la contraception d'urgence est un rattrapage, pas une méthode régulière.</div>"},
{"id": "systeme-nerveux", "theme": "Le système nerveux et la communication (4e)", "niveau": "4e", "titre": "Le système nerveux et la communication", "cours": "<div class=\"cours-head\"><h2>Le système nerveux et la communication</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le réflexe et l'acte volontaire</h3>\n<div class=\"tip\"><b>Réflexe :</b> réponse AUTOMATIQUE et RAPIDE (retrait de la main d'une plaque brûlante) : l'arc réflexe passe par la <b>moelle épinière</b> sans attendre le cerveau : quelques millièmes de seconde.<br><b>Acte volontaire :</b> ordre du CERVEAU (cortex) : plus lent, modulable. Les deux chemins coexistent : le réflexe déclenche, le cerveau analyse ensuite (« aïe, c'était chaud ! »).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'arc réflexe pas à pas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décomposer le réflexe de retrait de la main posée sur une plaque chaude.</div><div class=\"etu\"><b>Étape 1</b> — <b>Réception</b> : les récepteurs de la peau (thermorécepteurs, nocicepteurs) captent la brûlure ⟶ message nerveux sensoriel.</div><div class=\"etu\"><b>Étape 2</b> — <b>Centre nerveux</b> : le message monte par le neurone sensitif jusqu'à la MOELLE ÉPINIÈRE : là, une synapse transmet directement au motoneurone (l'interneurone fait le relais) : la moelle ORDONNE le retrait sans attendre le cerveau.</div><div class=\"etu\"><b>Étape 3</b> — <b>Effet + information différée</b> : le muscle retire la main ; en PARALLÈLE, un message va au cerveau (douleur ressentie APRÈS le retrait !) : le réflexe a déjà sauvé la peau quand la douleur arrive : la vitesse fait la sécurité.</div></div></details>\n<h3>2. Le neurone et le message nerveux</h3>\n<div class=\"tip\"><b>Neurone :</b> corps cellulaire + dendrites (réception) + AXONE (conduction, jusqu'à 1 m !) + terminaisons. Le message nerveux est <b>électrique</b> le long de l'axone (potentiel d'action) et <b>chimique</b> à la <b>synapse</b> (neurotransmetteurs : les molécules qui sautent le fossé).<br>Vitesse : de 0,5 à 120 m/s (les axones isolés en myéline sont les plus rapides).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la synapse, le pont chimique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire le passage du message d'un neurone à l'autre à la synapse.</div><div class=\"etu\"><b>Étape 1</b> — <b>Arrivée</b> : le signal électrique atteint le bouton synaptique : il y ouvre des canaux à calcium.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le saut</b> : des vésicules libèrent les neurotransmetteurs (dopamine, acétylcholine...) dans le fossé synaptique (20 nanomètres !).</div><div class=\"etu\"><b>Étape 3</b> — <b>Reprise</b> : les molécules se fixent sur les récepteurs du neurone suivant : nouveau signal électrique : le message continue : la communication cerveau-corps est une chaîne de MILLIARDS de ces relais : cibles de nombreux médicaments et de toutes les drogues.</div></div></details>\n<h3>3. Cerveau et moelle : le centre et l'autoroute</h3>\n<div class=\"tip\"><b>Encéphale</b> (protégé par la boîte crânienne) : cerveau (cortex = matière GRISE : les décisions ; les aires spécialisées : motrice, sensitive, visuelle, du langage...), cervelet (équilibre et coordination), tronc cérébral (respiration, cœur : le pilotage automatique).<br><b>Moelle épinière</b> : l'autoroute bidirectionnelle + le centre des réflexes : protégée par la colonne vertébrale.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la carte du cortex</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Citer trois aires spécialisées du cortex et montrer par un accident célèbre qu'elles sont distinctes.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les aires</b> : motrice (ordres aux muscles, front), somatosensitive (sensations, derrière la motrice), visuelle (arrière), du langage (aire de Broca : production de la parole).</div><div class=\"etu\"><b>Étape 2</b> — <b>La preuve clinique</b> : un AVC (accident vasculaire cérébral) qui bloque l'artère de l'aire de Broca laisse le patient lucide mais quasi muet : les autres aires fonctionnent : la lésion DÉLIMITE la fonction.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'application</b> : la rééducation exploite la plasticité (les zones voisines apprennent à compenser) : la carte du cerveau n'est pas figée : c'est l'espoir de la neurologie.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> dans un réflexe, le centre nerveux est la MOELLE, pas le cerveau ; le message est électrique dans le neurone, CHIMIQUE à la synapse ; la douleur est ressentie APRÈS le retrait réflexe ; le cervelet gère l'équilibre (à ne pas confondre avec le cerveau).</div>"},
{"id": "genetique-heredite", "theme": "La génétique et l'hérédité (3e)", "niveau": "3e", "titre": "La génétique et l'hérédité", "cours": "<div class=\"cours-head\"><h2>La génétique et l'hérédité</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les chromosomes et les allèles</h3>\n<div class=\"tip\"><b>Caryotype humain :</b> 46 chromosomes = 23 paires : une paire de chaque parent. Les <b>gamètes</b> n'en ont que 23 (une version de chaque paire : la méiose réduit de moitié).<br>Sur un chromosome : des <b>gènes</b> (recettes de protéines). Un gène existe en <b>2 versions = allèles</b> (une par chromosome de la paire). Le <b>génome</b> = l'ensemble de l'ADN (~20 000 gènes).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la méiose en clair</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi les gamètes ont-ils 23 chromosomes et pas 46 ? Que se passerait-il sinon à la fécondation ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le principe</b> : la méiose (division réductrice) distribue UN chromosome de chaque paire à chaque gamète : 23.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le tirage</b> : pour chaque paire, le gamète reçoit la version du PÈRE ou de la MÈRE, au hasard : 2²³ ≈ 8 millions de combinaisons possibles par gamète : c'est le brassage interchromosomique.</div><div class=\"etu\"><b>Étape 3</b> — <b>La fécondation</b> : 2 gamètes de 23 se rejoignent à 46 : le compte est bon, et chaque enfant est unique : (8 M)² ≈ 70 000 milliards de combinaisons : sans même compter les croisements intra-chromosomiques (brassage par crossing-over) : voilà pourquoi deux frères et sœurs ne sont pas des clones.</div></div></details>\n<h3>2. Dominance et hérédité : le tableau de croisement</h3>\n<div class=\"tip\"><b>Allèle dominant</b> (majuscule, ex. A) : s'exprime même en un seul exemplaire. <b>Allèle récessif</b> (minuscule, a) : s'exprime seulement en 2 exemplaires (aa).<br><b>Génotype</b> = la paire d'allèles (AA, Aa, aa) ; <b>phénotype</b> = ce qu'on voit (caractère). Le tableau de croisement (grille de Punnett) donne les probabilités des descendants : ex. parents Aa × Aa : 1/4 AA, 1/2 Aa, 1/4 aa : 3/4 de phénotype dominant, 1/4 récessif.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — les yeux bleus d'une famille brune</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux parents aux yeux marrons (allèle marron M dominant, bleu b récessif) ont un enfant aux yeux bleus. Quels sont leurs génotypes ? Quelle est la probabilité d'un second enfant aux yeux bleus ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le raisonnement sur l'enfant</b> : yeux bleus = bb : il a reçu un b de CHAQUE parent : chaque parent porte donc au moins un b.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les génotypes parentaux</b> : parents marrons (donc au moins un M chacun) + porteur de b : M b × M b pour tous les deux.</div><div class=\"etu\"><b>Étape 3</b> — <b>La grille</b> : MB × Mb : cases MM (marron), Mb (marron), bM (marron), bb (bleu) : 1/4 = 25 % d'yeux bleus À CHAQUE naissance : chaque enfant est un nouveau tirage : avoir eu un bleu ne change rien pour le suivant : probabilité inchangée.</div></div></details>\n<h3>3. Du gène au caractère : la protéine</h3>\n<div class=\"tip\">Un gène code une <b>protéine</b> (via ARNm) : la protéine fait le travail (enzyme, pigment, muscle...). Une mutation (changement d'une « lettre » de l'ADN) peut modifier la protéine : effet nul, léger, grave (drépanocytose : l'hémoglobine mal formée) ou... avantageux (résistance au paludisme des porteurs !).<br><b>Maladies génétiques :</b> mucoviscidose (récessive : il faut 2 allèles malades), drépanocytose, myopathie (liée à X : touche surtout les garçons).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi la mucoviscidose « saute » des générations</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La mucoviscidose est récessive (allèle m). Deux parents sains (M m) ont-ils un risque ? Expliquer la « famille porteuse ».</div><div class=\"etu\"><b>Étape 1</b> — <b>Les porteurs sains</b> : M m : phénotype sain (M domine), mais gamètes porteurs de m : ils ne le savent pas sans test.</div><div class=\"etu\"><b>Étape 2</b> — <b>La grille</b> : M m × M m : 1/4 MM, 1/2 M m (porteurs sains), 1/4 m m : malade : risque 25 % à chaque enfant.</div><div class=\"etu\"><b>Étape 3</b> — <b>La transmission silencieuse</b> : l'allèle traverse des générations de porteurs SANS jamais s'exprimer, puis deux porteurs se rencontrent : 1 enfant sur 4 malade : c'est le principe du conseil génétique (dépistage des porteurs : ~1/30 en France) : la maladie ne « saute » pas : elle se CACHE dans les hétérozygotes.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> 46 chromosomes dans les cellules, 23 dans les gamètes ; le phénotype visible ne dit pas le génotype (marron = MM ou M b) ; les probabilités sont indépendantes à chaque naissance ; le crossing-over (brassage intra-chromosomique) enrichit encore la diversité ; sexe = paire 23 (XX/XY).</div>"},
{"id": "immunite-vaccins", "theme": "L'immunité et les vaccins (3e)", "niveau": "3e", "titre": "L'immunité et les vaccins", "cours": "<div class=\"cours-head\"><h2>L'immunité et les vaccins</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le système immunitaire : la défense du corps</h3>\n<div class=\"tip\"><b>Ligne 1 (innée, minutes-heures) :</b> barrières (peau, muqueuses), phagocytes (cellules qui engloutissent), inflammation, fièvre.<br><b>Ligne 2 (adaptative, jours) :</b> les <b>lymphocytes</b> : B (anticorps) et T (tueurs, aides). Ils APPRENNENT l'ennemi : mémoire : c'est elle qui rend la 2e infection plus rapide et plus forte.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la vie d'un lymphocyte B</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Raconter le parcours d'un lymphocyte B du premier contact à la mémoire.</div><div class=\"etu\"><b>Étape 1</b> — <b>Reconnaissance</b> : chaque LB porte des récepteurs uniques (une seule forme d'anticorps) : sur ~1 million de LB différents, l'un reconnaît l'antigène du virus : il est « choisi ».</div><div class=\"etu\"><b>Étape 2</b> — <b>Prolifération</b> : aidé par les lymphocytes T, le LB choisi se MULTIPLIE en masse : usine à <b>anticorps</b> (protéines en Y qui collent à l'antigène et le neutralisent/marquent pour la destruction).</div><div class=\"etu\"><b>Étape 3</b> — <b>Mémoire</b> : après la victoire, des LB-mémoire restent : au 2e contact : réponse quasi immédiate (jours ⟶ heures) : la maladie n'a pas le temps de s'installer : c'est l'IMMUNITÉ : le vaccin exploite exactement cette faille bénéfique.</div></div></details>\n<h3>2. Le vaccin : entraîner sans risquer</h3>\n<div class=\"tip\"><b>Vaccin :</b> version inoffensive de l'agent (tué, affaibli, fragment/ARN) : le système immunitaire réagit, construit la mémoire ⟹ au vrai virus : réponse foudroyante : la maladie n'a pas lieu.<br><b>Anticorps maternels (IgG) :</b> passent le placenta : protègent le bébé quelques mois. <b>Sérum</b> (anticorps tout prêts) : immunité immédiate mais courte, passive : différent du vaccin (actif, long).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — vaccin vs sérum : qui fait quoi ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un voyageur part dans un pays où sévit l'hépatite B. On lui propose un vaccin avant, et un sérum à son collègue déjà exposé. Expliquer la différence.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le vaccin (prévention)</b> : antigène inoffensif ⟶ SON système immunitaire apprend : anticorps + mémoire : protection qui DURE (années, même décennies : rappels pour entretenir).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le sérum (urgence)</b> : anticorps fabriqués par un AUTRE organisme (cheval immunisé) : injection ⟶ protection IMMÉDIATE, mais les anticorps sont dégradés en semaines : pas de mémoire : c'est une roue de secours, pas un entraînement.</div><div class=\"etu\"><b>Étape 3</b> — <b>Le duel des vitesses</b> : vaccin = lent à installer, durable ; sérum = instantané, éphémère : la médecine utilise le sérum quand l'exposition a déjà eu lieu (tétanos, morsure de serpent : sérum antivenim).</div></div></details>\n<h3>3. Allergie et greffe : quand l'immunité se trompe de cible</h3>\n<div class=\"tip\"><b>Allergie :</b> réaction immunitaire contre un ennemi inoffensif (pollen, arachide) : histamine : éternuements, urticaire, choc anaphylactique (urgence : adrénaline).<br><b>Greffe :</b> le système attaque le greffon (« du non-soi ») ⟹ compatibilité donneur-receveur + <b>immunosuppresseurs</b> à vie : le prix de la tolérance.<br><b>VIH</b> : détruit les lymphocytes T4 : l'immunité s'effondre (SIDA) : les infections opportunistes profitent du vide.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi le rhume des foins ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer la chaîne de l'allergie au pollen, du premier contact aux éternuements.</div><div class=\"etu\"><b>Étape 1</b> — <b>Sensibilisation</b> : premier contact : le pollen (inoffensif) est pris pour un ennemi : des IgE se fixent sur les mastocytes : rien ne se voit encore.</div><div class=\"etu\"><b>Étape 2</b> — <b>Réaction</b> : contacts suivants : le pollen touche les IgE armées : les mastocytes explosent d'HISTAMINE : vaisseaux dilatés, muqueuses irritées : nez qui coule, larmes, gonflements.</div><div class=\"etu\"><b>Étape 3</b> — <b>Traiter</b> : antihistaminiques (bloquent l'histamine), désensibilisation (réapprendre au système : petites doses croissantes) : l'allergie est une erreur d'apprentissage immunitaire, pas un manque de défense.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> vaccin ≠ sérum (actif/durable vs passif/éphémère) ; la mémoire immunitaire est la clé de l'immunité ; le vaccin ne « met pas » d'anticorps : il apprend au corps à les fabriquer ; le VIH cible les T4 (les chefs) ; la fièvre est une DÉFENSE (milieu moins favorable aux microbes), pas la maladie elle-même.</div>"},
{"id": "evolution-especes", "theme": "L'évolution des espèces (3e)", "niveau": "3e", "titre": "L'évolution des espèces", "cours": "<div class=\"cours-head\"><h2>L'évolution des espèces</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les idées de Darwin : sélection naturelle</h3>\n<div class=\"tip\"><b>Observations de Darwin (1831-36, voyage du Beagle) :</b> ① les caractères varient entre individus ; ② ces variations sont HÉRITABLES ; ③ plus de descendants naissent que ne survivent : lutte pour la vie.<br><b>Déduction :</b> les individus les PLUS ADAPTÉS à leur milieu survivent et se reproduisent davantage : leurs caractères se répandent : c'est la <b>SÉLECTION NATURELLE</b> (l'environnement « trie » les variantes existantes : elle ne les crée pas).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — les pinsons de Darwin</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Aux Galápagos, les pinsons ont des becs variés selon les îles. Comment la sélection naturelle explique-t-elle ces spécialisations ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Variation initiale</b> : dans chaque population, les tailles de bec varient naturellement (héritable : les petits ressemblent aux parents).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le filtre insulaire</b> : sur une île à grosses graines dures, seuls les becs forts permettent de manger suffisamment ⟹ survie et reproduction des gros becs ; sur une île à insectes, les becs fins gagnent.</div><div class=\"etu\"><b>Étape 3</b> — <b>Résultat sur des générations</b> : la moyenne des becs glisse vers la forme rentable : accumulation = espèces distinctes : le milieu a TRIÉ : il n'a pas demandé, il a éliminé : 13 espèces de pinsons descendent d'un ancêtre commun.</div></div></details>\n<h3>2. Les preuves de l'évolution</h3>\n<div class=\"tip\"><b>Fossiles</b> : les formes anciennes diffèrent des actuelles : certaines espèces disparaissent, d'autres apparaissent : la vie a une HISTOIRE (strates = frise chronologique).<br><b>Anatomie comparée</b> : mêmes os (membre antérieur : homme, baleine, chauve-souris : mêmes pièces, formes différentes) = <b>homologies</b> : héritage d'un ancêtre commun.<br><b>Embryologie + ADN</b> : plus deux espèces partagent de séquences d'ADN, plus elles sont proches : l'arbre du vivant se lit aussi dans les gènes (l'homme et le chimpanzé : ~99 % d'ADN commun).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire une coupe géologique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans une falaise, on trouve de bas en haut : ammonites, puis reptiles marins, puis mammifères. Comment dater et interpréter ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le principe de superposition</b> : le plus BAS est le plus ancien (les sédiments se déposent en couches empilées) : ammonites les plus vieilles.</div><div class=\"etu\"><b>Étape 2</b> — <b>La datation</b> : les ammonites (index fossiles) caractérisent l'ère secondaire (-252 à -66 Ma) : reptiles marins : même fenêtre : les mammifères dominent après la disparition des dinosaures.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'interprétation évolutionne</b> : la falaise EST une frise chronologique : faunes remplacées, disparitions (extinction des ammonites avec les dinosaures : -66 Ma), apparitions : pas de mammifère dominant avant : l'histoire est Directionnelle : le présent n'était pas écrit d'avance.</div></div></details>\n<h3>3. Homo sapiens : un primate parmi les autres</h3>\n<div class=\"tip\">L'Homme partage avec les grands singes un <b>ancêtre commun</b> (il ne descend PAS du chimpanzé !). Critères humains : bipédie ancienne (~7 Ma : Lucy, -3,2 Ma), volume crânien en hausse (400 ⟶ 1350 cm³), outils, langage, culture.<br>Plusieurs espèces d'Homo ont coexisté : Sapiens (~300 000 ans) a rencontré Néandertal et Denisova : un peu de leur ADN est en nous (~2 %) : avant de rester seul.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — arbre ou échelle ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « L'Homme descend du singe » : pourquoi cette phrase est-elle fausse, et par quoi la remplacer ?</div><div class=\"etu\"><b>Étape 1</b> — <b>L'erreur d'image</b> : une échelle (singe en bas, Homme en haut) suggère une progression vers nous : or le chimpanzé est aussi « évolué » que nous : il a ÉVOLUÉ depuis 7 Ma autant que nous.</div><div class=\"etu\"><b>Étape 2</b> — <b>La bonne image</b> : l'ARBRE : un tronc commun (ancêtre) dont partent des branches : chimpanzé d'un côté, Homme de l'autre : cousins, pas descendants.</div><div class=\"etu\"><b>Étape 3</b> — <b>La preuve ADN</b> : ~99 % de gènes communs avec le chimpanzé, ~98,8 % avec le gorille : les distances génétiques dessinent l'arbre (plus proche du chimpanzé que du gorille : branche commune plus récente) : Sapiens est une jeune branche (~300 000 ans) d'un arbre vieux de 4 milliards d'années.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la sélection naturelle TRIE des variantes existantes (elle ne crée rien et n'a pas d'intention) ; l'Homme ne descend pas du chimpanzé (ancêtre commun) ; les mutations sont aléatoires, la sélection les filtre ; « théorie » de l'évolution ≠ hypothèse : c'est un cadre validé par fossiles, anatomie et ADN.</div>"},
{"id": "ecosystemes-3e", "theme": "Les écosystèmes et l'environnement (3e)", "niveau": "3e", "titre": "Les écosystèmes et l'environnement", "cours": "<div class=\"cours-head\"><h2>Les écosystèmes et l'environnement</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Écosystème, chaîne et réseau trophique</h3>\n<div class=\"tip\"><b>Écosystème</b> = milieu (biotope) + êtres vivants (biocénose) + leurs interactions. Le <b>producteur primaire</b> (végétal : photosynthèse) fabrique la matière organique : les <b>consommateurs</b> (herbivores, carnivores, super-prédateurs) se la transfèrent : chaque flèche = « est mangé par ».<br><b>Décomposeurs</b> (champignons, bactéries) : ils ferment la boucle en recyclant la matière.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la chaîne d'une prairie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Construire la chaîne trophique : herbe ⟶ sauterelle ⟶ lézard ⟶ buse. Que deviennent les énergies à chaque étape et qui recycle les cadavres ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La base</b> : l'herbe (producteur) capte l'énergie lumineuse et le CO₂ : elle FABRIQUE la matière : tout part de là (sans végétaux, pas de chaîne).</div><div class=\"etu\"><b>Étape 2</b> — <b>Les transferts</b> : sauterelle (consommateur 1), lézard (2), buse (3) : à chaque étape, ~10 % seulement de l'énergie passe au niveau suivant (le reste : respiration, chaleur, déjections) : d'où la forme pyramidale des écosystèmes.</div><div class=\"etu\"><b>Étape 3</b> — <b>La boucle</b> : décomposeurs (champignons, bactéries, vers) transforment les cadavres et déjections en sels minéraux : réinjectés dans le sol : l'herbe repart : le carbone et l'azote tournent en boucle FERMÉE (seule l'énergie traverse le système).</div></div></details>\n<h3>2. Les relations entre espèces</h3>\n<div class=\"tip\"><b>Prédation</b> (l'un mange l'autre) ; <b>compétition</b> (mêmes ressources) ; <b>mutualisme/symbiose</b> (les deux y gagnent : pollinisation, mycorhizes, lignées intestinales : le miscanthus n'existe pas seul !).<br><b>Parasitisme</b> (l'un profite au détriment de l'autre : tique, ténia). Ces relations régulent les populations : prédateur-proie oscillent ensemble (retard).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi protéger les insectes pollinisateurs ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Les abeilles pollinisent une grande partie des cultures. Que se passe-t-il si elles disparaissent ? Montrer le lien mutualisme ⟶ service écosystémique.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le contrat mutualiste</b> : l'abeille récolte le nectar (nourriture) : en voyageant, elle transporte le pollen (reproduction de la plante) : les DEUX gagnent.</div><div class=\"etu\"><b>Étape 2</b> — <b>La dépendance agricole</b> : ~75 % des cultures vivrières dépendent (au moins en partie) des pollinisateurs : sans eux : rendements effondrés (pommes, amandes, colza...).</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon systémique</b> : un acteur minuscule soutient une industrie énorme (estimée à des centaines de milliards €/an : « service écosystémique ») : les pesticides néonicotinoïdes, affaiblissant les abeilles, se retournent contre les rendements : protéger les alliés invisibles EST un intérêt agricole direct.</div></div></details>\n<h3>3. Dynamique des populations et impacts humains</h3>\n<div class=\"tip\"><b>Une population croît si les ressources le permettent</b> (naissances + immigration > décès + émigration) mais le milieu impose des <b>limites</b> (ressources, prédateurs, climat) : autour d'un équilibre dynamique.<br><b>Actions humaines :</b> fragmentation (routes), espèces invasives, pollution, surexploitation : elles dégradent les écosystèmes ; protections possibles : parcs naturels, corridors, réintroductions, agriculture raisonnée.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le retour du loup et la régulation naturelle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sans prédateur, les populations de cerfs explosent et rongent les jeunes arbres. Le retour du loup modifie tout : expliquer la cascade.</div><div class=\"etu\"><b>Étape 1</b> — <b>La régulation directe</b> : le loup prélève les individus faibles : la population de cerfs se stabilise à un niveau supportable.</div><div class=\"etu\"><b>Étape 2</b> — <b>La peur comme paysagiste</b> : les cerfs évitent les zones à loups : les jeunes arbres repoussent (saules, peupliers) : les berges se consolident : les oiseaux nichent : l'EFFET CASCADE (observé à Yellowstone avec le loup réintroduit en 1995) réorganise tout l'écosystème.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon</b> : chaque espèce clef de voûte « tient » un morceau de l'édifice : la retirer (ou la remettre) déclenche des chaînes d'effets insoupçonnées : gérer la nature, c'est gérer des RÉSEAUX, pas des listes d'espèces.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la chaîne alimentaire COMMENCE par le producteur (végétal), pas par le carnivore ; ~90 % de l'énergie est perdue à chaque étage (pyramide) ; la MATIÈRE circule en boucle (décomposeurs), l'ÉNERGIE traverse (définitivement perdue en chaleur) ; symbiose ≠ parasitisme (les deux gagnent vs l'un profite).</div>"},
{"id": "terre-tectonique", "theme": "La Terre : structure et tectonique des plaques (2de)", "niveau": "2de", "titre": "La Terre : structure et tectonique des plaques", "cours": "<div class=\"cours-head\"><h2>La Terre : structure et tectonique des plaques</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'intérieur de la Terre</h3>\n<div class=\"tip\"><b>Modèle en couches</b> (d'après les ondes sismiques) : croûte (océanique ~5-10 km / continentale ~30-70 km), <b>manteau</b> (~2900 km, roches solides mais déformables sur de longues durées), <b>noyau</b> métallique (externe LIQUIDE : origine du champ magnétique : interne solide).<br>La <b>lithosphère</b> (croûte + part supérieure rigide du manteau, ~100 km) « flotte » sur l'<b>asthénosphère</b> (manteau ductile).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — sonder la Terre avec les séismes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment les ondes sismiques P et S ont-elles permis de localiser la limite manteau-noyau (interface à 2900 km) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Deux ondes</b> : les ondes P (compression) traversent solides ET liquides ; les ondes S (cisaillement) ne traversent PAS les liquides.</div><div class=\"etu\"><b>Étape 2</b> — <b>La zone d'ombre</b> : au-delà de ~103° du séisme, plus d'ondes S reçues : elles ont rencontré quelque chose de LIQUIDE ; les ondes P, elles, s'incurvent (changement de vitesse) : une zone d'ombre s'étend de 103° à 143°.</div><div class=\"etu\"><b>Étape 3</b> — <b>La conclusion</b> : le noyau externe est liquide, sa limite supérieure est à ~2900 km de profondeur : Richard Oldham (1906) et Inge Lehmann (1936, noyau interne solide) ont cartographié l'intérieur SANS forer : le forage le plus profond (12 km) ne gratte que la croûte : les séismes sont notre scanner.</div></div></details>\n<h3>2. La dérive des continents et la tectonique des plaques</h3>\n<div class=\"tip\"><b>Wegener (1912) :</b> les continents dérivent (indices : formes emboîtées Afrique/Amérique, fossiles identiques, mêmes chaînes de montagnes). Preuves modernes : <b>paleomagnétisme</b>, âge des fonds océaniques (<b>jeunes au niveau des dorsales</b> : symétrie des âges de part et d'autre).<br>La lithosphère est découpée en <b>plaques</b> (une dizaine de majeures) qui se déplacent de quelques cm/an (vitesse d'un ongle qui pousse !) sur l'asthénosphère.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la dorsale océanique, usine de croûte</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer pourquoi les roches au niveau de la dorsale médio-atlantique sont jeunes (~0 Ma) et de plus en plus vieilles en s'en éloignant.</div><div class=\"etu\"><b>Étape 1</b> — <b>L'accrétion</b> : sous la dorsale, le manteau remonte et fond partiellement : le magma remplit l'écart entre les deux plaques qui s'écartent : de la croûte océanique NEUVE se fabrique.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le tapis roulant</b> : la croûte créée à la dorsale est poussée latéralement par la suivante : elle VIEILLIT en s'éloignant (comme un tapis roulant qui s'éloigne de son rouleau d'entrée).</div><div class=\"etu\"><b>Étape 3</b> — <b>La signature magnétique</b> : les basaltes enregistrent le champ magnétique du moment (bandes alternées normales/inversées, symétriques) : c'est la preuve de l'expansion (Hess, Vine et Matthews, années 60) : l'Atlantique s'ouvre de ~2 cm/an : la largeur de nos ongles.</div></div></details>\n<h3>3. Les trois types de frontières</h3>\n<div class=\"tip\"><b>Divergente (dorsale)</b> : écartement : création de croûte (Atlantique central, Afar). <b>Convergente</b> : rapprochement : soit océan + continent (SUBDUCTION : la plaque océrique plonge, volcans explosifs, fosses : Andes) soit continent + continent (COLLISION : chaînes de montagnes : Himalaya). <b>Coulissante (transformante)</b> : frottement latéral (faille de San Andreas : séismes).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'Himalaya en construction</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'Inde se dirige vers l'Asie à ~5 cm/an depuis ~50 Ma : l'Himalaya culmine à 8,8 km et monte encore de ~1 cm/an. Reconstituer le mécanisme.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le contexte</b> : deux plaques continentales (lithosphère continentale légère) convergent : ni l'une ni l'autre ne peut plonger profondément dans le manteau.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le résultat</b> : les 2000 km d'océan qui les séparaient ont été absorbés, puis les continents se sont CHEVAUCHÉS : la lithosphère s'épaissit en racine : la surface se soulève (isostasie : la montagne flotte sur son socle).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les témoins</b> : fossiles marins au sommet de l'Everest (roches océanches plissées : la Téthys disparue), séismes superficiels fréquents, GPS qui mesure l'écrasement actuel : la chaîne est une machine encore en marche : les plus grandes altitudes du monde sont un pli frais.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le manteau est SOLIDE (ductile : il s'écoule sur des durées géologiques) : « magma partout » est faux ; les plaques portent croûte océanique ET/OU continentale (une plaque n'est pas un continent) ; les sismes ne sont pas répartis au hasard : ils dessinent les frontières de plaques ; le moteur principal = la traction de la lithosphère froide qui plonge (+ poussée ridge).</div>"},
{"id": "adn-proteines", "theme": "L'ADN, les protéines et la cellule (2de)", "niveau": "2de", "titre": "L'ADN, les protéines et la cellule", "cours": "<div class=\"cours-head\"><h2>L'ADN, les protéines et la cellule</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'ADN : la molécule-support de l'information</h3>\n<div class=\"tip\"><b>ADN :</b> double hélice (Watson et Crick, 1953) de deux brins complémentaires (A-T, G-C). Séquence de <b>nucléotides</b> (A, T, G, C) : c'est l'ORDRE des lettres qui porte l'information (une molécule-écriture de ~3 milliards de lettres dans chaque cellule humaine).<br>Un <b>gène</b> = une portion d'ADN qui code une protéine (une recette dans le grand livre).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — complémentarité et réplication</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un brin d'ADN a la séquence A T G C C A. Donner le brin complémentaire et expliquer comment l'ADN se copie avant une division.</div><div class=\"etu\"><b>Étape 1</b> — <b>Complémentarité</b> : A s'apparie avec T, G avec C : brin complémentaire : T A C G G T.</div><div class=\"etu\"><b>Étape 2</b> — <b>La réplication</b> : les deux brins se séparent : chaque brin sert de MATRICE : les nucléotides libres s'apparient selon la règle : deux molécules filles identiques à la mère.</div><div class=\"etu\"><b>Étape 3</b> — <b>Pourquoi c'est beau</b> : la complémentarité explique à la fois la COPIE fidèle (hérédité), la RÉPARATION (une lettre perdue : l'autre brin sert de modèle) et l'expression (lecture d'un brin) : une seule règle d'appariement, trois fonctions vitales.</div></div></details>\n<h3>2. Du gène à la protéine : l'expression</h3>\n<div class=\"tip\"><b>Transcription</b> (noyau) : l'ADN est copié en <b>ARN messager</b> (T remplacé par U). <b>Traduction</b> (cytoplasme, sur les RIBOSOMES) : l'ARNm est lu par triplets (<b>codons</b>) : chaque codon désigne un acide aminé : la protéine s'assemble (ex. : AUG ⟶ méthionine : codon START).<br>La <b>protéine</b> (chaîne d'acides aminés repliée) fait le travail : enzyme, anticorps, kératine, hémoglobine... : <b>le gène ne « fait » rien : la protéine agit</b>.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire le code génétique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ARNm : AUG GCU UAC. Quels acides aminés ? Que devient la protéine si un nucléotide est inséré au milieu ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Découpage en codons</b> : AUG (méthionine : départ), GCU (alanine), UAC (tyrosine) : chaîne : Met-Ala-Tyr.</div><div class=\"etu\"><b>Étape 2</b> — <b>La mutation d'insertion</b> : insérer une lettre DÉCALE la lecture de TOUT ce qui suit (lecture par 3 : le cadre est cassé) : une protéine entièrement différente apparaît : généralement non fonctionnelle.</div><div class=\"etu\"><b>Étape 3</b> — <b>Comparer les mutations</b> : substitution (1 lettre changée : effet nul ou grave) vs insertion/délétion (décalage : presque toujours grave) : c'est la différence entre une coquille dans un mot et un décalage de TOUTE la phrase (« LE CHAT MANGE » ⟶ « LEC HATM ANGE » : plus rien ne se lit).</div></div></details>\n<h3>3. La cellule : unité du vivant</h3>\n<div class=\"tip\"><b>Tout être vivant est fait de cellules</b> (Schwann et Schleiden, virchow : « omnis cellula e cellula » : toute cellule vient d'une cellule). Deux plans :<br><b>Procaryote</b> (bactéries : pas de noyau, ADN libre dans le cytoplasme) vs <b>Eucaryote</b> (noyau véritable + organites : mitochondries (énergie), réticulum (synthèse), ribosomes (traduction), chloroplastes (photosynthèse, végétaux)).<br>L'être humain : ~30 000 milliards de cellules eucaryotes, ~200 types.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — une cellule, une usine</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparer la cellule à une usine : associer chaque organite à un service.</div><div class=\"etu\"><b>Étape 1</b> — <b>La direction</b> : le NOYAU (plans de fabrication : l'ADN : protégé par une enveloppe). Les plans ne sortent pas : on en sort des COPIES (ARNm).</div><div class=\"etu\"><b>Étape 2</b> — <b>La chaîne de production</b> : RIBOSOMES (ateliers d'assemblage des protéines), réticulum endoplasmique (transport interne), vésicules de Golgi (conditionnement-expédition), lysosomes (recyclage des déchets).</div><div class=\"etu\"><b>Étape 3</b> — <b>La centrale</b> : mitochondries (combustion du glucose ⟶ ATP : l'énergie utilisable : une cellule musculaire en contient des milliers) : dans une usine réelle comme dans la cellule, l'énergie est le nerf de la guerre : chaque organite malade = une panne de service : la mucoviscidose = un défaut d'EXPÉDITION (la protéine CFTR reste bloquée au Golgi).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> transcription = ADN ⟶ ARNm (dans le noyau) ; traduction = ARNm ⟶ protéine (sur les ribosomes) : ne pas inverser ; l'ARN contient U (uracile), pas T ; le codon est un TRIPLET ; une mutation ne touche que les cellules filles si elle survient dans les gamètes (héréditaire) : dans une cellule somatique, elle reste locale.</div>"},
{"id": "biodiversite-evolution", "theme": "La biodiversité et son évolution (2de)", "niveau": "2de", "titre": "La biodiversité et son évolution", "cours": "<div class=\"cours-head\"><h2>La biodiversité et son évolution</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Trois niveaux de biodiversité</h3>\n<div class=\"tip\"><b>Biodiversité</b> = diversité des <b>espèces</b> (~8-10 millions estimées, dont ~15 % décrites !), diversité <b>génétique</b> au sein de chaque espèce (les variants d'allèles), diversité des <b>écosystèmes</b> (forêts, récifs, prairies...).<br>Elle se mesure : richesse spécifique (nombre d'espèces), abondance relative, indices de diversité : et elle suit un GRADIENT (max. dans les tropiques, plus forte près de l'équateur).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — une espèce se définit par la reproduction</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi le tigre du Bengale et le tigre de Sibérie sont-ils la même espèce, alors que le lion et le tigre (ligres mis à part) ne le sont pas ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le critère</b> : une espèce = des populations qui se reproduisent ENTRE elles et donnent une descendance FERTILE.</div><div class=\"etu\"><b>Étape 2</b> — <b>Application</b> : deux populations de tigres : croisements fertiles ⟹ même espèce (sous-espèces géographiques : simple variation) : lion × tigre : descendance possible mais les ligres sont STÉRILES : deux espèces distinctes.</div><div class=\"etu\"><b>Étape 3</b> — <b>Les limites</b> : le critère ne marche pas pour les espèces asexuées (bactéries) ou fossiles : on utilise alors la ressemblance morphologique ET génétique (distance d'ADN) : l'espèce est un concept OPÉRATIONNEL, avec des zones grises (les frontières évoluent : spéciation en cours).</div></div></details>\n<h
