    "id": "immunite-1re",
    "theme": "Le système immunitaire et sa mémoire (1re)",
    "niveau": "1re",
    "titre": "Le système immunitaire et sa mémoire",
    "cours": "<div class=\"cours-head\"><h2>L'immunité innée et adaptative</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'immunité innée : la réponse rapide et non spécifique</h3>\n<ul>\n<li><b>Barrières</b> : peau, muqueuses, larmes, acidité gastrique, flore microbienne ;</li>\n<li>La <b>réaction inflammatoire</b> : rougeur, chaleur, gonflement, douleur — recrutement des cellules immunitaires ;</li>\n<li>Phagocytose : les <b>phagocytes</b> (macrophages, polynucléaires) englobent et détruisent les microbes ;</li>\n<li>Lyse par le <b>système du complément</b> ; interférons (alerte antivirale).</li>\n</ul>\n<div class=\"tip\"><b>Caractéristiques</b> : immédiate (minutes/heures), <b>non spécifique</b> (mêmes défenses contre tout intrus), sans mémoire.</div>\n\n<h3>2. L'immunité adaptative : lente, spécifique, dotée de mémoire</h3>\n<table>\n<tr><th>Étape</th><th>Acteurs</th><th>Localisation</th></tr>\n<tr><td>Présentation de l'antigène</td><td>cellule dendritique (APC) → LT4</td><td>ganglion lymphatique</td></tr>\n<tr><td>Activation / coopération</td><td>LT4 (auxiliaires), LT8, LB ; cytokines</td><td>ganglion</td></tr>\n<tr><td>Efférence humorale</td><td>LB → plasmocytes → <b>anticorps</b></td><td>plasma, tissus</td></tr>\n<tr><td>Efférence cellulaire</td><td>LT8 cytotoxiques → lyse des cellules infectées</td><td>tissus</td></tr>\n<tr><td>Mémoire</td><td>LT et LB <b>mémoire</b> (survie longue)</td><td>organisme entier</td></tr>\n</table>\n<ul>\n<li>Un anticorps reconnaît <b>précisément</b> un antigène (épitié) — spécificité ;</li>\n<li>Les LT reconnaissent l'antigène via leur <b>récepteur T</b> (TCR) + CMH.</li>\n</ul>\n\n<h3>3. La vaccination : exploiter la mémoire immunitaire</h3>\n<ol>\n<li>Injection d'un antigène inoffensif (tué, atténué, sous-unité, ARNm) ;</li>\n<li>Première réponse : lente, faible (réponse <b>primaire</b>) → production d'anticorps et de cellules mémoire ;</li>\n<li>Au contact du pathogène réel : réponse <b>secondaire</b> plus <b>rapide et plus forte</b> — l'infection est bloquée ;</li>\n<li>Vaccination de masse : <b>immunité collective</b> qui protège les non-vaccinés (l'agent pathogène circule moins).</li>\n</ol>\n<div class=\"warn\"><b>Attention :</b> le vaccin ne « met pas » des anticorps dans le corps : il <b>entraîne</b> le système immunitaire à les produire lui-même. Les rappels réactivent les cellules mémoire.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — différencier inné et adaptatif sur un schéma</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Suite à une piqûre, la plaie rougit en 1 h ; 3 jours plus tard, des anticorps spécifiques apparaissent. Identifier les phases.</div><div class=\"etu\"><b>Étape 1 — Relever les délais</b> : 1 h = réponse immédiate ; 3 jours = réponse lente à mettre en place.</div><div class=\"etu\"><b>Étape 2 — Caractériser</b> : rougeur = inflammation (innée, non spécifique) ; anticorps spécifiques = immunité <b>adaptative humorale</b>.</div><div class=\"etu\"><b>Étape 3 — Chronologie logique</b> : l'inné contient l'intrus et <b>alerte</b> (cellules dendritiques) ; l'adaptatif prend le relais et construit la mémoire.</div><div class=\"etu\"><b>Étape 4 — Anticiper</b> : en cas de nouveau contact, la réponse mémoire (secondaire) sera rapide — principe du vaccin.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Les phagocytes sont spécifiques » : la phagocytose est <b>innée, non spécifique</b>.</li>\n<li>Confondre <b>anticorps</b> (protéines sécrétées par les plasmocytes) et <b>lymphocytes</b> (cellules).</li>\n<li>« Le LT4 tue les cellules infectées » : non, il <b>coordonne</b> (auxiliaire) ; ce sont les <b>LT8</b> qui lysent.</li>\n<li>« Le vaccin guérit » : il <b>prévient</b> (prophylactique) ; certains traitements (sérothérapie) soignent, pas les vaccins.</li>\n<li>« La réponse innée ne sert qu'au début » : elle est <b>toujours</b> active et conditionne la qualité de la réponse adaptative.</li>\n</ul>\n</div>"
  },
  {
    "id": "genome-expression",
    "theme": "Le génome et l'expression des gènes (1re)",
    "niveau": "1re",
    "titre": "Le génome et l'expression des gènes",
    "cours": "<div class=\"cours-head\"><h2>Le génome et l'expression des gènes</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le génome : un livre dont seuls certains chapitres sont lus</h3>\n<ul>\n<li>Chaque cellule possède <b>tout le génome</b> (même ADN), mais n'exprime qu'une partie des gènes ;</li>\n<li>L'expression est <b>régulée</b> : selon la cellule, le moment, les signaux (hormones, facteurs de croissance) ;</li>\n<li>Preuve : toutes les cellules d'un organisme ont le même caryotype, mais des protéines différentes.</li>\n</ul>\n\n<h3>2. Les niveaux de régulation</h3>\n<table>\n<tr><th>Niveau</th><th>Mécanisme</th><th>Exemple</th></tr>\n<tr><td><b>Transcriptionnel</b></td><td>facteurs de transcription activent/répriment un gène</td><td>hormone → récepteur → gène activé</td></tr>\n<tr><td><b>Post-transcriptionnel</b></td><td>épissage alternatif, ARN interférents (miARN)</td><td>un gène → plusieurs protéines</td></tr>\n<tr><td><b>Traductionnel</b></td><td>contrôle de l'initiation, stabilité de l'ARNm</td><td>ARNm dégradé plus ou moins vite</td></tr>\n<tr><td><b>Post-traductionnel</b></td><td>phosphorylation, dégradation (ubiquitine)</td><td>enzyme activée/inactivée</td></tr>\n</table>\n<div class=\"tip\"><b>ORDRE à retenir</b> : ADN → (régulation transcription) → ARNm → (régulation traduction) → protéine → (maturation) → fonction. La régulation agit à chaque étape.</div>\n\n<h3>3. De la mutation au phénotype</h3>\n<ul>\n<li>Une <b>mutation</b> (modification de la séquence) peut : être silencieuse, changer la protéine (missense), créer un codon stop (nonsense), ou décaler le cadre (frameshift) ;</li>\n<li>Si la protéine est altérée dans une voie métabolique : <b>maladie génétique</b> (ex. mucoviscidose : CFTR défectueuse → mucus épais) ;</li>\n<li>Le phénotype moléculaire (protéine) détermine le phénotype cellulaire, puis macroscopique (les <b>3 échelles</b>).</li>\n</ul>\n\n<h3>4. Applications : thérapie génique et biotechnologies</h3>\n<ul>\n<li><b>PCR</b> : amplifier l'ADN ; <b>électrophorèse</b> : séparer les fragments ;</li>\n<li><b>Séquençage</b> : lire les génomes (diagnostic des maladies) ;</li>\n<li>Thérapie génique : introduire une <b>version saine</b> du gène (viral : Lenti, AAV ; ex. succès contre l'ataxie, la drépanocytose) ;</li>\n<li>CRISPR-Cas9 : ciseaux moléculaires — découpe ciblée de l'ADN (édition du génome).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — expliquer un phénotype par la régulation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux cellules du même organisme expriment le gène G dans l'une, pas dans l'autre. Pourtant leur ADN est identique. Comment expliquer ?</div><div class=\"etu\"><b>Étape 1 — Éliminer la piste ADN</b> : même génome → la différence n'est pas dans la séquence (sauf mutation somatique à écarter).</div><div class=\"etu\"><b>Étape 2 — Faire intervenir la régulation</b> : des <b>facteurs de transcription</b> actifs dans la cellule A recrutent l'ARN polymérase → transcription de G ; dans B, des <b>répresseurs</b> ou l'absence d'activateur bloquent.</div><div class=\"etu\"><b>Étape 3 — Décrire les conséquences</b> : pas d'ARNm de G dans B → pas de protéine G → fonction absente.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : c'est la <b>différenciation</b> : même génome, expressions différentes = types cellulaires distincts.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Toutes les cellules n'ont que les gènes utiles » : elles ont <b>tous</b> les gènes, mais expriment les leurs.</li>\n<li>« Un gène = une protéine unique » : l'<b>épissage alternatif</b> donne plusieurs ARNm/protéines d'un même gène.</li>\n<li>« La régulation n'agit que sur la transcription » : elle agit à <b>tous</b> les niveaux (traduction, maturation...).</li>\n<li>« Mutation = maladie » : une mutation peut être silencieuse ou dans une zone non codante.</li>\n<li>« CRISPR remplace l'ADN » : CRISPR-Cas9 <b>découpe</b> ; la réparation cellulaire fait le reste.</li>\n</ul>\n</div>"
  },
  {
    "id": "risques-geologiques",
    "theme": "La tectonique et les risques géologiques (1re)",
    "niveau": "1re",
    "titre": "La tectonique et les risques géologiques",
    "cours": "<div class=\"cours-head\"><h2>Les risques géologiques</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Aléa, enjeu, risque : le trio à maîtriser</h3>\n<ul>\n<li><b>Aléa</b> : le phénomène naturel (séisme, éruption, glissement) — sa probabilité et son intensité ;</li>\n<li><b>Enjeu</b> : ce qui est exposé (population, bâtiments, infrastructures) ;</li>\n<li><b>Risque</b> = aléa × enjeu × <b>vulnérabilité</b> — formule-clé pour toute question de sujet.</li>\n</ul>\n<div class=\"formule\">Risque = Aléa × Enjeu × Vulnérabilité<br>On réduit le risque en agissant sur les 3 facteurs (surtout enjeu et vulnérabilité).</div>\n\n<h3>2. Les séismes</h3>\n<ul>\n<li>Cause : rupture et glissement brusque de roches le long d'une <b>faille</b> (libération de contraintes accumulées) ;</li>\n<li>Le <b>foyer</b> (hypocentre) libère l'énergie ; l'<b>épicentre</b> est le point de la surface au-dessus ;</li>\n<li>Mesure : sismographes ; <b>magnitude</b> (énergie libérée, Richter/moment Mw) ≠ <b>intensité</b> (effets ressentis, MSK) ;</li>\n<li>Ondes sismiques : P (rapides, premières), S (secondes), de surface (destructrices).</li>\n</ul>\n\n<h3>3. Le volcanisme</h3>\n<table>\n<tr><th>Volcanisme</th><th>Caractéristiques</th><th>Exemples</th></tr>\n<tr><td><b>Effusif</b> (points chauds, dorsales)</td><td>lave fluide, coulées, éruptions calmes, cônes en pente douce</td><td>Kilauea (Hawaï), Piton de la Fournaise</td></tr>\n<tr><td><b>Explosif</b> (zones de subduction)</td><td>lave visqueuse, gaz piégés, nuées ardentes, cendres, cratères</td><td>Montagne Pelée, Vésuve, St Helens</td></tr>\n</table>\n<div class=\"warn\"><b>Ce qui tue</b> : rarement la lave ; surtout les <b>nuées ardentes</b>, les coulées de boue (lahars), les cendres, les tsunamis et l'effondrement des bâtiments (séismes).</div>\n\n<h3>4. Prévoir et se protéger</h3>\n<ul>\n<li><b>Prévision</b> : surveillance (sismographes, GPS, déformation du sol, gaz), cartographie des failles, mais <b>impossibilité de prédire</b> précisément la date d'un séisme ;</li>\n<li><b>Prévention</b> : normes <b>parasismiques</b> (construction adaptée), plans d'urgence, éducation, exercices d'évacuation ;</li>\n<li><b>Gestion de crise</b> : alerte, secours, reconstruction (retour d'expérience).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser un cas : un séisme à Haïti vs au Japon</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> 2010 : M7 à Haïti → ~200 000 morts. 2011 : M9 au Japon (séisme) → ~20 000 morts (surtout le tsunami). Pourquoi une magnitude supérieure a fait moins de victimes (hors tsunami) ?</div><div class=\"etu\"><b>Étape 1 — Comparer l'aléa</b> : Japon M9 &gt; Haïti M7 : l'aléa japonais est <b>plus fort</b>.</div><div class=\"etu\"><b>Étape 2 — Comparer les enjeux</b> : populations comparables en densité — ce n'est pas le facteur décisif.</div><div class=\"etu\"><b>Étape 3 — Comparer la vulnérabilité</b> : Japon : normes parasismiques anciennes et strictes, exercices, alertes → bâtiments qui tiennent ; Haïti : constructions fragiles, pas de normes, institutions affaiblies → effondrements massifs.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : le risque dépend <b>davantage de la vulnérabilité</b> que de l'aléa — d'où l'efficacité des politiques de prévention.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre <b>magnitude</b> (énergie, 1 valeur par séisme) et <b>intensité</b> (effets, variable selon les lieux).</li>\n<li>« On peut prédire les séismes » : on <b>prévient</b> (probabilités, surveillance), on ne les prédit pas.</li>\n<li>« Épicentre et foyer, c'est pareil » : le foyer est <b>en profondeur</b>, l'épicentre <b>en surface</b> au-dessus.</li>\n<li>« Les volcans effusifs sont dangereux par explosion » : leur lave fluide rend les éruptions <b>peu explosives</b>.</li>\n<li>« Le risque zéro existe » : on réduit le risque ; on ne l'annule pas.</li>\n</ul>\n</div>"
  },
  {
    "id": "genetique-evolution",
    "theme": "La génétique et l'évolution (Terminale)",
    "niveau": "Terminale",
    "titre": "La génétique et l'évolution",
    "cours": "<div class=\"cours-head\"><h2>La génétique et l'évolution</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La diversité génétique : se créer et se mesurer</h3>\n<ul>\n<li>Brassage <b>interchromosomique</b> (répartition aléatoire des chromosomes en méiose) et <b>intrachromosomique</b> (crossing-over, en prophase I) ;</li>\n<li>Chaque gamète est unique ; la fécondation combine au hasard 2 génomes → diversité des descendants ;</li>\n<li>Mesure : fréquences alléliques, hétérozygotie, diversité de séquences (polymorphisme).</li>\n</ul>\n\n<h3>2. Les moteurs du changement des fréquences alléliques</h3>\n<table>\n<tr><th>Mécanisme</th><th>Nature</th><th>Effet sur la diversité</th></tr>\n<tr><td><b>Migration</b> (flux de gènes)</td><td>échange d'allèles entre populations</td><td>augmente la diversité intra, homogénéise</td></tr>\n<tr><td><b>Dérive génétique</b></td><td>hasard (surtout petites populations)</td><td>réduit la diversité (allèles perdus, fixation)</td></tr>\n<tr><td><b>Sélection naturelle</b></td><td>milieu (prédateurs, climat, ressources)</td><td>avantage les allèles utiles → adaptation</td></tr>\n<tr><td><b>Mutation</b></td><td>création de nouveaux allèles</td><td>source ultime de diversité (rare)</td></tr>\n</table>\n<div class=\"tip\"><b>Critère</b> : si l'allèle est <b>avantageux dans un milieu donné</b> → sélection ; si l'avantage est dû au seul hasard d'échantillonnage → dérive.</div>\n\n<h3>3. La spéciation : naître espèce</h3>\n<ol>\n<li>Une population se <b>subdivise</b> (barrière géographique, écologique) ;</li>\n<li>Les sous-populations accumulent des différences (sélection, dérive, mutations) ;</li>\n<li>Quand elles ne peuvent plus se reproduire ensemble (<b>isolement reproductif</b>) : ce sont de <b>nouvelles espèces</b>.</li>\n</ol>\n<div class=\"warn\"><b>Critère d'espèce</b> (biologique) : interfécondité réelle et descendance fertile. Attention : le critère morphologique est trompeur (espèces jumelles).</div>\n\n<h3>4. Le модель de l'évolution : un arbre, pas une échelle</h3>\n<ul>\n<li>Tous les êtres vivants descendent d'un <b>ancêtre commun</b> ( LUCA) ;</li>\n<li>L'évolution est <b>buissonnante</b> : pas de « progrès » vers l'homme ; chaque espèce est adaptée à son milieu ;</li>\n<li>Phylogénies : arbres fondés sur les <b>caractères homologues</b> (ex. membre antérieur des tétrapodes) et les séquences (ADN/protéines) ;</li>\n<li>L'<b>homologie</b> = même origine évolutive ; l'<b>analogie</b> = même fonction, origines différentes (ailes d'oiseau et de papillon).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — reconnaître sélection ou dérive</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur une ile, une population de papillons : en 20 générations, l'allèle sombre passe de 20 % à 90 %. Les oiseaux chassent à la vue et les papillons clairs sont sur roche claire. Sélection ou dérive ?</div><div class=\"etu\"><b>Étape 1 — Chercher un lien milieu/phénotype</b> : la couleur sombre correspond-elle au substrat ? Si oui, lien écologique plausible.</div><div class=\"etu\"><b>Étape 2 — Tester le hasard</b> : une augmentation aussi orientée et rapide par pur hasard est très improbable (surtout en grande population).</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : <b>sélection naturelle</b> directionnelle (prédation par les oiseaux, avantage du camouflage).</div><div class=\"etu\"><b>Étape 4 — Contre-exemple</b> : si l'ile avait 10 papillons et aucune différence de survie, une même variation pourrait être de la <b>dérive</b> — le contexte (taille, milieu) décide.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« L'évolution vise un but » : elle est <b>aveugle</b> : le hasard (mutations) produit, le milieu <b>trie</b> postérieurement.</li>\n<li>« L'homme descend du singe » : l'homme et les singes actuels partagent un <b>ancêtre commun</b> ; aucun ne descend de l'autre.</li>\n<li>Confondre homologie (origine commune) et analogie (fonction commune).</li>\n<li>« La sélection crée les allèles » : elle ne fait que <b>trier</b> ; la mutation crée.</li>\n<li>« Une espèce « supérieure » à une autre » : pas d'échelle de valeur en biologie évolutive — des adaptations à des milieux.</li>\n</ul>\n</div>"
  },

    "id": "immunite-adaptative",
    "theme": "L'immunité adaptative et la vaccination (Terminale)",
    "niveau": "Terminale",
    "titre": "L'immunité adaptative et la vaccination",
    "cours": "<div class=\"cours-head\"><h2>L'immunité adaptative : coopération et mémoire</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La réponse adaptative : précise, lente, mémorielle</h3>\n<ul>\n<li>Repose sur les <b>lymphocytes</b> T et B, porteurs de récepteurs <b>spécifiques</b> d'un antigène (répertoire généré aléatoirement) ;</li>\n<li>Après activation (coopération cellulaire) : expansion <b>clonale</b> (prolifération des lymphocytes reconnaisant l'antigène) ;</li>\n<li>Effecteurs (LT8 cytotoxiques, plasmocytes → anticorps) + cellules <b>mémoire</b>.</li>\n</ul>\n\n<h3>2. Coopération cellulaire : le centre névralgique</h3>\n<table>\n<tr><th>Acteur</th><th>Rôle</th></tr>\n<tr><td><b>Cellule dendritique</b></td><td>capture l'antigène, le présente au LT4 naïf (ganglion)</td></tr>\n<tr><td><b>LT4 (auxiliaire)</b></td><td>chef d'orchestre : sécrète des cytokines, active LB et LT8</td></tr>\n<tr><td><b>LB</b></td><td>reconnaît l'antigène, se différencie en plasmocytes → <b>anticorps</b></td></tr>\n<tr><td><b>LT8</b></td><td>lyse les cellules infectées (perforine, Fas)</td></tr>\n</table>\n<div class=\"tip\"><b>Reconnaissance</b> : les LT ne voient l'antigène que <b>présenté</b> par le CMH ; les LB reconnaissent l'antigène <b>soluble</b>. La double reconnaissance garantit la précision.</div>\n\n<h3>3. Les anticorps : des protéines en forme de Y</h3>\n<ul>\n<li>2 sites de fixation <b>variables</b> (antigène) + 1 région constante (effecteurs : complément, phagocytes...) ;</li>\n<li>Modes d'action : <b>neutralisation</b> (blocage), <b>opsonisation</b> (marquage pour phagocytose), activation du complément (lyse) ;</li>\n<li>La spécificité vient de l'appariement <b>complémentaire</b> anticorps-antigène (clé-serrure moléculaire).</li>\n</ul>\n\n<h3>4. Mémoire immunitaire et applications</h3>\n<ul>\n<li>Réponse <b>primaire</b> : lente, faible ; réponse <b>secondaire</b> : rapide, massive (cellules mémoire déjà prêtes) ;</li>\n<li>Vaccins : imitent l'infection sans risque (antigène seul, atténué, ARNm) ;</li>\n<li>Sérothérapie : injection d'anticorps déjà formés (traitement, immunité <b>immédiate mais passagère</b>) ;</li>\n<li>Greffes : le rejet est une réponse adaptative contre les antigènes du donneur (immunosuppression, compatibilité).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — vaccin vs sérum</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une personne est mordue par un animal suspect de la rage. On injecte immédiatement des anticorps antirabiques, puis un vaccin. Pourquoi les deux ?</div><div class=\"etu\"><b>Étape 1 — Enjeu de temps</b> : la rage est létale une fois déclarée ; il faut une protection <b>immédiate</b>.</div><div class=\"etu\"><b>Étape 2 — Le sérum</b> : anticorps préformés = immunité <b>passive</b>, agit tout de suite mais est dégradée (quelques semaines).</div><div class=\"etu\"><b>Étape 3 — Le vaccin</b> : stimule la propre réponse du patient = immunité <b>active</b>, plus lente à installer mais <b>durable</b> (mémoire).</div><div class=\"etu\"><b>Étape 4 — Conclusion</b> : le sérum couvre l'urgence, le vaccin prend le relais : complémentarité passive/active.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La moelle des os produit des anticorps directs » : les LB matures dans la moelle ; la production d'anticorps vient des <b>plasmocytes</b>.</li>\n<li>« La mémoire est portée par les anticorps » : elle est portée par les <b>LT/LB mémoire</b> (cellules, pas protéines).</li>\n<li>Confondre <b>vaccin</b> (prévient, actif) et <b>sérum</b> (soigne, passif).</li>\n<li>« Les LT reconnaissent tout antigène libre » : LT = antigène <b>présenté par CMH</b> seulement.</li>\n<li>« Le rejet de greffe est inné » : c'est une réponse <b>adaptative</b> (LT, anticorps anti-CMH).</li>\n</ul>\n</div>"
  },

    "id": "climat-histoire",
    "theme": "Le climat : histoire et avenir (Terminale)",
    "niveau": "Terminale",
    "titre": "Le climat : histoire et avenir",
    "cours": "<div class=\"cours-head\"><h2>Le climat : histoire et mécanismes</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Une histoire mouvementée</h3>\n<ul>\n<li>Alternance <b>glaciaires / interglaciaires</b> (≈ 100 000 ans) sur les 800 000 dernières années ;</li>\n<li>Causes naturelles : paramètres astronomiques de <b>Milanković</b> (excentricité, obliquité, précession), l'activité solaire, les volcans, la dérive des continents ;</li>\n<li>Amplitude : ≈ 5-6 °C de moyenne entre glaciaire et interglaciaire ; le CO₂ suit (rétroaction positive : océans, biosphère).</li>\n</ul>\n\n<h3>2. Les archives du climat</h3>\n<table>\n<tr><th>Archive</th><th>Proxy</th><th>Fenêtre temporelle</th></tr>\n<tr><td><b>Glace polaire</b></td><td>bulles (CO₂, CH₄), δ(18O)/δD</td><td>800 000 ans</td></tr>\n<tr><td><b>Sédiments marins</b></td><td>foraminifères (δ18O, Mg/Ca)</td><td>des millions d'années</td></tr>\n<tr><td><b>Spéléothèmes, coraux</b></td><td>laminés isotopiques</td><td>10⁴-10⁵ ans</td></tr>\n<tr><td><b>Anneaux d'arbres</b></td><td>largeur, δ13C</td><td>10⁴ ans max</td></tr>\n</table>\n<div class=\"tip\"><b>Croiser les archives</b> : une reconstruction solide repose sur plusieurs proxies <b>concordants</b> — c'est le cœur de l'argumentaire scientifique.</div>\n\n<h3>3. Le forçage actuel : anthropique</h3>\n<ul>\n<li>Éléments nouveaux par rapport aux cycles naturels : <b>vitesse</b> (décennies vs millénaires) et <b>amplitude</b> du CO₂ (420 ppm &gt; maxima naturels) ;</li>\n<li>Signature isotopique : le carbone ajouté est <b>fossile</b> (sans 14C, appauvri en 13C) → origine charbon/pétrole/gaz ;</li>\n<li>Réchauffement mesuré : ≈ +1,2 °C depuis 1850 ; océans plus chauds et plus acides ; mers qui montent.</li>\n</ul>\n\n<h3>4. Rétroactions : la logique des boucles</h3>\n<table>\n<tr><th>Boucle</th><th>Type</th><th>Effet</th></tr>\n<tr><td>Fonte glace → moins d'albédo → plus d'absorption → plus chaud → plus de fonte</td><td>positive</td><td>amplifie</td></tr>\n<tr><td>Plus de vapeur d'eau (GES) → plus chaud → plus d'évaporation</td><td>positive</td><td>amplifie</td></tr>\n<tr><td>Plus de CO₂ → plus de photosynthèse/végétation</td><td>négative (partielle)</td><td>atténue</td></tr>\n<tr><td>Rayonnement thermique accru vers l'espace</td><td>négative (loi de Stefan)</td><td>atténue</td></tr>\n</table>\n<div class=\"warn\"><b>Vocabulaire exact</b> : « forçage » = cause initiale (CO₂) ; « rétroaction » = réponse du système (vapeur, albédo). Ne pas confondre rétroaction <b>positive</b> (amplifie, pas « bonne ») et <b>négative</b> (tamponne, pas « mauvaise »).</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — évaluer un argument sceptique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Le climat a toujours changé, donc le réchauffement actuel est naturel. » Comment répondre ?</div><div class=\"etu\"><b>Étape 1 — Accueillir le vrai</b> : oui, le climat a changé (archives) — cette prémisse est exacte.</div><div class=\"etu\"><b>Étape 2 — Comparer les vitesses</b> : les transitions naturelles prenaient des <b>millénaires</b> ; le réchauffement actuel : ~1 °C en un siècle.</div><div class=\"etu\"><b>Étape 3 — Chercher le forçage</b> : les paramètres de Milanković n'expliquent pas une hausse actuelle (on devrait être en période stable/froide) ; le CO₂ excédentaire est fossile (14C/13C).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : le changement actuel se distingue des précédents par sa <b>vitesse</b> et sa <b>cause identifiée</b> — dire « ça a toujours changé » ne dit rien de la cause présente.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Les cycles de Milanković déclenchent tout » : ils <b>modulent</b> les grandes glaciations, ils n'expliquent pas le réchauffement actuel.</li>\n<li>« Rétroaction positive = avantageuse » : positive = <b>amplifie</b> le déséquilibre, quel que soit le sens.</li>\n<li>« Le CO₂ suit la température, donc il n'est pas une cause » : les deux se renforcent (boucle) ; aujourd'hui, le CO₂ <b>mène</b> (origine fossile).</li>\n<li>Confondre <b>forçage radiatif</b> (W/m²) et température (°C).</li>\n<li>« L'océan absorbera tout » : il s'acidifie et sa capacité à pomper le CO₂ diminue (elles saturent).</li>\n</ul>\n</div>"
  },
  {
    "id": "ecosystemes-humanite",
    "theme": "Les écosystèmes et l'espèce humaine (Terminale)",
    "niveau": "Terminale",
    "titre": "Les écosystèmes et l'espèce humaine",
    "cours": "<div class=\"cours-head\"><h2>Les écosystèmes et l'humanité : services et pressions</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Écosystème : structure et fonctionnement</h3>\n<ul>\n<li><b>Biocénose</b> (êtres vivants) + <b>biotope</b> (milieu : sol, climat, eau) = <b>écosystème</b> ;</li>\n<li>Chaîne alimentaire : producteurs (photosynthèse) → consommateurs → décomposeurs ; les <b>transferts d'énergie</b> perdent ~90 % à chaque niveau (pyramide) ;</li>\n<li>Cycles de la matière : carbone, azote, eau — la matière <b>recycle</b>, l'énergie <b>circule</b> (finalement dissipée en chaleur).</li>\n</ul>\n<div class=\"tip\"><b>À retenir</b> : l'énergie ne fait que passer ; la matière, elle, se <b>récycle</b> en boucle. Cette distinction structure toute l'écologie.</div>\n\n<h3>2. Les services écosystémiques : l'humanité vit à crédit</h3>\n<table>\n<tr><th>Type</th><th>Exemples</th></tr>\n<tr><td><b>Approvisionnement</b></td><td>aliments, eau douce, bois, médicaments</td></tr>\n<tr><td><b>Régulation</b></td><td>climat (puits de CO₂), pollinisation, épuration de l'eau, inondations</td></tr>\n<tr><td><b>Culturels</b></td><td>paysages, loisirs, spiritualité</td></tr>\n<tr><td><b>Support</b></td><td>formation des sols, cycle des nutriments, photosynthèse</td></tr>\n</table>\n\n<h3>3. Les pressions humaines</h3>\n<ul>\n<li>Changement d'usage des terres (déforestation, artificialisation) — pression n° 1 sur la biodiversité terrestre ;</li>\n<li>Surexploitation (pêche, chasse), <b>espèces invasives</b>, pollutions (plastiques, pesticides, nitrates) ;</li>\n<li>Changement climatique (déplacement, extinction, blanchissement corallien) ;</li>\n<li>Sixième extinction : taux d'extinction bien supérieur au fond naturel (mesuré, documenté).</li>\n</ul>\n\n<h3>4. Répondre : connaître, protéger, restaurer</h3>\n<ul>\n<li><b>Conservation</b> (aires protégées, trames vertes) et <b>restauration</b> (réintroductions, remise en état, génie écologique) ;</li>\n<li>Agriculture durable, pêche encadrée (quotas), sobriété des usages ;</li>\n<li>Indicateurs de suivi : listes rouges UICN, indice Planète Vivante, empreinte écologique.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — un service : la pollinisation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On estime qu'un tiers de notre alimentation dépend des pollinisateurs. Les abeilles déclinent (pesticides, parasites, perte de fleurs). Analyser la situation.</div><div class=\"etu\"><b>Étape 1 — Identifier le service</b> : pollinisation = service de <b>régulation</b> (reproduction des plantes) dont dépendent cultures et écosystèmes.</div><div class=\"etu\"><b>Étape 2 — Repérer la pression</b> : pesticides (insecticides néonicotinoïdes), monocultures (moins de fleurs), parasites (varroa) — des pressions <b>cumulées</b>.</div><div class=\"etu\"><b>Étape 3 — Évaluer l'enjeu</b> : rendements agricoles, prix, sécurité alimentaire ; valeur économique estimée en centaines de milliards/an.</div><div class=\"etu\"><b>Étape 4 — Réponses</b> : interdictions ciblées (néonicotinoïdes), haies et jachères fleuries, agriculture bio — illustration du lien <b>biodiversité-bien-être humain</b>.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La matière et l'énergie se recyclent pareil » : la matière <b>recycle</b>, l'énergie se <b>dissipe</b> (chaleur) — un écosystème a besoin d'un apport permanent (Soleil).</li>\n<li>« Les décomposeurs sont inutiles » : sans eux, pas de <b>recyclage</b> de la matière — ils bouclent les cycles.</li>\n<li>« Protéger la nature = anti-économique » : les services écosystémiques ont une <b>valeur</b> (pollinisation, épuration) que leur dégradation fait perdre.</li>\n<li>« Une aire protégée suffit » : sans <b>corridors</b> (trames), les populations restent fragmentées → dérive, extinction locale.</li>\n<li>« Le climat est la cause n° 1 d'extinction » : sur terre, le <b>changement d'usage des sols</b> domine encore ; le climat amplifie.</li>\n</ul>\n</div>"
  },

    "id": "homeostasie-sante",
    "theme": "Le corps humain et l'homéostasie (Terminale)",
    "niveau": "Terminale",
    "titre": "Le corps humain et l'homéostasie",
    "cours": "<div class=\"cours-head\"><h2>L'homéostasie et la santé</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'homéostasie : garder le cap</h3>\n<ul>\n<li>Définition : maintien <b>constant</b> des paramètres internes (température, glycémie, pH, tension, hydratation) malgré les variations externes ;</li>\n<li>Système de régulation : <b>valeurs de référence</b> → <b>capteurs</b> → centre d'intégration → <b>effecteurs</b> → retour à la norme ;</li>\n<li>Principe de <b>rétroaction négative</b> : l'écart corrigé <b>réduit la correction (auto-stabilisation).</li>\n</ul>\n<div class=\"formule\">Écart vs norme → détection (capteur) → intégration (cerveau / moelle / îlots) → réponse (effecteur) → retour à la norme → arrêt de la réponse</div>\n\n<h3>2. Exemples de régulations</h3>\n<table>\n<tr><th>Paramètre</th><th>Capteur</th><th>Effecteurs</th></tr>\n<tr><td><b>Température</b></td><td>hypothalamus (thermorécepteurs)</td><td>frisson, sueur, vasoconstriction/dilatation</td></tr>\n<tr><td><b>Glycémie</b></td><td>cellules des îlots de Langerhans</td><td>insuline (↓ glycémie), glucagon (↑)</td></tr>\n<tr><td><b>Tension artérielle</b></td><td>barorécepteurs (sinus carotidien)</td><td>cœur (frein cardiaque), vaisseaux, reins</td></tr>\n<tr><td><b>Hydratation / osmolarité</b></td><td>osmorécepteurs hypothalamiques</td><td>soif, ADH (rétention d'eau rénale)</td></tr>\n</table>\n\n<h3>3. Quand la régulation dysfonctionne : maladies</h3>\n<ul>\n<li><b>Diabète</b> type 1 : destruction auto-immune des cellules β → pas d'insuline → glycémie en hausse non corrigée (polyurie, soif, cétose) ;</li>\n<li>Diabète type 2 : <b>insulinorésistance</b> (surcharge, sédentarité) ; l'insuline est produite mais inefficace ;</li>\n<li>Obésité : bilan énergétique déséquilibré ; leptine (hormone de satiété) et réponses inflammatoires du tissu adipeux ;</li>\n<li>Déshydratation, hyperthermie, hypertension : autant de ruptures d'homéostasie.</li>\n</ul>\n\n<h3>4. Prévenir et traiter : agir sur l'environnement et les habitudes</h3>\n<ul>\n<li><b>Hygiène de vie</b> : alimentation (moins de sucres rapides, fibres), activité physique (sensibilise à l'insuline), sommeil, gestion du stress ;</li>\n<li>Environnement : température adaptée, hydratation, qualité de l'air ;</li>\n<li>Traitements : insuline (diabète 1), antidiabétiques oraux (type 2), antihypertenseurs — toujours <b>en complément</b> des habitudes ;</li>\n<li>Santé publique : dépistage, éducation, prévention (vaccins, <b>déterminants sociaux et environnementaux</b> de la santé).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — diabète type 1 vs type 2</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Patient A : 14 ans, amaigri, glycémie à jeun 1,80 g/L, anticorps anti-GAD présents. Patient B : 55 ans, en surpoids, glycémie 1,30 g/L, insuline élevée. Diagnostic ?</div><div class=\"etu\"><b>Étape 1 — A</b> : jeune + anticorps anti-îlots → destruction auto-immune → <b>diabète type 1</b> (insulinodépendant, insuline absente).</div><div class=\"etu\"><b>Étape 2 — B</b> : âge + surpoids + insuline élevée → l'hormone existe mais les cellules y répondent mal : <b>insulinorésistance</b> → type 2.</div><div class=\"etu\"><b>Étape 3 — Conséquences thérapeutiques</b> : A = insuline indispensable (à vie) ; B = d'abord hygiène de vie + antidiabétiques oraux.</div><div class=\"etu\"><b>Étape 4 — Rattacher au cours</b> : dans les deux cas, la <b>rétroaction négative glycémique est rompue</b> — cause différente, même symptôme (hyperglycémie) : l'homéostasie défaille.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le diabète, c'est trop de sucre mangé » : le type 1 est <b>auto-immun</b> ; l'alimentation n'est pas la cause directe (le type 2, lui, y est favorisé).</li>\n<li>« Insuline et glucagon font pareil » : effets <b>opposés</b> (insuline ↓ glycémie ; glucagon ↑) — un couple antagoniste.</li>\n<li>« La rétroaction négative est nuisible » : elle est <b>stabilisante</b> (elle corrige l'écart) ; positive = déstabilisante.</li>\n<li>« Le foie régule la glycémie seul » : capteurs = <b>îlots de Langerhans</b> (pancréas) ; le foie est un <b>effecteur</b>.</li>\n<li>« Traitement = médicament » : dans les maladies chroniques, l'<b>hygiène de vie</b> est un traitement à part entière.</li>\n</ul>\n</div>"
  },

    "niveau": "6e",
    "titre": "La cellule, unité du vivant",
    "cours": "<div class=\"cours-head\"><h2>La cellule, unité du vivant</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Toute chose vivante est faite de cellules</h3>\n<ul>\n<li>Le <b>microscope</b> (inventé au XVIIe siècle) révèle une structure invisible à l'œil nu : la <b>cellule</b> ;</li>\n<li>Tous les êtres vivants — animaux, végétaux, champignons — sont constitués de cellules ;</li>\n<li>Certains êtres sont <b>unicellulaires</b> (une seule cellule : paramécie, levure), d'autres <b>pluricellulaires</b> (des milliards : humain ≈ 30 000 milliards).</li>\n</ul>\n\n<h3>2. Observer et reconnaître une cellule</h3>\n<table>\n<tr><th>Élément</th><th>Animal</th><th>Végétal</th></tr>\n<tr><td><b>Membrane</b> (enveloppe)</td><td>✔️ présente</td><td>✔️ présente</td></tr>\n<tr><td><b>Noyau</b> (commande, contient l'ADN)</td><td>✔️ présente</td><td>✔️ présente</td></tr>\n<tr><td><b>Cytoplasme</b> (gel intérieur)</td><td>✔️ présent</td><td>✔️ présent</td></tr>\n<tr><td><b>Paroi</b> (coque rigide de cellulose)</td><td>❌ absente</td><td>✔️ présente</td></tr>\n<tr><td><b>Chloroplastes</b> (photosynthèse)</td><td>❌ absents</td><td>✔️ présents</td></tr>\n<tr><td><b>Vacuole</b> (réservoir d'eau)</td><td>petite ou absente</td><td>✔️ grande vacuole centrale</td></tr>\n</table>\n<div class=\"tip\"><b>Truc mnémotechnique</b> : la cellule végétale a une « armure » (paroi) et des « usines solaires » (chloroplastes) ; la cellule animale n'a que sa membrane souple. Dessiner les deux côte à côte pour les retenir.</div>\n\n<h3>3. Organisation d'un être pluricellulaire</h3>\n<ul>\n<li><b>Cellules</b> → <b>tissus</b> (musculaire, nerveux...) → <b>organes</b> (estomac, feuille) → <b>systèmes</b> (digestif) → <b>organisme</b> ;</li>\n<li>Les cellules se <b>spécialisent</b> : un neurone, une cellule musculaire, un globule rouge n'ont pas la même forme ni la même fonction — mais toutes ont noyau, membrane, cytoplasme.</li>\n</ul>\n\n<h3>4. La cellule : unité de structure et de fonction</h3>\n<p>La cellule est le plus petit ensemble capable de <b>vivre</b> : isolée, une cellule se nourrit, respire, se reproduit. C'est pourquoi on dit qu'elle est l'<b>unité du vivant</b>.</p>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — identifier une cellule au microscope</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On observe une préparation : les cellules sont rectangulaires, alignées comme des briques, avec une paroi visible et des zones vertes. Animal ou végétal ?</div><div class=\"etu\"><b>Étape 1 — Chercher les indices discriminants</b> : paroi rigide → végétal ; zones vertes (chloroplastes) → végétal.</div><div class=\"etu\"><b>Étape 2 — Écarter l'animal</b> : cellule animale = membrane souple, forme irrégulière, pas de vert.</div><div class=\"etu\"><b>Étape 3 — Préciser l'organe</b> : alignées comme des briques → épiderme d'une feuille (tissu végétal).</div><div class=\"etu\"><b>Étape 4 — Rédiger</b> : présence de paroi et de chloroplastes → cellule végétale, sans doute issue d'une feuille.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre <b>membrane</b> (animale et végétale, souple) et <b>paroi</b> (végétale, rigide).</li>\n<li>Croire que toutes les cellules d'un organisme sont identiques : elles partagent la structure, pas la spécialisation.</li>\n<li>Le <b>noyau</b> n'est pas « le cerveau » au sens strict : c'est le siège de l'information génétique (ADN).</li>\n<li>Une cellule sans chloroplastes n'est pas forcément animale : la <b>racine</b> est végétale mais sans chloroplastes !</li>\n<li>Le microscope n'est pas indispensable pour voir le vivant — certaines cellules géantes (œuf) sont visibles à l'œil nu.</li>\n</ul>\n</div>"
  },
  {
    "id": "milieux-vie",
    "theme": "Les milieux de vie et leurs occupants (6e)",
    "niveau": "6e",
    "titre": "Les milieux de vie et leurs occupants",
    "cours": "<div class=\"cours-head\"><h2>Les milieux de vie et leurs occupants</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Peupler un milieu : la répartition du vivant</h3>\n<p>Dans un milieu (forêt, mare, roche littorale), les êtres vivants ne sont pas répartis au hasard : chaque espèce occupe une <b>niche</b> qui répond à ses besoins :</p>\n<ul>\n<li><b>Ressources</b> : nourriture, eau, lumière ;</li>\n<li><b>Conditions</b> : température, humidité, abri ;</li>\n<li><b>Interactions</b> : prédateurs, partenaires, concurrents.</li>\n</ul>\n\n<h3>2. Les interactions entre organismes</h3>\n<table>\n<tr><th>Interaction</th><th>Définition</th><th>Exemple</th></tr>\n<tr><td><b>Prédation</b></td><td>un être en mange un autre</td><td>le héron mange le poisson</td></tr>\n<tr><td><b>Symbiose / mutualisme</b></td><td>association bénéfique aux deux</td><td>lichen (algue + champignon)</td></tr>\n<tr><td><b>Parasitisme</b></td><td>un être vit aux dépens d'un autre</td><td>le ténia dans l'intestin</td></tr>\n<tr><td><b>Compétition</b></td><td>des êtres convoitent la même ressource</td><td>deux arbres pour la lumière</td></tr>\n</table>\n\n<h3>3. Le sol : un milieu de vie à part entière</h3>\n<ul>\n<li>Le sol contient <b>de l'eau, de l'air, des minéraux, des êtres vivants</b> (vers de terre, insectes, bactéries, champignons) et des restes d'êtres vivants en décomposition (<b>humus</b>) ;</li>\n<li>Les <b>décomposeurs</b> transforment les restes en humus, qui nourrit à nouveau les plantes : c'est un <b>cycle</b> ;</li>\n<li>Le vers de terre, en creusant, <b>aère et mélange</b> le sol : « ingénieur de l'écosystème ».</li>\n</ul>\n<div class=\"tip\"><b>Expérience-clé</b> : on reconnaît un sol vivant à sa <b>froideur relative</b> (humidité), sa <b>structure grumeleuse</b> (agrégats) et sa <b>faune visible ou non</b>. Un sol poussiéreux et sec est souvent pauvre en vie.</div>\n\n<h3>4. Influence de l'homme sur les milieux</h3>\n<ul>\n<li><b>Déforestation</b>, <b>urbanisation</b>, <b>pollution</b>, <b>agriculture intensive</b> dégradent les milieux et réduisent la biodiversité ;</li>\n<li><b>Aménagements positifs</b> : haies, passages à faune, zones protégées ;</li>\n<li>Introduction d'<b>espèces envahissantes</b> (le frelon asiatique, la tortue de Floride) : elle déséquilibre le milieu car la nouvelle espèce n'a souvent <b>pas de prédateur local</b>.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — expliquer la disparition d'une espèce</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans une mare, l'abandon d'ordures et la disparition des plantes aquatiques coïncident avec la chute du nombre de grenouilles. Expliquez.</div><div class=\"etu\"><b>Étape 1 — Identifier les besoins</b> : les grenouilles ont besoin de plantes pour pondre, se cacher et chasser (insectes).</div><div class=\"etu\"><b>Étape 2 — Relier les faits</b> : moins de plantes = moins d'abris, moins de pontes, moins de nourriture → la population chute.</div><div class=\"etu\"><b>Étape 3 — Intégrer la pollution</b> : les ordures altèrent la qualité de l'eau (moindre oxygène, toxiques) — les têtards sont très sensibles.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la répartition des êtres vivants dépend des <b>conditions du milieu</b> — les changements du milieu entraînent des changements de peuplement.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Un être vivant vit là où il veut » : non — là où ses <b>besoins</b> sont satisfaits.</li>\n<li>Confondre <b>habitat</b> (le lieu) et <b>niche</b> (le rôle et les ressources exploitées).</li>\n<li>Le sol n'est pas « de la terre morte » : c'est un <b>milieu vivant</b> riche en décomposeurs.</li>\n<li>Ne pas confondre <b>prédation</b> et <b>parasitisme</b> (le prédateur tue, le parasite vit longtemps sur son hôte).</li>\n<li>L'espèce envahissante ne « gagne » pas par magie : elle profite de l'<b>absence de prédateurs et de concurrents</b>.</li>\n</ul>\n</div>"
  },
  {
    "id": "reproduction-vivants",
    "theme": "La reproduction des êtres vivants (6e)",
    "niveau": "6e",
    "titre": "La reproduction des êtres vivants",
    "cours": "<div class=\"cours-head\"><h2>La reproduction des êtres vivants</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Assurer la descendance</h3>\n<ul>\n<li><b>Reproduction</b> = donner naissance à de nouveaux individus de la même espèce ;</li>\n<li>Deux grandes stratégies : reproduction <b>sexuée</b> (2 parents, cellules reproductrices) et <b>asexuée</b> (1 parent, sans cellule reproductrice) ;</li>\n<li>Chaque stratégie a des <b>avantages</b> : la sexuée crée de la <b>diversité</b> ; l'asexuée est <b>rapide et efficace</b> si le milieu est stable.</li>\n</ul>\n\n<h3>2. La reproduction sexuée</h3>\n<ul>\n<li>Chaque parent produit des <b>cellules reproductrices</b> (gamètes : spermatozoïde, ovule, grain de pollen...) ;</li>\n<li>Fusion des gamètes = <b>fécondation</b> → <b>cellule-œuf</b> qui se divise et donne un nouvel individu ;</li>\n<li>Le nouvel individu <b>ressemble aux parents</b> mais n'est <b>identique à aucun</b> : c'est le fruit du mélange des deux patrimoines.</li>\n</ul>\n<table>\n<tr><th>Étape</th><th>Chez l'animal (ex. souris)</th><th>Chez le végétal à fleurs</th></tr>\n<tr><td>Production des gamètes</td><td>spermatozoïdes / ovules</td><td>pollen / oosphère dans l'ovule</td></tr>\n<tr><td>Rapprochement</td><td>accouplement</td><td>pollinisation (vent, insectes)</td></tr>\n<tr><td>Fusion</td><td>fécondation interne</td><td>fécondation → graine</td></tr>\n<tr><td>Développement</td><td>embryon dans l'utérus ou œuf pondu</td><td>germination de la graine</td></tr>\n</table>\n\n<h3>3. La reproduction asexuée</h3>\n<ul>\n<li><b>Bourgeonnement</b> : un bourgeon se détache (levure, hydre) ;</li>\n<li><b>Fragmentation / bouturage</b> : un fragment repousse (lierre, étoile de mer) ;</li>\n<li><b>Multiplication végétative</b> : tubercules (pomme de terre), stolons (fraisier), rhizomes (iris) ;</li>\n<li>Les descendants sont des <b>clones</b> : identiques au parent — utile pour le jardinage (boutures) et l'agriculture.</li>\n</ul>\n<div class=\"warn\"><b>Attention :</b> beaucoup d'êtres vivants combinent les deux : la fraise se reproduit sexuellement (fleurs → graines) <b>et</b> asexuellement (stolons) selon les conditions.</div>\n\n<h3>4. Le devenir des nouveau-nés</h3>\n<ul>\n<li>Certaines espèces produisent <b>beaucoup de descendants</b> et ne s'en occupent pas (poisson, chêne : milliers de graines) ;</li>\n<li>D'autres produisent <b>peu de descendants</b> mais les <b>protègent</b> (mammifères : gestation, allaitement) ;</li>\n<li>Dans tous les cas, l'équilibre de la population dépend de la <b>survie</b> des jeunes : nourriture, prédateurs, milieu.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — reconnaître le mode de reproduction</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une colonie de levures double en quelques heures sans partenaire. Un pommier donne des fleurs qui, une fois pollinisées par les abeilles, donnent des pommes à graines. Caractérisez chaque reproduction.</div><div class=\"etu\"><b>Étape 1 — Levures</b> : pas de gamète, pas de partenaire → reproduction <b>asexuée</b> (bourgeonnement) : descendants clones.</div><div class=\"etu\"><b>Étape 2 — Pommier</b> : fleurs, pollen, graines → reproduction <b>sexuée</b> : fécondation entre gamètes, descendants variés.</div><div class=\"etu\"><b>Étape 3 — Indices à retenir</b> : présence de fleurs/pollen/graines = sexuée ; tubercules/stolons/boutures/bourgeons = asexuée.</div><div class=\"etu\"><b>Étape 4 — Nuancer</b> : le pommier se bouture aussi (greffe) — les deux stratégies coexistent souvent.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La graine est le bébé de la plante » : la graine contient l'<b>embryon</b> issu de la fécondation + des réserves.</li>\n<li>Confondre <b>pollinisation</b> (transport du pollen) et <b>fécondation</b> (fusion des gamètes).</li>\n<li>La reproduction asexuée ne produit <b>aucune diversité</b> : les clones sont sensibles de la même façon aux maladies.</li>\n<li>« Plus de descendants = espèce plus performante » : non, tout dépend de la <b>survie</b> des jeunes.</li>\n<li>Le bouturage humain n'est pas « la reproduction de la plante » : c'est une <b>multiplication végétative</b> exploitée par l'homme.</li>\n</ul>\n</div>"
  },
  {
    "id": "evolution-vivant-6e",
    "theme": "Le vivant et son évolution (6e)",
    "niveau": "6e",
    "titre": "Le vivant et son évolution",
    "cours": "<div class=\"cours-head\"><h2>Le vivant et son évolution</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les caractéristiques du vivant</h3>\n<ul>\n<li>Tout être vivant <b>naît, se nourrit, grandit, se reproduit et meurt</b> ;</li>\n<li>Il est constitué de <b>cellules</b> (l'unité du vivant) ;</li>\n<li>Il a besoin d'un <b>milieu de vie</b> qui lui fournit nourriture, eau, air, lumière et température adaptée.</li>\n</ul>\n\n<h3>2. Diversité et parentés</h3>\n<ul>\n<li>Les êtres vivants sont très <b>divers</b> (plus d'un million d'espèces décrites) ;</li>\n<li>Les ressemblances entre êtres vivants traduisent des <b>parentés</b> : le dauphin (mammifère) est plus proche du chat que du requin (poisson), même s'il vit dans l'eau ;</li>\n<li>On regroupe les êtres vivants par <b>embranchement</b> : animaux, végétaux, champignons…</li>\n</ul>\n\n<h3>3. Les adaptations au milieu</h3>\n<ul>\n<li><b>Adaptation</b> = caractère qui aide l'être vivant à survivre dans son milieu ;</li>\n<li>Exemples : le pelage épais de l'ours polaire (froid), les grandes racines du cactus (sécheresse), le bec long du colibri (fleurs profondes) ;</li>\n<li>Certaines adaptations s'expliquent par le <b>mode de vie</b> : un animal nocturne a de grands yeux.</li>\n</ul>\n\n<h3>4. Les espèces changent au cours du temps</h3>\n<ul>\n<li>Des <b>fossiles</b> montrent que des espèces du passé ont disparu et que des espèces actuelles n'existaient pas avant ;</li>\n<li>Les espèces <b>évoluent</b> : les caractères d'une population se transforment au fil des générations ;</li>\n<li>L'évolution explique à la fois la <b>diversité</b> (beaucoup d'espèces) et les <b>parentés</b> (un ancêtre commun).</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le dauphin est un poisson » : non, il n'a pas d'écailles, il allaite ses petits : c'est un <b>mammifère</b>.</li>\n<li>« Une espèce s'adapte en voulant » : l'adaptation est <b>héritée</b>, pas choisie.</li>\n<li>Confondre ressemblance (liée au mode de vie) et <b>parenté</b> (liée à l'ascendance).</li>\n<li>« Les fossiles prouvent que tout a disparu » : beaucoup de lignées ont des descendants actuels.</li>\n</ul>\n</div>"

      for (var j5 = 0; j5 <= ncol; j5++) cur.push(xs[j5].toFixed(2) + ' ' + top.toFixed(2) + ' m ' + xs[j5].toFixed(2) + ' ' + bot.toFixed(2) + ' l S');

function pdfDownload(pdfStr, filename){

  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
pgResume();
</script>
