{"t": "La biodiversité et son évolution (2de)", "q": "La diversité génétique au sein d'une espèce :", "c": ["compte pour rien", "permet à l'espèce de s'adapter aux changements (réservoir d'allèles)", "est la même chez toutes les espèces", "est nulle (tous les individus sont identiques)"], "a": 1, "e": "Plus d'allèles variés = plus de chances qu'un variant survive à un changement (épargne de la banque de gènes).", "d": "<b>Un réservoir d'adaptation</b> : l'assurance-vie de l'espèce.<div class='ex-detail'><u>Exemple rédigé</u> : le cas d'école : le bananier Cavendish : clone mondial (diversité génétique quasi nulle) : le champignon fusarium le menace partout (la même vulnérabilité : 100 000 clones identiques) : à l'inverse, les variétés sauvages de blé/riz (banques de semences) fournissent des gènes de résistance aux nouvelles maladies : la diversité génétique est une POLICE D'ASSURANCE contre l'imprévu : la consanguinité (lions d'Asie, guépards) = la police annulée.</div>"},
{"t": "La biodiversité et son évolution (2de)", "q": "Le gradient latitudinal de biodiversité signifie que :", "c": ["la diversité est identique partout", "la diversité est maximale dans les zones tropicales", "la diversité suit la Lune", "la diversité est maximale aux pôles"], "a": 1, "e": "Forêts tropicales (surtout amazoniennes), récifs coralliens : plus de chaleur + d'eau + de lumière = plus d'espèces.", "d": "<b>Maximal aux tropiques</b> : la ceinture de la vie.<div class='ex-detail'><u>Exemple rédigé</u> : les chiffres : ~un hectare de forêt amazonienne abrite plus d'espèces d'arbres que toute l'Europe (300+ contre ~250 indigènes) : les explications : énergie disponible (productivité continue : pas d'hiver), stabilité ancienne (les tropiques n'ont pas été razés par les glaciations : plus de TEMPS de spéciation), niches emboîtées (canopée étagée). Conséquence : c'est aussi là que la déforestation fait le plus de dégâts IRREVERSIBLES : chaque hectare tropical brûlé détrient plus d'espèces uniques qu'ailleurs.</div>"},
{"t": "La biodiversité et son évolution (2de)", "q": "Les « services écosystémiques » sont :", "c": ["les bénéfices gratuits que la biodiversité fournit (pollinisation, purification de l'eau, stockage de carbone...)", "des applications de téléphonie", "des prestations payantes aux humains", "des espèces au service des riches"], "a": 0, "e": "Le vivant « travaille » pour nous gratuitement : pollinisation, sols, médicaments, régulation du climat : d'où l'enjeu économique de sa protection.", "d": "<b>Les bénéfices gratuits</b> : l'infrastructure invisible.<div class='ex-detail'><u>Exemple rédigé</u> : l'inventaire chiffré : pollinisation (150-500 Mds €/an), sols fertiles (vers de terre : labours biologiques), épuration de l'eau (zones humides : station gratuite), agents pharmaceutiques (pénicilline : moisissure), régulation climatique (forêts + océans : la moitié de nos émissions absorbée) : l'argument décisif : ces services ne sont PAS remplaçables par la technologie à grande échelle (qui polliniserait les vergers à la main des abeilles ?) : protéger la biodiversité = protéger nos propres infrastructures vitales.</div>"},
{"t": "Le climat, l'atmosphère et les gaz à effet de serre (2de)", "q": "Sans effet de serre, la température moyenne de la Terre serait d'environ :", "c": ["0 °C", "+30 °C", "-18 °C", "+15 °C"], "a": 2, "e": "L'effet de serre naturel apporte +33 °C : de -18 °C (Terre « nue ») à +15 °C : c'est ce qui rend la vie possible.", "d": "<b>-18 °C</b> : la Terre congélée sans GES.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul : la Terre reçoit l'énergie solaire : sans atmosphère piète, elle réémet tout : équilibre à -18 °C (banquise mondiale, océans gelés en profondeur) : les GES (vapeur d'eau en tête, puis CO₂, méthane) retiennent une partie de l'infrarouge : +33 °C de bonus : la vie liquide existe. Piège : l'effet de serre n'est PAS en soi un « problème » : c'est un mécanisme vital : la question est son AMPLIFICATION par nos émissions : dire « lutter contre l'effet de serre » est un raccourci fautif (on lutte contre l'excès).</div>"},
{"t": "Le climat, l'atmosphère et les gaz à effet de serre (2de)", "q": "Les gaz à effet de serre retiennent :", "c": ["l'infrarouge (la chaleur) renvoyé par la Terre", "la lumière visible du Soleil", "les UV uniquement", "le vent"], "a": 0, "e": "Ils laissent passer le visible mais piègent l'infrarouge émis par la surface : asymétrie à l'origine de l'effet de serre.", "d": "<b>L'infrarouge terrestre</b> : le filtre asymétrique.<div class='ex-detail'><u>Exemple rédigé</u> : le parcours : rayonnement solaire (visible : traverse l'atmosphère) ⟹ sol chauffé ⟹ le sol émet de l'INFRAROUGE ⟹ les molécules GES (CO₂ : 3 atomes : modes de vibration qui « répondent » à l'infrarouge) l'absorbent et le réémettent dans toutes les directions, dont vers le bas ⟹ la surface se refroidit moins. Piège : « ils bloquent le Soleil » : c'est l'INVERSE (N₂ et O₂, 99 % de l'air, laissent tout passer : ce sont les traces de GES qui travaillent).</div>"},
{"t": "Le climat, l'atmosphère et les gaz à effet de serre (2de)", "q": "La concentration de CO₂ est passée de ~280 ppm (préindustriel) à environ :", "c": ["300 ppm", "420 ppm aujourd'hui", "600 ppm", "1000 ppm"], "a": 1, "e": "~420 ppm et +2-3 ppm/an : la plus haute depuis au moins 800 000 ans (mesures dans les glaces).", "d": "<b>~420 ppm</b> : la courbe de Keeling qui monte.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve directe : à Mauna Loa (Hawaii), le CO₂ est mesuré depuis 1958 : 315 ppm ⟹ 420+ : oscillation annuelle (printemps boréal : la végétation absorbe : le tracé « scie ») sur une tendance de fond qui ACCÉLÈRE : les bulles d'air des carottes de glace (800 000 ans) montrent une plage de 180-280 ppm jamais dépassée : nous sommes HORS échelle : et ~40 % de ce CO₂ en trop reste dans l'atmosphère (le reste : océans + biosphère).</div>"},
{"t": "Le climat, l'atmosphère et les gaz à effet de serre (2de)", "q": "Le plus grand réservoir de carbone « échangeable » de la planète :", "c": ["l'atmosphère", "les animaux", "l'océan", "les forêts"], "a": 2, "e": "L'océan contient ~38 000 Gt de carbone (50× l'atmosphère) : il absorbe ~un quart de nos émissions... en s'acidifiant.", "d": "<b>L'océan</b> : le réservoir géant.<div class='ex-detail'><u>Exemple rédigé</u> : la hiérarchie des réservoirs : océan (~38 000 Gt) : de loin le premier : le CO₂ dissous forme du carbonate/bicarbonate (tampon) : ce stockage a un prix : ACIDIFICATION (pH -0,1 = +30 % d'acidité depuis 1850 : les coraux et huîtres peinent à calcifier) ; forêts + sols (~2000) : les sols stockent plus que la végétation visible ; atmosphère (~850) : le PLUS PETIT : c'est pour ça qu'une injection modérée de fossiles y pèse autant. Piège : les fossiles (charbon/pétrole) sont un stock ENFERMÉ (hors cycle rapide) : c'est son excavation qui crée le déséquilibre.</div>"},
{"t": "Le climat, l'atmosphère et les gaz à effet de serre (2de)", "q": "Les carottes de glace polaires renseignent le passé parce que :", "c": ["le vent y laisse des journaux", "elles contiennent des thermomètres", "elles emprisonnent des bulles d'air ancien (CO₂) et des isotopes qui dépendent de la température", "la glace est froide"], "a": 2, "e": "Chaque couche de neige compactée archive l'atmosphère du moment : 800 000 ans de frise CO₂/température.", "d": "<b>Bulles + isotopes</b> : l'archive congelée.<div class='ex-detail'><u>Exemple rédigé</u> : la méthode : à Vostok et Dome C (Antarctique), on fore jusqu'à 3300 m de glace : la date des couches (comme les cernes : couches de cendres volcaniques = repères) : les BULLES = prélèvements d'atmosphère (CO₂, CH₄ mesurés) : le rapport isotopique (¹⁸O/¹⁶O) de la glace = thermomètre : RESULTAT : 8 cycles glaciaires, CO₂ et température liés (180-280 ppm) : aujourd'hui 420 ppm : l'anomalie moderne est sans précédent sur la période : c'est LA donnée qui clôt le débat scientifique.</div>"},
{"t": "Le climat, l'atmosphère et les gaz à effet de serre (2de)", "q": "Un hiver très froid en Europe réfute-t-il le réchauffement ?", "c": ["Oui si les journalistes en parlent", "Oui, preuve absolue", "Non : le climat est une moyenne longue (30 ans) : un événement local ne dit rien de la tendance", "La question n'a pas de sens"], "a": 2, "e": "Temps = événement court/local : climat = statistique longue/globale : la moyenne mondiale monte malgré les extrêmes froids ponctuels.", "d": "<b>Non</b> : la confusion temps/climat.<div class='ex-detail'><u>Exemple rédigé</u> : la distinction : le TEMPS, c'est l'instant et le lieu (il neige à Paris le 12 janvier) : le CLIMAT, c'est la STATISTIQUE sur 30 ans des températures, pluies, vents : on peut avoir un hiver froid ponctuel dans un monde qui se réchauffe en moyenne (+1,2 °C) : mieux : le réchauffement peut PERTURBER le jet stream et favoriser des descentes d'air arctique ponctuelles. Piège : « il neige donc pas de réchauffement » = confondre un tirage et la moyenne des dés : c'est LE sophisme climatique le plus répandu.</div>"},
{"t": "Le climat, l'atmosphère et les gaz à effet de serre (2de)", "q": "L'acidification des océans vient de :", "c": ["les vagues", "l'absorption du CO₂ en excès (acide carbonique formé)", "le sel", "les déchets plastiques"], "a": 1, "e": "CO₂ + H₂O ⟶ acide carbonique : le pH baisse : coraux, huîtres et plancton calcificateurs souffrent.", "d": "<b>L'absorption du CO₂</b> : la facture cachée.<div class='ex-detail'><u>Exemple rédigé</u> : la chimie : l'océan absorbe ~25 % de nos émissions : CO₂ + H₂O ⟶ H₂CO₃ (acide carbonique) ⟶ libère H⁺ : le pH baisse (8,2 ⟹ 8,1 : +30 % d'acidité : l'échelle pH est logarithmique !) : les ions carbonate (matière des coquilles) se raréfient : coraux blanchis, huîtres fragiles, plancton menacé (base des chaînes alimentaires + pompe à carbone). Piège : ce problème est INVISIBLE et souvent oublié derrière la température : c'est pourtant une conséquence majeure, déjà mesurable, du CO₂.</div>"},
{"t": "Le climat, l'atmosphère et les gaz à effet de serre (2de)", "q": "Le méthane (CH₄) :", "c": ["n'existe pas naturellement", "n'est pas un GES", "est un GES bien plus puissant que le CO₂ à horizon court (~80× sur 20 ans)", "refroidit la planète"], "a": 2, "e": "Sources : élevage (fermentation), rizières, fuites de gaz, dégel du permafrost : fort impact court, durée de vie ~12 ans.", "d": "<b>~80× le CO₂ (sur 20 ans)</b> : le GES sous-estimé.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul : sur 100 ans, CH₄ ≈ 28× le CO₂ : sur 20 ans, ≈ 80× (il se dégrade vite : ~12 ans : mais pendant ce temps il piège énormément) : sources : bétail (éructations des ruminants : fermentation entérique), rizières, décharges, FUITES de gaz naturel (le « gaz vertueux » qui fuit perd tout son avantage), dégel du permafrost (boucle dangereuse : le réchauffement libère du méthane qui réchauffe...). Enjeu : réduire le méthane = gagner du temps RAPIDEMENT (lent pour le CO₂, vite pour le CH₄).</div>"},
{"t": "Le climat, l'atmosphère et les gaz à effet de serre (2de)", "q": "L'Accord de Paris (2015) vise à :", "c": ["arrêter l'effet de serre naturel", "limiter le réchauffement bien en dessous de +2 °C, en visant +1,5 °C", "refroidir la Terre de 2 °C", "interdire la météo"], "a": 1, "e": "Objectif mondial : contenir l'augmentation de température (par rapport à l'ère préindustrielle) : chaque dixième de degré compte.", "d": "<b>« Bien en dessous de 2 °C, viser 1,5 °C »</b> : la boussole collective.<div class='ex-detail'><u>Exemple rédigé</u> : le sens des chiffres : +1,5 vs +2 °C paraît peu : or la différence entre les deux mondes est majeure : récifs coralliens (-70 à -99 %), été caniculaire multiplié, montée des eaux : chaque dixième de degré évité = dégâts évités (les climatoscepteurs jouent sur l'illusion des petits chiffres : les systèmes climatiques, eux, répondent violemment au dixième près). Piège : l'objectif ne concerne pas l'effet de serre NATUREL (irréversible et vital) : il concerne l'excès lié aux combustibles fossiles.</div>"},
{"t": "Le climat, l'atmosphère et les gaz à effet de serre (2de)", "q": "Le trou dans la couche d'ozone et le réchauffement climatique :", "c": ["sont le même problème", "ont été résolus ensemble en 1990", "sont deux problèmes distincts (UV/CFC : stratosphère : CO₂/heat : climat)", "sont des mythes"], "a": 2, "e": "Ozone : protection contre les UV, détruit par les CFC (aérosols) : réglé par le protocole de Montréal (1987) : réchauffement : GES/combustibles : causes et solutions différentes.", "d": "<b>Deux problèmes distincts</b> : la confusion à éviter.<div class='ex-detail'><u>Exemple rédigé</u> : le tri : ① OZONE (stratosphère) : couche qui filtre les UV : détruite par les CFC (fluides frigorifiques, aérosols) : résolue par le protocole de Montréal (1987 : interdiction mondiale : la couche se répare : retour ~2060) : un succès diplomatique cité en exemple ; ② CLIMAT : excès de GES (CO₂ des combustions) : en cours, non résolu. Piège : les deux partagent un air de famille (atmosphère, chimie, traités) mais ni les causes, ni les gaz, ni les échelles de temps : un QCM adore les mélanger.</div>"},
{"t": "Le système immunitaire et sa mémoire (1re)", "q": "La spécificité de la réponse immunitaire repose sur :", "c": ["la fabrication de nouveaux gènes pendant l'infection", "l'agressivité générale du système", "le hasard de la fièvre", "la sélection de lymphocytes dont le récepteur épouse DÉJÀ l'antigène (sélection clonale)"], "a": 3, "e": "La bibliothèque de récepteurs est préconstituée : l'antigène ne fait que TRIER le clone correspondant.", "d": "<b>La sélection clonale</b> : le tri dans la bibliothèque.<div class='ex-detail'><u>Exemple rédigé</u> : le concept : chaque LB/LT naît avec UN récepteur unique (recombinaison génétique au hasard : la diversité précède l'ennemi) : l'antigène n'apprend RIEN au système : il SÉLECTIONNE le clone qui le reconnaît déjà : ce clone prolifère (armée de clones) : plasmocytes + mémoire. Piège : « le système fabrique l'anticorps sur mesure APRÈS » : faux : l'anticorps préexiste sur le récepteur du LB : la sélection + l'amplification font le reste (Burnet, 1957).</div>"},
{"t": "Le système immunitaire et sa mémoire (1re)", "q": "Les plasmocytes sont :", "c": ["des cellules infectées", "des lymphocytes B différenciés qui produisent massivement des anticorps", "des globules rouges", "des virus"], "a": 1, "e": "Usines à sécrétion : ~2000 anticorps/seconde : l'immunité humorale en action.", "d": "<b>LB différenciés sécréteurs</b> : les usines à anticorps.<div class='ex-detail'><u>Exemple rédigé</u> : le parcours du LB : BCR (récepteur membraneire) ⟹ activation (antigène + aide LT4) ⟹ divisions ⟹ PLASMOCYTE : le cytoplasme se remplit de réticulum (l'organe de sécrétion) : production ~2000 molécules/s pendant quelques jours : leur mort explique la chute des anticorps après l'infection : SEULE la lignée mémoire (LB mémoire : longue vie, prêts à se réactiver) traverse le temps : c'est la mémoire, pas les anticorps circulants.</div>"},
{"t": "Le système immunitaire et sa mémoire (1re)", "q": "Les LT4 sont appelés « chef d'orchestre » car :", "c": ["ils sécrètent des interleukines qui activent LB et LTc", "ils stockent le virus", "ils tuent les cellules infectées directement", "ils fabriquent des anticorps"], "a": 0, "e": "Sans leurs signaux (interleukines), LB et LTc restent inertes : le VIH exploite cette position centrale.", "d": "<b>Interleukines</b> : la partition du chef.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement : l'activation d'un LB exige DEUX signaux : l'antigène (BCR) + une interleukine des LT4 (le « feu vert » : évite les activations fantaisistes) : les LTc exigent aussi la validation : en détruisant les LT4, le VIH décapite TOUT le système adaptatif : anticorps faibles, tueurs inactifs : les infections opportunistes (SIDA) profitent du vide : la trithérapie restaure les effectifs : la hiérarchie immunitaire reprend.</div>"},
{"t": "Le système immunitaire et sa mémoire (1re)", "q": "Les LTc cytotoxiques éliminent les cellules infectées :", "c": ["en les phagocytant", "par la fièvre", "en les infectant à leur tour", "en les perçant au contact (perforines) après avoir reconnu l'antigène présenté à leur surface"], "a": 3, "e": "La cellule infectée présente des fragments viraux (CMH-I) : le LTc reconnaît, contacte et déverse perforines/granzymes : mort programmée.", "d": "<b>Contact + perforines</b> : le Duo létal.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario : un virus se réplique DANS une cellule : les anticorps (dehors) n'y peuvent rien : la cellule « publie » le crime en exposant des fragments viraux sur son CMH-I : le LTc (récepteur complémentaire) se colle : libère perforines (trous) et granzymes (déclenchent l'apoptose) : la cellule meurt AVANT que les virus ne finissent leur replication : le LTc détaché part tuer ailleurs (il ne meurt pas : réutilisable). Piège : le LTc ne touche que les cellules qui PRÉSENTENT l'antigène : les cellules saines ne présentent rien de viral : l'immunité cellulaire est CHIRURGICALE.</div>"},
{"t": "Le système immunitaire et sa mémoire (1re)", "q": "La mémoire immunitaire à long terme est portée par :", "c": ["les anticorps circulants uniquement", "la peau", "les lymphocytes mémoire (LB et LT) de longue durée", "les plaquettes"], "a": 2, "e": "Les anticorps déclinent en quelques mois : les cellules mémoire survivent des décennies, prêtes à se réactiver.", "d": "<b>Les cellules mémoire</b> : le souvenir vivant.<div class='ex-detail'><u>Exemple rédigé</u> : l'épreuve du temps : après la rougeole, les anticorps baissent, MAIS des LB et LT mémoire persistent (dans les ganglions, la moelle, la rate : durée de vie = décennies) : au recontact : ces cellules se réactivent en quelques heures (pas besoin de re-sélectionner dans la bibliothèque : l'armée est déjà là) : c'est l'immunité DURABLE (varicelle, rougeole : une vie) : le vaccin fabrique exactement ces cellules sans passer par la maladie.</div>"},
{"t": "Le système immunitaire et sa mémoire (1re)", "q": "Un vaccin à ARN messager (type COVID) contient :", "c": ["des antibiotiques", "des anticorps prêts", "le virus complet atténué", "l'ordre de fabriquer UN antigène (la protéine Spike) : nos cellules le lisent, le produisent, l'exposent : réponse immunitaire"], "a": 3, "e": "L'ARNm (enveloppé dans des lipides) entre dans quelques cellules : elles produisent la protéine virale : le système immunitaire s'entraîne dessus.", "d": "<b>Un plan d'antigène</b> : l'usine temporaire.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne : ARNm codant la Spike ⟶ enveloppe lipidique ⟶ fusion avec quelques cellules musculuses ⟶ traduction en protéine Spike ⟶ exposition au CMH + reconnaissance par LB/LT ⟶ anticorps + mémoire : l'ARNm se dégrade en jours (il ne touche pas l'ADN du noyau : les gènes restent intacts) : c'est une technologie de « plan jetable ». Piège : le vaccin ne contient NI virus vivant complet, NI anticorps : il contient une INSTRUCTION temporaire.</div>"},
{"t": "Le système immunitaire et sa mémoire (1re)", "q": "Le rejet de greffe est dû à :", "c": ["la mortalité du greffon", "une allergie aux médicaments", "l'absence de réponse immunitaire", "la reconnaissance des molécules HLA du donneur comme du non-soi"], "a": 3, "e": "Les HLA = carte d'identité génétique : plus elle diffère, plus les LTc et anticorps attaquent : compatibilité + immunosuppresseurs nécessaires.", "d": "<b>HLA = non-soi</b> : la carte d'identité.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : les molécules HLA (extrêmement polymorphes : des dizaines de milliers de variantes : c'est ce qui rend chaque quasi-unique) présentent les fragments cellulaires : le système immunitaire « calibre » ses LT sur SES HLA : des HLA étrangers ⟹ activation des LTc ⟹ destruction du greffon : solutions : ① greffon HLA-proche (fratrie : 25 % d'identique) ; ② immunosuppresseurs (le prix : infections, cancers : la tolérance forcée) : la greffe est une négociation permanente avec la police immunitaire.</div>"},
{"t": "Le système immunitaire et sa mémoire (1re)", "q": "Le choc anaphylactique est :", "c": ["une réponse mémoire normale", "un rhume", "la première infection", "une réaction allergique massive et généralisée (chute de tension, gonflement des voies aériennes : urgence absolue)"], "a": 3, "e": "Des IgE déclenchent une libération massive d'histamine : adrénaline immédiate (stylo auto-injecteur).", "d": "<b>L'urgence allergique</b> : l'histamine lâchée partout.<div class='ex-detail'><u>Exemple rédigé</u> : la cascade : allergène (arachide, venin, médicament) ⟹ pontage des IgE sur les mastocytes de tout le corps ⟹ histamine massive : vaisseaux dilatés (chute de tension), perméabilité (œdème : la gorge gonfle : asphyxie), bronchospasme : l'adrénaline inverse tout (vasoconstriction, bronches ouvertes) : c'est pour ça que les allergies sévères se promènent avec un stylo d'épinéphrine : chaque seconde compte.</div>"},
{"t": "Le système immunitaire et sa mémoire (1re)", "q": "Le diabète de type 1 est une maladie :", "c": ["auto-immune (les LTc détruisent les cellules ß du pancréas productrices d'insuline)", "liée à l'âge uniquement", "due au sucre", "infectieuse bactérienne"], "a": 0, "e": "La tolérance au soi est brisée : l'insuline n'est plus produite : injections à vie (à ne pas confondre avec le type 2 : résistance à l'insuline).", "d": "<b>Auto-immune</b> : l'ami devenu cible.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : normalement, les lymphocytes auto-réactifs sont éliminés (tolérance) : ici, des LTc identifient un antigène des cellules ß comme étranger : destruction progressive : insuline = 0 : glucose bloqué hors des cellules (hyperglycémie, amaigrissement, cétose) : le traitement substitue l'hormone (injections/pompe) : le système immunitaire, lui, reste déréglé (les essais d'immunomodulation cherchent à rééduquer cette erreur). Piège : type 1 ≠ type 2 : le second produit de l'insuline mais les cellules y résistent : deux maladies, un même symptôme.</div>"},
{"t": "Le système immunitaire et sa mémoire (1re)", "q": "Une 2e rencontre avec le même antigène déclenche une réponse :", "c": ["plus rapide et plus intense (les cellules mémoire court-circuitent la sélection initiale)", "identique à la première", "inexistante", "plus lente"], "a": 0, "e": "Jours ⟶ heures, anticorps ×10, LTc prêts : la maladie est éteinte avant de naître.", "d": "<b>Plus rapide et plus forte</b> : le raccourci mémoire.<div class='ex-detail'><u>Exemple rédigé</u> : les courbes : 1re infection : latence de ~5-7 jours (sélection, amplification) : on est malade ; 2e : les clones mémoire (déjà sélectionnés, déjà nombreux) se réactivent en quelques heures : pics d'anticorps 10× supérieurs, LTc immédiatement cytotoxiques : le virus est éteint à l'étincelle : c'est EXACTEMENT ce que le vaccin obtient sans la première maladie : la courbe comparative 1re/2e réponse est le schéma le plus demandé du chapitre.</div>"},
{"t": "Le génome et l'expression des gènes (1re)", "q": "Une cellule de peau et un neurone ont :", "c": ["des génomes différents", "des ADN partiellement supprimés selon l'organe", "des gènes recréés à la demande", "le même génome mais des expressions différentes (protéines différentes)"], "a": 3, "e": "Même ADN, lecture différente : c'est le principe de la différenciation cellulaire.", "d": "<b>Même génome, expression différente</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve expérimentale : Dolly (1996) : le noyau d'une cellule de mamelle (adulte : différenciée) a reconstruit UNE BREBIS ENTIÈRE : le noyau gardait tous les gènes : donc la différenciation n'EST PAS une perte : c'est un choix de lecture : le neurone éteint les gènes de kératine, la peau ceux des canaux sodiques : deux bibliothèques identiques, deux livres ouverts. Piège : les exceptions existent (globules rouges : noyau expulsé : lymphocytes : gènes réarrangés) mais elles confirment la règle.</div>"},
{"t": "Le génome et l'expression des gènes (1re)", "q": "Un promoteur est :", "c": ["un ARN messager", "la protéine produite par le gène", "une séquence d'ADN en amont du gène où se fixent les facteurs de transcription (l'interrupteur)", "un ribosome"], "a": 2, "e": "Zone de contrôle non codante : sa fixation des facteurs déclenche (ou bloque) la transcription.", "d": "<b>L'interrupteur du gène</b> : la zone de contrôle.<div class='ex-detail'><u>Exemple rédigé</u> : le schéma : [promoteur]-[séquence codante] : l'ARN polymérase ne peut s'élancer QUE si des facteurs de transcription (protéines) se sont fixés au promoteur : ces facteurs sont eux-mêmes les produits d'AUTRES gènes (hormonaux, développementaux) : des cascades de commandes : chaque cellule est un réseau d'interrupteurs : c'est ce qui fait qu'un gène peut être ON dans le foie et OFF dans le cerveau. Piège : le promoteur ne code AUCUN acide aminé : c'est une ADRESSE, pas une recette.</div>"},
{"t": "Le génome et l'expression des gènes (1re)", "q": "L'épissage alternatif permet :", "c": ["de produire plusieurs protéines différentes à partir d'un seul gène (fragments choisis de l'ARN)", "de traduire sans ribosome", "d'effacer les mutations", "de dupliquer l'ADN"], "a": 0, "e": "Les introns sont retirés de façon variable : les exons s'assemblent différemment : 20 000 gènes ⟶ ~100 000 protéines.", "d": "<b>1 gène ⟶ plusieurs protéines</b> : la combinatoire des exons.<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe apparent : ~20 000 gènes humains, mais ~100 000 protéines : l'ARN prémessager contient exons (codants) et introns (non codants) : l'épissage RETIRE les introns, et selon les cellules, certains exons sont aussi écartés : exon A+B+C dans le muscle, A+C dans le neurone : deux protéines, un gène. Piège : c'est un niveau de régulation POST-transcriptionnel : le choix se fait sur l'ARN, pas sur l'ADN (le génome n'est pas modifié).</div>"},
{"t": "Le génome et l'expression des gènes (1re)", "q": "La brebis Dolly a prouvé que :", "c": ["les cellules musculaires n'ont pas d'ADN", "le noyau d'une cellule différenciée contient tout le programme génétique (réversibilité)", "les clones sont impossibles", "les ovules n'ont pas de noyau"], "a": 1, "e": "Transfert d'un noyau de cellule de mamelle dans un ovule énucléé : un individu complet est né : le génome reste complet.", "d": "<b>Le génome complet dans une cellule spécialisée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement : si la différenciation « brûlait » les gènes inutiles, le noyau d'une cellule de mamelle ne pourrait donner qu'une mamelle : OR il a donné une brebis entière (avec mamelles, sabots, cœur...) : donc RIEN n'a été perdu : les gènes étaient ÉTEINTS, réactivables : la différenciation = état d'EXPRESSION stable et réversible, pas une amputation génétique : c'est l'expérience fondatrice de la biologie du développement moderne (et l'argument central des questions de type « montrez que... »).</div>"},
{"t": "Le génome et l'expression des gènes (1re)", "q": "Dans CRISPR-Cas9, l'ARN guide sert à :", "c": ["traduire la protéine", "coller les brins", "repérer la séquence d'ADN à couper (complémentarité)", "détruire la cellule"], "a": 2, "e": "Sa séquence, complémentaire de la cible, amène la Cas9 à l'endroit exact : les ciseaux moléculaires ont un GPS.", "d": "<b>Le GPS moléculaire</b> : la complémentarité en action.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : on conçoit un ARN guide (20 lettres) complémentaire de la zone à éditer : la Cas9 (enzyme) s'y associe : le complexe balaie l'ADN : au point de complémentarité parfaite, la Cas9 COUPE les deux brins : la cellule répare (avec ou sans modèle de correction) : en changeant l'ARN guide (20 lettres à écrire), on retargete l'outil : c'est cette simplicité qui a démocratisé l'édition du génome (Nobel 2020 : Doudna et Charpentier).</div>"},
{"t": "Le génome et l'expression des gènes (1re)", "q": "Le polymorphisme génétique désigne :", "c": ["des maladies rares", "des mutations artificielles", "la présence d'un seul allèle par gène", "l'existence naturelle de variants d'allèles dans la population (couleur des yeux, groupe sanguin...)"], "a": 3, "e": "Les variants « normaux » qui font que chaque individu est génétiquement unique (hors vrais jumeaux).", "d": "<b>La diversité normale des allèles</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la distinction : MUTATION = l'événement (erreur de copie) : POLYMORPHISME = son issue si elle est neutre et répandue (version « acceptable » du gène : >1 % de la population) : les ABO du groupe sanguin, la couleur des yeux, la lactase persistance (apparue ~7500 ans : avantage des éleveurs) : la plupart des mutations sont NEUTRES : elles fondent l'unicité des individus ET la matière première de l'évolution (sans variantes, rien à sélectionner) : la maladie (drépanocytose) n'est qu'un cas particulier où le variant pénalise son porteur.</div>"},
{"t": "Le génome et l'expression des gènes (1re)", "q": "L'adrénaline produit des effets différents selon les organes car :", "c": ["les organes n'ont pas d'ADN", "elle est différente dans chaque organe", "chaque organe exprime des RÉCEPTEURS différents (répertoire d'expression propre)", "elle change de forme"], "a": 2, "e": "La même molécule circule partout : seules les cellules exprimant le bon récepteur répondent (cœur β1, bronches β2...).", "d": "<b>Les récepteurs exprimés décident</b> : la serrure locale.<div class='ex-detail'><u>Exemple rédigé</u> : le dispositif : adrénaline sécrétée (stress) : elle touche TOUTES les cellules baignées par le sang : mais seule la cellule portant un récepteur adrénergique « entend » : cœur : β1 ⟹ accélère : bronches : β2 ⟹ dilate : vaisseaux digestifs : α ⟹ resserre : c'est L'EXPRESSION du gène du récepteur qui fait la réponse : une seule consigne, des métiers différents : ce principe (récepteurs = lecture cellulaire du message) explique TOUTE l'endocrinologie.</div>"},
{"t": "Le génome et l'expression des gènes (1re)", "q": "Une thérapie génique vise à :", "c": ["introduire une version fonctionnelle du gène défectueux dans les cellules du patient", "supprimer tous les gènes", "traiter les symptômes par des médicaments classiques", "remplacer les protéines par hasard"], "a": 0, "e": "Livrer le gène sain (vecteur viral atténué) : les cellules produisent enfin la protéine manquante : exemple : ADA-SCID.", "d": "<b>Livrer le gène sain</b> : corriger à la source.<div class='ex-detail'><u>Exemple rédigé</u> : le cas d'école : ADA-SCID (déficit immunitaire : les « enfants-bulles » n'ont pas l'enzyme ADA : les lymphocytes meurent) : protocole : prélever les cellules souches du patient ⟶ y insérer le gène ADA sain (vecteur viral désarmé) ⟶ les réinjecter : les cellules corrigées produisent l'enzyme : le système immunitaire se construit : guérison durable sans bulle : l'idée : traiter la CAUSE (le gène) plutôt que la conséquence : c'est le changement de paradigme de la médecine moléculaire.</div>"},
{"t": "Le génome et l'expression des gènes (1re)", "q": "Les facteurs de transcription sont :", "c": ["des ribosomes", "des mutations", "des ARN messagers", "des protéines qui se fixent sur l'ADN pour activer ou réprimer la transcription"], "a": 3, "e": "Les « doigts sur les interrupteurs » : ils recrutent (ou bloquent) l'ARN polymérase au niveau des promoteurs.", "d": "<b>Des protéines régulatrices</b> : les mains sur les interrupteurs.<div class='ex-detail'><u>Exemple rédigé</u> : la logique : un facteur de transcription reconnaît une COURTE séquence (motif) dans le promoteur : sa fixation recrute la machinerie (ARN polymérase) ⟹ gène ON : ou au contraire compacte l'ADN sur les histones ⟹ OFF : ils sont eux-mêmes les lecteurs de l'environnement cellulaire (hormones, signaux) : c'est ainsi qu'un signal extérieur devient un changement d'expression : cascades : signal ⟹ facteur ⟹ promoteur ⟹ ARNm ⟹ protéine.</div>"},
{"t": "Le génome et l'expression des gènes (1re)", "q": "Les histones et l'enroulement de l'ADN jouent sur l'expression en :", "c": ["détruisant les gènes inutiles", "rendant certaines zones inaccessibles à la lecture (ADN compacté = gène éteint)", "coupant l'ARN", "créant des mutations"], "a": 1, "e": "Un ADN serré sur ses histones est illisible : un ADN décompacté est transcriptible : c'est un niveau de régulation structurel (épigénétique).", "d": "<b>Accessibilité de l'ADN</b> : le rangement qui parle.<div class='ex-detail'><u>Exemple rédigé</u> : l'image : 2 m d'ADN rangés dans un noyau de 6 µm : l'enroulement autour des histones (nucléosomes : perles) le compacte : une zone COMPACTÉE = livre fermé (l'ARN polymérase ne passe pas : gène éteint) ; une zone relâchée (acétylation des histones) = livre ouvert : ces marques (acétylation, méthylation) constituent l'ÉPIGÉNÉTIQUE : elles sont STABLES (la cellule fille garde son profil : c'est ce qui maintient l'identité d'un type cellulaire) et parfois... transmissibles (un héritage non génétique).</div>"},
{"t": "La tectonique et les risques géologiques (1re)", "q": "Le risque naturel se calcule comme :", "c": ["aléa × enjeux × vulnérabilité", "enjeux seuls", "aléa seul", "vulnérabilité seule"], "a": 0, "e": "L'aléa est subi : le risque dépend de ce qui est exposé (enjeux) et de sa fragilité (vulnérabilité).", "d": "<b>Aléa × enjeux × vulnérabilité</b> : la formule fondatrice.<div class='ex-detail'><u>Exemple rédigé</u> : l'application : un désert inhabité : séisme M8 : RISQUE ~0 (aucun enjeu) : une ville dense sans normes sur une faille : aléa moindre mais risque MAXIMAL : Haïti 2010 (M7 : ~200 000 morts) vs Chili 2010 (M8,8 : ~500 morts) : la seule variable qui explique l'écart : la vulnérabilité (normes, préparation) : c'est la formule qui fonde TOUTE politique de prévention : on n'agit pas sur l'aléa : on agit sur les deux autres facteurs.</div>"},
{"t": "La tectonique et les risques géologiques (1re)", "q": "Un séisme de magnitude 7 libère environ combien de fois plus d'énergie qu'un magnitude 5 ?", "c": ["2 fois", "~900 fois (échelle logarithmique : +1 ≈ ×30)", "10 fois", "100 fois"], "a": 1, "e": "+1 magnitude ≈ ×30 énergie : de 5 à 7 : 30 × 30 = ~900.", "d": "<b>~×900</b> : la puissance des logarithmes.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul : M6 ≈ ×30 vs M5 : M7 ≈ ×30 vs M6 = ×900 vs M5 : c'est pour ça qu'il y a des MILLIERS de petits séismes par an (imperceptibles) et qu'un grand séisme est rare mais domINE le bilan énergétique régional : les ~15 plus grands séismes du siècle libèrent autant d'énergie que des siècles de petites secousses. Piège : « l'échelle va de 1 à 10 » : NON : elle est OUVERTE (pas de maximum théorique : les plus forts mesurés : ~9,5).</div>"},
{"t": "La tectonique et les risques géologiques (1re)", "q": "La magnitude et l'intensité d'un séisme :", "c": ["les deux sont des cartes", "sont identiques", "magnitude = énergie libérée à la source (une valeur) : intensité = effets ressentis en chaque lieu (une carte)", "mesurent la vitesse des ondes uniquement"], "a": 2, "e": "Magnitude : sismogramme, unique. Intensité : dégâts ressentis, décroissants avec la distance (échelle MSK/EMS98).", "d": "<b>Source vs effets</b> : le couple à ne pas confondre.<div class='ex-detail'><u>Exemple rédigé</u> : l'exemple : séisme de Lambesc (1909) : magnitude ~6 : intensité IX à l'épicentre, IV à Nice : l'événement a UNE magnitude, une CARTE d'intensités. Conséquence pratique : un petit séisme SUPERFICIEL sous une ville (intensité locale élevée : fatal) peut faire plus de dégâts qu'un grand séisme profond lointain : les cartes d'aléa zonent l'intensité attendue (et les normes de construction suivent).</div>"},
{"t": "La tectonique et les risques géologiques (1re)", "q": "Un tsunami se forme quand :", "c": ["le vent souffle fort", "un bateau passe vite", "la Lune attire l'eau", "une masse d'eau est déplacée brutalement (séisme sous-marin, glissement, éruption)"], "a": 3, "e": "Le déplacement d'une colonne d'eau entière (pas la surface seule) : la vague en pleine mer est basse et rapide (800 km/h) : elle se dresse près des côtes.", "d": "<b>Déplacement brutal d'eau</b> : l'onde longue.<div class='ex-detail'><u>Exemple rédigé</u> : la physique : en pleine mer, un tsunami fait ~1 m de haut mais 100+ km de LONGUEUR d'onde et 800 km/h (il passe sous les bateaux sans qu'on le voie) : arrivé sur la côte : le fond remonte : la vague FREINE et SE DRESSE (5-30 m : la côte encaisse TOUTE la longueur d'onde : la mer « recule » d'abord : signe d'alerte naturel !) : d'où le système d'alerte (marégraphes DART + modélisation : ~10-30 min de délai au Japon : l'évacuation verticale se compte en minutes.</div>"},
{"t": "La tectonique et les risques géologiques (1re)", "q": "Aujourd'hui, la prévision des séismes :", "c": ["est résolue par l'IA", "est interdite par la loi", "est impossible à court terme : on localise les zones à risque et on s'y prépare (normes, exercices, alerte)", "est parfaite à 3 jours"], "a": 2, "e": "Aucune méthode fiable de prédiction date/lieu/magnitude : la sismologie fournit des cartes d'aléa (probabilités) : la protection = réduction de vulnérabilité.", "d": "<b>Prévention, pas prédiction</b> : l'honnêteté scientifique.<div class='ex-detail'><u>Exemple rédigé</u> : le bilan : malgré sismomètres, GPS, IA : aucune prédiction de séisme fiable (les « précurseurs » n'ont jamais tenu statistiquement) : les tentatives ont provoqué des drames inverses (fausses alertes : L'Aquila 2009 : le procès de la communication) : ce qui fonctionne : cartes d'aléa probabilistes (période de retour : normes EUROCODE 8), instruments (early warning : quelques secondes d'alerte : arrêter les trains), et la CULTURE du risque (exercices japonais du 1er septembre). Piège : méfiance envers les « prédictions » médiatiques : aucune n'a de base.</div>"},
{"t": "La tectonique et les risques géologiques (1re)", "q": "Les signes précurseurs d'une éruption volcanique :", "c": ["essaims de micro-sismes, gonflement du volcan (GPS/drones), dégazage modifié", "la pluie", "les marées", "n'existent jamais"], "a": 0, "e": "Le magma qui monte fait trembler, gonfler et dégazer le volcan : l'observation permet d'anticiper (Pinatubo 1991).", "d": "<b>Trembler, gonfler, dégazer</b> : la trilogie de l'alerte.<div class='ex-detail'><u>Exemple rédigé</u> : le cas Pinatubo (1991) : 2 mois de surveillance : essaims sismiques croissants, SO₂ mesuré par satellite, flancs gonflés (tiltmètres) ⟶ prévision d'une éruption majeure ⟶ 60 000 personnes évacuées AVANT l'explosion (VEI 6 : une des plus grandes du siècle) : bilan humain quasi nul alors que l'éruption était gigantesque : c'est le SUCCÈS fondateur de la volcanologie moderne : un volcan se prévient mieux qu'une faille.</div>"},
{"t": "La tectonique et les risques géologiques (1re)", "q": "La réplique d'un grand séisme :", "c": ["est une réplique cinématographique", "est un tsunami", "est un séisme plus faible qui suit (la faille réajuste ses contraintes)", "ne peut jamais avoir lieu"], "a": 2, "e": "Après la rupture principale, la croûte s'ajuste : des séismes plus faibles suivent pendant des jours/mois (parfois presque aussi forts).", "d": "<b>Le réajustement de la faille</b> : la série de répliques.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : la rupture principale ne libère pas TOUTE la contrainte : les segments voisins restent chargés : ils cèdent à leur tour dans les heures/mois suivants (répliques : décroissance selon la loi d'Omori) : EXEMPLE : Sumatra 2004 (M9,1) : des milliers de répliques : Népal 2015 (M7,8 : puis M7,3 deux semaines plus tard). Leçon de prévention : après un séisme, on ne répare pas « la fin » : on s'attend à des répliques : les équipes de secours prévoient leurs installations en conséquence (bâtiments déjà fragilisés).</div>"},
{"t": "La tectonique et les risques géologiques (1re)", "q": "La construction parasismique vise à :", "c": ["rendre les séismes impossibles", "concevoir des bâtiments qui résistent sans s'effondrer (dissiper l'énergie, osciller sans rompre)", "remplacer le sol", "empêcher tout dégât"], "a": 1, "e": "Un bâtiment parasismique peut être ENDOMMÉ mais doit rester DEBOUT : la vie est dans la structure (règle : amortir, relier, fondre les masses).", "d": "<b>Osciller sans rompre</b> : l'objectif réaliste.<div class='ex-detail'><u>Exemple rédigé</u> : l'ingénierie : un bâtiment rigide SANS résonance adaptée peut s'effondrer quand la fréquence du sol s'accorde à la sienne (résonance : Mexico 1985 : sols mous : mortels) : les techniques : noyaux en béton armé, amortisseurs (pendules : Taipei 101 : tour avec une boule de 660 tonnes qui contrebalance), isolation sismique (base : couches de caoutchouc : l'hôpital de Kobé a « flotté » pendant le séisme de 1995) : la structure meurt parfois, mais pas les gens : c'est le but.</div>"},
{"t": "La tectonique et les risques géologiques (1re)", "q": "Le niveau de préparation d'une population face à un aléa sismique est appelé :", "c": ["intensité", "vulnérabilité", "aléa", "magnitude"], "a": 1, "e": "La vulnérabilité englobe constructions, préparation, capacité de réponse : c'est le facteur HUMAIN du risque.", "d": "<b>Vulnérabilité</b> : la part humaine du risque.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison qui le démontre : le Japon et Haïti partagent des failles actives : le Japon investit dans les normes (vulnérabilité bâtie), les exercices du 1er septembre (préparation scolaire), l'alerte (vulnérabilité informationnelle) : Haïti manquait de ces couches : l'humanitaire, la corruption, l'urbanisation sauvage agrandissent la vulnérabilité : le séisme chilien de 2010 (plus fort que celui d'Haïti) a fait ~500 morts : la TERRE fait l'aléa : les HUMAINS font le risque.</div>"},
{"t": "La tectonique et les risques géologiques (1re)", "q": "Un glissement de terrain est favorisé par :", "c": ["la saturation en eau des terrains + pente + roche altérée (souvent déclenché par séisme ou pluies)", "les marées", "le beau temps", "l'absence de végétation uniquement"], "a": 0, "e": "Eau (poids + lubrification), pente, matériaux fragiles : déclencheurs : pluies exceptionnelles ou séisme : le risque gravitaire, le plus meurtrier de France.", "d": "<b>Eau + pente + fragilité</b> : la recette du glissement.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : la roche altérée (argiles : guimauve géologique) + des pluies qui saturent (l'eau lubrifie les plans de glissement et alourdit la masse) + une pente : au déclenchement (séisme : Gansu 2010 : pluies : Vaison-la-Romaine 1992 : crue : la ville ensevelie) : la surveillance moderne : inclinomètres, extensomètres, images radar (mesurer le millimètre de déplacement par satellite : INTERFEROMÉTRIE) : l'anticipation sauve : l'évacuation de Séchilienne (Isère) a évité des dizaines de morts.</div>"},
{"t": "La génétique et l'évolution (Terminale)", "q": "La dérive génétique :", "c": ["favorise toujours les meilleurs allèles", "est une sélection naturelle", "crée des mutations utiles", "fait fluctuer aléatoirement les fréquences d'allèles (dominante dans les petites populations)"], "a": 3, "e": "Hasard des reproductions : dans un petit effectif, des allèles disparaissent sans lien avec leur utilité.", "d": "<b>Le hasard des fréquences</b> : le moteur aveugle.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience de pensée : une population de 10 individus : un allèle présent à 10 % (2 copies) peut, par pur hasard des croisements, ne pas être transmis : DISPARU : personne ne l'a « rejeté » : il n'y avait juste personne pour le porter : le guépard (goulot d'étranglement il y a ~10 000 ans) en est la victime emblématique : quasi-clones, greffes acceptées entre individus ! Piège : la dérive n'est PAS une sélection déguisée : elle est AMORALE : elle peut FIXER un allèle DÉFAVORABLE.</div>"},
{"t": "La génétique et l'évolution (Terminale)", "q": "L'équilibre de Hardy-Weinberg sert à :", "c": ["prédire l'extinction", "détecter les forces évolutives : tout écart aux fréquences attendues (p², 2pq, q²) signale sélection, dérive, mutation ou migration", "dater les fossiles", "mesurer la taille des populations"], "a": 1, "e": "C'est le modèle NUL : population idéale = fréquences stables : les écarts mesurés sont des SIGNAUX d'évolution.</div></div>", "d": "<b>Modèle nul de détection</b> : le thermomètre de l'évolution.<div class='ex-detail'><u>Exemple rédigé</u> : l'usage : on calcule les fréquences attendues (p², 2pq, q²) : si l'observé diffère (test statistique), au moins une hypothèse du modèle est violée : sélection ? dérive ? migration ? : exemple réel : la drépanocytose en zone impaludée : l'excès d'hétérozygotes AS (avantagés face au paludisme) SAUTE aux yeux : l'avantage hétérozygote est prouvé par le VIOL du modèle. Piège : le modèle n'est pas « la réalité » : c'est le zéro de l'appareil de mesure.</div>"},
{"t": "La génétique et l'évolution (Terminale)", "q": "L'allèle de la drépanocytose (S) reste fréquent en Afrique car :", "c": ["les hétérozygotes AS résistent mieux au paludisme (avantage hétérozygote)", "les homozygotes SS sont plus fertiles", "il est dominant", "il n'a aucun coût"], "a": 0, "e": "Coût homozygote (SS létal) + bénéfice hétérozygote (AS anti-paludisme) = polymorphisme équilibré.", "d": "<b>L'avantage hétérozygote</b> : le polymorphisme équilibré.<div class='ex-detail'><u>Exemple rédigé</u> : la comptabilité : génotype SS : anémie grave (coût maximal) : génotype AA : sensible au paludisme (coût moyen) : génotype AS : porteur sain ET résistant au parasite (bénéfice net) : la sélection locale favorise donc AS : l'allèle S est maintenu à une fréquence d'équilibre (plus élevée là où le paludisme tue) : c'est la signature moléculaire de la coévolution hôte-parasite : la preuve vivante que la sélection n'élimine pas toujours les allèles « à risque » : elle les arbitre selon le milieu.</div>"},
{"t": "La génétique et l'évolution (Terminale)", "q": "Un « goulot d'étranglement » génétique :", "c": ["augmente la diversité", "concerne les bouteilles seulement", "est une sélection positive", "une réduction brutale de l'effectif qui emporte la plupart des allèles (diversité décapitée)"], "a": 3, "e": "Quelques survivants ne portent qu'une fraction de la diversité initiale : la population repart appauvrie (dérive massive).", "d": "<b>Réduction d'effectif ⟹ appauvrissement</b> : le filtre aléatoire.<div class='ex-detail'><u>Exemple rédigé</u> : le cas : éléphants de mer (chassés jusqu'à ~20-100 individus au XIXe : aujourd'hui 200 000 : MAIS diversité génétique minuscule) : guépard (greffes acceptées entre inconnus) : bison d'Europe, tigre de Sumatra : la diversité perdue ne se régénère que par MUTATION (des milliers de générations) : conséquence : consanguinité, spermatozoïdes défectueux, vulnérabilité aux épidémies : c'est pour ça que la conservation vise des POPULATIONS CONNECTÉES et non des zoos isolés.</div>"},
{"t": "La génétique et l'évolution (Terminale)", "q": "La sélection naturelle agit sur :", "c": ["les besoins exprimés par les individus", "les mutations futures", "les phénotypes existants (dont la survie/reproduction différenciée change les fréquences d'allèles)", "l'ADN directement au hasard"], "a": 2, "e": "Le tri se fait sur ce qui est déjà là (phénotype) : le résultat est un changement de fréquences alléliques dans la population.", "d": "<b>Sur les phénotypes, ici et maintenant</b> : le tri actuel.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne complète : MUTATION (aléatoire : crée un variant d'allèle : aucun lien avec le besoin) ⟹ le variant s'exprime en PHÉNOTYPE ⟹ si ce phénotype influence SURVIE/REPRODUCTION dans CE milieu ⟹ les porteurs laissent PLUS de descendants ⟹ fréquence de l'allèle ↑ : l'évolution est cette COMPTABILITÉ différentielle, rien de plus : pas de projet, pas de besoin écouté : Piège : « les girafes ont étiré leur cou pour atteindre les feuilles » : Lamarck : la sélection n'a jamais « voulu » : elle constate des naissances différentielles.</div>"},
{"t": "La génétique et l'évolution (Terminale)", "q": "Sur un arbre phylogénétique, un nœud représente :", "c": ["une mutation ponctuelle", "une espèce actuelle", "une extinction", "un ancêtre commun (hypothétique) des branches qui en partent"], "a": 3, "e": "Chaque ramification = un événement de spéciation : les espèces au-dessus partagent cet ancêtre.", "d": "<b>Un ancêtre commun</b> : la fourche de l'arbre.<div class='ex-detail'><u>Exemple rédigé</u> : la lecture : le nœud homme-chimpanzé est PLUS PROCHE (dans le temps : ~7 Ma) que le nœud (homme, chimpanzé, gorille) : la topologie (la forme) code la parenté : les longueurs de branches peuvent coder le TEMPS ou le nombre de substitutions : la construction se fait sur les caractères partagés dérivés et l'ADN (les séquences s'accumulent « horloge » régulière en moyenne) : l'arbre est une HYPOTHÈSE, testée et affinée à chaque génome séquencé : l'erreur classique : le lire comme une échelle avec l'homme « au bout ».</div>"},
{"t": "La génétique et l'évolution (Terminale)", "q": "Le « buisson » de la lignée humaine signifie que :", "c": ["les Australopithèques sont nos ancêtres directs vivants", "une seule espèce d'Homo a existé avant nous", "l'évolution humaine est une ligne droite", "plusieurs espèces humaines ont coexisté (Néandertal, Denisova, Sapiens...)"], "a": 3, "e": "Le registre fossile montre des coexistences et des branches éteintes : Sapiens est le seul survivant actuel d'un genre qui en comptait plusieurs.", "d": "<b>Des espèces simultanées</b> : le buisson, pas la piste.<div class='ex-detail'><u>Exemple rédigé</u> : les faits : il y a 40 000 ans en Eurasie : Néandertal + Sapiens (+ Denisova en Asie) cohabitaient : il y a 2 Ma en Afrique : Homo habilis ET rudolfensis ET erectus early : plusieurs « humanités » en parallèle, certaines se sont éteintes sans descendance, d'autres se sont croisées (~2 % d'ADN néandertalien chez les Eurasiens) : l'image de la « chaîne » (singe ⟶ homme) est FAUSSE : la bonne image : un buisson dont une branche (la nôtre) subsiste. Piège : Néandertal n'est PAS notre ancêtre : il est notre COUSIN (branche sœur, éteinte).</div>"},
{"t": "La génétique et l'évolution (Terminale)", "q": "Une population évolue signifie :", "c": ["les individus changent pendant leur vie", "tout le monde mute en même temps", "la population grossit", "les fréquences des allèles changent entre générations"], "a": 3, "e": "L'individu ne change pas (son génome est fixé) : c'est la COMPOSITION GÉNÉTIQUE de la population qui se déplace.", "d": "<b>Changement de fréquences alléliques</b> : la définition populationnelle.<div class='ex-detail'><u>Exemple rédigé</u> : la clarification : un papillon noir ne devient pas clair quand la pollution baisse : il meurt plus souvent (sélection) : ses allèles s'éteignent localement : la GÉNÉRATION suivante est différente : l'unité d'évolution est la POPULATION (groupe inter-fécond), le support est l'allèle, l'individu est le véhicule jetable. Piège : « l'individu s'adapte » (langage courant : muscler, bronzer) ≠ évolution : l'acquis ne se transmet pas : seuls les allèles des REPRODUCTEURS passent à la génération suivante.</div>"},
{"t": "La génétique et l'évolution (Terminale)", "q": "Les mutations sont le matériau de l'évolution car :", "c": ["elles créent les nouveaux allèles sur lesquels la sélection peut ensuite trier", "elles ne touchent que les bactéries", "elles tuent toujours", "elles arrivent quand le milieu les demande"], "a": 0, "e": "Sans variation générée par mutation (et recombinaison), la sélection n'aurait rien à trier : le hasard propose, le milieu dispose.", "d": "<b>Créatrices de variantes</b> : la source première.<div class='ex-detail'><u>Exemple rédigé</u> : la complémentarité des deux moteurs : MUTATION : le hasard propose (copies fautives : ~70 mutations nouvelles par personne : la plupart neutres) ; SÉLECTION/DÉRIVE : le filtre/statistique dispose : les deux étapes sont INDÉPENDANTES (le milieu n'indique pas au gène quoi écrire) : c'est l'argument central contre les finalismes : l'évolution n'est NI projetée NI aléatoire en bloc : elle est « variation aléatoire + tri non aléatoire » : formule à connaître par cœur.</div>"},
{"t": "La génétique et l'évolution (Terminale)", "q": "Deux populations forment deux espèces distinctes quand :", "c": ["elles ne peuvent plus se reproduire entre elles (isolement reproductif)", "elles vivent à 1000 km l'une de l'autre", "leurs couleurs diffèrent", "elles ont des tailles différentes"], "a": 0, "e": "Le critère décisif : le flux de gènes est interrompu (accouplement impossible, descendants stériles...) : la divergence devient irréversible.", "d": "<b>Isolement reproductif</b> : la frontière d'espèce.<div class='ex-detail'><u>Exemple rédigé</u> : le test : deux populations se rejoignent après isolement : si les croisements échouent (pas d'accouplement : chants/rituels incompatibles) ou avortent (descendance stérile : mule) : ESPÈCES séparées : la spéciation est ACHEVÉE : ce verrou peut être pré-zygotique (avant fécondation : comportements, saisons) ou post-zygotique (après : stérilité, invabilité) : une fois installé, il n'y a plus de retour en arrière : c'est la frontière qui fait de l'évolution un buisson d'espèces et non un continuum.</div>"},
{"t": "L'immunité adaptative et la vaccination (Terminale)", "q": "La diversité des récepteurs d'anticorps est générée par :", "c": ["la rencontre avec l'antigène", "les hormones", "la moelle osseuse après l'infection", "la recombinaison génétique aléatoire (VDJ) lors de la fabrication des lymphocytes B"], "a": 3, "e": "Assemblage au hasard de morceaux de gènes dans chaque LB : ~10¹¹ spécificités AVANT toute infection.", "d": "<b>Recombinaison VDJ</b> : le lego génétique.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : les gènes des anticorps existent en fragments (V~40, D~25, J~6) : chaque LB en bricole un au hasard (coupe-coller chromosomique dans la moelle) : 40×25×6 + jonctions imprécises + appariement avec les chaînes légères ⟹ ~10¹¹ combinaisons : PLUS que le nombre d'antigènes imaginables : le système est pré-équipé contre des ennemis qu'il n'a jamais vus (c'est pour ça que la sélection clonale ne fait que TRIER : la bibliothèque existait). Piège : l'antigène n'enseigne RIEN : il sélectionne le clone correspondant déjà présent.</div>"},
{"t": "L'immunité adaptative et la vaccination (Terminale)", "q": "Le CMH-I présente les antigènes :", "c": ["aux LT4 uniquement", "aux LB", "aux LTc cytotoxiques (pour la lyse des cellules infectées)", "aux hématies"], "a": 2, "e": "Toute cellule nucléée expose ses fragments internes sur CMH-I : le LTc vérifie et tue si anomalie (CMH-II : cellules présentatrices ⟶ LT4).", "d": "<b>CMH-I ⟶ LTc</b> : le couple à retenir.<div class='ex-detail'><u>Exemple rédigé</u> : la logique du double circuit : CMH-I = « vitrine » de TOUTES les cellules (constitutif) : ce qui est FABRIQUÉ à l'intérieur (fragments viraux) est exposé : le LTc passe en revue : si le fragment est viral ⟹ lyse ; CMH-II = vitrine des PROFESSIONNELS de la présentation (dendritiques, macrophages) : ils exposent ce qu'ils ont phagocyté : les LT4 lisent et donnent les feux verts. Piège : croiser les couples (CMH-I/LT4) est LA faute classique : I = interne ⟹ tueur (LTc) : II = immunité dirigée (helpers).</div>"},
{"t": "L'immunité adaptative et la vaccination (Terminale)", "q": "L'immunité collective fonctionne car :", "c": ["au-delà d'un seuil de vaccinés, le pathogène ne circule plus : les non-protégés sont indirectement protégés", "les non-vaccinés sont exclus", "tout le monde finit par être malade", "les vaccinés protègent leur propre famille seulement"], "a": 0, "e": "Seuil ≈ 1-1/R₀ : la chaîne de transmission casse : nourrissons et immunodéprimés bénéficient de la couverture des autres.", "d": "<b>Couverture ⟹ circulation brisée</b> : la protection des autres.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul : rougeole R₀~15 (très contagieux) : seuil = 1-1/15 ≈ 93 % : en dessous, chaque malade en contamine encore : au-dessus, la chaîne meurt : les 7 % non-vaccinés (nourrissons <1 an : contre-indiqués, immunodéprimés, échecs vaccinaux) sont protégés PAR LA COMMUNAUTÉ : c'est une RES PUBLICA : la vaccination est un acte individuel à effet collectif (les épidémies de rougeole réapparaissent partout où la couverture décroche : l'histoire récente le montre).</div>"},
{"t": "L'immunité adaptative et la vaccination (Terminale)", "q": "Les adjuvants des vaccins servent à :", "c": ["colorer le vaccin", "amplifier la réponse immunitaire (attirer/activer les cellules présentatrices)", "conservation", "diluer l'antigène"], "a": 1, "e": "Sans danger signalé à ces doses, ils rendent l'antigène plus visible (dépôt, inflammation locale légère) : moins d'antigène nécessaire, meilleure mémoire.", "d": "<b>Amplifier la visibilité</b> : le haut-parleur de l'antigène.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : un antigène seul peut passer inaperçu (dose faible, pas de contexte de « danger ») : l'adjuvant (sels d'aluminium, émulsions) crée un micro-dépôt + un signal inflammatoire qui RECRUTE les cellules dendritiques : la présentation est plus efficace ⟹ réponse plus forte et plus durable : c'est pour ça que les vaccins sous-unités en ont besoin (les vaccins vivants atténués, eux, se signalent seuls). Piège : « adjuvant = additif inutile » : il est fonctionnel, dosé et surveillé (suivi pharmacovigilance).</div>"},
{"t": "L'immunité adaptative et la vaccination (Terminale)", "q": "La grippe exige un vaccin annuel car :", "c": ["les anticorps détruisent le vaccin", "la mémoire immunitaire dure un an", "le virus change ses antigènes de surface (antigenic drift) : la mémoire cible d'anciennes formes", "l'hiver efface la mémoire"], "a": 2, "e": "Les mutations de l'hémagglutinine décalent la cible : les anticorps mémorisés ne reconnaissent plus bien : on réentraîne chaque année.", "d": "<b>Antigenic drift</b> : la cible mouvante.<div class='ex-detail'><u>Exemple rédigé</u> : la course : le virus grippe A mute (ARN sans correction) : ses protéines de surface (H, N) glissent génétiquement : les anticorps de l'année passée s'accrochent mal aux nouvelles formes : l'OMS surveille les souches circulantes et DEVINE (six mois à l'avance) les versions de la saison : parfois le pari est imparfait (match vaccin-souches : 30-60 % d'efficacité selon les années : mieux que rien) : Piège : ce n'est pas la MÉMOIRE qui s'use : c'est la CIBLE qui se déplace (contre la rougeole, stable, la mémoire dure une vie).</div>"},
{"t": "L'immunité adaptative et la vaccination (Terminale)", "q": "Le VIH échappe durablement au système immunitaire notamment car :", "c": ["il est trop gros", "il est invisible au microscope", "il vit hors du corps", "sa transcriptase inverse ne corrige pas ses erreurs (diversité massive) ET il détruit les LT4 qui devraient coordonner la réponse"], "a": 3, "e": "Mutation ultra-rapide + cible = les coordinateurs immunitaires : double évasion : d'où l'absence de vaccin et la stratégie trithérapie/dépistage/PrEP.", "d": "<b>Mutateur + décapiteur</b> : le double verrou.<div class='ex-detail'><u>Exemple rédigé</u> : le triptyque : ① la transcriptase inverse copie l'ARN viral en ADN SANS relecture : chaque réplication introduit des mutations : en un patient, la diversité virale surpasse celle de la grippe mondiale annuelle : les anticorps courent derrière ; ② le virus infecte précisément les LT4 (les « chefs ») : la réponse adaptative est décapitée ; ③ l'ADN viral s'intègre à nos chromosomes (latence : réservoirs invisibles) : d'où l'approche moderne : pas de vaccin, MAIS trithérapie (charge indétectable : I=I : vie normale) + PrEP + dépistage : un modèle de santé publique.</div>"},
{"t": "L'immunité adaptative et la vaccination (Terminale)", "q": "Les hypermutations somatiques des LB :", "c": ["créent le VIH", "détruisent les anticorps", "affinent les anticorps pendant la réponse (les mutations améliorent la liaison à l'antigène : affinité croissante)", "sont des erreurs mortelles"], "a": 2, "e": "Dans les centres germinatifs, les LB dont le récepteur lie le mieux l'antigène sont sélectionnés : la réponse « s'affine » en quelques jours.", "d": "<b>L'affinage darwinien</b> : la sélection en accéléré.<div class='ex-detail'><u>Exemple rédigé</u> : le processus : pendant la réponse, les LB muteurs leurs gènes d'anticorps (taux élevé) : ceux qui lient MIEUX l'antigène reçoivent les signaux de survie (aide des LT4 folliculaires) : les autres meurent : génération après génération cellulaire (quelques jours), l'affinité des anticorps AUGMENTE (maturation d'affinité : les anticorps de la 2e semaine neutralisent mieux que ceux de la 1re) : c'est une SELECTION NATURELLE en miniature : variante + compétition + héritage : l'immunité adaptative applique Darwin à l'intérieur du corps.</div>"},
{"t": "L'immunité adaptative et la vaccination (Terminale)", "q": "Les cellules dendritiques sont :", "c": ["les « éclaireurs » qui phagocytent l'antigène et le présentent aux LT4 (CMH-II) : elles amorcent la réponse", "des anticorps", "des neurones", "des virus"], "a": 0, "e": "Elles font le pont entre immunité innée (phagocytose) et adaptative (présentation aux LT4) : le déclencheur de la réponse.", "d": "<b>Les éclaireurs présentateurs</b> : le pont inné-adaptatif.<div class='ex-detail'><u>Exemple rédigé</u> : la chorégraphie : ① la dendritique avale un microbe (inné) : ② elle migre vers le ganglion (le QG des lymphocytes) : ③ elle EXPOSE les fragments sur CMH-II aux LT4 : ④ les LT4 activés orchestrent LB et LTc : sans cette présentation, la réponse adaptative ne démarre PAS (c'est le goulot d'étranglement) : c'est pour ça que les adjuvants ciblent leur recrutement. Piège : « dendritique » n'a rien de nerveux : c'est un nom de forme (dendrites = prolongements).</div>"},
{"t": "L'immunité adaptative et la vaccination (Terminale)", "q": "Une immunodépression (ex. sous traitement anticancer) :", "c": ["ne change rien", "guérit les allergies", "rend la vaccination inutile ou risquée selon le type (vaccins vivants contre-indiqués)", "augmente l'immunité"], "a": 2, "e": "Vaccins vivants atténués : dangereux (infection vaccinale possible) : la mémoire ne se construit pas bien : l'entourage doit être vacciné (cocooning).", "d": "<b>Adapter la stratégie</b> : le cocooning.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement clinique : un patient immunodéprimé ne peut pas recevoir certains vaccins VIVANTS (BCG, ROR atténué : le virus affaibli peut se révéler chez un hôte sans défense) : sa réponse aux vaccins inactivés est faible (pas d'armée pour mémoriser) : la solution de santé publique : le COCOONING : vacciner l'ENTOURAGE (famille, soignants) pour que le virus n'atteigne jamais le patient fragile : c'est une application directe de l'immunité collective : ma vaccination protège aussi les autres.</div>"},
{"t": "L'immunité adaptative et la vaccination (Terminale)", "q": "Un vaccin vivant atténué :", "c": ["contient des microbes mortés", "contient le microbe vivant mais affaibli (il se réplique peu : réponse forte et durable, contre-indiqué si immunodépression)", "est un ARN seul", "ne déclenche aucune réponse"], "a": 1, "e": "ROR, BCG, varicelle : l'infection « simulée » construit une mémoire proche de la maladie naturelle : efficacité durable.", "d": "<b>Vivant mais affaibli</b> : l'entraînement complet.<div class='ex-detail'><u>Exemple rédigé</u> : le principe : le microbe est cultivé pour perdre sa virulence (passages répétés en laboratoire : il garde ses ANTIGÈNES mais perd sa capacité à nuire) : injecté, il se réplique un peu : le système immunitaire voit l'ennemi « complet » (tous ses antigènes, sa progression) : réponse LARGE et MÉMOIRE SOLIDE (une ou deux doses suffisent pour la vie : rougeole) : le prix : déconseillé aux immunodéprimés et aux femmes enceintes (microbe vivant) : c'est le couple avec le vaccin inactivé/sous-unité : sécurité maximale, rappels nécessaires.</div>"},
{"t": "Le climat : histoire et avenir (Terminale)", "q": "Les cycles de Milanković :", "c": ["sont des variations astronomiques qui rythment les glaciations (dizaines de milliers d'années)", "sont des cycles de marée", "expliquent le réchauffement actuel", "durent 100 ans"], "a": 0, "e": "Excentricité, obliquité, précession : ils modulent l'ensoleillement aux hautes latitudes : validés par les archives, mais trop LENTS pour le changement actuel.", "d": "<b>Le métronome des glaciations</b> : la preuve du naturel... et de sa limite.<div class='ex-detail'><u>Exemple rédigé</u> : le débat classique : « le climat a toujours changé » : VRAI : les archives montrent 8 glaciations en 800 000 ans au rythme des paramètres orbitaux (calculés par Milanković : 100 000/41 000/23 000 ans) : MAIS l'échelle de temps est décalée de ×100 : les transitions glaciaire-interglaciaire prennent des MILLÉNAIRES : le réchauffement actuel fait le même chemin en UN SIÈCLE : et les paramètres actuels prédisaient une phase STABLE : le changement en cours n'a pas de préfixe astronomique : il a une signature fossile. Piège : ce contexte naturel est INVOQUÉ pour minimiser : la vitesse est l'argument qui le réfute.</div>"},
{"t": "Le climat : histoire et avenir (Terminale)", "q": "La signature isotopique du CO₂ atmosphérique actuel prouve :", "c": ["une origine océanique", "une origine fossile (carbone ancien : sans ¹⁴C, appauvri en ¹³C)", "une origine solaire", "une origine volcanique dominante"], "a": 1, "e": "Le carbone des combustibles fossiles (millions d'années) a perdu son ¹⁴C radioactif : c'est exactement le profil du CO₂ en excès.", "d": "<b>L'empreinte du très vieux carbone</b> : la scientifique du carbone fossile.<div class='ex-detail'><u>Exemple rédigé</u> : l'enquête isotopique : le ¹⁴C (radiocarbone : demi-vie 5730 ans) a disparu des fossiles après des millions d'années : le CO₂ atmosphérique s'appauvrit en ¹⁴C ET en ¹³C exactement comme si on y déversait du carbone fossile : le volcanisme ? ~0,3 Gt C/an vs nos ~10 Gt (nous émettons 30× les volcans) : l'océan ? Il ABSORBE (il est un puits : sa signature va dans l'autre sens) : le dossier est complet : c'est une attribution forensique, pas une corrélation vague.</div>"},
{"t": "Le climat : histoire et avenir (Terminale)", "q": "La stratosphère se refroidit pendant que la surface se réchauffe. C'est :", "c": ["la preuve du volcanisme", "une anomalie inexpliquée", "la signature attendue d'un forçage par GES (et INCOMPATIBLE avec un Soleil plus actif)", "une erreur de mesure"], "a": 2, "e": "Un soleil plus fort réchaufferait TOUTE l'atmosphère : seul un piégeage accru d'infrarouge en BAS refroidit le HAUT.", "d": "<b>La signature verticale</b> : le contre-interrogatoire du Soleil.<div class='ex-detail'><u>Exemple rédigé</u> : la logique : si le Soleil se renforçait, la stratosphère se réchaufferait AUSSI (tout le monde reçoit plus d'énergie) : or les ballons et satellites mesurent : surface ↑, stratosphère ↓ : le CO₂ supplémentaire piège l'infrarouge près du sol (réchauffement en bas) et émet vers l'espace depuis la haute altitude (refroidissement en haut) : c'est le PROFIL VERTICAL attendu pour les GES : l'hypothèse solaire est réfutée par la donnée la plus simple : la structure du réchauffement.</div>"},
{"t": "Le climat : histoire et avenir (Terminale)", "q": "Les scénarios SSP des projections climatiques :", "c": ["sont des prédictions certaines du futur", "fixent la météo de 2050", "sont des scripts de cinéma", "sont des trajectoires D'ÉMISSIONS supposées (choix de société) : la température projetée en découle"], "a": 3, "e": "SSP1 sobre ⟹ +1,5-2 °C : SSP5 « tout continue » ⟹ +4-5 °C : la projection est CONDITIONNELLE : elle dépend de nous.", "d": "<b>Des trajectoires d'émissions</b> : le futur est un choix.<div class='ex-detail'><u>Exemple rédigé</u> : la lecture : un modèle climatique ne « devine » pas 2100 : on lui donne UNE TRAJECTOIRE d'émissions (combustibles, démographie, politiques) : il calcule la conséquence physique : SSP1 (coopération, sobriété : +1,5-2 °C), SSP2 (mou, ~actuel : +2,5-3), SSP5 (fossile triomphant : +4-5) : dire « le GIEC prédit +3 °C » est FAUX : il calcule SI nous continuons comme ceci : la projection est une CONSÉQUENCE, pas une prophétie : c'est ce qui fonde l'action politique (chaque trajectoire reste ouverte).</div>"},
{"t": "Le climat : histoire et avenir (Terminale)", "q": "Les rétroactions climatiques (albédo des glaces, vapeur d'eau, permafrost) :", "c": ["n'existent pas", "sont toutes négatives", "AMPLIFIENT la perturbation initiale (le réchauffement s'auto-entretient et accélère)", "annulent le réchauffement"], "a": 2, "e": "Fonte des glaces ⟹ surface sombre ⟹ plus d'absorption : réchauffement accru : boucles positives (avec un contre-pouvoir : rayonnement infrarouge accrété).", "d": "<b>Des amplificateurs</b> : les boucles qui accélèrent.<div class='ex-detail'><u>Exemple rédigé</u> : le déroulé : +1 °C initial (CO₂) ⟹ ① fonte de banquise : l'océan sombre remplace la glace blanche (albédo : absorption ↑) ⟹ +X °C ; ② l'air plus chaud porte PLUS de vapeur d'eau (elle-même GES : +7 % par °C) ⟹ +X ; ③ le permafrost fond : méthane et CO₂ piégés libérés ⟹ +X : la réponse totale est le résultat de la somme : c'est pour ça que le forçage CO₂ seul sous-estime : le système est AMPLIFICATEUR (d'où l'urgence : les boucles ont des points de bascule irréversibles).</div>"},
{"t": "Le climat : histoire et avenir (Terminale)", "q": "Les canicules européennes récentes (2003, 2019, 2022) par rapport au climat préindustriel :", "c": ["ont été rendues bien plus probables par le réchauffement (attribution : facteur ×10 et plus pour certains événements)", "ne comptent pas", "sont dues au Soleil", "sont des phénomènes inchangés depuis toujours"], "a": 0, "e": "La science de l'attribution statistique compare les probabilités avec/sans réchauffement : la même vague de chaleur est passée de « exceptionnelle » à « banale ».", "d": "<b>×10 en probabilité (et davantage)</b> : l'attribution des extrêmes.<div class='ex-detail'><u>Exemple rédigé</u> : la méthode d'attribution (World Weather Attribution) : on simule des milliers de fois le climat SANS réchauffement et AVEC : la canicule de 2022 était quasi IMPOSSIBLE sans ; avec : fréquente : le réchauffement ne « crée » pas la météo : il CHARGE LES DÉS (événements extrêmes : queues de distribution déplacées) : chaque événement récent fait aujourd'hui l'objet d'une estimation chiffrée : c'est une révolution scientifique : dire UN événement précis « à cause du climat » avec des probabilités chiffrées : l'argument décisif pour l'adaptation.</div>"},
{"t": "Le climat : histoire et avenir (Terminale)", "q": "Le rôle de l'océan dans le réchauffement :", "c": ["il aggrave tout uniquement", "il refroidit tout", "il absorbe 90 % de l'excès de chaleur et ~25 % du CO₂ (au prix de l'acidification et de la dilatation)", "il n'en a aucun"], "a": 2, "e": "Sans l'océan, le réchauffement serait bien pire : mais la facture se paie (dilatation thermique ⟹ montée des eaux, acidification, courants affaiblis).", "d": "<b>Le tampon géant</b> : le service et la facture.<div class='ex-detail'><u>Exemple rédigé</u> : la comptabilité : 90 % de la chaleur excédentaire est stockée dans l'océan (mesures Argo : les 2000 premiers mètres se réchauffent) : sans lui, l'air serait invivable : la contrepartie : ① dilatation thermique (l'eau chaude occupe PLUS de place : ~1/3 de la montée actuelle des mers, le reste : fonte des glaciers) ; ② circulation affaiblie (AMOC : le « tapis roulant » atlantique ralentit : conséquences régionales : Europe) ; ③ acidification (coraux, coquillages) : le réchauffement est un problème OCÉANIQUE autant qu'atmosphérique.</div>"},
{"t": "Le climat : histoire et avenir (Terminale)", "q": "Le « budget carbone » restant signifie :", "c": ["les impôts carbone", "la quantité d'émissions cumulées encore compatible avec un objectif de température (ex. +1,5 °C)", "le poids des nuages", "la masse d'argent nécessaire"], "a": 1, "e": "Chaque tonne émise consomme du budget : à rythme constant, le budget 1,5 °C est épuisé en quelques années : d'où l'urgence structurelle.", "d": "<b>Le capital émissible restant</b> : la traduction politique de la physique.<div class='ex-detail'><u>Exemple rédigé</u> : le concept : la température dépend du CUMUL d'émissions (une tonne de CO₂ reste ~des siècles dans l'atmosphère : la température plafonne selon le TOTAL) : d'où l'idée de budget : ~400-500 Gt CO₂ restantes pour 50 % de chances de +1,5 °C : les émissions mondiales ~40 Gt/an ⟹ moins de 12 ans : le budget 2 °C est plus large (mais pas infini) : c'est LE chiffre qui transforme la physique en calendrier : chaque année de retard brûle du budget définitivement.</div>"},
{"t": "Le climat : histoire et avenir (Terminale)", "q": "Les points de bascule (tipping points) climatiques :", "c": ["des dates fixes du calendrier", "des seuils au-delà desquels un système bascule de façon auto-entretenue et souvent irréversible (calottes, permafrost, forêts amazoniennes)", "des métaphores poétiques", "des revers de fortune financiers"], "a": 1, "e": "Décrochage des calottes de l'Ouest Antarctique, fonte du permafrost, amazonie à savane : au-delà, le mouvement continue SANS émissions supplémentaires.", "d": "<b>Des seuils irréversibles</b> : la raison de la précaution.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : certains sous-systèmes ont deux états stables (calotte / pas de calotte : forêt / savane) : la perturbation les pousse jusqu'au point où la boucle s'auto-entretient : la fonte de la calotte antarctique occidentale, amorcée, CONTINUE même si on stabilise la température (les glaciers « reculent » des décennies) : conséquence de gestion : le coût de prévention d'un tipping est sans commune mesure avec le coût de réparation (souvent impossible) : c'est l'argument scientifique du principe de précaution.</div>"},
{"t": "Le climat : histoire et avenir (Terminale)", "q": "L'adaptation climatique consiste à :", "c": ["se préparer aux impacts inévitables (villes fraîches, agriculture résiliente, côtes protégées) en parallèle de l'atténuation", "négocier la météo", "abandonner toute action", "refroidir la Terre par des miroirs"], "a": 0, "e": "Une partie du réchauffement est déjà engagée : l'adaptation limite les dégâts LOCAUX (canicules, inondations) : elle complète l'atténuation, elle ne la remplace pas.", "d": "<b>Se préparer</b> : le pilier oublié.<div class='ex-detail'><u>Exemple rédigé</u> : les exemples : villes fraîches ( végétalisation, fontaines, albedo des toits : plan canicule de Paris d'après 2003), agriculture (variétés tolérantes à la sécheresse, dates de semis), côtes (zones humides restaurées : éponge contre la mer), infrastructures (pavage perméable : les inondations urbaines) : la logique : ATTÉNUATION = réduire la cause (global) ; ADAPTATION = réduire les effets (local) : les deux sont NÉCESSAIRES (adaptation sans atténuation = muer sans fin : atténuation sans adaptation = négliger l'inévitable déjà engagé).</div>"},
{"t": "Les écosystèmes et l'espèce humaine (Terminale)", "q": "La première cause directe d'érosion de la biodiversité selon l'IPBES :", "c": ["les OGM", "le changement d'usage des terres (destruction/fragmentation des habitats)", "la chasse", "le climat"], "a": 1, "e": "Agriculture, urbanisation, routes : la transformation des habitats précède (pour l'instant) le climat, l'exploitation et la pollution.", "d": "<b>Usage des terres</b> : le facteur n°1.<div class='ex-detail'><u>Exemple rédigé</u> : le classement IPBES (2019) : ① changement d'usage des terres (agriculture intensive : l'artificialisation : la fragmentation) : ② exploitation directe (pêche, chasse, bois) : ③ changement climatique (montée rapide dans le classement) : ④ pollution : ⑤ espèces invasives : Piège : les médias parlent surtout du climat : mais mesuré SUR LA BIODIVERSITÉ, l'habitat arrive premier : les deux se combinent (un habitat fragmenté résiste moins au climat) : la protection des sols et la trame verte sont donc des politiques climatiques ET biodiversité.</div>"},
{"t": "Les écosystèmes et l'espèce humaine (Terminale)", "q": "Le procédé Haber-Bosch a permis :", "c": ["la synthèse d'engrais azotés (nourrissant ~la moitié de l'humanité... et perturbant le cycle de l'azote)", "l'aviation", "l'électricité", "le plastique"], "a": 0, "e": "Fixation de l'azote atmosphérique en ammoniac : révolution agricole MAIS lessivage, zones mortes, N₂O (GES).", "d": "<b>Des engrais de synthèse</b> : le bénéfice et la facture.<div class='ex-detail'><u>Exemple rédigé</u> : la double face : SANS Haber-Bosch : la moitié de l'humanité ne serait probablement pas nourrie (l'azote est LE facteur limitant des récoltes) : AVEC : le lessivage des nitrates (eaux potables, eutrophisation des côtes : zone morte du Golfe du Mexique ~20 000 km² chaque été), émissions de N₂O (GES ~300× CO₂) : l'azote fixé par l'humanité DOUBLe le naturel : c'est une des « limites planétaires » franchies : le problème n'est pas l'engrais : c'est son DOSAGE (agriculture de précision, moins de pertes).</div>"},
{"t": "Les écosystèmes et l'espèce humaine (Terminale)", "q": "Les « zones mortes » marines résultent de :", "c": ["une baisse du niveau de la mer", "l'eutrophisation : les algues nourries par les nitrates prolifèrent, se décomposent en épuisant l'O₂", "les baleines", "les courants chauds"], "a": 1, "e": "Engrais lessivés ⟹ bloom d'algues ⟹ décomposition bactérienne ⟹ oxygène épuisé ⟹ poissons et fonds asphyxiés.", "d": "<b>Eutrophisation</b> : l'asphyxie en cascade.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne : nitrates agricoles ⟹ golfe/rivière ⟹ prolifération d'algues (le « engrais » fait effet) ⟹ mort du plancton ⟹ bactéries aérobies décomposent ⟹ O₂ dissous épuisé ⟹ fuite ou mort de la faune : hypoxie : « zone morte » saisonnière (Golfe du Mexique, Baltique, Étang de Berre) : revers : la zone se RÉTABLIT si les apports baissent (rivières restaures, lessivage réduit) : une leçon d'espoir documentée.</div>"},
{"t": "Les écosystèmes et l'espèce humaine (Terminale)", "q": "Le « jour du dépassement » marque :", "c": ["la fin de l'année fiscale", "le solstice", "la date à laquelle l'humanité a consommé ce que la planète régénère en un an", "un anniversaire écologiste"], "a": 2, "e": "Au-delà, on vit à crédit écologique (pêche de stocks, déforestation, accumulation de CO₂) : la date avance d'année en année (~fin juillet mondialement).", "d": "<b>Le crédit écologique entamé</b> : l'indicateur symbolique.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul (Global Footprint Network) : on additionne nos prélèvements (terres cultivées, pêche, forêts, béton, absorption du CO₂) et on les compare à la biocapacité : ~1,7 Terre nécessaire au rythme actuel : la date tombe mi-juillet (1970 : fin décembre : l'équilibre exact) : limites : l'empreinte est un INDICATEUR de communication (conventions, simplifications) : la science des limites (mesures physiques des cycles) confirme pourtant la même direction : dépassement.</div>"},
