{"t": "La contraception, la sexualité et les IST (4e)", "q": "Le seul contraceptive qui protège aussi des IST :", "c": ["la pilule", "le préservatif (masculin ou féminin)", "l'implant", "le stérilet"], "a": 1, "e": "Barrière physique : il arrête les spermatozoïdes ET les virus/bactéries.", "d": "<b>Le préservatif</b> : la double protection.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison des métiers : pilule/stérilet/implant = agir sur la physiologie (ovulation, muqueuse) : zéro effet sur les microbes ; préservatif = une MEMBRANE physique entre les partenaires : arrête spermatozoïdes, VIH, chlamydia, HPV (en partie) : c'est la raison pour laquelle la première relation avec un nouveau partenaire impose le préservatif, même sous pilule : deux problèmes, une seule barrière.</div>"},
{"t": "La contraception, la sexualité et les IST (4e)", "q": "Une IST peut se transmettre :", "c": ["par les toilettes", "uniquement avec des symptômes visibles", "sans aucun symptôme (porteur muet)", "par la salive"], "a": 2, "e": "Chlamydia : ~70 % des femmes infectées n'ont AUCUN signe : seul le dépistage révèle.", "d": "<b>Sans symptôme</b> : le danger des infections muettes.<div class='ex-detail'><u>Exemple rédigé</u> : le chiffre qui change tout : la chlamydia, l'IST la plus fréquente des jeunes, est muette chez la majorité des filles infectées (et moitié des garçons) : elle se propage sans qu'aucun des deux ne le sache, et peut rendre stérile en coulisse (salpingite) : le dépistage annuel (prélèvement simple, gratuit en CeGIDD) est la SEULE façon de savoir : « je n'ai rien remarqué » ne prouve rien, c'est un argument de dépistage, pas d'assurance.</div>"},
{"t": "La contraception, la sexualité et les IST (4e)", "q": "Le VIH se transmet par :", "c": ["la salive, les poignées de main", "la toux", "les toilettes publiques", "le sang, le sperme, les sécrétions vaginales (rapports non protégés, seringues partagées, mère-enfant)"], "a": 3, "e": "Les liquides contaminés : sang, sperme, sécrétions : les gestes quotidiens ne transmettent rien.", "d": "<b>Sang, sperme, sécrétions vaginales</b> : les seules voies.<div class='ex-detail'><u>Exemple rédigé</u> : la vie quotidienne : embrasser, partager des verres, des toilettes, un bureau, serrer la main : AUCUN risque (le virus est fragile hors de l'organisme et n'est pas présent en quantité infectieuse dans la salive ou la sueur) : les vraies voies : rapport sexuel non protégé, partage de matériel d'injection, transmission mère-enfant, (transfusion contrôlée depuis 1985). Piège social : c'est la peur des gestes ordinaires qui stigmatise : la science dit le contraire.</div>"},
{"t": "La contraception, la sexualité et les IST (4e)", "q": "Aujourd'hui, une personne séropositive sous trithérapie avec charge virale indétectable :", "c": ["doit s'isoler", "est guérie du VIH", "ne transmet plus le VIH sexuellement (I = Indétectable = Intransmissible)", "reste très contaminante"], "a": 2, "e": "Le traitement supprime la replication : charge indétectable = zéro transmission sexuelle documentée.", "d": "<b>I = I</b> : indétectable = intransmissible.<div class='ex-detail'><u>Exemple rédigé</u> : la révolution thérapeutique : la trithérapie (3 antirétroviraux) bloque la multiplication du virus : la charge virale descend SOUS le seuil de détection : les grandes études (PARTNER, ~100 000 rapports) n'ont trouvé AUCUNE transmission : la personne vit une espérance de vie quasi normale : MAIS le traitement ne guérit pas (le virus dort dans des réservoirs) : d'où l'observance à vie et le dépistage précoce : la prévention moderne est un triptyque : préservatif + dépistage + traitement.</div>"},
{"t": "La contraception, la sexualité et les IST (4e)", "q": "Le consentement sexuel doit être :", "c": ["signé par écrit uniquement", "donné une fois pour toutes", "implicite dans un couple", "libre, éclairé et réversible"], "a": 3, "e": "Libre (sans pression), éclairé (en connaissance de cause), réversible (on peut changer d'avis à tout moment).", "d": "<b>Libre, éclairé, réversible</b> : les 3 conditions.<div class='ex-detail'><u>Exemple rédigé</u> : le décryptage : LIBRE = sans chantage ni pression ni alcool qui abolit le jugement ; ÉCLAIRÉ = en connaissance des risques et du souhait de l'autre ; RÉVERSIBLE = valable ici et maintenant, pas pour toujours : un « oui » hier ne vaut pas aujourd'hui, et on peut s'arrêter en cours de rapport : le silence et l'immobilité ne sont PAS un accord. Piège : « dans un couple, c'est acquis » : aucune relation (mariage compris) ne vaut consentement automatique : c'est la loi.</div>"},
{"t": "La contraception, la sexualité et les IST (4e)", "q": "La contraception d'urgence (pilule du lendemain) :", "c": ["protège des IST", "avorte une grossesse commencée", "est un rattrapage à prendre le plus vite possible (dans les 3-5 jours)", "remplace la pilule régulière"], "a": 2, "e": "Elle retarde l'ovulation si elle n'a pas encore eu lieu : plus elle est prise tôt, plus elle est efficace.", "d": "<b>Un rattrapage, vite</b> : pas une méthode régulière.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : elle retarde l'ovulation de quelques jours (si l'ovule n'est pas encore libéré, les spermatozoïdes mourront avant) : inefficace si l'ovulation a déjà eu lieu : d'où l'urgence (efficacité qui chute à chaque heure) et l'échec possible : ni abortive (elle n'interrompt pas une grossesse installée), ni protectrice des IST : délivrée sans ordonnance en pharmacie, gratuite pour les mineures.</div>"},
{"t": "La contraception, la sexualité et les IST (4e)", "q": "La chlamydia et la syphilis sont :", "c": ["des virus", "guérissables par antibiotiques", "des mycoses sans traitement", "incurables"], "a": 1, "e": "Ce sont des bactéries : un traitement antibiotique bien suivi guérit (le dépistage reste nécessaire car souvent muettes).", "d": "<b>Guérissables</b> : antibiotiques.<div class='ex-detail'><u>Exemple rédigé</u> : le classement clinique : BACTÉRIES (chlamydia, gonorrhée, syphilis) ⟹ guérison par antibiotiques MAIS résistances en hausse (gonocoque !) ; VIRUS (VIH, herpès, hépatite B, HPV) ⟹ incurables mais contrôlables (traitement suppressif, vaccination pour HBV et HPV) : d'où la logique de santé publique : dépister tôt (les bactéries se soignent), vacciner (HBV, HPV dès 11-14 ans), protéger (préservatif) : trois gestes, trois familles.</div>"},
{"t": "La contraception, la sexualité et les IST (4e)", "q": "Le stérilet (DIU) au cuivre fonctionne par :", "c": ["blocage des trompes", "effet mécanique et chimique du cuivre (toxique pour les spermatozoïdes)", "ablation de l'utérus", "hormones"], "a": 1, "e": "Le cuivre immobilise les spermatozoïdes dans l'utérus : effet local, sans hormones, durable (5-10 ans).", "d": "<b>Le cuivre</b> : la barrière chimique locale.<div class='ex-detail'><u>Exemple rédigé</u> : le principe : le device en T libère des ions cuivre qui paralysent puis détruisent les spermatozoïdes avant la trompe : efficacité >99 %, durée 5-10 ans, réversible à tout moment (retrait = fertilité de retour immédiate) : la version hormonale (DIU au lévonorgestrel) épaissit la glaire et amincit la muqueuse : deux métiers, même dispositif : aucune protection IST pour les deux.</div>"},
{"t": "La contraception, la sexualité et les IST (4e)", "q": "Le vaccin contre le HPV est recommandé :", "c": ["aux adolescents (dès 11-14 ans), filles et garçons", "jamais", "aux nourrissons", "uniquement aux adultes malades"], "a": 0, "e": "Il protège des papillomavirus responsables de cancers (col de l'utérus, gorge...) : plus efficace avant l'exposition au virus.", "d": "<b>Adolescents dès 11-14 ans</b>, filles ET garçons.<div class='ex-detail'><u>Exemple rédigé</u> : la logique vaccinale : le HPV se transmet par contact sexuel (très fréquent : ~80 % des adultes y sont exposés un jour) : certains types causent des cancers (col utérin, gorge, anus) : le vaccin (2 doses à cet âge) protège des types les plus dangereux AVANT la première exposition : c'est pour ça qu'on vaccine tôt, garçons inclus (ils transmettent et développent aussi des cancers HPV) : un vaccin anticancer.</div>"},
{"t": "Le système nerveux et la communication (4e)", "q": "Dans un réflexe, le centre nerveux qui ordonne la réponse est :", "c": ["le muscle", "la moelle épinière", "le cervelet", "le cerveau"], "a": 1, "e": "L'arc réflexe s'appuie sur la moelle : le cerveau n'est informé qu'après.", "d": "<b>La moelle épinière</b> : la sortie de secours rapide.<div class='ex-detail'><u>Exemple rédigé</u> : le timing : main sur la plaque : le message sensitif atteint la moelle en ~20 ms : la moelle ordonne IMMÉDIATEMENT le retrait par le motoneurone ; en parallèle, un autre message monte au cerveau : la douleur consciente arrive APRÈS le retrait (l'ordre de grandeur se voit en expérimentant sur soi : on retire la main AVANT de « réaliser »). Piège : « le cerveau » : s'il fallait attendre le cortex, la brûlure serait plus grave : le réflexe est une sécurité MOELLAIRE conçue pour la vitesse.</div>"},
{"t": "Le système nerveux et la communication (4e)", "q": "Le message nerveux est chimique :", "c": ["à la synapse (neurotransmetteurs)", "dans tout l'axone", "dans le sang", "jamais"], "a": 0, "e": "Électrique le long de la fibre, chimique dans le fossé synaptique.", "d": "<b>À la synapse</b> : le relais chimique.<div class='ex-detail'><u>Exemple rédigé</u> : le deux-temps : dans l'axone, le message est une ONDE ÉLECTRIQUE (potentiel d'action, jusqu'à 120 m/s) ; arrivé au bouton synaptique, il y a un FOSSÉ (20 nm) que l'électricité ne saute pas : des molécules (acétylcholine, dopamine...) sont libérées et se fixent sur le neurone suivant : elles y rallument un signal électrique. Piège clinique : la majorité des médicaments psychiatriques et des drogues agissent PRÉCISÉMENT sur ces molécules synaptiques : c'est LA cible pharmacologique du cerveau.</div>"},
{"t": "Le système nerveux et la communication (4e)", "q": "Le cervelet est responsable :", "c": ["des décisions volontaires", "de l'équilibre et de la coordination des mouvements", "de la respiration automatique", "de la vue"], "a": 1, "e": "Il synchronise les mouvements et maintient l'équilibre (après vérification avec les sens).", "d": "<b>Équilibre et coordination</b> : le chef d'orchestre silencieux.<div class='ex-detail'><u>Exemple rédigé</u> : le test du cervelet : marcher en tandem (un pied devant l'autre, yeux fermés) : l'alcool perturbe d'ABORD le cervelet (démarche titubante AVANT tout trouble de la parole) : les tests de sobriété policiers (marche, doigt au nez) sont des tests CERVELET. Piège : « décisions volontaires » = cortex ; « respiration » = tronc cérébral : les trois étages de l'encéphale ont chacun leur métier.</div>"},
{"t": "Le système nerveux et la communication (4e)", "q": "L'ordre des éléments de l'arc réflexe :", "c": ["muscle ⟶ moelle ⟶ récepteur", "récepteur ⟶ cerveau ⟶ muscle", "récepteur ⟶ neurone sensitif ⟶ moelle ⟶ motoneurone ⟶ muscle", "cerveau ⟶ muscle ⟶ peau"], "a": 2, "e": "De la détection à la contraction : 5 maillons, la moelle au centre.", "d": "<b>Récepteur ⟶ sensitif ⟶ moelle ⟶ motoneurone ⟶ muscle</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'astuce mémorielle : R-S-M-M-E (Récepteur, Sensitif, Moelle, Motoneurone, Effecteur) : un arc « en U » : l'information monte, l'ordre redescend, tout se passe dans un segment de moelle : l'effecteur (muscle ou glande) exécute. Piège : le schéma où tout passe par le cerveau n'est PAS un arc réflexe : c'est la voie VOLONTAIRE : deux circuits, deux vitesses.</div>"},
{"t": "Le système nerveux et la communication (4e)", "q": "L'AVC touchant l'aire de Broca provoque :", "c": ["la perte de l'audition", "la paralysie totale", "une perte de la production de la parole (patient lucide mais quasi muet)", "la cécité"], "a": 2, "e": "Chaque aire est spécialisée : la lésion locale délimite précisément la fonction perdue.", "d": "<b>Le patient lucide mais muet</b> : la localisation cérébrale.<div class='ex-detail'><u>Exemple rédigé</u> : la logique des aires : le cortex n'est pas un bloc uniforme : des régions se sont spécialisées (moteur, sensitif, visuel, langage) : Broca commande la PRODUCTION de la parole : son AVC laisse comprendre, vouloir parler... et ne pas trouver les mots : la compréhension (aire de Wernicke, lésion opposée) peut être intacte : c'est en cartographiant ces lésions que la neurologie a dessiné la carte du cerveau.</div>"},
{"t": "Le système nerveux et la communication (4e)", "q": "La vitesse de conduction d'un message nerveux atteint au maximum :", "c": ["3 m/s", "340 m/s (vitesse du son)", "environ 120 m/s", "la vitesse de la lumière"], "a": 2, "e": "Les axones gainés de myéline conduisent jusqu'à ~120 m/s : les plus lents descendent à 0,5 m/s.", "d": "<b>~120 m/s</b> : l'autoroute myélinisée.<div class='ex-detail'><u>Exemple rédigé</u> : le pourquoi de la myéline : la gaine de myéline isole l'axone par tronçons : le signal « saute » de nœud en nœud (conduction saltatoire) : ×100 en vitesse par rapport aux fibres nues : la sclérose en plaques détruit cette gaine : messages ralentis/interrompus : troubles moteurs et sensitifs : la vitesse du système nerveux EST une affaire d'isolation, comme un câble électrique.</div>"},
{"t": "Le système nerveux et la communication (4e)", "q": "Un effecteur, c'est :", "c": ["un neurone sensitif", "l'organe qui exécute l'ordre (muscle ou glande)", "le centre nerveux", "un récepteur cutané"], "a": 1, "e": "L'effecteur agit : muscle (contraction) ou glande (sécrétion).", "d": "<b>Muscle ou glande</b> : le maillon final.<div class='ex-detail'><u>Exemple rédigé</u> : le vocabulaire complet : RÉCEPTEUR (capte : peau, œil) ; NEURONE SENSITIF (monte) ; CENTRE (moelle ou cerveau : décide) ; MOTONEURONE (descend) ; EFFECTEUR (exécute : muscle = mouvement, glande = sueur, salive, hormones de stress) : l'exemple glandulaire compte : le réflexe de salivation devant un citron EST un arc réflexe à effecteur glandulaire.</div>"},
{"t": "Le système nerveux et la communication (4e)", "q": "Le tronc cérébral gère :", "c": ["l'équilibre", "la pensée", "les fonctions vitales automatiques (respiration, rythme cardiaque)", "la mémoire"], "a": 2, "e": "C'est le « pilotage automatique » : une lésion y est immédiatement vitale.", "d": "<b>Respiration et cœur</b> : la tour de contrôle vitale.<div class='ex-detail'><u>Exemple rédigé</u> : la hiérarchie : le tronc cérébral relie cerveau et moelle : il contient les centres qui pilotent la respiration et le rythme cardiaque SANS conscience : c'est pour ça qu'un traumatisme du tronc (pourtant petit) est plus grave qu'une lésion du cortex (perte de fonction, mais vie maintenue) : les soins intensifs surveillent ces fonctions « tronc » en priorité.</div>"},
{"t": "Le système nerveux et la communication (4e)", "q": "La douleur est ressentie :", "c": ["une heure plus tard", "après le retrait réflexe (le cerveau est informé en parallèle)", "jamais dans un réflexe", "avant le retrait réflexe"], "a": 1, "e": "La moelle a déjà ordonné le retrait quand le cortex perçoit la douleur.", "d": "<b>Après le retrait</b> : la double voie.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience : touchez quelque chose de très chaud : la main part AVANT que vous « réalisiez » : les deux messages partent ensemble de la peau : le réflexe (moelle, court) gagne la course contre l'information consciente (cerveau, long) : la douleur sert ensuite à ANALYSER (l'éviter la prochaine fois), pas à sauver : la sécurité est réflexe, l'apprentissage est cérébral.</div>"},
{"t": "Le système nerveux et la communication (4e)", "q": "Les dendrites d'un neurone servent à :", "c": ["recevoir les messages", "fabriquer du sang", "conduire le signal sur de longues distances", "libérer les muscles"], "a": 0, "e": "Elles reçoivent ; l'axone conduit ; les terminaisons transmettent à la synapse.", "d": "<b>Recevoir</b> : les antennes du neurone.<div class='ex-detail'><u>Exemple rédigé</u> : la division du travail : DENDRITES (réception, nombreuses branches) ⟶ CORPS CELLULAIRE (intégration : décide de « tirer » ou non) ⟶ AXONE (conduction, jusqu'à 1 m du pied au dos !) ⟶ TERMINAISONS (transmission synaptique) : un neurone reçoit des milliers d'entrées et « vote » : si la somme dépasse le seuil, il émet : le cerveau est une démocratie de 86 milliards de votants.</div>"},
{"t": "La génétique et l'hérédité (3e)", "q": "Un gamète humain contient :", "c": ["46 chromosomes", "92 chromosomes", "des paires complètes", "23 chromosomes (un de chaque paire)"], "a": 3, "e": "La méiose réduit de moitié : la fécondation reconstitue 46.", "d": "<b>23 chromosomes</b> : la moitié du jeu.<div class='ex-detail'><u>Exemple rédigé</u> : le compte double : si les gamètes avaient 46 chacun : 92 à la fécondation : 184 aux enfants des enfants : explosion : la méiose (division réductrice) distribue UN chromosome par paire au hasard : 2²³ ≈ 8 millions de gamètes différents par personne : c'est elle qui alimente le brassage. Piège : « un de chaque paire » veut dire un tirage : parfois celui du grand-père maternel, parfois celui de la grand-mère : c'est le hasard des paires.</div>"},
{"t": "La génétique et l'hérédité (3e)", "q": "Deux parents aux yeux marrons (M dominant) ont un enfant aux yeux bleus (bb récessif). Leurs génotypes :", "c": ["MM × MM", "M b × M b", "impossible à savoir", "MM × bb"], "a": 1, "e": "L'enfant bb a reçu un b de chaque : chacun est porteur, mais marron grâce à M.", "d": "<b>M b × M b</b> : deux porteurs sains.<div class='ex-detail'><u>Exemple rédigé</u> : la déduction inverse : enfant bb ⟹ un b venu de la mère + un b du père ⟹ chaque parent a au moins un b ; ils sont marrons ⟹ chaque parent a au moins un M ⟹ génotype M b pour tous les deux (hypothèse d'un seul gène, modèle scolaire). La grille : MB, Mb, bM, bb : 3 marrons (dont 2 porteurs), 1 bleu. Piège : ce n'est pas parce que le premier enfant est marron que les suivants ne peuvent pas être bleus : chaque conception est un NOUVEAU tirage à 25 %.</div>"},
{"t": "La génétique et l'hérédité (3e)", "q": "Un allèle récessif s'exprime quand :", "c": ["il est présent en deux exemplaires (homozygote)", "il est dominant", "il est en un seul exemplaire", "il est sur le chromosome X"], "a": 0, "e": "Le dominant masque le récessif chez l'hétérozygote : deux récessifs sont nécessaires.", "d": "<b>En deux exemplaires</b> : la condition d'expression.<div class='ex-detail'><u>Exemple rédigé</u> : la logique : l'allèle dominant code une protéine fonctionnelle suffisante SEULE (une recette suffit) : le récessif ne se voit que si AUCUNE version dominante ne l'accompagne : homozygote bb ⟹ bleu ; hétérozygote B b ⟹ marron MAIS transmetteur. Piège : le récessif n'est pas « plus faible » : il est MASQUÉ : d'où les maladies récessives qui traversent les générations cachées dans les porteurs sains.</div>"},
{"t": "La génétique et l'hérédité (3e)", "q": "Deux parents hétérozygotes (Aa) pour une maladie récessive. Probabilité d'un enfant malade :", "c": ["100 %", "0 %", "50 %", "25 % à chaque naissance"], "a": 3, "e": "Grille Aa × Aa : AA, Aa, aA, aa : 1 case sur 4 = malade.", "d": "<b>25 %</b> : la fameuse case unique.<div class='ex-detail'><u>Exemple rédigé</u> : le décompte : parents A a × A a : gamètes A/a chacun : grille : AA (sain), A a (porteur), a A (porteur), a a (malade) : phénotypes : 3/4 sains, 1/4 malade. Application : la mucoviscidose (1/30 porteurs en France : risque couple ≈ 1/30 × 1/30 × 1/4 ≈ 1/3600) : d'où l'intérêt du dépistage des porteurs. Piège : après un premier enfant malade, le risque reste 25 % pour le suivant : les tirages sont indépendants.</div>"},
{"t": "La génétique et l'hérédité (3e)", "q": "Le brassage génétique lors de la méiose vient :", "c": ["du hasard de la répartition des chromosomes + des crossing-over", "de l'alimentation", "du hasard de la fécondation seulement", "des mutations induites par les parents"], "a": 0, "e": "Répartition au hasard des paires (interchromosomique) + échanges de fragments entre chromosomes (crossing-over).", "d": "<b>Répartition aléatoire + crossing-over</b> : les deux brassages.<div class='ex-detail'><u>Exemple rédigé</u> : les deux loteries : ① pour chaque paire, le gamète reçoit le chromosome paternel OU maternel : 2²³ combinaisons ; ② pendant la méiose, les chromosomes d'une paire s'échangent des fragments (crossing-over) : de NOUVELLES combinaisons de gènes apparaissent, inexistantes chez les parents : un enfant reçoit des chromosomes MIXTES, pas des photocopies. Piège : la fécondation ajoute encore du hasard (quel gamète rencontre quel gamète) : trois sources d'unicité cumulées.</div>"},
{"t": "La génétique et l'hérédité (3e)", "q": "La myopathie de Duchenne touche surtout les garçons car :", "c": ["les filles sont vaccinées", "le gène est sur Y", "les garçons sont plus fragiles", "le gène est sur X : XY n'a qu'un exemplaire (pas de second allèle sain qui masque)"], "a": 3, "e": "Un garçon XY ne reçoit qu'un X : un allèle récessif défectueux s'exprime faute de partenaire sain.", "d": "<b>Un seul X chez le garçon</b> : le piège du chromosome X.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul : une mère porteuse (X^m X saine) transmet son X^m à la moitié des enfants : les filles qui le reçoivent sont PORTEUSES (leur second X sain masque) : les garçons qui le reçoivent sont MALADES (pas de second exemplaire). Bilan : 50 % des garçons malades, 0 % des filles (mais 50 % de porteuses) : les maladies liées à X frappent les garçons et voyagent par les mères. Piège : un garçon atteint tient son X de sa MÈRE (le père lui donne le Y).</div>"},
{"t": "La génétique et l'hérédité (3e)", "q": "Une mutation d'un gène peut :", "c": ["seulement tuer la cellule", "être toujours grave", "corriger automatiquement le gène", "être silencieuse, néfaste ou avantageuse selon son effet sur la protéine"], "a": 3, "e": "La mutation change la recette : l'effet dépend de la protéine produite et de l'environnement.", "d": "<b>Variable</b> : le destin des mutations.<div class='ex-detail'><u>Exemple rédigé</u> : trois issues : SILENCIEUSE (la protéine reste fonctionnelle : la plupart) ; NÉFASTE (drépanocytose : l'hémoglobine déformée : anémie) ; AVANTAGEUSE (l'allèle de la drépanocytose protège DU PALUDISME : les porteurs survivent mieux dans les zones impaludées : c'est l'origine de sa fréquence) : une mutation n'est ni « bien » ni « mal » dans l'absolu : sa valeur dépend de l'environnement : c'est le B-a-BA de l'évolution.</div>"},
{"t": "La génétique et l'hérédité (3e)", "q": "Le phénotype d'un individu, c'est :", "c": ["sa paire d'allèles", "ses gamètes", "son ADN brut", "l'ensemble de ses caractères observables"], "a": 3, "e": "Phénotype = ce qu'on voit/mesure ; génotype = les allèles qui le programment.", "d": "<b>Les caractères observables</b> : l'extérieur vs l'intérieur.<div class='ex-detail'><u>Exemple rédigé</u> : la distinction : GÉNOTYPE = la combinaison d'allèles (M b : invisible) ; PHÉNOTYPE = la traduction visible (yeux marrons, groupe sanguin, taille, maladie ou pas) : un même phénotype peut cacher plusieurs génotypes (MM ou M b : tous marrons) : c'est pour ça qu'on ne peut pas lire un génotype sur une photo : il faut des croisements (ou un séquençage !).</div>"},
{"t": "La génétique et l'hérédité (3e)", "q": "Le crossing-over (enjambement) a lieu :", "c": ["pendant la méiose : échange de fragments entre chromosomes d'une même paire", "dans le muscle", "pendant la mitose", "pendant la fécondation"], "a": 0, "e": "Les chromosomes homologues se croisent et échangent des segments : nouveaux mélanges de gènes.", "d": "<b>Pendant la méiose</b> : la recombinaison.<div class='ex-detail'><u>Exemple rédigé</u> : l'image : deux échelles (les chromosomes d'une paire) qui échangent des barreaux (des fragments de gènes) : le chromosome reçu par l'enfant contient des morceaux du grand-père ET de la grand-mère sur la MÊME molécule : sans crossing-over, les gènes d'un chromosome voyageraient TOUJOURS ensemble : la recombinaison crée des combinaisons inédites, matière première de la sélection naturelle : c'est l'un des moteurs de l'évolution.</div>"},
{"t": "La génétique et l'hérédité (3e)", "q": "Un homme transmet son chromosome Y :", "c": ["à tous ses fils (et son X à toutes ses filles)", "à tous ses enfants", "à personne", "à toutes ses filles"], "a": 0, "e": "Le père donne X ou Y au hasard : X ⟹ fille, Y ⟹ garçon : chaque enfant reçoit l'un des deux.", "d": "<b>À ses fils uniquement</b> : la logique XY.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : ses gamètes portent soit son X, soit son Y (50/50 à la méiose) : la mère ne donne QUE des X : X (mère) + X (père) = fille ; X (mère) + Y (père) = garçon. Conséquences : ① le père détermine le sexe ; ② un père transmet son Y en lignée mâle (père-fils-petit-fils...) ; ③ les maladies liées à X voyagent par les mères, jamais de père à fils. Piège : « à tous ses enfants » est impossible : un enfant ne reçoit qu'UN chromosome sexuel paternel.</div>"},
{"t": "L'immunité et les vaccins (3e)", "q": "La mémoire immunitaire signifie :", "c": ["le corps oublie les microbes", "les anticorps restent à taux constant pour toujours", "la peau retient les virus", "au 2e contact, la réponse est plus rapide et plus forte (maladie évitée)"], "a": 3, "e": "Les lymphocytes-mémoire reconnaissent immédiatement l'antigène déjà rencontré : réponse foudroyante.", "d": "<b>Réponse accélérée au 2e contact</b> : le bénéfice de l'expérience.<div class='ex-detail'><u>Exemple rédigé</u> : le timing : 1er contact : reconnaissance, prolifération, anticorps : ~5-7 jours de délai : on est malade ; 2e contact : les LB-mémoire se déclenchent en HEURES : le virus est neutralisé avant de s'installer : on ne « sent rien ». Piège : les anticorps eux-mêmes baissent avec le temps : c'est la MÉMOIRE CELLULAIRE (les lymphocytes qui durent) qui compte : d'où les rappels, qui réactivent l'usine.</div>"},
{"t": "L'immunité et les vaccins (3e)", "q": "Un vaccin contient :", "c": ["des lymphocytes étrangers", "des anticorps prêts à l'emploi", "une forme inoffensive de l'antigène (tué, atténué ou fragment)", "des antibiotiques"], "a": 2, "e": "Il entraîne le système immunitaire : c'est LUI qui fabrique ses anticorps et sa mémoire.", "d": "<b>Un antigène inoffensif</b> : l'entraînement simulé.<div class='ex-detail'><u>Exemple rédigé</u> : la nuance fondamentale : le vaccin ne protège pas DIRECTEMENT : il présente une « photo » de l'ennemi (virus tué, affaibli, fragment de protéine ou plan ARN comme les vaccins COVID) : le système immunitaire fait son apprentissage SANS combattre de vraie maladie : anticorps + lymphocytes-mémoire : au vrai virus, réponse immédiate. Piège : le vaccin n'est donc PAS un médicament qui agit : c'est un PROFESSEUR qui enseigne : la protection vient de soi-même.</div>"},
{"t": "L'immunité et les vaccins (3e)", "q": "Le sérum thérapeutique (ex. antitétanique) apporte :", "c": ["des anticorps fabriqués par un autre organisme (protection immédiate mais passagère)", "un virus atténué", "des antibiotiques", "un antigène"], "a": 0, "e": "Immunité passive : efficace tout de suite (urgence), mais sans mémoire et éphémère.", "d": "<b>Des anticorps d'emprunt</b> : la roue de secours.<div class='ex-detail'><u>Exemple rédigé</u> : le duel : SÉRUM : anticorps issus d'un donneur immunisé (ou animal) : injectés : neutralisation immédiate du toxique MAIS dégradation en quelques semaines, zéro mémoire : usage d'URGENCE (blessure souillée + tétanos mal vacciné) ; VACCIN : rien d'immediat, mais mémoire durable : le protocole complet associe souvent les deux : sérum pour la blessure présente, vaccin pour l'avenir. Piège : confondre les deux est LA question classique du contrôle.</div>"},
{"t": "L'immunité et les vaccins (3e)", "q": "Les anticorps :", "c": ["sont des cellules", "sont des protéines en Y qui reconnaissent spécifiquement un antigène et le neutralisent", "engloutissent les microbes entiers", "tuent tous les microbes indifféremment"], "a": 1, "e": "Chaque anticorps colle à UN antigène précis (comme une clé) : il neutralise et marque la cible.", "d": "<b>Des protéines spécifiques</b> : les clés moléculaires.<div class='ex-detail'><u>Exemple rédigé</u> : le fonctionnement : l'anticorps a une forme en Y dont les deux bras épousent EXACTEMENT l'antigène (complémentarité clé-serrure) : effets : bloquer le virus (il ne peut plus infecter), agglutiner les microbes, et surtout MARQUER la cible pour les phagocytes (« mangez-moi » : opsonisation). Piège : ils ne « mangent » rien : ce sont des étiquettes, pas des mâchoires : la destruction est le travail des phagocytes et du complément.</div>"},
{"t": "L'immunité et les vaccins (3e)", "q": "La phagocytose est :", "c": ["une réaction allergique", "la production d'anticorps", "l'engloutissement d'un microbe par une cellule (phagocyte) pour le digérer", "la division des lymphocytes"], "a": 2, "e": "C'est la défense innée par excellence : le phagocyte entoure, avale et digère l'intrus.", "d": "<b>Engloutir et digérer</b> : le garde du corps inné.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario : le phagocyte (macrophage, polynucléaire) suit la piste chimique, émet des prolongements qui enserrent le microbe, l'internalise dans une vésicule (phagosome), le fusione avec des sacs d'enzymes : digestion : les débris sont exhibés à la surface : c'est comme ça que les lymphocytes T apprennent qui est l'ennemi (l'inné fait le repérage, l'adaptatif fait le plan). Piège : phagocytose = INNÉE (non spécifique : mange tout ce qui est signalé) : anticorps = ADAPTATIF (spécifique) : les deux lignes coopèrent.</div>"},
{"t": "L'immunité et les vaccins (3e)", "q": "Le VIH provoque le SIDA en :", "c": ["détruisant les globules rouges", "bouchant les vaisseaux", "fabriquant trop d'anticorps", "détruisant les lymphocytes T4, les coordonnateurs de la réponse immunitaire"], "a": 3, "e": "Sans les T4, l'orchestre immunitaire n'a plus de chef : infections opportunistes et cancers s'installent.", "d": "<b>Détruit les LT4</b> : décapiter la défense.<div class='ex-detail'><u>Exemple rédigé</u> : la stratégie du virus : le T4 (CD4) est le chef d'orchestre : il active les LB (anticorps) et les LT8 (tueurs) : le VIH s'y installe, s'y multiplie et le détruit : le système immunitaire perd son COORDINATEUR : les défenses restantes se désorganisent : des infections banales deviennent mortelles (pneumocystose, tuberculose, candidoses : les « opportunistes »). La trithérapie bloque la multiplication du virus : les T4 remontent : le système reprend : dépistage précoce = traitement = vie normale.</div>"},
{"t": "L'immunité et les vaccins (3e)", "q": "Une allergie est :", "c": ["une infection", "un manque d'immunité", "une réaction immunitaire excessive contre une substance inoffensive", "un type de cancer"], "a": 2, "e": "Le système se trompe de cible : histamine ⟶ symptômes (nez, urticaire, jusqu'au choc anaphylactique).", "d": "<b>Une erreur de ciblage</b> : trop de zèle.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : 1er contact : le pollen (inoffensif) est catalogué ennemi : IgE sur les mastocytes ; contacts suivants : histamine libérée : vaisseaux qui fuient, muqueuses irritées : rhinite, urticaire, œdème : au pire, choc anaphylactique (chute de tension, gonflement des voies aériennes : adrénaline en urgence = stylo). Traitement : antihistaminiques + désensibilisation (rééducation par doses croissantes). Piège : l'allergie n'est pas une immunodéficience : c'est une hyper-réactivité.</div>"},
{"t": "L'immunité et les vaccins (3e)", "q": "Les rappels de vaccination servent à :", "c": ["réactiver la mémoire immunitaire et maintenir un taux protecteur", "tuer les lymphocytes", "laver les anticorps", "soigner la maladie"], "a": 0, "e": "Les anticorps baissent avec le temps : le rappel relance la production et la mémoire.", "d": "<b>Réactiver la mémoire</b> : l'entretien du savoir-faire.<div class='ex-detail'><u>Exemple rédigé</u> : le calendrier : DTP à 2, 4, 11 mois puis rappels (6 ans, 11-13 ans, 25, 45, 65...) : pourquoi : après l'entraînement initial, les anticorps déclinent ; si aucun rappel, le souvenir s'endort : au vrai contact, la réponse pourrait être trop lente : le rappel relance une prolifération massive (loi de l'entraînement sportif : sans pratique, la forme baisse). Piège : les rappels ne concernent PAS seulement les enfants (tétanos tous les 10 ans chez l'adulte, grippe annuelle : virus changeant).</div>"},
{"t": "L'immunité et les vaccins (3e)", "q": "La fièvre pendant une infection :", "c": ["est causée par les antibiotiques", "détruit les lymphocytes", "est un effet secondaire à supprimer toujours", "est une défense : température moins favorable aux microbes + accélère les réponses immunitaires"], "a": 3, "e": "Elle est déclenchée par le corps (hypothalamus rehaussé) : un outil de lutte, à surveiller mais pas à casser systématiquement.", "d": "<b>Une défense</b> : la stratégie thermique.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : les leucocytes libèrent des pyrogènes : l'hypothalamus monte le thermostat (frissons : production de chaleur) : à 38-39 °C, certains microbes se multiplient moins vite et les lymphocytes sont plus actifs : la fièvre est un ALLIÉ modéré : la traiter devient nécessaire au-delà (confort, risque chez le nourrisson ou au-delà de ~40). Piège : « supprimer toujours » : l'automédication systématique contrecarre parfois la défense : c'est un équilibre à gérer, pas un ennui à éradiquer.</div>"},
{"t": "L'immunité et les vaccins (3e)", "q": "Un greffon est rejeté car :", "c": ["le chirurgien se trompe", "le système immunitaire reconnaît le greffon comme du « non-soi » et l'attaque", "les anticorps du donneur attaquent", "le greffon est mort avant"], "a": 1, "e": "Les molécules HLA du donneur diffèrent des nôtres : la tolérance exige compatibilité + immunosuppresseurs.", "d": "<b>Du non-soi à abattre</b> : la fidélité excessive du système.<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe : l'immunité nous protège en rejetant TOUT ce qui n'est pas nous : un rein greffé porte les marqueurs HLA du DONNEUR : la police immunitaire voit un intrus et attaque. Solutions : ① compatibilité maximale donneur-receveur (frère/sœur idéalement : mêmes parents) ; ② médicaments immunosuppresseurs (la police est mise en congé : risque : infections et cancers : le prix de la greffe) : la médecine recherche des tolérances acquises (apprendre au système à accepter : la frontière des greffes actuelles).</div>"},
{"t": "L'évolution des espèces (3e)", "q": "La sélection naturelle agit en :", "c": ["triant les variations existantes : les mieux adaptés survivent et se reproduisent davantage", "modifiant les individus pendant leur vie selon leurs efforts", "créant les mutations utiles dont les individus ont besoin", "tirant au sort les survivants"], "a": 0, "e": "Les mutations apparaissent au hasard : l'environnement ne fait que filtrer.", "d": "<b>Tri des variantes</b> : le filtre du milieu.<div class='ex-detail'><u>Exemple rédigé</u> : l'ordre des événements : ① variation aléatoire (mutation : les becs naissent plus ou moins forts : personne ne le décide) ; ② concurrence (nourriture limitée) ; ③ les mieux équipés survivent ET transmettent ; ④ génération après génération : moyenne déplacée. Piège : « selon leurs efforts » : c'est LAMARCK (la girafe étire son cou) : faux : un muscle développé ne se transmet pas génétiquement : se transmettent les ALLÈLES des reproducteurs.</div>"},
{"t": "L'évolution des espèces (3e)", "q": "Les pinsons des Galápagos avec des becs différents :", "c": ["prouvent que chaque île a créé ses espèces indépendamment", "s'expliquent par la sélection naturelle à partir d'un ancêtre commun : le milieu (type de graines) a trié les becs", "sont des espèces créées récemment", "montrent que les becs changent au cours de la vie d'un oiseau"], "a": 1, "e": "Becs variés héritables + nourritures différentes par île = spécialisation par tri naturel : ancêtre commun.", "d": "<b>Un ancêtre commun, des filtres différents</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario darwinien : une population ancestrale arrive sur l'archipel : chaque île a ses ressources (grosses graines, insectes, cactus) : sur chacune, les becs les mieux adaptés à SES ressources nourrissent leurs porteurs ⟹ reproduction : après de nombreuses générations : 13 espèces distinctes. C'est l'EXEMPLE FONDATEUR de Darwin : la diversité naît de la géographie + l'héritabilité + le tri. Piège : le bec d'un individu ne change PAS (il naît avec : c'est la POPULATION qui évolue).</div>"},
{"t": "L'évolution des espèces (3e)", "q": "Dans une falaise sédimentaire, les couches les plus profondes sont :", "c": ["au hasard", "les plus récentes", "les plus anciennes (principe de superposition)", "les plus riches en ADN"], "a": 2, "e": "Les sédiments se déposent les uns sur les autres : le bas précède le haut : la falaise est une frise chronologique.", "d": "<b>Les plus anciennes</b> : la pile du temps.<div class='ex-detail'><u>Exemple rédigé</u> : la lecture d'une coupe : du bas au sommet, l'âge MONTE : les fossiles du bas (ammonites : indice du Secondaire) sont plus vieux que ceux du haut (mammifères : Cénozoïque) : une inversion (faille, pli) se détecte par incohérence des fossiles. Piège : les fossiles « guides » (ammonites, trilobites) datent les couches partout dans le monde : c'est la base de l'échelle des temps géologiques.</div>"},
{"t": "L'évolution des espèces (3e)", "q": "L'Homme et le chimpanzé partagent environ 99 % de leur ADN. Cela signifie :", "c": ["que l'Homme descend du chimpanzé", "que le chimpanzé est un Homme raté", "que l'ADN ne sert à rien", "qu'ils ont un ancêtre commun récent (cousins évolutifs)"], "a": 3, "e": "Deux branches d'un même arbre : le tronc est l'ancêtre commun : cousins, pas filiation directe.", "d": "<b>Un ancêtre commun</b> : la bonne généalogie.<div class='ex-detail'><u>Exemple rédigé</u> : la correction : « l'Homme descend du chimpanzé » est FAUX (le chimpanzé actuel a évolué depuis 7 Ma autant que nous) : la ressemblance ADN mesure la PROXIMITÉ d'une branche commune : plus elle est récente, plus les gènes se ressemblent : l'arbre (homme + chimpanzé : branche ~7 Ma : plus proche du gorille : ~9 Ma) se reconstruit par les distances génétiques. Piège : l'image de « l'échelle » (singe ⟶ homme) est préscientifique : la bonne image est l'ARBRE à branches concurrentes.</div>"},
{"t": "L'évolution des espèces (3e)", "q": "Les homologies anatomiques (même membre : bras humain, nageoire de baleine, aile de chauve-souris) prouvent :", "c": ["le hasard parfait", "que la baleine est un poisson", "un plan commun hérité d'un ancêtre commun, remodelé par la sélection", "que toutes les espèces s'entraînent"], "a": 2, "e": "Mêmes pièces osseuses, formes différentes : héritage d'un ancêtre tétrapode commun, spécialisé par milieux.", "d": "<b>Un héritage remodelé</b> : l'ossature de la parenté.<div class='ex-detail'><u>Exemple rédigé</u> : l'observation : humérus, radius, cubitus, doigts : les MÊMES os dans les trois : seulement les proportions changent (nageoires : os courts et plats ; ailes : allongés) : la fonction diffère (nager, voler, saisir) mais la structure est identique : un « architecte » commun : un ancêtre tétrapode. Piège : l'AILE de la chauve-souris et l'AILE de la mouche ne sont PAS homologues (construction différente : analogie) : homologie = même construction = parenté : analogie = même fonction = convergence.</div>"},
{"t": "L'évolution des espèces (3e)", "q": "Les critères d'appartenance au groupe humain incluent :", "c": ["bipédie, volume crânien élevé croissant, outils, langage et culture", "le régime alimentaire", "la taille", "seulement la bipédie"], "a": 0, "e": "Bipédie ancienne, encéphalisation (400 ⟶ 1350 cm³), industrie lithique, complexité culturelle : cumul progressif.", "d": "<b>Un faisceau de critères</b> : la définition du genre Homo.<div class='ex-detail'><u>Exemple rédigé</u> : le décompte : la bipédie est ANCIENNE (Lucy : -3,2 Ma : déjà bipède avec un petit cerveau) : le crâne grossit ensuite (habilis ~600 cm³, erectus ~900, Sapiens ~1350) : les outils s'affinent (galets aménagés ⟶ bifaces ⟶ lames) : langage et sépultures tardifs : l'humanité s'assemble PIÈCE PAR PIÈCE sur des millions d'années : aucun caractère isolé ne suffit.</div>"},
{"t": "L'évolution des espèces (3e)", "q": "Les mutations génétiques sont :", "c": ["impossibles chez l'Homme", "transmises par l'apprentissage", "aléatoires : le milieu ne fait ensuite que filtrer celles qui avantagent", "toujours provoquées par le milieu selon les besoins"], "a": 2, "e": "Le hasard crée les variantes (mutation) : la sélection (non aléatoire) les trie.", "d": "<b>Aléatoires, puis triées</b> : hasard + filtre.<div class='ex-detail'><u>Exemple rédigé</u> : la division du travail : MUTATION (copie fautive de l'ADN : aléatoire : ni dirigée ni souhaitée : la plupart neutres, certaines nuisibles, rares utiles) ; SÉLECTION (l'environnement AVANTAGE les porteurs des variantes utiles : non aléatoire) : l'évolution = variation aléatoire + reproduction différentielle : il n'y a ni projet ni progrès : seulement la comptabilité des survies. Piège : « le milieu crée la mutation utile » : le lichen des papillons anglais n'a pas « décidé » de foncer : les variantes sombres existaient DEJA (plus rares) et l'industrie les a favorisées.</div>"},
{"t": "L'évolution des espèces (3e)", "q": "L'extinction des dinosaures il y a 66 Ma :", "c": ["a eu lieu il y a 5000 ans", "est attestée par la disparition des fossiles et une anomalie d'iridium (choc météoritique)", "n'a laissé aucune trace", "est une légende"], "a": 1, "e": "Couche d'argile riche en iridium (signature d'astéroïde) datée -66 Ma + disparition brutale des fossiles : crise biologique majeure.", "d": "<b>Une crise datée et expliquée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement : à -66 Ma (limite Crétacé-Paléogène), les fossiles de dinosaires S'ARRÊTENT net : une fine couche d'argile mondiale contient 30 fois plus d'iridium que la normale (les météorites en sont riches : pas la croûte terrestre) + un cratère de 180 km au Yucatán : scénario : impact géant ⟶ hiver d'impact ⟶ effondrement des chaînes alimentaires : 75 % des espèces disparaissent : les mammifères (petits, opportunistes) héritent de la Terre. Piège : les mammifères n'ont pas « vaincu » les dinosaires : ils ont rempli une place libérée.</div>"},
{"t": "L'évolution des espèces (3e)", "q": "Sapiens et Néandertal :", "c": ["sont la même espèce", "ont coexisté et se sont croisés (~2 % d'ADN néandertalien chez les Eurasiens actuels)", "étaient séparés par un océan", "n'ont jamais coexisté"], "a": 1, "e": "Deux espèces humaines voisines ont partagé l'Eurasie : Sapiens a absorbé génétiquement une partie de Néandertal.", "d": "<b>Cousins croisés</b> : la rencontre des deux humanités.<div class='ex-detail'><u>Exemple rédigé</u> : le récit : Néandertal s'installe en Europe (~400 000 ans), adapté au froid ; Sapiens sort d'Afrique (~60 000 ans) : coexistence ~20 000 ans en Eurasie : croisements (génome séquencé en 2010 : ~1-2 % d'ADN néandertalien chez les non-Africains actuels : jusqu'à 4-6 % chez les Papous via les Denisoviens) : Néandertal disparaît (~40 000 ans : causes discutées : climat, concurrence, absorption). Conséquence : l'humanité actuelle est un MÉTISSAGE ancien : l'arbre humain est un buisson, pas une ligne droite.</div>"},
{"t": "L'évolution des espèces (3e)", "q": "Dire « la théorie de l'évolution » signifie :", "c": ["que c'est un cadre scientifique puissant, confirmé par fossiles, anatomie, embryologie et ADN", "que la science n'est pas sûre du tout", "que c'est une simple hypothèse non vérifiée", "que Darwin a tout inventé sans observation"], "a": 0, "e": "En science, une « théorie » n'est pas un « supposé » : c'est un cadre explicatif validé par des données multiples et indépendantes.", "d": "<b>Un cadre validé</b> : le sens scientifique du mot théorie.<div class='ex-detail'><u>Exemple rédigé</u> : le vocabulaire : dans le langage courant, « théorie » = supposition : en science, c'est un édifice explicatif qui unifie des faits : l'évolution repose sur 4 piliers INDEPENDANTS (fossiles : chronologie : anatomie : homologies : embryologie : étapes du développement : ADN : parenté moléculaire : les mêmes arbres) : la convergence des preuves est la force de la théorie. Piège : l'alternative « ce n'est qu'une théorie » joue sur l'ambiguïté du mot : comme la « théorie de la gravitation » : personne ne flotte pour autant.</div>"},
{"t": "Les écosystèmes et l'environnement (3e)", "q": "Dans une chaîne alimentaire, tout commence par :", "c": ["le champignon", "le producteur primaire (végétal chlorophyllien)", "le décomposeur", "le super-prédateur"], "a": 1, "e": "Seul le végétal fabrique la matière organique à partir de lumière et CO₂ : tous les autres en dépendent.", "d": "<b>Le producteur primaire</b> : la fondation verte.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement énergétique : le végétal capte ~1 % de l'énergie lumineuse (photosynthèse : CO₂ + eau + lumière ⟶ matière organique + O₂) : l'herbivore la mange (récupère ~10 % de cette énergie), le carnivore mange l'herbivore (10 % du reste)... : sans la base verte, aucun étage ne tient. Piège : le décomposeur est indispensable mais il FERME la boucle, il ne l'ouvre pas : l'entrée d'énergie, c'est le végétal (ou le chimiosynthétique en source hydrothermale).</div>"},
{"t": "Les écosystèmes et l'environnement (3e)", "q": "Entre deux niveaux trophiques, l'énergie transférée est d'environ :", "c": ["10 % (90 % perdus : respiration, chaleur, déjections)", "100 %", "50 %", "1 %"], "a": 0, "e": "La pyramide : chaque étage récupère ~1/10 de l'étage du dessous : d'où peu de niveaux.", "d": "<b>~10 %</b> : le goulot d'étranglement.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul : 1000 kg d'herbe ⟶ 100 kg de sauterelles ⟶ 10 kg de lézards ⟶ 1 kg de buse : c'est pour ça qu'un prédateur au sommet est RARE (quelques buses pour des hectares) et qu'un végétarien « coûte » 10 fois moins de terrain qu'un carnivore (le bœuf : ~10 kg de céréales pour 1 kg de viande). Piège : la MATIÈRE, elle, circule intégralement (recyclée par les décomposeurs) : c'est l'ÉNERGIE qui se perd en chaleur à chaque étage.</div>"},
{"t": "Les écosystèmes et l'environnement (3e)", "q": "Les décomposeurs (champignons, bactéries) servent à :", "c": ["produire de la matière organique", "recycler la matière organique morte en éléments minéraux réutilisables", "chasser les herbivores", "fabriquer de l'énergie"], "a": 1, "e": "Ils transforment cadavres et déjections en sels minéraux : la boucle de la matière se referme.", "d": "<b>Recycler</b> : les éboueurs du vivant.<div class='ex-detail'><u>Exemple rédigé</u> : le circuit : feuille morte ⟶ décomposeurs (enzymes : ils digèrent HORS d'eux puis absorbent) ⟶ CO₂ + sels minéraux (azote, phosphore) ⟶ réabsorbés par les racines ⟶ nouvelle feuille : sans eux, la matière organique morte s'ENTASSERAIT et les minéraux seraient enfermés pour toujours : pas de nouvelle croissance. Piège : ils ne « créent » rien : ils LIBÈRENT les éléments : c'est une boucle fermée (le carbone repasse par l'atmosphère et le sol).</div>"},
{"t": "Les écosystèmes et l'environnement (3e)", "q": "La relation abeille-fleur est :", "c": ["du parasitisme", "de la prédation", "du mutualisme (les deux gagnent : nectar contre transport du pollen)", "de la compétition"], "a": 2, "e": "L'abeille récolte le nectar, la plante est fécondée : contrat gagnant-gagnant.", "d": "<b>Mutualisme</b> : le contrat gagnant-gagnant.<div class='ex-detail'><u>Exemple rédigé</u> : le marché : la plante INVESTIT (sucre du nectar, protéines du pollen) : l'abeille paie en transportant le pollen d'une fleur à l'autre (fécondation croisée : diversité génétique) : les deux partenaires tirent un bénéfice net : autres exemples : mycorhizes (champignon + racine : eau/minéraux contre sucres), lignées intestinales (vitamines contre gîte). Piège : le parasitisme (tique-cerf : l'un profite, l'autre paie) : le critère : QUI gagne quoi ?</div>"},
{"t": "Les écosystèmes et l'environnement (3e)", "q": "Une espèce « clef de voûte » :", "c": ["n'existe pas", "est toujours un prédateur inoffensif", "a un effet disproportionné sur l'écosystème : sa disparition déclenche une cascade", "est toujours la plus grosse"], "a": 2, "e": "Peu abondante mais structurelle : sa présence tient l'édifice (loup, castor, étoile de mer).", "d": "<b>Effet disproportionné</b> : le petit maître du bâtiment.<div class='ex-detail'><u>Exemple rédigé</u> : le concept : une clef de voûte est petite devant la voûte qu'elle tient : le LOUP (peu nombreux) façonne forêts et rivières (les cerfs évitent ses zones : les arbres repoussent : les berges se fixent) : le CASTOR crée des zones humides qui hébergent des dizaines d'espèces : l'étoile de mer contrôle les moules (sinon : banc monospécifique). Piège : la protéger n'est pas du « sentimentalisme » : c'est de l'ingénierie écologique à bas coût : retirer la clef et l'édifice s'effondre.</div>"},
{"t": "Les écosystèmes et l'environnement (3e)", "q": "Les populations prédateur-prolié évoluent :", "c": ["toujours à l'identique", "indépendamment", "de façon liée avec un décalage : les pics de proies précèdent ceux des prédateurs", "au hasard total"], "a": 2, "e": "Quand les proies abondent, les prédateurs se multiplient (retard) : puis ils les épuisent et déclinent à leur tour : oscillations couplées.", "d": "<b>Oscillations décalées</b> : le manège lièvre-lynx.<div class='ex-detail'><u>Exemple rédigé</u> : la série : ① proies abondantes ⟹ nourriture facile ⟹ prédateurs augmentent (avec ~1-2 ans de retard) ② trop de prédateurs ⟹ les proies chutent ③ faim ⟹ les prédateurs déclinent ④ les proies se rétablissent... : les courbes historiques lièvre-lynx (Canada : données de fourrures depuis 1845 !) montrent deux vagues décalées : la régulation est un moteur en retard, pas un thermostat instantané. Piège : la proie ne « disparaît » jamais : le système oscille autour d'un équilibre dynamique.</div>"},
{"t": "Les écosystèmes et l'environnement (3e)", "q": "La différence entre le cycle de la MATIÈRE et le flux d'ÉNERGIE :", "c": ["l'énergie circule en boucle, la matière traverse", "la matière circule en boucle fermée, l'énergie traverse (perdue en chaleur à chaque étape)", "aucune", "les deux circulent en boucle"], "a": 1, "e": "Le carbone repasse indéfiniment (recyclé) : l'énergie lumineuse entrée est définitivement dissipée en chaleur.", "d": "<b>Matière : boucle : énergie : flux</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la comptabilité : le carbone d'une feuille mangée par la sauterelle se retrouve (en partie) dans le lézard, puis la buse, puis l'atmosphère (respiration), puis une nouvelle feuille : RIEN ne se perd (recyclage intégral par les décomposeurs) ; l'énergie, elle, se DÉGRADE à chaque transfert (chaleur corporelle rayonnée : irrécupérable pour la chaîne) : l'écosystème a besoin d'une ENTRÉE permanente (le Soleil) : la matière, non : c'est LA distinction conceptuelle du chapitre.</div>"},
{"t": "Les écosystèmes et l'environnement (3e)", "q": "Une espèce invasive (ex. frelon asiatique) est dangereuse car :", "c": ["elle est stérile", "elle est plus grosse", "elle n'a pas de prédateur/local dans son nouveau milieu et s'y multiplie sans frein", "elle ne se nourrit pas"], "a": 2, "e": "Arrivée sans ses régulateurs naturels, elle outcompette les espèces locales (abeilles, insectes indigènes).", "d": "<b>Sans prédateurs, sans frein</b> : l'invité qui prend la maison.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : introduite (volontairement ou par accident : transport, commerce), l'espèce trouve nourriture et climat favorables MAIS ses parasites et prédateurs habituels sont restés au pays : croissance exponentielle : le frelon asiatique décime les ruches (une ruche peut tomber en quelques heures : « martinets » devant l'entrée), la jacinthe d'eau englobe les lacs, le ragondin creuse les berges : solutions : détection précoce, pièges ciblés, et surtout prévention (réglementation des importations). Piège : « invasive » ne veut pas dire « méchante » : c'est un problème d'ÉQUILIBRE, pas de morale.</div>"},
{"t": "Les écosystèmes et l'environnement (3e)", "q": "L'équilibre d'une population (ex. cerfs dans une forêt) dépend :", "c": ["de la volonté des individus", "des ressources, de la prédation, du climat et des maladies (limites du milieu)", "de rien : elle croît sans fin", "uniquement de la nourriture"], "a": 1, "e": "Naissances et mortalité s'équilibrent autour d'un plafond fixé par le milieu : la capacité d'accueil.", "d": "<b>Les limites du milieu</b> : le plafond naturel.<div class='ex-detail'><u>Exemple rédigé</u> : le modèle : sans frein, toute population croît exponentiellement (bactéries : 1 ⟶ 2 ⟶ 4...) : mais la forêt a une capacité d'accueil (nourriture, eau, territoires, refuges) : au-delà, la mortalité monte (famine, épidémies : promiscuité) et les naissances baissent : la population oscille autour du plafond : équilibre DYNAMIQUE. Piège : retirer un frein (chasser le loup : « pour protéger les cerfs ») ne fait pas de cadeaux aux cerfs : sans prédateur, ils affament leur propre population et rongent la forêt : la régulation EST une protection.</div>"},
{"t": "Les écosystèmes et l'environnement (3e)", "q": "Un corridor écologique sert à :", "c": ["empêcher les promenades", "remplacer un parc naturel", "relier des habitats fragmentés (routes, champs) pour permettre les déplacements et les échanges génétiques", "fabriquer de l'électricité"], "a": 2, "e": "Les routes coupent les populations en îlots : le corridor (haie, passerelle, bande boisée) reconnecte.", "d": "<b>Reconnecter les habitats</b> : les ponts du vivant.<div class='ex-detail'><u>Exemple rédigé</u> : le problème : une route découpe une forêt en deux : chaque moitié porte une population plus petite : consanguinité, extinction locale (une petite population s'éteint par hasard démographique) ; la solution : haies, passages à faune (écoducs sur les autoroutes : cerfs, blaireaux, insectes les utilisent), bandes enherbées : les échanges reprennent (migration, brassage génétique, recolonisation après accident). Piège : la protection ne se réduit pas à des « îlots » : la qualité de l'ensemble dépend des CONNEXIONS : un archipel de réserves se dégrade plus vite qu'un réseau.</div>"},
{"t": "La Terre : structure et tectonique des plaques (2de)", "q": "Les ondes sismiques S ne traversent pas :", "c": ["les solides", "la croûte", "le manteau", "les liquides (donc elles s'arrêtent au noyau externe)"], "a": 3, "e": "Ondes S = cisaillement : impossibles dans un liquide : leur absence au-delà de 103° prouve le noyau externe liquide.", "d": "<b>Les liquides</b> : le test S du noyau.<div class='ex-detail'><u>Exemple rédigé</u> : le sondage : ondes P (compression : traversent tout, en s'incurvant quand la vitesse change) : ondes S (cisaillement : solides uniquement) : à la station opposée au séisme, les S manquent ⟹ sur le trajet, un LIQUIDE : la zone d'ombre délimite une coquille liquide à ~2900 km : le noyau externe (métal fondu : fer-nickel) : son mouvement génère le champ magnétique (géodynamo). Piège : le manteau, lui, laisse passer les S : il est SOLIDE (même s'il s'écoule sur des millions d'années : ductile ≠ liquide).</div>"},
{"t": "La Terre : structure et tectonique des plaques (2de)", "q": "Le manteau terrestre est :", "c": ["liquide (un océan de magma)", "solide mais ductile (il s'écoule très lentement sur des durées géologiques)", "constitué de fer", "gazeux"], "a": 1, "e": "Les ondes S le traversent ⟹ solide ; mais sa viscosité très faible permet la convection lente.", "d": "<b>Solide et ductile</b> : l'écoulement du glacier.<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe apparent : le manteau laisse passer les ondes S : PREUVE qu'il est solide ; pourtant il convecte (les plaques bougent de qq cm/an) : la nuance est la DURÉE : soumis à des contraintes pendant des millions d'années, un solide s'écoule (un glacier avance, la rocaille du sel se déforme : même logique) : viscosité ~10²¹ fois celle de l'eau ! Piège : « la convection du magma » : phrase fausse dans 90 % des copies : les remontées partiellement fondues n'existent qu'à des points précis (dorsales, points chauds).</div>"},
{"t": "La Terre : structure et tectonique des plaques (2de)", "q": "Au niveau d'une dorsale océanique :", "c": ["de la croûte océanique neuve est créée : les roches sont jeunes et les âges symétriques de part et d'autre", "il n'y a pas de séismes", "la croûte est détruite", "les continents entrent en collision"], "a": 0, "e": "Divergence : le magma remplit l'écart : croûte jeune au centre, vieillissante en s'éloignant (tapis roulant).", "d": "<b>Création de croûte</b> : l'usine à basalte.<div class='ex-detail'><u>Exemple rédigé</u> : le profil : symétrie des âges (0 Ma au rift, croissant vers les marges) : c'est l'argument décisif de Vine et Matthews (1963) : les anomalies magnétiques alternées, MIRROIR de part et d'autre de l'axe, prouvent l'accrétion continue : l'océan grandit de ~2 cm/an en Atlantique (en 200 Ma : les 4000 km actuels). Piège : la dorsale n'est pas une montagne « posée » : c'est une CICATRICE d'écartement, thermiquement relevée.</div>"},
{"t": "La Terre : structure et tectonique des plaques (2de)", "q": "Une subduction correspond à :", "c": ["deux continents qui se chevauchent", "un coulissage latéral", "l'écartement de deux plaques", "une plaque océanique dense qui plonge sous une autre plaque (fosse + volcans explosifs)"], "a": 3, "e": "La lithosphère océanique, vieille et froide (donc dense), s'enfonce dans le manteau : fosse, séismes profonds, magmatisme andésitique.", "d": "<b>Océan qui plonge</b> : le tapis roulant inverse.<div class='ex-detail'><u>Exemple rédigé</u> : la logique de densité : la croûte océanique créée à la dorsale se refroidit et s'hydrate en vieillissant : plus dense que le manteau sous-jacent : elle plonge (des signatures sismiques descendent en plan incliné jusqu'à 700 km : plan de Wadati-Benioff) : l'eau libérée fait fondre le manteau : volcans explosifs (Andes, Ring of Fire, Pinatubo) : la boucle est bouclée : ce qui est créé aux dorsales meurt dans les subductions (équilibre du rayon terrestre).</div>"},
{"t": "La Terre : structure et tectonique des plaques (2de)", "q": "L'Himalaya résulte de :", "c": ["une subduction océanique", "l'érosion", "une collision entre deux plaques continentales (Inde + Asie)", "l'écartement de plaques"], "a": 2, "e": "Aucun des deux continents ne peut plonger (légères) : ils se chevauchent : la lithosphère s'épaissit : chaîne de montagnes.", "d": "<b>Collision continentale</b> : le pli géant.<div class='ex-detail'><u>Exemple rédigé</u> : le film : océan Téthys absorbé en ~40 Ma : vers -50 Ma, l'Inde percute l'Asie : les marges continentales se plissent et s'épaississent (croûte doublée : racine profonde : le tout s'élève : isostasie) : l'Everest monte encore (~1 cm/an) : PREUVES : fossiles marins au sommet (ces calcaires étaient au fond de la Téthys), GPS qui mesure l'écrasement. Piège : « subduction » : il n'y a plus d'océan à absorbER : ce sont deux blocs LÉGERS qui se bloquent.</div>"},
{"t": "La Terre : structure et tectonique des plaques (2de)", "q": "La vitesse typique de déplacement d'une plaque :", "c": ["nulle aujourd'hui", "quelques km par an", "quelques mm par siècle", "quelques centimètres par an (celle d'un ongle qui pousse)"], "a": 3, "e": "~2-10 cm/an : mesurables par GPS et par les îles volcaniques (Hawaii : 7 cm/an).", "d": "<b>Quelques cm/an</b> : l'ongle qui pousse.<div class='ex-detail'><u>Exemple rédigé</u> : la mesure : le GPS satellite donne aujourd'hui des vitesses directement (ex. : l'Atlantique s'ouvre de ~2 cm/an) : sur 200 Ma, 2 cm/an = 4000 km : tout un océan ! L'image du ongle aide : invisible au jour le jour, énorme sur des durées géologiques. Piège : « quelques km/an » : on le verrait (les cartes changeraient en une vie) : et l'échelle des temps géologiques fait le reste (les durées se comptent en millions d'années).</div>"},
{"t": "La Terre : structure et tectonique des plaques (2de)", "q": "Les plaques lithosphériques se déplacent grâce à :", "c": ["la Lune", "la rotation de la Terre uniquement", "le vent", "des mouvements de convection du manteau + la traction des slabs plongeants et la poussée aux dorsales"], "a": 3, "e": "Convection thermique (remontées chaudes/descentes froides) + traction de la lithosphère dense qui plonge : les moteurs combinés.", "d": "<b>Convection + traction</b> : les moteurs du tapis.<div class='ex-detail'><u>Exemple rédigé</u> : le débat : autrefois on imaginait la plaque « portée » par le manteau comme un radeau : aujourd'hui, la plaque EST un acteur : froide et dense, elle plonge et TIRE le reste (slab pull, moteur principal), tandis que la dorsale POUSSSE modérément (ridge push) : la convection du manteau organise l'ensemble (c'est le même système thermique : la Terre évacue sa chaleur interne). Piège : « la rotation de la Terre » : les forces liées à la rotation sont négligeables ici : c'est la CHALEUR interne qui anime la machine (désintégration radioactive + chaleur accretionnelle).</div>"},
{"t": "La Terre : structure et tectonique des plaques (2de)", "q": "Les séismes et volcans se répartissent :", "c": ["uniformément sur le globe", "seulement au centre des océans", "au hasard", "le long des frontières de plaques (ceintures : Pacifique, Méditerranée)"], "a": 3, "e": "Les cartes de sismicité dessinent les limites de plaques : c'est même la preuve historique de la tectonique.", "d": "<b>En ceintures aux frontières</b> : la carte qui parle.<div class='ex-detail'><u>Exemple rédigé</u> : la lecture : la ceinture de feu du Pacifique concentre ~75 % des volcans actifs (subductions tout autour) : la ceinture alpine-himalayenne (collision) : les dorsales sismiques mais peu explosives : au contraire, les plaques INTÉRIEURES sont calmes (rares points chauds : Hawaii, qui perçe la plaque en son milieu) : la distribution n'est PAS aléatoire : c'est l'argument de contours utilisé pour découper les plaques.</div>"},
{"t": "La Terre : structure et tectonique des plaques (2de)", "q": "La lithosphère comprend :", "c": ["la croûte + la partie supérieure rigide du manteau (~100 km)", "le noyau", "tout le manteau", "seulement la croûte"], "a": 0, "e": "Lithosphère = enveloppe rigide (croûte + manteau supérieur) : elle « flotte » sur l'asthénosphère ductile.", "d": "<b>Croûte + manteau supérieur</b> : la plaque au complet.<div class='ex-detail'><u>Exemple rédigé</u> : la correction du réflexe : « lithosphère = croûte » est l'erreur n°1 : la PLAQUE, ce qui bouge et plonge, est plus épaisse (rigide jusqu'à ~100 km : parfois 150 sous les continents anciens) ; en dessous, l'asthénosphère (manteau supérieur ductile, partiellement fondu à ~1 %) permet le glissement : c'est la frontière MÉCANIQUE (rigide/ductile), différente de la frontière CHIMIQUE croûte/manteau (Moho) : deux découpages qui ne coïncident PAS.</div>"},
{"t": "La Terre : structure et tectonique des plaques (2de)", "q": "Le champ magnétique terrestre est généré par :", "c": ["les courants du noyau externe liquide (géodynamo)", "la croûte", "l'atmosphère", "le Soleil"], "a": 0, "e": "Le fer liquide en mouvement (convection + rotation) crée le champ : il protège des vents solaires.", "d": "<b>Le noyau externe</b> : le moteur magnétique.<div class='ex-detail'><u>Exemple rédigé</u> : le dispositif : noyau externe : fer-nickel LIQUIDE (température ~4000-5000 °C) : convecté (chaleur du noyau interne) et entraîné par la rotation terrestre : un dynamo auto-entretenue (effet dynamo : le mouvement d'un fluide conducteur crée un champ magnétique) : le champ dévie les particules solaires (aurores aux pôles : la preuve visible) : sans lui, l'atmosphère serait érodée (Marte en a fait les frais). Bonus : les inversions du champ magnétisé dans les basaltes = la preuve de l'expansion océanique.</div>"},
{"t": "L'ADN, les protéines et la cellule (2de)", "q": "Dans l'ADN, A s'apparie avec :", "c": ["G", "C", "U", "T"], "a": 3, "e": "A-T et G-C : la complémentarité des deux brins (U remplace T dans l'ARN, pas dans l'ADN).", "d": "<b>T</b> : la règle d'appariement.<div class='ex-detail'><u>Exemple rédigé</u> : la conséquence : brin 1 A T G C ⟹ brin 2 T A C G : cette règle suffit pour COPIER (réplication : chaque brin matrice), RÉPARER (le brin intact guide la correction) et LIRE (transcription) : 4 lettres, 2 paires, 3 milliards de caractères : tout le vivant écrit avec cet alphabet. Piège : U (uracile) n'existe que dans l'ARN : dans l'ADN, c'est T (thymine) : un QCM adore ce piège.</div>"},
{"t": "L'ADN, les protéines et la cellule (2de)", "q": "La transcription produit :", "c": ["un ribosome", "une protéine directement", "un ARN messager copié depuis l'ADN (dans le noyau)", "un second ADN"], "a": 2, "e": "ADN ⟶ ARNm (transcription, noyau) : la traduction ARNm ⟶ protéine vient ensuite, sur les ribosomes.", "d": "<b>ARNm</b> : la copie de travail.<div class='ex-detail'><u>Exemple rédigé</u> : l'ordre du flux : le plan (ADN) reste AU noyau (protégé, une seule version) : pour fabriquer, on sort une COPIE temporaire (ARNm : T remplacé par U) : le ribosome lit cette copie par triplets et assemble la protéine : analogie : le plan au bureau d'études, la photocopie à l'atelier. Piège : inverser transcription/traduction est l'erreur la plus fréquente du contrôle : transcription = ÉCRIRE la copie, traduction = TRADUIRE en protéine.</div>"},
{"t": "L'ADN, les protéines et la cellule (2de)", "q": "Un codon est composé de :", "c": ["3 nucléotides (il désigne un acide aminé)", "46 nucléotides", "20 nucléotides", "1 nucléotide"], "a": 0, "e": "Le code génétique est lu par TRIPLETS : 4³ = 64 codons pour 20 acides aminés (+ codons stop).", "d": "<b>3 nucléotides</b> : l'unité de lecture.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul : avec 1 lettre : 4 combinaisons (insuffisant pour 20 acides aminés) ; avec 2 : 16 (encore insuffisant) ; avec 3 : 64 (largement suffisant : le code est REDONDANT : plusieurs codons désignent le même acide aminé : ex. GCU, GCC, GCA, GCG = alanine) : cette redondance explique pourquoi certaines mutations sont silencieuses. Piège : une insertion décale TOUS les codons suivants (le cadre de lecture 3 par 3 est cassé) : d'où leur gravité.</div>"},
{"t": "L'ADN, les protéines et la cellule (2de)", "q": "La traduction de l'ARNm a lieu :", "c": ["dans la mitochondrie uniquement", "sur les ribosomes du cytoplasme", "dans le noyau", "dans la membrane"], "a": 1, "e": "Le ribosome lit les codons et assemble les acides aminés en protéine.", "d": "<b>Sur les ribosomes</b> : l'atelier d'assemblage.<div class='ex-detail'><u>Exemple rédigé</u> : la chorégraphie : l'ARNm sort du noyau par les pores : le ribosome s'y fixe (sur le codon AUG : départ) : les ARNt apportent les acides aminés correspondant à chaque codon (clé-serrure) : la chaîne s'allonge acide aminé par acide aminé : au codon STOP, la protéine est libérée et se REPLIE (sa forme 3D = sa fonction) : un ribosome lit ~10-15 codons par seconde, et plusieurs ribosomes peuvent lire le MÊME ARNm en file.</div>"},
{"t": "L'ADN, les protéines et la cellule (2de)", "q": "Une bactérie est une cellule :", "c": ["sans ADN", "eucaryote", "procaryote (pas de noyau : ADN libre dans le cytoplasme)", "végétale"], "a": 2, "e": "Procaryote : pas d'enveloppe nucléaire ni d'organites membraneurs : l'ADN circulaire baigne dans le cytoplasme.", "d": "<b>Procaryote</b> : le plan minimal.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison : PROCARYOTE (bactéries : ~1-5 µm) : ADN circulaire directement dans le cytoplasme, pas de mitochondries (les enzymes de la membrane font le travail énergétique) ; EUCARYOTE (10-100 µm) : noyau + organites spécialisés (mitochondries, réticulum, Golgi : la division du travail) : la cellule humaine est ~1000 fois plus volumineuse qu'une bactérie. Piège : « sans ADN » : TOUTE cellule vivante a de l'ADN (les globules rouges matures font exception : ils ont perdu leur noyau... et ne se divisent plus).</div>"},
{"t": "L'ADN, les protéines et la cellule (2de)", "q": "Les mitochondries :", "c": ["stockent l'ADN", "fabriquent les protéines", "digèrent les déchets", "produisent l'ATP (l'énergie utilisable par la cellule) à partir du glucose"], "a": 3, "e": "Centrale énergétique : respiration cellulaire (glucose + O₂ ⟶ CO₂ + ATP) : le moteur de toutes les activités cellulaires.", "d": "<b>Productrices d'ATP</b> : la centrale électrique.<div class='ex-detail'><u>Exemple rédigé</u> : le bilan : une molécule de glucose + 6 O₂ ⟶ 6 CO₂ + 6 H₂O + ~30-32 ATP : l'ATP est la « monnaie énergétique » (toutes les cellules le dépensent : contraction musculaire, fabrication de protéines, pompes) : une cellule musculuse contient jusqu'à des milliers de mitochondries (entraînement ⟹ plus de mitochondries !) : détail évolutif : elles ont leur PROPRE ADN (hérité de la mère : la bactérie engloutie il y a ~2 milliards d'années est devenue notre locataire).</div>"},
{"t": "L'ADN, les protéines et la cellule (2de)", "q": "La réplication de l'ADN a lieu :", "c": ["seulement dans les gamètes", "avant la division cellulaire (chaque brin sert de matrice)", "après la division", "une fois par vie"], "a": 1, "e": "Chaque cellule-fille doit recevoir une copie complète : les deux brins se séparent et se copient chacun.", "d": "<b>Avant la division</b> : la photocopie du patrimoine.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : les deux brins se séparent (enzymes « fermeture éclair ») : sur chacun, les nucléotides libres s'apparient (A-T, G-C) : DEUX molécules identiques, chacune avec un brin ancien + un neuf (réplication semi-conservative : Meselson et Stahl, 1958) : taux d'erreur ~1/milliard (enzyme correctrice) : les rares fautes = mutations. Piège : « seulement dans les gamètes » : NON : chaque division de CHAQUE cellule commence par une réplication.</div>"},
{"t": "L'ADN, les protéines et la cellule (2de)", "q": "Une mutation par délétion (perte d'un nucléotide) est souvent plus grave qu'une substitution car :", "c": ["elle décale le cadre de lecture : toute la suite de la protéine change", "elle touche toujours le premier codon", "elle est plus fréquente", "elle détruit la cellule"], "a": 0, "e": "La lecture par triplets est décalée : tous les codons suivants codent d'autres acides aminés.", "d": "<b>Décalage du cadre</b> : la phrase illisible.<div class='ex-detail'><u>Exemple rédigé</u> : l'analogie : « LE CHAT EST GROS » (lecture par 3 lettres) : substituer : « LE CHAT EST GRIS » (proche : souvent supportable) ; supprimer une lettre : « LEC HAT ESTG ROS » (tout est décalé : plus rien ne se lit) : dans la protéine, les acides aminés après la délétion sont FAUX : protéine tronquée/non fonctionnelle : la drépanocytose (substitution) reste « lisible », la mucoviscidose (délétion ΔF508 : 3 lettres) casse la protéine CFTR. Piège : la gravité dépend surtout de l'EFFET sur la protéine, pas de la taille de la mutation.</div>"},
{"t": "L'ADN, les protéines et la cellule (2de)", "q": "Une protéine est :", "c": ["un nucléotide", "un ribosome", "une molécule d'ADN repliée", "une chaîne d'acides aminés repliée en forme 3D fonctionnelle"], "a": 3, "e": "20 acides aminés assemblés selon le gène : le repliement donne la forme, la forme donne la fonction.", "d": "<b>Chaîne d'acides aminés repliée</b> : la main-d'œuvre du vivant.<div class='ex-detail'><u>Exemple rédigé</u> : la logique forme-fonction : la séquence d'acides aminés détermine les liaisons : la chaîne se replie en forme précise (hélice, feuillet, boucle) : la forme crée le site actif (enzyme : complémentaire du substrat : clé-serrure) : dépliage (chaleur, pH : un œuf cuit !) = perte de fonction : c'est pour ça qu'une mutation qui change UN acide aminé clef (drépanocytose : Glu⟶Val en position 6) suffit à déformer toute l'hémoglobine.</div>"},
{"t": "L'ADN, les protéines et la cellule (2de)", "q": "Dans l'ARN, la base qui remplace la thymine (T) :", "c": ["A", "U (uracile)", "G", "C"], "a": 1, "e": "ARN : A-U et G-C : l'uracile remplace la thymine (structure plus « économique » pour une copie temporaire).", "d": "<b>U : uracile</b> : la T de l'ARN.<div class='ex-detail'><u>Exemple rédigé</u> : le réflexe de traduction : ADN : A-T, G-C : ARN : A-U, G-C (lors de la transcription, face à un A du brin matrice, l'ARN met un U) : exemple : brin ADN A T G C C A ⟹ ARNm U A C G G U. Piège en deux temps : ① ne pas mettre U dans l'ADN (il n'y figure jamais) ; ② lors d'une transcription, apparier A(matrice) ⟶ U(ARN) : la confusion T/U est LE point que le QCM teste chaque année.</div>"},
{"t": "La biodiversité et son évolution (2de)", "q": "Le critère principal pour définir une espèce :", "c": ["les individus se reproduisent entre eux et donnent une descendance fertile", "le même habitat", "la ressemblance physique seulement", "la même taille"], "a": 0, "e": "Le critère d'interfécondité fertile : lion + tigre = ligre stérile ⟹ deux espèces.", "d": "<b>Reproduction fertile</b> : le test décisif.<div class='ex-detail'><u>Exemple rédigé</u> : la logique : une espèce est un GROUPE GÉNÉTIQUE fermé : ses membres échangent leurs gènes entre eux, pas avec les autres : deux populations qui ne se croisent plus (ou dont les petits sont stériles : mule, ligre) = deux espèces. Piège : la ressemblance seule trompe (deux scarabées identiques : espèces différentes : jumelles cryptiques) et des formes très différentes (chiens !) restent UNE espèce : c'est le flux de gènes qui compte, pas la photo.</div>"},
{"t": "La biodiversité et son évolution (2de)", "q": "La spéciation allopathique commence par :", "c": ["une mutation", "l'isolement géographique d'une population (barrière)", "une extinction", "un changement de comportement volontaire"], "a": 1, "e": "Une barrière sépare la population en deux : sans échanges de gènes, les différences s'accumulent de part et d'autre.", "d": "<b>L'isolement géographique</b> : la coupure fondatrice.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario canonique : ① une population (ex. de lézards) est coupée en deux par une montagne ou un bras de mer : ② chaque moitié accumule ses mutations subit SA sélection locale (climats, proies différents) : ③ des générations plus tard, réunies, les deux ne se reconnaissent plus (ou donnent des descendants stériles) : ISOLEMENT REPRODUCTIF = spéciation achevée. Piège : la spéciation n'est pas un « choix » : c'est la CONSÉQUENCE MÉCANIQUE de l'interruption du flux de gènes + du temps (des dizaines/milliers de générations).</div>"},
{"t": "La biodiversité et son évolution (2de)", "q": "Le nombre d'espèces décrites par la science est d'environ :", "c": ["500 millions", "5000", "1,8 million (sur 8-10 millions estimées)", "100 000"], "a": 2, "e": "~1,8 million décrites : la majorité (insectes, surtout tropicaux, océans profonds) reste inconnue.", "d": "<b>~1,8 million</b> : le catalogue en cours.<div class='ex-detail'><u>Exemple rédigé</u> : les ordres de grandeur : ~5500 mammifères, ~10 000 oiseaux (bien connus) : MAIS les insectes (~1 million d'espèces décrites, peut-être 5-10 millions au total) et la vie microbienne échappent encore : on décrit ~15 000 nouvelles espèces PAR AN (dont des grenouilles, baleines !) : l'exploration n'est pas finie : aggravant tragique : des espèces s'éteignent avant même d'être décrites.</div>"},
{"t": "La biodiversité et son évolution (2de)", "q": "Le taux d'extinction actuel, comparé au taux naturel :", "c": ["identique", "impossible à mesurer", "10 fois plus faible", "100 à 1000 fois plus élevé"], "a": 3, "e": "Habitats détruits, invasives, climat : l'érosion actuelle rivalise avec les grandes crises du passé (6e extinction).", "d": "<b>×100-1000</b> : l'anomalie humaine.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison : le « bruit de fond » naturel : ~1 espèce de mammifère/million d'années : aujourd'hui : disparitions documentées en décennies (dodo 1681, pigeon migrateur 1914 : 5 milliards d'individux à 0 en 50 ans !) : les taux mesurés sur amphibiens, mollusques d'eau douce, récifs dépassent 100-1000× le fond : le squelette de l'argument : nous assistons à la SIXIÈME crise de masse, la première imputable à une seule espèce : la nôtre.</div>"},
{"t": "La biodiversité et son évolution (2de)", "q": "La première cause actuelle d'érosion de la biodiversité :", "c": ["la chasse uniquement", "les OGM", "la destruction des habitats (déforestation, artificialisation)", "la pollution"], "a": 2, "e": "Fragmentation et destruction des milieux : sans habitat, pas d'espèces (IPBES : premier facteur, devant les espèces invasives et le climat).", "d": "<b>Destruction des habitats</b> : la cause n°1.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : une forêt coupée en îlots perd ses grands animaux (territoires trop petits), ses pollinisateurs (pas de corridors), ses populations se consanguinisent : la spirale : réduction d'habitat ⟹ petites populations ⟹ extinction locale : les autres causes s'AJOUTENT (invasives : 2e : climat : qui déplace les aires plus vite que certaines espèces ne migèrent). Piège : le climat occupe les médias mais reste, pour l'instant, derrière l'artificialisation des sols dans les rapports de l'IPBES : deux urgences cumulatives.</div>"},
{"t": "La biodiversité et son évolution (2de)", "q": "Les 13 espèces de pinsons des Galápagos illustrent :", "c": ["une spéciation par isolements successifs à partir d'un ancêtre commun", "l'absence d'évolution", "l'introduction par l'Homme", "la création indépendante de chaque espèce"], "a": 0, "e": "Un ancêtre continental : populations isolées île par île : divergences (becs) : isolement reproductif : radiation adaptative.", "d": "<b>Une radiation adaptative</b> : le modèle du chapitre.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario : une souche unique déportée par une tempête : chaque île = un laboratoire séparé (nourritures différentes : tri des becs) : l'ADN confirme la parenté (plus proches entre elles qu'avec les pinsons continentaux) : RESULTAT : 13 espèces qui « occupent » les métiers disponibles sur l'archipel (grandes graines, insectes, cactus, même les parasites !) : c'est la leçon : la diversité naît d'ISOLEMENT + DIVERGENCE, jamais d'une création parallèle : question type : « montrez que ces espèces partagent un ancêtre commun » (arguments : ADN + homologies des becs).</div>"},
{"t": "La biodiversité et son évolution (2de)", "q": "L'évolution biologique est :", "c": ["une hypothèse non testée", "un phénomène rare", "un processus toujours actuel (résistances aux antibiotiques, adaptations en cours)", "terminée depuis l'apparition de l'Homme"], "a": 2, "e": "Les bactéries résistantes, les pesticides contournés : l'évolution s'observe en temps réel, à échelle humaine.", "d": "<b>Toujours en marche</b> : le processus vivant.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience du présent : SARM (staphylocoque résistant), tuberculose multirésistante : en quelques décennies d'antibiotiques, la sélection a favorisé les variants porteurs de résistance (l'antibiotique = le « prédateur » moderne) : les papillons anglais (mélanisme industriel), les criquets face aux insecticides : l'évolution à échelle humaine est OBSERVABLE ET MESURABLE. Piège : « terminée » : aucune espèce n'est « finie » : nous évoluons aussi (gènes de lactase, adaptation d'altitude au Tibet).</div>"},
