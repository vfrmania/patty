{"t": "Les écosystèmes et l'espèce humaine (Terminale)", "q": "L'effondrement des insectes inquiète l'humanité car :", "c": ["ils sont envahissants", "ils sont jolis", "ils pollinisent nos cultures et nourrissent les chaînes alimentaires (services massifs)", "ils font du bruit"], "a": 2, "e": "~75 % des cultures et l'essentiel des oiseaux champêtres en dépendent : leur déclin (biomasse -50 à -80 % mesurée) remonte toutes les chaînes.", "d": "<b>La base de tout</b> : le maillon qui tient le reste.<div class='ex-detail'><u>Exemple rédigé</u> : les chiffres : étude de Krefeld (63 réserves, 27 ans) : -75 % de biomasse d'insectes volants ; France : -50 % d'oiseaux des campagnes en 30 ans (les oisillons manquent de chenilles) : les causes : pesticides (néonics), herbicides (plus de plantes hôtes), urbanisation, lumières : le point clé : c'est RÉPARABLE (les insectes se multiplient vite : interdiction des néonics ⟹ rebonds) : protéger les insectes = protéger l'agriculture elle-même (pollinisation : 150-500 Mds $/an).</div>"},
{"t": "Les écosystèmes et l'espèce humaine (Terminale)", "q": "Une « cascade trophique » (ex. retour du loup) :", "c": ["une éruption", "une chute d'eau", "la réorganisation en cascade d'un écosystème quand un niveau de la chaîne est rétabli (prédateur ⟹ proies ⟹ végétation)", "une élection"], "a": 2, "e": "Le prédateur limite les herbivores : la végétation revient : les riverains, oiseaux et sols suivent : Yellowstone l'a documenté de A à Z.", "d": "<b>Le dominos écologique</b> : la preuve que tout tient.<div class='ex-detail'><u>Exemple rédigé</u> : le cas d'école (Yellowstone, 1995 : réintroduction du loup) : loups ⟹ cerfs évitent les vallées : les saules et peupliers repoussent ⟹ castors reviennent (barrages : zones humides) ⟹ oiseaux, amphibiens, poissons ⟹ même les cours d'eau changent de forme (berges fixées) : un prédateur « redessine » le paysage : c'est l'argument le plus fort pour la réensauvagement (le loup en France : la même cascade discutée, avec gestion des conflits d'élevage : chiens de protection, bergers, tirs encadrés).</div>"},
{"t": "Les écosystèmes et l'espèce humaine (Terminale)", "q": "L'objectif « 30×30 » (COP biodiversité Montréal 2022) :", "c": ["30 milliards d'arbres en 30 ans", "protéger 30 % des terres et des océans d'ici 2030", "réduire de 30 % la population", "30 ans de pétrole"], "a": 1, "e": "Aires protégées et corridors : la protection doit être CONNECTÉE et bien gérée (30 % en papier ne valent rien).", "d": "<b>30 % protégés en 2030</b> : le contrat mondial.<div class='ex-detail'><u>Exemple rédigé</u> : le contexte : à Montréal (décembre 2022), 196 pays : accord cadre : 30 % des terres/mers en protection (contre ~17 % aujourd'hui, souvent mal gérés : « paper parks »), restauration, réduction des subventions néfastes, financement des pays du Sud : les conditions de réussite : la QUALITÉ (connectivité, moyens, contrôle) prime sur le pourcentage : un parc dégradé ne protège rien : le suivi (Indigenous-led areas, OECM) est l'enjeu de la décennie.</div>"},
{"t": "Les écosystèmes et l'espèce humaine (Terminale)", "q": "Les corridors écologiques sont vitaux car :", "c": ["ils remplacent les routes", "ils sont décoratifs", "la fragmentation isole des populations (consanguinité, extinction locale) : les corridors rétablissent les flux de gènes et les migrations", "ils produisent de l'électricité"], "a": 2, "e": "Routes et champs coupent les habitats en îlots : la reconnexion (haies, écoducs, bandes) restaure la viabilité des populations.", "d": "<b>La trame qui recoud</b> : la génétique des paysages.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : une population isolée dans un îlot perd sa diversité génétique (dérive, consanguinité : spirale d'extinction : le lynx ibérique en est l'exemple sombre) : un corridor (haie, bande enherbée, écoduc) permet une immigration de quelques individus qui « réoxygène » génétiquement l'îlot (un seul immigrant par génération suffit !) : application : la trame verte et bleue française, les écoducs autoroutiers (fréquentation documentée par caméras) : restaurer la CONNECTIVITÉ coûte moins cher que recréer des habitats.</div>"},
{"t": "Les écosystèmes et l'espèce humaine (Terminale)", "q": "La pollinisation par les insectes est un service écosystémique estimé à :", "c": ["1 milliard $", "150-500 milliards $ par an (et irremplaçable à cette échelle)", "0 (gratuit pour toujours)", "1 million $"], "a": 1, "e": "~75 % des cultures en dépendent : le jour où il faudrait polliniser à la main (zones du Sichuan, pommiers), le coût explose.", "d": "<b>150-500 milliards $/an</b> : l'infrastructure invisible chiffrée.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul et le preuve par l'inverse : la valeur = ce que coûterait la pollinisation manuelle (dans le Sichuan, où les abeilles ont disparu de certaines vallées, des ouvriers pollinisent les poiriers AU PINCEAU : rendements réduits, coût du travail énorme : si tout devait être fait à la main, plusieurs fruits deviendraient des produits de luxe) : le service est GRATUIT tant que les écosystèmes fonctionnent : c'est la définition d'un CAPITAL naturel (on consomme les intérêts : dépasser, c'est entamer le capital).</div>"},
{"t": "Les écosystèmes et l'espèce humaine (Terminale)", "q": "L'agroécologie vise à :", "c": ["agrandir les champs", "utiliser plus de pesticides", "concilier production agricole et biodiversité (haies, rotations, moins d'intrants, sols vivants)", "supprimer l'agriculture"], "a": 2, "e": "Les haies abritent les auxiliaires (chauves-souris, coccinelles : insecticide biologique), les rotations cassent les cycles des ravageurs : produire EN s'appuyant sur l'écosystème.", "d": "<b>Produire AVEC l'écosystème</b> : l'ingénierie du vivant.<div class='ex-detail'><u>Exemple rédigé</u> : les leviers : haies (auxiliaires : oiseaux, chrysopes : la haie = râtelier à ennemis des pucerons), rotations longues (casser les cycles des ravageurs : la monoculture les nourrit en continu), cultures intermédiaires (sols couverts : carbone, azote : moins de lessivage), réduction des intrants (traiter seulement si nécessaire : monitoring) : les résultats : rendements comparables ou meilleurs dans les systèmes matures, moins de dépendance (engrais, phyto) : l'agronomie moderne s'inspire de l'écologie au lieu de la combattre.</div>"},
{"t": "Le corps humain et l'homéostasie (Terminale)", "q": "Le principe général d'une régulation homéostatique :", "c": ["le hasard", "capteurs ⟶ centre de comparaison ⟶ effecteurs ⟶ rétroaction négative (la correction coupe la commande)", "une réponse unique et définitive", "l'inhibition permanente"], "a": 1, "e": "Un thermostat biologique : l'écart à la consigne déclenche une réponse qui s'annule au retour à la consigne.", "d": "<b>La boucle à rétroaction négative</b> : le thermostat vivant.<div class='ex-detail'><u>Exemple rédigé</u> : l'analogie précise : un chauffage thermostaté : thermomètre (capteur) ⟷ boîtier (comparateur : consigne 37 °C) ⟷ radiateur (effecteur) : quand la température ATTEINT la consigne, le radiateur s'éteint (rétroaction négative) : le corps fait exactement ça pour TOUT : glycémie, pH, pression, hydration : l'alternative (rétroaction positive : la réponse s'EMBALLE) existe rarement (accouchement, immunité : amplification voulue) : c'est l'exception qui confirme la règle de la stabilité.</div>"},
{"t": "Le corps humain et l'homéostasie (Terminale)", "q": "L'insuline :", "c": ["fait monter la glycémie", "vient du foie", "est un sucre", "fait DESCENDRE la glycémie (favorise l'entrée du glucose dans les cellules et son stockage)"], "a": 3, "e": "Sécrétée par les cellules ß du pancréas quand la glycémie monte (repas) : stockage (glycogène, graisses) : retour à ~1 g/L.", "d": "<b>↓ glycémie</b> : l'hormone du stockage.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : repas sucré ⟹ glycémie ↑ ⟹ ß du pancréas (capteur ET effecteur hormonal : elles mesurent le glucose) sécrètent l'insuline ⟹ les cellules (muscle, tissu gras) ouvrent leurs transporteurs GLUT4 ⟹ glucose entre, est brûlé ou stocké (glycogène hépatique/musculaire, triglycérides) ⟹ glycémie ↓ ⟹ la sécrétion d'insuline baisse (la boucle se referme). Piège : l'insuline ne « supprime » pas le glucose : elle le DÉPLACE (du sang vers les cellules) : sans elle, le glucose reste dehors alors que les cellules meurent de faim (le paradoxe du diabète).</div>"},
{"t": "Le corps humain et l'homéostasie (Terminale)", "q": "Le glucagon agit :", "c": ["pendant un repas", "pendant le jeûne : il fait MONTER la glycémie (libération du glucose stocké dans le foie)", "sur la vue", "comme l'insuline"], "a": 1, "e": "Cellules α du pancréas : glycémie ↓ ⟹ glucagon ⟹ glycogénolyse hépatique (et néoglucogenèse) : le carburant du cerveau est garanti.", "d": "<b>↑ glycémie à jeun</b> : l'hormone du déstockage.<div class='ex-detail'><u>Exemple rédigé</u> : la logique du couple : insuline (postprandiale : stocker l'abondance) et glucagon (jeûne : libérer les réserves) = DEUX ANTAGONISTES qui maintiennent ~1 g/L en permanence : la nuit, le foie relâche son glycogène (le cerveau consomme ~120 g de glucose/jour : il ne stocke RIEN : la garantie glycémique est vitale) : si le jeûne se prolonge : néoglucogenèse (fabrication de glucose à partir d'acides aminés, glycérol) + corps cétoniques (alternative du cerveau : le jeûne prolongé est une ingénierie métabolique).</div>"},
{"t": "Le corps humain et l'homéostasie (Terminale)", "q": "Dans le diabète de type 2 :", "c": ["l'insuline est produite mais les cellules deviennent RÉSISTANTES (récepteurs moins efficaces)", "les cellules ß sont détruites", "l'insuline est absente dès la naissance", "le glucagon est absent"], "a": 0, "e": "Terrain (obésité, sédentarité, âge, gènes) : le récepteur répond mal : le pancréas surproduit puis s'épuise : traitement d'abord par mode de vie.", "d": "<b>Résistance à l'insuline</b> : la porte fermée.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison : TYPE 1 : la clé (insuline) est ABSENTE (ß détruites par auto-immunité) : TYPE 2 : la clé existe mais la SERRURE résiste (récepteurs down-régulés par l'excès chronique de gras et de sucre : le gras ectopique encombre la signalisation) : le pancréas compense en surproduisant (hyperinsulinémie) puis s'épuise : le traitement hiérarchique : activité physique (les muscles deviennent plus sensibles À L'INSULINE pendant l'effort par une voie indépendante : c'est un « médicament »), metformine, puis analogues/injections : d'où l'importance du dépistage (silencieux pendant des années).</div>"},
{"t": "Le corps humain et l'homéostasie (Terminale)", "q": "La glycosurie (glucose dans les urines) d'un diabétique s'explique par :", "c": ["le glucose est attiré par la vessie", "la glycémie dépasse le seuil de réabsorption rénale (~1,8 g/L) : le glucose déborde dans les urines", "un manque d'eau", "les reins fabriquent du sucre"], "a": 1, "e": "Le rein réabsorbe tout le glucose en dessous d'un seuil : au-delà (hyperglycémie majeure), le filtre déborde : sucre dans les urines (et urines abondantes : l'eau suit le sucre : osmose).", "d": "<b>Le filtre qui déborde</b> : le seuil rénal.<div class='ex-detail'><u>Exemple rédigé</u> : la cascade clinique : hyperglycémie majeure ⟹ glucose > seuil de réabsorption (SGLT2 des tubules : ~1,8 g/L) ⟹ glycosurie ⟹ le sucre retient l'eau (diurèse osmotique : urines abondantes) ⟹ soif intense (polydipsie) : les « 3 P » du diagnostic : Polyurie, Polydipsie, Perte de poids (les cellules privées de glucose brûlent les graisses) : ce sont les symptômes qui firent diagnostiquer les diabètes avant les dosages (les « mouches sucrières » des urines de malades : l'étymologie populaire du mot diabète : « siphon »).</div>"},
{"t": "Le corps humain et l'homéostasie (Terminale)", "q": "La température corporelle est régulée par :", "c": ["la peau seule", "l'hypothalamus (centre de comparaison : il commande frissons, vasoconstriction, sueur)", "le cœur", "les poumons seuls"], "a": 1, "e": "Thermorécepteurs ⟶ hypothalamus (consigne ~37 °C) ⟶ effecteurs : muscles (frissons), vaisseaux, glandes sudorales.", "d": "<b>L'hypothalamus</b> : le thermostat central.<div class='ex-detail'><u>Exemple rédigé</u> : le détail utile : le froid : ① vasoconstriction (le sang quitte la peau : l'isolement), ② frissons (tremblements = muscles qui brûlent de l'ATP : chauffage interne), ③ chair de poule (les poils dressés : chez les animaux, ils ÉPAISSISSENT la couche d'air isolant : chez nous : vestige) ; le chaud : ① vasodilatation (échangeur), ② sueur (580 kcal évaporées par litre : LA climatisation du corps) : la fièvre = la CONSIGNE elle-même est rehaussée (prostaglandines ⟹ hypothalamus : défense contre les microbes) : d'où l'intérêt clinique de ne pas la « casser » systématiquement.</div>"},
{"t": "Le corps humain et l'homéostasie (Terminale)", "q": "L'ADH (hormone antidiurétique) :", "c": ["est un pesticide", "fait uriner davantage", "vient des reins", "favorise la RÉTENTION d'eau par les reins (urines concentrées) quand le corps est déshydraté"], "a": 3, "e": "Déshydratation ⟹ osmoticité ↑ ⟹ hypothalamus : soif + ADH ⟹ canaux d'aquaporine ouverts : l'eau est récupérée.", "d": "<b>La récupération d'eau</b> : l'aquaporine ouverte.<div class='ex-detail'><u>Exemple rédigé</u> : la boucle : un effort sans boire : le sang se concentre (osmoticité ↑) : osmorécepteurs hypothalamiques ⟹ ① SOIF (comportement : le meilleur remède) ② ADH (hypophyse) ⟹ reins : les canaux insèrent des aquaporines dans le tubule collecteur ⟹ l'eau est réabsorbée : urines foncées, peu abondantes (le matin : la nuit, l'ADH est haute : c'est pour ça qu'on ne se réveille pas asphyxié de soif) : anecdote utile : l'alcool INHIBE l'ADH : urines claires abondantes au bar = déshydratation du lendemain (un des vrais mécanismes de la « gueule de bois »).</div>"},
{"t": "Le corps humain et l'homéostasie (Terminale)", "q": "Le pH du sang est maintenu autour de :", "c": ["peu importe", "6,2", "9,0", "7,4 (fourchette vitale ~7,0-7,8 : tampons, respiration, reins)"], "a": 3, "e": "Trois systèmes : tampon bicarbonate (immédiat), respiration (CO₂ expiré : minutes), reins (excrétion d'acides : heures/jours) : les enzymes exigent cette précision.", "d": "<b>~7,4</b> : la constante la plus surveillée.<div class='ex-detail'><u>Exemple rédigé</u> : le tri des vitesses : ① CHIMIQUE (secondes : le couple H₂CO₃/HCO₃⁻ amortit les variations : c'est pour ça que le sang est « tamponné ») ; ② RESPIRATOIRE (minutes : hyperventiler chasse le CO₂ (acide volatile) : le pH monte : l'essoufflement de l'effort élimine l'acide lactique via le CO₂) ; ③ RÉNAL (heures : les reins excrètent les acides fixes et régénèrent les bicarbonates : la compensation fine et durable) : pourquoi cette obsession : les protéines et enzymes changent de forme avec le pH (en dehors de 7,0-7,8 : mortelle : l'acidose du choc, l'alcalose de l'hyperventilation panique).</div>"},
{"t": "Le corps humain et l'homéostasie (Terminale)", "q": "La fréquence cardiaque augmente à l'effort grâce à :", "c": ["la température seulement", "le système nerveux sympathique (adrénaline) qui adapte la consigne selon les besoins (O₂ des muscles)", "un choix conscient", "la chance"], "a": 1, "e": "Baroréflexe + chémoréflexe + commandes sympathiques : le cœur suit la demande (et le parasympathique le freine au repos).", "d": "<b>Le pilotage automatique</b> : la boucle cardiovasculaire.<div class='ex-detail'><u>Exemple rédigé</u> : la boucle : l'effort ⟹ muscles réclament O₂/glucose ⟹ capteurs (pression, CO₂, pH) ⟹ centres (medulla : bulbe) ⟹ deux voies antagonistes : SYMPATHIQUE (adrénaline : cœur accéléré et plus contracté, vaisseaux serrés hors muscle : le sang est REDIRIGÉ vers les zones utiles) et PARASYMPATHIQUE (vague : frein permanent au repos : couper ce frein suffit à accélérer !) : c'est le couple accélérateur/frein qui régule la pression ET le débit : au repos, c'est le FREIN qui domine (cœur de marathonien au repos : ~40/min : un vague très tonique).</div>"},
{"t": "Le corps humain et l'homéostasie (Terminale)", "q": "Une rétroaction POSITIVE, contrairement à la négative :", "c": ["amplifie le phénomène jusqu'à son terme (ex. accouchement : oxytocine : contractions ⟹ plus d'oxytocine)", "corrige l'écart", "arrête toujours la réponse", "n'existe pas en biologie"], "a": 0, "e": "Rare et volontaire : déclenchement de l'accouchement, réponse inflammatoire, potentiel d'action : des systèmes qui doivent EMBALLER pour réussir, puis se couper.", "d": "<b>Elle amplifie jusqu'au terme</b> : l'emballement utile.<div class='ex-detail'><u>Exemple rédigé</u> : les cas légitimes : ACCOUCHEMENT : contractions ⟹ col de l'utérus étiré ⟹ oxytocine ⟹ contractions plus fortes ⟹ ... jusqu'à l'expulsion (puis la boucle se coupe : le but est atteint) ; POTENTIEL D'ACTION : dépolarisation ⟹ canaux Na⁺ ouverts ⟹ plus de dépolarisation (une fois lancée, l'onde va au bout : tout-ou-rien) ; IMMUNITÉ : activation lymphocytaire amplifiée ; la DIFFÉRENCE structurelle : la négative STABILISE (homéostasie : écart ⟹ correction) : la positive EMmène à un NOUVEL état (l'accouchement n'« annule » rien : il accomplie) : Piège : une rétroaction positive pathologique (cancérogénèse, choc septique non contrôlé) est un EMBALLEMENT raté : la frontière entre amplification utile et pathologie est le contrôle du POINT D'ARRÊT.</div>"},
{"t": "La cellule, unité du vivant (6e)", "q": "La cellule est dite « unité du vivant » car :", "c": ["elle est ronde", "elle est verte", "elle n'a pas de noyau", "tout être vivant est constitué d'au moins une cellule (il n'y a pas de vivant plus petit)"], "a": 3, "e": "Bactérie = 1 cellule, humain = 30 000 milliards : en dessous d'une cellule, ce n'est plus vivant.", "d": "<b>La plus petite brique vivante</b> : la définition.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement : on découpe un organisme : tissus, puis cellules, puis molécules : les molécules seules (ADN, protéines) ne sont pas vivantes : la cellule est le PLUS PETIT niveau où TOUT fonctionne (nutrition, reproduction, information) : un virus, plus petit, ne vit PAS seul (il doit pirater une cellule) : c'est la frontière du vivant, vue au microscope. Piège : « plus petit » = cellule : pas atome, pas molécule.</div>"},
{"t": "La cellule, unité du vivant (6e)", "q": "L'organite qui contient l'information génétique (ADN) :", "c": ["la mitochondrie", "le noyau", "la membrane", "la vacuole"], "a": 1, "e": "Le noyau renferme l'ADN : c'est lui qu'on voit coloré en bleu foncé au microscope.", "d": "<b>Le noyau</b> : la bibliothèque de la cellule.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience : dans une préparation colorée au bleu de méthylène, la tache la plus foncée = le noyau : pourquoi il prend la couleur : l'ADN est une grosse molécule très colorable : la fonction : le noyau garde les « plans » de la cellule (quand elle se divise, c'est lui qui se partage en deux d'abord) : une cellule sans noyau (globule rouge mature) ne peut plus se reproduire : elle vit ~120 jours puis meurt : le noyau est la condition de la pérennité.</div>"},
{"t": "La cellule, unité du vivant (6e)", "q": "La membrane plasmique :", "c": ["délimite la cellule et contrôle les entrées/sorties", "est le noyau", "est une paroi rigide", "n'existe que chez les végétaux"], "a": 0, "e": "Frontière souple et sélective : elle laisse passer l'eau, les nutriments, elle retient l'intérieur.", "d": "<b>La frontière sélective</b> : le douanier de la cellule.<div class='ex-detail'><u>Exemple rédigé</u> : le détail : la membrane est une double couche de lipides (souple : la cellule peut changer de forme) percée de « portes » (transporteurs) : elle laisse entrer le glucose et l'oxygène, sortir les déchets : tout n'y passe PAS (c'est sélectif) : la preuve : une cellule dans de l'eau pure GONFLE (l'eau entre : l'intérieur est plus concentré) sans exploser grâce à la membrane qui résiste. Piège : la PAROI végétale est rigide, mais elle est EN PLUS, à l'extérieur de la membrane : TOUTES les cellules ont une membrane.</div>"},
{"t": "La cellule, unité du vivant (6e)", "q": "Une cellule observée contient des structures vertes et ses voisines sont alignées en rectangles. C'est :", "c": ["une cellule animale", "un virus", "une bactérie", "une cellule végétale (chloroplastes + paroi)"], "a": 3, "e": "Vert = chlorophylle (chloroplastes) : rectangles alignés = paroi rigide : deux signatures végétales.", "d": "<b>Végétal</b> : vert + paroi = la carte d'identité.<div class='ex-detail'><u>Exemple rédigé</u> : le diagnostic : la couleur verte vient de la chlorophylle, pigment des CHLOROPLASTES (seuls les végétaux en font : c'est l'usine à photosynthèse) : la forme géométrique et l'alignement viennent de la PAROI (boîte rigide de cellulose : les cellules s'empilent comme des briques) : une cellule animale est souple et arrondie (pas de paroi) et jamais verte : règle de détection immédiate au microscope.</div>"},
{"t": "La cellule, unité du vivant (6e)", "q": "Les mitochondries servent à :", "c": ["stocker l'eau", "colorer le noyau", "libérer l'énergie contenue dans les nutriments (respiration cellulaire)", "fabriquer la chlorophylle"], "a": 2, "e": "Ce sont les « centrales énergétiques » : elles brûlent le glucose avec l'oxygène pour fournir l'énergie utilisable par la cellule.", "d": "<b>La centrale électrique</b> : l'usine à énergie.<div class='ex-detail'><u>Exemple rédigé</u> : la logique : une cellule a besoin d'énergie pour tout (fabriquer, trier, se déplacer) : les mitochondries prennent le glucose (apporté par le sang) et l'oxygène (respiré) et en tirent l'énergie (ATP : la « pile » universelle) + déchets (CO₂, eau) : c'est la respiration CELLULAIRE, faire partout dans le corps ce que le poumon alimente : indice : les cellules très gourmandes (muscle, cœur) sont BOURRÉES de mitochondries : l'équipement suit le besoin.</div>"},
{"t": "La cellule, unité du vivant (6e)", "q": "La vacuole des cellules végétales :", "c": ["n'existe pas", "est une mitochondrie", "est un noyau", "est un réservoir (eau et substances) qui peut occuper presque toute la cellule"], "a": 3, "e": "La grande vacuole stocke l'eau (pression de turgescence : la plante qui « tient » droite) et des réserves.", "d": "<b>Le réservoir à eau</b> : la réserve végétale.<div class='ex-detail'><u>Exemple rédigé</u> : l'observation quotidienne : une salade fraîche est croquante : ses cellules ont des vacuoles PLEINES d'eau qui pressent la membrane contre la paroi (turgescence : la cellule est « gonflée » comme un ballon dans sa boîte) : la salade fanée = vacuoles vides : la paroi ne change pas (rigide) mais la pression disparaît : un arrosoir suffit à regonfler les cellules en quelques heures : la preuve que l'eau remplit bien la vacuole.</div>"},
{"t": "La cellule, unité du vivant (6e)", "q": "Le bon ordre du plus petit au plus grand :", "c": ["cellule ⟶ tissu ⟶ organite ⟶ molécule", "cellule ⟶ organite ⟶ molécule ⟶ tissu", "tissu ⟶ cellule ⟶ organite ⟶ molécule", "molécule ⟶ organite ⟶ cellule ⟶ tissu"], "a": 3, "e": "Molécule (myosine) ⟶ organite (mitochondrie) ⟶ cellule (fibre) ⟶ tissu (muscle) ⟶ organe ⟶ organisme.", "d": "<b>Molécule ⟶ organite ⟶ cellule ⟶ tissu</b> : les poupées russes du vivant.<div class='ex-detail'><u>Exemple rédigé</u> : l'exemple complet du muscle : la MYOSINE (molécule : la corde motrice) fait partie de la FIBRE (la cellule musculaire : longue, géante, mais UNE cellule) : des fibres assemblées font le MUSCLE (tissu : + vaisseaux, nerfs) : le muscle travaille avec l'os dans le BRAS (membre de l'organisme) : chaque niveau fait apparaître des fonctions nouvelles (la myosine seule ne contracte rien : la fibre, si) : c'est l'organisation emboîtée du vivant.</div>"},
{"t": "La cellule, unité du vivant (6e)", "q": "Un tissu est :", "c": ["une maladie", "un organe", "une seule cellule", "un ensemble de cellules de même type travaillant ensemble (ex. le muscle)"], "a": 3, "e": "Tissu musculaire = beaucoup de cellules musculaires : tissu épithélial = cellules de peau : le tissu est l'étage juste au-dessus de la cellule.", "d": "<b>Des cellules identiques, ensemble</b> : l'étage au-dessus.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison : la brique (cellule) ⟶ le mur (tissu) ⟶ la maison (organe) ⟶ le quartier (système) ⟶ la ville (organisme) : exemples réels : tissu MUSCULAIRE (contraction), tissu OSSEUX (soutien), tissu NERVEUX (information), tissu SANGUIN (transport) : un ORGANE mélange plusieurs tissus (le cœur : muscle + vaisseaux + nerfs + enveloppe) : l'ordre tissu < organe est un classique d'évaluation : le cœur est un organe, le myocarde un tissu.</div>"},
{"t": "La cellule, unité du vivant (6e)", "q": "Les virus :", "c": ["ne sont pas des cellules (pas de vie autonome : ils doivent infecter une cellule pour se multiplier)", "ont un noyau", "sont des bactéries", "sont des cellules minuscules"], "a": 0, "e": "Un virus = un bout d'information génétique dans une coquille de protéines : aucun organite, aucun métabolisme : hors d'une cellule, il est inerte comme un grain de poussière.", "d": "<b>Pas des cellules</b> : la frontière du vivant.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement : une cellule sait TOUT faire seule (se nourrir, se reproduire) : un virus ne sait RIEN faire seul : pas d'organite, pas d'énergie propre : il est juste un plan de construction (ADN ou ARN) dans une capside : il pirate une cellule (la sienne ou une bactérie) pour la forcer à fabriquer des copies de lui : c'est pour ça qu'un antibiotique ne tue PAS les virus (il vise des organites bactériens : le virus n'en a pas !) : le virus est à la limite du vivant, PAS dans le monde cellulaire.</div>"},
{"t": "La cellule, unité du vivant (6e)", "q": "« Toute cellule vient d'une cellule » signifie :", "c": ["les cellules naissent par division d'une cellule existante (jamais spontanément)", "les cellules tombent du ciel", "elles viennent de l'eau", "elles se fabriquent à partir de rien"], "a": 0, "e": "La division : une cellule grandit puis se coupe en deux (le noyau se partage d'abord) : pas de génération spontanée à l'échelle cellulaire.", "d": "<b>Omnis cellula e cellula</b> : la règle de Virchow.<div class='ex-detail'><u>Exemple rédigé</u> : l'histoire : au XIXe, on croyait que les microbes apparaissaient spontanément (bouillon qui « engendre ») : Pasteur (1861 : ballon au col de cygne : le bouillon stérilisé reste propre si les poussières ne tombent pas dedans) et Virchow (1855 : toute cellule a une cellule mère) ferment le débat : la conséquence pratique : une plaie qui s'infecte = des microbes qui ARRIVENT (pas qui « naissent ») : se laver les mains (Semmelweis !) : la cellule est le point de passage obligé de la vie : elle se transmet, elle ne se crée pas.</div>"},
{"t": "Les milieux de vie et leurs occupants (6e)", "q": "Un milieu de vie se caractérise par :", "c": ["son seul nom", "sa couleur", "sa taille", "ses caractéristiques physiques (lumière, humidité, sol...) et ses occupants"], "a": 3, "e": "On décrit d'abord les conditions (lumière, eau, température, sol) puis le peuplement : les deux sont liés.", "d": "<b>Conditions + occupants</b> : la double description.<div class='ex-detail'><u>Exemple rédigé</u> : la méthode : MARE = eau douce stagnante, faible profondeur, fond vaseux, bordure ensoleillée (caractéristiques) : larves de libellule, têtards, lentilles d'eau, héron (occupants) : la liaison : chaque occupant exploite une caractéristique (le héron : la faible profondeur : les lentilles : la lumière de surface) : sans cette double lecture, on ne fait que nommer. Piège : « mare » seul n'est pas une description : un milieu se DÉTAILLE.</div>"},
{"t": "Les milieux de vie et leurs occupants (6e)", "q": "Dans une chaîne alimentaire, la flèche entre « herbe » et « lapin » signifie :", "c": ["l'herbe mange le lapin", "le lapin est mangé par l'herbe", "l'herbe est mangée par le lapin", "les deux se ignorent"], "a": 2, "e": "Herbe ⟹ lapin ⟹ renard : la flèche se lit « est mangé par » et suit le trajet de la matière.", "d": "<b>« Est mangé par »</b> : le sens à ne jamais inverser.<div class='ex-detail'><u>Exemple rédigé</u> : l'astuce : on écrit la phrase à voix haute : « l'herbe est mangée PAR le lapin » ⟹ la flèche va de l'herbe VERS le lapin : la flèche porte aussi la MATIÈRE (la matière de l'herbe devient la matière du lapin : les aliments sont transformés en chair) : l'erreur classique (« le prédateur pointe sa proie ») donne lion ⟹ gazelle, qui est FAUX : gazelle ⟹ lion. Retenir : la flèche entre dans la bouche du mangeur.</div>"},
{"t": "Les milieux de vie et leurs occupants (6e)", "q": "Le « producteur » d'un milieu :", "c": ["est le végétal vert (il produit sa matière par photosynthèse à partir de CO₂, eau, lumière et sels minéraux)", "est le décomposeur", "est le champignon", "est le plus gros animal"], "a": 0, "e": "Les producteurs (herbe, algues, arbres) fabriquent la matière organique : toute la chaîne en dépend.", "d": "<b>Le végétal vert</b> : la fabrique de base.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement : que mange un lapin ? De l'herbe : que « mange » l'herbe ? RIEN d'organique : elle FABRIQUE sa matière à partir de choses non vivantes : CO₂ de l'air, eau du sol, sels minéraux, lumière (l'énergie du moteur) : c'est la photosynthèse : tout le reste de la chaîne (herbivores, carnivores) vit sur cette production : les décomposeurs referment la boucle en rendant les sels au sol. Piège : le producteur n'est PAS « celui qui fait le plus de bébés » : c'est celui qui FABRIQUE la matière.</div>"},
{"t": "Les milieux de vie et leurs occupants (6e)", "q": "Les décomposeurs (vers, champignons, bactéries) :", "c": ["sont des producteurs", "transforment les débris d'êtres vivants en sels minéraux réutilisables par les producteurs", "tuent les plantes", "n'appartiennent à aucune chaîne"], "a": 1, "e": "Ils terminent toutes les chaînes : la matière morte est recyclée en sels minéraux : le cycle repart.", "d": "<b>Les recycleurs</b> : la fin qui recommence.<div class='ex-detail'><u>Exemple rédigé</u> : le cycle complet : herbe ⟹ lapin ⟹ renard : le renard meurt : vers + bactéries + champignons le décomposent (ils s'en nourrissent) : il ne reste que des éléments simples (sels minéraux : retour au sol) : ces sels servent à la NOUVELLE herbe : la boucle est bouclée : « rien ne se perd, la matière circule » : la preuve visible : le compost (des débris ⟹ du terreau riche) : c'est la décomposition industrialisée par le jardinier.</div>"},
{"t": "Les milieux de vie et leurs occupants (6e)", "q": "Pourquoi le héron a-t-il de longues pattes ?", "c": ["pour voler plus haut", "pour courir vite sur terre", "c'est une adaptation à la chasse en eaux peu profondes de la mare", "par hasard, sans rapport avec le milieu"], "a": 2, "e": "Il guette immobile dans l'eau peu profonde : les longues pattes le tiennent hors de l'eau : l'adaptation répond à une caractéristique du milieu.", "d": "<b>Une adaptation au milieu</b> : le trait qui va avec la vie.<div class='ex-detail'><u>Exemple rédigé</u> : la démonstration : le héron chasse en station immobile dans la mare : sans longues pattes, il serait mouillé et fuyant pour les poissons : sa posture (cou replié en S : projection rapide du bec) est un ensemble ADAPTÉ : même logique chez les autres : le dytique (pattes-rames : nage rapide), la larve de libellule (respiration aquatique), la lentille d'eau (flotte vers la lumière) : la règle générale : TRAIT ⟺ CARACTÉRISTIQUE DU MILIEU : c'est le cœur du chapitre.</div>"},
{"t": "Les milieux de vie et leurs occupants (6e)", "q": "Le peuplement d'une mare change quand on la pollue :", "c": ["c'est un mystère", "c'est toujours temporaire", "les animaux s'entraînent à résister", "c'est une conséquence du changement du milieu (les espèces sensibles disparaissent, quelques résistantes prolifèrent)"], "a": 3, "e": "Le peuplement est un INDICATEUR : disparition des libellules/poissons + prolifération d'algues = signature d'engrais lessivés.", "d": "<b>Le tableau de bord vivant</b> : lire la pollution.<div class='ex-detail'><u>Exemple rédigé</u> : l'enquête : les engrais du champ lessivent vers la mare : les algues prolifèrent (engraissement) : jour : O₂ abondant : nuit : les algues RESPIRENT et épuisent l'oxygène : les poissons et larves sensibles asphyxiés meurent : le peuplement RESTANT (vers tubifex, moustiques) est tolérant : on DÉTIENT la cause par le seul inventaire des espèces : c'est la bioindication, utilisée par les scientifiques pour surveiller les rivières (indices IBGN).</div>"},
{"t": "Les milieux de vie et leurs occupants (6e)", "q": "Une haie plantée par l'Homme dans une plaine agricole :", "c": ["ne change rien", "appauvrit toujours", "peut enrichir le peuplement (corridor, abris, auxiliaires des cultures)", "est un milieu de vie vide"], "a": 2, "e": "La haie est un milieu : oiseaux, hérissons, insectes pollinisateurs, rapaces : elle rend des services aux cultures voisines.", "d": "<b>Aménagement positif</b> : l'Homme peut créer du vivant.<div class='ex-detail'><u>Exemple rédigé</u> : l'inventaire : une haie d'un simple rang d'arbres abrite : oiseaux nicheurs (mésanges : une nichée = des milliers de chenilles mangées : protection gratuite des cultures), hérissons et carabes (limaces), abeilles sauvages (pollinisation), rapaces (perchoirs de chouettes : régulation des rongeurs) : la haie sert aussi de CORRIDOR (déplacement entre bois) : retirer les haies (remembrement) a appauvri les plaines : replanter (les programmes récents) restaure : l'Homme n'est pas que destructeur : il est aussi aménageur.</div>"},
{"t": "Les milieux de vie et leurs occupants (6e)", "q": "La matière circule dans un écosystème :", "c": ["elle passe du sol aux producteurs, aux consommateurs, aux décomposeurs, puis retourne au sol", "elle va seulement vers le haut", "elle disparaît définitivement", "elle ne circule que dans les animaux"], "a": 0, "e": "Sels minéraux ⟹ végétal ⟹ herbivore ⟹ carnivore ⟹ décomposeurs ⟹ sels : un cycle fermé : l'énergie, elle, entre (lumière) et sort (chaleur).", "d": "<b>Le grand circuit</b> : matière qui tourne, énergie qui passe.<div class='ex-detail'><u>Exemple rédigé</u> : le bilan : la MATIÈRE (atomes de carbone, azote...) tourne en boucle (rien ne se perd : les atomes du lapin repartent au sol puis à l'herbe) : l'ÉNERGIE, elle, traverse : elle entre comme lumière, se fixe dans la matière organique (photosynthèse), passe de maillon en maillon (en perdant ~90 % à chaque étape en chaleur) et finit dissipée : c'est pour ça qu'une chaîne ne compte qu'environ 4-5 maillons (plus haut, il ne reste plus assez d'énergie) : deux notions, deux destins.</div>"},
{"t": "Les milieux de vie et leurs occupants (6e)", "q": "Les larves de libellule respirent dans l'eau grâce à :", "c": ["des plumes", "leur peau sèche", "des poumons d'air", "des branchies (elles prélèvent l'oxygène dissous dans l'eau)"], "a": 3, "e": "L'oxygène est DISSOUS dans l'eau : les organes aquatiques (branchies) le captent : c'est une adaptation au milieu mare.", "d": "<b>Des branchies</b> : respirer dans l'eau.<div class='ex-detail'><u>Exemple rédigé</u> : le détail impressionnant : la larve de libellule respire par des branchies... dans le RECTUM (elle pompe l'eau dans son arrière-train et en extrait l'O₂ !) et s'en sert pour la propulsion (jet d'eau : esquive rapide) : c'est un double-emploi brillant : le têtard a des branchies externes (duvet) puis des poumons (métamorphose : il change de milieu) : le poisson a des branchies operculées : POINT CLÉ : l'oxygène de l'eau est RARE (10× moins concentré que dans l'air) : la vie aquatique exige des équipements dédiés.</div>"},
{"t": "Les milieux de vie et leurs occupants (6e)", "q": "Deux milieux différents (mare sèche et friche) abritent :", "c": ["exactement les mêmes espèces", "des peuplements différents, adaptés aux conditions différentes (eau vs sécheresse)", "aucune espèce", "seulement des plantes"], "a": 1, "e": "Les caractéristiques commandent le peuplement : milieu changeant ⟹ occupants changés : c'est la clé de lecture du chapitre.", "d": "<b>Autres conditions, autres habitants</b> : la logique du peuplement.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison : MARE : humidité maximale, ensoleillement de bordure, fond vaseux : dytiques, têtards, héron, roseaux. FRICHE SÈCHE : sol pauvre, plein soleil, drainage rapide : criquets, lézards, thym (petites feuilles duveteuses : économie d'eau), papillons : le lien : chaque liste correspond à son climat local : l'ERREUR à éviter : croire que « la nature » est uniforme : chaque mètre carré est un contrat entre conditions et adaptations : c'est la première grande idée d'écologie.</div>"},
{"t": "La reproduction des êtres vivants (6e)", "q": "La fécondation correspond à :", "c": ["la fusion d'un gamète mâle et d'un gamète femelle en une cellule-œuf", "la croissance du jeune", "la ponte des œufs", "la mue de la larve"], "a": 0, "e": "Spermatozoïde + ovule = cellule-œuf : la première cellule du nouvel individu.", "d": "<b>La fusion des gamètes</b> : le point de départ du jeune.<div class='ex-detail'><u>Exemple rédigé</u> : le déroulé : le gamète mâle (spermatozoïde : minuscule, mobile) et le gamète femelle (ovule : gros, immobile, plein de réserves) se rencontrent (dans l'eau chez la grenouille : dans le corps chez la lapine) : les DEUX noyaux fusionnent : la cellule-œuf reçoit l'information des DEUX parents : elle se divise (2, 4, 8... cellules) : embryon : c'est pour ça que le jeune ressemble aux parents sans être leur copie. Piège : la fécondation n'est ni « la naissance » ni « l'accouplement » : c'est la FUSION.</div>"},
{"t": "La reproduction des êtres vivants (6e)", "q": "La reproduction asexuée produit :", "c": ["des individus très variés", "des clones identiques au parent unique (bouture, division de l'amibe, bulbilles)", "des gamètes", "des jumeaux"], "a": 1, "e": "Un seul parent, pas de gamète ni de fécondation : le descendant est une copie génétique.", "d": "<b>Des clones</b> : la copie conforme.<div class='ex-detail'><u>Exemple rédigé</u> : les cas : la bouture de géranium (un fragment devient une plante entière : MÊME information génétique), la division de l'amibe (1 cellule ⟹ 2 identiques), le fraisier (stolons : les « filles » courent sur le sol : plantes copies), l'oignon (bulbilles), la levure (bourgeonnement) : avantage : rapide et fidèle (on garde une variété parfaite) : inconvénient : AUCUNE nouveauté (si un parasite apprend à battre le clone, il bat TOUT le monde : la banane Cavendish, clone mondial, est menacée pour ça). C'est le compromis du chapitre : fidélité (asexué) vs diversité (sexué).</div>"},
{"t": "La reproduction des êtres vivants (6e)", "q": "La métamorphose de la grenouille :", "c": ["une mue de peau", "un simple agrandissement", "le passage du têtard aquatique (branchies, queue) à la grenouille terrestre (poumons, pattes)", "la ponte"], "a": 2, "e": "Un seul individu change d'organes de locomotion et de respiration : il change de MILIEU de vie.", "d": "<b>Têtard ⟶ grenouille</b> : la double vie.<div class='ex-detail'><u>Exemple rédigé</u> : la chronologie : ① ponte en grappes dans l'eau : ② le têtard éclot : branchies externes, queue, bouche racleuse d'algues (100 % aquatique) : ③ pattes postérieures puis antérieures apparaissent : ④ la queue est RÉSORBÉE (ses matériaux sont recyclés !), les poumons prennent le relais, la bouche s'élargit (insectes) : ⑤ la jeune grenouille sort sur la berge : le même individu a habité deux mondes : la métamorphose est pilotée par des hormones (la thyroxine : l'expérience classique : on en ajoute ⟹ métamorphose accélérée).</div>"},
{"t": "La reproduction des êtres vivants (6e)", "q": "Une plante issue de bouture est :", "c": ["le mélange de deux parents", "un hybride", "toujours plus grande", "un clone exact du pied-mère (reproduction asexuée)"], "a": 3, "e": "Pas de gamètes : le fragment se racine et redonne l'identique : toutes les boutures d'une variété de rose sont le même individu.", "d": "<b>Un clone</b> : la fidélité absolue.<div class='ex-detail'><u>Exemple rédigé</u> : le fait étonnant : le rosier 'Peace' ('Mme A. Meilland', 1945) existe en des millions d'exemplaires : TOUS sont des boutures-boutures du pied original : un seul individu, multiplié par fragments depuis 80 ans : c'est la force du végétal (totipotence : un fragment redonne un tout) : application : les variétés fruitières se propagent par bouture/greffe pour garder le fruit exact : l'inconvénient : zéro diversité (un seul parasite adapté peut tout emporter : le catalogue des vignes européennes a fondu au XIXe pour ça).</div>"},
{"t": "La reproduction des êtres vivants (6e)", "q": "Un ovipare :", "c": ["est obligatoirement un insecte", "porte ses petits dans une poche (mammifère)", "pond des œufs qui se dévelopvent hors du corps de la mère (oiseaux, poissons, grenouilles)", "allaite ses petits"], "a": 2, "e": "Le développement du petit se fait dans l'œuf, à l'extérieur : souvent beaucoup d'œufs, la chaleur déclenche le développement.", "d": "<b>Ça se développe dans un œuf pondu</b> : la stratégie des œufs.<div class='ex-detail'><u>Exemple rédigé</u> : les exemples : poule (œuf couvé : 21 jours à 37,5 °C : le jaune = la réserve du futur poussin), grenouille (pontes gélatineuses dans l'eau : le soleil chauffe), truite (œufs dans le gravier), papillon (œufs sur la plante-hôte : la chenille a déjà son garde-manger) : la logique : l'œuf est une capsule autonome (réserves + protection) : le petit sort au stade larve ou jeune formé : les soins varient (la poule protège : la morue abandonne : les deux réussissent).</div>"},
{"t": "La reproduction des êtres vivants (6e)", "q": "La morue pond des millions d'œufs car :", "c": ["la plupart seront mangés : la quantité compense (il suffit de 2 survivants)", "chaque œuf est précieux et couvé", "les œufs vivent longtemps", "elle est très grosse"], "a": 0, "e": "Stratégie de la quantité : œufs minuscules, abandonnés : la survie de 2 individus suffit à perpétuer l'espèce.", "d": "<b>La loterie des millions</b> : parier sur le nombre.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul de vie : 1 femelle morue : ~5 millions d'œufs par an : 99,99 % sont mangés (poissons, plancton brouteur) : il suffit que DEUX (un mâle, une femelle) atteignent l'adulte pour que la population soit stable : la contre-stratégie de l'éléphant : 1 petit tous les 4-5 ans, gardé des décennies : les DEUX stratégies « marchent » : ce qui est compté par l'évolution, c'est le nombre de SURVIVANTS, pas de nés : la nature écrit ses comptes en résultats.</div>"},
{"t": "La reproduction des êtres vivants (6e)", "q": "Un mammifère est vivipare, ce qui signifie :", "c": ["il abandonne ses œufs au soleil", "il se reproduit par bouture", "le petit se développe dans le corps de la mère (gestation) avant la naissance", "il pond des œufs"], "a": 2, "e": "Gestation dans l'utérus (au chaud, protégé, nourri par la mère) : peu de jeunes, souvent beaucoup de soins ensuite.", "d": "<b>Développement interne</b> : la grossesse.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison des stratégies : la biche : 1 faon par an, gestation 8 mois (le fœtus est nourri par le sang maternel : le milieu interne = incubateur parfait), allaitement, protection : l'investissement par petit est énorme : la portée est petite : le jeune naît assez grand et apprend vite : c'est le trait commun des mammifères (avec le lait : le seul groupe à allaiter) : exceptions connues : l'ornithorynque, mammifère qui POND (l'exception qui confirme : les règles biologiques ont leurs originals).</div>"},
{"t": "La reproduction des êtres vivants (6e)", "q": "Les jeunes issus de la reproduction sexuée :", "c": ["ne ressemblent à personne", "ressemblent aux parents sans être identiques (mélange des informations des deux parents)", "sont tous des clones", "sont des copies exactes du père"], "a": 1, "e": "Chaque jeune reçoit un mélange unique (moitié père, moitié mère) : c'est la source de la diversité au sein des espèces.", "d": "<b>Ressemblance SANS copie</b> : la diversité en famille.<div class='ex-detail'><u>Exemple rédigé</u> : l'observation : dans une portée de chatons, chacun a son pelage (des mêmes parents !) : le mécanisme : chaque jeune reçoit une combinaison unique d'informations (la moitié de la mère, la moitié du père, mélangées) : c'est pour ça qu'aucun enfant n'est la copie de ses parents (sauf vrais jumeaux : un même œuf qui se coupe en deux) : c'est la source de la diversité du vivant : le sexué fabrique du NOUVEAU, l'asexué fabrique de l'IDENTIQUE : les deux sont utiles, l'évolution adore le sexué pour s'adapter.</div>"},
{"t": "La reproduction des êtres vivants (6e)", "q": "Chez les plantes à fleurs, la reproduction sexuée implique :", "c": ["les racines uniquement", "la bouture obligatoire", "l'absence de gamètes", "le pollen (gamète mâle) et l'ovule (gamète femelle) ⟹ fécondation ⟹ graine"], "a": 1, "e": "Le pollen (transporté par vent, abeilles...) féconde l'ovule : la fleur devient fruit, le fruit contient les graines.", "d": "<b>Pollen + ovule = graine</b> : la version végétale du sexué.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne complète : la fleur de pommier : le pollen (apporté par une abeille : pollinisation) germe sur le stigmate, descend jusqu'à l'ovule : fécondation : l'ovule devient GRAINE, l'ovaire autour devient FRUIT (la pomme : un ovaire gorgé de sucre !) : le fruit est une invention pour FAIRE TRANSPORTER les graines (animal gourmand : dispersion) : c'est le même schéma que chez les animaux : gamètes ⟹ fécondation ⟹ développement : la sexualité a été inventée avant les animaux ET les plantes (elle date de l'époque des eucaryotes anciens).</div>"},
{"t": "La reproduction des êtres vivants (6e)", "q": "Le cycle de vie d'un être vivant :", "c": ["naissance ⟶ croissance ⟶ adulte ⟶ reproduction ⟶ mort", "mort puis renaissance", "naissance, reproduction, retour en arrière", "croissance infinie"], "a": 0, "e": "L'ordre universel : on naît, on grandit, on devient adulte capable de se reproduire, puis on meurt : la reproduction assure la CONTINUITÉ de l'espèce.", "d": "<b>Le cycle universel</b> : la vie qui se transmet.<div class='ex-detail'><u>Exemple rédigé</u> : la généralité : bactérie (division : des heures), mouche (œuf-larve-nymphe-adulte : des semaines), chêne (gland-arbre : des siècles) : le même FILM à des vitesses différentes : la croissance = augmentation de taille : le développement = changement de forme/compétences (métamorphose, puberté) : le sens biologique de la mort : faire de la place à la descendance (les générations se relaient : l'espèce persiste alors que les individus passent) : c'est pour ça qu'on dit que la reproduction est la fonction qui définit le vivant.</div>"},

var currentChap = null;
var META_BY_ID = {}; var FICHE_BY_ID = {};
COURS_META.forEach(function(c){ META_BY_ID[c.id] = c; });
FICHES_DATA.forEach(function(f){ FICHE_BY_ID[f.id] = f.fiche; });

function chapHeadHTML(m){
  return '<div class="chap-head"><span class="chap-title">⚗️ Physique-chimie — ' + esc(m.titre) + '</span>' +
    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();
  if (t === 'quiz') {
    var bar = document.getElementById('quiz-chapbar');
    if (currentChap && META_BY_ID[currentChap]) { bar.innerHTML = chapHeadHTML(META_BY_ID[currentChap]); startTraining(META_BY_ID[currentChap].theme); }
    else { bar.innerHTML = ''; state.mode = 'menu'; render(); }
  }
  if (t === 'prog' || t === 'cours') window.scrollTo({top:0});
}
function clearChap(){ currentChap = null; }

function goCours(id){
  currentChap = id;
  showTab('cours');
  window.scrollTo({top:0, behavior:'smooth'});
}
function goCoursList(){ currentChap = null; showTab('cours'); }

function ficheHTML(id, num, open){
  var m = META_BY_ID[id]; var f = FICHE_BY_ID[id];
  return '<details class="fiche" id="fiche-' + id + '"' + (open ? ' open' : '') + '>' +
    '<summary><span class="fiche-num">' + num + '</span> Fiche — ' + esc(m.titre) + ' <span class="niv" style="font-size:.7rem;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-weight:700;margin-left:6px">' + esc(m.niveau) + '</span></summary>' +
    '<div class="fiche-body">' +
    '<div class="fiche-actions"><button class="btn-pdf" onclick="printFiche(\'' + id + '\')">🖨️ Imprimer</button><button class="btn-pdf" onclick="fichePDF(\'' + id + '\')">📄 PDF</button></div>' +
    '<div class="print-title">Fiche synthétique — ' + esc(m.titre) + ' (' + esc(m.niveau) + ')</div>' +
    f +
    '</div></details>';
}

function renderFiches(){
  var z = document.getElementById('fiches-zone'); var h = '';
  if (currentChap && FICHE_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += ficheHTML(currentChap, 1, true);
  } else {
    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
    var i = 1;
    FICHES_DATA.forEach(function(f){ h += ficheHTML(f.id, i); i++; });
  }
  z.innerHTML = h;
}

var PDF_CP1252 = { 0x2018:0x91, 0x2019:0x92, 0x201A:0x82, 0x201C:0x93, 0x201D:0x94, 0x201E:0x84, 0x2013:0x96, 0x2014:0x97, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x20AC:0x80, 0x0152:0x8C, 0x0153:0x9C, 0x0160:0x8A, 0x0161:0x9A, 0x0178:0x9F, 0x017D:0x8E, 0x017E:0x9E, 0x192:0x83, 0x2C6:0x88, 0x2032:0xB4, 0x2039:0x8B, 0x203A:0x9B, 0x201E2:0 };
function pdfTranslit(s){
  return s.replace(/\u2212|\u2013|\u2014/g, '-').replace(/[\u2032\u2019]/g, "'")
    .replace(/\u2192|\u21D2|\u21A6/g, '->').replace(/\u2190/g, '<-')
    .replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u2260/g, '!=').replace(/\u2248/g, '~')
    .replace(/\u2208/g, ' in ').replace(/\u2205/g, 'vide').replace(/\u2286/g, 'incl.')
    .replace(/\u221A/g, 'V').replace(/\u00B7|\u2219|\u22C5/g, '*').replace(/\u2022/g, '-')
    .replace(/\u2124/g, 'Z').replace(/\u211D/g, 'R').replace(/\u2115/g, 'N').replace(/\u2119/g, 'P')
    .replace(/\u00A0/g, ' ').replace(/\u202F|\u2009|\u200B|\uFE0F/g, '')
    .replace(/[\u2460-\u2468]/g, function(c){ return (c.charCodeAt(0) - 0x2460 + 1) + ')'; })
    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
}
function pdfEnc(s){
  var out = '';
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }
    else if (PDF_CP1252[c] !== undefined) b = PDF_CP1252[c];
    if (b !== null && b !== undefined) out += String.fromCharCode(b);
  }
  return out;
}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
var PDF_INLINE = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, SMALL:1, SUB:1, SUP:1, A:1, CODE:1, ABBR:1 };
function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';
    } else if (c.nodeType === 1){
      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }
      else if (g === 'B' || g === 'STRONG') pdfSegs(c, true, out);
      else pdfSegs(c, bold, out);
    }
  }
}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'li') segs = [{ t: '- ', b: bold || false }].concat(segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;
  function walk(n){
    for (var c = n.firstChild; c; c = c.nextSibling){
      if (c.nodeType === 3){
        var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;
        var cl = ' ' + (c.className || '') + ' ';
        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }
        emitP();
        if (/^H[1-6]$/.test(g)) emitBlock('h', c, indent);
        else if (g === 'LI') emitBlock('li', c, indent + 16);
        else if (g === 'UL' || g === 'OL') {
          for (var li = c.firstChild; li; li = li.nextSibling){
            if (li.nodeType === 1 && li.tagName === 'LI') { emitBlock('li', li, indent + 16); walk(li); }
          }
        }
        else if (g === 'TABLE' || g === 'THEAD' || g === 'TBODY'){
          for (var tr = c.firstChild; tr; tr = tr.nextSibling){
            if (tr.nodeType !== 1) continue;
            if (tr.tagName === 'TR'){
              var cells = [];
              for (var td = tr.firstChild; td; td = td.nextSibling){
                if (td.nodeType === 1 && (td.tagName === 'TD' || td.tagName === 'TH')){
                  var cs = []; pdfSegs(td, td.tagName === 'TH', cs);
                  cells.push(cs.map(function(x){ return x.t; }).join('').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
                }
              }
              var line = cells.join('   |   ');
              if (line.replace(/\s/g, '') !== '') blocks.push({ type: 'p', segs: [{ t: line, b: false }], indent: indent + 8 });
            } else if (tr.tagName === 'THEAD' || tr.tagName === 'TBODY') walk(tr);
          }
        }
        else if (g === 'P') { emitBlock('p', c, indent); }
        else { var keep = indent; walk(c); indent = keep; }
      }
    }
    emitP();
  }
  walk(root);
  return blocks;
}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    var isTitle = b.type === 'title';
    var size = isTitle ? 15 : (b.type === 'h' ? 12 : 10.5);
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [];
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) words.push({ br: true });
        p.split(' ').forEach(function(w){ if (w !== '') words.push({ w: w, b: s.b }); });
        if (pi < parts.length - 1) {} else { words.push({ sp: true, b: s.b }); }
      });
    });
    var cur = [], len = 0;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, gap: isTitle ? 0 : (b.type === 'h' ? 7 : 4) }); cur = []; len = 0; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      if (wd.sp) { continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
    if (isTitle) lines.push({ rule: true });
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var pages = [], cur = [], y = TOP;
  lines.forEach(function(ln){
    if (ln.rule){
      if (y - 14 < M) { pages.push(cur); cur = []; y = TOP; }
      y -= 12;
      cur.push('0.29 0.27 0.9 RG 1.5 w ' + M + ' ' + y.toFixed(2) + ' m ' + (W - M) + ' ' + y.toFixed(2) + ' l S\n0 0 0 RG 1 w');
      y -= 8;
      return;
    }
    var lh = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh < M) { pages.push(cur); cur = []; y = TOP; }
    y -= (ln.gap || 0);
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      var enc = pdfEnc(pdfTranslit(s.t));
      if (!enc) return;
      cur.push('BT 1 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Tm /F' + (s.b ? 2 : 1) + ' ' + ln.size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
      x += 0.52 * ln.size * enc.length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de SVT</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p><div style="margin:12px 0 0"><input type="text" id="prog-search" oninput="progSearchList(this.value)" placeholder="🔎 Rechercher dans les cours..." style="width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.9rem;font-family:inherit;outline:none"></div><div id="prog-search-results"></div>' + h + '</section>';
})();
// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();
