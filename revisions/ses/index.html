{"t": "Le marché du travail et l'emploi (SES — 1re)", "q": "Le salaire dépend notamment de :", "c": ["l'âge uniquement", "la productivité, les institutions (SMIC, conventions), le rapport de force (syndicats, pénurie) et les normes sociales", "uniquement la productivité", "la couleur des yeux"], "a": 1, "e": "Le salaire n'est pas un simple prix : négociation collective, prestige du métier, discriminations et coutumes le façonnent (économistes du « travail » et sociologues convergent).", "d": "<b>Productivité + institutions + rapports de force</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les preuves empiriques : 1) PRODUCTIVITÉ : les métiers qui génèrent beaucoup de VA par tête paient mieux (la finance vs le nettoyage) : 2) INSTITUTIONS : le SMIC (+ le « coup de pouce » de chaque revalorisation) relève les bas salaires (~12-15 % des salariés au SMIC) : 3) RAPPORT DE FORCE : pénuries locales (soignants, plombiers : salaires qui montent), syndicalisme par branche : 4) NORMES ET DISCRIMINATIONS : l'écart femmes-hommes (~15 % toutes choses égales... environ 4-5 % « inexpliqué » : la part discriminatoire), les « salaires de prestige » (recherche, culture : faibles par passion — la « rente de vocation ») : la conclusion : le salaire est un fait SOCIAL TOTAL (Mauss) : l'économie pure en rend compte à ~70 %, le reste est politique et culturel — c'est la définition même d'un objet SES.</div>"},
{"t": "Le marché du travail et l'emploi (SES — 1re)", "q": "Une politique d'« activation » des dépenses passives signifie :", "c": ["conditionner l'indemnisation à la recherche active et à la formation (droits et devoirs)", "augmenter les allocations sans conditions", "supprimer le chômage", "privatiser France Travail"], "a": 0, "e": "Passer de la simple indemnisation (passive) à l'accompagnement obligatoire vers l'emploi (active) : la doctrine de toutes les réformes depuis les années 2000.", "d": "<b>Des droits accompagnés de devoirs</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le basculement historique : ANCIEN MODÈLE : indemniser en attendant la reprise (le chômage comme assurance) : NOUVEAU MODÈLE (depuis la loi de 2001 « Plein emploi » et surtout la fusion ANPE-Assedic 2008 puis France Travail 2024) : 1) obligation d'actualisation et de recherche prouvée (15 h/mois d'actions), 2) offres raisonnables (refuser un emploi « raisonnable » = sanction), 3) formation prescrite (le CPF, le pro-A), 4) contrôle et radiations : le débat : les uns y voient une mise sous tension efficace (les études sur le contrôle randomisé montrent des recherches plus actives) : les autres une sanction des plus fragiles (les radiations frappent surtout les découragés et les personnes éloignées de l'emploi) : la copie équilibrée : l'activation est la norme européenne (Espagne, Allemagne Hartz : baisse spectaculaire du chômage allemand 2005-2015) MAIS son succès dépend du niveau de la demande : on ne peut pas activer des gens vers des emplois qui n'existent pas.</div>"},
{"t": "La monnaie et le financement de l'économie (SES — 1re)", "q": "Une des trois fonctions de la monnaie est :", "c": ["remplacer l'État", "faire joli", "regarder la télé", "servir d'intermédiaire des échanges (éviter le troc et la double coïncidence des besoins)"], "a": 3, "e": "Échange, unité de compte, réserve de valeur : le troc exige que chacun veuille exactement ce que l'autre a.", "d": "<b>Intermédiaire des échanges</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'absurdité du troc : un plombier veut des œufs : il doit trouver un éleveur dont la fuite... et ainsi de suite (la « double coïncidence des besoins » rend l'échange rare) : la monnaie sépare vente et achat dans le temps et l'espace : le plombier est payé lundi, achète ses œufs jeudi : les deux autres fonctions pour la copie complète : UNITÉ DE COMPTE (toutes les valeurs s'expriment en € : comparaison, calcul, comptabilité) et RÉSERVE DE VALEUR (l'épargne garde son pouvoir d'achat... SI l'inflation est maîtrisée : à 10 %/an, la monnaie remplit mal cette fonction — c'est l'actualité 2022-23) : les trois fonctions sont INTERDÉPENDANTES : une monnaie qui perd sa fonction de réserve (hyperinflation : Venezuela, Zimbabwe) cesse vite d'être acceptée en échange : la confiance est le vrai socle.</div>"},
{"t": "La monnaie et le financement de l'économie (SES — 1re)", "q": "« Les crédits font les dépôts » signifie :", "c": ["l'État imprime la monnaie", "les banques créent de la monnaie en accordant des crédits (l'écriture au compte du client EST la monnaie)", "les épargnants prêtent leur argent", "les dépôts créent les billets"], "a": 1, "e": "La banque inscrit le prêt au compte de l'emprunteur : cette écriture est de la monnaie nouvelle — limitée par réserves, capital et prudence.", "d": "<b>La création monétaire par le crédit</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le déroulé précis : 1) la banque accorde 10 000 € au boulanger : elle inscrit « +10 000 € » sur son compte (au passif de son bilan) ET « +10 000 € de créance » (à l'actif) : la masse monétaire a augmenté de 10 000 € : 2) le boulanger paie son fournisseur : la monnaie circule, atterrit sur un autre compte bancaire : 3) la banque B peut prêter à nouveau (moins les réserves obligatoires et le capital requis : Bâle III) : le « multiplicateur » : la monnaie de départ (les réserves de banque centrale) soutient un volume multiple de dépôts : la limite clé (souvent oubliée) : la création dépend de la DEMANDE de crédit solvable et de la CONFIANCE (2008 : les banques ne se prêtent plus entre elles : le multiplicateur se fige) : c'est pourquoi la BCE agit sur le refinancement : elle alimente (ou freine) la base de la pyramide.</div>"},
{"t": "La monnaie et le financement de l'économie (SES — 1re)", "q": "Le financement « intermédié » (ou indirect) signifie :", "c": ["l'État prête", "pas de financement", "l'entreprise emprunte directement aux épargnants via la Bourse", "un intermédiaire (banque) transforme les dépôts en crédits"], "a": 3, "e": "La banque collecte l'épargne et prête : transformation des échéances (dépôts courts → prêts longs) : la relation remplace le marché.", "d": "<b>Passer par une banque</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le schéma complet à savoir refaire : ÉPARGNANTS (dépôts) → BANQUE (transformation : elle emprunte court, prête long : elle gère le risque par la diversification et l'expertise) → ENTREPRISES (crédit) : avantages : accessible aux PME (pas besoin de publier comme en Bourse), suivi du dossier (la banque connaît l'entreprise), confidentialité : risques : fragilité si tous retirent en même temps (bank run : la transformation exige la confiance : d'où la garantie des dépôts 100 000 € et la BCE prêteur en dernier ressort) : comparaison France/Allemagne vs USA-UK : les économies continentales sont « bank-based » (les entreprises se financent à ~60-70 % par les banques), les anglo-saxonnes « market-based » (obligations, actions) : deux capitalismes, deux cultures financières — un classique de comparaison internationale.</div>"},
{"t": "La monnaie et le financement de l'économie (SES — 1re)", "q": "Le taux d'intérêt réel est approximativement :", "c": ["le PIB", "l'inflation plus deux", "le taux nominal", "le taux nominal moins l'inflation"], "a": 3, "e": "À 5 % nominal et 3 % d'inflation : ~2 % réels : c'est le vrai coût du crédit (et le vrai rendement de l'épargne).", "d": "<b>Nominal − inflation</b> (approximation de Fisher).<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi c'est le chiffre qui compte : un emprunteur à 5 % en inflation 3 % rembourse un argent qui a « fondu » de 3 % : le coût effectif est ~2 % : l'application historique frappante : les années 1970-80 : taux nominaux 12-15 % mais inflation 10-13 % ⟹ taux réels FAIBLES voire négatifs : les emprunteurs gagnaient (l'inflation « mangeait » leurs dettes : les propriétaires des Trente Glorieuses) : l'inversion 2023 : taux 4 %, inflation retombant à 2 % ⟹ taux réels POSITIFS (~2 %) : la charge ressentie explose : c'est pourquoi les débats sur le « coût du crédit » sont incomplets sans la paire nominal/inflation : toujours déflater un taux avant d'en parler — la règle d'or de toute copie sur la monnaie.</div>"},
{"t": "La monnaie et le financement de l'économie (SES — 1re)", "q": "La BCE a fortement relevé ses taux en 2022-2023 pour :", "c": ["ramener l'inflation vers ~2 % en rendant le crédit plus cher (cassant la demande et les anticipations)", "financer les États", "faire plaisir aux banques", "augmenter le chômage"], "a": 0, "e": "Son mandat : la stabilité des prix (~2 %) : les taux hauts freinent crédit, consommation, investissement : l'inflation redescend.", "d": "<b>Casser l'inflation par la rareté du crédit</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne de transmission : 1) la BCE porte son taux de refinancement de −0,5 % à +4 % (2022-23, la plus rapide hausse de son histoire) : 2) les banques répercutent (crédit immobilier de 1 % à 3,5-4 %) : 3) les projets REPORTÉS (logement, usines) : la demande ralentit : 4) les vendeurs ne peuvent plus augmenter leurs prix aussi librement (les clients rechignent) : 5) les ANTICIPATIONS se réancrent (si la BCE est crédible, les demandes salariales se calment) : l'inflation est passée de 10 % (oct. 2022) à ~2,5 % (2024) : le coût : croissance ralentie, immobilier en chute, charge de la dette publique en hausse : le débat (à écrire) : faut-il sacrifier l'activité pour les prix ? La réponse de la BCE : l'inflation non traitée coûte PLUS cher (boucle salaires-prix des années 70 : il a fallu 15 ans pour la casser) : un arbitrage politique assumé par une institution indépendante — voilà toute la singularité de l'euro.</div>"},
{"t": "La monnaie et le financement de l'économie (SES — 1re)", "q": "L'autofinancement désigne :", "c": ["un crédit bancaire", "le financement par l'État", "le financement de l'investissement par les ressources propres de l'entreprise (profits non distribués, amortissements)", "l'émission d'actions"], "a": 2, "e": "La moitié de l'investissement des entreprises françaises : autofinancement (EBE non distribué) : indépendance mais lenteur.", "d": "<b>Financer par ses propres ressources</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : l'EBE de l'entreprise (100) − impôts (25) − intérêts (10) − dividendes (30) = ~35 retenus : ces « réserves » + les amortissements (la « reconstitution » comptable du capital usé) financent machines et logiciels : les avantages : AUCUNE dépendance (ni banquier ni actionnaire), confidentialité, pas de dilution : les inconvénients : LENT (il faut avoir gagné avant d'investir) et RISQUÉ pour la croissance (une startup autofinancée n'ira jamais vite : elle lève des fonds) : la structure optimale dépend du secteur (l'industrie : autofinancement lourd : le numérique : levées d'actionnaires) : la donnée à citer : en France, l'autofinancement couvre ~50-70 % de l'investissement productif — l'entreprise moderne est d'abord sa propre banque.</div>"},
{"t": "La monnaie et le financement de l'économie (SES — 1re)", "q": "Une obligation est :", "c": ["un titre de créance (l'émetteur promet de rembourser avec intérêts, le coupon)", "un chèque", "un billet de banque", "une part de propriété"], "a": 0, "e": "L'obligation = dette (remboursement + coupons fixes) : l'action = capital (droit aux bénéfices, vote, risque en dernier rang).", "d": "<b>Un titre de créance</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la différence structurale à maîtriser : OBLIGATION : vous PRÊTEZ : contrat : remboursement à l'échéance + coupons (2-5 %) : risque : défaut (rare pour les bons émetteurs : l'État français, noté AA) : pas de gain si l'entreprise prospère : ACTION : vous ÊTES copropriétaire : pas de remboursement promis : dividendes variables, plus-value possible (et perte totale possible : liquidité) : le couple rendement/risque : l'action espère plus, risque plus : l'application d'actualité : 2022 : les taux montent ⟹ les obligations anciennes à coupons bas perdent de la valeur (leur prix baisse : c'est mécanique) ET les actions chutent : les « fonds 100 % obligataires sécuritaires » ont perdu... les épargnants découvert la duration : le monde de la finance se comprend avec ces deux titres — tout le reste en dérive.</div>"},
{"t": "La monnaie et le financement de l'économie (SES — 1re)", "q": "Le « private equity » (capital-investissement) :", "c": ["achète des obligations d'État uniquement", "est une banque publique", "entre au capital d'entreprises non cotées pour les développer et revendre sa part avec plus-value", "prête sans garantie"], "a": 2, "e": "Capital développement, transmission (LBO), capital-risque (startup) : le fonds apporte argent, méthode et gouvernance, et vise un rendement élevé à horizon 3-7 ans.", "d": "<b>Investir au capital pour revendre mieux</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cycle du fonds : 1) LEVÉE : le fonds collecte auprès d'investisseurs (fonds de pension, assureurs) : 2) INVESTISSEMENT : prise de participation (minoritaire : capital-risque : majoritaire : LBO, souvent avec dette) : 3) VALEURISATION : le fonds active les leviers (gouvernance, achats groupés, digitalisation, croissance externe) : 4) SORTIE : revente (à un industriel, un autre fonds, introduction) avec l'objectif x2-x3 sur 5 ans : le débat français : les LBO « destructeurs d'emplois » (Camaïeu, Grip Avantages... les liquidations médiatisées) vs les études d'ensemble (croissance de l'EBE et de l'emploi souvent supérieure aux PME comparables : la question est la dette et l'horizon court) : la leçon SES : le financeur redessine le POUVOIR et l'HORIZON TEMPOREL de l'entreprise — il n'apporte pas que de l'argent.</div>"},
{"t": "La monnaie et le financement de l'économie (SES — 1re)", "q": "La BCE est dite « indépendante », ce qui signifie :", "c": ["qu'elle est privée", "qu'elle dépend du FMI", "qu'elle n'a pas de budget", "qu'elle décide de la politique monétaire sans instruction des gouvernements (mandat : stabilité des prix ~2 %, interdiction de financer les États)"], "a": 3, "e": "Indépendance vis-à-vis du politique (pour éviter la monétisation des déficits et l'inflation) : elle rend compte publiquement (presse,Parlement européen).", "d": "<b>Pas d'instruction des gouvernements</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement historique : si un gouvernement peut ordonner à sa banque centrale de « imprimer » pour financer ses déficits, l'incitation est irrésistible (pas d'impôt à lever !) : le résultat historique : hyperinflations (Allemagne 1923, épisodes sud-américains) : la solution institutionnelle : séparer (l'indépendance statutaire : traités de Maastricht, 1992) et interdire (pas de rachat direct de dette publique nouvelle) : la controverse : en France, certains responsables politiques demandent que la BCE « finance la transition » : la BCE refuse (mais elle a accepté de racheter de la dette existante sur le marché secondaire : QE, avec débats juridiques) : le bilan d'ensemble : depuis 1999, l'inflation de la zone euro a été en moyenne ~2 % (contre ~6-8 % dans les décennies précédentes) : le mandat est rempli — le débat démocratique porte sur ce que l'indépendance interdit de faire (politique budgétaire dominante en crise : c'est l'autre face du chapitre « l'Union européenne »).</div>"},
{"t": "La monnaie et le financement de l'économie (SES — 1re)", "q": "Un « assouplissement quantitatif » (quantitative easing) consiste :", "c": ["à interdire les crédits", "pour la banque centrale, à créer de la monnaie pour acheter des actifs (obligations) et faire baisser les taux longs", "à supprimer les billets", "à augmenter les impôts"], "a": 1, "e": "La BCE (2015-2022) a acheté ~5 000 Md € d'actifs : objectif en crise : soutenir crédit et activité, atteindre l'objectif d'inflation.", "d": "<b>Créer monnaie ⟹ acheter des actifs</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : 1) les taux directeurs sont déjà à zéro (ou négatifs) : la BCE ne peut plus les baisser : 2) elle achète massivement des obligations (surtout publiques) sur le marché : ces achats font MONTER les prix des obligations et BAISSER leurs rendements (les taux longs que paient États et entreprises) : 3) au passif de la BCE, les paiements créent des dépôts des banques (la « monnaie de base » explose : le bilan BCE ~7 000 Md € en 2022) : les résultats : crédits abordables, reprise post-2015, inflation... revenue (objectif atteint : parfois trop, d'où la volte-face 2022) : les critiques : inégalités (les actifs achetés montent : les détenteurs d'actions s'enrichissent), dépendance des États à des taux bas, « zombie firms » (entreprises maintenues artificiellement par le crédit gratuit) : l'outil est devenu le standard des crises (2008, Covid : « quoi qu'il en coûte » monétaire) — un réflexe historique nouveau à connaître.</div>"},
{"t": "Les mobilités sociales (SES — 1re)", "q": "La mobilité « structurelle » provient :", "c": ["de la transformation de la structure des emplois (moins d'agriculteurs, plus de cadres : il faut bien que quelqu'un monte)", "du mérite individuel", "des mariages", "de l'immigration"], "a": 0, "e": "Elle est « automatique » : les places se créent et se vident : elle ne dit rien de l'égalité des chances.", "d": "<b>La transformation des emplois crée la mobilité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'image mécanique : en 1950, la société française « ressemble » à une pyramide large en bas (paysans, ouvriers) : en 2020, elle a une forme de losange (les cadres et professions intermédiaires gonflent au milieu) : les enfants NE PEUVENT PAS rester tous paysans (il n'y a plus de places) : ils montent MÉCANIQUEMENT dans les nouvelles catégories : la distinction cruciale pour l'examen : cette mobilité structurelle (imposée par la structure) ne prouve PAS que la société est devenue plus fluide (meilleures chances à origine égale) : quand les sociologues calculent la FLUIDITÉ (à catégories constantes), l'avantage des origines favorisées est resté ~stable depuis 30 ans : dire « la mobilité a augmenté » sans dire de QUOI (structurelle vs nette) est l'erreur que tout correcteur repère.</div>"},
{"t": "Les mobilités sociales (SES — 1re)", "q": "La « fluidité » sociale mesure :", "c": ["la vitesse des voitures", "la croissance", "l'immigration", "la mobilité à origine sociale comparable (chances relatives d'accès aux positions, indépendamment de la structure)"], "a": 3, "e": "Odds ratios : un enfant de cadre a-t-il TOUJOURS x fois plus de chances qu'un enfant d'ouvrier, à structure de places égale ?", "d": "<b>Les chances relatives à origine égale</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la méthode : 1) on prend deux générations : 2) on compare les positions atteintes par origine : 3) on calcule le rapport de chances (odds ratio) : si les enfants de cadres ont 4 fois plus de chances d'être cadres que les enfants d'ouvriers en 1970 ET en 2020, la fluidité est CONSTANTE (même si la part de cadres a doublé) : le résultat central des enquêtes françaises (Maurice, Thélot, Vallet) : la fluidité a un peu augmenté avec l'expansion scolaire des années 60-80, puis s'est STABILISÉE : les héritages pèsent aujourd'hui presque comme hier : l'application : quand un discours dit « la société est plus ouverte », le sociologue demande : « parlons-nous de places nouvelles ou de chances égales ? » : les deux évolutions peuvent être OPPOSÉES — c'est la finesse la plus valorisée du chapitre.</div>"},
{"t": "Les mobilités sociales (SES — 1re)", "q": "L'homogamie désigne :", "c": ["le PACS", "l'exogamie", "le divorce", "le fait d'épouser dans son milieu social d'origine"], "a": 3, "e": "Épouser quelqu'un de son groupe (socioprofessionnel, éducatif) : le phénomène majoritaire, qui « verrouille » les positions (les deux héritages se cumulent au sein du couple).", "d": "<b>Épouser dans son milieu</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le constat statistique : environ 50-60 % des unions se font entre proches sociologiquement (études comparables, professions voisines) : le mécanisme (pas un complot) : on se rencontre là où l'on est (université de rang, entreprise, quartier, associations) : les couples « d'équivalence » se renforcent (deux salaires de cadres, deux réseaux) : la conséquence sur les enfants : un ménage homogame cumule les capitaux (économiques, culturels, sociaux) : les inégalités se COMPOUNDENT entre générations : l'inverse (hypogamie : épouser « au-dessus ») est la voie d'ascension la plus documentée dans les récits de transfuges (Eribon : la mère qui « monte » par le mariage) : c'est pourquoi les sociologues du couple (Bozon, Herpin) sont mobilisés dans les copies sur la reproduction : le MARIAGE est un des opérateurs statistiques de l'héritage social.</div>"},
{"t": "Les mobilités sociales (SES — 1re)", "q": "Le « survivant bias » dans les récits de réussite :", "c": ["concerne la natation", "fait qu'on n'entend que ceux qui ont réussi (les milliers d'échecs similaires restent invisibles)", "rend les récits vrais", "est une méthode statistique officielle"], "a": 1, "e": "« J'ai commencé plombier et voilà PDG » : les plombiers restés plombiers n'écrivent pas de livres : le cas ne fait pas la probabilité.", "d": "<b>On n'entend que les réussites</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme épistémologique : les récits disponibles (médias, TED talks, livres de « self-made men ») sont un ÉCHANTILLON BIAISÉ : seuls les succès ont une voix publique : le raisonnement correct : si 1 plombier sur 10 000 devient PDG, l'anecdote prouve la POSSIBILITÉ, pas la PROBABILITÉ : la sociologie étudie la distribution (que deviennent les 9 999 ?) : l'application au débat public : quand un film ou une émission invite « la réussite par le travail », le biais structure le message : il semble « normal » de réussir, donc les échecs paraissent « anormaux » (et mérités) : c'est le pont parfait vers l'idéologie méritocratique : une copie qui articule survivor bias + légitimation de l'ordre a tout le chapitre.</div>"},
{"t": "Les mobilités sociales (SES — 1re)", "q": "Pour Didier Eribon (« Retour à Reims »), le transfuge de classe éprouve :", "c": ["une joie pure", "une continuité", "un enrichissement immédiat", "un déchirement : quitter son milieu d'origine change la langue, les références, et crée un sentiment de trahison et d'étrangeté"], "a": 3, "e": "La mobilité a un coût psychique et identitaire : le « devenu » n'appartient plus tout à fait à son monde d'origine ni au monde atteint.", "d": "<b>Le déchirement identitaire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le contenu de l'expérience (à citer précisément) : 1) la LANGUE : le transfuge adopte le vocabulaire et les manières de la classe atteinte (l'aisance en séminaire) et perd la fluidité du monde d'origine (le « parler » des copains d'enfance) : 2) LES RÉFÉRENCES : les goûts (opéra vs foot ?), les attentes (le rapport à l'argent, au temps, à l'autorité) divergent : 3) LA LOYAUTÉ : réussir, c'est « partir » : la famille peut le vivre comme un abandon (l'embarras des retours : ne plus savoir se tenir à table) : la portée sociologique : la mobilité n'est pas un simple déplacement SUR une échelle : c'est un changement de MONDE : cela explique pourquoi certains « refusent » l'ascension (l'auto-élimination : ne pas postuler aux CPGE « pas pour nous ») et pourquoi les politiques de « cordées » doivent aussi travailler la CONFIANCE et l'appartenance, pas seulement les cours : Eribon et Louis (La Classe) sont les deux références à mobiliser.</div>"},
{"t": "Les mobilités sociales (SES — 1re)", "q": "La massification scolaire a :", "c": ["considérablement augmenté le niveau d'études, MAIS hiérarchisé les filières (l'école favorise ET trie : « démocratisation ségrégative »)", "réduit le nombre de bacheliers", "fermé l'école", "supprimé les inégalités"], "a": 0, "e": "80 % d'une génération au bac (vs 5 % en 1950) : mais les filières d'excellence (CPGE, écoles) restent socialement déséquilibrées : l'ascenseur monte, les places dans le haut restent réservées.", "d": "<b>Plus d'élèves, mais hiérarchie interne</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les chiffres en deux colonnes : MASSIFICATION : 5 % de bacheliers en 1950, ~30 % en 1970, 80 % aujourd'hui : dans le supérieur : ~60-70 % d'une génération : SÉGRÉGATION INTERNE : les CPGE ne scolarisent que ~1 % d'une génération... et les enfants de cadres y sont ~x4-5 fois sur-représentés : les écoles d'ingénieurs et de commerce : des pourcentages similaires : les universités : massification mais goulot en L1 (taux d'échec 50-60 % dans certaines licences) : la formule de Dubet et Merle : « démocratisation ségrégative » : la démocratisation s'accompagne d'une redistribution des hiérarchies À L'INTÉRIEUR du système (le bac « ne vaut plus » ce qu'il valait : les diplômes se hiérarchisent autrement) : la conséquence : la course aux diplômes (inflation scolaire) : il en faut toujours plus pour la même position : c'est LA mise à jour sociologique du chapitre.</div>"},
{"t": "Les mobilités sociales (SES — 1re)", "q": "Le « capital social » (Bourdieu/Granovetter) :", "c": ["le réseau de relations mobilisable (connaissances, entraide, information) qui pèse sur les trajectoires", "l'argent à la banque", "la Sécurité sociale", "l'épargne retraite"], "a": 0, "e": "Un stage trouvé par un ami de la famille, un bail « de confiance », une info d'orientation : les réseaux inégaux transforment les mêmes diplômes en destins différents.", "d": "<b>Le réseau mobilisable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les deux apports à combiner : BOURDIEU : le capital social est une des trois capitaux (économique, culturel, social) qui se transmettent et se convertissent (un réseau s'obtient aussi par l'école, les clubs) : GRANOVETTER : la « force des liens faibles » : ce sont les connaissances LOINTAINES (pas les intimes) qui apportent les informations neuves d'emploi (les intimes savent ce que vous savez) : l'application concrète : 30-50 % des emplois se trouvent via le réseau (les « relations ») : les milieux favorisés ont des réseaux denses et légitimes (les stages dans les cabinets, les recommandations d'école) : les milieux populaires ont des réseaux solides mais restreints (l'information des « petits boulots ») : l'inégalité des réseaux est un DES mécanismes (invisible) de la reproduction — d'où les politiques de tutorat, de parrainage (Cordées), d'« affirmative action » à la française.</div>"},
{"t": "Les mobilités sociales (SES — 1re)", "q": "Une trajectoire de « déclassement » :", "c": ["impossible en France", "un mariage", "une mobilité descendante (occuper une position inférieure à celle de ses parents : chômage prolongé, emploi précaire de diplômés)", "une promotion"], "a": 2, "e": "Phénomène réel et croissant : les enfants d'employés et d'ouvriers qualifiés confrontés à la précarité, les diplômés surnuméraires (« déclassement scolaire » de l'emploi).", "d": "<b>Mobilité descendante</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les cas documentés : 1) le DECLASSEMENT INTERNE au salariat : des jeunes plus diplômés que leurs parents occupent des emplois MOINS qualifiés (le master en agence d'intérim : la « surqualification » ~15-20 % des actifs) : 2) les générations populaires frappées : la désindustrialisation (les emplois ouvriers stables remplacés par des services précaires) : les enfants d'ouvriers qualifiés intérimaires : 3) le déclassement SUBJECTIF : le sentiment de « régression » par rapport aux attentes (la promesse scolaire non tenue : Peugny) : pourquoi c'est important pour la copie : les analyses de mobilité parlent souvent d'« ascenseur », mais la sociologie récente (Chauvel, Peugny) documente le ralentissement intergénérationnel : certaines générations (nées 1950-60) ont monté, d'autres (nées 1970-80 dans certains milieux) DESCENDENT relativement : la société ouverte reste inégalitaire... et elle n'est pas irréversible.</div>"},
{"t": "Les mobilités sociales (SES — 1re)", "q": "L'idéologie méritocratique :", "c": ["est un fait scientifique", "légitime les positions acquises en les présentant comme méritées (et les échecs comme mérités aussi)", "concerne les rois", "a disparu"], "a": 1, "e": "« À chacun selon son mérite » : ce réduit l'écart moral entre les positions... et masque les héritages : fonction de justification de l'ordre social (les gagnants « le méritent »).", "d": "<b>Justifier l'ordre par le mérite</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'argument en deux temps : 1) la PROMESSE : « si tu travailles, tu réussiras » : socle de l'école républicaine, moteur d'effort (l'idéologie n'est pas « fausse » : elle ORIENTE les comportements) : 2) la LÉGITIMATION : si les positions sont méritées, alors les inégalités sont JUSTES (et les dominés « responsables » de leur sort : l' « auto-blame » documenté chez les décrocheurs) : les travaux à mobiliser : DURKHEIM (les idéaux qui légitiment les hiérarchies) : BOURDIEU et PASSERON (l'école fait croire à la sélection par le don alors qu'elle sélectionne par l'héritage) : DUBET (le « mythe » de l'école libératrice et sa crise : quand les élèves voient la promesse non tenue : désaffiliation) : SANDEL (La Tyrannie du mérite) : la nuance finale pour une très bonne copie : dire que la méritocratie est une idéologie NE SIGNIFIE PAS que le mérite n'existe pas : cela signifie qu'il est IMPOSSIBLE de le mesurer indépendamment des héritages — et c'est bien là tout le problème.</div>"},
{"t": "Les mobilités sociales (SES — 1re)", "q": "Les tables de « destin » et de « recrutement » répondent respectivement :", "c": ["à « d'où viennent ceux qui sont cadres ? » et « que deviennent les enfants d'ouvriers ? »", "à rien", "aux mariages et aux divorces", "au PIB et à l'inflation"], "a": 0, "e": "Destin = par origine, où aboutit-on : recrutement = par position atteinte, d'où vient-on : la même table lue dans les deux sens (mobilité observée).", "d": "<b>Destin : que deviennent-ils ? Recrutement : d'où viennent-ils ?</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la lecture à maîtriser (table croisée origine × position) : DESTIN : ligne « enfants d'ouvriers » : 10 % cadres, 20 % professions intermédiaires, 50 % employés/ouvriers... : RECRUTEMENT : colonne « cadres » : 50 % fils de cadres, 15 % fils d'employés, 10 % d'ouvriers... : les pièges de lecture classiques : 1) le DESTIN populaire paraît ouvert parce que les OUVRIERS étaient nombreux à l'origine (structure !) : 2) le RECRUTEMENT des cadres paraît « héréditaire » parce que les cadres sont devenus nombreux (structure, encore !) : 3) seul le rapport des chances (fluidité) neutralise les effets de taille : la règle d'or de la copie : TOUT commentaire chiffré d'une table de mobilité doit dire si l'on parle de destin, de recrutement ou de fluidité : sinon, la phrase est juste localement et fausse globalement (c'est l'exercice type de l'examen).</div>"},
{"t": "L'Union européenne et l'intégration économique (SES — 1re)", "q": "Le marché unique repose sur :", "c": ["l'interdiction de voyager", "quatre libertés de circulation (biens, services, capitaux, personnes) et des règles communes", "une seule liberté (biens)", "l'euro uniquement"], "a": 1, "e": "Acte unique (1986, appliqué 1993) : libre circulation + normes communes (une homologation vaut dans 27 pays).", "d": "<b>Les quatre libertés + règles communes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : ce que ça change concrètement : 1) BIENS : une machine agricole française se vend à Munich sans douane ni re-homologation : 2) SERVICES : un plombier ou un cabinet d'ingénieurs travaille à Milan (reconnaissance des qualifications : carte professionnelle européenne) : 3) CAPITAUX : ouvrir un compte à Amsterdam, investir à Varsovie : 4) PERSONNES : étudier (Erasmus : 15 M de bénéficiaires depuis 1987), travailler, vivre partout : le GAIN théorique : un marché de 450 M de consommateurs où l'entreprise atteint la taille efficace (économies d'échelle : produire en série pour toute l'Europe au lieu de 27 petites séries) : la CONTREPARTIE : concurrence accrue (chaque entreprise doit affronter 26 marchés rivaux) et normes communes imposées : c'est l'arbitrage fondamental que le programme demande de discuter.</div>"},
{"t": "L'Union européenne et l'intégration économique (SES — 1re)", "q": "La zone euro regroupe environ :", "c": ["20 pays (l'UE a 27 membres, mais tous n'ont pas l'euro : Danemark, Suède, Pologne... hors zone)", "27 pays", "tous les pays d'Europe", "10 pays"], "a": 0, "e": "Ne pas confondre : UE (27, politique et marché) ≠ zone euro (20, monnaie) ≠ Schengen (libre circulation sans contrôles : ~29 pays dont des non-UE).", "d": "<b>~20 pays dans la zone euro</b> (2024 : avec la Croatie entrée en 2023).<div class='ex-detail'><u>Exemple rédigé</u> : les trois cercles à ne jamais confondre (erreur classique sanctionnée) : 1) UNION EUROPÉENNE : 27 membres (marché unique, institutions, droit) : 2) ZONE EURO : 20 membres qui partagent la monnaie et la BCE (la Croatie est la 20e, 2023) : 3) ESPACE SCHENGEN : libre circulation SANS contrôles aux frontières intérieures (~29 pays, dont la Suisse, la Norvège, l'Islande — NON membres de l'UE !) : les exemples à retenir pour illustrer les écarts : l'Irlande : UE + euro, MAIS pas Schengen (contrôles conservés) : la Norvège : Schengen mais pas UE : le Danemark : UE + Schengen mais PAS euro (clause d'exemption) : la Pologne : UE, pas (encore) euro : ces cas montrent que l'Europe est un système d'INTEGRATION À LA CARTE par cercles — une précision qui enrichit immédiatement une copie.</div>"},
{"t": "L'Union européenne et l'intégration économique (SES — 1re)", "q": "Le budget de l'UE représente environ :", "c": ["25 % du PIB", "10 %", "50 %", "1 % du PIB européen"], "a": 3, "e": "~160-190 Md €/an : ~1 % du PIB de l'UE : à comparer aux ~50 % du PIB des budgets nationaux : l'UE n'est pas un État fédéral.", "d": "<b>~1 % du PIB</b> de l'UE.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison qui éclaire tout le débat : un État national prélève et dépense ~45-57 % du PIB (France : éducation, santé, retraites, armée) : l'UE ne gère que ~1 % (politique agricole ~1/3, cohésion/régions ~1/3, recherche + Erasmus + administration...) : la conséquence économique : en récession, un fédération comme les USA « stabilise » automatiquement (les régions en crise reçoivent plus de fédéraux qu'elles ne paient : ~30-40 % de stabilisation des chocs) : dans l'UE, PAS de budget fédéral significatif : chaque État gère sa crise avec ses seules ressources (d'où la brutalité des ajustements 2010-13 : la Grèce a due baisser ses dépenses de ~25 %) : les évolutions récentes : le fonds de relance NextGenerationEU (750 Md, emprunt COMMUN) est le premier pas vers un « bazooka » budgétaire européen — mais ponctuel : le débat « faut-il un vrai budget ? » reste ouvert.</div>"},
{"t": "L'Union européenne et l'intégration économique (SES — 1re)", "q": "Les critères du pacte de stabilité sont :", "c": ["inflation < 60 %", "croissance > 10 %", "chômage < 3 %", "déficit public < 3 % du PIB et dette < 60 % du PIB"], "a": 3, "e": "Règles de Maastricht surveillées par la Commission (sanctions possibles) : réformées 2024 (prise en compte des dépenses d'investissement, trajectoires pays par pays).", "d": "<b>Déficit &lt; 3 % : dette &lt; 60 %</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la logique et la critique à connaître ensemble : LOGIQUE : une monnaie commune exige la confiance : si un État s'endette démesurément, il menace toute la zone (contagion 2010) : les règles disciplinent (l'équivalent du « colocataire qui paie sa part ») : CRITIQUES : 1) les règles sont ARBITRAIRES (pourquoi 3 et 60 ? des chiffres de négociation de Maastricht, pas des lois économiques) : 2) elles sont PROCYCLIQUES (en récession, les recettes chutent : respecter 3 % impose de COUPER en pleine crise : l'austérité 2010-13 : le multiplicateur budgétaire &gt;1 en crise a aggravé les récessions — le mea culpa du FMI en 2012-13) : 3) elles ne sont pas symétriques (l'Allemagne en excédent importe trop peu : personne ne la sanctionne) : la réforme 2024 : des trajectoires individuelles sur 4-7 ans, plus de place pour l'investissement : la leçon : les règles budgétaires sont un choix POLITIQUE déguisé en arithmétique — un angle parfait en dissertation.</div>"},
{"t": "L'Union européenne et l'intégration économique (SES — 1re)", "q": "« Whatever it takes » (Mario Draghi, 2012) :", "c": ["la fin de l'euro", "un match de football", "un traité commercial", "la promesse de la BCE de tout faire pour préserver l'euro, qui a fait retomber les taux d'emprunt des pays en crise"], "a": 3, "e": "Trois mots ont suffi : la BCE a affirmé qu'elle racheterait la dette si nécessaire : les marchés ont cessé de douter (preuve de la puissance des anticipations et de la « parole » d'une banque centrale).", "d": "<b>La BCE sauve l'euro par la parole</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le contexte : juillet 2012, la zone euro est au bord de l'éclatement : l'Espagne emprunte à 7,5 %, la Grèce à 30 %, la fuite des capitaux se généralise : la phrase (à Londres, 26 juillet) : « dans les limites de son mandat, la BCE est prête à faire tout ce qui est nécessaire pour préserver l'euro. Et croyez-moi, ce sera suffisant » : l'effet : les taux espagnols et italiens ont DÉCROCHÉ en quelques semaines... avant même que le programme (OMT) ne soit utilisé : la leçon économique : une banque centrale crédible peut stabiliser par ANTICIPATION (les investisseurs savent qu'ils ne gagneront pas contre la BCE : le pari perd son intérêt) : la suite : le QE massif 2015-2022 a concrétisé cette puissance : la question démocratique qui accompagne TOUJOURS ce point (pour la copie) : une institution NON ÉLUE dispose d'un pouvoir considérable — c'est l'autre face du chapitre monnaie (indépendance) et du chapitre UE (déficit démocratique).</div>"},
{"t": "L'Union européenne et l'intégration économique (SES — 1re)", "q": "Selon la théorie des zones monétaires optimales (Mundell), une monnaie commune exige :", "c": ["un marché commun", "la même langue", "les mêmes lois du travail partout", "une mobilité du travail, des chocs symétriques et des transferts budgétaires (sinon l'ajustement passe par les salaires et le chômage)"], "a": 3, "e": "La zone euro : mobilité du travail faible (~5 % des Européens vivent dans un autre pays), chocs asymétriques, pas de budget fédéral : une zone « sous-optimale » qui compense par la solidarité de crise.", "d": "<b>Mobilité + chocs symétriques + transferts</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme du problème : quand un choc frappe UN pays (ex. : bulle immobilière espagnole 2008), il faudrait dévaluer SA monnaie (redevenir compétitif) : avec l'euro, IMPOSSIBLE : l'ajustement passe par : baisse des salaires (difficile : « dévaluation interne » : l'Espagne l'a fait 2012-15 : −10 % de coût salarial... au prix du chômage à 26 %) ou l'émigration (l'Espagne a perdu des jeunes qualifiés) : les conditions qui rendraient l'union supportable : MOBILITÉ (les Américains déménagent massivement entre États : les Européens ~5x moins : langue, droits à la retraite, reconnaissance des diplômes) et TRANSFERTS (les USA versent automatiquement aux régions frappées) : l'UE progresse sur ces deux plans (reconnaissance des qualifications, fonds de cohésion, SURE, NGEU) mais lentement : la conclusion honnête : la zone euro N'ÉTAIT PAS optimale en 1999 — elle l'est devenue PARTIELLEMENT, en construisant des institutions en réponse aux crises : c'est la thèse de l'UE par crises.</div>"},
{"t": "L'Union européenne et l'intégration économique (SES — 1re)", "q": "Le Brexit (2016-2020) a montré économiquement :", "c": ["aucun effet", "un coût mesurable : baisse du commerce UK-UE (~15-30 %), investissements plus faibles, économie britannique plus petite que la trajectoire contrefactuelle", "que sortir de l'UE enrichit", "la fin de l'UE"], "a": 1, "e": "Le « contre-exemple » de l'intégration : les fluidités perdues (déclarations, contrôles) pèsent plus que les accords bilatéraux signés depuis.", "d": "<b>Un coût réel et mesuré</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les chiffres à citer (Banque d'Angleterre, OBR, études académiques) : 1) COMMERCE : les échanges de biens UK-UE ont chuté de ~15-30 % par rapport à la tendance (les PME exportatrices ont simplement ABANDONNÉ : les formalités coûtent plus que la marge) : 2) INVESTISSEMENT : les entreprises anticipaient l'accès au marché unique pour localiser leurs usines au Royaume-Uni (l'automobile japonaise) : sans cet accès, les projets ont migré : 3) FINANCE : Amsterdam et Paris ont capté des parts des marchés d'actions londoniens : 4) GLOBAL : le PIB britannique ~3-5 % inférieur à la trajectoire sans Brexit : la nuance politique (pour ne pas être caricatural) : les partisans ont obtenu des gains SOUVERAINS (contrôle des règles, immigration réduite, accords propres) : la leçon SES : les gains de l'intégration sont DIFFUS et INVISIBLES (personne ne fête les camions qui passent la frontière sans contrôle) : les coûts de la désintégration sont DIFFUS aussi... mais cumulatifs : l'Europe est une infrastructure — on ne remarque une infrastructure que quand elle manque.</div>"},
{"t": "L'Union européenne et l'intégration économique (SES — 1re)", "q": "La PAC (politique agricole commune) :", "c": ["interdit l'agriculture", "concerne la pêche uniquement", "taxe les agriculteurs", "soutient les revenus agricoles et sécurise la production (historiquement ~1/3 du budget UE)"], "a": 3, "e": "Née en 1962 : objectifs (prix stables, sécurité alimentaire, revenus) : critiquée (surproductions des années 80, dumping sur les marchés africains) : réformée (aides découplées, verdissement) : contestée par les agriculteurs (2024).", "d": "<b>Soutien européen à l'agriculture</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'histoire en trois actes : 1) LES TRENTE GLORIEUSES AGRICOLES (1962-1984) : prix garantis d'achat ⟹ production explose, la France devient exportatrice : CONTREPARTIE : « lakes de lait, montagnes de beurre » (surproductions achetées par l'UE) : 2) LA DISCIPLINE (1984-2003) : quotas laitiers, gel des terres, baisse des prix garantis : 3) LE VERDISSEMENT (2003-2024) : aides découplées (paiement à l'hectare, pas à la production : moins d'incitation à produire toujours plus) + conditions environnementales : les critiques contemporaines à mobiliser : les aides vont ~20 % aux plus gros (concentration), les accords de libre-échange (Mercosur) exposent les élevages, les normes environnementales (distance riverains, pesticides) exaspèrent une partie du monde agricole (les tracteurs de 2024) : la PAC illustre TOUT le chapitre : une politique commune, des arbitrages (prix bas pour les consommateurs vs revenus agricoles vs environnement), des gagnants et des perdants qui se mobilisent — la politique économique est CONFLICTUELLE par nature.</div>"},
{"t": "L'Union européenne et l'intégration économique (SES — 1re)", "q": "Le « déficit démocratique » de l'UE désigne :", "c": ["l'absence d'élections", "l'immigration", "un décalage entre le pouvoir des exécutifs/technocrates (Commission, Conseil) et le contrôle parlementaire/citoyen (faible mobilisation, complexité)", "le déficit budgétaire"], "a": 2, "e": "Le Parlement est élu (1979) et co-législateur (Lisbonne), mais la Commission propose, le Conseil (ministres) décide à huis clos, l'abstention aux européennes reste forte (~50 %) : la « bruxellisation » alimente la contestation.", "d": "<b>Pouvoir technique vs contrôle citoyen</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'argument en deux volets (à exposer équitablement) : CE QUI EST VRAI : 1) la Commission (non élue) a le MONOPOLE de l'initiative législative : 2) le Conseil (ministres nationaux) légifère souvent à huis clos : 3) les élections européennes sont « de second ordre » (abstention ~50 %, votes nationaux-sanctions) : 4) la BCE, pivot de la zone euro, n'est soumise à AUCUN suffrage : CE QUI NUANCE : 1) le Parlement élu au SU (1979) co-décide sur ~95 % des textes (Lisbonne) : 2) chaque règle a été RATIFIÉE par les 27 parlements nationaux : 3) le contrôle existe (Cour des comptes, médiateur, saisines) : les propositions de réponse (pour enrichir la copie) : « parlementarisation » (groupe politique transnational, Spitzenkandidat), conventions citoyennes (2022-23 : 800 tirés au sort), extension du vote à la majorité qualifiée : la question de fond : peut-on démocratiser un objet qui n'est ni un État ni une confédération ? Le débat EST le sujet.</div>"},
{"t": "L'Union européenne et l'intégration économique (SES — 1re)", "q": "L'euro a pour les entreprises notamment l'avantage de :", "c": ["financer les retraites", "supprimer la concurrence", "supprimer les coûts et risques de change dans la zone (plus de commissions, plus de couverture)", "augmenter les impôts"], "a": 2, "e": "Un prix unique, des comparaisons directes (arbitrages des clients), des comptes simplifiés : MAIS plus de dévaluation possible en cas de choc propre.", "d": "<b>Fini le risque de change</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le vécu concret d'un exportateur français (avant/après) : AVANT 1999 : vendre en Allemagne = facturer en marks : le client paie à 60 jours : si le mark baisse de 5 % entre-temps, la marge fond : il faut COUVRIR (contrats d'assurance de change : ~0,5-1 % de frais) : APRES 1999 : facturation en euros : zéro risque, zéro commission, comptabilité unique : en outre : la TRANSPARENCE des prix (un même produit se compare directement entre Paris, Berlin et Milan : la pression concurrentielle s'accroît — bon pour les consommateurs) : la CONTREPARTIE (à toujours citer) : l'outil du change disparaît : un choc spécifique à la France ne peut plus être corrigé par une dévaluation : l'ajustement passe par les coûts (salaires) : c'est le lien avec Mundell (question précédente) : un même objet (l'euro) est une facilité commerciale ET une contrainte macroéconomique — la double lecture est la marque d'une bonne copie.</div>"},
{"t": "Croissance, développement et inégalités (SES — Term)", "q": "La croissance économique se mesure par :", "c": ["l'augmentation du patrimoine des ménages", "l'augmentation du PIB en valeur (prix courants)", "la hausse du niveau de vie ressenti", "la variation du PIB en volume (à prix constants)"], "a": 3, "e": "On retire l'effet des prix (inflation) : le PIB en volume mesure la production réelle.", "d": "<b>Volume, pas valeur</b>.<div class='ex-detail'><u>Exemple rédigé</u> : si le PIB en valeur passe de 100 à 106 avec une inflation de 4 %, la croissance réelle est ≈ 2 % (106/1,04 ≈ 102) : c'est ce chiffre qui dit si on produit PLUS ou seulement si les prix ont monté : en France, le PIB volume a été multiplié par ~4 depuis 1950 (les Trente Glorieuses en font l'essentiel) : la distinction valeur/volume est LA question de rigueur à ne jamais rater en SES.</div>"},
{"t": "Croissance, développement et inégalités (SES — Term)", "q": "Le produit intérieur brut (PIB) est égal à :", "c": ["la somme des dépenses des ménages", "la somme des valeurs ajoutées des unités productives (approche production)", "la richesse totale du pays", "le total des salaires versés"], "a": 1, "e": "PIB = Σ valeurs ajoutées (production − consommations intermédiaires) : égal aussi à la somme des dépenses finales (C + I + G + X − M).", "d": "<b>Trois approches, un même total</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un boulanger achète 1 000 € de farine, vend 3 500 € de pain : sa valeur ajoutée = 2 500 € : on additionne les VA de toutes les entreprises sans compter deux fois la farine (sinon on surestimerait la production) : l'approche dépenses retrouve le même PIB (consommation + investissement + dépenses publiques + solde extérieur) : c'est la comptabilité nationale, cohérente par construction — utile en EC comme en dissertation.</div>"},
{"t": "Croissance, développement et inégalités (SES — Term)", "q": "Selon Solow, à long terme, la croissance provient surtout de :", "c": ["l'augmentation de la population active", "le progrès technique (productivité globale des facteurs)", "l'accumulation du capital physique", "les exportations"], "a": 1, "e": "L'accumulation de capital bute sur des rendements décroissants : seul le progrès technique entretient la croissance de long terme.", "d": "<b>Solow : le progrès technique en moteur</b>.<div class='ex-detail'><u>Exemple rédigé</u> : ajouter des machines augmente la production, mais chaque machine supplémentaire rapporte moins (rendements décroissants) : l'économie converge vers un état stationnaire — SAUF si la productivité globale des facteurs progresse (innovations, organisation, diffusion des technologies) : historiquement, la PGF explique l'essentiel de la croissance française de long terme — c'est pour ça que la R&D, l'éducation et la diffusion de l'innovation (Schumpeter : destruction créatrice) sont au cœur des politiques de croissance.</div>"},
{"t": "Croissance, développement et inégalités (SES — Term)", "q": "L'IDH (indice de développement humain) combine :", "c": ["patrimoine, santé et environnement", "croissance, inégalités et pauvreté", "PIB/hab, inflation, chômage", "espérance de vie, durée d'éducation et revenu par habitant"], "a": 3, "e": "L'IDH de l'ONU (entre 0 et 1) ajoute la santé et l'éducation au revenu : le développement dépasse l'économique.", "d": "<b>Développement ≠ croissance</b>.<div class='ex-detail'><u>Exemple rédigé</u> : deux pays peuvent avoir le même PIB/hab et des IDH très différents si l'un a des écoles et hôpitaux publics efficaces (ex. : Cuba a un IDH élevé relativement à son revenu ; certains pétro-États l'inverse) : Sen pousse plus loin : le développement = expansion des CAPACITÉS (pouvoir faire des choix : se nourrir, apprendre, participer) : en EC, citer l'IDH et Sen transforme une réponse descriptive en réponse analytique.</div>"},
{"t": "Croissance, développement et inégalités (SES — Term)", "q": "Le coefficient de Gini vaut 0,6 dans le pays A et 0,25 dans le pays B :", "c": ["le pays A a des inégalités de revenus plus fortes (Gini plus proche de 1)", "le pays B a plus d'inégalités", "on ne peut rien conclure", "le pays A est plus égalitaire"], "a": 0, "e": "Gini va de 0 (égalité parfaite) à 1 (une personne concentre tout) : 0,6 = inégalités fortes.", "d": "<b>Lire un Gini</b>.<div class='ex-detail'><u>Exemple rédigé</u> : France ≈ 0,30 (avant redistribution ~0,45 !) ; Brésil ou Afrique du Sud ≈ 0,5-0,6 : la lecture : dans le pays A, la distribution des revenus est très concentrée (courbe de Lorenz très éloignée de la diagonale d'égalité) : ATTENTION : le Gini ne dit pas OÙ sont les inégalités (haut ou bas de la distribution) — compléter par le rapport interdéciles D9/D1 : la bonne méthode = toujours croiser plusieurs indicateurs (Gini + D9/D1 + taux de pauvreté).</div>"},
{"t": "Croissance, développement et inégalités (SES — Term)", "q": "Les inégalités de patrimoine sont généralement :", "c": ["du même ordre que celles de revenus", "inexistantes en France", "plus faibles que les inégalités de revenus", "plus fortes que les inégalités de revenus (le patrimoine est très concentré)"], "a": 3, "e": "Le patrimoine est bien plus concentré que les revenus : en France, les 10 % les plus riches détiennent environ la moitié du patrimoine total.", "d": "<b>Stock plus concentré que flux</b>.<div class='ex-detail'><u>Exemple rédigé</u> : revenus : les 10 % les plus aisés gagnent ~4-5 fois les 10 % les plus modestes (D9/D1 ≈ 3 après redistribution) : patrimoine : les 10 % les plus aisés possèdent ~50 % du total, les 50 % les plus modestes ~5-7 % : pourquoi cet écart : le patrimoine s'accumule (héritages, épargne, valorisation immobilière et boursière) et Piketty montre que r &gt; g entretient cette concentration : d'où le débat sur l'ISF/IFI et la fiscalité successorale — un exemple d'actualité par excellence pour la copie.</div>"},
{"t": "Croissance, développement et inégalités (SES — Term)", "q": "Selon Piketty (Le Capital au XXIe siècle), la concentration des patrimoines s'explique par :", "c": ["la progression de l'IDH", "la baisse de l'héritage", "le rendement du capital durablement supérieur au taux de croissance (r &gt; g)", "l'égalisation des salaires"], "a": 2, "e": "Quand r &gt; g, les revenus du capital croissent plus vite que l'économie : les patrimoines existants se concentrent.", "d": "<b>r &gt; g</b>.<div class='ex-detail'><u>Exemple rédigé</u> : sur longue période, le rendement moyen du capital (r ≈ 4-5 %) dépasse la croissance (g ≈ 1-2 %) : un patrimoine de 1 M€ rapportant 4 % gagne 40 000 €/an, davantage que le revenu du travail épargnable de la plupart des ménages : l'héritage redevient central (en France, l'héritage agrégé ≈ 15 % du PIB annuel) : la thèse nourrit le débat sur l'impôt sur la fortune et la transmission — à citer avec précaution (le lien r &gt; g → concentration est discuté par des économistes).</div>"},
{"t": "Croissance, développement et inégalités (SES — Term)", "q": "Le taux de pauvreté monétaire en Europe est défini par :", "c": ["la part des ménages sans patrimoine", "la part de la population vivant sous 60 % du revenu médian", "la part des chômeurs", "la part des ménages ne pouvant pas se nourrir"], "a": 1, "e": "Pauvreté relative : seuil à 60 % du revenu médian (≈ 1 200 €/mois pour une personne seule en France).", "d": "<b>Pauvreté relative, pas absolue</b>.<div class='ex-detail'><u>Exemple rédigé</u> : en France, ~14 % de la population est sous ce seuil (≈ 9 millions de personnes) : la moitié des pauvres ont un emploi (working poor) ou une retraite : d'où l'importance de la redistribution (RSA, primes d'activité, prestations logement) qui réduit fortement la pauvreté mesurée : argument clé : le taux de pauvreté AVANT/après transferts montre l'efficacité du modèle social — et le RSA étudiant ou le non-recours (25-30 % des bénéficiaires potentiels ne demandent pas) enrichissent toute EC sur la pauvreté.</div>"},
{"t": "Croissance, développement et inégalités (SES — Term)", "q": "Selon Acemoglu et Robinson, la différence de développement entre nations s'explique d'abord par :", "c": ["la géographie et le climat", "le hasard des ressources naturelles", "la nature des institutions (extractives vs inclusives)", "la culture religieuse"], "a": 2, "e": "Les institutions inclusives (droits de propriété sécurisés, concurrence, participation politique) soutiennent l'innovation et la croissance durables.", "d": "<b>Institutions, pas géographie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la Corée du Nord et la Corée du Sud : même peuple, même géographie, destins opposés — au Sud, institutions inclusives (propriété, élection, marché) → croissance ; au Nord, institutions extractives (élite qui prélève) → stagnation : la leçon : le rattrapage des pays pauvres n'est PAS automatique (contre la thèse de la convergence naturelle) : il demande des institutions crédibles, de l'éducation et de l'ouverture maîtrisée — un argument puissant en dissertation sur « le sous-développement est-il une faute de gestion ? ».</div>"},
{"t": "Croissance, développement et inégalités (SES — Term)", "q": "Une limite du PIB comme indicateur de bien-être :", "c": ["il inclut l'économie souterraine", "il ne mesure que les exportations", "il ne compte pas le travail domestique, le bénévolat ni les dégâts environnementaux", "il surestime la production industrielle"], "a": 2, "e": "Le PIB ignore les activités non marchandes et ne déduit pas les externalités négatives.", "d": "<b>Les angles morts du PIB</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une personne qui garde ses enfants fait « rien » pour le PIB ; si elle les confie à une crèche payante, le PIB augmente — alors que la production réelle est identique : idem pour la pollution (non déduite) et les dépenses défensives (dépollution, réparation) comptées positivement : d'où les alternatives : IDH, empreinte écologique, indicateurs de bien-être (OCDE), comptabilité environnementale — mais aucune ne s'impose : le PIB reste l'étalon pratique ; la bonne copie dit POURQUOI on le garde et POURQUOI il ne suffit pas.</div>"},
{"t": "Mondialisation et commerce international (SES — Term)", "q": "Selon Ricardo, un pays a intérêt à se spécialiser dans la production pour laquelle :", "c": ["sa production est la plus protégée", "son coût d'opportunité est le plus faible (même s'il est moins bon partout)", "il est le meilleur du monde en valeur absolue", "sa main-d'œuvre est la moins chère"], "a": 1, "e": "Avantage comparatif : on compare les coûts d'opportunité internes — le désavantage le plus faible suffit à gagner à l'échange.", "d": "<b>Ricardo, pas Smith</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le pays X produit mieux le vin ET le drap que le pays Y : mais produire 1 baril de vin « coûte » au pays X seulement 0,8 mètre de drap, alors qu'au pays Y il « coûte » 2 mètres : X a l'avantage comparatif sur le vin (coût d'opportunité le plus faible), Y sur le drap : chacun se spécialise là où il renonce le moins : l'échange aux bons prix enrichit les DEUX pays — voilà pourquoi le libre-échange n'est pas un match de force mais une coopération (la spécialisation, elle, reste risquée : dépendance, vulnérabilité aux chocs).</div>"},
{"t": "Mondialisation et commerce international (SES — Term)", "q": "Les chaînes de valeur mondiales désignent :", "c": ["les flux financiers internationaux", "les accords de libre-échange", "la vente de produits importés", "la fragmentation de la production entre plusieurs pays (conception, composants, assemblage, distribution)"], "a": 3, "e": "Chaque étape de production est localisée là où elle est la plus efficace : l'iPhone en est l'exemple type.", "d": "<b>Produire ensemble, à distance</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un smartphone : conception en Californie, puces à Taïwan, écrans en Corée, assemblage en Chine, logiciels en Inde, marketing mondial : la « valeur ajoutée » traverse dix frontières avant le client : conséquence : les statistiques d'exportation en brut (gross) surévaluent le pays d'assemblage final (la Chine n'exporte que quelques % de la valeur d'un iPhone assemblé) : d'où la comptabilité en valeur ajoutée (TiVA, OCDE) — un raffinement apprécié dans une EC sur « le commerce mesure-t-il encore des pays ? ».</div>"},
{"t": "Mondialisation et commerce international (SES — Term)", "q": "Selon le théorème de Stolper-Samuelson, l'ouverture au commerce :", "c": ["augmente la rémunération du facteur abondant et réduit celle du facteur rare", "n'a aucun effet sur les revenus internes", "enrichit tous les facteurs de production", "appauvrit tous les pays"], "a": 0, "e": "L'échange profite au facteur abondant (travail peu qualifié dans les émergents, capital qualifié dans les riches) et pénalise le facteur rare.", "d": "<b>Des gagnants et des perdants internes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : aux États-Unis, le travail peu qualifié est le facteur rare face à l'offre mondiale de travail (Chine, Mexique) : l'ouverture aux importations concurrence les bas salaires américains → inégalités croissantes (les régions exposées aux importations chinoises ont perdu durablement emplois et salaires — les études sur le « China shock » documentent des pertes localisées et persistantes) : en Chine, symétriquement, les salaires industriels ont fortement augmenté : la morale SES : le libre-échange crèe des gains à l'échelle des PAYS mais exige redistribution et formation à l'échelle des PERSONNES.</div>"},
{"t": "Mondialisation et commerce international (SES — Term)", "q": "Un argument du protectionnisme :", "c": ["protéger une industrie naissante ou l'emploi national en attendant la mise à niveau (List)", "il augmente la concurrence", "il réduit les représailles commerciales", "les prix à la consommation baissent"], "a": 0, "e": "List (XIXe) : les industries naissantes ont besoin d'être protégées pour atteindre la taille critique — l'Allemagne et les USA l'ont fait.", "d": "<b>Industrie naissante</b>.<div class='ex-detail'><u>Exemple rédigé</u> : au XIXe, l'Allemagne et les États-Unis ont protégé leur industrie naissante (droits de douane élevés) avant de devenir les champions du libre-échange — l'argument de List : les avantages comparatifs ne sont pas DONNÉS, ils se CONSTRUISENT (on peut créer un avantage futur dans l'aéronautique ou les semi-conducteurs) : contre-argument classique : la protection déincite à innover (rentes de situation, conso captive) et déclenche des représailles : la guerre commerciale USA-Chine de 2018-2020 a fait perdre aux deux : agriculture américaine pénalisée par les représailles, consommateurs américains payant plus — le débat est empirique, pas religieux.</div>"},
{"t": "Mondialisation et commerce international (SES — Term)", "q": "Les firmes multinationales (FMN) :", "c": ["réalisent la majorité de la production mondiale", "ne participent pas au commerce international", "sont surtout des PME", "représentent environ un tiers de la production mondiale et l'essentiel des exportations"], "a": 3, "e": "Les FMN coordonnent les chaînes de valeur mondiales : leurs filiales et sous-traitants dominent les échanges.", "d": "<b>Le commerce, affaire de firmes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une multinationale comme Apple : conçoit, sous-traite, distribue mondialement : une part importante du commerce mondial est un commerce INTRAFIRME (entre filiales de la même entreprise — prix de transfert) : cela explique aussi l'enjeu fiscal : en déplaçant les bénéfices par les prix internes, les FMN optimisent leurs impôts (l'accord mondial de 2021 vise un minimum de 15 % et une réallocation des bénéfices) : pour la copie : dire que « le commerce international est d'abord un commerce organisé PAR les firmes » montre qu'on a dépassé l'image des pays qui s'échangent des ballots.</div>"},
{"t": "Mondialisation et commerce international (SES — Term)", "q": "La stratégie de spécialisation d'un pays présente le risque de :", "c": ["ne rien pouvoir exporter", "perdre tous ses partenaires", "réduire son PIB automatiquement", "une dépendance (mono-producteur, vulnérabilité aux chocs de prix)"], "a": 3, "e": "Un pays mono-exportateur (pétrole, cacao, cuivre) dépend des cours mondiaux qu'il ne contrôle pas.", "d": "<b>La malédiction du mono-produit</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un pays exportant 80 % de pétrole : quand le baril passe de 100 $ à 40 $, ses recettes publiques s'effondrent avec lui (budgets, salaires, investissement) — le Venezuela en a fait les frais : et la spécialisation dans les matières premières risque la « maladie hollandaise » (l'entrée de devises fait monter la monnaie, ruine les autres secteurs exportateurs) : c'est pourquoi l'industrialisation par étapes (Asie de l'Est : Corée, Taïwan) a privilégié la DIVERSIFICATION progressive — un argument anti-spécialisation à garder en tête derrière Ricardo.</div>"},
{"t": "Mondialisation et commerce international (SES — Term)", "q": "Le théorème d'Heckscher-Ohlin-Samuelson prédit que :", "c": ["les pays identiques échangent beaucoup", "le commerce disparaît avec le développement", "les pays riches exportent de la main-d'œuvre", "chaque pays exporte les biens qui utilisent intensivement son facteur de production abondant"], "a": 3, "e": "Factorabondance : pays abondant en travail → biens labor-intensifs ; pays abondant en capital → biens capitalistiques.", "d": "<b>L'intuition HOS</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le Bangladesh, abondant en main-d'œuvre, exporte du textile (production à fort contenu de travail) : l'Allemagne, abondante en capital et travail qualifié, exporte machines et automobiles complexes : le TEST empirique (paradoxe de Leontief, 1953 : les exportations américaines étaient plus labor-intensives que prévu) a nourri les raffinements (différenciation des qualités de travail, technologies) : en EC, HOS sert à expliquer pourquoi l'ouverture tire les salaires peu qualifiés des émergents et pèse sur ceux des pays riches.</div>"},
{"t": "Mondialisation et commerce international (SES — Term)", "q": "La « maladie hollandaise » désigne :", "c": ["la délocalisation des industries", "une épidémie économique", "un déficit public chronique", "l'effet d'un afflux de devises (ressources naturelles) qui apprécie la monnaie et pénalise les autres exportations"], "a": 3, "e": "Pays-Bas années 1960 (gaz naturel) : les exportations manufacturières souffraient de la monnaie renforcée.", "d": "<b>Les devises qui tuent l'industrie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un pays découvre du gaz et exporte massivement : la demande de sa monnaie augmente → elle s'apprécie → ses textiles et machines deviennent chers à l'étranger → l'industrie exportatrice décline, l'emploi manufacturier est détruit (Pays-Bas 1960s : cas fondateur) : les remèdes discutés : fonds souverains pour lisser les recettes (Norvège), investir dans le capital humain et la diversification : c'est un exemple parfait de spécialisation dommageable — le contrepoint du gagnant-gagnant de Ricardo, à utiliser en dissertation plan III.</div>"},
{"t": "Mondialisation et commerce international (SES — Term)", "q": "L'OMC (Organisation mondiale du commerce) a pour rôle de :", "c": ["gérer la balance des paiements", "prêter aux pays en difficulté", "élaborer et faire respecter les règles du commerce entre les pays (négociations, arbitrage des différends)", "fixer les taux de change"], "a": 2, "e": "L'OMC encadre les règles de l'ouverture et arbitre les litiges depuis 1995 (successeur du GATT).", "d": "<b>L'arbitre du commerce</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un différend (ex. : subventions à l'aéronautique — Boeing/Airbus, l'un des plus longs contentieux) : plainte, panel d'experts, appel, sanctions autorisées : SAUF que depuis 2019, l'organe d'appel est bloqué (les USA bloquent les nominations des juges) : le système dérive vers des rapports de force bilatéraux — l'UE a créé un mécanisme d'appel provisoire avec une quinzaine de pays : en copie : montrer que le multilatéralisme est fragilisé donne du relief actuel (géoéconomie, RCEP, accords régionaux en croissance).</div>"},
{"t": "Mondialisation et commerce international (SES — Term)", "q": "Une délocalisation est :", "c": ["une migration de travailleurs", "une exportation de services", "un flux financier boursier", "un transfert d'activité de production vers l'étranger (réimplantation d'une unité productive)"], "a": 3, "e": "Délocaliser = déplacer la production à l'étranger ; s'oppose à la simple externalisation (sous-traitance, y compris domestique).", "d": "<b>Délocalisation, externalisation, IDE</b>.<div class='ex-detail'><u>Exemple rédigé</u> : externaliser = confier une tâche à un sous-traitant (peut être dans le pays) : délocaliser = fermer l'atelier national et produire à l'étranger (un IDE sortant, mesurable dans la balance des paiements) : les délocalisations vers l'Asie ont détruit des emplois industriels français (textile, électronique) mais en créer aussi indirectement (importations bonifiées, spécialisation) : chiffre utile : l'industrie représente ~10-13 % des emplois en France contre ~25 % en Allemagne : le sujet reste sensible — une EC solide distingue précisément les trois notions (délocalisation ≠ externalisation ≠ IDE).</div>"},
{"t": "Politiques économiques : relance, rigueur et régulation (SES — Term)", "q": "Une politique conjoncturelle vise à :", "c": ["augmenter la population active", "modifier la structure de l'économie à long terme", "fixer les taux de change", "agir à court terme sur la demande globale pour lisser le cycle"], "a": 3, "e": "Conjoncturel = court terme (relance/rigueur budgétaire, taux monétaires) ; structurel = long terme (offre, institutions).", "d": "<b>Cycle vs structure</b>.<div class='ex-detail'><u>Exemple rédigé</u> : face à une récession : conjoncturel → l'État commande des travaux publics, la BCE baisse ses taux (agir MAINTENANT sur la demande) : structurel → réformer l'assurance chômage, la formation, la concurrence (agir sur les capacités de long terme) : une EC bien menée classe TOUJOURS les mesures proposées dans l'une des deux cases — c'est la première question à se poser devant un sujet de politique économique.</div>"},
{"t": "Politiques économiques : relance, rigueur et régulation (SES — Term)", "q": "Le multiplicateur keynésien est d'autant plus élevé que :", "c": ["la propension à consommer est élevée (k = 1/(1−c))", "la propension à consommer est faible", "les taux d'intérêt sont élevés", "les importations sont fortes"], "a": 0, "e": "Chaque revenu distribué est re-dépensé : avec c = 0,8, k = 5 (avant fuites : importations, impôts, épargne).", "d": "<b>La machine à vagues</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'État verse 100 à des entreprises de BTP : salaires, fournisseurs : si 80 % sont re-dépensés (c = 0,8), 80 deviennent à leur tour revenu, puis 64, puis 51,2... la somme = 100/(1−0,8) = 500 : MAIS en vrai : fuites (20-35 % du revenu partent en importations en France), fiscalité, épargne de précaution : multiplicateur réel ≈ 1-1,5 en normal, 2+ en grande récession : le chiffre exact importe moins que la LOGIQUE (chaque tour de dépense ajoute de la demande) et les conditions (plus fort quand les taux sont bas et l'économie en sous-emploi).</div>"},
{"t": "Politiques économiques : relance, rigueur et régulation (SES — Term)", "q": "L'effet d'éviction désigne :", "c": ["la baisse de l'épargne publique", "la hausse des exportations", "l'expulsion des importations", "la baisse de l'investissement privé causée par la hausse des taux due aux besoins de financement de l'État"], "a": 3, "e": "L'État emprunte massivement → pression sur les taux → le crédit privé devient plus cher → l'investissement des entreprises est « évincé ».", "d": "<b>Quand l'État chasse le privé</b>.<div class='ex-detail'><u>Exemple rédigé</u> : relance de 50 Md€ financée par émission d'obligations : la demande de fonds prêtables augmente → taux à 10 ans montent (ex. : de 1 % à 3 %) → une usine qui hésitait à emprunter renonce (le coût du capital a doublé) : l'éviction est faible quand la BCE absorbe (QE, taux zéro — les années 2020 en ont été l'illustration inverse : « whatever it takes » et taux bas = pas d'éviction malgré les déficits) : elle est forte quand la dette inquiète les marchés (Italie 2011 : taux à 7 %) — tout l'art du diagnostic : regarder le niveau de taux AVANT de conclure.</div>"},
{"t": "Politiques économiques : relance, rigueur et régulation (SES — Term)", "q": "L'objectif principal de la BCE est :", "c": ["le plein emploi", "la défense de l'euro sur les marchés", "la stabilité des prix (inflation ≈ 2 %)", "la baisse de la dette publique"], "a": 2, "e": "La BCE vise 2 % d'inflation à moyen terme ; le soutien aux politiques générales n'est que secondaire.", "d": "<b>Un seul patron : les prix</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 2021-2023 : l'inflation passe de ~2 % à 10 % (énergie, tensions d'offre) : la BCE monte son taux de dépôt de −0,5 % à 4 % : le crédit ralentit, la demande se refroidit, l'inflation redescend vers 2-3 % : le coût : risque de récession et pertes sur les actifs achetés pendant le QE : le débat (faire baisser l'inflation vite, ou protéger l'emploi ?) est exactement celui qui traverse les comités de la BCE — une EC récente trouve ici tous ses points.</div>"},
{"t": "Politiques économiques : relance, rigueur et régulation (SES — Term)", "q": "Les « stabilisateurs automatiques » sont :", "c": ["des instruments votés à chaque crise", "les réserves de change", "des mécanismes qui amortissent le cycle sans décision nouvelle (allocations chômage, fiscalité progressive)", "les taux directeurs"], "a": 2, "e": "En récession : les dépenses sociales montent et les recettes fiscales baissent SEULES — un amortisseur budgétaire intégré.", "d": "<b>Le gouvernement qui agit tout seul</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la France entre en récession : 300 000 personnes perdent leur emploi : automatiquement, elles touchent des allocations (dépense ↑) et paient moins d'impôts (recette ↓) : le déficit se creuse SANS vote — et c'est précisément ce qui soutient la demande (le pouvoir d'achat des ménages touchés ne s'effondre pas) : chiffre repère : pendant le covid, la « phase 1 » de soutien est passée surtout par les stabilisateurs (chute des recettes) avant les mesures discrétionnaires (« quoi qu'il en coûte ») : distinguer les DEUX notions rapporte des points à chaque EC sur le budget.</div>"},
{"t": "Politiques économiques : relance, rigueur et régulation (SES — Term)", "q": "Dans la zone euro, le financement monétaire des États par la BCE est :", "c": ["encouragé depuis 2012", "obligatoire en cas de crise", "réservé à la France et à l'Allemagne", "interdit (article 123 du TFUE)"], "a": 3, "e": "La BCE ne peut pas acheter directement la dette des États : l'interdiction fonde son indépendance et la discipline budgétaire.", "d": "<b>L'article qui fonde la zone euro</b>.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi la BCE ne « fait pas tourner la planche à billets » pour la dette italienne : l'article 123 du TFUE l'interdit (légitimité : éviter que chaque gouvernement ne fasse financer ses déficits par la banque commune, au détriment de la discipline et de l'inflation) : MAIS la BCE achète des titres sur le marché secondaire (SMP, OMT, PEPP — pendant le covid, elle a acheté des quantités massives, y compris de la dette italienne) : la frontière entre « soutien indirect » et financement déguisé est débattue (les juges constitutionnels allemands s'en sont mêlés) : une copie solide montre la règle ET son assouplissement de fait.</div>"},
{"t": "Politiques économiques : relance, rigueur et régulation (SES — Term)", "q": "Une politique de rigueur consiste à :", "c": ["baisser les taux directeurs", "réduire les déficits (hausse d'impôts et/ou baisse des dépenses)", "augmenter la masse monétaire", "augmenter les dépenses publiques"], "a": 1, "e": "Rigueur/austérité = consolidation budgétaire ; le risque est l'effet dépressif si elle intervient en récession (procyclicité).", "d": "<b>Consolider... ou déprimer ?</b>.<div class='ex-detail'><u>Exemple rédigé</u> : Europe 2010-2013 : plans de consolidation dans plusieurs pays en récession : baisses de salaires publics, d'investissements, de prestations : résultat : PIB grec −25 %, chômage espagnol à 26 % : les études ultérieures ont montré que les multiplicateurs en récession étaient &gt; 1 : chaque euro d'économie détruisait PLUS d'un euro de PIB → les ratios dette/PIB se sont parfois DÉGRADÉS malgré les coupes (le paradoxe de l'austérité) : aujourd'hui, le FMI lui-même recommande de consolider « quand la croissance le permet » — le calendrier importe autant que l'objectif.</div>"},
{"t": "Politiques économiques : relance, rigueur et régulation (SES — Term)", "q": "L'assouplissement quantitatif (quantitative easing) désigne :", "c": ["la baisse du taux de réserve obligatoire", "le contrôle des changes", "l'achat massif d'actifs financiers par la banque centrale pour faire baisser les taux longs et injecter des liquidités", "la hausse des taux directeurs"], "a": 2, "e": "La BCE achète obligations et titres : les prix montent, les rendements baissent, la liquidité abonde.", "d": "<b>Quand les taux courts sont à zéro</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 2015-2022 : la BCE a accumulé ~5 000 Md€ d'actifs (APP puis PEPP covid) : effet : taux souverains français à 0 %, voire négatifs (2020) : l'État s'endette quasi gratuitement, les entreprises empruntent à 1-2 %, les cours boursiers et immobiliers montent (effet patrimoine) : risques : zombification d'entreprises faibles (crédit trop facile), bulles d'actifs, difficulté à EXIT (la hausse des taux 2022-23 a causé des pertes comptables aux banques centrales — cas de faillites bancaires liées aux portefeuilles d'obligations, USA 2023) : le QE est un outil puissant... à double tranchant — parfait pour un débat d'EC.</div>"},
{"t": "Politiques économiques : relance, rigueur et régulation (SES — Term)", "q": "Le Pacte de stabilité et croissance (révisé en 2024) impose aux États de la zone euro :", "c": ["un déficit public inférieur à 3 % du PIB et une dette proche de 60 %", "la même fiscalité partout", "une croissance minimale de 2 %", "un excédent budgétaire obligatoire"], "a": 0, "e": "Déficit ≤ 3 % du PIB ; dette ≤ 60 % du PIB (ou trajectoire de réduction crédible — la révision 2024 individualise les trajectoires par pays).", "d": "<b>Les chiffres à connaître</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la France : dette ~110-112 % du PIB (2023-24), déficits autour de 5-6 % après le covid : la règle revisée : trajectoire pluriannuelle négociée avec Bruxelles (baisse d'environ 1 point de dette par an d'écart à la cible, marge pour l'investissement public et la défense) : pourquoi ces règles : éviter qu'un État surendetté ne déstabilise la zone (crise 2010) et les taux de tous : pourquoi elles sont critiquées : biais procyclique (couper en récession), uniformité brutale (d'où la refonte) — connaître les DEUX faces est la clé d'une EC sur le budget en zone euro.</div>"},
{"t": "Politiques économiques : relance, rigueur et régulation (SES — Term)", "q": "Une politique structurelle vise par exemple à :", "c": ["distribuer un chèque énergétique ponctuel", "baisser les taux directeurs un trimestre", "acheter de la dette publique", "améliorer le fonctionnement de long terme de l'économie (formation, concurrence, marché du travail)"], "a": 3, "e": "Structurel = durable : éducation, réformes du marché du travail, R&D, concurrence — les déterminants de l'offre et de la croissance potentielle.", "d": "<b>Changer les règles du jeu</b>.<div class='ex-detail'><u>Exemple rédigé</u> : réforme de la formation professionnelle, ouverture d'un secteur à la concurrence (télécoms années 1990-2000 : les prix ont baissé de moitié), investissement dans la recherche publique : effets lents (5-10 ans), difficiles à mesurer, mais cumulatifs — c'est la croissance POTENTIELLE qu'elles élèvent : la complémentarité : une relance sans réformes dilapide la demande (elle fuit en importations) ; des réformes sans demande échouent en récession (l'offre ne se développe pas dans le vide) : la bonne copie articule TOUJOURS les deux horizons.</div>"},
{"t": "Environnement et climat : croissance soutenable (SES — Term)", "q": "Une externalité négative se produit quand :", "c": ["une activité impose un coût à des tiers sans que le marché le fasse payer", "l'État subventionne un secteur", "le prix est trop élevé", "les entreprises exportent"], "a": 0, "e": "Ex. : la pollution d'une usine coûte la santé aux riverains — aucun contrat ne la fait payer : le prix privé est inférieur au coût social.", "d": "<b>Le coût qui manque au prix</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une centrale au charbon produit de l'électricité à 50 €/MWh, mais ses émissions et sa pollution coûtent 30 €/MWh à la collectivité (santé, climat) : le coût social = 80 €, le prix payé = 50 € → la société consomme TROP d'électricité polluante (elle est sous-évaluée) : corriger = intégrer les 30 € dans le prix (taxe) ou plafonner les quantités (quotas) : c'est TOUT le sujet des instruments climat — l'internalisation des coûts externes.</div>"},
