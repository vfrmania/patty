  "id": "mondialisation-ecommerce",
  "theme": "Mondialisation et commerce international (SES — Term)",
  "niveau": "Terminale — SES",
  "titre": "Mondialisation et commerce international",
  "cours": "<div class=\"cours-head\"><h2>Mondialisation et commerce international</h2><p>Mondialisation : marchandises, capitaux, personnes, informations. Gains, inégalités, débats — et pourquoi le commerce international n\'est pas un jeu à somme nulle.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Mondialisation = interdépendance croissante des économies.<br>— Avantage comparatif (Ricardo) : chacun gagne à se spécialiser.<br>— Mais : spécialisation risquée, gagnants et perdants internes.<br>— Firmes multinationales ≈ 2/3 du commerce mondial.</div>\n<h3>1. Qu\'est-ce que la mondialisation ?</h3>\n<div class=\"tip\"><b>Définition :</b> mise en relation et interdépendance croissante des économies par les échanges de <b>biens et services</b>, <b>capitaux</b> (IDE : investissements directs à l\'étranger), <b>personnes</b> (migrations, tourisme) et <b>informations</b>.<br><b>Trois âges</b> (Fruit du développement) : mondialisation marchande (XVIe-XIXe, routes commerciales), développements des échanges et des mobilités (1850-1914 : chemins de fer, télégraphe, steamers), mondialisation actuelle (depuis 1950, TIC et conteneur).<br><b>Échelle :</b> le commerce mondial de biens et services ≈ 25-30 % du PIB mondial (contre ~15 % en 1950) ; un iPhone : conçu aux USA, composants de dizaines de pays, assemblé en Asie — les <b>chaînes de valeur mondiales (CVM)</b> fragmentent la production.</div>\n<h3>2. Pourquoi échanger ? L\'avantage comparatif</h3>\n<div class=\"tip\"><b>Adam Smith (avantage absolu)</b> : chaque pays gagne en se spécialisant là où il est le meilleur.<br><b>David Ricardo (avantage comparatif)</b> : même si un pays est MEILLEUR PARTOUT, chacun gagne en se spécialisant là où son désavantage est le plus FAIBLE — les coûts d\'opportunité (ce à quoi on renonce) font la différence.<br><b>Exemple canonique :</b> le Portugal produit le vin ET le drap plus efficacement que l\'Angleterre ; mais son avantage est plus grand sur le vin : il se spécialise dans le vin, l\'Angleterre dans le drap — les deux consomment davantage qu\'en autarcie.<br><b>Théorème Hecksher-Ohlin-Samuelson :</b> chaque pays exporte les biens intensifs dans son facteur abondant (travail pour les pays émergents, capital/qualifié pour les riches).</div>\n<h3>3. Les limites et les débats</h3>\n<div class=\"tip\"><b>Spécialisation et dépendance :</b> un pays mono-producteur (pétrole, cacao) est vulnérable aux chocs de prix.<br><b>Théorème de Stolper-Samuelson :</b> l\'ouverture augmente le rendement du facteur abondant et réduit celui du facteur rare — aux USA : le travail peu qualifié (rare relatif) pâtit → inégalités internes (la « Chine shock », Autor : pertes d\'emploi localisées et durables).<br><b>Protectionnisme :</b> tarifs, quotas, normes, subventions — défendre l\'emploi et l\'industrie naissante MAIS renchérir la consommation et provoquer des représailles (guerre commerciale USA-Chine : les deux perdent en bien-être, l\'agriculture américaine a pâti des représailles chinoises).<br><b>Fondements du libre-échange :</b> le protectionnisme du XIXe siècle allemand (List) a pourtant permis son industrialisation — le débat reste ouvert.</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> « l\'ouverture enrichit tout le monde » — elle enrichit les pays en moyenne, mais crée des gagnants et des perdants À L\'INTÉRIEUR de chaque pays : sans redistribution ni formation, les perdants se révoltent (désindustrialisation, gilets jaunes, populismes).</div>\n<h3>4. Les acteurs : firmes multinationales et États</h3>\n<div class=\"tip\"><b>FMN :</b> coordonnent les CVM, ≈ 1/3 de la production mondiale et 2/3-3/4 des exportations ; logique : délocaliser les segments intensifs en travail, rapprocher la production des marchés, optimiser la fiscalité (prix de transfert, optimisation type « Double Irish » aujourd\'hui refermé).<br><b>États :</b> OMC (règles commerciales, arbitrage des différends — Appellate Body bloqué depuis 2019), accords régionaux (UE, USMCA, CETA, RCEP), sanctions et géoéconomie (l\'arme du semi-conducteur, des sanctions énergétiques).</div>\n<h3>5. Illustration chiffrée</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l\'avantage comparatif en exercice</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> En une journée de travail : un ouvrier du pays A produit 12 unités de textile OU 6 unités de logiciel ; un ouvrier du pays B produit 4 textiles OU 2 logiciels. Qui exporte quoi ?</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Coûts d\'opportunité</b> : pays A : 1 textile = 0,5 logiciel (12 textiles ou 6 logiciels) ; pays B : 1 textile = 0,5 logiciel aussi ! Coûts identiques : PAS d\'avantage comparatif — l\'échange n\'apporte rien ici.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Variante</b> : si le pays B produit 4 textiles OU 1 logiciel (1 textile = 0,25 logiciel), alors B a un désavantage plus faible sur le textile : A se spécialise dans le logiciel (1 logiciel = 2 textiles), B dans le textile : les deux gagnent dès que le prix d\'échange se situe ENTRE les deux rapports (entre 0,25 et 0,5 logiciel par textile).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : l\'avantage comparatif est une question de RAPPORTS internes, pas de performance absolue : même le pays « mauvais partout » a un domaine où il perd le moins — c\'est la clause gagnante-gagnante du commerce. En dissertation, toujours lier : gains macro (efficience) + perdants micro (Stolper-Samuelson) + politiques d\'accompagnement (formation, redistribution).</div></div></details>"

  "id": "politiques-economiques",
  "theme": "Politiques économiques : relance, rigueur et régulation (SES — Term)",
  "niveau": "Terminale — SES",
  "titre": "Politiques économiques : relance, rigueur et régulation",
  "cours": "<div class=\"cours-head\"><h2>Politiques économiques</h2><p>Budgétaire, monétaire, structurelle : qui agit, comment, avec quels effets — et pourquoi les arbitrages sont toujours débattus.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Conjoncturel (court terme) vs structurel (long terme).<br>— Budgétaire : État (dépenses, impôts). Monétaire : BCE (taux).<br>— Keynésiens vs économistes de l\'offre.<br>— Règles européennes : 3 % de déficit, 60 % de dette.</div>\n<h3>1. Les deux familles de politiques</h3>\n<div class=\"tip\"><b>Politiques conjoncturelles</b> (court terme, contre le cycle) : <b>budgétaire</b> (dépenses publiques, impôts — l\'État) et <b>monétaire</b> (taux directeurs, masse monétaire — la BCE pour la zone euro).<br><b>Politiques structurelles</b> (long terme, offre) : marché du travail (réformes), formation, concurrence, R&D, fiscalité incitative.<br><b>Objectifs</b> : croissance, plein emploi, stabilité des prix, équilibre extérieur — et aujourd\'hui transition écologique.</div>\n<h3>2. La politique budgétaire</h3>\n<div class=\"tip\"><b>Relance keynésienne :</b> en récession, la demande est insuffisante ; l\'État dépense (investissement public, transferts) → revenus des ménages et entreprises → consommation → <b>effet multiplicateur</b> (ΔY = k × ΔG, k = 1/(1 − c) : plus la propension à consommer c est élevée, plus le multiplicateur est fort).<br><b>Stabilisateurs automatiques :</b> allocations chômage, fiscalité progressive — amortissent SEULS le cycle sans décision nouvelle.<br><b>Limites :</b> creusement de la dette (effet boule de neige : charge d\'intérêts), <b>éviction</b> (l\'État emprunte → taux ↑ → l\'investissement privé baisse), inflation si l\'économie est déjà à plein emploi, délais de mise en œuvre.<br><b>Rigueur/austérité :</b> réduire les déficits pour stabiliser les dettes et les anticipations — risque : contraction de la demande en récession (multiplicateur &gt; 1 en crise : l\'austérité procyclique aggrave la récession, Europe 2010-2013).</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> « la relance creuse toujours la dette » : si le multiplicateur est &gt; 1, le PIB augmente plus que la dépense — et les recettes fiscales avec lui (le déficit JAMAIS nul mais moins explosif qu\'une lecture statique le suggère). Tout dépend de l\'état du cycle et du niveau de départ de la dette.</div>\n<h3>3. La politique monétaire</h3>\n<div class=\"tip\"><b>Objectif de la BCE :</b> stabilité des prix (cible 2 % d\'inflation) — et, depuis 2021, mission secondaire de « soutenir les politiques économiques générales de l\'Union ».<br><b>Instruments :</b> taux directeurs (le taux de refinancement, la facilité de dépôt), <b>assouplissement quantitatif</b> (achats d\'actifs), opérations de refinancement des banques (LTRO, TLTRO).<br><b>Canal de transmission :</b> taux bas → crédit moins cher → investissement et consommation → demande ; taux bas → euro plus faible → exportations ; taux bas → hausse des prix d\'actifs (effet patrimoine).<br><b>Inflation post-2021 :</b> crise énergétique + tensions d\'offre → la BCE est passée de taux négatifs (−0,5 % en dépôt, 2021) à des taux élevés (dépôt à 4 % en 2023-24) pour casser l\'inflation — au prix d\'un freinage du crédit et de pertes sur les portefeuilles d\'actifs.</div>\n<h3>4. Cadre européen et débats</h3>\n<div class=\"tip\"><b>Pacte de stabilité et croissance (1997), révisé 2024 :</b> déficit public ≤ 3 % du PIB, dette ≤ 60 % (ou trajectoire de baisse crédible de 1 point/an par an d\'écart — le « semestre européen » coordonne).<br><b>Indépendance de la BCE :</b> pas de financement monétaire des États (article 123 TFEU) — la zone euro a une politique monétaire commune mais des budgets nationaux : l\'asymétrie explique les crises (2010-2012) et les innovations (MES, NGEU : premier emprunt commun, 750 Md€).<br><b>Débat keynésiens/offre :</b> les premiers voient dans la demande le moteur (relance en crise) ; les seconds dans l\'offre (baisser les prélèvements, flexibiliser) — en pratique : politiques mixtes (ex. : « quoi qu\'il en coûte » 2020 = relance massif d\'urgence, puis réforme des retraites/assurance chômage).</div>\n<h3>5. Illustration chiffrée</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — un multiplicateur en exercice</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Propension à consommer c = 0,8. L\'État dépense 10 Md€ d\'investissement supplémentaire. Effet sur le PIB ? Et si les ménages épargnent « par prudence » la moitié du supplément de revenu ?</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Multiplicateur simple</b> : k = 1/(1 − 0,8) = 5 → ΔY = 10 × 5 = 50 Md€ en théorie (chaque euro dépensé devient revenu, re-dépensé à 80 %, etc.).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Correctifs réalistes</b> : fuites (épargne de précaution : c passe à 0,5 → k = 2 → ΔY = 20 Md€), importations (une part de la demande part à l\'étranger), éviction par les taux : les multiplicateurs empiriques : ≈ 1-1,5 en temps normal, 1,5-2+ en récession profonde avec taux bas.</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Conclusion SES</b> : le multiplicateur n\'est pas une constante : il dépend du cycle (plus fort en crise), de l\'ouverture (plus faible pour un petit pays très ouvert — la France) et de l\'anticipation des ménages : c\'est exactement le détail qui transforme une EC calculatoire en raisonnement d\'économiste.</div></div></details>"
 },

  "cours": "<div class=\"cours-head\"><h2>Environnement et climat</h2><p>Externalités, biens communs, marché du carbone : l\'économie face aux limites planétaires — les instruments et leurs débats.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Externalité négative = coût non payé par celui qui l\'occasionne.<br>— Biens communs (Hardin) : la tragédie de l\'appropriation libre.<br>— Internaliser : taxe carbone, quotas, normes, subventions vertes.<br>— Croissance soutenable : découplage, sobriété, développement durable.</div>\n<h3>1. Pourquoi le marché seul échoue</h3>\n<div class=\"tip\"><b>Externalité négative :</b> l\'activité d\'un agent impose un coût à d\'autres sans compensation (pollution de l\'air, de l\'eau, émissions de CO₂). Le prix de marché n\'inclut pas le <b>coût social</b> → surproduction du bien polluant.<br><b>Biens communs et biens publics environnementaux :</b> l\'atmosphère, les océans, la biodiversité sont <b>non rivaux, non exclurables</b> (ou rivaux mais d\'accès libre) → le <b>free riding</b> et la <b>tragédie des communs</b> (Hardin, 1968 : chaque berger a intérêt à surpâturer car il supporte une fraction du coût).<br><b>Exemples :</b> surpêche (quotas de pêche UE), déforestation (Amazone), émissions (accords internationaux).</div>\n<h3>2. Internaliser les externalités : les instruments</h3>\n<div class=\"tip\"><b>Taxe pigouvienne (Pigou) :</b> fixer un prix unitaire à la pollution — la taxe carbone (France : composante carbone de la TICPE, ~44,6 €/t puis gelée ; Suède : > 100 €/t). Avantage : le signal-prix oriente millions de décisions ; inconvénient : fixer le « bon » niveau est ardu et le poids est régressif (les ménages modestes dépensent plus en énergie) → <b>dividende climatique</b> (redistribuer le produit : « taxe carbone & dividende »).<br><b>Marché de quotas (cap-and-trade) :</b> fixer une QUANTITÉ et laisser le prix se former — le SEQE-UE (quotes industrielles, prix ~60-100 €/t en 2021-23, réforme 2026-2034) et le prix plancher. Avantage : certitude sur les volumes ; inconvénients : volatilité du prix, délocalisations (fuites de carbone → <b>MACF</b>, mécanisme d\'ajustement carbone aux frontères, dès 2026).<br><b>Normes et interdictions :</b> interdiction progressive de vente des voitures thermiques (UE : 2035), normes énergétiques des bâtiments. Simple et visible, mais coûts mal ciblés.<br><b>Subventions et investissement vert :</b> crédit d\'impôt, tarif d\'achat solaire, France 2030, plan de relance vert UE (30 % du NGEU). Effet d\'entraînement (Keynes + Schumpeter : destruction créatrice verte).</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> « taxe carbone = punir les ménages ». L\'outil n\'est ni bon ni mauvais en soi : SONT décisifs l\'usage des recettes (redistribution) et l\'accompagnement (rénovation, alternatives) — le retrait des gilets jaunes (2018) a montré ce qui arrive quand le signal-prix frappe sans compensation.</div>\n<h3>3. Croissance et environnement : le débat</h3>\n<div class=\"tip\"><b>Découplage :</b> réduire les émissions tout en croissant. <b>Absolu</b> (émissions baissent avec le PIB) vs <b>relatif</b> (elles baissent par unité de PIB seulement). UE : découplage absolu pour le CO₂ (−25 à −30 % d\'émissions depuis 1990 avec PIB en hausse) — MAIS empreinte importée et biodiversité non découplées.<br><b>Courbe de Kuznets environnementale :</b> la pollution augmenterait puis baisserait avec la richesse — thèse discutée (le CO₂ ne suit pas la courbe sans politique).<br><b>Positions :</b> croissance verte (décarboner la croissance : AIE) vs décroissance (réduire la production matérielle : Latouche) vs « a-growth » (ignorer le PIB, viser le bien-être : van den Bergh). En pratique : le PIB non durable ne compte pas les destructions — comptabilité environnementale (PIB vert, comptes patrimoniaux).</div>\n<h3>4. Coordination internationale</h3>\n<div class=\"tip\"><b>Biens publics mondiaux → action collective difficile :</b> chaque pays gagne à laisser les autres payer (free riding) — protocole de Kyoto (1997 : engagements non contraignants), <b>accord de Paris (2015 : contributions nationales volontaires, NDC, viser +1,5-2 °C)</b>, COP annuelles, fonds climat (100 Md$/an promis aux pays du Sud), accord sur la biodiversité (Kunming-Montréal, 30 % des aires protégées).<br><b>Géopolitique du climat :</b> USA (IRA 2022 : subventions massives), Chine (1er émetteur, 1er installateur de renouvelables), Europe (réglementation pionnière : SEQE, CSRD, taxonomie verte).</div>\n<h3>5. Illustration chiffrée</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — taxe carbone ou quotas ? Un choix d\'instrument</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un gouvernement veut réduire de 30 % les émissions industrielles en 10 ans. Comparez taxe carbone et marché de quotas, puis recommandez.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Les logiques inverses</b> : la taxe fixe le PRIX et laisse la quantité s\'ajuster (certitude du coût pour les entreprises, incertitude sur le résultat) : les quotas fixent la QUANTITÉ et laissent le prix se former (certitude du résultat environnemental, volatilité du prix — le SEQE-UE est passé sous 5 € la tonne vers 2017 avant les réformes qui l\'ont remonté à ~80 €).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Les problèmes pratiques</b> : taxe : acceptabilité (gilets jaunes), régressivité (ménages ruraux dépendants de la voiture) : quotas : lobbying (allocations gratuites excessives à l\'origine), fuites de carbone (délocaliser la production sans réduire les émissions mondiales → MACF aux frontières dès 2026).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Recommandation</b> : quota pour l\'industrie (certitude volumétrique, aligné sur le SEQE-UE, MACF contre les fuites) + taxe élargie aux transports et bâtiments avec dividende redistributif (acceptabilité) + normes et subventions (rénovation, renouvelables) pour transformer l\'offre : la combinaison d\'instruments est la réponse d\'économiste — un instrument unique est rarement à la hauteur d\'un problème d\'externalité diffuse.</div></div></details>"

{"t": "Le marché et la formation des prix (SES — 2de)", "q": "Sur un marché, un excès de demande (demande > offre) provoque :", "c": ["une baisse du prix", "une pénurie permanente sans effet", "la disparition du marché", "une hausse du prix"], "a": 3, "e": "Les acheteurs se disputent le produit : les vendeurs montent les prix : le prix monte vers l'équilibre.", "d": "<b>Une hausse du prix</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme en 3 temps : 1) au prix actuel, les acheteurs veulent 1 000 unités, les vendeurs n'en proposent que 600 : 400 acheteurs sont « à la porte » : 2) les vendeurs, voyant la file, augmentent le prix (ils le peuvent) : certains acheteurs renoncent : 3) simultanément, le prix plus haut attire de nouveaux offreurs : offre ↑ et demande ↓ jusqu'à l'équilibre : exemple réel : les masques en mars 2020 (prix ×5) ou les billets d'avion pendant les vacances : le prix est l'accélérateur et le frein du système — c'est exactement ce qu'on attend de vous en dissertation : dérouler le mécanisme, pas l'affirmer.</div>"},
{"t": "Le marché et la formation des prix (SES — 2de)", "q": "L'élasticité-prix de la demande du pain est d'environ -0,3 : le pain est :", "c": ["un bien élastique", "un bien inélastique (nécessité : la consommation varie peu avec le prix)", "hors marché", "un bien de luxe"], "a": 1, "e": "|−0,3| &lt; 1 : une hausse de prix de 10 % ne fait baisser la consommation que de 3 % : nécessité.", "d": "<b>Inélastique (nécessité)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la lecture du chiffre : e = -0,3 ⟹ si le prix augmente de 10 %, la quantité demandée baisse de seulement 3 % : pourquoi : pas de substitut immédiat, faible part du budget, habitude d'achat : comparaison : le caviar (e ≈ -2,5 : quand le prix monte, on s'en passe) ou les billets de cinéma : l'enjeu SES : cette mesure GUIDE la politique publique : la TVA réduite sur les produits alimentaires profite-t-elle aux consommateurs ? OUI pour des biens inélastiques (les prix baissent sans faire chuter la demande) : mesurer l'élasticité = prédire qui paie la taxe et qui en profite.</div>"},
{"t": "Le marché et la formation des prix (SES — 2de)", "q": "Une externalité négative (ex. pollution d'usine) justifie :", "c": ["une taxe (le pollueur paie : le prix doit intégrer le coût social)", "de subventionner l'usine", "de ne rien faire", "d'interdire le marché"], "a": 0, "e": "Le prix de marché ignore le coût imposé aux tiers : une taxe (pigouvienne) le réintègre : le signal-prix redevient complet.", "d": "<b>Une taxe pour internaliser le coût</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement étape par étape : 1) l'usine vend 1 000 unités à 10 € : son coût privé est de 8 € : elle gagne 2 €/unité : MAIS chaque unité pollue la rivière pour 1 € de dégâts supportés par les riverains : le coût SOCIAL est 9 € : le marché produit trop (le vrai prix devrait être 11 €) : 2) la taxe de 1 €/unité aligne l'intérêt privé sur l'intérêt collectif : l'usine réduit sa production ou dépollue : 3) exemples : taxe carbone, quotas d'émission (marché EU-ETS : les entreprises s'échangent des droits de polluer) : la leçon : le marché ne « voit » pas les tiers : l'État corrige le prix pour le lui faire voir.</div>"},
{"t": "Le marché et la formation des prix (SES — 2de)", "q": "La « main invisible » d'Adam Smith signifie :", "c": ["l'État doit fixer tous les prix", "les marchés n'existent pas", "les prix sont tirés au sort", "en poursuivant leur intérêt personnel, les individus aboutissent à un résultat collectif cohérent (prix d'équilibre)"], "a": 3, "e": "« Ce n'est pas de la bienveillance du boucher... mais de son intérêt que nous attendons notre dîner » : la coordination décentralisée.", "d": "<b>La coordination par l'intérêt</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'idée à restituer précisément : personne ne planifie la ville, pourtant le boulanger, le boucher, le garagiste proposent ce qu'il faut, aux prix qui équilibrent : le prix agrège l'information (que veulent les gens ? que coûtent les choses ?) sans qu'aucun bureau ne la centralise : les limites (à citer pour le niveau « très bien ») : la main invisible suppose la concurrence, l'information parfaite et l'absence d'externalités : quand ces conditions manquent (crise de 2008 : asymétries d'information), la « main invisible » peut se muer en gant de fer (Keynes) : l'économie est née de cette tension Smith/Keynes : vous devez savoir la formuler.</div>"},
{"t": "Le marché et la formation des prix (SES — 2de)", "q": "Un bien collectif (éclairage public, défense nationale) :", "c": ["est fourni efficacement par le marché", "est un luxe", "ne peut être fourni par le marché seul (non-rivalité + non-exclusion : l'État le finance par l'impôt)", "n'existe pas"], "a": 2, "e": "Impossible d'exclure celui qui ne paie pas (free rider) et le bien consommé par l'un reste disponible pour l'autre : financement public obligatoire.", "d": "<b>Le marché seul ne le fournit pas</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement du passager clandestin (free rider) : si l'éclairage de ma rue était financé par souscription, je dirais « mes voisins paieront, j'éclairerai gratis » : personne ne paie : la rue reste noire : tout le monde perd : solution : l'impôt obligatoire finance le service pour tous : la distinction à connaître par cœur : bien privé (rival + excluable : une baguette), bien collectif pur (non-rival + non-excluable : défense), cas intermédiaires (péage autoroutier : excluable mais rival à saturation) : l'existence de l'État en économie se justifie D'ABORD par ces biens que le marché ne produit pas.</div>"},
{"t": "Le marché et la formation des prix (SES — 2de)", "q": "La concurrence pure et parfaite suppose notamment :", "c": ["des barrières douanières", "le secret des prix", "un seul vendeur", "atomicité (myriade d'acheteurs-vendeurs), transparence, libre entrée, produit homogène, mobilité des facteurs"], "a": 3, "e": "5 conditions : c'est un MODÈLE théorique, la réalité est souvent en concurrence imparfaite (oligopoles, différenciation).", "d": "<b>Atomicité, transparence, libre entrée, homogénéité, mobilité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi ce modèle : il décrit la situation où AUCUN acteur ne peut influencer le prix (chacun est « atomique » face au marché) : le prix s'impose à tous : c'est le repère théorique. La réalité : le marché des smartphones est un OLIGOPOLE (Apple + Samsung = ~40 % : pouvoir sur les prix), la différenciation des produits (le sel de Guérande vs le sel blanc) casse l'homogénéité, la publicité casse la transparence : l'analyse SES = partir du modèle, mesurer l'écart, étudier les stratégies (différenciation, innovation) : un marché réel sans ÉTAT d'âme mais avec des ACTEURS stratégiques — c'est tout l'objet de la micro-économie.</div>"},
{"t": "Le marché et la formation des prix (SES — 2de)", "q": "Si le revenu des ménages augmente et qu'ils achètent MOINS de pâtes premier prix, celles-ci sont :", "c": ["hors marché", "des biens normaux", "des biens collectifs", "des biens inférieurs (on les remplace par des biens de meilleure qualité quand le revenu monte)"], "a": 3, "e": "Élasticité-revenu négative : signe de consommation de nécessité « subie » qu'on quitte dès qu'on le peut.", "d": "<b>Des biens inférieurs</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme de l'engel (nommé d'après le statisticien Ernst Engel) : quand le revenu augmente, la part consacrée à l'alimentation baisse ET la structure change dans la gamme (moins de premières marques premier prix, plus de produits frais) : l'élasticité-revenu des pâtes bas de gamme est NÉGATIVE : celle des restaurants est &gt; 1 (bien « supérieur ») : application : les entreprises de grande consommation suivent ces élasticités pour positionner leurs gammes, et l'INSEE les utilise pour pondérer l'indice des prix : une donnée économique devient un instrument de mesure du niveau de vie — c'est la chaîne complète que le correcteur récompense.</div>"},
{"t": "Le marché et la formation des prix (SES — 2de)", "q": "Les « gilets jaunes » (2018) illustrent la limite d'une taxation reposant sur :", "c": ["des biens élastiques", "l'épargne", "les entreprises", "des biens inélastiques sans alternative pour les ménages contraints (carburant des ruraux)"], "a": 3, "e": "La taxe carbone frappe une consommation INÉLASTIQUE et non substituable pour les ruraux : efficacité fiscale mais injustice sociale ressentie.", "d": "<b>Bien inélastique + absence d'alternative</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne complète : 1) objectif : réduire les émissions (internaliser l'externalité climatique : raisonnement économique valable) : 2) instrument : taxe carbone sur le carburant : le prix ↑ : la demande baisse peu (inélastique à court terme) : 3) résultat social : pour l'urbain, alternatives possibles (transports) : pour le périurbain contraint (voiture obligatoire), la taxe est une baisse de pouvoir d'achat pur sans marge de manœuvre : protestation massive ⟹ gel de la hausse : la leçon SES : une POLITIQUE de prix n'est pas seulement économique : elle est acceptable selon la SOCIologie de la contrainte : « faire payer les externalités » exige des réponses aux situations sans choix — sinon la révolte est prévisible.</div>"},
{"t": "Le marché et la formation des prix (SES — 2de)", "q": "Le prix d'équilibre est celui pour lequel :", "c": ["quantité offerte = quantité demandée (pas d'excès, pas de pénurie)", "les vendeurs gagnent le plus", "le gouvernement décide", "l'offre est maximale"], "a": 0, "e": "Au point d'intersection des courbes : le marché se « clôt » sans excès des deux côtés.", "d": "<b>Offre = demande</b> (intersection).<div class='ex-detail'><u>Exemple rédigé</u> : la preuve par la tension : si prix &gt; équilibre : excès d'offre ⟹ pression à la baisse : si prix &lt; équilibre : excès de demande ⟹ pression à la hausse : le système converge (comme un ressort) vers le point où personne n'a intérêt à changer : la difficulté fréquente des élèves : distinguer l'équilibre (prix ET quantité) de la « juste valeur » (aucun jugement moral : le prix du luxe ou du pain ne « devrait » rien) : l'équilibre décrit une COORDINATION, pas une justice : la justice, c'est l'affaire de la section 3 du cours (interventions publiques) : ne mélangez jamais les deux plans dans une copie.</div>"},
{"t": "Le marché et la formation des prix (SES — 2de)", "q": "Une asymétrie d'information (vendeur mieux informé que l'acheteur) peut conduire :", "c": ["à des « mauvaises » transactions ou à l'absence de transaction (prix cassés, crédit refusé)", "à un marché parfaitement efficace", "à la fin des vendeurs", "à l'égalité des prix"], "a": 0, "e": "Akerlof (« le marché des tacots ») : l'acheteur qui craint un défaut propose un prix bas : les vendeurs de bons produits quittent le marché : sélection adverse.", "d": "<b>Sélection adverse, marché qui rétrécit</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement d'Akerlof (Nobel 2001) : sur le marché des voitures d'occasion, l'acheteur NE SAIT PAS si la voiture est bonne ou défectueuse : il propose un prix « moyen » : les vendeurs de BONNES voitures refusent (prix trop bas pour elles) et se retirent : il ne reste que les « tacots » (lemons) : l'acheteur comprend et propose encore moins bas : le marché peut DISPARAÎTRE : les réponses : garanties, contrôle technique, labels, réglementation, réputation (avis en ligne) : l'asymétrie est aussi au cœur de l'assurance (les assurés savent mieux leurs risques : c'est pourquoi les compagnies demandent des questionnaires et excluent les maladies préexistantes) : l'INFORMATION est une dimension du marché autant que le prix.</div>"},
{"t": "La création des richesses (SES — 2de)", "q": "La valeur ajoutée d'une entreprise est :", "c": ["son chiffre d'affaires", "son profit", "ses salaires", "sa production moins les consommations intermédiaires"], "a": 3, "e": "VA = production − achats de biens/services détruits ou transformés : la richesse réellement créée par l'entreprise.", "d": "<b>Production − consommations intermédiaires</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le calcul et son sens : un menuisier achète 300 € de bois, vis, électricité et vend ses meubles 1 000 € : VA = 700 € : pourquoi c'est LA grandeur importante : 1) elle évite les doubles comptages dans le PIB (le bois n'est compté que comme VA de la scierie) : 2) elle est le gâteau à répartir (salaires 55 %, impôts, profits) : 3) elle mesure la contribution propre de l'entreprise (son travail, ses machines) : le chiffre d'affaires (1 000 €) ne dit RIEN de la richesse créée : un grossiste peut avoir un CA énorme et une VA minuscule — c'est la distinction la plus rentable du chapitre en interrogation comme en dissertation.</div>"},
{"t": "La création des richesses (SES — 2de)", "q": "Le PIB est la somme :", "c": ["des exportations", "des chiffres d'affaires", "des valeurs ajoutées (plus impôts sur les produits)", "des profits"], "a": 2, "e": "PIB = Σ VA : chaque richesse n'est comptée qu'une fois, quel que soit le nombre d'entreprises traversées.", "d": "<b>Des valeurs ajoutées</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne du T-shirt : coton (VA du producteur : 1 €) → filature (VA 2 €) → confection (VA 3 €) → marque (VA 15 €) → distribution (VA 5 €) : prix final 26 € : si on sommait les ventes successives on trouverait bien plus (double comptage) : le PIB additionne 1+2+3+15+5 = 26 €, la valeur finale : remarque SES : la répartition des VA de la chaîne (qui capte quoi ?) est une question de POUVOIR DE MARCHÉ (la marque et la distribution captent l'essentiel) : l'indicateur, bien lu, ouvre déjà l'analyse des inégalités internationales.</div>"},
{"t": "La création des richesses (SES — 2de)", "q": "Le PIB ne mesure pas :", "c": ["le travail domestique et bénévole (non marchand non comptabilisé)", "les services financiers", "les voitures", "l'éducation publique"], "a": 0, "e": "Le repassage à domicile, le bénévolat associatif : des richesses réelles mais non comptées (ou via prix imputés pour les services publics).", "d": "<b>Le travail domestique et bénévole</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le paradoxe du repassage : si vous repassez vos chemises, aucun PIB : si vous les confiez à un pressing, PIB +15 € : la richesse produite est IDENTIQUE, seule sa forme (marchande/non marchande) change : conséquence amusante : les pays où les femmes sont entrées massivement sur le marché du travail (années 1970-80) ont vu leur PIB bondir en partie par ce simple transfert : les corrections existent (comptes satellites du ménage : ~15-30 % du PIB selon les estimations) mais ne sont pas dans l'indicateur principal : la conclusion à écrire : le PIB sous-estime les économies où le non-marchand est important... ce qui ne veut PAS dire qu'il est faux : il mesure ce qu'il mesure.</div>"},
{"t": "La création des richesses (SES — 2de)", "q": "La croissance économique désigne :", "c": ["la hausse des prix", "l'augmentation du PIB réel (à prix constants) sur longue période", "la hausse du chômage", "l'augmentation des exportations"], "a": 1, "e": "On « déflate » (enlève l'inflation) : une hausse des prix seule n'est pas de la croissance.", "d": "<b>La hausse du PIB réel</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le piège des valeurs nominales : si le PIB passe de 2 000 à 2 100 Md € (+5 %) mais que les prix ont monté de 5 %, la croissance réelle est NULLE : on n'a pas produit plus, on facture juste plus cher : la « déflation » de la série (division par un indice des prix) donne le volume : application historique : l'Argentine en inflation élevée affiche des PIB nominaux en hausse alors que l'économie réelle stagne : la règle de copie : TOUTE comparaison dans le temps (ou entre pays, via PPA) exige de raisonner en volume/PPA : c'est la première rigueur technique attendue au bac en SES.</div>"},
{"t": "La création des richesses (SES — 2de)", "q": "Les Trente Glorieuses (1945-1975) tirent leur croissance surtout de :", "c": ["l'absence d'échanges", "la baisse du travail", "capital + plein-emploi des gisements de main-d'œuvre et de progrès technique (fordisme, énergie pas chère)", "la dépopulation"], "a": 2, "e": "Reconstruction, Marshall, baby-boom, exode rural, fordisme, pétrole abondant : croissance extensive ET intensive.", "d": "<b>Travail + capital + progrès technique simultanés</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la décomposition à connaître : 1) TRAVAIL : population active en hausse (baby-boom, immigration, femmes), RURAUX transférés à l'industrie : 2) CAPITAL : reconstruction + plan Marshall + taux d'investissement élevé : 3) PRODUCTIVITÉ : fordisme (chaîne), énergie bon marché (pétrole), électricité, transferts de technologie américains : résultat : ~5 %/an pendant 30 ans, salaires réels doublés, consommation de masse (équipement du logement, voiture, congés payés utilisés) : la fin (1973) : chocs pétroliers = l'énergie pas chère disparaît : les gisements extensifs s'épuisent : la croissance doit compter sur l'innovation (intensive) : c'est le moment où la question « jusqu'où croître ? » s'ouvre — jusqu'à aujourd'hui.</div>"},
{"t": "La création des richesses (SES — 2de)", "q": "La productivité globale des facteurs (Solow) mesure :", "c": ["les heures travaillées", "les impôts", "la consommation", "la part de la croissance non expliquée par travail et capital seuls : le progrès technique et l'organisation"], "a": 3, "e": "« Résidu » de Solow : améliorer l'efficacité (innovation, organisation, éducation) plutôt qu'accumuler plus d'inputs.", "d": "<b>Le progrès technique (résidu)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'idée : si on explique la croissance par +travail et +machines, il RESTE une part inexpliquée : Solow l'appelle le résidu = progrès technique (au sens large : innovation, organisation, qualifications) : exemple chiffré simple : une usine double ses machines et son effectif (+100 % d'inputs) mais produit +130 % : les 30 % excédentaires viennent de l'organisation (meilleure répartition) ou de machines MEILLEURES (pas seulement plus nombreuses) : la leçon pour les politiques publiques : à long terme, seule la productivité (éducation, recherche, organisation) fait croître durablement — accumuler des inputs a des rendements décroissants : c'est pourquoi l'éducation n'est pas une « dépense » mais un investissement (capital humain).</div>"},
{"t": "La création des richesses (SES — 2de)", "q": "Un bien non marchand (ex. cours du lycée public) est :", "c": ["un cadeau", "exclu du calcul économique", "compté dans le PIB via ses coûts de production (salaires des professeurs)", "compté comme un profit"], "a": 2, "e": "Pas de prix de vente ⟹ on valorise au coût (prix « imputé ») : limite connue : une classe de 35 ou 20 élèves « vaut » pareil.", "d": "<b>Compté via ses coûts de production</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la méthode : un cours public n'a pas de prix de marché : l'INSEE l'évalue par ses coûts (salaires des enseignants, locaux) : conséquences MESURABLES : 1) la hausse des salaires publics AUGMENTE le PIB sans que la production réelle change (effet prix imputé) : 2) si un service public est privatisé et facturé 20 % plus cher, le PIB MONTE alors que le service est le même : 3) l'efficacité (une classe à 20 vs 35) est invisible : le débat « le PIB surestime-t-il le secteur public ? » vient de là : la réponse honnête : il le mesure mal, faute de prix : d'où les réflexions sur des indicateurs de résultat (réussite des élèves) et pas seulement de moyens.</div>"},
{"t": "La création des richesses (SES — 2de)", "q": "L'IDH (indice de développement humain) intègre :", "c": ["santé (espérance de vie) + éducation (scolarisation) + revenu", "le military", "seulement le PIB", "l'écologie"], "a": 0, "e": "PNUD : un indicateur COMPOSITE pour capter le développement, pas seulement la production.", "d": "<b>Santé + éducation + revenu</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la logique de construction (à savoir expliquer) : 3 dimensions, chacune ramenée à un indice 0-1 (espérance de vie : 20-85 ans : années de scolarisation : 0-18 : revenu/hab en PPA logarithmique) : MOYENNE géométrique ⟹ un pays doit performer PARTOUT (pas compenser la misère sanitaire par du pétrole) : résultats instructifs : un pays pétrolier riche peut avoir un IDH médiocre (inégalités, santé) : la Norvège, la Suisse ou l'Irlande trustent les premières places : la France ~ top 30 : l'esprit de l'indicateur : le DÉVELOPPEMENT est l'élargissement des CAPABILITÉS (Sen : que peux-tu faire de ta vie ?) : l'IDH tente d'approcher cette idée par des moyennes : imparfait, mais incomparablement plus riche que le seul PIB/hab pour comparer les vies humaines.</div>"},
{"t": "La création des richesses (SES — 2de)", "q": "Une économie en croissance « intensive » croît grâce à :", "c": ["la hausse des prix", "l'immigration seule", "plus de travail et de ressources", "une meilleure efficacité : plus de production À FACTEURS CONSTANTS (innovation, organisation)"], "a": 3, "e": "Extensive = plus d'inputs : intensive = mieux utiliser les inputs (productivité) : seule l'intensive est durable.", "d": "<b>Mieux produire, pas produire avec plus</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison qui marque : extensive : une ferme double ses terres et ses bras ⟹ production ×2 (jusqu'à épuisement des bonnes terres : rendements décroissants) : intensive : la même ferme adopte semences sélectionnées, irrigation goutte-à-goutte, capteurs ⟹ production ×2 AVEC les mêmes terres : l'histoire économique : le XXe siècle a d'abord été extensive (plus de machines, plus d'heures) puis intensive (l'agriculture française nourrit 2x plus de monde avec MOINS d'actifs) : l'enjeu écologique : la croissance extensive est impossible sur une planète finie : tout repose sur le découplage (produire plus en consommant MOINS de matière et d'énergie) — prouvé pour le CO₂ relatif, à prouver en absolu : c'est LE débat des 30 prochaines années.</div>"},
{"t": "La création des richesses (SES — 2de)", "q": "« Le PIB est un flux » signifie :", "c": ["qu'il mesure un stock de patrimoine", "qu'il mesure ce qui est produit PAR ANNÉE (contrairement au patrimoine, un stock)", "qu'il varie avec les échanges", "qu'il part à l'étranger"], "a": 1, "e": "Flux annuel de richesse créée vs stock patrimonial (capital, forêts, infrastructures) : un pays peut avoir un PIB élevé et un patrimoine qui se dégrade.", "d": "<b>Un flux annuel (vs patrimoine = stock)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'image hydraulique : le PIB est le DÉBIT de la rivière (ce qui coule chaque année), le patrimoine est le LAC (ce qui est accumulé) : on peut avoir un gros débit et un lac qui se vide (consommer son capital : déforestation, infrastructures non entretenues, dette) : exemples : un pays qui coupe ses forêts augmente son PIB (bois vendu) et détruit son stock : un pays qui investit en recherche a un débit modeste aujourd'hui et un lac qui grossit : le « PIB vert » et les comptes patrimoniaux (comptabilité environnementale) tentent de croiser les deux : la règle de dissertation : quand on vous demande « la croissance est-elle un bon indicateur », PENSEZ flux/stock, court terme/durable : la distinction structure toute copie valable.</div>"},
{"t": "Les entreprises et leur organisation (SES — 2de)", "q": "La valeur ajoutée se répartit principalement entre :", "c": ["salaires, impôts sur la production et excédent (profit) pour le capital", "les clients", "l'État uniquement", "les banques uniquement"], "a": 0, "e": "Partage primaire : ~60 % salaires, impôts, EBE : la rémunération du capital et du travail se joue là.", "d": "<b>Salaires + impôts + EBE</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le partage d'une VA de 100 : 60 € de salaires (et cotisations), 5 € d'impôts sur la production, 35 € d'EBE (dirigeants, actionnaires, prêteurs, autofinancement) : la lutte des partages : si les salaires montent à 70, l'EBE tombe à 25 : l'investissement et les dividendes se contractent : c'est pour ENCODER ce conflit que des institutions existent : négociations de branche, SMIC, participation (intéressement), actionnariat salarié : la question « qui crée la richesse et qui la reçoit ? » traverse toutes les épreuves SES : l'entreprise en est l'épicentre.</div>"},
{"t": "Les entreprises et leur organisation (SES — 2de)", "q": "Dans une SAS, la responsabilité de l'entrepreneur est :", "c": ["infinie (biens personnels engagés)", "limitée à ses apports (on ne perd que ce qu'on a investi)", "nulle", "pénale uniquement"], "a": 1, "e": "Personne morale distincte : le patrimoine personnel est protégé — sauf faute de gestion (les tribunaux peuvent lever le voile).", "d": "<b>Limitée aux apports</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme du bouclier : vous créez une SAS en apportant 10 000 € : l'entreprise fait faillite avec 200 000 € de dettes : vos biens personnels (appartement, épargne) sont protégés : vous perdez vos 10 000 € : pourquoi ce droit : INCITER à entreprendre (sans lui, chaque échec ruinerait les familles : le capitalisme moderne repose sur cette séparation des patrimoines) : la limite : la « levée du voile » en cas de fraude ou de garanties personnelles données aux banques (les prêteurs exigent souvent la caution du dirigeant) : le droit des sociétés est une machine à répartir le RISQUE — c'est ainsi qu'il faut le présenter.</div>"},
{"t": "Les entreprises et leur organisation (SES — 2de)", "q": "Le taylorisme repose sur :", "c": ["le télétravail", "l'autonomie des ouvriers", "la séparation conception/exécution et la parcellisation des tâches (chronométrage)", "les coopératives"], "a": 2, "e": "« One best way » : le bureau des méthodes décide, l'ouvrier exécute un geste unique : productivité ×3, déqualification.", "d": "<b>Séparation conception/exécution</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le principe et ses deux visages : PRODUCTIVITÉ : la spécialisation d'un geste (visser un boulon 1000 fois/jour) élimine les temps morts, permet des ouvriers formés en quelques jours (immigration massive employable), rend le contrôle direct : le chronomètre standardise : ALIÉNATION : le travailleur ne voit jamais le produit fini, perd le savoir-faire (Bureau des méthodes), la monotonie produit turnover et conflits (l'ouvrier de Chaplin vissé à la chaîne dans Les Temps modernes, 1936) : l'histoire suit : Ford ajoute la chaîne et le salaire élevé, Toyota rendra l'ouvrier concepteur : la ligne de temps taylor-ford-toyota est UN classique d'examen : les trois étages doivent être connus avec leurs dates approximatives (1900-1930-1970).</div>"},
{"t": "Les entreprises et leur organisation (SES — 2de)", "q": "Le toyotisme innove par rapport au fordisme en :", "c": ["accélérant la chaîne", "supprimant les machines", "fermant les usines", "impliquant les opérateurs dans la qualité et l'amélioration continue (kaizen, juste-à-temps)"], "a": 3, "e": "Le savoir d'exécution redevient une ressource : polyvalence, circles de qualité, zéro stock : « le lean ».", "d": "<b>Implication des opérateurs (kaizen)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les trois ruptures : 1) JUSTE-À-TEMPS : produire sans stocks (les pièces arrivent à l'heure) : moins de capital immobilisé, défauts visibles immédiatement : 2) QUALITÉ TOTALE : chaque opérateur peut ARRÊTER la chaîne (andon) s'il voit un défaut (impensable chez Taylor : l'ouvrier n'était pas payé pour penser) : 3) AMÉLIORATION CONTINUE : les cercles de qualité proposent des milliers de micro-innovations/an : résultat : Toyota dépasse Ford dans les années 80 avec des usines plus flexibles : la leçon SES : l'organisation du travail n'est pas neutre : elle distribue le POUVOIR DE DÉCISION (qui pense ?) : l'implication du travailleur devient un facteur de production à part entière — c'est l'argument central de la sociologie du travail (positive... jusqu'aux dérives du « lean » : stress, polyvalence subie).</div>"},
{"t": "Les entreprises et leur organisation (SES — 2de)", "q": "En France, les micro-entreprises représentent :", "c": ["aucune", "la moitié des emplois", "environ 96 % des entreprises (mais une petite part de l'emploi)", "moins de 1 % des entreprises"], "a": 2, "e": "Structure en pyramide : des millions de très petites structures, des PME qui portent l'essentiel des emplois salariés, des groupes qui concentrent export et R&D.", "d": "<b>~96 % des entreprises</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la pyramide française : ~4 M d'entreprises, dont 96 % sans salarié ou < 10 : les PME (10-250) pèsent ~40 % de l'emploi salarié : les 100-150 grands groupes concentrent l'essentiel de la recherche privée et des exportations (les « ETI » manquent en France — un « désert » entre PME et groupes, régulièrement déploré) : l'analyse SES : chaque strate a une FONCTION (le tissu local : PME : l'insertion internationale : groupes) : les politiques publiques ciblent chaque niveau (BPI France pour les PME, « French Tech » pour les startups, crédits R&D pour les grands) : la typologie par taille n'est pas un détail statistique : elle décrit la STRUCTURE productive d'un pays et ses dépendances.</div>"},
{"t": "Les entreprises et leur organisation (SES — 2de)", "q": "Une SCOP (coopérative ouvrière de production) se caractérise par :", "c": ["des salariés-associés qui détiennent l'entreprise et élisent le dirigeant (1 tête = 1 voix)", "l'absence de salaires", "la bourse", "des actionnaires anonymes"], "a": 0, "e": "Le capital est détenu par ceux qui y travaillent : la VA se partage différemment (participation massive) : exemples : le groupe Chèque Déjeuner, des SCOP du BTP et de l'industrie.", "d": "<b>Salariés-associés, démocratie interne</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les principes : 1) le capital est détenu majoritairement par les salariés (les « sociétaires »), 2) le dirigeant est élu, 3) les bénéfices vont en participation et en réserves (l'entreprise n'est pas « vendable » par un actionnaire sortant : les réserves sont impartageables — l'entreprise ne peut pas être rachetée et démantelée) : les effets documentés : pérennité supérieure en crise (pas de pression des dividendes à court terme), investissement long terme, productivité par l'implication : les limites : croissance plus lente (difficulté à lever des capitaux : les banques se méfient des garanties mutualisées) : en SES, c'est le contre-exemple qui montre que la forme capitaliste classique est un CHOIX parmi d'autres : la propriété du capital conditionne le PARTAGE et la STRATÉGIE.</div>"},
{"t": "Les entreprises et leur organisation (SES — 2de)", "q": "La « chaîne de valeur mondiale » d'un smartphone signifie :", "c": ["que le consommateur produit", "qu'il n'y a pas d'entreprise", "que la conception, les composants et l'assemblage sont répartis entre des dizaines de pays (l'entreprise orchestre)", "qu'il est fabriqué dans un seul pays"], "a": 2, "e": "Désintégration : le donneur d'ordres (Apple) garde marque, R&D, design : les fournisseurs (Corning, TSMC, Foxconn) produisent : la VA se concentre aux extrémités (conception, marque) — la « smile curve ».", "d": "<b>Conception/production/assemblage répartis mondialement</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la géographie d'un iPhone : conception Californie, écran Corning (US, verre au Japon), puces TSMC (Taïwan), mémoire Corée, capteurs Sony (Japon), assemblage Foxconn (Chine, 200 000 ouvriers à Zhengzhou), distribution mondiale : Apple empoche ~40 % du prix de vente en marge (elle ne FABRIQUE presque rien) : la « courbe du sourire » : VA forte aux deux bouts (R&D, marque, services) et faible au milieu (assemblage) : les leçons SES : 1) le POUVOIR réside dans l'orchestration et la propriété intellectuelle, pas dans l'usine : 2) le commerce international est aujourd'hui intra-firme et intra-branche (échanges de composants) : 3) les politiques de réindustrialisation (Europe, USA) visent à remonter la courbe : c'est LE modèle pour comprendre l'entreprise moderne.</div>"},
{"t": "Les entreprises et leur organisation (SES — 2de)", "q": "Le principal apport du fordisme sur le taylorisme est :", "c": ["la fin des usines", "la chaîne de montage + salaires élevés créant la consommation de masse (les ouvriers achètent les voitures)", "le juste-à-temps", "la liberté des ouvriers"], "a": 1, "e": "« Dupe ? Non : je veux que mes ouvriers achètent mes voitures » : les 5 $/jour (1914) doublent le salaire et stabilisent la main-d'œuvre.", "d": "<b>Chaîne + salaire élevé = consommation de masse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cercle vertueux : chaîne ⟹ prix de la Model T divisé par 3 (le même modèle pendant 15 ans : standardisation) ⟹ ventes massives ⟹ économies d'échelle ⟹ prix encore plus bas : PARALLÈLEMENT, Ford double les salaires (5 $/jour, 1914) : la main-d'œuvre se stabilise (le turnover était énorme) ET les ouvriers deviennent clients : la boucle production-revenu-consommation (Keynes en verrait la logique macro) : la limite historique : la demande de variété (des couleurs ! « toute voiture pourvu qu'elle soit noire ») cassera le modèle au profit du toyotisme flexible : en dissertation, fordis = le SOCLE du XXe siècle industriel : standardisation + production de masse + consommation de masse : trois mots à lier systématiquement.</div>"},
{"t": "Les entreprises et leur organisation (SES — 2de)", "q": "L'excédent brut d'exploitation (EBE) est :", "c": ["les subventions", "ce qui reste de la VA après paiement des salaires et impôts (la rémunération du capital, avant intérêts et amortissements)", "les exportations", "le chiffre d'affaires"], "a": 1, "e": "EBE = VA − rémunération du travail − impôts sur la production : indicateur de la profitabilité opérationnelle.", "d": "<b>VA − salaires − impôts</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'ordre des lignes à mémoriser : CA (500) − consommations intermédiaires (200) = VA (300) : VA − salaires (180) − impôts production (20) = EBE (100) : EBE − intérêts (10) − amortissements (25) = résultat imposable (65) : − impôt sur les sociétés (~25 %) = bénéfice net (~49) : pourquoi s'arrêter à l'EBE : c'est la marge INDÉPENDANTE des financements et du vieillissement du capital : il permet de comparer une usine récente et une ancienne : les analystes parlent d'EBE % du CA : la marge opérationnelle : en SES, la chaîne CA→VA→EBE→bénéfice est LA question de calcul la plus fréquente : chaque ligne doit être restituée avec SON nom exact.</div>"},
{"t": "Les entreprises et leur organisation (SES — 2de)", "q": "Le développement des plateformes (Uber, Deliveroo) interroge :", "c": ["le statut de salarié et le partage du risque : « travailleurs indépendants » dépendant d'un algorithme", "l'agriculture", "la fin des entreprises", "la baisse du prix des actions"], "a": 0, "e": "La « Uberisation » : les plateformes fixent les règles (prix, zones, notation) sans employer : les coursiers portent le risque : contentieux de requalification (Cour de cassation 2018-2020 : requalification en salariat).", "d": "<b>Indépendants dépendants : le risque transféré au travailleur</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le modèle et sa contestation : la plateforme FIXE tout (algorithme : prix, géo-zone, sanctions par notation) mais NE PAIE ni congés ni cotisations (le coursier est « indépendant ») : l'économiste dirait : une destruction partielle du salariat (le risque est transféré au travailleur) : le juriste : requalification (la Cour de cassation, 2018-2020, a jugé que le lien de subordination existait — travailleurs salariés) : les réponses institutionnelles : intermittents, « travailleur de plateforme » européen (directive 2024), algorithmes rendus transparents : la leçon SES : l'entreprise se redéfinit — si l'orchestrateur ne produit pas et n'emploie pas, qui « crée » la valeur et qui porte le risque ? : c'est un sujet de dissertation tout trouvé (et actuel).</div>"},
{"t": "La socialisation et les groupes sociaux (SES — 2de)", "q": "La socialisation est :", "c": ["la scolarisation obligatoire", "le processus par lequel un individu intériorise normes et valeurs de sa société", "l'émigration", "un phénomène purement biologique"], "a": 1, "e": "Apprendre à se conduire, parler, goûter, croire : un processus social continu, pas seulement l'école.", "d": "<b>L'intériorisation des normes et valeurs</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'évidence invisible : vous ne « décidez » pas de manger à telle heure, de dire « bonjour » en entrant, de porter tel vêtement pour un entretien : tout cela a été APPRIS (famille, école, pairs) : la preuve par le voyage : un Français au Japon ou au Maroc découvre que ses « réflexes » ne sont pas universels (le respect se manifeste autrement, la ponctualité n'a pas le même sens) : la définition complète à restituer : processus par lequel l'individu apprend et intériorise, tout au long de sa vie, les façons de faire et de penser propres à son groupe social, et construit ainsi son identité sociale — chaque mot compte : APPRIS (pas inné), INTÉRIORISÉ (pas seulement subi), TOUT AU LONG (continue), IDENTITÉ (pas un rôle vide).</div>"},
{"t": "La socialisation et les groupes sociaux (SES — 2de)", "q": "Pour Bourdieu, l'« habitus » désigne :", "c": ["un système de dispositions durables (manières d'être, de faire, de goûter) intériorisées et issues de la position sociale", "un logement", "un vêtement de travail", "un diplôme"], "a": 0, "e": "L'habitus « fait exister » ce que la société a mis en nous : il oriente les goûts, les aspirations, le « sens du jeu » social.", "d": "<b>Des dispositions durables intériorisées</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la formule à connaître et à expliquer : l'habitus est un « système de dispositions durables et transposables » : concrètement : un enfant de cadres a appris (sans cours) à parler en abstrait, aimer les musées, oser questionner l'adulte, se sentir légitime dans un grand amphithéâtre : ce « sens pratique » le guide quand il choisit des études longues — ce choix semble « naturel », il est socialement produit : l'habitus est INVISIBLE pour celui qui le porte (il prend ses dispositions pour de la personnalité) : l'application : quand un recruteur dit « ce candidat a le profil » (aisance, vocabulaire), il lit un habitus de classe : la sociologie ne nie pas le mérite individuel : elle dit que le « mérite » s'appuie sur des ressources inégalement distribuées (capital culturel, économique, social).</div>"},
{"t": "La socialisation et les groupes sociaux (SES — 2de)", "q": "L'expérience des « goûters de Casper » (Bourdieu-Passeron) montre que :", "c": ["les enfants ont des goûts innés", "les codes de justification appris en famille diffèrent selon le milieu social, et l'école en valorise certains", "l'école est neutre", "le goûter n'a rien de social"], "a": 1, "e": "Les enfants de milieux favorisés manient le registre abstrait et le « jeu scolaire » (justifier, argumenter) : l'école récompense cet héritage sans le savoir.", "d": "<b>L'école valorise un héritage social</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le dispositif : on demande à des enfants de justifier un partage de goûters : les uns produisent des justifications explicites, abstraites (« la règle est... donc... »), les autres des réponses concrètes, pratiques (« chacun son morceau, comme à la maison ») : l'analyse : le « code » appris en famille diffère : l'école exige le code explicite-abstrait : ceux qui l'ont hérité « réussissent mieux » SANS que ce soit une supériorité intellectuelle : la conséquence : l'école, croyant mesurer des « dons », mesure aussi des héritages : c'est l'argument central de La Reproduction (Bourdieu-Passeron, 1970) : contre-exemple utile pour la copie : les politiques qui ATTÉNUENT l'effet (maternelle précoce, devoirs faits, éducation prioritaire) montrent que le mécanisme n'est pas une fatalité — la société peut agir sur la socialisation.</div>"},
{"t": "La socialisation et les groupes sociaux (SES — 2de)", "q": "Une norme sociale se distingue d'une valeur :", "c": ["car c'est un règlement de police", "car elle est juridique", "car c'est une règle de conduite (la valeur est l'idéal auquel elle se rapporte : ex. « politesse » est une valeur, dire « bonjour » est une norme)", "car elle est innée"], "a": 2, "e": "La norme prescrit des comportements : la valeur oriente les jugements : les normes servent les valeurs (variable selon les groupes et les époques).", "d": "<b>Norme = règle : valeur = idéal</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le couple à maîtriser : VALEUR : le respect de la propriété (idéal partagé) : NORME : ne pas couper une file d'attente, rendre ce qu'on emprunte, payer au self : AUTRE exemple : valeur : l'égalité : normes : salaire minimum, parité électorale, loi anti-discrimination : les nuances qui font la différence : une norme peut être FORMELLE (loi : le port de la ceinture : sanction juridique) ou INFORMELLE (usage : laisser sortir avant d'entrer : sanction = regard, moquerie, exclusion du groupe) : l'intensité des sanctions varie (la déviance est relative : un short au mariage est normal à Los Angeles, impensable ailleurs) : savoir distinguer et ILLUSTRER chaque catégorie est une compétence d'examen vérifiable à chaque QCM.</div>"},
{"t": "La socialisation et les groupes sociaux (SES — 2de)", "q": "Selon Goffman, la vie sociale se présente comme :", "c": ["une compétition pure", "un rêve", "une scène où les individus « jouent » des rôles selon le public (présentation de soi)", "un chaos"], "a": 2, "e": "L'approche dramaturgique : le « face-à-face » est une scène : on gère son image (face), on adapte son rôle à l'auditoire (coulisses vs scène).", "d": "<b>Une scène avec des rôles</b> (dramaturgie).<div class='ex-detail'><u>Exemple rédigé</u> : l'application concrète : le serveur : sur la « scène » (la salle), il est souriant, contrôlé, il « joue » le service impeccable : dans les « coulisses » (la cuisine), il se plaint, se détend : ce n'est pas de la fausseté : c'est la GESTION du rôle social (chaque situation a son attente normative) : autre cas : le recrutement : le candidat se « présente » (code vestimentaire, réponses préparées) — l'enjeu est la « face » (image de soi acceptable) : l'apport pour le chapitre : l'identité n'est pas une essence cachée : elle se CONSTRUIT dans l'interaction, ajustée aux publics : cela prépare la notion d'identité PLURIELLE (l'ado de la cité n'est pas « hypocrite » : il traverse des scènes aux règles différentes — un point que la sociologie contemporaine a beaucoup documenté).</div>"},
{"t": "La socialisation et les groupes sociaux (SES — 2de)", "q": "La socialisation est dite « genrée » quand :", "c": ["elle concerne le genre grammatical", "elle concerne les deux sexes", "elle transmet des rôles et attentes différents selon le sexe perçu (jouets, métiers, tâches)", "elle est déclinée en classes"], "a": 2, "e": "Dès la naissance (prénom, couleurs, jouets), les attentes divergent : ces apprentissages produisent des « choix » qui semblent naturels.", "d": "<b>Des attentes différentes selon le sexe</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne complète (à dérouler en dissertation) : 1) ENFANCE : rayons de jouets séparés, compliments différents (« jolie » vs « costaud »), tâches domestiques attribuées : 2) ÉCOLE : stéréotype de « brillance » (dès 6 ans, les filles associent la « brillance » aux garçons (Bian, Leslie, Cimpian)) : orientation : moins de filles en prépa scientifique, moins de garçons en paramédical : 3) ÂGE ADULTE : hommes qui n'osent pas prendre de congés parentaux, femmes qui « choisissent » (contraint par la charge mentale) des temps partiels : 4) RÉSULTAT : écart de salaire, écart de pension : la notion : ces « choix » sont socialement FABRIQUÉS : la socialisation genrée est le mécanisme qui transforme une différence biologique en INÉGALITÉ sociale : les politiques qui la combattent (jouets non genrés, stéréotypes dans les manuels, mixité des filières) agissent au niveau de la CAUSE, pas seulement de la conséquence — c'est l'exemple le plus clair de l'utilité de la sociologie pour décider.</div>"},
{"t": "La socialisation et les groupes sociaux (SES — 2de)", "q": "Un « groupe de référence » est :", "c": ["n'importe quel groupe", "un groupe auquel on se réfère et s'identifie, même sans en faire partie (ex. une communauté d'influenceurs)", "la famille uniquement", "un groupe auquel on APPARTIENT forcément"], "a": 1, "e": "Le groupe de référence fournit des normes d'aspiration (mode, opinions, consommation) : on peut se conformer à des groupes DISTANTS.", "d": "<b>Le groupe auquel on s'identifie</b> (appartenance ou non).<div class='ex-detail'><u>Exemple rédigé</u> : la distinction clé : groupe d'APPARTENANCE : la classe de 2de 3 (on en fait partie) : groupe de RÉFÉRENCE : les étudiants d'une grande école que l'élève regarde en se disant « c'est là que je veux être » — il n'y est pas, mais ce groupe oriente SES normes (travail, vocabulaire, ambition) : applications modernes : les influenceurs (des millions d'adolescents adoptent les codes d'un groupe auquel ils n'appartiennent pas physiquement) : les fans de football qui suivent les normes d'un club étranger : l'intérêt analytique : la socialisation ne passe pas SEULEMENT par les groupes fréquentés réellement : elle passe par des MODELES : cela explique des comportements qu'une analyse en termes de « milieu » seul ne capte pas (un jeune de milieu modeste peut avoir des aspirations de milieu favorisé — et inversement : c'est l'un des mécanismes des « transfuges de classe »).</div>"},
{"t": "La socialisation et les groupes sociaux (SES — 2de)", "q": "La « resocialisation » (Goffman : institutions totalitaires... de la société close) s'observe :", "c": ["dans la famille", "à l'école maternelle", "dans les institutions closes (armée, prison, hôpital psychiatrique, couvent) qui reformatent l'identité", "au travail simplement"], "a": 2, "e": "« Asiles » (1961) : on y restructure l'identité (uniforme, horaires, dépersonnalisation) : la socialisation est assez puissante pour RETOURNER un individu.", "d": "<b>Institutions closes</b> (armée, prison, couvent...).<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme décrit par Goffman dans Asiles : 1) CLOISONNEMENT : la personne vit dans l'institution (dort, mange, s'y occupe) : plus d'autres scènes sociales : 2) DEPERSONNALISATION : uniforme, numéro/matricule, confiscation des objets personnels : effacement des marqueurs d'identité antérieure : 3) RECONSTRUCTION : nouveaux horaires, langage, hiérarchie, récompenses : l'individu devient « le soldat », « le détenu » : la portée : cela prouve que l'identité n'est pas une essence mais un ÉQUILIBRE maintenu par des échanges avec les groupes : retiré de ses groupes, un individu peut être reformaté — ce qui est aussi l'argument des partisans du service militaire comme « intégration »... et l'objection des critiques de l'institution carcérale (effets de « prisonisation » contre-productifs : le détenu apprend les codes de la prison, pas ceux de la sortie).</div>"},
{"t": "La socialisation et les groupes sociaux (SES — 2de)", "q": "La « reproduction sociale » (Bourdieu) signifie que :", "c": ["l'école supprime les inégalités", "les positions sociales tendent à se transmettre de génération en génération (l'école légitimant des héritages)", "les familles se multiplient", "la société copie ses institutions"], "a": 1, "e": "École + capital culturel + habitus ⟹ les enfants de diplômés deviennent diplômés : l'école, pensée comme libératrice, participe aussi au tri social.", "d": "<b>Les positions sociales se transmettent</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les chiffres à citer (issus des enquêtes de l'INSEE/Éducation nationale, stables depuis 30 ans) : un enfant de cadre a ~x fois plus de chances d'obtenir un master qu'un enfant d'ouvrier (le rapport est de l'ordre de 1 à 8 pour les diplômes de l'enseignement supérieur long) : le mécanisme en 3 temps : 1) capital culturel (langage, lectures, musées, aide aux devoirs) : 2) habitus (sentiment de légitimité, « le supérieur, c'est pour nous ») : 3) institution scolaire qui mesure avec des épreuves valorisant l'héritage (l'aisance orale, l'abstraction, la « culture générale ») : la nuance indispensable : reproduction ≠ immobilité totale (des parcours ascendants existent : la France est une société ouverte MAIS inégalitaire : ~20 % de « mobilité » inter-générations) : la bonne copie montre le mécanisme ET son pourcentage — les faits précis valent mieux que les slogans.</div>"},
{"t": "La socialisation et les groupes sociaux (SES — 2de)", "q": "La socialisation est « continue » signifie :", "c": ["qu'elle ne s'interrompt jamais : entrée dans l'entreprise, retraite, mariage, numérique la poursuivent", "qu'elle se fait à l'école", "qu'elle dure 24 h/24", "qu'elle est collective"], "a": 0, "e": "On est socialisé à chaque nouveau monde social : la retraite (perte du rôle professionnel), le premier emploi (normes d'entreprise), la parentalité, les réseaux sociaux.", "d": "<b>Elle continue toute la vie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les étapes à connaître comme des RE-socialisations : 1) L'ENTREPRISE : un jeune diplômé apprend les codes (réunions, mails, « réactivité », tenue) : son identité professionnelle se construit : 2) LA PARENTALITÉ : on apprend à être parent (souvent en rejouant... ou en rejettant sa propre socialisation) : 3) LA RETRAITE : la sociologie du vieillissement montre la difficulté de quitter un rôle central (le « travailleur ») : il faut en construire un autre : 4) LE NUMÉRIQUE : à 60 ans, apprendre les codes de WhatsApp ou de l'administration en ligne est une socialisation nouvelle (sinon exclusion — « fracture numérique ») : la thèse associée : la socialisation de l'enfance garde un poids MAJEUR (les dispositions précoces sont durables), mais elle est réajustée à chaque étape : dire « l'identité est fixée à 7 ans » est une erreur : dire « l'identité est un processus » est la bonne formule.</div>"},
{"t": "Le marché du travail et l'emploi (SES — 1re)", "q": "La théorie du salaire d'efficience explique :", "c": ["l'inflation", "pourquoi les employeurs paient au-dessus du salaire d'équilibre (motivation, productivité, fidélisation)", "pourquoi les salaires baissent en crise", "la retraite"], "a": 1, "e": "Baisser les salaires détruirait l'effort et ferait partir les meilleurs : les entreprises choisissent de payer « cher » pour produire mieux.", "d": "<b>Payer plus pour obtenir plus</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement d'Akerlof et Yellen (le modèle du « don d'un demi-jour de salaire ») : 1) si l'entreprise ne paie que le marché, l'employé n'a aucun scrupule à partir et se contente du minimum : 2) si elle paie 10 % de plus, le salarié « rend » l'effort (équité perçue : la « sociologie du travail » entre dans l'économie) : 3) dans les faits : les grandes entreprises paient des primes, des avantages (cantines, mutuelles) que le marché pur n'explique pas : la conséquence théorique majeure : il existe un chômage D'ÉQUILIBRE durable (si tous paient au-dessus du marché, certains restent sans emploi même en acceptant le salaire du marché : on ne peut pas « postuler en proposant moins » : la candidature à rabais signale... la médiocrité) : c'est LA réponse au « pourquoi les salaires ne baissent pas ».</div>"},
{"t": "Le marché du travail et l'emploi (SES — 1re)", "q": "Selon la définition du BIT, un chômeur doit :", "c": ["être inscrit à France Travail uniquement", "toucher le chômage", "avoir moins de 25 ans", "être sans emploi, disponible et rechercher activement un emploi"], "a": 3, "e": "Trois conditions cumulatives : sans emploi + disponible + recherche active : l'inscription administrative n'est pas nécessaire (et inversement).", "d": "<b>Sans emploi + disponible + recherche active</b>.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi cette définition stricte : elle permet des comparaisons internationales (Eurostat, BIT) indépendantes des systèmes d'indemnisation : les conséquences à connaître : 1) une personne découragée qui ne cherche plus SORT des statistiques (d'où le « halo du chômage », plus large : France ~10-11 % en comptant le halo et le sous-emploi) : 2) un étudiant qui cherche un CDI n'est pas chômeur s'il n'est pas disponible : 3) la mesure varie donc avec la CONJONCTURE de la recherche (les gens cherchent plus quand ils y croient) : la leçon SES : un taux de chômage est un INDICATEUR construit : son mode de construction fait partie de l'analyse — ne jamais commenter un chiffre sans dire ce qu'il contient.</div>"},
{"t": "Le marché du travail et l'emploi (SES — 1re)", "q": "Un chômage « structurel » provient :", "c": ["d'une crise passagère", "d'une inadéquation durable entre qualifications offertes et compétences demandées (ou entre territoires)", "de la météo", "des congés payés"], "a": 1, "e": "Le chômage persiste même en reprise : solutions : formation, mobilité, orientation — pas seulement la relance de la demande.", "d": "<b>Inadéquation durable offre/demande de travail</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test simple : si l'on relance la demande (commandes, consommation) et que le chômage persiste, il est structurel : exemples : 1) les développeurs informatiques non pourvus (pénurie ~2015-2024) en même temps que des chômeurs sans ces compétences : 2) les bassins industriels sinistrés (la fermeture du dernier haut-fourneau) face à des métiers urbains : les politiques adaptées : formation (compte personnel, écoles du code), ORIENTATION (le paradoxe français : des étudiants massés en droit-économie et des quotas vides dans les filières industrielles), MOBILITÉ (aides à la mutation, transports), APPARIEMENT (France Travail, cabinets) : à l'inverse, le chômage conjoncturel se traite par la demande (commandes publiques, crédits) : distinguer les types = choisir la bonne politique — c'est exactement le raisonnement attendu en dissertation.</div>"},
{"t": "Le marché du travail et l'emploi (SES — 1re)", "q": "La « flexicurité » (modèle danois) combine :", "c": ["flexibilité de licenciement + forte indemnisation + formation massive", "protection à vie d'un emploi unique", "interdiction des CDD", "chômage non indemnisé"], "a": 0, "e": "Facile de licencier (les entreprises osent embaucher), généreux pour les personnes (indemnités ~90 %), exigeant sur la formation : l'emploi change, la personne est sécurisée.", "d": "<b>Flexibilité + sécurité des personnes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les trois piliers danois : 1) FLEXIBILITÉ : législation du licenciement très souple (l'entreprise ajuste vite) : 2) INDEMNISATION : allocations élevées (~90 % du salaire, longues) financées par l'impôt : 3) ACTIVATION : obligation de formation et d'acceptation des propositions (droits et devoirs) : le résultat mesuré : un turnover élevé MAIS des périodes de chômage courtes : l'emploi est mouvant, la personne est protégée (l'inverse de l'emploi protégé à vie pour quelques-uns) : le débat pour la France : les conventions collectives et le droit du travail protègent les salariés en poste (insiders) plus que les outsiders (jeunes en CDD) : la flexicurité proposer d'inverser la protection (de l'emploi vers la personne) — c'est l'un des grands débats institutionnels contemporains.</div>"},
{"t": "Le marché du travail et l'emploi (SES — 1re)", "q": "Pour Keynes, le chômage involontaire vient surtout :", "c": ["des syndicats", "de l'excès de demande", "du progrès technique", "de salaires trop bas... non : d'une demande globale insuffisante"], "a": 3, "e": "Les entreprises embauchent si elles ANTICIPENT des débouchés : sans demande, pas d'embauche, quel que soit le salaire : d'où les politiques de soutien (commandes publiques, déficit).", "d": "<b>Une demande globale insuffisante</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'argument complet : 1) la dépense des uns est le revenu des autres (circuit) : si tous réduisent leur dépense (paradoxe d'épargne : chacun a raison d'épargner ⟹ tout le monde s'appauvrit), les ventes chutent : 2) les entreprises licencient, non parce que le travail coûte trop, mais parce que les produits ne se vendent pas : 3) baisser les salaires aggraverait la demande (les salaires sont un coût ET un revenu : la double casquette keynésienne) : la politique : l'État soutient la demande (investissement public, déficit utile) : le contre-point classique : les rigidités (SMIC, protections) expliqueraient le chômage d'avant-crise : la synthèse moderne : les DEUX mécanismes coexistent (l'économie française cumule des éléments structurels ET conjoncturels) : une bonne copie présente le débat, pas un camp.</div>"},
{"t": "Le marché du travail et l'emploi (SES — 1re)", "q": "Le « halo du chômage » désigne :", "c": ["les touristes", "les personnes souhaitant travailler sans être comptées chômeuses (découragés, temps partiel subi)", "les salariés en CDI", "les retraités"], "a": 1, "e": "Autour du chômage officiel : une « ceinture » de sous-emploi invisible dans le taux BIT : l'indicateur complet le « taux de chômage au sens du BIT + halo ».", "d": "<b>Les invisibles autour du taux officiel</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les catégories du halo : 1) les DÉCOURAGÉS : ils ont cherché, n'ont rien trouvé, ont arrêté de chercher (donc plus « actifs » au sens BIT... mais disponibles et prêts) : 2) les TEMPS PARTIEL SUBIS : comptés comme « actifs occupés » alors qu'ils veulent plus d'heures : 3) les personnes en recherche découragée par les critères administratifs (non-inscrits : ils ne se comptent plus comme chômeurs) : l'ordre de grandeur : en France, halo ≈ +3-4 points au-dessus du taux officiel (un « taux de chômage complet » ~10-11 % quand le BIT dit 7 %) : la leçon : la frontière statistique est un ENJEU politique (gouverner, c'est aussi choisir les indicateurs) — un réflexe méthodologique à avoir en SES.</div>"},
{"t": "Le marché du travail et l'emploi (SES — 1re)", "q": "La « destruction créatrice » (Schumpeter) :", "c": ["concerne les tremblements de terre", "condamne l'économie à la stagnation", "interdit d'innover", "décrit comment l'innovation détruit des activités et en crée de nouvelles (la dynamique du capitalisme)"], "a": 3, "e": "L'entrepreneur innovateur renverse les anciennes combinaisons : le wagon a tué la diligence, le numérique la presse : à condition que la société organise la transition.", "d": "<b>Innover = détruire et créer</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique à double détente : 1) DESTRUCTION : la photographie argentique (Kodak : faillite 2012, 145 000 emplois perdus depuis les années 90), la presse de kiosque, les agences de voyage en vitrine, les vidéoclubs : 2) CRÉATION : smartphones (Apple emploie... et surtout FAIT vivre des écosystèmes d'applications : des millions d'emplois dans le monde), influenceurs, développeurs, infographistes 3D : la nuance à écrire : le SOLDE global est souvent positif, mais la transition est inégalement supportée (les détruits ne sont pas les créateurs : âge, territoire, qualification) : c'est pourquoi la réponse est institutionnelle : formation, indemnisations, réindustrialisation : la formule de Schumpeter est un impératif de POLITIQUE PUBLIQUE, pas une fatalité naturelle à subir.</div>"},
{"t": "Le marché du travail et l'emploi (SES — 1re)", "q": "En France, les nouveaux contrats proposés aux jeunes actifs sont majoritairement :", "c": ["des fonctions publiques", "des CDI", "des contrats à vie", "des CDD et missions d'intérim (flexibilité « à la marge » pour les entrants)"], "a": 3, "e": "La protection est concentrée sur les salariés en place (insiders) : les jeunes et les moins qualifiés portent l'ajustement (CDD, intérim : ~70 % des embauches).", "d": "<b>CDD/intérim pour les entrants</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le marché à deux vitesses : le noyau : CDI protégés (licenciement encadré, conventions collectives) : la marge : CDD, intérim, stages, plateformes — majoritaires chez les moins de 30 ans et les non-qualifiés : le mécanisme (théorie insider-outsider, Lindbeck et Snower) : protéger l'existant RENCHÉRIT l'entrée (une entreprise hésite à créer un CDI « pour essayer » : elle prend un CDD) : les effets discutés : sécurise les familles (le CDI moyen dure ~10 ans) MAIS allonge les « petits boulots » des jeunes (l' « année de stages ») : les réformes tentées (CDI « de projet », seuils d'activation progressifs) visent à lisser la marche d'entrée : le sujet est TOUJOURS politique (contrats première embauche, retraites... chaque révision touche le même nœud : comment partager le risque du travail ?) : c'est un classique de dissertation SES.</div>"},
