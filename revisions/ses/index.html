{"t": "Environnement et climat : croissance soutenable (SES — Term)", "q": "La « tragédie des communs » (Hardin) décrit :", "c": ["la surexploitation d'une ressource d'accès libre car chaque utilisateur ne supporte qu'une fraction du coût", "la rareté naturelle des matières premières", "la nationalisation des ressources", "la pollution des villes"], "a": 0, "e": "Chaque berger gagne à ajouter une bête (bénéfice privé entier, coût partagé) : la ressource commune s'effondre.", "d": "<b>Un pré, des bergers, zéro contrat</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une pêcherie libre d'accès : chaque pêcheur gagne 100 % de sa prise mais la baisse des stocks coûte à tous : chacun surpêche « sinon les autres le feront » → effondrement (la morue de Terre-Neuve, 1992 : fermeture totale de la pêche) : les remèdes d'Ostrom (Nobel 2009) : définir les droits (quotas individuels transférables), surveillance locale, sanctions graduées — ou la solution étatique (quotas UE) : en EC, la ressource = le climat partagé par tous les États — d'où la difficulté des COP (le même dilemme à l'échelle des nations).</div>"},
{"t": "Environnement et climat : croissance soutenable (SES — Term)", "q": "Une taxe carbone « pigouvienne » vise à :", "c": ["remplacer l'impôt sur le revenu", "faire payer le coût social de chaque tonne de CO₂ pour corriger le prix de marché", "financer l'État", "punir les consommateurs"], "a": 1, "e": "Pigou : taxer l'activité nuisible du montant de son coût externe — rétablir l'égalité coût privé + taxe = coût social.", "d": "<b>Réparer le prix</b>.<div class='ex-detail'><u>Exemple rédigé</u> : une tonne de CO₂ cause des dommages estimés (coût social du carbone : de 30 à plus de 100 €/t selon les modèles) : une taxe de ce montant fait monter l'essence, le gaz, les vols → les agents arbitrent (moins rouler, isoler, électrique) SANS qu'un bureaucrate choisisse pour eux : la vertu = le signal-prix diffuse partout : le talon d'Achille = la régressivité (les ménages modestes et ruraux dépensent plus d'énergie par revenu) → d'où la proposition du dividende climat (redistribuer la taxe en forfait par habitant : les sobres y gagnent, les pollueurs paient) — citer Pigou PUIS la redistribution, c'est la copie complète.</div>"},
{"t": "Environnement et climat : croissance soutenable (SES — Term)", "q": "Le marché de quotas d'émission (cap-and-trade) a l'avantage sur la taxe de :", "c": ["ne rien coûter aux entreprises", "garantir la quantité totale d'émissions (le prix s'ajuste)", "être plus simple à mettre en place", "être accepté par tous les citoyens"], "a": 1, "e": "On fixe le plafond (cap) : la certitude porte sur le résultat environnemental, le prix fluctue (inverse de la taxe).", "d": "<b>Quantité certaine, prix incertain</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le SEQE-UE couvre ~40 % des émissions européennes : plafond dégressif (~4,3 %/an), les industriels achètent leurs quotas aux enchères ou en reçoivent : quand le plafond baisse, le prix monte (5 €/t en 2017, ~80-100 €/t en 2022-23) : les réformes : suppression progressive des quotas gratuits, MACF aux frontières dès 2026 (les importateurs paient aussi) : comparaison : la taxe donne un prix STABLE (les entreprises planifient) mais un résultat incertain ; les quotas l'inverse : d'où l'idée de prix plancher/sol sur les marchés de quotas pour combiner les avantages.</div>"},
{"t": "Environnement et climat : croissance soutenable (SES — Term)", "q": "Le mécanisme d'ajustement carbone aux frontières (MACF) vise à :", "c": ["réduire les droits de douane classiques", "financer le SEQE-UE", "éviter les « fuites de carbone » (délocalisation des productions polluantes) en taxant les importations selon leur contenu carbone", "aider les pays pauvres"], "a": 2, "e": "Sans le MACF, une usine européenne taxée peut migrer vers un pays non contraint : les émissions mondiales ne baissent pas — le MACF égalise le traitement (plein effet progressif 2026-2034).", "d": "<b>Fermer la fuite</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'acier européen paie le carbone (quota à ~80 €/t) : l'acier importé d'un pays sans prix du carbone, non : risque : fermeture des hauts-fourneaux européens et report des émissions ailleurs (fuite de carbone) : le MACF : l'importateur déclare le contenu carbone de son acier et paie l'équivalent du prix du quota européen : effet : inciter les exportateurs mondiaux à décarboner (la Chine a lancé son propre marché du carbone en 2021) : critique : « protectionnisme vert » ? débat OMC et pays du Sud : une EC solide présente l'outil ET sa controverse.</div>"},
{"t": "Environnement et climat : croissance soutenable (SES — Term)", "q": "Un découplage « absolu » entre PIB et émissions signifie :", "c": ["le PIB baisse", "les émissions totales diminuent alors que le PIB augmente", "les deux sont stables", "les émissions baissent par unité de PIB mais augmentent en volume"], "a": 1, "e": "Relatif : intensité carbone par € de PIB en baisse ; absolu : volume total d'émissions en baisse avec PIB en hausse.", "d": "<b>Le vocabulaire décisif</b>.<div class='ex-detail'><u>Exemple rédigé</u> : relatif : un pays fait +2 % de PIB et −1 % d'émissions par unité → les émissions TOTALES montent encore (+1 %) : absolu : l'UE depuis ~1990 : PIB en hausse d'un tiers, CO₂ de production −25 à −30 % (nucléaire, renouvelables, délocalisation partielle d'activités...) : MAIS : empreinte carbone IMPORTÉE (consommation) décroît beaucoup moins vite (on importe le carbone d'ailleurs) — et la biodiversité, l'eau, les métaux ne sont pas découplés : d'où l'exigence : découplage absolu, tous flux, suffisant et rapide — c'est LE critère de la « croissance verte », à manier avec précaution statistique.</div>"},
{"t": "Environnement et climat : croissance soutenable (SES — Term)", "q": "L'accord de Paris (2015) repose sur :", "c": ["un accord entre les seules grandes puissances", "une taxe mondiale", "des quotas obligatoires mondiaux", "des contributions nationales volontaires (NDC) révisées régulièrement, visant un réchauffement bien en dessous de 2 °C"], "a": 3, "e": "Volontariat révisé tous les 5 ans (cycle d'ambition) — la flexibilité a permis l'unanimité (195 parties), la contrainte reste faible.", "d": "<b>Paris : l'art du possible</b>.<div class='ex-detail'><u>Exemple rédigé</u> : après l'échec de Copenhague (2009) et la non-ratification de Kyoto par les USA, Paris choisit l'architecture INVERSÉE : chaque pays annonce ce qu'il peut (NDC), pas de sanction, mais transparence et révisions tous les 5 ans (ratchet : les ambitions doivent monter) : bilan : presque tous ont soumis des NDC, MAIS la somme actuelle des engagements mène à ~2,5-3 °C — d'où l'enjeu des COP successives et du « greenwashing » des promesses : la SES analyse : Paris = changement de régime (universalité, dynamisme) sans garantie — l'action collective mondiale reste un bien public à construire.</div>"},

        T(hx + 0.52 * ln.size * gapSp, y, ln.size, true, s.t, COL.ind);
        hx += 0.52 * ln.size * (enc2.length + gapSp);
        prevEnd = / $/.test(s.t);
      });
      y -= ln.size * 0.37 + 3;
      return;
    }
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    if (ln.li) T(x - 11, y, ln.size, false, '\u2022', COL.ind);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      T(x, y, ln.size, s.b, s.t, COL.blk);
      x += 0.52 * ln.size * pdfEnc(pdfTranslit(s.t)).length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  for (var p = 0; p < pages.length; p++){
    var pgFoot = 'Fiche synth\u00e9tique' + (typeof PDF_MATIERE !== 'undefined' && PDF_MATIERE ? ' \u2014 ' + PDF_MATIERE : '') + ' \u2014 ' + curTitle;
    var fx = M, fw = 0.52 * 7.5 * pdfEnc(pdfTranslit(pgFoot)).length;
    pages[p].push(rg(COL.gry) + ' BT 1 0 0 1 ' + fx + ' 30 Tm /F1 7.5 Tf (' + pdfEsc(pdfEnc(pdfTranslit(pgFoot))) + ') Tj ET');
    var pn = 'Page ' + (p + 1) + ' / ' + pages.length;
    var pw = 0.52 * 7.5 * pn.length;
    pages[p].push('BT 1 0 0 1 ' + (W - M - pw).toFixed(2) + ' 30 Tm /F1 7.5 Tf (' + pdfEsc(pn) + ') Tj ET');
  }
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p2 = 0; p2 < pages.length; p2++){
    var po = 5 + 2 * p2, co = 6 + 2 * p2;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p2].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i2 = 1; i2 < objs.length; i2++){
    offs[i2] = out.length;
    if (objs[i2].indexOf('STREAM:') === 0){
      var st = objs[i2].slice(7);
      out += i2 + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i2 + ' 0 obj\n' + objs[i2] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i3 = 1; i3 < objs.length; i3++) out += ('0000000000' + offs[i3]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';

  v.innerHTML = '<section class="card"><h2>📋 Programme de SES</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p><div style="margin:12px 0 0"><input type="text" id="prog-search" oninput="progSearchList(this.value)" placeholder="🔎 Rechercher dans les cours..." style="width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.9rem;font-family:inherit;outline:none"></div><div id="prog-search-results"></div>' + h + '</section>';
})();
// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();
