<script>
var PROGRAMME = [{"n": "Seconde — SES", "ch": [{"t": "Le marché et la formation des prix", "id": "marche-prix"}, {"t": "La création des richesses", "id": "creation-richesses"}, {"t": "Les entreprises et leur organisation", "id": "entreprises"}, {"t": "La socialisation et les groupes sociaux", "id": "socialisation"}]}, {"n": "Première — SES", "ch": [{"t": "Le marché du travail et l'emploi", "id": "marche-travail-emploi"}, {"t": "La monnaie et le financement de l'économie", "id": "monnaie-financement"}, {"t": "Les mobilités sociales", "id": "mobilites-sociales"}, {"t": "L'Union européenne et l'intégration économique", "id": "europe-integration"}]}, {"n": "Terminale — SES", "ch": [{"t": "Croissance, développement et inégalités", "id": "croissance-developpement-inegalites"}, {"t": "Mondialisation et commerce international", "id": "mondialisation-ecommerce"}, {"t": "Politiques économiques : relance, rigueur et régulation", "id": "politiques-economiques"}, {"t": "Environnement et climat : croissance soutenable", "id": "environnement-climat"}]}];
var COURS_META = [
 {
  "id": "marche-prix",
  "theme": "Le marché et la formation des prix (SES — 2de)",
  "niveau": "Seconde — SES",
  "titre": "Le marché et la formation des prix",
  "cours": "<div class=\"cours-head\"><h2>Le marché et la formation des prix</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu\'est-ce qu\'un marché ?</h3>\n<p>Un <b>marché</b> est un lieu (réel ou fictif) de rencontre entre une <b>offre</b> (les vendeurs) et une <b>demande</b> (les acheteurs), en vue d\'échanger un bien ou un service à un certain prix. Le marché suppose :</p>\n<ul>\n<li>des <b>droits de propriété</b> bien définis (on ne peut vendre que ce que l\'on possède) ;</li>\n<li>l\'<b>information</b> : les agents doivent connaître les caractéristiques du produit ;</li>\n<li>une <b>concurrence</b> potentielle entre vendeurs et entre acheteurs.</li>\n</ul>\n<p>Il existe une grande variété de marchés :</p>\n<table>\n<tr><th>Type de marché</th><th>Exemple</th><th>Ce qui s\'y échange</th></tr>\n<tr><td>Marché de produits</td><td>marché des fruits, plateforme de vente en ligne</td><td>biens et services</td></tr>\n<tr><td>Marché du travail</td><td>embauche, CV, entretiens</td><td>le travail contre un salaire</td></tr>\n<tr><td>Marché des capitaux</td><td>Bourse, banques</td><td>des fonds (actions, obligations, prêts)</td></tr>\n<tr><td>Marché monétaire</td><td>marché interbancaire</td><td>la monnaie (contre des titres)</td></tr>\n<tr><td>Marché « pur et parfait »</td><td>modèle théorique</td><td>atomicité, transparence, libre entrée, homogénéité, mobilité</td></tr>\n</table>\n<div class=\"tip\"><b>Les 5 conditions de la concurrence « pure et parfaite »</b> (à connaître par cœur) :\n<ol>\n<li><b>Atomicité</b> : une multitude d\'offreurs et de demandeurs, aucun ne pouvant influencer le prix (ils sont « price takers ») ;</li>\n<li><b>Homogénéité des produits</b> : les produits sont identiques ou très proches (ex. le blé) ;</li>\n<li><b>Libre entrée et libre sortie</b> sur le marché ;</li>\n<li><b>Transparence</b> : tous les agents sont informés des prix et des caractéristiques ;</li>\n<li><b>Mobilité des facteurs de production</b> (travail et capital peuvent se déplacer vers les usages les plus rentables).</li>\n</ol>\nDans la réalité, aucun marché ne respecte exactement ces cinq conditions : c\'est un <b>modèle de référence</b>, pas une photographie du réel.</div>\n\n<h3>2. La loi de l\'offre et de la demande et la formation du prix</h3>\n<p>Sur un marché concurrentiel, le prix s\'ajuste jusqu\'à ce que la quantité offerte égale la quantité demandée : c\'est le <b>prix d\'équilibre</b>.</p>\n<ul>\n<li>La <b>demande</b> est généralement <b>décroissante</b> : plus le prix monte, moins les acheteurs en veulent (substitution, revenu limité) ;</li>\n<li>L\'<b>offre</b> est généralement <b>croissante</b> : plus le prix est élevé, plus les producteurs sont incités à produire (marge plus forte) ;</li>\n<li>Le point de croisement des deux courbes donne le <b>prix d\'équilibre p*</b> et la <b>quantité d\'équilibre q*</b>.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Equilibre offre-demande\">\n  <line x1=\"50\" y1=\"190\" x2=\"410\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"400\" y=\"207\" font-size=\"11\" fill=\"#64748b\">q</text>\n  <line x1=\"50\" y1=\"190\" x2=\"50\" y2=\"15\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"34\" y=\"20\" font-size=\"11\" fill=\"#64748b\">p</text>\n  <line x1=\"70\" y1=\"40\" x2=\"390\" y2=\"175\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <text x=\"378\" y=\"160\" font-size=\"11\" fill=\"#16a34a\">Offre</text>\n  <line x1=\"70\" y1=\"175\" x2=\"390\" y2=\"40\" stroke=\"#dc2626\" stroke-width=\"2.5\"/>\n  <text x=\"378\" y=\"55\" font-size=\"11\" fill=\"#dc2626\">Demande</text>\n  <circle cx=\"230\" cy=\"107\" r=\"5\" fill=\"#4f46e5\"/>\n  <line x1=\"230\" y1=\"107\" x2=\"230\" y2=\"190\" stroke=\"#4f46e5\" stroke-dasharray=\"4 3\"/>\n  <line x1=\"50\" y1=\"107\" x2=\"230\" y2=\"107\" stroke=\"#4f46e5\" stroke-dasharray=\"4 3\"/>\n  <text x=\"238\" y=\"103\" font-size=\"11\" fill=\"#4f46e5\">&#233;quilibre (p*, q*)</text>\n  <text x=\"18\" y=\"111\" font-size=\"10\" fill=\"#4f46e5\">p*</text>\n  <text x=\"226\" y=\"204\" font-size=\"10\" fill=\"#4f46e5\">q*</text>\n</svg><span class=\"fig-cap\">L\'équilibre concurrentiel : la demande (rouge) est décroissante, l\'offre (verte) croissante. Au prix p*, la quantité offerte égale exactement la quantité demandée : le marché « se vide », ni pénurie ni invendus.</span></div>\n<p>Mécanisme d\'ajustement (à savoir raconter) :</p>\n<ol>\n<li>Si le prix est <b>supérieur à p*</b> : l\'offre dépasse la demande → <b>excédent</b> → les invendus poussent les vendeurs à baisser leurs prix ;</li>\n<li>Si le prix est <b>inférieur à p*</b> : la demande dépasse l\'offre → <b>pénurie</b> → les acheteurs surenchérissent (ou les vendeurs relèvent leurs prix) ;</li>\n<li>Le prix converge ainsi vers l\'équilibre : le prix est un <b>signal</b> qui coordonne les décisions décentralisées de millions d\'agents.</li>\n</ol>\n\n<h3>3. L\'élasticité : comment offre et demande réagissent-elles au prix ?</h3>\n<p>L\'<b>élasticité-prix</b> mesure la sensibilité de la demande (ou de l\'offre) à une variation du prix :</p>\n<div class=\"formule\">élasticité-prix de la demande = (variation en % de la quantité demandée) ÷ (variation en % du prix)</div>\n<ul>\n<li>Si |e| &gt; 1 : la demande est <b>élastique</b> (le consommateur réagit fortement — ex. voyages de vacances) ;</li>\n<li>Si |e| &lt; 1 : la demande est <b>inélastique (rigide)</b> (le consommateur réagit peu — ex. essence, pain, médicaments) ;</li>\n<li>L\'élasticité dépend des <b>substituts disponibles</b>, de la part du bien dans le budget et de son caractère indispensable.</li>\n</ul>\n<div class=\"tip\"><b>Application classique — la taxation :</b> un État qui veut taxer un produit (tabac, carburant) doit connaître son élasticité :\n<ul>\n<li>si la demande est rigide (tabac), la taxe rapporte beaucoup mais dissuade peu la consommation ;</li>\n<li>si la demande est élastique (voyages), la taxe fait chuter fortement la consommation… et rapporte peu, voire déplace les achats vers l\'étranger.</li>\n</ul>\n</div>\n\n<h3>4. Quand le marché échoue : les limites et les interventions</h3>\n<p>Le marché réel s\'écarte souvent du modèle. Deux types de situations à distinguer :</p>\n<p><b>a) Les structures de marché imparfaites</b></p>\n<table>\n<tr><th>Structure</th><th>Nombre de vendeurs</th><th>Exemple</th><th>Conséquence sur le prix</th></tr>\n<tr><td>Concurrence pure et parfaite</td><td>très nombreux</td><td>blé, actions en Bourse</td><td>prix = coût marginal</td></tr>\n<tr><td>Concurrence monopolistique</td><td>nombreux, produits différenciés</td><td>restaurants, lessives</td><td>pouvoir de marché faible</td></tr>\n<tr><td>Oligopole</td><td>quelques grands</td><td>télécoms, constructeurs automobiles</td><td>interdépendance stratégique</td></tr>\n<tr><td>Monopole</td><td>un seul</td><td>historiquement l\'électricité (rail)</td><td>le monopoleur choisit son prix (le plus élevé possible)</td></tr>\n</table>\n<p><b>b) Les défaillances de marché</b> (market failures)</p>\n<ul>\n<li><b>Externalités</b> : la pollution d\'une usine coûte à la collectivité sans apparaître dans le prix → l\'État taxe (taxe carbone) ou crée un marché de quotas (marché du CO₂) ;</li>\n<li><b>Biens collectifs</b> (éclairage public, défense) : personne ne veut payer spontanément → financement public obligatoire ;</li>\n<li><b>Asymétries d\'information</b> : le vendeur d\'une voiture d\'occasion en sait plus que l\'acheteur (« marché des lemons » d\'Akerlof) → sélection adverse, méfiance, voire disparition du marché ; l\'État impose la garantie légale, le contrôle technique ;</li>\n<li><b>Pouvoirs de marché</b> : ententes et abus de position dominante → régulation par les autorités de la concurrence (en France : Autorité de la concurrence ; en Europe : Commission européenne, DG Concurrence).</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser l\'effet d\'une taxe sur un marché concurrentiel</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L\'État impose une taxe de 1 € par litre sur les sodas. Expliquez, à l\'aide d\'un schéma, l\'effet sur le prix payé par les consommateurs, sur la quantité échangée et sur la répartition du fardeau de la taxe.</div><div class=\"etu\"><b>Étape 1 — Mécanisme</b> : la taxe décale l\'offre vers le haut (chaque producteur exige 1 € de plus) → le prix payé par l\'acheteur monte, le prix reçu par le vendeur baisse, la quantité échangée diminue (nouvel équilibre plus bas en quantité, écarté de p* d\'au plus 1 €).</div><div class=\"etu\"><b>Étape 2 — Répartition du fardeau</b> : elle dépend de l\'élasticité. Si la demande est rigide (|e| faible), les consommateurs paient l\'essentiel de la taxe ; si la demande est élastique, les producteurs en supportent la plus grande part.</div><div class=\"etu\"><b>Étape 3 — Effets évalués</b> : recettes fiscales, baisse de la consommation (objectif sanitaire), pertes pour les producteurs et création d\'une « perte sèche » (échanges qui n\'ont plus lieu).</div><div class=\"etu\"><b>Étape 4 — Nuancer</b> : l\'efficacité dépend de l\'élasticité-prix (substituts, frontières), de la sincérité de l\'objectif (santé publique ou budget ?) et de l\'usage des recettes (affectées à la prévention ?).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Le prix d\'équilibre n\'est pas un « juste prix » : c\'est un prix qui égalise offre et demande, rien de plus.</li>\n<li>Une demande élastique a une élasticité <b>en valeur absolue</b> supérieure à 1 ; l\'élasticité-prix de la demande est <b>négative</b> par convention (quantités et prix varient en sens inverse) : ne pas confondre signe et ampleur.</li>\n<li>Concurrence « pure et parfaite » : 5 conditions — ne pas en oublier (atomicité, homogénéité, libre entrée, transparence, mobilité).</li>\n<li>Monopole ne veut pas dire « absence de concurrence » totale : il existe des substituts (le train face à l\'avion), et des monopoles naturels justifiés par des coûts décroissants (réseaux).</li>\n<li>Dans la loi de l\'offre et de la demande, c\'est le prix qui s\'ajuste aux quantités — ne pas inverser la causalité dans un schéma.</li>\n<li>Régulation ≠ nationalisation : l\'État peut encadrer les prix (plafonnement), réguler (autorités), taxer (externalités) ou laisser faire — toujours préciser l\'instrument.</li>\n</ul>\n</div>"

  "titre": "La création des richesses",
  "cours": "<div class=\"cours-head\"><h2>La création des richesses</h2><span class=\"niv\">SES · 2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. Production, valeur ajoutée, PIB</h3>\n<div class=\"tip\"><b>Production =</b> activité qui crée des biens/services : marchands (vendus) ou non marchands (gratuits ou quasi-gratuits : éducation, sécurité : financés par prélèvements).<br><b>Valeur ajoutée (VA) = production − consommations intermédiaires</b> (ce que l\'entreprise achète et transforme/détruit : matières, énergie, services). La VA est la richesse créée par l\'entreprise.<br><b>PIB = somme des VA</b> (+ TVA) d\'un pays : l\'indicateur de richesse créé, pas de la richesse possédée.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — de la baguette au PIB</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un boulanger achète 0,40 € de farine et d\'ingrédients par baguette, la vend 1,20 €. Calculez sa VA, puis expliquez comment le PIB totalise les VA.</div><div class=\"etu\"><b>Étape 1</b> — <b>La VA</b> : VA = 1,20 − 0,40 = <b>0,80 €</b> par baguette : c\'est le supplément de valeur créé par le travail du boulanger (transformation, cuisson, service).</div><div class=\"etu\"><b>Étape 2</b> — <b>Pourquoi sommer les VA et non les productions</b> : si on additionnait les productions, on compterait la farine DEUX fois (une fois comme production de l\'agriculteur, une fois dans le prix du pain) : le PIB additionne les VA pour ne compter chaque richesse qu\'UNE fois.</div><div class=\"etu\"><b>Étape 3</b> — <b>La répartition</b> : cette VA de 0,80 € est distribuée : salaires (≈ 55 % de la VA en France), impôts sur la production, excédent brut d\'exploitation (profit du boulanger) : le PIB est donc AUSSI la somme des revenus distribués (approche par les revenus) : produire = créer ce qui sera distribué : le circuit est bouclé (production → revenus → dépenses → production).</div></div></details>\n<h3>2. Mesurer : limites du PIB</h3>\n<div class=\"tip\"><b>Le PIB ne mesure pas :</b> le travail domestique et bénévole (une machine à laver « détruit » du PIB si elle remplace un service payant... ou l\'inverse), l\'économie informelle, le patrimoine naturel consommé, les inégalités (moyenne ≠ répartition), la qualité de vie.<br><b>Indicateurs complémentaires :</b> PIB/habitant (comparaisons), IDH (santé + éducation + revenu), empreinte écologique, indicateur de bien-être (OCDE), « PIB vert ». <b>PIB ≠ richesse du pays</b> (stock) : c\'est un FLUX annuel.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la recession de 2020 et le rebond</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le PIB français a baissé de ~8 % en 2020 puis a rebondi. Que mesure exactement cette variation ? Donne un exemple de ce que le PIB n\'a pas vu.</div><div class=\"etu\"><b>Étape 1</b> — <b>Ce qu\'il mesure</b> : l\'effondrement des transactions marchandes : restaurants fermés, avions cloués, voitures invendues : la valeur ajoutée de ces secteurs a chuté : −8 % = la France a produit ~8 % de richesse marchande et non marchande « effective » en moins.</div><div class=\"etu\"><b>Étape 2</b> — <b>Ce qu\'il n\'a pas (bien) vu</b> : le télétravail massif (cours en ligne : peu comptés), le bénévolat pandémique (fabrication de masques, soutien aux voisins : non marchand non compté), la souffrance sociale : en revanche, les dépenses de santé, les dispositifs « quoi qu\'il en coûte » (garanties, déficits) apparaissent... plus tard : le PIB 2020 a SAUVÉ des entreprises mortes en comptant leurs salaires payés par le chômage partiel (transferts). </div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan SES</b> : le PIB reste l\'indicateur central (il mesure l\'activité, l\'emploi, les ressources fiscales possibles) mais doit être COMPLÉTÉ (IDH, inégalités, empreinte) : la règle de copie : ne jamais dire « le PIB est mauvais » : dire « le PIB mesure X, pas Y : pour Y, on utilise Z » : la précision méthodologique est la compétence valorisée en SES.</div></div></details>\n<h3>3. Croissance : sources et limites</h3>\n<div class=\"tip\"><b>Croissance = augmentation du PIB réel</b> (à prix constants : on enlève l\'inflation). Sources : <b>travail</b> (population active, durée, qualification : capital humain), <b>capital physique</b> (machines, infrastructures : investissement), <b>productivité globale des facteurs</b> (progrès technique, organisation — Solow).<br><b>Facteurs institutionnels :</b> droits de propriété, stabilité, éducation, recherche, open innovation.<br><b>Limites :</b> la croissance extensive (plus de ressources) a des rendements décroissants : la croissance intensive (mieux produire) est la seule soutenable à long terme... mais bute sur l\'écologie (découplage absolu à démontrer).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — les Trente Glorieuses : anatomie d\'un miracle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La France de 1945-1975 connaît ~5 %/an de croissance. Décomposez les sources de cette croissance.</div><div class=\"etu\"><b>Étape 1</b> — <b>Travail</b> : reconstruction + baby-boom (la population active gonfle), exode rural (l\'agriculture libère des bras pour l\'industrie : gains de productivité agricoles), immigration de travail, catching-up des qualifications.</div><div class=\"etu\"><b>Étape 2</b> — <b>Capital</b> : reconstruction, Plan Monnet-Marshall (américain : dollars + machines), investissement massif dans l\'industrie et les infrastructures : le ratio capital/travail monte.</div><div class=\"etu\"><b>Étape 3</b> — <b>Progrès technique</b> : transferts américains (fordisme : chaîne, électricité, chimie), énergie abondante et pas chère (pétrole), gains de productivité ~5 %/an : ils financent les salaires réels (+ la consommation de masse : équipement, voiture, tourisme). La fin (1973-75) : chocs pétroliers + plein-emploi des gisements extensifs : la croissance doit devenir INTENSIVE (innovation) — plus lente : le chapitre suivant (de 2de) sur la consommation l\'explique : produire plus AVEC MOINS devient la règle, et la question écologique la radicalise.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le PIB n\'est pas « la richesse » (un stock : patrimoine) mais un flux : VA ≠ chiffre d\'affaires (retrancher les consommations intermédiaires) : croissance nominale ≠ réelle (déflater) : le PIB marchand sous-estime le non-marchand (prix imputés) : dire « le PIB ne mesure pas le bonheur » est un cliché : ce qui est attendu, c\'est de dire CE QU\'il mesure et avec quelles limites.</div>"

  "cours": "<div class=\"cours-head\"><h2>Les entreprises et leur organisation</h2><span class=\"niv\">SES · 2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. Qu\'est-ce qu\'une entreprise ?</h3>\n<div class=\"tip\"><b>Définition :</b> organisation combinant <b>travail</b> (salariés), <b>capital</b> (machines, bâtiments, brevets) et <b>information</b> pour produire des biens/services marchands (le secteur non marchand = administrations/associations).<br><b>Objectifs :</b> profit (maximiser la VA répartie en rémunérant le capital), mais aussi survie, part de marché, croissance... <b>l\'entreprise est un lieu de COOPÉRATION (produire ensemble) ET de CONFLIT (partage de la VA)</b> : salaires vs profits : marché du travail + relations professionnelles.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire un compte de résultat simplifié</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une PME : chiffre d\'affaires 500 k€, consommations intermédiaires 200 k€, salaires 180 k€, impôts 20 k€, intérêts 10 k€. Calculez VA, EBE, profit et montrez les enjeux du partage.</div><div class=\"etu\"><b>Étape 1</b> — <b>Création</b> : VA = 500 − 200 = <b>300 k€</b> (richesse créée) : l\'entreprise « transforme » 200 k€ d\'achats en 300 k€ de valeur supplémentaire grâce au travail et au capital.</div><div class=\"etu\"><b>Étape 2</b> — <b>Partage primaire</b> : EBE = VA − salaires − impôts = 300 − 180 − 20 = <b>100 k€</b> : l\'excédent va au capital (propriétaires, prêteurs, investissement) : après intérêts (10), le profit est 90 k€ : salaires 60 % de la VA : profit 30 % (moyennes françaises respectées).</div><div class=\"etu\"><b>Étape 3</b> — <b>L\'enjeu SES</b> : si les salariés obtiennent +20 k€ de salaires, l\'EBE tombe à 80 : si les propriétaires gardent tout, l\'investissement ou les salaires en pâtissent : le conflit d\'intérêts est STRUCTUREL (partage d\'un gâteau unique) : c\'est pourquoi négociations collectives, syndicats, right to strike et partage de la VA sont des institutions centrales du capitalisme : l\'entreprise est un nœud de POUVOIRS, pas juste une fonction de production.</div></div></details>\n<h3>2. Formes juridiques et tailles</h3>\n<div class=\"tip\"><b>Statuts :</b> entreprise individuelle (responsabilité infinie de l\'entrepreneur), société (SARL/EURL, SAS/SASU : responsabilité limitée aux apports : la forme dominante des créations aujourd\'hui), SA (actions en bourse : capital ouvert), coopératives (SCOP : les salariés sont associés), associations (non lucratif).<br><b>Tailles :</b> micro-entreprise (&lt;10 salariés : 96 % des entreprises françaises !), PME (10-250 : la majorité des emplois), ETI (250-5 000), grand groupe (5 000+) : le « tissu » est dominé par les TPE-PME, la recherche et l\'export par les grands groupes.<br><b>Depuis les années 1980 :</b> « désintégration » : les grandes entreprises se concentrent sur le cœur (marque, R&D) et SOUS-TRAITENT le reste (chaînes de valeur mondiales : Apple conçoit, Foxconn assemble).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi tant de SAS ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La grande majorité des créations d\'entreprises françaises sont des SAS/SASU ou micro-entrepreneurs. Que révèle ce choix juridique ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La SAS</b> : responsabilité limitée aux apports (on ne perd que ce qu\'on a mis), statuts très libres (organiser pouvoir, entrée d\'investisseurs, bonis), crédibilité auprès des banques et investisseurs : le « sur-mesure juridique » — voilà pourquoi la SAS a détrôné la SARL.</div><div class=\"etu\"><b>Étape 2</b> — <b>La micro-entreprise</b> : comptabilité ultra-simplifiée (un livre de recettes, charges calculées forfaitaires) : idéal pour tester une activité, un statut d\'auto-entrepreneur ( Freelance, artisan, Uber) : MAIS pas de protection sociale complète comparée au salarié (chômage absent), plafonds de chiffre d\'affaires.</div><div class=\"etu\"><b>Étape 3</b> — <b>Lecture SES</b> : le choix du statut est un choix d\'INCITATIONS : le législateur a voulu fluidifier la création (juridictions entrepreneuriales simplifiées) : les chiffres ont suivi (+1 M de micro-entrepreneurs depuis 2008) : les critiques : précarisation déguisée ? (des plateformes « poussent » vers ce statut pour éviter les charges salariales — contentieux Uber) : le droit des affaires EST une politique économique : le formulaire juridique façonne les comportements.</div></div></details>\n<h3>3. Coopération et pouvoir dans l\'entreprise</h3>\n<div class=\"tip\"><b>Taylorisme (1900) :</b> séparation conception/exécution, parcellisation, contrôle : gains de productivité MASSIFS mais aliénation (Chaplin, « Les Temps modernes »). <b>Fordisme (1920) :</b> + chaîne de montage + salaire élevé (les ouvriers achètent les voitures). <b>Toyotisme (1970) :</b> qualité totale, juste-à-temps, implication des opérateurs (multi-tâches), résolution de problèmes : « lean ».<br><b>Aujourd\'hui :</b> agilité, télétravail, management participatif... mais aussi intensification (burn-out), surveillance numérique (badgeage connecté) : la question du POUVOIR demeure : qui décide (actionnaires, dirigeants, salariés) ? Comités sociaux, actionnariat salarié, codétermination allemande.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — du taylorisme au plateau de startup</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparez l\'organisation du travail : l\'usine Taylor (1910), la chaîne Ford (1930), l\'atelier Toyota (1985) et le « open space » d\'une scale-up (2024). Quelle continuité ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Taylor</b> : « il n\'y a qu\'une seule bonne manière » : le bureau des méthodes chronomètre, l\'ouvrier exécute un geste : productivité ×3, métiers déqualifiés, conflits violents.</div><div class=\"etu\"><b>Étape 2</b> — <b>Ford puis Toyota</b> : Ford ajoute la chaîne et les 5 dollars/jour (consommation de masse) : Toyota inverse la logique : ce sont les OPÉRATEURS qui améliorent le processus (kaizen, andon : arrêter la chaîne en cas de défaut) : l\'implication devient productive.</div><div class=\"etu\"><b>Étape 3</b> — <b>La scale-up</b> : open space, OKR, « liberté et responsabilité » : la coopération créative est recherchée... mais les plateformes de gestion (tickets, métriques, « stand-up » quotidiens) reconstituent une mesure permanente du travail : la continuité ? l\'ORGANISATION du travail suit toujours le même objectif (productivité), mais le pouvoir s\'exerce différemment : du chronomètre visible aux métriques invisibles : en SES, c\'est l\'exemple parfait que les notions (division du travail, coopération, pouvoir) traversent les époques.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> entreprise ≠ société (juridique) : une association peut employer des salariés et gérer des millions (non lucratif = pas de bénéfices distribués) : le profit n\'est pas le but UNIQUE (survie, croissance, parts de marché) et l\'EBE ≠ bénéfice net (impôts, intérêts, amortissements) : les PME ne sont pas « plus vertueuses » par essence (les pratiques d\'emploi y sont parfois plus précaires) : une micro-entreprise de 2 personnes est une ENTREPRISE (ne pas confondre avec le régime fiscal micro).</div>"

  "cours": "<div class=\"cours-head\"><h2>La socialisation et les groupes sociaux</h2><span class=\"niv\">SES · 2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. Devenir un individu social</h3>\n<div class=\"tip\"><b>Socialisation =</b> processus par lequel un individu apprend et intériorise les normes et les valeurs de sa société, tout au long de la vie, et construit son identité sociale. <b>Norme =</b> règle de conduite (plus ou moins contraignante : légalement, socialement). <b>Valeur =</b> idéal partagé (liberté, travail, famille...).<br><b>Agents de socialisation :</b> la famille (primaire : première socialisation), l\'école, les pairs, les médias, le travail, la religion, les plateformes... <b>Socialisation différenciée :</b> selon le sexe, la classe sociale, la génération : on n\'apprend pas les mêmes choses, ni de la même façon.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — « l\'expérience des goûters » : apprendre sans le savoir</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> À 4 ans, des enfants partagent déjà différemment les goûters selon qu\'ils sont issus de milieux populaires ou favorisés. Que démontrent les observations sociologiques (codes linguistiques de Bernstein, repris par Bourdieu et Passeron) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le constat</b> : dans l\'expérience classique, les enfants de milieux favorisés expliquent longuement leurs choix, utilisent un vocabulaire abstrait, s\'appuient sur des règles explicites (« c\'est injuste si... ») : les enfants de milieux populaires s\'appuient sur la pratique et des exemples concrets (« on partage comme à la maison »).</div><div class=\"etu\"><b>Étape 2</b> — <b>L\'interprétation</b> : chacun a appris DANS SA FAMILLE une manière de parler, de justifier, de se tenir : l\'école valorise le registre « scolaire » (abstrait, explicite) : donc l\'école récompense sans le savoir un héritage : ce n\'est pas une question d\'« intelligence » mais de code culturel appris : c\'est ce que Bourdieu appelle l\'habitus et le capital culturel.</div><div class=\"etu\"><b>Étape 3</b> — <b>La conséquence SES</b> : l\'échec scolaire n\'est pas seulement individuel : il est SOCIALEMENT PRODUIT (inégalité devant l\'école selon l\'origine) : c\'est le fondement des débats sur l\'égalité des chances, le « niveau de langue requis », les devoirs faits, la maternelle à 2 ans pour tous : la socialisation, ce n\'est pas une théorie vague : c\'est l\'explication mécanique de la reproduction sociale — un chapitre au programme EXPLICITEMENT pour comprendre les inégalités.</div></div></details>\n<h3>2. Socialisation continue et identités multiples</h3>\n<div class=\"tip\"><b>La socialisation ne s\'arrête pas à l\'enfance :</b> on est resocialisé à l\'entrée dans l\'armée, l\'entreprise, la retraite, le mariage, la prison (socialisation « totale » des institutions closes : Goffman).<br><b>Identité sociale multiple :</b> on est simultanément fille/ fils, élève, amis d\'un groupe, supporteur, citoyenne : les rôles peuvent entrer en conflit (désynchronisation : l\'ado entre pair et famille) : l\'identité est une NEGOCIATION (théorie des rôles : Goffman, la « présentation de soi » : face à la scène sociale, comme un acteur).<br><b>Genre :</b> la socialisation genrée fabrique des différences perçues comme « naturelles » : jouets, couleurs, métiers, tâches domestiques : la socialisation est un ENJEU (égalité femmes-hommes : débat des jouets « genrés »).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — du pyjama rose au plafond de verre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Montrez comment la socialisation genrée, de l\'enfance à l\'âge adulte, participe aux inégalités professionnelles femmes-hommes.</div><div class=\"etu\"><b>Étape 1</b> — <b>L\'enfance</b> : rayons « filles » (poupées, déguisements, soin) vs « garçons » (construction, sciences, aventure) : les enfants intériorisent les activités « pour moi » : à 6-7 ans, les filles sous-estiment déjà leurs capacités en sciences (études sur les stéréotypes de « brillance »).</div><div class=\"etu\"><b>Étape 2</b> — <b>Adolescence et orientation</b> : les filles s\'orientent moins vers les filières techniques (CPGE scientifiques, écoles d\'ingénieurs ~30 %) : les garçons moins vers lettres, paramédical, social : les stéréotypes de métier (« métiers d\'homme ») pèsent dans les vœux d\'orientation : conseil de classe, familles, médias.</div><div class=\"etu\"><b>Étape 3</b> — <b>Âge adulte</b> : la charge mentale domestique inégale (les femmes assument ~2/3 des tâches) freine carrières et salaires (écart ~15-20 % à équivalent de poste : temps partiel subi, interruptions) : la boucle : socialisation genrée → choix « libres » mais contraints → inégalités durables : la réponse publique : jouets neutres (loi 2014 ? non : chartes des fabricants, avis de l\'Observatoire des inégalités), sensibilisation à l\'école, quotas (parité en politique, Conseils d\'administration — avec effets mesurés). La sociologie du genre montre que le « naturel » est largement APPRIS : c\'est une des contributions les plus solides de la discipline.</div></div></details>\n<h3>3. Groupes sociaux et appartiances</h3>\n<div class=\"tip\"><b>Groupe primaire</b> (intime : famille, amis) vs <b>groupe secondaire</b> (formel : classe, entreprise, syndicat). <b>Groupe de référence :</b> le groupe auquel on s\'IDENTIFIE (même sans en faire partie : un ado de banlieue se réfère aux codes de la « hype » parisienne).<br><b>Sociabilité :</b> réseau de relations (Putnam : le déclin du « capital social » aux USA : moins d\'engagement associatif ? débat). <b>Communautés :</b> appartiances religieuses, ethniques, générationnelles (millenials : natifs numériques : une socialisation par les plateformes).<br><b>Mixité des appartenances :</b> un même individu traverse des mondes sociaux : les écarts de normes peuvent créer des conflits (devoir se « tenir » différemment chez ses grands-parents et en cours).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l\'ado, ses deux tribus</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Yasmine, 15 ans, « switche » entre le langage de sa famille, celui du lycée et celui de son groupe TikTok. Utilisez les notions (rôles, groupes de référence, socialisation) pour analyser.</div><div class=\"etu\"><b>Étape 1</b> — <b>Trois scènes</b> (Goffman : la « présentation de soi ») : à la maison : vouvoiement des aînés, code respectueux : au lycée : registre scolaire, posture d\'élève : en ligne : codes du groupe (abréviations, humour, « trends ») : Yasmine joue des RÔLES adaptés à chaque « scène » — l\'identité est performative, pas figée.</div><div class=\"etu\"><b>Étape 2</b> — <b>Groupes de référence</b> : Yasmine peut copier les codes d\'influenceurs qu\'elle ne connaît pas (groupe de référence DISTANT) plus que ceux de sa classe : la socialisation par les PAIRS s\'étend désormais aux pairs NUMÉRIQUES (communauté d\'appartenance sans co-présence — une nouveauté historique).</div><div class=\"etu\"><b>Étape 3</b> — <b>Tension et bricolage</b> : quand les codes se contredisent (un devoir « bien parlé » vs un tchat « mal écrit »), l\'individu fait un BRICOLAGE identitaire (croisement des cultures : Bastide) : la sociologie contemporaine insiste : l\'individu n\'est pas un simple « produit » de la socialisation : il COMPOSE avec les héritages (individualisation : Beck) : la bonne copie utilise ces deux niveaux — l\'apprentissage ET la marge de manœuvre.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la socialisation n\'est pas un « dressage » : l\'individu garde une marge (bricolage, résistance) : ne pas confondre <b>norme</b> (règle) et <b>valeur</b> (idéal) : la socialisation « primaire » (famille) n\'est pas la seule (continue) : le genre est une CONSTRUCTION sociale (rôles appris), distincte du sexe (donnée biologique) : le « milieu » ne détermine pas mécaniquement (les « transfuges de classe » existent — mais statistiquement rares : c\'est le sens de « reproduction »).</div>"

  "cours": "<div class=\"cours-head\"><h2>Le marché du travail et l\'emploi</h2><span class=\"niv\">SES · 1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. Comment se forment les salaires et l\'emploi ?</h3>\n<div class=\"tip\"><b>Marché du travail :</b> offre de travail (les actifs) et demande de travail (les employeurs). Comme tout marché, un prix s\'y forme : le <b>salaire</b> : mais un marché très imparfait (segments, institutions, asymétries).<br><b>Vision classique :</b> le chômage vient d\'un salaire « trop haut » (rigidités : SMIC, syndicats) : la flexibilité rétablit l\'équilibre. <b>Vision keynésienne :</b> le chômage vient d\'une demande de biens insuffisante (les entreprises n\'embauchent pas car elles ne vendent pas) : il faut soutenir la demande.<br><b>Théorie du salaire d\'efficience :</b> les employeurs paient AU-DESSUS de l\'équilibre pour motiver et retenir (le chômage ne disparaît pas même en baissant les salaires : pourquoi les salaires ne baissent pas en crise).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — pourquoi les salaires ne baissent pas en récession</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> En 2009 ou 2020, le chômage a bondi, mais les salaires n\'ont guère baissé (ils ont même continué de monter lentement). Expliquez ce paradoxe pour la théorie classique.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les faits</b> : le modèle de base prédit : excès d\'offre de travail ⟹ baisse des salaires ⟹ retour au plein-emploi : or les salaires sont restés rigides vers le bas et le chômage a persisté.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les explications</b> : 1) <b>salaire d\'efficience</b> (Akerlof, Yellen) : baisser les salaires détruirait la motivation et ferait fuir les meilleurs : 2) <b>contrats et institutions</b> : conventions collectives, SMIC, indexation : 3) <b>relations d\'emploi longues</b> : on ne renégocie pas chaque jour comme sur un marché de pommes (théorie des contrats implicites).</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon SES</b> : le marché du travail n\'est PAS un marché ordinaire : la « marchandise » est un être humain, la relation dure, l\'information est asymétrique, les institutions encadrent : c\'est pourquoi les économistes parlent de marché du travail au pluriel (segmenté : ouvrier/ingénieur, cadre/interim : chacun son segment, ses règles) : toute copie qui traite le travail comme un marché de pommes est hors sujet.</div></div></details>\n<h3>2. Chômage : mesures, formes, causes</h3>\n<div class=\"tip\"><b>Chômeur (BIT) :</b> personne sans emploi, disponible, recherchant activement. <b>Taux de chômage =</b> chômeurs / population active (actifs occupés + chômeurs). En France ~7-8 % en 2024 (contre ~10 % en 2015).<br><b>Formes :</b> chômage <b>frictionnel</b> (rotation normale : entre deux emplois), <b>structurel</b> (inadéquation qualifications/besoins : le débat central), <b>conjonturel</b> (cycle), <b>technique</b> (machines).<br><b>Autres indicateurs :</b> halo du chômage, sous-emploi, taux d\'emploi (20-64 ans), précarité (CDD, intérim : ~15 % des salariés).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le plan de sauvegarde de l\'emploi : une usine ferme</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une usine automobile (800 salariés) ferme à Douai, l\'employeur ouvre une usine en Slovaquie. Analysez le type de chômage créé et les politiques de réponse.</div><div class=\"etu\"><b>Étape 1</b> — <b>Diagnostic</b> : chômage STRUCTUREL : les compétences (chaîne de montage automobile) ne correspondent plus aux besoins locaux : le choc est local (taux de chômage de la zone +3-4 points) et durable (les ex-salariés retrouvent un emploi à -20 % de salaire en moyenne : « cicatrice » du chômage documentée).</div><div class=\"etu\"><b>Étape 2</b> — <b>Politiques du marché du travail (« flexicuréité »)</b> : 1) <b>flexibilité</b> : faciliter licenciements/ embauches (CDD, intérim, plans de sauvegarde indemnités) : 2) <b>sécurité</b> : indemnisation chômage (France : ~60-75 % de l\'ancien salaire), accompagnement (France Travail, cellules de reclassement), formation (compte personnel de formation).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le débat complet</b> : les uns : trop de protection décourage d\'embaucher (coût du licenciement ⟹ prudence ⟹ CDI rationné) : les autres : la flexibilité sans sécurité crée une société de travailleurs pauvres : le modèle danois (flexicurité : licenciement facile MAIS indemnisation forte et formation massive) est la référence : la France combine flexibilité « à la marge » (précarité des jeunes : 70 % des nouveaux contrats) et protection des insiders : l\'analyse SES doit toujours articuler les DEUX faces.</div></div></details>\n<h3>3. Destructions et créations d\'emplois : la machine schumpétérienne</h3>\n<div class=\"tip\"><b>Schumpeter :</b> « destruction créatrice » : les innovations détruisent des emplois (le numérique a fait chuter l\'imprimerie de presse) et en créent d\'autres (data analysts, développeurs : métiers inexistants il y a 20 ans). Sur 30 ans, l\'économie française a détruit et créé ~2 M d\'emplois NETS positifs... mais la transition est brutale pour les personnes concernées.<br><b>Enjeu moderne :</b> automatisation/IA : l\'OCDE estime ~10-15 % d\'emplois « à haut risque » en Europe (caissiers, saisie) : la réponse : formation continue, capital humain, « complémentarité » homme-machine.<br><b>Interrogation finale :</b> le travail se transforme (plateformes, télétravail, quête de sens) : la valeur travail décline-t-elle ? (enquêtes : toujours placée en tête, mais l\'équilibre vie-travail progresse : la socialisation professionnelle évolue).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — caissière ou développeuse ? la transition n\'est pas automatique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur 10 emplois détruits par l\'automatisation, combien sont « recréés » pour les mêmes personnes ? Analysez l\'écart entre le raisonnement macro et le vécu micro.</div><div class=\"etu\"><b>Étape 1</b> — <b>Macro</b> : à l\'échelle du pays, le solde est positif (l\'économie crée plus qu\'elle ne détruit : le chômage français a baissé de 10 à 7 % entre 2015 et 2024) : les nouveaux emplois se créent dans la santé, l\'informatique, les services.</div><div class=\"etu\"><b>Étape 2</b> — <b>Micro</b> : la caissière de 52 ans de Roubaix ne devient pas data analyst : mobilité professionnelle impossible sans formation longue : son salaire de réembauche décroche de 15-25 % : les « emplois créés » ne sont pas « attribués » aux « détruits » : il y a un problème de CORRESPONDANCE (géographique, de qualification, de salaire).</div><div class=\"etu\"><b>Étape 3</b> — <b>Politiques</b> : d\'où l\'importance : 1) de la formation continue (compte personnel, pro-A : France Travail) : 2) de l\'indemnisation qui sécurise la recherche (et donc les bons appariements : ne pas prendre le premier emploi venu) : 3) des politiques territoriales (l\'usine qui ferme vide une ville : reconversion locale) : la « destruction créatrice » est un processus SOCIALEMENT SOUTENU ou elle détruit plus qu\'elle ne crée — la formule de Schumpeter décrit une tendance, pas une excuse.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> population active ≠ population en âge de travailler (15-64) : taux de chômage ≠ taux d\'emploi : le halo du chômage (découragés, temps partiel subi) sous-estime le sous-emploi : le salaire n\'est pas fixé par la seule productivité (normes, institutions, rapports de force) : « le chômage technologique » n\'est pas automatique (150 ans d\'histoire : les machines ont toujours redéployé le travail — à condition que la société organise la transition).</div>"

  "titre": "La monnaie et le financement de l\'économie",
  "cours": "<div class=\"cours-head\"><h2>La monnaie et le financement de l\'économie</h2><span class=\"niv\">SES · 1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. À quoi sert la monnaie ?</h3>\n<div class=\"tip\"><b>Trois fonctions :</b> 1) <b>intermédiaire des échanges</b> (éviter le troc et sa « double coïncidence des besoins » : j\'ai des œufs, je cherche un prof de maths qui veut des œufs...) : 2) <b>unité de compte</b> (exprimer les valeurs : un prix unique en €) : 3) <b>réserve de valeur</b> (épargner : à condition que l\'inflation soit maîtrisée).<br><b>Formes :</b> billets et pièces (5 % de la masse !), dépôts bancaires (la monnaie est aujourd\'hui essentiellement SCRIPTURALE : des écritures), monnaie électronique. <b>La BCE :</b> émet les billets, définit la politique monétaire de la zone euro (taux directeurs, objectifs d\'inflation ~2 %).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — comment une banque « crée » de la monnaie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une banque accorde un prêt de 10 000 € à un boulanger. D\'où sort cet argent ? « Des dépôts des épargnants » ? Pas seulement : expliquez le multiplicateur monétaire.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le mécanisme</b> : la banque inscrit 10 000 € au crédit du compte du boulanger : cette écriture EST de la monnaie nouvelle (« les crédits font les dépôts ») : le boulanger paie son fournisseur, dont la banque reçoit le dépôt... et peut prêter à nouveau (en gardant des réserves obligatoires et du capital).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le multiplicateur</b> : avec un taux de réserve de 1 %, 10 000 € de monnaie centrale peuvent soutenir ~100 000 € de dépôts (le multiplicateur) : MAIS la création est limitée par : la demande de crédit saine, les exigences de capital (Bâle III), la prudence, et la BCE (les taux qu\'elle fixe au refinancement).</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon SES</b> : la monnaie n\'est pas une quantité FIXE (une masse d\'or) : c\'est un FLUX d\'écritures adossées à des promesses de remboursement : c\'est pourquoi une crise de confiance (2008 : « qui porte quoi ? ») gèle la création et pourquoi la banque centrale peut « en mettre » (assouplissement quantitatif : la BCE a acheté pour ~5 000 Md € d\'actifs depuis 2015 pour soutenir l\'économie) : comprendre la monnaie-scripturale, c\'est comprendre la finance moderne — et ses crises.</div></div></details>\n<h3>2. Financement : direct, indirect, hybride</h3>\n<div class=\"tip\"><b>Financement INTERNE :</b> autofinancement (épargne de l\'entreprise : la moitié de l\'investissement français). <b>Financement EXTERNE :</b><br>— <b>direct</b> : marchés de capitaux (actions, obligations : l\'entreprise emprunte aux épargnants sans intermédiaire, via les marchés) :<br>— <b>indirect</b> (intermédié) : banques (crédit : la banque transforme les dépôts courts en prêts longs : transformation) :<br>— <b>hybride</b> : capital-investissement (private equity), prêts participatifs.<br><b>Avantages/risques :</b> marché = masse, flexibilité, visibilité (cotation) : banque = relation, suivi, confidentialité : l\'économie française est plutôt « bank-based » (les PME dépendent du crédit), les anglo-saxonnes « market-based ».</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — lever 2 M€ : les trois scénarios</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une PME industrielle de 25 salariés veut financer une nouvelle ligne (2 M€). Comparez crédit bancaire, introduction en Bourse et private equity.</div><div class=\"etu\"><b>Étape 1</b> — <b>Crédit bancaire</b> : la banque prête sur dossier (bilans, garanties : souvent des cautions personnelles du dirigeant !) : coût : intérêts (~3-6 %) : le dirigeant garde le contrôle : risque : l\'entreprise supporte seule la charge (si l\'investissement échoue, faillite possible).</div><div class=\"etu\"><b>Étape 2</b> — <b>Bourse</b> : émettre des actions : pas de remboursement, pas d\'intérêts : MAIS exige : une taille critique (les analystes suivent peu les small caps), une transparence totale (publication trimestrielle), une dilution du contrôle (les actionnaires peuvent voter contre le dirigeant) : pour une PME, souvent inadapté.</div><div class=\"etu\"><b>Étape 3</b> — <b>Private equity</b> : un fonds (BPI, Ardian...) entre au capital (30-80 %) : apporte de l\'argent ET du conseil (gouvernance, industrialisation) : attente : une sortie à +3-5 ans (revente, introduction) : le fonds veut un rendement (LBO : effet de levier par la dette) : la leçon SES : le choix de financement n\'est pas neutre : il redéfinit le CONTRÔLE de l\'entreprise (banquier = créancier, actionnaire = copropriétaire) : financer, c\'est déjà gouverner — une intuition clé pour comprendre le capitalisme contemporain.</div></div></details>\n<h3>3. Taux d\'intérêt, inflation, politique monétaire</h3>\n<div class=\"tip\"><b>Taux d\'intérêt =</b> prix du temps (le loyer de l\'argent) : <b>taux réel ≈ taux nominal − inflation</b> (à 5 % nominal et 3 % d\'inflation, le coût réel est ~2 %).<br><b>Politique monétaire de la BCE :</b> taux directeurs (les banques se refinancent plus ou moins cher : la BCE répercute) : depuis 2022, hausse historique (de −0,5 % à +4 %) pour casser l\'inflation : effet : crédits plus chers, immobilier en berne, mais l\'épargne rémunérée. <b>Assouplissement</b> (2015-2021 : taux négatifs, rachats d\'actifs) : objectif : relancer le crédit et l\'investissement.<br><b>Inflation :</b> érosion de la valeur de la monnaie : un peu (~2 %) est visé : trop détruit la confiance : la spirale salaires-prix est le risque central (les anticipations s\'auto-réalisent).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — 2022-2023 : la BCE face à l\'inflation à 10 %</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L\'inflation de la zone euro passe de 2 % à 10 % (2022). La BCE monte ses taux de -0,5 % à +4 %. Expliquez le mécanisme de transmission et les effets secondaires.</div><div class=\"etu\"><b>Étape 1</b> — <b>La logique</b> : l\'inflation vient d\'abord d\'un choc EXTERNE (énergie, désorganisation post-Covid, guerre en Ukraine) : la BCE ne produit ni gaz ni blé, mais elle peut casser la DEMANDE (rendre le crédit cher) et surtout ANCRER LES ANTICIPATIONS : si les acteurs croient que l\'inflation durera, ils indexent salaires et prix (la boucle s\'auto-alimente).</div><div class=\"etu\"><b>Étape 2</b> — <b>La transmission</b> : taux ↑ ⟹ crédits bancaires + chers (crédit immobilier : de 1 % à 3,5 % : les ventes de logements s\'effondrent de 20-30 %) ⟹ consommation et investissement ralentissent ⟹ la demande de biens baisse ⟹ les hausses de prix se modèrent : l\'inflation est retombée vers ~2,5-3 % dès 2024.</div><div class=\"etu\"><b>Étape 3</b> — <b>Les effets secondaires (à citer pour le niveau +)</b> : les États empruntent plus cher (la charge de la dette italienne/française explose : la dette publique française ~3 000 Md € : chaque point de taux = ~40-50 Md €/an de charge supplémentaire à terme), les banques fragilisées (crises bancaires US 2023 : des banques détenant des obligations anciennes à taux bas voient leur valeur chuter : Silicon Valley Bank), les ménages variables pénalisés. La leçon : la politique monétaire est PUISSANTE mais GROSSIÈRE : elle touche toute l\'économie pour corriger un choc sectoriel — d\'où le débat sur l\'articulation avec la politique budgétaire (qui peut cibler : baisser les taxes sur le carburant plutôt que casser la demande globale).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> les banques ne « prêtent pas les dépôts existants », elles créent de la monnaie (mais limitée par règles et prudence) : le taux nominal ≠ taux réel (déflater par l\'inflation) : la BCE est indépendante (elle ne finance PAS les États de la zone : interdiction de monétisation) : « la planche à billets » moderne = création monétaire par le crédit, pas seulement par l\'État : l\'inflation et le chômage peuvent être en tension (courbe de Phillips, débattue).</div>"

  "cours": "<div class=\"cours-head\"><h2>Les mobilités sociales</h2><span class=\"niv\">SES · 1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. Mesurer les mobilités : table de destin</h3>\n<div class=\"tip\"><b>Mobilité sociale =</b> changement de position sociale (entre celle d\'origine — la famille — et celle atteinte). <b>Tables de mobilité :</b> « destin » (d\'où viennent les cadres ?), « recrutement » (que deviennent les enfants d\'ouvriers ?), « fluidité » (la chance de mobilité à origine comparable).<br><b>Mobilité structurelle (ou « nette ») :</b> due à la transformation de la structure des emplois (la société a besoin de plus de cadres et de moins d\'agriculteurs : les enfants DOIVENT monter) : <b>mobilité nette/fluidité :</b> la mobilité « pure », comparée à origine identique.<br><b>Constat français (INSEE, enquêtes FQP) :</b> forte mobilité « observée » (les 2/3 des gens changent de groupe), mais une <b>fluidité plus faible</b> (à structure égale, l\'origine pèse toujours : l\'ascenseur social ralentit depuis les années 1990).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l\'ascenseur en panne ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> En 1970, 20 fils d\'agriculteurs sur 100 devenaient cadres ; en 2020, les enfants d\'ouvriers ont ~x fois moins de chances d\'être cadres que les enfants de cadres. Distinguez mobilité structurelle et fluidité.</div><div class=\"etu\"><b>Étape 1</b> — <b>Structurelle</b> : la société a changé de forme : 30 % d\'agriculteurs en 1950 → ~1 % : l\'agriculture a « expulsé » ses enfants vers l\'industrie puis les services : la montée EN MASSE des cadres (demande de qualification) a créé des places : cette mobilité est « automatique » (quelqu\'un DOIT occuper les emplois nouveaux).</div><div class=\"etu\"><b>Étape 2</b> — <b>Fluidité</b> : quand on compare les chances à structure égale (odds ratios), l\'avantage des origines favorisées reste massif : un enfant de cadre a ~x3-x4 fois plus de chances qu\'un enfant d\'ouvrier d\'accéder aux positions supérieures, chiffre stable depuis 30 ans : l\'« ascenseur » (la démocratisation scolaire des Trente Glorieuses) a ralenti (l\'expansion des places s\'est arrêtée : les générations se remplacent).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le sens politique</b> : dire « il y a plus de mobilité qu\'avant » est VRAI (structure) et « l\'école égalise les chances » est FAUX (fluidité quasi constante) : les deux phrases coexistent : la mobilité observée s\'améliore quand la structure crée des places (période de croissance), pas quand la société « devient plus juste » : d\'où les débats sur les politiques : quand il n\'y a plus de places nouvelles, la fluidité devient le seul terrain — et c\'est là que les héritages pèsent le plus.</div></div></details>\n<h3>2. Les canaux de la mobilité : école, travail, mariage</h3>\n<div class=\"tip\"><b>École :</b> le grand « ascenseur » institutionnel : massification (80 % au bac, 60 % dans le supérieur) : MAIS hiérarchisation interne (filières, universités vs classes préparatoires : la « démocratisation ségrégative ») : les parcours dépendent fortement de l\'origine (chances d\'accès aux CPGE, aux écoles d\'ingénieurs/commerce).<br><b>Travail :</b> l\'expérience professionnelle, la formation continue, l\'entrepreneuriat (l\'auto-emploi comme voie d\'ascension : la « French Dream » des indépendants du bâtiment, du commerce).<br><b>Mariage/alliances :</b> l\'homogamie (épouser dans son milieu) domine : les unions « mixtes » sont des vecteurs de mobilité, mais la part des milieux dans la rencontre (études, travail, quartiers) la limite.<br><b>Capital social :</b> les réseaux (un stage trouvé par connaissance, un prêt familial) pèsent (Bourdieu, Granovetter : la « force des liens faibles » pour trouver un emploi).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — deux bacheliers, deux destins</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Léo et Karim ont le même bac général avec mention. Léo, fils de deux cadres, entre en prépa HEC ; Karim, fils d\'employés, s\'inscrit à la fac de droit de sa ville. Analysez les mécanismes sociaux de cette bifurcation.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les aspirations</b> (habitus) : Léo « sait » que les CPGE existent (on en parle à table, un cousin y est passé) : Karim vise « droit avocat » (une filière connue, réputée solide) : les aspirations sont socialement modelées (« on ne désire que ce qu\'on voit » — l\'« auto-élimination » de Bourdieu : les filières d\'élite paraissent « pas pour nous »).</div><div class=\"etu\"><b>Étape 2</b> — <b>Les ressources</b> : Léo : parents qui financent deux ans de prépa (pas de revenu nécessaire), internat payé, coach de motivation : Karim : un job d\'appoint, le choix d\'une ville accessible, une inscription « par défaut » (Parcoursup : les CPGE recrutent sur dossier avec des codes que les familles favorisées savent activer : lettres, options, réseaux).</div><div class=\"etu\"><b>Étape 3</b> — <b>La conséquence statistique</b> : la prépa HEC mène aux masters et écoles qui mènent aux quartiers généraux : la fac de droit mène à l\'avocature... moyennant des taux d\'échec élevés en L1 (le « goulot » de la première année) : au bout : des positions sociales distinctes pour deux bacheliers « égaux » sur le papier : la mobilité sociale se joue DANS ces bifurcations invisibles — et c\'est pourquoi les politiques (cordées de la réussite, bourses, parcours d\'accès — des expérimentations d\'ouverture sociale) ciblent les moments de choix d\'orientation.</div></div></details>\n<h3>3. Transfuges, fracturations et horizons</h3>\n<div class=\"tip\"><b>« Transfuge de classe »</b> (Eribon, Louis, Thin) : ceux qui changent de monde : sentiment d\'étrangeté (plus la même langue, les références, l\'aisance), loyauté déchirée, « traîtrise » ressentie : la mobilité a un COUT psychique (paradoxe du « devenu » qui n\'est plus « d\'ici » ni tout à fait « de là-bas »).<br><b>Fracture des destins :</b> les milieux populaires se sont fracturés : les enfants d\'ouvriers qualifiés s\'en sortent (l\'ascension par le technique et l\'apprentissage), les enfants des précaires s\'enfoncent (la mobilité descendante existe : déclassement : les « mauvaises rencontres » du marché du travail).<br><b>La mobilité subjective :</b> les gens se perçoivent souvent comme mobiles (l\'individualisme de la méritocratie : « j\'ai réussi par mon travail ») alors que les statistiques montrent la persistance des héritages : le « sentiment » d\'une société ouverte est un fait social à expliquer (idéologie méritocratique : sa fonction : légitimer les positions).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le discours méritocratique et ses effets</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un chef d\'entreprise déclare : « j\'ai commencé plombier, j\'ai réussi par le travail : chacun peut y arriver ». Analysez la portée et les limites de ce récit (l\'idéologie méritocratique).</div><div class=\"etu\"><b>Étape 1</b> — <b>Ce que le rédit dit de vrai</b> : la mobilité ascendante EXISTE (des milliers de cas : l\'école, l\'artisanat, le sport, le digital) : l\'effort compte (des milliers de trajectoires d\'ascension par le travail et l\'école : le mythe a une base réelle : la France reste une société où l\'école publique fait encore des transfuges).</div><div class=\"etu\"><b>Étape 2</b> — <b>Ce qu\'il masque</b> : le survivant bias (les milliers de plombiers qui n\'ont pas réussi sont invisibles) : les conditions cachées (la bonne rencontre, le premier contrat, la santé, la rupture qui n\'est pas venue) : la généralisation abusive (le cas individuel ne fait pas la règle : les statistiques disent la probabilité, pas le cas).</div><div class=\"etu\"><b>Étape 3</b> — <b>L\'effet social</b> : le récit méritocratique a deux effets : MOTIVER (croire que l\'effort paie pousse à l\'effort) et LEGITIMER (si les places sont « méritées », les perdants « méritent » leur sort : c\'est la fonction de l\'idéologie selon une sociologie critique : justifier l\'ordre existant en le naturalisant) : la copie fine articule les deux : la méritocratie est une promesse ET un jugement : ce double visage est précisément ce que les enquêtes (Dubet : le « mythe et les limites ») documentent.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> mobilité observée ≠ fluidité (déflater par la structure !) : « ascenseur social en panne » est une formule : préciser quoi (la fluidité stagne, la mobilité structurelle dépend de la croissance) : l\'école favorise ET hiérarchise (massification + ségrégation interne) : la mobilité descendante existe (parler de « déclassement ») : l\'homogamie n\'est pas un choix « contre » la mobilité, c\'est surtout la conséquence des espaces fréquentés (école, travail, quartier).</div>"

  "cours": "<div class=\"cours-head\"><h2>L\'Union européenne et l\'intégration économique</h2><span class=\"niv\">SES · 1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab(\'fiches\')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab(\'quiz\')\">🧪 QCM du cours</a></div>\n<h3>1. Les étapes de la construction : un marché unique</h3>\n<div class=\"tip\"><b>Chronologie :</b> 1951 CECA (charbon/acier : la « guerre improbable ») : 1957 Traité de Rome (CEE : marché commun, PAC) : 1986/1993 Acte unique + marché unique (libre circulation biens, services, capitaux, personnes : ~450 M de consommateurs) : 1992 Maastricht (UE, citoyenneté, convergence) : 1999-2002 euro (monnaie unique, BCE) : 2007 Lisbonne : 2020 sortie du Royaume-Uni (« Brexit »).<br><b>Marché unique =</b> « les quatre libertés » + règles communes (concurrence, normes) : l\'intégration supprime les coûts de frontière et élargit la taille du marché (économies d\'échelle, concurrence accrue, prix plus bas).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — les gains du marché unique pour une PME</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une PME française de machines agricoles vendait 80 % en France (1990). Aujourd\'hui 60 % de ses ventes sont européennes. Quels gains de l\'intégration ? Quels coûts/risques ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Gains</b> : débouchés élargis (450 M de consommateurs : le marché national français n\'était qu\'un « pré-échangent ») : normes uniques (une certification CE vaut partout : sinon 27 homologations) : concurrence sur les intrants (l\'entreprise achète ses composants au meilleur prix européen) : l\'euro supprime le risque de change et les coûts de conversion (~0,3-0,5 % du PIB de gains estimés).</div><div class=\"etu\"><b>Étape 2</b> — <b>Coûts/risques</b> : concurrence renforcée sur le produit (les fabricants allemands et italiens vendent chez elle) : réglementation commune subie (l\'entreprise n\'a pas voté la norme) : asymétries (les écarts de salaires font délocaliser les segments simples : l\'Est produit, l\'Ouest conçoit ?).</div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan SES</b> : l\'intégration est un libre-échange GÉANT : les gains globaux (croissance +~1-2 % cumulés selon les évaluations du marché unique) coexistent avec des REDISTRIBUTIONS (gagnants : consommateurs, exportateurs, grands groupes : perdants : secteurs exposés à la concurrence, certains territoires) : d\'où l\'importance des politiques d\'accompagnement (Fonds européens, FSE) et le débat démocratique (l\'UE « subie » ou « choisie »).</div></div></details>\n<h3>2. Les politiques de l\'UE : commerce, monnaie, budget</h3>\n<div class=\"tip\"><b>Union douanière + politique commerciale commune :</b> tarif extérieur commun : l\'UE négocie EN BLOC (poids : 450 M de consommateurs : accords de libre-échange : CETA, Japon...) : les traités modernes visent les normes (règlements, subventions : le « level playing field »).<br><b>La PAC (politique agricole commune) :</b> ~1/3 du budget historique : soutien des revenus agricoles et des marchés : critiquée (surproduction passée, concurrence des importations) : réformée (verdissement, aide découplée de la production).<br><b>Euro :</b> monnaie unique gérée par la BCE (chapitre monnaie) : MAIS l\'UE est une « union monétaire INCOMPLÈTE » : monnaie commune sans budget fédéral (budget UE ~1 % du PIB européen, contre ~20-25 % pour un État national).<br><b>Pacte de stabilité :</b> déficits publics &lt; 3 % du PIB, dette &lt; 60 % : surveillés (sanctions possibles) : critiqué en crise (austérité procyclique européenne 2010-2013).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la zone euro face à la crise des dettes (2010-2015)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> En 2010-2012, la Grèce, l\'Irlande, le Portugal, l\'Espagne voient leurs taux d\'emprunt exploser. Pourquoi la zone euro a-t-elle eu du mal à répondre ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le mécanisme</b> : avec l\'euro, un État emprunte en monnaie qu\'il NE CONTRÔLE PAS (pas de banque centrale nationale pour racheter) : la confiance fait tout : quand les marchés doutent de la Grèce, les taux montent (10 %, 20 %) : la charge de la dette explose : la spirale (doute ⟹ taux ⟹ déficits ⟹ doute).</div><div class=\"etu\"><b>Étape 2</b> — <b>La réponse imparfaite</b> : la zone crée des fonds de sauvetage (FESF, MES) + austérité exigée en échange : les plans grecs : baisse des salaires publics, retraites, privatisations : le PIB grec −25 % : l\'austérité procyclique aggrave la récession (le débat économique central : multiplicateur budgétaire supérieur à 1 en crise). « Whatever it takes » (Draghi, 2012) : la BCE promet de sauver l\'euro : les taux retombent (le discours suffit — preuve du rôle des anticipations).</div><div class=\"etu\"><b>Étape 3</b> — <b>Les réformes instituées</b> : fonds de sauvetage permanents (MES), union bancaire (supervision commune, résolution), « semestre européen » (coordination des budgets), plus tard : fonds de relance commun (750 Md € « NextGenerationEU » : 2020, premier emprunt commun !) : la leçon SES : l\'UE avance PAR CRISES (union monétaire incomplète ⟹ crises ⟹ compléments) : elle n\'est ni un État ni un simple marché : une construction inachevée dont chaque crise révèle les manques.</div></div></details>\n<h3>3. Les limites et les débats : l\'UE contestée</h3>\n<div class=\"tip\"><b>Critiques économiques :</b> « optimum monétaire » ? (Mundell : les chocs frappent différemment le Nord et le Sud : sans taux de change ajustable, l\'ajustement passe par les salaires = douloureux) : budget faible (pas de stabilisateur fédéral en récession : les États-Unis transfèrent massivement entre régions) : concurrence des normes (des normes qui peuvent avantager les grands groupes).<br><b>Critiques démocratiques :</b> « déficit démocratique » (la Commission propose, le Parlement amendé, le Conseil décide : complexité) : la « contrainte extérieure » (les règles budgétaires jugée contraignantes : « Bruxelles » comme repoussoir).<br><b>Réponses :</b> le Parlement élu au suffrage universel (1979), la procédure de co-décision (Lisbonne : le Parlement co-législateur), le « Conference on the Future of Europe » : et les résultats : malgré le Brexit, l\'UE élargie (27 membres : l\'adhésion reste attractive : Ukraine candidate en 2022) — les peuples contestent l\'UE ET veulent en faire partie : le paradoxe à expliquer.</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — le Brexit : le test du « combien ça coûte de sortir ? »</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le Royaume-Uni a voté la sortie (2016) et quitté l\'UE (2020). Quels effets économiques observés ? Que nous apprend ce « contre-exemple » ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Les effets mesurés</b> : le commerce de biens UK-UE a chuté de ~15-30 % selon les estimations (nouvelles barrières : contrôles, déclarations) : l\'investissement des entreprises plus faible (l\'UE n\'est plus un « port d\'attache » : les sièges financiers partis : Amsterdam a dépassé Londres sur certaines actions) : l\'économie UK ~3-5 % plus petite qu\'elle n\'aurait été (évaluations de la Banque d\'Angleterre, de l\'OBR).</div><div class=\"etu\"><b>Étape 2</b> — <b>Les arguments du camp sorti</b> : reprise de la « souveraineté » (lois, immigration, pêche) : réglementation « allégée » : accords propres (avec l\'Australie, la Nouvelle-Zélande, le Pacifique...) : MAIS ces accords sont de tailles modestes et ne compensent pas la perte du marché voisin.</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon SES</b> : le Brexit est un « expérience naturelle » du coût de la désintégration : les gains de l\'intégration (débités) sont INVISIBLES au quotidien (des flux fluides qu\'on ne remarque que quand ils se bloquent) : les coûts de la sortie sont DIFFÉRÉS et diffus (les entreprises ont adapté leurs chaînes : les prix des contrôles sanitaires) : d\'où l\'asymétrie politique : les coûts de l\'UE sont visibles (règlements), les bénéfices sont invisibles (fluidité) — c\'est un problème de communication structurel de l\'UE, pas un problème de fond : à citer en conclusion de toute copie sur l\'UE.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> UE ≠ zone euro (27 vs 20 pays : le Danemark, la Suède... hors euro) : le marché unique n\'est pas le « libre-échange mondial » (l\'UE protège aussi : normes, politique commerciale, droit antidumping) : le budget UE (~1 % du PIB) n\'est PAS comparable à un budget national (~50 %) : la Commission ne « dicte » pas seule (co-décision avec le Parlement et le Conseil) : l\'euro n\'est pas la cause de TOUS les maux (ni de toutes les vertus) : l\'analyse demande de lier niveaux (marché, monnaie, budget, démocratie).</div>"

  "id": "croissance-developpement-inegalites",
  "theme": "Croissance, développement et inégalités (SES — Term)",
  "niveau": "Terminale — SES",
  "titre": "Croissance, développement et inégalités",
  "cours": "<div class=\"cours-head\"><h2>Croissance, développement et inégalités</h2><p>Croissance ≠ développement ≠ bien-être : mesurer, comparer, interpréter — le cœur du programme de Terminale SES.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Croissance : augmentation durable du PIB (volume).<br>— Développement : transformation qualitative (santé, éducation, libertés).<br>— Inégalités : écarts entre individus ou groupes (revenus, patrimoine, chances).</div>\n<h3>1. Croissance : définition et mesure</h3>\n<div class=\"tip\"><b>La croissance économique</b> = augmentation <b>durables</b> de la production de biens et services, mesurée par la variation du <b>PIB en volume</b> (à prix constants : on retire l\'effet de l\'inflation).<br><b>PIB</b> = somme des valeurs ajoutées (production − consommations intermédiaires). PIB/habitant ≈ niveau de vie moyen (PIB ÷ population).<br><b>Taux de croissance</b> = (PIB<sub>t</sub> − PIB<sub>t−1</sub>) / PIB<sub>t−1</sub> × 100.<br><b>Limites du PIB :</b> ne compte pas le travail domestique, le bénévolat, l\'économie informelle, les dégâts environnementaux ; il enregistre des activités « défensives » (dépollution, réparation après accident) comme de la production.</div>\n<table><tr><th>Concept</th><th>Définition</th><th>Exemple</th></tr>\n<tr><td><b>Croissance extensive</b></td><td>Plus de facteurs de production (travail, capital)</td><td>Embaucher plus, investir plus</td></tr>\n<tr><td><b>Croissance intensive</b></td><td>Plus de productivité (même facteurs, plus de production)</td><td>Robots, formation, organisation</td></tr>\n<tr><td><b>Productivité</b></td><td>Production par unité de facteur (par heure travaillée)</td><td>VA / nombre d\'heures</td></tr></table>\n<h3>2. Les facteurs de la croissance</h3>\n<div class=\"tip\"><b>Facteurs directs :</b> travail (quantité : population active, durée, âge de départ ; qualité : capital humain = éducation, santé), capital physique (machines, infrastructures), <b>productivité globale des facteurs (PGF)</b> = progrès technique et efficacité d\'organisation.<br><b>Schéma de Solow :</b> l\'accumulation de capital seule s\'essouffle (rendements décroissants) : c\'est le <b>progrès technique</b> qui entretient la croissance de long terme. D\'où le rôle central de la <b>R&D</b> (Schumpeter : destruction créatrice — les innovations détruisent les anciens produits et créent les nouveaux).</div>\n<h3>3. Du développement à mesurer autrement</h3>\n<div class=\"tip\"><b>Développement</b> = ensemble des transformations structurelles qui améliorent durablement les conditions de vie : santé, éducation, urbanisation, droits, libertés (Sen : le développement est <b>l\'expansion des capacités</b> — ce que les gens peuvent faire et être).<br><b>Indicateurs alternatifs :</b> IDH (ONU : espérance de vie + éducation + revenu, de 0 à 1), IPH, empreinte écologique, Better Life Index (OCDE), BNB (Bhoutan).<br><b>Convergence ?</b> Les pays pauvres ne rattrapent pas automatiquement les riches : il faut des institutions solides, de l\'investissement, de l\'éducation, l\'ouverture commerciale n\'a rien d\'automatique (Maddison, Acemoglu-Robinson : « Pourquoi les nations échouent » — institutions extractives vs inclusives).</div>\n<div class=\"piege\">⚠️ <b>Piège classique :</b> « le PIB/habitant mesure le bien-être ». Non : c\'est une moyenne (les inégalités sont invisibles), un flux (pas le patrimoine), et il ignore la qualité de vie et l\'environnement.</div>\n<h3>4. Les inégalités : les mesurer pour les comprendre</h3>\n<div class=\"tip\"><b>Inégalités économiques :</b> de revenus (flux : salaires, transferts, revenus du capital), de patrimoine (stock : immobilier, actions, épargne).<br><b>Inégalités sociales :</b> accès à l\'éducation, la santé, le logement, la culture, le pouvoir.<br><b>Outils de mesure :</b> déciles (D1 à D9 : la population classée par revenu en 10 groupes), rapport interdéciles D9/D1, courbe de Lorenz (répartition cumulée), <b>coefficient de Gini</b> (0 = égalité parfaite, 1 = inégalité maximale ; France ≈ 0,29-0,35 selon les sources), taux de pauvreté (part de la population sous 60 % du revenu médian).<br><b>Rendements croissants du capital (Piketty) :</b> r &gt; g (rendement du capital &gt; croissance) tend à concentrer les patrimoines — d\'où l\'importance des impôts et de l\'assurance sociale.</div>\n<h3>5. Illustration chiffrée</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — deux pays, deux trajectoires</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le pays A : PIB/hab 2 000 $, croissance 6 %/an pendant 20 ans. Le pays B : PIB/hab 40 000 $, croissance 1 %/an. Comparez et discutez.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Le calcul</b> : règle des 70 (≈ 70 / taux = années pour doubler) : le pays A double son PIB/hab tous les ~12 ans : en 20 ans à 6 %, il est multiplié par ≈ 3,2 (1,06^20) : 2 000 $ → ≈ 6 400 $. Le pays B : ×1,22 : 40 000 $ → ≈ 48 800 $.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>L\'interprétation</b> : l\'écart absolu continue de se creuser (convergence conditionnelle : le rattrapage en <i>niveau</i> demande des décennies de croissance soutenue — les « miracles » asiatiques : Corée du Sud, PIB/hab multiplié par 20+ depuis 1960). La croissance rapide ne garantit pas le développement si elle n\'est pas accompagnée d\'écoles, d\'hôpitaux et d\'institutions.</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>La conclusion SES</b> : le taux de croissance dit « à quelle vitesse on court », le PIB/hab « où on en est », l\'IDH « si ça profite aux habitants ». Une bonne copie articule les trois — et rappelle que la distribution (inégalités) conditionne l\'effet du développement sur les ménages.</div></div></details>\n<div class=\"tip\"><b>À retenir pour l\'argumentation :</b> Kuznets (courbe en U inversé : les inégalités montent puis descendent avec le développement — discutée empiriquement) : Piketty (r &gt; g) : Sen (capacités) : Acemoglu-Robinson (institutions). Quatre auteurs = quatre angles pour la dissertation.</div>"
