var PROGRAMME = [{"n": "Seconde — SES", "ch": [{"t": "Le marché et la formation des prix", "id": "marche-prix"}, {"t": "La création des richesses", "id": "creation-richesses"}, {"t": "Les entreprises et leur organisation", "id": "entreprises"}, {"t": "La socialisation et les groupes sociaux", "id": "socialisation"}]}, {"n": "Première — SES", "ch": [{"t": "Le marché du travail et l'emploi", "id": "marche-travail-emploi"}, {"t": "La monnaie et le financement de l'économie", "id": "monnaie-financement"}, {"t": "Les mobilités sociales", "id": "mobilites-sociales"}, {"t": "L'Union européenne et l'intégration économique", "id": "europe-integration"}]}, {"n": "Terminale — SES", "ch": [{"t": "Croissance, développement et inégalités", "id": "croissance-developpement-inegalites"}, {"t": "Mondialisation et commerce international", "id": "mondialisation-ecommerce"}, {"t": "Politiques économiques : relance, rigueur et régulation", "id": "politiques-economiques"}, {"t": "Environnement et climat : croissance soutenable", "id": "environnement-climat"}]}];
var COURS_META = [
{"id": "marche-prix", "theme": "Le marché et la formation des prix (SES — 2de)", "niveau": "Seconde — SES", "titre": "Le marché et la formation des prix", "cours": "<div class=\"cours-head\"><h2>Le marché et la formation des prix</h2><span class=\"niv\">SES · 2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le marché : rencontre entre offre et demande</h3>\n<div class=\"tip\"><b>Marché =</b> lieu (réel ou fictif) où s'échangent des biens, services, travail, capital... entre <b>offreurs</b> (vendeurs) et <b>demandeurs</b> (acheteurs). Un prix (en euros) et une quantité en résultent.<br><b>Types de marchés :</b> concurrence pure et parfaite (atomicité, transparence, libre entrée, homogénéité, mobilité) : la réalité s'en écarte souvent (monopole, oligopole).<br><b>La demande</b> est généralement <b>décroissante</b> avec le prix : <b>l'offre</b> est <b>croissante</b> avec le prix (plus le prix est haut, plus les producteurs offrent).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi le prix des fraises baisse en juin</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> En mai, les fraises valent 8 €/kg ; en juin, 3,50 €/kg. Expliquez avec le mécanisme du marché.</div><div class=\"etu\"><b>Étape 1</b> — <b>Identifier</b> : l'offre (producteurs) EXPLOSE en juin (tous les producteurs français récoltent en même temps : la courbe d'offre se déplace vers la droite) : la demande augmente peu (les consommateurs n'en mangent que marginalement plus).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le mécanisme</b> : au prix de mai (8 €), il y a un EXCÈS d'offre (trop de fraises pour les acheteurs) : les producteurs invendus baissent leurs prix pour écouler : les acheteurs achètent plus à prix bas : le prix baisse jusqu'au nouvel équilibre.</div><div class=\"etu\"><b>Étape 3</b> — <b>Généraliser</b> : règle à retenir : <b>excès d'offre ⟹ prix baisse ; excès de demande ⟹ prix hausse</b> : le prix est un SIGNAL (il indique la rareté) et un INCITANT (il oriente producteurs et consommateurs) : c'est la « main invisible » d'Adam Smith : personne ne décide du prix, il émerge des décisions de tous.</div></div></details>\n<h3>2. Élasticités : comment demande et offre réagissent</h3>\n<div class=\"tip\"><b>Élasticité-prix de la demande =</b> variation % de la demande ÷ variation % du prix. Si |e| &gt; 1 : demande <b>élastique</b> (sensible : loisirs, produits de luxe) : si |e| &lt; 1 : demande <b>inélastique</b> (nécessaires : pain, carburant, tabac).<br><b>Élasticité-revenu :</b> biens normaux (demande ↑ avec le revenu), biens inférieurs (demande ↓ quand le revenu ↑ : ex. pâtes bas de gamme), biens de luxe (élasticité &gt; 1).<br><b>Conséquence :</b> une hausse de taxes sur le tabac (prix ↑ 10 %) fait baisser la consommation de ~4 % (e ≈ -0,4 : inélastique) : la fiscalité « comportementale » en dépend.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer et interpréter une élasticité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le prix de l'essence augmente de 20 % : la consommation baisse de 4 %. Calculez l'élasticité et interprétez pour une politique de taxation.</div><div class=\"etu\"><b>Étape 1</b> — <b>Calcul</b> : e = Δ%demande / Δ%prix = -4 / +20 = <b>-0,2</b> : la demande baisse de 0,2 % quand le prix monte de 1 %.</div><div class=\"etu\"><b>Étape 2</b> — <b>Interprétation</b> : |e| = 0,2 &lt; 1 : demande très <b>inélastique</b> : l'essence est une nécessité (les trajets domicile-travail ne sont pas annulables à court terme : pas d'alternative immédiate pour les zones rurales).</div><div class=\"etu\"><b>Étape 3</b> — <b>Politique publique</b> : l'État peut lever beaucoup de recettes avec peu de baisse de consommation (taxe efficace fiscalement)... mais socialement explosive (les ménages modestes ruraux n'ont pas d'alternative : mouvement des « gilets jaunes » 2018, né de la hausse de la taxe carbone) : l'économie des incitations rencontre la sociologie des mobilités contraintes : un calcul d'élasticité ne suffit pas à décider, il éclaire une décision politique.</div></div></details>\n<h3>3. Quand le marché échoue : l'intervention publique</h3>\n<div class=\"tip\"><b>Le marché est souvent efficace, mais parfois défaillant :</b> <b>externalités</b> (pollution non facturée : le prix ne reflète pas le coût social : taxe carbone, marché de quotas), <b>biens collectifs</b> (défense, éclairage public : non payables individuellement : l'État finance), <b>asymétries d'information</b> (le vendeur en sait plus que l'acheteur : assurance, crédit : régulation), <b>monopoles</b> (prix abusifs : régulation des tarifs).<br><b>Exemples de cadre :</b> l'État fixe parfois des <b>prix plafonds</b> (loyers encadrés, tarifs régulés de l'électricité) ou des <b>planchers</b> (SMIC : salaire minimum légal).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le SMIC, prix plancher du travail</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le salaire minimum (SMIC : ~1 800 € brut en 2024) est un prix plancher. Pourquoi le fixer alors que le marché du travail pourrait « s'équilibrer » plus bas ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La logique du marché</b> : sans plancher, l'offre de travail abondante des non-qualifiés pourrait pousser les salaires très bas (équilibre de misère : pouvoir d'achat insuffisant : travailleurs pauvres).</div><div class=\"etu\"><b>Étape 2</b> — <b>La logique sociale</b> : un salaire minimum garantit un revenu décent, limite l'exploitation, soutient la demande (les salariés consomment) : la France le fixe par loi et le revalorise (inflation + croissance).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le débat</b> : les économistes divergent : un SMIC trop haut détruirait des emplois peu productifs (le coût du travail > ce que l'employeur peut payer) : mais les études françaises (depuis les travaux empiriques) montrent un effet faible sur l'emploi aux niveaux actuels, car il BOOSTE la productivité (réduction du turnover) et la consommation : la morale du chapitre : le marché forme les prix, mais la SOCIÉTÉ décide parfois d'encadrer la formation des prix pour atteindre d'autres objectifs (justice, cohésion) : économie ET politique.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ne pas confondre <b>déplacement le long</b> de la courbe (le prix varie) et <b>déplacement de la courbe</b> (autre chose que le prix varie : revenu, goûts, coût de production) : un prix bas n'est PAS toujours bon signe (surproduction) : « le marché » n'est pas seulement le marché boursier : le marché du MARIAGE existe pour Gary Becker (tout comportement peut s'analyser en offre/demande... à manier avec recul).</div>"},
{"id": "creation-richesses", "theme": "La création des richesses (SES — 2de)", "niveau": "Seconde — SES", "titre": "La création des richesses", "cours": "<div class=\"cours-head\"><h2>La création des richesses</h2><span class=\"niv\">SES · 2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Production, valeur ajoutée, PIB</h3>\n<div class=\"tip\"><b>Production =</b> activité qui crée des biens/services : marchands (vendus) ou non marchands (gratuits ou quasi-gratuits : éducation, sécurité : financés par prélèvements).<br><b>Valeur ajoutée (VA) = production − consommations intermédiaires</b> (ce que l'entreprise achète et transforme/détruit : matières, énergie, services). La VA est la richesse créée par l'entreprise.<br><b>PIB = somme des VA</b> (+ TVA) d'un pays : l'indicateur de richesse créé, pas de la richesse possédée.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — de la baguette au PIB</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un boulanger achète 0,40 € de farine et d'ingrédients par baguette, la vend 1,20 €. Calculez sa VA, puis expliquez comment le PIB totalise les VA.</div><div class=\"etu\"><b>Étape 1</b> — <b>La VA</b> : VA = 1,20 − 0,40 = <b>0,80 €</b> par baguette : c'est le supplément de valeur créé par le travail du boulanger (transformation, cuisson, service).</div><div class=\"etu\"><b>Étape 2</b> — <b>Pourquoi sommer les VA et non les productions</b> : si on additionnait les productions, on compterait la farine DEUX fois (une fois comme production de l'agriculteur, une fois dans le prix du pain) : le PIB additionne les VA pour ne compter chaque richesse qu'UNE fois.</div><div class=\"etu\"><b>Étape 3</b> — <b>La répartition</b> : cette VA de 0,80 € est distribuée : salaires (≈ 55 % de la VA en France), impôts sur la production, excédent brut d'exploitation (profit du boulanger) : le PIB est donc AUSSI la somme des revenus distribués (approche par les revenus) : produire = créer ce qui sera distribué : le circuit est bouclé (production → revenus → dépenses → production).</div></div></details>\n<h3>2. Mesurer : limites du PIB</h3>\n<div class=\"tip\"><b>Le PIB ne mesure pas :</b> le travail domestique et bénévole (une machine à laver « détruit » du PIB si elle remplace un service payant... ou l'inverse), l'économie informelle, le patrimoine naturel consommé, les inégalités (moyenne ≠ répartition), la qualité de vie.<br><b>Indicateurs complémentaires :</b> PIB/habitant (comparaisons), IDH (santé + éducation + revenu), empreinte écologique, indicateur de bien-être (OCDE), « PIB vert ». <b>PIB ≠ richesse du pays</b> (stock) : c'est un FLUX annuel.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la recession de 2020 et le rebond</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le PIB français a baissé de ~8 % en 2020 puis a rebondi. Que mesure exactement cette variation ? Donne un exemple de ce que le PIB n'a pas vu.</div><div class=\"etu\"><b>Étape 1</b> — <b>Ce qu'il mesure</b> : l'effondrement des transactions marchandes : restaurants fermés, avions cloués, voitures invendues : la valeur ajoutée de ces secteurs a chuté : −8 % = la France a produit ~8 % de richesse marchande et non marchande « effective » en moins.</div><div class=\"etu\"><b>Étape 2</b> — <b>Ce qu'il n'a pas (bien) vu</b> : le télétravail massif (cours en ligne : peu comptés), le bénévolat pandémique (fabrication de masques, soutien aux voisins : non marchand non compté), la souffrance sociale : en revanche, les dépenses de santé, les dispositifs « quoi qu'il en coûte » (garanties, déficits) apparaissent... plus tard : le PIB 2020 a SAUVÉ des entreprises mortes en comptant leurs salaires payés par le chômage partiel (transferts). </div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan SES</b> : le PIB reste l'indicateur central (il mesure l'activité, l'emploi, les ressources fiscales possibles) mais doit être COMPLÉTÉ (IDH, inégalités, empreinte) : la règle de copie : ne jamais dire « le PIB est mauvais » : dire « le PIB mesure X, pas Y : pour Y, on utilise Z » : la précision méthodologique est la compétence valorisée en SES.</div></div></details>\n<h3>3. Croissance : sources et limites</h3>\n<div class=\"tip\"><b>Croissance = augmentation du PIB réel</b> (à prix constants : on enlève l'inflation). Sources : <b>travail</b> (population active, durée, qualification : capital humain), <b>capital physique</b> (machines, infrastructures : investissement), <b>productivité globale des facteurs</b> (progrès technique, organisation — Solow).<br><b>Facteurs institutionnels :</b> droits de propriété, stabilité, éducation, recherche, open innovation.<br><b>Limites :</b> la croissance extensive (plus de ressources) a des rendements décroissants : la croissance intensive (mieux produire) est la seule soutenable à long terme... mais bute sur l'écologie (découplage absolu à démontrer).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — les Trente Glorieuses : anatomie d'un miracle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La France de 1945-1975 connaît ~5 %/an de croissance. Décomposez les sources de cette croissance.</div><div class=\"etu\"><b>Étape 1</b> — <b>Travail</b> : reconstruction + baby-boom (la population active gonfle), exode rural (l'agriculture libère des bras pour l'industrie : gains de productivité agricoles), immigration de travail, catching-up des qualifications.</div><div class=\"etu\"><b>Étape 2</b> — <b>Capital</b> : reconstruction, Plan Monnet-Marshall (américain : dollars + machines), investissement massif dans l'industrie et les infrastructures : le ratio capital/travail monte.</div><div class=\"etu\"><b>Étape 3</b> — <b>Progrès technique</b> : transferts américains (fordisme : chaîne, électricité, chimie), énergie abondante et pas chère (pétrole), gains de productivité ~5 %/an : ils financent les salaires réels (+ la consommation de masse : équipement, voiture, tourisme). La fin (1973-75) : chocs pétroliers + plein-emploi des gisements extensifs : la croissance doit devenir INTENSIVE (innovation) — plus lente : le chapitre suivant (de 2de) sur la consommation l'explique : produire plus AVEC MOINS devient la règle, et la question écologique la radicalise.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le PIB n'est pas « la richesse » (un stock : patrimoine) mais un flux : VA ≠ chiffre d'affaires (retrancher les consommations intermédiaires) : croissance nominale ≠ réelle (déflater) : le PIB marchand sous-estime le non-marchand (prix imputés) : dire « le PIB ne mesure pas le bonheur » est un cliché : ce qui est attendu, c'est de dire CE QU'il mesure et avec quelles limites.</div>"},
{"id": "entreprises", "theme": "Les entreprises et leur organisation (SES — 2de)", "niveau": "Seconde — SES", "titre": "Les entreprises et leur organisation", "cours": "<div class=\"cours-head\"><h2>Les entreprises et leur organisation</h2><span class=\"niv\">SES · 2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Qu'est-ce qu'une entreprise ?</h3>\n<div class=\"tip\"><b>Définition :</b> organisation combinant <b>travail</b> (salariés), <b>capital</b> (machines, bâtiments, brevets) et <b>information</b> pour produire des biens/services marchands (le secteur non marchand = administrations/associations).<br><b>Objectifs :</b> profit (maximiser la VA répartie en rémunérant le capital), mais aussi survie, part de marché, croissance... <b>l'entreprise est un lieu de COOPÉRATION (produire ensemble) ET de CONFLIT (partage de la VA)</b> : salaires vs profits : marché du travail + relations professionnelles.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire un compte de résultat simplifié</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une PME : chiffre d'affaires 500 k€, consommations intermédiaires 200 k€, salaires 180 k€, impôts 20 k€, intérêts 10 k€. Calculez VA, EBE, profit et montrez les enjeux du partage.</div><div class=\"etu\"><b>Étape 1</b> — <b>Création</b> : VA = 500 − 200 = <b>300 k€</b> (richesse créée) : l'entreprise « transforme » 200 k€ d'achats en 300 k€ de valeur supplémentaire grâce au travail et au capital.</div><div class=\"etu\"><b>Étape 2</b> — <b>Partage primaire</b> : EBE = VA − salaires − impôts = 300 − 180 − 20 = <b>100 k€</b> : l'excédent va au capital (propriétaires, prêteurs, investissement) : après intérêts (10), le profit est 90 k€ : salaires 60 % de la VA : profit 30 % (moyennes françaises respectées).</div><div class=\"etu\"><b>Étape 3</b> — <b>L'enjeu SES</b> : si les salariés obtiennent +20 k€ de salaires, l'EBE tombe à 80 : si les propriétaires gardent tout, l'investissement ou les salaires en pâtissent : le conflit d'intérêts est STRUCTUREL (partage d'un gâteau unique) : c'est pourquoi négociations collectives, syndicats, right to strike et partage de la VA sont des institutions centrales du capitalisme : l'entreprise est un nœud de POUVOIRS, pas juste une fonction de production.</div></div></details>\n<h3>2. Formes juridiques et tailles</h3>\n<div class=\"tip\"><b>Statuts :</b> entreprise individuelle (responsabilité infinie de l'entrepreneur), société (SARL/EURL, SAS/SASU : responsabilité limitée aux apports : la forme dominante des créations aujourd'hui), SA (actions en bourse : capital ouvert), coopératives (SCOP : les salariés sont associés), associations (non lucratif).<br><b>Tailles :</b> micro-entreprise (&lt;10 salariés : 96 % des entreprises françaises !), PME (10-250 : la majorité des emplois), ETI (250-5 000), grand groupe (5 000+) : le « tissu » est dominé par les TPE-PME, la recherche et l'export par les grands groupes.<br><b>Depuis les années 1980 :</b> « désintégration » : les grandes entreprises se concentrent sur le cœur (marque, R&D) et SOUS-TRAITENT le reste (chaînes de valeur mondiales : Apple conçoit, Foxconn assemble).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi tant de SAS ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La grande majorité des créations d'entreprises françaises sont des SAS/SASU ou micro-entrepreneurs. Que révèle ce choix juridique ?</div><div class=\"etu\"><b>Étape 1</b> — <b>La SAS</b> : responsabilité limitée aux apports (on ne perd que ce qu'on a mis), statuts très libres (organiser pouvoir, entrée d'investisseurs, bonis), crédibilité auprès des banques et investisseurs : le « sur-mesure juridique » — voilà pourquoi la SAS a détrôné la SARL.</div><div class=\"etu\"><b>Étape 2</b> — <b>La micro-entreprise</b> : comptabilité ultra-simplifiée (un livre de recettes, charges calculées forfaitaires) : idéal pour tester une activité, un statut d'auto-entrepreneur ( Freelance, artisan, Uber) : MAIS pas de protection sociale complète comparée au salarié (chômage absent), plafonds de chiffre d'affaires.</div><div class=\"etu\"><b>Étape 3</b> — <b>Lecture SES</b> : le choix du statut est un choix d'INCITATIONS : le législateur a voulu fluidifier la création (juridictions entrepreneuriales simplifiées) : les chiffres ont suivi (+1 M de micro-entrepreneurs depuis 2008) : les critiques : précarisation déguisée ? (des plateformes « poussent » vers ce statut pour éviter les charges salariales — contentieux Uber) : le droit des affaires EST une politique économique : le formulaire juridique façonne les comportements.</div></div></details>\n<h3>3. Coopération et pouvoir dans l'entreprise</h3>\n<div class=\"tip\"><b>Taylorisme (1900) :</b> séparation conception/exécution, parcellisation, contrôle : gains de productivité MASSIFS mais aliénation (Chaplin, « Les Temps modernes »). <b>Fordisme (1920) :</b> + chaîne de montage + salaire élevé (les ouvriers achètent les voitures). <b>Toyotisme (1970) :</b> qualité totale, juste-à-temps, implication des opérateurs (multi-tâches), résolution de problèmes : « lean ».<br><b>Aujourd'hui :</b> agilité, télétravail, management participatif... mais aussi intensification (burn-out), surveillance numérique (badgeage connecté) : la question du POUVOIR demeure : qui décide (actionnaires, dirigeants, salariés) ? Comités sociaux, actionnariat salarié, codétermination allemande.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — du taylorisme au plateau de startup</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparez l'organisation du travail : l'usine Taylor (1910), la chaîne Ford (1930), l'atelier Toyota (1985) et le « open space » d'une scale-up (2024). Quelle continuité ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Taylor</b> : « il n'y a qu'une seule bonne manière » : le bureau des méthodes chronomètre, l'ouvrier exécute un geste : productivité ×3, métiers déqualifiés, conflits violents.</div><div class=\"etu\"><b>Étape 2</b> — <b>Ford puis Toyota</b> : Ford ajoute la chaîne et les 5 dollars/jour (consommation de masse) : Toyota inverse la logique : ce sont les OPÉRATEURS qui améliorent le processus (kaizen, andon : arrêter la chaîne en cas de défaut) : l'implication devient productive.</div><div class=\"etu\"><b>Étape 3</b> — <b>La scale-up</b> : open space, OKR, « liberté et responsabilité » : la coopération créative est recherchée... mais les plateformes de gestion (tickets, métriques, « stand-up » quotidiens) reconstituent une mesure permanente du travail : la continuité ? l'ORGANISATION du travail suit toujours le même objectif (productivité), mais le pouvoir s'exerce différemment : du chronomètre visible aux métriques invisibles : en SES, c'est l'exemple parfait que les notions (division du travail, coopération, pouvoir) traversent les époques.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> entreprise ≠ société (juridique) : une association peut employer des salariés et gérer des millions (non lucratif = pas de bénéfices distribués) : le profit n'est pas le but UNIQUE (survie, croissance, parts de marché) et l'EBE ≠ bénéfice net (impôts, intérêts, amortissements) : les PME ne sont pas « plus vertueuses » par essence (les pratiques d'emploi y sont parfois plus précaires) : une micro-entreprise de 2 personnes est une ENTREPRISE (ne pas confondre avec le régime fiscal micro).</div>"},
{"id": "socialisation", "theme": "La socialisation et les groupes sociaux (SES — 2de)", "niveau": "Seconde — SES", "titre": "La socialisation et les groupes sociaux", "cours": "<div class=\"cours-head\"><h2>La socialisation et les groupes sociaux</h2><span class=\"niv\">SES · 2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Devenir un individu social</h3>\n<div class=\"tip\"><b>Socialisation =</b> processus par lequel un individu apprend et intériorise les normes et les valeurs de sa société, tout au long de la vie, et construit son identité sociale. <b>Norme =</b> règle de conduite (plus ou moins contraignante : légalement, socialement). <b>Valeur =</b> idéal partagé (liberté, travail, famille...).<br><b>Agents de socialisation :</b> la famille (primaire : première socialisation), l'école, les pairs, les médias, le travail, la religion, les plateformes... <b>Socialisation différenciée :</b> selon le sexe, la classe sociale, la génération : on n'apprend pas les mêmes choses, ni de la même façon.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — « l'expérience des goûters » : apprendre sans le savoir</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> À 4 ans, des enfants partagent déjà différemment les goûters selon qu'ils sont issus de milieux populaires ou favorisés. Que démontrent les observations sociologiques (codes linguistiques de Bernstein, repris par Bourdieu et Passeron) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le constat</b> : dans l'expérience classique, les enfants de milieux favorisés expliquent longuement leurs choix, utilisent un vocabulaire abstrait, s'appuient sur des règles explicites (« c'est injuste si... ») : les enfants de milieux populaires s'appuient sur la pratique et des exemples concrets (« on partage comme à la maison »).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'interprétation</b> : chacun a appris DANS SA FAMILLE une manière de parler, de justifier, de se tenir : l'école valorise le registre « scolaire » (abstrait, explicite) : donc l'école récompense sans le savoir un héritage : ce n'est pas une question d'« intelligence » mais de code culturel appris : c'est ce que Bourdieu appelle l'habitus et le capital culturel.</div><div class=\"etu\"><b>Étape 3</b> — <b>La conséquence SES</b> : l'échec scolaire n'est pas seulement individuel : il est SOCIALEMENT PRODUIT (inégalité devant l'école selon l'origine) : c'est le fondement des débats sur l'égalité des chances, le « niveau de langue requis », les devoirs faits, la maternelle à 2 ans pour tous : la socialisation, ce n'est pas une théorie vague : c'est l'explication mécanique de la reproduction sociale — un chapitre au programme EXPLICITEMENT pour comprendre les inégalités.</div></div></details>\n<h3>2. Socialisation continue et identités multiples</h3>\n<div class=\"tip\"><b>La socialisation ne s'arrête pas à l'enfance :</b> on est resocialisé à l'entrée dans l'armée, l'entreprise, la retraite, le mariage, la prison (socialisation « totale » des institutions closes : Goffman).<br><b>Identité sociale multiple :</b> on est simultanément fille/ fils, élève, amis d'un groupe, supporteur, citoyenne : les rôles peuvent entrer en conflit (désynchronisation : l'ado entre pair et famille) : l'identité est une NEGOCIATION (théorie des rôles : Goffman, la « présentation de soi » : face à la scène sociale, comme un acteur).<br><b>Genre :</b> la socialisation genrée fabrique des différences perçues comme « naturelles » : jouets, couleurs, métiers, tâches domestiques : la socialisation est un ENJEU (égalité femmes-hommes : débat des jouets « genrés »).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — du pyjama rose au plafond de verre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Montrez comment la socialisation genrée, de l'enfance à l'âge adulte, participe aux inégalités professionnelles femmes-hommes.</div><div class=\"etu\"><b>Étape 1</b> — <b>L'enfance</b> : rayons « filles » (poupées, déguisements, soin) vs « garçons » (construction, sciences, aventure) : les enfants intériorisent les activités « pour moi » : à 6-7 ans, les filles sous-estiment déjà leurs capacités en sciences (études sur les stéréotypes de « brillance »).</div><div class=\"etu\"><b>Étape 2</b> — <b>Adolescence et orientation</b> : les filles s'orientent moins vers les filières techniques (CPGE scientifiques, écoles d'ingénieurs ~30 %) : les garçons moins vers lettres, paramédical, social : les stéréotypes de métier (« métiers d'homme ») pèsent dans les vœux d'orientation : conseil de classe, familles, médias.</div><div class=\"etu\"><b>Étape 3</b> — <b>Âge adulte</b> : la charge mentale domestique inégale (les femmes assument ~2/3 des tâches) freine carrières et salaires (écart ~15-20 % à équivalent de poste : temps partiel subi, interruptions) : la boucle : socialisation genrée → choix « libres » mais contraints → inégalités durables : la réponse publique : jouets neutres (loi 2014 ? non : chartes des fabricants, avis de l'Observatoire des inégalités), sensibilisation à l'école, quotas (parité en politique, Conseils d'administration — avec effets mesurés). La sociologie du genre montre que le « naturel » est largement APPRIS : c'est une des contributions les plus solides de la discipline.</div></div></details>\n<h3>3. Groupes sociaux et appartiances</h3>\n<div class=\"tip\"><b>Groupe primaire</b> (intime : famille, amis) vs <b>groupe secondaire</b> (formel : classe, entreprise, syndicat). <b>Groupe de référence :</b> le groupe auquel on s'IDENTIFIE (même sans en faire partie : un ado de banlieue se réfère aux codes de la « hype » parisienne).<br><b>Sociabilité :</b> réseau de relations (Putnam : le déclin du « capital social » aux USA : moins d'engagement associatif ? débat). <b>Communautés :</b> appartiances religieuses, ethniques, générationnelles (millenials : natifs numériques : une socialisation par les plateformes).<br><b>Mixité des appartenances :</b> un même individu traverse des mondes sociaux : les écarts de normes peuvent créer des conflits (devoir se « tenir » différemment chez ses grands-parents et en cours).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'ado, ses deux tribus</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Yasmine, 15 ans, « switche » entre le langage de sa famille, celui du lycée et celui de son groupe TikTok. Utilisez les notions (rôles, groupes de référence, socialisation) pour analyser.</div><div class=\"etu\"><b>Étape 1</b> — <b>Trois scènes</b> (Goffman : la « présentation de soi ») : à la maison : vouvoiement des aînés, code respectueux : au lycée : registre scolaire, posture d'élève : en ligne : codes du groupe (abréviations, humour, « trends ») : Yasmine joue des RÔLES adaptés à chaque « scène » — l'identité est performative, pas figée.</div><div class=\"etu\"><b>Étape 2</b> — <b>Groupes de référence</b> : Yasmine peut copier les codes d'influenceurs qu'elle ne connaît pas (groupe de référence DISTANT) plus que ceux de sa classe : la socialisation par les PAIRS s'étend désormais aux pairs NUMÉRIQUES (communauté d'appartenance sans co-présence — une nouveauté historique).</div><div class=\"etu\"><b>Étape 3</b> — <b>Tension et bricolage</b> : quand les codes se contredisent (un devoir « bien parlé » vs un tchat « mal écrit »), l'individu fait un BRICOLAGE identitaire (croisement des cultures : Bastide) : la sociologie contemporaine insiste : l'individu n'est pas un simple « produit » de la socialisation : il COMPOSE avec les héritages (individualisation : Beck) : la bonne copie utilise ces deux niveaux — l'apprentissage ET la marge de manœuvre.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la socialisation n'est pas un « dressage » : l'individu garde une marge (bricolage, résistance) : ne pas confondre <b>norme</b> (règle) et <b>valeur</b> (idéal) : la socialisation « primaire » (famille) n'est pas la seule (continue) : le genre est une CONSTRUCTION sociale (rôles appris), distincte du sexe (donnée biologique) : le « milieu » ne détermine pas mécaniquement (les « transfuges de classe » existent — mais statistiquement rares : c'est le sens de « reproduction »).</div>"},
{"id": "marche-travail-emploi", "theme": "Le marché du travail et l'emploi (SES — 1re)", "niveau": "Première — SES", "titre": "Le marché du travail et l'emploi", "cours": "<div class=\"cours-head\"><h2>Le marché du travail et l'emploi</h2><span class=\"niv\">SES · 1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Comment se forment les salaires et l'emploi ?</h3>\n<div class=\"tip\"><b>Marché du travail :</b> offre de travail (les actifs) et demande de travail (les employeurs). Comme tout marché, un prix s'y forme : le <b>salaire</b> : mais un marché très imparfait (segments, institutions, asymétries).<br><b>Vision classique :</b> le chômage vient d'un salaire « trop haut » (rigidités : SMIC, syndicats) : la flexibilité rétablit l'équilibre. <b>Vision keynésienne :</b> le chômage vient d'une demande de biens insuffisante (les entreprises n'embauchent pas car elles ne vendent pas) : il faut soutenir la demande.<br><b>Théorie du salaire d'efficience :</b> les employeurs paient AU-DESSUS de l'équilibre pour motiver et retenir (le chômage ne disparaît pas même en baissant les salaires : pourquoi les salaires ne baissent pas en crise).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi les salaires ne baissent pas en récession</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> En 2009 ou 2020, le chômage a bondi, mais les salaires n'ont guère baissé (ils ont même continué de monter lentement). Expliquez ce paradoxe pour la théorie classique.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les faits</b> : le modèle de base prédit : excès d'offre de travail ⟹ baisse des salaires ⟹ retour au plein-emploi : or les salaires sont restés rigides vers le bas et le chômage a persisté.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les explications</b> : 1) <b>salaire d'efficience</b> (Akerlof, Yellen) : baisser les salaires détruirait la motivation et ferait fuir les meilleurs : 2) <b>contrats et institutions</b> : conventions collectives, SMIC, indexation : 3) <b>relations d'emploi longues</b> : on ne renégocie pas chaque jour comme sur un marché de pommes (théorie des contrats implicites).</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon SES</b> : le marché du travail n'est PAS un marché ordinaire : la « marchandise » est un être humain, la relation dure, l'information est asymétrique, les institutions encadrent : c'est pourquoi les économistes parlent de marché du travail au pluriel (segmenté : ouvrier/ingénieur, cadre/interim : chacun son segment, ses règles) : toute copie qui traite le travail comme un marché de pommes est hors sujet.</div></div></details>\n<h3>2. Chômage : mesures, formes, causes</h3>\n<div class=\"tip\"><b>Chômeur (BIT) :</b> personne sans emploi, disponible, recherchant activement. <b>Taux de chômage =</b> chômeurs / population active (actifs occupés + chômeurs). En France ~7-8 % en 2024 (contre ~10 % en 2015).<br><b>Formes :</b> chômage <b>frictionnel</b> (rotation normale : entre deux emplois), <b>structurel</b> (inadéquation qualifications/besoins : le débat central), <b>conjonturel</b> (cycle), <b>technique</b> (machines).<br><b>Autres indicateurs :</b> halo du chômage, sous-emploi, taux d'emploi (20-64 ans), précarité (CDD, intérim : ~15 % des salariés).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le plan de sauvegarde de l'emploi : une usine ferme</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une usine automobile (800 salariés) ferme à Douai, l'employeur ouvre une usine en Slovaquie. Analysez le type de chômage créé et les politiques de réponse.</div><div class=\"etu\"><b>Étape 1</b> — <b>Diagnostic</b> : chômage STRUCTUREL : les compétences (chaîne de montage automobile) ne correspondent plus aux besoins locaux : le choc est local (taux de chômage de la zone +3-4 points) et durable (les ex-salariés retrouvent un emploi à -20 % de salaire en moyenne : « cicatrice » du chômage documentée).</div><div class=\"etu\"><b>Étape 2</b> — <b>Politiques du marché du travail (« flexicuréité »)</b> : 1) <b>flexibilité</b> : faciliter licenciements/ embauches (CDD, intérim, plans de sauvegarde indemnités) : 2) <b>sécurité</b> : indemnisation chômage (France : ~60-75 % de l'ancien salaire), accompagnement (France Travail, cellules de reclassement), formation (compte personnel de formation).</div><div class=\"etu\"><b>Étape 3</b> — <b>Le débat complet</b> : les uns : trop de protection décourage d'embaucher (coût du licenciement ⟹ prudence ⟹ CDI rationné) : les autres : la flexibilité sans sécurité crée une société de travailleurs pauvres : le modèle danois (flexicurité : licenciement facile MAIS indemnisation forte et formation massive) est la référence : la France combine flexibilité « à la marge » (précarité des jeunes : 70 % des nouveaux contrats) et protection des insiders : l'analyse SES doit toujours articuler les DEUX faces.</div></div></details>\n<h3>3. Destructions et créations d'emplois : la machine schumpétérienne</h3>\n<div class=\"tip\"><b>Schumpeter :</b> « destruction créatrice » : les innovations détruisent des emplois (le numérique a fait chuter l'imprimerie de presse) et en créent d'autres (data analysts, développeurs : métiers inexistants il y a 20 ans). Sur 30 ans, l'économie française a détruit et créé ~2 M d'emplois NETS positifs... mais la transition est brutale pour les personnes concernées.<br><b>Enjeu moderne :</b> automatisation/IA : l'OCDE estime ~10-15 % d'emplois « à haut risque » en Europe (caissiers, saisie) : la réponse : formation continue, capital humain, « complémentarité » homme-machine.<br><b>Interrogation finale :</b> le travail se transforme (plateformes, télétravail, quête de sens) : la valeur travail décline-t-elle ? (enquêtes : toujours placée en tête, mais l'équilibre vie-travail progresse : la socialisation professionnelle évolue).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — caissière ou développeuse ? la transition n'est pas automatique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur 10 emplois détruits par l'automatisation, combien sont « recréés » pour les mêmes personnes ? Analysez l'écart entre le raisonnement macro et le vécu micro.</div><div class=\"etu\"><b>Étape 1</b> — <b>Macro</b> : à l'échelle du pays, le solde est positif (l'économie crée plus qu'elle ne détruit : le chômage français a baissé de 10 à 7 % entre 2015 et 2024) : les nouveaux emplois se créent dans la santé, l'informatique, les services.</div><div class=\"etu\"><b>Étape 2</b> — <b>Micro</b> : la caissière de 52 ans de Roubaix ne devient pas data analyst : mobilité professionnelle impossible sans formation longue : son salaire de réembauche décroche de 15-25 % : les « emplois créés » ne sont pas « attribués » aux « détruits » : il y a un problème de CORRESPONDANCE (géographique, de qualification, de salaire).</div><div class=\"etu\"><b>Étape 3</b> — <b>Politiques</b> : d'où l'importance : 1) de la formation continue (compte personnel, pro-A : France Travail) : 2) de l'indemnisation qui sécurise la recherche (et donc les bons appariements : ne pas prendre le premier emploi venu) : 3) des politiques territoriales (l'usine qui ferme vide une ville : reconversion locale) : la « destruction créatrice » est un processus SOCIALEMENT SOUTENU ou elle détruit plus qu'elle ne crée — la formule de Schumpeter décrit une tendance, pas une excuse.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> population active ≠ population en âge de travailler (15-64) : taux de chômage ≠ taux d'emploi : le halo du chômage (découragés, temps partiel subi) sous-estime le sous-emploi : le salaire n'est pas fixé par la seule productivité (normes, institutions, rapports de force) : « le chômage technologique » n'est pas automatique (150 ans d'histoire : les machines ont toujours redéployé le travail — à condition que la société organise la transition).</div>"},
{"id": "monnaie-financement", "theme": "La monnaie et le financement de l'économie (SES — 1re)", "niveau": "Première — SES", "titre": "La monnaie et le financement de l'économie", "cours": "<div class=\"cours-head\"><h2>La monnaie et le financement de l'économie</h2><span class=\"niv\">SES · 1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. À quoi sert la monnaie ?</h3>\n<div class=\"tip\"><b>Trois fonctions :</b> 1) <b>intermédiaire des échanges</b> (éviter le troc et sa « double coïncidence des besoins » : j'ai des œufs, je cherche un prof de maths qui veut des œufs...) : 2) <b>unité de compte</b> (exprimer les valeurs : un prix unique en €) : 3) <b>réserve de valeur</b> (épargner : à condition que l'inflation soit maîtrisée).<br><b>Formes :</b> billets et pièces (5 % de la masse !), dépôts bancaires (la monnaie est aujourd'hui essentiellement SCRIPTURALE : des écritures), monnaie électronique. <b>La BCE :</b> émet les billets, définit la politique monétaire de la zone euro (taux directeurs, objectifs d'inflation ~2 %).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comment une banque « crée » de la monnaie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une banque accorde un prêt de 10 000 € à un boulanger. D'où sort cet argent ? « Des dépôts des épargnants » ? Pas seulement : expliquez le multiplicateur monétaire.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le mécanisme</b> : la banque inscrit 10 000 € au crédit du compte du boulanger : cette écriture EST de la monnaie nouvelle (« les crédits font les dépôts ») : le boulanger paie son fournisseur, dont la banque reçoit le dépôt... et peut prêter à nouveau (en gardant des réserves obligatoires et du capital).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le multiplicateur</b> : avec un taux de réserve de 1 %, 10 000 € de monnaie centrale peuvent soutenir ~100 000 € de dépôts (le multiplicateur) : MAIS la création est limitée par : la demande de crédit saine, les exigences de capital (Bâle III), la prudence, et la BCE (les taux qu'elle fixe au refinancement).</div><div class=\"etu\"><b>Étape 3</b> — <b>La leçon SES</b> : la monnaie n'est pas une quantité FIXE (une masse d'or) : c'est un FLUX d'écritures adossées à des promesses de remboursement : c'est pourquoi une crise de confiance (2008 : « qui porte quoi ? ») gèle la création et pourquoi la banque centrale peut « en mettre » (assouplissement quantitatif : la BCE a acheté pour ~5 000 Md € d'actifs depuis 2015 pour soutenir l'économie) : comprendre la monnaie-scripturale, c'est comprendre la finance moderne — et ses crises.</div></div></details>\n<h3>2. Financement : direct, indirect, hybride</h3>\n<div class=\"tip\"><b>Financement INTERNE :</b> autofinancement (épargne de l'entreprise : la moitié de l'investissement français). <b>Financement EXTERNE :</b><br>— <b>direct</b> : marchés de capitaux (actions, obligations : l'entreprise emprunte aux épargnants sans intermédiaire, via les marchés) :<br>— <b>indirect</b> (intermédié) : banques (crédit : la banque transforme les dépôts courts en prêts longs : transformation) :<br>— <b>hybride</b> : capital-investissement (private equity), prêts participatifs.<br><b>Avantages/risques :</b> marché = masse, flexibilité, visibilité (cotation) : banque = relation, suivi, confidentialité : l'économie française est plutôt « bank-based » (les PME dépendent du crédit), les anglo-saxonnes « market-based ».</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lever 2 M€ : les trois scénarios</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une PME industrielle de 25 salariés veut financer une nouvelle ligne (2 M€). Comparez crédit bancaire, introduction en Bourse et private equity.</div><div class=\"etu\"><b>Étape 1</b> — <b>Crédit bancaire</b> : la banque prête sur dossier (bilans, garanties : souvent des cautions personnelles du dirigeant !) : coût : intérêts (~3-6 %) : le dirigeant garde le contrôle : risque : l'entreprise supporte seule la charge (si l'investissement échoue, faillite possible).</div><div class=\"etu\"><b>Étape 2</b> — <b>Bourse</b> : émettre des actions : pas de remboursement, pas d'intérêts : MAIS exige : une taille critique (les analystes suivent peu les small caps), une transparence totale (publication trimestrielle), une dilution du contrôle (les actionnaires peuvent voter contre le dirigeant) : pour une PME, souvent inadapté.</div><div class=\"etu\"><b>Étape 3</b> — <b>Private equity</b> : un fonds (BPI, Ardian...) entre au capital (30-80 %) : apporte de l'argent ET du conseil (gouvernance, industrialisation) : attente : une sortie à +3-5 ans (revente, introduction) : le fonds veut un rendement (LBO : effet de levier par la dette) : la leçon SES : le choix de financement n'est pas neutre : il redéfinit le CONTRÔLE de l'entreprise (banquier = créancier, actionnaire = copropriétaire) : financer, c'est déjà gouverner — une intuition clé pour comprendre le capitalisme contemporain.</div></div></details>\n<h3>3. Taux d'intérêt, inflation, politique monétaire</h3>\n<div class=\"tip\"><b>Taux d'intérêt =</b> prix du temps (le loyer de l'argent) : <b>taux réel ≈ taux nominal − inflation</b> (à 5 % nominal et 3 % d'inflation, le coût réel est ~2 %).<br><b>Politique monétaire de la BCE :</b> taux directeurs (les banques se refinancent plus ou moins cher : la BCE répercute) : depuis 2022, hausse historique (de −0,5 % à +4 %) pour casser l'inflation : effet : crédits plus chers, immobilier en berne, mais l'épargne rémunérée. <b>Assouplissement</b> (2015-2021 : taux négatifs, rachats d'actifs) : objectif : relancer le crédit et l'investissement.<br><b>Inflation :</b> érosion de la valeur de la monnaie : un peu (~2 %) est visé : trop détruit la confiance : la spirale salaires-prix est le risque central (les anticipations s'auto-réalisent).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — 2022-2023 : la BCE face à l'inflation à 10 %</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'inflation de la zone euro passe de 2 % à 10 % (2022). La BCE monte ses taux de -0,5 % à +4 %. Expliquez le mécanisme de transmission et les effets secondaires.</div><div class=\"etu\"><b>Étape 1</b> — <b>La logique</b> : l'inflation vient d'abord d'un choc EXTERNE (énergie, désorganisation post-Covid, guerre en Ukraine) : la BCE ne produit ni gaz ni blé, mais elle peut casser la DEMANDE (rendre le crédit cher) et surtout ANCRER LES ANTICIPATIONS : si les acteurs croient que l'inflation durera, ils indexent salaires et prix (la boucle s'auto-alimente).</div><div class=\"etu\"><b>Étape 2</b> — <b>La transmission</b> : taux ↑ ⟹ crédits bancaires + chers (crédit immobilier : de 1 % à 3,5 % : les ventes de logements s'effondrent de 20-30 %) ⟹ consommation et investissement ralentissent ⟹ la demande de biens baisse ⟹ les hausses de prix se modèrent : l'inflation est retombée vers ~2,5-3 % dès 2024.</div><div class=\"etu\"><b>Étape 3</b> — <b>Les effets secondaires (à citer pour le niveau +)</b> : les États empruntent plus cher (la charge de la dette italienne/française explose : la dette publique française ~3 000 Md € : chaque point de taux = ~40-50 Md €/an de charge supplémentaire à terme), les banques fragilisées (crises bancaires US 2023 : des banques détenant des obligations anciennes à taux bas voient leur valeur chuter : Silicon Valley Bank), les ménages variables pénalisés. La leçon : la politique monétaire est PUISSANTE mais GROSSIÈRE : elle touche toute l'économie pour corriger un choc sectoriel — d'où le débat sur l'articulation avec la politique budgétaire (qui peut cibler : baisser les taxes sur le carburant plutôt que casser la demande globale).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> les banques ne « prêtent pas les dépôts existants », elles créent de la monnaie (mais limitée par règles et prudence) : le taux nominal ≠ taux réel (déflater par l'inflation) : la BCE est indépendante (elle ne finance PAS les États de la zone : interdiction de monétisation) : « la planche à billets » moderne = création monétaire par le crédit, pas seulement par l'État : l'inflation et le chômage peuvent être en tension (courbe de Phillips, débattue).</div>"},

    var x = M + (ln.indent || 0);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      var enc = pdfEnc(pdfTranslit(s.t));
      if (!enc) return;
      cur.push('BT 1 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Tm /F' + (s.b ? 2 : 1) + ' ' + ln.size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
      x += 0.52 * ln.size * enc.length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de SES</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + h + '</section>';
})();

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
