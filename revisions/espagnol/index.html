{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« El año pasado ___ a España » (visitar, action datée)", "c": ["visito", "visité", "visitaba a", "visitaba"], "a": 1, "e": "« El año pasado » = action datée, ponctuelle → indefinido : visité.", "d": "<b>El año pasado : le voyage d'un été</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « el año pasado » (l'année dernière) DATE le voyage : c'est UN événement (ce voyage-là) → <b>indefinido</b> : <i>El año pasado <b>visité</b> España.</i> (l'année dernière j'ai visité l'Espagne) : la terminaison : -ar → <b>-é</b> (visité, hablé, llegué) — attention auaccent : visit<b>é</b> (indefinido) vs visit<b>aba</b> (imperfecto) : la paire minimal : visité = UNE visite datée ; visitaba = j'avais l'habitude de visiter : la même opposition que fui/iba : le marqueur décide (el año pasado → indefinido ; todos los años → imperfecto) : dans l'expression sur les vacances (« Mis vacaciones » — LE sujet d'examen), chaque phrase commence par choisir entre les deux : le test : photo ou film ?</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« Tenía diez años » signifie :", "c": ["Il a dix años", "Il avait dix años (description, âge au passé)", "Il aura dix años", "Il eut dix años (une fois)"], "a": 1, "e": "L'âge au passé = description (état) → imperfecto : tenía diez años.", "d": "<b>L'âge au passé : toujours imperfecto</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'âge est une DONNÉE DESCRIPTIVE du passé (un état, pas un événement) → imperfecto : <i>Tenía diez años cuando empezó el partido.</i> (il avait dix ans quand le match commença) : la même règle pour : l'heure au passé (<i>Eran las cinco</i>), la météo (<i>Hacía frío</i>), les états (<i>Estaba cansado</i>), les sentiments durables (<i>Quería mucho a su abuela</i>) : la logique : avoir dix ans n'est pas un « fait ponctuel » — c'est un état qui s'étale sur une année (film, pas photo) : en narration, les phrases d'âge ouvrent souvent le récit (installer le personnage) : « Tenía diez años y vivía en un pueblo pequeño... » — imperfecto d'entrée de jeu : le décor avant l'action, toujours.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« fui » peut signifier :", "c": ["seulement « j'allai »", "une erreur", "seulement « je fus »", "« je fus » OU « j'allai » (ser et ir ont les MÊMES formes à l'indefinido)"], "a": 3, "e": "À l'indefinido, ser et ir partagent les formes : fui, fuiste, fue, fuimos, fuisteis, fueron — le contexte décide !", "d": "<b>Fui : le verbe jumeau</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les deux verbes SER et IR se conjuguent IDENTIQUEMENT à l'indefinido : fui, fuiste, fue, fuimos, fuisteis, fueron : le contexte tranche : <i>Yo <b>fui</b> médico.</i> (je fus médecin — ser) / <i>Yo <b>fui</b> al médico.</i> (j'allai chez le médecin — ir) : les indices : un COD/Lieu avec a (fui AL cine → ir) ; une profession/identité (fui profesor → ser) : l'origine historique : les deux verbes latins (esse et vadere) ont convergé par hasard phonétique — l'espagnol a gardé la fusion : l'ambiguïté est réelle mais rarement gênante : à la lecture d'un texte, vérifier la suite de la phrase (a + lieu ? profession ?) : ce point de curiosité est une question d'examen prisée — elle teste la vraie connaissance des irréguliers.</div>"},
{"t": "Le futur et le conditionnel (Espagnol)", "q": "« Mañana ___ un examen de matemáticas » (tener, futur)", "c": ["tendría", "tengo", "tenaré", "tendré"], "a": 3, "e": "Futur de tener (racine irrégulière tendr-) : mañana TENDRÉ un examen.", "d": "<b>Tendré : la racine qui prépare l'avenir</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « mañana » (demain) → futur : tener est l'un des 12 irréguliers → racine <b>tendr-</b> + terminaison -é : <i>Mañana <b>tendré</b> un examen de matemáticas.</i> (demain j'aurai un contrôle de maths) : le piège « tenaré » : la régularisation impossible — l'infinitif tener NE PEUT PAS rester entier (le e de « ener » tombe : ten-dr-é) : le bonus : la même racine tendr- sert au conditionnel (<b>tendría</b>) — un apprentissage, deux temps : la liste des racines (tendr-, har-, dir-, podr-, sabr-, querr-, saldr-, vendr-, pondr-, habr-, cabr-) se récite comme une poésie : c'est LE chant du chapitre.</div>"},
{"t": "Le futur et le conditionnel (Espagnol)", "q": "« ¿Podría usted ayudarme ? » est :", "c": ["du conditionnel (politesse) : « pourriez-vous m'aider ? »", "du futur", "du présent", "de l'impératif"], "a": 0, "e": "Podría = conditionnel de poder : la formule de politesse (¿Podría...? / ¿Podrías...?).", "d": "<b>Podría : la politesse en -ría</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le conditionnel espagnol (comme le français « pourriez-vous ») adoucit la demande : <i>¿<b>Podría</b> usted ayudarme?</i> (pourriez-vous m'aider ?) vs <i>¿Puede ayudarme?</i> (pouvez-vous — direct) : la hiérarchie de politesse : puede (neutre) → podría (poli) → ¿Sería tan amable de...? (très poli) : la même logique pour : <i>Me gustaría...</i> (j'aimerais — le vœu standard), <i>Deberías...</i> (tu devrais — le conseil), <i>Yo que tú, hablaría con él</i> (à ta place, je lui parlerais) : dans les dialogues d'examen (demander un renseignement, proposer, conseiller), le conditionnel de politesse fait immédiatement « locuteur avancé » — un gain d'image considérable à l'oral.</div>"},
{"t": "Le futur et le conditionnel (Espagnol)", "q": "Le futur de « hablar » :", "c": ["hablaré, hablarás, hablará, hablaremos, hablaréis, hablarán", "hablé, hablaste, habló...", "hablo, hablas, habla...", "hablaría, hablarías..."], "a": 0, "e": "Futur régulier : infinitif + é, ás, á, emos, éis, án → hablaré, hablarás...", "d": "<b>L'infinitif qui reste entier</b>.<div class='ex-detail'><u>Exemple rédigé</u> : parler au futur : on garde l'infinitif COMPLET et on ajoute la terminaison : hablar + <b>é</b> → <b>hablaré</b> ; hablar + ás → hablarás ; hablar + á → hablará ; hablar + emos → hablaremos ; hablar + éis → hablaréis ; hablar + án → hablarán : la même mécanique pour tous les réguliers : comeré, viviré, estudiarán : les accents : é, ás, á (sauf emos/eis sans accent) : la faute type : « hablare » (sans accent — ce serait d'ailleurs le subjonctif futur littéraire !) : la simplicité du futur espagnol (UNE formule, trois groupes) en fait le temps le PLUS FACILE de la conjugaison — le maîtriser en dix minutes, c'est garantir l'expression de l'avenir.</div>"},
{"t": "Le futur et le conditionnel (Espagnol)", "q": "« Serán las diez » (futur de probabilité) signifie :", "c": ["il sera dix heures (demain)", "il a été dix heures", "il doit être environ dix heures (conjecture sur le présent)", "ils seront dix personnes"], "a": 2, "e": "Le futur exprime la PROBABILITÉ sur le présent : Serán las diez = « il doit être 10 heures » (je suppose).", "d": "<b>Le futur du « je suppose »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'espagnol emploie le futur pour une CONJECTURE sur le présent : <i>¿Qué hora es? — No sé, <b>serán</b> las diez.</i> (il doit être dix heures — je n'ai pas de montre, j'estime) : la même valeur : <i>Tendrá unos cuarenta años</i> (il doit avoir quarante ans environ) ; <i>Estarán cansados</i> (ils doivent être fatigués) ; <i>¿Quién llamará a estas horas?</i> (qui peut bien appeler à cette heure-ci ?) : la nuance avec le vrai futur : le contexte tranche (« mañana será difícil » = futur réel ; « será difícil, pero... » = supposition) : cette valeur de probabilité est très courante à l'oral et dans les dialogues de séries — la reconnaître évite les contresens à la compréhension : un point fin qui impressionne au bac.</div>"},
{"t": "Le futur et le conditionnel (Espagnol)", "q": "« Me gustaría viajar por Sudamérica » — « gustaría » est :", "c": ["de l'imparfait", "du futur de gustar", "du conditionnel de gustar (j'aimerais)", "du présent de gustar"], "a": 2, "e": "gustaría = conditionnel : la formule du souhait « j'aimerais » (littéralement « cela me plairait »).", "d": "<b>Me gustaría : le vœu par excellence</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la structure de gustar : le complément d'abord (me/te/le...) + gustar + sujet : au conditionnel : <i><b>Me gustaría</b> viajar por Sudamérica.</i> (j'aimerais voyager en Amérique du Sud — littéralement « voyager me plairait ») : la différence clé : <i>Me gusta viajar</i> = j'aime voyager (goût général, présent) ; <i>Me gustaría viajar</i> = j'aimerais voyager (vœu, possibilité non réalisée) : les usages d'expression : les projets (<i>Me gustaría ser médico</i>), les envies (<i>Me gustaría visitar México</i>) : dans tout oral (« ¿Qué te gustaría hacer en el futuro? »), la réponse commence par me gustaría — c'est LA structure du chapitre à automatiser, avec son verbe d'exception : gustaría (racine régulière gust- + ía).</div>"},
{"t": "Le futur et le conditionnel (Espagnol)", "q": "Le conditionnel de « hacer » :", "c": ["hacaría", "hacería", "haría", "hice"], "a": 2, "e": "hacer → racine irrégulière har- : conditionnel haría (comme futur haré).", "d": "<b>Haría : la racine courte du faire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : à l'indefinido : hice ; au futur/conditionnel : racine <b>har-</b> : <i><b>Haría</b> los deberes si tuviera tiempo.</i> (je ferais mes devoirs si j'avais le temps) : la comparaison des pièges : « hacería » (l'infinitif complet + ía — impossible : hacer perd son e/c) ; « haría » ✓ : la paire : har<b>é</b> (futur) / har<b>ía</b> (conditionnel) — même racine, deux terminaisons : la même logique pour todos les irréguliers : diré/diría, saldré/saldría, tendría... : en expression, « yo que tú, haría... » (à ta place je ferais...) est la formule du conseil : la question d'examen teste si l'élève connaît la racine courte — le QCM haría/hacería est LE duo révélateur du chapitre.</div>"},
{"t": "Le futur et le conditionnel (Espagnol)", "q": "« Si tuviera dinero, ___ una casa » (hypothèse, conditionnel)", "c": ["compraría", "compraré", "compré", "compro"], "a": 0, "e": "Hypothèse (si + imparfait du subjonctif) → conditionnel dans la principale : compraría.", "d": "<b>Le si hypothétique espagnol</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le système hypothétique (comme le français) : SI + imparfait du subjonctif (tuviera — « imparfait du subjonctif », forme en -ra) + CONDITIONNEL (compraría) : <i>Si <b>tuviera</b> dinero, <b>compraría</b> una casa.</i> (si j'avais de l'argent, j'achèterais une maison) : le piège classique : mettre le conditionnel dans la SI-clause (« si tendría » ✗) — la règle : si + subjonctif, conditionnel au résultat : la même structure en français (si j'avais... j'achèterais) — l'espagnol utilise le subjonctif où le français met l'imparfait : en expression, ces phrases de rêve (<i>Si pudiera, viajaría...</i>) sont un registre riche et apprécié : la structure à deux temps s'apprend en bloc — et rapporte des points de syntaxe chaque fois.</div>"},
{"t": "Le futur et le conditionnel (Espagnol)", "q": "Laquelle est une forme de FUTUR ?", "c": ["hablaba a", "hablaría", "hablará", "hablaba"], "a": 2, "e": "hablará = il/elle parlera (futur, accent sur á) ; hablaría = conditionnel ; hablaba = imperfecto.", "d": "<b>Trois accents, trois temps</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le trio minimal du verbe hablar : hablar<b>á</b> (futur — il parlera), hablar<b>ía</b> (conditionnel — il parlerait), habl<b>aba</b> (imperfecto — il parlait) : la discrimination visuelle : á seul = futur ; i-á = conditionnel ; -aba = imparfait : la faute de lecture type : confondre á/ía dans un texte (une lettre change le temps !) : la stratégie QCM : repérer la TERMINAISON d'abord (-á ? -ía ? -aba ?), puis vérifier la personne : cette lecture rapide des terminaisons est l'outil le plus rentable de la compréhension écrite — trois accents, et le sens temporel d'un paragraphe entier devient limpide.</div>"},
{"t": "Le futur et le conditionnel (Espagnol)", "q": "Le conditionnel de « haber » (« habría ») sert à :", "c": ["former l'impératif", "former le conditionnel passé (habría comido = il aurait mangé)", "exprimer le futur", "exprimer la politesse"], "a": 1, "e": "haber au conditionnel + participe passé = conditionnel passé : habría comido (il aurait mangé).", "d": "<b>Habría : le conditionnel composé</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i><b>Habría</b> lleg<b>ado</b> antes si hubiera cogido el tren.</i> (il serait arrivé plus tôt s'il avait pris le train) : la mécanique : habría (conditionnel de haber) + participe (llegado) = le CONDITIONNEL PASSÉ (l'équivalent de « il aurait mangé ») : la distinction des jumeaux : <b>haría</b> (hacer — il ferait) vs <b>habría</b> (haber — il y aurait/auxiliaire) : une lettre (b), deux mondes : l'emploi : le regret et le passé alternatif (<i>Habría estudiado más...</i> — j'aurais dû étudier davantage) : ce conditionnel composé est du niveau lycée avancé — mais il apparaît dans les textes et valorise l'écrit : reconnaître habría + participe à la lecture est le seuil de la compréhension littéraire.</div>"},
{"t": "Le futur et le conditionnel (Espagnol)", "q": "« Nosotros ___ una fiesta el sábado » (organiser, futur)", "c": ["organizábamos", "organizamos", "organizaremos", "organizaríamos"], "a": 2, "e": "Futur, nosotros : infinitif + emos → organizaremos (nous organiserons).", "d": "<b>-emos : l'avenir à plusieurs</b>.<div class='ex-detail'><u>Exemple rédigé</u> : futur de organizar : infinitif + terminaison : <i>Nosotros organiz<b>aremos</b> una fiesta el sábado.</i> (nous organiserons une fête samedi) : les terminaisons du futur à nous/vous : <b>-emos</b>, <b>-éis</b> — SANS accent écrit (les seules !) : la comparaison : hablar<b>é</b> (accent) mais hablar<b>emos</b> (rien) — l'orthographe officielle est fixe : la logique de l'ensemble : une seule liste (é, ás, á, emos, éis, án) pour TOUS les verbes réguliers, plus 12 racines irrégulières : le chapitre entier tient sur une carte : le QCM « organizaremos » teste à la fois le temps (futur — contexte samedi), la personne (nosotros → -emos) et l'orthographe (pas d'accent) : trois points en une réponse.</div>"},
{"t": "Genre et nombre : l'accord des adjectifs (Espagnol)", "q": "« Mis amigas son muy ___ » (simpático)", "c": ["simpáticas", "simpáticos", "simpático", "simpatica"], "a": 0, "e": "amigas = féminin pluriel → simpáticas (-o → -a, +s).", "d": "<b>La double accord : genre ET nombre</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « amigas » = féminin (→ -a) ET pluriel (→ -s) : <i>Mis amigas son muy <b>simpáticas</b>.</i> (mes amies sont très sympathiques) : la chaîne complète : simpático (m.sg) → simpática (f.sg) → simpáticos (m.pl) → simpáticas (f.pl) : la faute « simpaticas » (sans accent) : le c du feminin garde son accent (GA/CO/GU règle : sílabe tonique sur le a → c dure) : le réflexe d'examen : regarder le NOM d'abord (genre ? nombre ?) puis accorder l'adjectif DEUX fois (une fois par critère) : cette question est la faute la plus répandue des copies — et la plus simple à corriger : une relecture ciblée de chaque adjectif.</div>"},
{"t": "Genre et nombre : l'accord des adjectifs (Espagnol)", "q": "« Una estudiante ___ » (francés)", "c": ["francés", "franceso", "francesas", "francesa"], "a": 3, "e": "Adjectif en consonne : féminin en +a → francesa (la finale -és → -esa).", "d": "<b>Les adjectifs en consonne : +a au féminin</b>.<div class='ex-detail'><u>Exemple rédigé</u> : francés finit par une consonne (pas de -o) : le féminin se forme en ajoutant... avec ajustement : franc<b>és</b> → franc<b>esa</b> (le accent saute !) : <i>Una estudiante <b>francesa</b>.</i> (une étudiante française) : la famille des nationalités : español → española, alemán → alemana, inglés → inglesa, japonés → japonesa : la logique : les adjectifs de nationalité prennent -a au féminin, mais leur accentuation se RECALCULE (francés → francesa : l'accent écrit disparaît) : en expression (présenter des personnes), l'accord des nationalités revient à chaque phrase : la règle « consonne + a » règle la majorité des cas — avec sa subtilité d'accent.</div>"},
{"t": "Genre et nombre : l'accord des adjectifs (Espagnol)", "q": "L'adjectif INvariable en genre :", "c": ["alto", "verde", "hablador", "español"], "a": 1, "e": "verde (couleur) ne change pas au féminin : un coche verde, una casa verde.", "d": "<b>Verde, l'invariable des couleurs</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>un coche <b>verde</b> / una casa <b>verde</b></i> (une voiture verte / une maison verte) — même forme ! : les invariables : les couleurs terminées en -e ou consonne : verde, azul, gris, marrón, rosa, naranja : les adjectifs en -e : inteligente, paciente, grande, fuerte, triste : les -ista : optimista, pesimista, realista : la règle générale : PAS de -o final → pas de marque de genre (l'adjectif a UNE forme pour m/f) : le contraste : alto/alta (variable) vs verde/verde (invariable) : le pluriel reste actif : casas verdes, estudiantes inteligentes, chicos optimistas : le genre ne bouge pas, le nombre si : la question teste ce premier réflexe.</div>"},
{"t": "Genre et nombre : l'accord des adjectifs (Espagnol)", "q": "Le pluriel de « feliz » :", "c": ["felices", "felizs", "felizes", "feliz"], "a": 0, "e": "-z → -ces au pluriel : feliz → felices (comme luz → luces).", "d": "<b>Le z qui devient ces</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la règle : un mot finissant en -z fait son pluriel en -ces : feliz → <b>felices</b> (heureux) ; luz → luces (lumières) ; andaluz → andaluces ; lápiz → lápices : la raison phonétique : le z (prononcé « s » ou « th ») suivi de -s serait inarticulable — l'espagnol insère un -e- de soutien et le z devient c (écriture étymologique) : la faute « felizes » (calque portugais !) ou « felizs » : la paire clé du chapitre : <i>Los niños son <b>felices</b>.</i> (les enfants sont heureux) : cette règle z→ces est courte, universelle et testée partout — de la dictée au QCM : un point gratuit à ne pas laisser.</div>"},
{"t": "Genre et nombre : l'accord des adjectifs (Espagnol)", "q": "« El ___ es difícil » — le mot manquant (problema) :", "c": ["problemas (avec las)", "problema (avec el)", "problemá (avec el)", "problema (avec la)"], "a": 1, "e": "problema est MASGULIN (comme tema, planeta, idioma) : el problema es difícil.", "d": "<b>El problema : le grec au féminin... non, masculin !</b>.<div class='ex-detail'><u>Exemple rédigé</u> : malgré sa terminaison en -a, problema est MASCULIN : <i><b>El</b> problema es difícil.</i> (le problème est difficile) : la famille des mots grecs en -ma : el tema, el planeta, el idioma, el sistema, el programa, el poema, el clima, el mapa (celui-là pas grec mais pareil !) : l'origine : le grec neutre -ma est devenu masculin en espagnol — la terminaison -a n'EST PAS une garantie de féminin : la conséquence d'accord : <i>un problema grave, los problemas graves</i> (adjectif masculin) : la liste des -ma masculins (une dizaine) se mémorise une fois : c'est LE piège-étoile des QCM — « la problema » est la faute bateau que tout professeur guette.</div>"},
{"t": "Genre et nombre : l'accord des adjectifs (Espagnol)", "q": "Le pluriel de « azul » (bleu) :", "c": ["azul", "azules", "azuls", "azulies"], "a": 1, "e": "Consonne finale → +es : azul → azules (les yeux bleus : los ojos azules).", "d": "<b>Consonne finale : +es</b>.<div class='ex-detail'><u>Exemple rédigé</u> : azul finit par consonne (l) → pluriel en +es : <i>Tiene los ojos <b>azules</b>.</i> (il a les yeux bleus) : la règle générale du pluriel : voyelle finale → +s (libros, casas, grandes) ; consonne finale → +es (ciudades, españoles, mujeres, azules, marrones) : la nuance : les mots finissant en -s accentué (autobús → autobuses) et les jours de la semaine (lunes, martes... déjà finaux en -s : invariables !) : en description, les couleurs reviennent sans cesse (yeux, cheveux, vêtements) : ojos azules, pelo castaño, camisa roja : la mécanique +es s'automatise en une semaine d'exercices — et corrige la moitié des fautes d'accord.</div>"},
{"t": "Genre et nombre : l'accord des adjectifs (Espagnol)", "q": "« La mano » signifie « la main » — son genre est :", "c": ["neutre", "masculin (el mano)", "les deux selon le contexte", "féminin (la mano)"], "a": 3, "e": "mano est FÉMININ malgré sa terminaison en -o : la mano, las manos.", "d": "<b>La mano : l'exception qui déchire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i><b>La</b> mano</i> (la main) — féminin, contrairement à la règle du -o : la famille courte des exceptions -o féminines : la mano, la foto (photographie), la moto (motocyclette), la radio — en fait des MOTS RACCOURCIS dont le mot complet est féminin (la fotografía, la motocicleta, la radiodifusión) : l'accord en cascade : <i>la mano derecha, las manos limpias</i> (adjectifs féminins !) : le contraste avec el problema (le -a masculin) : l'espagnol aime ces chausse-trappes croisées : la méthode d'or : apprendre TOUJOURS le nom avec son article (la mano, el problema) — l'article EST la mémoire du genre : cette question croise les deux pièges stars du chapitre : à la fois -o féminin et -a masculin.</div>"},
{"t": "Genre et nombre : l'accord des adjectifs (Espagnol)", "q": "« Unos estudiantes ___ » (inteligente)", "c": ["inteligenta", "inteligente", "inteligentas", "inteligentes"], "a": 3, "e": "inteligente invariable en genre, mais pluriel en +s : unos estudiantes inteligentes.", "d": "<b>Invariable en genre, PAS en nombre</b>.<div class='ex-detail'><u>Exemple rédigé</u> : inteligente finit en -e → une seule forme pour m/f : MAIS le pluriel s'applique : <i>Unos estudiantes <b>inteligentes</b>.</i> (des étudiants intelligents) : la grille complète : inteligente (sg, m ET f) → inteligentes (pl, m ET f) : la faute « inteligentas » : appliquer un féminin inexistant (le -e n'est pas un -o !) : la règle à double détente : (1) l'adjectif a-t-il un -o final ? → genre variable : (2) sinon → genre invariable, mais nombre toujours accordé : les invariables types : inteligente, paciente, grande, fuerte, joven, feliz, optimista, realista, azul, verde : leur point commun : pas de -o : en expression, ces adjectifs « pratiques » (une forme, deux genres) sont fréquents — l'erreur serait d'en faire trop : une seule forme suffit !</div>"},
{"t": "Genre et nombre : l'accord des adjectifs (Espagnol)", "q": "« Los coches ___ » (gris)", "c": ["gris", "grisas", "grises", "grisos"], "a": 2, "e": "gris : invariable en genre, pluriel en +es (consonne finale) : los coches grises.", "d": "<b>Gris : l'invariable qui prend quand même un pluriel</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Los coches <b>grises</b>.</i> (les voitures grises) : double règle enchaînée : (1) gris finit en consonne → pas de féminin (una casa gris ✓) : (2) consonne finale → pluriel en +es (gris → grises) : le test complet d'un adjectif : genre (variable si -o, sinon non) PUIS nombre (+s si voyelle, +es si consonne) : la comparaison des trois couleurs : rojo/roja/rojos/rojas (variable), verde/verdes (invariable +s), gris/grises (invariable +es) : la mécanique se vérifie en deux questions dans l'ordre : la description d'objets (voitures, vêtements, yeux) utilise ces couleurs sans arrêt — le duo gris/grises est la synthèse parfaite du chapitre.</div>"},
{"t": "Genre et nombre : l'accord des adjectifs (Espagnol)", "q": "Quelle expression est correcte ?", "c": ["Los casas blanca", "Las casas blancas", "Las casas blanco", "Los casas blancas"], "a": 1, "e": "Accord en chaîne : las casas blancas (article, nom et adjectif féminins pluriels).", "d": "<b>L'accord en chaîne : article + nom + adjectif</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i><b>Las</b> casas <b>blancas</b></i> (les maisons blanches) : chaque maillon s'accorde : las (f.pl) + casas (f.pl) + blancas (f.pl) : les distracteurs cassent UN maillon : « los casas » (article masculin avec nom féminin), « blanca » (singulier avec pluriel), « blanco » (masculin avec féminin) : la méthode de relecture : partir du NOM (casas : f.pl) et vérifier l'article PUIS chaque adjectif : en espagnol, l'accord est un SYSTÈME fermé : une fois le genre/nombre du nom établis, TOUT le reste suit mécaniquement : cette question « les maisons blanches » est le format standard de l'examen — la relecture systématique en 3 étapes élimine la faute d'accord, la plus fréquente (et la plus coûteuse) de toute copie d'espagnol.</div>"},
{"t": "Les pronoms compléments : lo, la, le, se (Espagnol)", "q": "« Compro el pan » → avec pronom :", "c": ["El compro", "Compro lo", "Le compro", "Lo compro"], "a": 3, "e": "el pan = COD masculin singulier → lo, placé AVANT le verbe : Lo compro.", "d": "<b>Lo : le pronom-avant</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Compro el pan.</i> → le COD « el pan » devient <b>lo</b> (masculin singulier), placé DEVANT le verbe conjugué : <i><b>Lo</b> compro.</i> (je l'achète) : les distracteurs : « compro lo » (l'ordre inverse n'existe pas avec un verbe conjugué), « le compro » (le = à quelqu'un — le pain n'est pas une personne !) : la mécanique : (1) repérer le COD (qué : el pan → masculin → lo) ; (2) genre/nombre (lo/la/los/las) ; (3) placement (avant le verbe) : cette phrase minimaliste est la matrice de toutes les phrases à un pronom — la maîtriser, c'est sécuriser un pan entier de grammaire.</div>"},
{"t": "Les pronoms compléments : lo, la, le, se (Espagnol)", "q": "« Escribo a mi abuela » → avec pronom :", "c": ["Se escribo", "Le escribo", "La escribo", "Lo escribo"], "a": 1, "e": "« a mi abuela » = COI (à qui ?) → le : Le escribo (je lui écris).", "d": "<b>Le : le pronom des personnes-COI</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test : « j'écris À ma grand-mère » — le « à » signale le COI (complément de la personne) : pronom <b>le</b> (invariable, jamais « la » ici) : <i><b>Le</b> escribo.</i> (je lui écris) : la nuance type : <i>La veo</i> (je la vois — qui ? → COD : la) vs <i>Le escribo</i> (je lui écris — à qui ? → COI : le) : l'astuce française : « le » espagnol = « lui » français ; « la/lo » espagnol = « le/la » français : la distinction voir (COD) vs écrire à (COI) est LE point de discrimination du chapitre — chaque QCM en fait son plat de résistance.</div>"},
{"t": "Les pronoms compléments : lo, la, le, se (Espagnol)", "q": "« Doy el libro a Juan » → avec pronoms :", "c": ["Lo le doy", "Se le doy", "Le lo doy", "Se lo doy"], "a": 3, "e": "COI (a Juan → le) + COD (el libro → lo) : le+lo impossible → SE LO DOY.", "d": "<b>Se lo : la rencontre interdite qui se résout</b>.<div class='ex-detail'><u>Exemple rédigé</u> : deux compléments : à Juan (COI → le) + le livre (COD → lo) : l'espagnol interdit la séquence « le lo » (cacophonie) → le COI devient <b>se</b> : <i><b>Se lo doy</b>.</i> (je le lui donne) : la règle : se remplace TOUJOURS le/les devant lo/la/los/las : <i>Se la doy</i> (je la lui donne), <i>Se los doy</i> (je les leur donne), <i>Se las compro</i> (je les leur achète) : le sens de se : le contexte restaure l'information (à Juan ? à elle ? — le contexte l'a déjà donné) : cette règle « le+lo → se lo » est LA question signature du chapitre : elle teste la combinaison ET la connivence grammaticale.</div>"},
{"t": "Les pronoms compléments : lo, la, le, se (Espagnol)", "q": "« Quiero ver la película » → avec pronom :", "c": ["Quiero ver le", "Quiero verla", "La quiero ver", "Quiero la ver"], "a": 1, "e": "Infinitif → pronom COLLÉ à la fin : Quiero ver<b>la</b>.", "d": "<b>Collé à l'infinitif : la règle du aimant</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « quiero » est conjugué, mais « ver » est infinitif : le pronom se colle à la FIN de l'infinitif : <i>Quiero ver<b>la</b>.</i> (je veux la voir) : la même règle pour : le futur proche (<i>Voy a llamar<b>lo</b></i>), le gérondif (<i>Estoy leyendo<b>lo</b></i> — avec l'accent de soutien : leyén-do-lo), l'impératif affirmatif (<i>Pás<b>ame</b> el sal</i>) : le contraste : <i>La quiero ver</i> est AUSSI correct (pronom devant le premier verbe) — mais « quiero la ver » est impossible (entre les deux verbes !) : la règle d'ensemble : UN verbe conjugué → devant ; un infinitif/gérondif/impératif disponible → collé : les deux placements légaux, un seul interdit.</div>"},
{"t": "Les pronoms compléments : lo, la, le, se (Espagnol)", "q": "« ¿Cómo ___ ? — Me llamo Ana » (s'appeler)", "c": ["se llama", "llama", "llamo se", "llamas"], "a": 0, "e": "La formule : ¿Cómo se llama (usted)? / ¿Cómo te llamas (tú)? — se/te = pronom réfléchi de llamarse.", "d": "<b>Llamarse : le verbe de l'identité réfléchie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : llamarse = « s'appeler » (réfléchi) : <i>¿Cómo <b>se llama</b>?</i> (comment s'appelle-t-il/vous ?) / <i>¿Cómo <b>te llamas</b>?</i> (comment t'appelles-tu ?) : les réponses : <i>Me llamo Ana. — Mucho gusto.</i> (je m'appelle Ana — enchanté) : la conjugaison réfléchie : me llamo, te llamas, se llama, nos llamamos, os llamáis, se llaman : la logique : littéralement « je m'appelle Ana » — l'espagnol garde le réfléchi là où le français dit « je m'appelle » (pareil !) : l'oubli du pronom (« llamo Ana ») change le sens (j'appelle Ana — au téléphone !) : cette formule de présentation est LA première phrase de tout dialogue d'examen — la conjuguer impeccablement ouvre l'échange.</div>"},
{"t": "Les pronoms compléments : lo, la, le, se (Espagnol)", "q": "« Me ___ los deportes » (gustar)", "c": ["gusto", "gusta", "gustan", "gusta a"], "a": 2, "e": "Le verbe gustar s'accorde avec CE QUI PLAÎT (los deportes = pluriel) → gustan.", "d": "<b>Gustar : l'invité qui s'accorde avec le plat</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la structure inversée de gustar : le « sujet » grammatical = la chose aimée : <i>Me gust<b>an</b> los deportes.</i> (les sports me plaisent — d'où le pluriel gustan) : la règle : gusta + singulier (me gusta el fútbol) ; gustan + pluriel (me gustan las películas) : la même logique pour les verbes de la famille : encantar (me encanta esta ciudad), apetecer (me apetecen unas tapas), doler (me duele la cabeza) : la faute « me gusta los deportes » est ultra-courante — elle vient du français (« ça me plaît, les sports ») : la clé : demander « QUI plaît ? » et accorder le verbe avec CE mot : gustar se conjugue, le pronom (me/te/le...) reste figé : un verbe, une inversion, un accord — le trio du chapitre.</div>"},
{"t": "Les pronoms compléments : lo, la, le, se (Espagnol)", "q": "« No ___ digas nada » (impératif négatif, a moi)", "c": ["-me", "se", "te", "me"], "a": 3, "e": "Impératif NÉGATIF → pronom AVANT le verbe : No me digas nada (ne me dis rien).", "d": "<b>L'impératif négatif inverse la place</b>.<div class='ex-detail'><u>Exemple rédigé</u> : affirmatif : <i>D<b>ime</b> la verdad</i> (dis-moi la vérité — pronom collé) : négatif : <i><b>No me</b> digas nada</i> (ne me dis rien — pronom devant !) : la règle : le « no » de la négation s'ajoute devant, et le pronom se détache : <i>No te preocupes</i> (ne t'inquiète pas), <i>No se lo digas</i> (ne le lui dis pas) : le contraste est frappant : dime → no me digas (le même verbe dire, deux placements) : cette bascule est LE piège technique de l'impératif : en expression, les conseils négatifs (No te preocupes, No se lo digas a nadie) sont très fréquents dans les dialogues : la relecture : impératif négatif → pronom détaché devant : une règle, un réflexe.</div>"},
{"t": "Les pronoms compléments : lo, la, le, se (Espagnol)", "q": "« Estoy lavando ___ » (les mains, me lave les mains)", "c": ["me manos las", "las me manos", "las manos me", "me las manos"], "a": 3, "e": "Réfléchi (me) + COD (las) : avec le gérondif, les pronoms se collent : Me estoy lavando las manos.", "d": "<b>La combinaison : réfléchi + COD</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « je me lave les mains » : réfléchi (me) + COD (las manos → las) : avec le gérondif, les pronoms se collent : <i>Estoy lavándo<b>me las</b>... non : <i>Me estoy lavando las manos</i> ou <i>Estoy lavándome las manos</i>.</i> (je suis en train de me laver les mains) : l'ordre des pronoms combinés : réfléchi/COI d'abord, COD ensuite (me las, se lo, te la) : la structure lavarse las manos : le réfléchi marque que l'action revient au sujet, le COD précise l'objet (las manos) : en dialogues du quotidien (se laver, se brosser les dientes, se peinar), ces combinaisons reviennent en boucle : l'ordre invariable (me/te/se/nos + lo/la/los/las) est la dernière règle à automatiser — et la plus rentable à l'oral.</div>"},
{"t": "Les pronoms compléments : lo, la, le, se (Espagnol)", "q": "« Veo a María » → avec pronom :", "c": ["La veo", "Se veo", "Lo veo", "Le veo"], "a": 0, "e": "Personne féminine en COD (voir QUI ? María) → la : La veo.", "d": "<b>La : le féminin des personnes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « voir Marie » — Marie est le COD (on voit QUI ?) : pronom accordé en genre ET nombre → <b>la</b> : <i><b>La</b> veo.</i> (je la vois) : les pièges : « lo » (masculin — pour un objet ou un homme), « le » (COI — pour « à » : le escribo) : la règle espagnole : les personnes en COD prennent la/los/las (comme les objets) — PAS de « le » : <i>La veo a María</i> (on peut même garder « a María » pour l'insister : la redundancia afectiva) : le trio de discrimination : voir (COD : la/lo) vs écrire à (COI : le) vs combiner (se lo) : la même question dans mille contextes — amis, famille, célébrités : la réponse est toujours dans le VERBE (il demande quoi ? à qui ?).</div>"},
{"t": "Les pronoms compléments : lo, la, le, se (Espagnol)", "q": "Le pronom correct dans « Mi madre compra un regalo para mí : mi madre ___ compra » :", "c": ["lo", "me", "le", "se"], "a": 1, "e": "« compra (para mí) » : le bénéficiaire « para mí » → me (COI à la 1re personne) : me compra (un regalo).", "d": "<b>Me : le bénéficiaire de l'action</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cadeau est le COD (un regalo → lo) ; le bénéficiaire est moi (para mí → <b>me</b>) : <i>Mi madre <b>me</b> compra un regalo.</i> (ma mère m'achète un cadeau) : le pronom COI varie selon la personne : me (à moi), te (à toi), le (à lui/elle), nos (à nous), os (à vous), les (à eux) : la combinaison complète si le COD est pronominé : <i>Mi madre me lo compra</i> (ma mère me l'achète — me + lo, ordre régulier, pas besoin de se car me n'est pas le/les !) : la règle du se ne concerne QUE le/les : avec me/te/nos/os, l'ordre simple s'applique : la phrase « me lo compra » résume tout le chapitre : COI (me) + COD (lo) + verbe : la synthèse parfaite d'une question d'examen.</div>"},
{"t": "L'impératif et une introduction au subjonctif (Espagnol)", "q": "« ¡ ___ la verdad ! » (decir, impératif affirmatif tú)", "c": ["Dices", "Di", "Digas", "Decir"], "a": 1, "e": "decir est l'un des 7 irréguliers de l'impératif : ¡Di la verdad ! (dis la vérité).", "d": "<b>Di : l'irrégulier amaigri</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'impératif affirmatif de decir : ¡<b>Di</b> la verdad!</i> (dis la vérité !) : la règle générale serait « dice » sans le s... mais decir fait partie des irréguliers exclusifs : <b>di</b> (dire), ten (avoir), ven (venir), sal (sortir), haz (faire), pon (mettre), ve (aller), sé (être) : la logique de ces formes : elles dérivent de l'infinitif TRONQUÉ (decir → di-, tener → ten-) : les distracteurs : dices (présent — pas un ordre), digas (subjonctif — pour la négation : ¡No digas mentiras !) : l'impératif espagnol est un monde à part : 8 irréguliers à réciter, et les ordres positifs deviennent naturels — « ¡Ven aquí! ¡Hazlo! ¡Dímelo! » : la langue de tous les jours.</div>"},
{"t": "L'impératif et une introduction au subjonctif (Espagnol)", "q": "« ¡No ___ mentiras ! » (decir, impératif négatif)", "c": ["di", "dices no", "digas", "dices"], "a": 2, "e": "Impératif NÉGATIF = subjonctif : ¡No digas mentiras ! (ne dis pas de mensonges).", "d": "<b>Le négatif change la terminaison</b>.<div class='ex-detail'><u>Exemple rédigé</u> : affirmatif : ¡<b>Di</b> la verdad! (dis !) : négatif : ¡<b>No digas</b> mentiras! (ne dis pas !) : la règle : l'impératif négatif se forme au SUBJONCTIF PRÉSENT (2e personne : digas) : parler → ¡Habla! / ¡No hables! ; comer → ¡Come! / ¡No comas! ; venir → ¡Ven! / ¡No vengas! : le contraste affirmatif/négatif est LE piège du chapitre : les élèves appliquent la même forme (¡No di! ✗) — or le « no » déclenche la bascule : la logique : le subjonctif est le mode du NON-fait, du souhait — la défense (ne pas faire) relève de ce mode : mémorier les paires (di/digas, ve/vas — ¡No vayas!, sal/salgas) règle tous les ordres négatifs.</div>"},
{"t": "L'impératif et une introduction au subjonctif (Espagnol)", "q": "« Quiero que ___ conmigo » (venir, subjonctif)", "c": ["vienes a", "vengas", "vendrás", "vienes"], "a": 1, "e": "querer que + subjonctif : quiero que VENGAS conmigo (je veux que tu viennes avec moi).", "d": "<b>Quiero que + subjonctif : la règle absolue</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « querer que » (vouloir que) déclenche TOUJOURS le subjonctif dans la subordonnée : <i>Quiero que <b>vengas</b> conmigo.</i> (je veux que tu viennes avec moi) : venir → racine veng- au subjonctif (vengas, venga, vengamos...) : la logique du subjonctif : la venue est SOUHAITÉE, pas réelle — le mode du possible/désiré : la même famille de déclencheurs : esperar que (j'espère que), necesitar que, preferir que, pedir que : le contraste SANS « que » : <i>Quiero venir contigo</i> (je veux venir — même sujet, infinitif, pas de subjonctif !) : la règle pratique : deux SUJETS différents + « que » → subjonctif ; même sujet → infinitif : cette phrase (querer que + vengas) est LA structure-échantillon du subjonctif — sa mécanique éclaire tout le chapitre.</div>"},
{"t": "L'impératif et une introduction au subjonctif (Espagnol)", "q": "« Espero que ___ bien » (pasarlo, tu t'amuses bien)", "c": ["pasas bien", "pases", "pasas", "pasarás"], "a": 1, "e": "esperar que + subjonctif : Espero que lo PASES bien (j'espère que tu passes un bon moment).", "d": "<b>Espero que : le vœu et son mode</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « esperar que » (espérer que) impose le subjonctif : <i>Espero que lo <b>pases</b> bien.</i> (j'espère que tu passes un bon moment — passé intensif avec « lo » : pasarlo bien = passer un bon moment) : la formule de politesse sociale par excellence : <i>Espero que te mejores</i> (je te souhaite un bon rétablissement), <i>Espero que todo vaya bien</i> (j'espère que tout va bien) : le piège : « espero que pasas » (l'indicatif — la faute type, par calque du français « j'espère que tu passes ») : la logique : ce qui est espéré n'est pas encore RÉEL — le mode marque cette irréalité : les formules de fin de lettre/email (Espero que estés bien. Espero verte pronto.) utilisent le subjonctif : un point d'expression raffiné, très valorisé.</div>"},
{"t": "L'impératif et une introduction au subjonctif (Espagnol)", "q": "« No creo que ___ verdad » (ser)", "c": ["es", "es una", "será", "sea"], "a": 3, "e": "La négation de croire déclenche le subjonctif : No creo que SEA verdad (je ne crois pas que ce soit vrai).", "d": "<b>Creo que ES / No creo que SEA : la bascule du doute</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la paire complète : <i>Creo que <b>es</b> verdad.</i> (je crois que c'est vrai — affirmation → INDICATIF) : <i>No creo que <b>sea</b> verdad.</i> (je ne crois pas que ce soit vrai — doute → SUBJONCTIF) : la règle : la négation/le doute de croire (no creer que, dudar que) ouvre le subjonctif ; l'affirmation de croire (creer que, pensar que) garde l'indicatif : la subtilité : l'espagnol marque grammaticalement la CERTITUDE vs le DOUTE — la langue encode l'attitude du locuteur : ser au subjonctif : sea, seas, sea, seamos, seáis, sean : cette paire croire/croire-négatif est l'exemple le plus cité de tous les manuels : la maîtriser, c'est comprendre l'ÂME du subjonctif.</div>"},
{"t": "L'impératif et une introduction au subjonctif (Espagnol)", "q": "Le subjonctif présent de « volver » (je + que tu reviennes) :", "c": ["vuelvas", "volverás", "volvues", "vuelves"], "a": 0, "e": "Diphtongue conservée au subjonctif : vuelva, VUELVAS, vuelva... (como puedo → puedas).", "d": "<b>Vuelvas : la diphtongue au subjonctif</b>.<div class='ex-detail'><u>Exemple rédigé</u> : volver diphtongue au présent (vuelvo) : le subjonctif CONSERVE la diphtongue aux mêmes personnes : vuelva, vuelv<b>as</b>, vuelva, volvamos, volváis, vuelvan — la « botte » fonctionne aussi au subjonctif ! : <i>Espero que <b>vuelvas</b> pronto.</i> (j'espère que tu reviens vite) : la même famille : pensar → pienses, poder → puedas, querer → quieras, dormir → duermas, empezar → empieces : la règle de formation du subjonctif (1re personne du présent → changer la voyelle) PRESERVE les bizarreries de la racine : les diphtongues voyagent du présent au subjonctif : cette question teste la mécanique complète : déclencheur (espero que) + formation (racine diphtonguée + terminaison) : deux savoirs en une réponse.</div>"},
{"t": "L'impératif et une introduction au subjonctif (Espagnol)", "q": "« Cuando ___ a Madrid, te llamaré » (llegar, futur)", "c": ["llegues", "llegas", "llegarás", "llegabas"], "a": 0, "e": "Cuando + futur → SUBJONCTIF : Cuando LLEGUES a Madrid, te llamaré (quand tu arriveras à Madrid, je t'appellerai).", "d": "<b>Cuando futur : l'exception technique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la règle surprenante : « cuando » + événement FUTUR → subjonctif (pas le futur !) : <i>Cuando <b>llegues</b> a Madrid, te llamaré.</i> (quand tu arriveras à Madrid, je t'appellerai — llegues au subjonctif, te llamaré au futur) : la logique : l'événement n'est pas encore réel — le subjonctif marque cette virtualité : la même règle pour : cuando tengas tiempo (quand tu auras le temps), en cuanto venga (dès qu'il viendra), hasta que vuelvas (jusqu'à ce que tu reviennes) : la comparaison : cuando + présent/habitude → indicatif (<i>Cuando llego a casa, como</i> — quand j'arrive [toujours], je mange) : la discrimination : l'événement est-il FUTUR (→ subjonctif) ou habituel (→ indicatif) ? : ce point est du niveau avancé — il distingue les excellentes copies.</div>"},
{"t": "L'impératif et une introduction au subjonctif (Espagnol)", "q": "« ¡Ven aquí ! » est l'impératif de :", "c": ["ver", "vivir", "venir", "visitar"], "a": 2, "e": "venir → ¡Ven ! (viens !) — l'un des 8 irréguliers de l'impératif.", "d": "<b>Ven : le court et son jumeau</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>¡<b>Ven</b> aquí!</i> (viens ici !) — impératif de VENIR : les homonymes dangereux : <i>¡Ve!</i> (impératif de IR — va !) vs <i>¡Ven!</i> (viens !) : une lettre, deux verbes ! : l'orthographe distingue aussi : <i>¡Sé!</i> (sois ! — ser, avec accent) vs <i>se</i> (pronom) : la liste complète des impératifs irréguliers courts : ven (venir), ten (tener), pon (poner), sal (salir), haz (hacer), di (decir), ve (ir), sé (ser) — la « fraternité » des monosyllabes : l'astuce mnémotechnique espagnole : « Ven-Ten-Pon-Sal-Haz-Di-Ve-Sé » — ou plus simple : les apprendre en chansons de classe : au quotidien (¡Ven aquí! ¡Hazlo! ¡Ponlo ahí!), ces ordres sont omniprésents — les automatiser donne un espagnol vivant à l'oral.</div>"},
{"t": "L'impératif et une introduction au subjonctif (Espagnol)", "q": "« Es importante que ___ todos los días » (estudiar, tú)", "c": ["estudias", "estudies", "estudiarás", "estudiar"], "a": 1, "e": "es importante que + subjonctif : es importante que ESTUDIES todos los días.", "d": "<b>Es importante que : le conseil impersonnel</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les expressions d'IMPORTANCE/nécessité impersonnelles déclenchent le subjonctif : <i>Es importante que <b>estudies</b> todos los días.</i> (il est important que tu étudies tous les jours) : la famille : es necesario que, es fundamental que, es mejor que, hace falta que, es una pena que, es posible que : la logique : ces phrases expriment un jugement, un souhait — la réalité de l'action n'est pas affirmée (on ne dit pas que tu étudies !) : la formation : estudiar (régulier, pas de diphtongue) → estudie, estudie<b>s</b>, estudie, estudiemos, estudiéis, estudien : la variante SANS que : <i>Es importante estudiar todos los días</i> (infinitif, pas de sujet spécifique) : la paire avec/sans « que » couvre tous les conseils impersonnels : la structure sert autant en expression (donner des conseils) qu'en compréhension — un pilier du niveau B1-B2.</div>"},
{"t": "L'impératif et une introduction au subjonctif (Espagnol)", "q": "« ¡Sé puntual ! » signifie :", "c": ["Sache être ponctuel !", "Il faut être ponctuel", "Tu es ponctuel", "Sois ponctuel !"], "a": 3, "e": "¡Sé puntual ! = Sois ponctuel ! — impératif de SER (avec accent écrit : sé ≠ se pronom).", "d": "<b>Sé avec accent : l'ordre d'être</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>¡<b>Sé</b> puntual!</i> (sois ponctuel !) : l'impératif de ser : <b>sé</b> (avec l'accent écrit — obligatoire pour le distinguer du pronom « se » !) : la paire piégeuse : ¡Sé bueno! (sois sage — ser) vs ¡Se lo di! (je le lui ai dit — pronom) : le négatif : ¡No seas tonto! (ne sois pas bête — subjonctif de ser : seas) : les contextes d'usage : les conseils de comportement (¡Sé amable, sé tú mismo!) et les interdictions (¡No seas así!) : dans un dialogue ou une lettre de conseils (un devoir récurrent !), ces ordres d'être sont omniprésents : l'accent de « sé » est le petit détail qui montre la précision orthographique — il se vérifie en une seconde et rassure le correcteur.</div>"},
{"t": "Lexique de la vie quotidienne (Espagnol)", "q": "« Une librairie » en espagnol :", "c": ["la librería digital", "la librería", "la biblioteca", "el libro"], "a": 1, "e": "librería = librairie ; biblioteca = bibliothèque — LE faux-ami classique !", "d": "<b>Biblioteca vs librería : le duel des faux-amis</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la <b>librería</b> = le magasin où l'on ACHÈTE des livres (librairie) : la <b>biblioteca</b> = le lieu où l'on EMPRUNTE et lit (bibliothèque) : la confusion vient du mot français « librairie » (et de l'anglais library !) — chaque langue piège à sa manière : la liste des faux-amis hispano-français : asistir (assister à ≠ aider), largo (long ≠ large), una fábrica (usine), éxito (succès ≠ exit !), un abrazo (une étreinte ≠ un bras), una cita (rendez-vous/citation selon contexte), el suceso (l'événement), sensible (sensible ≠ sensitive) : la méthode : apprendre les paires piégeuses ENSEMBLE (une fiche « faux-amis ») : ce point de lexique est source de contresens permanents — le clarifier une fois, c'est lire l'espagnol sans anguille sous roche.</div>"},
{"t": "Lexique de la vie quotidienne (Espagnol)", "q": "« Hasta luego » signifie :", "c": ["à plus tard", "à demain", "merci beaucoup", "bonsoir"], "a": 0, "e": "hasta luego = à plus tard (ce même jour ou bientôt) ; hasta mañana = à demain.", "d": "<b>Hasta : la famille des au revoir</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la série des « hasta » : <i>hasta luego</i> (à plus tard — le plus courant), <i>hasta mañana</i> (à demain), <i>hasta pronto</i> (à bientôt), <i>hasta la vista</i> (au revoir — rendu culte par le cinéma !) : les autres formules de départ : <i>adiós</i> (adieu — définitif/solemn), <i>nos vemos</i> (on se voit — familier), <i>chao/chau</i> (ciao — très familier, surtout Amérique latine) : la hiérarchie sociale : hasta luego convient partout (neutre-poli) ; chao entre amis : en dialogues d'examen, la clôture (¡Hasta luego! / ¡Nos vemos!) est attendue après merci (gracias por todo) : ces formules de politesse sont la première chose qu'un correcteur écoute à l'oral — les automatiser donne le ton d'emblée.</div>"},
{"t": "Lexique de la vie quotidienne (Espagnol)", "q": "« Los deberes » ce sont :", "c": ["les droits", "les dettes", "les devoirs de la maison", "les devoirs"], "a": 3, "e": "los deberes = les devoirs (scolaires) ; hacer los deberes = faire ses devoirs.", "d": "<b>Deberes : les devoirs et le verbe devoir</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Tengo que hacer los deberes.</i> (je dois faire mes devoirs) : le champ de deber : <b>los deberes</b> (nom pluriel : les devoirs) ; <b>deber</b> + infinitif (devoir, obligation : <i>Debes estudiar</i>) ; <b>deber de</b> + infinitif (probabilité : <i>Debe de estar cansado</i> — il doit être fatigué, supposition !) : la nuance fine devoir/probabilité est un bonus de niveau : les mots d'école compagnons : la asignatura (la matière), el examen, el recreo (la récré), las notas (les notes), el boletín (le bulletin), el instituto (le collège/lycée espagnol) : le lexique scolaire est LA base des dialogues d'examen (parler de son emploi du temps, ses matières, ses notes) — chaque mot se rejoue dans l'oral.</div>"},
{"t": "Lexique de la vie quotidienne (Espagnol)", "q": "Au restaurant, pour demander l'addition :", "c": ["¡El menú, por favor!", "¡El camarero, por favor!", "¡La cuenta, por favor!", "¡La carta, por favor!"], "a": 2, "e": "la cuenta = l'addition ; la carta = la carte (menu) — ne pas confondre !", "d": "<b>La cuenta ou la carte : le malentendu du restaurant</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>¡Camarero! ¡La cuenta, por favor!</i> (garçon ! l'addition s'il vous plaît !) : la distinction : <b>la cuenta</b> = l'addition (ce que je PAIE) ; <b>la carta</b> = la carte (ce que je CHOISIS) : demander « la carta » pour partir = demander le menu pour rester ! : le lexique du restaurant : el camarero (serveur), el menú del día (formule du jour), el primer/segundo plato (entrée/plat), el postre, la propina (le pourboire), pagar en efectivo/con tarjeta (espèces/carte) : le scénario complet : pedir (commander : <i>De primero, una sopa</i>), comer, pedir la cuenta, pagar : le dialogue au restaurant est UN classique des oraux (bonjour le niveau A2) : cinq formules apprisées et le tour est joué.</div>"},
{"t": "Lexique de la vie quotidienne (Espagnol)", "q": "« ¿Cuánto cuesta? » sert à demander :", "c": ["la direction", "l'heure", "le nom", "le prix"], "a": 3, "e": "¿Cuánto cuesta? = combien ça coûte ? (au marché, en boutique).", "d": "<b>Cuesta : la question des achats</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>¿Cuánto <b>cuesta</b> este bolso?</i> (combien coûte ce sac ?) : la famille de costar : cuesta (ça coûte), cuestan (pluriel : <i>¿Cuánto cuestan las naranjas?</i>) : le verbe est régulier mais s'utilise comme gustar (l'objet est le sujet !) : les compagnons de shopping : caro/barato (cher/bon marché), la rebaja (la réduction), las rebajas (les soldes — saison !), el precio (le prix), la talla (la taille — vêtements), el número (la pointure), probarse (essayer) : le dialogue type : ¿Cuánto cuesta? — Veinte euros. — Es un poco caro. ¿Tiene rebajas? : l'expérience d'achat est un scénario complet d'examen : une dizaine de formules, et le marché espagnol n'a plus de secrets.</div>"},
{"t": "Lexique de la vie quotidienne (Espagnol)", "q": "Le faux-ami dans cette liste :", "c": ["la playa", "la familia", "la música", "el éxito"], "a": 3, "e": "éxito = SUCCÈS (pas « exit ») : tener éxito = réussir, avoir du succès.", "d": "<b>Éxito : le succès qui n'est pas une sortie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <b>el éxito</b> = le succès (<i>El examen fue un éxito</i> — l'examen fut un succès ; <i>una novela de éxito</i> — un roman à succès, best-seller = un libro de éxito/de ventas) : le piège : l'anglais « exit » (sortie) — en espagnol : la salida : le panthéon des faux-amis franco-espagnols à connaître : asistir (assister à ≠ aider), largo (long ≠ large), sensible (sensible ≠ susceptible), una fábrica (usine ≠ fabrique), el suceso (l'événement ≠ succès), el suceso (l'événement ≠ succès), rater : la méthode : une liste personnelle de 15 paires, revue avant chaque examen : le faux-ami est la faute « invisible » — la phrase semble correcte, le sens dérive : seul l'apprentissage explicite les chasse.</div>"},
{"t": "Lexique de la vie quotidienne (Espagnol)", "q": "« Quedar con los amigos » signifie :", "c": ["quitter les amis", "se retrouver/se donner rendez-vous avec les amis", "rester avec les amis (sans bouger)", "se disputer avec les amis"], "a": 1, "e": "quedar con quelqu'un = se donner rendez-vous / se retrouver (l'usage espagnol le plus courant pour « on se voit »).", "d": "<b>Quedar : le verbe des rendez-vous</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Los sábados <b>quedo con</b> mis amigos en la plaza.</i> (le samedi je retrouve mes amis sur la place) : quedarse (réfléchi) = rester (<i>Me quedo en casa</i> — je reste à la maison) : les deux sens coexistent : quedar CON = donner rendez-vous ; quedarse = rester : la vie sociale espagnole vit sur quedar : <i>¿Quedamos mañana?</i> (on se voit demain ?), <i>Hemos quedado a las ocho</i> (on s'est donné rendez-vous à huit heures) : les compagnons des loisirs : salir (sortir — ¡salir de fiesta!), dar un paseo (se promener), tomar algo (boire un coup), el finde (le week-end — familier), el parque, la plaza : les activités sociales sont le cœur des dialogues : proposer (¿Quedamos?), accepter (¡Vale, genial!), préciser (a las ocho en la plaza) : trois formules, un plan complet.</div>"},
{"t": "Lexique de la vie quotidienne (Espagnol)", "q": "« El recreo » c'est :", "c": ["la récréation", "la récré du soir", "le loisir", "la création"], "a": 0, "e": "el recreo = la récréation (la pause à l'école) — être nouveau : recrearse (se récréer).", "d": "<b>Recreo : la pause bénie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>En el <b>recreo</b> comemos el bocadillo y jugamos al fútbol.</i> (à la récré on mange le sandwich et on joue au foot) : la paronymie : recreo ≠ creación (création) — la ressemblance piège (comme récréation/création en français, d'ailleurs !) : le lexique scolaire du quotidien : la clase, el aula (la salle de classe), el pupitre (le pupitre/banc), la pizarra (le tableau), el deber, el recreo, las vacaciones (les vacances — toujours PLURIEL !), el profe (familier : le prof) : la culture : el recreo espagnol = le moment social de la journée (bocadillo, patio, futbolín) : en expression, raconter sa journée scolaire (« Mi día en el instituto ») est un exercice standard : le lexique s'y déploie naturellement — une question QCM simple, un mot à connaître absolument.</div>"},
{"t": "Lexique de la vie quotidienne (Espagnol)", "q": "« Lo siento » signifie :", "c": ["je le sens", "je le porte", "je suis désolé", "j'ai faim"], "a": 2, "e": "lo siento = je suis désolé (littéralement « je le ressens ») — la formule d'excuse.", "d": "<b>Lo siento : l'excuse ressenti</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>— No puedo venir esta tarde. — <b>Lo siento</b> mucho.</i> (je ne peux pas venir. — Je suis vraiment désolé) : l'étymologie transparente : lo (le) + siento (je ressens) — « je le ressens [ta peine] » : l'espagnol dit son excuse avec le verbe SENTIR (ressentir) : les nuances de l'excuse : perdón/perdone (pardon — léger, interjection), disculpe (excusez-moi — formel), lo siento (je suis désolé — empathique), lo siento mucho (très désolé) : l'usage : perdon pour bousculer dans le métro ; lo siento pour une vraie mauvaise nouvelle : la réponse type : — Lo siento. — No pasa nada. (ce n'est rien) : la politesse espagnole est un système de rituels : les maîtriser (perdón, lo siento, gracias, de nada, encantado) fait « natif poli » dès la première phrase.</div>"},
{"t": "Lexique de la vie quotidienne (Espagnol)", "q": "« Las vacaciones » — l'espagnol dit :", "c": ["el vacación", "las vacas", "la vacación (singulier)", "las vacaciones (toujours pluriel)"], "a": 3, "e": "Comme « les vacances » en français : toujours le pluriel — las vacaciones.", "d": "<b>Vacaciones : le pluriel obligatoire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : comme le français « les vacances » — l'espagnol dit TOUJOURS <b>las vacaciones</b> (pluriel) : <i>Este verano, las vacaciones serán en la playa.</i> (cet été, les vacances seront à la plage) : la famille des « pluriels obligatoires » : los padres (les parents), los abuelos (les grands-parents — ou l'un des deux !), las gafas (les lunettes), los pantalones (le pantalon !), las tijeras (les ciseaux), las afueras (la périphérie) : la logique : les objets à deux éléments (lunettes, ciseaux, pantalon) et les entités plurielles par nature (parents, vacances) : le piège du singulier : « la vacación » existe à peine (sens abstrait technique) : en expression, « mis vacaciones » (mes vacances) est LE sujet d'essay récurrent : partir du bon pied (le pluriel) évite la faute qui fâche dès la première phrase — le signe d'une copie soignée.</div>"},
{"t": "Civilisation : l'Espagne (Espagnol)", "q": "La dictature de Francisco Franco a duré :", "c": ["1975-1978", "1931-1939", "1936-1939", "1939-1975"], "a": 3, "e": "Franco dirige l'Espagne de la fin de la guerre civile (1939) à sa mort (1975) — 36 ans de dictature.", "d": "<b>1939-1975 : les 36 années de plomb</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chronologie à ne JAMAIS mélanger : <b>1931-1939</b> : la IIe République (réformes, tensions) : <b>1936-1939</b> : la guerre civile (républicains vs nationaux ; Guernica 1937) : <b>1939-1975</b> : la dictature de Franco (victoire de la guerre → mort du dictateur) : <b>1975-1978</b> : la Transition (Juan Carlos Ier, démocratisation, Constitution) : la logique : la guerre civile PRÉCÈDE la dictature — Franco gagne la guerre, puis règne : les repères culturels de la dictature : censure, exil des intellectuels (Lorca fusillé dès 1936), l'isolement des années 40, l'ouverture touristique des années 60 : ces dates structurent TOUT l'essai de civilisation : les confondre, c'est perdre la crédibilité historique d'un paragraphe entier.</div>"},
{"t": "Civilisation : l'Espagne (Espagnol)", "q": "La Transition démocratique espagnole a lieu :", "c": ["après la Seconde Guerre mondiale", "entre la mort de Franco (1975) et la Constitution (1978)", "en 1986", "pendant la guerre civile"], "a": 1, "e": "La Transición : 1975 (mort de Franco, Juan Carlos Ier roi) → 1978 (Constitution démocratique) — un miracle en trois ans.", "d": "<b>La Transición : le miracle de trois ans</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la séquence : (1) novembre <b>1975</b> : Franco meurt ; Juan Carlos Ier — désigné par Franco comme successeur — devient roi : (2) <b>1976-77</b> : Adolfo Suárez est nommé président ; légalisation des partis (même le parti communiste !) ; amnistie générale : (3) juin <b>1977</b> : les premières élections libres depuis 1936 : (4) décembre <b>1978</b> : la Constitution est approuvée par référendum (88 % de oui) : la prouesse : passer de la dictature à la démocratie SANS guerre, SANS rupture violente — un modèle étudié partout : le rôle clé : le roi (qui pouvait être le « Franco bis » choisit la démocratie) et le consensus des partis (el pacto) : ce récit est LA base de tout essai sur l'Espagne moderne.</div>"},
{"t": "Civilisation : l'Espagne (Espagnol)", "q": "La Constitution de 1978 établit :", "c": ["une monarchie parlementaire décentralisée (Estado de las Autonomías)", "une dictature monarchique", "une république fédérale", "une république unitaire"], "a": 0, "e": "La Constitution de 1978 fonde une monarchie parlementaire et l Estado de las Autonomías (communautés décentralisées).", "d": "<b>1978 : le pacte des Espagnes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la Constitution de 1978 (encore en vigueur) instaure : (1) une <b>monarchie parlementaire</b> — le roi règne, le gouvernement gouverne (article 1 : « La soberanía nacional reside en el pueblo español » — la souveraineté réside dans le peuple !) : (2) l'<b>Estado de las Autonomías</b> : 17 communautés autonomes avec parlements et statuts propres — la réponse au problème des nationalités (Catalogne, Pays basque, Galice) : (3) les libertés fondamentales : expression, presse, réunion, religion : le consensus : la Constitution fut votée par presque tous les partis (des communistes à la droite modérée) — le symbole de la réconciliation : la comparaison française : Constitution de 1958 (monarchie... non : république présidentielle) : l'Espagne de 1978 est souvent citée comme la constitution consensuelle par excellence — un essay sur la démocratie espagnole s'appuie d'abord sur CE texte.</div>"},
{"t": "Civilisation : l'Espagne (Espagnol)", "q": "Combien de comunidades autónomas ?", "c": ["21", "4 (les nationalités historiques)", "10", "17 (plus Ceuta et Melilla)"], "a": 3, "e": "17 comunidades autónomas + 2 villes autonomes (Ceuta et Melilla) — la décentralisation espagnole est maximale.", "d": "<b>17 + 2 : la mosaïque espagnole</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'Espagne est découpée en <b>17 communautés autonomes</b> (Andalucía, Cataluña, País Vasco, Galicia, Madrid, Comunidad Valenciana, Castilla y León, etc.) plus les villes autonomes de Ceuta et Melilla (enclaves au Maroc) : chaque communauté : parlement, gouvernement, statut d'autonomie, compétences (éducation, santé, police dans certains cas — les Mossos en Catalogne, l'Ertzaintza au Pays basque !) : la logique : répondre aux revendications des nationalités historiques sans éclater l'État — « une nation d'États-nations » : les langues co-officielles : castillan (tout l'État) + catalan (Catalogne, Valence — valencien, Baléares), euskera (Pays basque), gallego (Galice) : la décentralisation espagnole est l'une des plus poussées d'Europe : un essay sur l'unité/l diversité de l'Espagne (« España, una y diversa ») mobilise TOUTES ces données — chiffres, langues, institutions.</div>"},
{"t": "Civilisation : l'Espagne (Espagnol)", "q": "« Guernica », l'œuvre de Picasso (1937), dénonce :", "c": ["la corrida", "le bombardement de la ville de Guernica pendant la guerre civile", "la crise économique", "la monarchie espagnole"], "a": 1, "e": "Guernica peint le bombardement nazi (soutien à Franco) de la ville basque de Guernica, le 26 avril 1937 — le manifeste pacifiste de la guerre civile.", "d": "<b>Guernica : la guerre en noir et blanc</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le 26 avril <b>1937</b>, l'aviation allemande (la Légion Condor, alliée de Franco) bombarde Guernica (Guernika), petite ville basque — jour de marché : des centaines de morts civils : Picasso, commissionné pour l'Exposition universelle de Paris, peint en quelques semaines le tableau-monument (3,5 × 7,8 m) : la guerre en gris, noir et blanc — la douleur (la mère et l'enfant, le cheval hurlant, le taureau, la lumière électrique cruelle) : le tableau : symbole universel de l'anti-guerre, refus du retour en Espagne tant que vivrait Franco (il est arrivé au Prado en 1981 !) : en expression, Guernica est L'exemple parfait pour un essai art/histoire (l'art au service de la mémoire) : une œuvre, une date, un symbole — le kit de trois pièces le plus rentable de la civilisation.</div>"},
{"t": "Civilisation : l'Espagne (Espagnol)", "q": "Le roi actuel de l'Espagne (depuis 2014) :", "c": ["Felipe VI", "Franco", "Juan Carlos Ier", "Adolfo Suárez"], "a": 0, "e": "Felipe VI, fils de Juan Carlos Ier, règne depuis son abdication en 2014.", "d": "<b>Felipe VI : le roi de la continuité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la lignée : <b>Juan Carlos Ier</b> (1975-2014) — le roi de la Transition, qui a piloté la démocratisation puis abdiqué en 2014 (suite à des affaires qui l'ont discrédité) : <b>Felipe VI</b> (2014-...) — le roi actuel, symbole de modernité et de continuité institutionnelle : la fonction : chef de l'État, arbitre et modérateur (comme la Constitution le prévoit — il « règne mais ne gouverne pas ») : les dates du rôle monarchique : 1981, le coup d'État manqué du 23-F (Juan Carlos sauve la démocratie en s'adressant à la télévision en uniforme !) — LE moment monarchique fondateur : la monarchie espagnole est donc une monarchie de CONSENSUS, née de la Transition et consolidée par le 23-F : dans un essai sur les institutions, le couple roi/président del gobierno (Felipe VI / Pedro Sánchez) doit apparaître avec précision — les noms et dates exacts font la différence entre une copie moyenne et une copie d'excellence.</div>"},
{"t": "Civilisation : l'Espagne (Espagnol)", "q": "Le Don Quijote de Cervantes a été publié :", "c": ["en 1898", "en 1978", "en 1605 (première partie)", "en 1492"], "a": 2, "e": "La première partie de Don Quijote paraît en 1605 (la seconde en 1615) — le roman fondateur de la littérature espagnole et moderne.", "d": "<b>1605 : le roman qui invente le roman</b>.<div class='ex-detail'><u>Exemple rédigé</u> : Miguel de Cervantes publie <b>El ingenioso hidalgo don Quijote de la Mancha</b> en <b>1605</b> (partie 2 : 1615) : l'histoire : un hidalgo pauvre, fou de romans de chevalerie, part sur les routes de La Mancha avec Sancho Panza — il attaque des moulins à vent croyant combattre des géants (« luchar contra molinos de viento » — se battre contre des moulins à vent : l'expression est restée !) : le sens : la satire des livres de chevalerie ET la première interrogation moderne sur le réel et la fiction : le statut : souvent appelé « premier roman moderne » ; le español est « la langue de Cervantes » : 1492, l'autre date-clef (prise de Grenade, expulsion des juifs, Gramática de Nebrija, Christophe Colomb !) est le point de départ de l'âge d'or (Siglo de Oro) : les deux dates (1492, 1605) structurent le patrimoine littéraire espagnol — un essay sur la culture espagnole peut commencer par l'une ou l'autre.</div>"},
{"t": "Civilisation : l'Espagne (Espagnol)", "q": "La Movida madrileña désigne :", "c": ["le pèlerinage de Saint-Jacques", "l'effervescence culturelle de l'après-Franco (Madrid, années 80 : Almodóvar, pop, liberté des mœurs)", "la fête de la Saint-Jean", "le mouvement indépendantiste catalan"], "a": 1, "e": "La Movida : la libération culturelle et artistique des années 80 post-dictature — symbole de la nouvelle Espagne démocratique.", "d": "<b>La Movida : l'explosion de la liberté</b>.<div class='ex-detail'><u>Exemple rédigé</u> : après 1975, la jeunesse madrilène explose : musique pop-punk (Alaska, Kaka de Luxe), night-life, provocation, sexe et liberté des mœurs — tout ce que la dictature interdisait : la figure : <b>Pedro Almodóvar</b>, cinéaste emblématique (Pepi, Luci, Bom 1980 ; Tout sur ma mère, Oscar 2000) — l'esthétique Movida devient mondiale : le contexte : la Transition politique + la crise économique (la movida est aussi une réponse au chômage — vivre la nuit quand le jour ne promet rien) : la portée : la Movida est le LABORATOIRE culturel de la démocratie naissante — l'Espagne qui se réinvente : en essay, le trio Transition politique / Movida culturelle / modernité actuelle forme l'argument du « renacimiento » espagnol : un exemple culturel daté vaut mieux que dix généralités — la Movida est l'exemple parfait.</div>"},
{"t": "Civilisation : l'Espagne (Espagnol)", "q": "L'Espagne est entrée dans la CEE (ancienne UE) en :", "c": ["1978", "2000", "1992", "1986"], "a": 3, "e": "Adhésion à la CEE le 1er janvier 1986 — le retour en Europe après l isolement franquiste.", "d": "<b>1986 : le retour en Europe</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le 1er janvier <b>1986</b>, l'Espagne (avec le Portugal) adhère à la Communauté économique européenne : la symbolique : après quarante ans d'isolement franquiste, l'Espagne DEMANDE son retour dans la famille européenne — l'adhésion consacre la Transition (démocratie + économie de marché = passeport européen) : les effets : fonds européens (autoroutes, TGV Madrid-Séville !), ouverture des marchés, essor du tourisme (l'Espagne devient la 2e destination mondiale), modernisation accélérée : l'année-phare <b>1992</b> : JO de Barcelone, Expo universelle de Séville, Madrid capitale culturelle — l'Espagne « se montre » au monde : la comparaison avec le Brexit ou l'attitude espagnole actuelle (pro-européenne) enrichit l'essai : le couple Transition/CEE (politique intérieure/ouverture extérieure) est LA clé de lecture de l'Espagne moderne — deux dates (1978, 1986) et le récit est complet.</div>"},
{"t": "Civilisation : l'Espagne (Espagnol)", "q": "Les langues co-officielles en Espagne incluent :", "c": ["le castillan et l'arabe", "le castillan + le français", "le castillan + catalan, euskera (basque) et gallego (galicien)", "le castillan seulement"], "a": 2, "e": "Langues officielles : castillan (tout l'État) + catalan, basque (euskera), galicien (gallego) dans leurs communautés — plus l'occitan aranais.", "d": "<b>Una y diversa : les langues d'Espagne</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la Constitution : le castillan est la langue officielle de l'État — tous les Espagnols le parlent (obligation de le connaître) ; MAIS les autres langues d'Espagne sont co-officielles dans leurs communautés : <b>catalan</b> (Catalogne, Baléares, Communauté valencienne — où on l'appelle valencien), <b>euskera</b> (Pays basque — la plus ancienne langue d'Europe, sans famille connue !), <b>gallego</b> (Galice — parent du portugais), occitan (Val d'Aran) : la réalité : les écoles, la signalétique, la télévision régionales fonctionnent en langue régionale : le débat : l'enseignement du catalan, la question de la prééminence — des sujets d'essai récurrents (federalisme, nationalités) : en expression, écrire « l'Espagne est bilingue/trilingue » est FAUX : elle est multilingue par communautés — la précision du vocabulaire (co-officiel ≠ officiel) signe une copie informée.</div>"},
{"t": "Civilisation : l'Amérique latine (Espagnol)", "q": "L'empire aztèque (Tenochtitlán) est tombé en 1521 sous :", "c": ["Colomb", "Cortés", "Pizarro", "Bolívar"], "a": 1, "e": "Hernán Cortés conquiert Tenochtitlán (capitale aztèque, future Mexico) en 1521 ; Pizarro prend l'empire inca en 1533.", "d": "<b>Cortés et Pizarro : les deux conquistadores</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la répartition à retenir : <b>Hernán Cortés</b> → MEXIQUE (l'empire aztèque de Moctezuma ; Tenochtitlán tombe en <b>1521</b>) : <b>Francisco Pizarro</b> → PÉROU (l'empire inca d'Atahualpa ; Cajamarca <b>1533</b>) : Colomb, lui, n'a jamais dépassé les Caraïbes (4 voyages, 1492-1504 — il est mort croyant avoir atteint l'Asie !) : les facteurs de la victoire : les armes en acier, les chevaux... mais surtout les ÉPIDÉMIES (variole) et les alliances avec les peuples soumis aux Aztèques : la date 1521 est aussi celle d'une bascule mondiale : l'or et l'argent américains financent l'Espagne des Habsbourg (le Siglo de Oro !) : le couple conquête-métropole relie l'Amérique latine à l'histoire de l'Espagne — le fil rouge de toute la civilisation du cours.</div>"},
{"t": "Civilisation : l'Amérique latine (Espagnol)", "q": "Simón Bolívar est célèbre pour :", "c": ["avoir découvert le Pacifique", "avoir été président du Mexique", "avoir conquis le Pérou", "avoir mené les indépendances de l'Amérique du Sud hispanique (le « Libertador »)"], "a": 3, "e": "Bolívar a libéré le Venezuela, la Colombie, l Équateur et le Pérou ; la Bolivie porte son nom.", "d": "<b>El Libertador : le général des indépendances</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <b>Simón Bolívar</b> (1783-1830), Vénézuélien, aristocrate éclairé (il admire la Révolution française) : il libère l'actuel Venezuela, Colombie, Équateur, Pérou — et la Bolivie porte SON nom (l'unique pays nommé d'après un homme de son vivant !) : ses compagnons : <b>José de San Martín</b> (l'Argentine, le Chili — le « Libertador du Sud ») et <b>Miguel Hidalgo</b> (le Mexique, le « grito de Dolores » de 1810 — le cri qui lança la révolte) : le contexte : l'invasion napoléonienne de l'Espagne (1808) orpheline les colonies — chacun se gouverne : le rêve de Bolívar : une Grande Colombie fédérée, unie — il échoue (éclatement en 1830, guerres civiles, caudillos) : sa phrase célèbre : « He arado en el mar » (« j'ai labouré dans la mer ») — l'amertume d'un idéal unificateur brisé : un personnage d'essay idéal (l'idéalisme politique et ses limites).</div>"},
{"t": "Civilisation : l'Amérique latine (Espagnol)", "q": "La révolution cubaine de 1959 est associée à :", "c": ["Fidel Castro et le Che Guevara", "Perón", "Bolívar et San Martín", "Pinochet"], "a": 0, "e": "1959 : Fidel Castro (avec le Che Guevara) renverse Batista — Cuba devient socialiste ; le Che devient l'icône mondiale du révolutionnaire.", "d": "<b>1959 : l'île qui bascule</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le 1er janvier <b>1959</b>, les guérilleros de la Sierra Maestra entrent dans La Havane : Batista (dictateur corrompu, allié des Américains) fuit : <b>Fidel Castro</b> prend le pouvoir ; <b>Ernesto « Che » Guevara</b> (Argentin, médecin) devient ministre — puis part exporter la révolution (Bolivie, où il est exécuté en 1967) : la suite : nationalisations, alliance avec l'URSS, la crise des missiles (1962), le blocus américain (embargo, toujours en place) : l'icône : le portrait du Che par Korda est devenu LE symbole mondial de révolte (affiches, t-shirts) — le paradoxe commercial d'un anti-capitaliste ! : la question Cuba revient dans les essays (révolution, blocus, relations avec les USA, la transition post-Fidel) : les dates 1959/1962 et les deux noms (Castro, Guevara) sont le kit minimum — le QCM les teste tous les deux.</div>"},
{"t": "Civilisation : l'Amérique latine (Espagnol)", "q": "Le Brésil se distingue des autres pays d'Amérique latine parce que :", "c": ["sa langue officielle est le portugais", "il est indépendant depuis 1492", "il n'a pas de football", "il est plus petit"], "a": 0, "e": "Le Brésil est lusophone (portugais) — l'Amérique LATINE l'inclut, l'Amérique HISPANIQUE l'exclut.", "d": "<b>Brésil : le géant lusophone</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la distinction technique : <b>Amérique latine</b> = tous les pays de langue latine (espagnol, portugais, français — Haïti !) : <b>Amérique hispanique</b> = les pays hispanophones seulement → le Brésil (portugais, colonisation du Portugal selon le traité de Tordesillas, 1494) est latin mais PAS hispanique : la conséquence linguistique : l'espagnol brésilien n'existe pas — le portugais brésilien (200+ M de locuteurs) est la langue la plus parlée d'Amérique latine ! : l'ensemble hispanique reste néanmoins énorme : ~20 pays, 480 M de locuteurs natifs (Mexique en tête) : le football, lui, ignore les frontières linguistiques (Pelé, Neymar — l'ennemi historique de la Albiceleste argentine !) : cette distinction latin/hispanique est un point de vocabulaire précis qui enrichit tout essai géographique — la confondre dans une copie de civilisation espagnole serait (presque) un sacrilège.</div>"},
{"t": "Civilisation : l'Amérique latine (Espagnol)", "q": "Gabriel García Márquez, Nobel de littérature 1982, est le maître de :", "c": ["la poésie romantique", "la science-fiction", "le théâtre classique", "le réalisme magique (Cent ans de solitude)"], "a": 3, "e": "Le Colombien García Márquez incarne le « realismo mágico » : Cent ans de solitude (1967) — le merveilleux au cœur du réel.", "d": "<b>Macondo : le village du monde</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <b>Cien años de soledad</b> (1967) raconte sept générations de la famille Buendía dans le village mythique de Macondo — où le merveilleux (un enfant né avec queue de cochon, une femme qui monte au ciel avec ses draps) est raconté comme le plus naturel du monde : le <b>realismo mágico</b> : la frontière entre réel et magie s'efface — l'esthétique de l'Amérique latine (l'histoire y est souvent « incroyable » : dictatures, miracles, violences) : la constellation : Jorge Luis Borges (Argentine, l'érudit des labyrinthes), Pablo Neruda (Chili, Nobel 1971), Mario Vargas Llosa (Pérou, Nobel 2010), Octavio Paz (Mexique, Nobel 1990) — le continent a raflé une collection de Nobel : en expression, citer Cent ans de soledad (titre en espagnol !) et le realismo mágico est LE geste culturel valorisé — il montre qu'on connaît la littérature EN espagnol, pas seulement la grammaire.</div>"},
{"t": "Civilisation : l'Amérique latine (Espagnol)", "q": "Le « grito de Dolores » (1810) est associé à :", "c": ["la conquête du Pérou", "l'indépendance du Mexique (Miguel Hidalgo)", "un explorateur du Yukon", "la révolution cubaine"], "a": 1, "e": "Le 16 septembre 1810, le prêtre Miguel Hidalgo lance le « cri de Dolores » qui déclenche l'insurrection mexicaine — date de la fête nationale du Mexique.", "d": "<b>El grito : le cri qui fonde le Mexique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : dans la nuit du <b>15-16 septembre 1810</b>, le curé <b>Miguel Hidalgo</b> sonne la cloche du village de Dolores et appelle à la révolte contre les Espagnols (« ¡Viva México ! ») — le début de la guerre d'indépendance (achevée en 1821) : chaque année, le président mexicain répète le grito du balcon du palais (le 15 septembre au soir) — la fête nationale est ce rituel : la figure d'Hidalgo : un prêtre rebelle, bannière de la Vierge de Guadalupe (le symbole du catholicisme mexicain mêlé à l'identité nationale) : le calendrier des indépendances : Mexique (1810-21), Argentine (1816), et les campagnes de Bolívar/San Martín (1817-1824) : ces cris fondateurs (le grito de Dolores, comme el 20 de julio colombien) sont les « 14 juillet » latino-américains : un essay sur les indépendances s'ouvre naturellement par un grito — daté et incarné.</div>"},
{"t": "Civilisation : l'Amérique latine (Espagnol)", "q": "Les « desaparecidos » d'Argentine sont les victimes :", "c": ["de la conquête espagnole", "de la révolution cubaine", "du narcotrafic colombien", "de la dictature militaire (1976-1983)"], "a": 3, "e": "La junte militaire argentine (1976-83) a fait « disparaître » ~30 000 personnes ; les Madres de la Plaza de Mayo manifestent depuis 1977.", "d": "<b>Los desaparecidos : le deuil sans tombe</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le coup d'État du 24 mars <b>1976</b> installe la junte en Argentine : la « guerre sale » (guerra sucia) : enlèvements, centres de torture, et des milliers de « disparus » — ni vivants ni morts, sans sépulture (les « vols de la mort » jetaient les corps dans le Rio de la Plata) : la réponse des mères : depuis avril <b>1977</b>, les <b>Madres de la Plaza de Mayo</b> défilent chaque jeudi, foulard blanc, photo du disparu — le symbole mondial de la résistance civile : la transition : la défaite des Malouines (1982) précipite la chute ; le procès des juntes (1985) et la CONADEP (Nunca más !) : les parallèles : le Chili de Pinochet (1973-90, le stade devenu prison), l'Operación Cóndor (la coordination des dictatures) : en essay, l'Argentine des disparus est le sujet de mémoire par excellence (devoir de mémoire, justice transitionnelle) — les dates (1976/1983) et les Madres sont le socle factuel.</div>"},
