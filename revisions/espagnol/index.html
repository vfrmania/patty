var COURS_META = [
 {
  "id": "presente",
  "theme": "Le présent de l'indicatif (Espagnol)",
  "niveau": "Collège/Lycée — Espagnol",
  "titre": "Le présent de l'indicatif",
  "cours": "<div class=\"cours-head\"><h2>El presente de indicativo</h2><span class=\"niv\">Espagnol</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois conjugaisons régulières</h3>\n<ul>\n<li>les verbes en <b>-ar</b> : hablar → <b>hablo, hablas, habla, hablamos, habláis, hablan</b> ;</li>\n<li>les verbes en <b>-er</b> : comer → <b>como, comes, come, comemos, coméis, comen</b> ;</li>\n<li>les verbes en <b>-ir</b> : vivir → <b>vivo, vives, vive, vivimos, vivís, viven</b> ;</li>\n<li>la 2e personne du pluriel porte <b>toujours l'accent écrit</b> : habláis, coméis, vivís ;</li>\n<li><b>vosotros</b> est la marque de l'espagnol d'Espagne : en Amérique latine, on dit <i>ustedes hablan</i>.</li>\n</ul>\n\n<h3>2. Les verbes à diphtongue (cambios vocálicos)</h3>\n<ul>\n<li>le <b>e</b> ou <b>o</b> de la racine se diphtongue aux 3 personnes du singulier + ustedes — mais <b>jamais à nosotros/vosotros</b> ;</li>\n<li><b>e → ie</b> : querer → quiero, quieres, quiere, <b>queremos</b>, queréis, quieren ; penser : pensar → pienso ; empezar → empiezo ; entender → entiendo ;</li>\n<li><b>o → ue</b> : poder → puedo, puedes, puede, <b>podemos</b>, podéis, pueden ; contar → cuento ; volver → vuelvo ; dormir → duermo ; encontrar → encuentro ;</li>\n<li><b>u → ue</b> : jugar → juego, juegas, juega, jugamos, jugáis, juegan.</li>\n</ul>\n\n<h3>3. Les irréguliers de base à connaître par cœur</h3>\n<table>\n<tr><th>Verbe</th><th>Présent</th><th>Sens</th></tr>\n<tr><td><b>ser</b></td><td>soy, eres, es, somos, sois, son</td><td>être (essence)</td></tr>\n<tr><td><b>estar</b></td><td>estoy, estás, está, estamos, estáis, están</td><td>être (état, lieu)</td></tr>\n<tr><td><b>ir</b></td><td>voy, vas, va, vamos, vais, van</td><td>aller</td></tr>\n<tr><td><b>tener</b></td><td>tengo, tienes, tiene, tenemos, tenéis, tienen</td><td>avoir</td></tr>\n<tr><td><b>hacer</b></td><td>hago, haces, hace, hacemos, hacéis, hacen</td><td>faire</td></tr>\n<tr><td><b>decir</b></td><td>digo, dices, dice, decimos, decís, dicen</td><td>dire</td></tr>\n<tr><td><b>ver</b></td><td>veo, ves, ve, vemos, veis, ven</td><td>voir</td></tr>\n<tr><td><b>saber</b></td><td>sé, sabes, sabe, sabemos, sabéis, saben</td><td>savoir</td></tr>\n</table>\n\n<h3>4. S'entraîner : la présentation</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — presentarse (se présenter)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Présente-toi : nom, âge, ville, goûts, activités du week-end.</div><div class=\"etu\"><b>Étape 1 — Les verbes réguliers</b> : <i>Me llamo Ana. Vivo en Sevilla. Estudio en un instituto.</i> (habiter → vivir ; étudier → estudiar).</div><div class=\"etu\"><b>Étape 2 — Les irréguliers</b> : <i>Tengo quince años. Soy francesa pero mi madre es española. Voy al cine los sábados.</i> (tener, ser, ir).</div><div class=\"etu\"><b>Étape 3 — Les diphtongues</b> : <i>Me gusta leer. Quiero ser médica. Encuentro que el español es fácil.</i> (querer → quiero, encontrar → encuentro).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la présentation mobilise les trois familles du présent — régulier (-ar/-er/-ir), diphtongue (quiero, encuentro), irrégulier (tengo, soy, voy) : c'est l'exercice d'entrée parfait pour tout examen.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« yo » est souvent omis : <i>Hablo español</i> = je parle espagnol (la terminaison suffit !) ;</li>\n<li>la diphtongue ne s'applique <b>jamais</b> à nosotros/vosotros : <i>pensamos</i> (pas « pienso » pour nous !) ;</li>\n<li><b>¡Ojo! hay</b> (impersonnel) : il y a — <i>hay muchos libros</i>.</li>\n</ul>\n</div>"
 },
 {

  "niveau": "Collège/Lycée — Espagnol",
  "titre": "Ser ou estar",
  "cours": "<div class=\"cours-head\"><h2>Ser ou estar</h2><span class=\"niv\">Collège</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les conjugaisons à connaître</h3>\n<p>Deux verbes signifient « être » en espagnol, avec des emplois différents :</p>\n<table>\n<tr><th></th><th>SER (être — essence)</th><th>ESTAR (être — état)</th></tr>\n<tr><td>yo</td><td><b>soy</b></td><td><b>estoy</b></td></tr>\n<tr><td>tú</td><td><b>eres</b></td><td><b>estás</b></td></tr>\n<tr><td>él / ella / usted</td><td><b>es</b></td><td><b>está</b></td></tr>\n<tr><td>nosotros/-as</td><td><b>somos</b></td><td><b>estamos</b></td></tr>\n<tr><td>vosotros/-as</td><td><b>sois</b></td><td><b>estáis</b></td></tr>\n<tr><td>ellos/-as / ustedes</td><td><b>son</b></td><td><b>están</b></td></tr>\n</table>\n<div class=\"tip\"><b>Moyen mnémotechnique</b> : <i>SER = ce que l'on EST par nature</i> (identité, caractère, origine) ; <i>ESTAR = l'état où l'on SE TROUVE</i> (situation, humeur, lieu). En anglais, c'est la différence entre <i>to be</i>… en fait les Espagnols distinguent ce que l'anglais et le français mélangent !</div>\n\n<h3>2. SER : l'essence, l'identité, la caractéristique permanente</h3>\n<p>On utilise <b>ser</b> pour ce qui définit une personne ou une chose de manière durable :</p>\n<ul>\n<li><b>l'identité</b> : <i>Soy Pierre, soy francés</i> (je suis Pierre, je suis français) ;</li>\n<li><b>l'origine et la nationalité</b> : <i>Es de Madrid</i> (il est de Madrid) ;</li>\n<li><b>la profession</b> : <i>Mi madre es médica</i> (ma mère est médecin) ;</li>\n<li><b>le caractère et l'apparence permanente</b> : <i>Es simpática y alta</i> (elle est sympathique et grande) ;</li>\n<li><b>la matière et la possession</b> : <i>La mesa es de madera</i> (la table est en bois), <i>Este libro es de Ana</i> ;</li>\n<li><b>l'heure, la date, les événements</b> : <i>Hoy es lunes, es el 9 de noviembre</i> ; la fête : <i>Mañana es mi cumpleaños</i> ;</li>\n<li><b>la couleur par nature</b> : <i>La nieve es blanca</i> (la neige est blanche).</li>\n</ul>\n\n<h3>3. ESTAR : l'état, la situation, le temporaire</h3>\n<p>On utilise <b>estar</b> pour ce qui peut changer, pour la situation dans l'espace ou l'humeur du moment :</p>\n<ul>\n<li><b>la localisation</b> (lieu où se trouve quelqu'un ou quelque chose) : <i>Madrid está en España</i>, <i>Estoy en casa</i> ;</li>\n<li><b>l'état ou l'humeur passagère</b> : <i>Estoy cansado / contento / enfadado</i> (je suis fatigué / content / fâché) ;</li>\n<li><b>la santé</b> : <i>¿Cómo estás? — Estoy bien / mal</i> ;</li>\n<li><b>le résultat d'une action (en cours)</b> : <i>La puerta está abierta</i> (la porte est ouverte — état résultant), <i>Estamos comiendo</i> (nous sommes en train de manger) ;</li>\n<li><b>la mort</b> (contrairement au français !) : <i>Está muerto</i> (il est mort) — car c'est un état ;</li>\n<li><b>une apparance temporaire</b> : <i>Estás muy guapa hoy</i> (tu es très jolie aujourd'hui).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ser vs estar\">\n  <rect x=\"20\" y=\"15\" width=\"195\" height=\"120\" rx=\"10\" fill=\"#eef2ff\" stroke=\"#c7d2fe\"/>\n  <text x=\"117\" y=\"38\" font-size=\"13\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">SER</text>\n  <text x=\"117\" y=\"58\" font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\">identit&#233; &#8226; origine &#8226; profession</text>\n  <text x=\"117\" y=\"74\" font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\">caract&#232;re &#8226; heure/date &#8226; mati&#232;re</text>\n  <text x=\"117\" y=\"100\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">&#171; ce que je SUIS &#187;</text>\n  <text x=\"117\" y=\"118\" font-size=\"9.5\" font-style=\"italic\" fill=\"#4f46e5\" text-anchor=\"middle\">Soy alumno : je suis &#233;l&#232;ve (qui je suis)</text>\n  <rect x=\"225\" y=\"15\" width=\"195\" height=\"120\" rx=\"10\" fill=\"#f0fdf4\" stroke=\"#bbf7d0\"/>\n  <text x=\"322\" y=\"38\" font-size=\"13\" font-weight=\"bold\" fill=\"#16a34a\" text-anchor=\"middle\">ESTAR</text>\n  <text x=\"322\" y=\"58\" font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\">lieu &#8226; humeur &#8226; sant&#233;</text>\n  <text x=\"322\" y=\"74\" font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\">&#233;tat passager &#8226; action en cours</text>\n  <text x=\"322\" y=\"100\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">&#171; o&#249; je SUIS, comment je vais &#187;</text>\n  <text x=\"322\" y=\"118\" font-size=\"9.5\" font-style=\"italic\" fill=\"#16a34a\" text-anchor=\"middle\">Estoy en clase : je suis en cours (lieu)</text>\n</svg><span class=\"fig-cap\">Ser décrit l'essence (colonne violette) ; estar décrit l'état et la situation (colonne verte). Presque toutes les difficultés de « ser ou estar » se résolvent avec cette question : caractéristique durable ou situation passagère ?</span></div>\n\n<h3>4. Le sens change ! Les paires célèbres</h3>\n<p>Certaines phrases changent complètement de sens selon le verbe choisi — c'est un grand classique des exercices :</p>\n<table>\n<tr><th>Avec SER</th><th>Avec ESTAR</th></tr>\n<tr><td><i>Es listo</i> = il est intelligent (caractère)</td><td><i>Está listo</i> = il est prêt (état du moment)</td></tr>\n<tr><td><i>Es aburrido</i> = il est ennuyeux (personnalité)</td><td><i>Está aburrido</i> = il s'ennuie (humeur actuelle)</td></tr>\n<tr><td><i>Es verde</i> = il est vert (couleur naturelle)</td><td><i>Está verde</i> = il n'est pas mûr (état)</td></tr>\n<tr><td><i>Es bueno</i> = il est bon (gentil)</td><td><i>Está bueno</i> = il est bon (au goût) / il a bonne mine</td></tr>\n<tr><td><i>Es rico</i> = il est riche</td><td><i>Está rico</i> = c'est délicieux</td></tr>\n<tr><td><i>Es callado</i> = c'est quelqu'un de discret</td><td><i>Está callado</i> = il se tait en ce moment</td></tr>\n</table>\n<div class=\"warn\"><b>Cas particuliers à mémoriser :</b>\n<ul>\n<li>la localisation se fait TOUJOURS avec <i>estar</i>, même pour les événements… sauf que l'heure/la date se dit avec <i>ser</i> ;</li>\n<li>« être d'accord » : <i>Estoy de acuerdo</i> (estar) ;</li>\n<li>avec un gérondif (action en cours), c'est toujours <i>estar</i> : <i>Estoy estudiando</i> ;</li>\n<li>la mort est un état : <i>estar muerto</i>, jamais <i>ser muerto</i>.</li>\n</ul>\n</div>\n\n<h3>5. S'entraîner : méthode en 3 questions</h3>\n<p>Pour choisir entre <i>ser</i> et <i>estar</i>, posez-vous ces trois questions dans l'ordre :</p>\n<ol>\n<li><b>Y a-t-il un lieu ?</b> → <i>estar</i> (<i>¿Dónde está el museo?</i>) ;</li>\n<li><b>Y a-t-il un gérondif (-ando / -iendo) ou un participe résultant ?</b> → <i>estar</i> (<i>Estamos comiendo</i>, <i>La tienda está cerrada</i>) ;</li>\n<li><b>Est-ce une caractéristique qui définit (identité, origine, profession, caractère, heure) ?</b> → <i>ser</i>. Sinon, si c'est un état passager (humeur, santé, circonstance) → <i>estar</i>.</li>\n</ol>\n<details class=\"ex-util\"><summary>💡 Focus sur... — corriger un texte mêlant ser et estar</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Corrigez : « Ana es en la biblioteca. Hoy está su cumpleaños. Es muy cansada porque está muy simpática siempre. »</div><div class=\"etu\"><b>Étape 1 — Lieu</b> : « Ana es en la biblioteca » → un lieu exige <i>estar</i> : <i>Ana está en la biblioteca</i>.</div><div class=\"etu\"><b>Étape 2 — Date</b> : « Hoy está su cumpleaños » → date/événement calendaires = <i>ser</i> : <i>Hoy es su cumpleaños</i>.</div><div class=\"etu\"><b>Étape 3 — États et caractère</b> : « Es muy cansada » = état passager → <i>Está muy cansada</i> ; « está muy simpática siempre » = caractère permanent → <i>es muy simpática siempre</i>.</div><div class=\"etu\"><b>Étape 4 — Relire avec la question-test</b> : pour chaque « est », demander « essence ou situation ? » — la logique (durée) doit guider chaque choix, pas l'habitude du français.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Ne pas traduire « être » toujours par <i>ser</i> : le lieu, l'humeur et la santé demandent <i>estar</i>.</li>\n<li>Un événement a lieu quelque part : <i>La fiesta está en el jardín</i> (lieu) mais <i>La fiesta es el sábado</i> (date).</li>\n<li>Les adjectifs changent de sens : <i>listo</i> (intelligent) vs <i>listo</i> (prêt), <i>aburrido</i> (ennuyeux) vs <i>aburrido</i> (qui s'ennuie) — toujours vérifier le verbe.</li>\n<li><i>Está muerto</i> (état) et non <i>es muerto</i> — piège récurrent hérité du français.</li>\n<li>Attention aux accents : <i>esta</i> (ce/cette) sans accent ≠ <i>está</i> (il/elle est) ; <i>estás</i> ≠ <i>estas</i> (ces).</li>\n<li>Avec <i>de acuerdo</i> : <i>Estoy de acuerdo</i> — jamais <i>soy de acuerdo</i>.</li>\n</ul>\n</div>"

  "titre": "Le passé : indefinido et imperfecto",
  "cours": "<div class=\"cours-head\"><h2>Pretérito indefinido y imperfecto</h2><span class=\"niv\">Espagnol</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le pretérito indefinido : l'action ponctuelle</h3>\n<ul>\n<li><b>réguliers -ar</b> : hablé, hablaste, habló, hablamos, hablasteis, hablaron ;</li>\n<li><b>réguliers -er/-ir</b> : comí, comiste, comió, comimos, comisteis, comieron (viví, viviste...) ;</li>\n<li><b>emplois</b> : action terminée à un moment <b>défini</b> du passé (ayer, el año pasado, en 2018) ; succession d'actions : <i>Me levanté, desayuné y salí.</i></li>\n</ul>\n<div class=\"tip\"><b>Irréguliers fréquents</b> : <b>fui, fuiste, fue, fuimos, fuisteis, fueron</b> (ser ET ir — mêmes formes !), tuve (tener), hice (hacer), dije (decir), estuve (estar), pude (poder), puse (poner), quise (querer), vine (venir), vi (ver), di (dar), supe (saber).</div>\n\n<h3>2. Le pretérito imperfecto : le décor du passé</h3>\n<ul>\n<li><b>formation très régulière</b> : -ar → -aba (hablaba, hablabas, hablaba, hablábamos, hablabais, hablaban) ; -er/-ir → -ía (comía, vivía...) ;</li>\n<li><b>seuls 3 irréguliers</b> : ser → era (era, eras, era, éramos, erais, eran) ; ir → iba ; ver → veía ;</li>\n<li><b>emplois</b> : description (<i>Hacía sol y los pájaros cantaban</i>) ; habitude répétée (<i>De niño, jugaba al fútbol todos los días</i>) ; action en cours interrompue (<i>Dormía cuando sonó el teléfono</i>) ; l'âge et l'heure au passé (<i>Tenía diez años. Eran las cinco.</i>).</li>\n</ul>\n\n<h3>3. Le test de choix : photo ou film ?</h3>\n<table>\n<tr><th>Critère</th><th>Indefinido</th><th>Imperfecto</th></tr>\n<tr><td><b>Action</b></td><td>ponctuelle, datée (ayer, anoche, en 2010)</td><td>habitude (todos los días), description</td></tr>\n<tr><td><b>Image</b></td><td>un cliché (il arriva, il fit)</td><td>un plan large (il faisait beau, il avait 10 ans)</td></tr>\n<tr><td><b>Marqueurs</b></td><td>ayer, anoche, el mes pasado, de repente</td><td>todos los días, siempre, cada verano, mientras</td></tr>\n<tr><td><b>Exemple</b></td><td><i>Ayer fui al cine.</i></td><td><i>Antes iba al cine cada semana.</i></td></tr>\n</table>\n<div class=\"tip\"><b>La combinaison classique</b> : imperfecto (décor / action en cours) + indefinido (interruption) : <i>Leía un libro cuando de repente sonó el teléfono.</i> ; <b>mientras</b> + imperfecto : <i>Mientras cocinaba, escuchaba música.</i></div>\n\n<h3>4. S'entraîner : raconter les vacances</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — un récit en Andalousie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Raconte tes vacances en Andalousie : le voyage (daté), le lieu (description), une tempête soudaine, les visites.</div><div class=\"etu\"><b>Étape 1 — Le voyage daté → indefinido</b> : <i>El verano pasado viajé a Andalucía con mi familia. Llegamos a Sevilla el 10 de julio y visitamos la Giralda.</i></div><div class=\"etu\"><b>Étape 2 — Le décor → imperfecto</b> : <i>Hacía mucho calor. El hotel era antiguo y estaba cerca de la catedral. Todos los días desayunábamos churros.</i></div><div class=\"etu\"><b>Étape 3 — L'interruption → les deux temps</b> : <i>Una tarde, mientras paseábamos por el parque, de repente empezó a llover.</i> (paseábamos : en cours ; empezó : interruption).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : chaque phrase du récit = une question : photo (indefinido) ou film (imperfecto) ? Un récit bien construit alterne sans cesse les deux temps.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>la faute reine : l'indefinido pour une habitude : « De niño fui al parque todos los días » ✗ → <i>iba</i> ✓ ;</li>\n<li><b>fui</b> = « je fus » OU « j'allai » : <i>Fui médico</i> (je fus) / <i>Fui al médico</i> (j'allai) — le contexte décide ;</li>\n<li>à l'imperfecto, 1re et 3e personne du singulier sont <b>identiques</b> : hablaba = je parlais / il parlait.</li>\n</ul>\n</div>"

  "id": "futuro-condicional",
  "theme": "Le futur et le conditionnel (Espagnol)",
  "niveau": "Collège/Lycée — Espagnol",
  "titre": "Le futur et le conditionnel",
  "cours": "<div class=\"cours-head\"><h2>El futuro y el condicional</h2><span class=\"niv\">Espagnol</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Formation : l'infinitif + terminaison</h3>\n<ul>\n<li><b>futur</b> : infinitif + é, ás, á, emos, éis, án : hablar<b>é</b>, comer<b>é</b>, vivir<b>é</b> — l'infinitif reste <b>entier</b> (jamais coupé !) ;</li>\n<li><b>conditionnel</b> : infinitif + ía, ías, ía, íamos, íais, ían : hablar<b>ía</b>, comer<b>ía</b> ;</li>\n<li><b>accents</b> : portés sur la terminaison : hablar<b>é</b>, com<b>í</b>a (sauf hablaremos, hablaréis).</li>\n</ul>\n\n<h3>2. Les 12 verbes irréguliers (racines communes aux deux temps)</h3>\n<table>\n<tr><th>Verbe</th><th>Racine</th><th>Futur (yo)</th><th>Conditionnel (yo)</th></tr>\n<tr><td>tener</td><td>tendr-</td><td>tendré</td><td>tendría</td></tr>\n<tr><td>hacer</td><td>har-</td><td>haré</td><td>haría</td></tr>\n<tr><td>decir</td><td>dir-</td><td>diré</td><td>diría</td></tr>\n<tr><td>salir</td><td>saldr-</td><td>saldré</td><td>saldría</td></tr>\n<tr><td>venir</td><td>vendr-</td><td>vendré</td><td>vendría</td></tr>\n<tr><td>poner</td><td>pondr-</td><td>pondré</td><td>pondría</td></tr>\n<tr><td>poder</td><td>podr-</td><td>podré</td><td>podría</td></tr>\n<tr><td>querer</td><td>querr-</td><td>querré</td><td>querría</td></tr>\n<tr><td>saber</td><td>sabr-</td><td>sabré</td><td>sabría</td></tr>\n<tr><td>haber</td><td>habr-</td><td>habré</td><td>habría</td></tr>\n<tr><td>caber</td><td>cabr-</td><td>cabré</td><td>cabría</td></tr>\n</table>\n<div class=\"tip\"><b>ser et ir sont réguliers</b> : seré, iré (et sería, iría). Astuce : les racines irrégulières sont les mêmes au futur ET au conditionnel — on les apprend UNE fois pour deux temps !</div>\n\n<h3>3. Les emplois</h3>\n<ul>\n<li><b>futur simple</b> : action future (<i>Mañana estudiaré todo el día</i>) ; promesse (<i>Te llamaré esta noche</i>) ; prédiction (<i>Lloverá mañana</i>) ;</li>\n<li><b>futur de probabilité</b> (très courant !) : conjecture sur le présent : <i>¿Qué hora es? — Serán las diez</i> (il doit être ~10 h) ; <i>Tendrá unos veinte años</i> ;</li>\n<li><b>conditionnel</b> : politesse (<i>¿Podría ayudarme?</i>) ; souhait (<i>Me gustaría viajar</i>) ; hypothèse (<i>Si tuviera dinero, compraría una casa</i>) ; conseil (<i>Yo que tú, hablaría con ella</i>).</li>\n</ul>\n\n<h3>4. S'entraîner : projets et conseils</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — proyectos y consejos</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écris 4 phrases : (1) tes études l'année prochaine (futur), (2) une prédiction météo, (3) ce que tu aimerais faire plus tard (conditionnel), (4) un conseil à un ami qui a raté son contrôle.</div><div class=\"etu\"><b>Étape 1 — Futur des projets</b> : <i>El año que viene estudiaré en Sevilla. Haré un intercambio con una familia española.</i></div><div class=\"etu\"><b>Étape 2 — Prédiction</b> : <i>Creo que lloverá este fin de semana, pero hará sol el lunes.</i></div><div class=\"etu\"><b>Étape 3 — Conditionnel : vœu et conseil</b> : <i>Me gustaría trabajar como profesora. Yo que tú, hablaría con el profesor para pedir otra oportunidad.</i></div><div class=\"etu\"><b>Étape 4 — Conclure</b> : projet/prédiction → futur (-é/-á) ; souhait/politesse/hypothèse → conditionnel (-ía) : l'irrégulier s'apprend une fois, sert deux fois.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>couper l'infinitif : « com**é » ✗ → <b>comeré</b> ✓ (mais les irréguliers raccourcissent la racine : poner → pondré) ;</li>\n<li>confondre <b>haría</b> (hacer) et <b>habría</b> (haber) ;</li>\n<li>le conditionnel ne s'emploie JAMAIS dans la subordonnée en SI : <i>Si tendría tiempo</i> ✗ → <i>Si tuviera tiempo, estudiaría</i> ✓.</li>\n</ul>\n</div>"

  "niveau": "Collège/Lycée — Espagnol",
  "titre": "Genre et nombre",
  "cours": "<div class=\"cours-head\"><h2>Genre et nombre</h2><span class=\"niv\">Espagnol</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le masculin et le féminin</h3>\n<ul>\n<li><b>règle générale</b> : l'adjectif en -o fait son féminin en -a : <i>Juan es alto. Ana es alta. Los niños son altos. Las niñas son altas.</i> ;</li>\n<li><b>adjectif finissant par une consonne</b> : féminin en +a : <i>un profesor español → una profesora española</i> ; francés → francesa ; alemán → alemana ;</li>\n<li><b>adjectifs invariables en genre</b> : les couleurs <i>verde, azul, gris, marrón, rosa</i> ; les adjectifs en -e (<i>inteligente, paciente, grande, fuerte</i>) ; en -ista (<i>optimista, realista</i>) ; <i>feliz</i> (mais pluriel : felices).</li>\n</ul>\n\n<h3>2. Le singulier et le pluriel</h3>\n<ul>\n<li>finissant par <b>voyelle → +s</b> : libro → libros ; alta → altas ; grande → grandes ;</li>\n<li>finissant par <b>consonne → +es</b> : ciudad → ciudades ; azul → azules ; marrón → marrones ;</li>\n<li><b>-z → -ces</b> : luz → luces ; feliz → felices ; andaluz → andaluces ;</li>\n<li>mots en -s accentué : autobús → autobuses ; les jours (lunes, jueves) : invariables.</li>\n</ul>\n\n<h3>3. Les pièges des noms</h3>\n<ul>\n<li><b>noms masculins</b> : el problema, el tema, el planeta, el día, el mapa, el corazón (les -ma d'origine grecque !) ;</li>\n<li><b>noms féminins</b> : la mano (féminin malgré le -o !), la foto(graphía), la moto(rcicleta), la clase, la noche, la ciudad ;</li>\n<li><b>-dad / -tad / -ción / -sión</b> : féminins : la universidad, la libertad, la información ;</li>\n<li>le genre n'est pas toujours devinable : apprendre chaque nom <b>avec son article</b> (el/la + nom) est la méthode sûre.</li>\n</ul>\n\n<h3>4. S'entraîner : décrire sa classe et ses amis</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la description complète</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décris ta classe : la salle, le tableau, deux ami(e)s (nationalités, caractères) et l'ambiance.</div><div class=\"etu\"><b>Étape 1 — Les noms avec leur genre</b> : <i>La clase es grande y luminosa. La pizarra es verde y las sillas son azules.</i></div><div class=\"etu\"><b>Étape 2 — Les adjectifs accordés</b> : <i>Mi amiga Marta es española, muy inteligente y simpática. Mi amigo Pablo es francés, alto y hablador.</i></div><div class=\"etu\"><b>Étape 3 — Le pluriel général</b> : <i>Los alumnos son optimistas y las profesoras son pacientes.</i></div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la description mobilise toute la chaîne : nom (genre) → article (accord) → adjectif (genre ET nombre) ; la relecture systématique (chaque adjectif : m/f ? s/pl ?) élimine la faute la plus fréquente des copies.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« la problema » ✗ → <b>el problema</b> (masculin !) ;</li>\n<li>« el mano » ✗ → <b>la mano</b> (féminin !) ;</li>\n<li>adjectif de couleur composé invariable : <i>pantalones azul marino</i> (bleu marine ne s'accorde pas !).</li>\n</ul>\n</div>"
 },
 {
  "id": "pronoms-complements",
  "theme": "Les pronoms compléments : lo, la, le, se (Espagnol)",
  "niveau": "Collège/Lycée — Espagnol",
  "titre": "Les pronoms compléments",
  "cours": "<div class=\"cours-head\"><h2>Los pronombres de complemento</h2><span class=\"niv\">Espagnol</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. COD et COI : choisir le pronom</h3>\n<ul>\n<li><b>COD (quoi ? qui ?)</b> : lo, la, los, las — accord en genre et nombre : <i>Compro el pan → <b>Lo</b> compro. Veo a María → <b>La</b> veo.</i> ;</li>\n<li><b>COI (à qui ? pour qui ?)</b> : le, les (invariables en genre, personnes seulement) : <i>Escribo a mi abuela → <b>Le</b> escribo.</i> ;</li>\n<li><b>test</b> : si « à » disparaît → COD (lo) ; si « à » reste → COI (le) : « Je vois Marie » (qui ? → la) ; « J'écris à Marie » (à qui ? → le).</li>\n</ul>\n\n<h3>2. La place des pronoms</h3>\n<table>\n<tr><th>Contexte</th><th>Placement</th><th>Exemple</th></tr>\n<tr><td>Verbe conjugué</td><td>AVANT le verbe</td><td><i><b>Me</b> llamo Ana. / <b>Lo</b> quiero.</i></td></tr>\n<tr><td>Infinitif</td><td>COLLÉ à la fin</td><td><i>Quiero ver<b>lo</b>. / Voy a llamar<b>la</b>.</i></td></tr>\n<tr><td>Gérondif</td><td>COLLÉ à la fin</td><td><i>Estoy leyéndo<b>lo</b>.</i></td></tr>\n<tr><td>Impératif affirmatif</td><td>COLLÉ à la fin</td><td><i>Dime la verdad. / Cállate.</i></td></tr>\n<tr><td>Impératif négatif</td><td>AVANT</td><td><i><b>No</b> me digas nada.</i></td></tr>\n</table>\n\n<h3>3. La règle du « se » : quand le et lo se rencontrent</h3>\n<ul>\n<li>quand un COI (le/les) précède un COD (lo/la/los/las), le COI devient <b>se</b> : <i>Le doy el libro → <b>Se</b> lo doy.</i> ;</li>\n<li><i>Les compro flores → <b>Se</b> las compro.</i> ; <i>¿Le explicas la lección a Juan? → Sí, <b>se</b> la explico.</i> ;</li>\n<li>« Le lo doy » est IMPOSSIBLE en espagnol correct : toujours « se lo doy ».</li>\n</ul>\n\n<h3>4. Les pronoms réfléchis</h3>\n<ul>\n<li><b>me, te, se, nos, os, se</b> : <i>Me lavo</i> (je me lave), <i>Te levantas</i>, <i>Se llama Ana</i>, <i>Nos divertimos</i> ;</li>\n<li>verbes réfléchis courants : levantarse, llamarse, ducharse, divertirse, sentirse, despertarse, ponerse ;</li>\n<li>avec <b>gustar</b> : <i>Me gusta el fútbol</i> — le pronom COI + gusta ; <i>Me gust<b>an</b> los deportes</i> (accord avec ce qui plaît).</li>\n</ul>\n\n<h3>5. S'entraîner : un échange de cadeaux</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la mécanique des pronoms</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Réécris avec pronoms : (1) « Compro flores para mi madre. » (2) « Doy las flores a mi madre. » (3) « Mi madre me dice gracias. » (4) « Quiero dar un abrazo a mi madre. »</div><div class=\"etu\"><b>Étape 1 — COD ou COI ?</b> : (1) « flores » = COD → <i><b>Las</b> compro (para mi madre)</i> ; (2) « las flores » = COD, « a mi madre » = COI → combinaison !</div><div class=\"etu\"><b>Étape 2 — La règle du se</b> : (2) le + las impossible → <i><b>Se las doy</b></i> ; (3) <i>Mi madre <b>me</b> dice gracias</i> (me = à moi, COI).</div><div class=\"etu\"><b>Étape 3 — Infinitif collé</b> : (4) → <i>Quiero darle un abrazo.</i> (ou : Quiero dárselo — se + lo !).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : trois questions dans l'ordre — identifier (COD ? COI ?), placer (avant/fin), combiner (le+lo → se) — et n'importe quelle phrase à pronoms devient mécanique.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Lo veo a María » ✗ → <i><b>La</b> veo</i> (personne = la) ;</li>\n<li>« Le lo doy » ✗ → <i><b>Se</b> lo doy</i> ;</li>\n<li>ne pas oublier le réfléchi : « lavo » = je lave (autre chose) ; « <b>me</b> lavo » = je me lave ;</li>\n<li>« Me gusta los deportes » ✗ → <i>Me gust<b>an</b> los deportes</i>.</li>\n</ul>\n</div>"
 },
 {
  "id": "imperativo-subjuntivo",
  "theme": "L'impératif et une introduction au subjonctif (Espagnol)",
  "niveau": "Collège/Lycée — Espagnol",
  "titre": "L'impératif et le subjonctif",
  "cours": "<div class=\"cours-head\"><h2>El imperativo y el subjuntivo</h2><span class=\"niv\">Espagnol</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'impératif affirmatif</h3>\n<ul>\n<li><b>tú (règle générale)</b> : 2e personne du présent SANS le s : hablar → <b>¡Habla!</b> ; comer → <b>¡Come!</b> ; escribir → <b>¡Escribe!</b> ;</li>\n<li><b>8 irréguliers fameux</b> : tener → <b>¡Ten!</b>, venir → <b>¡Ven!</b>, poner → <b>¡Pon!</b>, salir → <b>¡Sal!</b>, hacer → <b>¡Haz!</b>, decir → <b>¡Di!</b>, ir → <b>¡Ve!</b>, ser → <b>¡Sé!</b> ;</li>\n<li><b>usted</b> (politesse) : ¡Hable! ¡Coma! ¡Escriba! ; <b>vosotros</b> : remplacer le r final par d : ¡Hablad! ¡Comed! ¡Escribid!</li>\n</ul>\n\n<h3>2. L'impératif négatif : le subjonctif</h3>\n<ul>\n<li><b>No + subjonctif présent</b> : hablar → <b>¡No hables!</b> ; comer → <b>¡No comas!</b> ; ir → <b>¡No vayas!</b> ; ser → <b>¡No seas!</b> ;</li>\n<li>la diphtongue REVIENT : pensar → ¡No pienses! ; volver → ¡No vuelvas! ; dormir → ¡No duermas! ;</li>\n<li>le contraste à mémoriser : ¡Habla! (affirmatif) mais ¡No hables! (négatif) — une terminaison différente.</li>\n</ul>\n\n<h3>3. Le subjonctif présent : formation et emplois</h3>\n<ul>\n<li><b>formation</b> : 1re personne du présent, changement de la voyelle finale : -ar → e (hablo → hable, hables, hable, hablemos, habléis, hablen) ; -er/-ir → a (como → coma, viva) ;</li>\n<li><b>diphtongues conservées</b> aux personnes de la « botte » : volver → vuelva, vuelvas, volvamos, volváis, vuelvan ;</li>\n<li><b>vouloir que</b> : <i>Quiero que vengas.</i> ; <b>émotion</b> : <i>Me alegra que estés aquí. Espero que lo pases bien.</i> ;</li>\n<li><b>doute / nécessité</b> : <i>No creo que sea verdad. Es importante que estudies.</i> ;</li>\n<li><b>autres déclencheurs</b> : cuando + futur (<i>Cuando venga, avísame</i>), para que, antes que, aunque.</li>\n</ul>\n\n<h3>4. S'entraîner : les conseils de santé</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — consejos de salud</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un ami est malade. Donne-lui : (1) un ordre positif (se reposer), (2) un conseil négatif (ne pas sortir), (3) une phrase avec « je veux que » (tu guérisses vite), (4) une phrase avec « j'espère que ».</div><div class=\"etu\"><b>Étape 1 — Impératif affirmatif</b> : <i>¡<b>Descansa</b> mucho y <b>toma</b> tus medicinas!</i> (formes régulières).</div><div class=\"etu\"><b>Étape 2 — Impératif négatif (subjonctif)</b> : <i>¡<b>No salgas</b> de casa esta semana!</i> (salir → no salgas).</div><div class=\"etu\"><b>Étape 3 — Vouloir que + subjonctif</b> : <i>Quiero que <b>te mejores</b> pronto. Espero que <b>vuelvas</b> al instituto el lunes.</i></div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la santé est LE contexte idéal du subjonctif (émotion + vœux) : trois déclencheurs (quiero que, espero que, es importante que), un temps — le subjonctif des vœux est le plus simple à mémoriser.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>le contraste espérer/croire : <i>Creo que es verdad</i> (indicatif — affirmation) vs <i>No creo que <b>sea</b> verdad</i> (subjonctif — doute) !</li>\n<li>« Espero que vienes » ✗ → <i>Espero que <b>vengas</b></i> (esperar que + subj., TOUJOURS) ;</li>\n<li>l'impératif de ir (¡Ve!) et de ser (¡Sé!) se ressemblent — l'accent les distingue à l'écrit ;</li>\n<li>cuando + futur → subjonctif : <i>Cuando <b>llegue</b>, te llamaré.</i></li>\n</ul>\n</div>"
 },

  "id": "lexique-cotidien",
  "theme": "Lexique de la vie quotidienne (Espagnol)",
  "niveau": "Collège/Lycée — Espagnol",
  "titre": "Lexique de la vie quotidienne",
  "cours": "<div class=\"cours-head\"><h2>Vocabulario cotidiano</h2><span class=\"niv\">Espagnol</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Saluer et remercier</h3>\n<ul>\n<li><b>salutations</b> : ¡Hola! ; Buenos días (jusqu'à ~13 h) ; Buenas tardes ; Buenas noches ;</li>\n<li><b>au revoir</b> : Adiós, Hasta luego, Hasta mañana, Hasta pronto, Nos vemos ;</li>\n<li><b>politesse</b> : Por favor, Gracias / Muchas gracias, De nada, Perdón/Perdone, Lo siento, Mucho gusto — El gusto es mío ;</li>\n<li><b>comment ça va</b> : ¿Qué tal? / ¿Cómo estás? — Bien, gracias. / Regular. / Mal. / Muy bien, ¿y tú?</li>\n</ul>\n\n<h3>2. La famille et la personne</h3>\n<table>\n<tr><th>Espagnol</th><th>Français</th><th>Espagnol</th><th>Français</th></tr>\n<tr><td>los padres</td><td>les parents</td><td>los hermanos</td><td>les frères et sœurs</td></tr>\n<tr><td>el hermano / la hermana</td><td>le frère / la sœur</td><td>el abuelo / la abuela</td><td>le grand-père / la grand-mère</td></tr>\n<tr><td>el tío / la tía</td><td>l'oncle / la tante</td><td>el primo / la prima</td><td>le cousin / la cousine</td></tr>\n<tr><td>el hijo / la hija</td><td>le fils / la fille</td><td>el novio / la novia</td><td>le petit ami / la petite amie</td></tr>\n<tr><td>la edad</td><td>l'âge</td><td>el cumpleaños</td><td>l'anniversaire</td></tr>\n</table>\n<div class=\"warn\"><b>Faux-amis à connaître</b> : los padres = les parents (le père seul = el padre) ; una biblioteca = une bibliothèque (une librairie = una librería !) ; largo = long (large = ancho) ; una fábrica = une usine ; asistir = assister à (aider = ayudar).</div>\n\n<h3>3. L'école et les loisirs</h3>\n<ul>\n<li><b>école</b> : el instituto (le lycée), la escuela, la asignatura (la matière), el examen, los deberes (les devoirs), el recreo (la récré), el/la profesor(a), el boletín de notas (le bulletin) ;</li>\n<li><b>loisirs</b> : jugar al fútbol/baloncesto, escuchar música, leer, navegar por internet, quedar con los amigos, ir de compras, dar un paseo, el fin de semana.</li>\n</ul>\n\n<h3>4. Nourriture et achats</h3>\n<ul>\n<li><b>repas</b> : el desayuno (petit-déjeuner), la comida (déjeuner), la merienda (goûter), la cena (dîner) ; el pan, el queso, la carne, el pescado, la fruta, las verduras, el postre ;</li>\n<li><b>au restaurant</b> : la carta (la carte), la cuenta (l'addition), el camarero — ¡Camarero, la cuenta por favor! ;</li>\n<li><b>achats</b> : ¿Cuánto cuesta? (combien ça coûte ?), caro/barato, el dinero, la tienda, el mercado, el tamaño (la taille), ¿Tiene...?, la rebaja (la réduction).</li>\n</ul>\n\n<h3>5. S'entraîner : survivre une journée à Madrid</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — el día de un viajero</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Scénario : matin à l'hôtel, achat au marché, déjeuner, après-midi musée, soirée. Écris les phrases clés de chaque étape.</div><div class=\"etu\"><b>Étape 1 — Matin</b> : <i>Buenos días, ¿qué tal? — Bien, gracias. ¿Me pone un café con leche, por favor?</i> (salutation + commande polie).</div><div class=\"etu\"><b>Étape 2 — Marché et déjeuner</b> : <i>¿Cuánto cuesta el kilo de naranjas? — Dos euros. — Me da un kilo, por favor.</i> ; au restaurant : <i>La cuenta, por favor. — ¿Con tarjeta? — No, en efectivo.</i></div><div class=\"etu\"><b>Étape 3 — Soirée</b> : <i>Muchas gracias por todo. — De nada. ¡Hasta mañana!</i></div><div class=\"etu\"><b>Étape 4 — Conclure</b> : le scénario du voyageur tient en cinq blocs : saluer, demander (por favor), payer (¿cuánto cuesta?), remercier (gracias/de nada), partir (hasta luego) — l'apprentissage par situations est le plus efficace : chaque bloc se mémorise en bloc.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>una librería = une librairie ; une bibliothèque = una biblioteca ;</li>\n<li>asistir a = assister à (pas aider !) ;</li>\n<li>« Me gusta los deportes » ✗ → <i>Me gustan los deportes</i> (accord de gustar).</li>\n</ul>\n</div>"
 },
 {
  "id": "civilisation-espagne",
  "theme": "Civilisation : l'Espagne (Espagnol)",
  "niveau": "Collège/Lycée — Espagnol",
  "titre": "Civilisation : l'Espagne",
  "cours": "<div class=\"cours-head\"><h2>Civilisation : España</h2><span class=\"niv\">Espagnol</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Repères historiques</h3>\n<ul>\n<li><b>1936-1939 : la guerre civile</b> (la Guerra Civil) — républicains contre nationaux (Franco) ; Guernica (Picasso, 1937) en devient le symbole ;</li>\n<li><b>1939-1975 : la dictature de Franco</b> — censure, répression, isolement, puis développement économique des années 60 (tourisme) ;</li>\n<li><b>1975 : mort de Franco</b> — début de la <b>Transición</b> : Juan Carlos Ier devient roi (désigné par Franco !) mais conduit la démocratisation avec Adolfo Suárez ;</li>\n<li><b>1978 : la Constitution</b> — État de droit, monarchie parlementaire, Estado de las Autonomías ; légalisation des partis (dont le PCE, 1977), amnistie ;</li>\n<li><b>1986 : entrée dans la CEE</b> — essor économique ; JO de Barcelone et Expo de Séville (1992) ;</li>\n<li><b>2004+</b> : attentats du 11-M, crise de 2008 (chômage des jeunes), Indignados (2011), question catalane (2017).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"25\" y1=\"62\" x2=\"423\" y2=\"62\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"423,62 413,57 413,67\" fill=\"#4f46e5\"/><circle cx=\"25.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"25.0\" y1=\"62\" x2=\"25.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"25.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1936</text><text x=\"25.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Guerra Civil (1936-39)</text><circle cx=\"103.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"103.0\" y1=\"62\" x2=\"103.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"103.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1939</text><text x=\"103.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Dictature de Franco</text><circle cx=\"181.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"181.0\" y1=\"62\" x2=\"181.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"181.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1975</text><text x=\"181.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Mort de Franco,</text><text x=\"181.0\" y=\"42\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Transición</text><circle cx=\"259.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"259.0\" y1=\"62\" x2=\"259.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"259.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1978</text><text x=\"259.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Constitution démocratique</text><circle cx=\"337.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"337.0\" y1=\"62\" x2=\"337.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"337.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1986</text><text x=\"337.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Entrée dans la</text><text x=\"337.0\" y=\"42\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">CEE</text><circle cx=\"415.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"415.0\" y1=\"62\" x2=\"415.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"415.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2017</text><text x=\"415.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Question catalane</text></svg><span class=\"fig-cap\">L’Espagne contemporaine : de la guerre civile à la démocratie — la Transición (1975-1978) reste le moment fondateur de l’Espagne actuelle.</span></div>\n<h3>2. L'Espagne des autonomies</h3>\n<ul>\n<li><b>17 comunidades autónomas</b> (+ Ceuta et Melilla) : Andalucía, Cataluña, País Vasco, Galicia, Madrid, Comunidad Valenciana... ;</li>\n<li><b>langues co-officielles</b> : le castillan (officiel de l'État) + catalan, euskera (basque), gallego, occitan (Val d'Aran) ;</li>\n<li><b>statuts d'autonomie</b> : chaque communauté a son parlement et son gouvernement (la Generalitat en Catalogne, le Gobierno Vasco) — une décentralisation unique en Europe ;</li>\n<li>le thème catalan (referendum du 1er octobre 2017) et basque (l'ETA a déposé les armes en 2017) sont des sujets d'essais fréquents.</li>\n</ul>\n\n<h3>3. Institutions et société</h3>\n<ul>\n<li><b>monarchie parlementaire</b> : le roi (Felipe VI depuis 2014) est chef de l'État ; el presidente del gobierno (chef du gouvernement) est élu par le Congreso de los Diputados ;</li>\n<li><b>le Parlement</b> : Congreso + Senado ; deux grands partis : PSOE (socialiste) et PP (populaire), plus Podemos, Vox et les partis régionaux ;</li>\n<li><b>société</b> : ~80 millions de visiteurs/an (2e destination mondiale) ; la famille, les fiestas locales, la Semana Santa et le fútbol structurent la vie sociale.</li>\n</ul>\n\n<h3>4. Culture et figures</h3>\n<table>\n<tr><th>Domaine</th><th>Repères</th></tr>\n<tr><td><b>Littérature</b></td><td>Cervantes, Don Quijote (1605) ; García Lorca (fusillé en 1936) ; la génération de 27</td></tr>\n<tr><td><b>Peinture</b></td><td>Velázquez, Goya, Picasso (Guernica), Dalí, Miró</td></tr>\n<tr><td><b>Architecture</b></td><td>Gaudí (Sagrada Família, Barcelone) ; les cathédrales de Séville ; l'Alhambra de Grenade</td></tr>\n<tr><td><b>Musique/danse</b></td><td>le flamenco (Andalousie), la Movida madrileña (années 80, Almodóvar : la vague post-Franco)</td></tr>\n<tr><td><b>Sport</b></td><td>Real Madrid vs FC Barcelone (el clásico) ; Nadal ; la Roja (championne du monde 2010)</td></tr>\n</table>\n\n<h3>5. S'entraîner : un essai sur la Transition</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — el ensayo de civilización</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sujet : « La Transición : un miracle démocratique ? » Rédige une introduction (contexte + problématique + plan).</div><div class=\"etu\"><b>Étape 1 — Contexte historique</b> : <i>Después de la muerte de Franco en 1975, España tuvo que pasar de una dictadura de casi cuarenta años a una democracia moderna, sin guerra civil ni ruptura violenta.</i></div><div class=\"etu\"><b>Étape 2 — Problématique</b> : <i>¿Cómo fue posible este milagro democrático en tan poco tiempo?</i></div><div class=\"etu\"><b>Étape 3 — Annonce du plan</b> : <i>D'abord veremos el papel del rey Juan Carlos y de Adolfo Suárez ; luego analizaremos la Constitución de 1978 ; finalmente nos preguntaremos si la Transición terminó de verdad.</i></div><div class=\"etu\"><b>Étape 4 — Conclure</b> : l'essai de civilisation suit la même architecture qu'en anglais ou en français : contexte (dates exactes), problématique, plan — les repères de civilisation sont la MATIÈRE de l'argumentation, pas une liste à réciter.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>ne pas confondre la Guerra Civil (1936-39) et la dictature (1939-75) : la guerre PRÉCÈDE la dictature ;</li>\n<li>le castillan est la langue officielle de TOUT l'État ; catalan/basque/galicien sont co-officiels dans leurs communautés ;</li>\n<li>l'Espagne est une monarchie depuis 1978 (pas une république) — sauf 1873-74 et 1931-39 (les deux républiques) !</li>\n</ul>\n</div>"
 },

  "cours": "<div class=\"cours-head\"><h2>Civilisation : América Latina</h2><span class=\"niv\">Espagnol</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La conquête et le métissage</h3>\n<ul>\n<li><b>1492</b> : Christophe Colomb arrive aux Caraïbes — « rencontre des deux mondes » (encuentro) ou conquête (conquista) : les empires aztèque (Tenochtitlán, prise par Cortés en 1521) et inca (Pizarro, 1533) tombent ;</li>\n<li><b>le mestizaje</b> : le mélange des populations (européennes, indigènes, africaines) crée les sociétés latino-américaines — un concept central : aujourd'hui l'Amérique latine est majoritairement métisse ;</li>\n<li>les langues natives (quechua, guaraní, nahuatl) coexistent avec l'espagnol, qui a emprunté au nahuatl « chocolate » et « tomate » ;</li>\n<li><b>l'espagnol d'aujourd'hui</b> : ~480 millions de locuteurs natifs — la 2e langue maternelle du monde, dont l'essentiel en Amérique latine.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Frise chronologique\"><line x1=\"25\" y1=\"62\" x2=\"423\" y2=\"62\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/><polygon points=\"423,62 413,57 413,67\" fill=\"#4f46e5\"/><circle cx=\"25.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"25.0\" y1=\"62\" x2=\"25.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"25.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1492</text><text x=\"25.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Arrivée de Colomb</text><circle cx=\"103.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"103.0\" y1=\"62\" x2=\"103.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"103.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1521</text><text x=\"103.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Chute de Tenochtitlán</text><circle cx=\"181.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"181.0\" y1=\"62\" x2=\"181.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"181.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1810</text><text x=\"181.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Début des indépendances</text><circle cx=\"259.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"259.0\" y1=\"62\" x2=\"259.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"259.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1959</text><text x=\"259.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Révolution cubaine</text><circle cx=\"337.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"337.0\" y1=\"62\" x2=\"337.0\" y2=\"68\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"337.0\" y=\"80\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">1973</text><text x=\"337.0\" y=\"52\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Pinochet au Chili</text><circle cx=\"415.0\" cy=\"62\" r=\"4\" fill=\"#4f46e5\"/><line x1=\"415.0\" y1=\"62\" x2=\"415.0\" y2=\"56\" stroke=\"#c7d2fe\" stroke-width=\"1.5\"/><text x=\"415.0\" y=\"36\" font-size=\"10\" font-weight=\"bold\" fill=\"#4f46e5\" text-anchor=\"middle\">2019</text><text x=\"415.0\" y=\"84\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">Messi, Ballon d’Or</text><text x=\"415.0\" y=\"94\" font-size=\"8.5\" fill=\"#475569\" text-anchor=\"middle\">n°6</text></svg><span class=\"fig-cap\">L’Amérique latine : de la conquête (1492) aux indépendances (1810-1830), de la révolution cubaine (1959) aux dictatures puis aux démocraties contemporaines.</span></div>\n<h3>2. Les indépendances (1810-1830)</h3>\n<ul>\n<li><b>le contexte</b> : l'exemple des États-Unis (1776) et de la France (1789), l'invasion napoléonienne de l'Espagne (1808) ;</li>\n<li><b>les figures</b> : <b>Simón Bolívar</b> (el Libertador — Venezuela, Colombie, Équateur, Pérou, Bolivie — qui porte son nom !) ; <b>José de San Martín</b> (Argentine, Chili, Pérou) ; <b>Miguel Hidalgo</b> (le « cri de Dolores », 1810, Mexique) ;</li>\n<li><b>le résultat</b> : vers 1830, presque toute l'Amérique latine est indépendante — mais des républiques instables (caudillos, guerres civiles) et l'héritage des inégalités subsistent.</li>\n</ul>\n\n<h3>3. Le XXe et XXIe siècle</h3>\n<ul>\n<li><b>1959 : la révolution cubaine</b> — Fidel Castro et le Che Guevara renversent Batista ; Cuba devient socialiste (crise des missiles 1962 ; blocus américain toujours en vigueur) ;</li>\n<li><b>les dictatures militaires (années 60-80)</b> : Argentine (junta 1976-83, desaparecidos), Chili (Pinochet 1973-90), Brésil — puis les transitions démocratiques (les Madres de la Plaza de Mayo) ;</li>\n<li><b>aujourd'hui</b> : le Brésil et le Mexique, géants ; les maux persistants : inégalités (favelas), narcotráfico, corruption, migrations ; les succès mondiaux : reggaeton, séries, football — Messi et Maradona !</li>\n</ul>\n\n<h3>4. Culture et figures</h3>\n<table>\n<tr><th>Domaine</th><th>Repères</th></tr>\n<tr><td><b>Littérature</b></td><td>le realismo mágico : García Márquez (Cent ans de solitude, Nobel 1982), Borges, Vargas Llosa, Neruda, Octavio Paz</td></tr>\n<tr><td><b>Peinture</b></td><td>Frida Kahlo (autoportraits), Diego Rivera (muralisme), Botero</td></tr>\n<tr><td><b>Musique</b></td><td>le tango (Argentine), la salsa (Cuba/Porto Rico), la cumbia (Colombie), le reggaeton (Bad Bunny)</td></tr>\n<tr><td><b>Sport</b></td><td>Pelé (Brésil), Maradona et Messi (Argentine), la Copa América</td></tr>\n</table>\n\n<h3>5. S'entraîner : un exposé sur le métissage culturel</h3>\n<details class=\"ex-util\"><summary>💡 Focus sur... — el mestizaje</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sujet : « El mestizaje : la richesse de l'Amérique latine ? » Prépare trois arguments avec exemples datés.</div><div class=\"etu\"><b>Étape 1 — Argument historique</b> : <i>La conquista de 1492 creó sociedades mestizas : la lengua española se mezcló con las lenguas nativas — el náhuatl dio palabras como « chocolate » o « tomate » al español y al mundo.</i></div><div class=\"etu\"><b>Étape 2 — Argument culturel</b> : <i>La música es un crisol : el tango mezcla la habanera cubana y los ritmos africanos ; el reggaeton combina el reggae jamaicano y el hip-hop — hoy conquista el mundo.</i></div><div class=\"etu\"><b>Étape 3 — Argument critique</b> : <i>Sin embargo, el mestizaje tiene su cara oscura : la conquista fue también un genocidio (las enfermedades mataron millones de indígenas) y las desigualdades siguen hoy.</i></div><div class=\"etu\"><b>Étape 4 — Conclure</b> : l'essai équilibré : thèse (richesse), exemples (langue, musique), contre-point (le revers de la conquête) — trois blocs, une conclusion personnelle, et l'exposé est structuré.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>le Brésil est lusophone (portugais !) : l'Amérique HISPANIQUE l'exclut, l'Amérique LATINE l'inclut ;</li>\n<li>l'espagnol d'Amérique latine : ustedes remplace vosotros ; le vocabulaire varie (coche/carro, ordenador/computadora) ;</li>\n<li>Bolívar ≠ Bolivia : l'homme (vénézuélien) et le pays (qui porte son nom).</li>\n</ul>\n</div>"

  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li><b>Réguliers</b> : hablar → hablo, hablas, habla, hablamos, habláis, hablan ; comer → como... ; vivir → vivo... (accent écrit à la 2e plurielle).</li>\n<li><b>Diphtongues</b> : e→ie (quiero, pienso), o→ue (puedo, duermo), u→ue (juego) — jamais à nosotros/vosotros.</li>\n<li><b>Irréguliers clés</b> : soy, estoy, voy, tengo, hago, digo, veo, sé.</li>\n<li><b>hay</b> : impersonnel (il y a).</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Identifier le groupe (-ar / -er / -ir) puis vérifier diphtongue ou irrégularité.</li>\n<li>Toujours contrôler la 2e personne plurielle (accent écrit).</li>\n<li>Se présenter en mobilisant les trois familles (régulier, diphtongue, irrégulier).</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Pas de diphtongue à nosotros/vosotros.</li>\n<li>yo souvent omis (la terminaison suffit).</li>\n<li>habláis/coméis/vivís : l'accent !</li>\n</ul>"

{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Nosotros ___ español en clase » (aprender, -er)", "c": ["aprendemos", "aprenden", "aprendo", "aprendéis"], "a": 0, "e": "nosotros + verbe en -er : -emos → aprendemos.", "d": "<b>La terminaison de « nosotros »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : aprender = verbe en -er : la terminaison pour nosotros est <b>-emos</b> : <i>Nosotros <b>aprendemos</b> español en clase.</i> (nous apprenons l'espagnol en classe) : la grille complète du -er : -o, -es, -e, -emos, -éis, -en : les distracteurs reprennent d'autres personnes (aprendo = je, aprenden = ils) : au QCM, la méthode : (1) le sujet (nosotros) ; (2) le groupe du verbe (-er) ; (3) la terminaison correspondante (-emos) : réflexe d'or de toute conjugaison espagnole — et il fonctionne pour 90 % des verbes.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Yo ___ mucho » (poder)", "c": ["podo", "puedo", "podeis", "podemos"], "a": 1, "e": "poder diphtongue o→ue : yo puedo (je peux).", "d": "<b>La chaussure des diphtongues</b>.<div class='ex-detail'><u>Exemple rédigé</u> : poder change son o en <b>ue</b> aux personnes « fortes » : puedo, puedes, puede, pueden (et podéis) — MAIS pas à nous/vous : <b>podemos</b> (le o initial reste !) : la forme « podo » n'existe pas : le secret de mémorisation : les personnes qui diphtonguent (yo, tú, él, ellos) forment une <b>botte</b> (boot pattern) dans le tableau de conjugaison — nosotros/vosotros en sont exclus : dessiner la botte une fois et la retenir visuellement règle tous les verbes diphtongués (puedo, quiero, juego, duermo...).</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "Le présent de « tener » (avoir) :", "c": ["teno, tenes, tene, tenemos, tenéis, tienen", "tengo, tienes, tiene, tengamos, tenéis, tienen", "tengo, tienes, tiene, tenemos, tenéis, tienen", "tengo, tienes, tiene, tenemos, tenéis, tienan"], "a": 2, "e": "tener est irrégulier à la 1re personne : tengo — mais régulier ensuite (tienes, tiene, tenemos, tenéis, tienen).", "d": "<b>Tengo : l'irrégularité concentrée sur « yo »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Tengo quince años.</i> (j'ai quinze ans) : la particularité : l'ajout d'un <b>g</b> à la 1re personne (tengo) — puis la conjugaison redevient normale : tienes, tiene, tenemos, tenéis, tienen : la même famille de « yo en -go » : hacer → <b>hago</b>, poner → <b>pongo</b>, salir → <b>salgo</b>, venir → <b>vengo</b>, decir → <b>digo</b> : l'astuce d'examen : si le verbe finit en -cer/-cir/-enir et a un yo bizarre, chercher le -go : la formule « tengo hambre » (j'ai faim) — littéralement « j'ai faim », pas « je suis faim » : une différence de vision du monde entre le français et l'espagnol.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Ellos ___ al teatro los domingos » (ir)", "c": ["van", "van a", "vais", "ven"], "a": 0, "e": "ir (aller) : voy, vas, va, vamos, vais, VAN — ellos van (ils vont).", "d": "<b>Ir : le verbe-caméléon</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Ellos <b>van</b> al teatro los domingos.</i> (ils vont au théâtre le dimanche) : la conjugaison complète : voy, vas, va, vamos, vais, van — une racine v- minimaliste : le piège du distracteur « ven » : c'est le verbe VER (voir) — voy/ven se ressemblent à l'oreille ! : la distinction : ir (aller) → voy, vas, va ; ver (voir) → veo, ves, ve : autre usage clé : <b>ir a + infinitif</b> = futur proche : <i>Voy a estudiar esta tarde</i> (je vais étudier tout à l'heure) : les deux emplois (mouvement + futur proche) font de ir l'un des verbes les plus rentables à maîtriser.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "Quelle forme est correcte pour « vosotros » avec « hablar » ?", "c": ["hablan", "hablais", "habláis", "hablamos"], "a": 2, "e": "vosotros + -ar → habláis (avec accent écrit sur la terminaison -áis).", "d": "<b>L'accent qui change le sens</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la 2e personne du pluriel en -ar : <b>habláis</b> — avec accent sur le á : la même famille : com<b>éis</b>, viv<b>ís</b>, está<b>ís</b> : pourquoi l'accent compte : « hablais » sans accent violerait la règle de l'accentuation espagnole (le mot serait aigu en terminant en s, il exigerait l'accent) — l'accent écrit corrige la prononciation (ha-BLA-YS) : la confusion habláis/hablan : la terminaison -áis = vous (Espagne), la terminaison -an = ils/elles (ou ustedes) : ce point d'orthographe est très souvent relevé à l'écrit : le maîtriser évite la faute « gratuite ».</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Nosotros ___ una película esta noche » (pensar)", "c": ["piensan", "pienso", "piensamos", "pensamos"], "a": 3, "e": "pensar diphtongue (pienso) SAUF à nosotros/vosotros : pensamos.", "d": "<b>La botte, encore elle !</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la règle d'or des diphtongues : e→ie ou o→ue aux personnes de la « botte » (yo, tú, él/ella, ellos/ellas) MAIS la voyelle originale à nosotros/vosotros : <i>Nosotros <b>pensamos</b> una película esta noche.</i> (nous pensons/avons l'intention de regarder un film ce soir) — « piensamos » est la faute type : la logique historique : les formes nosotros/vosotros sont plus anciennes (héritées du latin, accentuées sur la racine étymologique) — les autres personnes ont évolué : la conséquence pratique : chaque fois que tu vois nous/vous + un verbe diphtonguant, vérifier deux fois la voyelle (pensamos, podéis, jugamos, duermos... non : dormimos ! — dormir est un -ir : dormimos, duermen).</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "Le présent de « hay » signifie :", "c": ["ils sont", "ils vont", "j'ai", "il y a"], "a": 3, "e": "hay = il y a (forme impersonnelle unique, invariable) : hay un libro, hay muchos libros.", "d": "<b>Hay, l'indispensable invariable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Hay</i> sert à exprimer l'EXISTENCE : <i>Hay un problema. / Hay muchos estudiantes en la clase.</i> (il y a un problème / de nombreux étudiants) : la particularité : forme UNIQUE, pas de conjugaison (pas de « hayn » pour le pluriel !) : l'origine : haber (avoir) — hoy surgió la forme figée : la nuance avec « está/están » : <i>hay</i> introduit du NOUVEAU (existence) ; <i>está</i> localise du déjà connu : <i>Hay una farmacia aquí. — ¿Dónde está? — Está en la esquina.</i> : en expression écrite, une phrase avec hay = un point de départ pour décrire (une ville, une école, une fête) : c'est le premier verbe à automatiser.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« ¿Qué ___ tú esta tarde ? » (hacer)", "c": ["haces", "hacéis", "hacen", "hago"], "a": 0, "e": "hacer à la 2e personne : haces — ¿Qué haces esta tarde ? (qu'est-ce que tu fais ce soir ?)", "d": "<b>Hacer : la question sociale par excellence</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>¿Qué <b>haces</b> tú esta tarde?</i> (que fais-tu ce soir ?) : la conjugaison : hago (yo, avec le g !), haces, hace, hacemos, hacéis, hacen : les usages essentiels : la météo (<i>Hace frío/calor/sol/viento</i> — il fait froid/chaud/soleil/vent : l'espagnol « fait » la météo avec hacer !) ; les expressions figées (<i>hacer los deberes, hacer deporte, hacer una pregunta</i>) : la question ¿Qué haces...? est l'ouverture parfaite d'un dialogue d'examen (projets, loisirs) : la réponse modèle : <i>Esta tarde hago los deberes y luego juego al fútbol.</i> — deux verbes irréguliers dans une phrase naturelle : la maîtrise de hacer rapporte à CHAQUE oral.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Yo no ___ nada » (saber)", "c": ["sé", "sepo", "sabe", "sabo"], "a": 0, "e": "saber : yo SÉ (accent écrit !) — je sais : Yo no sé nada (je ne sais rien).", "d": "<b>Sé : l'accent du savoir</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Yo no <b>sé</b> nada.</i> (je ne sais rien) : la conjugaison : sé, sabes, sabe, sabemos, sabéis, saben — l'accent écrit sur sé est obligatoire (il distingue le verbe du pronom réfléchi « se » !) : la nuance avec connaître : <i>saber</i> = savoir (un fait, faire quelque chose : <i>sé nadar</i> — je sais nager) ; <i>conocer</i> = connaître (une personne, un lieu : <i>conozco Madrid</i>) : la faute « sabo » est LA régularisation interdite : les verbes en -aber (saber, haber) refusent la terminaison normale au yo : « No sé » est la réponse la plus utile du voyageur — la connaître (avec son accent) ouvre toutes les conversations.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Mis amigos ___ fútbol cada sábado » (jugar)", "c": ["juegan", "jugan", "juegan a", "jugamos"], "a": 0, "e": "jugar est le seul verbe u→ue : ellos juegan (ils jouent).", "d": "<b>Jugar : la diphtongue solitaire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : jugar est le SEUL verbe espagnol avec la diphtongue <b>u→ue</b> : juego, juegas, juega, jugamos, jugáis, juegan : <i>Mis amigos <b>juegan</b> al fútbol cada sábado.</i> (mes amis jouent au football chaque samedi) : la préposition : <b>jugar A</b> + sport/jeu (jugar al fútbol, jugar a las cartas) — une particularité espagnole (comparer : jouer À en français, play - in anglais) : la logique de la diphtongue : le u tonique se renforce en ue (juego) — même mécanisme sonore que puedo/quiero : mémoriser jugar comme « l'exception ue » — il vient dans tous les textes sur les loisirs.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Madrid ___ en España » (lieu)", "c": ["es", "soy", "estoy", "está"], "a": 3, "e": "TOUT lieu (même permanent !) → estar : Madrid está en España.", "d": "<b>Le paradoxe du lieu</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la tentation : « Madrid est TOUJOURS en Espagne, donc permanent, donc ser » — FAUX : la règle espagnole est catégorique : tout emplacement, même éternel, prend <b>estar</b> : <i>Madrid <b>está</b> en España.</i> : la même logique : <i>El libro está en la mesa</i> (le livre est sur la table), <i>Barcelona está en el Mediterráneo</i> : l'astuce mnémotechnique : estar = l'existence LOCALISÉE (où ça se passe) ; ser = l'identité (ce que c'est) : la faute « es en España » est LE point piégeux du chapitre — la corriger distingue immédiatement le débutant de l'élève rodé.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Nosotros ___ franceses » (nationalité)", "c": ["son", "estamos", "somos", "están"], "a": 2, "e": "Nationalité, origine → ser : nosotros SOMOS franceses.", "d": "<b>L'origine, affaire de ser</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la nationalité fait partie de l'IDENTITÉ (ce que l'on est, définitionnellement) → <b>ser</b> : <i>Nosotros <b>somos</b> franceses.</i> (nous sommes français) : la famille de ser : origine (<i>soy de Lyon</i>), profession (<i>es médico</i>), identité (<i>es mi hermana</i>), heure (<i>son las cinco</i>), matière (<i>es difícil</i>) : la faute inverse : « estamos franceses » est absurde (on ne « se trouve pas » français !) : la logique profonde : ser répond à « ¿quién es? ¿qué es? » (qui ? quoi ?) ; estar répond à « ¿dónde? ¿cómo? » (où ? comment ?) : les deux questions d'identification évitent toute hésitation.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Hoy estoy muy ___ » (fatigué, état du jour)", "c": ["cansada", "estar cansado", "ser cansado", "cansado"], "a": 3, "e": "État momentané → estar + cansado (accord avec le sujet masculin : cansado).", "d": "<b>Comment on va, aujourd'hui</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'état passager (fatigue du jour) → <b>estar</b> : <i>Hoy estoy muy <b>cansado</b>.</i> (aujourd'hui je suis très fatigué) : l'accord : cansad<b>o</b> si le locuteur est masculin ; cansad<b>a</b> au féminin — l'adjectif s'accorde, pas le verbe : la nuance : <i>Está cansado</i> (il est fatigué — aujourd'hui) vs <i>Es trabajador</i> (il est travailleur — caractère) : la fatigue est un ÉTAT, la paresse un TRAIT : en dialogue d'examen, « ¿Cómo estás? — Estoy cansado pero contento » est l'échange-social de base : deux états, deux accords, un verbe estar impeccable.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Mi hermana ___ médica » (profession)", "c": ["estoy", "es", "está", "somos"], "a": 1, "e": "Profession = identité durable → ser : mi hermana es médica.", "d": "<b>La profession, une identité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : être médecin, c'est CE QU'ELLE EST (identité durable) → <b>ser</b> : <i>Mi hermana <b>es</b> médica.</i> (ma sœur est médecin) : en espagnol, la profession se dit SANS article (pas « una médica » — sauf nuance emphatique) : la famille ser : <i>Es profesor. Somos estudiantes.</i> : le contraste avec estar : on peut « estar de médica » (faire un remplacement, temporaire) — l'emploi de estar introduit la provisoire ! : la question d'examen : identité (ser) ou fonction passagère (estar) ? : dans la présentation orale (me llamo... soy estudiante... mi padre es ingeniero), le ser des professions est incontournable — un point d'entrée du dialogue.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Los niños ___ durmiendo » (en train de dormir)", "c": ["es", "son", "están", "estamos"], "a": 2, "e": "Présent progressif = estar + gérondif : los niños están durmiendo.", "d": "<b>Estar + gérondif : l'action en cours</b>.<div class='ex-detail'><u>Exemple rédigé</u> : pour dire « être en train de », l'espagnol utilise TOUJOURS <b>estar</b> + gérondif (-ando/-endo) : <i>Los niños <b>están durmiendo</b>.</i> (les enfants sont en train de dormir) : la formation du gérondif : -ar → -ando (hablando), -er/-ir → -iendo (comiendo, viviendo) : la faute « son durmiendo » est impossible : le progressif espagnol est un EXCLUSIF estar (jamais ser, jamais tener) : les usages : décrire une photo (<i>En la foto, la familia está comiendo</i>), raconter le présent (<i>¿Qué estás haciendo? — Estoy estudiando</i>) : la description d'image au bac commence presque toujours par estar + gérondif — la structure est LE réflexe du chapitre.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Son las ocho » — le verbe SER est utilisé parce que :", "c": ["l'heure est un état", "l'heure change tout le temps", "c'est une exception sans logique", "l'heure est une donnée d'identité (définition du moment)"], "a": 3, "e": "L'heure, la date, les événements → ser : identité du moment (son las ocho, es lunes, es mi cumpleaños).", "d": "<b>L'heure : la carte d'identité du moment</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'espagnol conceptualise l'heure comme une DEFINITION : « il est huit heures » = le moment EST (par essence) huit heures : <i><b>Son las ocho.</b> (pluriel — les huit heures !) / <b>Es</b> la una.</b> (singulier — une heure) : la même logique : <i>Es lunes. Es el 14 de julio. Es mi cumpleaños.</i> (dates et événements) : la question piège : « l'heure change tout le temps » — oui, mais la règle n'est pas la permanence : c'est l'IDENTITÉ (ce que c'est), pas la localisation : le couple : ¿Qué hora ES? (quelle heure est-il — ser) / ¿Dónde ESTÁS? (où es-tu — estar) : mémoriser le duo et l'heure est réglée pour toujours.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Juan es listo » signifie :", "c": ["Juan est prêt d'esprit", "Juan est prêt", "Juan est intelligent", "Juan est vif-argent"], "a": 2, "e": "ser listo = être intelligent (trait) ; estar listo = être prêt (état).", "d": "<b>Listo : l'adjectif à deux visages</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Juan <b>es</b> listo</i> = Juan est MALIN (c'est sa nature — ser) : <i>Juan <b>está</b> listo</i> = Juan est PRÊT (il a fini ses bagages — état, estar) : la famille des adjectifs à double sens : aburrido (es aburrido = il est ennuyeux / está aburrido = il s'ennuie), bueno (es bueno = il est bon, gentil / está bueno = c'est bon, au goût !), vivo (es vivo = malin / está vivo = vivant), verde (es verde = vert / está verde = pas mûr) : la logique : avec ser, l'adjectif qualifie l'ESSENCE ; avec estar, il décrit un ÉTAT momentané : ces doubles sens sont des chouchous d'examen — la liste se mémorise en paires opposées.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« La ventana está abierta » — estar parce que :", "c": ["c'est le RÉSULTAT d'une action (quelqu'un l'a ouverte)", "les objets prennent toujours estar", "la fenêtre est une chose", "abierta est un lieu"], "a": 0, "e": "État résultant d'une action → estar : la porte/fenêtre est ouverte/fermée (résultat) — même si ça dure !", "d": "<b>Le résultat d'une action : territoire estar</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>La ventana <b>está abierta</b>.</i> (la fenêtre est ouverte) : la logique : la fenêtre n'est pas « ouverte par essence » — quelqu'un l'a OUVERTE : c'est le résultat d'un procès → estar : la même famille : <i>La puerta está cerrada. El café está frío. La casa está limpia.</i> (résultats d'actions : fermer, refroidir, nettoyer) : le contraste : <i>El café es de Colombia</i> (identité : origine) vs <i>El café está frío</i> (résultat) : la frontière : DEFINITION (ser) vs CONSEQUENCE D'ACTION (estar) : la mort aussi : <i>Está muerto</i> (résultat de mourir) — jamais « es muerto » : ce critère du résultat est LE troisième pilier du chapitre (après identité et lieu).</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "Quelle phrase est correcte ?", "c": ["Estoy de acuerdo con tú.", "Soy acuerdo contigo.", "Estoy de acuerdo contigo.", "Soy de acuerdo contigo."], "a": 2, "e": "« Être d'accord » = estar de acuerdo + conmigo/contigo/connigo... : Estoy de acuerdo contigo.", "d": "<b>De acuerdo : accord avec estar</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'expression figée : <b>estar de acuerdo</b> (être d'accord) : <i><b>Estoy de acuerdo</b> contigo.</i> (je suis d'accord avec toi) : le piège « soy de acuerdo » : la faute de calque (les élèves transposent « soy » partout) — or l'expression est IDIOMATIQUE, elle prend estar : la suite des pronènes : conmigo (avec moi), contigo (avec toi), con él/ella, con nosotros/vosotros, con ellos : la négation : <i>No estoy de acuerdo</i> (je ne suis pas d'accord) — LA formule de l'expression d'opinion (<i>Estoy de acuerdo con la idea de que...</i>) : en débat, en essay, en dialogue : la formule revient sans cesse — la conjuguer avec estar est un marqueur de correction immédiat.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« ¿Cómo ___ tu hermano ? — Es alto y simpático » (description physique)", "c": ["está", "es", "estoy", "somos"], "a": 1, "e": "Description physique, caractère (traits permanents) → ser : ¿Cómo es? Es alto y simpático.", "d": "<b>¿Cómo es ou cómo está ?</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les deux questions existent avec des sens DIFFÉRENTS : <i>¿Cómo <b>es</b> tu hermano?</i> = comment est-il ? (physique, caractère — description) : <i>¿Cómo <b>está</b> tu hermano?</i> = comment va-t-il ? (santé, humeur du jour) : la réponse de l'énoncé « Es alto y simpático » (traits permanents) confirme ser : la paire d'examens : décrire une personne → ¿Cómo es? ; prendre des nouvelles → ¿Cómo está? : la même ambiguïté en français (« comment est votre frère ? » vs « comment va votre frère ? ») — l'espagnol la lexicalise : la description physique (alto, bajo, rubio, moreno) et le caractère (simpático, tímido, serio) vivent avec ser ; l'humeur (contento, triste, cansado aujourd'hui) avec estar : deux questions, deux mondes — le QCM favori du chapitre.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« Ayer ___ al supermercado » (ir, action datée)", "c": ["fui", "voy", "iba", "iré"], "a": 0, "e": "« Ayer » = action ponctuelle datée → indefinido : fui (allai).", "d": "<b>Ayer : le mot qui décide</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « ayer » (hier) DATE l'action : elle est ponctuelle et terminée → <b>indefinido</b> : <i>Ayer <b>fui</b> al supermercado.</i> (hier je suis allé au supermarché) : la forme iba (imperfecto) décrirait une habitude (« antes iba cada semana » — avant j'y allais chaque semaine) : le mot-clé du chapitre : indefinido pour l'événement DATÉ (ayer, anoche, el año pasado, en 2018, de repente) ; imperfecto pour l'habitude (todos los días, siempre) : la confusion fui/iba est LA faute reine du passé espagnol — un seul mot du contexte (ayer vs siempre) la résout à coup sûr.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« De niño, ___ al parque todos los días » (habitude)", "c": ["fui", "iba", "soy", "voy"], "a": 1, "e": "Habitude répétée (« todos los días ») → imperfecto : iba (j'allais).", "d": "<b>Todos los días : la marque de l'habitude</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « de niño... todos los días » = une HABITUDE passée → <b>imperfecto</b> : <i>De niño, <b>iba</b> al parque todos los días.</i> (enfant, j'allais au parc tous les jours) : la logique : ce n'est pas UN événement mais une RÉPÉTITION (un film, pas une photo) : la même règle pour tous les verbes : <i>jugaba, leía, comíamos, íbamos</i> avec siempre, cada verano, todas las tardes : la faute inverse (« fui todos los días ») traîne partout dans les copies : l'astuce : si tu peux ajouter « chaque fois » dans la phrase, c'est l'imperfecto : la question de l'enfance (raconter son passé) est un thème d'expression récurrent — elle vit entière dans l'imperfecto.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "L'imperfecto de « ser » :", "c": ["estaba, estabas...", "fui, fuiste, fue...", "era, eras, era, éramos, erais, eran", "soy, eres, es..."], "a": 2, "e": "ser à l'imperfecto : era, eras, era, éramos, erais, eran (avec accent à nous : éramos !).", "d": "<b>Era : le décor de tous les récits</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Era</b> un día de verano. La casa <b>era</b> enorme y <b>había</b> un jardín.</i> (c'était un jour d'été — description) : la conjugaison complète : era, eras, era, <b>éramos</b>, erais, eran — l'accent sur éramos (à ne pas oublier !) : les seuls 3 irréguliers de l'imperfecto : <b>era</b> (ser), <b>iba</b> (ir), <b>veía</b> (ver) — TOUT le reste est régulier : la puissance de era : c'est le verbe de la DESCRIPTION au passé (les personnages, les lieux, l'heure) : dans toute narration, era installe le décor avant que l'indefinido ne fasse avancer l'action : « Era una vez... » (il était une fois) — le début de tous les contes espagnols.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« Mientras ___ , escuchaba música » (cocinar, action en cours)", "c": ["cociné", "cocinaré", "cocino", "cocinaba"], "a": 3, "e": "« mientras » (pendant que) + action en cours → imperfecto : cocinaba.", "d": "<b>Mientras : la porte de l'imperfecto</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « mientras » introduit deux actions PARALLÈLES dans le passé → les deux à l'imperfecto : <i>Mientras <b>cocinaba</b>, escuchaba música.</i> (pendant que je cuisinais, j'écoutais de la musique) : la logique : les deux actions durent, aucune n'interrompt l'autre — c'est le « film » intégral : le contraste avec l'interruption : <i>Cocinaba cuando sonó el teléfono</i> (l'imperfecto d'un côté, l'indefinido de l'autre — le téléphone INTERROMPT) : la règle : mientras → toujours imperfecto ; cuando + indefinido → interruption : cette architecture (parallèle vs interruption) structure tout récit au passé — la maîtriser c'est écrire une narration digne de ce nom.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "L'indefinido de « hacer » :", "c": ["hacé", "hago, haces...", "hice, hiciste, hizo, hicimos, hicisteis, hicieron", "hacía"], "a": 2, "e": "hacer à l'indefinido : hice, hiciste, hizo... (racine hic-).", "d": "<b>Hice : la racine qui change</b>.<div class='ex-detail'><u>Exemple rédigé</u> : à l'indefinido, faire change de racine : <b>hic-</b> : hice, hiciste, hizo, hicimos, hicisteis, hicieron : <i>Ayer <b>hice</b> los deberes.</i> (hier j'ai fait mes devoirs) : la famille des indefinidos irréguliers à connaître : tuve (tener), pude (poder), puse (poner), quise (querer), vine (venir), dije (decir), estuve (estar), supe (saber), di (dar), vi (ver), <b>fui</b> (ser/ir) : la particularité de hacer : la 3e personne <b>hizo</b> perd le c (hi-ZO, pas « hico ») : le réflexe d'examen : au passé daté, vérifier la liste des irrégéguliers AVANT d'écrire — 15 verbes, une demi-page, et la moitié des fautes de narration disparaissent.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« Cuando era pequeño, ___ una vez al dentista » (ir, chaque année)", "c": ["iba", "voy", "voya", "fui"], "a": 0, "e": "Habitude annuelle (una vez al año sous-entendu) → imperfecto : iba.", "d": "<b>L'habitude, même sans « todos los días »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « cuando era pequeño » (quand j'étais petit — imperfecto, la description !) + une fréquence passée (une fois par an) = HABITUDE → <b>iba</b> : <i>Cuando era pequeño, <b>iba</b> una vez al año al dentista.</i> (enfant, j'allais une fois par an chez le dentiste) : la détection : les marqueurs de fréquence au passé (una vez al año, cada verano, siempre, los domingos) → imperfecto : le double piège : « era » (imperfecto de ser — correct pour le contexte d'enfance) ET « fui » (indefinido — incorrect ici, ce n'est pas UN événement) : les phrases « cuando era pequeño... » sont le cadre idéal de l'expression sur l'enfance — elles vivent TOUTES à l'imperfecto : une structure à recopier telle quelle pour son oral.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« Sonó el teléfono mientras yo ___ un libro » (leer, en cours)", "c": ["leeré", "leo", "leía", "leí"], "a": 2, "e": "Action en cours INTERROMPUE → imperfecto (leía) ; l'interruption (sonó) est à l'indefinido.", "d": "<b>Le téléphone qui sonne toujours au mauvais moment</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'architecture de l'interruption : l'action en COURS → imperfecto ; l'événement qui SURVIENT → indefinido : <i>Sonó el teléfono mientras yo <b>leía</b> un libro.</i> (le téléphone sonna pendant que je lisais un livre) : la logique : « leer » DURAIT (fond sonore) ; « sonar » arriva (une fois, soudain) : la version française est identique : imparfait + passé simple/composé : les couples types : dormía → desperté ; caminaba → apareció ; estudiaba → entró : la détection rapide : « mientras » + en cours → imperfecto ; « de repente / cuando + indefinido » → l'interruption : c'est LA structure narrative la plus fréquente de la langue — chaque récit d'examen l'utilise au moins une fois.</div>"},
