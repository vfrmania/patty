var COURS_META = [
{"id": "presente", "theme": "Le présent de l'indicatif (Espagnol)", "niveau": "Collège/Lycée — Espagnol", "titre": "Le présent de l'indicatif", "cours": "<div class=\"cours-head\"><h2>El presente de indicativo</h2><p>Le présent espagnol : verbes en -ar, -er, -ir, irréguliers (ser, estar, ir, tener...) et changements vocaliques (e→ie, o→ue).</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— -ar : hablo, hablas, habla, hablamos, habláis, hablan<br>— -er : como, comes, come, comemos, coméis, comen<br>— -ir : vivo, vives, vive, vivimos, vivís, viven<br>— Diphtongues : e→ie (querer → quiero), o→ue (poder → puedo), u→ue (jugar → juego)<br>— Nous et vous : PAS de diphtongue (pensamos, podéis).</div>\n<h3>1. Les trois conjugaisons régulières</h3>\n<div class=\"tip\"><b>hablar (parler) :</b> hablo, hablas, habla, hablamos, habláis, hablan.<br><b>comer (manger) :</b> como, comes, come, comemos, coméis, comen.<br><b>vivir (habiter) :</b> vivo, vives, vive, vivimos, vivís, viven.<br>Attention à la 2e personne plurielle : <b>habláis, coméis, vivís</b> (accent écrit !) — et <b>vosotros</b> est la marque de l'espagnol d'Espagne (en Amérique latine : ustedes hablan).</div>\n<h3>2. Les verbes à diphtongue (cambios vocálicos)</h3>\n<div class=\"tip\">Le e ou o de la racine se diphtongue aux 3 personnes du singulier + ustedes... — mais PAS à nous/vous :<br><b>querer (querer → quie-</b> : quiero, quieres, quiere, queremos, queréis, quieren)<br><b>poder (o→ue) :</b> puedo, puedes, puede, podemos, podéis, pueden<br><b>jugar (u→ue) :</b> juego, juegas, juega, jugamos, jugáis, juegan<br>Autres : pensar (pienso), entender (entiendo), empezar (empiezo), contar (cuento), volver (vuelvo), dormir (duermo), encontrar (encuentro).</div>\n<h3>3. Les irréguliers de base à connaître par cœur</h3>\n<table><tr><th>Verbe</th><th>Présent</th><th>Sens</th></tr>\n<tr><td><b>ser</b></td><td>soy, eres, es, somos, sois, son</td><td>être (essence)</td></tr>\n<tr><td><b>estar</b></td><td>estoy, estás, está, estamos, estáis, están</td><td>être (état, lieu)</td></tr>\n<tr><td><b>ir</b></td><td>voy, vas, va, vamos, vais, van</td><td>aller</td></tr>\n<tr><td><b>tener</b></td><td>tengo, tienes, tiene, tenemos, tenéis, tienen</td><td>avoir</td></tr>\n<tr><td><b>hacer</b></td><td>hago, haces, hace, hacemos, hacéis, hacen</td><td>faire</td></tr>\n<tr><td><b>decir</b></td><td>digo, dices, dice, decimos, decís, dicen</td><td>dire</td></tr>\n<tr><td><b>ver</b></td><td>veo, ves, ve, vemos, veis, ven</td><td>voir</td></tr>\n<tr><td><b>saber</b></td><td>sé, sabes, sabe, sabemos, sabéis, saben</td><td>savoir</td></tr></table>\n<div class=\"piege\">⚠️ <b>Attention :</b> « yo » est souvent omis : <i>Hablo español</i> = je parle espagnol (la terminaison suffit !)<br>⚠️ La diphtongue ne s'applique JAMAIS à nosotros/vosotros : <i>pensamos</i> (pas « pienso » pour nous !)<br>⚠️ ¡Ojo! <b>hay</b> (impersonnel) : il y a — <i>hay muchos libros</i>.</div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Ejemplo detallado — presentarse</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Présente-toi : nom, âge, ville, goûts, activités du week-end.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Les verbes réguliers</b> : <i>Me llamo Ana. Vivo en Sevilla. Estudio en un instituto.</i> (habiter → vivir ; étudier → estudiar).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Les irréguliers</b> : <i>Tengo quince años. Soy francesa pero mi madre es española. Voy al cine los sábados.</i> (tener, ser, ir).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Les diphtongues</b> : <i>Me gusta leer. Quiero ser médica. Encuentro que el español es fácil.</i> — la grille : régulier (-ar/-er/-ir) ; diphtongue (quiero, encuentro) ; irrégulier (tengo, soy, voy) : la présentation mobilise les trois familles du présent — c'est l'exercice d'entrée parfait pour tout examen.</div></div></details>"},
{"id": "ser-estar", "theme": "Ser ou estar : les deux « être » (Espagnol)", "niveau": "Collège/Lycée — Espagnol", "titre": "Ser ou estar", "cours": "<div class=\"cours-head\"><h2>Ser ou estar</h2><p>Deux verbes « être » : ser (l'essence, ce qui est permanent) et estar (l'état, le lieu, ce qui est temporaire).</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— <b>ser</b> : identité, origine, nationalité, profession, heure, caractéristique permanente — soy, eres, es, somos, sois, son.<br>— <b>estar</b> : lieu, état (malade, fatigué, content), position, présent progressif — estoy, estás, está, estamos, estáis, están.<br>— DOCTOR vs PLACE (moyen mnémotechnique).<br>— Certains adjectifs changent de sens : listo (intelligent) vs estar listo (prêt).</div>\n<h3>1. SER : ce que l'on EST</h3>\n<div class=\"tip\"><b>Identité :</b> <i>Yo soy Ana. Él es mi hermano.</i><br><b>Origine, nationalité :</b> <i>Soy francesa. Son de Madrid.</i><br><b>Profession :</b> <i>Mi madre es profesora.</i><br><b>Heure, date :</b> <i>Son las tres. Es lunes.</i><br><b>Caractéristiques permanentes :</b> <i>Es simpático. La Tierra es redonda.</i><br><b>Possession :</b> <i>Este libro es de Juan.</i><br><b>Conjugaison :</b> soy, eres, es, somos, sois, son.</div>\n<h3>2. ESTAR : où l'on est, comment on va</h3>\n<div class=\"tip\"><b>Lieu (position) :</b> <i>Estoy en casa. Madrid está en España.</i><br><b>État momentané :</b> <i>Estoy cansado/enfermo/contento.</i><br><b>Résultat d'une action :</b> <i>La puerta está abierta.</i><br><b>Présent progressif :</b> <i>Estoy estudiando</i> (estar + gérondif = être en train de).<br><b>Conjugaison :</b> estoy, estás, está, estamos, estáis, están.</div>\n<h3>3. Les adjectifs qui changent de sens</h3>\n<table><tr><th>Adjectif</th><th>Avec SER</th><th>Avec ESTAR</th></tr>\n<tr><td><b>listo</b></td><td>intelligent (<i>es listo</i>)</td><td>prêt (<i>está listo</i>)</td></tr>\n<tr><td><b>aburrido</b></td><td>ennuyeux (personne/chose)</td><td>qui s'ennuie</td></tr>\n<tr><td><b>bueno/malo</b></td><td>bon (nature)/mauvais (nature)</td><td>bon (à manger !)/malade (personne)</td></tr>\n<tr><td><b>verde</b></td><td>vert (couleur)</td><td>pas mûr</td></tr>\n<tr><td><b>maduro</b></td><td>mûr (personne, sérieux)</td><td>mûr (fruit, prêt)</td></tr>\n<tr><td><b>vivo</b></td><td>vif, malin</td><td>vivant</td></tr></table>\n<div class=\"piege\">⚠️ <b>La faute classique :</b> « Estoy francesa » ✗ → <i>Soy francesa</i> (l'origine, c'est SER !)<br>⚠️ « Soy en casa » ✗ → <i>Estoy en casa</i> (le lieu, c'est ESTAR !)<br>⚠️ « Es muerto » ✗ → <i>Está muerto</i> (résultat : il est mort — état résultant !)</div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Ejemplo detallado — décrire une personne et sa journée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décris ton ami Pablo et sa journée : caractère, origine, lieu, humeur du jour, ce qu'il fait maintenant.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>SER : l'essence</b> : <i>Pablo es español, de Barcelona. Es simpático y muy trabajador. Es estudiante.</i> (origine, caractère, profession).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>ESTAR : lieu et état</b> : <i>Hoy está en Paris con su familia. Está cansado porque se levantó temprano.</i> (où il est, comment il va).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>ESTAR + gérondif</b> : <i>Ahora mismo está visitando el Louvre.</i> — la grille de décision : identité/origine/heure → SER ; lieu/état/en train de → ESTAR : la question-test : « est-ce définitionnel (il EST espagnol) ou circonstanciel (il EST à Paris aujourd'hui) ? » — une seule question, 95 % des réponses.</div></div></details>"},
{"id": "indefinido-imperfecto", "theme": "Le passé : indefinido et imperfecto (Espagnol)", "niveau": "Collège/Lycée — Espagnol", "titre": "Le passé : indefinido et imperfecto", "cours": "<div class=\"cours-head\"><h2>Pretérito indefinido et imperfecto</h2><p>Raconter au passé : l'indefinido (action datée, ponctuelle) et l'imperfecto (description, habitude, action en cours).</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Indefinido : -ar : hablé, hablaste, habló, hablamos, hablasteis, hablaron ; -er/-ir : comí, comiste, comió...<br>— Imperfecto : -aba/-ía (hablaba, comía, vivía) — FACILE et régulier !<br>— Indefinido = photo (action ponctuelle, datée) ; imperfecto = film (décor, habitude).<br>— Irréguliers indefinido clés : fui (ser/ir !), tuve, hice, dije, estuve.</div>\n<h3>1. Le pretérito indefinido : l'action ponctuelle</h3>\n<div class=\"tip\"><b>Réguliers -ar :</b> hablé, hablaste, habló, hablamos, hablasteis, hablaron.<br><b>Réguliers -er/-ir :</b> comí, comiste, comió, comimos, comisteis, comieron ; viví, viviste, vivió...<br><b>Emplois :</b> action terminée à un moment DÉFINI du passé (ayer, el año pasado, en 2018) ; succession d'actions : <i>Me levanté, desayuné y salí.</i><br><b>Irréguliers fréquents :</b> <b>fui, fuiste, fue, fuimos, fuisteis, fueron</b> (ser ET ir — mêmes formes !), tuve (tener), hice (hacer), dije (decir), estuve (estar), pude (poder), puse (poner), quise (querer), vine (venir), vi (ver), di (dar), supe (saber).</div>\n<h3>2. Le pretérito imperfecto : le décor du passé</h3>\n<div class=\"tip\"><b>Formation TRÈS régulière :</b> -ar → -aba (hablaba, hablabas, hablaba, hablábamos, hablabais, hablaban) ; -er/-ir → -ía (comía, vivía...).<br><b>Seuls 3 irréguliers :</b> ser → era (era, eras, era, éramos, erais, eran) ; ir → iba ; ver → veía.<br><b>Emplois :</b> description dans le passé (<i>Hacía sol y los pájaros cantaban</i>) ; habitude répétée (<i>De niño, jugaba al fútbol todos los días</i>) ; action en cours interrompue (<i>Dormía cuando sonó el teléfono</i>) ; l'âge, l'heure au passé (<i>Tenía diez años. Eran las cinco.</i>).</div>\n<h3>3. Le test de choix : photo ou film ?</h3>\n<table><tr><th>Critère</th><th>Indefinido</th><th>Imperfecto</th></tr>\n<tr><td><b>Action</b></td><td>ponctuelle, datée (ayer, anoche, en 2010)</td><td>habitude (todos los días), description</td></tr>\n<tr><td><b>Image</b></td><td>un cliché (il arriva, il fit)</td><td>un plan large (il faisait beau, il avait 10 ans)</td></tr>\n<tr><td><b>Marqueurs</b></td><td>ayer, anoche, el mes pasado, de repente</td><td>todos los días, siempre, cada verano, mientras</td></tr>\n<tr><td><b>Exemple</b></td><td><i>Ayer fui al cine.</i></td><td><i>Antes iba al cine cada semana.</i></td></tr></table>\n<div class=\"tip\"><b>La combinaison classique :</b> imperfecto (décor/en cours) + indefinido (interruption) : <i>Leía un libro cuando de repente sonó el teléfono.</i> (je lisais — imperfecto — quand le téléphone sonna — indefinido).<br><b>Mientras</b> + imperfecto : <i>Mientras cocinaba, escuchaba música.</i></div>\n<div class=\"piege\">⚠️ <b>La faute reine :</b> employer l'indefinido pour une habitude : « De niño fui al parque todos los días » ✗ → <i>iba</i> ✓ (l'habitude = imperfecto).<br>⚠️ <b>fui</b> peut vouloir dire « je fus » OU « j'allai » — le contexte décide : <i>Fui médico</i> (je fus) / <i>Fui al médico</i> (j'allai chez le médecin).<br>⚠️ La 1re et 3e personne sont IDENTIQUES au singulier à l'imperfecto : hablaba = je parlais / il parlait (le contexte tranchera !).</div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Ejemplo detallado — raconter les vacances</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Raconte tes vacances en Andalousie : le voyage (daté), le lieu (description), l'hôtel, une tempête soudaine, les visites.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Le voyage daté → indefinido</b> : <i>El verano pasado viajé a Andalucía con mi familia. Llegamos a Sevilla el 10 de julio y visitamos la Giralda.</i> (actions ponctuelles datées).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Le décor → imperfecto</b> : <i>Hacía mucho calor. El hotel era antiguo y estaba cerca de la catedral. Todos los días desayunábamos churros.</i> (météo, description, habitude).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>L'interruption → les deux</b> : <i>Una tarde, mientras paseábamos por el parque, de repente empezó a llover.</i> (paseábamos : en cours — imperfecto ; empezó : interruption — indefinido) : le récit espagnol alterne sans cesse les deux temps : chaque phrase = une question : photo (indefinido) ou film (imperfecto) ? Le récit bien construit fait doubler l'inspecteur au correcteur.</div></div></details>"},
{"id": "futuro-condicional", "theme": "Le futur et le conditionnel (Espagnol)", "niveau": "Collège/Lycée — Espagnol", "titre": "Le futur et le conditionnel", "cours": "<div class=\"cours-head\"><h2>El futuro y el condicional</h2><p>Le futur simple (infinitif + é...) et le conditionnel (infinitif + ía...) — deux temps jumeaux et faciles.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Futur : <b>infinitif + é, ás, á, emos, éis, án</b> : hablaré, comeré, viviré.<br>— Conditionnel : <b>infinitif + ía, ías, ía, íamos, íais, ían</b> : hablaría, comería.<br>— Irregularités sur 12 verbes : tendré, pondré, haré, diré, saldré... (mêmes racines pour les deux temps).<br>— Futur de probabilité : « Serán las diez » (il doit être 10 heures).</div>\n<h3>1. Formation : l'infinitif + terminaison</h3>\n<div class=\"tip\"><b>Futur :</b> parler → hablar<b>é</b>, hablar<b>ás</b>, hablar<b>á</b>, hablar<b>emos</b>, hablar<b>éis</b>, hablar<b>án</b> ; comer<b>é</b>... ; vivir<b>é</b>...<br>— L'infinitif reste ENTIER (jamais coupé !) : comeré, vivirán.<br><b>Conditionnel :</b> même mécanique : comer<b>ía</b>, comer<b>ías</b>, comer<b>ía</b>, comer<b>íamos</b>, comer<b>íais</b>, comer<b>ían</b>.<br><b>Accents :</b> tous portés sur la terminaison : hablar<b>é</b>, com<b>í</b>a (sauf futuro emos/eis : hablaremos, hablaréis).</div>\n<h3>2. Les 12 verbes irréguliers (racines communes aux deux temps)</h3>\n<table><tr><th>Verbe</th><th>Racine futur</th><th>Futur (yo)</th><th>Conditionnel (yo)</th></tr>\n<tr><td>tener</td><td>tendr-</td><td>tendré</td><td>tendría</td></tr>\n<tr><td>hacer</td><td>har-</td><td>haré</td><td>haría</td></tr>\n<tr><td>decir</td><td>dir-</td><td>diré</td><td>diría</td></tr>\n<tr><td>salir</td><td saldr-</td><td>saldré</td><td>saldría</td></tr>\n<tr><td>venir</td><td>vendr-</td><td>vendré</td><td>vendría</td></tr>\n<tr><td>poner</td><td>pondr-</td><td>pondré</td><td>pondría</td></tr>\n<tr><td>poder</td><td>podr-</td><td>podré</td><td>podría</td></tr>\n<tr><td>querer</td><td>querr-</td><td>querré</td><td>querría</td></tr>\n<tr><td>saber</td><td>sabr-</td><td>sabré</td><td>sabría</td></tr>\n<tr><td>haber</td><td>habr-</td><td>habré</td><td>habría</td></tr>\n<tr><td>caber</td><td>cabr-</td><td>cabré</td><td>cabría</td></tr></table>\n<div class=\"tip\"><b>ser/ir :</b> réguliers ! seré, iré (et sería, iría).<br>Astuce : les racines irrégulières sont les mêmes pour le futur ET le conditionnel — on les apprend UNE fois pour deux temps !</div>\n<h3>3. Les emplois</h3>\n<div class=\"tip\"><b>Futur simple :</b> action future (<i>Mañana estudiaré todo el día</i>) ; promesse (<i>Te llamaré esta noche</i>) ; prédiction (<i>Lloverá mañana</i>).<br><b>Futur de probabilité (très courant !) :</b> conjecture sur le présent : <i>¿Qué hora es? — Serán las diez</i> (il doit être ~10 h) ; <i>Tendrá unos veinte años</i> (il doit avoir vingt ans).<br><b>Conditionnel :</b> politesse (<i>¿Podría ayudarme?</i> — pourriez-vous m'aider ?) ; souhait (<i>Me gustaría viajar</i> — j'aimerais voyager) ; hypothèse (<i>Si tuviera dinero, compraría una casa</i> — si j'avais de l'argent, j'achèterais une maison) ; conseil (<i>Yo que tú, hablaría con ella</i>).</div>\n<div class=\"piege\">⚠️ <b>Piège n°1 :</b> couper l'infinitif : « comer**é » non — l'infinitif reste entier : <b>comeré</b> ✓ (mais « poner → pondré » : les irréguliers raccourcissent la racine !).<br>⚠️ <b>Piège n°2 :</b> confondre « haría » (conditionnel de hacer) et « habría » (conditionnel de haber — servant à former le conditionnel passé : habría comido).<br>⚠️ <b>Piège n°3 :</b> le conditionnel s'emploie RAREMENT dans la subordonnée en SI : <i>Si tendría tiempo</i> ✗ → <i>Si tuviera tiempo, estudiaría</i> ✓.</div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Ejemplo detallado — projets d'avenir et conseils</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écris 4 phrases : (1) tes études l'année prochaine (futur), (2) une prédiction météo, (3) ce que tu aimerais faire plus tard (conditionnel), (4) un conseil à un ami qui a raté son contrôle (conditionnel).</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Futur des projets</b> : <i>El año que viene estudiaré en Sevilla. Haré un intercambio con una familia española.</i> (estudiaré, haré — irrégulier).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Prédiction</b> : <i>Creo que lloverá este fin de semana, pero hará sol el lunes.</i> (lloverá, hará — le futur des prévisions météo).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Conditionnel : vœu et conseil</b> : <i>Me gustaría trabajar como profesora. Yo que tú, hablaría con el profesor para pedir otra oportunidad.</i> — la grille : projet/prédiction → futur (-é/-á) ; souhait/politesse/hypothèse → conditionnel (-ía) : l'avenir espagnol se conjugue en deux gestes — et l'irrégulier aprend une fois, sert deux fois.</div></div></details>"},
{"id": "genero-numero", "theme": "Genre et nombre : l'accord des adjectifs (Espagnol)", "niveau": "Collège/Lycée — Espagnol", "titre": "Genre et nombre", "cours": "<div class=\"cours-head\"><h2>Genre et nombre</h2><p>L'accord de l'adjectif : masculin/féminin (-o/-a), singulier/pluriel (-s/-es) — et les exceptions (adjectifs invariables, nationaux, -ista).</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Adjectif en -o → -o (masc.) / -a (fém.) : alto, alta, altos, altas.<br>— Adjectif en consonne → +a pour le féminin : francés, francesa.<br>— Adjectifs invariables : verde, azul, gris, marrón, inteligente, feliz.<br>— Pluriel : +s (voyelle finale) ; +es (consonne).<br>— Ordre : l'adjectif suit EN GÉNÉRAL le nom.</div>\n<h3>1. Le masculin et le féminin</h3>\n<div class=\"tip\"><b>Règle générale :</b> l'adjectif en -o fait son féminin en -a : <i>Juan es alto. Ana es alta. Los niños son altos. Las niñas son altas.</i><br><b>Adjectifs finissant par une consonne :</b> féminin en +a : <i>un profesor español → una profesora española</i> ; francés → francesa ; alemán → alemana ; hablador → habladora.<br><b>Adjectifs INVARIABLES en genre</b> (même forme m/f) : les couleurs <i>verde, azul, gris, marrón, rosa</i> ; les adjectifs en -e : <i>inteligente, paciente, grande, fuerte</i> ; en -ista : <i>optimista, realista</i> ; <i>feliz</i> (mais pluriel : felices).</div>\n<h3>2. Le singulier et le pluriel</h3>\n<div class=\"tip\"><b>Nom/adjectif finissant par voyelle → +s :</b> libro → libros ; alta → altas ; grande → grandes.<br><b>Finissant par consonne → +es :</b> ciudad → ciudades ; azul → azules ; español → españoles ; marrón → marrones.<br><b>-z → -ces :</b> luz → luces ; feliz → felices ; andaluz → andaluces.<br>⚠️ Les mots en -s accentués (autobús → autobuses) et les jours (lunes, jueves — invariables).</div>\n<h3>3. Les pièges des noms</h3>\n<div class=\"tip\"><b>Noms masculins :</b> el problema, el tema, el planeta, el día, el mapa, el corazón (les -ma d'origine grecque !) — ⚠️ el problema, pas « la problema ».<br><b>Noms féminins :</b> la mano (la main — féminin malgré le -o !), la foto(graphía), la moto(rcicleta), la clase, la noche, la ciudad.<br><b>-dad/-tad/-ción/-sión :</b> féminins : la universidad, la libertad, la información.<br><b>Le genre logique :</b> el libro (m.) / la libreta (f.) ; le genre n'est PAS toujours devinable — l'apprentissage avec l'article (el/la + nom) est la méthode sûre.</div>\n<div class=\"piege\">⚠️ « la problema » ✗ → <b>el problema</b> (masculin !).<br>⚠️ « el mano » ✗ → <b>la mano</b> (féminin !).<br>⚠️ « las problemás » ✗ → <b>los problemas</b> (l'article suit le nom, l'adjectif suit le nom).<br>⚠️ Adjectif de couleur composé invariable : <i>pantalones azul marino</i> (bleu marine ne s'accorde pas !).</div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Ejemplo detallado — décrire sa classe et ses amis</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décris ta classe : la salle, le tableau, deux ami(e)s (nationalités, caractères) et l'ambiance.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Les noms avec leur genre</b> : <i>La clase es grande y luminosa. La pizarra es verde y las sillas son azules.</i> (classe → f. ; pizarra → f., adjectif verde invariable).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Les adjectifs accordés</b> : <i>Mi amiga Marta es española, muy inteligente y simpática. Mi amigo Pablo es francés, alto y hablador.</i> (española : -a ; inteligente : invariable ; hablador → masculine).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Le pluriel général</b> : <i>Los alumnos son optimistas y las profesoras son pacientes.</i> (optimistas, pacientes : invariables en genre, +s au pluriel) : la description mobilise TOUTE la chaîne : nom (genre) → article (accord) → adjectif (genre ET nombre) : la relecture systématique (chaque adjectif : m/f ? s/pl ?) élimine la faute la plus fréquente des copies.</div></div></details>"},
{"id": "pronoms-complements", "theme": "Les pronoms compléments : lo, la, le, se (Espagnol)", "niveau": "Collège/Lycée — Espagnol", "titre": "Les pronoms compléments", "cours": "<div class=\"cours-head\"><h2>Los pronombres de complemento</h2><p>Me, te, lo, la, los, las, le, les — et le fameux « se » : placer et combiner les pronoms compléments.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— COD : <b>lo, la, los, las</b> (le, la, les — chose ou personne).<br>— COI : <b>le, les</b> (à lui/elle, à eux — personne seulement).<br>— Placés AVANT le verbe conjugué : <i>Lo veo</i> (je le vois).<br>— Collés à l'infinitif/gérondif : <i>Quiero ver<b>lo</b></i>.<br>— le/les + lo/la/los/las → <b>se</b> : <i>Se lo doy</i> (je le lui donne).</div>\n<h3>1. COD et COI : choisir le pronom</h3>\n<div class=\"tip\"><b>COD (quoi ? qui ?)</b> : lo/la/los/las — accord en genre et nombre avec le COD : <i>Compro el pan → <b>Lo</b> compro. Veo a María → <b>La</b> veo.</i><br><b>COI (à qui ? pour qui ?)</b> : le/les (invariables en genre) : <i>Escribo a mi abuela → <b>Le</b> escribo. Doy el libro a los niños → <b>Les</b> doy el libro.</i><br><b>Test :</b> remplace par la chose : si « à » disparaît → COD (lo) ; si « à » reste → COI (le). « Je vois Marie » (qui ? Marie → la) ; « J'écris à Marie » (à qui ? → le).</div>\n<h3>2. La place des pronoms</h3>\n<table><tr><th>Contexte</th><th>Placement</th><th>Exemple</th></tr>\n<tr><td>Verbe conjugué</td><td>AVANT le verbe</td><td><i><b>Me</b> llamo Ana.</i> / <i><b>Lo</b> quiero.</i></td></tr>\n<tr><td>Infinitif</td><td>COLLÉ à la fin</td><td><i>Quiero ver<b>lo</b>.</i> / <i>Voy a llamar<b>la</b>.</i></td></tr>\n<tr><td>Gérondif</td><td>COLLÉ à la fin</td><td><i>Estoy leyéndo<b>lo</b>.</i></td></tr>\n<tr><td>Impératif affirmatif</td><td>COLLÉ à la fin</td><td><i>Dime la verdad.</i> / <i>Cállate.</i></td></tr>\n<tr><td>Impératif négatif</td><td>AVANT</td><td><i><b>No</b> me digas nada.</i></td></tr></table>\n<h3>3. La règle du « se » : quand le et lo se rencontrent</h3>\n<div class=\"tip\">Quand un COI (le/les) précède un COD (lo/la/los/las), le COI devient <b>se</b> :<br><i>Le doy el libro → <b>Se</b> lo doy.</i> (je le lui donne)<br><i>Les compro flores → <b>Se</b> las compro.</i> (je les leur achète)<br><i>¿Le explicas la lección a Juan? → Sí, <b>se</b> la explico.</i><br>⚠️ « Le lo doy » est IMPOSSIBLE en espagnol correct : toujours « se lo doy ».</div>\n<h3>4. Les pronoms réfléchis</h3>\n<div class=\"tip\"><b>me, te, se, nos, os, se</b> : <i>Me lavo</i> (je me lave), <i>Te levantas</i> (tu te lèves), <i>Se llama Ana</i> (elle s'appelle Ana), <i>Nos divertimos</i> (nous nous amusons).<br>Les verbes réfléchis courants : levantarse (se lever), llamarse (s'appeler), ducharse (se doucher), divertirse (s'amuser), sentirse (se sentir), despertarse (se réveiller), ponerse (mettre/porter).<br>Avec « gusta » : <i>Me gusta el fútbol</i> (le football me plaît) — le pronom COI + gusta.</div>\n<div class=\"piege\">⚠️ « Lo veo a María » ✗ → <i><b>La</b> veo</i> (personne = la, pas lo).<br>⚠️ « Le lo doy » ✗ → <i><b>Se</b> lo doy</i>.<br>⚠️ Ne pas oublier le pronom réfléchi : « lavo » = je lave (autre chose) ; « <b>me</b> lavo » = je me lave.<br>⚠️ « Me gusta los deportes » ✗ → <i>Me gust<b>an</b> los deportes</i> (l'accord du verbe gustar avec le pluriel !).</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Ejemplo detallado — un échange de cadeaux</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Réécris avec pronoms : (1) « Compro flores para mi madre. » (2) « Doy las flores a mi madre. » (3) « Mi madre me dice gracias. » (4) « Quiero dar un abrazo a mi madre. »</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>COD ou COI ?</b> : (1) « flores » = COD → <i><b>Las</b> compro (para mi madre)</i>. (2) « las flores » = COD, « a mi madre » = COI → combinaison !</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>La règle du se</b> : (2) le + las impossible → <i><b>Se las doy</b>.</i> (je les lui donne). (3) le pronom inversé : <i>Mi madre <b>me</b> dice gracias</i> (me = à moi, COI).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Infinitif collé</b> : (4) → <i>Quiero darle un abrazo.</i> (ou : Quiero dárselo — se + lo !) : la mécanique complète : identifier (COD ? COI ?), placer (avant/fin), combiner (le+lo → se) : trois questions dans l'ordre — et n'importe quelle phrase à pronoms devient mécanique.</div></div></details>"},
{"id": "imperativo-subjuntivo", "theme": "L'impératif et une introduction au subjonctif (Espagnol)", "niveau": "Collège/Lycée — Espagnol", "titre": "L'impératif et le subjonctif", "cours": "<div class=\"cours-head\"><h2>El imperativo y el subjuntivo</h2><p>Donner des ordres et des conseils (impératif) — et découvrir le subjonctif présent : les temps du vouloir, de l'émotion et du doute.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Impératif affirmatif (tú) : forme « tú » du présent SANS le s : ¡Habla! ¡Come! ¡Escribe!<br>— Irréguliers à apprendre : ¡Ven! (venir), ¡Ten! (tener), ¡Sal! (salir), ¡Haz! (hacer), ¡Di! (decir), ¡Pon! (poner), ¡Ve! (ir), ¡Sé! (ser).<br>— Impératif négatif : subjunctivo : ¡No hables! ¡No comas!<br>— Subjonctif présent : hablar → hable, hables ; comer → coma ; diphtongue conservée : vuelvas, pienses.</div>\n<h3>1. L'impératif affirmatif</h3>\n<div class=\"tip\"><b>Tú (règle générale) :</b> 2e personne du présent SANS le s final : hablar → hablas → <b>¡Habla!</b> ; comer → comes → <b>¡Come!</b> ; escribir → escribes → <b>¡Escribe!</b><br><b>7 irréguliers fameux</b> (à savoir par cœur !) : tener → <b>¡Ten!</b>, venir → <b>¡Ven!</b>, poner → <b>¡Pon!</b>, salir → <b>¡Sal!</b>, hacer → <b>¡Haz!</b>, decir → <b>¡Di!</b>, ir → <b>¡Ve!</b>, ser → <b>¡Sé!</b><br><b>Usted :</b> forme de politesse : ¡Hable! ¡Coma! ¡Escriba! (utile pour les consignes formelles)<br><b>Vosotros :</b> remplacer le r final par d : ¡Hablad! ¡Comed! ¡Escribid!</div>\n<h3>2. L'impératif négatif : le subjonctif</h3>\n<div class=\"tip\"><b>No + subjonctif présent :</b> hablar → <b>¡No hables!</b> ; comer → <b>¡No comas!</b> ; ir → <b>¡No vayas!</b> ; ser → <b>¡No seas!</b><br>La diphtongue REVIENT : pensar → ¡No pienses! ; volver → ¡No vuelvas! ; dormir → ¡No duermas!<br>⚠️ Le contraste : ¡Habla! (affirmatif) mais ¡No hables! (négatif) — une terminaison différente !</div>\n<h3>3. Le subjonctif présent : quand l'employer ?</h3>\n<div class=\"tip\"><b>Formation :</b> prendre la 1re personne du présent, changer la voyelle finale : -ar → e (hablo → hable), -er/-ir → a (como → coma) : habl<b>e</b>, habl<b>es</b>, habl<b>e</b>, habl<b>emos</b>, habl<b>éis</b>, habl<b>en</b> ; com<b>a</b>, com<b>as</b>, com<b>a</b>...<br><b>Diphtongues conservées aux personnes de la « botte » :</b> volver → vuelva, vuelvas, volvamos, volváis, vuelvan.<br><b>Emplois principaux :</b><br>— <b>Vouloir que</b> : <i>Quiero que vengas.</i> (je veux que tu viennes)<br>— <b>Émotion</b> : <i>Me alegra que estés aquí. Espero que lo pases bien.</i><br>— <b>Doute/nécessité</b> : <i>No creo que sea verdad. Es importante que estudies.</i><br>— <b>Après certains déclencheurs</b> : cuando (futur : <i>Cuando venga, avísame</i>), para que (pour que), antes que, aunque.</div>\n<div class=\"piege\">⚠️ <b>Le contraste espérer/croire :</b> <i>Creo que es verdad</i> (indicatif — affirmation) vs <i>No creo que SEA verdad</i> (subjonctif — doute) !<br>⚠️ « Espero que vienes » ✗ → <i>Espero que vengas</i> (esperar que + subj., TOUJOURS).<br>⚠️ L'impératif de « ir » (¡Ve!) et de « ser » (¡Sé!) se ressemblent — l'accent les distingue à l'écrit !<br>⚠️ Quand + futur → subjonctif : <i>Cuando llegue (subjonctif), te llamaré (futur)</i>.</div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Ejemplo detallado — les conseils de santé</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un ami est malade. Donne-lui : (1) un ordre positif (se reposer), (2) un conseil négatif (ne pas sortir), (3) une phrase avec « je veux que » (tu guérisses vite), (4) une phrase avec « j'espère que ».</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Impératif affirmatif</b> : <i>¡<b>Descansa</b> mucho y <b>toma</b> tus medicinas!</i> (reposa-toi et prends tes médicaments — descansa, toma : formes régulières).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Impératif négatif (subjonctif)</b> : <i>¡<b>No salgas</b> de casa esta semana!</i> (ne sors pas — salir → no salgas, irrégulier du subjonctif).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Vouloir que + subjonctif</b> : <i>Quiero que <b>te mejores</b> pronto. Espero que <b>vuelvas</b> al instituto el lunes.</i> — la santé est LE contexte idéal du subjonctif (émotion + vœux) : les formules se récitent : quiero que + subj., espero que + subj., es importante que + subj. : trois déclencheurs, un temps — le subjonctif des vœux est le plus simple à mémoriser.</div></div></details>"},
{"id": "lexique-cotidien", "theme": "Lexique de la vie quotidienne (Espagnol)", "niveau": "Collège/Lycée — Espagnol", "titre": "Lexique de la vie quotidienne", "cours": "<div class=\"cours-head\"><h2>Vocabulaire quotidien</h2><p>Les mots pour vivre en espagnol : présentations, famille, école, loisirs, achats, nourriture, voyages.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Saluer/dire au revoir : hola, buenos días, adiós, hasta luego, hasta mañana.<br>— Politesse : por favor, gracias, de nada, perdón, lo siento, mucho gusto.<br>— Chiffres, heure, date : uno, dos, tres... ; ¿Qué hora es? ; hoy, mañana, ayer.<br>— Thématiques : familia, instituto, tiempo libre, comida, compras, viajes.</div>\n<h3>1. Saluer et remercier</h3>\n<div class=\"tip\"><b>Salutations :</b> ¡Hola! (salut), Buenos días (bonjour — jusqu'à ~13 h), Buenas tardes (bon après-midi), Buenas noches (bonsoir/bonne nuit).<br><b>Au revoir :</b> Adiós, Hasta luego (à plus tard), Hasta mañana (à demain), Hasta pronto (à bientôt), Nos vemos (on se voit).<br><b>Politesse :</b> Por favor (s'il vous plaît), Gracias / Muchas gracias, De nada (de rien), Perdón/Perdone (pardon), Lo siento (je suis désolé), ¡Muchas gracias! — El gusto es mío (le plaisir est pour moi).<br><b>Comment ça va :</b> ¿Qué tal? / ¿Cómo estás? — Bien, gracias. / Regular. / Mal. / Muy bien, ¿y tú?</div>\n<h3>2. La famille et la personne</h3>\n<table><tr><th>Espagnol</th><th>Français</th><th>Espagnol</th><th>Français</th></tr>\n<tr><td>los padres</td><td>les parents</td><td>los hermanos</td><td>les frères et sœurs</td></tr>\n<tr><td>el hermano / la hermana</td><td>le frère / la sœur</td><td>el abuelo / la abuela</td><td>le grand-père / la grand-mère</td></tr>\n<tr><td>el tío / la tía</td><td>l'oncle / la tante</td><td>el primo / la prima</td><td>le cousin / la cousine</td></tr>\n<tr><td>el hijo / la hija</td><td>le fils / la fille</td><td>el novio / la novia</td><td>le petit ami / la petite amie</td></tr>\n<tr><td>la edad</td><td>l'âge</td><td>el cumpleaños</td><td>l'anniversaire</td></tr></table>\n<div class=\"tip\"><b>Décrire une personne :</b> alto/bajo (grand/petit), delgado/gordo (mince/gros), moreno/rubio (brun/blond), simpático/antipático, trabajador/perezoso (travailleur/paresseux), tímido, generoso, sincero.<br>⚠️ <b>Attention aux faux-amis :</b> un padre = un parent (le père = el padre, mais « los padres » = les parents !) ; una biblioteca = une bibliothèque (pas une librairie = una librería !) ; largo = long (pas large = ancho !) ; una fábrica = une usine (pas une fabrique !) ; asistir = assister à (pas aider = ayudar).</div>\n<h3>3. L'école et les loisirs</h3>\n<div class=\"tip\"><b>École :</b> el instituto (le lycée), la escuela, la asignatura (la matière), las matemáticas, la historia, el examen, los deberes (les devoirs), el recreo (la récré), el/la profesor(a), el boletín de notas (le bulletin).<br><b>Loisirs :</b> jugar al fútbol/baloncesto, escuchar música, leer, navegar por internet, quedar con los amigos (se retrouver entre amis), ir de compras (faire les courses), el fin de semana, el picnic, dar un paseo (faire une promenade).</div>\n<h3>4. Nourriture et achats</h3>\n<div class=\"tip\"><b>Repas :</b> el desayuno (petit-déjeuner), la comida (déjeuner), la merienda (goûter), la cena (dîner) ; el agua, el pan, el queso, la carne, el pescado, la fruta, las verduras (légumes), el postre.<br><b>Au restaurant :</b> la carta (la carte), la cuenta (l'addition), el camarero (le serveur), ¡Camarero, la cuenta por favor!<br><b>Achats :</b> ¿Cuánto cuesta? (combien ça coûte ?), caro/barato (cher/bon marché), el dinero, la tienda (le magasin), el mercado, el tamaño (la taille), ¿Tiene...? (avez-vous...?), la rebaja (la soldes/réduction).</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Ejemplo detallado — survivre une journée à Madrid</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Scénario : matin à l'hôtel, achat au marché, déjeuner, après-midi musée, soirée. Écris les phrases clés de chaque étape.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Matin</b> : <i>Buenos días, ¿qué tal? — Bien, gracias. ¿Me pone un café con leche, por favor?</i> (salutation + commande polie).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Marché et déjeuner</b> : <i>¿Cuánto cuesta el kilo de naranjas? — Dos euros. — Me da un kilo, por favor.</i> / Au restaurant : <i>La cuenta, por favor. — ¿Con tarjeta? — No, en efectivo.</i></div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Soirée</b> : <i>Muchas gracias por todo. — De nada. ¡Hasta mañana!</i> — le scénario du voyageur : saluer, demander (por favor), payer (¿cuánto cuesta?), remercier (gracias/de nada), partir (hasta luego) : cinq blocs de phrases toutes faites, une journée entière de communication : l'apprentissage par situations est le plus efficace — chaque bloc se mémorise en bloc !</div></div></details>"},
{"id": "civilisation-espagne", "theme": "Civilisation : l'Espagne (Espagnol)", "niveau": "Collège/Lycée — Espagnol", "titre": "Civilisation : l'Espagne", "cours": "<div class=\"cours-head\"><h2>Civilisation espagnole</h2><p>De la Transition à l'Espagne d'aujourd'hui : Franco, la Constitution de 1978, las autonomías, la Monarchie — les repères pour l'expression et l'oral du bac.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Francisco Franco : dictature 1939-1975 (après la guerre civile 1936-39).<br>— La Transition (1975-1978) : Juan Carlos Ier, la Constitution de 1978 (démocratie, décentralisation).<br>— L'Espagne des autonomies : 17 comunidades autónomas (plus Ceuta et Melilla), langues co-officielles.<br>— Monarchie parlementaire : le roi Felipe VI, chef de l'État ; président du gouvernement.<br>— Repères culturels : Cervantes, Gaudí, le flamenco, la Movida, le sport (Real/Barça).</div>\n<h3>1. Repères historiques</h3>\n<div class=\"tip\"><b>1936-1939 : la guerre civile</b> (la Guerra Civil) — républicains contre nationaux (Franco) ; Guernica (Picasso, 1937) en devient le symbole.<br><b>1939-1975 : la dictature de Franco</b> — censure, répression, isolement international, puis développement économique des années 60 (tourisme).<br><b>1975 : mort de Franco</b> — début de la <b>Transición</b> : Juan Carlos Ier devient roi (désigné par Franco !) mais conduit la démocratisation avec Adolfo Suárez.<br><b>1978 : la Constitution</b> — État de droit, monarchie parlementaire, Estado de las Autonomías ; légalisation des partis (dont le PCE, 1977) ; amnesty.<br><b>1986 : entrée dans la CEE</b> (ancêtre de l'UE) — essor économique et modernisation ; JO de Barcelone et Expo de Séville (1992).<br><b>2004+ : attentats du 11-M, crise économique de 2008 (chômage des jeunes), Indignados (2011), Catalan : consultation controversée 2017.</div>\n<h3>2. L'Espagne des autonomies</h3>\n<div class=\"tip\"><b>17 comunidades autónomas</b> (+ Ceuta et Melilla, villes autonomes) — dont : Andalucía, Cataluña (catalogne), País Vasco (pays basque), Galicia, Madrid, Comunidad Valenciana.<br><b>Langues co-officielles :</b> le castillan (officiel de l'État) + catalan, euskera (basque), gallego (galicien), occitan (Val d'Aran).<br><b>Statuts d'autonomie :</b> chaque communauté a son parlement et son gouvernement (la Generalitat en Catalogne, le Gobierno Vasco) — une décentralisation unique en Europe.<br>⚠️ Le thème catalan (referendum du 1er octobre 2017, déclaration suspendue) et basque (le souvenir de l'ETA, qui a déposé les armes en 2017) sont des sujets d'essais fréquents.</div>\n<h3>3. Institutions et société</h3>\n<div class=\"tip\"><b>Monarchie parlementaire :</b> le roi (Felipe VI depuis 2014) est chef de l'État ; el presidente del gobierno (chef du gouvernement) dirige la politique — élu par le Congreso de los Diputados.<br><b>Le Parlement :</b> Congreso + Senado ; deux grands partis : PSOE (socialiste) et PP (populaire), plus Podemos, Vox et les partis régionaux.<br><b>Société :</b> l'Espagne est décentralisée, touristique (~80 millions de visiteurs/an — 2e destination mondiale) et de culture latine méditerranéenne ; la famille, la fête (fiestas locales, ferias, Semana Santa) et le sport (fútbol !) structurent la vie sociale.</div>\n<h3>4. Culture et figures</h3>\n<table><tr><th>Domaine</th><th>Repères</th></tr>\n<tr><td><b>Littérature</b></td><td>Miguel de Cervantes, Don Quijote (1605) ; Federico García Lorca (poète, fusillé en 1936) ; les écrivains de la génération de 27</td></tr>\n<tr><td><b>Peinture</b></td><td>Diego Velázquez, Francisco de Goya, Pablo Picasso (Guernica), Salvador Dalí, Joan Miró</td></tr>\n<tr><td><b>Architecture</b></td><td>Antoni Gaudí (Sagrada Família, Barcelone) ; les cathédrales de Séville, Grenade (Alhambra)</td></tr>\n<tr><td><b>Musique/danse</b></td><td>le flamenco (Andalousie), la copla, la Movida madrileña (années 80, Almodóvar : la vague culturelle post-Franco)</td></tr>\n<tr><td><b>Sport</b></td><td>Real Madrid vs FC Barcelone (el clásico) ; Rafa Nadal ; la Roja (championne du monde 2010)</td></tr></table>\n<div class=\"piege\">⚠️ Ne pas confondre la Guerra Civil (1936-39) et la dictature (1939-75) — la guerre PRECEDE la dictature.<br>⚠️ Le castillan est la langue officielle de TOUT l'État ; catalan/basque/galicien sont co-officiels dans leurs communautés.<br>⚠️ L'Espagne est une monarchie depuis 1978 (pas une république) — sauf 1873-74 et 1931-39 (les deux républiques) !</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Ejemplo detallado — un essai sur la Transition</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sujet : « La Transición : un miracle démocratique ? » Rédige une introduction (contexte + problématique + plan).</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Contexte historique</b> : <i>Après la mort de Franco en 1975, l'Espagne a dû passer d'une dictature de presque quarante ans à une démocratie moderne, sans guerre civile ni rupture violente.</i></div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Problématique</b> : <i>¿Cómo fue posible este milagro democrático en tan poco tiempo?</i> (Comment ce miracle démocratique a-t-il été possible en si peu de temps ?)</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Annonce du plan</b> : <i>D'abord veremos el papel del rey Juan Carlos y de Adolfo Suárez ; luego analizaremos la Constitución de 1978 y el pacto entre las Españas ; finalmente nos preguntaremos si la Transición terminó de verdad.</i> — l'essay de civilisation suit la même architecture qu'en anglais ou français : contexte (dates exactes), problématique (question qui tient le sujet), plan (trois étapes) : les repères de civilisation sont la MATIÈRE de l'argumentation — pas une liste à réciter, mais des outils pour penser.</div></div></details>"},
{"id": "amerique-latine", "theme": "Civilisation : l'Amérique latine (Espagnol)", "niveau": "Collège/Lycée — Espagnol", "titre": "Civilisation : l'Amérique latine", "cours": "<div class=\"cours-head\"><h2>Civilisation : América Latina</h2><p>Conquête et indépendances, l'Amérique latine contemporaine : cultures métisses, figures et enjeux — les repères pour enrichir l'expression.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— 1492 : Colomb arrive ; XVIe : conquête (Cortés au Mexique 1521, Pizarro au Pérou 1533) ; empires aztèque et inca.<br>— XIXe : indépendances (1810-1830, Bolívar, San Martín, Miguel Hidalgo).<br>— XXe : révolution cubaine (1959, Che Guevara, Fidel Castro) ; dictatures militaires ; Mexique et Brésil géants.<br>— Figures : Frida Kahlo, Gabriel García Márquez, Borges, Evita Perón, Pablo Neruda, Messi (le football !).<br>— Mots-clés : mestizaje (métissage), Cumbia/reggaeton, littérature du « realismo mágico ».</div>\n<h3>1. La conquête et le métissage</h3>\n<div class=\"tip\"><b>1492 :</b> Christophe Colomb arrive aux Caraïbes — « rencontre des deux mondes » (encuentro) ou conquête (conquista) : les empires aztèque (Tenochtitlán, prise par Cortés en 1521) et inca (Pérou, Pizarro 1533) tombent ; maladies, exploitation, évangélisation.<br><b>Le mestizaje :</b> le mélange des populations (européennes, indigènes, africaines) crée les sociétés latino-américaines — un concept central (Símon Bolívar rêvait d'une « race nouvelle ») : aujourd'hui : l'Amérique latine est majoritairement métisse ; les langues natives (quechua, guaraní, nahuatl) coexistent avec l'espagnol.<br><b>L'Espagnol d'aujourd'hui :</b> plus de 480 millions de locuteurs natifs — la 2e langue maternelle du monde ; l'Amérique latine concentre l'essentiel (Mexique ~130 M, Colombie ~50 M, Argentine ~45 M...).</div>\n<h3>2. Les indépendances (1810-1830)</h3>\n<div class=\"tip\"><b>Le contexte :</b> l'exemple des États-Unis (1776) et de la France (1789), l'invasion napoléonienne de l'Espagne (1808) — les colonies s'interrogent.<br><b>Les figures :</b> <b>Simón Bolívar</b> (le Libertador — Venezuela, Colombie, Équateur, Pérou, Bolivie — qui porte son nom !) ; <b>José de San Martín</b> (Argentine, Chili, Pérou) ; <b>Miguel Hidalgo</b> (le « cri de Dolores » 1810, Mexique).<br><b>Le résultat :</b> vers 1830, presque toute l'Amérique latine est indépendante — mais des républiques instables (caudillos, guerres civiles) et l'héritage du sous-développement subsistent.</div>\n<h3>3. Le XXe et XXIe siècle</h3>\n<div class=\"tip\"><b>1959 : la révolution cubaine</b> — Fidel Castro et le Che Guevara renversent Batista ; Cuba devient socialiste (alliance avec l'URSS, crise des missiles 1962 ; blocus américain toujours en vigueur).<br><b>Les dictatures militaires (années 60-80) :</b> l'Argentine (junta 1976-83, disparus/desaparecidos), le Chili (Pinochet 1973-90), le Brésil — puis les transitions démocratiques (les Madres de la Plaza de Mayo).<br><b>Aujourd'hui :</b> le Brésil et le Mexique, les deux géants ; les maux persistants : inégalités (les favelas), narcotrafic, corruption, migrations ; les succès : la culture mondiale (reggaeton,Netflix et séries, football — Messi et Maradona !).</div>\n<h3>4. Culture et figures</h3>\n<table><tr><th>Domaine</th><th>Repères</th></tr>\n<tr><td><b>Littérature</b></td><td>le « realismo mágico » : Gabriel García Márquez (Cent ans de solitude, Nobel 1982), Jorge Luis Borges (Argentine), Mario Vargas Llosa, Pablo Neruda (Nobel, Chili), Octavio Paz</td></tr>\n<tr><td><b>Peinture</b></td><td>Frida Kahlo (Mexique, autoportraits), Diego Rivera (muralisme), Fernando Botero (Colombie)</td></tr>\n<tr><td><b>Musique</b></td><td>le tango (Argentine), la salsa (Cuba/Porto Rico), la cumbia (Colombie), le reggaeton (Porto Rico : Daddy Yankee, Bad Bunny)</td></tr>\n<tr><td><b>Sport</b></td><td>le football : Pelé (Brésil), Maradona et Messi (Argentine) ; la Copa América</td></tr></table>\n<div class=\"piege\">⚠️ Le Brésil est lusophone (portugais !) — l'Amérique HISPANIQUE exclut le Brésil (mais l'Amérique LATINE l'inclut).<br>⚠️ L'espagnol d'Amérique latine : « ustedes » remplace « vosotros » ; le vocabulaire varie (coche/carro, ordenador/computadora).<br>⚠️ Bolívar ≠ Bolivia : l'homme (Vénézuélien) et le pays (qui porte son nom).</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Ejemplo detallado — un exposé sur le métissage culturel</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sujet : « El mestizaje : la richesse de l'Amérique latine ? » Prépare trois arguments avec exemples datés.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Argument historique</b> : <i>La conquista de 1492 a creado sociedades mestizas : la lengua española se mezcló con las lenguas nativas — el Náhuatl dio palabras como « chocolate » o « tomate » al español y al mundo.</i></div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Argument culturel</b> : <i>La música es un crisol : el tango mezcla la habanera cubana y les rythmes africains ; el reggaeton combina el reggae jamaïcano et le hip-hop — hoy conquista el mundo.</i></div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Argument critique</b> : <i>Sin embargo, el mestizaje tiene su cara oscura : la conquista fue también un genocidio (las enfermedades mataron millones de indígenas) y las desigualdades sociales siguen hoy (los pueblos originarios marginados).</i> — l'essai équilibré : thèse (richesse), exemples (langue, musique), contre-point (le revers de la conquête) : la civilisation latine se prête au débat argumenté — trois blocs, une conclusion personnelle, et l'exposé est structuré.</div></div></details>"},
];

{"id": "presente", "fiche": "<b>L'essentiel</b><br>— parler : hablo, hablas, habla, hablamos, habláis, hablan.<br>— comer : como... coméis, comen ; vivir : vivo... vivís, viven.<br>— Diphtongues e→ie, o→ue, u→ue aux 3 sg + 3e pl (quiero, puedo, juego) — sauf nosotros/vosotros.<br>— Irréguliers : soy, estoy, voy, tengo, hago, digo, sé.<br>— hay = il y a.<br><b>Méthodes</b><br>— Identifier le groupe (-ar/-er/-ir) puis vérifier si le verbe diphtongue.<br>— Accent écrit sur habláis/coméis/vivís.<br><b>Pièges</b><br>— « pienso » pour nous ✗ (pensamos).<br>— Confondre ser et estar (voir chapitre suivant)."},
{"id": "ser-estar", "fiche": "<b>L'essentiel</b><br>— SER : identité, origine, nationalité, profession, heure, caractéristiques — soy, eres, es, somos, sois, son.<br>— ESTAR : lieu, état momentané, résultat, présent progressif (está estudiando) — estoy, estás, está.<br>— Adjectifs à double sens : listo (intelligent/prêt), aburrido (ennuyeux/qui s'ennuie), verde (vert/pas mûr).<br><b>Méthodes</b><br>— Question-test : définition ou circonstance ?<br>— Tout lieu géographique → estar.<br><b>Pièges</b><br>— Estoy francés ✗ (origine = ser).<br>— Soy en casa ✗ (lieu = estar).<br>— Está muerto (résultat, pas es)."},
{"id": "indefinido-imperfecto", "fiche": "<b>L'essentiel</b><br>— Indefinido (action datée/ponctuelle) : hablé, hablaste, habló, hablamos, hablasteis, hablaron ; comí, comiste, comió...<br>— Irréguliers indefinido : fui/fue (ser ET ir), tuve, hice, dije, estuve, pude, supe, vine.<br>— Imperfecto (décor, habitude, en cours) : hablaba ; comía, vivía — très régulier.<br>— Seuls irréguliers imperfecto : era (ser), iba (ir), veía (ver).<br>— Marqueurs : ayer, de repente → indefinido ; siempre, todos los días, mientras → imperfecto.<br><b>Méthodes</b><br>— Photo ou film ? Une seule question par verbe.<br>— Interruption : imperfecto (en cours) + indefinido (l'événement).<br><b>Pièges</b><br>— Habitude à l'indefinido ✗.<br>— fui = je fus / j'allai (contexte !)."},
{"id": "futuro-condicional", "fiche": "<b>L'essentiel</b><br>— Futur : infinitif + é, ás, á, emos, éis, án → hablaré, comeré.<br>— Conditionnel : infinitif + ía, ías, ía, íamos, íais, ían → hablaría, comería.<br>— 12 racines irrégulières communes : tendr-, har-, dir-, saldr-, vendr-, podr-, querr-, sabr-, pondr-, habr-...<br>— Emplois : futur (projection, promesse, prédiction, probabilité) ; conditionnel (politesse, souhait — me gustaría, hypothèse, conseil).<br><b>Méthodes</b><br>— Vérifier : verbe irrégulier ? même racine aux deux temps.<br>— Jamais de conditionnel après SI (si tuviera..., ...ía).<br><b>Pièges</b><br>— « comere » sans accent ✗ ; infinitif coupé ✗.<br>— habré/habría ≠ haré/haría (haber vs hacer)."},
{"id": "genero-numero", "fiche": "<b>L'essentiel</b><br>— -o / -a (alto, alta) ; consonne + a au féminin (español → española).<br>— Invariables en genre : verde, azul, gris, marrón, rosa, inteligente, -ista, feliz.<br>— Pluriel : +s (voyelle), +es (consonne), -z → -ces (feliz → felices).<br>— Noms pièges : el problema (m.), la mano (f.), la foto, la moto, la clase.<br><b>Méthodes</b><br>— Apprendre chaque nom AVEC son article (el/la).<br>— Relire chaque adjectif : genre ? nombre ?<br><b>Pièges</b><br>— la problema ✗ ; el mano ✗.<br>— azul marino invariable.<br>—— los días lunes/jueves invariables."},
{"id": "pronoms-complements", "fiche": "<b>L'essentiel</b><br>— COD : lo, la, los, las (genre + nombre). COI : le, les (personnes).<br>— Place : avant le verbe conjugué ; collé à l'infinitif, au gérondif, à l'impératif affirmatif ; devant l'impératif négatif.<br>— le/les + lo/la/los/las → se : se lo doy.<br>— Réfléchis : me, te, se, nos, os, se (me llamo, se levanta).<br>— gustar : me gusta(n) — accord avec ce qui plaît.<br><b>Méthodes</b><br>— Test : à qui ? à quoi ? (COD/COI).<br>— Ordre des pronoms combinés : COI avant COD (et se remplace le/les).<br><b>Pièges</b><br>— La veo (personne), pas lo.<br>— Le lo ✗ → se lo.<br>— Me gustan los deportes (pluriel)."},
{"id": "imperativo-subjuntivo", "fiche": "<b>L'essentiel</b><br>— Impératif tú affirmatif : présent sans s : ¡Habla, come, escribe ! ; ¡Ven, ten, sal, haz, di, pon, ve, sé !<br>— Impératif négatif = subjonctif : ¡No hables, no comas, no vayas, no seas !<br>— Subjonctif présent : -ar → -e ; -er/-ir → -a : hable, coma, viva ; diphtongues : vuelva, piense, duerma.<br>— Déclencheurs : querer que, esperar que, alegrarse de que, no creer que, es importante que, cuando (futur), para que.<br><b>Méthodes</b><br>— Vérifier le déclencheur (que + verbe ?).<br>— Ordre affirmatif/négatif : deux formes différentes à mémorier par verbe.<br><b>Pièges</b><br>— Creo que ES (indicatif) / No creo que SEA (subjonctif).<br>— Espero que VIENES ✗ → vengas.<br>— ¡Ve! (ir) vs ¡Sé! (ser)."},
{"id": "lexique-cotidien", "fiche": "<b>L'essentiel</b><br>— Salutations : hola, buenos días/buenas tardes/noches ; adiós, hasta luego/mañana.<br>— Politesse : por favor, gracias, de nada, perdón, lo siento.<br>— Famille : padres, hermanos, abuelos, tíos, primos, hijo/a.<br>— École : instituto, asignatura, deberes, examen, recreo.<br>— Repas : desayuno, comida, merienda, cena ; cuenta (addition), camarero.<br>— Achats : ¿Cuánto cuesta?, caro/barato, tienda, mercado, rebajas.<br><b>Méthodes</b><br>— Mémoriser par blocs de situation (hôtel, marché, restaurant).<br>— Se méfier des faux-amis (biblioteca, largo, asistir).<br><b>Pièges</b><br>— biblioteca = bibliothèque / librería = librairie.<br>— largo = long / ancho = large.<br>— los padres = les parents."},
{"id": "civilisation-espagne", "fiche": "<b>L'essentiel</b><br>— Guerre civile 1936-39 ; dictature de Franco 1939-1975 ; Transition 1975-78 ; Constitution de 1978 ; CEE 1986.<br>— 17 communautés autonomes ; langues co-officielles : castillan + catalan, euskera, gallego.<br>— Monarchie parlementaire : Felipe VI, président du gouvernement, Congreso.<br>— Culture : Cervantes (Don Quijote), Picasso (Guernica), Gaudí, flamenco, la Movida.<br><b>Méthodes</b><br>— Ancrer chaque idée d'essay sur un repère daté.<br>— Distinguer guerre civile / dictature / transition.<br><b>Pièges</b><br>— L'Espagne est une monarchie (1978), pas une république.<br>— Catalogne ≠ Espagne entière ; el clásico = Real/Barça."},
{"id": "amerique-latine", "fiche": "<b>L'essentiel</b><br>— 1492 : Colomb ; 1521 Cortés (Aztèques) ; 1533 Pizarro (Incas).<br>— Indépendances 1810-1830 : Bolívar, San Martín, Hidalgo.<br>— 1959 : révolution cubaine (Castro, le Che) ; dictatures (Argentine 1976-83, Chili 1973-90).<br>— Mestizaje : concept central (langue, musique, sociétés).<br>— Culture : García Márquez (realismo mágico), Borges, Frida Kahlo, tango, salsa, reggaeton.<br>— L'espagnol : ~480 M de locuteurs natifs, 2e langue maternelle mondiale.<br><b>Méthodes</b><br>— Distinguer Amérique latine (inclut le Brésil) / Amérique hispanique (exclut le Brésil lusophone).<br>— Ancrer chaque argument sur une date ou une figure.<br><b>Pièges</b><br>— Le Brésil parle portugais !<br>— ustedes (pas vosotros) en Amérique latine."},
];

{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Nosotros ___ español en clase » (aprender, -er)", "c": ["aprendemos", "aprenden", "aprendo", "aprendéis"], "a": 0, "e": "nosotros + verbe en -er : -emos → aprendemos.", "d": "<b>La terminaison de « nosotros »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : aprender = verbe en -er : la terminaison pour nosotros est <b>-emos</b> : <i>Nosotros <b>aprendemos</b> español en clase.</i> (nous apprenons l'espagnol en classe) : la grille complète du -er : -o, -es, -e, -emos, -éis, -en : les distracteurs reprennent d'autres personnes (aprendo = je, aprenden = ils) : au QCM, la méthode : (1) le sujet (nosotros) ; (2) le groupe du verbe (-er) ; (3) la terminaison correspondante (-emos) : réflexe d'or de toute conjugaison espagnole — et il fonctionne pour 90 % des verbes.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Yo ___ mucho » (poder)", "c": ["podo", "puedo", "podeis", "podemos"], "a": 1, "e": "poder diphtongue o→ue : yo puedo (je peux).", "d": "<b>La chaussure des diphtongues</b>.<div class='ex-detail'><u>Exemple rédigé</u> : poder change son o en <b>ue</b> aux personnes « fortes » : puedo, puedes, puede, pueden (et podéis) — MAIS pas à nous/vous : <b>podemos</b> (le o initial reste !) : la forme « podo » n'existe pas : le secret de mémorisation : les personnes qui diphtonguent (yo, tú, él, ellos) forment une <b>botte</b> (boot pattern) dans le tableau de conjugaison — nosotros/vosotros en sont exclus : dessiner la botte une fois et la retenir visuellement règle tous les verbes diphtongués (puedo, quiero, juego, duermo...).</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "Le présent de « tener » (avoir) :", "c": ["teno, tenes, tene, tenemos, tenéis, tienen", "tengo, tienes, tiene, tengamos, tenéis, tienen", "tengo, tienes, tiene, tenemos, tenéis, tienen", "tengo, tienes, tiene, tenemos, tenéis, tienan"], "a": 2, "e": "tener est irrégulier à la 1re personne : tengo — mais régulier ensuite (tienes, tiene, tenemos, tenéis, tienen).", "d": "<b>Tengo : l'irrégularité concentrée sur « yo »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Tengo quince años.</i> (j'ai quinze ans) : la particularité : l'ajout d'un <b>g</b> à la 1re personne (tengo) — puis la conjugaison redevient normale : tienes, tiene, tenemos, tenéis, tienen : la même famille de « yo en -go » : hacer → <b>hago</b>, poner → <b>pongo</b>, salir → <b>salgo</b>, venir → <b>vengo</b>, decir → <b>digo</b> : l'astuce d'examen : si le verbe finit en -cer/-cir/-enir et a un yo bizarre, chercher le -go : la formule « tengo hambre » (j'ai faim) — littéralement « j'ai faim », pas « je suis faim » : une différence de vision du monde entre le français et l'espagnol.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Ellos ___ al teatro los domingos » (ir)", "c": ["van", "van a", "vais", "ven"], "a": 0, "e": "ir (aller) : voy, vas, va, vamos, vais, VAN — ellos van (ils vont).", "d": "<b>Ir : le verbe-caméléon</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Ellos <b>van</b> al teatro los domingos.</i> (ils vont au théâtre le dimanche) : la conjugaison complète : voy, vas, va, vamos, vais, van — une racine v- minimaliste : le piège du distracteur « ven » : c'est le verbe VER (voir) — voy/ven se ressemblent à l'oreille ! : la distinction : ir (aller) → voy, vas, va ; ver (voir) → veo, ves, ve : autre usage clé : <b>ir a + infinitif</b> = futur proche : <i>Voy a estudiar esta tarde</i> (je vais étudier tout à l'heure) : les deux emplois (mouvement + futur proche) font de ir l'un des verbes les plus rentables à maîtriser.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "Quelle forme est correcte pour « vosotros » avec « hablar » ?", "c": ["hablan", "hablais", "habláis", "hablamos"], "a": 2, "e": "vosotros + -ar → habláis (avec accent écrit sur la terminaison -áis).", "d": "<b>L'accent qui change le sens</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la 2e personne du pluriel en -ar : <b>habláis</b> — avec accent sur le á : la même famille : com<b>éis</b>, viv<b>ís</b>, está<b>ís</b> : pourquoi l'accent compte : « hablais » sans accent violerait la règle de l'accentuation espagnole (le mot serait aigu en terminant en s, il exigerait l'accent) — l'accent écrit corrige la prononciation (ha-BLA-YS) : la confusion habláis/hablan : la terminaison -áis = vous (Espagne), la terminaison -an = ils/elles (ou ustedes) : ce point d'orthographe est très souvent relevé à l'écrit : le maîtriser évite la faute « gratuite ».</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Nosotros ___ una película esta noche » (pensar)", "c": ["piensan", "pienso", "piensamos", "pensamos"], "a": 3, "e": "pensar diphtongue (pienso) SAUF à nosotros/vosotros : pensamos.", "d": "<b>La botte, encore elle !</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la règle d'or des diphtongues : e→ie ou o→ue aux personnes de la « botte » (yo, tú, él/ella, ellos/ellas) MAIS la voyelle originale à nosotros/vosotros : <i>Nosotros <b>pensamos</b> una película esta noche.</i> (nous pensons/avons l'intention de regarder un film ce soir) — « piensamos » est la faute type : la logique historique : les formes nosotros/vosotros sont plus anciennes (héritées du latin, accentuées sur la racine étymologique) — les autres personnes ont évolué : la conséquence pratique : chaque fois que tu vois nous/vous + un verbe diphtonguant, vérifier deux fois la voyelle (pensamos, podéis, jugamos, duermos... non : dormimos ! — dormir est un -ir : dormimos, duermen).</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "Le présent de « hay » signifie :", "c": ["ils sont", "ils vont", "j'ai", "il y a"], "a": 3, "e": "hay = il y a (forme impersonnelle unique, invariable) : hay un libro, hay muchos libros.", "d": "<b>Hay, l'indispensable invariable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Hay</i> sert à exprimer l'EXISTENCE : <i>Hay un problema. / Hay muchos estudiantes en la clase.</i> (il y a un problème / de nombreux étudiants) : la particularité : forme UNIQUE, pas de conjugaison (pas de « hayn » pour le pluriel !) : l'origine : haber (avoir) — hoy surgió la forme figée : la nuance avec « está/están » : <i>hay</i> introduit du NOUVEAU (existence) ; <i>está</i> localise du déjà connu : <i>Hay una farmacia aquí. — ¿Dónde está? — Está en la esquina.</i> : en expression écrite, une phrase avec hay = un point de départ pour décrire (une ville, une école, une fête) : c'est le premier verbe à automatiser.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« ¿Qué ___ tú esta tarde ? » (hacer)", "c": ["haces", "hacéis", "hacen", "hago"], "a": 0, "e": "hacer à la 2e personne : haces — ¿Qué haces esta tarde ? (qu'est-ce que tu fais ce soir ?)", "d": "<b>Hacer : la question sociale par excellence</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>¿Qué <b>haces</b> tú esta tarde?</i> (que fais-tu ce soir ?) : la conjugaison : hago (yo, avec le g !), haces, hace, hacemos, hacéis, hacen : les usages essentiels : la météo (<i>Hace frío/calor/sol/viento</i> — il fait froid/chaud/soleil/vent : l'espagnol « fait » la météo avec hacer !) ; les expressions figées (<i>hacer los deberes, hacer deporte, hacer una pregunta</i>) : la question ¿Qué haces...? est l'ouverture parfaite d'un dialogue d'examen (projets, loisirs) : la réponse modèle : <i>Esta tarde hago los deberes y luego juego al fútbol.</i> — deux verbes irréguliers dans une phrase naturelle : la maîtrise de hacer rapporte à CHAQUE oral.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Yo no ___ nada » (saber)", "c": ["sé", "sepo", "sabe", "sabo"], "a": 0, "e": "saber : yo SÉ (accent écrit !) — je sais : Yo no sé nada (je ne sais rien).", "d": "<b>Sé : l'accent du savoir</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Yo no <b>sé</b> nada.</i> (je ne sais rien) : la conjugaison : sé, sabes, sabe, sabemos, sabéis, saben — l'accent écrit sur sé est obligatoire (il distingue le verbe du pronom réfléchi « se » !) : la nuance avec connaître : <i>saber</i> = savoir (un fait, faire quelque chose : <i>sé nadar</i> — je sais nager) ; <i>conocer</i> = connaître (une personne, un lieu : <i>conozco Madrid</i>) : la faute « sabo » est LA régularisation interdite : les verbes en -aber (saber, haber) refusent la terminaison normale au yo : « No sé » est la réponse la plus utile du voyageur — la connaître (avec son accent) ouvre toutes les conversations.</div>"},
{"t": "Le présent de l'indicatif (Espagnol)", "q": "« Mis amigos ___ fútbol cada sábado » (jugar)", "c": ["juegan", "jugan", "juegan a", "jugamos"], "a": 0, "e": "jugar est le seul verbe u→ue : ellos juegan (ils jouent).", "d": "<b>Jugar : la diphtongue solitaire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : jugar est le SEUL verbe espagnol avec la diphtongue <b>u→ue</b> : juego, juegas, juega, jugamos, jugáis, juegan : <i>Mis amigos <b>juegan</b> al fútbol cada sábado.</i> (mes amis jouent au football chaque samedi) : la préposition : <b>jugar A</b> + sport/jeu (jugar al fútbol, jugar a las cartas) — une particularité espagnole (comparer : jouer À en français, play - in anglais) : la logique de la diphtongue : le u tonique se renforce en ue (juego) — même mécanisme sonore que puedo/quiero : mémoriser jugar comme « l'exception ue » — il vient dans tous les textes sur les loisirs.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Madrid ___ en España » (lieu)", "c": ["es", "soy", "estoy", "está"], "a": 3, "e": "TOUT lieu (même permanent !) → estar : Madrid está en España.", "d": "<b>Le paradoxe du lieu</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la tentation : « Madrid est TOUJOURS en Espagne, donc permanent, donc ser » — FAUX : la règle espagnole est catégorique : tout emplacement, même éternel, prend <b>estar</b> : <i>Madrid <b>está</b> en España.</i> : la même logique : <i>El libro está en la mesa</i> (le livre est sur la table), <i>Barcelona está en el Mediterráneo</i> : l'astuce mnémotechnique : estar = l'existence LOCALISÉE (où ça se passe) ; ser = l'identité (ce que c'est) : la faute « es en España » est LE point piégeux du chapitre — la corriger distingue immédiatement le débutant de l'élève rodé.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Nosotros ___ franceses » (nationalité)", "c": ["son", "estamos", "somos", "están"], "a": 2, "e": "Nationalité, origine → ser : nosotros SOMOS franceses.", "d": "<b>L'origine, affaire de ser</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la nationalité fait partie de l'IDENTITÉ (ce que l'on est, définitionnellement) → <b>ser</b> : <i>Nosotros <b>somos</b> franceses.</i> (nous sommes français) : la famille de ser : origine (<i>soy de Lyon</i>), profession (<i>es médico</i>), identité (<i>es mi hermana</i>), heure (<i>son las cinco</i>), matière (<i>es difícil</i>) : la faute inverse : « estamos franceses » est absurde (on ne « se trouve pas » français !) : la logique profonde : ser répond à « ¿quién es? ¿qué es? » (qui ? quoi ?) ; estar répond à « ¿dónde? ¿cómo? » (où ? comment ?) : les deux questions d'identification évitent toute hésitation.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Hoy estoy muy ___ » (fatigué, état du jour)", "c": ["cansada", "estar cansado", "ser cansado", "cansado"], "a": 3, "e": "État momentané → estar + cansado (accord avec le sujet masculin : cansado).", "d": "<b>Comment on va, aujourd'hui</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'état passager (fatigue du jour) → <b>estar</b> : <i>Hoy estoy muy <b>cansado</b>.</i> (aujourd'hui je suis très fatigué) : l'accord : cansad<b>o</b> si le locuteur est masculin ; cansad<b>a</b> au féminin — l'adjectif s'accorde, pas le verbe : la nuance : <i>Está cansado</i> (il est fatigué — aujourd'hui) vs <i>Es trabajador</i> (il est travailleur — caractère) : la fatigue est un ÉTAT, la paresse un TRAIT : en dialogue d'examen, « ¿Cómo estás? — Estoy cansado pero contento » est l'échange-social de base : deux états, deux accords, un verbe estar impeccable.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Mi hermana ___ médica » (profession)", "c": ["estoy", "es", "está", "somos"], "a": 1, "e": "Profession = identité durable → ser : mi hermana es médica.", "d": "<b>La profession, une identité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : être médecin, c'est CE QU'ELLE EST (identité durable) → <b>ser</b> : <i>Mi hermana <b>es</b> médica.</i> (ma sœur est médecin) : en espagnol, la profession se dit SANS article (pas « una médica » — sauf nuance emphatique) : la famille ser : <i>Es profesor. Somos estudiantes.</i> : le contraste avec estar : on peut « estar de médica » (faire un remplacement, temporaire) — l'emploi de estar introduit la provisoire ! : la question d'examen : identité (ser) ou fonction passagère (estar) ? : dans la présentation orale (me llamo... soy estudiante... mi padre es ingeniero), le ser des professions est incontournable — un point d'entrée du dialogue.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Los niños ___ durmiendo » (en train de dormir)", "c": ["es", "son", "están", "estamos"], "a": 2, "e": "Présent progressif = estar + gérondif : los niños están durmiendo.", "d": "<b>Estar + gérondif : l'action en cours</b>.<div class='ex-detail'><u>Exemple rédigé</u> : pour dire « être en train de », l'espagnol utilise TOUJOURS <b>estar</b> + gérondif (-ando/-endo) : <i>Los niños <b>están durmiendo</b>.</i> (les enfants sont en train de dormir) : la formation du gérondif : -ar → -ando (hablando), -er/-ir → -iendo (comiendo, viviendo) : la faute « son durmiendo » est impossible : le progressif espagnol est un EXCLUSIF estar (jamais ser, jamais tener) : les usages : décrire une photo (<i>En la foto, la familia está comiendo</i>), raconter le présent (<i>¿Qué estás haciendo? — Estoy estudiando</i>) : la description d'image au bac commence presque toujours par estar + gérondif — la structure est LE réflexe du chapitre.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Son las ocho » — le verbe SER est utilisé parce que :", "c": ["l'heure est un état", "l'heure change tout le temps", "c'est une exception sans logique", "l'heure est une donnée d'identité (définition du moment)"], "a": 3, "e": "L'heure, la date, les événements → ser : identité du moment (son las ocho, es lunes, es mi cumpleaños).", "d": "<b>L'heure : la carte d'identité du moment</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'espagnol conceptualise l'heure comme une DEFINITION : « il est huit heures » = le moment EST (par essence) huit heures : <i><b>Son las ocho.</b> (pluriel — les huit heures !) / <b>Es</b> la una.</b> (singulier — une heure) : la même logique : <i>Es lunes. Es el 14 de julio. Es mi cumpleaños.</i> (dates et événements) : la question piège : « l'heure change tout le temps » — oui, mais la règle n'est pas la permanence : c'est l'IDENTITÉ (ce que c'est), pas la localisation : le couple : ¿Qué hora ES? (quelle heure est-il — ser) / ¿Dónde ESTÁS? (où es-tu — estar) : mémoriser le duo et l'heure est réglée pour toujours.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« Juan es listo » signifie :", "c": ["Juan est prêt d'esprit", "Juan est prêt", "Juan est intelligent", "Juan est vif-argent"], "a": 2, "e": "ser listo = être intelligent (trait) ; estar listo = être prêt (état).", "d": "<b>Listo : l'adjectif à deux visages</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Juan <b>es</b> listo</i> = Juan est MALIN (c'est sa nature — ser) : <i>Juan <b>está</b> listo</i> = Juan est PRÊT (il a fini ses bagages — état, estar) : la famille des adjectifs à double sens : aburrido (es aburrido = il est ennuyeux / está aburrido = il s'ennuie), bueno (es bueno = il est bon, gentil / está bueno = c'est bon, au goût !), vivo (es vivo = malin / está vivo = vivant), verde (es verde = vert / está verde = pas mûr) : la logique : avec ser, l'adjectif qualifie l'ESSENCE ; avec estar, il décrit un ÉTAT momentané : ces doubles sens sont des chouchous d'examen — la liste se mémorise en paires opposées.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« La ventana está abierta » — estar parce que :", "c": ["c'est le RÉSULTAT d'une action (quelqu'un l'a ouverte)", "les objets prennent toujours estar", "la fenêtre est une chose", "abierta est un lieu"], "a": 0, "e": "État résultant d'une action → estar : la porte/fenêtre est ouverte/fermée (résultat) — même si ça dure !", "d": "<b>Le résultat d'une action : territoire estar</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>La ventana <b>está abierta</b>.</i> (la fenêtre est ouverte) : la logique : la fenêtre n'est pas « ouverte par essence » — quelqu'un l'a OUVERTE : c'est le résultat d'un procès → estar : la même famille : <i>La puerta está cerrada. El café está frío. La casa está limpia.</i> (résultats d'actions : fermer, refroidir, nettoyer) : le contraste : <i>El café es de Colombia</i> (identité : origine) vs <i>El café está frío</i> (résultat) : la frontière : DEFINITION (ser) vs CONSEQUENCE D'ACTION (estar) : la mort aussi : <i>Está muerto</i> (résultat de mourir) — jamais « es muerto » : ce critère du résultat est LE troisième pilier du chapitre (après identité et lieu).</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "Quelle phrase est correcte ?", "c": ["Estoy de acuerdo con tú.", "Soy acuerdo contigo.", "Estoy de acuerdo contigo.", "Soy de acuerdo contigo."], "a": 2, "e": "« Être d'accord » = estar de acuerdo + conmigo/contigo/connigo... : Estoy de acuerdo contigo.", "d": "<b>De acuerdo : accord avec estar</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'expression figée : <b>estar de acuerdo</b> (être d'accord) : <i><b>Estoy de acuerdo</b> contigo.</i> (je suis d'accord avec toi) : le piège « soy de acuerdo » : la faute de calque (les élèves transposent « soy » partout) — or l'expression est IDIOMATIQUE, elle prend estar : la suite des pronènes : conmigo (avec moi), contigo (avec toi), con él/ella, con nosotros/vosotros, con ellos : la négation : <i>No estoy de acuerdo</i> (je ne suis pas d'accord) — LA formule de l'expression d'opinion (<i>Estoy de acuerdo con la idea de que...</i>) : en débat, en essay, en dialogue : la formule revient sans cesse — la conjuguer avec estar est un marqueur de correction immédiat.</div>"},
{"t": "Ser ou estar : les deux « être » (Espagnol)", "q": "« ¿Cómo ___ tu hermano ? — Es alto y simpático » (description physique)", "c": ["está", "es", "estoy", "somos"], "a": 1, "e": "Description physique, caractère (traits permanents) → ser : ¿Cómo es? Es alto y simpático.", "d": "<b>¿Cómo es ou cómo está ?</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les deux questions existent avec des sens DIFFÉRENTS : <i>¿Cómo <b>es</b> tu hermano?</i> = comment est-il ? (physique, caractère — description) : <i>¿Cómo <b>está</b> tu hermano?</i> = comment va-t-il ? (santé, humeur du jour) : la réponse de l'énoncé « Es alto y simpático » (traits permanents) confirme ser : la paire d'examens : décrire une personne → ¿Cómo es? ; prendre des nouvelles → ¿Cómo está? : la même ambiguïté en français (« comment est votre frère ? » vs « comment va votre frère ? ») — l'espagnol la lexicalise : la description physique (alto, bajo, rubio, moreno) et le caractère (simpático, tímido, serio) vivent avec ser ; l'humeur (contento, triste, cansado aujourd'hui) avec estar : deux questions, deux mondes — le QCM favori du chapitre.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« Ayer ___ al supermercado » (ir, action datée)", "c": ["fui", "voy", "iba", "iré"], "a": 0, "e": "« Ayer » = action ponctuelle datée → indefinido : fui (allai).", "d": "<b>Ayer : le mot qui décide</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « ayer » (hier) DATE l'action : elle est ponctuelle et terminée → <b>indefinido</b> : <i>Ayer <b>fui</b> al supermercado.</i> (hier je suis allé au supermarché) : la forme iba (imperfecto) décrirait une habitude (« antes iba cada semana » — avant j'y allais chaque semaine) : le mot-clé du chapitre : indefinido pour l'événement DATÉ (ayer, anoche, el año pasado, en 2018, de repente) ; imperfecto pour l'habitude (todos los días, siempre) : la confusion fui/iba est LA faute reine du passé espagnol — un seul mot du contexte (ayer vs siempre) la résout à coup sûr.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« De niño, ___ al parque todos los días » (habitude)", "c": ["fui", "iba", "soy", "voy"], "a": 1, "e": "Habitude répétée (« todos los días ») → imperfecto : iba (j'allais).", "d": "<b>Todos los días : la marque de l'habitude</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « de niño... todos los días » = une HABITUDE passée → <b>imperfecto</b> : <i>De niño, <b>iba</b> al parque todos los días.</i> (enfant, j'allais au parc tous les jours) : la logique : ce n'est pas UN événement mais une RÉPÉTITION (un film, pas une photo) : la même règle pour tous les verbes : <i>jugaba, leía, comíamos, íbamos</i> avec siempre, cada verano, todas las tardes : la faute inverse (« fui todos los días ») traîne partout dans les copies : l'astuce : si tu peux ajouter « chaque fois » dans la phrase, c'est l'imperfecto : la question de l'enfance (raconter son passé) est un thème d'expression récurrent — elle vit entière dans l'imperfecto.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "L'imperfecto de « ser » :", "c": ["estaba, estabas...", "fui, fuiste, fue...", "era, eras, era, éramos, erais, eran", "soy, eres, es..."], "a": 2, "e": "ser à l'imperfecto : era, eras, era, éramos, erais, eran (avec accent à nous : éramos !).", "d": "<b>Era : le décor de tous les récits</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Era</b> un día de verano. La casa <b>era</b> enorme y <b>había</b> un jardín.</i> (c'était un jour d'été — description) : la conjugaison complète : era, eras, era, <b>éramos</b>, erais, eran — l'accent sur éramos (à ne pas oublier !) : les seuls 3 irréguliers de l'imperfecto : <b>era</b> (ser), <b>iba</b> (ir), <b>veía</b> (ver) — TOUT le reste est régulier : la puissance de era : c'est le verbe de la DESCRIPTION au passé (les personnages, les lieux, l'heure) : dans toute narration, era installe le décor avant que l'indefinido ne fasse avancer l'action : « Era una vez... » (il était une fois) — le début de tous les contes espagnols.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« Mientras ___ , escuchaba música » (cocinar, action en cours)", "c": ["cociné", "cocinaré", "cocino", "cocinaba"], "a": 3, "e": "« mientras » (pendant que) + action en cours → imperfecto : cocinaba.", "d": "<b>Mientras : la porte de l'imperfecto</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « mientras » introduit deux actions PARALLÈLES dans le passé → les deux à l'imperfecto : <i>Mientras <b>cocinaba</b>, escuchaba música.</i> (pendant que je cuisinais, j'écoutais de la musique) : la logique : les deux actions durent, aucune n'interrompt l'autre — c'est le « film » intégral : le contraste avec l'interruption : <i>Cocinaba cuando sonó el teléfono</i> (l'imperfecto d'un côté, l'indefinido de l'autre — le téléphone INTERROMPT) : la règle : mientras → toujours imperfecto ; cuando + indefinido → interruption : cette architecture (parallèle vs interruption) structure tout récit au passé — la maîtriser c'est écrire une narration digne de ce nom.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "L'indefinido de « hacer » :", "c": ["hacé", "hago, haces...", "hice, hiciste, hizo, hicimos, hicisteis, hicieron", "hacía"], "a": 2, "e": "hacer à l'indefinido : hice, hiciste, hizo... (racine hic-).", "d": "<b>Hice : la racine qui change</b>.<div class='ex-detail'><u>Exemple rédigé</u> : à l'indefinido, faire change de racine : <b>hic-</b> : hice, hiciste, hizo, hicimos, hicisteis, hicieron : <i>Ayer <b>hice</b> los deberes.</i> (hier j'ai fait mes devoirs) : la famille des indefinidos irréguliers à connaître : tuve (tener), pude (poder), puse (poner), quise (querer), vine (venir), dije (decir), estuve (estar), supe (saber), di (dar), vi (ver), <b>fui</b> (ser/ir) : la particularité de hacer : la 3e personne <b>hizo</b> perd le c (hi-ZO, pas « hico ») : le réflexe d'examen : au passé daté, vérifier la liste des irrégéguliers AVANT d'écrire — 15 verbes, une demi-page, et la moitié des fautes de narration disparaissent.</div>"},
{"t": "Le passé : indefinido et imperfecto (Espagnol)", "q": "« Cuando era pequeño, ___ una vez al dentista » (ir, chaque année)", "c": ["iba", "voy", "voya", "fui"], "a": 0, "e": "Habitude annuelle (una vez al año sous-entendu) → imperfecto : iba.", "d": "<b>L'habitude, même sans « todos los días »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « cuando era pequeño » (quand j'étais petit — imperfecto, la description !) + une fréquence passée (une fois par an) = HABITUDE → <b>iba</b> : <i>Cuando era pequeño, <b>iba</b> una vez al año al dentista.</i> (enfant, j'allais une fois par an chez le dentiste) : la détection : les marqueurs de fréquence au passé (una vez al año, cada verano, siempre, los domingos) → imperfecto : le double piège : « era » (imperfecto de ser — correct pour le contexte d'enfance) ET « fui » (indefinido — incorrect ici, ce n'est pas UN événement) : les phrases « cuando era pequeño... » sont le cadre idéal de l'expression sur l'enfance — elles vivent TOUTES à l'imperfecto : une structure à recopier telle quelle pour son oral.</div>"},
