<script>
var PROGRAMME = [{"n":"Collège — 6e (cycle 3)","ch":[{"t":"La matière : états, mélanges et changements d'état","id":"matiere-etats"},{"t":"Séparer les constituants d'un mélange","id":"separation-melanges"},{"t":"L'air et la combustion","id":"air-combustion"},{"t":"Mesurer : masse, volume et température","id":"mesures"},{"t":"Énergies et objets techniques","id":"energie-objets"},{"t":"Décrire le mouvement","id":"mouvement-6e"},{"t":"L'information et le numérique : coder et décoder","id":"information-numerique"}]}];
var COURS_META = [
  {
    "id": "matiere-etats",
    "theme": "La matière : états, mélanges et changements d'état (6e)",
    "niveau": "6e",
    "titre": "La matière : états, mélanges et changements d'état",
    "cours": "<div class=\"cours-head\"><h2>La matière : états, mélanges et changements d'état</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois états de la matière</h3>\n<p>Toute la matière qui nous entoure existe sous trois états usuels :</p>\n<table>\n<tr><th>État</th><th>Forme / volume</th><th>À l'œil nu</th><th>Exemples</th></tr>\n<tr><td><b>solide</b></td><td>forme et volume propres</td><td>on peut le prendre en main</td><td>glace, fer, sucre, caillou</td></tr>\n<tr><td><b>liquide</b></td><td>volume propre, prend la forme du récipient</td><td>coule, se verse</td><td>eau, huile, lait</td></tr>\n<tr><td><b>gaz</b></td><td>occupe tout l'espace disponible</td><td>le plus souvent invisible</td><td>vapeur d'eau, air</td></tr>\n</table>\n<div class=\"tip\"><b>C'est le même corps !</b> L'eau existe solide (glace), liquide et gazeux (vapeur d'eau) : c'est <b>toujours</b> le même corps, la même matière ; seule son organisation change.</div>\n\n<h3>2. Les changements d'état</h3>\n<div class=\"formule\">solide → liquide : <b>fusion</b> &nbsp;·&nbsp; liquide → solide : <b>solidification</b><br>liquide → gaz : <b>vaporisation</b> &nbsp;·&nbsp; gaz → liquide : <b>liquéfaction</b><br>solide → gaz : <b>sublimation</b> &nbsp;·&nbsp; gaz → solide : <b>condensation solide</b></div>\n<ul>\n<li>Un changement d'état se produit quand on chauffe ou qu'on refroidit ;</li>\n<li>La <b>masse ne change pas</b> : 10 g d'eau liquide donnent 10 g de glace (à l'état solide, l'eau occupe un peu <b>plus de place</b> : la glace flotte !) ;</li>\n<li>L'eau bout à <b>100 °C</b> et gèle à <b>0 °C</b> (conditions usuelles).</li>\n</ul>\n\n<h3>3. Mélanges et corps purs</h3>\n<ul>\n<li><b>Corps pur</b> : une seule substance (eau distillée, sucre pur) ;</li>\n<li><b>Mélange homogène</b> : on ne distingue pas les constituants, même à la loupe (eau sucrée, air) ;</li>\n<li><b>Mélange hétérogène</b> : on voit plusieurs <b>phases</b> (eau + huile, eau + sable) ;</li>\n<li>Dissoudre du sucre dans l'eau : le sucre <b>ne disparaît pas</b> — le mélange garde sa masse et son goût sucré.</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La vapeur d'eau, c'est la buée blanche » : non, la vapeur est <b>invisible</b> ; la buée = gouttelettes <b>liquides</b>.</li>\n<li>« Un mélange homogène est un corps pur » : non, homogène veut juste dire qu'on ne voit pas les constituants.</li>\n<li>« Fondre la glace change sa masse » : la masse est <b>conservée</b>, c'est le volume qui change.</li>\n<li>« Le gaz, ça pèse rien » : 1 L d'air pèse environ <b>1,3 g</b>.</li>\n</ul>\n</div>"
  },
  {

    "niveau": "6e",
    "titre": "Séparer les constituants d'un mélange",
    "cours": "<div class=\"cours-head\"><h2>Séparer les constituants d'un mélange</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Pourquoi séparer ?</h3>\n<p>Récupérer l'eau potable, traiter les eaux usées, fabriquer du jus sans pulpe… : on choisit la technique <b>selon le type de mélange</b>.</p>\n<table>\n<tr><th>Mélange</th><th>Exemple</th><th>Technique adaptée</th></tr>\n<tr><td>solide non dissous dans un liquide</td><td>sable + eau</td><td><b>filtration</b>, décantation</td></tr>\n<tr><td>deux liquides non miscibles</td><td>huile + eau</td><td><b>décantation</b> (puis ampoule)</td></tr>\n<tr><td>solide dissous dans un liquide</td><td>eau salée</td><td><b>évaporation</b> (ou distillation)</td></tr>\n<tr><td>liquide + liquide miscibles</td><td>alcool + eau</td><td><b>distillation</b></td></tr>\n</table>\n\n<h3>2. La filtration</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 430 210\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Filtration : un entonnoir muni d un papier filtre retient le sable, l eau filtree coule dans un verre\">\n  <defs><marker id=\"fa\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker></defs>\n  <line x1=\"120\" y1=\"20\" x2=\"120\" y2=\"70\" stroke=\"#64748b\" stroke-width=\"2\" marker-end=\"url(#fa)\"/>\n  <text x=\"132\" y=\"34\" font-size=\"10\" fill=\"#64748b\">mélange sable + eau</text>\n  <polygon points=\"130,70 200,70 165,140\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2.5\"/>\n  <line x1=\"130\" y1=\"84\" x2=\"200\" y2=\"84\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <path d=\"M133,74 L197,74\" stroke=\"#f8fafc\" stroke-width=\"10\"/>\n  <circle cx=\"150\" cy=\"80\" r=\"3\" fill=\"#a16207\"/><circle cx=\"172\" cy=\"79\" r=\"2.5\" fill=\"#a16207\"/><circle cx=\"182\" cy=\"83\" r=\"3\" fill=\"#a16207\"/>\n  <line x1=\"165\" y1=\"140\" x2=\"165\" y2=\"165\" stroke=\"#2563eb\" stroke-width=\"2.5\" marker-end=\"url(#fa)\"/>\n  <text x=\"180\" y=\"155\" font-size=\"10\" fill=\"#2563eb\">eau filtrée</text>\n  <rect x=\"125\" y=\"165\" width=\"80\" height=\"34\" rx=\"6\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2.5\"/>\n  <path d=\"M127,180 q20,-6 40,0 t40,0 L205,197 L127,197 Z\" fill=\"#bfdbfe\"/>\n  <text x=\"330\" y=\"120\" font-size=\"10\" fill=\"#475569\" text-anchor=\"middle\">le papier filtre retient le sable :</text>\n  <text x=\"330\" y=\"134\" font-size=\"10\" fill=\"#475569\" text-anchor=\"middle\">seule l'eau passe (le filtrat)</text>\n</svg><span class=\"fig-cap\">La filtration sépare un solide non dissous du liquide dans lequel il baigne.</span></div>\n\n<h3>3. La décantation et l'évaporation</h3>\n<ul>\n<li><b>Décantation</b> : on laisse reposer ; le plus lourd (sable, huile selon la densité) se dépose, on verse ensuite le liquide au-dessus ;</li>\n<li><b>Évaporation</b> : chauffée, l'eau salée laisse le sel derrière elle — preuve que le sel était <b>dissous</b>, pas disparu ;</li>\n<li><b>Distillation</b> : on chauffe, la vapeur se liquéfie dans un réfrigérant : on récupère le liquide pur (dessalement de l'eau de mer).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — choisir la bonne technique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Après la pluie, l'eau d'une flaque est trouble (boue). Comment obtenir de l'eau limpide ?</div><div class=\"etu\"><b>Étape 1 — Observer</b> : l'eau trouble est <b>hétérogène</b> : la boue est un solide non dissous.</div><div class=\"etu\"><b>Étape 2 — Laisser reposer</b> : la boue, plus lourde, se dépose au fond (<b>décantation</b>).</div><div class=\"etu\"><b>Étape 3 — Filtrer</b> : on verse le tout sur un papier filtre : l'eau limpide recueillie s'appelle le <b>filtrat</b>, la boue reste sur le filtre (le <b>résidu</b>).</div><div class=\"etu\"><b>Étape 4 — Remarque</b> : l'eau limpide n'est pas forcément <b>potable</b> : des substances dissoutes (invisible) peuvent rester.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Filtrer une eau salée : <b>inutile</b> — le sel est dissous, il traverse le filtre.</li>\n<li>Confondre <b>filtrat</b> (ce qui passe) et <b>résidu</b> (ce qui est retenu).</li>\n<li>« L'eau filtrée est potable » : la filtration n'enlève pas ce qui est dissous.</li>\n</ul>\n</div>"
  },

    "id": "air-combustion",
    "theme": "L'air et la combustion (6e)",
    "niveau": "6e",
    "titre": "L'air et la combustion",
    "cours": "<div class=\"cours-head\"><h2>L'air et la combustion</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'air est un mélange de gaz</h3>\n<p>L'air n'est pas « rien » : c'est un <b>mélange homogène de gaz</b>, il a une masse (≈ 1,3 g pour 1 L) et il occupe tout l'espace disponible.</p>\n<table>\n<tr><th>Constituant</th><th>Proportion dans l'air</th></tr>\n<tr><td><b>diazote</b></td><td>environ 78 %</td></tr>\n<tr><td><b>dioxygène</b></td><td>environ 21 %</td></tr>\n<tr><td>autres gaz (argon, dioxyde de carbone…)</td><td>environ 1 %</td></tr>\n</table>\n\n<h3>2. La combustion a besoin de dioxygène</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 430 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Experience de la bougie sous un bocal : la flamme s eteint quand le dioxygene est consomme\">\n  <defs><marker id=\"ba\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#ef4444\"/></marker></defs>\n  <rect x=\"40\" y=\"140\" width=\"140\" height=\"16\" rx=\"3\" fill=\"#e2e8f0\"/>\n  <rect x=\"100\" y=\"112\" width=\"14\" height=\"28\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <path d=\"M107,100 C101,92 103,86 107,80 C108,86 112,88 112,80 C112,88 110,94 107,100 Z\" fill=\"#f59e0b\"/>\n  <path d=\"M140,100 L90,26\" stroke=\"#ef4444\" stroke-width=\"2\" marker-end=\"url(#ba)\"/>\n  <text x=\"150\" y=\"50\" font-size=\"10\" fill=\"#ef4444\">l'eau monte dans le bocal :</text>\n  <text x=\"150\" y=\"64\" font-size=\"10\" fill=\"#ef4444\">une partie du gaz a été consommée</text>\n  <path d=\"M60,36 L186,36 L186,156 L60,156 Z\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2.5\"/>\n  <path d=\"M62,60 q10,-6 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 L182,154 L62,154 Z\" fill=\"#bfdbfe\" opacity=\"0.8\"/>\n  <text x=\"123\" y=\"180\" font-size=\"10\" fill=\"#475569\" text-anchor=\"middle\">la flamme s'éteint : le dioxygène est épuisé</text>\n  <text x=\"300\" y=\"120\" font-size=\"10\" fill=\"#475569\" text-anchor=\"middle\">sans dioxygène, pas de combustion :</text>\n  <text x=\"300\" y=\"134\" font-size=\"10\" fill=\"#475569\" text-anchor=\"middle\">les 21 % de l'air sont indispensables</text>\n</svg><span class=\"fig-cap\">Expérience : une bougie enfermée sous un bocal retourné s'éteint au bout d'un moment.</span></div>\n<ul>\n<li>Sans dioxygène, la flamme s'éteint : c'est le <b>comburant</b> de la combustion ;</li>\n<li>Le <b>combustible</b>, c'est ce qui brûle (bois, bougie, gaz, papier…) ;</li>\n<li>Trois conditions pour brûler : <b>combustible + comburant (dioxygène) + chaleur</b>.</li>\n</ul>\n\n<h3>3. Les produits de la combustion</h3>\n<ul>\n<li>Combustion du charbon ou du gaz : produit du <b>dioxyde de carbone</b> (il trouble l'eau de chaux) et de la <b>vapeur d'eau</b> ;</li>\n<li>Combustion incomplète (mauvaise arrivée d'air) : formation de <b>suie</b> (fumées noires) et surtout de <b>monoxyde de carbone</b>, un gaz <b>invisible, inodore et mortel</b> ;</li>\n<li>D'où l'importance de <b>ventiler</b> (cheminée, VMC, aération des chaudières).</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« L'air, c'est surtout du dioxygène » : non, c'est surtout du <b>diazote</b> (78 %).</li>\n<li>« La combustion produit de l'oxygène » : non, elle en <b>consomme</b>.</li>\n<li>« Une flamme s'éteint faute de carburant » : sous le bocal, elle s'éteint faute de <b>dioxygène</b>.</li>\n<li>Oublier que le monoxyde de carbone est <b>inodore</b> : on ne le sent pas arriver.</li>\n</ul>\n</div>"
  },

    "id": "mesures",
    "theme": "Mesurer : masse, volume et température (6e)",
    "niveau": "6e",
    "titre": "Mesurer : masse, volume et température",
    "cours": "<div class=\"cours-head\"><h2>Mesurer : masse, volume et température</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Grandeurs, unités et instruments</h3>\n<table>\n<tr><th>Grandeur</th><th>Unité usuelle</th><th>Autres unités</th><th>Instrument</th></tr>\n<tr><td><b>masse</b></td><td>kilogramme (kg)</td><td>gramme (g) : 1 kg = 1000 g</td><td>balance (électronique ou à plateaux)</td></tr>\n<tr><td><b>volume</b></td><td>litre (L)</td><td>millilitre (mL) : 1 L = 1000 mL</td><td>éprouvette graduée, bécher gradué</td></tr>\n<tr><td><b>température</b></td><td>degré Celsius (°C)</td><td>—</td><td>thermomètre</td></tr>\n</table>\n<div class=\"tip\"><b>Bon réflexe</b> : avant toute mesure, on <b>estime</b> l'ordre de grandeur, on choisit l'instrument adapté, et on vérifie qu'il est bien <b>réglé</b> (balance au zéro, thermomètre non faussé).</div>\n\n<h3>2. Mesurer une masse</h3>\n<ul>\n<li>Balance électronique : poser le récipient, <b>tarer</b> (remettre à zéro), puis verser ;</li>\n<li>Balance à plateaux : équilibrer avec les masses marquées ;</li>\n<li>La masse se mesure en <b>grammes ou kilogrammes</b> — jamais en litres !</li>\n</ul>\n\n<h3>3. Mesurer un volume de liquide</h3>\n<ul>\n<li>Poser l'éprouvette <b>à plat sur la table</b>, verser, puis lire au niveau de la surface libre ;</li>\n<li>Prendre garde au <b>ménisque</b> : lire à la base de la goutte centrale, l'œil à hauteur de la surface ;</li>\n<li>Choisir une éprouvette adaptée : plus elle est petite et fine, plus la précision est grande.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — mesurer 50 mL d'eau proprement</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On doit verser exactement 50 mL d'eau dans une éprouvette de 100 mL. Décrire les étapes.</div><div class=\"etu\"><b>Étape 1 — Choisir</b> : une éprouvette de 100 mL (graduations tous les 1 mL) suffit et convient.</div><div class=\"etu\"><b>Étape 2 — Verser</b> : verser d'à peu près 45 mL, puis ajuster goutte à goutte avec une pipette.</div><div class=\"etu\"><b>Étape 3 — Lire</b> : éprouvette posée, œil à hauteur du ménisque : le bas du ménisque affleure la graduation 50.</div><div class=\"etu\"><b>Étape 4 — Piège</b> : si l'œil est trop haut ou trop bas, la graduation paraît décalée (parallaxe) : la lecture est fausse.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre <b>masse</b> (kg) et <b>volume</b> (L) : 1 kg de plume et 1 kg de plomb ont la même masse, pas le même volume.</li>\n<li>Lire un volume éprouvette <b>en main</b> : penchée, la lecture est fausse — la poser.</li>\n<li>« Le thermomètre affiche tout de suite la bonne valeur » : il faut <b>attendre la stabilisation</b>.</li>\n</ul>\n</div>"
  },

    "id": "energie-objets",
    "theme": "Énergies et objets techniques (6e)",
    "niveau": "6e",
    "titre": "Énergies et objets techniques",
    "cours": "<div class=\"cours-head\"><h2>Énergies et objets techniques</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les formes d'énergie</h3>\n<ul>\n<li>Énergies <b>cinétique</b> (mouvement), <b>potentielle</b> (position, hauteur), <b>thermique</b> (chaleur), <b>lumineuse</b>, <b>chimique</b> (piles, aliments, carburants), <b>électrique</b> ;</li>\n<li>L'énergie ne disparaît jamais : elle se <b>transforme</b> d'une forme à une autre.</li>\n</ul>\n<div class=\"formule\">Chaîne d'énergie d'une lampe de poche :<br>énergie <b>chimique</b> (pile) → énergie <b>électrique</b> → énergie <b>lumineuse</b> (+ un peu de thermique)</div>\n\n<h3>2. Les objets techniques et leur fonction</h3>\n<ul>\n<li>Un objet technique est créé pour répondre à un <b>besoin</b> : sa <b>fonction d'usage</b> décrit ce qu'il fait (« éclairer », « se déplacer », « conserver ») ;</li>\n<li>Il est fait de <b>matériaux</b> choisis pour leurs propriétés, et il utilise une <b>source d'énergie</b> ;</li>\n<li>Un objet peut être décomposé en <b>éléments</b> qui remplissent chacun une fonction (alimenter, transmettre, actionner…).</li>\n</ul>\n<table>\n<tr><th>Matériau</th><th>Propriétés</th><th>Exemple d'usage</th></tr>\n<tr><td>métal (acier, alu)</td><td>résistant, conducteur</td><td>vélo, carrosserie</td></tr>\n<tr><td>bois</td><td>léger, isolant, facile à travailler</td><td>meuble, manche d'outil</td></tr>\n<tr><td>plastique</td><td>léger, malléable, isolant</td><td>jouet, emballage</td></tr>\n<tr><td>verre</td><td>transparent, rigide, fragile</td><td>fenêtre, bouteille</td></tr>\n</table>\n\n<h3>3. Sources d'énergie et économies</h3>\n<ul>\n<li>Sources <b>renouvelables</b> : soleil, vent, eau, bois, chaleur du sol ;</li>\n<li>Sources <b>non renouvelables</b> : pétrole, charbon, gaz, uranium — en quantité limitée ;</li>\n<li>Économiser l'énergie : isoler, couper les veilles, préférer la lampe LED à l'ampoule à incandescence (qui gaspille en chaleur) ;</li>\n<li>Quelques gestes mesurables : 1 °C de chauffage en moins ≈ 7 % d'énergie économisée.</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« L'énergie disparaît » : non, elle se <b>transforme</b> ; une partie part toujours en chaleur.</li>\n<li>« Le bois est non renouvelable » : si, le bois est <b>renouvelable</b> (on replante), le pétrole non.</li>\n<li>Confondre <b>fonction d'usage</b> (ce que fait l'objet) et <b>fonction d'estime</b> (ce qu'il montre : luxe, mode).</li>\n<li>« La lampe à incandescence produit surtout de la lumière » : elle produit surtout de la <b>chaleur</b> (≈ 95 %).</li>\n</ul>\n</div>"
  },
  {
    "id": "mouvement-6e",
    "theme": "Décrire le mouvement (6e)",
    "niveau": "6e",
    "titre": "Décrire le mouvement",
    "cours": "<div class=\"cours-head\"><h2>Décrire le mouvement</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Est-ce en mouvement ?</h3>\n<p>Un objet est <b>en mouvement</b> par rapport à un autre objet appelé le <b>référentiel</b>.</p>\n<ul>\n<li>Dans un TGV, mon téléphone posé est <b>immobile</b> par rapport au wagon… et <b>en mouvement</b> par rapport au quai ;</li>\n<li>Le mouvement dépend donc du point de vue : il est <b>relatif</b>.</li>\n</ul>\n\n<h3>2. Trajectoire et vitesse</h3>\n<ul>\n<li>La <b>trajectoire</b> est la ligne suivie par l'objet : ligne droite (mouvement rectiligne), cercle (circulaire) ;</li>\n<li>La <b>vitesse</b> indique la distance parcourue pendant une durée donnée :</li>\n</ul>\n<div class=\"formule\">vitesse = distance ÷ durée &nbsp;&nbsp;(ex. : 100 km en 2 h → 50 km/h)</div>\n<ul>\n<li>Si la vitesse ne change pas : mouvement <b>uniforme</b> ; si elle augmente ou diminue : <b>accéléré</b> ou <b>ralenti</b>.</li>\n</ul>\n\n<h3>3. Déplacements et transports</h3>\n<ul>\n<li>Différents moyens de déplacement : marche, vélo, voiture, train, avion ; leur vitesse et leur impact énergétique différent ;</li>\n<li>Sécurité : la distance d'arrêt augmente fortement avec la vitesse d'où les limitations (30 km/h en ville).</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Immobile, c'est absolu » : non, tout dépend du <b>référentiel</b>.</li>\n<li>Confondre vitesse en km/h et en m/s (36 km/h = 10 m/s).</li>\n<li>« La vitesse moyenne suffit toujours » : elle cache des accélérations et des arrêts.</li>\n</ul>\n</div>"
  },

    "id": "information-numerique",
    "theme": "L'information et le numérique : coder et décoder (6e)",
    "niveau": "6e",
    "titre": "L'information et le numérique : coder et décoder",
    "cours": "<div class=\"cours-head\"><h2>L'information et le numérique : coder et décoder</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce qu'une information ?</h3>\n<ul>\n<li>Une <b>information</b> est un message (texte, nombre, image, son) qu'on veut transmettre ou enregistrer ;</li>\n<li>La faire passer par un support (papier, écran, câble) suppose la <b>coder</b> avec des conventions.</li>\n</ul>\n\n<h3>2. Le codage binaire</h3>\n<p>Un ordinateur ne connaît que deux états : courant qui <b>passe</b> ou qui <b>ne passe pas</b> — notés <b>1</b> et <b>0</b>.</p>\n<ul>\n<li>Chaque 0 ou 1 est un <b>bit</b> ; 8 bits = un <b>octet</b> ;</li>\n<li>Un caractère peut être codé par un octet : c'est ce qui permet de stocker un texte ;</li>\n<li>Une image est codée par des <b>pixels</b> (petits carrés), chacun décrit par des nombres ;</li>\n<li>Une couleur se décompose en <b>rouge, vert, bleu</b> (RVB) : avec ces 3 lumières on fabrique presque toutes les couleurs.</li>\n</ul>\n\n<h3>3. Décoder : les erreurs de codage</h3>\n<ul>\n<li>Un code mal appliqué rend le message illisible (mojibake d'un texte) ;</li>\n<li>Changer 1 seul bit d'une image peut modifier un pixel : le codage est <b>précis</b> ;</li>\n<li>Un <b>algorithme</b> est une suite d'instructions pour traiter l'information (classer, rechercher, trier).</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« L'ordinateur réfléchit » : il ne fait qu'exécuter des <b>instructions</b> codées.</li>\n<li>Confondre <b>bit</b> (0 ou 1) et <b>octet</b> (8 bits).</li>\n<li>« 0 » veut dire « rien » : non, c'est un état du code, aussi utile que 1.</li>\n<li>Zoomer à l'extrême sur une photo : on voit les <b>pixels</b>, preuve du codage.</li>\n</ul>\n</div>"
  }

    "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Trois états : solide, liquide, gaz — le même corps peut passer de l'un à l'autre.</li>\n<li>Changements d'état : fusion, solidification, vaporisation, liquéfaction (masse conservée).</li>\n<li>Corps pur (une substance) ≠ mélange homogène (invisible) ≠ hétérogène (phases visibles).</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Observer : une ou plusieurs phases ?</li>\n<li>Chauffer / refroidir : nommer le changement d'état observé.</li>\n<li>Vérifier : la masse totale ne change pas.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>La vapeur d'eau est invisible (la buée est liquide).</li>\n<li>Homogène ne veut pas dire corps pur.</li>\n<li>L'air a une masse (≈ 1,3 g/L).</li>\n</ul>"

      if (!s.t) return;
      T(x, y, ln.size, s.b, s.t, COL.blk);
      x += 0.52 * ln.size * pdfEnc(pdfTranslit(s.t)).length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  for (var p = 0; p < pages.length; p++){
    var pgFoot = 'Fiche synth\u00e9tique' + (typeof PDF_MATIERE !== 'undefined' && PDF_MATIERE ? ' \u2014 ' + PDF_MATIERE : '') + ' \u2014 ' + curTitle;
    var fx = M, fw = 0.52 * 7.5 * pdfEnc(pdfTranslit(pgFoot)).length;
    pages[p].push(rg(COL.gry) + ' BT 1 0 0 1 ' + fx + ' 30 Tm /F1 7.5 Tf (' + pdfEsc(pdfEnc(pdfTranslit(pgFoot))) + ') Tj ET');
    var pn = 'Page ' + (p + 1) + ' / ' + pages.length;
    var pw = 0.52 * 7.5 * pn.length;
    pages[p].push('BT 1 0 0 1 ' + (W - M - pw).toFixed(2) + ' 30 Tm /F1 7.5 Tf (' + pdfEsc(pn) + ') Tj ET');
  }
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p2 = 0; p2 < pages.length; p2++){
    var po = 5 + 2 * p2, co = 6 + 2 * p2;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p2].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i2 = 1; i2 < objs.length; i2++){
    offs[i2] = out.length;
    if (objs[i2].indexOf('STREAM:') === 0){
      var st = objs[i2].slice(7);
      out += i2 + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i2 + ' 0 obj\n' + objs[i2] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i3 = 1; i3 < objs.length; i3++) out += ('0000000000' + offs[i3]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
// ===== Progression QCM (enregistrement local, navigateur uniquement) =====
var PG_MATIERE = 'sciences-techno';
function pgHash(s){ var h = 5381; for (var i = 0; i < s.length; i++){ h = ((h << 5) + h + s.charCodeAt(i)) | 0; } return (h >>> 0).toString(36); }
function pgKey(){ return 'patty-qcm-pg-' + PG_MATIERE; }
function pgLoad(){ try { return JSON.parse(localStorage.getItem(pgKey()) || '{}'); } catch(e){ return {}; } }
function pgSave(q, ok){
  try {
    var d = pgLoad(); var t = q.t;
    if (!d[t]) d[t] = { n: 0, q: {} };
    d[t].n = QUESTIONS.filter(function(x){ return x.t === t; }).length;
    if (!d[t].q) d[t].q = {};
    d[t].q[pgHash(q.q)] = ok ? 1 : 0;
    localStorage.setItem(pgKey(), JSON.stringify(d));
    pgResume();
  } catch(e) {}
}
function pgReset(){ if (!window.confirm('Réinitialiser la progression de cette matière ?')) return; try { localStorage.removeItem(pgKey()); } catch(e){} pgResume(); }
function pgChap(theme){
  for (var i = 0; i < COURS_META.length; i++){ if (COURS_META[i].theme === theme){ currentChap = COURS_META[i].id; break; } }
  showTab('quiz'); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function pgToggle(){ var e = document.getElementById('pg-chaps'); if (e) e.style.display = (e.style.display === 'none') ? 'flex' : 'none'; }
function pgResume(){
  var el = document.getElementById('pg-resume'); if (!el) return;
  var d = pgLoad(); var ans = 0, ok = 0;
  Object.keys(d).forEach(function(t){ var qq = (d[t] && d[t].q) || {}; Object.keys(qq).forEach(function(h){ ans++; if (qq[h]) ok++; }); });
  if (!ans) { el.style.display = 'none'; return; }
  var tot = QUESTIONS.length || 1;
  var pctA = Math.round(100 * Math.min(ans, tot) / tot);
  var pctR = Math.round(100 * ok / ans);
  var col = pctR >= 70 ? '#4ade80' : (pctR >= 50 ? '#fbbf24' : '#f87171');
  var c = (2 * Math.PI * 14).toFixed(1);
  var h = '<div class="pg-top">';
  h += '<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="5"/><circle cx="17" cy="17" r="14" fill="none" stroke="' + col + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + (c * pctA / 100).toFixed(1) + ' ' + c + '" transform="rotate(-90 17 17)"/></svg>';
  h += '<span><b>' + ans + ' / ' + tot + '</b> questions répondues (' + pctA + ' %) · réussite <b style="color:' + col + '">' + pctR + ' %</b></span>';
  h += '<button class="pg-toggle" onclick="pgToggle()">chapitres ▾</button>';
  h += '<button class="pg-rz" onclick="pgReset()" title="Réinitialiser la progression de cette matière">réinitialiser</button>';
  h += '</div>';
  var byT = {}; QUESTIONS.forEach(function(q){ byT[q.t] = (byT[q.t] || 0) + 1; });
  h += '<div class="pg-chaps" id="pg-chaps" style="display:none">';
  COURS_META.forEach(function(cm){
    var t = cm.theme, n = byT[t] || 0;
    var dt = d[t]; var qa = 0, qo = 0;
    if (dt && dt.q) { Object.keys(dt.q).forEach(function(k){ qa++; if (dt.q[k]) qo++; }); }
    var isOk = n > 0 && qa >= n && (100 * qo / qa) >= 70;
    var cls = qa === 0 ? '' : (isOk ? ' ok' : ' mid');
    var sym = qa === 0 ? '⬜' : (isOk ? '✅' : '🟡');
    var tip = t + ' — ' + qa + '/' + n + ' question' + (n > 1 ? 's' : '') + ' répondues' + (qa ? ' (' + Math.round(100 * qo / qa) + ' % de réussite)' : '');
    h += '<button class="pg-dot' + cls + '" title="' + tip.replace(/"/g, '&quot;') + '" onclick="pgChap(\'' + t.replace(/'/g, "\\'") + '\')">' + sym + ' ' + cm.titre + '</button>';
  });
  h += '</div>';
  el.style.display = 'block';
  el.innerHTML = h;
}

function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  pgSave(state.qs[state.idx], i === state.qs[state.idx].a);
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de sciences et technologie</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p><div style="margin:12px 0 0"><input type="text" id="prog-search" oninput="progSearchList(this.value)" placeholder="🔎 Rechercher dans les cours..." style="width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.9rem;font-family:inherit;outline:none"></div><div id="prog-search-results"></div>' + h + '</section>';
})();
// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
pgResume();
