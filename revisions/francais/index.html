<script>
var PROGRAMME = [{"n": "Collège — 6e/5e", "ch": [{"t": "Les classes de mots", "id": "grammaire-classes"}, {"t": "Les fonctions dans la phrase", "id": "grammaire-fonctions"}, {"t": "Conjugaison : temps et valeurs", "id": "conjugaison-temps"}, {"t": "Orthographe : pièges et accords", "id": "orthographe-accords"}, {"t": "Le sens des mots et le lexique", "id": "lexique-sens"}]}, {"n": "Collège — 4e/3e", "ch": [{"t": "La phrase complexe et les subordonnées", "id": "subordonnees"}, {"t": "Le discours direct, indirect et indirect libre", "id": "discours"}, {"t": "Les genres et les formes littéraires", "id": "genres-formes"}, {"t": "Les registres et les tonalités", "id": "registres"}, {"t": "Les figures de style", "id": "figures-style"}]}, {"n": "Lycée — 2de/1re", "ch": [{"t": "La poésie : du lyrisme à l'engagement", "id": "poesie"}, {"t": "Le théâtre : texte et représentation", "id": "theatre"}, {"t": "Le roman et le récit", "id": "roman"}]}, {"n": "Lycée — 1re/Terminale", "ch": [{"t": "L'argumentation : convaincre, persuader, délibérer", "id": "argumentation"}, {"t": "Le commentaire de texte", "id": "commentaire"}, {"t": "La dissertation", "id": "dissertation"}]}];
var COURS_META = [
{"id": "grammaire-classes", "theme": "Les classes de mots (6e/5e)", "niveau": "6e/5e", "titre": "Les classes de mots", "cours": "<div class=\"cours-head\"><h2>Les classes de mots</h2><span class=\"niv\">6e/5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les mots variables et invariables</h3>\n<div class=\"tip\"><b>Variables</b> (ils changent de forme) : <b>nom</b>, <b>déterminant</b>, <b>adjectif</b>, <b>verbe</b>, <b>pronom</b>. <b>Invariables</b> (forme fixe) : <b>adverbe</b> (rapidement, très), <b>préposition</b> (à, de, dans, chez), <b>conjonction</b> (et, mais, car, que).<br>Test rapide : si on peut mettre le mot au pluriel ou le conjuguer, il est variable.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — classer chaque mot</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Les enfants jouaient tranquillement dans le jardin. » Donner la classe de chaque mot.</div><div class=\"etu\"><b>Étape 1</b> — <b>Déterminant + nom</b> : « Les » (article défini), « enfants » (nom), « le » (article), « jardin » (nom).</div><div class=\"etu\"><b>Étape 2</b> — <b>Verbe + adverbe</b> : « jouaient » (verbe jouer, imparfait), « tranquillement » (adverbe en -ment : invariable).</div><div class=\"etu\"><b>Étape 3</b> — <b>Préposition</b> : « dans » (invariable, introduit le complément). Moralité : une phrase = un assemblage de classes ; identifier les classes, c'est poser les fondations de toute la grammaire.</div></div></details>\n<h3>2. Les pièges les plus fréquents</h3>\n<div class=\"tip\"><b>« Tout »</b> peut être adjectif, nom, pronom ou adverbe ; <b>« même »</b> adjectif ou adverbe ; <b>« là/la»</b>… La classe se décide dans la PHRASE, pas dans le dictionnaire seul.<br><b>Sujet vs C.O.D.</b> = fonctions (chapitre suivant) ; ici on parle de CLASSES : un même mot peut changer de classe (« il chante un chant » : verbe puis nom).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — un mot, deux classes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Le vieil homme marche vite » puis « il pense à sa vie ». Que valent « vieil » et « vite » ?</div><div class=\"etu\"><b>Étape 1</b> — <b>« vieil »</b> : il accompagne et précise « homme » : adjectif qualificatif (variable, placé avant à cause de la voyelle).</div><div class=\"etu\"><b>Étape 2</b> — <b>« vite »</b> : il précise le verbe « marche » : adverbe (on ne dit pas « vite marcher la voiture » : il ne s'accorde jamais).</div><div class=\"etu\"><b>Étape 3</b> — <b>« vie »</b> : nom. Bilan : « il court vite » (adverbe) vs « une course rapide » (adjectif) : la question à se poser est toujours : ce mot précise-t-il un ÊTRE/CHOSE (nom), une ACTION (verbe), ou QUALIFIE-t-il un autre mot (adjectif/adverbe) ?</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « bien, mieux, vite » sont des adverbes : jamais d'accord ; « leur(s) » : déterminant (leur maison) ou pronom (ils leur parlent) ; les mots en -ment sont presque toujours des adverbes ; ne pas confondre classe (nature) et fonction.</div>"},
{"id": "grammaire-fonctions", "theme": "Les fonctions dans la phrase (6e/5e)", "niveau": "6e/5e", "titre": "Les fonctions dans la phrase", "cours": "<div class=\"cours-head\"><h2>Les fonctions dans la phrase</h2><span class=\"niv\">6e/5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Sujet, verbe, compléments : la structure de base</h3>\n<div class=\"tip\"><b>Sujet</b> : répond à « qui est-ce qui + verbe ? » (il commande l'accord du verbe !). <b>C.O.D.</b> : « verbe + quoi/qui ? » sans préposition. <b>C.O.I.</b> : « verbe + à qui/de quoi ? » avec préposition. <b>Attribut du sujet</b> : après être/sembler/devenir…, il qualifie le SUJET (et s'accorde avec lui).<br><b>Complément circonstanciel</b> : quand, où, comment, pourquoi (déplaçable, supprimable).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — faire le plan complet d'une phrase</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Hier, ma sœur a offert un cadeau à sa meilleure amie. » Identifier chaque fonction.</div><div class=\"etu\"><b>Étape 1</b> — <b>Verbe + sujet</b> : « a offert » (verbe) ; « qui est-ce qui a offert ? ⟶ ma sœur » : SUJET (c'est avec « sœur » que le verbe s'accorde : ma sœur A offert).</div><div class=\"etu\"><b>Étape 2</b> — <b>Compléments du verbe</b> : « offert QUOI ? ⟶ un cadeau » : C.O.D. ; « offert À QUI ? ⟶ à sa meilleure amie » : C.O.I. (préposition à).</div><div class=\"etu\"><b>Étape 3</b> — <b>Circonstanciel</b> : « Hier » : QUAND ? : complément circonstanciel de temps (on peut le déplacer en tête ou le supprimer). La phrase complète : sujet + verbe + C.O.D. + C.O.I. + C.C. : un schéma à mémoriser.</div></div></details>\n<h3>2. L'attribut du sujet : le piège classique</h3>\n<div class=\"tip\"><b>Attribut ≠ C.O.D.</b> : dans « il semble FATIGUÉ », « fatigué » qualifie LE SUJET (il est fatigué), il ne subit pas l'action. Après <b>être, sembler, paraître, devenir, rester</b>… on a presque toujours un attribut.<br>L'attribut s'accorde AVEC LE SUJET : « les filles semblent fatiguées » : c'est le test imparable.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — attribut ou C.O.D. ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Paul croit ses voisins honnêtes » et « Paul semble honnête » : honnête(s) = attribut ou C.O.D. ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Paut semble honnête</b> : « être honnête » se dit de Paul : le mot qualifie le SUJET : ATTRIBUT (accord : Paul semble honnête, les voisins semblent honnêtes).</div><div class=\"etu\"><b>Étape 2</b> — <b>Paut croit ses voisins honnêtes</b> : « honnêtes » qualifie « voisins » (C.O.D.), pas Paul : c'est un attribut du C.O.D. (cas des verbes : croire, trouver, nommer…). Les fleurs paraissent fraîches (attribut du sujet) vs on trouve ces fleurs fraîches (attribut du C.O.D.).</div><div class=\"etu\"><b>Étape 3</b> — <b>Application d'accord</b> : « elle les traite de voleurs » : « voleurs » s'accorde avec « les » (C.O.D.) : ce sont les accusés qui sont voleurs. La fonction d'attribut est LA source des accords les plus riches du français.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le COD se trouve SANS préposition (« regarder la télé ») ; « à » après un verbe = souvent COI mais « il pense à sa mère » = COI, « il va à Paris » = circonstanciel de lieu ; l'épithète et l'attribut sont des fonctions de l'ADJECTIF ; un groupe peut être COD dans une phrase et sujet dans une autre : la fonction est un RÔLE, pas une étiquette fixe.</div>"},
{"id": "conjugaison-temps", "theme": "Conjugaison : temps et valeurs (6e/5e)", "niveau": "6e/5e", "titre": "Conjugaison : temps et valeurs", "cours": "<div class=\"cours-head\"><h2>Conjugaison : temps et valeurs</h2><span class=\"niv\">6e/5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les trois temps de l'indicatif</h3>\n<div class=\"tip\"><b>Passé composé</b> (avoir/être + participe passé) : action achevée : « j'ai mangé ». <b>Imparfait</b> (-ais, -ais, -ait…) : description, habitude, arrière-plan : « il pleuvait, je lisais ». <b>Futur simple</b> (-ai, -as, -a…) : action à venir : « je partirai ».<br>Règle d'or du récit : l'<b>imparfait plante le décor</b>, le <b>passé composé fait avancer l'action</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — choisir le bon temps dans un récit</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Le soleil (briller)___ et les oiseaux (chanter)___. Soudain, un bruit (retentir)___ : tout le monde (sursauter)___ . » Conjuguer.</div><div class=\"etu\"><b>Étape 1</b> — <b>Décor</b> : soleil qui brille, oiseaux qui chantent : actions continues, répétées : IMPARFAIT (« brillait », « chantaient ») : c'est le fond du tableau.</div><div class=\"etu\"><b>Étape 2</b> — <b>Actions</b> : « soudain » signale une rupture : le bruit éclate UNE fois et CHANGE la situation : PASSÉ COMPOSÉ (« a retenti »), puis la réaction (« a sursauté »).</div><div class=\"etu\"><b>Étape 3</b> — <b>Lecture</b> : l'alternance imparfait/passé composé est LE moteur du récit : sans elle, tout devient plat (« il pleuvait, il a plu, il pleuvait ») : le temps raconte la tension.</div></div></details>\n<h3>2. Les valeurs : un temps, plusieurs emplois</h3>\n<div class=\"tip\"><b>Imparfait</b> : description, habitude (« tous les étés, nous allions… »), arrière-plan. <b>Présent</b> : maintenant, vérité générale (« la Terre tourne »), passé récent (« il arrive à l'instant »), futur proche (« je pars demain »). <b>Futur</b> : prédiction, mais aussi ordre poli (« vous fermerez la porte »).<br><b>Conditionnel</b> : souhait, politesse, hypothèse (« je voudrais, je mangerais bien »).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — les valeurs du présent</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « L'eau bout à 100 °C. Attention, l'eau bout ! Je pars à midi. » Expliquer les trois présents.</div><div class=\"etu\"><b>Étape 1</b> — <b>« L'eau bout à 100 °C »</b> : vérité générale, scientifique : présent de l'ÉVIDENCE (toujours vrai).</div><div class=\"etu\"><b>Étape 2</b> — <b>« l'eau bout ! »</b> : présent ACTUEL : l'action se déroule sous nos yeux (cuisine, urgence).</div><div class=\"etu\"><b>Étape 3</b> — <b>« Je pars à midi »</b> : futur proche exprimé au présent (avec un complément de temps « à midi ») : le français adore le présent à valeur de futur : « le train part dans 5 minutes » : l'énoncé garde le présent tant que le futur est considéré comme quasi certain.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « ils sont allés » avec ÊTRE (verbes de mouvement/pronominaux) mais « ils ont marché » avec AVOIR ; participe passé avec avoir : accord avec le COD seulement s'il est placé AVANT ; l'imparfait n'est pas un « passé moins fini » : c'est un temps à part entière avec ses valeurs ; verbes du 3e groupe irréguliers (aller, faire, dire, venir) : à apprendre par cœur.</div>"},
{"id": "orthographe-accords", "theme": "Orthographe : pièges et accords (6e/5e)", "niveau": "6e/5e", "titre": "Orthographe : pièges et accords", "cours": "<div class=\"cours-head\"><h2>Orthographe : pièges et accords</h2><span class=\"niv\">6e/5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'accord dans le groupe nominal</h3>\n<div class=\"tip\"><b>Déterminant + adjectif s'accordent avec le nom</b> : « une jolie petite maison » (tout au féminin singulier). Le nom est le CHEF D'ORCHESTRE du groupe.<br>Cas particuliers : les noms composés (« des timbres-poste », le second reste au singulier) ; « demi- » invariable (« des demi-heures ») ; les couleurs composés invariables (« des yeux bleu clair », sauf simples : « des robes vertes »).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — accorder sans faute</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Corriger si besoin : « des chemise bleu marine », « une demi-heure », « des grands-mères italiennes », « ces gens charmants ».</div><div class=\"etu\"><b>Étape 1</b> — « des chemiseS bleu marine » : « chemises » prend le S ; « bleu marine » (couleur composée avec nom) reste INVARIABLE.</div><div class=\"etu\"><b>Étape 2</b> — « une demi-heure » ✓ (demi- invariable devant le nom) ; « des grands-mères italiennes » ✓ (grand prend le S dans GRAND-MÈRE, nom composé : règle spéciale !).</div><div class=\"etu\"><b>Étape 3</b> — « ces gens charmants » : « gens » est masculin pluriel mais exige des adjectifs féminins placés DEVANT (« ces bonnes gens ») : les exceptions sont nombreuses : la solution, c'est l'entraînement ciblé sur les cas classiques, pas la mémoire de tout.</div></div></details>\n<h3>2. Les homophones grammaticaux : la chasse aux fautes</h3>\n<div class=\"tip\"><b>a/à</b> : « a » = verbe avoir (remplaçable par « avait ») ; <b>et/est</b> : « et » = et puis (remplaçable par « et aussi »), « est » = verbe être (« était ») ; <b>ou/où</b> : « où » avec accent = lieu ; <b>on/on n'</b> : « on n' » = négation (« on n'a pas ») ; <b>son/sont</b> : « sont » = verbe être (« étaient ») ; <b>ce/se</b> : « se » réfléchi (il se lave).<br>Méthode : REMPLACER par un synonyme ou changer le temps.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — appliquer la substitution</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Compléter : « Il ___ faim et il ___ l'école. » (a/à) ; « On ___ va pas où on ___ ? » (on/on n').</div><div class=\"etu\"><b>Étape 1</b> — <b>a/à</b> : « il A faim » (on peut dire « il AVAIT faim » : verbe) ; « il va À l'école » (préposition : pas de remplacement verbal possible).</div><div class=\"etu\"><b>Étape 2</b> — <b>on/on n'</b> : « on N'va pas »… attention : « on n' » précède presque toujours « pas/plus/jamais » : « ON N'VA pas où ON VA ? » : la négation appelle l'apostrophe+n.</div><div class=\"etu\"><b>Étape 3</b> — <b>Automatisation</b> : chaque homophone a SON test de substitution : a⟶avait, est⟶était, son⟶le sien, ce⟶celui-ci : apprendre les tests, pas les listes : la substitution marche à 100 %, l'intuition seulement à 50 %.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « tout/tous/toute/toutes » selon classe et accord ; « leur/leurs » selon singulier/pluriel de la chose possédée ; « -er/-é » après avoir (participe) ou aller (infinitif) : « il a mangé » vs « il va manger » ; « quelque(s) » vs « quelques… que » ; les accords du participe passé (revoir le chapitre conjugaison).</div>"},
{"id": "subordonnees", "theme": "La phrase complexe et les subordonnées (4e/3e)", "niveau": "4e/3e", "titre": "La phrase complexe et les subordonnées", "cours": "<div class=\"cours-head\"><h2>La phrase complexe et les subordonnées</h2><span class=\"niv\">4e/3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Juxtaposition, coordination, subordination</h3>\n<div class=\"tip\"><b>Juxtaposition</b> : phrases séparées par un signe de ponctuation : « Il pleut, je reste. » <b>Coordination</b> : reliées par MAIS, OU, ET, DONC, OR, NI, CAR : « Il pleut DONC je reste. » <b>Subordination</b> : une proposition ENRÔLÉE dans l'autre par un subordonnant (que, quand, parce que, si…) : « Je reste PARCE QU' il pleut. »<br>Subordonner = hiérarchiser : la subordonnée DÉPEND de la principale.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — transformer une phrase</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Le vent s'est levé. Nous avons rentré le linge. » Réécrire en juxtaposition, coordination, puis subordination.</div><div class=\"etu\"><b>Étape 1</b> — <b>Juxtaposition</b> : « Le vent s'est levé, nous avons rentré le linge. » (virgule ou point-virgule : les deux propositions restent égales).</div><div class=\"etu\"><b>Étape 2</b> — <b>Coordination</b> : « Le vent s'est levé DONC nous avons rentré le linge. » (la conjonction exprime le lien logique : conséquence).</div><div class=\"etu\"><b>Étape 3</b> — <b>Subordination</b> : « Nous avons rentré le linge PARCE QUE le vent s'est levé. » (« parce que » introduit la subordonnée de CAUSE, enchâssée dans la principale : c'est le style le plus riche : l'examinateur le réclame en rédaction.</div></div></details>\n<h3>2. Les grandes subordonnées à connaître</h3>\n<div class=\"tip\"><b>Relative</b> (qui, que, où, dont) : précise un NOM (antécédent) : « le livre QUE je lis ». <b>Complétive</b> (que + verbe) : complète un verbe : « je pense QUE… ». <b>Circonstancielle</b> : quand (temps), parce que (cause), si (condition), pour que (but), bien que (concession)…<br>La subordonnée relative peut souvent être remplacée par un adjectif : « un élève qui travaille ⟶ un élève sérieux ».</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — identifier et nommer</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Le musée que nous avons visité propose des œuvres qui surprennent, bien que l'entrée soit chère. » Nommer chaque subordonnée.</div><div class=\"etu\"><b>Étape 1</b> — « que nous avons visité » : précise « le musée » (antécédent) : RELATIVE (remplaçable par « visité hier » : un complément du nom).</div><div class=\"etu\"><b>Étape 2</b> — « qui surprennent » : précise « des œuvres » : RELATIVE aussi (deux dans la même phrase : enchâssements successifs).</div><div class=\"etu\"><b>Étape 3</b> — « bien que l'entrée soit chère » : exprime la CONCESSION (le fait contraire, sans empêcher le reste) : circonstancielle de concession. Trois subordonnées, trois rôles : savoir les NOMMER est la moitié de l'analyse grammaticale au brevet.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « que » relatif (= lequel) ≠ « que » conjonction (penser que…) ; une relative peut être supprimée (information accessoire) ou indispensable (« le seul livre qui… ») ; pas de futur après « quand » de l'habitude (« quand il vient ») ; « dont » remplace « de + lequel » (« le livre dont je parle = de ce livre ») : le subordonnant s'accorde avec sa fonction.</div>"},
{"id": "discours", "theme": "Le discours direct, indirect et indirect libre (4e/3e)", "niveau": "4e/3e", "titre": "Le discours direct, indirect et indirect libre", "cours": "<div class=\"cours-head\"><h2>Le discours direct, indirect et indirect libre</h2><span class=\"niv\">4e/3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Direct et indirect : les deux façons de rapporter</h3>\n<div class=\"tip\"><b>Discours direct</b> : paroles rapportées EXACTEMENT, avec guillemets (ou tiret au théâtre) et verbe introducteur + deux points : « Il a dit : « Je viendrai demain. » » <b>Discours indirect</b> : paroles INTÉGRÉES dans la phrase par « que » : « Il a dit qu'il viendrait le lendemain. »<br><b>La concordance des temps</b> change TOUT : demain ⟹ le lendemain, hier ⟹ la veille, je ⟹ il/elle…</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — transformer en discours indirect</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Elle a demandé : « Viendras-tu demain avec moi ? » Mettre au discours indirect.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le subordonnant</b> : question ⟹ « si » : « Elle a demandé SI… » (jamais de guillemets, plus d'inversion).</div><div class=\"etu\"><b>Étape 2</b> — <b>Les changements</b> : viendras-tu ⟹ je viendrais (conditionnel, futur du passé) ; demain ⟹ LE LENDEMAIN ; moi ⟹ elle/lui : « Elle a demandé si je viendrais le lendemain avec elle. »</div><div class=\"etu\"><b>Étape 3</b> — <b>Table de conversion</b> : aujourd'hui ⟹ ce jour-là ; hier ⟹ la veille ; la semaine prochaine ⟹ la semaine suivante ; ici ⟹ là : la conversion est SYSTÉMATIQUE : c'est l'exercice roi du brevet.</div></div></details>\n<h3>2. Le discours indirect libre : la voix du roman moderne</h3>\n<div class=\"tip\"><b>Indirect libre</b> = les pensées d'un personnage glissées dans la narration, SANS verbe introducteur NI guillemets : « Elle attendit encore. Viendrait-il enfin ? Il était pourtant si ponctuel d'habitude. »<br>Effets : on ENTEND le personnage (questions, exclamations, présent) tout en restant dans le récit : c'est LA technique de Flaubert et des romanciers pour rendre la pensée.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — reconnaître l'indirect libre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Il regarda le chèque. Trois mille francs ! Décidément, ce était trop bon. Allait-elle accepter ? » Où est l'indirect libre ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Les indices</b> : « Trois mille francs ! » (exclamation sans introducteur), « Allait-elle accepter ? » (question au discours indirect : verbe au style narratif mais ton interrogatif).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le mélange</b> : la syntaxe est celle du NARRATEUR (il, imparfait) mais la voix est celle du PERSONNAGE (étonnement, jugement) : deux voix superposées.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'effet</b> : sans l'indirect libre, il faudrait écrire « il pensa : \"Trois mille francs ! Accepterait-elle ?\" » (lourd) : l'indirect libre fluidifie le roman moderne : le repérer au lycée = points d'analyse stylistique.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> au discours indirect, les questions avec « si » (jamais d'inversion ni point d'interrogation) ; les mots de liaison changent (demain ⟹ le lendemain) ; au théâtre, le discours direct est la règle (répliques) ; ne pas confondre discours indirect (que + subordonnée) et indirect libre (aucun introducteur).</div>"},
{"id": "genres-formes", "theme": "Les genres et les formes littéraires (4e/3e)", "niveau": "4e/3e", "titre": "Les genres et les formes littéraires", "cours": "<div class=\"cours-head\"><h2>Les genres et les formes littéraires</h2><span class=\"niv\">4e/3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les trois grands genres</h3>\n<div class=\"tip\"><b>Récit/roman</b> : narration d'histoires, un narrateur raconte. <b>Poésie</b> : vers (poème) ou prose, travail sur les sonorités et les images, souvent des strophes et un rythme. <b>Théâtre</b> : texte fait pour être REPRÉSENTÉ, dialogues (répliques) + didascalies.<br>À chaque genre ses marques : vers et strophes (poésie), noms de personnages et tirades (théâtre), chapitres et narrateur (roman).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — identifier un texte</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un texte commence par « Acte II, scène 3. LÉONCE, en colère. — Tu oses me parler ainsi ? » Genre ? Quelles marques ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Marques typographiques</b> : « Acte, scène » (structure théâtrale), nom du personnage en MAJUSCULES, didascalie « en colère », tiret de réplique.</div><div class=\"etu\"><b>Étape 2</b> — <b>Conclusion</b> : THEÂTRE (comédie ou tragédie selon le ton : ici l'apostrophe agressive suggère la comédie ou le drame).</div><div class=\"etu\"><b>Étape 3</b> — <b>Généralisation</b> : chaque genre a sa « carte d'identité » typographique : vers numérotés/rimés (poésie), chapitres/narrateur (roman), actes/scènes/didascalies (théâtre) : dans un exercice d'identification, CITER les marques repérées vaut plus que deviner le genre.</div></div></details>\n<h3>2. Formes de texte : derrière le genre, la forme</h3>\n<div class=\"tip\"><b>Formes du récit</b> : roman, nouvelle (brève, fin surprenante), conte (merveilleux, « il était une fois »), fable (récit bref + moralité, vers), mythe (origines, dieux). <b>Formes argumentatives</b> : essai (thèse directe), apologue (récit à visée de sagesse : fable, conte philosophique), lettre (épître), discours (prononcé).<br>Une fable = apologue : un PLAISIR de lecture au service d'une LEÇON.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la fable, machine à convaincre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Le Corbeau et le Renard » : pourquoi est-ce plus efficace qu'un essai disant « ne vous laissez pas flatter » ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le déguisement</b> : la leçon (méfiance envers la flatterie) est glissée dans un récit animalier : le lecteur est d'abord DIVERTI (le corbeau honteux, le renard malin).</div><div class=\"etu\"><b>Étape 2</b> — <b>L'universalité</b> : animaux = types humains : chaque lecteur se RECONNAÎT sans être visé personnellement : l'apologue contourne la défense du destinataire.</div><div class=\"etu\"><b>Étape 3</b> — <b>La moralité</b> : « Apprenez que tout flatteur vit aux dépens de celui qui l'écoute » : la formule cristallise la leçon : c'est la signature de l'apologue : récit (plaire) + moralité (instruire) : la littérature engagée avant l'heure.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ne pas confondre genre (roman/poésie/théâtre) et forme (nouvelle, fable, lettre…) ; un texte en prose peut être poétique (poème en prose) ; au théâtre, la comédie fait rire, la tragédie se termine en morts ; le conte philosophique (Voltaire) est un apologue TOUJOURS argumentatif.</div>"},
{"id": "registres", "theme": "Les registres et les tonalités (4e/3e)", "niveau": "4e/3e", "titre": "Les registres et les tonalités", "cours": "<div class=\"cours-head\"><h2>Les registres et les tonalités</h2><span class=\"niv\">4e/3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les grands registres</h3>\n<div class=\"tip\"><b>Comique</b> : faire rire (mots d'esprit, quiproquos, caricatures). <b>Tragique</b> : destin écrasant, mort inévitable. <b>Pathétique</b> : émouvoir de pitié (souffrance). <b>Lyrique</b> : expression des sentiments personnels (amour, mélancolie). <b>Satirique</b> : critiquer en riant. <b>Fantastique</b> : hésitation entre réel et surnaturel. <b>Épique</b> : grandeur des combats et des héros.<br>Le registre = l'EFFET visé sur le lecteur ; le genre = la catégorie d'œuvre : ne pas confondre.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — repérer le registre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Ô nuit désirable ! Mon cœur se brise à chaque battement, l'absence me tue plus sûrement qu'un poignard. » Registre ? Indices ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Indices lexicaux</b> : « Ô » (apostrophe lyrique), « mon cœur » (sentiment personnel), « l'absence me tue » (souffrance amoureuse), « poignard » (image violente du tourment).</div><div class=\"etu\"><b>Étape 2</b> — <b>Conclusion</b> : registre LYRIQUE (expression du moi, exclamation, souffrance sentimentale) : l'apostrophe et l'exclamation en sont les marques typiques.</div><div class=\"etu\"><b>Étape 3</b> — <b>Méthode</b> : toujours CITER 2-3 indices précis (vocabulaire, ponctuation, images, pronoms) avant de nommer le registre : « c'est lyrique » sans preuve = 0 point ; « lyrique CAR présence de Ô + je + vocabulaire sentimental » = full marks.</div></div></details>\n<h3>2. Les composites : ironie et mélange des registres</h3>\n<div class=\"tip\"><b>Ironie</b> : dire le contraire de ce qu'on pense (« Quel temps magnifique ! » sous la pluie) : l'écart entre le dit et le pensé fait le sens. <b>Antiphrase</b> : l'outil principal de l'ironie.<br>Un même texte peut MIXER : le tragique et le pathétique (Andromaque), le comique et le grave (Ruy Blas, le drame romantique) : le mélange des registres EST un effet de sens à analyser.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'antiphrase, cœur de l'ironie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un personnage trébuche, renverse le plat et s'excuse : « Bravo ! Quelle élégance ! » Analyser le mécanisme.</div><div class=\"etu\"><b>Étape 1</b> — <b>L'écart</b> : « Bravo, élégance » (éloge) vs situation (catastrophe) : le mot dit le CONTRAIRE de la pensée : antiphrase.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le signal</b> : l'exclamation ! (l'ironie s'accompagne souvent de !, de guillemets, de majuscules : « quelle ÉLÉGANCE »).</div><div class=\"etu\"><b>Étape 3</b> — <b>La fonction</b> : ici, la moquerie amusée (registre comique) ; dans la satire sociale (Flaubert : « c'était unemasterpiece »), la critique d'une bourgeoisie prétentieuse : l'antiphrase est l'arme favorite de la critique au lycée : la repérer = comprendre le POINT DE VUE du narrateur.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ironie ≠ sarcasme gratuit : elle vise un sens (critique) ; tragique ≠ pathétique (le tragique dépasse l'individu : fatalité ; le pathétique reste individuel : pitié) ; registre ≠ genre (une comédie peut avoir des passages graves) ; citer TOUJOURS des indices textuels.</div>"},
{"id": "figures-style", "theme": "Les figures de style (4e/3e)", "niveau": "4e/3e", "titre": "Les figures de style", "cours": "<div class=\"cours-head\"><h2>Les figures de style</h2><span class=\"niv\">4e/3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Figures d'analogie : faire voir par ressemblance</h3>\n<div class=\"tip\"><b>Comparaison</b> : avec un outil de comparaison (comme, tel, semblable à) : « doux COMME un agneau ». <b>Métaphore</b> : sans outil : « cet agneau de garçon ». <b>Périphrase</b> : remplacer un mot par une expression : « la Ville lumière » = Paris. <b>Personnification</b> : donner des traits humains : « le vent murmure ».</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comparer et métaphorer</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Cette fusée traverse les airs comme une étoile filante » puis « Cette étoile filante traverse les airs » : quelles figures ? Effets ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Première phrase</b> : « comme » ⟹ COMPARAISON : fusée (comparé) / étoile filante (comparant) : la vitesse et la traînée lumineuse sont partagées.</div><div class=\"etu\"><b>Étape 2</b> — <b>Deuxième phrase</b> : sans « comme », la fusée DEVIENT l'étoile : MÉTAPHORE, plus forte, plus poétique (fusion des images).</div><div class=\"etu\"><b>Étape 3</b> — <b>Effet d'analyse</b> : la comparaison EXPLIQUE (clair, pédagogique) ; la métaphore IMPLIQUE ( suggestive, rêveuse) : dans un commentaire, toujours nommer la figure ET son effet : « la métaphore fusionne le réel et le rêve : la fusée devient astre ».</div></div></details>\n<h3>2. Figures d'insistance, d'opposition et de construction</h3>\n<div class=\"tip\"><b>Hyperbole</b> : exagération (« mourir de rire »). <b>Anaphore</b> : répétition en tête (« Moi président… Moi président… »). <b>Accumulation/énumération</b> : série de mots (« des rires, des pleurs, des chants, des danses »). <b>Antithèse</b> : opposition dans une phrase (« et noir et blanc ») ; <b>oxymore</b> : deux mots opposés COLLÉS (« une obscure clarté »). <b>Chiasme</b> : croisement (ABBA). <b>Gradation</b> : intensité croissante (« va, cours, vole »).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'oxymore, collision de sens</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Cette obscure clarté qui tombe des étoiles » (Corneille) et « un silence assourdissant » : analyser ces oxymores.</div><div class=\"etu\"><b>Étape 1</b> — <b>Définition stricte</b> : deux mots de sens CONTRAIRES rapprochés dans le même groupe : obscure + clarté : la collision est immédiate.</div><div class=\"etu\"><b>Étape 2</b> — <b>L'effet</b> : chez Corneille, la nuit étoilée est sombre ET lumineuse : le poète rend une expérience COMPLEXE (une lumière faible dans l'obscurité) qu'un mot simple ne pourrait pas dire : l'oxymore pense la nuance.</div><div class=\"etu\"><b>Étape 3</b> — <b>Généralisation</b> : distinguer antithèse (opposition à distance dans la phrase : « il est riche mais malheureux ») et oxymore (COLLÉS : « riche misère ») : les examinateurs adorent ce duo : la proximité est le critère.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> une métaphore n'a pas d'outil de comparaison (sinon c'est une comparaison) ; ne pas confondre antithèse (opposés opposés dans la phrase) et oxymore (collés) ; nommer la figure ne suffit pas : donner son EFFET de sens ; une même figure peut se lire à plusieurs niveaux (métaphore filée sur tout un poème).</div>"},
{"id": "lexique-sens", "theme": "Le sens des mots et le lexique (6e/5e)", "niveau": "6e/5e", "titre": "Le sens des mots et le lexique", "cours": "<div class=\"cours-head\"><h2>Le sens des mots et le lexique</h2><span class=\"niv\">6e/5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Sens propre, sens figuré, polysémie</h3>\n<div class=\"tip\"><b>Sens propre</b> : le sens premier, littéral (« le pied de la table »). <b>Sens figuré</b> : sens imagé, par extension (« prendre son pied » = s'amuser). <b>Polysémie</b> : un mot, plusieurs sens selon le contexte (« vol » : action de l'oiseau / délit / bande de tissu) : le contexte TRANCHE : c'est lui qui choisit le sens.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — jouer avec la polysémie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Le pied de la table a un pied-de-grue sur le pied de l'escalier ». Combien de sens de « pied » ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Inventaire</b> : « pied de la table » (base, sens propre), « pied-de-grue » (petit tuteur en Y du jardinage), « pied de l'escalier » (marche la plus basse, ou partie basse).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le lien logique</b> : tous ces sens dérivent de l'idée de « ce qui porte / partie basse » : c'est le FIL de la polysémie : le mot garde une sémе commune.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'usage</b> : en rédaction, la polysémie permet les JEUX DE MOTS (« le temps file, prenez le temps ») : et en lecture, le sens FIGURÉ est souvent le plus intéressant : c'est là que naît la littérature.</div></div></details>\n<h3>2. Synonymes, antonymes, niveaux de langue</h3>\n<div class=\"tip\"><b>Synonymes</b> : sens proches, nuances différentes (maison/demeure/baraque). <b>Antonymes</b> : sens opposés (chaud/froid). <b>Niveaux de langue</b> : familier (« des fringues »), courant (« des vêtements »), soutenu (« des habits ») : choisir son niveau = s'adapter au destinataire : bac de français : passer du familier au courant est un exercice de style.<br><b>Paronymes</b> : mots proches par la FORME (éruption/irruption, contamination/contemplation) : pièges d'orthographe !</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — nuancer par les synonymes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Remplacer « il a dit » par le verbe le plus juste : « \"Filez !\" ___ le garde. » et « « Je t'aime » ___-t-il doucement. »</div><div class=\"etu\"><b>Étape 1</b> — <b>Contexte 1</b> : « Filez ! » : ordre brutal ⟹ « hurla », « cria », « aboya » : un verbe VIOLENT.</div><div class=\"etu\"><b>Étape 2</b> — <b>Contexte 2</b> : « Je t'aime » doucement ⟹ « murmura », « souffla », « chuchota » : un verbe DOUX : les synonymes ne sont pas interchangeables : ils PORTENT la nuance.</div><div class=\"etu\"><b>Étape 3</b> — <b>Méthode d'expression écrite</b> : bannir « dire » répété : un verbe de parole précis (grogner, soupirer, répliquer) informe sur le TON du personnage : la précision lexicale = première marque d'une bonne copie.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le contexte décide du sens (toujours relire la phrase entière) ; familier interdit dans une copie formelle ; vérifier les paronymes (affluence/fluence, cotation/cotation) ; ne pas confondre sens figuré (image) et sens propre (littéral).</div>"},
{"id": "poesie", "theme": "La poésie : du lyrisme à l'engagement (2de/1re)", "niveau": "2de/1re", "titre": "La poésie : du lyrisme à l'engagement", "cours": "<div class=\"cours-head\"><h2>La poésie : du lyrisme à l'engagement</h2><span class=\"niv\">2de/1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le vers, la strophe, le rythme</h3>\n<div class=\"tip\"><b>Vers</b> : ligne de poème mesurée en SYLLABES (alexandrin = 12, décasyllabe = 10, octosyllabe = 8). <b>Strophes</b> : couplet (2), tercet (3), quatrain (4), quintil (5)… <b>Rimes</b> : suivies (AABB), croisées (ABAB), embrassées (ABBA) ; féminines (finales en e muet) / masculines.<br>Le poème est une MUSIQUE : la forme (mètre, rimes, strophes) porte le sens : les deux se lisent ENSEMBLE.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire un alexandrin</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Et je la vois, / la belle créature » : comment compter ? Où est la césure ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Comptage</b> : Et-je-la-vois-la-belle-cré-a-ture = E(sprononcer léger) : et(1) je(2) la(3) vois(4) la(5) belle(6) cré(7) a(8) tu(9) re(10)… : avec « Et je » élision : le vers compte 12 syllabes : alexandrin.</div><div class=\"etu\"><b>Étape 2</b> — <b>La césure</b> : la pause au milieu (souvent à l'hémistiche, après la 6e syllabe) : « Et je la vois // la belle créature » : elle rythme la respiration du vers.</div><div class=\"etu\"><b>Étape 3</b> — <b>Effet</b> : la césure après « vois » isole la VISION : le rythme mime l'arrêt du regard : au bac, le lien rythme/sens est une piste d'analyse constante : la forme SIGNIFIE.</div></div></details>\n<h3>2. Du lyrique à l'engagé : les visages de la poésie</h3>\n<div class=\"tip\"><b>Poésie lyrique</b> : le moi, les sentiments (Lamartine, « Le Lac » : mélancolie, amour, temps qui fuit). <b>Poésie de la mémoire et de la célébration</b> : louange, éloge. <b>Poésie engagée</b> : prendre position (Hugo contre Napoléon III, « Les Châtiments » ; Desnos, Éluard sous l'Occupation : « Liberator » clandestin ; Aragon : « La Rose et le Réséda »).<br>Poésie et vérité : « de la boue extraire de l'or » : même l'épouvante devient chant (Prévert, Char).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — analyser une poésie engagée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Éluard, « Courage » (1941) : « Paris a froid Paris a faim » : comment la poésie sert-elle la résistance ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Anaphore et accumulation</b> : « Paris a… » répété : le martèlement fait de la souffrance un REFRAIN mémorisable : le poème devient slogan, apte à circuler de bouche en bouche.</div><div class=\"etu\"><b>Étape 2</b> — <b>Personnification</b> : Paris (la ville) personnifié (« a faim, a froid ») : la capitale devient un ÊTRE à sauver : l'enjeu est incarné, pas abstrait.</div><div class=\"etu\"><b>Étape 3</b> — <b>La fonction clandestine</b> : imprimé en tract, appris par cœur, le poème ÉCHAPPE à la censure : la force de la poésie engagée : FORME courte (mémorisable) + sens collectif (rassembler) : au bac, toujours relier les PROCÉDÉS (anaphore, personnification) à la VISEE (mobiliser, consoler, unir).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ne jamais séparer la forme du sens (compter les syllabes AVANT d'interpréter) ; « lyrique » ne veut pas dire « doux » : c'est le MOI qui parle (lyre d'Orphée) ; un poème engagé reste un POÈME (images, rythme) : sinon ce serait un tract ; attention au e muet : élidé devant voyelle, prononcé en fin de vers féminin.</div>"},
{"id": "theatre", "theme": "Le théâtre : texte et représentation (2de/1re)", "niveau": "2de/1re", "titre": "Le théâtre : texte et représentation", "cours": "<div class=\"cours-head\"><h2>Le théâtre : texte et représentation</h2><span class=\"niv\">2de/1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La structure du texte théâtral</h3>\n<div class=\"tip\"><b>Actes</b> (grandes unités) et <b>scènes</b> (changements d'entrées/sorties). <b>Répliques</b> (paroles), <b>tirades</b> (longues), <b>dialogues</b> vs <b>monologues</b> (seul en scène, délibération : stances). <b>Didascalies</b> : indications scéniques (en italique) : qui entre, gestes, ton, décor.<br>Le théâtre est un texte à DOUBLE vie : le texte (lisible) et la scène (représentable) : analyser = toujours penser la représentation.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire une didascalie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « HIPPOLYTE, seul. — Mon cœur… (Il s'assoit, la tête entre les mains.) » Que nous apprend la didascalie ?</div><div class=\"etu\"><b>Étape 1</b> — <b>« seul »</b> : annonce un MONOLOGUE : le personnage va se livrer (aucun regard extérieur : sincérité ou auto-persuasion ?).</div><div class=\"etu\"><b>Étape 2</b> — <b>« Il s'assoit, la tête entre les mains »</b> : posture d'abattement : le metteur en scène reçoit une INDICATION de jeu (l'accablement est ATTENDU par l'auteur).</div><div class=\"etu\"><b>Étape 3</b> — <b>Portée analytique</b> : la didascalie n'est pas un ornement : elle ORIENTE le ton (ici : tragique intérieur) et délimite la structure (le monologue d'Hippolyte dans Phèdre : la délibération d'un cœur partagé) : au bac, toujours CITER les didascalies dans l'analyse de la situation d'énonciation.</div></div></details>\n<h3>2. Le double langage : texte et mise en scène</h3>\n<div class=\"tip\"><b>Le texte théâtral est incomplet sans la scène</b> : le même vers peut être dit tragique (Racine monté classique) ou ironique (mise en scène moderne) : la MISE EN SCÈNE est une lecture du texte. <b>Les choix du metteur en scène</b> : scénographie (décor), costumes, lumière, jeu des acteurs (ton, gestuelle), casting (âge, sexe des rôles) : chaque choix est une INTERPRÉTATION : deux mises en scène = deux œuvres.<br>Règle des trois unités (classique) : unité d'ACTION, de TEMPS (24h), de LIEU : le romantique s'en est affranchi (Hugo : prefâce de Cromwell).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — une même tirade, deux mises en scène</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La tirade du « Être ou ne pas être » (Hamlet) : comment deux metteurs en scène peuvent-ils la rendre opposée ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Choix 1 (traditionnel)</b> : Hamlet seul, immobile, crâne dans la main : méditation métaphysique : le public écoute une PENSÉE.</div><div class=\"etu\"><b>Étape 2</b> — <b>Choix 2 (moderne)</b> : Hamlet face au public, sourire grinçant, miroir tendu vers la salle : la question devient AGRESSION : « ET VOUS, que feriez-vous ? ».</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : le TEXTE est identique ; la SCÈNE change le SENS : c'est toute la question du « théâtre : texte ou représentation » (sujet de bac récurrent) : la bonne réponse : le texte est une PARTITION ; la mise en scène, son INTERPRÉTATION : l'un ne va pas sans l'autre.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ne pas confondre tirade (un personnage) et stichomythie (répliques très courtes, échanges vifs : disputes) ; les didascalies ne sont pas « dites » : elles sont jouées ; au monologue, personne n'entend : sincérité à interroger (auto-justification possible) ; la règle des trois unités est CLASSIQUE, pas éternelle.</div>"},
{"id": "roman", "theme": "Le roman et le récit (2de/1re)", "niveau": "2de/1re", "titre": "Le roman et le récit", "cours": "<div class=\"cours-head\"><h2>Le roman et le récit</h2><span class=\"niv\">2de/1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le narrateur et la focalisation</h3>\n<div class=\"tip\"><b>Narrateur</b> ≠ AUTEUR (instance textuelle vs personne réelle). <b>Focalisation zéro</b> (omnisciente) : le narrateur sait tout (« Madame Bovary pensait que… »). <b>Focalisation interne</b> : on suit les pensées d'UN personnage. <b>Focalisation externe</b> : le narrateur décrit de l'extérieur, sans jamais entrer dans les pensées (Camus, « L'Étranger » ; « La Main » de Maupassant).<br>DISTANCE : narrateur = personnage (je récitant/récité) ou narrateur extérieur (il).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — identifier la focalisation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Marie s'approcha de la table. Elle vida son verre d'un trait. Que pensait-elle ? Nul ne le sait. » Focalisation ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Ce qu'on sait</b> : gestes (s'approcher, vider) : OUI ; pensées : NON (explicitement refusées : « nul ne le sait »).</div><div class=\"etu\"><b>Étape 2</b> — <b>Conclusion</b> : focalisation EXTERNE : le narrateur est une caméra (comportements visibles seulement).</div><div class=\"etu\"><b>Étape 3</b> — <b>Effet</b> : mystère, objectivité froide (effet Maupassant/Camus : « La Main » : la bride d'information crée l'angoisse) : la focalisation est un CHOIX DE SENS : l'identifier + l'interpréter = les deux temps de l'analyse.</div></div></details>\n<h3>2. Temps du récit, personnages, types de romans</h3>\n<div class=\"tip\"><b>Temps</b> : ordre (analepses/flashback, prolepses/anticipations), durée (sommaire : accéléré ; scène : temps « réel » ; pause descriptive), fréquence. <b>Personnages</b> : rond (complexe, évolutif) vs plat (type, une caractéristique) : héros, antihéros (L'Étranger), focalisation. <b>Types de romans</b> : réaliste (Balzac), naturaliste (Zola : expérimental), épistolaire (Liaisons dangereuses), autobiographique (récit rétrospectif en je), nouveau roman (Robbe-Grillet : le regard), bildungsroman (apprentissage).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — anachronie : l'analepse</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un roman commence en 1914, puis chapitre 2 : « Vingt ans plus tôt, à Vincennes… ». Nommer et justifier l'effet.</div><div class=\"etu\"><b>Étape 1</b> — <b>Nommer</b> : retour en arrière : ANALEPSE (flashback) : rupture de l'ordre chronologique.</div><div class=\"etu\"><b>Étape 2</b> — <b>Pourquoi ?</b> : expliquer le présent par le passé (l'origine d'une rancune, d'une fortune) : l'analepse est presque toujours EXPLICATIVE.</div><div class=\"etu\"><b>Étape 3</b> — <b>Effets d'analyse</b> : suspense (differ une révélation), rétrospection tragique (on sait la fin : le passé prend un poids), structure en miroir : au bac, chaque rupture chronologique est une QUESTION DE SENS : pourquoi ICI, pourquoi MAINTENANT ?</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> narrateur ≠ auteur (confusion éliminatoire) ; je récitant ≠ je récité (le narrateur qui raconte ≠ celui qui vit) ; le personnage principal n'est pas toujours le héros positif (antihéros) ; « réaliste » ne veut pas dire « vrai » : c'est un EFFET de réel (notamment détails documentaires).</div>"},
      }
    }
    emitP();
  }
  walk(root);
  return blocks;
}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    var isTitle = b.type === 'title';
    var size = isTitle ? 15 : (b.type === 'h' ? 12 : 10.5);
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [];
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) words.push({ br: true });
        p.split(' ').forEach(function(w){ if (w !== '') words.push({ w: w, b: s.b }); });
        if (pi < parts.length - 1) {} else { words.push({ sp: true, b: s.b }); }
      });
    });
    var cur = [], len = 0;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, gap: isTitle ? 0 : (b.type === 'h' ? 7 : 4) }); cur = []; len = 0; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      if (wd.sp) { continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
    if (isTitle) lines.push({ rule: true });
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var pages = [], cur = [], y = TOP;
  lines.forEach(function(ln){
    if (ln.rule){
      if (y - 14 < M) { pages.push(cur); cur = []; y = TOP; }
      y -= 12;
      cur.push('0.29 0.27 0.9 RG 1.5 w ' + M + ' ' + y.toFixed(2) + ' m ' + (W - M) + ' ' + y.toFixed(2) + ' l S\n0 0 0 RG 1 w');
      y -= 8;
      return;
    }
    var lh = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh < M) { pages.push(cur); cur = []; y = TOP; }
    y -= (ln.gap || 0);
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      var enc = pdfEnc(pdfTranslit(s.t));
      if (!enc) return;
      cur.push('BT 1 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Tm /F' + (s.b ? 2 : 1) + ' ' + ln.size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
      x += 0.52 * ln.size * enc.length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de français</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + h + '</section>';
})();

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
</script>
