<script>
var PROGRAMME = [{"n":"Collège — 6e/5e","ch":[{"t":"Les classes de mots","id":"grammaire-classes"},{"t":"Les fonctions dans la phrase","id":"grammaire-fonctions"},{"t":"Conjugaison : temps et valeurs","id":"conjugaison-temps"},{"t":"Orthographe : pièges et accords","id":"orthographe-accords"},{"t":"Le sens des mots et le lexique","id":"lexique-sens"},{"t":"Les types et les formes de phrases","id":"types-formes"}]},{"n":"Collège — 4e/3e","ch":[{"t":"La phrase complexe et les subordonnées","id":"subordonnees"},{"t":"Le discours direct, indirect et indirect libre","id":"discours"},{"t":"Les genres et les formes littéraires","id":"genres-formes"},{"t":"Les registres et les tonalités","id":"registres"},{"t":"Les figures de style","id":"figures-style"}]},{"n":"Lycée — 2de/1re","ch":[{"t":"La poésie : du lyrisme à l'engagement","id":"poesie"},{"t":"Le théâtre : texte et représentation","id":"theatre"},{"t":"Le roman et le récit","id":"roman"}]},{"n":"Lycée — 1re/Terminale","ch":[{"t":"L'argumentation : convaincre, persuader, délibérer","id":"argumentation"},{"t":"Le commentaire de texte","id":"commentaire"},{"t":"La dissertation","id":"dissertation"}]}];
var COURS_META = [
  {
    "id": "grammaire-classes",
    "theme": "Les classes de mots (6e/5e)",
    "niveau": "6e/5e",
    "titre": "Les classes de mots",
    "cours": "<div class=\"cours-head\"><h2>Les classes de mots</h2><span class=\"niv\">6e/5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce qu'une classe grammaticale ?</h3>\n<p>La <b>classe grammaticale</b> (ou nature) est l'identité d'un mot : elle ne change jamais, quelle que soit la phrase. Il faut connaître les classes suivantes :</p>\n<table>\n<tr><th>Classe</th><th>Exemples</th><th>Reconnaître</th></tr>\n<tr><td>Nom</td><td><i>chien, liberté, Paris</i></td><td>déterminable, porte le sens</td></tr>\n<tr><td>Déterminant</td><td><i>le, une, ces, mon, quelques</i></td><td>se place devant un nom</td></tr>\n<tr><td>Adjectif qualificatif</td><td><i>grand, joyeux, vert</i></td><td>accordé avec le nom qu'il qualifie</td></tr>\n<tr><td>Verbe</td><td><i>chanter, est, va</i></td><td>se conjugue, indique l'action ou l'état</td></tr>\n<tr><td>Pronom</td><td><i>je, il, se, lequel, que</i></td><td>remplace un nom ou un groupe</td></tr>\n<tr><td>Préposition</td><td><i>à, de, dans, chez, pendant</i></td><td>invariable, relie des mots</td></tr>\n<tr><td>Adverbe</td><td><i>vite, bien, très, ici</i></td><td>invariable, modifie un verbe, un adjectif…</td></tr>\n<tr><td>Conjonction</td><td><i>et, mais, que, parce que</i></td><td>relie des mots ou des propositions</td></tr>\n</table>\n<div class=\"tip\"><b>Le réflexe à avoir :</b> pour identifier la nature d'un mot, regardez son <b>rôle dans la phrase</b>, pas seulement son apparence. « <i>Le va-et-vient</i> » : « va » est ici un nom, pas un verbe !</div>\n\n<h3>2. Noms, déterminants, adjectifs : la chaîne du groupe nominal</h3>\n<p>Le <b>groupe nominal</b> s'organise autour du nom :</p>\n<ul>\n<li>le <b>déterminant</b> introduit le nom (articles <i>le, un</i>, possessifs <i>mon</i>, démonstratifs <i>ce</i>, indéfinis <i>plusieurs</i>, interrogatifs <i>quel</i>…) ;</li>\n<li>les <b>adjectifs qualificatifs</b> précisent le nom (épithète, apposé ou attribut) ;</li>\n<li>le nom peut être <b>complété</b> par un autre nom (<i>le livre de Paul</i>) ou un verbe (<i>l'envie de partir</i>).</li>\n</ul>\n<p>On distingue aussi le <b>nom propre</b> (<i>Paris</i>) du <b>nom commun</b> (<i>ville</i>).</p>\n\n<h3>3. Verbes : infinitif et conjugaison</h3>\n<p>Le verbe est le pivot de la phrase. Pour le reconnaître, on le remplace par un verbe simple comme <i>être</i> ou on le met à l'infinitif :</p>\n<ul>\n<li>« Il <b>prend</b> son sac » → « Il <b>va</b> prendre son sac » ;</li>\n<li>« Il <b>prend</b> » est le verbe, mais « la <b>prise</b> » serait un nom.</li>\n</ul>\n<div class=\"warn\"><b>Attention :</b> un même mot peut changer de classe selon la phrase. Comparez « <i>Il court vite</i> » (verbe) et « « <i>la cour</i> » (nom) ; « <i>il parle fort</i> » (adverbe) et « <i>un mur fort</i> » (adjectif).</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — classer tous les mots d'une phrase</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Donnez la classe grammaticale de chaque mot : « Ce grand garçon, que je connais bien, lit très vite. »</div><div class=\"etu\"><b>Étape 1 — Chercher le verbe</b> : « lit » (→ il va lire) ; « connais » est le verbe de la subordonnée.</div><div class=\"etu\"><b>Étape 2 — Repérer les chaînes nominales</b> : « Ce grand garçon » (déterminant + adjectif + nom) et « je » (pronom sujet de la subordonnée).</div><div class=\"etu\"><b>Étape 3 — Classer les invariables</b> : « bien » (adverbe), « très » (adverbe), « vite » (adverbe), « que » (pronom relatif).</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : chaque mot a une seule classe ; refaire la phrase avec des synonymes pour confirmer.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« <i>Que</i> » peut être pronom relatif, conjonction de subordination ou pronom interrogatif — regardez la phrase.</li>\n<li>« <i>Bien</i> » est adverbe, mais « <i>un bien</i> » est un nom ; « <i>mieux</i> » est adverbe, « <i>le meilleur</i> » est un adjectif.</li>\n<li>Ne pas confondre <b>classe</b> (nature) et <b>fonction</b> : « nature = identité, fonction = rôle ».</li>\n<li>Les mots invariables (prépositions, adverbes, conjonctions) ne s'accordent jamais.</li>\n<li>« <i>-ment</i> » forme presque toujours des adverbes, mais « <i>Il ment</i> » est un verbe !</li>\n</ul>\n</div>"
  },

    "cours": "<div class=\"cours-head\"><h2>Les fonctions dans la phrase</h2><span class=\"niv\">6e/5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Fonction = rôle du mot dans la phrase</h3>\n<p>À la différence de la classe (identité fixe), la <b>fonction</b> dépend de la place et du rôle du mot dans la phrase. Un même mot peut avoir des fonctions différentes :</p>\n<ul>\n<li>« Paul <b>mange</b> » : <i>mange</i> est verbe conjugué (fonction : prédicat) ;</li>\n<li>« Le <b>Repas</b> est prêt » : <i>repas</i> est nom (fonction : sujet).</li>\n</ul>\n\n<h3>2. Les fonctions autour du verbe</h3>\n<table>\n<tr><th>Fonction</th><th>Comment la repérer ?</th><th>Exemple</th></tr>\n<tr><td><b>Sujet</b></td><td>« Qui est-ce qui + verbe ? »</td><td><i>Paul</i> dort.</td></tr>\n<tr><td><b>COD</b></td><td>« verbe + quoi/qui ? »</td><td>Il lit <i>un livre</i>.</td></tr>\n<tr><td><b>COI</b></td><td>« verbe + à quoi/à qui ? »</td><td>Il pense <i>à ses vacances</i>.</td></tr>\n<tr><td><b>COS</b></td><td>verbe + préposition (autre que à/de)</td><td>Il parle <i>de son projet</i>.</td></tr>\n<tr><td><b>Attribut du sujet</b></td><td>après être/sembler/devenir…, qualifie le sujet</td><td>Il semble <i>fatigué</i>.</td></tr>\n<tr><td><b>Complément circonstanciel</b></td><td>temps, lieu, manière… ; souvent déplaçable/supprimable</td><td><i>Lundi</i>, il viendra <i>en voiture</i>.</td></tr>\n</table>\n<div class=\"tip\"><b>Astuce du déplacement :</b> un complément circonstanciel peut être déplacé ou supprimé ; un COD ne le peut pas. « Il mange <i>une pomme</i> » : impossible de supprimer « une pomme » sans changer le sens du verbe.</div>\n\n<h3>3. Les fonctions dans le groupe nominal</h3>\n<ul>\n<li><b>Épithète</b> : adjectif directement lié au nom (<i>un chat <b>noir</b></i>) ;</li>\n<li><b>Apposition</b> : adjectif ou nom séparé par des virgules (<i>Pierre, <b>épuisé</b>, s'assit</i>) ;</li>\n<li><b>Attribut du sujet</b> : relié au nom par un verbe d'état ;</li>\n<li><b>Complément du nom</b> : groupe introduit par « de » ou autre préposition (<i>le livre <b>de Paul</b></i>) ;</li>\n<li><b>En apposition / mise en relief</b> : <i>Pierre, <b>mon frère</b>, arrive</i>.</li>\n</ul>\n<p>Ne pas oublier l'<b>apostrophe</b> (interjection) et le <b>vocatif</b> (appel direct : « Viens, <i>Pierre</i> ! »).</p>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser les fonctions d'une phrase</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Analysez : « Dimanche, la vieille dame de mes rêves m'a offert un magnifique bouquet de fleurs. »</div><div class=\"etu\"><b>Étape 1 — Verbe et sujet</b> : « a offert » ; « Qui est-ce qui a offert ? » → « la vieille dame de mes rêves » (sujet, groupe nominal avec épithète « vieille » et complément du nom « de mes rêves »).</div><div class=\"etu\"><b>Étape 2 — COD</b> : « a offert quoi ? » → « un magnifique bouquet de fleurs » (épithète « magnifique », complément du nom « de fleurs »).</div><div class=\"etu\"><b>Étape 3 — Circonstanciel</b> : « Dimanche » = complément circonstanciel de temps (on peut le déplacer en fin de phrase).</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : tester suppression/déplacement pour confirmer les circonstanciels ; tout le reste est indispensable.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Il mange <i>sagement</i> » : « sagement » est adverbe, fonction <b>complément circonstanciel de manière</b> (pas COD).</li>\n<li>« Je lui parle » : « lui » est COI (parler <b>à</b> quelqu'un) ; « le/l'/la/les » = COD, « lui/leur » = COI.</li>\n<li>Ne pas confondre <b>attribut</b> (après être/sembler) et <b>épithète</b> (directement collé au nom).</li>\n<li>« Il est <b>sympathique</b> » : attribut du sujet ; « Il semble <b>fatigué</b> » : attribut aussi (sembler est un verbe d'état).</li>\n<li>Un complément circonstanciel est <b>supprimable</b> ; un COD ou un COI ne l'est pas (le sens du verbe changerait).</li>\n</ul>\n</div>"

    "id": "conjugaison-temps",
    "theme": "Conjugaison : temps et valeurs (6e/5e)",
    "niveau": "6e/5e",
    "titre": "Conjugaison : temps et valeurs",
    "cours": "<div class=\"cours-head\"><h2>Conjugaison : temps et valeurs</h2><span class=\"niv\">6e/5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois modes de base</h3>\n<p>Le <b>mode</b> exprime la manière dont le locuteur présente l'action :</p>\n<ul>\n<li><b>Indicatif</b> : on présente le fait comme réel (<i>Il viendra demain</i>) ;</li>\n<li><b>Subjonctif</b> : on présente le fait comme souhaité, possible, obligatoire (<i>Il faut qu'il vienne</i>) ;</li>\n<li><b>Conditionnel</b> : on présente le fait comme dépendant d'une condition (<i>Il viendrait s'il pouvait</i>).</li>\n</ul>\n<p>S'y ajoutent l'<b>impératif</b> (ordre, <i>Viens !</i>), le <b>participe</b> (<i>venu, venant</i>) et l'<b>infinitif</b> (<i>venir</i>).</p>\n\n<h3>2. Les temps de l'indicatif</h3>\n<table>\n<tr><th>Temps</th><th>Formation</th><th>Valeur</th></tr>\n<tr><td><b>Présent</b></td><td>radical + terminaisons</td><td>fait actuel, vérité générale, récit vivant</td></tr>\n<tr><td><b>Imparfait</b></td><td>1re pers. pl. présent + -ions → -ais, -ait…</td><td>habitude, description, action de durée dans le passé</td></tr>\n<tr><td><b>Passé simple</b></td><td>3 groupes de terminaisons (-ai, -a ; -is, -it ; -us, -ut)</td><td>action ponctuelle dans un récit au passé</td></tr>\n<tr><td><b>Futur simple</b></td><td>infinitif + -ai, -as, -a…</td><td>action à venir</td></tr>\n<tr><td><b>Passé composé</b></td><td>avoir/être au présent + participe passé</td><td>action accomplie, lien avec le présent</td></tr>\n<tr><td><b>Plus-que-parfait</b></td><td>avoir/être à l'imparfait + participe passé</td><td>action antérieure à une action passée</td></tr>\n<tr><td><b>Futur antérieur</b></td><td>avoir/être au futur + participe passé</td><td>action antérieure à une action future</td></tr>\n</table>\n<div class=\"tip\"><b>Le trio du récit au passé</b> : imparfait (décor, habitude) + passé simple (actions qui font avancer l'histoire) + plus-que-parfait (ce qui s'est passé avant). « Il <i>pleuvait</i> (imparfait) quand il <i>sortit</i> (passé simple) ; il <i>avait oublié</i> (plus-que-parfait) son parapluie. »</div>\n\n<h3>3. Accord du participe passé : les cas essentiels</h3>\n<ul>\n<li><b>Avec être</b> : accord avec le sujet (<i>elle est venue</i>, <i>elles sont venues</i>) ;</li>\n<li><b>Avec avoir</b> : accord avec le COD <b>seulement s'il est placé avant</b> le verbe (<i>les fleurs que j'ai cueillies</i> ; <i>je les ai vues</i>) ;</li>\n<li><b>Verbes pronominaux</b> : accord comme avec être, sauf si le COD suit le verbe (<i>elles se sont lavées</i> mais <i>elles se sont lavé les mains</i>) ;</li>\n<li>Les verbes d'<b>état</b> (sembler, paraître) et les cas particuliers : <i>coûter, peser, courir</i> restent invariables quand ils sont employés impersonnellement (<i>les 500 g que ce paquet a pesé</i>).</li>\n</ul>\n<div class=\"warn\"><b>Attention :</b> avec « avoir », si le COD est <b>après</b> le verbe, pas d'accord : « J'ai cueilli <i>des fleurs</i> » (pas de -s). Le piège : le COD qui « remonte » (pronom relatif, pronom personnel).</div>\n\n<h3>4. La concordance des temps</h3>\n<p>Après « si » + imparfait de l'indicatif → conditionnel présent (<i>Si j'avais le temps, je viendrais</i>). Ne jamais mettre un conditionnel dans la subordonnée en « si ».</p>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — justifier un temps dans un récit</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquez les temps : « Le soleil se couchait. Elle prit son manteau ; elle avait froid depuis qu'elle était sortie. »</div><div class=\"etu\"><b>Étape 1 — Repérer chaque verbe</b> : se couchait (imparfait), prit (passé simple), avait (imparfait), était sortie (plus-que-parfait).</div><div class=\"etu\"><b>Étape 2 — Justifier l'imparfait</b> : « se couchait » = description du décor, action de durée ; « avait » = état de durée.</div><div class=\"etu\"><b>Étape 3 — Justifier le passé simple</b> : « prit » = action ponctuelle qui fait progresser le récit.</div><div class=\"etu\"><b>Étape 4 — Justifier le plus-que-parfait</b> : « était sortie » = antériorité par rapport à « avait froid ».</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Après « si » (conditionnel), employer l'<b>imparfait de l'indicatif</b>, jamais le conditionnel : « Si je pouvais, je viendrais ».</li>\n<li>« Je me suis souvenu » : souvenu est invariable ici (pas de COD avant le verbe) ; mais « Je me le suis souvenu » → « Je me le suis souvenu » (invariable, « le » est COI ici).</li>\n<li>Passé simple : « ils marchèrent » (pas « ils marchèrent » au pluriel) ; 3e pers. pl. en -èrent, -irent, -urent.</li>\n<li>Passé composé avec être : « elle est morte », « ils sont morts » mais « il est mort en 1750 » (invariable si complément d'époque).</li>\n<li>Ne pas confondre <b>conditionnel</b> (devrait) et <b>subjonctif</b> (qu'il vienne) : formes proches mais emplois distincts.</li>\n</ul>\n</div>"

    "id": "orthographe-accords",
    "theme": "Orthographe : pièges et accords (6e/5e)",
    "niveau": "6e/5e",
    "titre": "Orthographe : pièges et accords",
    "cours": "<div class=\"cours-head\"><h2>Orthographe : pièges et accords</h2><span class=\"niv\">6e/5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'accord sujet-verbe</h3>\n<ul>\n<li>Le verbe s'accorde avec son sujet, même si d'autres mots les séparent : « La liste <b>des candidats</b> <u>est</u> affichée » (sujet = « liste », singulier) ;</li>\n<li>Sujets reliés par « ou » : accord avec le dernier sujet (<i>Le frère ou la sœur <u>viendra</u></i>) ;</li>\n<li>Avec « ainsi que, de même que, comme » : accord avec le premier sujet (<i>Paul, ainsi que ses amis, <u>arrive</u></i>) ;</li>\n<li>Sujet « qui » : accord avec l'antécédent (<i>les élèves qui <u>travaillent</u></i>) ;</li>\n<li>« La plupart + pluriel » → pluriel ; « plus d'un » → singulier.</li>\n</ul>\n\n<h3>2. Les accords dans le groupe nominal</h3>\n<p>L'adjectif s'accorde en genre et en nombre avec le nom auquel il se rapporte, même détaché :</p>\n<ul>\n<li>« Fatigués, les enfants <b>s'endormirent</b> » : « fatigués » s'accorde avec « enfants » ;</li>\n<li>Adjectifs de couleur : accord normal (<i>des robes vertes</i>) <b>sauf</b> adjectifs composés ou empruntés au nom (<i>des yeux marron, des jupes orange, des chemises bleu clair</i>) ;</li>\n<li>« demi, semi » : invariables devant le nom (<i>une demi-heure</i>) ; « à demi » adverbe invariable.</li>\n</ul>\n\n<h3>3. Les homophones les plus fréquents</h3>\n<table>\n<tr><th>Homophones</th><th>Règle</th><th>Exemple</th></tr>\n<tr><td>a / à</td><td>« a » = verbe avoir (remplacer par « avait »)</td><td>Il <b>a</b> un livre ; il va <b>à</b> Paris</td></tr>\n<tr><td>et / est</td><td>« est » = verbe être ; « et » = conjonction (+)</td><td>Il <b>est</b> grand <b>et</b> fort</td></tr>\n<tr><td>on / ont</td><td>« ont » = avoir (remplacer par « avaient »)</td><td>Ils <b>ont</b> faim ; <b>on</b> part</td></tr>\n<tr><td>son / sont</td><td>« sont » = être (remplacer par « étaient »)</td><td>Ils <b>sont</b> là ; <b>son</b> cartable</td></tr>\n<tr><td>ce / se</td><td>« se » pronom réfléchi devant un verbe</td><td>Il <b>se</b> lave ; <b>ce</b> matin</td></tr>\n<tr><td>ou / où</td><td>« où » indique le lieu (avec accent)</td><td><b>Où</b> vas-tu ? Du pain <b>ou</b> du lait ?</td></tr>\n<tr><td>la / l'a / là</td><td>« là » = lieu ; « l'a » = le + avoir</td><td><b>Là</b>-bas ; il <b>l'a</b> vu</td></tr>\n<tr><td>leur / leurs</td><td>« leur » pronom (invariable) vs « leurs » déterminant</td><td>Il leur parle ; <b>leurs</b> livres</td></tr>\n<tr><td>tout/tous/toute/toutes</td><td>selon accord et fonction (adverbe = invariable)</td><td>elles sont <b>tout</b> émues ; <b>tous</b> les jours</td></tr>\n</table>\n<div class=\"tip\"><b>La technique universelle :</b> remplacer mentalement par un autre temps du verbe (imparfait). « Ils <i>ont</i> » → « ils <i>avaient</i> » fonctionne ; « ils <i>on</i> » impossible.</div>\n\n<h3>4. Participe passé en -é ou infinitif en -er ?</h3>\n<p>Remplacer par un verbe du 3e groupe (vendre) : « J'ai mang<u>é</u> » → « j'ai vend<u>u</u> » (participe) ; « pour mang<u>er</u> » → « pour vend<u>re</u> » (infinitif).</p>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — corriger une phrase fautive</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Corrigez : « Les fleurs que ma sœur a acheté sont magnifiques, elle les a posé sur la table. »</div><div class=\"etu\"><b>Étape 1 — Chercher les verbes et leurs sujets</b> : « sont » (sujet « les fleurs »), « a acheté », « a posé ».</div><div class=\"etu\"><b>Étape 2 — Participe avec avoir</b> : « que » = COD placé avant « a acheté » → accord : « a achet<u>ées</u> ». « les » = COD avant « a posé » → « pos<u>ées</u> ».</div><div class=\"etu\"><b>Étape 3 — Vérifier les invariables</b> : « ma sœur », « la table » : rien à changer.</div><div class=\"etu\"><b>Étape 4 — Relire</b> : « Les fleurs que ma sœur a achetées sont magnifiques, elle les a posées sur la table. » ✓</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Sujet éloigné du verbe : toujours revenir au vrai sujet (« Le groupe des touristes <u>arrive</u> »).</li>\n<li>« leur » pronom est invariable ; « leurs » déterminant s'accorde.</li>\n<li>Couleurs composées ou issues d'un nom : invariables (« des étoffes turquoise, des jupes bleu foncé »).</li>\n<li>« tout » adverbe devant un adjectif féminin : invariable (« elles sont tout étonnées »).</li>\n<li>« ça » (démonstratif) vs « sa » (possessif) : « ça va » mais « sa voiture ».</li>\n<li>« près de » (proximité) vs « prêt à » (prêt à faire qqch) : « prêt à partir », « près de la porte ».</li>\n</ul>\n</div>"

    "cours": "<div class=\"cours-head\"><h2>La phrase complexe et les subordonnées</h2><span class=\"niv\">4e/3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Phrase simple, phrase complexe</h3>\n<ul>\n<li><b>Phrase simple</b> : un seul verbe conjugué. « Le chat dort. »</li>\n<li><b>Phrase complexe</b> : au moins deux verbes conjugués. « Le chat dort parce qu'il est fatigué. »</li>\n<li>On relie les propositions par <b>juxtaposition</b> (virgule), <b>coordination</b> (mais, ou, et, donc, or, ni, car) ou <b>subordination</b> (que, qui, lorsque, parce que…).</li>\n</ul>\n\n<h3>2. Les trois types de subordonnées</h3>\n<table>\n<tr><th>Subordonnée</th><th>Introduite par</th><th>Fonction</th><th>Exemple</th></tr>\n<tr><td><b>Relative</b></td><td>qui, que, quoi, dont, où (+ prép.)</td><td>complément du nom (antécédent)</td><td>Le livre <i>que je lis</i> est long.</td></tr>\n<tr><td><b>Complétive (conjonctive COD)</b></td><td>que</td><td>COD du verbe principal</td><td>Je pense <i>que tu as raison</i>.</td></tr>\n<tr><td><b>Circonstancielle</b></td><td>quand, lorsque, parce que, si, pour que…</td><td>C. circonstanciel (temps, cause, but…)</td><td>Il part <i>quand il veut</i>.</td></tr>\n</table>\n<div class=\"tip\"><b>Distinction relative / complétive :</b> la relative suit un <b>nom</b> (antécédent) ; la complétive suit un <b>verbe</b> et complète son sens. « L'idée <i>qu'il a eue</i> » (relative, antécédent « idée ») / « Je crois <i>qu'il viendra</i> » (complétive, COD de « crois »).</div>\n\n<h3>3. Le système des subordonnées circonstancielles</h3>\n<ul>\n<li><b>Temps</b> : quand, lorsque, dès que, pendant que, avant que (+ subjonctif) ;</li>\n<li><b>Cause</b> : parce que, puisque, comme (en tête) ;</li>\n<li><b>Conséquence</b> : si bien que, de sorte que, à tel point que ;</li>\n<li><b>But</b> : pour que, afin que (+ subjonctif) ;</li>\n<li><b>Concession/opposition</b> : bien que (+ subj.), alors que, même si ;</li>\n<li><b>Condition/hypothèse</b> : si, à condition que, pourvu que.</li>\n</ul>\n<p>Autres types : <b>interrogative indirecte</b> (« Je me demande <i>si</i>… »), <b>complétive après verbe de volonté</b> (« Je veux <i>que</i>… » + subjonctif).</p>\n\n<h3>4. La ponctuation dans les phrases complexes</h3>\n<ul>\n<li>Virgule entre propositions <b>juxtaposées</b> ; jamais entre sujet et verbe ;</li>\n<li>Deux points pour annoncer une explication, une énumération ou une citation ;</li>\n<li>Point-virgule pour séparer des propositions autonomes étroitement liées.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser une phrase complexe</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Analysez : « L'élève qui a travaillé réussira parce qu'il connaît ses leçons. »</div><div class=\"etu\"><b>Étape 1 — Compter les verbes conjugués</b> : a travaillé, réussira, connaît → 3 propositions, phrase complexe.</div><div class=\"etu\"><b>Étape 2 — Identifier la principale</b> : « réussira » (L'élève… réussira) — c'est la proposition indépendante.</div><div class=\"etu\"><b>Étape 3 — Analyser les subordonnées</b> : « qui a travaillé » = relative (antécédent « élève », fonction complément du nom) ; « parce qu'il connaît ses leçons » = circonstancielle de cause du verbe « réussira ».</div><div class=\"etu\"><b>Étape 4 — Représenter</b> : P1 (principale) contient P2 (relative) ; P1 est complétée par P3 (cause). Schéma en arbre.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« que » relatif (COD : « l'homme <b>que</b> j'ai vu ») ≠ « que » conjonctif (complétive : « je crois <b>que</b>… »).</li>\n<li>Ne pas confondre <b>coordination</b> (mais, donc… relient des propositions de même niveau) et <b>subordination</b> (une proposition dépend de l'autre).</li>\n<li>« dont » remplace « de qui/de quoi » ; « où » remplace les compléments de lieu (ou de temps).</li>\n<li>« si » peut être conditionnel, interrogatif indirect ou « si » intensif (« si beau ») — trois valeurs.</li>\n<li>Une proposition relative peut être suppressible : « L'élève, qui a travaillé, réussira » (valeur explicative, entre virgules).</li>\n</ul>\n</div>"

    "titre": "Le discours direct, indirect et indirect libre",
    "cours": "<div class=\"cours-head\"><h2>Le discours direct, indirect et indirect libre</h2><span class=\"niv\">4e/3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le discours direct</h3>\n<p>On rapporte <b>exactement</b> les paroles, entre guillemets, souvent après deux-points ou une virgule, avec un verbe de parole :</p>\n<ul>\n<li>« Il déclara : <i>« Je partirai demain. »</i> »</li>\n<li>Indices : guillemets, tirets de dialogue, pronoms de 1re/2e personne, temps relatifs au moment de parole.</li>\n</ul>\n\n<h3>2. Le discours indirect</h3>\n<p>On <b>transpose</b> les paroles dans une subordonnée introduite par « que/si/ce que… ». Il faut alors tout <b>transposer</b> :</p>\n<table>\n<tr><th>Élément</th><th>Direct</th><th>Indirect</th></tr>\n<tr><td>Pronoms</td><td>je, tu, mon…</td><td>il, elle, son…</td></tr>\n<tr><td>Temps</td><td>présent → imparfait ; futur → conditionnel ; passé composé → plus-que-parfait</td><td>« Je viendrai » → « il viendrait »</td></tr>\n<tr><td>Mots de liaison</td><td>« Demain, ici »</td><td>« le lendemain, là-bas »</td></tr>\n</table>\n<p>Exemple : Il déclara : « Je partirai demain. » → Il déclara <i>qu'il partirait le lendemain</i>.</p>\n<div class=\"tip\"><b>Règle d'or de la concordance :</b> si le verbe introducteur est au passé, tout ce qui était présent devient imparfait, le futur devient conditionnel. C'est le réflexe n°1 du discours indirect.</div>\n\n<h3>3. Le discours indirect libre</h3>\n<p>Hybride : les paroles sont <b>rapportées sans verbe introducteur ni guillemets</b>, tout en gardant les marques du discours direct (pronoms, questions, exclamations). Effet : on entre dans la pensée du personnage :</p>\n<ul>\n<li>« Elle regarda la pluie. Pourquoi fallait-il toujours qu'il pleuve un jour de fête ? » — la question est celle du personnage, pas du narrateur.</li>\n<li>Fréquent en littérature (Flaubert, Zola) pour le <b>monologue intérieur</b>.</li>\n</ul>\n\n<h3>4. Les verbes de parole et de pensée</h3>\n<ul>\n<li>Neutres : dire, demander, répondre, penser, se demander ;</li>\n<li><b>Modalisés</b> (utile au commentaire) : affirmer, s'exclamer, murmurer, hurler, ironiser, avouer, insister — ils traduisent une intention.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — transformer un dialogue en discours indirect</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Mettez en discours indirect : « Viendras-tu à la fête ? » demanda Léa. « Je ne peux pas, je travaille », répondit Paul.</div><div class=\"etu\"><b>Étape 1 — Repérer les transpositions obligatoires</b> : pronom « tu » → « il » ; verbe « viendras-tu » : question → « si » ; présent « peux » → imparfait « pouvait » ; présent « travaille » → imparfait.</div><div class=\"etu\"><b>Étape 2 — Transposer</b> : Léa demanda <i>s'il viendrait à la fête</i>. Paul répondit <i>qu'il ne pouvait pas parce qu'il travaillait</i>.</div><div class=\"etu\"><b>Étape 3 — Vérifier</b> : plus de guillemets, plus d'interrogation directe, concordance des temps respectée.</div><div class=\"etu\"><b>Étape 4 — Nuancer</b> : on peut moduler avec « demanda » → « voulu savoir » ou « s'enquit de » pour varier le style.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Question directe → « si » en indirect : « Es-tu là ? » → « Il demanda <b>si</b> j'étais là » (pas « que »).</li>\n<li>« Qu'est-ce que tu fais ? » → « ce que » ; « Que fais-tu ? » → « ce qu'il faisait ».</li>\n<li>« ici/ maintenant / hier » deviennent « là / alors / la veille » en indirect.</li>\n<li>Discours indirect libre ≠ discours indirect : pas de verbe introducteur ; ne pas confondre avec le récit du narrateur.</li>\n<li>Ne pas oublier l'impératif indirect : « Sors ! » → « Il demanda qu'il sorte » (subjonctif) ou « de sortir » (infinitif).</li>\n</ul>\n</div>"
  },

    "id": "genres-formes",

    "cours": "<div class=\"cours-head\"><h2>Les genres et les formes littéraires</h2><span class=\"niv\">4e/3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois grands genres</h3>\n<table>\n<tr><th>Genre</th><th>Forme</th><th>Effets</th></tr>\n<tr><td><b>Poésie</b></td><td>vers (réguliers ou libres), prose poétique</td><td>musicalité, images, émotion, lyrisme</td></tr>\n<tr><td><b>Théâtre</b></td><td>dialogue, didascalies, actes et scènes</td><td>représentation, conflit, parole en action</td></tr>\n<tr><td><b>Roman (récit)</b></td><td>chapitres, narration, points de vue</td><td>immersion, temps, construction d'un monde</td></tr>\n</table>\n<p>S'y ajoutent des <b>genres argumentatifs</b> : essai, lettre, apologue (fable), conte philosophique, discours, article.</p>\n\n<h3>2. Formes : récit, description, dialogue, monologue</h3>\n<ul>\n<li><b>Récit</b> : raconte des actions, fait progresser le temps ;</li>\n<li><b>Description</b> : arrête le temps, accumule les détails (effet de réel) ;</li>\n<li><b>Dialogue</b> : théâtre, mais aussi roman (dialogue rapporté) ;</li>\n<li><b>Monologue</b> : un seul personnage parle ; peut être un dialogue intérieur (théâtre) ou intérieur (roman).</li>\n</ul>\n\n<h3>3. Le narrateur et le point de vue (focalisation)</h3>\n<ul>\n<li><b>Focalisation zéro</b> (omnisciente) : le narrateur en sait plus que les personnages ;</li>\n<li><b>Focalisation interne</b> : on suit les pensées d'un personnage ;</li>\n<li><b>Focalisation externe</b> : le narrateur ne décrit que ce qu'on peut voir, aucune pensée (effet caméra).</li>\n</ul>\n<p>Aussi : narrateur <b>homodiégétique</b> (personnage de l'histoire, « je ») vs <b>hétérodiégétique</b> (récit à la 3e personne).</p>\n\n<h3>4. Temps et rythme du récit</h3>\n<ul>\n<li><b>Analepse / prolepse</b> : retour en arrière / anticipation ;</li>\n<li><b>Scène</b> (temps du récit = temps de l'histoire) vs <b>sommaire</b> (résumé accéléré) vs <b>pause</b> (description).</li>\n</ul>\n<div class=\"tip\"><b>Pour l'analyse :</b> toujours relier la forme à l'effet. Un dialogue accélère l'action et rend la scène vivante ; une description ralentit et installe une atmosphère ; un monologue intérieur révèle la psychologie.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — identifier genre, forme et focalisation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Elle longea le couloir. Sur les murs, des photos jaunies montraient des visages inconnus. \"Personne ne me reconnaîtra jamais ici\", songea-t-elle. »</div><div class=\"etu\"><b>Étape 1 — Genre</b> : récit romanesque (narration à la 3e personne, passé simple).</div><div class=\"etu\"><b>Étape 2 — Formes mêlées</b> : récit (« longea ») + description (« photos jaunies », effet de réel et d'atmosphère) + monologue intérieur rapporté (discours direct dans la pensée).</div><div class=\"etu\"><b>Étape 3 — Focalisation</b> : interne — on suit les perceptions et la pensée d'« elle ».</div><div class=\"etu\"><b>Étape 4 — Effet produit</b> : mystère et isolement du personnage ; le lecteur est dans sa conscience.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Ne pas confondre <b>auteur</b> (personne réelle) et <b>narrateur</b> (instance qui raconte).</li>\n<li>Focalisation interne ≠ narrateur homodiégétique : on peut suivre un personnage à la 3e personne.</li>\n<li>Une description n'est jamais « inutile » : elle construit un sens (atmosphère, symbole).</li>\n<li>Le monologue au théâtre s'adresse malgré tout au public (double énonciation) ; le monologue intérieur romanesque, non.</li>\n<li>Genre ≠ forme : le roman peut contenir dialogues, descriptions, passages poétiques.</li>\n</ul>\n</div>"

    "cours": "<div class=\"cours-head\"><h2>Les registres et les tonalités</h2><span class=\"niv\">4e/3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce qu'un registre ?</h3>\n<p>Le <b>registre</b> (ou tonalité) est l'émotion dominante que le texte cherche à provoquer chez le lecteur. Il résulte du vocabulaire, des images, du rythme et de la visée :</p>\n<table>\n<tr><th>Registre</th><th>Effet visé</th><th>Indices</th></tr>\n<tr><td><b>Lyrique</b></td><td>émotion personnelle, sentiment</td><td>1re personne, exclamations, images</td></tr>\n<tr><td><b>Épique</b></td><td>admiration, grandeur</td><td>hyperboles, pluriels, énumérations</td></tr>\n<tr><td><b>Tragique</b></td><td>effroi, fatalité</td><td>destin, mort inévitable, questions sans réponse</td></tr>\n<tr><td><b>Comique</b></td><td>rire</td><td>jeux de mots, quiproquos, caricature</td></tr>\n<tr><td><b>Pathétique</b></td><td>pitié, émotion douloureuse</td><td>lamentations, lexique de la souffrance</td></tr>\n<tr><td><b>Satirique</b></td><td>critique, indignation</td><td>ironie, antiphrase, exagération critique</td></tr>\n<tr><td><b>Didactique</b></td><td>instruire</td><td>explications, exemples, connecteurs logiques</td></tr>\n<tr><td><b>Fantastique</b></td><td>trouble, hésitation surnaturelle</td><td>irruption de l'irrationnel, doute du narrateur</td></tr>\n</table>\n\n<h3>2. Les moyens d'expression du registre</h3>\n<ul>\n<li><b>Vocabulaire connoté</b> : « guerrier » vs « soldat » vs « tueur » ;</li>\n<li><b>Figures de style</b> : hyperbole (épique), antiphrase (satirique), gradation (pathétique) ;</li>\n<li><b>Ponctuation et rythme</b> : exclamations (lyrique), phrases longues et solennelles (tragique) ;</li>\n<li><b>Point de vue</b> : l'ironie suppose un lecteur qui décrypte l'écart entre ce qui est dit et ce qui est pensé.</li>\n</ul>\n<div class=\"tip\"><b>Un texte peut mêler plusieurs registres :</b> un récit tragique peut contenir des passages comiques. Toujours nommer le registre <b>dominant</b> et le justifier par des citations.</div>\n\n<h3>3. Ironie et antiphrase</h3>\n<ul>\n<li><b>Antiphrase</b> : dire le contraire de ce qu'on pense (« Quel temps magnifique ! » sous la pluie) ;</li>\n<li><b>Ironie</b> : énoncer sérieusement une absurdité pour la dénoncer (Voltaire, « c'est à cette douceur qu'il faut rapporter nos maux ») ;</li>\n<li>Effets : complicité avec le lecteur, critique voilée.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — caractériser un registre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Ah ! Qu'ils sont beaux, ces édifices que le peuple a payés de sa faim pendant que les puissants s'engraissaient ! »</div><div class=\"etu\"><b>Étape 1 — Chercher les marques d'énonciation</b> : exclamative (« Ah ! »), intensif « qu'ils sont beaux » → antiphrase probable (registre satirique).</div><div class=\"etu\"><b>Étape 2 — Analyser le lexique</b> : opposition « faim du peuple » / « puissants engraissés » → dénonciation d'une injustice (visée argumentative).</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : registre satirique (ironie + indignation), renforcé de pathétique (« faim »).</div><div class=\"etu\"><b>Étape 4 — Justifier</b> : toujours citer les expressions qui fondent l'analyse (« Ah ! », antiphrase, champ lexical de la faim).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Ne pas confondre <b>tragique</b> (fatalité) et <b>dramatique</b> (simplement grave) ; ni <b>pathétique</b> (fait de souffrir le lecteur) et <b>tragique</b>.</li>\n<li>Le <b>comique</b> n'est pas toujours léger : il peut être satirique (critique sociale).</li>\n<li>Ironie ≠ sarcasme méchant gratuit : l'ironie vise une dénonciation.</li>\n<li>Ne pas coller un registre sur un texte entier : il peut évoluer d'un passage à l'autre.</li>\n<li>Le registre se <b>justifie</b> par des indices textuels — jamais d'affirmation sans citation.</li>\n</ul>\n</div>"

    "id": "figures-style",
    "theme": "Les figures de style (4e/3e)",
    "niveau": "4e/3e",
    "titre": "Les figures de style",
    "cours": "<div class=\"cours-head\"><h2>Les figures de style</h2><span class=\"niv\">4e/3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Figures d'analogie (images)</h3>\n<ul>\n<li><b>Comparaison</b> : outil de comparaison (comme, semblable à) — « doux <b>comme</b> un agneau » ;</li>\n<li><b>Métaphore</b> : sans outil — « cette vague de colère » ;</li>\n<li><b>Métaphore filée</b> : prolongée dans tout un passage ;</li>\n<li><b>Personnification</b> : prêter des traits humains à une chose — « le vent <b>gémissait</b> ».</li>\n</ul>\n\n<h3>2. Figures d'insistance et d'atténuation</h3>\n<table>\n<tr><th>Figure</th><th>Mécanisme</th><th>Exemple</th></tr>\n<tr><td><b>Anaphore</b></td><td>répétition en début de phrase</td><td><i>« Résister ! Résister toujours ! »</i></td></tr>\n<tr><td><b>Gradation</b></td><td>intensité croissante</td><td><i>« il souffre, il agonise, il meurt »</i></td></tr>\n<tr><td><b>Hyperbole</b></td><td>exagération</td><td><i>« mourir de rire »</i></td></tr>\n<tr><td><b>Accumulation / énumération</b></td><td>série de termes</td><td><i>« des soupirs, des larmes, des cris »</i></td></tr>\n<tr><td><b>Litote</b></td><td>dire moins pour suggérer plus</td><td><i>« Ce n'est pas mauvais » (= excellent)</i></td></tr>\n<tr><td><b>Euphémisme</b></td><td>atténuer une réalité dure</td><td><i>« il nous a quittés » (= il est mort)</i></td></tr>\n</table>\n\n<h3>3. Figures de construction et de substitution</h3>\n<ul>\n<li><b>Antithèse</b> : opposition dans une même phrase (« <i>je vis, moi qui meurs</i> ») ;</li>\n<li><b>Chiasme</b> : inversion croisée (ABBA) ;</li>\n<li><b>Parallélisme</b> : même structure répétée ;</li>\n<li><b>Périphrase</b> : remplacer un mot par une expression (« <i>la Ville Lumière</i> ») ;</li>\n<li><b>Métonymie</b> : contenant pour contenu (« boire <i>un verre</i> ») ; <b>synecdoque</b> : partie pour tout (« <i>une voile</i> à l'horizon »).</li>\n</ul>\n\n<h3>4. Figures d'opposition et de ton</h3>\n<ul>\n<li><b>Antiphrase</b> : dire le contraire (ironie) ;</li>\n<li><b>Oxymore</b> : alliance de contraires (« <i>un soleil noir</i> », « <i>cette obscure clarté</i> ») ;</li>\n<li><b>Prétérition</b> : « je ne vous dirai pas que… » (tout en le disant).</li>\n</ul>\n<div class=\"tip\"><b>Méthode d'analyse :</b> 1) <u>relever</u> la figure, 2) la <u>nommer</u>, 3) expliquer son <u>effet</u> dans le contexte (image, émotion, rythme, critique) — jamais l'inventaire pour l'inventaire.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser trois figures dans un vers</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Et moi, moi qui tremblais comme une feuille au vent de votre absence, je n'ose plus vous nommer. »</div><div class=\"etu\"><b>Étape 1 — Relever</b> : « moi, moi » ; « trembler comme une feuille au vent » ; « je n'ose plus vous nommer ».</div><div class=\"etu\"><b>Étape 2 — Nommer</b> : anaphore/gradation de « moi » (insistance sur le « je » souffrant) ; comparaison (fragilité) ; litote ou prétérition (dire l'absence par le silence).</div><div class=\"etu\"><b>Étape 3 — Interpréter</b> : ensemble, ces figures construisent un registre lyrique — l'émotion amoureuse contenue.</div><div class=\"etu\"><b>Étape 4 — Rédiger</b> : formuler l'effet (« la comparaison rend sensible la fragilité du poète, l'anaphore accentue son isolement… »).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Comparaison (avec « comme ») ≠ métaphore (sans outil) — vérifier la présence du mot-outil.</li>\n<li>Antithèse = opposition de mots ; oxymore = contradiction <b>dans le même groupe</b>.</li>\n<li>Antiphrase ≠ oxymore : l'antiphrase relève de l'ironie du locuteur.</li>\n<li>Une figure ne se contente jamais d'être nommée : elle doit être <b>interprétée</b>.</li>\n<li>« Tout comme » n'est pas toujours une comparaison stylistique ; vérifier l'effet produit.</li>\n</ul>\n</div>"
  },

    "titre": "Le sens des mots et le lexique",
    "cours": "<div class=\"cours-head\"><h2>Le sens des mots et le lexique</h2><span class=\"niv\">6e/5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Sens propre et sens figuré</h3>\n<ul>\n<li><b>Sens propre</b> : sens premier, concret — « une <b>chaîne</b> de vélo » ;</li>\n<li><b>Sens figuré</b> : sens dérivé, abstrait — « la <b>chaîne</b> du souvenir » ;</li>\n<li>Le passage du propre au figuré s'appelle une <b>extension de sens</b> ; l'inverse peut créer un effet comique.</li>\n</ul>\n\n<h3>2. Polysémie et contexte</h3>\n<p>Un mot <b>polysémique</b> a plusieurs sens liés : « <i>voler</i> » (dérober / planer), « <i>tête</i> » (partie du corps / chef / extrémité). C'est le <b>contexte</b> qui tranche :</p>\n<ul>\n<li>« Il a volé un livre » → dérober ;</li>\n<li>« L'oiseau vole » → planer.</li>\n</ul>\n\n<h3>3. Synonymie, antonymie, homonymie</h3>\n<table>\n<tr><th>Relation</th><th>Définition</th><th>Exemple</th></tr>\n<tr><td><b>Synonymes</b></td><td>sens proches, nuances différentes</td><td><i>courageux / téméraire</i></td></tr>\n<tr><td><b>Antonymes</b></td><td>sens opposés</td><td><i>généreux / avare</i></td></tr>\n<tr><td><b>Homonymes</b></td><td>même son, sens différents</td><td><i>ver / vert / vers / verre</i></td></tr>\n<tr><td><b>Paronymes</b></td><td>sons proches, sens différents</td><td><i>éminent / imminent</i></td></tr>\n</table>\n<div class=\"tip\"><b>Choisir le bon synonyme :</b> les synonymes ne sont jamais parfaitement interchangeables — ils diffèrent par le <b>niveau de langue</b> (populaire, courant, soutenu), la <b>connotation</b> (posée, négative) et le <b>domaine</b> (technique, littéraire).</div>\n\n<h3>4. Les niveaux de langue</h3>\n<ul>\n<li><b>Courant</b> : « Il a très faim » ;</li>\n<li><b>Soutenu</b> : « Il est affamé » ;</li>\n<li><b>Populaire / familier</b> : « Il creve de faim ».</li>\n</ul>\n<p>Au brouillon d'une dissertation ou d'un commentaire, on utilise le niveau courant ; les citations gardent leur niveau d'origine.</p>\n\n<h3>5. Formation des mots</h3>\n<ul>\n<li><b>Dérivation</b> : préfixe ou suffixe (<i>in-justice, just-ement</i>) ;</li>\n<li><b>Composition</b> : deux mots réunis (<i>porte-parole, chaise longue</i>) ;</li>\n<li><b>Familles de mots</b> : ensemble des mots d'une même racine (<i>port : portable, transport, exportation…</i>).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — expliquer un mot dans un texte</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Que signifie « l'or » dans : « L'or de ses cheveux illuminait la salle. »</div><div class=\"etu\"><b>Étape 1 — Sens propre ?</b> « Or » = métal précieux — incohérent avec des cheveux.</div><div class=\"etu\"><b>Étape 2 — Sens figuré</b> : par analogie de couleur et d'éclat, « or » désigne des cheveux blonds, brillants.</div><div class=\"etu\"><b>Étape 3 — Effet produit</b> : la métaphore valorise le personnage (beauté, lumière, préciosité) — indice du regard admiratif.</div><div class=\"etu\"><b>Étape 4 — Rédiger</b> : « \"Or\" est employé au sens figuré : par sa connotation de lumière et de richesse, il fait du personnage un être précieux. »</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Deux homonymes ne sont pas interchangeables : vérifier le sens par le contexte.</li>\n<li>Paronymes pièges : <i>éminent/imminent, accepter/excepter, collision/collusion, dessin/dessein</i>.</li>\n<li>Une connotation peut être positive ou négative : <i>hardi</i> (positif) vs <i>effronté</i> (négatif), même idée.</li>\n<li>Ne pas confondre <b>étymologie</b> (origine) et <b>sens actuel</b> (qui a pu évoluer).</li>\n<li>Le sens d'un mot dépend toujours de l'<b>énonciation</b> : qui parle, à qui, dans quel but ?</li>\n</ul>\n</div>"
  },

    "id": "types-formes",
    "theme": "Les types et les formes de phrases (6e/5e)",
    "niveau": "6e/5e",
    "titre": "Les types et les formes de phrases",
    "cours": "<div class=\"cours-head\"><h2>Les types et les formes de phrases</h2><span class=\"niv\">6e/5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les quatre types de phrases</h3>\n<table>\n<tr><th>Type</th><th>Rôle</th><th>Exemple</th><th>Ponctuation</th></tr>\n<tr><td><b>déclaratif</b></td><td>donner une information</td><td>Le chat dort sur le canapé.</td><td>point</td></tr>\n<tr><td><b>interrogatif</b></td><td>poser une question</td><td>Où dormait le chat ?</td><td>point d'interrogation</td></tr>\n<tr><td><b>exclamatif</b></td><td>exprimer une émotion</td><td>Comme ce chat dort bien !</td><td>point d'exclamation</td></tr>\n<tr><td><b>impératif</b></td><td>donner un ordre, un conseil</td><td>Sors le chat du canapé.</td><td>point ou point d'exclamation</td></tr>\n</table>\n\n<h3>2. Les formes de phrases</h3>\n<ul>\n<li><b>Forme positive</b> : Le chat dort. / <b>Forme négative</b> : Le chat ne dort pas. (deux marques : ne… pas) ;</li>\n<li>Autres négations : ne… jamais, ne… plus, ne… rien, ne… personne ;</li>\n<li>Une phrase exclamative peut être négative (Il ne dort pas, le chat !) : le <b>type</b> et la <b>forme</b> sont deux questions indépendantes.</li>\n</ul>\n\n<h3>3. Transformer une phrase</h3>\n<ul>\n<li>Déclarative → interrogative : « Tu viens demain. » → « Viens-tu demain ? » / « Est-ce que tu viens demain ? » / « Tu viens demain ? » ;</li>\n<li>Positive → négative : ajouter ne… pas autour du <b>verbe</b> ;</li>\n<li>À l'impératif, le sujet est <b>absent</b> : « Ferme la porte. »</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Exclamatif » n'est pas synonyme de « impératif » : l'un exprime une émotion, l'autre un ordre.</li>\n<li>La négation exige <b>deux</b> marques (ne… pas) : « Je pas veux » est incorrect.</li>\n<li>Une interrogation peut être sans point d'interrogation à l'oral, mais à l'écrit elle en porte un.</li>\n<li>L'impératif n'a pas de sujet exprimé, mais le sujet existe (tu/nous).</li>\n</ul>\n</div>"

    "id": "poesie",
    "theme": "La poésie : du lyrisme à l'engagement (2de/1re)",
    "niveau": "2de/1re",
    "titre": "La poésie : du lyrisme à l'engagement",
    "cours": "<div class=\"cours-head\"><h2>La poésie : du lyrisme à l'engagement</h2><span class=\"niv\">2de/1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les fonctions de la poésie</h3>\n<ul>\n<li><b>Poésie lyrique</b> : exprimer les sentiments personnels (amour, mélancolie, nature) — Ronsard, Hugo, Musset ;</li>\n<li><b>Poésie engagée</b> : dénoncer, défendre une cause — Hugo, Desnos, Éluard, Aragon, Prévert ;</li>\n<li><b>Poésie de la mémoire</b> : témoigner — du poème élégiaque au poème-hommage (Péguy, <i>Œuvres poétiques complètes</i> ; Aragon, <i>La Rose et le Réséda</i>) ;</li>\n<li><b>Poésie du quotidien</b> : sublimer le réel — Francis Ponge (le parti pris des choses).</li>\n</ul>\n<div class=\"tip\"><b>Repères engagés :</b> Hugo, <i>Les Châtiments</i> (1853, contre Napoléon III) ; Éluard, « Liberté » (1941, diffusé en tract pendant l'Occupation) ; Desnos et Aragon, poètes de la Résistance.</div>\n\n<h3>2. Le vers et la strophe</h3>\n<table>\n<tr><th>Élément</th><th>Détail</th></tr>\n<tr><td><b>Vers</b></td><td>compté en syllabes (alexandrin = 12, décasyllabe = 10, octosyllabe = 8)</td></tr>\n<tr><td><b>Rime</b></td><td>plate (AABB), croisée (ABAB), embrassée (ABBA) ; féminine/masculine ; richesse (niveau 1, 2, 3…)</td></tr>\n<tr><td><b>Strophe</b></td><td>quatrain (4), tercet (3), quintil (5)…</td></tr>\n<tr><td><b>Fixe</b></td><td>sonnet (2 quatrains + 2 tercets), ballade, pantoun</td></tr>\n</table>\n<ul>\n<li><b>Diérèse</b> : prononcer en deux syllabes (« li-on ») ; <b>synérèse</b> : l'inverse ;</li>\n<li><b>Enjambement</b> : le sens déborde du vers ; <b>rejet</b> : mot rejeté au vers suivant ; <b>contre-rejet</b> : amorce au vers précédent ;</li>\n<li><b>Vers libres</b> : sans mesure régulière (versets de Whitman, poésie moderne).</li>\n</ul>\n\n<h3>3. L'image poétique</h3>\n<ul>\n<li>La poésie joue sur les <b>correspondances</b> (Baudelaire : « Les parfums, les couleurs et les sons se répondent ») ;</li>\n<li>Symboles récurrents : le <b>cygne</b> (exil, beauté maudite), l'<b>albatros</b> (poète moqué), le <b>voyage</b> (évasion), la <b>nuit</b> (mystère).</li>\n</ul>\n\n<h3>4. Analyser un poème : la démarche</h3>\n<ol>\n<li>Regarder la <b>forme</b> : vers régulier ? strophes ? rimes ?</li>\n<li>Lire à voix haute : repérer le <b>rythme</b>, les sonorités (assonances, allitérations) ;</li>\n<li>Identifier le <b>thème</b> et la <b>visée</b> (émouvoir ? dénoncer ? célébrer ?) ;</li>\n<li>Relier la forme au fond : pourquoi ce rythme, ces sons, ces images ici ?</li>\n</ol>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser « Demain, dès l'aube » de Hugo</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « Demain, dès l'aube, à l'heure où blanchit la campagne, / Je partirai. Vois-tu, je sais que tu m'attends. » — Analysez le lien entre forme et émotion.</div><div class=\"etu\"><b>Étape 1 — Forme</b> : quatrains d'alexandrins, rimes embrassées ; simplicité apparente du récit d'un voyage.</div><div class=\"etu\"><b>Étape 2 — Indices du deuil</b> : « je sais que tu m'attends » s'adresse à Léopoldine, morte noyée — adresse à une absente.</div><div class=\"etu\"><b>Étape 3 — Interpréter</b> : le chemin vers le cimetière se déguise en marche nuptiale (« je ne puis demeurer loin de toi plus longtemps ») : émotion contenue dans une forme classique.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la régularité du vers fait contrepoids à la douleur — c'est l'émotion maîtrisée, typique du lyrisme hugolien.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Compter les syllabes : le <b>e</b> final muet compte devant consonne, s'élide devant voyelle et en fin de vers.</li>\n<li>Rime féminine/masculine : la féminine se termine par un -e muet.</li>\n<li>Un poème « libre » n'est pas « sans structure » : chercher d'autres régularités (anaphores, refrain).</li>\n<li>Ne pas confondre <b>thème</b> (ce dont ça parle) et <b>tonalité</b> (l'émotion produite).</li>\n<li>Le lyrisme n'exclut pas l'engagement : Éluard écrit pour la Résistance <b>et</b> sur l'amour.</li>\n</ul>\n</div>"
  },

    "id": "theatre",
    "theme": "Le théâtre : texte et représentation (2de/1re)",
    "niveau": "2de/1re",
    "titre": "Le théâtre : texte et représentation",
    "cours": "<div class=\"cours-head\"><h2>Le théâtre : texte et représentation</h2><span class=\"niv\">2de/1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les spécificités du texte théâtral</h3>\n<ul>\n<li>Texte fait pour être <b>représenté</b> : double énonciation (les personnages se parlent, l'auteur parle au public) ;</li>\n<li><b>Didascalies</b> : indications scéniques (gestes, décors, ton) — hors dialogue, mais porteuses de sens ;</li>\n<li>Structure : <b>actes</b> et <b>scènes</b> ; l'entrée ou la sortie d'un personnage change la configuration ;</li>\n<li><b>Tirade</b> : long monologue ; <b>stichomythie</b> : répliques courtes et vives (conflit).</li>\n</ul>\n\n<h3>2. Les grands genres théâtraux</h3>\n<table>\n<tr><th>Genre</th><th>Règles classiques</th><th>Effet</th></tr>\n<tr><td><b>Tragédie</b></td><td>unités de temps, lieu, action ; nobles ; fatalité</td><td>terreur et pitié (Racine, <i>Phèdre</i>)</td></tr>\n<tr><td><b>Comédie</b></td><td>types sociaux, dénouement heureux</td><td>rire et critique (Molière, <i>Le Malade imaginaire</i>)</td></tr>\n<tr><td><b>Tragi-comédie / drame romantique</b></td><td>mélange des genres, rejet des unités</td><td>émotion et liberté (Hugo, <i>Ruy Blas</i>)</td></tr>\n<tr><td><b>Théâtre de l'absurde</b></td><td>langage qui se délite, illogisme</td><td>mal-être moderne (Ionesco, Beckett)</td></tr>\n</table>\n\n<h3>3. Le conflit dramatique</h3>\n<ul>\n<li>Une pièce vit de <b>conflits</b> : désir vs interdit (tragédie), pouvoir vs légitimité, société vs individu ;</li>\n<li>L'<b>exposition</b> installe l'enjeu ; les <b>coups de théâtre</b> relancent l'intérêt ; le <b>dénouement</b> résout (ou non) ;</li>\n<li>La scène d'<b>aveu</b> ou de <b>confrontation</b> est souvent le sommet (scène d'exposition de <i>Phèdre</i>…).</li>\n</ul>\n<div class=\"tip\"><b>Relire la règle des trois unités</b> (XVIIe, doctrine classique) : une action, un jour, un lieu. Hugo et les romantiques la brisent en 1830 (<i>Hernani</i>, la « bataille » d'Hernani).</div>\n\n<h3>4. De la page à la scène</h3>\n<ul>\n<li>Le metteur en scène <b>interprète</b> : espace, lumière, gestuelle, musique ;</li>\n<li>Une même scène a <b>plusieurs mises en scène possibles</b> : analyser les choix (costume, décor, rythme) ;</li>\n<li>Le spectateur complète le texte : le sens naît de cette <b>co-création</b>.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser une tirade</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans une tirade, un personnage seul en scène exalte la liberté avant de quitter sa famille. Quels indices exploiter ?</div><div class=\"etu\"><b>Étape 1 — Situation d'énonciation</b> : monologue → confidence au public ; le personnage s'adresse aux spectateurs (double énonciation).</div><div class=\"etu\"><b>Étape 2 — Lexique et figures</b> : champ de la liberté, exclamatives, anaphores (« Enfin… ! ») → registre lyrique.</div><div class=\"etu\"><b>Étape 3 — Didascalies</b> : rythme imposé (vite, emporté) ; regard vers la sortie = geste d'arrachement.</div><div class=\"etu\"><b>Étape 4 — Enjeu dramatique</b> : la tirade prépare l'action (départ) et prend le public à témoin — renversement des loyautés.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Le théâtre n'est pas « que » le dialogue : les didascalies sont un texte à part entière.</li>\n<li>Comédie ≠ texte drôle par nature : c'est un genre codifié (dénouement heureux, types).</li>\n<li>Tragique ≠ triste : la tragédie repose sur la <b>fatalité</b>, pas seulement le malheur.</li>\n<li>Ne pas confondre <b>acte</b> (grande division) et <b>scène</b> (division par entrées/sorties).</li>\n<li>Une mise en scène n'est pas « fidèle ou infidèle » : elle est une <b>lecture</b> du texte.</li>\n</ul>\n</div>"
  },

    "id": "roman",
    "theme": "Le roman et le récit (2de/1re)",
    "niveau": "2de/1re",
    "titre": "Le roman et le récit",
    "cours": "<div class=\"cours-head\"><h2>Le roman et le récit</h2><span class=\"niv\">2de/1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le roman : un monde et un regard</h3>\n<ul>\n<li>Le roman crée un <b>univers</b> (temps, lieu, personnages) organisé par une <b>intrigue</b> ;</li>\n<li>Sous-genres : roman d'apprentissage, roman réaliste, roman épistolaire, roman historique, roman de science-fiction, autofiction…</li>\n<li>Le roman explore le <b>réel</b> ou l'imaginaire, mais toujours la <b>condition humaine</b> (désirs, conflits, société).</li>\n</ul>\n\n<h3>2. Le personnage de roman</h3>\n<ul>\n<li>Personnage <b>principal</b> (protagoniste) vs <b>secondaire</b> ; <b>antagoniste</b> (s'oppose au héros) ;</li>\n<li><b>Héros</b> exemplaire vs <b>anti-héros</b> (médiocre, échoué — Bouvard et Pécuchet, Meursault) ;</li>\n<li>Le personnage se construit par ses <b>actions</b>, ses <b>paroles</b>, ses <b>pensées</b> (portraits, discours indirect libre) et le regard des autres ;</li>\n<li><b>Focalisation</b> : ce que le narrateur laisse voir de sa conscience.</li>\n</ul>\n\n<h3>3. Narration et temps</h3>\n<table>\n<tr><th>Notion</th><th>Définition</th></tr>\n<tr><td><b>Ordre</b></td><td>analepse (retour en arrière), prolepse (anticipation)</td></tr>\n<tr><td><b>Durée</b></td><td>scène, sommaire, pause, ellipse</td></tr>\n<tr><td><b>Fréquence</b></td><td>répétition d'un événement (narration itérative/singulative)</td></tr>\n<tr><td><b>Mode</b></td><td>focalisation zéro / interne / externe</td></tr>\n<tr><td><b>Voix</b></td><td>narrateur homodiégétique / hétérodiégétique ; fiabilité (narrateur trompeur)</td></tr>\n</table>\n<div class=\"tip\"><b>Réflexe d'analyse :</b> tout effet romanesque (suspense, surprise, mystère, ironie) vient d'un <b>écart d'information</b> entre narrateur, personnage et lecteur. Toujours demander : qui sait quoi, et quand ?</div>\n\n<h3>4. Le réalisme et ses dépassements</h3>\n<ul>\n<li>Réalisme (XIXe) : documentation, effet de réel, milieux sociaux (Balzac, Zola) ;</li>\n<li>Naturalisme : réalisme + déterminisme scientifique (hérédité, milieu) ;</li>\n<li>Ruptures : <b>nouveau roman</b> (Robbe-Grillet : description sans psychologie), <b>absurde</b> (Camus, <i>L'Étranger</i>), <b>magique</b> (García Márquez) ;</li>\n<li>Le romancier <b>choisit</b> ce qu'il montre : la « réalité » du roman est une construction.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser un incipit de roman</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un incipit commence par : « Longtemps, je me suis couché de bonne heure. » — Que faire de cette phrase ?</div><div class=\"etu\"><b>Étape 1 — Énonciation</b> : « je » → narrateur homodiégétique ; promesse d'une mémoire (rétrospection).</div><div class=\"etu\"><b>Étape 2 — Temps</b> : imparfait itératif (« je me couchais ») → narration répétitive, durée longue.</div><div class=\"etu\"><b>Étape 3 — Attente créée</b> : rien n'est dit du lieu, des personnes → contrat de lecture : une vie sera explorée, pas une action.</div><div class=\"etu\"><b>Étape 4 — Situer</b> : incipit de <i>À la recherche du temps perdu</i> (Proust) — l'importance est ailleurs (dormir, se souvenir) : programme du roman.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Ne pas confondre <b>auteur</b>, <b>narrateur</b> et <b>personnage</b>, même à la 1re personne.</li>\n<li>« Roman réel » : tout récit est <b>travaillé</b> ; l'effet de réel est un procédé.</li>\n<li>Ellipse ≠ sommaire : l'ellipse <b>saute</b> le temps ; le sommaire le <b>condense</b>.</li>\n<li>Anti-héros ≠ méchant : c'est un protagoniste dépourvu des qualités héroïques classiques.</li>\n<li>L'incipit n'est pas seulement « le début » : il pose le <b>contrat de lecture</b> (genre, ton, voix, monde).</li>\n</ul>\n</div>"
  },

    "cours": "<div class=\"cours-head\"><h2>L'argumentation : convaincre, persuader, délibérer</h2><span class=\"niv\">1re/Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois visées</h3>\n<table>\n<tr><th>Visée</th><th>Moyens</th><th>Effet recherché</th></tr>\n<tr><td><b>Convaincre</b></td><td>logique, démonstration, faits</td><td>adhésion rationnelle</td></tr>\n<tr><td><b>Persuader</b></td><td>émotions, valeurs, images</td><td>adhésion par le cœur</td></tr>\n<tr><td><b>Délibérer</b></td><td>peser le pour et le contre</td><td>choisir après examen</td></tr>\n</table>\n<p>Un texte réel combine presque toujours les trois : la <b>thèse</b> (position défendue) s'appuie sur des <b>arguments</b> (raisons), illustrés par des <b>exemples</b>.</p>\n\n<h3>2. Les stratégies argumentatives</h3>\n<ul>\n<li><b>Directe</b> (essai, lettre ouverte, plaidoyer) : démonstration explicite — Montesquieu, Rousseau ;</li>\n<li><b>Fictionnelle / indirecte</b> : faire adhérer par un récit — apologue, fable, conte philosophique, utopie (La Fontaine, Voltaire, <i>Candide</i>) ;</li>\n<li><b>Éloquente</b> : discours, oraison funèbre — rythmes, questions oratoires, antithèses (Bossuet, Zola, « J'accuse »).</li>\n</ul>\n<div class=\"tip\"><b>L'apologue</b> séduit puis fait réfléchir : « instruire en divertissant » (Horace). Son exemple est <b>efficace</b> s'il est concret, et <b>critique</b> s'il dénonce (fables, <i>Candide</i>, <i>1984</i>).</div>\n\n<h3>3. Renforcer et affaiblir un raisonnement</h3>\n<ul>\n<li><b>Connecteurs logiques</b> : donc, ainsi, parce que, cependant, en revanche, certes… mais ;</li>\n<li><b>Concession</b> : accorder un point pour mieux le retourner (« certes… mais ») ;</li>\n<li><b>Réfutation</b> : exposer la thèse adverse, puis la démonter — indispensable en dissertation ;</li>\n<li><b>Prise en compte du destinataire</b> : questions rhétoriques, « nous » inclusif, ironie complice.</li>\n</ul>\n\n<h3>4. Les arguments douteux : ne pas se laisser manipuler</h3>\n<ul>\n<li><b>Appel à l'émotion</b> seul (sans preuve) ;</li>\n<li><b>Faux argument d'autorité</b> (« tout le monde le dit ») ;</li>\n<li><b>Sophisme</b> : raisonnement faux qui paraît logique ;</li>\n<li><b>Amalgame, généralisation hâtive</b>, <b>biais de confirmation</b>.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser une stratégie argumentative</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un texte raconte l'histoire d'un village prospère détruit par la guerre, et se conclut par : « Voilà pourquoi la paix vaut mieux que toute gloire. »</div><div class=\"etu\"><b>Étape 1 — Thèse et visée</b> : thèse = « la paix vaut mieux que la gloire » ; visée = convaincre <b>et</b> persuader.</div><div class=\"etu\"><b>Étape 2 — Stratégie</b> : argumentation <b>indirecte</b> : le récit (exemplum) fait éprouver la perte avant de conclure logiquement.</div><div class=\"etu\"><b>Étape 3 — Efficacité</b> : l'exemple concret crée l'émotion (persuasion) ; la chute reformule la thèse (conviction).</div><div class=\"etu\"><b>Étape 4 — Nuancer</b> : la conclusion s'appuie sur un seul cas — généralisation hâtive ? Un contre-exemple la fragiliserait.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Un <b>exemple</b> ne prouve pas : il illustre. Ne pas écrire « c'est prouvé par l'exemple de… ».</li>\n<li>Ne pas confondre <b>thèse</b> (idée défendue), <b>argument</b> (raison) et <b>exemple</b> (illustration).</li>\n<li>L'ironie inverse le sens apparent : identifier la <b>thèse réelle</b> derrière l'antiphrase.</li>\n<li>La concession n'est pas une capitulation : « certes… mais » prépare le renversement.</li>\n<li>Convaincre ≠ manipuler : la première respecte la raison du destinataire.</li>\n</ul>\n</div>"

    "cours": "<div class=\"cours-head\"><h2>Le commentaire de texte</h2><span class=\"niv\">1re/Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Ce qu'on attend du commentaire</h3>\n<ul>\n<li>Objectif : <b>expliquer</b> le texte (sens, procédés) et <b>interpréter</b> (enjeux, visée) — jamais le résumer ni le paraphraser ;</li>\n<li>Le commentaire suit une <b>problématique</b> : quelle question ce texte pose-t-il, et comment y répond-il par sa forme ?</li>\n</ul>\n\n<h3>2. La méthode, étape par étape</h3>\n<ol>\n<li><b>Lire plusieurs fois</b> : situer l'extrait (œuvre, moment, contexte) ;</li>\n<li><b>Souligner</b> les procédés (lexique, figures, temps, énonciation, rythme, sonorités) ;</li>\n<li><b>Dégager les mouvements</b> du texte (2-3 parties logiques) ;</li>\n<li><b>Formuler la problématique</b> : « En quoi ce texte… / Comment l'auteur… » ;</li>\n<li><b>Construire le plan</b> : chaque partie = un axe de lecture, chaque paragraphe = une idée + procédé + effet ;</li>\n<li><b>Rédiger</b> introduction (auteur, œuvre, situation, problématique, plan), développement, conclusion (bilan + ouverture).</li>\n</ol>\n<div class=\"tip\"><b>La règle d'or du paragraphe</b> : <b>idée → citation → analyse → interprétation</b>. « L'auteur écrit \"…\" : la métaphore / l'anaphore / le lexique de… produit l'effet de…, ce qui suggère que… »</div>\n\n<h3>3. Les outils d'analyse mobilisables</h3>\n<ul>\n<li><b>Lexique</b> : champs lexicaux, connotations, registres ;</li>\n<li><b>Syntaxe</b> : longueur des phrases, subordination, ponctuation expressive ;</li>\n<li><b>Figures de style</b> : toujours nommées puis <b>interprétées</b> ;</li>\n<li><b>Énonciation</b> : pronoms, discours (direct/indirect/indirect libre) ;</li>\n<li><b>Prosodie</b> (poésie) : mètre, rimes, enjambements, sonorités.</li>\n</ul>\n\n<h3>4. Les erreurs qui coûtent cher</h3>\n<ul>\n<li>La paraphrase (raconter le texte) et le catalogue de figures sans interprétation ;</li>\n<li>Plan « ligne par ligne » : le plan doit être <b>analytique</b> (axes de lecture), pas linéaire (sauf consigne) ;</li>\n<li>Oublier la <b>conclusion</b> ou introduire des idées nouvelles en conclusion.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — construire un axe de lecture</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un extrait de roman décrit un orage au moment où le héros apprend une trahison. Construire un axe sur le décor.</div><div class=\"etu\"><b>Étape 1 — Formuler l'idée</b> : « Le décor de l'orage traduit le bouleversement intérieur du personnage. »</div><div class=\"etu\"><b>Étape 2 — Trouver les preuves</b> : lexique de la violence (« éclatement », « fracas »), personnification du vent, rythme saccadé (phrases brèves).</div><div class=\"etu\"><b>Étape 3 — Analyser</b> : chaque procédé est relié à l'effet : le fracas extérieur figure la rupture intérieure.</div><div class=\"etu\"><b>Étape 4 — Interpréter</b> : le paysage devient <b>miroir psychologique</b> (pathétique) : nature et émotion fusionnent — dimension romantique.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Ne jamais citer sans analyser, ni analyser sans citer.</li>\n<li>« Le lecteur est triste » : toujours justifier <b>où</b> dans le texte l'effet se produit.</li>\n<li>Le plan ne reprend pas l'ordre du texte : il organise des <b>idées</b>.</li>\n<li>Bannir « on remarque que » et « le texte parle de » : préférer des verbes d'analyse (suggérer, traduire, souligner).</li>\n<li>La problématique n'est pas un thème : c'est une <b>question</b> à laquelle le texte répond.</li>\n</ul>\n</div>"

    "cours": "<div class=\"cours-head\"><h2>La dissertation</h2><span class=\"niv\">1re/Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Ce qu'est une dissertation</h3>\n<ul>\n<li>Un <b>raisonnement organisé</b> qui répond à une question littéraire (souvent sur un genre, un thème, le rôle de la littérature) ;</li>\n<li>Elle exige : <b>comprendre le sujet</b>, bâtir une <b>problématique</b>, argumenter en <b>3 parties</b> équilibrées, illustrer par des <b>exemples précis</b> (œuvres, auteurs, citations).</li>\n</ul>\n\n<h3>2. Analyser le sujet</h3>\n<ol>\n<li><b>Délimiter chaque mot</b> : définir les termes (souvent des notions : « engagement », « vérité », « héros ») ;</li>\n<li><b>Repérer la consigne</b> : interroger le présupposé du sujet (« Le roman doit-il… ? » suppose qu'il le fait) ;</li>\n<li><b>Chercher les paradoxes</b> : un bon sujet admet des réponses opposées → c'est la matière de la problématisation.</li>\n</ol>\n\n<h3>3. La problématique et le plan</h3>\n<ul>\n<li>La <b>problématique</b> reformule la tension du sujet en une question claire ;</li>\n<li>Plan <b>dialectique</b> : thèse → antithèse → synthèse (classique pour un sujet contradictoire) ;</li>\n<li>Plan <b>analytique</b> : examiner le sujet sous 3 angles (ex. : causes, manifestations, limites) ;</li>\n<li>Chaque partie = 2-3 paragraphes ; chaque paragraphe = <b>un argument</b> + un exemple développé + une transition logique.</li>\n</ul>\n<div class=\"tip\"><b>Le paragraphe type</b> : 1) affirmer l'argument (une phrase) ; 2) expliquer le raisonnement ; 3) illustrer par une œuvre/un extrait précis (2-4 lignes) ; 4) conclure sur l'apport au débat. Un exemple <b>développé</b> vaut mieux que cinq exemples cités.</div>\n\n<h3>4. Introduction et conclusion</h3>\n<ul>\n<li><b>Introduction</b> (en entonnoir) : accroche (citation, actualité) → analyse du sujet → problématique → annonce du plan ;</li>\n<li><b>Conclusion</b> : bilan (réponse nette à la problématique) + ouverture (autre œuvre, autre genre, prolongement).</li>\n</ul>\n\n<h3>5. Les références : comment les acquérir</h3>\n<ul>\n<li>Pour chaque notion : 3-4 œuvres « banques d'exemples » (romans, pièces, recueils, essais) bien connues ;</li>\n<li>Noter auteurs, dates, intrigues courtes, citations courtes, critiques (titres d'articles) ;</li>\n<li>Varier les époques et les genres : un sujet sur le roman n'attend pas seulement des exemples du XIXe siècle.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — problématiser un sujet</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « La littérature peut-elle changer le monde ? »</div><div class=\"etu\"><b>Étape 1 — Analyser</b> : « littérature » (tous genres ?), « changer » (faire agir ? transformer les mentalités ?), « monde » (société ? lecteur ?).</div><div class=\"etu\"><b>Étape 2 — Tensions</b> : oui — <i>Les Châtiments</i>, <i>J'accuse</i>, <i>1984</i> ; non — la littérature est un art, son action est diffuse, longue, invérifiable.</div><div class=\"etu\"><b>Étape 3 — Problématique</b> : « Si la littérature agit rarement comme une force directe, ne transforme-t-elle pas le monde de l'intérieur, en façonnant le regard et la conscience des lecteurs ? »</div><div class=\"etu\"><b>Étape 4 — Plan</b> : I. La force directe (œuvres engagées) ; II. Ses limites (réception, censure, art) ; III. Le changement par la conscience : lire, c'est déjà voir autrement.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Reprendre le libellé comme problématique : une problématique est une <b>question nouvelle</b>, pas une reformulation.</li>\n<li>Exemples « placés » sans analyse : un exemple doit être <b>exploité</b> (2-4 lignes de développement).</li>\n<li>Plan catalogue (I. Le héros, II. La société, III. La mort) : chaque partie doit <b>avancer</b> dans la réponse.</li>\n<li>Ne jamais « balayer » le sujet : ce que le sujet présuppose doit être discuté.</li>\n<li>Équilibre : 3 parties de tailles comparables ; transitions qui rendent la progression logique visible.</li>\n</ul>\n</div>"

function chapHeadHTML(m){
  return '<div class="chap-head"><span class="chap-title">📝 Français — ' + esc(m.titre) + '</span>' +
    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();
  if (t === 'quiz') {
    var bar = document.getElementById('quiz-chapbar');
    if (currentChap && META_BY_ID[currentChap]) { bar.innerHTML = chapHeadHTML(META_BY_ID[currentChap]); startTraining(META_BY_ID[currentChap].theme); }
    else { bar.innerHTML = ''; state.mode = 'menu'; render(); }
  }
  if (t === 'prog' || t === 'cours') window.scrollTo({top:0});
}
function clearChap(){ currentChap = null; }

function goCours(id){
  currentChap = id;
  showTab('cours');
  window.scrollTo({top:0, behavior:'smooth'});
}
function goCoursList(){ currentChap = null; showTab('cours'); }

function ficheHTML(id, num, open){
  var m = META_BY_ID[id]; var f = FICHE_BY_ID[id];
  return '<details class="fiche" id="fiche-' + id + '"' + (open ? ' open' : '') + '>' +
    '<summary><span class="fiche-num">' + num + '</span> Fiche — ' + esc(m.titre) + ' <span class="niv" style="font-size:.7rem;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-weight:700;margin-left:6px">' + esc(m.niveau) + '</span></summary>' +
    '<div class="fiche-body">' +
    '<div class="fiche-actions"><button class="btn-pdf" onclick="printFiche(\'' + id + '\')">🖨️ Imprimer</button><button class="btn-pdf" onclick="fichePDF(\'' + id + '\')">📄 PDF</button></div>' +
    '<div class="print-title">Fiche synthétique — ' + esc(m.titre) + ' (' + esc(m.niveau) + ')</div>' +
    f +
    '</div></details>';
}

function renderFiches(){
  var z = document.getElementById('fiches-zone'); var h = '';
  if (currentChap && FICHE_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += ficheHTML(currentChap, 1, true);
  } else {
    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
    var i = 1;
    FICHES_DATA.forEach(function(f){ h += ficheHTML(f.id, i); i++; });
  }
  z.innerHTML = h;
}

function pdfDownload(pdfStr, filename){

  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){

var PG_MATIERE = 'francais';

function pgSave(q, ok){

    if (!d[t]) d[t] = { n: 0, q: {} };
    d[t].n = QUESTIONS.filter(function(x){ return x.t === t; }).length;
    if (!d[t].q) d[t].q = {};

  for (var i = 0; i < COURS_META.length; i++){ if (COURS_META[i].theme === theme){ currentChap = COURS_META[i].id; break; } }
