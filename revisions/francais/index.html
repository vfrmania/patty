{"t": "La poésie : du lyrisme à l'engagement (2de/1re)", "q": "Le sonnet classique comprend :", "c": ["un quatrain unique", "trois strophes", "des vers libres", "deux quatrains + deux tercets"], "a": 3, "e": "Forme fixe : 2 quatrains (rimes ABBA ABBA) + 2 tercets (CCD EDE ou EED) : 14 vers.", "d": "<b>Deux quatrains + deux tercets</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique du sonnet (depuis Pétrarque, la Pléiade) : 14 vers (décasyllabes puis alexandrins) : 2 quatrains qui posent (ABBA ABBA : l'attente, la question) + 2 tercets qui RETOURNENT la situation (CCD EDE : la chute, le twist) : le sonnet est une MACHINE À SURPRISE (« Demain, dès l'aube » de Hugo : la fin révèle le deuil). Piège : le sonnet « moderne » (Baudelaire : « Charles Baudelaire » mallarméen libéré) s'est affranchi des rimes mais garde 14 vers et l'esprit de la CHUTE : reconnaître la forme = anticiper l'effet final.</div>"},
{"t": "La poésie : du lyrisme à l'engagement (2de/1re)", "q": "Un poème en vers libres se caractérise par :", "c": ["14 vers", "l'absence de règle fixe de mètre et de rime (le rythme naît de l'écriture)", "des strophes égales", "des rimes obligatoires"], "a": 1, "e": "Vers libérés des comptages : le poète invente son rythme (versets de Whitman, poésie contemporaine).", "d": "<b>Pas de règle fixe</b> : le rythme devient création.<div class='ex-detail'><u>Exemple rédigé</u> : depuis la fin du XIXe (Rimbaud, les Illuminations : « Je est un autre » en versets), le vers libre ABANDONNE le comptage et la rime obligatoires : le rythme naît des répétitions, des enjambements, de la respiration du texte : Cendrars (« La Prose du Transsibérien ») déroule son poème comme un voyage sans mesure fixe. Piège : « libre » ne veut pas dire « n'importe quoi » : chaque choix de coupe est SIGNIFIANT : analyser un poème en vers libres = relever ce qui REMPLACE la musique classique (anaphores, échos sonores, typographie).</div>"},
{"t": "La poésie : du lyrisme à l'engagement (2de/1re)", "q": "La césure d'un alexandrin se place :", "c": ["après la 12e syllabe", "nulle part", "au milieu du vers (après la 6e syllabe)", "au début"], "a": 2, "e": "Pause rythmique à l'hémistiche : deux demi-vers de 6 syllabes.", "d": "<b>Au milieu du vers (6e syllabe)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le battement binaire de l'alexandrin classique : « Et je la vois // la belle créature » : la pause médiane (césure) crée DEUX hémistiches : souvent symétriques, parfois volontairement DISYMÉTRIQUES (enjambement de la césure : effet de rupture : Hugo : « Je suis venu trop tard… » : la césure brisée SIGNIFIE le désordre). Piège : la césure n'est pas une simple virgule : c'est une RESPIRATION : au commentaire, l'étudier = entendre le vers comme une MUSIQUE : 6//6 (équilibre) ou décalée (tension).</div>"},
{"t": "La poésie : du lyrisme à l'engagement (2de/1re)", "q": "Pourquoi les poètes de la Résistance choisissaient-ils la poésie plutôt que le discours ?", "c": ["Pour faire plus long", "Pour respecter une tradition administrative", "Parce que la prose était interdite", "Parce que le poème est court, mémorisable, échappe à la censure et circule"], "a": 3, "e": "Forme brève + images + mémoire : le poème devient tract, mot d'ordre, consolateur.", "d": "<b>Brièveté + mémoire + clandestinité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les conditions de 1940-44 : papier rare, censure, répression ⟹ le poème court (apprendre par cœur, recopier : « Liberté » parachuté en parachute de tracts) : la poésie devient le média clandestin PAR EXCELLENCE. De plus : l'image (rose/réséda d'Aragon) DIT l'indicible (la fraternité des fusillés) sans mots interdits : le sens passe PAR la beauté. Piège : l'engagement n'exige pas la laideur du tract : au contraire, la BEAUTÉ rend le message indestructible (mémorable : la forme au service de la cause).</div>"},
{"t": "La poésie : du lyrisme à l'engagement (2de/1re)", "q": "« Ô temps, suspends ton vol ! » (Lamartine) : le registre et le procédé ?", "c": ["Comique ; antiphrase", "Satirique ; litote", "Didactique ; gradation", "Lyrique ; apostrophe (adresser le temps comme une personne)"], "a": 3, "e": "Le poète S'ADRESSE au temps (Ô + impératif) : apostrophe lyrique (Le Lac).", "d": "<b>Lyrique + apostrophe</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les indices : « Ô » (la grande apostrophe lyrique), l'impératif « suspends » (le moi ordonne à l'univers !), l'exclamation : le registre LYRIQUE (le moi supplie le TEMPS pour sauver le souvenir d'Elvire : Le Lac, 1820 : élégie romantique parfaite). Piège : l'apostrophe est un procédé CONSTANT du lyrisme (s'adresser à la nature, à l'aimé, à Dieu : tout sauf parler AU lecteur) : la repérer + la relier à l'angoisse du temps = la question de bac classique sur « Le Lac ».</div>"},
{"t": "Le théâtre : texte et représentation (2de/1re)", "q": "Les didascalies sont :", "c": ["des indications scéniques (jeux, tons, entrées)", "des actes", "des paroles des personnages", "des rimes"], "a": 0, "e": "« (Il sort furieux) » : indications pour le metteur en scène et le lecteur : jamais prononcées.", "d": "<b>Des indications scéniques</b>.<div class='ex-detail'><u>Exemple rédigé</u> : dans une page de Molière : « DORINE. — (le poussant) Allez, monsieur… » : « (le poussant) » est une didascalie : elle indique le GESTE : l'agacement physique de Dorine : pour le spectateur, ce geste EST JOUÉ (il voit la poussée) : pour le lecteur, il est ÉCRIT : la didascalie est le pont entre le livre et la scène. Piège : les didascalies ne comptent pas dans le TEMPS de parole : elles sont SILENCIEUSES : les analyser = décrire ce que la scène MONTRERA (ton, mouvement, espace) : jamais « le personnage DIT la didascalie ».</div>"},
{"t": "Le théâtre : texte et représentation (2de/1re)", "q": "Le monologue théâtral sert le plus souvent à :", "c": ["exposer une délibération intérieure (le personnage seul délibère)", "annoncer les didascalies", "faire rire la salle", "remplir le temps"], "a": 0, "e": "Seul en scène, le personnage pèse le pour et le contre : la délibération (stances d'Hippolyte, « Être ou ne pas être »).", "d": "<b>Exposer une délibération intérieure</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : personne sur scène ⟹ le personnage se parle (et le public écoute SA pensée) : « Être ou ne pas être » (Hamlet) : le pour (souffrir) et le contre (résister) sont PÉSÉS en direct : au théâtre classique français : les STANCES (Hippolyte dans Phèdre : « Ciel ! de milliers de douleurs… ») : le monologue est un ORGANISME RHÉTORIQUE (arguments, hésitation, décision finale ou impasse). Piège : sincérité ? Le monologue peut être AUTO-PERSUASION (le personnage se ment) : l'analyse doit juger si le personnage est LUCIDE ou aveuglé (Phèdre : « je l'aime » assumé vs discours de justification).</div>"},
{"t": "Le théâtre : texte et représentation (2de/1re)", "q": "La stichomythie est :", "c": ["un acte entier", "un échange de répliques très courtes (dialogue vif, heurté)", "un long monologue", "une didascalie"], "a": 1, "e": "Vers/répliques d'un mot ou deux, en ping-pong : l'affrontement verbal (disputes raciniennes, Horace).", "d": "<b>Un échange de répliques très courtes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'effet : « — Partez ! / — Jamais. / — Il le faut. / — C'est trop tard. » : le ping-pong verbal accélère le conflit : la tension MONTE avec la brièveté (chaque mot est une parade) : très employée dans les scènes de dispute tragique (Britannicus, Phèdre) et de comédie (mariages négociés). Piège : distinguer de la TIRADE (le flux d'UN personnage : l'inverse stylistique) : au bac, relever une stichomythie = montrer que la FORME mime le conflit : le rythme EST le sens.</div>"},
{"t": "Le théâtre : texte et représentation (2de/1re)", "q": "La règle des trois unités (classique) exige :", "c": ["trois tirades", "trois actes, trois scènes, trois personnages", "unité d'action, de temps (24 h), de lieu", "trois décors"], "a": 2, "e": "Une seule intrigue, un jour, un lieu : la densité dramatique (Racine, Molière dans les grandes comédies).", "d": "<b>Action + temps + lieu</b>.<div class='ex-detail'><u>Exemple rédigé</u> : Phèdre de Racine : tout se joue À Trézène, en une journée probable, autour d'UNE crise (l'aveu et ses conséquences) : l'effet : concentration maximale, tensions en chaîne (la DOSE de vraisemblance : les théoriciens classiques : la règle vient d'Aristote mal lu, codifiée par l'abbé d'Aubignac et Boileau : « Qu'en un lieu, qu'en un jour, un seul fait accompli… »). Piège : la règle n'est pas un absolu esthétique : le ROMANTISME la brise (Hugo : prefâce de Cromwell : appel au mélange des genres) : savoir qu'elle est HISTORIQUEment datée (XVIIe) : une question de bac type : « la règle des trois unités est-elle une contrainte ou une force ? ».</div>"},
{"t": "Le théâtre : texte et représentation (2de/1re)", "q": "Deux mises en scène d'une même pièce peuvent :", "c": ["changer le texte des répliques", "supprimer le texte", "proposer des interprétations opposées du même texte", "être identiques"], "a": 2, "e": "Décor, ton, gestuelle, casting : chaque choix est une LECTURE : le texte est une partition, la scène une interprétation.", "d": "<b>Proposer des lectures opposées</b>.<div class='ex-detail'><u>Exemple rédigé</u> : cas d'école : le même Dom Juan : ① une lecture baroque (costumes d'époque, Machiavel séduisant : le libertin brillant) ② une lecture moderne (costumes contemporains : un prédateur social : critique du pouvoir masculin) : le SPECTACLE signe un SENS : c'est l'objet du chef-d'œuvre théâtral : le texte VIT différemment à chaque mise en scène. Piège : la question de bac « le théâtre est-il un texte ou un spectacle ? » appelle la réponse NUANCÉE : la partition ET son interprétation : l'œuvre théâtrale est DOUBLE par nature.</div>"},
{"t": "Le théâtre : texte et représentation (2de/1re)", "q": "Une tirade est :", "c": ["une indication scénique", "une longue réplique d'un seul personnage", "un dialogue rapide", "une réplique d'un mot"], "a": 1, "e": "Le flux de parole d'un personnage (grandes tirades d'Hugo, de Molière) : souvent un morceau de bravoure.", "d": "<b>Une longue réplique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la tirade du « Être ou ne pas être » (Hamlet) ou « Bon appétit, messieurs » (Ruy Blas) : le personnage prend la parole en MAÎTRE : espace sonore, progression rhétorique, crescendo : la tirade est un MOMENT D'ACTEUR (bravoure) et un sommet D'ÉCRITURE (figures, rythmes : anaphores, gradations). Piège : dans une tirade, repérer la CONSTRUCTION (en combien de mouvements ? quel effet final ?) : ne pas la résumer : la SCANDER : l'analyse d'une tirade = suivre sa courbe d'intensité.</div>"},
{"t": "Le théâtre : texte et représentation (2de/1re)", "q": "Au théâtre, l'« exposition » désigne :", "c": ["le monologue final", "les didascalies finales", "la sortie des acteurs", "les premières scènes qui posent l'intrigue, les personnages, l'enjeu"], "a": 3, "e": "Acte I, scènes 1-2 : qui, où, quoi, quel conflit : tout ce que le spectateur doit savoir pour comprendre.", "d": "<b>Les premières scènes (mise en place de l'intrigue)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'exposition d'« Antigone » d'Anouilh : le Prologue présente les personnages (la petite Antigone, l'Arrogant Créon…) comme des marionnettes déjà connues : l'ENJEU est annoncé (la mort annoncée) : l'exposition INFORME et ORIENTE la réception. Astuce d'analyse : au théâtre classique, l'exposition se fait souvent par des PERSONNAGES-CONFIDENTS ou des discussions de valets (les informations tombent naturellement : subtilité de la dramaturgie). Piège : dans une question de bac « le théâtre est-il un genre de la condensation ? » : l'exposition montre l'ÉCONOMIE du théâtre (tout dire VITE, en scène, sans narrateur).</div>"},
{"t": "Le théâtre : texte et représentation (2de/1re)", "q": "Le « quiproquo » au théâtre produit surtout :", "c": ["du comique (les personnages se méprennent, le spectateur savoure)", "du suspense policier", "du tragique", "du lyrisme"], "a": 0, "e": "Le spectateur SAIT, les personnages ignorent : c'est le ressort roi de la comédie (L'Avare, Le Malade imaginaire, Les Fourberies de Scapin).", "d": "<b>Un effet comique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : Valère et Mariane se croient trahis (Le Malade imaginaire… plutôt L'Avare/Les Fourberies : la lettre déguisée) : le public, LUI, a toutes les cartes : le rire naît de la SUPÉRIORITÉ du spectateur (il sait, eux non : c'est le mécanisme de l'ironie dramatique : Racine l'utilise pour le PATHÉTIQUE : le spectateur sait qu'Hippolyte va mourir). Piège : le même procédé (savoir du spectateur) produit comique OU pathétique : l'effet dépend du TON de l'œuvre : identifier le registre AVANT d'interpréter le procédé.</div>"},
{"t": "Le théâtre : texte et représentation (2de/1re)", "q": "Un personnage « à part » qui commente l'action (le plus souvent dans les pièces modernes) est :", "c": ["une didascalie", "un personnage-narrateur (le Prologue d'Antigone, le « Conférencier »)", "un acte", "un confident muet"], "a": 1, "e": "Anouilh, Giraudoux, Cocteau : le personnage s'adresse AU PUBLIC : il brise le quatrième mur et met à distance théâtrale.", "d": "<b>Un personnage-narrateur</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le Prologue d'« Antigone » (Anouilh, 1944) : il présente les personnages figés (le rideau n'est pas encore « levé » : l'effet Brecht : distanciation : le spectateur est conscient de regarder une PIÈCE (le tragique est annoncé, puis JOUÉ : la répétition tragique est le sujet). Effet moderne : le théâtre ASSUME sa théâtralité : le mur est brisé délibérément. Piège : ce procédé est le CONTRAIRE de l'illusion réaliste (le théâtre classique CACHE sa fabrication : le moderne l'EXPOSE : deux esthétiques : bien les situer dans une copie).</div>"},
{"t": "Le théâtre : texte et représentation (2de/1re)", "q": "Dans une copie de bac, analyser une scène de théâtre exige de :", "c": ["résumer l'intrigue", "compter les répliques", "ne citer que les didascalies", "étudier le texte ET envisager la représentation (tons, gestes, espace)"], "a": 3, "e": "Le théâtre est fait pour être JOUÉ : l'analyse idéale articule les procédés d'écriture et leur POTENTIEL SCÉNIQUE.", "d": "<b>Texte + représentation</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le modèle de développement : « La stichomythie (citation) mime l'affrontement : sur scène, le rythme serré des paroles appelle un face-à-face immobile : deux corps en tension : le jeu peut durcir (regards) ou atténuer (fuite du regard) le conflit. » : l'analyse s'ouvre sur le SPECTACLE possible. Piège : la copie qui reste « littéraire » (figures, tonalités) sans jamais envisager la SCÈNE est incomplète en théâtre : la question du sujet est presque toujours : « texte et représentation » : les deux vivres ensemble : c'est le critère d'excellence du correcteur.</div>"},
{"t": "Le roman et le récit (2de/1re)", "q": "Le narrateur est :", "c": ["l'éditeur", "le personnage principal", "l'auteur du livre", "l'instance qui raconte (≠ auteur)"], "a": 3, "e": "L'auteur est réel ; le narrateur est une CONSTRUCTION textuelle (il peut être un je fictif, un il omniscient…).", "d": "<b>L'instance qui raconte</b> (distincte de l'auteur).<div class='ex-detail'><u>Exemple rédigé</u> : l'erreur éliminatoire : « dans L'Étranger, Camus tue l'Arabe » : NON : le NARRATEUR (Meursault, instance fictive) tire, l'AUTEUR (Camus, personne réelle) invente la scène : la distinction n'est pas pédanterie : elle permet d'analyser les CHOIX narratifs (pourquoi Camus a choisi un narrateur MEURSAULT ? : pour l'effet de distance et de vérité brute). Piège : la confusion auteur/narrateur ruine toute analyse de point de vue : au bac, toujours dire « le narrateur » (sauf si l'auteur signe une préface en son nom).</div>"},
{"t": "Le roman et le récit (2de/1re)", "q": "« Il entra dans la pièce. On ne saura jamais ce qu'il éprouvait. » Focalisation :", "c": ["externe", "interne", "zéro (omnisciente)", "double"], "a": 0, "e": "Le narrateur ne pénètre AUCUNE conscience : il filme de l'extérieur : externe.", "d": "<b>Externe</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test : le narrateur connaît-il les pensées ? ICI NON (refus explicite : « on ne saura jamais ») : il n'a accès qu'aux gestes et paroles : c'est la « caméra » : la main coupée de « La Main » (Maupassant) : les comportements sans l'intérieur : effet de MYSTÈRE et d'objectivité froide (Camus, L'Étranger : le monde opaque). Piège : la focalisation externe n'est pas de la « paresse » : c'est un CHOIX ESTHÉTIQUE : créer l'énigme, l'angoisse ou la neutralité clinique : au bac, toujours relier le mode au SENS.</div>"},
{"t": "Le roman et le récit (2de/1re)", "q": "Le retour en arrière dans un récit s'appelle :", "c": ["un sommaire", "une pause", "une prolepse", "une analepse (flashback)"], "a": 3, "e": "Analepse = retour en arrière ; prolepse = anticipation du futur.", "d": "<b>Une analepse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le roman commence en 1914, puis « Vingt ans plus tôt… » : le récit REMONTE le temps : l'analepse (Genette : Figures III) est presque toujours EXPLICATIVE (révéler l'origine d'un secret, d'une haine) ou thématique (mise en parallèle). À l'inverse, la PROLEPSE anticipe (« Des années plus tard, il apprendrait que… » : effet de fatalité : les chroniques de García Márquez). Piège : au bac, nommer l'anachronie est la MOITIÉ du travail : l'autre moitié = interpréter sa FONCTION (pourquoi ce retour, à cet endroit précis ?).</div>"},
{"t": "Le roman et le récit (2de/1re)", "q": "Une « scène » (durée du récit) correspond à :", "c": ["une description figée", "un résumé rapide d'années", "une anticipation", "un moment raconté à peu près au temps qu'il durerait en réalité (dialogues)"], "a": 3, "e": "Le dialogue rapporté mot à mot : le temps de lecture ≈ le temps de l'action : l'effet « théâtral » du roman.", "d": "<b>Le temps quasi « réel » de l'action</b> (souvent par dialogues).<div class='ex-detail'><u>Exemple rédigé</u> : la gamme des durées : SOMMAIRE (« il vécut dix ans à Paris » : accéléré : des années en une phrase) / SCÈNE (dialogue intégral : minutes en minutes : le temps du roman ralentit au rythme de la vie) / PAUSE (description : le temps de l'action S'ARRÊTE pendant la description : le narrateur prend la parole). L'alternance des durées est un RYTHME : accélérer l'existence, ralentir les moments décisifs (les scènes de rencontre amoureuse : Manon Lescaut : l'art du roman). Piège : au bac, relever le passage de sommaire à scène : l'EFFET de ralenti signale presque toujours un MOMENT CAPITAL.</div>"},
{"t": "Le roman et le récit (2de/1re)", "q": "Meursault dans « L'Étranger » est un :", "c": ["narrateur omniscient", "antihéros (personnage central sans qualités héroïques, opaque)", "méchant", "héros épique"], "a": 1, "e": "Il tue, il est opaque, il refuse les grands sentiments : le roman moderne aime les antihéros.", "d": "<b>Un antihéros</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les traits : passivité (« je ne sais pas » répété au procès), indifférence (le lendemain de la mort de sa mère : « j'ai dormi »), absence d'introspection (focalisation… interne mais SELF-OPAQUE : Meursault ne s'analyse pas) : le roman moderne (XXe) remplace le héros balzacien (ambitieux, romanesque) par des êtres ORDINAIRES ou déroutants (Kafka, Sartre, Camus) : l'antihéros interroge le SENS de l'existence (l'absurde). Piège : antihéros ≠ méchant : il n'a rien d'un villain : il DÉCENNTRE l'héroïsme : c'est un déplacement du regard, pas un jugement moral.</div>"},
{"t": "Le roman et le récit (2de/1re)", "q": "Dans une autobiographie en « je », il faut distinguer :", "c": ["le je récitant (qui écrit maintenant) et le je récité (qui a vécu)", "le narrateur et le personnage", "le héros et le méchant", "l'auteur et l'éditeur"], "a": 0, "e": "« Je me souviens du jour où JE perdis mon père » : le premier je écrit, le second était enfant : deux instances.", "d": "<b>Je récitant / je récité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : dans « Les Mots » (Sartre) ou « Enfance » (Sarraute) : le je qui ÉCRIT (adulte, lucide, ironique) raconte le je qui VIVAIT (enfant, naïf) : la distance entre les deux est un EFFET DE SENS (l'adulte juge l'enfant : tendresse, autodérision : Sartre moque « le petit homme » qu'il était) : c'est ce qui distingue l'autobiographie du journal intime (écrit au jour le jour : je = je). Piège : la question de bac « autobiographie : pacte de sincérité » : le double je en est la preuve formelle : savoir le repérer par les temps verbaux (imparfait de l'enfance, présent du jugement).</div>"},
{"t": "Le roman et le récit (2de/1re)", "q": "Le roman « réaliste » produit :", "c": ["un EFFET de réel (choix de détails vraisemblables)", "des documentaires", "la réalité brute", "des mensonges"], "a": 0, "e": "Le réalisme est une ESTHÉTIQUE : sélection de détails plausibles (métiers, argots, topographie : Balzac : « tous les détails vrais ») : pas la réalité elle-même.", "d": "<b>Un effet de réel</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le « détail inutile » (Barthes) : dans « Un cœur simple » de Flaubert : « un vieux piano supportant, sous un baromètre, un tas de boîtes » : le baromètre ne sert RIEN à l'intrigue : il PRouve le réel (l'effet : « c'est vrai ») : le réalisme (Balzac : le décor parisien du Père Goriot : pension Vauquer : cuisine, odeurs, prix des chambres !) construit une VÉRISIMILITUDE minutieuse. Piège : réalisme ≠ réalité : le romancier SÉLECTIONNE et ORGANISE : l'analyse du réalisme = relever les CHOIX documentaires et leur FONCTION (critique sociale : la pension = la France de 1819).</div>"},
{"t": "Le roman et le récit (2de/1re)", "q": "Le « roman épistolaire » se compose :", "c": ["de articles de presse", "de lettres (fiction des correspondances)", "de dialogues théâtraux", "de poèmes"], "a": 1, "e": "Liaisons dangereuses, Lettres persanes : la lettre donne la parole aux personnages, multiplie les points de vue.", "d": "<b>De lettres</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le dispositif : l'intrigue avance par COURRIERS : « Les Liaisons dangereuses » (Laclos) : chaque lettre révèle un point de vue (Valmont cynique, la Présidente tendre : la VÉRITÉ se reconstruit par recoupements : le lecteur est plus savant que chaque personnage) : « Lettres persanes » (Montesquieu) : le regard persan sur Paris : la distance satirique. Piège : au bac, le roman épistolaire pose la question du POINT DE VUE (autant de narrateurs que de correspondants) : un puzzle de subjectivités : jamais un narrateur unique.</div>"},
{"t": "Le roman et le récit (2de/1re)", "q": "Un personnage « rond » (E. M. Forster) est :", "c": ["complexe, capable de surprendre, en évolution", "une silhouette type", "physiquement rondelet", "toujours gentil"], "a": 0, "e": "Le personnage rond (Balzac : Rastignac évoluant) s'oppose au personnage PLAT (type figé : l'avare, le Don Juan).", "d": "<b>Complexe et évolutif</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la distinction de Forster (Aspects of the Novel) : le personnage PLAT : une seule caractéristique, prévisible (Harpagon = l'avarice : il ne surprendra jamais) ; le personnage ROND : contradictions, évolution, capacité de SURPRENDRE (Rastignac : ambitieux puis ému par le Père Goriot : dilemmes : il DÉPASSE son type de jeune ambitieux) : les grands romans multiplient les personnages ronds (le romanesque est dans l'épaisseur psychologique). Piège : « rond » ne juge pas la morale du personnage : un méchant complexe (Vautrin) est ROND : la profondeur ≠ la bonté.</div>"},
{"t": "Le roman et le récit (2de/1re)", "q": "« Il vécut dix ans à Marseille » est un exemple de :", "c": ["sommaire (des années en une phrase)", "pause", "analepse", "scène"], "a": 0, "e": "Le récit ACCÉLÈRE : dix ans en une ligne : sommaire (le contraire de la scène).", "d": "<b>Un sommaire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la fonction : le sommaire EVACUE le temps mort (on ne raconte pas chaque journée) pour RÉSERVER les scènes aux moments décisifs : « il vécut dix ans à Marseille » (sommaire) puis « Ce matin-là, quand elle frappa à la porte… » (scène) : l'alternance sommaire/scène EST le rythme du roman : le lecteur sent instinctivement quand l'histoire « compte » (le récit ralentit). Piège : le sommaire n'est pas de la « triche » : c'est une ÉCONOMIE narrative : au bac, relever les accélérations : elles délimitent les ZONES d'intensité du texte.</div>"},
{"t": "L'argumentation : convaincre, persuader, délibérer (1re/Terminale)", "q": "Un texte qui use d'images fortes, de questions rhétoriques et du registre pathétique cherche surtout à :", "c": ["informer", "délibérer", "convaincre par la logique", "persuader en agissant sur les émotions"], "a": 3, "e": "L'émotion, l'interpellation, l'image : c'est le registre de la persuasion (agir sur le cœur).", "d": "<b>Persuader</b> (agir sur les émotions).<div class='ex-detail'><u>Exemple rédigé</u> : le contraste type : « Imaginez la souffrance de cette mère… comment rester indifférent ? » : l'impératif (imaginez), la question rhétorique (qui force l'adhésion), le lexique émotif (souffrance) : le destinataire est saisi par le CŒUR : c'est la stratégie de l'éloquence (Zola, « J'accuse… ! » : au-delà de la preuve : l'indignation qui emporte). Piège : persuasion ≠ manipulation : la persuasion ASSUME ses effets (art rhétorique reconnu) : au bac, nommer la stratégie + ses indices textuels : jamais seulement « il veut nous convaincre ».</div>"},
{"t": "L'argumentation : convaincre, persuader, délibérer (1re/Terminale)", "q": "Dans un texte argumentatif, la thèse est :", "c": ["la conclusion du texte", "le sujet abordé", "l'exemple le plus long", "l'idée que l'auteur défend"], "a": 3, "e": "Thèse = position défendue ; thème = sujet traité : « le travail » (thème) vs « le travail aliène » (thèse).", "d": "<b>L'idée défendue par l'auteur</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la distinction à connaître : THÈME (le sujet : « l'école ») / THÈSE (la position : « l'école fabrique l'égalité » ou son contraire « l'école reproduit les inégalités ») : deux textes sur le même thème peuvent défendre des thèses OPPOSÉES. Piège : dans les questions de bac (« quelle est la thèse de l'auteur ? »), répondre par le thème (l'école) est la faute la plus fréquente : toujours formuler la thèse par une PROPOSITION complète (sujet + verbe + affirmation) : la thèse est une PHRASE, pas un mot.</div>"},
{"t": "L'argumentation : convaincre, persuader, délibérer (1re/Terminale)", "q": "L'apologue (fable, conte philosophique) relève de :", "c": ["le reportage", "la démonstration pure", "la délibération", "la persuasion par le récit (plaire pour instruire)"], "a": 3, "e": "Le récit séduit, la moralité instruit : le lecteur adhère sans se sentir agressé : persuasion douce.", "d": "<b>De la persuasion par le récit</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : « Le Corbeau et le Renard » : le lecteur RIT du corbeau vaincu, puis la moralité (« tout flatteur vit aux dépens de celui qui l'écoute ») le prend au piège : il a ri… donc il est D'ACCORD : le récit a fait accepter ce qu'un sermon aurait fait refuser (la leçon glisse sans résistance). Piège : la question de bac classique (« l'apologue est-il une forme efficace pour convaincre ? ») : argumenter les DEUX sens (détour séduisant MAIS simplification) : jamais de dogmatisme : la copie NUANCÉE (oui, à condition de…) est la copie qui gagne.</div>"},
{"t": "L'argumentation : convaincre, persuader, délibérer (1re/Terminale)", "q": "« Tous les hommes mentent, puisque Paul ment » est :", "c": ["une délibération", "un raisonnement valide", "une généralisation hâtive (sophisme : un cas ne prouve pas une loi)", "une autorité"], "a": 2, "e": "D'un seul exemple à une loi universelle : le saut est illégitime : sophisme.", "d": "<b>Une généralisation hâtive</b> (sophisme).<div class='ex-detail'><u>Exemple rédigé</u> : l'analyse logique : prémisse (Paul ment) + conclusion TOUTE GÉNÉRALE (tous les hommes) : le passage de l'individuel au général est INVALIDE sans preuve supplémentaire (un échantillon, une loi) : c'est LE sophisme de la vie publique (un cas isolé ⟹ « les jeunes d'aujourd'hui… »). Piège : savoir repérer les sophismes est une compétence de bac (question : « le raisonnement de l'auteur est-il solide ? ») : les nommer : paille (déformer la thèse adverse avant de la battre), ad hominem (attaquer la personne, pas l'idée), faux dilemme (il n'y a que deux options… faussement).</div>"},
{"t": "L'argumentation : convaincre, persuader, délibérer (1re/Terminale)", "q": "Un texte qui présente successivement le pour puis le contre avant de trancher pratique :", "c": ["la narration", "l'ironie", "la délibération (peser le pour et le contre)", "la conviction"], "a": 2, "e": "Délibérer = faire l'inventaire des arguments opposés, puis trancher (Montesquieu feint de délibérer sur l'esclavage).", "d": "<b>La délibération</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mouvement type : « On prétend que… (thèse adverse, exposition sérieuse) / Mais si l'on examine… (réfutation) / Il est donc clair que… (trancher) » : Montesquieu (« De l'esclavage des nègres », Lettres persanes, lettre XXX) pousse la délibération si loin qu'elle devient DÉMONSTRATION PAR L'ABSURDE (il feint de défendre l'esclavage avec des arguments tellement stupides que le lecteur comprend). Piège : la délibération sincère expose les deux camps avec force (l'hésitation est réelle : dilemme) : la délibération RHÉTORIQUE ne fait qu'affaiblir la thèse qu'elle prétend examiner : distinguer les deux dans l'analyse.</div>"},
{"t": "L'argumentation : convaincre, persuader, délibérer (1re/Terminale)", "q": "Le « conseil » (marque du destinataire : « il faut », « vous devez ») révèle souvent :", "c": ["un personnage", "un narrateur", "un argument d'autorité", "un destinataire explicite visé par l'argumentation (lectorat, puissance)"], "a": 3, "e": "L'argumentation a un DESTINATAIRE : les marques de la 2e personne, les impératifs, les conseils le trahissent.", "d": "<b>Un destinataire visé</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'analyse de la situation d'énonciation : QUI parle ? À QUI ? POUR QUOI ? : un texte qui dit « il faut agir » s'adresse à un lecteur capable d'agir (lettre ouverte, tract, discours) : Zola dans « J'accuse… ! » s'adresse AU président de la République (destinataire explicite : «允许 Monsieur le Président ») ET à l'opinion (destinataire réel) : le double destinataire est un ENJEU de l'argumentation engagée. Piège : au bac, ne jamais oublier la question « qui est le destinataire ? » : elle conditionne les stratégies (on ne persuade pas un président comme une foule).</div>"},
{"t": "L'argumentation : convaincre, persuader, délibérer (1re/Terminale)", "q": "L'ironie dans un texte argumentatif sert à :", "c": ["résumer", "faire entendre la thèse par l'antiphrase (dire le contraire)", "citer", "embellir"], "a": 1, "e": "En disant le contraire de ce qu'on pense, l'ironie dénonce (Voltaire : « un généreux roi » pour un tyran).", "d": "<b>Faire entendre la thèse par antiphrase</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique voltairienne : « C'est un génie de la guerre » (pour un boucher) : l'éloge évidemment absurde fait entendre la CONDAMNATION : le lecteur rétablit la vérité en riant : l'ironie EST une argumentation (le rire force l'adhésion : on ne peut pas réfuter en riant) : c'est l'arme de la satire (Candide : « tout est au mieux dans le meilleur des mondes » : la bêtise de la formule est la réfutation). Piège : pour l'analyser, toujours citer l'écart (le dit vs le contexte) : « ironique CAR… » : l'ironie non prouvée n'est pas une analyse.</div>"},
{"t": "L'argumentation : convaincre, persuader, délibérer (1re/Terminale)", "q": "Un argument d'autorité consiste à :", "c": ["raconter une histoire", "citer un dictionnaire sans raison", "énoncer le pour et le contre", "invoquer un expert ou une référence reconnue pour appuyer la thèse"], "a": 3, "e": "« Comme le montre Darwin… » : l'appel à une autorité étaye : efficace si l'autorité est légitime dans le domaine.", "d": "<b>Invoquer une référence reconnue</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le fonctionnement : « Comme l'a montré Freud… » : la preuve est DÉLÉGUÉE à une autorité (le lecteur adhère à la réputation, pas au raisonnement démontré) : efficace SI l'autorité est compétente dans le domaine (Freud pour la psychologie ✓ : Freud pour la météo ✗) : l'abus d'autorité est un SOPHISME (argumentum ad verecundiam). Piège : au bac, repérer les arguments d'autorité dans le corpus : juger de leur PERTINENCE (l'autorité est-elle dans SON domaine ?) : c'est une question d'esprit critique notée.</div>"},
{"t": "L'argumentation : convaincre, persuader, délibérer (1re/Terminale)", "q": "Les connecteurs logiques (donc, en effet, cependant, par conséquent) servent à :", "c": ["articuler le raisonnement (guider le lecteur dans la démonstration)", "rimenter", "compter les arguments", "orner le texte"], "a": 0, "e": "Ils marquent les étapes : cause, conséquence, opposition, addition : le squelette du raisonnement.", "d": "<b>Articuler le raisonnement</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la cartographie : ADDITION (d'abord, ensuite, enfin, de plus) / CAUSE (car, en effet, puisque) / CONSÉQUENCE (donc, par conséquent, ainsi) / OPPOSITION (mais, cependant, toutefois) / ILLUSTRATION (par exemple) / CONCLUSION (en somme, bref) : au bac, surligner les connecteurs d'un texte = reconstituer sa DEMONSTRATION en 2 minutes. Piège : en expression écrite, un paragraphe sans connecteur est un paragraphe sans ARCHITECTURE : le correcteur suit les articulations : en manquer = perdre la moitié de la clarté : les connecteurs sont l'hygiène minimale de l'argumentation.</div>"},
{"t": "L'argumentation : convaincre, persuader, délibérer (1re/Terminale)", "q": "Pour qu'un exemple soit probant dans un paragraphe argumenté, il doit :", "c": ["être long", "être pertinent (illustrer précisément l'argument) et analysé (pas seulement cité)", "venir d'un film", "être imaginaire"], "a": 1, "e": "L'exemple ne prouve pas : il ILLUSTRE : encore faut-il l'EXPLIQUER (relier l'exemple à l'argument : c'est l'analyse qui compte).", "d": "<b>Être pertinent ET analysé</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le paragraphe gagnant : ① idée « la lecture développe l'empathie » ② argument « elle fait vivre d'autres existences » ③ exemple « Les Misérables : le regard de Jean Valjean » ④ ANALYSE « ainsi le lecteur comprend la misère DE L'INTÉRIEUR : l'exemple incarne l'argument » : sans l'étape 4, l'exemple est un ornement : l'analyse fait la preuve. Piège : empiler les exemples sans analyse est la faute type de dissertation (« comme le montre… comme le prouve… » : 5 exemples, zéro pensée) : UN exemple bien analysé vaut mieux que trois cités : c'est la règle d'or du paragraphe.</div>"},
{"t": "Le commentaire de texte (1re/Terminale)", "q": "La paraphrase (raconter le texte sans l'analyser) est :", "c": ["une citation", "obligatoire", "une méthode acceptable", "l'ennemie du commentaire (aucune analyse, aucune note)"], "a": 3, "e": "Répéter le contenu en d'autres mots n'est pas INTERPRÉTER : le correcteur attend procédé + effet.", "d": "<b>L'ennemie du commentaire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cas : « Dans ce passage, le personnage marche et il a peur. » : contenu répété, zéro observation de forme, zéro interprétation : 0 point d'analyse. La correction : « La peur est DITE par la syntaxe : les phrases deviennent courtes, la ponctuation se fait hachée (« Il écouta. Rien. ») : le rythme mime l'angoisse : le lecteur la RESSENT. » : observation + citation + interprétation : c'est la différence entre résumer et commenter. Piège : le test anti-paraphrase : si votre phrase reste VRAIE pour n'importe quel texte effrayant, elle n'analyse RIEN : chaque phrase doit être INÉCHANGEABLE (spécifique à CE texte).</div>"},
{"t": "Le commentaire de texte (1re/Terminale)", "q": "Le triplet gagnant d'un paragraphe de commentaire est :", "c": ["titre, sous-titre, index", "citation, citation, citation", "résumé, avis, note", "procédé repéré, citation, effet de sens"], "a": 3, "e": "« L'accumulation (procédé) de termes violents (citation) crée un effet d'étouffement (effet) » : la boucle complète.", "d": "<b>Procédé + citation + effet</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le modèle : « La métaphore filée du « gouffre » (procédé + citation) transforme l'angoisse en expérience PHYSIQUE de chute (effet de sens) : le lecteur ne comprend pas seulement la peur : il la VIT » : les trois temps rendent l'analyse complète : manquer l'effet = inventaire de procédés (faute type) : manquer le procédé = impression non prouvée (faute symétrique). Piège : l'effet doit être un SENS (ce que le texte produit), pas un sentiment vague du lecteur (« c'est bien écrit » ✗) : « l'effet est que le lecteur comprend que l'attachement va au-delà de la mort » ✓.</div>"},
{"t": "Le commentaire de texte (1re/Terminale)", "q": "Un plan de commentaire organisé par axes doit être construit :", "c": ["sur des idées interprétatives (axe 1 : la dénonciation de la misère)", "sur des procédés (axe 1 : les métaphores)", "sur l'ordre des phrases", "sur les paragraphes du texte"], "a": 0, "e": "Les procédés sont des PREUVES : les axes portent du SENS (interprétation) : plan par idées, paragraphes par procédés.", "d": "<b>Sur des idées</b> (les procédés sont des preuves).<div class='ex-detail'><u>Exemple rédigé</u> : le mauvais plan : « I. Les métaphores II. Les anaphores III. Le lexique » (catalogue sans pensée : le correcteur sent la machine). Le bon plan : « I. Un espace Hostile II. La résistance du héros III. Une allégorie de la condition moderne » : chaque partie DÉFEND une idée d'interprétation, et les procédés en sont les PREUVES (dans chaque paragraphe : métaphores, rythme, lexique…). Piège : l'annonce d'axe doit être une PHRASE INTERPRÉTATIVE (« Comment le texte construit-il l'angoisse ? ») : un titre de procédé n'est pas un axe.</div>"},
{"t": "Le commentaire de texte (1re/Terminale)", "q": "L'introduction d'un commentaire doit comporter :", "c": ["une citation longue", "la biographie complète", "la conclusion", "l'amorce, la présentation (auteur, œuvre, place de l'extrait), la problématique et l'annonce des axes"], "a": 3, "e": "Situer (texte, contexte, place) + problématique (question d'interprétation) + annonce du plan : la carte d'identité de la copie.", "d": "<b>Amorce + présentation + problématique + axes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le squelette : ① amorce (une phrase d'ouverture : l'évocation du romantisme, du thème) ② présentation : « Ce passage de Notre-Dame de Paris, roman de Victor Hugo publié en 1831, présente la première rencontre… » ③ problématique : « Comment ce texte fait-il de la laideur une figure tragique ? » ④ annonce : « Nous verrons d'abord… puis… » : quatre temps, une page maximum. Piège : la problématique doit être une VRAIE question d'interprétation (répondable par le texte), pas une question de fait (« qui parle ? ») : une bonne problématique ORIENTE déjà la copie vers sa réponse.</div>"},
{"t": "Le commentaire de texte (1re/Terminale)", "q": "En commentaire LINÉAIRE (1re, épreuves orales), l'analyse :", "c": ["commence par la fin", "suit l'ordre du texte, phrase après phrase (parcours d'interprétation)", "se limite à la grammaire", "sauter des passages"], "a": 1, "e": "Le linéaire suit le texte : chaque mouvement du passage doit être expliqué dans son ordre (avec la même exigence procédé-effet).", "d": "<b>Suit l'ordre du texte</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la conduite de l'oral : lire le passage ⟶ le « baliser » en 2-4 mouvements (les grandes unités de sens) ⟶ commenter CHAQUE mouvement dans l'ordre (procédés + effets) ⟶ conclure sur l'ensemble : l'examinateur évalue le PARCOURS : rien de bancal (chaque phrase difficile doit être traitée ou « sautée » avec tact : « je passe à la fin du passage »). Piège : le linéaire n'est pas un décousu : les transitions entre mouvements doivent MONTRER la progression (« ce premier moment posait l'espace : le second fait entrer le personnage… ») : la cohérence reste la note reine.</div>"},
{"t": "Le commentaire de texte (1re/Terminale)", "q": "Pour qu'une citation soit efficace dans une copie, elle doit être :", "c": ["longue et complète", "courte, précise, entre guillemets et immédiatement analysée", "en anglais", "mémorisée sans comprendre"], "a": 1, "e": "« ronces », « hulottes » : deux mots suffisent s'ils sont analysés : citer court pour analyser fort.", "d": "<b>Courte, entre guillemets, analysée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la comparaison : ✗ « Le texte dit : « Il marcha longtemps dans la forêt sombre et il entendit des bruits étranges qui glaçaient son sang » » (citation-résumé, aucune analyse). ✓ « Le champ lexical de l'angoisse (« glaçait », « étranges ») envahit la phrase : l'épithète prend en charge l'émotion » : les citations LONGUES paraphrasent : les citations COURTES prouvent. Piège : la citation sans guillemets est une faute (vol de texte) : la citation non analysée est un poids mort : chaque citation doit être immédiatement suivie de son INTERPRÉTATION : c'est la discipline du commentaire.</div>"},
{"t": "Le commentaire de texte (1re/Terminale)", "q": "La problématique d'un commentaire est :", "c": ["une question d'interprétation que le texte permet de résoudre (et que la copie résout)", "le titre du texte", "une question factuelle", "une question d'opinion"], "a": 0, "e": "« Comment ce texte fait-il de X un Y ? » : la question oriente l'analyse et la copie y répond par axes.", "d": "<b>Une question d'interprétation</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test de qualité : la problématique doit être ① RÉPONDABLE par le texte (« Comment l'auteur s'y prend-il pour… ») ② DÉBATTABLE (pas une évidence : « ce texte est-il bien écrit ? » ✗) ③ FÉCONDE (elle engendre les axes : la réponse = le plan) : exemple : « Comment ce sonnet transforme-t-il la cruauté de l'aimée en mythe ? » ⟹ axe 1 (la précision cruelle) / axe 2 (l'amplitude mythologique). Piège : une question de fait (« qui est l'auteur ? ») n'est pas une problématique : l'examen attend une question CENTRALE : tout le commentaire en est la réponse organisée.</div>"},
{"t": "Le commentaire de texte (1re/Terminale)", "q": "La conclusion d'un commentaire doit :", "c": ["recommencer l'introduction", "disparaître", "introduire un nouvel exemple", "faire le bilan des axes et ouvrir (autre texte, autre perspective, résonance moderne)"], "a": 3, "e": "Bilan (réponse à la problématique) + ouverture : la boucle de la copie.", "d": "<b>Bilan + ouverture</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mouvement : ① BILAN : reprendre les axes en une phrase chacun (« L'espace hostile d'abord, puis la résistance du héros… ») ② RÉPONSE : formuler la réponse à la problématique (« ce texte fait de l'angoisse une expérience rythmique ») ③ OUVERTURE : une perspective (une autre œuvre du même auteur : « on retrouvera cette stratégie dans… », une réécriture, une portée moderne : « cette écoute du silence annonce les récits contemporains »). Piège : l'ouverture n'est pas une nouvelle question sans fin : une phrase juste, appuyée sur une CONNAISSANCE (texte de l'auteur, mouvement littéraire) : la conclusion ratée déçoit après une bonne copie : la soigner = signer la copie.</div>"},
{"t": "Le commentaire de texte (1re/Terminale)", "q": "Pour repérer les procédés d'un texte, la bonne première lecture est :", "c": ["une lecture à voix haute uniquement", "une lecture diagonale", "une lecture crayon en main : surligner champs lexicaux, figures, rythmes, marques d'énonciation", "une lecture en cherchant des fautes"], "a": 2, "e": "Surligner, annoter, baliser : le texte devient une carte de ses procédés avant d'être commenté.", "d": "<b>Une lecture crayon en main</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le rituel gagnant : ① première lecture : IMPRESSION générale (une idée d'interprétation floue) ② deuxième lecture : CRAYON : entourer les mots-clés (champs lexicaux en couleurs), souligner les figures, noter en marge les impressions (« rythme qui s'accélère ici ») ③ reconstitution : les annotations en marge DEVIENTENT les axes : le brouillon du plan est déjà dans les marges. Piège : commenter sans avoir annoté = commenter de mémoire (dangereux : les citations approximatives perdent des points) : la méthode est lenta au début, automatique en trois mois : c'est un sport qui s'apprend.</div>"},
{"t": "Le commentaire de texte (1re/Terminale)", "q": "Un « effet de sens » est :", "c": ["un effet sonore", "le titre", "une erreur de grammaire", "ce que le procédé produit comme signification (l'interprétation de la forme)"], "a": 3, "e": "La métaphore du gouffre PRODUIT l'idée de chute intérieure : la forme SIGNIFIE : l'effet de sens est la destination de toute analyse.", "d": "<b>La signification produite par la forme</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne complète : observation (les phrases deviennent nominales : « Il écouta. Rien. ») ⟶ procédé (parataxe, phrases nominales) ⟶ EFFET DE SENS (le temps se fige : l'attente devient physique : le lecteur partage l'immobilité de l'angoisse) : l'effet de sens EST l'analyse : il répond à « pourquoi cette forme et pas une autre ? » Piège : les fausses analyses en « effet » : « l'effet est que c'est bien écrit » (jugement) ou « l'effet est que le personnage a peur » (contenu) : l'effet de sens relie TOUJOURS la forme à l'idée : c'est le pont procédé ⟶ interprétation.</div>"},
{"t": "La dissertation (Terminale)", "q": "La première étape d'une dissertation est :", "c": ["compter les pages", "analyser le sujet terme à terme au brouillon (définitions, enjeu, problématique)", "rédiger l'introduction directement", "apprendre des citations par cœur"], "a": 1, "e": "Définir chaque mot, repérer l'angle d'attaque : un sujet mal analysé = copie hors sujet.", "d": "<b>Analyser le sujet au brouillon</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le rituel : sujet « Un roman doit-il forcément raconter une histoire ? » : ① définir : « roman » (genre narratif, mais historiquement variable), « forcément » (nécessité : définitionnelle ? réception ?), « raconter » ( intrigue ? expérience ?) ② enjeu : le roman moderne peut-il se passer d'intrigue ? ③ problématique : le récit est-il l'essence du genre ou une convention dépassable ? : les DEFINITIONS produisent déjà le plan. Piège : rédiger sans brouillon d'analyse est la voie la plus courte vers le hors-sujet : 15 minutes d'analyse valent 2 points sur 20.</div>"},
{"t": "La dissertation (Terminale)", "q": "Le plan dialectique classique s'organise en :", "c": ["par genres", "thèse / antithèse / synthèse", "chronologie (avant/après)", "trois exemples"], "a": 1, "e": "Oui (arguments pour) / Non (contre) / dépassement (reformuler, proposer une tierce voie) : la structure du débat.", "d": "<b>Thèse / antithèse / synthèse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : sujet : « la littérature est-elle utile ? » : I. OUI, utile (Hugo : transformer le regard : compassion des Misérables : résonance civique) / II. NON, inutile (l'art pour l'art : Gautier : « tout ce qui est utile est laid » : la beauté sans servitude : la littérature qui SERT devient propagande) / III. DÉPASSEMENT : l'utilité n'est pas de l'ordre de l'efficacité : la littérature est « utile » comme une OXYGÈNE (elle fait exister autrement : Proust : « la vraie vie ») : la copie doit trancher avec NUANCE, pas additionner les deux premiers blocs. Piège : la synthèse qui répète I et II sans DÉPLACER la question perd sa valeur : dépasser = reformuler le concept (qu'est-ce qu'« utile » ?).</div>"},
{"t": "La dissertation (Terminale)", "q": "Un bon exemple dans une dissertation de français est :", "c": ["pris dans une série télévisée", "sans analyse", "vague (« beaucoup d'auteurs l'ont dit »)", "précis et littéraire (auteur, œuvre, scène analysée)"], "a": 3, "e": "« Dans Tel roman, l'auteur montre la scène de… » : l'exemple littéraire précis, immédiatement analysé.", "d": "<b>Précis et littéraire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le paragraphe gagnant : idée (la littérature fait éprouver ce que le concept ne peut pas) + exemple précis (« Les Misérables : le vol du pain par Jean Valjean : la misère est vécue DE L'INTÉRIEUR ») + analyse (« l'utilité est indirecte : le roman change le REGARD, et le regard change les lois ») : la précision (auteur + œuvre + moment) fait la PREUVE. Piège : les exemples flous (« de nombreux romans… » : aucun ne prouve) ou extra-littéraires (les séries : acceptables en appui, jamais en référence principale au bac de français) : l'exemple est un TEMOIN : on ne convoque pas un témoin anonyme.</div>"},
{"t": "La dissertation (Terminale)", "q": "La problématique d'une dissertation sert à :", "c": ["citer un auteur", "formuler la tension du sujet que la copie va résoudre (le fil directeur)", "remplacer le plan", "allonger l'introduction"], "a": 1, "e": "Elle EST la question centrale : chaque partie y répond partiellement, la conclusion y répond globalement.", "d": "<b>Le fil directeur de la copie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le fonctionnement : sujet « Un roman doit-il forcément raconter une histoire ? » ⟹ problématique : « Le récit est-il l'essence du genre ou une convention dépassable ? » : I. répond « essence » (roman classique : la matrice narrative) / II. répond « convention » (Nouveau Roman : la description, le fragment) / III. répond « les deux, si l'on élargit « raconter » » : la problématique ORGANISE la copie : sans elle, le plan est un rapprochement fortuit d'exemples. Piège : la problématique n'est pas une question RHÉTORIQUE ni une question de fait : elle doit être une TENSION (deux lectures possibles) que la copie démêle : c'est ce qui distingue une dissertation d'un catalogage d'opinions.</div>"},
{"t": "La dissertation (Terminale)", "q": "Le hors-sujet est :", "c": ["interdit seulement en philo", "une faute mineure", "un style", "la faute fatale (la copie perd l'essentiel de sa valeur)"], "a": 3, "e": "Ne pas traiter les mots du sujet = répondre à une autre question : le correcteur ne peut noter ce qui n'est pas demandé.", "d": "<b>La faute fatale</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le scénario type : sujet « le roman doit-il raconter une histoire ? » : la copie développe 4 pages sur « l'histoire des romans » (l'évolution du genre) : question ratée (on parlait d'INTRIGUE, pas d'évolution) : la note tombe sous la moyenne MÊME si le contenu est bon (il est « bon » pour un autre sujet). L'assurance : RELIRE le sujet avant chaque partie (une phrase au brouillon : « je suis bien en train de traiter «  forcément  » ? ») : reprendre les MOTS du sujet dans les transitions (« si le récit semble nécessaire, on l'a dit : reste à savoir si cette nécessité tient au genre… ») : montrer qu'on tient le fil = sécuriser la note.</div>"},
{"t": "La dissertation (Terminale)", "q": "La synthèse (III) d'un plan dialectique doit :", "c": ["introduire de nouveaux exemples non exploités", "répéter les deux premières parties", "excuser la copie", "reformuler la question avec de nouveaux concepts et proposer un dépassement"], "a": 3, "e": "Déplacer la question (redéfinir un terme, proposer une tierce lecture) : c'est là que la PENSÉE personnelle s'affirme.", "d": "<b>Reformuler et dépasser</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le geste intellectuel : I. la littérature est utile (civique) / II. elle ne doit pas l'être (art pour l'art) / III. : déplacer le mot « utile » : si l'utilité est l'efficacité mesurable, non : si elle est le développement de l'expérience humaine (Proust : « la vraie vie, la vie découverte ») : oui, mais autrement : la synthèse REDÉFINIT et fait tenir les deux premières parties dans une unité supérieure. Piège : la fausse synthèse : « donc on voit que c'est utile ET inutile » (addition molle, zéro pensée) : la vraie synthèse EST une prise de position raffinée : elle donne la note d'excellence.</div>"},
{"t": "La dissertation (Terminale)", "q": "L'introduction d'une dissertation comprend :", "c": ["amorce, analyse du sujet, problématique, annonce du plan", "la conclusion", "l'annonce du plan seulement", "les citations de toutes les œuvres"], "a": 0, "e": "Les quatre temps canoniques : entrer dans le sujet (amorce), le circonscrire (définitions), le problématiser, annoncer la route.", "d": "<b>Amorce + analyse + problématique + plan</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le squelette : ① amorce : « Depuis Platon chassant les poètes de sa République, la question de l'utilité de la littérature ne cesse de se poser » (une phrase d'entrée en matière : large mais pas hors-sujet) ② analyse : « on entendra par «  littérature  »… par « utile »… » (circonscrire les termes) ③ problématique ④ annonce : « Nous verrons d'abord… ensuite… enfin… » : une page : jamais de citation-percutante-qui-tombe-du-ciel sans lien. Piège : l'amorce passe-partout (« de tout temps, les hommes… ») est désormais mal vue : une amorce PRÉCISE (une œuvre, une date, un paradoxe historique) signale une culture maîtrisée dès la première phrase.</div>"},
{"t": "La dissertation (Terminale)", "q": "Un paragraphe de dissertation construit associe dans l'ordre :", "c": ["citation, opinion, note", "idée, argument, exemple littéraire, analyse (boucle)", "exemple, exemple, exemple", "titre, sous-titre, résumé"], "a": 1, "e": "L'idée ouvre, l'argument soutient, l'exemple prouve, l'analyse referme : c'est la brique unique de la copie.", "d": "<b>Idée / argument / exemple / analyse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le paragraphe modélisé : « Par ailleurs, la littérature fait éprouver ce que le raisonnement ne peut pas démontrer (IDÉE) : le récit crée une expérience sensible de la misère (ARGUMENT) : dans Les Misérables, le vol du pain par Jean Valjean fait vivre la misère DE L'INTÉRIEUR (EXEMPLE) : ainsi le roman ne démontre pas la misère, il la fait RESSENTIR : l'utilité de la littérature est de transformer le regard avant les lois (ANALYSE-BOUCLE) » : le paragraphe referme sur lui-même, prêt pour le suivant (transition). Piège : omettre l'analyse (l'exemple pend : catalogue) ou l'argument (l'exemple flotte : impressionnisme) : la STRUCTURE est un réflexe : elle s'automatise en s'entraînant sur trois sujets.</div>"},
{"t": "La dissertation (Terminale)", "q": "Les transitions entre parties doivent :", "c": ["disparaître", "utiliser des emojis", "citer le sujet en entier", "bilan de la partie + limite/provocation qui ouvre la suivante"], "a": 3, "e": "« Si la thèse est solide, elle rencontre pourtant une objection… » : la transition est le PONANT logique : sans elle, la copie est un assemblage.", "d": "<b>Bilan + ouverture</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la formule type : « On l'a vu : le récit paraît la matrice du roman. MAIS cette évidence même mérite d'être interrogée : que font alors les romans sans intrigue, de Dujardin à Robbe-Grillet ? » : deux mouvements : le BILAN (ce qu'on vient d'établir : une phrase) et le DESSOUS (la limite de la thèse : ce qui FORCE à passer à la partie suivante) : la transition est un ARGUMENT déguisé : elle rend le plan NÉCESSAIRE (on ne passe pas à la partie suivante « parce que c'est le plan » mais parce que la pensée Y EST POUSSÉE). Piège : « Maintenant, nous allons voir la deuxième partie » (annonce administrative, zéro logique) : le correcteur lit des transitions : il sait si la copie PENSE ou RECENSE.</div>"},
{"t": "La dissertation (Terminale)", "q": "Pour la culture littéraire en dissertation, il vaut mieux :", "c": ["tout citer de mémoire au hasard", "lire des résumés la veille", "n'utiliser que des exemples contemporains", "maîtriser un nombre raisonnable d'œuvres PRÉCISES (titres, auteurs, scènes) mobilisables sur des sujets variés"], "a": 3, "e": "10-15 œuvres bien connues (lues ou étudiées : Hugo, Camus, Zola, Flaubert, Voltaire, Éluard…) valent mieux que 50 titres vagues.", "d": "<b>Maîtriser un socle d'œuvres précises</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la stratégie : constituer sa « bibliothèque mentale » : pour chaque œuvre : ① l'argument-type qu'elle illustre (l'engagement : Les Châtiments de Hugo : l'absurde : L'Étranger de Camus : le réalisme social : L'Assommoir de Zola) ② UNE scène précise mobilisable (« la mort de Gavroche », « le meurtre sur la plage ») ③ une citation courte : cette précision nourrit TOUT sujet (utile ? la poésie ? le roman ? l'engagement ?) : les mêmes œuvres servent à des sujets DIFFÉRENTS parce que l'analyse les adapte. Piège : le bachotage de 50 titres lus en résumé produit des exemples « embrouillés » (confusions d'auteurs, de titres : contre-productif) : mieux vaut un socle SOLIDE réutilisable qu'un catalogage incertain.</div>"},

COURS_META.forEach(function(c){ META_BY_ID[c.id] = c; });
FICHES_DATA.forEach(function(f){ FICHE_BY_ID[f.id] = f.fiche; });

function chapHeadHTML(m){
  return '<div class="chap-head"><span class="chap-title">📝 Français — ' + esc(m.titre) + '</span>' +
    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();
  if (t === 'quiz') {
    var bar = document.getElementById('quiz-chapbar');
    if (currentChap && META_BY_ID[currentChap]) { bar.innerHTML = chapHeadHTML(META_BY_ID[currentChap]); startTraining(META_BY_ID[currentChap].theme); }
    else { bar.innerHTML = ''; state.mode = 'menu'; render(); }
  }
  if (t === 'prog' || t === 'cours') window.scrollTo({top:0});
}
function clearChap(){ currentChap = null; }

function goCours(id){
  currentChap = id;
  showTab('cours');
  window.scrollTo({top:0, behavior:'smooth'});
}
function goCoursList(){ currentChap = null; showTab('cours'); }

function ficheHTML(id, num, open){
  var m = META_BY_ID[id]; var f = FICHE_BY_ID[id];
  return '<details class="fiche" id="fiche-' + id + '"' + (open ? ' open' : '') + '>' +
    '<summary><span class="fiche-num">' + num + '</span> Fiche — ' + esc(m.titre) + ' <span class="niv" style="font-size:.7rem;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-weight:700;margin-left:6px">' + esc(m.niveau) + '</span></summary>' +
    '<div class="fiche-body">' +
    '<div class="fiche-actions"><button class="btn-pdf" onclick="printFiche(\'' + id + '\')">🖨️ Imprimer</button><button class="btn-pdf" onclick="fichePDF(\'' + id + '\')">📄 PDF</button></div>' +
    '<div class="print-title">Fiche synthétique — ' + esc(m.titre) + ' (' + esc(m.niveau) + ')</div>' +
    f +
    '</div></details>';
}

function renderFiches(){
  var z = document.getElementById('fiches-zone'); var h = '';
  if (currentChap && FICHE_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += ficheHTML(currentChap, 1, true);
  } else {
    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
    var i = 1;
    FICHES_DATA.forEach(function(f){ h += ficheHTML(f.id, i); i++; });
  }
  z.innerHTML = h;
}

// ===== Générateur PDF autonome (A4, Helvetica) — aucune dépendance externe =====
var PDF_CP1252 = { 0x2018:0x91, 0x2019:0x92, 0x201A:0x82, 0x201C:0x93, 0x201D:0x94, 0x201E:0x84, 0x2013:0x96, 0x2014:0x97, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x20AC:0x80, 0x0152:0x8C, 0x0153:0x9C, 0x0160:0x8A, 0x0161:0x9A, 0x0178:0x9F, 0x017D:0x8E, 0x017E:0x9E, 0x192:0x83, 0x2C6:0x88, 0x2032:0xB4, 0x2039:0x8B, 0x203A:0x9B, 0x201E2:0 };
function pdfTranslit(s){
  return s.replace(/\u2212|\u2013|\u2014/g, '-').replace(/[\u2032\u2019]/g, "'")
    .replace(/\u2192|\u21D2|\u21A6/g, '->').replace(/\u2190/g, '<-')
    .replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u2260/g, '!=').replace(/\u2248/g, '~')
    .replace(/\u2208/g, ' in ').replace(/\u2205/g, 'vide').replace(/\u2286/g, 'incl.')
    .replace(/\u221A/g, 'V').replace(/\u00B7|\u2219|\u22C5/g, '*').replace(/\u2022/g, '-')
    .replace(/\u2124/g, 'Z').replace(/\u211D/g, 'R').replace(/\u2115/g, 'N').replace(/\u2119/g, 'P')
    .replace(/\u00A0/g, ' ').replace(/\u202F|\u2009|\u200B|\uFE0F/g, '')
    .replace(/[\u2460-\u2468]/g, function(c){ return (c.charCodeAt(0) - 0x2460 + 1) + ')'; })
    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
}
function pdfEnc(s){
  var out = '';
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }
    else if (PDF_CP1252[c] !== undefined) b = PDF_CP1252[c];
    if (b !== null && b !== undefined) out += String.fromCharCode(b);
  }
  return out;
}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
var PDF_INLINE = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, SMALL:1, SUB:1, SUP:1, A:1, CODE:1, ABBR:1 };
function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';
    } else if (c.nodeType === 1){
      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }
      else if (g === 'B' || g === 'STRONG') pdfSegs(c, true, out);
      else pdfSegs(c, bold, out);
    }
  }
}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'li') segs = [{ t: '- ', b: bold || false }].concat(segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;
  function walk(n){
    for (var c = n.firstChild; c; c = c.nextSibling){
      if (c.nodeType === 3){
        var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;
        var cl = ' ' + (c.className || '') + ' ';
        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }
        emitP();
        if (/^H[1-6]$/.test(g)) emitBlock('h', c, indent);
        else if (g === 'LI') emitBlock('li', c, indent + 16);
        else if (g === 'UL' || g === 'OL') {
          for (var li = c.firstChild; li; li = li.nextSibling){
            if (li.nodeType === 1 && li.tagName === 'LI') { emitBlock('li', li, indent + 16); walk(li); }
          }
        }
        else if (g === 'TABLE' || g === 'THEAD' || g === 'TBODY'){
          for (var tr = c.firstChild; tr; tr = tr.nextSibling){
            if (tr.nodeType !== 1) continue;
            if (tr.tagName === 'TR'){
              var cells = [];
              for (var td = tr.firstChild; td; td = td.nextSibling){
                if (td.nodeType === 1 && (td.tagName === 'TD' || td.tagName === 'TH')){
                  var cs = []; pdfSegs(td, td.tagName === 'TH', cs);
                  cells.push(cs.map(function(x){ return x.t; }).join('').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
                }
              }
              var line = cells.join('   |   ');
              if (line.replace(/\s/g, '') !== '') blocks.push({ type: 'p', segs: [{ t: line, b: false }], indent: indent + 8 });
            } else if (tr.tagName === 'THEAD' || tr.tagName === 'TBODY') walk(tr);
          }
        }
        else if (g === 'P') { emitBlock('p', c, indent); }
        else { var keep = indent; walk(c); indent = keep; }
      }
    }
    emitP();
  }
  walk(root);
  return blocks;
}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    var isTitle = b.type === 'title';
    var size = isTitle ? 15 : (b.type === 'h' ? 12 : 10.5);
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [];
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) words.push({ br: true });
        p.split(' ').forEach(function(w){ if (w !== '') words.push({ w: w, b: s.b }); });
        if (pi < parts.length - 1) {} else { words.push({ sp: true, b: s.b }); }
      });
    });
    var cur = [], len = 0;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, gap: isTitle ? 0 : (b.type === 'h' ? 7 : 4) }); cur = []; len = 0; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      if (wd.sp) { continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
    if (isTitle) lines.push({ rule: true });
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var pages = [], cur = [], y = TOP;
  lines.forEach(function(ln){
    if (ln.rule){
      if (y - 14 < M) { pages.push(cur); cur = []; y = TOP; }
      y -= 12;
      cur.push('0.29 0.27 0.9 RG 1.5 w ' + M + ' ' + y.toFixed(2) + ' m ' + (W - M) + ' ' + y.toFixed(2) + ' l S\n0 0 0 RG 1 w');
      y -= 8;
      return;
    }
    var lh = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh < M) { pages.push(cur); cur = []; y = TOP; }
    y -= (ln.gap || 0);
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      var enc = pdfEnc(pdfTranslit(s.t));
      if (!enc) return;
      cur.push('BT 1 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Tm /F' + (s.b ? 2 : 1) + ' ' + ln.size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
      x += 0.52 * ln.size * enc.length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
</script>
</body>
</html>
