{"t": "Les classes de mots (6e/5e)", "q": "Dans « Ils pensent qu'il viendra », « qu' » est :", "c": ["une conjonction (que + il viendra)", "une préposition", "un adverbe", "un pronom relatif"], "a": 0, "e": "« Que » introduit ici une proposition subordonnée CONJONCTIVE : conjonction de subordination.", "d": "<b>Une conjonction</b> de subordination.<div class='ex-detail'><u>Exemple rédigé</u> : le test : « qu' » introduit un VERBE CONJUGUÉ avec son propre sujet (« il viendra ») : c'est une conjonction, qui relie la phrase « ils pensent » à « il viendra ». Comparez : « le livre qu'il lit » (« qu' » = pronom relatif, il représente « le livre » et l'antécédent existe). Piège : deux « que » à distinguer : conjonction (penser QUE) / relatif (le livre QUE je lis) : si on peut remplacer par « lequel », c'est un relatif.</div>"},
{"t": "Les fonctions dans la phrase (6e/5e)", "q": "Dans « Les élèves écoutent la leçon », « la leçon » est :", "c": ["sujet", "C.O.I.", "attribut", "C.O.D."], "a": 3, "e": "Ils écoutent QUOI ? la leçon : sans préposition : C.O.D.", "d": "<b>C.O.D.</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la question magique : « écoutent quoi ? » ⟶ « la leçon », sans préposition entre le verbe et le groupe : c'est un C.O.D. Test complémentaire : passer à la forme passive le fait devenir sujet (« la leçon est écoutée par les élèves ») : le COD devient sujet au passif. Piège : ne pas confondre avec le sujet : le sujet, ce sont les élèves : c'est avec EUX que « écoutent » s'accorde.</div>"},
{"t": "Les fonctions dans la phrase (6e/5e)", "q": "Dans « Elle parle à son frère », « à son frère » est :", "c": ["sujet", "C.O.D.", "C.O.I.", "attribut"], "a": 2, "e": "Parle À QUI ? avec la préposition « à » : C.O.I.", "d": "<b>C.O.I.</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la présence de la préposition change tout : « à son frère » est introduit par « à » : complément d'objet INDIRECT (on ne peut pas dire « elle parle son frère »). Autres verbes à COI : téléphoner à, penser à, ressembler à, se souvenir de. Piège : à la forme passive, un COI NE DEVIENT PAS sujet (« *son frère est parlé » est impossible) : seul le COD le peut.</div>"},
{"t": "Les fonctions dans la phrase (6e/5e)", "q": "« Les fleurs semblent fraîches » : « fraîches » est :", "c": ["attribut du sujet (accord avec fleurs)", "épithète", "C.O.I.", "C.O.D."], "a": 0, "e": "Après « sembler », il qualifie le sujet et s'accorde avec lui.", "d": "<b>Attribut du sujet</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test : remplacer « semblent » par « sont » : « les fleurs SONT fraîches » : le mot qualifie le SUJET : attribut : c'est pour ça que « fraîches » prend le marque du pluriel et du féminin (accord avec « fleurs »). Piège : si on écrivait « on trouve ces fleurs fraîches », « fraîches » deviendrait attribut du COD (accord avec « ces fleurs ») : la fonction d'attribut se repère au verbe qui la commande.</div>"},
{"t": "Les fonctions dans la phrase (6e/5e)", "q": "Dans « Hier, nous avons visité le musée », « Hier » est :", "c": ["sujet", "complément circonstanciel de temps", "C.O.D.", "attribut"], "a": 1, "e": "QUAND ? : déplacé ou supprimé : circonstanciel.", "d": "<b>Circonstanciel de temps</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les deux tests : ① deplacer (« Nous avons visité le musée hier » : la phrase reste correcte) ② supprimer (la phrase tient toujours) : c'est un complément circonstanciel, qui apporte une précision NON INDISPENSABLE (le musée, lui, reste : c'est le COD). Piège : « Hier » ne peut pas être sujet (ce n'est pas « hier » qui visite !) : un mot en tête de phrase n'est pas automatiquement sujet : TOUJOURS poser « qui est-ce qui + verbe ? ».</div>"},
{"t": "Les fonctions dans la phrase (6e/5e)", "q": "Quel groupe est le SUJET de « Les enfants de la voisine jouent dehors » ?", "c": ["de la voisine", "Les enfants", "la voisine", "dehors"], "a": 1, "e": "Qui est-ce qui jouent ? « Les enfants » (le groupe « de la voisine » complète « enfants »).", "d": "<b>« Les enfants »</b> (tout le groupe : « les enfants de la voisine »).<div class='ex-detail'><u>Exemple rédigé</u> : la méthode : « qui est-ce qui jouent ? ⟶ les enfants » : le sujet est le groupe nominal COMPLET : « de la voisine » est un complément du NOM (il précise « enfants »), pas le sujet. Preuve par l'accord : « jouENT » pluriel (les enfants), pas « joue » : l'accord du verbe suit le NOYAU du groupe sujet. Piège : ne pas s'arrêter au premier mot : chercher le groupe ENTIER jusqu'à la fin.</div>"},
{"t": "Les fonctions dans la phrase (6e/5e)", "q": "Dans « Il se lave », « se » est :", "c": ["C.O.D.", "attribut", "sujet", "pronom réfléchi (il lave LUI-MÊME)"], "a": 3, "e": "Verbe pronominal : le sujet fait l'action sur lui-même.", "d": "<b>Pronom réfléchi</b> (verbe pronominal).<div class='ex-detail'><u>Exemple rédigé</u> : test : « il lave qui ? ⟶ lui-même » : l'action RETOMBE sur le sujet : c'est le sens réfléchi (se laver, se couper, se coiffer). Piège : ce n'est pas un COD ordinaire car il renvoie au sujet ; et attention à l'accord du participe passé : « elle s'est lavée » (réfléchi, accord avec le sujet) vs « elle s'est lavé LES MAINS » (le COD « les mains » est APRÈS le verbe : PAS d'accord : « elle s'est lavé les mains ») : la fonction du pronom décide de l'orthographe.</div>"},
{"t": "Les fonctions dans la phrase (6e/5e)", "q": "« Un livre passionnant » : « passionnant » est :", "c": ["C.O.D.", "attribut", "épithète (il qualifie directement le nom)", "adverbe"], "a": 2, "e": "Placé directement à côté du nom : épithète (les deux grandes fonctions de l'adjectif : épithète et attribut).", "d": "<b>Épithète</b> du nom « livre ».<div class='ex-detail'><u>Exemple rédigé</u> : les deux visages de l'adjectif : ① épithète : COLLÉ au nom, sans verbe intermédiaire (« un livre passionnant », « des fleurs fraîches écloses ») ; ② attribut : RÉLIÉ par un verbe d'état (« ce livre EST passionnant »). Même adjectif, deux fonctions. Piège : l'épithète s'accorde avec SON nom (des livres passionnants) : l'attribut avec SON sujet : dans les deux cas, l'accord suit le mot QUALIFIÉ, jamais le verbe.</div>"},
{"t": "Les fonctions dans la phrase (6e/5e)", "q": "Le complément du nom est introduit par :", "c": ["une préposition (de, à, en…)", "un adverbe", "un verbe", "un sujet"], "a": 0, "e": "« le livre DE maths », « une robe À fleurs » : le complément du nom précise un nom, pas le verbe.", "d": "<b>Une préposition</b>, le plus souvent « de ».<div class='ex-detail'><u>Exemple rédigé</u> : ne pas confondre : « il parle de cinéma » (parle = verbe : « de cinéma » = COI du verbe) vs « un film de cinéma » (« de cinéma » précise le NOM « film » : complément du nom). Le test : si on supprime le verbe, le complément du nom RESTE (« un film » garde « de cinéma » comme précision) ; le COI du verbe disparaît avec lui. Piège : le complément du nom n'est JAMAIS déplaçable : « le livre de maths » ≠ « de maths, le livre ».</div>"},
{"t": "Les fonctions dans la phrase (6e/5e)", "q": "Dans « Tu m'as donné ton adresse », « m' » est :", "c": ["sujet", "épithète", "C.O.D.", "C.O.I. (donner à qui ? à moi)"], "a": 3, "e": "« Donner quelque chose À quelqu'un » : m' = COI (le COD est « ton adresse »).", "d": "<b>C.O.I.</b>.<div class='ex-detail'><u>Exemple rédigé</u> : décomposition : « tu as donné QUOI ? ⟶ ton adresse (C.O.D.) » ; « tu as donné ton adresse À QUI ? ⟶ à moi ⟶ m' (C.O.I.) : le verbe « donner » est un verbe à DOUBLE construction (donner qch à qn). Piège : l'ordre ne décide pas de la fonction : « m' » arrive AVANT le COD mais reste COI : c'est la question posée qui classe, jamais la place.</div>"},
{"t": "Les fonctions dans la phrase (6e/5e)", "q": "Lequel est un complément circonstanciel de CAUSE ?", "c": ["à Paris", "avec joie", "parce qu'il pleuvait", "demain matin"], "a": 2, "e": "POURQUOI ? : la cause explique l'action, comme « parce que » l'indique.", "d": "<b>« parce qu'il pleuvait »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les circonstanciels répondent chacun à une question : OÙ (à Paris : lieu), COMMENT (avec joie : manière), QUAND (demain : temps), POURQUOI (parce que… : cause). « Nous restons parce qu'il pleuvait » : la pluie est la RAISON du séjour : cause. Piège : « avec joie » pourrait être un complément du nom dans « un regard avec joie »… non : ici il modifie le VERBE : le circonstanciel se reconnait à ce qu'il précise L'ACTION (déplaçable), pas un nom.</div>"},
{"t": "Conjugaison : temps et valeurs (6e/5e)", "q": "Dans un récit, l'imparfait sert surtout à :", "c": ["planter le décor (descriptions, habitudes)", "annoncer le futur", "faire avancer l'action", "donner des ordres"], "a": 0, "e": "Description, arrière-plan, habitude : l'imparfait est le temps du décor.", "d": "<b>Le décor</b> : descriptions et habitudes.<div class='ex-detail'><u>Exemple rédigé</u> : « Chaque été, nous allions à la plage. Il faisait chaud. Un jour, une tempête a éclaté. » : « allions, faisait » = imparfait (répétition, décor) ; « a éclaté » = passé composé (événement unique qui change la situation). Piège : l'imparfait n'est pas « moins passé » que le passé composé : il change de NATURE (durée, répétition) : choisir le temps, c'est choisir le point de vue du récit.</div>"},
{"t": "Conjugaison : temps et valeurs (6e/5e)", "q": "« Ils ___ allés au cinéma » :", "c": ["ont", "sont", "seront", "avaient"], "a": 1, "e": "Le verbe « aller » se conjugue avec ÊTRE au passé composé : « ils sont allés ».", "d": "<b>« sont »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les verbes de mouvement et les pronominaux prennent ÊTRE : aller, venir, partir, arriver, naître, mourir, rester, tomber… et TOUS les verbes pronominaux (il s'est levé). Avec être, le participe s'accorde avec le sujet : « ils sont allÉS », « elles sont partIES ». Piège : « marcher » se conjugue avec AVOIR (« ils ont marché ») bien que ce soit un mouvement : la liste être/avoir est à connaître, pas à deviner.</div>"},
{"t": "Conjugaison : temps et valeurs (6e/5e)", "q": "« La Terre tourne autour du Soleil » : présent de :", "c": ["le futur proche", "l'évidence (vérité générale)", "l'action en cours", "l'ordre"], "a": 1, "e": "Vérité scientifique permanente : présent de vérité générale.", "d": "<b>Vérité générale (évidence)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : mêmes emplois : « l'eau bout à 100 °C », « deux et deux font quatre », « les chats chassent la nuit » : le présent « hors du temps » des définitions, des lois, des proverbes : très utilisé dans les introductions de dissertation (« le travail occupe une place centrale dans nos sociétés »). Piège : ce présent n'a rien d'actuel : la phrase resterait vraie hier comme demain : le contexte scientifique est l'indice.</div>"},
{"t": "Conjugaison : temps et valeurs (6e/5e)", "q": "« Je mangerais bien une pizza » : « mangerais » est au :", "c": ["futur simple", "subjonctif", "imparfait", "conditionnel présent"], "a": 3, "e": "Souhait/hypothèse : conditionnel (radical du futur + terminaisons de l'imparfait).", "d": "<b>Conditionnel présent</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le conditionnel exprime le NON-RÉEL : souhait (« je voudrais »), politesse (« pourriez-vous »), hypothèse (« si j'avais le temps, je viendrais »), information non confirmée (« le ministre serait malade »). Astuce de forme : futur « je mangerai » vs conditionnel « je mangerAIS » : l'accent circonflexe est la marque du futur simple, la terminaison -ais celle du conditionnel. Piège : dans une phrase « si + imparfait », le conditionnel s'impose : « si j'avais faim, je mangerais » (jamais « si j'aurais »).</div>"},
{"t": "Conjugaison : temps et valeurs (6e/5e)", "q": "Les fleurs que j'ai cueilli___ :", "c": ["cueillit", "cueillis", "cueillies (accord avec le COD placé avant)", "cueilli"], "a": 2, "e": "Avec avoir, le participe s'accorde avec le COD si celui-ci est placé AVANT le verbe : « que » (= les fleurs) précède.", "d": "<b>« cueillies »</b> : accord avec le COD antéposé.<div class='ex-detail'><u>Exemple rédigé</u> : la règle en deux temps : ① avec AVOIR, pas d'accord par défaut (« j'ai cueilli des fleurs ») ; ② si le COD est AVANT le verbe (pronom relatif « que », pronom personnel), accord : « les fleurs que j'ai cueillies », « je les ai cueillies ». Ordre de recherche : trouver le COD, regarder sa PLACE. Piège : « j'ai cueilli les fleurs que tu m'avais offertes » : deux accords différents dans la même phrase : chacun avec SON COD antéposé.</div>"},
{"t": "Conjugaison : temps et valeurs (6e/5e)", "q": "« Nous ___ partir demain » (action certaine, décidée) :", "c": ["allons (futur proche)", "voudrions", "pourrions", "aimerions"], "a": 0, "e": "« Aller + infinitif » exprime le futur proche et la certitude : « nous allons partir ».", "d": "<b>« allons »</b> : futur proche.<div class='ex-detail'><u>Exemple rédigé</u> : nuance des temps pour l'avenir : futur proche « nous allons partir » (certain, imminent) / futur simple « nous partirons » (prévu) / conditionnel « nous partirions » (hypothétique) / « nous voudrions partir » (souhait). La valeur de certitude décroît au fil de la liste. Piège : l'examen adore ces distinctions : dans une phrase au discours indirect, « demain » peut forcer un futur proche : « il a dit qu'il allait partir le lendemain » : la concordance suit le sens.</div>"},
{"t": "Conjugaison : temps et valeurs (6e/5e)", "q": "Le passé composé se forme avec :", "c": ["un adverbe", "l'imparfait", "auxiliaire être ou avoir + participe passé", "un seul mot"], "a": 2, "e": "« J'ai mangé », « je suis parti » : auxiliaire conjugué au présent + participe passé.", "d": "<b>Auxiliaire (être/avoir) + participe passé</b>.<div class='ex-detail'><u>Exemple rédigé</u> : structure : « il a fini » (auxiliaire avoir au présent + participe fini) ; « elle est tombée » (être + accord au féminin). Le CHOIX de l'auxiliaire décide de l'accord : avec être ⟹ accord avec le sujet ; avec avoir ⟹ accord avec le COD (s'il est antéposé). Piège : participe passé régulier en -é ≠ infinitif en -er : « il a mangé » (participe) vs « il va manger » (infinitif) : l'auxiliaire « avoir » prend un PARTICIPE, la préposition va/venir prennent un INFINITIF.</div>"},
{"t": "Conjugaison : temps et valeurs (6e/5e)", "q": "« Il arrive à l'instant » : « arrive » est un présent :", "c": ["d'ordre", "de passé récent", "conditionnel", "de vérité générale"], "a": 1, "e": "Avec « à l'instant, venir de + infinitif » : le présent peut raconter un passé tout proche.", "d": "<b>De passé récent</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le français dispose d'un système du récent : « il arrive » (présent à valeur de passé récent, avec « à l'instant »), « il vient d'arriver » (passé récent proprement dit : venir de + infinitif), « il a arrive »… non : « il vient d'arriver » et « il a tout juste arrivé » se combinent. Piège : ce présent ressemble à l'actuel, mais le complément « à l'instant » le décale : dans une narration au passé, la concordance le rendrait « il venait d'arriver » : le temps du récit entraîne ses subordonnés.</div>"},
{"t": "Conjugaison : temps et valeurs (6e/5e)", "q": "« Vous fermerez la porte en sortant » : le futur a ici une valeur :", "c": ["de souhait", "d'ordre (poli)", "de description", "de prédiction"], "a": 1, "e": "Futur à valeur d'injonction atténuée : très courant dans les consignes.", "d": "<b>Ordre</b> (politesse du futur).<div class='ex-detail'><u>Exemple rédigé</u> : le même futur sert : prédiction (« il pleuvra demain »), promesse (« je te le rendrai »), ORDRE atténué (« vous voudrez bien patienter », « tu iras te coucher ») : dans les consignes d'exercices aussi (« vous répondrez en cinq lignes »). Piège : ce n'est pas du conditionnel : la forme est celle du futur simple (fermerez, voudrez) : la valeur se lit dans le CONTEXTE (autorité, consigne), la forme dans la TERMINAISON.</div>"},
{"t": "Conjugaison : temps et valeurs (6e/5e)", "q": "« Si j'avais le temps, je ___ plus » :", "c": ["lirais", "lis", "lirai", "lisais"], "a": 0, "e": "Si + imparfait ⟹ conditionnel présent : « je lirais ».", "d": "<b>« lirais »</b> : conditionnel.<div class='ex-detail'><u>Exemple rédigé</u> : le système hypothétique : « si + imparfait, conditionnel présent » (irréel du présent : « si j'avais le temps, je lirais ») ; « si + plus-que-parfait, conditionnel passé » (irréel du passé : « si j'avais eu le temps, j'aurais lu »). Piège étoilé : « si j'aurais » n'existe PAS : après « si », jamais de conditionnel (sauf « si » de politesse : « si vous voudriez »… à éviter au collège) : la faute classique à traquer dans chaque copie.</div>"},
{"t": "Orthographe : pièges et accords (6e/5e)", "q": "« Il ___ chaud » :", "c": ["at", "à", "as", "a"], "a": 3, "e": "On peut dire « il avait chaud » : c'est le verbe avoir, sans accent.", "d": "<b>« a »</b> (verbe avoir).<div class='ex-detail'><u>Exemple rédigé</u> : le test : remplacer par l'imparfait : « il AVAIT chaud » : la phrase tient : c'est le verbe ⟹ « a » sans accent. Comparez : « il va à Paris » (« il va avait Paris » impossible : préposition ⟹ accent). Piège : la confusion se paie sur tous les textes : automatiser le remplacement par « avait » : 2 secondes, zéro faute.</div>"},
{"t": "Orthographe : pièges et accords (6e/5e)", "q": "« des robes vert ___ clair » :", "c": ["e (bleu clair : couleur composée invariable)", "es", "e-s", "ère"], "a": 0, "e": "Couleur composée avec un second nom : invariable : « des robes vert clair ».", "d": "<b>« vert clair »</b> invariable.<div class='ex-detail'><u>Exemple rédigé</u> : la règle : adjectif de couleur simple ⟹ accord (« des robes vertes ») ; couleur composée (deux mots, ou avec un nom comme « turquoise, orange ») ⟹ invariable (« des robes vert clair », « des yeux noisette »). Piège : « des chaussettes rose » reste invariable (rose = nom-fleur) mais « des chaussettes roses » s'accorde (adjectif rose simple) : la double règle s'apprend par les exemples types.</div>"},
{"t": "Orthographe : pièges et accords (6e/5e)", "q": "« Il a ___ la porte » (verbe fermer) :", "c": ["fermé", "fermer", "fermez", "fermant"], "a": 0, "e": "Avec « avoir », on met le participe passé : « il a fermé ».", "d": "<b>« fermé »</b> : participe passé.<div class='ex-detail'><u>Exemple rédigé</u> : le test du verbe du 3e groupe : remplacer « fermer » par « vendre » : « il a VENDU la porte » : on entend la terminaison -u, donc un PARTICIPE : ⟹ « il a fermé ». Comparez : « il va fermer » (« il va vendre » : infinitif après « va ») : la substitution marche pour TOUS les verbes en -er. Piège : « il a fermer la porte » est la faute la plus fréquente des copies : le remplacement par « vendre » la corrige instantanément.</div>"},
{"t": "Orthographe : pièges et accords (6e/5e)", "q": "« Ces fleurs sont à ___ » (possesseur pluriel, une seule chose) :", "c": ["eux", "tous", "leur (une seule chose possédée)", "leurs"], "a": 2, "e": "« à eux » conviendrait aussi, mais « à leur » : chose possédée singulière ⟹ leur sans s.", "d": "<b>« leur »</b> (sans s : une chose possédée).<div class='ex-detail'><u>Exemple rédigé</u> : la règle de « leur(s) » : le S se met selon le NOMBRE DES CHOSES POSSÉDÉES, pas des possesseurs : « ces livres sont à eux ⟹ ces livres sont LEURS » (pluriel de livres) ; « cette maison est à eux ⟹ cette maison est LEUR » (une maison). Piège : « ils ont pris leurs affaires et leur manteau » : chaque nom décide seul : compter les CHOSES, jamais les personnes.</div>"},
{"t": "Orthographe : pièges et accords (6e/5e)", "q": "« ___ il parti ? » (verbe être) :", "c": ["A-ce", "Et-ce", "Es-ce", "Est-ce"], "a": 3, "e": "« Est » = verbe être (avait : « était-il parti ? ») : Est-ce qu'il est parti.", "d": "<b>« Est-ce »</b> : verbe être.<div class='ex-detail'><u>Exemple rédigé</u> : test : « ETait-ce qu'il ETait parti ? » : la substitution « était » confirme le verbe ⟹ « est ». L'autre « et » sert à relier : « pain ET beurre » (test : « et aussi »). Piège : dans la question orale on entend pareil : à l'écrit, seuls les TESTS distinguent : « est-ce que » (être) vs « et ce que » (jamais en français correct : cette suite n'existe pas : si l'oreille hésite, écrire « est-ce que »).</div>"},
{"t": "Orthographe : pièges et accords (6e/5e)", "q": "« Elle ___ perdue sans sa carte » (à elle) :", "c": ["sons", "son", "sont", "sonts"], "a": 1, "e": "« sa carte à elle » : possessif « son » (remplaçable par « le sien ») ; « sont » serait le verbe être.", "d": "<b>« son »</b> (déterminant possessif).<div class='ex-detail'><u>Exemple rédigé</u> : test : « Elle est perdue sans SA carte à elle » : le possessif se vérifie par « à elle » ⟹ « son ». L'homophone « sont » se teste par « étaient » : « elles étaient perdues » vs « leurs cartes SONT là ⟹ ÉTAIENT là ». Piège : la confusion son/sont est la faute la plus signalée des réseaux sociaux : les deux tests (à elle / étaient) la suppriment définitivement.</div>"},
{"t": "Orthographe : pièges et accords (6e/5e)", "q": "« On ___ pas encore mangé » :", "c": ["n'as", "n'a", "at", "a"], "a": 1, "e": "Négation : « on n'a pas » : le premier « n' » de la négation s'ajoute au verbe avoir.", "d": "<b>« n'a »</b> : négation + avoir.<div class='ex-detail'><u>Exemple rédigé</u> : la structure : « on N'A PAS mangé » : négation en deux parties (n'… pas) autour du verbe. Le repère : si « pas/plus/jamais/rien » suit, il faut le « n' » : on ne peut pas dire « on a pas » dans un écrit soigné. Piège : distinguer « on n'a » (négation, 2 sons nasaux distincts : « on-n-a ») de « on a » (affirmation) : le contexte (présence de « pas ») et la prononciation lente entraînent l'oreille.</div>"},
{"t": "Orthographe : pièges et accords (6e/5e)", "q": "« Tous ___ élèves » :", "c": ["cets", "ces", "ses", "ces'"], "a": 1, "e": "« ces » = ceux-là (démonstratif, test : « ces… là ») ; « ses » = à eux (possessif).", "d": "<b>« ces »</b> : démonstratif.<div class='ex-detail'><u>Exemple rédigé</u> : le test : « tous CES élèves-LÀ » (je peux les montrer du doigt : démonstratif) vs « il a oublié SES cahiers » (les cahiers DE LUI : possessif). Les deux s'entendent pareil à l'oral ; à l'écrit, seul le test tranche : ajouter « -là » ⟹ ces ; ajouter « à lui » ⟹ ses. Piège : les dictées adorent alterner les deux dans la même phrase : « ces élèves ont rendu leurs copies » : chaque groupe doit être testé séparément.</div>"},
{"t": "Orthographe : pièges et accords (6e/5e)", "q": "Le verbe s'accorde avec :", "c": ["le COD", "son sujet véritable", "le premier nom de la phrase", "le mot juste avant lui"], "a": 1, "e": "« C'est moi qui AI raison »… non : « c'est moi qui ai » (sujet « qui » = moi) : chercher QUI fait l'action.", "d": "<b>Son sujet véritable</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le cas piège : « La foule des supporters crient »… FAUX : le sujet est « la foule » (singulier) ⟹ « la foule DES SUPPORTERS CRIE » : le complément du nom ne compte pas. Autre classique : « c'est moi qui AI fini » (qui = moi : 1re personne). Piège : l'accord se fait avec le NOYAU du sujet, jamais avec le mot le plus proche : la proximité fait perdre des points, la question « qui est-ce qui ? » en fait gagner.</div>"},
{"t": "Orthographe : pièges et accords (6e/5e)", "q": "« Elle s'est ___ (monter) les escaliers » (verbe pronominal, COD après) :", "c": ["montée", "monter", "monté", "montés"], "a": 2, "e": "« les escaliers » est COD et placé APRÈS : pas d'accord : « elle s'est monté les escaliers »… attention : ici « monter » est intransitif : accord quand même au singulier.", "d": "<b>« monté »</b> : COD après, pas d'accord.<div class='ex-detail'><u>Exemple rédigé</u> : règle des pronominaux : accord du participe avec le COD si antéposé : « elle s'est coupÉ les cheveux » (« les cheveux » = COD APRÈS : pas d'accord) vs « les cheveux QU'elle s'est coupés » (COD « que » AVANT : accord). Piège : la question à poser est TOUJOURS « s'est coupé QUOI ? » : si la réponse suit le verbe : pas d'accord : si elle le précède (que, les) : accord : la règle vaut pour tous les pronominaux.</div>"},
{"t": "La phrase complexe et les subordonnées (4e/3e)", "q": "« Il pleut donc je reste » : « donc » est :", "c": ["une préposition", "une conjonction de coordination", "un subordonnant", "un adverbe de lieu"], "a": 1, "e": "Mais, ou, et, donc, or, ni, car : coordination entre deux propositions égales.", "d": "<b>Conjonction de coordination</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la phrase contient 2 verbes conjugués (pleut, reste) = 2 propositions ; « donc » les relie SANS hiérarchie : coordination (exprimant la conséquence). Comparez : « je reste parce qu'il pleut » (« parce que » = subordonnant : la proposition est ENCHÂSSÉE : subordination). Piège : « donc » existe aussi comme adverbe (« il est donc parti » : déplaçable) : devant un verbe conjugué isolé, c'est un adverbe : entre DEUX propositions, une conjonction.</div>"},
{"t": "La phrase complexe et les subordonnées (4e/3e)", "q": "Combien de propositions dans « Je crois qu'il viendra quand il pourra » ?", "c": ["1", "3", "4", "2"], "a": 1, "e": "3 verbes conjugués (crois, viendra, pourra) : principale + complétive + circonstancielle de temps.", "d": "<b>3 propositions</b>.<div class='ex-detail'><u>Exemple rédigé</u> : comptage : « je crois » (P1), « qu'il viendra » (P2 : complétive, COD de « crois »), « quand il pourra » (P3 : circonstancielle de temps, enchâssée dans P2 !). La règle d'or : UN verbe conjugué = UNE proposition : compter les verbes, dessiner les bulles. Piège : P3 n'est pas au même étage que P2 : l'enchâssement peut s'imbriquer (P1 ⟶ P2 ⟶ P3) : la subordination crée des poupées russes.</div>"},
{"t": "La phrase complexe et les subordonnées (4e/3e)", "q": "« Le livre que je lis » : « que » est :", "c": ["une conjonction", "un pronom relatif (représente « le livre »)", "un adverbe", "une préposition"], "a": 1, "e": "Test : remplacer par « lequel » : « le livre QUE je lis = le livre LEQUEL je lis » : relatif.", "d": "<b>Pronom relatif</b> (antécédent : le livre).<div class='ex-detail'><u>Exemple rédigé</u> : la distinction capitale : « je pense QUE tu viendras » (conjonction : « que » ne représente rien, on ne peut pas dire « pense lequel ») vs « le livre QUE je lis » (relatif : « que » = le livre, COD de « lis »). Conséquence d'accord : « les fleurs que j'ai cueillies » (le relatif antéposé entraîne l'accord du participe) : la classe de « que » décide de l'orthographe de la phrase. Piège : le même petit mot, deux fonctions, deux effets : le test « lequel » tranche en 3 secondes.</div>"},
{"t": "La phrase complexe et les subordonnées (4e/3e)", "q": "« Bien qu'il ___ tard, nous continuons » :", "c": ["soit (subjonctif après bien que)", "est", "sera", "était"], "a": 0, "e": "Concession : bien que + subjonctif : « bien qu'il soit tard ».", "d": "<b>« soit »</b> : subjonctif.<div class='ex-detail'><u>Exemple rédigé</u> : les subordonnants qui exigent le subjonctif : bien que, quoique (concession), pour que, afin que (but), à condition que (condition), avant que… La concession (bien que = « même si ») fait partie de la famille : « bien qu'il soit tard » (subjonctif présent). Piège : écrire « bien qu'il est tard » est la faute classique : après B bien que/quoique, l'indicatif est impossible : c'est un accord grammatical, pas une nuance de style.</div>"},
{"t": "La phrase complexe et les subordonnées (4e/3e)", "q": "« L'élève qui travaille réussit » : « qui travaille » est :", "c": ["une circonstancielle de cause", "une relative (précise « élève »)", "une principale", "une complétive"], "a": 1, "e": "Précise l'antécédent « élève » : subordonnée relative, remplaçable par « travailleur ».", "d": "<b>Une relative</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test de remplacement : « l'élève travailleur réussit » : la relative équivaut à un ADJECTIF : elle précise un nom (antécédent). Autre indice : introduite par qui/que/où/dont, juste après le nom qu'elle complète. Piège : ne pas confondre avec « je sais qui a gagné » (interrogative indirecte : complète « sais », pas un nom) : la relative a TOUJOURS un antécédent nominal.</div>"},
{"t": "La phrase complexe et les subordonnées (4e/3e)", "q": "« La ville dont je parle » : « dont » peut se remplacer par :", "c": ["où", "à laquelle", "de laquelle", "que"], "a": 2, "e": "« dont » = de + quoi : « je parle DE cette ville » : relative complément du nom/préposition « de ».", "d": "<b>« de laquelle »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le réflexe : trouver la construction du verbe : « parler DE quelque chose » ⟹ le relatif est « dont » : « la ville dont je parle = la ville DE LAQUELLE je parle ». Autres emplois : « le livre dont la couverture est déchirée » (complément du nom introduit par de). Piège : « dont » ne remplace JAMAIS un lieu (« la ville où je vais » : « où » = à laquelle) : dont = de, point final.</div>"},
{"t": "La phrase complexe et les subordonnées (4e/3e)", "q": "Subordonner plutôt que juxtaposer permet :", "c": ["d'éviter les conjonctions", "d'écrire plus court", "de supprimer les verbes", "de hiérarchiser les idées (style plus riche)"], "a": 3, "e": "La subordination crée des liens logiques et un style construit : attendu en rédaction.", "d": "<b>Hiérarchiser</b> : le style attendu au brevet et au lycée.<div class='ex-detail'><u>Exemple rédigé</u> : comparez : « Il était tard. J'avais faim. Je suis rentré. » (3 phrases plates, aucun lien) vs « Bien qu'il fût tard et que la faim me tenaillât, je suis rentré » (une phrase, deux concessions, style)! La subordination MANIFESTE la réflexion : cause, but, opposition : l'examinateur note la capacité à construire, pas à aligner : varier juxtaposition/coordination/subordination = la grille d'évaluation de l'expression écrite.</div>"},
{"t": "La phrase complexe et les subordonnées (4e/3e)", "q": "« Quand il vient, nous discutons » : la subordonnée est :", "c": ["concessive", "relative", "complétive", "circonstancielle de temps"], "a": 3, "e": "« Quand » introduit le temps : elle répond à « à quel moment ? ».", "d": "<b>Circonstancielle de temps</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la famille des circonstancielles : quand/lorsque/dès que/pendant que (temps), parce que/puisque (cause), si/pourvu que (condition), pour que/afin que (but), bien que (concession) : chacune répond à sa question (quand ? pourquoi ? à quelle condition ? pour quoi ?). Piège : « quand » ne crée pas une relative (pas d'antécédent nominal) : après « quand », pas de futur dans l'habitude : « quand il vient » (présent de l'habitude), pas « quand il viendra » (sauf événement unique futur : « quand il viendra demain »).</div>"},
{"t": "La phrase complexe et les subordonnées (4e/3e)", "q": "« Je pense que tu as raison » : « que tu as raison » est :", "c": ["une interrogative", "une complétive (COD de « je pense »)", "une relative", "une circonstancielle"], "a": 1, "e": "Elle complète le verbe « penser » (je pense QUOI ?) : proposition subordonnée complétive.", "d": "<b>Une complétive</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test : « je pense quoi ? ⟶ que tu as raison » : la subordonnée joue le rôle de COD du verbe principal : on l'appelle complétive (elle COMPLÈTE le verbe, contrairement à la relative qui complète un NOM). Verbes typiques : penser, croire, dire, espérer, regretter. Piège : au discours indirect, toutes les paroles rapportées deviennent des complétives : « il a dit qu'il viendrait » : c'est le pivot du discours rapporté.</div>"},
{"t": "La phrase complexe et les subordonnées (4e/3e)", "q": "La proposition principale est celle qui :", "c": ["peut exister seule (elle ne dépend d'aucune autre)", "est la plus longue", "commence la phrase", "contient le sujet"], "a": 0, "e": "« Je reste » vit seule ; « parce qu'il pleut » meurt seule : voilà le test.", "d": "<b>Celle qui peut exister seule</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le test d'autonomie : lire chaque proposition isolément : « Nous avons rentré le linge » ✓ (principale) ; « parce que le vent s'est levé » ✗ (elle pend dans le vide : subordonnée). Piège : « principale » ne veut pas dire « en premier » : « Parce qu'il pleut, je reste » : la subordonnée ouvre la phrase, mais la principale reste « je reste » : la POSITION ne définit pas la hiérarchie, la DÉPENDANCE oui.</div>"},
{"t": "Le discours direct, indirect et indirect libre (4e/3e)", "q": "« Je viendrai demain » devient au discours indirect (il a dit…) :", "c": ["viendra le lendemain", "qu'il viendra demain", "qu'il vienne demain", "qu'il viendrait le lendemain"], "a": 3, "e": "Futur ⟹ conditionnel, demain ⟹ le lendemain : concordance des temps.", "d": "<b>« qu'il viendrait le lendemain »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les deux conversions simultanées : ① verbe : après « il a dit » (passé), le futur « viendrai » devient CONDITIONNEL « viendrait » ; ② repère temporel : « demain » (par rapport à la parole) devient « LE LENDEMAIN » (par rapport au récit). Piège : garder « demain » ou « viendra » est la faute double classique : la concordance change le temps ET les mots de liaison : toujours relire les DEUX colonnes de conversion.</div>"},
{"t": "Le discours direct, indirect et indirect libre (4e/3e)", "q": "« Où vas-tu ? » devient au discours indirect :", "c": ["où il ira ?", "où il allait (sans point d'interrogation)", "où il va ?", "où vas-tu"], "a": 1, "e": "Question indirecte : plus de ? ni d'inversion : « il demanda où il allait ».", "d": "<b>« où il allait »</b> (sans ?).<div class='ex-detail'><u>Exemple rédigé</u> : les suppressions obligatoires : guillemets ✗, point d'interrogation ✗, inversion du sujet ✗ : la question devient une simple subordonnée : « Elle lui demanda où il allait. » (le mot interrogatif « où » se CONSERVE). Piège : si la question appelle oui/non, le subordonnant devient « SI » : « Il demanda si elle venait » : « si » du discours indirect n'a rien d'une condition.</div>"},
{"t": "Le discours direct, indirect et indirect libre (4e/3e)", "q": "Le discours direct se reconnaît à :", "c": ["la conjonction que", "l'imparfait", "l'absence de guillemets", "les guillemets (ou tirets) et le verbe introducteur + deux-points"], "a": 3, "e": "« Il a dit : « Viens ! » » : paroles exactes, ponctuation typographique.", "d": "<b>Guillemets + deux-points + paroles exactes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le modèle complet : verbe de parole (dire, demander, crier) + « : » + « guillemets » + paroles au CHOIX du personnage (je, tu, présent, exclamations). Au théâtre : pas de guillemets, des TIRETS avant chaque réplique (le théâtre EST du discours direct intégral). Piège : dans le discours direct, on garde « demain, hier, je » tels quels : AUCUNE conversion : c'est le monde du personnage qui parle.</div>"},
{"t": "Le discours direct, indirect et indirect libre (4e/3e)", "q": "« Elle attendait. Viendrait-il ? Décidément, il se faisait tard. » Ce passage est au :", "c": ["style épistolaire", "discours indirect", "discours direct", "discours indirect libre"], "a": 3, "e": "Question et jugement du personnage SANS verbe introducteur ni guillemets : indirect libre.", "d": "<b>Discours indirect libre</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les indices : « Viendrait-il ? » (le conditionnel interrogatif d'une pensée, sans « elle se demanda si ») ; « Décidément » (adverbe de jugement personnel) : la voix du NARRATEUR (imparfait, 3e personne) porte la PENSÉE du personnage (question, subjectivité). Effet : sans guillemets ni « il pensa que », Flaubert fait entendre l'intériorité : c'est l'outil du roman psychologique (Madame Bovary, Zola). Piège : au lycée, le repérer et le NOMMER vaut des points dans toute analyse de texte narratif.</div>"},
{"t": "Le discours direct, indirect et indirect libre (4e/3e)", "q": "« Viens ici ! » à l'indirect (il lui ordonna…) :", "c": ["de venir là", "viens là", "si elle vient là", "qu'elle vienne là"], "a": 0, "e": "L'ordre devient « de + infinitif » : « il lui ordonna de venir là ».", "d": "<b>« de venir là »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la règle de l'ordre indirect : impératif ⟹ « de + infinitif » : « Viens ! ⟹ il ordonna de venir » ; « Ne pars pas ! ⟹ il lui défendit de partir ». En parallèle, « ici » devient « LÀ » (conversion des indicateurs). Piège : la négation d'un ordre peut aussi se rendre par « de ne pas » : « il demanda de ne pas partir » : l'impératif disparaît TOUJAURS au discours indirect (remplacé par l'infinitif introduit par de).</div>"},
{"t": "Le discours direct, indirect et indirect libre (4e/3e)", "q": "Au discours indirect, « hier » devient :", "c": ["le lendemain", "hier", "la veille", "aujourd'hui"], "a": 2, "e": "Le repère se prend depuis le RÉCIT : hier (pour le personnage) = la veille (pour le narrateur).", "d": "<b>« la veille »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le principe : au discours direct, les repères sont ceux du PERSONNAGE au moment de sa parole ; à l'indirect, tout se recalcule depuis le NARRATEUR : hier ⟹ la veille ; aujourd'hui ⟹ ce jour-là ; demain ⟹ le lendemain ; dans trois jours ⟹ trois jours plus tôt/plus tard. Piège : ces conversions font l'objet d'une question de dictée-réécriture au brevet : les apprendre par cœur, puis vérifier la COHÉRENCE avec le temps du verbe introducteur (passé ⟹ décalage).</div>"},
{"t": "Le discours direct, indirect et indirect libre (4e/3e)", "q": "L'effet principal du discours indirect libre est de :", "c": ["faire entendre la pensée du personnage dans la narration", "citer un auteur", "donner des ordres", "rapporter fidèlement les paroles"], "a": 0, "e": "Le narrateur prête sa voix aux pensées : intimacy et ironie possibles.", "d": "<b>Faire entendre la pensée du personnage</b> à l'intérieur du récit.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience de lecture : « Elle regarda la robe. Trois mois de salaire ! Puisqu'il fallait choisir… » : on entend SON calcul, SON hésitation, sans que le narrateur n'ait dit « elle pensa que » : le lecteur entre DANS la tête. Bonus d'analyse : le narrateur peut s'en servir pour IRONISER (la phrase du personnage paraît naïve) : c'est tout Flaubert. Piège : l'indirect libre n'est ni du direct (pas de guillemets) ni de l'indirect pur (pas de subordonnée) : c'est le TROISIÈME discours, celui du style.</div>"},
{"t": "Le discours direct, indirect et indirect libre (4e/3e)", "q": "Au théâtre, la parole des personnages est :", "c": ["toujours narrée", "en indirect libre", "au discours direct (répliques)", "au discours indirect"], "a": 2, "e": "Le genre théâtral EST la parole : répliques prononcées, didascalies pour les indications.", "d": "<b>Au discours direct</b> (paroles prononcées = répliques).<div class='ex-detail'><u>Exemple rédigé</u> : particularité du théâtre : pas de narrateur, donc pas de discours indirect possible (sauf quand un personnage RAPPORTE les paroles d'un absent : « Il m'a dit que le roi viendrait » : du discours indirect DANS une réplique). Les didascalies (stage directions en italique) ne sont PAS de la parole : ce sont des indications scéniques. Piège : dans une tirade, un personnage peut citer un autre AVEC guillemets : empiler les discours : « Il m'a crié : « Pars ! » : les trois discours cohabitent au théâtre.</div>"},
{"t": "Le discours direct, indirect et indirect libre (4e/3e)", "q": "Après « il a demandé SI… » (discours indirect), le point final est :", "c": ["des points de suspension", "pas de ponctuation", "un point d'interrogation", "un point simple"], "a": 3, "e": "La question est devenue une subordonnée : plus de « ? » : « Il a demandé si je venais. »", "d": "<b>Un point simple</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement typographique : au discours indirect, la question n'est plus une QUESTION posée au lecteur, mais un FAIT rapporté (l'acte de demander) : la phrase est déclarative : « Elle demanda s'il pleuvait. » Piège : garder « ? » et l'inversion (« elle demanda si venait-il ») cumule deux fautes : la réécriture du brevet teste exactement ce basculement : question ⟹ proposition subordonnée sans ? ni inversion.</div>"},
{"t": "Le discours direct, indirect et indirect libre (4e/3e)", "q": "Quel verbe introducteur convient pour rapporter une QUESTION au direct ?", "c": ["dire", "demander / s'enquérir", "ordonner", "répondre"], "a": 1, "e": "On demande une question, on répond à une réponse : le verbe doit correspondre à l'acte de parole.", "d": "<b>« demander »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la logique des verbes de parole : question ⟹ demander, s'enquérir, interroger ; réponse ⟹ répondre, répliquer ; ordre ⟹ ordonner, commander, exiger ; cri ⟹ crier, s'exclamer. Piège : « il dit : « Viens-tu ? » » n'est pas FAUX, mais affaibli : la précision du verbe introducteur fait partie du style (au lycée : chercher la NUANCE : murmurer, grogner, soupirer…) : le verbe de parole est un INDICE de tonalité.</div>"},
{"t": "Les genres et les formes littéraires (4e/3e)", "q": "Le théâtre se reconnaît typographiquement à :", "c": ["actes, scènes, noms de personnages, didascalies", "des chapitres", "des strophes", "des guillemets partout"], "a": 0, "e": "Le texte est fait pour la scène : structure en actes/scènes, répliques, didascalies.", "d": "<b>Actes, scènes, noms en majuscules, didascalies</b>.<div class='ex-detail'><u>Exemple rédigé</u> : examen d'un extrait : « Acte I, scène 2 » (division scénique), « HARPAGON. — » (personnage + tiret de réplique), « (bas, à part) » (didascalie : indication de jeu) : trois marques = théâtre à coup sûr. Piège : une lettre ou un roman peuvent CONTENIR du dialogue, mais sans la structure actes/scènes : c'est l'ORGANISATION scénique (pas la présence de dialogue) qui définit le genre théâtral.</div>"},
{"t": "Les genres et les formes littéraires (4e/3e)", "q": "Une fable est :", "c": ["un roman court", "un poème sans morale", "une lettre", "un apologue (récit bref + moralité)"], "a": 3, "e": "Récit plaisant qui se termine par une leçon : c'est l'apologue type (La Fontaine).", "d": "<b>Un apologue</b> : réit + moralité.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme du « Le Corbeau et le Renard » : ① un réit animalier divertissant (le corbeau dupé) ② une moralité finale (« tout flatteur vit aux dépens de celui qui l'écoute ») : plaire + instruire = la double visée de l'apologue : le lecteur retient la leçon SANS être sermonné. Piège : toutes les fables n'ont pas une moralité séparée (parfois elle ouvre le texte, parfois elle est implicite) : ce qui ne change JAMAIS, c'est la visée de sagesse pratique.</div>"},
{"t": "Les genres et les formes littéraires (4e/3e)", "q": "La nouvelle se distingue du roman par :", "c": ["l'absence de narrateur", "sa brièveté et sa fin souvent inattendue (chute)", "le vers", "sa longueur plus grande"], "a": 1, "e": "Récit bref, concentration : la chute (twist) finale est sa signature.", "d": "<b>Sa brièveté et sa chute</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la nouvelle (Maupassant : « La Parure », « Le Horla ») : quelques pages, un SEUL événement, des personnages peu nombreux, et une FIN qui relit tout le texte (« La Parure » : le collier était faux !) : le roman, lui, multiplie péripéties et arcs sur des centaines de pages. Piège : courte ne veut pas dire simple : la concentration est un ART (chaque phrase prépare la chute) : au brevet, l'analyse de la chute est LA question type sur la nouvelle.</div>"},
{"t": "Les genres et les formes littéraires (4e/3e)", "q": "La tragédie se caractérise par :", "c": ["l'absence de dialogue", "des fins funestes et des personnages souvent nobles", "un dénouement heureux", "la comédie"], "a": 1, "e": "Rois, reines, destins : la tragédie finit mal (mort, ruine) et débat de grandes questions.", "d": "<b>Fins funestes, personnages nobles, conflits de valeurs</b>.<div class='ex-detail'><u>Exemple rédigé</u> : Racine, « Phèdre » : une reine passionnée, un interdit, la mort des héros : la tragédie montre des êtres pris dans un DESTIN qui les dépasse (fatalité, passion, devoir) : le spectateur éprouve terreur ET pitié (Aristote) : catharsis. À l'inverse, la comédie (Molière) raille les mœurs bourgeois et réconcilie (mariage final). Piège : au théâtre, TOUT n'est pas tragique : identifier ton (tragique/comique) et genre (théâtre) : les deux questions sont séparées.</div>"},
{"t": "Les genres et les formes littéraires (4e/3e)", "q": "Un poème en prose est :", "c": ["impossible", "un roman", "une lettre poétique", "un texte poétique sans vers (images, rythme, sonorités)"], "a": 3, "e": "La poésie se définit par le travail sur la langue, pas seulement par le vers : poème en prose (Baudelaire, « Le Gouffre »).", "d": "<b>De la poésie sans vers</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les « Petits Poèmes en prose » de Baudelaire : pas de rimes, pas de comptage syllabique, MAIS : images fortes (« le gouffre »), rythme des phrases, sonorités choisies, effet de sens sur le lecteur : la poésie est un TRAVAIL DE LANGAGE, pas une forme versifiée obligatoire. Piège : au lycée, « genre poétique » inclut le poème en prose : ne pas écrire « pas de vers ⟹ pas de poésie » : c'est l'inverse de la définition moderne.</div>"},
{"t": "Les genres et les formes littéraires (4e/3e)", "q": "Le conte se reconnaît souvent à :", "c": ["la mort du héros", "des didascalies", "l'absence de héros", "des formules rituelles (« Il était une fois… ») et le merveilleux"], "a": 3, "e": "Merveilleux sans justification, formules d'ouverture et de clôture, moral implicite : Perrault, Grimm.", "d": "<b>Formules rituelles + merveilleux</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « Il était une fois » (ouverture), « ils se marièrent et eurent beaucoup d'enfants » (clôture), des éléments MERVEILLEUX non expliqués (fées, ogres, carrossesses-citrouilles) : le conte dit une vérité SYMBOLIQUE (initiation, désirs, peurs) sous couvert d'enfance. Piège : distinguer le conte TRADITIONNEL (merveilleux, oralité) du conte PHILOSOPHIQUE (Voltaire : merveilleux AU SERVICE d'une critique : Candide) : même mot, deux machines à sens.</div>"},
{"t": "Les genres et les formes littéraires (4e/3e)", "q": "Genre et forme, quelle relation ?", "c": ["la forme est une subdivision/réalisation du genre", "ce sont des synonymes", "le genre est une subdivision de la forme", "aucun lien"], "a": 0, "e": "Théâtre = genre ; la comédie, la tragédie = formes. Roman = genre ; nouvelle, conte = formes voisines.", "d": "<b>La forme réalise le genre</b>.<div class='ex-detail'><u>Exemple rédigé</u> : emboîtement : GENRE (récit) ⟶ FORME (roman, nouvelle, conte, fable…) ; GENRE (théâtre) ⟶ FORME (comédie, tragédie, drame) ; l'argumentation (domaine) ⟶ FORMES (essai, lettre, apologue). Piège : la question piège des contrôles : « la fable est-elle un genre ? » NON : c'est une forme du récit (et souvent de la poésie par ses vers) : répondre genre/forme correctement = déjà la moitié de la note d'identification.</div>"},
{"t": "Les genres et les formes littéraires (4e/3e)", "q": "L'apologue vise à :", "c": ["distraire seulement", "documenter", "instruire sous le couvert du récit", "faire pleurer"], "a": 2, "e": "Plaire pour instruire : la leçon passe par le détour narratif (fable, conte philosophique).", "d": "<b>Instruire sous le couvert du récit</b>.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi le détour fonctionne : un essai dit « ne vous laissez pas flatter » ⟹ le lecteur se défend ; une fable montre un corbeau dépouillé ⟹ le lecteur rit, se reconnaît, et accepte la leçon : le détour narratif CONTORNE les résistances (c'est la thèse de Rousseau contre, de Lessing pour : débat classique du lycée). Piège : l'apologue n'est pas un conte innocent : chez Voltaire, chaque péripétie de Candide REFUTE une thèse (l'optimisme) : l'analyse doit relier récit et argumentation.</div>"},
{"t": "Les genres et les formes littéraires (4e/3e)", "q": "Le mythe raconte surtout :", "c": ["des origines et des forces surnaturelles", "l'actualité", "une leçon de morale explicite", "un fait historique prouvé"], "a": 0, "e": "Naissance du monde, des dieux, des hommes : récits ORIGINELS (Ovide, Homère, la Genèse…).", "d": "<b>Des origines et forces surnaturelles</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mythe répond aux QUESTIONS PREMIÈRES : d'où vient le monde (cosmogonie) ? pourquoi les saisons (Perséphone) ? pourquoi le mal (Pandore) ? : récit symbolique et FONDATEUR d'une culture. Différence clé : le conte divertit/avertit, le mythe EXPLIQUE l'ordre du monde. Piège : « mythe » ≠ « mensonge » : en littérature, le mythe est un récit DE SENS, pas une erreur factuelle : les mythes nourrissent toute la littérature (réécritures : Racine, Cocteau, Anouilh).</div>"},
{"t": "Les genres et les formes littéraires (4e/3e)", "q": "Une lettre fictive dans un roman sert souvent à :", "c": ["remplir des pages", "jouer sur scène", "rimer", "faire entendre un personnage absent, varier le point de vue"], "a": 3, "e": "L'épître change de voix (je épistolier) et de focalisation : ressource narrative classique (Lettres persanes, Dracula).", "d": "<b>Varier le point de vue, faire parler l'absent</b>.<div class='ex-detail'><u>Exemple rédigé</u> : effet produit : dans « Les Lettres persanes » de Montesquieu, des voyageurs persans écrivent leur regard étonné sur Paris : la lettre crée une DISTANCE satirique (voir sa propre société avec des yeux étrangers) : changer de forme = changer d'angle d'attaque. Piège : la lettre est aussi une forme à part entière (genre épistolaire : roman par lettres : « Les Liaisons dangereuses ») : la forme choisie conditionne CE que le texte peut dire.</div>"},
{"t": "Les registres et les tonalités (4e/3e)", "q": "« Ô mon âme, où es-tu ? La nuit me dévore » : registre dominant ?", "c": ["satirique", "lyrique", "comique", "épique"], "a": 1, "e": "Apostrophe (Ô), je, sentiments (angoisse, nuit) : expression du moi = lyrique.", "d": "<b>Lyrique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les trois preuves à citer : ① l'apostrophe « Ô » (soupir lyrique typique) ② le pronom « mon âme » (le moi qui parle de lui) ③ le lexique sentimental (« me dévore » : souffrance intériorisée). Piège : le lyrique n'est pas réservé à l'amour : la mélancolie, l'angoisse, l'extase (Baudelaire « Élévation ») : tout sentiment fort exprimé en je = registre lyrique : la preuve par citation fait la différence entre une intuition et une analyse notée.</div>"},
{"t": "Les registres et les tonalités (4e/3e)", "q": "Dire « Quel temps magnifique ! » sous une pluie battante relève de :", "c": ["l'antiphrase (ironie)", "l'éloge", "l'épique", "le tragique"], "a": 0, "e": "Le mot dit le contraire de la pensée : antiphrase, outil de l'ironie.", "d": "<b>De l'antiphrase</b> (ironie).<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme en deux temps : ① le DIT (« magnifique ») ② le CONTEXTE (pluie battante) : l'écart entre les deux produit le sens ironique : le lecteur doit rétablir la vérité (« quel temps affreux »). Au lycée, l'antiphrase signale souvent la SATIRE du narrateur (Voltaire : « un génie de la guerre » pour un boucher) : la repérer = capter le point de vue. Piège : l'ironie exige un écart VISIBLE (ponctuation, contexte) : sans contexte, « magnifique » resterait sincère.</div>"},
{"t": "Les registres et les tonalités (4e/3e)", "q": "Le registre TRAGIQUE se reconnaît à :", "c": ["un destin écrasant, l'inévitable, la mort imminente", "l'humour", "des descriptions savoureuses", "des jeux de mots"], "a": 0, "e": "Fatalité, impuissance des héros, mort annoncée : le tragique dépasse l'individu.", "d": "<b>Destin écrasant, inévitable, mort</b>.<div class='ex-detail'><u>Exemple rédigé</u> : Phèdre (Racine) : l'amour interdit est une FATALITÉ (Vénus la poursuit), l'honneur exige le silence, le dénouement est la mort : le héros tragique est COINCÉ entre des forces contraires (passion/devoir, destin/liberté) : le spectateur ressent terreur et pitié. Différence clé : le PATHÉTIQUE émeut pour un individu (la mort d'un enfant dans Victor Hugo) ; le TRAGIQUE fait sentir unemachine supérieure à tous. Piège : une fin triste ne suffit pas : il faut l'INÉVITABILITÉ.</div>"},
{"t": "Les registres et les tonalités (4e/3e)", "q": "Le registre PATHÉTIQUE vise à :", "c": ["critiquer les puissants", "faire peur", "susciter la pitié et l'émotion devant la souffrance", "faire rire"], "a": 2, "e": "« Pathos » = souffrance en grec : émouvoir, attendrir (larmes du lecteur).", "d": "<b>Susciter la pitié</b> devant la souffrance.<div class='ex-detail'><u>Exemple rédigé</u> : les moyens du pathétique : lexique de la douleur (larmes, sang, misère), accumulation, exclamations, larmes des personnages eux-mêmes : le lecteur compatit pour Cosette maltraitée (Hugo) ou Gavroche mourant : la différence avec le tragique : ici la souffrance est INJUSTE et individuelle, pas une fatalité cosmique : le pathétique peut aussi SERVIR un combat (indignation : misérabilisme réaliste de Hugo : « Malheur à qui… »). Piège : le pathétique n'est pas « mièvre » : c'est une stratégie d'émotion argumentative.</div>"},
{"t": "Les registres et les tonalités (4e/3e)", "q": "Le registre SATIRIQUE est au service de :", "c": ["l'éloge", "la description", "rêver", "la critique (en riant ou en mordant)"], "a": 3, "e": "Satire = attaquer un vice, une institution, une société : le rire est une arme.", "d": "<b>De la critique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la chaîne : vice visé (la guerre : « Candide ») ⟶ procédés (antiphrases, caricature, grotesque : l'abbé, le boucher « héros ») ⟶ cible réelle (l'optimisme leibnizien, les clergy militaires) : la satire rit pour mieux FRAPPER. Piège : satirique ≠ simplement comique : dans « Les Fourberies de Scapin », on rit SANS cible sociale : registre comique ; dans les « Lettres persanes », chaque rire est une CRITIQUE de la France : registre satirique : la question à se poser : QUI est visé ?</div>"},
{"t": "Les registres et les tonalités (4e/3e)", "q": "Le FANTASTIQUE repose sur :", "c": ["le documentaire", "l'absence de surnaturel", "la comédie", "l'hésitation entre une explication naturelle et surnaturelle"], "a": 3, "e": "Le lecteur (et le héros) balance : réel ou illusion ? C'est l'hésitation qui définit le genre (Todorov).", "d": "<b>L'hésitation réel/surnaturel</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « La Horla » (Maupassant) : le narrateur voit une créature invisible : folie ou êre surnaturel ? Le texte maintient les DEUX explications jusqu'au bout : c'est cette INCERTITUDE qui fait le frisson (si le surnaturel était prouvé ⟹ merveilleux ; si expliqué rationnellement ⟹ étrange). Piège : fantastique ≠ horreur gratuite : la définition est STRUCTURELLE (hésitation), pas thématique : un vampire assumé relève du merveilleux, pas du fantastique.</div>"},
{"t": "Les registres et les tonalités (4e/3e)", "q": "Le registre ÉPIQUE se reconnaît à :", "c": ["de l'humour de mots", "des confessions intimes", "des combats grandioses, des héros hors norme, l'accumulation", "un quiproquo"], "a": 2, "e": "Chants, combats, nombres (mille guerriers), amplifications : la grandeur fait l'épique (Iliade, Chanson de Roland).", "d": "<b>Combats grandioses, héros hors norme, amplifications</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les procédés de l'épique : hyperboles (« mille lances »), pluriels (« les armées »), vocabulaire de l'héroïsme, rythmes ternaires, interventions divines (Iliade) : le récit élève ses personnages au-dessus de l'humanité moyenne : l'épopée célèbre une COMMUNAUTÉ (l'armée grecque, la chrétienté). Piège : épique ≠ « spectaculaire » au cinéma : c'est un registre TEXTUEL (amplification, grandissement) : l'analyser = relever les marques d'amplification, pas dire « c'est grand ».</div>"},
{"t": "Les registres et les tonalités (4e/3e)", "q": "Registre et genre sont :", "c": ["la même chose", "sans lien", "inversés", "distincts : le genre est la catégorie d'œuvre, le registre l'effet produit"], "a": 3, "e": "Théâtre = genre ; tragique = registre : une même œuvre peut mélanger les registres.", "d": "<b>Distincts</b> : genre = catégorie, registre = effet.<div class='ex-detail'><u>Exemple rédigé</u> : le croisement : « Ruy Blas » (drame romantique, GENRE) mêle registres comique (valets truculents), pathétique (la reine Prisonnière) et héroïque (la tirade « Bon appétit, messieurs ») : Hugo THEORISE le mélange des registres dans la préface de Cromwell (le grotesque et le sublime). Piège : la question de contrôle classique : « c'est une comédie donc tout est comique » = FAUX : une comédie peut contenir des scènes graves (le malade imaginaire : la mort en toile de fond) : analyser les EFFETS, pas les étiquettes.</div>"},
{"t": "Les registres et les tonalités (4e/3e)", "q": "Pour prouver un registre dans une copie, il faut :", "c": ["affirmer avec conviction", "donner son opinion", "citer 2-3 indices textuels (vocabulaire, ponctuation, images)", "résumer le texte"], "a": 2, "e": "« Lyrique CAR : Ô + je + lexique des sentiments » : la preuve par citation est la norme.", "d": "<b>Citer des indices textuels</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le modèle de phrase d'analyse : « Le registre est pathétique : le lexique de la souffrance (« larmes », « sang »), les exclamations (« Hélas ! ») et l'accumulation des misères attendrissent le lecteur. » : constat + PREUVES + effet. Piège : « c'est lyrique » sans citation = affirmation non prouvée : notée comme absente : la méthode (citer entre guillemets) vaut pour TOUTES les questions de commentaire : registre, figures, tonalité : le texte est le seul tribunal.</div>"},
{"t": "Les registres et les tonalités (4e/3e)", "q": "Un quiproquo (personnages se méprenant l'un sur l'autre) relève du registre :", "c": ["didactique", "épique", "comique", "lyrique"], "a": 2, "e": "Le quiproquo est un ressort comique classique (Le Cid, Le Misanthrope, tout vaudeville).", "d": "<b>Comique</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : deux personnages parlent de la même chose en croyant parler de deux choses différentes (ou l'inverse) : l'écart de compréhension produit le rire du spectateur, LUI qui sait tout : c'est le comique de SITUATION (avec le comique de mots, de caractère, de gestes). Piège : le quiproquo peut devenir GRAVE (dans le tragique, la méprise mène au désastre : « Le Cid » : le comique et le grave partagent la mécanique : seul l'effet final diffère) : l'analyse juge l'EFFET produit, pas le procédé seul.</div>"},
{"t": "Les figures de style (4e/3e)", "q": "« Il est fort comme un bœuf » :", "c": ["une hyperbole", "une métaphore", "une oxymore", "une comparaison (outil : comme)"], "a": 3, "e": "« Comme » relie le comparé (il) et le comparant (bœuf) : comparaison.", "d": "<b>Une comparaison</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la structure à repérer : comparé (il) + outil (comme) + comparant (un bœuf) + point commun implicite (la force). Si on retire « comme » : « c'est un bœuf » ⟹ métaphore. Piège : les outils ne sont pas seulement « comme » : tel, semblable à, ainsi que, plus que… ; et la comparaison peut être sans outil visible à l'oral : à l'écrit, chercher le petit mot-outil.</div>"},
{"t": "Les figures de style (4e/3e)", "q": "« Une obscure clarté » est :", "c": ["une comparaison", "une oxymore (deux sens contraires rapprochés)", "une gradation", "une anaphore"], "a": 1, "e": "Obscur + clarté : mots de sens opposés COLLÉS : oxymore (Corneille).", "d": "<b>Une oxymore</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la définition en action : « obscure » (sombre) et « clarté » (lumière) : deux contradictoires dans le même groupe nominal : l'effet : dire une réalité NUANCÉE impossible à nommer simplement (une lumière faible dans la nuit : Corneille, Le Cid : la nuit étoilée). Piège : ne pas confondre avec l'ANTITHESE, où les opposés sont SÉPARÉS dans la phrase (« il vit dans l'opulence et la misère ») : la COLLISION est le critère de l'oxymore.</div>"},
{"t": "Les figures de style (4e/3e)", "q": "« Va, cours, vole et nous venge » est :", "c": ["une anaphore", "une oxymore", "une gradation (intensité croissante)", "une litote"], "a": 2, "e": "La vitesse s'amplifie : aller ⟹ courir ⟗ voler : gradation (Le Cid).", "d": "<b>Une gradation</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : trois verbes de mouvement d'intensité CROISSANTE (va ⟶ cours ⟶ vole) : l'émotion monte avec les mots : la gradation construit la tension dramatique (ici : l'urgence de la vengeance, Le Cid). Piège : pour qu'il y ait gradation, il faut une VRAIE hiérarchie d'intensité : une simple liste (« des rires, des pleurs ») est une ACCUMULATION, pas une gradation : vérifier l'ordre croissant/décroissant.</div>"},
{"t": "Les figures de style (4e/3e)", "q": "La différence métaphore/comparaison est :", "c": ["le sujet", "l'époque", "la longueur", "l'outil de comparaison (présent dans la comparaison, absent de la métaphore)"], "a": 3, "e": "« comme/tel » ⟹ comparaison ; fusion directe ⟹ métaphore.", "d": "<b>L'outil de comparaison</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le couple test : « il est rusé comme un renard » (comparaison : outil « comme ») vs « c'est un vrai renard » (métaphore : le renard EST directement posé). L'effet diffère : la comparaison GUIDE (le lecteur voit le pont) ; la métaphore SURPREND (elle impose l'image, plus poétique et suggestive). Piège : au commentaire, ne pas écrire « métaphore » pour toute image : vérifier l'ABSENCE d'outil : une erreur d'étiquette coûte la crédibilité de toute l'analyse.</div>"},
{"t": "Les figures de style (4e/3e)", "q": "« Le vent murmure des secrets aux feuilles » :", "c": ["une antithèse", "une hyperbole", "une litote", "une personnification"], "a": 3, "e": "Le vent (murmurer, secrets) agit comme un humain : personnification.", "d": "<b>Une personnification</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les indices : « murmure » (parler) et « des secrets » (confidence) attribués au VENT : la nature est humanisée : effet : le paysage devient VIVANT, complice (fréquent dans la poésie du paysage : « le lac » de Lamartine, les arbres de Hugo). Piège : la personnification est une espèce de métaphore (transfert de traits humains) : la nommer personnification QUAND les traits sont humains (parler, pleurer, aimer) : métaphore seulement si l'image reste abstraite.</div>"},
{"t": "Les figures de style (4e/3e)", "q": "« Moi, président de la République, je… » répété cinq fois :", "c": ["une épiphore", "un chiasme", "une anaphore (répétition en tête de phrase)", "une gradation"], "a": 2, "e": "Répétition du même segment au DÉBUT : anaphore (raisonnement de Devos devenu célèbre).", "d": "<b>Une anaphore</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la définition : répétition d'un mot/expression EN TÊTE de phrases ou vers successifs : effet : insistance rythmée, martèlement oratoire (c'est la figure des discours : « Moi président » (Devos), « I have a dream » répété). Différence : l'ÉPIPHORE répète à la FIN (« C'est la vie… c'est la vie »). Piège : toute répétition n'est pas anaphore : il faut la position INITIALE + au moins deux occurrences : sinon, c'est une simple répétition (à ne nommer QUE si elle a un effet).</div>"},
{"t": "Les figures de style (4e/3e)", "q": "« Mourir de rire » est :", "c": ["une périphrase", "une litote", "une hyperbole (exagération)", "une comparaison"], "a": 2, "e": "On n'expire pas vraiment : exagération pour dire « rire beaucoup ».", "d": "<b>Une hyperbole</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la définition : exaggeration volontaire : « mourir de rire », « un siècle », « je t'ai dit cent fois » : l'effet : intensifier l'expression d'un sentiment ou d'un fait (souvent avec une pointe d'humour). Piège : l'hyperbole peut devenir un cliché (les expressions figées ne « comptent » plus comme figures actives) : dans un texte littéraire, relever les hyperboles CRÉATIVES (Hugo : « trois mille ans »), pas les formules toutes faites : l'analyse juge le travail d'écriture.</div>"},
{"t": "Les figures de style (4e/3e)", "q": "« La Ville lumière » pour Paris est :", "c": ["un euphémisme", "une métaphore filée", "une antithèse", "une périphrase"], "a": 3, "e": "Un nom remplacé par une expression : périphrase (souvent stylée et reconnue).", "d": "<b>Une périphrase</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : Paris ⟹ « la Ville lumière » (nom remplacé par une expression qui le DÉCOULE : illumination, Beacon city) : effets : élégance, détour précieux, devinette pour le lecteur. Autres exemples : « le roi Soleil » (Louis XIV), « la Ville éternelle » (Rome), « le gentleman cambrioleur » (Arsène Lupin). Piège : la périphrase n'est pas une erreur de style : elle est PRÉCIEUSE ou ironique selon le contexte (chez Voltaire, elle tourne en dérision).</div>"},
{"t": "Les figures de style (4e/3e)", "q": "« Il n'est pas mécontent » pour « il est content » :", "c": ["une litote (dire moins pour suggérer plus)", "une personnification", "une anaphore", "une hyperbole"], "a": 0, "e": "Négation inverse qui ATTÉNUE tout en laissant entendre la vérité : litote (spécialité britannique).", "d": "<b>Une litote</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la formule : dire MOINS pour suggérer PLUS : « il n'est pas mécontent » = il est TRÈS content ; « ce n'est pas mauvais » = c'est délicieux : l'effet : pudeur, sous-entendu, élégance (ou ironie). Piège : distinguer de l'EUPHÉMISME, qui ATTÉNUE une réalité dure (« il nous a quittés » pour « il est mort ») : la litote renforce par la négation, l'euphémisme adoucit : le commentateur doit vérifier la DIRECTION de l'effet.</div>"},
{"t": "Les figures de style (4e/3e)", "q": "Dans une copie, nommer une figure doit s'accompagner de :", "c": ["rien d'autre", "sa traduction", "la citation + l'effet produit (analyse)", "sa définition du dictionnaire"], "a": 2, "e": "« Métaphore ⟹ cite ⟹ effet : la fusée devient astre : le réel se fait rêve » : figure = outil, sens = but.", "d": "<b>Citation + effet de sens</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le modèle de phrase : « La métaphore « étoile filante » transforme la fusée en astre : le progrès technique devient poésie, l'exploit se lit comme un événement céleste. » : trois temps : NOMMER, CITER, ANALYSER. Piège : l'erreur du catalogue : « il y a une comparaison, une hyperbole et une anaphore » (points perdus : simple inventaire) : une figure ne vaut que par le SENS qu'elle produit : l'effet est la note.</div>"},
{"t": "Le sens des mots et le lexique (6e/5e)", "q": "« Cette histoire est terrible » : « terrible » peut vouloir dire :", "c": ["jamais positif", "très grave ou très grand (polysémie : terrible=effrayant ou formidable)", "unique", "uniquement vert"], "a": 1, "e": "Polysémie : le contexte décide (une terrible nouvelle / un chanteur terrible !).", "d": "<b>Plusieurs sens selon le contexte</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « une terrible nouvelle » (effrayante : sens négatif) vs « un guitariste terrible » (formidable : registre familier, sens positif !) : le même mot bascule : la polysémie est une RICHESSE de la langue, et le contexte est le JUGE : dans un texte, relever le sens ACTIF du mot (« quel sens prend « terrible » ici ? ») est une question de lecture classique : toujours justifier par la phrase entière.</div>"},
{"t": "Le sens des mots et le lexique (6e/5e)", "q": "« Le pied de la montagne » : « pied » est au :", "c": ["sens ironique", "sens familier", "sens figuré", "sens propre (partie basse, base)"], "a": 3, "e": "Par extension naturelle : la base de la montagne, comme le pied du corps : sens propre.</div>", "d": "<b>Sens propre</b> (partie basse).<div class='ex-detail'><u>Exemple rédigé</u> : le fil sémantique : « pied » désigne la partie qui PORTE (le corps, la table, la montagne) : c'est un sens PROPRE par analogie naturelle, entré dans l'usage standard. Comparez : « prendre son pied » (s'amuser : totalement FIGURÉ, image sans lien littéral). Piège : propre/figuré ne se décide pas au hasard : test : le sens reste-il physique/vocabulaire concret ? ⟹ propre ; le mot prend-t-il une image détournée ? ⟹ figuré.</div>"},
{"t": "Le sens des mots et le lexique (6e/5e)", "q": "Quel mot est antonyme de « provisoire » ?", "c": ["définitif", "momentané", "temporary", "fragile"], "a": 0, "e": "Provisoire (temporaire) ⟺ définitif (durable) : antonymes.", "d": "<b>« définitif »</b>.<div class='ex-detail'><u>Exemple rédigé</u> : construction du réseau : provisoire/temporaire/momentané/éphémère (même famille) vs définitif/durable/permanent (famille opposée) : les antonymes s'organisent par paires de traits (durée courte vs longue). Piège : « fragile » n'est PAS l'antonyme de provisoire (la fragilité concerne la solidité, pas la durée) : un antonyme inverse LE trait pertinent, pas n'importe quel trait : bien identifier le trait (durée, taille, intensité…) avant de répondre.</div>"},
{"t": "Le sens des mots et le lexique (6e/5e)", "q": "« Ses » et « ces » sont des :", "c": ["paronymes (formes proches, sens différents)", "antonymes", "homonymes parfait", "synonymes"], "a": 0, "e": "Sonorité proche, sens différent : paronymes : pièges d'orthographe classiques.", "d": "<b>Des paronymes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la technique : « ses » (possessif : ses livres) et « ces » (démonstratif : ces livres) se distinguent par le TEST du singulier : si on peut dire « son livre » ⟹ ses ; si on peut dire « ce livre » ⟹ ces. Autres paronymes redoutables : éruption/irruption, vacance/vacance… non : OPPRESSION/OCCUPATION ! Piège : les paronymes sont LA source des fautes d'orthographe les plus frequentes dans les dictées : les traquer avec un test grammatical (singulier, remplaсement).</div>"},
{"t": "Le sens des mots et le lexique (6e/5e)", "q": "« Des fringues » (vêtements) relève du niveau :", "c": ["soutenu", "scientifique", "poétique", "familier"], "a": 3, "e": "Registre familier : à éviter dans une copie formelle, adapté au dialogue décontracté.", "d": "<b>Familier</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la gamme : fringues (familier) / vêtements (courant) / habits, toilette (soutenu) : en copie de brevet : VOCABULAIRE courant/soutenu ; en dialogue de récit : le familier CARACTÉRISE un personnage (jeune, décontracté : fidélité de la parole). Piège : le niveau de langue est un CHOIX D'ÉCRITURE, pas une ignorance : savoir PASSER du familier au courant est une compétence (réécriture style direct/indirect) : transformer « il s'est tiré » en « il est parti ».</div>"},
{"t": "Le sens des mots et le lexique (6e/5e)", "q": "Dans « le temps file », « file » est employé :", "c": ["comme antonyme", "au sens propre", "au sens juridique", "au sens figuré (image de la vitesse)"], "a": 3, "e": "Le temps ne file pas littéralement : image du fil qui se dévide = métaphore figée, sens figuré.", "d": "<b>Au sens figuré</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'image morte : « le temps file » : comparé (le temps) + comparant (le fil qui se dévide trop vite) : la métaphore est ENTRÉE dans l'usage (métaphore figée) : le sens figuré est partout dans la langue quotidienne (« une pluie diluvienne », « perdre la tête »). Piège : au lycée, distinguer les images CRÉATIVES (à analyser) des images usées (clichés : ne plus surprendre) : l'écrivain renouvelle l'image, la langue la consomme.</div>"},
{"t": "Le sens des mots et le lexique (6e/5e)", "q": "« Maison, demeure, baraque » sont :", "c": ["des paronymes", "des homophones", "des antonymes", "des synonymes de niveaux de langue différents"], "a": 3, "e": "Même sens (lieu d'habitation), nuances de registre : baraque (familier), maison (courant), demeure (soutenu).", "d": "<b>Des synonymes de registres différents</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le tri : « une demeure cossue » (soutenu : écriture littéraire), « ma maison » (courant : standard), « sa baraque » (familier : oral, complicité) : les synonymes portent une TEINTE (registre + connotation) : choisir, c'est SIGNER un style. Piège : « synonymes parfaits » n'existe presque pas : chaque mot a sa nuance (demeure évoque le standing, baraque la simplicité) : le bon mot = le mot juste POUR LE CONTEXTE, pas seulement le bon sens.</div>"},
{"t": "Le sens des mots et le lexique (6e/5e)", "q": "Le mot « vol » (de l'oiseau / délit / volley) illustre :", "c": ["la synonymie", "l'homonymie totale", "l'antonymie", "la polysémie (un mot, plusieurs sens reliés ou non selon l'étymologie)"], "a": 3, "e": "Plusieurs sens pour un seul mot : le contexte tranche : polysémie (ou homonymie quand les étymologies diffèrent).", "d": "<b>La polysémie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'arbre du mot : voler (latin volare : l'oiseau) ⟹ vol du ballon, premier vol ; voler (latin vulgaris? non : VOLERE : enlever par ruse) ⟹ vol à l'étalage : DEUX étymologies différentes : homonymes plutôt que polysémie pure (le dictionnaire les sépare : vol¹, vol²). Piège : la frontière polysémie/homonymie est étymologique : pour l'élève, l'essentiel reste : LE CONTEXTE CHOISIT LE SENS : relire la phrase, interroger le sens possible, trancher : c'est la compétence lexique du brevet.</div>"},
{"t": "Le sens des mots et le lexique (6e/5e)", "q": "Pour éviter les répétitions de « content », on peut utiliser :", "c": ["un homophone", "un paronyme", "un antonyme", "un synonyme (heureux, ravi, enchanté)"], "a": 3, "e": "Heureux, ravi, enchanté, comblé : synonymes qui évitent la répétition en nuancant.", "d": "<b>Un synonyme</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'exercice d'embellissement : « Paul est content. Il est content d'avoir gagné. » (lourd !) ⟹ « Paul est RAVI. Cette victoire le COMBLE de bonheur. » : les synonymes évitent la répétition ET ajoutent une gradation (content ⟶ ravi ⟶ comblé : intensité croissante : une gradation lexicale !). Piège : ne pas surcharger : trois synonymes bien choisis suffisent : l'accumulation de synonymes rares sans nuance précise dessert le style (préciosité) : la justesse d'abord.</div>"},
{"t": "Le sens des mots et le lexique (6e/5e)", "q": "En rédaction type brevet, le niveau de langue attendu est :", "c": ["indifférent", "argotique", "familier", "courant (voire soutenu)"], "a": 3, "e": "Sauf dans les dialogues d'un récit où le familier peut caractériser un personnage.", "d": "<b>Courant/soutenu</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la règle d'or : la copie est un texte FORMEL adressé à un correcteur : niveau courant minimum, soutenu bienvenu : « il fait moche » ⟹ « le temps est maussade » ; « il s'est énervé » ⟹ « il s'est emporté ». Nuance : dans un DIALOGUE de récit, le familier est un CHOIX D'AUTEUR (faire vivre un personnage jeune : « Ta gueule ! » crie le voyou : réalisme) : la norme vaut pour la VOIX du narrateur, pas pour celle des personnages. Piège : ce double jeu (soi-même correct, personnages libres) est exactement ce qu'on note en expression écrite.</div>"},
{"t": "La poésie : du lyrisme à l'engagement (2de/1re)", "q": "Un alexandrin compte :", "c": ["8 syllabes", "10 syllabes", "14 syllabes", "12 syllabes"], "a": 3, "e": "Alexandrin = 12, décasyllabe = 10, octosyllabe = 8.", "d": "<b>12 syllabes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le vers d'anthologie (Racine) : « Et je la vois, la belle créature » : et(1)-je(2)-la(3)-vois(4)-la(5)-belle(6) // cré(7)-a(8)-tu(9)-re(10)… avec les élisions : le compte tombe à 12 avec la césure après la 6e syllabe (les deux hémistiches de 6 : « Et je la vois // la belle créature »). Piège : le « e » muet : il ne compte PAS devant une voyelle (élision) mais se prononce en fin de vers féminin : la scansion s'apprend à voix haute : au bac, compter TOUT : le mètre conditionne le rythme, donc l'analyse.</div>"},
{"t": "La poésie : du lyrisme à l'engagement (2de/1re)", "q": "La disposition ABBA correspond à des rimes :", "c": ["croisées", "suivies", "redoublées", "embrassées"], "a": 3, "e": "A…B…B…A : le A « embrasse » le B : rimes embrassées (souvent dans le sonnet).", "d": "<b>Embrassées</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le schéma visuel : A(dée) B(tèche) B(frêche) A(têtée) : le A ouvre et referme la strophe comme deux bras : l'effet en est un ENFERMEMENT musical (le quatrain du sonnet français les adore : Baudelaire, « Correspondances »). Piège : ne pas confondre avec croisées ABAB (entrelacées : le plus courant depuis la Pléiade) et suivies AABB (couplées : moyenâgeux, lourdes) : identifier le schéma est une question de bac ENTIÈRE : l'écrire (AABB/ABAB/ABBA) puis l'interpréter (l'effet du schéma : écho, circulation, fermeture).</div>"},
{"t": "La poésie : du lyrisme à l'engagement (2de/1re)", "q": "« Lyrique » en poésie signifie :", "c": ["qui dénonce", "gauche", "doux et mélodieux", "qui exprime le moi et ses sentiments"], "a": 3, "e": "De la lyre d'Orphée : la poésie du MOI (amour, mort, temps, nature : Lamartine, Musset).", "d": "<b>Expression du moi et de ses sentiments</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « Le Lac » (Lamartine) : « Ô temps, suspends ton vol ! » : le JE s'adresse à la nature et au temps disparus : deuil amoureux, angoisse du temps : c'est LE lyrisme romantique (le moi face à l'univers). Piège : « lyrique » ≠ « lyrique = chantant/doux » (sens courant du mot : élogieux : « un éloge lyrique ») : en littérature, le lyrisme est une POSTURE (le moi parle) : Hugo élégiaque, Verlaine de « Poèmes saturniens » : le moi peut être triste, sifflant, tragique : tout SAUF impersonnel.</div>"},
{"t": "La poésie : du lyrisme à l'engagement (2de/1re)", "q": "La poésie engagée se définit par :", "c": ["sa rime", "sa longueur", "sa prise de position (dénoncer, mobiliser)", "son absence de sens"], "a": 2, "e": "Le poète prend parti : Hugo (Les Châtiments), Éluard (Liberté), Aragon (La Rose et le Réséda).", "d": "<b>La prise de position</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « Liberté » (Éluard, 1942) : sur le cahier d'écolier… le mot liberté écrit partout, jusqu'au destin : le poème MANIFESTE la résistance, imprimé et parachuté par la RAF : la poésie devient ARME (tracts, journaux clandestins : Délivrance, Minuit). L'analyse type : procédés (anaphore, énumération : simplification du vocabulaire pour tous) + visée (unir, exister malgré la censure). Piège : un poème engagé reste un POÈME (images, rythme) : sinon c'est un tract : le commentaire doit montrer comment la BEAUTÉ sert la LUTTE.</div>"},
{"t": "La poésie : du lyrisme à l'engagement (2de/1re)", "q": "« Paris a froid Paris a faim » (Éluard) : le procédé dominant est :", "c": ["une antithèse", "un chiasme", "une anaphore (répétition en tête)", "une litote"], "a": 2, "e": "« Paris a » ouvre chaque segment : anaphore qui martèle la souffrance de la ville.", "d": "<b>Une anaphore</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mécanisme : « Paris a froid / Paris a faim / Paris ne mange plus » : la répétition initiale transforme l'énumération en INCANTATION (une complainte, presque une comptine tragique) : effet : mémorisable, scandable : le poème circule : c'est un poème de TRACT (Courage, 1941). Piège : l'anaphore n'est pas seulement décorative : au bac, toujours la relier à la VISÉE (ici : incarnée par la personnification de Paris : la ville est un affamé : l'occupation est dite par la faim, pas par le mot « guerre »).</div>"},
