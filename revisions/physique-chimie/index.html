{"t": "Travail et énergie : puissance et transferts (1re)", "q": "Un objet glisse à vitesse CONSTANTE :", "c": ["impossible", "ΣW = 0 (vitesse inchangée ⟹ ΔEc = 0)", "ΣW < 0", "ΣW > 0"], "a": 1, "e": "ΔEc = 0 ⟹ la somme des travaux est nulle : moteur = résistant.", "d": "<b>ΣW = 0</b> : les travaux se compensent exactement.<div class='ex-detail'><u>Exemple rédigé</u> : la valise tirée à vitesse constante : W(traction) = +433 J ; W(frottement) = −433 J (forcément, pour que v soit constante) : le moteur paie exactement l'addition du frottement : aucun « bénéfice » en vitesse. Piège : « ΣW > 0 » accélèrerait l'objet (ΔEc > 0) : vitesse constante = équilibre énergétique parfait : c'est le théorème de l'Ec lu à l'envers.</div>"},
{"t": "Travail et énergie : puissance et transferts (1re)", "q": "P = F·v. Un moteur pousse 4000 N à 25 m/s :", "c": ["100 kW", "4000 W", "160 W", "10 kW"], "a": 0, "e": "P = 4000 × 25 = 100 000 W = 100 kW.", "d": "<b>100 kW</b> : P = F × v.<div class='ex-detail'><u>Exemple rédigé</u> : le couple fameux : à puissance constante (100 kW), plus la voiture va VITE, moins la force disponible est grande : F = P/v : à 25 m/s : 4000 N (accélérations franches) ; à 50 m/s : 2000 N (molle) : c'est pour ça qu'on passe les rapports : maintenir F dans la bonne plage. Piège : « 160 W » diviserait au lieu de multiplier : watt = N × m/s : le produit est cohérent avec les unités.</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Le transfert thermique spontané va :", "c": ["dans les deux sens", "du chaud vers le froid", "du froid vers le chaud", "jamais"], "a": 1, "e": "Toujours du plus chaud vers le plus froid, jusqu'à l'équilibre.", "d": "<b>Du chaud vers le froid</b> : jusqu'à l'égalité des températures.<div class='ex-detail'><u>Exemple rédigé</u> : langage piège : « ferme la porte, le froid entre » : physiquement, c'est le CHAUD qui sort (les particules agitées cèdent leur énergie à l'extérieur) : le froid n'est pas une substance, c'est une absence de chaud. Le frigo ne viole pas la règle : c'est une machine POMPANT le chaud (avec un compresseur, payé en électricité). Piège : « les deux sens » : spontanément JAMAIS : c'est la flèche du temps thermodynamique (2e principe).</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Le Soleil chauffe la Terre par :", "c": ["conduction", "rayonnement (traverse le vide)", "un câble", "convection"], "a": 1, "e": "Ondes électromagnétiques : seul mode qui franchit 150 millions de km de vide.", "d": "<b>Rayonnement</b> : la lumière (et l'infrarouge) transporte l'énergie dans le vide.<div class='ex-detail'><u>Exemple rédigé</u> : élimination : la conduction exige de la MATIÈRE en contact (pas de vide) ; la convection exige un FLUIDE qui bouge (idem) : seul le rayonnement (infrarouge essentiellement) traverse le vide : la Terre reçoit ~1361 W/m² perpendiculairement au Soleil : toute la vie en dépend. Piège : « convection » marche dans l'atmosphère (brises) mais pas depuis le Soleil : le mode se lit dans le MILIEU traversé.</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Q = m·c·ΔT. Chauffer 2 kg d'eau de 10 °C (c = 4185) :", "c": ["83 700 J", "8370 J", "20 925 J", "4185 J"], "a": 0, "e": "Q = 2 × 4185 × 10 = 83 700 J.", "d": "<b>83 700 J</b> (≈ 84 kJ).<div class='ex-detail'><u>Exemple rédigé</u> : lecture de la formule : la masse (2 kg), la capacité (4185 : l'eau est une éponge thermique), l'écart (10 °C) : le produit. Comparaison : le même 84 kJ chaufferait 2 kg d'ALUMINIUM de 10 °C beaucoup plus « facilement » ? Non : c(Al) = 900 : Q = 18 000 J : chauffer l'eau coûte ~4,6× plus cher que l'aluminium. Piège : confondre m et ΔT : l'IDENTIFICATION des facteurs compte plus que leur ordre.</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "L'air chaud qui monte au-dessus d'un radiateur illustre :", "c": ["la convection", "la conduction", "le rayonnement", "l'évaporation"], "a": 0, "e": "La matière (air) se déplace en transportant la chaleur : convection.", "d": "<b>La convection</b> : mouvement de matière + chaleur embarquée.<div class='ex-detail'><u>Exemple rédigé</u> : mécanisme : l'air chauffé SE DILATE (moins dense) ⟹ il s'élève ; l'air refroidi près de la vitre retombe : boucle de convection : mêmes causes dans la météo (brises, Gulf Stream), l'ébullition (roulements d'eau dans la casserole), le manteau terrestre (dérive des continents !). Piège : la conduction, elle, se fait SANS déplacement de matière (la barre de métal chauffe à l'autre bout en restant immobile).</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "La température mesure :", "c": ["le volume", "l'agitation moyenne des particules", "la masse", "la quantité de chaleur totale"], "a": 1, "e": "T traduit l'énergie cinétique microscopique MOYENNE.", "d": "<b>L'agitation moyenne des particules</b>.<div class='ex-detail'><u>Exemple rédigé</u> : distinction clé : un lac à 20 °C contient une ÉNERGIE interne énorme (des milliards de milliards de particules à 20 °C) ; une flamme à 500 °C, peu de masse : le lac est « froid » au thermomètre, mais son réservoir est géant : T = intensive (ne dépend pas de la quantité) ; U = extensive (masse comptée). Piège : « quantité de chaleur totale » : c'est U/Q : confondre T et Q fausse les raisonnements de mélange (les températures ne s'additionnent PAS).</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Pendant la fusion de la glace à 0 °C :", "c": ["rien ne se passe", "la température reste 0 °C (l'énergie casse les liaisons)", "la température monte", "la température descend"], "a": 1, "e": "Q = m·Lf : l'énergie sert au changement d'état, pas à l'agitation.", "d": "<b>La température reste 0 °C</b> : l'énergie sert à défaire le réseau.<div class='ex-detail'><u>Exemple rédigé</u> : expérience : glaçon dans une casserole sur le feu : thermomètre bloqué à 0 °C TANT QUE la glace reste : ensuite, la T remonte : l'énergie de fusion (Lf = 334 kJ/kg : 80× plus que chauffer 1 kg d'eau de 1 °C !) est un « péage » entre deux phases. Piège : « la température monte » : le mélange eau/glace est à T CONSTANTE pendant toute la fusion : l'énergie passe, le thermomètre ne bouge pas.</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "La conduction thermique se fait :", "c": ["par électronique", "par déplacement de matière", "par ondes", "de proche en proche sans déplacement de matière"], "a": 3, "e": "Les particules agitées cognent leurs voisines : l'énergie passe, la matière reste.", "d": "<b>De proche en proche, sans déplacement de matière</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience de la cuillère dans la soupe : le manche chauffe (conduction le long du métal) ; la soupe, elle, circule (convection) : la main brûlée par le manche METAL (bon conducteur) pas par le manche BOIS (isolant) : d'où les ustensiles à double matière. Piège : « par ondes » : c'est le RAYONNEMENT, troisième mode : conduction (contact fixe), convection (matière mobile), rayonnement (à distance/vide).</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Pourquoi l'eau est-elle un bon fluide caloporteur (radiateurs, centrales) ?", "c": ["elle est transparente", "elle est légère", "elle est gratuite", "sa capacité thermique est très élevée (elle stocke beaucoup par °C)"], "a": 3, "e": "c = 4185 J/(kg·°C) : 1 kg d'eau transporte ~4 kJ par degré.", "d": "<b>Sa capacité thermique est très élevée</b> : 4185 J/(kg·°C).<div class='ex-detail'><u>Exemple rédigé</u> : sens pratique : pour la MÊME masse et le MÊME ΔT, l'eau transporte ~4× plus d'énergie que l'air (c(air) = 1005) et ~4,6× plus que l'aluminium : un circuit d'eau chaude est un « camion » d'énergie compact : radiateurs et réacteurs nucléaires reposent dessus. Conséquence mondiale : les océans = régulateurs climatiques (lenteur à chauffer = lenteur à refroidir : les côtes ont des hivers doux).</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Un transfert thermique de 515 kJ est fourni par une résistance de 2000 W : durée ?", "c": ["51,5 s", "258 s", "2,6 s", "1 030 000 s"], "a": 1, "e": "t = Q/P = 515 000/2000 ≈ 258 s.", "d": "<b>≈ 258 s</b> (4,3 min).<div class='ex-detail'><u>Exemple rédigé</u> : le triangle du chauffage : t = Q/P : la puissance est un DÉBIT d'énergie (2000 J par seconde) : pour livrer 515 000 J, il faut 515 000/2000 secondes : la bouilloire réaliste (~4 min). Piège : « 51,5 s » : un facteur 10 (mauvaise conversion kJ→J) : toujours convertir les kJ en J AVANT la division : l'unité de P est le watt = J/s, pas kJ/s.</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Mélanger 1 L d'eau à 80 °C et 1 L à 20 °C (sans pertes) : T finale ?", "c": ["50 °C", "100 °C", "60 °C", "30 °C"], "a": 0, "e": "Mêmes masses, même c : moyenne des températures : 50 °C.", "d": "<b>50 °C</b> : l'équilibre se fait à la moyenne.<div class='ex-detail'><u>Exemple rédigé</u> : bilan : le chaud cède Q = m·c·(80−T) ; le froid reçoit Q = m·c·(T−20) : égalité (conservation) ⟹ 80−T = T−20 ⟹ 2T = 100 ⟹ T = 50 °C. Piège : « 100 °C » additionnerait : la température n'est pas une substance qui se cumule : c'est l'ÉNERGIE qui se conserve, puis la T d'équilibre en découle (la moyenne pondérée par les masses et les capacités).</div>"},
{"t": "Poids et gravitation (3e)", "q": "Un objet de 500 g. Son poids sur Terre (g = 9,8 N/kg) vaut :", "c": ["4,9 N", "4900 N", "500 N", "49 N"], "a": 0, "e": "m = 0,5 kg : P = 0,5 × 9,8 = 4,9 N.", "d": "<b>P = 4,9 N</b> après conversion : 500 g = 0,5 kg.<div class='ex-detail'><u>Exemple rédigé</u> : étape indispensable : convertir en kg AVANT la formule (500 g = 500/1000 = 0,5 kg). Puis P = 0,5 × 9,8 = 4,9 N. Contrôle d'ordre de grandeur : un demi-kilo pèse ~5 N : cohérent. Piège : « 4900 N » oublierait la conversion (500 × 9,8) : c'est LE réflexe de conversion à automatiser : grammes ⟶ kilogrammes d'abord, formule ensuite.</div>"}];
var currentChap = null;
var META_BY_ID = {}; var FICHE_BY_ID = {};
COURS_META.forEach(function(c){ META_BY_ID[c.id] = c; });
FICHES_DATA.forEach(function(f){ FICHE_BY_ID[f.id] = f.fiche; });

function chapHeadHTML(m){
  return '<div class="chap-head"><span class="chap-title">⚗️ Physique-chimie — ' + esc(m.titre) + '</span>' +
    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();
  if (t === 'quiz') {
    var bar = document.getElementById('quiz-chapbar');
    if (currentChap && META_BY_ID[currentChap]) { bar.innerHTML = chapHeadHTML(META_BY_ID[currentChap]); startTraining(META_BY_ID[currentChap].theme); }
    else { bar.innerHTML = ''; state.mode = 'menu'; render(); }
  }
  if (t === 'prog' || t === 'cours') window.scrollTo({top:0});
}
function clearChap(){ currentChap = null; }

function goCours(id){
  currentChap = id;
  showTab('cours');
  window.scrollTo({top:0, behavior:'smooth'});
}
function goCoursList(){ currentChap = null; showTab('cours'); }

function ficheHTML(id, num, open){
  var m = META_BY_ID[id]; var f = FICHE_BY_ID[id];
  return '<details class="fiche" id="fiche-' + id + '"' + (open ? ' open' : '') + '>' +
    '<summary><span class="fiche-num">' + num + '</span> Fiche — ' + esc(m.titre) + ' <span class="niv" style="font-size:.7rem;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-weight:700;margin-left:6px">' + esc(m.niveau) + '</span></summary>' +
    '<div class="fiche-body">' +
    '<div class="fiche-actions"><button class="btn-pdf" onclick="printFiche(\'' + id + '\')">🖨️ Imprimer</button><button class="btn-pdf" onclick="fichePDF(\'' + id + '\')">📄 PDF</button></div>' +
    '<div class="print-title">Fiche synthétique — ' + esc(m.titre) + ' (' + esc(m.niveau) + ')</div>' +
    f +
    '</div></details>';
}

function renderFiches(){
  var z = document.getElementById('fiches-zone'); var h = '';
  if (currentChap && FICHE_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += ficheHTML(currentChap, 1, true);
  } else {
    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
    var i = 1;
    FICHES_DATA.forEach(function(f){ h += ficheHTML(f.id, i); i++; });
  }
  z.innerHTML = h;
}

var PDF_CP1252 = { 0x2018:0x91, 0x2019:0x92, 0x201A:0x82, 0x201C:0x93, 0x201D:0x94, 0x201E:0x84, 0x2013:0x96, 0x2014:0x97, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x20AC:0x80, 0x0152:0x8C, 0x0153:0x9C, 0x0160:0x8A, 0x0161:0x9A, 0x0178:0x9F, 0x017D:0x8E, 0x017E:0x9E, 0x192:0x83, 0x2C6:0x88, 0x2032:0xB4, 0x2039:0x8B, 0x203A:0x9B, 0x201E2:0 };
function pdfTranslit(s){
  return s.replace(/\u2212|\u2013|\u2014/g, '-').replace(/[\u2032\u2019]/g, "'")
    .replace(/\u2192|\u21D2|\u21A6/g, '->').replace(/\u2190/g, '<-')
    .replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u2260/g, '!=').replace(/\u2248/g, '~')
    .replace(/\u2208/g, ' in ').replace(/\u2205/g, 'vide').replace(/\u2286/g, 'incl.')
    .replace(/\u221A/g, 'V').replace(/\u00B7|\u2219|\u22C5/g, '*').replace(/\u2022/g, '-')
    .replace(/\u2124/g, 'Z').replace(/\u211D/g, 'R').replace(/\u2115/g, 'N').replace(/\u2119/g, 'P')
    .replace(/\u00A0/g, ' ').replace(/\u202F|\u2009|\u200B|\uFE0F/g, '')
    .replace(/[\u2460-\u2468]/g, function(c){ return (c.charCodeAt(0) - 0x2460 + 1) + ')'; })
    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
}
function pdfEnc(s){
  var out = '';
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }
    else if (PDF_CP1252[c] !== undefined) b = PDF_CP1252[c];
    if (b !== null && b !== undefined) out += String.fromCharCode(b);
  }
  return out;
}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
var PDF_INLINE = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, SMALL:1, SUB:1, SUP:1, A:1, CODE:1, ABBR:1 };
function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';
    } else if (c.nodeType === 1){
      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }
      else if (g === 'B' || g === 'STRONG') pdfSegs(c, true, out);
      else pdfSegs(c, bold, out);
    }
  }
}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'li') segs = [{ t: '- ', b: bold || false }].concat(segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;
  function walk(n){
    for (var c = n.firstChild; c; c = c.nextSibling){
      if (c.nodeType === 3){
        var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;
        var cl = ' ' + (c.className || '') + ' ';
        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }
        emitP();
        if (/^H[1-6]$/.test(g)) emitBlock('h', c, indent);
        else if (g === 'LI') emitBlock('li', c, indent + 16);
        else if (g === 'UL' || g === 'OL') {
          for (var li = c.firstChild; li; li = li.nextSibling){
            if (li.nodeType === 1 && li.tagName === 'LI') { emitBlock('li', li, indent + 16); walk(li); }
          }
        }
        else if (g === 'TABLE' || g === 'THEAD' || g === 'TBODY'){
          for (var tr = c.firstChild; tr; tr = tr.nextSibling){
            if (tr.nodeType !== 1) continue;
            if (tr.tagName === 'TR'){
              var cells = [];
              for (var td = tr.firstChild; td; td = td.nextSibling){
                if (td.nodeType === 1 && (td.tagName === 'TD' || td.tagName === 'TH')){
                  var cs = []; pdfSegs(td, td.tagName === 'TH', cs);
                  cells.push(cs.map(function(x){ return x.t; }).join('').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
                }
              }
              var line = cells.join('   |   ');
              if (line.replace(/\s/g, '') !== '') blocks.push({ type: 'p', segs: [{ t: line, b: false }], indent: indent + 8 });
            } else if (tr.tagName === 'THEAD' || tr.tagName === 'TBODY') walk(tr);
          }
        }
        else if (g === 'P') { emitBlock('p', c, indent); }
        else { var keep = indent; walk(c); indent = keep; }
      }
    }
    emitP();
  }
  walk(root);
  return blocks;
}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    var isTitle = b.type === 'title';
    var size = isTitle ? 15 : (b.type === 'h' ? 12 : 10.5);
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [];
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) words.push({ br: true });
        p.split(' ').forEach(function(w){ if (w !== '') words.push({ w: w, b: s.b }); });
        if (pi < parts.length - 1) {} else { words.push({ sp: true, b: s.b }); }
      });
    });
    var cur = [], len = 0;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, gap: isTitle ? 0 : (b.type === 'h' ? 7 : 4) }); cur = []; len = 0; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      if (wd.sp) { continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
    if (isTitle) lines.push({ rule: true });
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var pages = [], cur = [], y = TOP;
  lines.forEach(function(ln){
    if (ln.rule){
      if (y - 14 < M) { pages.push(cur); cur = []; y = TOP; }
      y -= 12;
      cur.push('0.29 0.27 0.9 RG 1.5 w ' + M + ' ' + y.toFixed(2) + ' m ' + (W - M) + ' ' + y.toFixed(2) + ' l S\n0 0 0 RG 1 w');
      y -= 8;
      return;
    }
    var lh = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh < M) { pages.push(cur); cur = []; y = TOP; }
    y -= (ln.gap || 0);
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      var enc = pdfEnc(pdfTranslit(s.t));
      if (!enc) return;
      cur.push('BT 1 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Tm /F' + (s.b ? 2 : 1) + ' ' + ln.size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
      x += 0.52 * ln.size * enc.length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de physique-chimie</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + h + '</section>';
})();

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
