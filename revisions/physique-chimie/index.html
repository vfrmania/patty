{"t": "Atomes, ions et formules chimiques (3e)", "q": "L'ion hydroxyde OH⁻ est composé de :", "c": ["1 oxygène et 1 hydrogène", "1 or et 1 hydrogène", "1 oxygène seul", "2 hydrogènes et 1 oxygène"], "a": 0, "e": "O + H, charge globale −1 : ion polyatomique.", "d": "<b>1 oxygène + 1 hydrogène</b> (2 atomes, charge −1 : ion polyatomique).<div class='ex-detail'><u>Exemple rédigé</u> : l'ion hydroxyde OH⁻ est la signature des solutions BASIQUES (soude NaOH : Na⁺ + OH⁻ en solution). Ne pas confondre avec H₂O (eau, molécule neutre : 2 H + 1 O, aucune charge). Piège : le O et le H sont bien là, mais la CHARGE −1 appartient à l'ENSEMBLE des deux atomes : c'est un ion, pas une molécule.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "Test des ions chlorure Cl⁻ :", "c": ["soude ⟹ précipité vert", "rien à faire", "nitrate d'argent ⟹ précipité blanc", "chauffage ⟹ gaz"], "a": 2, "e": "AgNO₃ + Cl⁻ ⟹ AgCl blanc qui noircit à la lumière.", "d": "<b>Nitrate d'argent</b> ⟹ précipité BLANC de chlorure d'argent (noircit à la lumière).<div class='ex-detail'><u>Exemple rédigé</u> : dans une eau minérale : quelques gouttes de AgNO₃ : trouble blanc : les ions Cl⁻ sont présents. C'est aussi la base de la photo argentique (AgCl sensible à la lumière). Piège : la soude teste les cations MÉTALLIQUES (Fe²⁺ vert, Cu²⁺ bleu, Fe³⁺ rouille) : deux réactifs, deux familles d'ions : ne pas intervertir.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "Un atome neutre possède :", "c": ["autant de neutrons que de protons", "plus d'électrons", "plus de protons que d'électrons", "autant de protons que d'électrons"], "a": 3, "e": "Neutralité : Z protons (+) compensés par Z électrons (−).", "d": "<b>Autant de protons que d'électrons</b> : charges + et − se compensent exactement.<div class='ex-detail'><u>Exemple rédigé</u> : tout atome du tableau périodique : Z protons, Z électrons, charge nette nulle. Attention : le nombre de NEUTRONS n'a rien à voir avec la neutralité (les neutrons sont neutres, ils ne comptent pas dans la charge). Piège : « autant de neutrons que de protons » : c'est souvent vrai (C : 6 et 6) mais PAS toujours (Cl : 17 et 18) : la neutralité électrique, elle, est TOUJOURS protons = électrons.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "L'ion sulfate SO₄²⁻ contient au total :", "c": ["6 atomes", "4 atomes", "2 atomes", "5 atomes"], "a": 3, "e": "1 S + 4 O = 5 atomes, charge −2.", "d": "<b>5 atomes</b> : 1 soufre + 4 oxygènes.<div class='ex-detail'><u>Exemple rédigé</u> : lecture : S sans indice = 1 ; O₄ = 4 : total 5 atomes portant ensemble 2 charges négatives. Le sulfate est omniprésent : gypse (plâtre CaSO₄), sulfate de cuivre (fongicide bleu). Piège : « 4 atomes » oublierait le soufre en tête : dans les ions polyatomiques, on compte TOUS les atomes, indice par indice, comme pour les molécules.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "Cu²⁺ se forme quand l'atome de cuivre (Z = 29)…", "c": ["gagne 2 électrons", "perd 2 protons", "gagne 2 protons", "perd 2 électrons"], "a": 3, "e": "Cu²⁺ : 29 p, 27 e : charge +2 = perte de 2 électrons.", "d": "<b>Perd 2 électrons</b> : 29 p restants, 27 e : +2.<div class='ex-detail'><u>Exemple rédigé</u> : le cuivre Cu²⁺ donne la couleur BLEUE des solutions (sulfate de cuivre) et se dépose sur le fer dans le célèbre clou rouge devenu cuivré (Fe + Cu²⁺ ⟹ Fe²⁺ + Cu). Piège : « perd 2 protons » : 27 protons = COBALT : changer les protons change l'ÉLÉMENT : interdit en chimie : seuls les électrons transfèrent.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "Le numéro atomique Z correspond à :", "c": ["le nombre de protons (identité de l'élément)", "le nombre de liaisons", "la masse de l'atome", "le nombre de neutrons"], "a": 0, "e": "Z = protons : 6 = carbone, 17 = chlore, etc.", "d": "<b>Le nombre de protons</b> : la carte d'identité de l'élément.<div class='ex-detail'><u>Exemple rédigé</u> : Z = 6 ⟹ CARBONE, quel que soit le nombre de neutrons (C-12, C-14 : isotopes) ou d'électrons (C, C⁴⁺ : même élément). Piège : « la masse » : deux atomes de masses différentes (C-12 et C-14) peuvent être le MÊME élément : la masse dépend d'A (p + n), l'identité de Z (p) seul : deux informations différentes.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "Une solution de sel (Na⁺ + Cl⁻) conduit le courant parce que :", "c": ["les ions portent des charges mobiles", "le sel est métallique", "le verre conduit", "l'eau conduit"], "a": 0, "e": "Les ions libres se déplacent sous la tension : porteurs de charges mobiles.", "d": "<b>Les ions (charges mobiles) circulent</b> dans la solution sous l'effet de la tension.<div class='ex-detail'><u>Exemple rédigé</u> : expérience du circuit : lampe + solution : eau pure ⟹ lampe éteinte (pas de porteurs) ; sel dissous ⟹ lampe allumée : les Na⁺ vers une électrode, les Cl⁻ vers l'autre. Piège : « l'eau conduit » : l'eau PURE est isolante : c'est ce qu'on dissout (ions) qui conduit : d'où le danger de sèche-cheveux près du bain (l'eau du bain est PLEINE d'ions).</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Une transformation chimique se reconnaît à :", "c": ["un changement d'état", "un simple mélange", "un déplacement", "la formation de nouvelles substances"], "a": 3, "e": "Couleur, gaz, précipité, chaleur : de nouvelles espèces apparaissent.", "d": "<b>La formation de nouvelles substances</b> (produits ≠ réactifs).<div class='ex-detail'><u>Exemple rédigé</u> : indices observables : vinaigre + bicarbonate ⟹ effervescence (gaz CO₂) : chimique ; rouille : poudre brune nouvelle : chimique ; glace fond : H₂O identique : physique. Piège : « changement d'état » : fusion/ébullition conservent les molécules : physique : le critère est la NATURE des molécules, pas leur arrangement.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Équilibrer : H₂ + O₂ ⟶ H₂O donne :", "c": ["2 H₂ + 2 O₂ ⟶ H₂O", "H₂ + O₂ ⟶ H₂O", "2 H₂ + O₂ ⟶ 2 H₂O", "H₂ + 2 O₂ ⟶ 2 H₂O"], "a": 2, "e": "2 H₂ + O₂ ⟶ 2 H₂O : 4 H et 2 O de chaque côté.", "d": "<b>2 H₂ + O₂ ⟶ 2 H₂O</b> : comptage : gauche : 4 H, 2 O ; droite : 4 H, 2 O ✓.<div class='ex-detail'><u>Exemple rédigé</u> : méthode : H d'abord : 2 H₂O pour 4 H ; O ensuite : 2 H₂O contiennent 2 O = 1 O₂. Cette équation est celle de la synthèse de l'eau (et de la pile à hydrogène : énergie propre). Piège : « H₂ + O₂ ⟶ H₂O » : 2 O à gauche, 1 seul à droite : incohérence : un O aurait disparu : interdit par Lavoisier.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Dans une équation, on peut modifier :", "c": ["les coefficients devant les formules", "le sens de la flèche", "les symboles des éléments", "les indices des formules"], "a": 0, "e": "Seuls les COEFFICIENTS s'ajustent : les formules sont figées.", "d": "<b>Les coefficients</b> devant les formules (les indices sont intouchables).<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi : les indices décrivent la NATURE des molécules : H₂O (eau) et H₂O₂ (eau oxygénée) sont deux produits DIFFÉRENTS : changer un indice change l'espèce chimique : c'est la triche interdite. Le coefficient, lui, dit COMBIEN de molécules : ajustable librement. Piège : « 2 H₂O » (2 molécules d'eau) ≠ « H₂O₂ » (une molécule d'eau oxygénée) : un chiffre change de place : tout change de sens.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Combustion complète du méthane : CH₄ + … ⟶ CO₂ + 2 H₂O", "c": ["3 O₂", "2 O₂", "O₂", "4 O"], "a": 1, "e": "CH₄ + 2 O₂ ⟶ CO₂ + 2 H₂O : 4 O à droite, donc 2 O₂.", "d": "<b>2 O₂</b> : CH₄ + 2 O₂ ⟶ CO₂ + 2 H₂O.<div class='ex-detail'><u>Exemple rédigé</u> : comptage O : droite : CO₂ (2 O) + 2 H₂O (2 O) = 4 O ⟹ 2 O₂ à gauche. C : 1/1 ✓ ; H : 4/4 ✓. C'est la réaction de la gazinière : flamme bleue = complète ; flamme jaune + noir de la casserole = incomplète (suie + CO toxique). Piège : « O₂ » seul ne donnerait que 2 O : il en faut 4 : compter AVANT de choisir le coefficient.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "La conservation de la masse signifie :", "c": ["la masse peut varier de 10 %", "la masse des solides seulement se conserve", "masse des réactifs consommés = masse des produits formés", "la masse augmente toujours"], "a": 2, "e": "Rien ne se perd, rien ne se crée : même masse de chaque côté.", "d": "<b>m(réactifs consommés) = m(produits formés)</b> : comptage d'atomes ET de masse identiques.<div class='ex-detail'><u>Exemple rédigé</u> : 4 g de fer + 1,74 g d'O₂ ⟹ 5,74 g d'oxyde de fer : 5,74 = 4 + 1,74 ✓. Mais sur une balance OUVERTE : le flacon « gagne » (O₂ absorbé) ou « perd » (CO₂ envolé) : il faut CLOSE l'expérience pour la vérifier. Piège : « la masse augmente toujours » : seulement si le flacon pique un gaz de l'air : la masse TOTALE (tout compris) ne bouge JAMAIS.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Combien d'atomes d'oxygène à droite de : 3 CO₂ + 4 H₂O ?", "c": ["7", "6", "2", "10"], "a": 3, "e": "3×2 (CO₂) + 4×1 (H₂O) = 6 + 4 = 10 O.", "d": "<b>10 O</b> : 6 (des 3 CO₂) + 4 (des 4 H₂O).<div class='ex-detail'><u>Exemple rédigé</u> : c'est la clé de l'équilibrage du propane : C₃H₈ + ? O₂ ⟶ 3 CO₂ + 4 H₂O : il faut 10 O à gauche = 5 O₂ (5 × 2 = 10). Piège : « 7 » additionnerait les molécules (3 + 4) au lieu des ATOMES : on compte des atomes d'UN élément, jamais des molécules : 3 molécules de CO₂ contiennent 6 oxygènes, pas 3.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Une combustion incomplète (manque d'air) produit surtout :", "c": ["de l'eau pure", "de l'azote", "du monoxyde de carbone CO, toxique", "du méthane"], "a": 2, "e": "Carbone incomplètement oxydé ⟹ CO : gaz inodore et mortel.", "d": "<b>CO (monoxyde de carbone)</b> : inodore, invisible, mortel.<div class='ex-detail'><u>Exemple rédigé</u> : dans une chaudière mal réglée ou une pièce fermée : pas assez d'O₂ : le carbone s'arrête à CO au lieu de finir en CO₂. Le CO se fixe sur l'hémoglobine à la place de l'O₂ : asphyxie silencieuse (d'où les détecteurs obligatoires). Piège : CO₂ (dioxyde) n'est PAS toxique aux faibles doses (gaze à effet de serre, oui) : UNE lettre d'écart, deux réalités sanitaires opposées.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Effervescence du vinaigre + bicarbonate : le gaz formé est :", "c": ["du dioxyde de carbone CO₂", "du dihydrogène", "du dioxygène", "de l'azote"], "a": 0, "e": "Acide + carbonate ⟹ CO₂ : trouble l'eau de chaux.", "d": "<b>CO₂ (dioxyde de carbone)</b> : le gaz des réactions acide/carbonate.<div class='ex-detail'><u>Exemple rédigé</u> : test d'identification : l'eau de chaux se TROUBLE au contact du CO₂ : la signature du gaz (grotte de Padirac : CO₂ lourd qui stagne au fond). Autres exemples : pastilles effervescentes, pâte à cake qui gonfle (levure ⟹ CO₂). Piège : « dioxygène » : il FAIT brûler une allumette ; le CO₂, lui, l'ÉTEINT : un test simple sépare les deux gaz.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Le fer + sulfate de cuivre : le clou se couvre de cuivre rouge. C'est :", "c": ["une dissolution", "un alliage", "une transformation physique", "une transformation chimique (Fe + Cu²⁺ ⟹ Fe²⁺ + Cu)"], "a": 3, "e": "Nouvelles espèces formées (Fe²⁺, Cu métallique) : réaction chimique.", "d": "<b>Transformation chimique</b> : Fe + Cu²⁺ ⟹ Fe²⁺ + Cu.<div class='ex-detail'><u>Exemple rédigé</u> : observations : dépôt ROUGE de cuivre sur le clou, bleu de la solution qui pâlit (Cu²⁺ consommés, remplacés par des Fe²⁺ verts pâles). Les ions ont ÉCHANGÉ leurs électrons (Fe donne 2 e à Cu²⁺). Piège : « dissolution » : le fer ne SE SÉPARE pas, il SE REMPLACE : le clou maigrit, le cuivre se dépose : bilan d'atomes : nouvelles substances ⟹ chimique.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "La flèche ⟶ dans une équation signifie :", "c": ["une égalité de nombres", "« se transforme en » (sens réactifs ⟶ produits)", "un ajout d'énergie", "un équilibre des charges"], "a": 1, "e": "Les réactifs (à gauche) se transforment en produits (à droite).", "d": "<b>« Se transforme en »</b> : réactifs à gauche, produits à droite.<div class='ex-detail'><u>Exemple rédigé</u> : lecture de CH₄ + 2 O₂ ⟶ CO₂ + 2 H₂O : « le méthane ET le dioxygène SE TRANSFORMENT EN dioxyde de carbone et eau ». Ce n'est pas un « = » : on ne peut pas lire dans l'autre sens sans conditions (la combustion ne revient pas en arrière toute seule) : la flèche a un SENS, celui du temps de la réaction. Piège : « égalité » : la conservation porte sur les ATOMES, mais la nature des espèces CHANGE : la flèche dit le changement, les coefficients disent la conservation.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "L'ampèremètre se branche :", "c": ["en série dans la boucle", "aux bornes de la pile", "en dérivation", "n'importe où"], "a": 0, "e": "En SÉRIE : il doit être traversé par le courant qu'il mesure.", "d": "<b>En série</b>, dans la boucle.<div class='ex-detail'><u>Exemple rédigé</u> : logique : pour COMPTER les charges, il faut qu'elles passent À TRAVERS l'appareil : on ouvre le circuit, on insère l'ampèremètre. Piège : branché aux bornes de la pile (en dérivation), l'ampèremètre (petite résistance interne) se comporte comme un FIL : court-circuit : l'appareil peut être détruit : A = série, V = dérivation : le réflexe vital du chapitre.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "Loi d'Ohm pour une résistance :", "c": ["U = R / I", "U = R × I", "U = R + I", "U = I / R"], "a": 1, "e": "Tension = résistance × intensité (V = Ω × A).", "d": "<b>U = R × I</b> : la résistance multiplie l'intensité pour donner la tension.<div class='ex-detail'><u>Exemple rédigé</u> : R = 220 Ω, I = 0,05 A ⟹ U = 11 V. Contrôle d'unité : Ω × A = V ✓ (l'ohm est DEFINI comme V/A). Piège : « U = R/I » donnerait des V/A² : unité sans sens : la position de R et I dans la formule est un grand classique d'inversion : mémoriser le TRIANGLE U/R×I.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "R = 100 Ω, U = 12 V. L'intensité I vaut :", "c": ["12 A", "1200 A", "0,12 A", "0,012 A"], "a": 2, "e": "I = U/R = 12/100 = 0,12 A.", "d": "<b>0,12 A</b> : I = U ÷ R.<div class='ex-detail'><u>Exemple rédigé</u> : la résistance FREINE : plus elle est grande, plus le courant est petit : 12 V « poussés » à travers 100 Ω : il ne passe que 0,12 A. Test de cohérence : avec R = 50 Ω (moitié) : I = 0,24 A (double) : la proportionnalité inverse marche. Piège : « 1200 A » multiplierait : c'est le court-circuit absolu (R quasi nulle) : les ordres de grandeur sécurisent : quelques mA à quelques A dans les circuits d'école.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "En SÉRIE, la tension du générateur est :", "c": ["la même partout", "nulle", "divisée par le nombre de dipôles", "la somme des tensions des dipôles"], "a": 3, "e": "Additivité : U = U₁ + U₂ + …", "d": "<b>La somme des tensions</b> des dipôles : U(générateur) = U₁ + U₂.<div class='ex-detail'><u>Exemple rédigé</u> : pile 9 V + 2 lampes identiques en série : chacune reçoit 4,5 V (et brille moins que seule) ; avec 3 lampes : 3 V chacune : la tension se PARTAGE en série. Piège croisé : SÉRIE : I unique + U partagée ; DÉRIVATION : U unique + I partagée : apprendre le tableau en bloc, pas mot à mot.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "L'effet Joule correspond à :", "c": ["le stockage d'énergie", "l'aimantation", "la production de lumière seule", "la conversion électricité ⟶ chaleur dans une résistance"], "a": 3, "e": "Toute résistance traversée par un courant chauffe : radiateur, grille-pain, filament.", "d": "<b>La conversion électricité ⟶ chaleur</b> dans les résistances.<div class='ex-detail'><u>Exemple rédigé</u> : applications : grille-pain (alliage à forte résistance), radiateur, cumulus, fusible (il fond grâce à Joule !), ampoule à incandescence (filament à 2500 °C). Inconvénients : pertes en ligne, chauffe des processeurs (ventilateur obligatoire). Piège : ce n'est pas une « perte » mystérieuse : c'est une CONVERSION : l'énergie électrique ne disparaît pas, elle devient chaleur.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "Un fusible de 2 A protège une ligne. Une surintensité de 24 A survient :", "c": ["le fusible stocke le courant", "la ligne chauffe sans limite", "rien ne se passe", "le fusible fond et ouvre le circuit"], "a": 3, "e": "Le fusible FOND (maillon faible volontaire) : circuit ouvert : tout s'arrête.", "d": "<b>Le fusible fond</b> et coupe le circuit.<div class='ex-detail'><u>Exemple rédigé</u> : scénario complet : court-circuit ⟹ I = 24 A : le fil du fusible (calibré 2 A) échauffe et FOND en une fraction de seconde : la boucle s'ouvre : les câbles sont sauvés. C'est pour ça qu'on ne « répare » jamais un fusible avec du papier alu (retour au danger initial). Piège : « stocke » : un fusible ne stocke RIEN : il se SACRIFIE : il faut le REMPLACER après avoir trouvé la cause de la panne.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "Un dipôle traverse 2 A sous 230 V. Sa puissance :", "c": ["23 W", "232 W", "460 W", "115 W"], "a": 2, "e": "P = U × I = 230 × 2 = 460 W.", "d": "<b>460 W</b> : P = U × I.<div class='ex-detail'><u>Exemple rédigé</u> : application aux prises : un convecteur de 2000 W sur 230 V appelle I = P/U = 2000/230 ≈ 8,7 A : d'où les calibres des disjoncteurs (16 A par circuit). Piège : « P = U/I » ou « U − I » : la puissance est un PRODUIT : tension ET intensité contribuent ensemble : plus de tension OU plus d'intensité = plus de puissance.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "Le voltmètre mesure la tension aux bornes d'une lampe. Il affiche :", "c": ["la résistance de la lampe", "la différence de « pression » électrique entre ses deux bornes", "la puissance", "l'intensité qui la traverse"], "a": 1, "e": "La tension U = l'écart électrique entre les deux bornes (en volts).", "d": "<b>La différence de tension entre les deux bornes</b> de la lampe (en volts).<div class='ex-detail'><u>Exemple rédigé</u> : image hydraulique : la tension = l'écart de hauteur d'eau entre deux points (ce qui POUSSE) ; l'intensité = le débit (ce qui COULE). Le voltmètre compare les deux bornes (branché à cheval, en dérivation) ; l'ampèremètre compte le flux (en série). Piège : « la résistance » se calcule (R = U/I pour un ohmique) ou se mesure avec un OHMMÈTRE (appareil dédié, circuit hors tension).</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "On double la tension aux bornes d'une résistance. L'intensité :", "c": ["est divisée par 2", "double (I = U/R)", "quadruple", "reste la même"], "a": 1, "e": "Proportionnalité : I = U/R : U ×2 ⟹ I ×2 (R fixe).", "d": "<b>Elle double</b> : proportionnalité de I à U (à R constante).<div class='ex-detail'><u>Exemple rédigé</u> : la caractéristique I-U d'un conducteur ohmique est une DROITE passant par l'origine : pente = 1/R. Exemple : R = 100 Ω : 6 V ⟹ 0,06 A ; 12 V ⟹ 0,12 A ; 24 V ⟹ 0,24 A. Piège : « quadruple » : ce serait P = U×I avec U×2 ET I×2 : la puissance, elle, quadruple bien (0,72 W ⟹ 2,88 W) : d'où l'étincelle quand on suralimente.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "Un nœud reçoit 0,3 A et 0,2 A. L'intensité qui repart :", "c": ["0,5 A", "0,3 A", "0,1 A", "0,6 A"], "a": 0, "e": "Loi des nœuds : 0,3 + 0,2 = 0,5 A repart.", "d": "<b>0,5 A</b> : I(repart) = I₁ + I₂ = 0,5 A.<div class='ex-detail'><u>Exemple rédigé</u> : formulation complète : deux branches ARRIVENT au nœud (0,3 + 0,2 = 0,5 A), une seule REPART (0,5 A) : le courant ne s'accumule pas au nœud : tout ce qui entre ressort (comme des voitures à un rond-point). Piège : « 0,1 A » soustrairait : c'est le calcul inverse (trouver une branche manquante à partir du total) : ici on demande le TOTAL : addition.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "La formule de l'énergie cinétique est :", "c": ["Ec = ½ × m × v", "Ec = ½ × m × v²", "Ec = m × v²", "Ec = m × v"], "a": 1, "e": "Ec = ½ × m × v² (joules si kg et m/s).", "d": "<b>Ec = ½ × m × v²</b>.<div class='ex-detail'><u>Exemple rédigé</u> : voiture 1000 kg à 20 m/s : Ec = 0,5 × 1000 × 400 = 200 000 J = 200 kJ. Le « v² » explique TOUT le chapitre sécurité : doubler la vitesse quadruple l'énergie à dissiper au choc. Piège : « ½ × m × v » oublierait le carré : c'est la quantité de mouvement (p = mv), une AUTRE grandeur (de 1re/terminale) : en 3e, c'est Ec avec son carré.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "On double la vitesse d'une voiture. Son Ec est :", "c": ["quadruplée", "doublée", "divisée par 2", "la même"], "a": 0, "e": "Ec ∝ v² : v ×2 ⟹ Ec ×4.", "d": "<b>Quadruplée</b> : le carré fait le travail (2² = 4).<div class='ex-detail'><u>Exemple rédigé</u> : 1000 kg : à 14 m/s : Ec ≈ 98 kJ ; à 28 m/s : Ec ≈ 392 kJ : ×4. Et ×3 sur la vitesse = ×9 sur Ec : à 150 km/h, la voiture « pèse » 9 fois son choc de 50 km/h. Piège : « doublée » : intuition linéaire FAUSSE : le monde physique de l'énergie est quadratique : c'est LE point du chapitre, évalué à chaque contrôle.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "Ec d'une voiture de 800 kg à 25 m/s :", "c": ["10 000 J", "250 000 J", "20 000 J", "100 000 J"], "a": 1, "e": "½ × 800 × 625 = 250 000 J.", "d": "<b>250 000 J</b> : Ec = 0,5 × 800 × 25² = 0,5 × 800 × 625.<div class='ex-detail'><u>Exemple rédigé</u> : étapes : ① v² = 25² = 625 ; ② × m : 800 × 625 = 500 000 ; ③ × ½ : 250 000 J = 250 kJ. Ordre de grandeur : une voiture en ville contient des centaines de kJ : l'équivalent d'une chute de dizaines de mètres. Piège : « 20 000 J » oublierait le carré (800 × 25 × ½ = 10 000... non : sans carré : 10 000) : le carré d'abord, la moitié ensuite, JAMAIS dans le désordre.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "La distance d'arrêt est la somme :", "c": ["distance parcourue + longueur du véhicule", "freinage + accélération", "distance de réaction + distance de freinage", "vitesse + temps"], "a": 2, "e": "Réaction (le temps de décider) + freinage (le temps de s'arrêter).", "d": "<b>Réaction + freinage</b> : deux phases successives.<div class='ex-detail'><u>Exemple rédigé</u> : à 50 km/h : réaction (~1 s : 14 m parcourus sans freiner) + freinage (~10-15 m) ⟹ ~25-30 m d'arrêt. Piège : « freinage seul » oublie la SECONDE d'inattention : pendant que le cerveau décide, la voiture file à sa vitesse : c'est la phase la plus meurtrière du téléphone au volant.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "La distance de réaction dépend de :", "c": ["le poids de la voiture", "les freins", "l'état du conducteur (alcool, fatigue, téléphone)", "l'état de la route"], "a": 2, "e": "C'est le temps de réaction du CONDUCTEUR qui la fixe (× sa vitesse).", "d": "<b>De l'état du CONDUCTEUR</b> : sobriété, fatigue, attention.<div class='ex-detail'><u>Exemple rédigé</u> : à 90 km/h (25 m/s) : sobre : 1 s ⟹ 25 m ; alcool/fatigue : 2-3 s ⟹ 50-75 m AVANT le frein : la moitié d'un terrain de football en plus. Piège : l'état de la route et des freins jouent sur la distance de FREINAGE : réaction = humain, freinage = machine/route : la distinction est un classique d'examen.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "À 90 km/h (25 m/s), temps de réaction 1 s : distance de réaction ?", "c": ["9 m", "90 m", "25 m", "250 m"], "a": 2, "e": "d = v × t = 25 × 1 = 25 m.", "d": "<b>25 m</b> : la voiture file à sa vitesse pendant la seconde de réflexe.<div class='ex-detail'><u>Exemple rédigé</u> : règle express : d(réaction) = v en m/s × 1 s = la valeur de la vitesse en m/s. Piège : « 90 m » confond km/h et m/s : pendant 1 s à 90 km/h, on parcourt 25 m (pas 90 !) : la conversion ÷3,6 est le premier réflexe de TOUT calcul du chapitre.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "Pourquoi les zones 30 km/h en ville ?", "c": ["les voitures y vont mieux", "un piéton heurté à 30 a ~10 % de risque de décès (vs ~80 % à 50)", "la police le préfère", "pour économiser du carburant"], "a": 1, "e": "L'énergie du choc (v²) chute : le corps survit beaucoup mieux à 30 km/h.", "d": "<b>Le piéton survit à 30 km/h</b> : la statistique décroît avec v².<div class='ex-detail'><u>Exemple rédigé</u> : derrière le chiffre : Ec = ½mv² : à 30 km/h (8,3 m/s), le choc d'un piéton dissipe ~4 fois moins d'énergie qu'à 50 km/h : les lésions passent de « souvent mortelles » à « souvent survivables ». Piège : « économie de carburant » : effet réel mais secondaire : la ZONE 30 est une mesure de SANTÉ PUBLIQUE fondée sur la physique du v².</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "Un camion (20 t) et une voiture (1 t) à la même vitesse :", "c": ["impossible à comparer", "même Ec", "le camion a 20 fois plus d'Ec", "la voiture a plus d'Ec"], "a": 2, "e": "Ec ∝ m à vitesse égale : 20 × plus pour le camion.", "d": "<b>Le camion a 20 fois plus d'Ec</b> : proportionnalité simple en masse.<div class='ex-detail'><u>Exemple rédigé</u> : à 25 m/s : voiture 1 t : 312 kJ ; camion 20 t : 6250 kJ : 6 fois l'énergie d'une petite bombe. Conséquence routière : distance de freinage d'un camion bien plus longue (freins dimensionnés, mais l'inertie gagne) : doubler un camion qui freine = mauvais plan. Piège : à vitesse égale, c'est la masse qui fait la différence (×20) : à masse égale, c'est le carré de la vitesse (×4 pour v×2) : les deux leviers séparés.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "Convertir 72 km/h en m/s :", "c": ["200 m/s", "20 m/s", "26 m/s", "72 m/s"], "a": 1, "e": "72 ÷ 3,6 = 20 m/s.", "d": "<b>20 m/s</b> : ÷ 3,6.<div class='ex-detail'><u>Exemple rédigé</u> : avant TOUTE formule avec v, la conversion est OBLIGATOIRE : 50 km/h = 13,9 ; 90 = 25 ; 130 = 36,1 m/s. Ordre de grandeur autoroutier : ~10 m/s = 36 km/h : une voiture « fait » 10 à 40 m chaque seconde. Piège : oublier la conversion multiplie Ec par 3,6² ≈ 13 : un résultat 13 fois trop grand : l'ordre de grandeur (des centaines de kJ pour une voiture, pas des millions) sauve la mise.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "En cas de choc, les zones déformables de la voiture servent à :", "c": ["embellir le véhicule", "réduire le bruit", "absorber l'énergie en se déformant (à la place des passagers)", "rendre la voiture plus rapide"], "a": 2, "e": "La tôle qui se plie dissipe l'Ec : le temps d'arrêt s'allonge : force sur les corps réduite.", "d": "<b>Absorber l'énergie à la place des passagers</b> : la tôle se sacrifie.<div class='ex-detail'><u>Exemple rédigé</u> : logique : l'Ec doit disparaître : si la voiture est rigide, tout se passe en 0,02 s : forces ÉNORMES sur les corps ; si le capot se plie sur 0,5 m : l'arrêt dure 0,1-0,2 s : forces divisées par 5-10. La ceinture prolonge encore le temps, l'airbag amortit la tête : trio de survie. Piège : « voiture rigide = plus sûre » : archi-faux : la déformation programmée EST la sécurité (les voitures modernes se démolissent « bien »).</div>"},
{"t": "La matière à différentes échelles (2de)", "q": "L'ordre de grandeur de la taille d'un atome est :", "c": ["10⁻¹⁵ m", "10⁻⁵ m", "10⁻² m", "10⁻¹⁰ m"], "a": 3, "e": "Un atome ~ 10⁻¹⁰ m = 0,1 nm.", "d": "<b>10⁻¹⁰ m</b> (0,1 nanomètre).<div class='ex-detail'><u>Exemple rédigé</u> : repère des puissances de dix : noyau 10⁻¹⁵ ; atome 10⁻¹⁰ ; molécule ~10⁻⁹ ; virus 10⁻⁷ ; cheveu 10⁻⁴ ; humain 1. Piège : « 10⁻¹⁵ » : c'est le NOYAU (100 000 fois plus petit) : l'atome entier, avec son nuage électronique, c'est 10⁻¹⁰ : deux échelles à ne jamais confondre.</div>"},
{"t": "La matière à différentes échelles (2de)", "q": "0,00045 m en notation scientifique :", "c": ["45 × 10⁻⁵ m", "4,5 × 10⁻⁴ m", "0,45 × 10⁻³ m", "4,5 × 10⁴ m"], "a": 1, "e": "4,5 × 10⁻⁴ : un seul chiffre avant la virgule.", "d": "<b>4,5 × 10⁻⁴ m</b>.<div class='ex-detail'><u>Exemple rédigé</u> : règle : la virgule se place après le PREMIER chiffre significatif : 4,5 : puis on compte les rangs de déplacement (ici 4 vers la gauche) : 10⁻⁴. Piège : « 45 × 10⁻⁵ » a la bonne valeur mais une écriture INTERDITE : deux chiffres avant la virgule : la notation scientifique impose 1 ≤ a < 10 : les calculatrices l'affichent nativement (mode SCI).</div>"},
{"t": "La matière à différentes échelles (2de)", "q": "Si le noyau était une cerise de 1 cm, l'atome serait gros comme :", "c": ["une salle de classe (~10 m)", "la Terre", "une orange", "une ville (~1 km)"], "a": 3, "e": "Le rapport est ~10⁵ : 1 cm × 100 000 = 1 km.", "d": "<b>Une ville (~1 km)</b> : le noyau est 100 000 fois plus petit que l'atome.<div class='ex-detail'><u>Exemple rédigé</u> : calcul du rapport : 10⁻¹⁰ ÷ 10⁻¹⁵ = 10⁵ = 100 000. Cerise 1 cm ⟹ atome : 100 000 cm = 1 km. Conclusion vertigineuse : si l'atome fait 1 km, les électrons flottent à des centaines de mètres et le noyau tient dans votre main : la matière est ESSENTIELLEMENT VIDE (d'où la facilité des neutrons à traverser la Terre).</div>"},
{"t": "La matière à différentes échelles (2de)", "q": "Les isotopes d'un élément diffèrent par :", "c": ["le nombre de protons", "la couleur", "le nombre d'électrons", "le nombre de neutrons"], "a": 3, "e": "Même Z, A différent : seuls les neutrons changent.", "d": "<b>Le nombre de neutrons</b> : A = Z + N varie, Z fixe.<div class='ex-detail'><u>Exemple rédigé</u> : C-12 (6p, 6n) et C-14 (6p, 8n) : même CARBONE (Z = 6 : mêmes propriétés chimiques), masses différentes : le C-14 radioactif sert à dater les vestiges (archéologie). Piège : « nombre d'électrons » : ça, c'est l'ION (C⁴⁺) : trois mots de vocabulaire à trier : isotope ⟺ neutrons ; ion ⟺ électrons ; élément ⟺ protons.</div>"},
{"t": "La matière à différentes échelles (2de)", "q": "Le préfixe « nano » vaut :", "c": ["10⁻⁹", "10⁹", "10⁻⁶", "10⁻¹²"], "a": 0, "e": "nano = 10⁻⁹ (un milliardième).", "d": "<b>10⁻⁹</b> : un nanomètre = 10⁻⁹ m.<div class='ex-detail'><u>Exemple rédigé</u> : échelle des préfixes : nano 10⁻⁹, micro 10⁻⁶, milli 10⁻³, kilo 10³, méga 10⁶, giga 10⁹. Le nanomonde : les nanotechnologies manipulent les molécules une par une. Piège : « 10⁻¹² » = pico : et attention : un atome (0,1 nm = 10⁻¹⁰ m) est plus PETIT qu'un nanomètre : le nanomètre est l'échelle des molécules, pas des atomes.</div>"},
{"t": "La matière à différentes échelles (2de)", "q": "Le spectre d'un élément est :", "c": ["invisible", "un arc-en-ciel continu", "identique pour tous les éléments", "une signature unique (raies aux couleurs précises)"], "a": 3, "e": "Chaque élément émet/absorbe des raies caractéristiques : sa carte d'identité.", "d": "<b>Une signature unique</b> : raies lumineuses aux positions précises pour chaque élément.<div class='ex-detail'><u>Exemple rédigé</u> : application stellaire : les raies de l'hydrogène dans le spectre du Soleil ⟹ H présent dans son atmosphère (75 % de la masse visible de l'Univers). Au labo : flamme colorée (Na⁺ jaune, Cu²⁺ vert) : même logique. Piège : « arc-en-ciel continu » : c'est la lumière BLANCHE décomposée, sans information chimique : les RAIES (lignes fines) portent l'information.</div>"},
{"t": "La matière à différentes échelles (2de)", "q": "2 × 10⁶ × 3 × 10⁻³ =", "c": ["6 × 10⁻¹⁸", "6 × 10³", "5 × 10³", "6 × 10⁹"], "a": 1, "e": "2×3 = 6 ; 10⁶ × 10⁻³ = 10³ : 6 × 10³.", "d": "<b>6 × 10³</b> : on multiplie les mantisses (2×3) et on ADDITIONNE les exposants (6 + (−3) = 3).<div class='ex-detail'><u>Exemple rédigé</u> : les deux gestes : ① nombres à part : 2 × 3 = 6 ; ② puissances à part : 10⁶ × 10⁻³ = 10⁶⁻³ = 10³. Pour la division : on SOUSTRAIT les exposants (10⁶ ÷ 10³ = 10³). Piège : « 6 × 10⁹ » multiplierait les exposants : les exposants s'additionnent en produit, jamais ne se multiplient (sauf puissance de puissance : (10³)² = 10⁶).</div>"},
{"t": "La matière à différentes échelles (2de)", "q": "La masse d'un atome est concentrée dans :", "c": ["le nuage électronique", "les liaisons", "le vide", "le noyau (~99,9 %)"], "a": 3, "e": "Protons et neutrons pèsent ~1836 fois plus qu'un électron chacun.", "d": "<b>Le noyau</b> : ~99,9 % de la masse dans 10⁻¹⁵ m.<div class='ex-detail'><u>Exemple rédigé</u> : comparaison : proton = 1 u, électron = 1/1836 u : le nuage ne pèse presque RIEN : si l'atome pesait 1 tonne, le noyau en ferait 999 kg. Conséquence : la masse d'un atome ≈ A × masse d'un nucléon : c'est la clé des calculs de moles. Piège : le vide de l'atome est massif PAR le noyau : « surtout vide » (volume) et « masse au noyau » : les deux ensemble.</div>"},
{"t": "La matière à différentes échelles (2de)", "q": "L'élément le plus abondant de l'Univers visible est :", "c": ["l'hydrogène", "l'oxygène", "le fer", "le carbone"], "a": 0, "e": "~75 % de la masse visible : l'hydrogène, né du Big Bang.", "d": "<b>L'hydrogène</b> : ~75 % de la masse visible (~90 % des atomes).<div class='ex-detail'><u>Exemple rédigé</u> : hiérarchie cosmique : H ~75 %, He ~24 %, tout le reste ~1 % (dont C, O, Fe : fabriqués dans les étoiles). Notre corps (fait de C, O, H, N) utilise des atomes de étoiles explosées : « nous sommes poussières d'étoiles » : littéralement. Piège : « le fer » : c'est le plus STABLE (fin de fusion des grosses étoiles), pas le plus abondant.</div>"},
{"t": "La matière à différentes échelles (2de)", "q": "Le diamètre d'une molécule est de l'ordre de :", "c": ["1 nm (10⁻⁹ m)", "10⁻¹⁵ m", "1 mm", "1 µm"], "a": 0, "e": "Quelques nanomètres : mille fois plus gros qu'un noyau.", "d": "<b>1 nanomètre</b> (10⁻⁹ m, quelques dizaines pour les grosses).<div class='ex-detail'><u>Exemple rédigé</u> : échelle : atome 10⁻¹⁰ ; petite molécule (H₂O) ~3×10⁻¹⁰ ; ADN ~2 nm de large ; virus ~100 nm ; bactérie ~1 µm ; cellule ~10 µm ; cheveu ~100 µm. Piège : « 1 µm » : c'est la bactérie : la molécule est 1000 fois plus petite : le nanomètre, c'est l'échelle de la CHIMIE ; le micromètre, celle de la BIOLOGIE cellulaire.</div>"},
{"t": "La mole et la concentration (2de)", "q": "Une mole contient environ :", "c": ["6,02 × 10²³ entités", "10²³ grammes", "1 litre", "600 entités"], "a": 0, "e": "Constante d'Avogadro : 6,02 × 10²³ par mole.", "d": "<b>6,02 × 10²³ entités</b> (constante d'Avogadro).<div class='ex-detail'><u>Exemple rédigé</u> : image : une mole de grains de riz couvrirait la France sur plusieurs kilomètres d'épaisseur : le nombre est AU DELÀ de l'intuition : il rejoint le monde de l'infiniment nombreux, comme les atomes sont l'infiniment petit. Piège : « 10²³ grammes » : la mole compte des ENTITÉS, pas une masse : la masse d'une mole dépend de l'espèce (18 g pour l'eau, 44 g pour CO₂).</div>"},
{"t": "La mole et la concentration (2de)", "q": "La masse molaire de l'eau H₂O (H : 1, O : 16) est :", "c": ["20 g/mol", "17 g/mol", "18 g/mol", "16 g/mol"], "a": 2, "e": "2×1 + 16 = 18 g/mol.", "d": "<b>18 g/mol</b> : 2 H (2×1) + 1 O (16).<div class='ex-detail'><u>Exemple rédigé</u> : méthode : lister les atomes avec leurs indices, multiplier par leur M, additionner : H₂O : 2×1 + 1×16 = 18. Autres classiques : CO₂ : 12 + 2×16 = 44 ; NaCl : 23 + 35,5 = 58,5 ; glucose C₆H₁₂O₆ : 72 + 12 + 96 = 180 g/mol. Piège : « 17 » additionnerait 1 + 16 en oubliant que l'indice 2 double l'hydrogène.</div>"},
{"t": "La mole et la concentration (2de)", "q": "9 g d'eau (M = 18 g/mol) représentent :", "c": ["0,5 mol", "2 mol", "18 mol", "9 mol"], "a": 0, "e": "n = m/M = 9/18 = 0,5 mol.", "d": "<b>0,5 mol</b> : n = m ÷ M.<div class='ex-detail'><u>Exemple rédigé</u> : le triangle : n en bas ? Non : n = m/M avec m AU-DESSUS : n = 9/18 = 0,5 mol : soit 0,5 × 6,02×10²³ ≈ 3×10²³ molécules d'eau dans un fond de verre. Piège : « 9 mol » diviserait à l'envers (m×M) : ordre de grandeur : une mole d'eau = 18 mL : un petit fond de verre : les moles se comptent en UNITÉS par verre, pas en centaines.</div>"},
{"t": "La mole et la concentration (2de)", "q": "0,2 mol de sucre dans 500 mL. La concentration est :", "c": ["100 mol/L", "0,1 mol/L", "0,4 mol/L", "0,2 mol/L"], "a": 2, "e": "C = n/V = 0,2/0,5 = 0,4 mol/L (V en litres !).", "d": "<b>0,4 mol/L</b> : C = n/V avec V = 0,5 L.<div class='ex-detail'><u>Exemple rédigé</u> : étape clé : convertir 500 mL = 0,5 L AVANT la division : C = 0,2/0,5 = 0,4 mol/L. Contrôle de sens : un demi-litre contient 0,2 mol : UN litre (le double) en contiendrait 0,4 ✓. Piège : « 0,2 mol/L » oublierait la conversion (0,2/500 = 0,0004) : le millilitre détruit le calcul si on ne le convertit pas : réflexe n°1 du chapitre.</div>"},
{"t": "La mole et la concentration (2de)", "q": "Dilution : C₀ = 2 mol/L, V₀ = 10 mL, V(final) = 100 mL. C(fille) ?", "c": ["2 mol/L", "20 mol/L", "0,2 mol/L", "0,02 mol/L"], "a": 2, "e": "C = C₀V₀/V = 2×0,01/0,1 = 0,2 mol/L (facteur 10).", "d": "<b>0,2 mol/L</b> : dilution d'un facteur 10 (100/10).<div class='ex-detail'><u>Exemple rédigé</u> : deux voies : ① formule : C = C₀×V₀/V = 2 × 10/100 = 0,2 mol/L ; ② logique : la fiole est 10 fois plus grande que le prélèvement : concentration 10 fois plus petite. Piège : « 20 mol/L » inverserait le facteur (concentrer au lieu de diluer) : ajouter de l'eau DIMINUE toujours la concentration, jamais l'inverse.</div>"},
{"t": "La mole et la concentration (2de)", "q": "Lors d'une dilution, la quantité qui ne change pas est :", "c": ["le volume", "la masse d'eau", "la quantité de soluté prélevée", "la concentration"], "a": 2, "e": "On ajoute de l'eau : le soluté reste le même : C₀V₀ = CV.", "d": "<b>La quantité de soluté</b> : l'eau s'ajoute, le soluté se conserve.<div class='ex-detail'><u>Exemple rédigé</u> : image : 10 mL de sirop dans une grande bouteille d'eau : il y a TOUJOURS le sirop des 10 mL initiaux, juste réparti dans 100 mL : moins sucré au litre, autant de sirop au total. C'est le principe de conservation qui fonde C₀V₀ = CV. Piège : « le volume » change évidemment, « la concentration » chute : seul le soluté est l'invariant du problème.</div>"},
{"t": "La mole et la concentration (2de)", "q": "Une solution contient 4 g/L de soluté (M = 40 g/mol). Sa concentration molaire :", "c": ["4 mol/L", "160 mol/L", "0,1 mol/L", "0,04 mol/L"], "a": 2, "e": "C = C_m/M = 4/40 = 0,1 mol/L.", "d": "<b>0,1 mol/L</b> : C = C_m ÷ M.<div class='ex-detail'><u>Exemple rédigé</u> : chaîne logique : 4 g/L ÷ 40 g/mol = 0,1 mol/L : chaque litre porte 0,1 mole (soit 6×10²² molécules). Autre chemin : n = m/M par litre : 4/40 = 0,1 mol dans 1 L ⟹ 0,1 mol/L : même résultat, deux routes. Piège : « 160 » multiplierait : g/L ÷ (g/mol) donne des mol/L : la division des unités se lit comme une fraction : attention à l'ordre.</div>"},
{"t": "La mole et la concentration (2de)", "q": "Préparer 50 mL de solution à 0,1 mol/L à partir d'une mère à 1 mol/L :", "c": ["prélever 5 mL de mère et compléter à 50 mL", "prélever 10 mL", "prélever 50 mL de mère", "verser la mère direct"], "a": 0, "e": "V₀ = CV/C₀ = 0,1×50/1 = 5 mL, fiole jaugée 50 mL.", "d": "<b>Prélever 5 mL, compléter à 50 mL</b> (fiole jaugée).<div class='ex-detail'><u>Exemple rédigé</u> : calcul : V₀ = C×V/C₀ = 0,1 × 50/1 = 5 mL : facteur de dilution 10 : la mère est 10× plus concentrée : il en faut 10× moins. Protocole propre : pipette jaugée 5 mL ⟹ fiole jaugée 50 mL ⟹ eau au trait ⟹ boucher, retourner, homogénéiser. Piège : « prélever 50 mL » ne dilue RIEN (mêmes concentrations) : le prélèvement se calcule, il ne se devine pas.</div>"},
{"t": "La mole et la concentration (2de)", "q": "Le nombre de molécules dans 1 mol de CO₂ :", "c": ["44 × 6,02 × 10²³", "3 atomes", "44", "6,02 × 10²³"], "a": 3, "e": "Une mole : toujours 6,02×10²³ entités, quelle que soit l'espèce.", "d": "<b>6,02 × 10²³ molécules</b> (toujours, pour toute espèce).<div class='ex-detail'><u>Exemple rédigé</u> : la constante d'Avogadro est UNIVERSELLE : 1 mol d'eau, 1 mol de CO₂, 1 mol d'atomes de fer : 6,02×10²³ entités à chaque fois. Ce qui CHANGE : la masse (18 g, 44 g, 56 g). Piège : « 44 × N_A » : ce serait le nombre d'ATOMES dans 44 mol... non : 44 est la MASSE molaire (g/mol), pas un nombre d'entités : 1 mol de CO₂ contient 3 moles d'ATOMES (1 C + 2 O), mais 6,02×10²³ MOLÉCULES.</div>"},
{"t": "La mole et la concentration (2de)", "q": "Concentration massique de 2,5 g de sel dans 200 mL :", "c": ["12,5 g/L", "0,5 g/L", "500 g/L", "5 g/L"], "a": 0, "e": "C_m = m/V = 2,5/0,2 = 12,5 g/L.", "d": "<b>12,5 g/L</b> : m/V avec V = 0,2 L.<div class='ex-detail'><u>Exemple rédigé</u> : conversion : 200 mL = 0,2 L : C_m = 2,5/0,2 = 12,5 g/L. Sens physique : un litre de cette eau contiendrait 12,5 g de sel (à comparer au sérum physiologique : 9 g/L : cette solution est plus salée que le sérum). Piège : « 0,5 g/L » diviserait par 200 sans conversion (2,5/200) : mille fois d'erreur : le millilitre → litre est LE réflexe à automatiser.</div>"},
{"t": "Forces et principe d'inertie (2de)", "q": "Le poids d'un objet de 3 kg sur Terre (g ≈ 10 N/kg) :", "c": ["30 N", "0,3 N", "3 N", "3 kg"], "a": 0, "e": "P = m × g = 3 × 10 = 30 N.", "d": "<b>30 N</b> : P = m × g.<div class='ex-detail'><u>Exemple rédigé</u> : la masse (3 kg) est la quantité de matière : identique partout ; le poids (30 N) est la FORCE d'attraction terrestre : sur la Lune : 3 × 1,6 ≈ 4,8 N. Piège : « 3 kg » n'est pas une force : les newtons mesurent les forces, les kilogrammes les masses : dire « je pèse 60 kg » est un abus de langage (je MASSE 60 kg, je PÈSE ~590 N).</div>"},
{"t": "Forces et principe d'inertie (2de)", "q": "D'après le principe d'inertie, si les forces se compensent, le corps est :", "c": ["immobile seulement", "immobile OU en mouvement rectiligne uniforme", "au repos forcément", "en mouvement circulaire"], "a": 1, "e": "Deux possibilités : repos OU mouvement rectiligne uniforme.", "d": "<b>Immobile OU en mouvement rectiligne uniforme</b>.<div class='ex-detail'><u>Exemple rédigé</u> : deux cas, un seul principe : la sonde Voyager, hors de toute influence, file en ligne droite à vitesse constante depuis 45 ans : forces nulles = mouvement entretenu. Idem pour un livre posé : forces compensées = repos. Piège : « immobile seulement » : l'intuition aristotélicienne (« pas de moteur = arrêt ») : FAUX : l'inertie CONTINUE le mouvement : l'arrêt vient d'une force (frottement), pas de l'absence de force.</div>"},
{"t": "Forces et principe d'inertie (2de)", "q": "Une voiture tourne à vitesse constante. Les forces :", "c": ["sont nulles", "se compensent", "ne se compensent pas (le mouvement change de direction)", "disparaissent"], "a": 2, "e": "La direction change ⟹ le mouvement n'est PAS rectiligne uniforme ⟹ force non compensée (vers le centre du virage).", "d": "<b>Elles ne se compensent pas</b> : virer = changer de direction = modification du mouvement.<div class='ex-detail'><u>Exemple rédigé</u> : en virage, la route exerce une force vers L'INTÉRIEUR du virage (adhérence des pneus) : sans elle (verglas !), la voiture continue TOUT DROIT : elle ne « dérape vers l'extérieur » pas par une force centrifuge mystérieuse, mais parce que l'inertie la maintient sur sa ligne droite faute de force pour la dévier. Piège : « vitesse constante ⟹ compensées » : il faut aussi TRAJECTOIRE droite : circulaire uniforme = forces NON compensées.</div>"},
{"t": "Forces et principe d'inertie (2de)", "q": "Une force est représentée par :", "c": ["un nombre", "une courbe", "un cercle", "un vecteur (flèche)"], "a": 3, "e": "Point d'application, direction, sens, valeur : le vecteur code tout.", "d": "<b>Un vecteur</b> (une flèche orientée).<div class='ex-detail'><u>Exemple rédigé</u> : les 4 caractéristiques : ① point d'application (où ça pousse) ; ② direction (la droite support) ; ③ sens (vers où sur cette droite) ; ④ valeur en newtons (longueur selon une échelle : ex. 1 cm ⟺ 5 N). Piège : « un nombre » : 20 N ne suffit pas : pousser vers le nord ou vers le bas de 20 N ne produit PAS le même effet : la géométrie fait partie de l'information.</div>"},
{"t": "Forces et principe d'inertie (2de)", "q": "Un objet est en mouvement rectiligne uniforme. On peut affirmer :", "c": ["il accélère", "une seule force agit", "les forces se compensent", "aucune force n'agit"], "a": 2, "e": "Soit aucune force (cas idéal), soit plusieurs qui S'ANNULENT : résultante nulle.", "d": "<b>Les forces se compensent</b> (somme vectorielle nulle).<div class='ex-detail'><u>Exemple rédigé</u> : deux scénarios conformes : le vide spatial parfait (zéro force) OU le palet sur glace (poids ↓ compensé par réaction ↑, frottement négligeable). Le livre posé sur la table : pareil : poids + réaction = 0 : il ne bouge pas. Piège : « aucune force n'agit » : possible mais rare sur Terre (il y a TOUJOURS le poids) : la formulation exacte est la COMPENSATION : plusieurs forces, résultante nulle.</div>"},
{"t": "Forces et principe d'inertie (2de)", "q": "Sur la Lune, un astronaute de 70 kg « pèse » environ :", "c": ["~113 N", "~686 N", "0 N", "70 N"], "a": 0, "e": "g(Lune) ≈ 1,6 N/kg : P = 70 × 1,6 ≈ 113 N.", "d": "<b>≈ 113 N</b> : 70 × 1,6 (g lunaire).<div class='ex-detail'><u>Exemple rédigé</u> : comparaison : Terre : 70 × 9,81 ≈ 686 N : la Lune divise le poids par 6 : d'où les bonds gigantesques des missions Apollo : MÊME masse (70 kg : même inertie, même effort pour accélérer), mais il faut lutter contre une attraction 6 fois moindre. Piège : « 0 N » : la Lune ATTIRE (elle a une masse) : le poids lunaire est faible, pas nul : 0 N, c'est l'espace profond loin de tout.</div>"},
{"t": "Forces et principe d'inertie (2de)", "q": "Une action mécanique peut s'exercer à distance. Exemple :", "c": ["une main serre une poignée", "un aimant attire un clou", "le vent pousse une porte", "un pied frappe un ballon"], "a": 1, "e": "L'aimant agit sans contact : action à distance (comme le poids, les forces électriques).", "d": "<b>L'aimant attire le clou</b> : action à distance.<div class='ex-detail'><u>Exemple rédigé</u> : les deux familles : CONTACT (raquette-balle, vent, main) ; À DISTANCE (poids : la Terre attire sans toucher ; aimant ; forces électriques entre charges ; marées : la Lune à 385 000 km déplace les océans). Piège : « le vent » semble « à distance » mais c'est du CONTACT : les molécules d'air FRAPPENT la porte : la preuve : pas d'air, pas de vent poussant (vide spatial).</div>"},
{"t": "Forces et principe d'inertie (2de)", "q": "Un livre posé sur une table est immobile parce que :", "c": ["la table est adhérente", "le poids et la réaction de la table se compensent", "la gravité est éteinte", "il n'a pas de poids"], "a": 1, "e": "P ↓ + R ↑ = 0 : forces compensées ⟹ immobilité (principe d'inertie).", "d": "<b>Poids et réaction se compensent</b> : résultante nulle ⟹ repos.<div class='ex-detail'><u>Exemple rédigé</u> : bilan : le livre subit SON POIDS (verticale, vers le bas, application au centre) et la RÉACTION de la table (verticale, vers le haut, appliquée à la surface de contact) : P = R en valeur, sens opposés : somme nulle : le livre ne s'enfonce pas et ne décolle pas : c'est le cas le plus simple du principe d'inertie, à savoir redessiner les yeux fermés.</div>"},
{"t": "Forces et principe d'inertie (2de)", "q": "Un objet lancé dans l'espace profond, loin de tout, sans frottement :", "c": ["ralentit puis revient", "continue en ligne droite à vitesse constante", "tourne sur lui-même", "s'arrête doucement"], "a": 1, "e": "Aucune force ⟹ mouvement rectiligne uniforme : l'inertie perpétuelle.", "d": "<b>Il continue en ligne droite à vitesse constante</b> : éternellement.<div class='ex-detail'><u>Exemple rédigé</u> : le cas réel : Voyager 1 : lancée en 1977, elle file à ~17 km/s, à plus de 24 milliards de km : plus assez de carburant depuis des décennies : c'est l'INERTIE qui la porte. Piège : « s'arrête doucement » : l'intuition du quotidien (frottements : air, sol) FAIT DÉFAUT dans le vide : sur Terre, tout finit par s'arrêter PARCE QUE les forces de frottement existent : dans l'espace, rien ne freine.</div>"},
{"t": "Forces et principe d'inertie (2de)", "q": "g sur Terre vaut environ :", "c": ["9,81 N/kg", "98,1 N/kg", "1,6 N/kg", "10 kg/N"], "a": 0, "e": "g ≈ 9,81 N/kg (souvent arrondi 10) : c'est l'intensité de la pesanteur.", "d": "<b>≈ 9,81 N/kg</b> (arrondi 10 en exercices).<div class='ex-detail'><u>Exemple rédigé</u> : g compare les planètes : Terre 9,81 ; Lune 1,6 (÷6) ; Mars 3,7 (÷2,6) ; Jupiter 25 (vous « pèseriez » 175 kg en newtons !... sans pouvoir bouger). Piège : « 10 kg/N » : l'unité est inversée : g multiplie des kg pour donner des N : N/kg, dans cet ordre. Piège jumeau : g n'est PAS « la gravité » en général, mais l'intensité locale de la pesanteur (elle diminue avec l'altitude).</div>"},
{"t": "Ondes sonores et lumineuses (2de)", "q": "Une onde transporte :", "c": ["du vide", "de l'énergie (sans transporter de matière)", "des atomes", "de la matière"], "a": 1, "e": "La perturbation voyage ; le milieu vibre sur place.", "d": "<b>De l'énergie</b> (et de l'information), pas de matière.<div class='ex-detail'><u>Exemple rédigé</u> : la ola : chaque spectateur se lève/se rassied sur place : PERSONNE ne traverse le stade, mais la vague fait le tour : le son pareil : l'air du hautbois n'arrive pas à votre oreille : seul le MESSAGE y parvient. Piège : « des atomes » : si le vent pousse des feuilles, c'est un COURANT (matière en mouvement), pas une onde : onde = relais de proche en proche.</div>"},
{"t": "Ondes sonores et lumineuses (2de)", "q": "λ = v/f. Un son de 100 Hz à 340 m/s a pour longueur d'onde :", "c": ["0,34 m", "3,4 m", "34 m", "34 000 m"], "a": 1, "e": "λ = 340/100 = 3,4 m.", "d": "<b>3,4 m</b> : λ = v ÷ f.<div class='ex-detail'><u>Exemple rédigé</u> : sens physique : pendant UNE période (T = 1/100 s), le son parcourt 340 × 0,01 = 3,4 m : λ = la distance entre deux crêtes de compression. Les sons graves (λ longs) contournent les obstacles ; les aigus (λ courts) sont arrêtés : d'où l'effet « sono derrière un mur : on entend la basse ». Piège : « 0,34 » : un facteur 10 (340/1000) : bien poser la division v/f, pas v×f.</div>"},
{"t": "Ondes sonores et lumineuses (2de)", "q": "f = 1/T. Si T = 2 ms, la fréquence vaut :", "c": ["500 Hz", "2 Hz", "200 Hz", "50 Hz"], "a": 0, "e": "T = 0,002 s : f = 1/0,002 = 500 Hz.", "d": "<b>500 Hz</b> : f = 1/T avec T en secondes.<div class='ex-detail'><u>Exemple rédigé</u> : étape obligatoire : 2 ms = 0,002 s : f = 1/0,002 = 500 Hz (un si médium). Piège : « 2 Hz » : diviser par 2 sans convertir : la période se convertit en SECONDES avant l'inverse : le milliseconde est là pour piéger : 2 ms ⟹ 500 Hz, jamais 2 Hz ou 0,002 Hz.</div>"},
{"t": "Ondes sonores et lumineuses (2de)", "q": "Le retard d'un signal parcourant 3 km à 3×10⁸ m/s :", "c": ["10 s", "10 ms", "10 µs", "1 ms"], "a": 2, "e": "τ = 3000/3×10⁸ = 10⁻⁵ s = 10 µs.", "d": "<b>10 µs</b> : τ = d/v = 3×10³ / 3×10⁸ = 10⁻⁵ s.<div class='ex-detail'><u>Exemple rédigé</u> : manipulation des puissances : 10³/10⁸ = 10⁻⁵ s = 10 microsecondes. Application réelle : la fibre optique Internet : Paris-Lyon (400 km) : ~2 ms : le ping : c'est ce retard qui fait laguer les jeux en ligne transcontinentaux (le satellite géostationnaire : 500 ms aller-retour !). Piège : « 10 s » : oublier la puissance (3000/3 = 1000... puis diviser par 10⁸ !) : la lumière est LIMITE instantanée à notre échelle, mais pas en télécoms.</div>"},
{"t": "Ondes sonores et lumineuses (2de)", "q": "Une onde mécanique (le son) NE PEUT PAS se propager :", "c": ["dans l'air", "dans l'acier", "dans le vide", "dans l'eau"], "a": 2, "e": "Le vide n'a rien à vibrer : silence total.", "d": "<b>Dans le vide</b> : une onde mécanique exige un milieu matériel.<div class='ex-detail'><u>Exemple rédigé</u> : hiérarchie des vitesses du son : air 340 m/s ; eau 1500 ; acier ~6000 (les Indiens posaient l'oreille sur les rails !) : plus le milieu est rigide, plus le son va vite... et dans le vide : nulle part : 0 m/s : l'expérience de la cloche à vide le démontre en 30 secondes. Piège : la lumière, elle, TRAVERSE le vide : deux familles d'ondes, deux règles.</div>"},
{"t": "Ondes sonores et lumineuses (2de)", "q": "La lumière est une onde :", "c": ["de matière", "mécanique", "électromagnétique", "sonore"], "a": 2, "e": "Champ électromagnétique qui se propage : même famille que la radio et les X.", "d": "<b>Électromagnétique</b> : pas besoin de milieu.<div class='ex-detail'><u>Exemple rédigé</u> : le spectre complet : radio (λ kilométriques) → micro-ondes → infrarouge → LUMIÈRE (400-800 nm) → ultraviolets → X → gamma : même nature, longueurs d'onde différentes : la lumière visible est une minuscule fenêtre du grand famille. Piège : « mécanique » : la lumière traverse le vide interstellaire : elle ne peut PAS être mécanique : les ondes mécaniques (son, séismes) s'arrêtent aux frontières de la matière.</div>"},
{"t": "Ondes sonores et lumineuses (2de)", "q": "Le sonar mesure la profondeur : écho reçu 0,8 s après émission (v = 1500 m/s). Profondeur ?", "c": ["1875 m", "600 m", "1500 m", "1200 m"], "a": 1, "e": "τ/2 = 0,4 s : d = 1500 × 0,4 = 600 m.", "d": "<b>600 m</b> : diviser le retard par 2 (aller-retour), puis d = v × t.<div class='ex-detail'><u>Exemple rédigé</u> : le piège récurrent : le son parcourt DEUX fois la profondeur : sans division : 1200 m (le double). Même logique que l'échographie (médecine) et du radar (contrôles routiers : le signal part et revient). Piège : « 1500 m » copierait la vitesse : réflexe de test : le résultat doit être COHÉRENT (une mer de 1200 m est plausible, mais le protocole impose la demi-division).</div>"},
{"t": "Ondes sonores et lumineuses (2de)", "q": "Une onde FM de 100 MHz (3×10⁸ m/s) a pour λ :", "c": ["300 m", "3 m", "30 m", "0,3 m"], "a": 1, "e": "λ = 3×10⁸/10⁸ = 3 m.", "d": "<b>3 m</b> : λ = v/f = 3×10⁸ / 10⁸.<div class='ex-detail'><u>Exemple rédigé</u> : conversion : 100 MHz = 100×10⁶ = 10⁸ Hz : λ = 3 m. Culture radio : la bande FM (88-108 MHz) ⟹ λ entre 3,4 et 2,8 m : les antennes de voiture (λ/4 ≈ 75 cm) sont taillées dessus : le wifi (2,4 GHz : λ = 12,5 cm) explique les petites antennes des box. Piège : « 30 m » : un facteur 10 de mauvaise conversion des MHz : MHz = 10⁶, pas 10⁷ ni 10⁵.</div>"},
{"t": "Ondes sonores et lumineuses (2de)", "q": "Le retard entre l'éclair et le tonnerre vient de :", "c": ["la pluie", "la différence des vitesses (son 340 m/s vs lumière 3×10⁸)", "le vent", "la lumière qui traîne"], "a": 1, "e": "Les deux partent ensemble : la lumière arrive quasi instantanément, le son prend ~3 s/km.", "d": "<b>La différence des vitesses</b> : un rapport de un million.<div class='ex-detail'><u>Exemple rédigé</u> : chronologie : éclair et tonnerre NAISSENT en même temps : la lumière fait 3 km en 10 µs (instantané) ; le son met 3000/340 ≈ 8,8 s : l'oreille reçoit « en retard ». Mesure : s ÷ 3 = km (12 s ⟹ 4 km). Piège : « la lumière qui traîne » : la lumière est CE qu'il y a de plus rapide : rien ne la dépasse : c'est le son qui est lent : l'ordre d'arrivée classe les vitesses.</div>"},
{"t": "Ondes sonores et lumineuses (2de)", "q": "Sur la Lune, deux astronautes sans radio :", "c": ["ils s'entendent normalement", "le son y va plus vite", "ils ne s'entendent pas (pas d'air)", "ils s'entendent faiblement"], "a": 2, "e": "Pas d'atmosphère = pas de milieu pour le son : gestes et radio obligatoires.", "d": "<b>Ils ne s'entendent pas</b> : le vide lunaire ne transmet aucune onde mécanique.<div class='ex-detail'><u>Exemple rédigé</u> : les missions Apollo : les astronautes communiquaient par RADIO (ondes électromagnétiques : elles passent le vide) : pour le reste, gestes et toucher. Un impact de météorite sur la Lune fait un silence assourdissant côté son... et un éclat de lumière bien visible depuis la Terre. Piège : « ils s'entendent faiblement » : le son ne s'affaiblit pas dans le vide : il N'EXISTE PAS : il n'y a pas de « presque rien », il y a rien.</div>"},
{"t": "Énergie : formes et conversions (2de)", "q": "L'énergie d'un corps en mouvement est :", "c": ["chimique", "cinétique", "potentielle", "thermique"], "a": 1, "e": "Ec = ½mv² : l'énergie du mouvement.", "d": "<b>Cinétique</b> : liée à la vitesse.<div class='ex-detail'><u>Exemple rédigé</u> : familles à trier : cinétique (voiture qui roule, balle lancée) ; potentielle de gravité (livre en hauteur : il peut tomber) ; potentielle élastique (ressort comprimé, arc bandé) ; chimique (pile, essence, pain) ; thermique (chaleur d'un radiateur). Piège : « potentielle » : c'est l'énergie de POSITION (hauteur, compression) : la balle en hauteur a une énergie potentielle ; en mouvement, elle l'a convertie en cinétique.</div>"},
{"t": "Énergie : formes et conversions (2de)", "q": "Le principe de conservation de l'énergie dit que :", "c": ["l'énergie utile est conservée", "les pertes détruisent l'énergie", "l'énergie se crée à volonté", "l'énergie totale se conserve : elle se transforme sans disparaître"], "a": 3, "e": "Rien ne se perd : chaque conversion redistribue le total en formes différentes.", "d": "<b>L'énergie totale se conserve</b> : elle change de forme, jamais de quantité.<div class='ex-detail'><u>Exemple rédigé</u> : la chute : potentielle (haut) → cinétique (bas) → thermique (au choc) : le total E_p + E_c + chaleur reste constant à chaque étape. Le rendement < 1 ne contredit PAS la conservation : les « pertes » sont de la chaleur, une forme DÉGRADÉE mais bien réelle. Piège : « les pertes détruisent » : vocabulaire interdit : on DISSIPE (on transforme en chaleur), on ne détruit pas : Lavoisier veille.</div>"},
{"t": "Énergie : formes et conversions (2de)", "q": "Une lampe reçoit 500 J et rend 200 J de lumière. Rendement ?", "c": ["40 %", "2,5 %", "250 %", "60 %"], "a": 0, "e": "r = 200/500 = 0,4 = 40 %.", "d": "<b>40 %</b> : r = utile/consommée.<div class='ex-detail'><u>Exemple rédigé</u> : les 300 J manquants sont devenus de la CHALEUR (le cul de la lampe chauffe) : r = 200/500 = 0,4 : très bon pour une LED (à comparer : incandescence : ~5 %). Piège : « 250 % » : un rendement ne DÉPASSE JAMAIS 100 % : on ne peut pas restituer plus qu'on ne reçoit : un r > 1 signale TOUJOURS une erreur de calcul (division inversée).</div>"},
{"t": "Énergie : formes et conversions (2de)", "q": "Les « pertes » d'un convertisseur sont en réalité :", "c": ["de l'énergie convertie en chaleur", "de l'énergie détruite", "de la matière", "du vide"], "a": 0, "e": "Pertes = conversion en énergie thermique (dégradée, difficile à réutiliser).", "d": "<b>De l'énergie convertie en chaleur</b> (énergie thermique dégradée).<div class='ex-detail'><u>Exemple rédigé</u> : le moteur : sur 100 J d'essence : ~30 J utiles (mouvement) + ~70 J de chaleur (échappement, radiateur, frottements) : ces 70 J EXISTENT : ils réchauffent l'air : on ne sait juste pas les exploiter facilement : c'est de l'énergie « basse qualité » (dispersée, désordonnée). Piège : « détruite » : le mot tabou : la thermodynamique interdit la destruction : il n'y a que des transformations, certaines moins utiles que d'autres.</div>"},
{"t": "Énergie : formes et conversions (2de)", "q": "E = P × t. Un four de 2000 W pendant 1,5 h consomme :", "c": ["1,33 kWh", "2000 J", "30 kWh", "3000 Wh = 3 kWh"], "a": 3, "e": "E = 2000 × 1,5 = 3000 Wh = 3 kWh.", "d": "<b>3 kWh</b> : E = P × t (t en heures ⟹ Wh).<div class='ex-detail'><u>Exemple rédigé</u> : calcul : 2000 W × 1,5 h = 3000 Wh = 3 kWh (≈ 0,75 €) : une tarte de 90 min. En joules : 3 kWh = 3 × 3,6×10⁶ J = 10,8 MJ. Piège : « 2000 J » : confondre W (puissance) et J (énergie) : le four prend 2000 J chaque SECONDE : en 1,5 h il en a pris 10,8 millions : la durée est le multiplicateur essentiel.</div>"},
{"t": "Énergie : formes et conversions (2de)", "q": "Une énergie renouvelable est :", "c": ["l'uranium", "un flux (soleil, vent, eau) inépuisable à échelle humaine", "un stock épuisable", "une énergie sale"], "a": 1, "e": "Flux : solaire, éolien, hydraulique, biomasse, géothermie.", "d": "<b>Un flux</b> : la ressource revient sans cesse (à échelle humaine).<div class='ex-detail'><u>Exemple rédigé</u> : la distinction stock/flux : pétrole, charbon, gaz, uranium = STOCKS (formés sur des millions d'années : brûlés en un siècle) ; soleil, vent, cycle de l'eau = FLUX (le soleil brillera encore 5 milliards d'années : en 1 h, il envoie à la Terre plus d'énergie que l'humanité n'en consomme en un an). Piège : « l'uranium » : il est classé NON renouvelable (stock limité, minerais finis) : et renouvelable ≠ « propre » sans nuance : le bois dégage du CO₂ en brûlant.</div>"},
{"t": "Énergie : formes et conversions (2de)", "q": "Dans une pile en fonctionnement, l'énergie convertie est :", "c": ["cinétique → lumineuse", "chimique → électrique", "nucléaire → thermique", "électrique → chimique"], "a": 1, "e": "Les réactions chimiques internes libèrent de l'énergie électrique.", "d": "<b>Chimique → électrique</b> : la pile est un convertisseur.<div class='ex-detail'><u>Exemple rédigé</u> : chaîne complète : chimique (réactifs : zinc, acide) → électrique (le courant alimente la lampe) → + un peu de chaleur (les piles chauffent quand on les surmène : conversion parasite). Le chargeur fait l'INVERSE (électrique → chimique : la batterie se RE-remplit). Piège : « électrique → chimique » : c'est la CHARGE de l'accumulateur : la pile usuelle ne se recharge pas : le sens de la flèche raconte l'appareil.</div>"},
{"t": "Énergie : formes et conversions (2de)", "q": "Une centrale nucléaire convertit :", "c": ["cinétique → électrique", "nucléaire → thermique → électrique", "lumineuse → électrique", "chimique → électrique"], "a": 1, "e": "Fission ⟹ chaleur ⟹ vapeur ⟹ turbine ⟹ alternateur ⟹ électricité.", "d": "<b>Nucléaire → thermique → électrique</b> (via mécanique).<div class='ex-detail'><u>Exemple rédigé</u> : chaîne détaillée : fission de l'uranium (E nucléaire) → chaleur (E thermique : eau pressurisée) → vapeur → turbine (E mécanique) → alternateur (E électrique) : rendement global ~33 % : le reste part en chaleur dans les tours aéroréfrigérantes (la « vapeur » des centrales : de la perte visible !). Piège : la centrale ne « fabrique » pas l'électricité : elle CONVERTIT un stock (uranium : épuisable) en énergie utilisable.</div>"},
{"t": "Énergie : formes et conversions (2de)", "q": "1 kWh en joules :", "c": ["3,6 × 10⁹ J", "3,6 × 10⁶ J", "3600 J", "1000 J"], "a": 1, "e": "1000 W × 3600 s = 3,6×10⁶ J = 3,6 MJ.", "d": "<b>3,6 × 10⁶ J</b> (3,6 mégajoules).<div class='ex-detail'><u>Exemple rédigé</u> : calcul de définition : 1 kWh = 1000 W × 3600 s = 3,6×10⁶ J. Ordre de grandeur : un croissant (~300 kcal = 1,25 MJ) ≈ 0,35 kWh : votre petit-déjeuner alimente une LED pendant 35 heures. Piège : « 3600 J » : c'est le Wh (1 W × 3600 s) : le kWh est mille fois plus : le kilo fait toujours ×1000.</div>"},
{"t": "Énergie : formes et conversions (2de)", "q": "Le Soleil est une source :", "c": ["non renouvelable (stock)", "renouvelable (flux)", "chimique", "artificielle"], "a": 1, "e": "Flux inépuisable à notre échelle : l'énergie solaire est renouvelable.", "d": "<b>Renouvelable</b> : un flux qui ne s'épuisera pas de sitôt.<div class='ex-detail'><u>Exemple rédigé</u> : précision d'échelle : le Soleil brûlera encore ~5 milliards d'années : à l'échelle humaine, c'est un flux infini (à l'échelle cosmique, tout a une fin). Il est à l'origine de QUASI TOUT : pétrole (photosynthèse ancienne), vent (réchauffement différentiel), hydro (cycle de l'eau), biomasse : le pétrole n'est que du « soleil en boîte » vieux de 300 millions d'années. Piège : « chimique » : le Soleil fonctionne par FUSION nucléaire : il émet de l'énergie lumineuse, pas chimique.</div>"},
{"t": "Solutions et concentrations : préparer et diluer (1re)", "q": "Préparer 250 mL de NaCl (M = 58,5) à 0,20 mol/L : masse à peser ?", "c": ["2,9 g", "11,7 g", "0,2 g", "1,5 g"], "a": 0, "e": "m = C×M×V = 0,2 × 58,5 × 0,25 ≈ 2,9 g.", "d": "<b>≈ 2,9 g</b> : m = C × M × V (V en litres !).<div class='ex-detail'><u>Exemple rédigé</u> : étapes : ① V = 250 mL = 0,250 L ; ② n = C×V = 0,20 × 0,250 = 0,050 mol ; ③ m = n×M = 0,050 × 58,5 = 2,925 ≈ 2,9 g. Piège : « 11,7 g » oublierait de convertir les mL (0,2 × 58,5 × 250) : la conversion L/mL est LE point de contrôle : un résultat en milliers de grammes pour un bécher doit toujours alerter.</div>"},
{"t": "Solutions et concentrations : préparer et diluer (1re)", "q": "Diluer au 1/5 une solution mère :", "c": ["prélever V/5 de mère et compléter", "prélever 5V de mère", "chauffer", "ajouter 5 fois plus de soluté"], "a": 0, "e": "F = 5 : V₀ = V/5 : concentration divisée par 5.", "d": "<b>Prélever V/5, compléter au volume total</b> : facteur F = 5.<div class='ex-detail'><u>Exemple rédigé</u> : pour 100 mL de fille : 20 mL de mère à la pipette jaugée, fiole 100 mL, eau au trait : C(fille) = C(mère)/5. Piège : « prélever 5V » inverserait le facteur (on CONCENTRERAIT au lieu de diluer : impossible en ajoutant de l'eau) : ajouter de l'eau ne peut que DIMINUER la concentration : le sens physique valide le calcul.</div>"},
{"t": "Solutions et concentrations : préparer et diluer (1re)", "q": "Le matériel de prélèvement précis pour une dilution :", "c": ["pipette jaugée", "erlenmeyer", "éprouvette graduée", "bécher"], "a": 0, "e": "Pipette jaugée (±0,1 %) : l'éprouvette est trop imprécise.", "d": "<b>La pipette jaugée</b> : précision ~0,1-0,2 %.<div class='ex-detail'><u>Exemple rédigé</u> : comparaison : éprouvette graduée : ±1 % au mieux (lecture d'un trait épais sur plastique) ; pipette jaugée classe A : ±0,1 mL sur 10 mL : l'erreur de dilution provient surtout du PRÉLÈVEMENT : c'est lui qui porte C₀V₀ = CV : une éprouvette fausse toute la gamme. Piège : le bécher et l'erlenmeyer ne MESURENT rien : ce sont des récipients de transfert, gradués « pour indication ».</div>"},
{"t": "Solutions et concentrations : préparer et diluer (1re)", "q": "Solution de CaCl₂ à 0,010 mol/L. [Cl⁻] = ?", "c": ["0,010 mol/L", "0,030 mol/L", "0,005 mol/L", "0,020 mol/L"], "a": 3, "e": "CaCl₂ ⟹ Ca²⁺ + 2 Cl⁻ : [Cl⁻] = 2 × 0,010.", "d": "<b>0,020 mol/L</b> : chaque CaCl₂ libère 2 ions chlorure.<div class='ex-detail'><u>Exemple rédigé</u> : réflexe : écrire la dissolution : CaCl₂(s) ⟹ Ca²⁺(aq) + 2 Cl⁻(aq) : les coefficients (1 et 2) deviennent des multiplicateurs : [Ca²⁺] = 0,010 ; [Cl⁻] = 0,020 mol/L. Piège : « 0,010 » copierait C sans compter les ions : la concentration de la SOLUTION n'est pas celle de chaque ION : c'est tout l'objet de l'équation de dissolution.</div>"},
{"t": "Solutions et concentrations : préparer et diluer (1re)", "q": "L'absorbance A d'une solution colorée diluée est :", "c": ["proportionnelle à la concentration", "quadratique", "inversement proportionnelle", "indépendante"], "a": 0, "e": "Loi de Beer-Lambert : A = k × C (pour une concentration pas trop élevée).", "d": "<b>Proportionnelle à C</b> : A = k×C.<div class='ex-detail'><u>Exemple rédigé</u> : usage TP : on trace la droite A = f(C) avec des solutions étalons, puis on mesure l'inconnue : sa concentration se lit sur la droite : c'est ainsi qu'on dose les ions fer d'un vin ou les colorants d'un soda. Piège : la proportionnalité vaut pour les solutions DILUÉES : à forte concentration, la courbe s'incurve : en exercice, la linéarité est une donnée (hypothèse) à respecter.</div>"},
{"t": "Solutions et concentrations : préparer et diluer (1re)", "q": "Une fiole jaugée de 100 mL se complète au trait de jauge :", "c": ["au hasard", "à ras bord", "au-dessus du ménisque", "au bas du ménisque"], "a": 3, "e": "Lecture au BAS du ménisque, à hauteur des yeux.", "d": "<b>Au bas du ménisque</b>, œil à hauteur du trait.<div class='ex-detail'><u>Exemple rédigé</u> : le ménisque (creux de la surface) fait que le volume réel se lit au point LE PLUS BAS du liquide : une lecture par-dessus (parallaxe) ajoute ou retire 0,5 mL facilement : sur une fiole de 100 mL, c'est 0,5 % d'erreur, purement gestuelle. Piège : « à ras bord » : le volume nominal est dépassé : toute la précision de la verrerie jaugée repose sur CE trait : le dépasser ruine la préparation.</div>"},
{"t": "Solutions et concentrations : préparer et diluer (1re)", "q": "Mère à 0,50 mol/L. Fille à 0,10 mol/L dans 250 mL : volume de mère ?", "c": ["10 mL", "25 mL", "125 mL", "50 mL"], "a": 3, "e": "V₀ = CV/C₀ = 0,10×250/0,50 = 50 mL (F = 5).", "d": "<b>50 mL</b> : facteur 5 (0,50/0,10).<div class='ex-detail'><u>Exemple rédigé</u> : deux écritures : ① V₀ = C×V/C₀ = 0,10 × 250 / 0,50 = 50 mL ; ② logique du facteur : diluer ×5 ⟹ il faut 5 fois moins de volume : 250/5 = 50 mL. Piège : « 25 mL » ferait un facteur 10 : vérifier avec le facteur F = C₀/C = 5 : cohérence des deux chemins : le facteur est l'outil de contrôle rapide.</div>"},
{"t": "Solutions et concentrations : préparer et diluer (1re)", "q": "Lors d'une dissolution, l'homogénéisation se fait :", "c": ["avant de compléter au trait", "jamais", "avant la pesée", "après avoir complété au trait de jauge"], "a": 3, "e": "Boucher et retourner APRÈS le trait : sinon le volume se fausse.", "d": "<b>Après le complément au trait</b> (boucher, retourner 10 fois).<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi cet ordre : si on agite AVANT le trait, des gouttes restent sur le col et le bouchon : le volume final est faux : le protocole : dissoudre aux 2/3 ⟹ compléter au trait (bas du ménisque) ⟹ boucher ⟹ retourner lentement 10-15 fois. Piège : ajouter de l'eau au-delà du trait après coup est irrécupérable : il faut RECOMMENCER : il n'y a pas de « petite correction » en verrerie jaugée.</div>"},
{"t": "Solutions et concentrations : préparer et diluer (1re)", "q": "Le facteur de dilution F vaut :", "c": ["C₀/C = V/V₀", "M/m", "V₀/V", "C/C₀"], "a": 0, "e": "F = C(mère)/C(fille) = V(fille)/V(prélèvement) : sans unité.", "d": "<b>F = C₀/C = V/V₀</b> (rapport mère/fille, sans unité).<div class='ex-detail'><u>Exemple rédigé</u> : cohérence : diluer au 1/10 : F = 10 : la mère est 10× plus concentrée ET on prend 10× moins de volume : les deux ratios sont ÉGAUX par construction (C₀V₀ = CV). Piège : « C/C₀ » : l'inverse : F serait 0,1 : par convention F ≥ 1 pour une dilution : un F < 1 signale qu'on a... concentré (évaporation) : le signe du ratio oriente l'opération.</div>"},
{"t": "Solutions et concentrations : préparer et diluer (1re)", "q": "Une dilution au 1/100 se pratique souvent :", "c": ["en deux dilutions successives au 1/10", "en une étape avec 0,5 mL", "en chauffant", "en pesant"], "a": 0, "e": "Deux étapes de 1/10 : moins d'erreur relative sur les petits volumes.", "d": "<b>En deux dilutions successives au 1/10</b> (dilution en chaîne).<div class='ex-detail'><u>Exemple rédigé</u> : comparaison d'erreurs : prélever 0,50 mL (pour 50 mL au 1/100) : pipette de 0,5 mL : erreur relative élevée ; prélever 5,0 mL (1/10) PUIS 5,0 mL de la fille (1/10 encore) : pipettes de 5 mL : précision bien meilleure : total 1/100 ✓. Piège : la chaîne « propage » les erreurs multiplicativement, mais reste meilleure qu'un micro-prélèvement : en TP, on choisit les pipettes dont on dispose (2, 5, 10 mL).</div>"},
{"t": "Bilan de matière : avancement et réactif limitant (1re)", "q": "Le réactif limitant est celui qui :", "c": ["est le plus léger", "est en excès", "a le plus grand coefficient", "s'épuise le premier (arrête la réaction)"], "a": 3, "e": "Quand il atteint 0, la réaction s'arrête : il « limite » xF.", "d": "<b>S'épuise le premier</b> : c'est lui qui fixe xF.<div class='ex-detail'><u>Exemple rédigé</u> : méthode : comparer n₀/coefficient (pas n₀ seul !) : 2 H₂ + O₂ avec 2,0 mol H₂ et 1,5 mol O₂ : rapports : 1,0 et 1,5 : H₂ limitant (x = 1,0). Piège : « le plus léger » ou « le plus petit n₀ » : les coefficients changent tout : 0,3 mol de Al face à 0,25 mol de Cl₂ (coef 3) : c'est Cl₂ le limitant : TOUJOURS diviser par le coefficient.</div>"},
{"t": "Bilan de matière : avancement et réactif limitant (1re)", "q": "2 H₂ + O₂ ⟶ 2 H₂O. n₀ : 2 mol H₂, 1 mol O₂. xF = ?", "c": ["3 mol", "1 mol", "2 mol", "0,5 mol"], "a": 1, "e": "H₂ : x ≤ 1 ; O₂ : x ≤ 1 : mélange stoechiométrique, xF = 1 mol.", "d": "<b>xF = 1 mol</b> : mélange stoechiométrique (rapports égaux : 2/2 = 1/1).<div class='ex-detail'><u>Exemple rédigé</u> : vérification au tableau : à x = 1 : H₂ : 2−2 = 0 ; O₂ : 1−1 = 0 : les DEUX s'épuisent ensemble : parfait équilibre. Produits : H₂O : 2×1 = 2 mol. Piège : « 2 mol » serait le x si H₂ seul existait : le tableau croise les deux contraintes : xF est le PLUS PETIT des maxima.</div>"},
{"t": "Bilan de matière : avancement et réactif limitant (1re)", "q": "Dans un tableau, pour l'équation aA + bB ⟶ cC, la quantité de C à l'état en cours est :", "c": ["c·x", "n₀(C) − c·x", "x − c", "c + x"], "a": 0, "e": "Produit : quantité = 0 + c·x (croissante).", "d": "<b>c·x</b> : chaque tour forme c moles de C.<div class='ex-detail'><u>Exemple rédigé</u> : logique des signes : réactifs : on PART de n₀ et on ENLÈVE (−coef×x) ; produits : on part de 0 et on AJOUTE (+coef×x). Exemple : 2 H₂ + O₂ ⟶ 2 H₂O : à x = 0,4 : H₂O = 2×0,4 = 0,8 mol. Piège : « n₀(C) − c·x » : c'est la ligne d'un RÉACTIF : inverser les signes est l'erreur la plus fréquente du tableau : réactifs −, produits +.</div>"},
{"t": "Bilan de matière : avancement et réactif limitant (1re)", "q": "Rendement : obtenu 0,072 mol, théorique 0,090 mol : r = ?", "c": ["72 %", "125 %", "80 %", "18 %"], "a": 2, "e": "r = 0,072/0,090 = 0,80 = 80 %.", "d": "<b>80 %</b> : r = obtenu ÷ théorique.<div class='ex-detail'><u>Exemple rédigé</u> : lecture : sur 100 mol possibles, 80 sont réellement isolées : 20 % se sont « perdues » (réaction incomplète, parasite, manipulations). Piège : « 125 % » : le rendement ne dépasse JAMAIS 100 % : un r > 1 = division inversée : le théorique est TOUJOURS le dénominateur (le plus grand des deux nombres en général).</div>"},
{"t": "Bilan de matière : avancement et réactif limitant (1re)", "q": "0,30 mol Al + 0,25 mol Cl₂ ; 2 Al + 3 Cl₂ ⟶ 2 AlCl₃. Limitant ?", "c": ["aucun", "Al", "Cl₂", "AlCl₃"], "a": 2, "e": "Rapports : 0,30/2 = 0,15 ; 0,25/3 ≈ 0,083 : Cl₂ limitant.", "d": "<b>Cl₂</b> : plus petit rapport n₀/coef.<div class='ex-detail'><u>Exemple rédigé</u> : le contre-piège type : ici Al a le plus grand n₀ (0,30 > 0,25) mais le coefficient de Cl₂ (3) le pénalise : 0,083 < 0,15 : Cl₂ s'épuise le premier. Moralité : NE JAMAIS comparer les n₀ bruts : la division par les coefficients est non négociable.</div>"},
{"t": "Bilan de matière : avancement et réactif limitant (1re)", "q": "Dans un mélange stoechiométrique à l'état final :", "c": ["tous les réactifs sont consommés", "la réaction n'a pas eu lieu", "les produits manquent", "il reste un réactif"], "a": 0, "e": "Proportions exactes : les réactifs s'épuisent ensemble.", "d": "<b>Tous les réactifs sont consommés</b> (et xF maximal).<div class='ex-detail'><u>Exemple rédigé</u> : définition : n₀(A)/a = n₀(B)/b : les deux « réserves » s'épuisent au même x : rien ne reste : c'est le mélange « parfait » (pas de gaspillage, pas de résidu à séparer) : en synthèse, on l'approche en calculant les masses à peser dans ces proportions. Piège : « il reste un réactif » : ce serait un mélange en EXCÈS d'un réactif : l'excès est précisément ce qui RESTE : stoechiométrique ⟹ zéro reste.</div>"},
{"t": "Bilan de matière : avancement et réactif limitant (1re)", "q": "Une valeur négative dans un tableau signifie :", "c": ["la réaction est finie", "tout va bien", "erreur : mauvais réactif limitant choisi (ou mauvais xF)", "le produit est négatif"], "a": 2, "e": "Une quantité de matière ne peut jamais être négative : xF trop grand.", "d": "<b>Erreur de raisonnement</b> : xF dépasse l'épuisement d'un réactif.<div class='ex-detail'><u>Exemple rédigé</u> : contrôle qualité du tableau : si n(O₂) = 1,5 − x avec x = 2 : −0,5 mol : absurde : le vrai xF était 1,0 (limitant H₂) : la valeur négative est une ALARME : elle indique qu'on a pris l'autre réactif comme référence. Piège : « la réaction est finie » : la fin se voit à x = xF avec des zéros : JAMAIS à des négatifs.</div>"},
{"t": "Bilan de matière : avancement et réactif limitant (1re)", "q": "L'avancement x s'exprime en :", "c": ["mol/L", "grammes", "mol", "litres"], "a": 2, "e": "x compte des « tours de réaction » : des moles.", "d": "<b>En moles</b> : x mesure une quantité de matière.<div class='ex-detail'><u>Exemple rédigé</u> : sens : x = le nombre de moles qui ont « réagi » selon l'écriture de l'équation (pour un coefficient 1) : les variations des espèces sont coef×x : mêmes unités (mol) partout dans le tableau. Piège : « mol/L » : c'est la CONCENTRATION : le tableau travaille en quantités (mol) : la conversion C×V = n se fait AVANT de remplir le tableau.</div>"},
{"t": "Bilan de matière : avancement et réactif limitant (1re)", "q": "On met l'eau en grand excès dans une hydrolyse parce que :", "c": ["l'eau réagit vite", "l'eau colore", "l'eau est le limitant", "on veut consommer au maximum l'autre réactif (cher/nuisible)"], "a": 3, "e": "L'excès d'un réactif « pousse » la consommation de l'autre : stratégie classique.", "d": "<b>Excès stratégique</b> : consommer au maximum le réactif cher/important.<div class='ex-detail'><u>Exemple rédigé</u> : logique industrielle : on met en excès le réactif BON MARCHÉ (l'eau, l'air...) pour consommer TOTALEMENT le réactif cher ou toxique : le limitant devient le cher : à la fin, il n'en reste presque rien : moins de purification. Piège : « l'eau est le limitant » : si elle est en excès, elle ne PEUT PAS être limitante : l'excès est l'ANTONYME du limitant.</div>"},
{"t": "Bilan de matière : avancement et réactif limitant (1re)", "q": "Équation : N₂ + 3 H₂ ⟶ 2 NH₃. Avec 1 mol N₂ et 3 mol H₂ : xF et NH₃ final ?", "c": ["xF = 1 ; NH₃ = 2 mol", "xF = 3 ; NH₃ = 2 mol", "xF = 1 ; NH₃ = 1 mol", "xF = 0,5 ; NH₃ = 1 mol"], "a": 0, "e": "Rapports : 1/1 = 3/3 = 1 : stoechiométrique : xF = 1, NH₃ = 2×1 = 2 mol.", "d": "<b>xF = 1 mol ; NH₃ = 2 mol</b>.<div class='ex-detail'><u>Exemple rédigé</u> : reconnaissance : 3/3 = 1/1 : mélange stoechiométrique : tout se consomme : produits : 2×1 = 2 mol d'ammoniac (procédé Haber : engrais mondiaux). Piège : « NH₃ = 1 mol » oublierait le coefficient 2 : les PRODUITS héritent aussi des coefficients : NH₃ = 2x, pas x : la stoechiométrie régit toute la ligne.</div>"},
{"t": "Mouvement et interactions : gravité et forces (1re)", "q": "La deuxième loi de Newton s'écrit :", "c": ["ΣF = m·v", "ΣF = a/m", "ΣF = m·a", "F = m·g uniquement"], "a": 2, "e": "Résultante des forces = masse × accélération.", "d": "<b>ΣF = m·a</b> : la résultante cause l'accélération.<div class='ex-detail'><u>Exemple rédigé</u> : voiture 1200 kg, a = 2 m/s² : ΣF = 2400 N : pour accélérer plus fort, soit plus de force, soit moins de masse : c'est toute l'automobile (rapports de boîte, allègement). Piège : « ΣF = m·v » : la force pilote la VARIATION de vitesse (l'accélération), pas la vitesse : à vitesse constante, ΣF peut être nulle : mouvement ≠ force, VARIATION de mouvement = force.</div>"},
{"t": "Mouvement et interactions : gravité et forces (1re)", "q": "En chute libre (sans frottement), une plume et un marteau :", "c": ["le marteau tombe plus vite", "tombent identiquement", "aucun ne tombe", "la plume tombe plus vite"], "a": 1, "e": "a = g pour tous : la masse ne joue aucun rôle (démontré sur la Lune).", "d": "<b>Ils tombent identiquement</b> : a = g indépendamment de m.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi c'est troublant : le marteau est 100× plus lourd... mais il faut 100× plus de force pour l'accélérer (ΣF = ma) : les deux effets se COMPENSENT exactement : m·g/m = g. L'expérience d'Apollo 15 sur la Lune (pas d'air) le montre en direct. Piège : sur TERRE, la plume freine (frottement de l'air) : la différence vient du MILIEU, pas de la gravité.</div>"},
