  "theme": "Vitesse et mouvement (4e)",
  "niveau": "4e",
  "titre": "Vitesse et mouvement",
  "cours": "<div class=\"cours-head\"><h2>Vitesse et mouvement</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Décrire un mouvement</h3>\n<ul>\n<li><b>Référentiel</b> : l'objet par rapport auquel on décrit le mouvement (le sol, un train...) — tout mouvement est <b>relatif</b> ;</li>\n<li><b>Trajectoire</b> : la ligne suivie par l'objet : <b>rectiligne</b> (ligne droite) ou <b>curviligne</b> (courbe, dont circulaire) ;</li>\n<li><b>Vitesse</b> : distance parcourue par unité de temps.</li>\n</ul>\n<table>\n<tr><th>Mouvement</th><th>Trajectoire</th><th>Vitesse</th></tr>\n<tr><td><b>uniforme</b></td><td>quelconque</td><td>constante</td></tr>\n<tr><td><b>accéléré</b></td><td>quelconque</td><td>augmente</td></tr>\n<tr><td><b>ralenti (décéléré)</b></td><td>quelconque</td><td>diminue</td></tr>\n</table>\n\n<h3>2. Calculer la vitesse</h3>\n<div class=\"formule\">v = d / t<br>v en m/s si d en mètres et t en secondes ;<br>v en km/h si d en kilomètres et t en heures.<br>Conversion : m/s × 3,6 = km/h (et km/h ÷ 3,6 = m/s)</div>\n<ul>\n<li>Exemple : 100 m en 10 s → v = 10 m/s = <b>36 km/h</b> ;</li>\n<li>Attention au choix des <b>unités</b> : toujours cohérentes entre elles.</li>\n</ul>\n\n<h3>3. Mouvements dans la vie courante</h3>\n<ul>\n<li>Un coureur à pied : ≈ 10 km/h ; un cycliste : ≈ 25 km/h ; une voiture en ville : 30-50 km/h ; TGV : 320 km/h ; avion de ligne : 900 km/h ;</li>\n<li>La <b>vitesse moyenne</b> (distance totale ÷ temps total) ≠ la vitesse instantanée (compteur) ;</li>\n<li>Chronophotographie : des photos à intervalles réguliers — points rapprochés = lent, espacés = rapide.</li>\n</ul>\n\n<h3>4. Sécurité routière : distance d'arrêt</h3>\n<table>\n<tr><th>Composante</th><th>Définition</th><th>Facteurs</th></tr>\n<tr><td><b>distance de réaction</b></td><td>pendant le temps de réaction (≈ 1 s)</td><td>vitesse, état du conducteur (fatigue, alcool, téléphone)</td></tr>\n<tr><td><b>distance de freinage</b></td><td>pendant le freinage</td><td>vitesse², état de la route, pneus, freins</td></tr>\n</table>\n<div class=\"warn\"><b>Distance d'arrêt = réaction + freinage</b> : elle croît comme le <b>carré de la vitesse</b> — rouler 2× plus vite, c'est une distance d'arrêt ≈ 4× plus longue. À 50 km/h : ≈ 25-30 m ; à 100 km/h : ≈ 70-90 m.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — calculer une vitesse moyenne réaliste</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un cycliste parcourt 12 km en 30 minutes. Vitesse moyenne en km/h puis en m/s ?</div><div class=\"etu\"><b>Étape 1 — Convertir</b> : 30 min = 0,5 h (et 12 km = 12 000 m).</div><div class=\"etu\"><b>Étape 2 — Calculer en km/h</b> : v = 12 / 0,5 = <b>24 km/h</b>.</div><div class=\"etu\"><b>Étape 3 — Convertir en m/s</b> : 24 ÷ 3,6 ≈ <b>6,7 m/s</b>.</div><div class=\"etu\"><b>Étape 4 — Contrôler l'ordre de grandeur</b> : un cycliste modéremment entraîné : 20-25 km/h : cohérent. Toujours vérifier que le résultat est <b>plausible</b>.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Mélanger les unités (km avec des minutes) : <b>convertir d'abord</b> (30 min = 0,5 h).</li>\n<li>« Vitesse moyenne = moyenne des vitesses » : non — <b>distance totale ÷ temps total</b>.</li>\n<li>« Doubler la vitesse double la distance de freinage » : elle la <b>quadruple</b> (v²).</li>\n<li>« Le mouvement est absolu » : il dépend du <b>référentiel</b> (dans un train, votre sac est immobile... pour vous).</li>\n<li>« Uniforme = en ligne droite » : uniforme = vitesse <b>constante</b> ; la trajectoire peut être circulaire (satellite, manège).</li>\n</ul>\n</div>"
 },
 {
  "id": "energie-electrique",
  "theme": "Énergie électrique : puissance (4e)",
  "niveau": "4e",
  "titre": "Énergie électrique : puissance et consommation",
  "cours": "<div class=\"cours-head\"><h2>Énergie électrique : puissance et consommation</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Puissance : le débit d'énergie</h3>\n<ul>\n<li>La <b>puissance</b> (watts, W) mesure l'énergie convertie <b>chaque seconde</b> ;</li>\n<li>Équivalence : 1 W = 1 J/s ; un appareil de 1000 W convertit 1000 J chaque seconde ;</li>\n<li>Étiquette des appareils : lampe 10 W, télé 100 W, micro-ondes 900 W, radiateur 2000 W ;</li>\n<li>Formule (3e mais utile) : P = U × I (watts = volts × ampères).</li>\n</ul>\n<div class=\"tip\"><b>Comprendre la différence</b> : énergie = quantité (J, kWh) ; puissance = <b>débit</b> (W). Une petite rivière longtemps peut transporter plus d'eau qu'un fleuve quelques secondes.</div>\n\n<h3>2. Énergie électrique consommée</h3>\n<div class=\"formule\">E = P × t<br>E en joules si P en W et t en s ;<br>en pratique : E en <b>kilowattheures (kWh)</b> si P en <b>kW</b> et t en <b>heures</b>.</div>\n<ul>\n<li>1 kWh = l'énergie d'un appareil de 1000 W pendant 1 h (≈ 3,6 MJ) ;</li>\n<li>C'est l'unité de la facture d'électricité (≈ 0,15-0,25 €/kWh selon l'offre et le pays).</li>\n</ul>\n\n<h3>3. Calculer une consommation</h3>\n<table>\n<tr><th>Appareil</th><th>Puissance</th><th>Usage quotidien</th><th>Consommation/jour</th></tr>\n<tr><td>LED</td><td>10 W</td><td>5 h</td><td>0,05 kWh</td></tr>\n<tr><td>téléviseur</td><td>100 W</td><td>4 h</td><td>0,4 kWh</td></tr>\n<tr><td>réfrigérateur</td><td>150 W (cycle)</td><td>24 h (marche partielle)</td><td>≈ 1 kWh</td></tr>\n<tr><td>radiateur</td><td>2000 W</td><td>3 h</td><td>6 kWh</td></tr>\n</table>\n<ul>\n<li>Consommation (kWh) = <b>puissance (kW) × durée (h)</b> ;</li>\n<li>Coût = consommation × prix du kWh.</li>\n</ul>\n\n<h3>4. Choisir et utiliser : sobriété</h3>\n<ul>\n<li>À l'achat : comparer les <b>étiquettes énergie</b> (A à G) et la puissance ;</li>\n<li>Veilles = jusqu'à 10 % de la facture : <b>débrancher</b> les chargeurs, couper les multiprises ;</li>\n<li>LED vs halogène : ×10 moins de puissance à éclairage égal ;</li>\n<li>Chauffage : premier poste de consommation d'un logement — isolation, température 19 °C.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — comparer deux ampoules sur un an</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Ampoule halogène 60 W vs LED 8 W, 4 h/jour, prix 0,20 €/kWh. Économie annuelle ?</div><div class=\"etu\"><b>Étape 1 — Consommation halogène</b> : 0,06 kW × 4 h × 365 = 87,6 kWh/an.</div><div class=\"etu\"><b>Étape 2 — Consommation LED</b> : 0,008 kW × 4 h × 365 = 11,7 kWh/an.</div><div class=\"etu\"><b>Étape 3 — Économie</b> : (87,6 - 11,7) × 0,20 ≈ <b>15 €/an par ampoule</b>.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : sur 10 ampoules, 150 €/an — et la LED dure 15× plus longtemps : le calcul complet inclut <b>achat + usage</b>.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre <b>W</b> (puissance) et <b>kWh</b> (énergie) : la plaque signalétique donne des W ; la facture, des kWh.</li>\n<li>« Un gros poste consomme forcément plus » : la <b>durée d'usage</b> compte autant que la puissance (réfrigérateur 150 W mais 24 h/24).</li>\n<li>Oublier la conversion kW/W (2000 W = 2 kW) avant E = P × t.</li>\n<li>« La veille ne consomme rien » : 1 à 5 W en continu = plusieurs kWh/an par appareil.</li>\n<li>« Chauffer à 21 °C plutôt que 19 °C est négligeable » : ≈ <b>+7 % de chauffage</b> par degré.</li>\n</ul>\n</div>"
 },
 {
  "id": "signaux",
  "theme": "Signaux sonores et lumineux (4e)",
  "niveau": "4e",
  "titre": "Signaux sonores et lumineux",
  "cours": "<div class=\"cours-head\"><h2>Signaux sonores et lumineux</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Deux signaux, un même rôle : transmettre une information</h3>\n<ul>\n<li>Un <b>signal</b> transporte une <b>information</b> sans transporter de matière ;</li>\n<li>Signal <b>sonore</b> : vibration (besoin d'un milieu) ; signal <b>lumineux</b> : onde électromagnétique (se propage même dans le vide) ;</li>\n<li>Exemples : sonnerie, klaxon, feux tricolores, télécommande, fibre optique.</li>\n</ul>\n\n<h3>2. Vitesses très différentes</h3>\n<table>\n<tr><th>Signal</th><th>Vitesse</th><th>Conséquence</th></tr>\n<tr><td>son dans l'air</td><td>≈ 340 m/s</td><td>décalage orage, écho</td></tr>\n<tr><td>lumière</td><td>≈ 300 000 km/s</td><td>quasi instantanée à notre échelle</td></tr>\n</table>\n<ul>\n<li>Conséquence observable : le <b>tonnerre après l'éclair</b> ; les astronomes voient le passé (8 min pour le Soleil, années pour les étoiles) ;</li>\n<li>On mesure des distances avec ces vitesses : écho (sonar), télémétrie laser.</li>\n</ul>\n\n<h3>3. Atténuation et obstacles</h3>\n<ul>\n<li>Un signal s'<b>atténue</b> avec la distance (le son s'affaibit, la lampe éclaire moins loin) ;</li>\n<li><b>Absorption / réflexion</b> : un mur réfléchit le son (écho) et bloque en partie la lumière ;</li>\n<li>Certains matériaux transmettent la lumière (<b>transparents</b>) ou non (<b>opaques</b>) ; le son, lui, traverse murs et portes — atténué mais audible.</li>\n</ul>\n<div class=\"tip\"><b>Application</b> : isolation phonique (matériaux absorbants, double vitrage) ; fibres optiques : la lumière y est réfléchie en totalité interne sur des dizaines de km — le signal lumineux voyage <b>sans fil</b>… dans un fil de verre.</div>\n\n<h3>4. Signaux et sécurité</h3>\n<ul>\n<li>Signaux sonores d'alerte : klaxon, sirènes (2 tones alternées pour être repérées) ;</li>\n<li>Signaux lumineux : feux, gyrophares, balises de chantier — visibles de loin, même dans le bruit ;</li>\n<li>Le choix du signal dépend du contexte : le son traverse les murs, la lumière demande une ligne de vue ;</li>\n<li>Handicap : un signal doit être <b>redondant</b> (sonore + lumineux) pour être perçu par tous (feux sonores pour malvoyants, bandes lumineuses pour malentendants).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — choisir le bon signal pour un dispositif</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> À l'entrée d'un local bruyant et poussiéreux, comment signaler l'ouverture automatique d'un portail ?</div><div class=\"etu\"><b>Étape 1 — Analyser le milieu</b> : bruit (signal sonore masqué) et poussière (visibilité réduite).</div><div class=\"etu\"><b>Étape 2 — Comparer</b> : le son serait couvert ; la lumière reste visible même dans le bruit et traverse la poussière mieux que le son ne traverse le vacarme.</div><div class=\"etu\"><b>Étape 3 — Décider</b> : signal <b>lumineux</b> (balise clignotante) + sonore de secours pour les cas de contre-visibilité.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : concevoir un signal = partir du <b>milieu</b> (atténuation, obstacles, bruit) et du récepteur (qui doit le percevoir ?) — la redondance est la règle en sécurité.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le son va plus vite que la lumière » : c'est l'inverse (rapport ≈ 1 million).</li>\n<li>« La lumière a besoin d'un milieu » : elle traverse le <b>vide</b> ; le son, non.</li>\n<li>« Le signal transporte de la matière » : il transporte de l'<b>information/énergie</b>, rien de matériel.</li>\n<li>« Un mur arrête tout » : il <b>atténue</b> ; des sons graves le traversent mieux que les aigus.</li>\n<li>« Voir = entendre en même temps » : à un match de foot lointain, on <b>voit</b> la frappe avant de l'entendre : les deux vitesses diffèrent.</li>\n</ul>\n</div>"
 },
 {
  "id": "atomes-ions",
  "theme": "Atomes, ions et formules chimiques (3e)",
  "niveau": "3e",
  "titre": "Atomes, ions et formules chimiques",
  "cours": "<div class=\"cours-head\"><h2>Atomes, ions et formules chimiques</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le modèle de l'atome</h3>\n<ul>\n<li>Atome = <b>noyau</b> (protons +, neutrons 0) + <b>électrons</b> (−) qui gravitent autour ;</li>\n<li>Un atome est <b>électriquement neutre</b> : autant d'électrons (−) que de protons (+) ;</li>\n<li>La masse est concentrée dans le noyau ; l'électron est ≈ 1800× plus léger qu'un proton.</li>\n</ul>\n<table>\n<tr><th>Particule</th><th>Charge</th><th>Masse</th></tr>\n<tr><td>proton</td><td>+e</td><td>1,67×10⁻²⁷ kg</td></tr>\n<tr><td>neutron</td><td>0</td><td>1,67×10⁻²⁷ kg</td></tr>\n<tr><td>électron</td><td>−e</td><td>≈ 9,1×10⁻³¹ kg</td></tr>\n</table>\n\n<h3>2. Les ions : des atomes qui gagnent ou perdent des électrons</h3>\n<ul>\n<li>Un atome qui <b>perd</b> des électrons devient un <b>cation</b> (positif) : Na → Na⁺ (11 protons, 10 électrons) ;</li>\n<li>Un atome qui <b>gagne</b> des électrons devient un <b>anion</b> (négatif) : Cl → Cl⁻ (17 protons, 18 électrons) ;</li>\n<li>Seuls les <b>électrons</b> bougent — le noyau (et donc l'élément) ne change jamais ;</li>\n<li>Ions polyatomiques : NH₄⁺, SO₄²⁻, NO₃⁻, CO₃²⁻ : des groupes d'atomes porteurs d'une charge.</li>\n</ul>\n<div class=\"tip\"><b>Comment lire la charge</b> : charge = (nb de protons) − (nb d'électrons). Na⁺ : 11 − 10 = +1. Le signe vient de l'excès de protons.</div>\n\n<h3>3. Formules chimiques des composés ioniques</h3>\n<ul>\n<li>Un solide ionique est <b>électriquement neutre</b> : les charges + et − se compensent ;</li>\n<li>NaCl : 1 Na⁺ + 1 Cl⁻ ; CaCl₂ : 1 Ca²⁺ + 2 Cl⁻ ; Al₂O₃ : 2 Al³⁺ + 3 O²⁻ ;</li>\n<li>Méthode : croiser les charges (comme un produit en croix) puis vérifier : charge totale nulle.</li>\n</ul>\n<div class=\"formule\">Règle d'échange : n(anions) × |charge anion| = n(cations) × charge cation<br>Ex. aluminium + soufre : Al³⁺ et S²⁻ → Al₂S₃ (2×3 = 3×2 = 6).</div>\n\n<h3>4. Tests d'identification des ions</h3>\n<table>\n<tr><th>Ion</th><th>Réactif</th><th>Résultat</th></tr>\n<tr><td>Cl⁻</td><td>nitrate d'argent</td><td>précipité <b>blanc</b> qui noircit à la lumière</td></tr>\n<tr><td>Fe²⁺</td><td>soude (NaOH)</td><td>précipité <b>vert</b></td></tr>\n<tr><td>Fe³⁺</td><td>soude</td><td>précipité <b>rouille</b></td></tr>\n<tr><td>Cu²⁺</td><td>soude</td><td>précipité <b>bleu</b></td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — construire la formule d'un solide ionique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le sulfure d'aluminium est constitué des ions Al³⁺ et S²⁻. Quelle est sa formule ?</div><div class=\"etu\"><b>Étape 1 — Repérer les charges</b> : Al³⁺ (charge +3) et S²⁻ (charge −2).</div><div class=\"etu\"><b>Étape 2 — Échanger les nombres</b> : 2 ions aluminium (pour 2×3 = 6 « + ») et 3 ions soufre (3×2 = 6 « − »).</div><div class=\"etu\"><b>Étape 3 — Écrire la formule</b> : <b>Al₂S₃</b> — l'ion positif en premier.</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : 2×(+3) + 3×(−2) = 0 ✓. Le composé est neutre ; c'est la vérification obligatoire de toute formule ionique.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Un ion a gagné des protons » : jamais — seuls les <b>électrons</b> sont échangés.</li>\n<li>« Na⁺ a un proton en plus » : non : un <b>électron en moins</b>.</li>\n<li>« Cl⁻ contient du chlore gazeux » : l'ion Cl⁻ (dans le sel) n'a rien à voir avec la molécule Cl₂ (gaz toxique).</li>\n<li>« La charge se met en exposant après le symbole, toujours » : attention aux ions polyatomiques : NH₄⁺ se lit globalement.</li>\n<li>« Les formules ioniques se devinent » : elles se <b>calculent</b> par neutralité électrique.</li>\n</ul>\n</div>"
 },
 {
  "id": "transformations-chimiques",
  "theme": "Transformations chimiques et équations (3e)",
  "niveau": "3e",
  "titre": "Transformations chimiques et équations de réaction",
  "cours": "<div class=\"cours-head\"><h2>Transformations chimiques et équations de réaction</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Transformation chimique : la définition</h3>\n<ul>\n<li>Des <b>réactifs</b> disparaissent, des <b>produits</b> apparaissent ;</li>\n<li>Les <b>atomes</b> sont conservés (aucun créé, aucun détruit) : ils se <b>réarrangent</b> ;</li>\n<li>Ce qui change : les <b>molécules</b> ; ce qui se conserve : les atomes <b>et</b> la masse totale.</li>\n</ul>\n<div class=\"tip\"><b>Loi de Lavoisier</b> : « Rien ne se perd, rien ne se crée, tout se transforme » — la masse des réactifs consommés = la masse des produits formés.</div>\n\n<h3>2. Écrire une équation de réaction</h3>\n<ol>\n<li>Écrire réactifs → produits avec les <b>formules</b> correctes ;</li>\n<li>Compter les atomes de chaque élément de chaque côté ;</li>\n<li>Ajuster avec les <b>coefficients stœchiométriques</b> (jamais en changeant les formules !) ;</li>\n<li>Vérifier : mêmes atomes, mêmes nombres de chaque côté ; mêmes charges.</li>\n</ol>\n<div class=\"formule\">Exemple — combustion du méthane :<br>CH₄ + 2 O₂ → CO₂ + 2 H₂O<br>(1 C, 4 H, 4 O de chaque côté ✓)</div>\n\n<h3>3. Transformations à connaître</h3>\n<table>\n<tr><th>Transformation</th><th>Équation</th><th>Signes</th></tr>\n<tr><td>combustion du carbone</td><td>C + O₂ → CO₂</td><td>flamme, gaz qui trouble l'eau de chaux</td></tr>\n<tr><td>combustion du méthane</td><td>CH₄ + 2 O₂ → CO₂ + 2 H₂O</td><td>flamme bleue du gaz de ville</td></tr>\n<tr><td>formation de rouille (modèle simplifié)</td><td>fer + dioxygène → oxyde de fer</td><td>rouille, brun-orangé</td></tr>\n<tr><td>acide + carbonate</td><td>CaCO₃ + 2 H⁺ → Ca²⁺ + H₂O + CO₂</td><td>effervescence (CO₂)</td></tr>\n</table>\n<ul>\n<li>Tests produits : CO₂ <b>trouble l'eau de chaux</b> ; H₂ « aboie » avec une allumette ; l'eau forme de la buée sur un verre froid.</li>\n</ul>\n\n<h3>4. Énergie et transformations</h3>\n<ul>\n<li>Une transformation <b>libère</b> (exothermique : combustion) ou <b>absorbe</b> (endothermique : photosynthèse) de l'énergie ;</li>\n<li>L'énergie se conserve : elle change simplement de forme (chimique → thermique, lumineux...) ;</li>\n<li>C'est le fondement des <b>piles</b> : la réaction chimique y produit de l'énergie électrique.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — ajuster une équation pas à pas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Ajuster : C₃H₈ + O₂ → CO₂ + H₂O (combustion du propane).</div><div class=\"etu\"><b>Étape 1 — Carbone</b> : 3 C à gauche → 3 CO₂ à droite.</div><div class=\"etu\"><b>Étape 2 — Hydrogène</b> : 8 H → 4 H₂O.</div><div class=\"etu\"><b>Étape 3 — Oxygène</b> : à droite : 3×2 + 4×1 = 10 O → 5 O₂ à gauche.</div><div class=\"etu\"><b>Étape 4 — Résultat et vérification</b> : C₃H₈ + <b>5 O₂</b> → 3 CO₂ + 4 H₂O ; compter chaque élément : 3 C, 8 H, 10 O des deux côtés ✓. Méthode : ajuster C, puis H, puis O en dernier — l'oxygène est souvent présent dans plusieurs molécules.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Modifier une <b>formule</b> pour équilibrer (H₂O → H₂O₂) : interdit — seuls les <b>coefficients</b> se règlent.</li>\n<li>« La masse diminue quand un gaz s'échappe » : la masse <b>totale</b> (gaz compris) se conserve ; le flacon fermé ne maigrit pas.</li>\n<li>« CO₂ trouble l'eau de chaux » : c'est le test du CO₂ ; l'eau de chaux ne « détecte pas n'importe quel gaz ».</li>\n<li>Confondre coefficient (devant : nombre de molécules) et indice (dans : atomes par molécule).</li>\n<li>« O₂ disparaît dans la combustion » : il se <b>transforme</b> — il est consommé, incorporé dans CO₂ et H₂O.</li>\n</ul>\n</div>"
 },
 {
  "id": "lois-circuits",
  "theme": "Électricité : tension, intensité et lois des circuits (3e)",
  "niveau": "3e",
  "titre": "Électricité : tension, intensité et lois des circuits",
  "cours": "<div class=\"cours-head\"><h2>Électricité : tension, intensité et lois des circuits</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Intensité et tension : deux grandeurs différentes</h3>\n<table>\n<tr><th></th><th>Intensité I</th><th>Tension U</th></tr>\n<tr><td>symbole de la grandeur</td><td>I (ampères, A)</td><td>U (volts, V)</td></tr>\n<tr><td>mesure</td><td>ampèremètre, en <b>série</b></td><td>voltmètre, en <b>dérivation</b></td></tr>\n<tr><td>image</td><td>débit d'eau (L/s)</td><td>différence de hauteur (pression)</td></tr>\n</table>\n<ul>\n<li>L'<b>intensité</b> mesure le débit de charges électriques ;</li>\n<li>La <b>tension</b> entre deux points mesure l'« énergie par charge » disponible entre eux ;</li>\n<li>Certains dipôles se comportent comme des <b>générateurs</b> (pile : convertit chimique → électrique).</li>\n</ul>\n\n<h3>2. Loi d'unicité de l'intensité (série)</h3>\n<div class=\"formule\">Dans un circuit <b>en série</b>, l'intensité est <b>la même partout</b> :<br>I(générateur) = I(lampe 1) = I(lampe 2) = ...</div>\n<ul>\n<li>Le courant ne « s'use » pas en traversant les dipôles ;</li>\n<li>Si on ajoute une lampe en série : la <b>tension du générateur se partage</b>, chaque lampe brille <b>moins</b>.</li>\n</ul>\n\n<h3>3. Loi d'additivité des tensions (série) et loi des nœuds (déjà vu en 4e)</h3>\n<div class=\"formule\">En série : U(générateur) = U₁ + U₂ + ...<br>En dérivation : la tension est <b>la même</b> aux bornes de chaque branche ; l'intensité se partage aux nœuds.</div>\n<ul>\n<li>Cas limite : <b>fils de connexion</b> : tension quasi nulle à leurs bornes ;</li>\n<li><b>Court-circuit</b> du générateur : U = 0 pour les autres dipôles, I très grande → danger.</li>\n</ul>\n\n<h3>4. Résistance et loi d'Ohm</h3>\n<ul>\n<li>Une <b>résistance</b> (conducteur ohmique) freine le courant ; unité : l'<b>ohm (Ω)</b> ;</li>\n<li>Elle convertit l'énergie électrique en <b>chaleur</b> (effet Joule : radiateur, grille-pain) ;</li>\n<li>Mesure au <b>ohmmètre</b> (hors circuit) ou par code de couleurs.</li>\n</ul>\n<div class=\"formule\">Loi d'Ohm (dipôle ohmique) :<br>U = R × I<br>U en volts, R en ohms, I en ampères</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — interpréter des mesures pour identifier un défaut</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Circuit série : pile 6 V, deux lampes L₁, L₂. On mesure I = 0 A partout, U(L₁) = 0 V, U(L₂) = 6 V. Quel est le défaut ?</div><div class=\"etu\"><b>Étape 1 — I = 0</b> : le circuit est <b>ouvert</b> quelque part.</div><div class=\"etu\"><b>Étape 2 — U(L₂) = 6 V</b> : un dipôle qui porte <b>toute la tension</b> du générateur sans être traversé est un dipôle <b>grillé/fil coupé</b>.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : c'est L₂ qui est hors service (filament coupé) — L₁ est intacte.</div><div class=\"etu\"><b>Étape 4 — Règle générale</b> : dans un circuit ouvert, la <b>tension totale apparaît aux bornes de la coupure</b> ; c'est le diagnostic de base de tout électricien (et l'erreur classique du contrôle : croire L₂ « marche » parce qu'elle affiche 6 V).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le courant s'affaiblit le long du circuit » : en série, l'intensité est <b>la même</b> en tout point.</li>\n<li>« Une lampe éteinte qui porte une grande tension fonctionne » : c'est le <b>contraire</b> — c'est elle qui est coupée.</li>\n<li>Brancher l'ampèremètre en dérivation : <b>en série</b> ; le voltmètre, lui, en dérivation.</li>\n<li>« U = R×I pour tout » : uniquement pour un <b>conducteur ohmique</b> — pas pour une lampe (filament) ou une LED.</li>\n<li>« Plus de tension = plus de danger ? Peu importe » : la tension de sécurité (≤ 24 V) protège le corps humain ; le secteur 230 V est mortel.</li>\n</ul>\n</div>"
 },
 {
  "id": "energie-cinetique",
  "theme": "Énergie cinétique et sécurité routière (3e)",
  "niveau": "3e",
  "titre": "Énergie cinétique et sécurité routière",
  "cours": "<div class=\"cours-head\"><h2>Énergie cinétique et sécurité routière</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'énergie cinétique</h3>\n<ul>\n<li>Tout corps en mouvement possède une <b>énergie de mouvement</b> : l'énergie cinétique E<sub>c</sub> ;</li>\n<li>Elle dépend de la <b>masse</b> et de la <b>vitesse</b> ;</li>\n<li>Unité : le <b>joule (J)</b>, comme toutes les énergies.</li>\n</ul>\n<div class=\"formule\">E<sub>c</sub> = ½ × m × v²<br>m en kg, v en m/s → E<sub>c</sub> en joules<br>Attention : convertir la vitesse en m/s avant calcul (km/h ÷ 3,6).</div>\n<ul>\n<li>Conséquence capitale : la vitesse compte <b>au carré</b> — doubler la vitesse <b>quadruple</b> E<sub>c</sub> ;</li>\n<li>Tripler la masse triple E<sub>c</sub> (dépendance simple).</li>\n</ul>\n\n<h3>2. Ordres de grandeur</h3>\n<table>\n<tr><th>Véhicule</th><th>Masse</th><th>Vitesse</th><th>E<sub>c</sub></th></tr>\n<tr><td>voiture</td><td>1000 kg</td><td>50 km/h (≈ 14 m/s)</td><td>≈ 96 kJ</td></tr>\n<tr><td>voiture</td><td>1000 kg</td><td>100 km/h (≈ 28 m/s)</td><td>≈ 386 kJ (×4)</td></tr>\n<tr><td>camion</td><td>19 000 kg</td><td>90 km/h (25 m/s)</td><td>≈ 5,9 MJ</td></tr>\n</table>\n<div class=\"tip\"><b>Retenir</b> : passer de 50 à 100 km/h quadruple l'énergie à dissiper dans les freins et les obstacles — d'où les distances de freinage qui explosent.</div>\n\n<h3>3. Distances de freinage et d'arrêt</h3>\n<ul>\n<li>Freiner = convertir E<sub>c</sub> en énergie <b>thermique</b> (freins, pneus, route) ;</li>\n<li>Distance d'arrêt = distance de <b>réaction</b> (≈ 1 s, à la vitesse v) + distance de <b>freinage</b> ;</li>\n<li>Le freinage croît avec v² : la distance d'arrêt augmente <b>plus vite que la vitesse</b> ;</li>\n<li>État de la route (sec/mouillé), pneus et freins modulent la distance de freinage ; alcool, fatigue et téléphone allongent la réaction.</li>\n</ul>\n\n<h3>4. Sécurité : dissiper l'énergie pour protéger</h3>\n<ul>\n<li>Ceinture et airbag : ils <b>ralentissent</b> la décélération du corps et absorbent l'énergie ;</li>\n<li>Zone de déformation (voiture qui se plie) : la voiture « sacrifie » son énergie à ta place ;</li>\n<li>Casque à vélo, protections de ski : même logique — prolonger la durée du choc réduit les forces subies ;</li>\n<li>Limitations : 30-50 km/h en ville protège les piétons (E<sub>c</sub> réduite avant l'impact).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — comparer deux situations de choc</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Voiture A : 1200 kg à 50 km/h ; voiture B : 1200 kg à 100 km/h. Comparer les énergies cinétiques ; pourquoi est-ce décisif pour la sécurité ?</div><div class=\"etu\"><b>Étape 1 — Convertir</b> : 50 km/h ≈ 13,9 m/s ; 100 km/h ≈ 27,8 m/s.</div><div class=\"etu\"><b>Étape 2 — Calculer</b> : E<sub>c</sub>(A) = ½ × 1200 × 13,9² ≈ 116 kJ ; E<sub>c</sub>(B) = ½ × 1200 × 27,8² ≈ 464 kJ.</div><div class=\"etu\"><b>Étape 3 — Comparer</b> : ×2 en vitesse → <b>×4 en énergie</b> (0,5 × 4 = 2²) ; la voiture B doit dissiper 4 fois plus.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : mêmes freins, mêmes pneus → distance de freinage ×4 (environ) et choc 4 fois plus violent : c'est l'argument <b>quantitatif</b> des limitations de vitesse.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Utiliser v en km/h dans la formule : toujours en <b>m/s</b> (÷ 3,6).</li>\n<li>« Doubler la vitesse double l'énergie » : non — elle la <b>quadruple</b> (v²).</li>\n<li>« Plus lourd = plus de freinage mais pareil au final » : un camion garde 20-40× l'énergie d'une voiture à vitesse égale : distance de freinage bien plus longue.</li>\n<li>« L'énergie cinétique disparaît au freinage » : elle se <b>convertit</b> (thermique, déformation).</li>\n<li>Oublier le ½ (facteur 2 d'erreur, classique au contrôle).</li>\n</ul>\n</div>"
 },
 {
  "id": "matiere-echelles",
  "theme": "La matière à différentes échelles (2de)",
  "niveau": "2de",
  "titre": "La matière à différentes échelles : atome, molécule, ion",
  "cours": "<div class=\"cours-head\"><h2>La matière à différentes échelles : atome, molécule, ion</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Des échelles gigantesques</h3>\n<table>\n<tr><th>Échelle</th><th>Ordre de grandeur</th><th>Exemple</th></tr>\n<tr><td>atome</td><td>10⁻¹⁰ m (0,1 nm)</td><td>atome d'hydrogène</td></tr>\n<tr><td>noyau</td><td>10⁻¹⁵ m</td><td>100 000× plus petit que l'atome</td></tr>\n<tr><td>molécule</td><td>10⁻¹⁰ à 10⁻⁸ m</td><td>ADN, protéines</td></tr>\n<tr><td>cellule</td><td>10⁻⁵ m</td><td>globule rouge</td></tr>\n<tr><td>être humain</td><td>10⁰ m</td><td>—</td></tr>\n</table>\n<ul>\n<li>La matière est <b>lacunaire</b> : essentiellement du vide entre les noyaux et les électrons ;</li>\n<li>Les puissances de 10 et la <b>notation scientifique</b> (a×10ⁿ, 1 ≤ a < 10) sont l'outil indispensable de ces échelles.</li>\n</ul>\n\n<h3>2. Le noyau : protons et neutrons</h3>\n<ul>\n<li><b>numéro atomique Z</b> = nombre de protons : il définit l'élément ;</li>\n<li><b>nombre de masse A</b> = protons + neutrons : notation <b><sub>Z</sub><sup>A</sup>X</b> ;</li>\n<li><b>Isotopes</b> : même Z, A différents (¹H, ²H, ³H ; ¹²C, ¹⁴C) : mêmes propriétés chimiques ;</li>\n<li>Électrons : leur nombre (égal à Z pour l'atome neutre) détermine la structure en <b>couches électroniques</b> (K : 2 max, L : 8 max, M : 8 en 2de).</li>\n</ul>\n<div class=\"formule\">Règle de l'octet : les atomes tendent à gagner, perdre ou partager des électrons pour remplir leur dernière couche (8 électrons, ou 2 pour K).</div>\n\n<h3>3. Ions monoatomiques et moléculaires</h3>\n<ul>\n<li>La <b>charge</b> d'un ion = Z − nombre d'électrons : Cu²⁺ : 29 − 27 = +2 ;</li>\n<li>Couches électroniques de l'ion = répartition des électrons restants (Cu²⁺ : 2-8-18, sa couche externe est pleine — d'où sa stabilité) ;</li>\n<li>Ions moléculaires : NH₄⁺, SO₄²⁻... : la charge est portée par l'ensemble de l'édifice.</li>\n</ul>\n\n<h3>4. Composition d'une espèce chimique</h3>\n<ul>\n<li>Une espèce est caractérisée par sa <b>formule</b> : symboles et <b>indices</b> ;</li>\n<li>Du micro (atome) au macro (échantillon visible), on passe par la <b>mole</b> (cours suivant) ;</li>\n<li>Compter des atomes un par un est impossible : la chimie raisonne en paquets (moles) et en proportions.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — décrire un atome par sa notation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire l'atome <sub>17</sub><sup>35</sup>Cl : composition, charge, structure électronique ; que devient Cl⁻ ?</div><div class=\"etu\"><b>Étape 1 — Lire la notation</b> : Z = 17 protons, A = 35 → 35 − 17 = 18 neutrons.</div><div class=\"etu\"><b>Étape 2 — Atome neutre</b> : 17 électrons, répartis 2-8-7 (K, L, M).</div><div class=\"etu\"><b>Étape 3 — Règle de l'octet</b> : 7 électrons de couche externe → il lui en manque 1 : il en <b>gagne un</b>.</div><div class=\"etu\"><b>Étape 4 — L'ion</b> : Cl⁻ : 18 électrons (2-8-8), charge = 17 − 18 = −1 : octet complet : c'est l'ion stable du chlore (dans le sel de table).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre <b>A</b> (protons + neutrons) et <b>Z</b> (protons) : les neutrons = A − Z.</li>\n<li>« Changer le nombre de neutrons change l'élément » : non — ce sont des <b>isotopes</b> ; seul Z définit l'élément.</li>\n<li>« L'ion change de noyau » : jamais — uniquement le nombre d'<b>électrons</b>.</li>\n<li>« La matière est pleine » : elle est <b>lacunaire</b> (vide à plus de 99,9 %).</li>\n<li>Écrire la notation scientifique avec a ≥ 10 (34×10⁻¹⁰) : non — 3,4×10⁻⁹.</li>\n</ul>\n</div>"
 },
 {
  "id": "mole-concentration",
  "theme": "La mole et la concentration (2de)",
  "niveau": "2de",
  "titre": "Composition d'un système : la mole et la concentration",
  "cours": "<div class=\"cours-head\"><h2>Composition d'un système : la mole et la concentration</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Quantité de matière : la mole</h3>\n<ul>\n<li>Compter des atomes est impossible (ils sont innombrables) : on les compte par <b>paquets</b> ;</li>\n<li>Une <b>mole</b> = un paquet de 6,02×10²³ entités (atomes, molécules, ions) ;</li>\n<li>Ce nombre est la <b>constante d'Avogadro</b> N<sub>A</sub> = 6,02×10²³ mol⁻¹ ;</li>\n<li>La quantité de matière se note <b>n</b>, en <b>mol</b> ; elle joue pour les particules le rôle de la « douzaine » pour les œufs — sauf que le paquet est astronomique.</li>\n</ul>\n<div class=\"formule\">n = N / N<sub>A</sub><br>n en mol, N nombre d'entités, N<sub>A</sub> = 6,02×10²³ mol⁻¹</div>\n\n<h3>2. Masse molaire</h3>\n<ul>\n<li><b>Masse molaire atomique</b> M : masse d'une mole d'atomes ; en g/mol ; elle ≈ A (nombre de masse) ;</li>\n<li><b>Masse molaire moléculaire</b> : somme des masses molaires atomiques : M(H₂O) = 2×1,0 + 16,0 = 18,0 g/mol ;</li>\n<li>Elle relie masse (mesurable à la balance) et quantité de matière (celle des équations).</li>\n</ul>\n<div class=\"formule\">n = m / M<br>m en grammes, M en g/mol → n en mol</div>\n\n<h3>3. Concentration molaire</h3>\n<ul>\n<li>Une <b>solution</b> = solvant (souvent l'eau) + <b>soluté</b> (espèce dissoute) ;</li>\n<li>La concentration molaire C indique la quantité de soluté par litre de <b>solution</b> :</li>\n</ul>\n<div class=\"formule\">C = n / V<br>C en mol/L, n en mol, V en litres de solution</div>\n<ul>\n<li>Concentration massique (programme SVT aussi) : C<sub>m</sub> = m/V en g/L ; relation : C<sub>m</sub> = C × M.</li>\n</ul>\n\n<h3>4. Dilution et dissolution</h3>\n<ul>\n<li>Préparer une solution par <b>dissolution</b> : peser m = n×M, dissoudre, compléter à V avec de l'eau ;</li>\n<li>Une <b>dilution</b> ajoute du solvant : n ne change pas, V augmente → C diminue ;</li>\n<li>Facteur de dilution F = C(mère)/C(fille) = V(fille)/V(prélevé) ;</li>\n<li>Protocole : pipette jaugée (prélèvement) + fiole jaugée (complètement) — jamais un bécher gradué.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — préparer une solution par dissolution</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On veut 250,0 mL d'une solution de glucose (C₆H₁₂O₆) à 0,200 mol/L. Quelle masse peser ?</div><div class=\"etu\"><b>Étape 1 — Masse molaire</b> : M = 6×12,0 + 12×1,0 + 6×16,0 = 180,0 g/mol.</div><div class=\"etu\"><b>Étape 2 — Quantité</b> : n = C×V = 0,200 × 0,2500 = 0,0500 mol.</div><div class=\"etu\"><b>Étape 3 — Masse</b> : m = n×M = 0,0500 × 180,0 = <b>9,00 g</b>.</div><div class=\"etu\"><b>Étape 4 — Protocole</b> : peser 9,00 g à la balance, dissoudre dans un peu d'eau, transvaser, rincer, compléter la fiole jaugée de 250,0 mL au trait de jauge : la verrerie <b>jaugée</b> fait la précision, pas le bécher.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Diviser par le volume de <b>solvant</b> ajouté : la concentration se calcule par rapport au volume de <b>solution</b> finale.</li>\n<li>Confondre masse molaire atomique et moléculaire (additionner les indices).</li>\n<li>« La dilution enlève du soluté » : n inchangé — seul le volume augmente.</li>\n<li>Oublier de convertir mL → L dans C = n/V.</li>\n<li>« 1 mol = 6,02×10²³ g » : c'est un <b>nombre d'entités</b>, pas une masse ; la masse d'une mole, c'est M.</li>\n</ul>\n</div>"
 },
 {
  "id": "forces-inertie",
  "theme": "Forces et principe d'inertie (2de)",
  "niveau": "2de",
  "titre": "Forces et principe d'inertie",
  "cours": "<div class=\"cours-head\"><h2>Forces et principe d'inertie</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Modéliser une action : la force</h3>\n<ul>\n<li>Une <b>force</b> modélise l'action d'un corps sur un autre : qui exerce, qui subit, quel effet ;</li>\n<li>Elle se représente par un <b>vecteur</b> : point d'application, direction, sens, valeur (en <b>newtons</b>) ;</li>\n<li>Elle est <b>localisée</b> (contact : cordage, mèche) ou <b>à distance</b> (poids, force magnétique, électrostatique).</li>\n</ul>\n<div class=\"tip\"><b>Poids</b> : force à distance exercée par la Terre : P = m×g, verticale, vers le bas, appliquée au centre de gravité — c'est le modèle à maîtriser parfaitement.</div>\n\n<h3>2. Diagramme objets-interactions</h3>\n<ul>\n<li>Recenser <b>tous</b> les systèmes qui agissent sur l'objet étudié ;</li>\n<li>Représenter chaque action par une flèche sur le schéma, correctement orientée et proportionnelle ;</li>\n<li>Système = ce qu'on étudie ; on ne dessine que les forces <b>subies</b> par lui (jamais celles qu'il exerce).</li>\n</ul>\n\n<h3>3. Le principe d'inertie</h3>\n<div class=\"formule\">Si un système est <b>immobile</b> ou en <b>mouvement rectiligne uniforme</b>, alors les forces qui s'exercent sur lui <b>se compensent</b> — et réciproquement.</div>\n<ul>\n<li>« Se compenser » : vectoriellement : même direction, sens opposés, même valeur (ou somme nulle à plusieurs) ;</li>\n<li>Conséquence : un mouvement qui <b>accélère, ralentit ou tourne</b> prouve que les forces <b>ne</b> se compensent <b>pas</b> ;</li>\n<li>Application : palet qui glisse à vitesse constante (poids compensé par la réaction), voiture à 130 km/h en ligne droite sur autoroute.</li>\n</ul>\n<div class=\"warn\"><b>Contre-intuition</b> : pour maintenir un mouvement rectiligne uniforme, <b>aucune force n'est nécessaire</b> (l'espace en est la preuve) ; à l'inverse, une force est nécessaire pour <b>changer</b> le mouvement.</div>\n\n<h3>4. Applications</h3>\n<ul>\n<li>Ascenseur à vitesse constante : tension du câble = poids (R = 0 sur la balance : immobile ou vitesse constante) ;</li>\n<li>Chute libre (air négligé) : seul le poids agit → le mouvement varie (accélère) ;</li>\n<li>Ballon qui retombe : la trajectoire courbe prouve une force non compensée (le poids, la poussée d'Archimède, les frottements).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — exploiter le principe d'inertie sur un record</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un skateur lance son planche : elle glisse en ligne droite à vitesse quasi constante, puis ralentit et s'arrête. Analyser les forces à chaque phase.</div><div class=\"etu\"><b>Étape 1 — Recenser les actions</b> : Terre (poids), sol (réaction normale), sol (frottements, opposés au mouvement).</div><div class=\"etu\"><b>Étape 2 — Phase glissade uniforme</b> : mouvement rectiligne uniforme → forces compensées : poids + réaction + frottements ≈ somme nulle (frottements très faibles sur sol lisse).</div><div class=\"etu\"><b>Étape 3 — Phase de ralentissement</b> : la vitesse diminue → compensation impossible : les frottements dominent (gravillons, herbe).</div><div class=\"etu\"><b>Étape 4 — Réciproque</b> : le principe d'inertie sert aussi à <b>diagnostiquer</b> : un MRU observé ⇒ compensation ; une décélération ⇒ déséquilibre : c'est une lecture du mouvement, pas une cause.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Un mouvement uniforme nécessite une force motrice » : non — il nécessite l'<b>absence de force non compensée</b> (sur Terre, la force motrice compense les frottements).</li>\n<li>« Se compenser = être égales » : encore faut-il des <b>directions opposées</b> ; deux forces perpendiculaires de même valeur ne se compensent pas.</li>\n<li>« Le mouvement nécessite une force » : erreur aristotélicienne classique ; la <b>variation</b> de mouvement, oui.</li>\n<li>Inventorier des forces exercées <b>par</b> le système au lieu des forces <b>subies</b>.</li>\n<li>« Si v = 0, aucune force s'exerce » : immobilité = forces compensées, pas absentes (livre sur table).</li>\n</ul>\n</div>"
 },
 {
  "id": "ondes-signaux",
  "theme": "Ondes sonores et lumineuses (2de)",
  "niveau": "2de",
  "titre": "Ondes sonores et lumineuses",
  "cours": "<div class=\"cours-head\"><h2>Ondes sonores et lumineuses</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Une onde : un signal qui se propage</h3>\n<ul>\n<li>Une <b>onde</b> = propagation d'une perturbation, <b>sans transport de matière</b> mais <b>avec transport d'énergie</b> ;</li>\n<li>Onde <b>mécanique</b> : nécessite un milieu matériel (son, vague, séisme) ;</li>\n<li>Onde <b>électromagnétique</b> : se propage même dans le vide (lumière, radio, UV) ;</li>\n<li>Le <b>milieu de propagation</b> ne « voyage » pas : chaque point transmet au suivant.</li>\n</ul>\n\n<h3>2. Le son : une onde mécanique</h3>\n<ul>\n<li>Le son naît d'une <b>vibration</b> (corde, membrane) transmise par l'air (compression/décompression) ;</li>\n<li>Vitesse dans l'air : ≈ 340 m/s ; dans l'eau ≈ 1500 m/s ; dans l'acier ≈ 5000 m/s : le son va plus vite dans les milieux <b>denses et rigides</b> ;</li>\n<li>Il ne se propage <b>pas dans le vide</b> (expérience de la cloche) ;</li>\n<li><b>Hauteur</b> (aigu/grave : fréquence) et <b>intensité</b> (fort/faible : amplitude, en dB) ; seuil d'audibilité 0 dB, seuil de douleur 120 dB.</li>\n</ul>\n\n<h3>3. La lumière : une onde électromagnétique</h3>\n<ul>\n<li>Vitesse dans le vide : c = 3,00×10⁸ m/s ; dans l'air : presque pareil ; dans l'eau ou le verre : plus lent ;</li>\n<li>Spectre visible : ≈ 400 nm (violet) à 800 nm (rouge) ; au-delà : UV, infrarouge, rayons X, ondes radio — une seule famille, les <b>ondes électromagnétiques</b>, classées par longueur d'onde ;</li>\n<li>La lumière se propage en <b>ligne droite</b> dans un milieu transparent homogène.</li>\n</ul>\n\n<h3>4. Signaux périodiques : période et fréquence</h3>\n<div class=\"formule\">Un signal <b>périodique</b> se répète identique à lui-même à intervalles réguliers :<br>période T (en secondes) ; fréquence f = 1/T en hertz (Hz)</div>\n<ul>\n<li>Sur un oscillogramme : T = durée d'un motif élémentaire (mesurée sur l'axe des temps) ;</li>\n<li>Exemple : T = 2 ms → f = 1/0,002 = 500 Hz ;</li>\n<li>Applications : son du diapason (440 Hz pour le la₃), courant secteur (50 Hz), onde radio (100 MHz = radio FM).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — mesurer une vitesse avec un signal</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un orage : on voit l'éclair, puis le tonnerre arrive 6,0 s plus tard. À quelle distance est la foudre ? Et avec un sonar qui reçoit un écho 0,12 s après l'émission ?</div><div class=\"etu\"><b>Étape 1 — Modèle</b> : la lumière est quasi instantanée ; le son voyage à 340 m/s : tout le délai est pour lui.</div><div class=\"etu\"><b>Étape 2 — Orage</b> : d = v×t = 340 × 6,0 = <b>2,0 km</b> (règle du pouce : 3 s ≈ 1 km).</div><div class=\"etu\"><b>Étape 3 — Sonar</b> : le signal fait l'<b>aller-retour</b> : distance = v×t/2 = 1500 × 0,12/2 = <b>90 m</b> (fond marin).</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : tout mesurage par signal utilise d = v×t — la seule subtilité est le <b>trajet simple ou aller-retour</b> : à vérifier avant tout calcul.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le son va plus vite dans le vide » : il ne s'y propage <b>pas du tout</b>.</li>\n<li>« Une onde transporte de la matière » : elle transporte de l'<b>énergie</b> ; les points du milieu oscillent sur place.</li>\n<li>« La lumière est instantanée » : 8 minutes du Soleil à la Terre — mais à notre échelle, le délai est imperceptible.</li>\n<li>Confondre <b>période</b> (s) et <b>fréquence</b> (Hz) : f = 1/T, et convertir ms → s avant.</li>\n<li>Écho : oublier de <b>diviser par 2</b> pour la distance aller-retour.</li>\n</ul>\n</div>"
 },
 {
  "id": "conversions-energie",
  "theme": "Énergie : formes et conversions (2de)",
  "niveau": "2de",
  "titre": "Énergie : formes et conversions",
  "cours": "<div class=\"cours-head\"><h2>Énergie : formes et conversions</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les formes d'énergie</h3>\n<table>\n<tr><th>Forme</th><th>Exemples</th></tr>\n<tr><td>cinétique</td><td>voiture en mouvement, vent</td></tr>\n<tr><td>potentielle (de pesanteur)</td><td>eau d'un barrage, objet en hauteur</td></tr>\n<tr><td>chimique</td><td>pétrole, batterie, nourriture</td></tr>\n<tr><td>électrique</td><td>réseau, éclair</td></tr>\n<tr><td>thermique</td><td>chaleur du soleil, radiateur</td></tr>\n<tr><td>lumineuse / rayonnante</td><td>lampe, soleil</td></tr>\n<tr><td>nucléaire</td><td>fission de l'uranium</td></tr>\n</table>\n<ul>\n<li>Unité : le <b>joule (J)</b> ; courant : le <b>kWh</b> (1 kWh = 3,6 MJ) ;</li>\n<li>Puissance (W) = <b>débit</b> d'énergie : E = P×t.</li>\n</ul>\n\n<h3>2. Conversions et chaînes</h3>\n<ul>\n<li>L'énergie <b>ne se crée ni ne se perd</b> : elle se <b>convertit</b> et se <b>transfère</b> ;</li>\n<li>Chaîne de conversion : source → convertisseur(s) → usage ;</li>\n<li>Exemples : barrage (potentielle → cinétique → électrique) ; lampe (électrique → lumineuse + thermique) ; voiture (chimique → thermique → cinétique).</li>\n</ul>\n<div class=\"formule\">Conservation : E(consommée par le convertisseur) = E(utile) + E(dissipée/perdue)<br>Rendement η = E(utile) / E(consommée) &lt; 1</div>\n\n<h3>3. Sources et ressources</h3>\n<ul>\n<li>Sources <b>renouvelables</b> : solaire, éolien, hydraulique, biomasse, géothermie — se renouvellent à l'échelle humaine ;</li>\n<li>Sources <b>non renouvelables</b> : fossiles (charbon, pétrole, gaz) et uranium — stockées et limitées ;</li>\n<li>Production d'électricité : convertit une énergie primaire (chimique, nucléaire, cinétique, rayonnante) en électricité via un <b>alternateur</b> (mécanique → électrique).</li>\n</ul>\n\n<h3>4. Optimiser les conversions</h3>\n<ul>\n<li>Toute conversion « perd » de l'énergie, surtout en <b>thermique</b> (frottements, effet Joule) ;</li>\n<li>Isolation, LED (rendement lumineux élevé), moteurs à haut rendement : réduire les pertes ;</li>\n<li>Stockage difficile : l'électricité se stocke mal (batteries, STEP — stations de transfert d'énergie par pompage) ;</li>\n<li>Sobriété : la meilleure énergie est celle qu'on ne consomme pas.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — calculer un rendement global</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une lampe à incandescence reçoit 100 J d'énergie électrique et fournit 5 J de lumière ; une LED reçoit 15 J et fournit 5 J de lumière. Comparer les rendements.</div><div class=\"etu\"><b>Étape 1 — Incandescence</b> : η = 5/100 = <b>5 %</b> : 95 J partent en chaleur.</div><div class=\"etu\"><b>Étape 2 — LED</b> : η = 5/15 ≈ <b>33 %</b> : trois fois moins d'électricité pour la même lumière.</div><div class=\"etu\"><b>Étape 3 — Interpréter</b> : même service (5 J utiles), consommation ÷ 6,7 : la LED réduit la demande d'énergie <b>à service égal</b>.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : c'est la logique du <b>rendement</b> : améliorer η (ou sobriété) économise l'énergie primaire, les ressources et la facture — avant même de parler de production.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« L'énergie disparaît » : elle se <b>convertit</b>, souvent en chaleur dissipée dans l'environnement.</li>\n<li>« Un rendement peut dépasser 1 » : impossible : η = utile/consommé &lt; 1 (sinon machine perpétuelle).</li>\n<li>Confondre <b>énergie</b> (J, stock) et <b>puissance</b> (W, débit) : une bougie allumée un an dépasse en énergie un éclair instantané.</li>\n<li>« Renouvelable = propre partout et toujours » : nuancer (barrages et biodiesel ont des impacts) ; nuance exigée au lycée.</li>\n<li>Oublier de convertir kWh ↔ J (1 kWh = 3,6×10⁶ J) dans les exercices mixtes.</li>\n</ul>\n</div>"
 },
