  "cours": "<div class=\"cours-head\"><h2>Solutions et concentrations : préparer et diluer</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Rappels utiles : mole, masse molaire, concentration</h3>\n<ul>\n<li>n = m/M (mol) ; n = N/N<sub>A</sub> ;</li>\n<li>C = n/V (mol/L), C<sub>m</sub> = m/V = C×M (g/L) ;</li>\n<li>V en litres — la concentration s'exprime toujours par rapport au volume de <b>solution</b>.</li>\n</ul>\n\n<h3>2. Préparer une solution par dissolution</h3>\n<ol>\n<li>Calculer n = C×V, puis m = n×M ;</li>\n<li>Poser la spatule de solide, peser précisément (au 0,001 g près si possible) ;</li>\n<li>Dissoudre dans un bécher avec un peu d'eau distillée, transvaser dans la <b>fiole jaugée</b> avec rinçages ;</li>\n<li>Compléter au trait de jauge, boucher, homogénéiser par retournement.</li>\n</ol>\n<div class=\"tip\"><b>Sécurité</b> : solides corrosifs → gants et lunettes ; dissoudre NaOH est exothermique : attendre le refroidissement avant de compléter.</div>\n\n<h3>3. Diluer : facteur de dilution</h3>\n<div class=\"formule\">Dilution : C(fille) = C(mère) × V(prélevé)/V(fille)<br>Facteur de dilution F = V(fille)/V(prélevé) = C(mère)/C(fille)</div>\n<ul>\n<li>Prélever V(prélevé) de solution mère à la <b>pipette jaugée</b> ;</li>\n<li>Compléter à V(fille) dans la fiole jaugée ;</li>\n<li>n est conservée : seul le volume (donc C) change ;</li>\n<li>Exemple : prélever 10,0 mL et compléter à 100,0 mL → F = 10 : C divisée par 10.</li>\n</ul>\n\n<h3>4. Dosage par étalonnage (courbe d'étalonnage)</h3>\n<ul>\n<li>Préparer une <b>gamme</b> de solutions de concentrations connues (par dilutions successives) ;</li>\n<li>Mesurer une grandeur physique proportionnelle à C : absorbance (spectrophotomètre), conductivité (conductimètre), masse volumique ;</li>\n<li>Tracer la <b>droite d'étalonnage</b> (grandeur vs C) ;</li>\n<li>Mesurer la même grandeur pour la solution inconnue et lire C sur la droite.</li>\n</ul>\n<div class=\"warn\"><b>Limites</b> : la loi n'est linéaire que dans un domaine de concentration ; hors de ce domaine, la courbe s'incurve : la lecture est fausse — toujours travailler dans la zone linéaire.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — réussir un protocole de dilution chiffré</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Solution mère de sulfate de cuivre à 0,50 mol/L. Préparer 100,0 mL de solution fille à 0,010 mol/L : matériel et volumes ?</div><div class=\"etu\"><b>Étape 1 — Facteur</b> : F = C(mère)/C(fille) = 0,50/0,010 = 50.</div><div class=\"etu\"><b>Étape 2 — Volume à prélever</b> : V(prélevé) = V(fille)/F = 100,0/50 = 2,00 mL → <b>pipette jaugée de 2,00 mL</b>.</div><div class=\"etu\"><b>Étape 3 — Vérifier par n</b> : n = 0,010 × 0,1000 = 1,0×10⁻³ mol ; dans 2,00 mL de mère : 0,50 × 0,00200 = 1,0×10⁻³ mol ✓.</div><div class=\"etu\"><b>Étape 4 — Rédiger</b> : prélever 2,00 mL, verser dans la fiole jaugée de 100,0 mL, compléter au trait de jauge, homogénéiser. Toute dilution se justifie par <b>la conservation de n</b> — c'est l'argument qui rapporte les points.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Prélever à l'éprouvette graduée : la précision exige <b>pipette et fiole jaugées</b>.</li>\n<li>« Compléter avant d'avoir transvasé et rincé » : le soluté restant dans le bécher fausse tout.</li>\n<li>Confondre F = 10 et « diluer 10 fois dans le volume total » : toujours F = V(fille)/V(prélevé).</li>\n<li>Hors zone linéaire de la droite d'étalonnage : la lecture de C n'est plus valable.</li>\n<li>mL ↔ L oublié dans n = C×V (2 mL = 0,002 L).</li>\n</ul>\n</div>"
 },
 {
  "id": "bilan-matiere",
  "theme": "Bilan de matière : avancement et réactif limitant (1re)",
  "niveau": "1re",
  "titre": "Bilan de matière : avancement et réactif limitant",
  "cours": "<div class=\"cours-head\"><h2>Bilan de matière : avancement et réactif limitant</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Quantités initiales et équation ajustée</h3>\n<ul>\n<li>Tout bilan commence par l'équation <b>ajustée</b> (coefficients stœchiométriques a, b, c, d) ;</li>\n<li>Calculer les quantités initiales : n = m/M, n = C×V (et pour un gaz, n = V/V<sub>m</sub>, V<sub>m</sub> ≈ 22,4 L/mol) ;</li>\n<li>Les proportions de départ sont rarement celles de l'équation : c'est tout l'enjeu du bilan.</li>\n</ul>\n\n<h3>2. Le tableau d'avancement</h3>\n<table>\n<tr><th>État</th><th>a A + b B → c C + d D</th><th>Avancement</th></tr>\n<tr><td>initial</td><td>n₀(A) ; n₀(B) ; 0 ; 0</td><td>x = 0</td></tr>\n<tr><td>intermédiaire</td><td>n₀(A) − a·x ; n₀(B) − b·x ; c·x ; d·x</td><td>x</td></tr>\n<tr><td>final</td><td>n₀(A) − a·x<sub>max</sub> ; ... ; c·x<sub>max</sub> ; d·x<sub>max</sub></td><td>x<sub>max</sub></td></tr>\n</table>\n<div class=\"formule\">x (avancement, en mol) : la « monnaie » qui mesure la progression de la réaction.<br>x<sub>max</sub> = valeur minimale des rapports n₀(réactif)/coefficient</div>\n\n<h3>3. Réactif limitant, mélange stœchiométrique</h3>\n<ul>\n<li>Le <b>réactif limitant</b> est celui dont le rapport n₀/coef est le plus petit : il est épuisé à x<sub>max</sub> ;</li>\n<li>L'autre est en <b>excès</b> : il reste n₀ − coef×x<sub>max</sub> ;</li>\n<li>Mélange <b>stœchiométrique</b> : tous les réactifs disparaissent ensemble (n₀(A)/a = n₀(B)/b) — aucun reste ;</li>\n<li>Les produits finaux se calculent avec x<sub>max</sub> : n = coef×x<sub>max</sub>.</li>\n</ul>\n\n<h3>4. Utiliser le bilan</h3>\n<ul>\n<li>Prévoir le volume d'un gaz produit : V = coef×x<sub>max</sub>×V<sub>m</sub> ;</li>\n<li>Optimiser un procédé : mettre l'autre réactif en excès pour consommer totalement le plus coûteux ;</li>\n<li>Raisonner en « rendement » : les pertes (réactions parasites, non-totalité) font que le réel est souvent inférieur au prévu.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — construire un bilan complet</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> 2,4 g de magnésium (M = 24,0 g/mol) réagissent avec 100 mL d'acide chlorhydrique à 0,50 mol/L : Mg + 2 H⁺ → Mg²⁺ + H₂. Réactif limitant ? Volume de H₂ produit ?</div><div class=\"etu\"><b>Étape 1 — Quantités initiales</b> : n(Mg) = 2,4/24,0 = 0,10 mol ; n(H⁺) = 0,50×0,100 = 0,050 mol.</div><div class=\"etu\"><b>Étape 2 — Rapports</b> : Mg : 0,10/1 = 0,10 ; H⁺ : 0,050/2 = 0,025 → le plus petit est H⁺ : x<sub>max</sub> = 0,025 mol.</div><div class=\"etu\"><b>Étape 3 — Limitant et restes</b> : H⁺ limitant ; Mg restant : 0,10 − 0,025 = 0,075 mol.</div><div class=\"etu\"><b>Étape 4 — Produit</b> : n(H₂) = x<sub>max</sub> = 0,025 mol → V ≈ 0,025 × 24 ≈ 0,6 L de gaz. Toujours : rapport minimal → limitant → x<sub>max</sub> → produits.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Comparer les n₀ bruts au lieu des <b>rapports n₀/coefficient</b> (2 H⁺ « valent » une seule unité d'avancement).</li>\n<li>Oublier le coefficient dans le produit : n(C) = c×x<sub>max</sub>, pas x<sub>max</sub> seul (sauf si c = 1).</li>\n<li>Convertir le volume de gaz avec V<sub>m</sub> en L/mol mais laisser n en mmol : unités cohérentes.</li>\n<li>« Le réactif en plus grande quantité est en excès » : faux si ses coefficients sont plus élevés — d'où le tableau.</li>\n<li>Confondre x<sub>max</sub> théorique et avancement réel d'une réaction limitée (équilibres, cinétique lente).</li>\n</ul>\n</div>"
 },
 {
  "id": "mouvement-forces",
  "theme": "Mouvement et interactions : gravité et forces (1re)",
  "niveau": "1re",
  "titre": "Mouvement et interactions : gravité et forces",
  "cours": "<div class=\"cours-head\"><h2>Mouvement et interactions : gravité et forces</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Trois lois de Newton</h3>\n<div class=\"formule\">1ʳᵉ loi : si ΣF⃗ = 0⃗ (ou aucune force), le centre de masse garde sa vitesse (MRU ou repos).<br>2ᵉ loi : ΣF⃗ = m×a⃗ — la résultante des forces crée l'accélération.<br>3ᵉ loi : action-réaction : A sur B = − (B sur A).</div>\n<ul>\n<li>La 2ᵉ loi est l'outil central : elle relie <b>forces</b> et <b>variation de vitesse</b> ;</li>\n<li>La 3ᵉ loi explique la propulsion (fusée, nageur) : deux corps s'échangent des impulsions opposées.</li>\n</ul>\n\n<h3>2. Champs de gravitation et poids</h3>\n<ul>\n<li>Un <b>champ</b> gravitationnel : en chaque point de l'espace, un objet massif crée une force sur toute masse placée là ;</li>\n<li><b>g</b> = champ de pesanteur local : P⃗ = m×g⃗ ; à la surface terrestre g ≈ 9,81 N/kg ;</li>\n<li>Le champ gravitationnel d'un astre décroît avec la distance (g ∝ 1/r² hors de l'astre) ;</li>\n<li>Poids et force gravitationnelle : le même modèle (au lycée, on les confond à la surface d'un astre).</li>\n</ul>\n\n<h3>3. Chute libre et mouvement dans un champ uniforme</h3>\n<ul>\n<li><b>Chute libre</b> : seul le poids agit (frottements négligés) ;</li>\n<li>Verticale sans vitesse initiale : mouvement rectiligne <b>accéléré</b> uniformément ;</li>\n<li>Avec vitesse initiale horizontale : trajectoire <b>parabolique</b> (projectile) — la composante horizontale reste uniforme, la verticale accélère ;</li>\n<li>Le mouvement ne dépend <b>pas de la masse</b> en chute libre (Galilée, Apollo 15 : marteau et plume ensemble).</li>\n</ul>\n<div class=\"tip\"><b>Ordres de grandeur</b> : la Lune « tombe » en permanence vers la Terre mais sa vitesse latérale la maintient en orbite : c'est un projectile qui « rate » toujours sa cible.</div>\n\n<h3>4. Frottements et limites du modèle</h3>\n<ul>\n<li>Dans l'air, les frottements croissent avec la vitesse : à la <b>vitesse limite</b>, frottements = poids (MRU, 1ʳᵉ loi) ;</li>\n<li>C'est pourquoi la pluie et le parachutiste ne tombent pas indéfiniment en accélérant ;</li>\n<li>Modélisation simple : force de frottement opposée au mouvement, proportionnelle à v (fluide visqueux) ou à v² (air rapide).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — étudier un lancer de projectile</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un ballon est lancé horizontalement à 4,0 m/s d'une hauteur de 1,25 m (g = 9,8 m/s²). Temps de chute et distance parcourue ?</div><div class=\"etu\"><b>Étape 1 — Découpler les axes</b> : horizontal : aucun force → MRU ; vertical : chute libre.</div><div class=\"etu\"><b>Étape 2 — Temps de chute</b> : h = ½ g t² → t = √(2×1,25/9,8) ≈ 0,50 s.</div><div class=\"etu\"><b>Étape 3 — Distance</b> : d = v×t = 4,0 × 0,50 = <b>2,0 m</b>.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : indépendance des deux axes (perpendiculaires) : la trajectoire est une parabole ; la portée dépend de v et de h, jamais de la masse. Réflexe : <b>axes séparés, puis recombiner</b>.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Plus lourd = tombe plus vite » : en chute libre, non (sans air) ; dans l'air, la vitesse limite dépend du rapport masse/surface.</li>\n<li>Utiliser la 3ᵉ loi sur le <b>même</b> système : action et réaction s'appliquent à deux corps différents — elles ne « s'annulent » jamais dans un bilan.</li>\n<li>« La vitesse est proportionnelle au temps » : seulement pour v (v = g×t) en chute libre sans frottement ; la position, elle, varie en t².</li>\n<li>Oublier que a⃗ et v⃗ ne sont pas alignés (mouvement circulaire uniforme : a⃗ centripète, v⃗ tangentiel).</li>\n<li>« g = 9,8 partout » : sur la Lune 1,6 ; en orbite ~8,7 ; c'est un champ, il varie.</li>\n</ul>\n</div>"
 },
 {
  "id": "travail-energie",
  "theme": "Travail et énergie : puissance et transferts (1re)",
  "niveau": "1re",
  "titre": "Travail et énergie : puissance et transferts",
  "cours": "<div class=\"cours-head\"><h2>Travail et énergie : puissance et transferts</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le travail d'une force</h3>\n<ul>\n<li>Le travail <b>W</b> (en joules) mesure l'énergie transférée par une force lors d'un déplacement ;</li>\n<li>Travail <b>moteur</b> (W > 0) : la force aide le mouvement ; <b>résistant</b> (W &lt; 0) : elle s'y oppose ; <b>nul</b> : force perpendiculaire au déplacement.</li>\n</ul>\n<div class=\"formule\">Cas général : W(F⃗) = F × d × cos(α)<br>α = angle entre la force et le déplacement<br>Poids : W(P⃗) = ± m g h (h = dénivelé ; + en descente, − en montée)</div>\n\n<h3>2. Théorème de l'énergie cinétique</h3>\n<div class=\"formule\">ΔE<sub>c</sub> = ΣW(forces) entre deux instants<br>E<sub>c</sub> = ½ m v²</div>\n<ul>\n<li>La variation d'énergie cinétique = somme des travaux de toutes les forces ;</li>\n<li>Applications : freinage (W des frottements négatif), chute (W du poids positif), montée (W négatif) ;</li>\n<li>C'est l'outil le plus rentable quand on connaît les forces sur une <b>distance</b>.</li>\n</ul>\n\n<h3>3. Puissance</h3>\n<div class=\"formule\">P = W / t = E / t<br>P en watts (W), W en joules, t en secondes</div>\n<ul>\n<li>La puissance mesure le <b>rythme</b> du transfert d'énergie ;</li>\n<li>Ordres de grandeur : humain au repos 100 W, cycliste entraîné 250 W, voiture 80 kW = 110 ch, locomotive 5 MW ;</li>\n<li>Rendement d'un moteur : η = P(utile)/P(absorbée) &lt; 1.</li>\n</ul>\n\n<h3>4. Choisir le bon outil</h3>\n<table>\n<tr><th>Question</th><th>Outil</th></tr>\n<tr><td>Forces en fonction du <b>temps</b></td><td>2ᵉ loi de Newton (m a⃗)</td></tr>\n<tr><td>Forces en fonction d'une <b>distance</b></td><td>théorème de l'énergie cinétique</td></tr>\n<tr><td>Rythme de transfert</td><td>puissance P = E/t</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser un freinage</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Voiture 1200 kg à 90 km/h freine et s'arrête sur 50 m. Travail et valeur de la force de freinage ?</div><div class=\"etu\"><b>Étape 1 — Énergies</b> : v = 25 m/s ; E<sub>c</sub> = ½×1200×25² = 375 kJ ; à l'arrêt E<sub>c</sub> = 0 → ΔE<sub>c</sub> = −375 kJ.</div><div class=\"etu\"><b>Étape 2 — Théorème</b> : W(frottements) = ΔE<sub>c</sub> = −375 kJ (le poids et la réaction ne travaillent pas ici).</div><div class=\"etu\"><b>Étape 3 — Force</b> : W = −F×d → F = 375 000/50 = <b>7,5 kN</b>.</div><div class=\"etu\"><b>Étape 4 — Commenter</b> : 7,5 kN ≈ le poids d'une masse de 750 kg : les freins et les pneus « portent » une voiture entière — d'où l'usure et l'échauffement des plaquettes. L'énergie est partie en <b>chaleur</b>.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Oublier le <b>cos α</b> : une force perpendiculaire au mouvement ne travaille pas (réaction normale, fil de pendule perpendiculaire).</li>\n<li>Signe du travail du poids : il dépend du sens du déplacement (+ en descente, − en montée).</li>\n<li>Convertir km/h en m/s avant E<sub>c</sub> = ½ m v² (classique).</li>\n<li>« Puissance = énergie » : P est un débit ; une grande énergie délivrée lentement fait une petite puissance.</li>\n<li>Appliquer le théorème sans recenser <b>toutes</b> les forces.</li>\n</ul>\n</div>"
 },
 {
  "id": "transferts-thermiques",
  "theme": "Transferts thermiques et énergie interne (1re)",
  "niveau": "1re",
  "titre": "Transferts thermiques et énergie interne",
  "cours": "<div class=\"cours-head\"><h2>Transferts thermiques et énergie interne</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Énergie interne et température</h3>\n<ul>\n<li>Un système macroscopique possède une <b>énergie interne</b> U : somme des énergies microscopiques (agitation, interactions) ;</li>\n<li>La <b>température</b> (K, °C) mesure l'agitation thermique moyenne ; T(K) = θ(°C) + 273 ;</li>\n<li>Chauffer = augmenter U ; T augmente (ou l'état change, sans variation de T : fusion, vaporisation).</li>\n</ul>\n<div class=\"formule\">Variation d'énergie interne : ΔU = m × c × ΔT<br>m en kg, c = capacité thermique massique (J/(kg·K)), ΔT en K ou °C<br>Changement d'état : Q = m × L (L : chaleur latente, J/kg)</div>\n<ul>\n<li>c de l'eau : 4185 J/(kg·K) — exceptionnellement élevé (rôle climatique des océans).</li>\n</ul>\n\n<h3>2. Les trois modes de transfert</h3>\n<table>\n<tr><th>Mode</th><th>Mécanisme</th><th>Exemple</th></tr>\n<tr><td><b>conduction</b></td><td>de proche en proche, sans déplacement de matière</td><td>barre de métal chauffée à un bout</td></tr>\n<tr><td><b>convection</b></td><td>matière qui se déplace (fluides)</td><td>air chaud qui monte au-dessus d'un radiateur</td></tr>\n<tr><td><b>rayonnement</b></td><td>ondes électromagnétiques — fonctionne dans le vide</td><td>Soleil, lampe, incendie à distance</td></tr>\n</table>\n<ul>\n<li>Transfert thermique spontané : toujours du <b>chaud vers le froid</b> (jusqu'à l'équilibre) ;</li>\n<li>Le froid ne « vient » pas : la chaleur <b>part</b> — vocabulaire à corriger absolument.</li>\n</ul>\n\n<h3>3. Flux thermique</h3>\n<div class=\"formule\">Flux thermique Φ = Q / Δt (watts)<br>À travers une paroi : Φ = (T<sub>chaud</sub> − T<sub>froid</sub>) / R<br>R = résistance thermique de la paroi (K/W)</div>\n<ul>\n<li>Plus Φ est grand, plus la paroi « fuit » la chaleur ;</li>\n<li>Isolation : augmenter R (épaisseur, matériaux isolants : laine, polystyrène, air immobilisé) ;</li>\n<li>Double vitrage, combles, murs : les priorités d'isolation suivent les pertes réelles d'une maison.</li>\n</ul>\n\n<h3>4. Applications</h3>\n<ul>\n<li>Thermographie : cartographier les pertes d'une maison ;</li>\n<li>Vêtements : emprisonner l'air (isolant s'il ne circule pas) ;</li>\n<li>Cuisine : conduction (poêle), convection (four à air pulsé), rayonnement (grill) ;</li>\n<li>Climat : océans = régulateurs (énorme c de l'eau) ; serre = rayonnement piégé.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — quantifier un bilan thermique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Quelle énergie faut-il pour porter 1,5 L d'eau de 18 °C à ébullition (100 °C) ? Et pour la vaporiser entièrement ? (c = 4185 J/(kg·K) ; L<sub>v</sub> = 2,26×10⁶ J/kg)</div><div class=\"etu\"><b>Étape 1 — Chauffe</b> : m = 1,5 kg ; Q₁ = m×c×ΔT = 1,5×4185×82 ≈ 5,1×10⁵ J.</div><div class=\"etu\"><b>Étape 2 — Vaporisation</b> : Q₂ = m×L<sub>v</sub> = 1,5×2,26×10⁶ ≈ 3,4×10⁶ J.</div><div class=\"etu\"><b>Étape 3 — Comparer</b> : vaporiser coûte <b>≈ 6,7 fois plus</b> que chauffer de 18 à 100 °C : le changement d'état est énergivore.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : c'est pourquoi la sueur rafraîchit (vaporisation qui absorbe) et pourquoi une casserole d'eau bout à T constante : l'énergie sert à l'état, pas à la température.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le froid entre dans la maison » : la chaleur <b>sort</b> ; on limite sa fuite (et l'hiver, on chauffe) — parler en transfert de chaleur.</li>\n<li>Additionner chauffe et changement d'état sans les distinguer (Q₁ puis Q₂ : deux formules différentes).</li>\n<li>°C vs K : ΔT est identique dans les deux unités, mais T(K) = θ + 273 pour les températures absolues.</li>\n<li>« Le métal est froid » : le métal conduit la chaleur <b>hors</b> de ta main — il n'est pas « froid », il est conducteur.</li>\n<li>Oublier que pendant un changement d'état, la <b>température ne varie pas</b>.</li>\n</ul>\n</div>"
 },
 {
  "id": "acides-bases",
  "theme": "Acides et bases : pH et réactions acido-basiques (Terminale)",
  "niveau": "Terminale",
  "titre": "Acides et bases : pH et réactions acido-basiques",
  "cours": "<div class=\"cours-head\"><h2>Acides et bases : pH et réactions acido-basiques</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le pH : définition et mesure</h3>\n<div class=\"formule\">pH = −log([H₃O⁺])<br>[H₃O⁺] = 10⁻ᵖʰ (en mol/L)</div>\n<ul>\n<li>pH &lt; 7 : acide ; pH = 7 : neutre (à 25 °C) ; pH &gt; 7 : basique ;</li>\n<li>Mesure : papier pH (grossier) ou pH-mètre (précision ±0,1, étalonnage obligatoire) ;</li>\n<li>Le pH est <b>logarithmique</b> : ΔpH = 1 → concentration en H₃O⁺ ×10 ; ΔpH = 2 → ×100 ;</li>\n<li>Produit ionique de l'eau : K<sub>e</sub> = [H₃O⁺][HO⁻] = 10⁻¹⁴ à 25 °C (d'où pH neutre = 7).</li>\n</ul>\n\n<h3>2. Acides et bases selon Brønsted</h3>\n<ul>\n<li><b>Acide</b> : espèce capable de <b>céder</b> un proton H⁺ ;</li>\n<li><b>Base</b> : espèce capable de <b>capter</b> un proton H⁺ ;</li>\n<li>Couple AH/A⁻ : AH ⇌ A⁻ + H⁺ (acide éthanoïque/éthanoate, NH₄⁺/NH₃, H₃O⁺/H₂O, H₂O/HO⁻) ;</li>\n<li>L'eau est <b>ampholyte</b> : acide ET base selon le partenaire.</li>\n</ul>\n\n<h3>3. Réaction acido-basique : un échange de protons</h3>\n<div class=\"formule\">Acide 1 + Base 2 → Base 1 + Acide 2<br>Ex. : H₃O⁺ + HO⁻ → 2 H₂O (neutralisation)</div>\n<ul>\n<li>L'équation s'écrit par échange de proton entre deux couples ;</li>\n<li>Acide fort (HCl : dissociation <b>totale</b>) vs acide faible (CH₃COOH : équilibre) ;</li>\n<li>pK<sub>a</sub> = −log(K<sub>a</sub>) : plus pK<sub>a</sub> est petit, plus l'acide est fort ;</li>\n<li>Solutions tampon : mélange équimolaire acide faible/base conjuguée → pH ≈ pK<sub>a</sub>, peu sensible aux dilutions/ajouts.</li>\n</ul>\n\n<h3>4. Titrage (dosage) acido-basique</h3>\n<ul>\n<li>Réaction support : acide + base, rapide, totale, <b>équation connue</b> ;</li>\n<li>À l'<b>équivalence</b> : n(acide) = n(base) selon les coefficients : C<sub>A</sub>V<sub>A</sub> = C<sub>B</sub>V<sub>B</sub> (monoacides) ;</li>\n<li>Suivi : pH-mètre (courbe pH = f(V)) ou indicateur coloré (virage à l'équivalence) ;</li>\n<li>Repère : la courbe présente un <b>saut de pH</b> ; l'équivalence est à la mi-hauteur (méthode des tangentes).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — exploiter une courbe de titrage</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On titre V<sub>A</sub> = 20,0 mL d'acide chlorhydrique par de la soude à C<sub>B</sub> = 0,100 mol/L. Le saut de pH se produit à V<sub>B</sub> = 15,0 mL. Quelle est la concentration de l'acide ?</div><div class=\"etu\"><b>Étape 1 — Équation</b> : H₃O⁺ + HO⁻ → 2 H₂O (coefficients 1-1).</div><div class=\"etu\"><b>Étape 2 — Équivalence</b> : C<sub>A</sub>V<sub>A</sub> = C<sub>B</sub>V<sub>E</sub>.</div><div class=\"etu\"><b>Étape 3 — Calcul</b> : C<sub>A</sub> = 0,100×15,0/20,0 = <b>7,50×10⁻² mol/L</b>.</div><div class=\"etu\"><b>Étape 4 — Lire la courbe</b> : à l'équivalence, pH = 7 (acide fort + base forte) ; la dérivée dpH/dV est maximale : le sommet du pic donne V<sub>E</sub>. Toujours : relation à l'équivalence → concentration inconnue.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« pH 3 est deux fois plus acide que pH 6 » : non — <b>1000 fois</b> (logarithme).</li>\n<li>Confondre <b>équivalence</b> (stœchiométrie) et <b>neutralisation</b> (pH = 7) : à l'équivalence d'un acide faible titré, le pH est &gt; 7.</li>\n<li>Oublier les coefficients dans C<sub>A</sub>V<sub>A</sub> = a×C<sub>B</sub>V<sub>B</sub>/b (diacides).</li>\n<li>« L'acide cède un ion H⁺ libre » : en solution, H⁺ n'existe pas seul : c'est H₃O⁺ (hydronium).</li>\n<li>Diluer un acide ne change pas son <b>ka</b>/force, seulement son pH.</li>\n</ul>\n</div>"
 },
 {
  "id": "cinetique-chimique",
  "theme": "Cinétique chimique : vitesse de réaction (Terminale)",
  "niveau": "Terminale",
  "titre": "Cinétique chimique : vitesse de réaction",
  "cours": "<div class=\"cours-head\"><h2>Cinétique chimique : vitesse de réaction</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Évolution d'un système : avancement x(t)</h3>\n<ul>\n<li>La cinétique étudie l'évolution <b>au cours du temps</b> d'une transformation ;</li>\n<li>Suivi expérimental : volumétrie (n = C×V), absorbance (Beer-Lambert : A ∝ C), pression, masse ;</li>\n<li>La courbe x = f(t) croît puis atteint un <b>plateau</b> : la réaction est finie (ou limitée).</li>\n</ul>\n<div class=\"formule\">Vitesse volumique de réaction : v = (1/V) × dx/dt<br>Graphiquement : pente de la tangente à x(t), divisée par V</div>\n<ul>\n<li>La vitesse <b>décroît</b> généralement au cours du temps (les réactifs s'épuisent) ;</li>\n<li>Temps de demi-réaction t½ : durée pour laquelle x = x<sub>final</sub>/2 — bon indicateur de rapidité.</li>\n</ul>\n\n<h3>2. Facteurs cinétiques</h3>\n<table>\n<tr><th>Facteur</th><th>Effet</th><th>Application</th></tr>\n<tr><td><b>température</b> ↑</td><td>réaction plus rapide</td><td>cuisson, conservation au froid</td></tr>\n<tr><td><b>concentration</b> des réactifs ↑</td><td>réaction plus rapide</td><td>combustion (O₂ pur vs air)</td></tr>\n<tr><td><b>catalyseur</b></td><td>accélère sans être consommé</td><td>convertisseur catalytique, enzymes</td></tr>\n<tr><td>surface de contact ↑</td><td>plus rapide (solides divisés)</td><td>poudre vs bloc, farine explosive</td></tr>\n</table>\n<ul>\n<li>Un catalyseur agit par <b>orientation</b> et abaisse la barrière énergétique ; il ne change ni l'état final, ni l'équilibre ;</li>\n<li>Catalyse homogène (même phase), hétérogène (surface), enzymatique (biologique, très spécifique).</li>\n</ul>\n\n<h3>3. Interprétation microscopique</h3>\n<ul>\n<li>La réaction nécessite des <b>chocs efficaces</b> : choc avec énergie suffisante ET orientation favorable ;</li>\n<li>T°↑ → agitation plus grande → plus de chocs efficaces ;</li>\n<li>C↑ → plus de rencontres ;</li>\n<li>Catalyseur → nouveau chemin réactionnel à énergie d'activation plus basse.</li>\n</ul>\n<div class=\"tip\"><b>Règle de Van 't Hoff</b> (ordre de grandeur) : la vitesse double environ tous les 10 °C : d'où le frigo (+10 jours de conservation pour −20 °C).</div>\n\n<h3>4. Utiliser la cinétique</h3>\n<ul>\n<li>Ralentir : conservation des aliments (froid, vide, séchage), inhibiteurs de corrosion ;</li>\n<li>Accélérer : synthèses industrielles, enzymes du lavage (détérgents biologiques) ;</li>\n<li>Contrôler : allumer un feu (bois : lente ; essence : rapide ; poudre : explosive).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire une courbe x(t) et déterminer une vitesse</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Suivi d'une estérification : x(t) croît, atteint un plateau à x<sub>f</sub> = 9,0 mmol pour t &gt; 90 min. Déterminer t½ et commenter la vitesse à t = 0 et t = 60 min.</div><div class=\"etu\"><b>Étape 1 — t½</b> : x = x<sub>f</sub>/2 = 4,5 mmol → lire sur la courbe : t½ ≈ 15 min.</div><div class=\"etu\"><b>Étape 2 — À t = 0</b> : tangente la plus pentue (réactifs abondants) → vitesse maximale.</div><div class=\"etu\"><b>Étape 3 — À t = 60 min</b> : tangente quasi plate → la réaction ralentit fortement (réactifs épuisés, voisinage de l'équilibre).</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : toute lecture de vitesse se fait par la <b>pente de la tangente</b> ; pour accélérer cette réaction lente, on chauffe ou on élimine l'eau formée (déplacement d'équilibre).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le catalyseur est consommé » : il est <b>régénéré</b> — il ne figure pas dans l'équation bilan.</li>\n<li>« Le catalyseur augmente le rendement final » : il accélère, il ne change <b>pas</b> l'état final.</li>\n<li>Confondre <b>vitesse initiale</b> (pente maximale à t = 0) et vitesse moyenne (Δx/Δt).</li>\n<li>Oublier le facteur 1/V dans v = (1/V)dx/dt quand x est en mol et non mol/L.</li>\n<li>« La réaction s'arrête faute de réactif » : souvent, elle atteint un <b>équilibre</b> (plateau ≠ limitant épuisé) : distinguer les deux sur le plateau.</li>\n</ul>\n</div>"
 },
 {
  "id": "synthese-organique",
  "theme": "Synthèse organique : estérification et polymères (Terminale)",
  "niveau": "Terminale",
  "titre": "Synthèse organique : estérification et polymères",
  "cours": "<div class=\"cours-head\"><h2>Synthèse organique : estérification et polymères</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Familles fonctionnelles à connaître</h3>\n<table>\n<tr><th>Famille</th><th>Groupe</th><th>Exemple</th></tr>\n<tr><td>alcool</td><td>−OH</td><td>éthanol CH₃CH₂OH</td></tr>\n<tr><td>acide carboxylique</td><td>−COOH</td><td>acide éthanoïque</td></tr>\n<tr><td>ester</td><td>−COO−</td><td>éthanoate d'éthyle</td></tr>\n<tr><td>amide</td><td>−CONH−</td><td>lien peptidique (protéines)</td></tr>\n<tr><td>amine</td><td>−NH₂</td><td>—</td></tr>\n</table>\n\n<h3>2. L'estérification</h3>\n<div class=\"formule\">Acide carboxylique + alcool ⇌ ester + eau<br>R−COOH + R'−OH ⇌ R−COO−R' + H₂O (réaction lente, limitée, athermique, catalysable)</div>\n<ul>\n<li>Catalyseur : acide sulfurique (H⁺) ; chauffage à reflux pour accélérer sans perdre de matière ;</li>\n<li>Rendement à l'équilibre ≈ 67 % (alcool primaire) : la réaction est <b>limitée</b> ;</li>\n<li>Pour améliorer : un réactif en <b>excès</b>, ou <b>éliminer l'eau</b> (déshydratant) — déplacement d'équilibre ;</li>\n<li><b>Hydrolyse</b> : réaction inverse (ester + eau → acide + alcool) : même équilibre, sens opposé.</li>\n</ul>\n\n<h3>3. Protocole de synthèse et contrôle</h3>\n<ol>\n<li>Quantités : n = m/M, n = ρV/M (liquides) ;</li>\n<li>Mélange réactifs + catalyseur ; <b>chauffage à reflux</b> (vitesse ↑, rien ne s'évade) ;</li>\n<li>Séparation : lavage, extraction, séchage (attention : l'ester est plus volatile) ;</li>\n<li>Contrôle : pureté (chromatographie, température de fusion), <b>rendement</b> : r = n(obtenue)/n(théorique).</li>\n</ol>\n<div class=\"warn\"><b>Sécurité</b> : chauffe-ballon, réfrigérant à eau, lunettes ; les vapeurs d'ester et d'alcool sont inflammables — pas de flamme nue.</div>\n\n<h3>4. Polymères : la polymérisation</h3>\n<ul>\n<li>Un <b>monomère</b> (petite molécule avec double liaison ou double fonction) s'assemble en <b>polymère</b> par addition ou polycondensation ;</li>\n<li>Polyaddition : n CH₂=CH₂ → −(CH₂−CH₂)ₙ− (polyéthylène : sachets) ;</li>\n<li>Polycondensation (estérification répétée) : PET (bouteilles), polyamides (Nylon), polyesters ;</li>\n<li><b>Indice de polymérisation</b> n : nombre d'unités ; M(polymère) = n×M(motif) ;</li>\n<li>Enjeux : matériaux sur mesure (élastomères, composites) mais <b>persistance environnementale</b> : recyclage, biosourcés.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — calculer le rendement d'une synthèse</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On synthétise l'éthanoate d'éthyle à partir de 0,50 mol d'acide et 0,50 mol d'alcool. On isole 0,31 mol d'ester. Rendement ? Comment l'améliorer ?</div><div class=\"etu\"><b>Étape 1 — Théorique</b> : coefficients 1-1 → n<sub>max</sub> = min(0,50 ; 0,50) = 0,50 mol.</div><div class=\"etu\"><b>Étape 2 — Rendement</b> : r = 0,31/0,50 = <b>62 %</b> — cohérent avec un équilibre limité (≈ 67 % max en conditions simples).</div><div class=\"etu\"><b>Étape 3 — Améliorer</b> : excès d'un réactif, élimination de l'eau, catalyseur (vitesse seulement), distillation fractionnée de l'ester.</div><div class=\"etu\"><b>Étape 4 — Rédiger</b> : un rendement se compare toujours à la limite théorique ; distinguer <b>purification</b> (pertes expérimentales) et <b>équilibre</b> (limiteur intrinsèque) — les deux se cumulent.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le catalyseur améliore le rendement de l'estérification » : il accélère ; pour déplacer l'équilibre, il faut <b>excès ou élimination d'eau</b>.</li>\n<li>Confondre estérification (acide + alcool) et formation d'amide (acide + amine).</li>\n<li>Oublier que la réaction est <b>lente et limitée</b> (double contrainte : reflux + déplacement).</li>\n<li>n du polymère ≠ nombre de motifs si on utilise la masse molaire du monomère avec perte de petite molécule (polycondensation : retrancher H₂O).</li>\n<li>Chauffage à reflux ≠ évaporation : le réfrigérant renvoie tout — c'est un dispositif <b>fermé</b>.</li>\n</ul>\n</div>"
 },
 {
  "id": "cinematique",
  "theme": "Cinématique : vecteurs vitesse et accélération (Terminale)",
  "niveau": "Terminale",
  "titre": "Cinématique : vecteurs vitesse et accélération",
  "cours": "<div class=\"cours-head\"><h2>Cinématique : vecteurs vitesse et accélération</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Repères et vecteurs position</h3>\n<ul>\n<li>Décrire un mouvement : choisir un <b>référentiel</b> (terrestre, géocentrique, héliocentrique) et un repère (O, i⃗, j⃗) ;</li>\n<li>Le vecteur <b>position</b> OM⃗(t) donne les coordonnées (x(t), y(t)) — les <b>équations horaires</b> ;</li>\n<li>La <b>trajectoire</b> s'obtient en éliminant t entre x(t) et y(t).</li>\n</ul>\n\n<h3>2. Vecteur vitesse</h3>\n<div class=\"formule\">v⃗ = dOM⃗/dt — approximation numérique (chronophotographie) :<br>v⃗(M₂) ≈ (M₃ − M₁)/Δt (vecteur autour du point, tangent à la trajectoire)</div>\n<ul>\n<li>Composantes : v<sub>x</sub> = dx/dt, v<sub>y</sub> = dy/dt ; valeur : v = √(v<sub>x</sub>² + v<sub>y</sub>²) ;</li>\n<li>Construction : le vecteur vitesse est <b>tangent</b> à la trajectoire, orienté dans le sens du mouvement ;</li>\n<li>Unité : m/s (convertir km/h ÷ 3,6).</li>\n</ul>\n\n<h3>3. Vecteur accélération</h3>\n<div class=\"formule\">a⃗ = dv⃗/dt — composantes : a<sub>x</sub> = dv<sub>x</sub>/dt = d²x/dt², etc.</div>\n<ul>\n<li>a⃗ mesure la variation du <b>vecteur</b> vitesse : changement de valeur <b>et/ou de direction</b> ;</li>\n<li>Dans un mouvement circulaire uniforme : a⃗ ≠ 0⃗ (la direction change) — il est <b>centripète</b> ;</li>\n<li>Dans un MRU : a⃗ = 0⃗.</li>\n</ul>\n<table>\n<tr><th>Mouvement</th><th>Direction de a⃗</th><th>Valeur de v</th></tr>\n<tr><td>rectiligne accéléré</td><td>celle du mouvement</td><td>augmente</td></tr>\n<tr><td>rectiligne freiné</td><td>opposée au mouvement</td><td>diminue</td></tr>\n<tr><td>circulaire uniforme</td><td>vers le centre</td><td>constante</td></tr>\n<tr><td>parabolique (projectile)</td><td>verticale, vers le bas (g⃗)</td><td>variable</td></tr>\n</table>\n\n<h3>4. Exploiter une chronophotographie</h3>\n<ol>\n<li>Numéroter les points M₀, M₁, M₂... ; relever les coordonnées avec l'échelle ;</li>\n<li>v⃗ en M<sub>i</sub> : construire le vecteur (M<sub>i+1</sub> − M<sub>i−1</sub>)/2Δt ;</li>\n<li>a⃗ en M<sub>i</sub> : différence des vecteurs vitesse voisins, divisée par Δt ;</li>\n<li>Vérifier la cohérence avec le bilan des forces (ΣF⃗ = m a⃗).</li>\n</ol>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — construire v⃗ et a⃗ sur un enregistrement</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Chronophotographie d'un lancer (Δt = 60 ms, échelle 1/10) : M₁(0,10 ; 0,30), M₂(0,13 ; 0,28), M₃(0,16 ; 0,24) en mètres. Construire v⃗(M₂) et commenter.</div><div class=\"etu\"><b>Étape 1 — Corriger l'échelle</b> : les positions données sont déjà réelles (m).</div><div class=\"etu\"><b>Étape 2 — Vecteur déplacement</b> : M₃ − M₁ = (0,06 ; −0,06) m.</div><div class=\"etu\"><b>Étape 3 — Vitesse</b> : diviser par 2Δt = 0,12 s → v⃗ = (0,5 ; −0,5) m/s ; v ≈ 0,71 m/s, dirigée vers le bas-droite, tangente à la trajectoire.</div><div class=\"etu\"><b>Étape 4 — Commenter</b> : la composante horizontale reste ≈ constante (0,5) alors que la verticale est passée de positive à négative : signature d'un <b>projectile</b> (a⃗ = g⃗ vertical) : la construction graphique révèle la physique.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Vitesse constante = accélération nulle » : faux si la <b>direction</b> change (circulaire uniforme : a ≠ 0).</li>\n<li>Diviser par Δt au lieu de <b>2Δt</b> pour le vecteur vitesse centré (points voisins M<sub>i±1</sub>).</li>\n<li>Oublier l'<b>échelle</b> de la chronophotographie avant tout calcul.</li>\n<li>a⃗ n'est pas orienté comme v⃗ en général (mouvement en courbe : a⃗ centripète).</li>\n<li>Confondre trajectoire (lieu géométrique) et équations horaires (x(t), y(t)).</li>\n</ul>\n</div>"
 },
 {
  "id": "newton-champ-uniforme",
  "theme": "Deuxième loi de Newton et mouvements dans un champ uniforme (Terminale)",
  "niveau": "Terminale",
  "titre": "Deuxième loi de Newton et mouvements dans un champ uniforme",
  "cours": "<div class=\"cours-head\"><h2>Deuxième loi de Newton et mouvements dans un champ uniforme</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La deuxième loi de Newton</h3>\n<div class=\"formule\">ΣF⃗ = m × a⃗ = dp⃗/dt (quantité de mouvement p⃗ = m v⃗)<br>Dans un champ uniforme (g⃗ ou E⃗ constants) : a⃗ = g⃗ ou a⃗ = qE⃗/m (indépendant de la vitesse initiale)</div>\n<ul>\n<li>Méthode générale : (1) définir système + référentiel, (2) bilan des forces, (3) appliquer ΣF⃗ = m a⃗, (4) intégrer avec les conditions initiales ;</li>\n<li>Toute résolution passe par la séparation des <b>axes</b> (projections).</li>\n</ul>\n\n<h3>2. Chute libre dans le champ de pesanteur</h3>\n<div class=\"formule\">Axes (Ox horizontal, Oy vertical ascendant, v₀ horizontal) :<br>x(t) = v₀t ; y(t) = −½ g t²<br>Trajectoire : y = −g x²/(2 v₀²) — une <b>parabole</b></div>\n<ul>\n<li>Flèche (hauteur max) : h = v₀²/(2g) ; portée : d = v₀√(2h₀/g) si lâché de h₀ ;</li>\n<li>Le mouvement ne dépend <b>pas de la masse</b> ;</li>\n<li>Exemple : un objet lâché d'un avion en vol horizontal : il « suit » l'avion en dessous (indépendance des axes).</li>\n</ul>\n\n<h3>3. Particule chargée dans un champ électrique uniforme</h3>\n<ul>\n<li>Force électrique F⃗ = qE⃗ (indépendante de la vitesse) ;</li>\n<li>Entre plaques parallèles : E = U/d ; a⃗ = qE⃗/m : trajectoire parabolique (oscilloscope, écran cathodique, déflecteur) ;</li>\n<li>Si q &lt; 0 : déviation opposée à E⃗ ;</li>\n<li>Accélérateur de particules : champ qui accélère (travail W = qU → variation d'énergie cinétique).</li>\n</ul>\n\n<h3>4. Mouvements dans un champ magnétique (aperçu)</h3>\n<ul>\n<li>Force magnétique F⃗ = q v⃗ ∧ B⃗ : <b>perpendiculaire</b> à v⃗ → elle ne travaille pas : la valeur de la vitesse est constante ;</li>\n<li>Trajectoire : <b>cercle</b> de rayon r = mv/(|q|B) ;</li>\n<li>Applications : cyclotron, spectrographe de masse, déviation des aurores vers les pôles.</li>\n</ul>\n<div class=\"tip\"><b>Comparer</b> : champ E⃗ → déviation parabolique (force constante) ; champ B⃗ → déviation circulaire (force ⊥ v⃗) : deux signatures expérimentales différentes.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — établir les équations d'un projectile complet</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un projectile est lancé avec v₀ = 20 m/s à α = 30° au-dessus de l'horizontale, du sol (g = 9,8). Portée et flèche ?</div><div class=\"etu\"><b>Étape 1 — Décomposer v₀</b> : v<sub>0x</sub> = 20 cos30° ≈ 17,3 ; v<sub>0y</sub> = 20 sin30° = 10,0 m/s.</div><div class=\"etu\"><b>Étape 2 — Équations</b> : x = 17,3 t ; y = 10,0 t − 4,9 t².</div><div class=\"etu\"><b>Étape 3 — Flèche</b> : sommet quand v<sub>y</sub> = 0 → t = 10,0/9,8 ≈ 1,02 s ; h ≈ 10,0×1,02 − 4,9×1,02² ≈ <b>5,1 m</b>.</div><div class=\"etu\"><b>Étape 4 — Portée</b> : y = 0 → t = 2×1,02 s ; d = 17,3×2,04 ≈ <b>35 m</b>. Toujours : décomposition, intégration axe par axe, conditions de retombée — la méthode est identique pour toute chute dans un champ uniforme.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La masse intervient dans la trajectoire » : en champ uniforme (chute libre, champ E pour une particule donnée), non — a⃗ = g⃗ ou qE⃗/m dépend de q/m, pas de v₀.</li>\n<li>« La force magnétique accélère la particule » : elle est ⊥ v⃗ : elle <b>courbe</b> sans changer la valeur de v (pas de travail).</li>\n<li>Oublier les <b>conditions initiales</b> à l'intégration (constantes d'intégration = x₀, v₀).</li>\n<li>Signes : axe ascendant → a<sub>y</sub> = −g.</li>\n<li>« Champ uniforme = force nulle » : uniforme = <b>même valeur partout</b>, pas nulle.</li>\n</ul>\n</div>"
 },
 {
  "id": "energies-mecaniques",
  "theme": "Énergies mécaniques : conservation et transferts (Terminale)",
  "niveau": "Terminale",
  "titre": "Énergies mécaniques : conservation et transferts",
  "cours": "<div class=\"cours-head\"><h2>Énergies mécaniques : conservation et transferts</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois énergies mécaniques</h3>\n<div class=\"formule\">E<sub>c</sub> = ½ m v² (mouvement)<br>E<sub>pp</sub> = m g z (altitude, axe ascendant)<br>E<sub>m</sub> = E<sub>c</sub> + E<sub>pp</sub></div>\n<ul>\n<li>Travail du poids : W = −ΔE<sub>pp</sub> = mg(z<sub>départ</sub> − z<sub>arrivée</sub>) ;</li>\n<li>En joules ; ces formes se convertissent l'une dans l'autre pendant un mouvement.</li>\n</ul>\n\n<h3>2. Conservation ou dissipation</h3>\n<div class=\"formule\">Sans frottements (forces conservatives) : E<sub>m</sub> = constante<br>Avec frottements : ΔE<sub>m</sub> = W(frottements) &lt; 0</div>\n<ul>\n<li>Théorème de l'énergie mécanique : ΔE<sub>m</sub> = ΣW(forces non conservatives) ;</li>\n<li>La perte d'E<sub>m</sub> part en <b>chaleur</b> (frottements) — l'énergie totale, elle, se conserve toujours ;</li>\n<li>Applications : montagnes russes (E<sub>m</sub> constante : les sommets sont plus bas que le premier), pendule (amorti), véhicule freinant.</li>\n</ul>\n\n<h3>3. Oscillateurs : pendule et ressort</h3>\n<ul>\n<li>Pendule simple : E<sub>m</sub> oscille entre E<sub>pp</sub> (aux extrêmes) et E<sub>c</sub> (au passage à l'équilibre) ;</li>\n<li>Ressort : E<sub>pp</sub> = ½ k x² (k : raideur, x : élongation) ; période T = 2π√(m/k) ou T = 2π√(L/g) (pendule) ;</li>\n<li>Sans frottement : oscillations <b>perpétuelles</b> (modèle) ; avec : amortissement exponentiel, régime pseudo-périodique puis apériodique.</li>\n</ul>\n\n<h3>4. Choisir énergie ou Newton ?</h3>\n<table>\n<tr><th>Situation</th><th>Outil privilégié</th></tr>\n<tr><td>position ↔ vitesse sans le détail du chemin</td><td>conservation de E<sub>m</sub></td></tr>\n<tr><td>effet du temps, trajectoire complète</td><td>2ᵉ loi de Newton</td></tr>\n<tr><td>freinage, frottements sur une distance</td><td>ΔE<sub>m</sub> = W(frott.)</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — analyser une descente avec frottements</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un skieur (80 kg) part de vitesse nulle du haut d'une piste (dénivelé h = 50 m) et arrive en bas à v = 25 m/s. Énergie dissipée ?</div><div class=\"etu\"><b>Étape 1 — Initial</b> : E<sub>m,i</sub> = mgh = 80×9,8×50 = 39,2 kJ (E<sub>c</sub> = 0).</div><div class=\"etu\"><b>Étape 2 — Final</b> : E<sub>m,f</sub> = ½×80×25² = 25,0 kJ (z = 0).</div><div class=\"etu\"><b>Étape 3 — Dissipation</b> : ΔE<sub>m</sub> = 25,0 − 39,2 = −14,2 kJ = W(frottements + air) : <b>14 kJ partis en chaleur</b> (36 % de l'énergie initiale).</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : ΔE<sub>m</sub> donne directement l'énergie dissipée <b>sans connaître le détail de la piste</b> : c'est la puissance des bilans d'énergie — impossible à faire avec Newton seul sans la forme exacte de la piste.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« E<sub>m</sub> se conserve toujours » : uniquement <b>sans frottement</b> (ou forces non conservatives nulles) — sinon ΔE<sub>m</sub> &lt; 0.</li>\n<li>Origine de l'axe z : E<sub>pp</sub> dépend de la référence choisie ; seul ΔE<sub>pp</sub> en est indépendant.</li>\n<li>km/h → m/s avant E<sub>c</sub> (et oublier le ½).</li>\n<li>« La perte d'E<sub>m</sub> est une disparition » : c'est un transfert vers l'<b>énergie thermique</b> de l'environnement.</li>\n<li>Appliquer T = 2π√(L/g) à un ressort ou inversement : bien associer chaque période à son oscillateur.</li>\n</ul>\n</div>"
 },
 {
  "id": "ondes-term",

  "niveau": "Terminale",

  "cours": "<div class=\"cours-head\"><h2>Ondes : interférences et effet Doppler</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Caractériser une onde</h3>\n<div class=\"formule\">λ = v × T = v / f<br>v (célérité, m/s), T (période, s), f (fréquence, Hz), λ (longueur d'onde, m)</div>\n<ul>\n<li>Onde progressive : la perturbation voyage ; les points du milieu oscillent <b>sur place</b> ;</li>\n<li>Retard τ = d/v : deux points séparés de d vibrent avec ce décalage ;</li>\n<li>Ondes mécaniques (son, eau) vs électromagnétiques (lumière, radio) ; c = 3,00×10⁸ m/s dans le vide.</li>\n</ul>\n\n<h3>2. Interférences : superposer deux ondes</h3>\n<ul>\n<li>Deux sources <b>cohérentes</b> (même fréquence, phase fixe) : l'amplitude en un point dépend du <b>chemin optique</b> ;</li>\n<li>Constructive si la différence de chemin δ = kλ (en phase → maximum) ; destructive si δ = (k+½)λ (opposition → silence/franges sombres) ;</li>\n<li>Applications : franges de Young (mesurer λ !), casques anti-bruit (opposition de phase), colors de bulles de savon, CD/DVD (pistes = réseau) ;</li>\n<li>Figure de diffraction : une ouverture de taille a ≈ λ étale le faisceau ; largeur de tache ∝ λ/a.</li>\n</ul>\n<div class=\"tip\"><b>Critère</b> : la diffraction apparaît quand l'obstacle est de la taille de λ ; les interférences exigent la <b>cohérence</b> — deux lampes de poche différentes n'interfèrent pas.</div>\n\n<h3>3. Effet Doppler : la vitesse décale la fréquence</h3>\n<div class=\"formule\">Source qui s'approche : f' = f × v/(v − v<sub>s</sub>) &gt; f (son plus aigu)<br>Source qui s'éloigne : f' = f × v/(v + v<sub>s</sub>) &lt; f (son plus grave)</div>\n<ul>\n<li>Mécanisme : l'onde « s'empile » devant la source mobile, « s'étire » derrière ;</li>\n<li>Exemples : sirène de pompier qui passe (aigu → grave à l'instant du passage), Formule 1 ;</li>\n<li>Applications majeures : <b>radars</b> (vitesse des véhicules), <b>échographie Doppler</b> (flux sanguin), <b>redshift</b> des galaxies (expansion de l'Univers), vitesse des étoiles (exoplanètes).</li>\n</ul>\n\n<h3>4. Ondes et mesure</h3>\n<ul>\n<li>Interférences + diffraction : mesurer des longueurs d'onde (et donc des objets minuscules) ;</li>\n<li>Doppler : mesurer des <b>vitesses</b> à distance (radar, astrophysique) ;</li>\n<li>L'onde est l'outil de mesure de la physique moderne : LIGO (ondes gravitationnelles détectées par interférence laser, longueur mesurée au 10⁻¹⁸ m).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — calculer une vitesse par effet Doppler</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une sirène émet f = 1000 Hz ; un auditeur fixe perçoit f' = 1080 Hz quand la source s'approche (v = 340 m/s). Vitesse de la source ?</div><div class=\"etu\"><b>Étape 1 — Formule</b> : f'/f = v/(v − v<sub>s</sub>).</div><div class=\"etu\"><b>Étape 2 — Isoler</b> : v − v<sub>s</sub> = v×f/f' → v<sub>s</sub> = v(1 − f/f') = 340×(1 − 1000/1080).</div><div class=\"etu\"><b>Étape 3 — Calcul</b> : v<sub>s</sub> ≈ 340×0,0741 ≈ <b>25 m/s (≈ 90 km/h)</b>.</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : f' &gt; f (approche) : cohérent ; ordre de grandeur plausible pour un véhicule. Le radar fait exactement ce calcul — avec l'onde réfléchie (facteur 2, car aller-retour).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre λ = vT et v = λf : mêmes grandeurs, mais toujours vérifier les unités (T en s, f en Hz).</li>\n<li>« Interférences avec n'importe quelles sources » : il faut la <b>cohérence</b> (même fréquence, phase stable).</li>\n<li>Diffraction : « ça se produit seulement avec la lumière » : avec toute onde, à condition que l'ouverture ≈ λ (d'où l'on entend autour des portes, pas voir à travers).</li>\n<li>Doppler : inverser les signes (approche → aigu, éloignement → grave) ; radar réfléchi : décalage <b>double</b>.</li>\n<li>« L'onde transporte les points du milieu » : ils oscillent sur place ; seule l'énergie voyage.</li>\n</ul>\n</div>"
 },

  "cours": "<div class=\"cours-head\"><h2>Poids et gravitation</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Poids et masse : deux grandeurs différentes</h3>\n<table>\n<tr><th></th><th>Masse m</th><th>Poids P</th></tr>\n<tr><td>définition</td><td>quantité de matière</td><td>force d'attraction gravitationnelle</td></tr>\n<tr><td>unité</td><td>kilogramme (kg)</td><td>newton (N)</td></tr>\n<tr><td>dépend du lieu ?</td><td><b>non</b> (même masse partout)</td><td><b>oui</b> (g varie avec le lieu)</td></tr>\n<tr><td>mesure</td><td>balance</td><td>dynamomètre</td></tr>\n</table>\n<div class=\"formule\">P = m × g<br>P en N, m en kg, g (intensité de la pesanteur) ≈ 9,8 N/kg sur Terre (≈ 1,6 sur la Lune)</div>\n<ul>\n<li>Exemple : m = 60 kg → P ≈ 588 N sur Terre, ≈ 96 N sur la Lune : même corps, poids différent ;</li>\n<li>Le poids se représente par une <b>flèche</b> (vecteur) verticale, vers le bas, partant du centre de gravité.</li>\n</ul>\n\n<h3>2. La gravitation universelle</h3>\n<ul>\n<li>Tous les corps s'<b>attirent</b> mutuellement : c'est l'<b>interaction gravitationnelle</b> ;</li>\n<li>Elle dépend des <b>masses</b> (produit) et de la <b>distance</b> (elle diminue avec le carré de la distance) ;</li>\n<li>Elle est <b>toujours attractive</b> ;</li>\n<li>À notre échelle elle est imperceptible entre objets du quotidien (masses trop faibles) ; elle domine à l'échelle astronomique (masses énormes).</li>\n</ul>\n<div class=\"tip\"><b>Pourquoi la Lune tourne autour de la Terre</b> : la Terre l'attire en permanence ; cette attraction courbe sans cesse sa trajectoire en cercle — la Lune « tombe » en permanence vers nous sans jamais nous atteindre.</div>\n\n<h3>3. Le système solaire et au-delà</h3>\n<ul>\n<li>8 planètes (Mercure → Neptune) gravitent autour du Soleil (attraction gravitationnelle) ;</li>\n<li>La <b>Terre</b> : satellites naturels (la Lune) et artificiels (ISS, GPS, météo) ;</li>\n<li>Un satellite en orbite est en <b>chute permanente</b> : assez rapide pour « rater » la Terre à chaque instant ;</li>\n<li>La gravité organise aussi les galaxies — l'Univers entier est structuré par elle.</li>\n</ul>\n\n<h3>4. Poids et énergie</h3>\n<ul>\n<li>L'énergie de position (potentielle) augmente avec l'altitude : E<sub>p</sub> ≈ m×g×h ;</li>\n<li>Chute : l'énergie de position se convertit en énergie <b>cinétique</b> (la vitesse augmente) ;</li>\n<li>Applications : hydroliennes et barrages (l'eau qui tombe produit de l'électricité), montagnes russes, sports d'hiver.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — calculer un poids et changer de planète</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un sac de 15 kg. Calculer son poids sur Terre, puis sur la Lune (g ≈ 1,6 N/kg). Que change le voyage spatial ?</div><div class=\"etu\"><b>Étape 1 — Sur Terre</b> : P = 15 × 9,8 ≈ <b>147 N</b>.</div><div class=\"etu\"><b>Étape 2 — Sur la Lune</b> : P = 15 × 1,6 = <b>24 N</b>.</div><div class=\"etu\"><b>Étape 3 — Masse ?</b> : 15 kg partout — la quantité de matière n'a pas changé.</div><div class=\"etu\"><b>Étape 4 — Interpréter</b> : le spationaute « pèse » 6× moins mais garde sa masse : tout déplacement reste énergivore — le vrai changement vient du <b>lieu</b> (g), pas du corps.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Masse et poids, c'est pareil » : masse en <b>kg</b> (invariable), poids en <b>N</b> (variable).</li>\n<li>« Sur la Lune, on est plus léger → moins de masse » : même masse, poids ÷ 6.</li>\n<li>« La gravité n'agit qu'au sol » : elle diminue avec la distance mais ne s'annule <b>jamais</b> (ISS : 90 % de g terrestre, mais en chute libre permanente).</li>\n<li>« g = 9,8 partout sur Terre » : il varie légèrement (équateur/pôles, altitude).</li>\n<li>Utiliser g en « m/s² » ou « N/kg » sans unité cohérente avec P = m×g : vérifier N = kg × N/kg.</li>\n</ul>\n</div>"
 }

  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Puissance (W) = débit d'énergie ; étiquette des appareils.</li>\n<li>E = P × t ; en kWh (P en kW, t en h) — l'unité de la facture.</li>\n<li>Coût = kWh × prix unitaire.</li>\n<li>Sobriété : LED, veilles coupées, chauffage mesuré.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Convertir W → kW avant tout calcul de kWh.</li>\n<li>Multiplier par la durée réelle d'usage (heures/jour × jours).</li>\n<li>Comparer deux appareils sur l'année (achat + consommation).</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>W = puissance ; kWh = énergie.</li>\n<li>Durée d'usage aussi importante que puissance.</li>\n<li>Veilles = fuite continue.</li>\n</ul>"
 },
 {
  "id": "signaux",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Signal = information sans transport de matière ; sonore (milieu requis) vs lumineux (même dans le vide).</li>\n<li>Vitesses : son ≈ 340 m/s ; lumière ≈ 300 000 km/s.</li>\n<li>Atténuation, réflexion, absorption guident le choix d'un signal.</li>\n<li>Sécurité : redondance son + lumière.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Choisir le signal selon le milieu et le récepteur.</li>\n<li>Calculer un délai ou une distance avec la vitesse.</li>\n<li>Expliquer un écho ou un décalage éclair/tonnerre.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Lumière > son ; vide OK pour elle, interdit au son.</li>\n<li>Atténuation ≠ arrêt total.</li>\n<li>Signaux redondants en sécurité.</li>\n</ul>"
 },
 {
  "id": "atomes-ions",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Atome neutre = protons (+) = électrons (−) ; masse dans le noyau.</li>\n<li>Cation = perte d'électrons ; anion = gain ; l'élément ne change pas.</li>\n<li>Solide ionique neutre : charges échangées puis compensées (NaCl, CaCl₂, Al₂O₃).</li>\n<li>Tests : Cl⁻ (nitrate d'argent, blanc), Fe²⁺/Fe³⁺ (soude, vert/rouille), Cu²⁺ (bleu).</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Calculer une charge : protons − électrons.</li>\n<li>Construire une formule ionique par échange des charges.</li>\n<li>Vérifier la neutralité totale avant de conclure.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Seuls les électrons bougent.</li>\n<li>Cl⁻ ≠ Cl₂.</li>\n<li>Formule calculée, jamais devinée.</li>\n</ul>"
 },
 {
  "id": "transformations-chimiques",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Réactifs → produits ; atomes et masse conservés, molécules réarrangées.</li>\n<li>Ajuster avec les coefficients : C, H, puis O.</li>\n<li>Équations types : CH₄ + 2 O₂ → CO₂ + 2 H₂O ; C + O₂ → CO₂.</li>\n<li>Tests : CO₂ (eau de chaux), H₂ (aboiement).</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Écrire les formules correctes.</li>\n<li>Ajuster élément par élément.</li>\n<li>Vérifier atomes ET charges avant de conclure.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Jamais toucher aux indices.</li>\n<li>La masse se conserve, gaz compris.</li>\n<li>Coefficient ≠ indice.</li>\n</ul>"
 },
 {
  "id": "lois-circuits",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>I : ampèremètre en série ; U : voltmètre en dérivation.</li>\n<li>Série : I unique partout, tensions qui s'ajoutent ; dérivation : U commune, I qui se partage.</li>\n<li>Loi d'Ohm : U = R×I (dipôles ohmiques seulement).</li>\n<li>Diagnostic : circuit ouvert → toute la tension aux bornes de la coupure.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Choisir le bon appareil et son branchement.</li>\n<li>Appliquer unicité/additivité selon le type de circuit.</li>\n<li>Calculer une grandeur manquante avec U = R×I.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>I identique en série (pas d'usure).</li>\n<li>6 V aux bornes d'une lampe éteinte = lampe coupée.</li>\n<li>Ohm : uniquement conducteurs ohmiques.</li>\n</ul>"
 },
 {
  "id": "energie-cinetique",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>E<sub>c</sub> = ½ m v² ; en J, m en kg, v en m/s.</li>\n<li>Facteur dominant : <b>v²</b> (2× la vitesse → 4× l'énergie).</li>\n<li>Distance d'arrêt = réaction + freinage ; freinage ∝ v².</li>\n<li>Sécurité = dissiper l'énergie : ceinture, airbag, zones de déformation, casque.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Convertir km/h → m/s avant tout calcul.</li>\n<li>Appliquer E<sub>c</sub> = ½ m v² et comparer deux situations (ratio v²).</li>\n<li>Relier E<sub>c</sub> aux protections (durée du choc).</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>km/h interdit dans la formule.</li>\n<li>v² : ×2 → ×4.</li>\n<li>Ne pas oublier le ½.</li>\n</ul>"
 },
 {
  "id": "matiere-echelles",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Échelles lacunaires : atome 10⁻¹⁰ m, noyau 10⁻¹⁵ m ; notation scientifique a×10ⁿ.</li>\n<li><sub>Z</sub><sup>A</sup>X : Z protons (élément), A − Z neutrons ; isotopes : même Z.</li>\n<li>Couches K(2), L(8), M(8) ; règle de l'octet → ions.</li>\n<li>Charge ion = Z − électrons.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Décomposer la notation en protons/neutrons/électrons.</li>\n<li>Répartir les électrons en couches et prévoir l'ion stable.</li>\n<li>Exprimer les ordres de grandeur en notation scientifique.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Neutrons = A − Z.</li>\n<li>Isotopes : même Z, A ≠.</li>\n<li>Matière lacunaire, pas pleine.</li>\n</ul>"
 },
 {
  "id": "mole-concentration",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>n = N/N<sub>A</sub> ; une mole = 6,02×10²³ entités.</li>\n<li>n = m/M ; M moléculaire = somme des M atomiques (g/mol).</li>\n<li>C = n/V (mol/L) ; C<sub>m</sub> = C×M.</li>\n<li>Dilution : n constant, C divisée par le facteur F.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Calculer M, puis n, puis m (ou l'inverse selon la donnée).</li>\n<li>Préparer par dissolution : balance + fiole jaugée.</li>\n<li>Diluer : pipette jaugée, facteur F = Cmère/Cfille.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Volume de solution, pas de solvant.</li>\n<li>mL → L obligatoire.</li>\n<li>Mole = nombre d'entités, pas une masse.</li>\n</ul>"
 },
 {
  "id": "forces-inertie",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Force = vecteur (point, direction, sens, valeur en N) ; localisée ou à distance.</li>\n<li>Poids : P = m×g, vertical, vers le bas, au centre de gravité.</li>\n<li>Principe d'inertie : immobile ou MRU ⇔ forces qui se compensent.</li>\n<li>Variation de mouvement ⇔ forces non compensées.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Définir le système, recenser les actions (diagramme objets-interactions).</li>\n<li>Représenter les vecteurs forces subies.</li>\n<li>Conclure sur le mouvement via le principe d'inertie.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Se compenser = somme vectorielle nulle.</li>\n<li>Pas de force nécessaire pour un MRU.</li>\n<li>Ne dessiner que les forces subies.</li>\n</ul>"
 },
 {
  "id": "ondes-signaux",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Onde = énergie sans matière ; mécanique (son : milieu requis) vs électromagnétique (lumière : même dans le vide).</li>\n<li>vitesses : son 340 m/s (air) ; lumière 3,00×10⁸ m/s.</li>\n<li>Signal périodique : T (s) et f = 1/T (Hz).</li>\n<li>Mesures : d = v×t ; écho → distance ÷ 2.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Identifier le type d'onde et le milieu.</li>\n<li>Mesurer T sur un oscillogramme, calculer f = 1/T.</li>\n<li>Calculer une distance ou un délai (orage, sonar, radar).</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Pas de son dans le vide.</li>\n<li>f = 1/T avec T en secondes.</li>\n<li>Écho : diviser par 2.</li>\n</ul>"
 },
 {
  "id": "conversions-energie",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Formes : cinétique, potentielle, chimique, électrique, thermique, lumineuse, nucléaire ; J et kWh (1 kWh = 3,6 MJ).</li>\n<li>Conversion conservée : E consommée = utile + dissipée ; rendement η = utile/consommée &lt; 1.</li>\n<li>Renouvelables vs fossiles ; électricité via alternateur.</li>\n<li>Sobriété : réduire la demande avant d'optimiser la production.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Identifier les formes d'énergie dans une chaîne.</li>\n<li>Calculer un rendement et une énergie perdue.</li>\n<li>Comparer deux dispositifs à service égal.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>η &lt; 1 toujours.</li>\n<li>Énergie ≠ puissance (E = P×t).</li>\n<li>kWh ↔ J : facteur 3,6×10⁶.</li>\n</ul>"
 },
 {
  "id": "solutions-1re",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>C = n/V ; dissolution : m = C×V×M.</li>\n<li>Dilution : n conservée ; F = V(fille)/V(prélevé) = C(mère)/C(fille).</li>\n<li>Étalonnage : gamme + droite (absorbance/conductivité) → lecture de C.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Calculer m à peser, rédiger le protocole fiole jaugée.</li>\n<li>Calculer F et V(prélevé) ; justifier par la conservation de n.</li>\n<li>Exploiter une droite d'étalonnage (domaine linéaire).</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Verrerie jaugée obligatoire.</li>\n<li>Rincer et transvaser avant complètement.</li>\n<li>mL → L systématique.</li>\n</ul>"
 },
 {
  "id": "bilan-matiere",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Tableau d'avancement : x en mol ; produits = coef×x.</li>\n<li>x<sub>max</sub> = min(n₀/coef) → réactif limitant.</li>\n<li>Stœchiométrie : n₀/coef égaux → tout consommé.</li>\n<li>Gaz : V = n×V<sub>m</sub> (≈ 24 L/mol à 20 °C).</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Ajuster, calculer les n₀ (m/M, C×V, V/V<sub>m</sub>).</li>\n<li>Remplir le tableau, chercher x<sub>max</sub> par le rapport minimal.</li>\n<li>En déduire restes et produits (dont volumes de gaz).</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Comparer n₀/coef, pas n₀.</li>\n<li>Produits = coef×x<sub>max</sub>.</li>\n<li>Unités cohérentes (mL→L, mmol).</li>\n</ul>"
 },
 {
  "id": "mouvement-forces",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>1ʳᵉ loi : ΣF = 0 → MRU/repos ; 2ᵉ : ΣF⃗ = m a⃗ ; 3ᵉ : action-réaction.</li>\n<li>P⃗ = m g⃗ ; champ gravitationnel ∝ 1/r².</li>\n<li>Chute libre : indépendante de la masse ; projectile : parabole (axes découplés).</li>\n<li>Frottements → vitesse limite (MRU terminal).</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Bilan de forces, appliquer ΣF⃗ = m a⃗ axe par axe.</li>\n<li>Chute libre : h = ½ g t², v = g t.</li>\n<li>Projectile : horizontal MRU + vertical chute, recombiner.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Action-réaction sur deux corps.</li>\n<li>Chute libre sans masse.</li>\n<li>g varie (champ).</li>\n</ul>"
 },
 {
  "id": "travail-energie",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>W = F d cos α ; moteur &gt; 0, résistant &lt; 0, nul si ⊥.</li>\n<li>Poids : W = ± m g h.</li>\n<li>ΔE<sub>c</sub> = ΣW (théorème de l'énergie cinétique).</li>\n<li>P = W/t (W) ; rendement η = P<sub>utile</sub>/P<sub>absorbée</sub>.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Choisir Newton (temps) ou théorème (distance).</li>\n<li>Calculer ΔE<sub>c</sub>, égaler à la somme des travaux.</li>\n<li>En déduire force, distance ou vitesse.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>cos α et signes.</li>\n<li>km/h → m/s.</li>\n<li>Toutes les forces dans ΣW.</li>\n</ul>"
 },
 {
  "id": "transferts-thermiques",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>ΔU = m c ΔT ; changement d'état : Q = m L (à T constante).</li>\n<li>Trois modes : conduction, convection, rayonnement ; du chaud vers le froid.</li>\n<li>Flux Φ = Q/Δt ; paroi : Φ = ΔT/R.</li>\n<li>Isolation : augmenter R ; eau : c très élevé.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Distinguer échauffement et changement d'état.</li>\n<li>Calculer Q, en déduire durée (P = Q/Δt) ou flux.</li>\n<li>Comparaison des parois par R.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>La chaleur sort, le froid n'entre pas.</li>\n<li>Deux formules : c·ΔT et L.</li>\n<li>T constante pendant le changement d'état.</li>\n</ul>"
 },
 {
  "id": "acides-bases",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>pH = −log[H₃O⁺] ; ΔpH = 1 → facteur 10 ; K<sub>e</sub> = 10⁻¹⁴ (25 °C).</li>\n<li>Brønsted : acide = donneur de H⁺, base = accepteur ; couple AH/A⁻.</li>\n<li>Fort = dissociation totale ; faible = équilibre (pK<sub>a</sub>).</li>\n<li>Titrage : à l'équivalence, C<sub>A</sub>V<sub>A</sub> = C<sub>B</sub>V<sub>E</sub> (selon coefficients).</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Convertir pH ↔ [H₃O⁺] (10⁻ᵖʰ).</li>\n<li>Écrire l'équation par couples, prévoir la réaction.</li>\n<li>Exploiter une courbe : V<sub>E</sub> → concentration ; pH à la demi-équivalence = pK<sub>a</sub>.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>pH logarithmique.</li>\n<li>Équivalence ≠ pH 7 (sauf fort/fort).</li>\n<li>Coefficients dans la relation d'équivalence.</li>\n</ul>"
 },
 {
  "id": "cinetique-chimique",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>v = (1/V) dx/dt : pente de la tangente à x(t).</li>\n<li>t½ : x = x<sub>f</sub>/2 ; indicateur de rapidité.</li>\n<li>Facteurs : T°, concentration, catalyseur, surface de contact.</li>\n<li>Catalyseur : accélère, non consommé, ne change pas l'état final.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Exploiter x(t) : tangentes, vitesse initiale, plateau.</li>\n<li>Déterminer t½ graphiquement.</li>\n<li>Choisir un facteur cinétique adapté au but (conserver/accélérer).</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Catalyseur ≠ consommé, ≠ rendement.</li>\n<li>Plateau : équilibre ou limitant — à justifier.</li>\n<li>1/V dans la vitesse volumique.</li>\n</ul>"
 },
 {
  "id": "synthese-organique",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Groupes : −OH, −COOH, −COO−, −CONH−, −NH₂.</li>\n<li>Estérification : acide + alcool ⇌ ester + eau ; lente, limitée (~67 %), catalyseur H⁺, reflux.</li>\n<li>Améliorer : excès d'un réactif ou élimination de l'eau.</li>\n<li>Polymères : addition (PE) ou polycondensation (PET, Nylon) ; M = n×M(motif).</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Calculer n théorique (limitant) puis rendement r = n<sub>obt</sub>/n<sub>th</sub>.</li>\n<li>Rédiger le protocole : reflux, séparation, contrôle.</li>\n<li>Justifier les choix par équilibre et cinétique.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Catalyseur ≠ rendement.</li>\n<li>Réaction limitée : plateau ≠ 100 %.</li>\n<li>Polycondensation : soustraire la petite molécule.</li>\n</ul>"
 },
 {
  "id": "cinematique",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>v⃗ = dOM⃗/dt : tangent à la trajectoire ; v⃗(Mᵢ) ≈ (Mᵢ₊₁ − Mᵢ₋₁)/2Δt.</li>\n<li>a⃗ = dv⃗/dt ; variation de valeur ET/OU de direction.</li>\n<li>Circulaire uniforme : a⃗ centripète, non nul.</li>\n<li>Projectile : a⃗ = g⃗ (vertical, bas).</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Choisir référentiel + repère ; écrire x(t), y(t).</li>\n<li>Construire v⃗ et a⃗ sur un enregistrement (échelle !).</li>\n<li>Éliminer t pour la trajectoire.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>2Δt pour le vecteur vitesse centré.</li>\n<li>Échelle et unités.</li>\n<li>a⃗ ≠ 0 même à v constante en courbe.</li>\n</ul>"
 },
 {
  "id": "newton-champ-uniforme",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>ΣF⃗ = m a⃗ ; démarche : système → forces → projections → intégration + C.I.</li>\n<li>Pesanteur : x = v₀t, y = −½gt² → parabole.</li>\n<li>Champ E : F⃗ = qE⃗, E = U/d ; déviation parabolique.</li>\n<li>Champ B : F⃗ = qv⃗∧B⃗ ⊥ v⃗ ; cercle, r = mv/|q|B ; pas de travail.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Projeter sur les axes et intégrer avec les C.I.</li>\n<li>Trouver la trajectoire (éliminer t).</li>\n<li>Exploiter les conditions particulières (sommet : v_y = 0 ; sol : y = 0).</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Chute libre sans masse.</li>\n<li>B⃗ : pas de travail, v constante.</li>\n<li>Signes selon l'axe choisi.</li>\n</ul>"
 },
 {
  "id": "energies-mecaniques",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>E<sub>m</sub> = ½mv² + mgz ; ressort : + ½kx².</li>\n<li>Sans frottement : E<sub>m</sub> constante ; sinon ΔE<sub>m</sub> = W(frott.) &lt; 0.</li>\n<li>ΔE<sub>m</sub> = énergie dissipée (chaleur) — bilan sans détail du chemin.</li>\n<li>Périodes : T = 2π√(L/g) ; T = 2π√(m/k).</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Choisir l'origine de z, calculer E<sub>m</sub> aux deux états.</li>\n<li>Comparer : conservation ou W(frottements).</li>\n<li>En déduire v, h, distance de freinage, énergie dissipée.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Conservation seulement sans frottements.</li>\n<li>Référence de z à préciser.</li>\n<li>m/s obligatoires (et le ½).</li>\n</ul>"
 },
 {
  "id": "ondes-term",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>λ = vT = v/f ; retard τ = d/v.</li>\n<li>Interférences : cohérence ; constructive δ = kλ, destructive (k+½)λ.</li>\n<li>Diffraction si ouverture ≈ λ ; tache ∝ λ/a.</li>\n<li>Doppler : approche → aigu ; éloignement → grave ; radars, redshift.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Calculer λ, T, f, v de manière cohérente.</li>\n<li>Prévoir constructive/destructive par la différence de chemin.</li>\n<li>Exploiter un décalage Doppler pour une vitesse.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Cohérence nécessaire aux interférences.</li>\n<li>Signes Doppler (et facteur 2 du radar).</li>\n<li>Tout type d'onde se diffracte (si ≈ λ).</li>\n</ul>"
 },
 {
  "id": "poids-gravitation",
  "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li>Masse (kg, invariante) ≠ poids (N, force) ; P = m×g, g ≈ 9,8 N/kg sur Terre.</li>\n<li>Gravitation : attraction universelle, ∝ masses, ∝ 1/distance².</li>\n<li>Satellites et Lune : chute permanente « qui rate » la Terre.</li>\n<li>Altitude → énergie de position → cinétique en tombant.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Convertir masse → poids selon le lieu (g local).</li>\n<li>Représenter le poids (flèche verticale vers le bas).</li>\n<li>Expliquer une orbite par la chute permanente.</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>kg ≠ N ; masse inchangée sur la Lune.</li>\n<li>Gravité jamais nulle.</li>\n<li>g dépend du lieu.</li>\n</ul>"
 }
];
var QUESTIONS = [
{"t": "Poids et gravitation (3e)", "q": "Le poids d'un objet est…", "c": ["sa masse exprimée en kg", "une quantité de matière", "identique partout dans l'univers", "la force de gravitation exercée par la Terre sur lui"], "a": 3, "e": "Le poids est une force : la gravitation que la Terre exerce sur l'objet.", "d": "<b>Le poids est la force de gravitation</b> exercée par un astre sur l'objet : une force, mesurée en <b>newtons</b>, qui dépend du lieu.<div class='ex-detail'><u>Exemple rédigé</u> : un objet de 4 kg pèse P = 4×9,8 = 39,2 N sur Terre mais seulement 6,4 N sur la Lune : le poids change avec g, alors que la masse reste 4 kg partout. Piège : « identique partout » est FAUX, et « la masse en kg » confond les deux grandeurs du chapitre.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Un objet de masse m = 5 kg. Son poids sur Terre (g = 9,8 N/kg) vaut :", "c": ["5 N", "49 N", "0,49 N", "9,8 N"], "a": 1, "e": "P = m × g = 5 × 9,8 = 49 N.", "d": "<b>P = m × g = 5 × 9,8 = 49 N</b> : la formule centrale du chapitre.<div class='ex-detail'><u>Exemple rédigé</u> : unités : kg × (N/kg) = N ✓. Vérification par proportionnalité : 1 kg pèse 9,8 N, donc 5 kg pèsent 5 × 9,8 = 49 N. Piège : « 5 N » revient à confondre masse et poids ; le poids a presque toujours une valeur ~10 fois plus grande que la masse en kg.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Un dynamomètre indique 19,6 N sur Terre (g = 9,8 N/kg). La masse de l'objet est :", "c": ["2 kg", "192 N", "19,6 kg", "0,5 kg"], "a": 0, "e": "m = P/g = 19,6/9,8 = 2 kg.", "d": "<b>m = P / g = 19,6 / 9,8 = 2 kg</b> : on inverse la formule P = m×g.<div class='ex-detail'><u>Exemple rédigé</u> : méthode : P = m×g ⟹ m = P/g (on isole m en divisant). Contrôle : 2 × 9,8 = 19,6 N ✓. Piège : « 192 N » mélange unités (une masse ne se mesure pas en N) ; « 0,5 kg » viendrait d'une division par 4 sans raison.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Sur la Lune (g ≈ 1,6 N/kg), un objet de 10 kg pèse environ :", "c": ["98 N", "6 N", "10 N", "16 N"], "a": 3, "e": "P = 10 × 1,6 = 16 N.", "d": "<b>P = m × g = 10 × 1,6 = 16 N</b> : le poids dépend de l'astre.<div class='ex-detail'><u>Exemple rédigé</u> : sur Terre, le même objet pèserait 98 N : sur la Lune, il pèse 6 fois moins. La masse, elle, reste 10 kg dans les deux cas (même quantité de matière). Piège : « 98 N » applique le g terrestre à la Lune : toujours lire quel astre sert de cadre à l'exercice.</div>"},
{"t": "Poids et gravitation (3e)", "q": "La gravitation entre deux corps est plus forte quand…", "c": ["la distance augmente", "il fait nuit", "les masses augmentent", "les masses diminuent"], "a": 2, "e": "Attraction renforcée par de grandes masses et de courtes distances.", "d": "<b>Masses grandes + distance courte = attraction forte.</b><div class='ex-detail'><u>Exemple rédigé</u> : le Soleil (masse énorme) attire fortement les planètes malgré la distance ; deux personnes s'attirent aussi, mais avec une force infime (masses faibles). C'est pourquoi la Lune orbite autour de la Terre et pas autour d'un satellite artificiel : ordres de grandeur des masses. Piège : « la distance augmente » : c'est l'inverse, l'attraction diminue avec la distance.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Quelles sont les caractéristiques du vecteur poids ?", "c": ["vertical, vers le haut, appliqué à G", "oblique, vers le haut, appliqué à la base", "horizontal, vers la droite, appliqué au sol", "vertical, vers le bas, appliqué au centre de gravité G"], "a": 3, "e": "Poids : direction verticale, sens vers le bas, point d'application G.", "d": "<b>Vertical, vers le bas, appliqué au centre de gravité G</b>, de longueur proportionnelle à P.<div class='ex-detail'><u>Exemple rédigé</u> : pour schématiser le poids d'un objet de 20 N avec l'échelle 1 cm ↔ 10 N : tracer depuis G un segment vertical vers le bas de 2 cm, terminé par une flèche. Piège : « vers le haut » confond poids (vers le bas) et réaction du support (vers le haut) : deux forces différentes qui se compensent sur une table.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Quel instrument mesure le poids ?", "c": ["Un chronomètre", "Une balance", "Un thermomètre", "Un dynamomètre"], "a": 3, "e": "Le dynamomètre mesure des forces (N) ; la balance mesure la masse (kg).", "d": "<b>Le dynamomètre</b> : il mesure une force en newtons (le ressort s'étire proportionnellement à la force).<div class='ex-detail'><u>Exemple rédigé</u> : subtilité : quand on se pèse sur une balance, la balance mesure en réalité une force mais affiche une masse, car elle divise par g (elle « sait » qu'on est sur Terre). Sur la Lune, la même balance afficherait n'importe quoi : c'est le dynamomètre qui dit la vérité sur la force réellement subie. Piège : la balance mesure indirectement ; le dynamomètre est l'instrument de la force.</div>"},
{"t": "Poids et gravitation (3e)", "q": "La masse d'un objet sur la Lune, par rapport à sa masse sur Terre :", "c": ["est divisée par 6", "est multipliée par 6", "est nulle", "est inchangée"], "a": 3, "e": "La masse est constante : même quantité de matière partout.", "d": "<b>Inchangée</b> : la masse ne dépend pas du lieu.<div class='ex-detail'><u>Exemple rédigé</u> : le sac de 4 kg reste 4 kg sur la Lune, sur Mars ou dans l'espace : il contient la même matière. Seul le poids change (39,2 N sur Terre, 6,4 N sur la Lune). Piège : « divisée par 6 » : c'est le POIDS qui est divisé par 6, pas la masse : la confusion masse/poids est l'erreur n° 1 de ce chapitre.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Pourquoi la Lune tourne-t-elle autour de la Terre sans s'y écraser ?", "c": ["sa vitesse et la gravitation se combinent : elle « rate » la Terre en permanence", "la Terre la repousse", "elle est trop légère pour tomber", "il n'y a pas de gravité dans l'espace"], "a": 0, "e": "La gravitation courbe en permanence la trajectoire de la Lune qui, sans elle, partirait tout droit.", "d": "<b>La gravitation courbe sa trajectoire à chaque instant</b> : sans gravité, la Lune partirait en ligne droite ; sans vitesse, elle tomberait sur la Terre.<div class='ex-detail'><u>Exemple rédigé</u> : l'orbite est la combinaison des deux : la Lune « tombe » vers la Terre mais avance assez vite pour la rater en continu : sa trajectoire se referme en cercle (à peu près). C'est exactement le principe d'un satellite artificiel : on le lance assez vite pour qu'il « rate » la Terre en permanence. Piège : « pas de gravité dans l'espace » : la gravité agit à TOUTES les distances.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "L'eau distillée est…", "c": ["un mélange homogène", "un mélange hétérogène", "du dioxygène", "un corps pur"], "a": 3, "e": "L'eau distillée ne contient que H₂O : un corps pur.", "d": "<b>Corps pur</b> : l'eau distillée contient une seule espèce chimique, H₂O.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve expérimentale : l'eau distillée bout exactement à 100 °C et gèle à 0 °C, à température constante : la signature d'un corps pur. Une eau salée bout AU-DESSUS de 100 °C et sur un intervalle de température : signature d'un mélange. Piège : « mélange homogène » : c'est le piège classique : homogène ≠ pur.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Eau + huile après agitation : quel mélange ?", "c": ["Homogène", "Hétérogène", "Impossible à dire", "Un corps pur"], "a": 1, "e": "Huile et eau ne sont pas miscibles : deux phases visibles.", "d": "<b>Hétérogène</b> : l'huile (moins dense) flotte au-dessus de l'eau.<div class='ex-detail'><u>Exemple rédigé</u> : même en agitant fort, les gouttes d'huile se rassemblent : deux couches réapparaissent. On peut alors séparer par DECANTATION (ou ampoule à décanter) : la gravité fait le travail. Piège : croire qu'agiter assez longtemps rendrait le mélange homogène : non miscible veut dire insoluble pour de bon.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Séparer du sable de l'eau : quelle méthode ?", "c": ["Filtration", "Rien à faire", "Distillation", "Décantation seule"], "a": 0, "e": "Le sable (solide non dissous) reste sur le filtre.", "d": "<b>Filtration</b> : le filtre retient le sable (résidu), l'eau passe (filtrat).<div class='ex-detail'><u>Exemple rédigé</u> : vocabulaire à connaître : RÉSIDU = ce qui reste sur le filtre ; FILTRAT = ce qui passe à travers. Vérification : le filtrat est limpide. Piège : la distillation est prévue pour des liquides MISCIBLES : ici c'est surdimensionné : solide + liquide = filtration, le réflexe le plus rentable du chapitre.</div>"},
