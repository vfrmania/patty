var COURS_META = [
{"id": "eau-melanges", "theme": "L'eau : mélanges et corps purs (5e)", "niveau": "5e", "titre": "L'eau : mélanges, corps purs et séparation", "cours": "<div class=\"cours-head\"><h2>L'eau : mélanges, corps purs et séparation</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Corps purs et mélanges</h3>\n<div class=\"tip\"><b>Corps pur :</b> une seule espèce chimique (eau pure, sel pur, dioxygène pur). <b>Mélange :</b> plusieurs espèces chimiques réunies sans réaction (eau sucrée, air, eau de mer).<br>Le <b>test de l'eau pure :</b> l'eau pure bout à <b>100 °C</b> exactement (pression normale) et gèle à 0 °C : ses changements d'état se font à température <b>constante</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — classer et justifier</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Classer : eau de mer, sucre, eau distillée, air, eau gazeuse.</div><div class=\"etu\"><b>Étape 1</b> — <b>Corps purs</b> : sucre (une seule espèce), eau distillée (H₂O seulement).</div><div class=\"etu\"><b>Étape 2</b> — <b>Mélanges</b> : eau de mer (eau + sel + minéraux), air (dioxygène + diazote + …), eau gazeuse (eau + CO₂ dissous).</div><div class=\"etu\"><b>Étape 3</b> — <b>Retenir</b> : « eau » dans le nom ne suffit pas à dire si c'est pur : c'est la COMPOSITION qui décide : se demander « combien d'espèces chimiques ? ».</div></div></details>\n<h3>2. Mélanges homogènes et hétérogènes</h3>\n<div class=\"tip\"><b>Mélange homogène :</b> on ne distingue pas les constituants à l'œil nu (eau sucrée, air). <b>Mélange hétérogène :</b> on voit au moins deux phases (eau + huile, eau + sable).<br><b>Attention :</b> homogène ≠ pur ! L'air est homogène mais c'est un mélange.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — eau + huile : un hétérogène célèbre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On verse de l'huile dans de l'eau et on agite. Décrire et expliquer.</div><div class=\"etu\"><b>Étape 1</b> — <b>Observation</b> : deux couches : l'huile au-DESSUS (moins dense), l'eau en dessous.</div><div class=\"etu\"><b>Étape 2</b> — <b>Système</b> : mélange hétérogène (2 phases distinctes), car huile et eau ne sont pas miscibles.</div><div class=\"etu\"><b>Étape 3</b> — <b>Séparation</b> : le système se sépare tout seul par <b>décantation</b> : la gravité range les liquides par densité : pas besoin de filtration.</div></div></details>\n<h3>3. Séparer les constituants d'un mélange</h3>\n<table><tr><th>Méthode</th><th>Sert à séparer…</th><th>Principe</th></tr>\n<tr><td><b>Décantation</b></td><td>2 liquides non miscibles ou solide/liquide</td><td>la gravité : le plus dense descend</td></tr>\n<tr><td><b>Filtration</b></td><td>solide en suspension dans un liquide</td><td>le filtre retient le solide (résidu), laisse passer le liquide (filtrat)</td></tr>\n<tr><td><b>Distillation</b></td><td>2 liquides miscibles</td><td>évaporation puis condensation : le plus volatil monte dans le réfrigérant</td></tr></table>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — quelle méthode choisir ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ① Séparer du sable et de l'eau. ② Séparer l'eau et le sel dissous de l'eau salée. ③ Séparer l'huile et l'eau.</div><div class=\"etu\"><b>Étape 1</b> — <b>Sable + eau</b> : solide/liquide : <b>filtration</b> (le sable reste sur le filtre).</div><div class=\"etu\"><b>Étape 2</b> — <b>Eau salée</b> : mélange HOMOGÈNE : le sel est dissous, invisible : la filtration ne marche PAS : il faut <b>distiller</b> (on récupère l'eau pure) ou évaporer (on récupère le sel).</div><div class=\"etu\"><b>Étape 3</b> — <b>Huile + eau</b> : non miscibles : <b>décantation</b> (ou ampoule à décanter). Réflexe : la méthode dépend de la NATURE du mélange : visible ou dissous, miscible ou non.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> filtration et distillation ne séparent PAS les mêmes choses : le sel dissous traverse le filtre ; homogène ne veut pas dire pur ; dans la distillation, c'est le distillat (le liquide récupéré) qu'on collecte, pas ce qui reste dans le ballon ; dissoudre n'est pas « disparaître » : le sel est toujours là (goût, masse).</div>"},
{"id": "etats-matiere", "theme": "États et changements d'état (5e)", "niveau": "5e", "titre": "États et changements d'état de la matière", "cours": "<div class=\"cours-head\"><h2>États et changements d'état de la matière</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les trois états et le modèle particulaire</h3>\n<div class=\"tip\"><b>Solide :</b> forme propre, particules serrées et ordonnées qui vibrent. <b>Liquide :</b> forme du récipient, particules serrées mais désordonnées qui glissent. <b>Gaz :</b> occupe tout l'espace, particules très éloignées, rapides et désordonnées.<br><b>L'état dépend de 2 paramètres :</b> température et pression.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire un schéma particulaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un schéma montre des particules très espacées, dispersées dans tout le cadre. Quel état ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Critère 1 : l'espacement</b> : particules très éloignées → pas un solide ni un liquide (tous deux sont « serrés »).</div><div class=\"etu\"><b>Étape 2</b> — <b>Critère 2 : l'occupation</b> : elles occupent TOUT le volume disponible → gaz.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : état GAZEUX. Réflexe : d'abord l'espacement (serré/loin), puis l'ordre (ordonné/désordonné) : c'est le duo qui départage les 3 états.</div></div></details>\n<h3>2. Les changements d'état</h3>\n<table><tr><th>Solidifie / Fond</th><th>Évapore / Condense</th><th>Sublime / Condense solide</th></tr>\n<tr><td>liquide ↔ solide</td><td>liquide ↔ gaz</td><td>solide ↔ gaz</td></tr></table>\n<div class=\"tip\"><b>Vocabulaire EXACT :</b> fusion (solide→liquide), solidification (liquide→solide), vaporisation (liquide→gaz), liquéfaction (gaz→liquide), sublimation (solide→gaz), condensation solide (gaz→solide).<br><b>Ébullition ≠ vaporisation :</b> la vaporisation a lieu à TOUTE température (évaporation lente d'une flaque) ; l'ébullition est une vaporisation rapide qui forme des bulles DANS le liquide (à 100 °C pour l'eau pure).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — nommer le changement d'état</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ① La rosée du matin. ② Le givre sur une vitre froide. ③ Un glaçon qui fond. ④ Le « bec » de neige qui disparaît sans mouiller.</div><div class=\"etu\"><b>Étape 1</b> — <b>Rosée</b> : vapeur d'eau (gaz) → gouttelettes (liquide) : <b>liquéfaction</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Givre</b> : vapeur d'eau → glace directement (sans passer par liquide) : <b>condensation solide</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Glaçon</b> : solide → liquide : <b>fusion</b> ; <b>neige</b> : solide → gaz : <b>sublimation</b>. Pour chaque situation : repérer état de départ et d'arrivée, puis le nom.</div></div></details>\n<h3>3. Ce qui se conserve, ce qui change</h3>\n<div class=\"tip\"><b>La MASSE se conserve</b> à chaque changement d'état : 10 g de glace donnent 10 g d'eau liquide. <b>Le VOLUME change</b> : l'eau est une exception célèbre (la glace PREND plus de place : c'est pour ça que les canettes gèlées explosent et que la glace flotte).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'expérience du glaçon dans l'éprouvette</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un glaçon de 18 g flotte dans une éprouvette. Quand il a totalement fondu, quelle est la masse d'eau ? Le niveau monte-t-il ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Masse</b> : la fusion conserve la masse : <b>18 g</b> d'eau.</div><div class=\"etu\"><b>Étape 2</b> — <b>Niveau</b> : la glace flotte car moins dense ; une fois fondue, l'eau occupe exactement le volume que la partie IMMERGÉE déplaçait : le niveau NE CHANGE PAS.</div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan</b> : masse constante, mais le volume de l'eau liquide est PLUS PETIT que celui du glaçon (l'eau est anormale : solide moins dense que liquide).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « vapeur » n'est pas visible (la « vapeur » blanche au-dessus d'une casserole = gouttelettes liquides déjà liquéfiées) ; la neige et le givre ne sont PAS de la vaporisation ; le volume ne se conserve pas, la masse oui ; condensation = gaz → liquide (pas l'inverse).</div>"},
{"id": "circuit-serie", "theme": "Le circuit électrique en série (5e)", "niveau": "5e", "titre": "Le circuit électrique : composants et série", "cours": "<div class=\"cours-head\"><h2>Le circuit électrique : composants et série</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le circuit : une boucle fermée</h3>\n<div class=\"tip\"><b>Circuit fermé = boucle complète</b> : générateur, fils, dipôles. Le courant circule UNIQUEMENT si la boucle est fermée : <b>circuit ouvert = tout s'arrête</b>.<br><b>Sens conventionnel :</b> le courant sort de la borne <b>+</b> du générateur, traverse le circuit, revient à la borne −.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — diagnostiquer un circuit qui ne marche pas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une lampe montée avec une pile ne brille pas. Donner 3 hypothèses et comment les tester.</div><div class=\"etu\"><b>Étape 1</b> — <b>Hypothèse 1 : circuit ouvert</b> : fil débranché, interrupteur ouvert : vérifier chaque connexion (la boucle doit être CONTINUE).</div><div class=\"etu\"><b>Étape 2</b> — <b>Hypothèse 2 : lampe grillée</b> : la remplacer par une lampe neuve : si elle brille, coupable trouvé.</div><div class=\"etu\"><b>Étape 3</b> — <b>Hypothèse 3 : pile usée ou mal orientée</b> : tester avec une pile neuve en respectant les bornes. Méthode : on teste UNE chose à la fois : c'est la démarche scientifique.</div></div></details>\n<h3>2. Les composants et leurs symboles</h3>\n<table><tr><th>Dipôle</th><th>Symbole (description)</th><th>Rôle</th></tr>\n<tr><td>Générateur (pile)</td><td>2 barres (longue = +)</td><td>fournit l'énergie</td></tr>\n<tr><td>Lampe</td><td>cercle avec croix</td><td>convertit en lumière</td></tr>\n<tr><td>Interrupteur</td><td>pointillés ou trait plein</td><td>ouvre/ferme le circuit</td></tr>\n<tr><td>Moteur</td><td>cercle avec M</td><td>convertit en mouvement</td></tr>\n<tr><td>Ampèremètre</td><td>cercle avec A</td><td>mesure l'intensité (en A)</td></tr>\n<tr><td>Voltmètre</td><td>cercle avec V</td><td>mesure la tension (en V)</td></tr></table>\n<h3>3. La série : une seule boucle</h3>\n<div class=\"tip\"><b>Circuit en série :</b> les dipôles sont branchés les uns après les autres sur UNE SEULE boucle. Conséquence : <b>l'intensité est la MÊME partout</b>.<br><b>Loi d'unicité de l'intensité :</b> I₁ = I₂ = I₃ … partout dans la boucle.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — deux lampes en série</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux lampes identiques en série avec une pile. ① L'ampèremètre en A₁ (avant la lampe 1) indique 0,2 A. Que vaut l'ampèremètre A₂ placé entre les deux lampes ? ② Que se passe-t-il si on dévisse la lampe 2 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>A₂ = 0,2 A</b> : en série, l'intensité est la même en tout point (unicité).</div><div class=\"etu\"><b>Étape 2</b> — <b>Lampe 2 dévissée</b> : la boucle est OUVERTE : plus de courant NULLE PART : la lampe 1 s'éteint aussi.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : en série, tout dipôle est vital : une guirlande ancienne dont UNE ampoule grille s'éteint ENTIÈREMENT : c'est la signature du série.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le courant n'est pas « consommé » : ce qui sort du générateur y revient intégralement ; l'ordre des dipôles en série ne change rien (I identique partout) ; le courant ne « part pas de la borne + » par convention d'ORIENTATION seulement, mais dans une boucle fermée, la question ne se pose pas sans générateur ; une seule lampe grillée = tout s'éteint (série).</div>"},
{"id": "lumiere-ombres", "theme": "La lumière : sources et ombres (5e)", "niveau": "5e", "titre": "La lumière : sources et ombres", "cours": "<div class=\"cours-head\"><h2>La lumière : sources et ombres</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Sources et récepteurs de lumière</h3>\n<div class=\"tip\"><b>Source primaire :</b> produit SA propre lumière (Soleil, lampe allumée, flamme, luciole). <b>Objet diffusant :</b> renvoie la lumière reçue sans en produire (Lune, murs, livres) : on le voit parce qu'il EST ÉCLAIRÉ.<br><b>Œil et caméra :</b> récepteurs de lumière (ils captent la lumière pour former une image).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi voit-on la Lune ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La Lune brille-t-elle ? Explique pourquoi on la voit la nuit.</div><div class=\"etu\"><b>Étape 1</b> — <b>La Lune n'est pas une source primaire</b> : elle ne produit aucune lumière.</div><div class=\"etu\"><b>Étape 2</b> — <b>Elle est éclairée</b> par le Soleil (source primaire) et diffuse cette lumière dans toutes les directions.</div><div class=\"etu\"><b>Étape 3</b> — <b>Nous recevons</b> une partie de cette lumière diffusée : c'est pour ça qu'on la voit. Même logique pour toutes les « choses qu'on voit » : un livre, un visage : éclairés, ils diffusent, notre œil capte.</div></div></details>\n<h3>2. La propagation en ligne droite</h3>\n<div class=\"tip\"><b>Dans un milieu transparent et homogène (air, eau claire…), la lumière se propage en LIGNE DROITE</b> et très vite (300 000 km/s dans le vide).<br><b>Résultat :</b> on peut représenter la lumière par des segments fléchés (« rayons de lumière ») partant de la source vers l'œil.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — aligner 3 cartons percés</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Trois cartons percés d'un trou sont alignés. Quand on regarde par le premier trou, on voit la lampe placée derrière. On décale légèrement le carton 2 : que se passe-t-il ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Alignés</b> : la lumière passe par les 3 trous : la ligne droite relie lampe → trous → œil : preuve de la propagation rectiligne.</div><div class=\"etu\"><b>Étape 2</b> — <b>Carton 2 décalé</b> : la ligne est bloquée : plus rien ne parvient à l'œil.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : si la lumière contournait les obstacles, on verrait encore : elle ne contourne PAS : elle va tout droit. C'est l'expérience clé du chapitre.</div></div></details>\n<h3>3. Ombre propre, ombre portée, cône d'ombre</h3>\n<div class=\"tip\"><b>Ombre propre :</b> la face de l'objet non éclairée. <b>Ombre portée :</b> la zone sombre projetée derrière l'objet sur un écran. <b>Cône d'ombre :</b> le volume sombre derrière l'objet (celui qui s'y trouve ne voit pas la source).<br>La taille de l'ombre portée varie avec la <b>distance objet-écran</b> et le <b>diamètre apparent de la source</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — éclipse Soleil-Lune-Terre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer une éclipse de Soleil avec le vocabulaire du chapitre.</div><div class=\"etu\"><b>Étape 1</b> — <b>Alignement</b> : Soleil (source) — Lune (objet) — un point de la Terre (écran/œil).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le cône d'ombre</b> de la Lune touche la Terre : à l'intérieur, c'est l'éclipse TOTALE.</div><div class=\"etu\"><b>Étape 3</b> — <b>Autour</b>, la zone de pénombre : éclipse PARTIELLE. Tout le phénomène = 3 lignes droites + un cône : la propagation rectiligne rend l'explication complète.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la Lune n'est pas une source primaire ; on voit un objet DIFFUSANT seulement s'il est éclairé ET que la lumière diffusée arrive à l'œil ; une ombre portée n'est pas « l'absence de lumière » au sens total : elle est éclairée par les rayons qui contournent (sources étendues → pénombre) ; vitesse de la lumière : ~300 000 km/s, quasi instantanée à notre échelle.</div>"},
{"id": "son-propagation", "theme": "Le son : vibration et propagation (5e)", "niveau": "5e", "titre": "Le son : vibration et propagation", "cours": "<div class=\"cours-head\"><h2>Le son : vibration et propagation</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le son est une vibration</h3>\n<div class=\"tip\"><b>Tout son naît d'une source qui VIBRE</b> : corde de guitare, membrane de haut-parleur, cordes vocales. La vibration met l'air environnant en mouvement : zones de compression et de dilatation se propagent en boule jusqu'à l'oreille.<br><b>Preuve expérimentale :</b> un objet qui émet un son fait vibrer les objets touchés (grains de sable qui dansent sur une membrane).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la corde de guitare</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi une corde de guitare pincée produit-elle un son, et pourquoi touche-t-on un son plus grave en pinçant une corde plus épaisse ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Vibration</b> : la corde pincée oscille très vite (centaines d'allers-retours par seconde) : elle « bouscule » l'air autour.</div><div class=\"etu\"><b>Étape 2</b> — <b>Grave ou aigu</b> : la fréquence (nombre de vibrations par seconde) fait le GRAVE (faible) ou l'AIGU (grande).</div><div class=\"etu\"><b>Étape 3</b> — <b>Corde épaisse</b> : plus lourde, elle vibre moins vite : fréquence plus petite : son plus GRAVE. Le guitariste ajuste aussi la TENSION et la LONGUEUR (corde raccourcie = plus aigu).</div></div></details>\n<h3>2. Le son a besoin d'un milieu matériel</h3>\n<div class=\"tip\"><b>Le son ne se propage PAS dans le vide</b> : il lui faut un milieu (air, eau, métal) dont les particules transmettent la vibration de proche en proche. <b>En revanche, la lumière traverse le vide</b> : les deux n'ont pas les mêmes besoins.<br><b>Vitesses :</b> air ≈ 340 m/s ; eau ≈ 1500 m/s ; acier ≈ 5000-6000 m/s : plus le milieu est rigide, plus le son est rapide.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'expérience de la cloche à vide</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une sonnerie fonctionne dans une cloche en verre dont on aspire l'air. Qu'observe-t-on ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Avec air</b> : on voit la cloche VIBRER et on ENTEND la sonnerie.</div><div class=\"etu\"><b>Étape 2</b> — <b>Air aspiré</b> : on voit toujours la cloche vibrer (la LUMIÈRE traverse le vide), mais le son FAIBLIT puis DISPARAÎT.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : pas d'air = pas de son : le son a besoin de MATIÈRE pour se propager. (Dans l'espace, les explosions sont silencieuses : le cinéma ment.)</div></div></details>\n<h3>3. Mesurer la vitesse du son : orage et écho</h3>\n<div class=\"tip\"><b>Technique de l'orage :</b> on voit l'éclair AVANT d'entendre le tonnerre (lumière ≈ instantanée, son = 340 m/s). <b>Distance de la foudre (km) ≈ temps (s) entre éclair et tonnerre ÷ 3.</b><br><b>Écho :</b> le son réfléchi revient : le sonar et l'échographie mesurent des distances d = v × t ÷ 2.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — compter jusqu'à l'orage</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On compte 9 secondes entre l'éclair et le tonnerre. À quelle distance se trouve l'orage ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Données</b> : t = 9 s ; v = 340 m/s.</div><div class=\"etu\"><b>Étape 2</b> — <b>Calcul</b> : d = v × t = 340 × 9 = 3060 m ≈ <b>3 km</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Astuce vérifiée</b> : diviser les secondes par 3 donne bien les kilomètres (9 s ÷ 3 = 3 km) : ordre de grandeur confirmé. Le son est lent à notre échelle : c'est ce décalage qui rend la mesure possible.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le son ne traverse PAS le vide (la lumière si) ; le son va plus vite dans l'eau que dans l'air (l'inverse de l'intuition « l'air c'est léger donc rapide » : c'est la rigidité qui compte) ; on voit l'éclair avant d'entendre le tonnerre ; le son ne « voyage » pas tout seul : c'est une VIBRATION transmise de particule en particule ; amplitude = intensité (fort/doux), fréquence = hauteur (grave/aigu) : deux propriétés différentes.</div>"},
{"id": "air-pression", "theme": "L'air : composition et pression (4e)", "niveau": "4e", "titre": "L'air : composition et pression", "cours": "<div class=\"cours-head\"><h2>L'air : composition et pression</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'air est un mélange de gaz… et il a une masse !</h3>\n<div class=\"tip\"><b>Composition de l'air :</b> diazote ≈ 78 %, dioxygène ≈ 21 %, autres gaz (argon, CO₂…) ≈ 1 %. <b>L'air a une masse :</b> environ <b>1,3 g par litre</b> dans les conditions usuelles.<br><b>Preuve :</b> un ballon gonflé pèse plus que le même ballon dégonflé.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — peser de l'air</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On gonfle un ballon de basket. Le ballon vide pèse 612 g, gonflé il pèse 617 g. Quelle est la masse d'air ajoutée ? Quel volume d'air environ (masse volumique de l'air ≈ 1,3 g/L) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Masse d'air ajoutée</b> : 617 − 612 = <b>5 g</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Volume</b> : 5 g ÷ 1,3 g/L ≈ <b>3,8 L</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Sens physique</b> : « peser l'air » semble étrange (on ne le sent pas), mais 3,8 L d'air = 5 g : à l'échelle d'une salle de classe (200 m³ = 200 000 L), l'air pèse ~260 kg : l'invisible est lourd.</div></div></details>\n<h3>2. La pression : l'air appuie partout</h3>\n<div class=\"tip\"><b>Les particules d'air frappent en permanence les surfaces</b> : leur succession de chocs crée la <b>pression</b>, mesurée en <b>hectopascals (hPa)</b> ou en pascals (Pa). <b>Pression atmosphérique ≈ 1013 hPa au niveau de la mer.</b><br>La pression augmente quand : on comprime (même air, moins de volume) ou qu'on ajoute de l'air.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la canette qui s'écrase</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On met un peu d'eau dans une canette en métal, on la chauffe jusqu'à voir de la vapeur, puis on la retourne dans de l'eau froide. La canette s'écrase. Expliquer.</div><div class=\"etu\"><b>Étape 1</b> — <b>En chauffant</b> : la vapeur chasse une partie de l'air : la canette est pleine de vapeur d'eau (à l'intérieur, quasi la même pression que dehors).</div><div class=\"etu\"><b>Étape 2</b> — <b>Au contact du froid</b> : la vapeur se liquéfie en quelques gouttes : le gaz intérieur disparaît : la pression INTÉRIEURE chute.</div><div class=\"etu\"><b>Étape 3</b> — <b>L'air extérieur</b> n'a pas changé (≈ 1013 hPa) : il appuie davantage que l'intérieur : la canette est écrasée. La pression atmosphérique est une force ÉNORME : on ne la sent pas car elle s'exerce des deux côtés.</div></div></details>\n<h3>3. Comprimer, détendre : le sport de la pompe</h3>\n<div class=\"tip\"><b>Compression :</b> on réduit le volume : les chocs sur les parois augmentent → pression plus grande. <b>Détente :</b> le contraire. À quantité d'air fixe : <b>si le volume diminue, la pression augmente</b> (et inversement).<br><b>Avec la pression, l'eau bout plus ou moins vite :</b> en montagne (pression plus basse), l'eau bout AVANT 100 °C (~88 °C à 3000 m).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pâtes en montagne</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> En altitude, les œufs durent mal cuits. Expliquer.</div><div class=\"etu\"><b>Étape 1</b> — <b>Pression plus faible</b> en altitude : moins de particules au-dessus de nous pour appuyer.</div><div class=\"etu\"><b>Étape 2</b> — <b>Conséquence</b> : l'eau bout à une température PLUS BASSE (elle bout quand sa pression de vapeur égale la pression de l'air).</div><div class=\"etu\"><b>Étape 3</b> — <b>Résultat</b> : à 88 °C, l'eau bout mais est moins chaude : la cuisson (qui dépend de la température) est plus lente : œufs coulants garantis. La cocotte-minute fait l'inverse : pression élevée → ébullition vers 110-120 °C → cuisson rapide.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> l'air a une masse (1,3 g/L) même si on ne le sent pas ; la pression atmosphérique appuie dans TOUTES les directions ; diazote ≈ 78 % (le dioxygène n'est PAS majoritaire !) ; comprimer ne crée pas d'air : mêmes particules, volume plus petit ; le contenu d'un ballon dégonflé n'est pas du vide : il reste de l'air à pression ambiante.</div>"},
{"id": "atomes-molecules", "theme": "Atomes et molécules (4e)", "niveau": "4e", "titre": "Atomes et molécules : décrire la matière", "cours": "<div class=\"cours-head\"><h2>Atomes et molécules : décrire la matière</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'atome : la brique de base</h3>\n<div class=\"tip\"><b>Atome :</b> particule ultra-petite (≈ 0,1 nanomètre). Chaque type d'atome = un <b>élément chimique</b> (carbone C, hydrogène H, oxygène O, fer Fe…). <b>~90 éléments naturels</b> composent toute la matière de l'Univers.<br>Dimensions : un filament de cheveux ≈ 100 000 atomes de large ; une goutte d'eau contient des milliards de milliards d'atomes.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — se représenter les tailles</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Si une pomme était grossie jusqu'à la taille de la Terre, quelle taille ferait un atome ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Ordre de grandeur</b> : grossir une pomme (~8 cm) à la Terre (~12 800 km) = multiplier par ~160 millions.</div><div class=\"etu\"><b>Étape 2</b> — <b>Atome grossi autant</b> : 0,1 nm × 160 millions ≈ <b>1 à 2 cm</b> : une cerise.</div><div class=\"etu\"><b>Étape 3</b> — <b>Retenir</b> : l'atome est à la pomme ce qu'une cerise est à la Terre : le vide relatif domine la matière : les atomes de la pomme sont principalement du… vide.</div></div></details>\n<h3>2. Les molécules : des atomes liés</h3>\n<div class=\"tip\"><b>Molécule :</b> assemblage d'atomes liés entre eux, noté par une <b>formule chimique</b>.<br><b>Exemples à connaître :</b> eau H₂O (2 H + 1 O) ; dioxygène O₂ ; diazote N₂ ; dioxyde de carbone CO₂ ; méthane CH₄.<br><b>Lecture :</b> le chiffre en indice (en bas à droite) donne le nombre d'atomes de l'élément qui le précède.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — décomposer une formule</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décomposer les formules : H₂O, CO₂, CH₄ et C₆H₁₂O₆ (glucose).</div><div class=\"etu\"><b>Étape 1</b> — <b>H₂O</b> : 2 atomes d'hydrogène + 1 atome d'oxygène : 3 atomes au total.</div><div class=\"etu\"><b>Étape 2</b> — <b>CO₂</b> : 1 carbone + 2 oxygènes : 3 atomes. <b>CH₄</b> : 1 carbone + 4 hydrogènes : 5 atomes.</div><div class=\"etu\"><b>Étape 3</b> — <b>C₆H₁₂O₆</b> : 6 carbones + 12 hydrogènes + 6 oxygènes = 24 atomes. Lecture méthodique : toujours de gauche à droite, indice par indice : la décomposition est une simple lecture.</div></div></details>\n<h3>3. Atomes, molécules et états de la matière</h3>\n<div class=\"tip\"><b>Solide, liquide, gaz = mêmes particules, arrangements différents :</b> dans l'eau solide, liquide ou vapeur, c'est TOUJOURS la même molécule H₂O : seul l'arrangement change (voir chapitre états).<br><b>Les molécules ne changent pas d'identité lors d'un changement d'état</b> : H₂O reste H₂O. (Attention : lors d'une réaction CHIMIQUE, les molécules se recombinent : ce sera le programme de 3e.)</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'air vu à l'échelle moléculaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire l'air avec les molécules du chapitre.</div><div class=\"etu\"><b>Étape 1</b> — <b>Les molécules</b> : ~78 % de N₂ (2 atomes d'azote liés), ~21 % de O₂ (2 atomes d'oxygène liés), ~1 % d'autres (dont CO₂).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le mouvement</b> : ces molécules volent en tous sens à des centaines de m/s, se cognent sans arrêt : les chocs créent la pression.</div><div class=\"etu\"><b>Étape 3</b> — <b>Synthèse</b> : composition (ch. air) + molécules (ce chapitre) + mouvement (ch. états) : les trois chapitres décrivent le MÊME air à des échelles différentes : tout se tient.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ne pas confondre atome et molécule (O = un atome d'oxygène, O₂ = une molécule de dioxygène) ; l'indice compte SEULEMENT l'élément avant lui : dans H₂O, le 2 ne s'applique pas à l'oxygène ; une molécule d'eau H₂O contient 3 atomes, pas 2 ; lors d'un changement d'état les molécules restent identiques (glace/eau/vapeur = H₂O).</div>"},
{"id": "circuits-derivation", "theme": "Circuits en série et en dérivation (4e)", "niveau": "4e", "titre": "Circuits en série et en dérivation", "cours": "<div class=\"cours-head\"><h2>Circuits en série et en dérivation</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Deux façons de brancher</h3>\n<div class=\"tip\"><b>Série :</b> une seule boucle, dipôles à la chaîne. <b>Dérivation :</b> plusieurs branches (boucles) en parallèle, branchées sur des <b>nœuds</b> (points de contact).<br>Exemple de la maison : TOUT est en dérivation : chaque appareil a sa propre boucle avec la pile du secteur.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — deviner le montage</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans une guirlande, une ampoule grille et les autres continuent de briller. Série ou dérivation ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Test de l'ampoule morte</b> : en série, une ampoule grillée ouvre la boucle unique : TOUT s'éteint.</div><div class=\"etu\"><b>Étape 2</b> — <b>Ici, les autres brillent</b> : le courant emprunte les autres branches : montage en <b>dérivation</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Généraliser</b> : ce test (« une panne = tout mort ? ») identifie instantanément le type de montage : c'est le diagnostic le plus rentable du chapitre.</div></div></details>\n<h3>2. Les lois dans chaque montage</h3>\n<div class=\"tip\"><b>Série :</b> <b>unicité de l'intensité</b> (I identique partout). <b>Dérivation :</b> <b>loi des nœuds</b> : l'intensité qui ARRIVE à un nœud = la somme des intensités qui en REPARTENT : I = I₁ + I₂.<br><b>Tensions :</b> en dérivation, chaque branche reçoit la MÊME tension que le générateur (avantage : toutes les lampes brillent normalement, indépendantes).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — appliquer la loi des nœuds</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un générateur alimente 2 lampes en dérivation. L'ampèremètre principal indique 0,45 A ; la lampe 1 laisse passer 0,25 A. Quelle est l'intensité de la lampe 2 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Loi des nœuds</b> : I(générateur) = I₁ + I₂.</div><div class=\"etu\"><b>Étape 2</b> — <b>Remplacer</b> : 0,45 = 0,25 + I₂ ⟹ I₂ = 0,45 − 0,25 = <b>0,20 A</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Vérification</b> : au nœud de retour : 0,25 + 0,20 = 0,45 A : tout ce qui part revient : le courant ne se « perd » pas en route, il se RÉPARTIT.</div></div></details>\n<h3>3. Les avantages de la dérivation (et un danger)</h3>\n<div class=\"tip\"><b>Avantages :</b> ① indépendance des appareils (l'un grillé, les autres marchent) ; ② chaque appareil reçoit la tension du générateur (brillance normale) ; ③ on peut éteindre/allumer chaque branche séparément (interrupteurs individuels).<br><b>Danger :</b> plus on ajoute de branches, plus l'intensité TOTALE augmente (lois des nœuds) : risque de surintensité → fusible ou disjoncteur protège la ligne. <b>Court-circuit :</b> relier les deux bornes d'un dipôle (ou du générateur) par un fil : l'intensité explose, ça chauffe : à ne JAMAIS faire sur une pile (risque d'incendie).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi la maison est en dérivation ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer pourquoi les prises d'une maison ne sont pas branchées en série.</div><div class=\"etu\"><b>Étape 1</b> — <b>En série, l'éteignoir total</b> : débrancher la lampe du salon éteindrait le frigo, la TV… inacceptable.</div><div class=\"etu\"><b>Étape 2</b> — <b>La tension se partagerait</b> : en série, chaque appareil recevrait une PARTIE de la tension : la machine à laver tournerait au ralenti.</div><div class=\"etu\"><b>Étape 3</b> — <b>En dérivation</b> : 230 V pour tous, indépendance totale, interrupteur individuel par pièce : c'est le câblage réel. La contrepartie (surintensité possible) est gérée par le disjoncteur : chaque circuit a son calibre.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la loi des nœuds s'écrit « arrivée = somme des départs » (le courant ne se crée pas au nœud) ; en dérivation, l'intensité n'est PAS la même dans chaque branche ; le court-circuit d'un générateur est dangereux (échauffement) ; l'ampèremètre se branche en SÉRIE, le voltmètre en DÉRIVATION (aux bornes du dipôle).</div>"},
{"id": "vitesse-mouvement", "theme": "Vitesse et mouvement (4e)", "niveau": "4e", "titre": "Vitesse et mouvement", "cours": "<div class=\"cours-head\"><h2>Vitesse et mouvement</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Décrire un mouvement</h3>\n<div class=\"tip\"><b>Un mouvement se décrit TOUJOURS par rapport à un référentiel</b> (l'objet de référence : sol, route…). <b>Trajectoire :</b> la ligne suivie par le mobile : <b>rectiligne</b> (ligne droite) ou <b>curviligne</b> (courbe ; cercle = circulaire).<br><b>Vitesse :</b> v = d ÷ t (distance en m, temps en s ⟹ vitesse en m/s).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — tout est relatif</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Assis dans un TGV à 300 km/h, votre téléphone est-il immobile ou en mouvement ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Référentiel = votre main</b> : le téléphone ne bouge pas d'un centimètre : immobile.</div><div class=\"etu\"><b>Étape 2</b> — <b>Référentiel = les rails</b> : il file à 300 km/h : mouvement rectiligne (uniforme sur une ligne droite).</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : « immobile » ou « en mouvement » n'a de sens QUE si on précise le référentiel : les deux réponses sont justes… chacune dans son référentiel.</div></div></details>\n<h3>2. Calculer et convertir des vitesses</h3>\n<div class=\"tip\"><b>v = d / t</b> ⟹ d = v × t et t = d / v.<br><b>Conversion clé :</b> 1 m/s = <b>3,6 km/h</b>. Donc km/h ⟷ m/s : ÷ 3,6 et × 3,6.<br><b>Exemples :</b> 10 m/s = 36 km/h ; 90 km/h = 25 m/s.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — chronométrage d'une course</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un coureur parcourt 400 m en 50 s. ① Sa vitesse en m/s ? ② En km/h ? ③ Quelle distance en 15 min à ce rythme ?</div><div class=\"etu\"><b>Étape 1</b> — <b>v en m/s</b> : v = 400 ÷ 50 = <b>8 m/s</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>En km/h</b> : 8 × 3,6 = <b>28,8 km/h</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Distance en 15 min</b> : 15 min = 900 s : d = v × t = 8 × 900 = <b>7200 m</b>. Méthode : toujours convertir en unités SI AVANT le calcul (m et s), convertir le résultat ensuite.</div></div></details>\n<h3>3. Uniforme ou varié</h3>\n<div class=\"tip\"><b>Mouvement uniforme :</b> la vitesse ne change pas (v constante). <b>Accéléré :</b> la vitesse augmente. <b>Ralenti (décéléré) :</b> la vitesse diminue.<br><b>À retenir :</b> uniforme ≠ « en ligne droite » : on peut tourner en rond à vitesse constante (circulaire uniforme) : la trajectoire et la vitesse sont DEUX informations indépendantes à préciser toutes les deux.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire un tableau de positions</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Positions d'un mobile toutes les secondes : t=0s : 0 m ; t=1 : 3 m ; t=2 : 6 m ; t=3 : 9 m. ① Trajectoire ? ② Nature du mouvement ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Trajectoire</b> : les positions s'alignent (0, 3, 6, 9 sur un axe) : rectiligne.</div><div class=\"etu\"><b>Étape 2</b> — <b>Vitesses successives</b> : 3−0 = 3 m en 1 s ; 6−3 = 3 m ; 9−6 = 3 m : chaque seconde : 3 m parcouru.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : vitesse constante : mouvement rectiligne UNIFORME. Si les écarts grandissaient : accéléré ; s'ils raccourcissaient : ralenti.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> toujours préciser le référentiel (« immobile » ne veut rien dire seul) ; convertir avant calcul : 3,6 km/h = 1 m/s (pas 3,6 m/s) ; distance = vitesse × temps (pas de division) ; uniforme parle de la VITESSE, rectiligne de la TRAJECTOIRE : deux réponses à donner.</div>"},
{"id": "energie-electrique", "theme": "Énergie électrique : puissance (4e)", "niveau": "4e", "titre": "Énergie électrique : puissance et consommation", "cours": "<div class=\"cours-head\"><h2>Énergie électrique : puissance et consommation</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Puissance : le débit d'énergie</h3>\n<div class=\"tip\"><b>Puissance P = énergie convertie chaque seconde</b> ; unité : le <b>watt (W)</b> (et le kilowatt : 1 kW = 1000 W).<br><b>Relation clé :</b> <b>E = P × t</b> (énergie = puissance × durée). Avec E en wattheures (Wh) si P en W et t en heures.<br>Exemples : lampe LED ≈ 10 W ; télé ≈ 100 W ; bouilloire ≈ 2000-3000 W (le champion du salon).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la bouilloire vs la LED</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une bouilloire (2000 W) fonctionne 3 min ; une LED (10 W) reste allumée 5 h. Laquelle consomme le plus ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Bouilloire</b> : t = 3 min = 1/20 h = 0,05 h : E = 2000 × 0,05 = <b>100 Wh</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>LED</b> : E = 10 × 5 = <b>50 Wh</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : la bouilloire consomme DEUX FOIS plus… en 3 minutes ! Mais la LED qui reste allumée toute l'année (10 W × 8760 h = 87,6 kWh) dépasse largement la bouilloire quotidienne : la puissance ET la durée comptent.</div></div></details>\n<h3>2. Le kilowatt-heure : la facture</h3>\n<div class=\"tip\"><b>1 kWh = énergie consommée par un appareil de 1000 W pendant 1 heure.</b> Le compteur électrique mesure les kWh : c'est l'unité de la facture.<br><b>Conversions :</b> 1 kWh = 1000 Wh = 3 600 000 J (pour la culture : 1 Wh = 3600 J).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire une facture</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un radiateur de 1500 W tourne 8 h par jour pendant 30 jours. Prix du kWh : 0,25 €. Coût mensuel ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Énergie quotidienne</b> : E = P × t = 1500 × 8 = 12 000 Wh = 12 kWh/jour.</div><div class=\"etu\"><b>Étape 2</b> — <b>Mois</b> : 12 × 30 = <b>360 kWh</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Coût</b> : 360 × 0,25 = <b>90 €</b> : c'est pour ça qu'on surveille le chauffage en premier : forte puissance × longue durée = poste n° 1 de la facture.</div></div></details>\n<h3>3. Puissance et « specs » des appareils</h3>\n<div class=\"tip\"><b>Sur chaque appareil :</b> une plaque indique la puissance nominale (et la tension nominale 230 V en France). <b>P = U × I</b> sera vue en 3e ; en 4e, on retient : plus un appareil convertit d'énergie par seconde, plus sa puissance est grande.<br><b>Ordre de grandeur des conversions :</b> énergie électrique → chaleur (radiateur, bouilloire : ~100 % en chaleur), lumière (LED : utile et sobre), mouvement (moteur).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le duel des lampes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une lampe à incandescence de 60 W et une LED de 9 W donnent le même éclairage. Économie annuelle (5 h/jour, 365 j, 0,25 €/kWh) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Différence de puissance</b> : 60 − 9 = 51 W « inutiles » (chaleur, pour l'incandescence).</div><div class=\"etu\"><b>Étape 2</b> — <b>Énergie économisée</b> : 51 W × 5 h × 365 = 93 075 Wh ≈ <b>93 kWh</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Argent</b> : 93 × 0,25 ≈ <b>23 €/an</b> pour UNE lampe : multiplié par 10 lampes : 230 € : la LED se rembourse en quelques mois : c'est le calcul éco-citoyen type du chapitre.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le watt (W) mesure la PUISSANCE, le wattheure (Wh) l'ÉNERGIE : 1 W ≠ 1 Wh ; toujours convertir les minutes en heures pour obtenir des Wh (t en heures !) ; la puissance seule ne dit pas tout : il faut la durée (E = P × t) ; 1 kWh = 1000 Wh (kilo = 1000).</div>"},
{"id": "signaux", "theme": "Signaux sonores et lumineux (4e)", "niveau": "4e", "titre": "Signaux sonores et lumineux", "cours": "<div class=\"cours-head\"><h2>Signaux sonores et lumineux</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Deux signaux, deux vitesses</h3>\n<div class=\"tip\"><b>Son :</b> vibration mécanique : besoin d'un milieu ; v ≈ <b>340 m/s</b> dans l'air (≈ 1 235 km/h). <b>Lumière :</b> onde électromagnétique : traverse le vide ; v ≈ <b>300 000 km/s</b> (instantanée à notre échelle).<br>Conséquence spectaculaire : la foudre : l'éclair (lumière) arrive AVANT le tonnerre (son) : décalage = mesure de distance.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le duel des vitesses</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une explosion a lieu à 3 km. Au bout de combien de temps entend-on le « boum » ? Et voit-on le flash ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Le flash</b> : t = d/v = 3000 m ÷ (3×10⁸ m/s) ≈ 0,00001 s : instantané.</div><div class=\"etu\"><b>Étape 2</b> — <b>Le boum</b> : t = 3000 ÷ 340 ≈ <b>8,8 s</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : ~9 s d'écart : on peut chronométrer la tempête à distance : secondes ÷ 3 ≈ km. La lumière « gagne » par un million : à notre échelle humaine, elle arrive « tout de suite ».</div></div></details>\n<h3>2. Fréquence et hauteur d'un son</h3>\n<div class=\"tip\"><b>Fréquence f :</b> nombre de vibrations par seconde, en <b>hertz (Hz)</b>. <b>Grave : f petite</b> (voix d'homme ~50-100 Hz) ; <b>aigu : f grande</b> (~1000 Hz et plus).<br><b>Oreille humaine :</b> environ 20 Hz à 20 000 Hz (les ultrasons sont au-dessus : chiens, chauve-souris, sonars médicaux).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire un sonagramme</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux sons : A vibre 80 fois par seconde ; B vibre 800 fois. Lequel est grave ? Lequel ressemble à une voix d'homme ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Fréquences</b> : A = 80 Hz ; B = 800 Hz.</div><div class=\"etu\"><b>Étape 2</b> — <b>Classement</b> : A (petite fréquence) = GRAVE ; B (grande) = AIGU.</div><div class=\"etu\"><b>Étape 3</b> — <b>Références</b> : la voix d'homme (~100-150 Hz) : proche de A ; la flûte ou un soprano (~800-1000 Hz) : proche de B. La fréquence EST la « carte d'identité » de la hauteur du son.</div></div></details>\n<h3>3. Signaux et information</h3>\n<div class=\"tip\"><b>Un signal TRANSPORTE une information</b> : son de la parole (mots), lumière d'un Morse (alphabet), signal radio (musique). <b>Le décalage son/lumière</b> sert à MESURER : distance des orages (tonnerre), profondeur des océans (sonar : écho), taille de l'Univers (lumières des étoiles = leur passé).<br><b>Atténuation :</b> plus on s'éloigne, plus le signal s'affaiblit (son de plus en plus faible : l'énergie se répartit dans toutes les directions).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le sonar du dauphin</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un sonar émet vers le fond marin ; l'écho revient après 2,4 s (v = 1500 m/s dans l'eau). Profondeur ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Attention aller-retour</b> : le son descend PUIS remonte : t(one-way) = 2,4 ÷ 2 = 1,2 s.</div><div class=\"etu\"><b>Étape 2</b> — <b>Profondeur</b> : d = v × t = 1500 × 1,2 = <b>1800 m</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Technologie voisine</b> : l'échographie médicale, même principe (ultrasons), sur des échelles de cm ; la chauve-souris chasse ainsi à l'échelle du cm aussi : un seul outil, trois échelles.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le son ne passe pas dans le vide (la lumière si) ; écho = diviser le temps par 2 (aller-retour) ; fréquence grave/aigu vs amplitude fort/doux : deux propriétés indépendantes ; les ultrasons (> 20 000 Hz) existent mais on ne les ENTEND pas ; l'orage : on compte les secondes entre éclair et tonnerre, pas l'inverse.</div>"},
{"id": "atomes-ions", "theme": "Atomes, ions et formules chimiques (3e)", "niveau": "3e", "titre": "Atomes, ions et formules chimiques", "cours": "<div class=\"cours-head\"><h2>Atomes, ions et formules chimiques</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'atome et son noyau</h3>\n<div class=\"tip\"><b>Atome = noyau (protons +, neutrons 0) + électrons (−)</b> qui tournent autour. <b>Numéro atomique Z = nombre de protons</b> : c'est la carte d'identité de l'élément. Un atome est <b>électriquement neutre</b> : autant d'électrons (−) que de protons (+).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire une notation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'atome de carbone : A = 12 (nucléons), Z = 6. Combien de protons, neutrons, électrons ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Protons</b> : Z = 6 protons.</div><div class=\"etu\"><b>Étape 2</b> — <b>Neutrons</b> : A − Z = 12 − 6 = 6 neutrons.</div><div class=\"etu\"><b>Étape 3</b> — <b>Électrons</b> : atome neutre : 6 électrons (compensation parfaite des charges). Modèle : petit noyau très lourd + nuage électronique très léger : l'atome est surtout du vide.</div></div></details>\n<h3>2. Les ions : atomes qui gagnent ou perdent</h3>\n<div class=\"tip\"><b>Ion = atome (ou groupe d'atomes) ayant gagné ou perdu des électrons.</b><br><b>Cation (+) :</b> PERD des électrons (Na⁺, Cu²⁺, H⁺). <b>Anion (−) :</b> GAGNE des électrons (Cl⁻, O²⁻).<br><b>Règle d'or :</b> le noyau ne change JAMAIS : seul le nuage électronique bouge.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — former l'ion sodium</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'atome de sodium Na (Z = 11) perd 1 électron. Quelle est la charge de l'ion formé ? Son nom ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Avant</b> : 11 protons (+11), 11 électrons (−11) : neutre.</div><div class=\"etu\"><b>Étape 2</b> — <b>Après la perte</b> : 11 protons, 10 électrons : charge = +11 − 10 = <b>+1</b> : ion <b>Na⁺</b> (cation sodium).</div><div class=\"etu\"><b>Étape 3</b> — <b>Généralisation</b> : perte de n électrons ⟹ charge +n ; gain de n ⟹ −n. Na⁺ et Cl⁻ forment le sel de table NaCl (solide ionique) : la mer est salée de ces ions libérés dans l'eau.</div></div></details>\n<h3>3. Formules des ions à connaître</h3>\n<div class=\"tip\"><b>Cations :</b> H⁺ (hydrogène), Na⁺, K⁺, Ag⁺, Cu²⁺, Fe²⁺/Fe³⁺, Al³⁺. <b>Anions :</b> Cl⁻, O²⁻, S²⁻, F⁻, <b>OH⁻</b> (hydroxyde), <b>NO₃⁻</b> (nitrate), <b>SO₄²⁻</b> (sulfate), <b>CO₃²⁻</b> (carbonate).<br><b>Polyatomique :</b> un ion peut contenir plusieurs atomes (OH⁻ = 1 O + 1 H ; SO₄²⁻ = 1 S + 4 O).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — tester la présence d'ions</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comment montrer qu'une eau minérale contient des ions fer (Fe²⁺) et chlorure (Cl⁻) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Ions fer</b> : ajouter de la soude (NaOH) : un <b>précipité vert</b> de Fe(OH)₂ apparaît : les ions Fe²⁺ sont là.</div><div class=\"etu\"><b>Étape 2</b> — <b>Ions chlorure</b> : ajouter du nitrate d'argent (AgNO₃) : un <b>précipité blanc</b> qui noircit à la lumière (AgCl) : les ions Cl⁻ sont là.</div><div class=\"etu\"><b>Étape 3</b> — <b>Logique du test</b> : chaque réactif « piège » un ion précis sous forme de solide coloré (précipité) : couleur = signature. Cu²⁺ → précipité bleu ; Fe³⁺ → précipité rouille.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le nombre de protons NE CHANGE JAMAIS en formant un ion (sinon ce serait un autre élément !) ; Na⁺ n'a PAS 11 électrons (il en a 10) ; OH⁻ est un ion polyatomique (2 atomes) ; l'ion chlorure se note Cl⁻ (un seul « l » disparaît dans le nom français « chlorure ») ; un ion porte une charge ÉLECTRIQUE, visible dans la solution par conduction (les solutions ioniques conduisent le courant, l'eau pure non).</div>"},
{"id": "transformations-chimiques", "theme": "Transformations chimiques et équations (3e)", "niveau": "3e", "titre": "Transformations chimiques et équations de réaction", "cours": "<div class=\"cours-head\"><h2>Transformations chimiques et équations de réaction</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Changer la matière, pas seulement l'état</h3>\n<div class=\"tip\"><b>Transformation chimique :</b> les molécules se RECOMBINENT : de NOUVELLES substances apparaissent (produits), différentes des départ (réactifs). <b>Indices :</b> changement de couleur, apparition d'un gaz (effervescence), formation d'un précipité, dégagement de chaleur/lumière.<br><b>Différence clé :</b> changement d'état (fusion, vaporisation) = PHYSIQUE : les molécules restent ; réaction = CHIMIQUE : les molécules changent.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — identifier la nature d'une transformation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Classer : ① la glace fond ; ② le fer rouille ; ③ l'eau bout ; ④ le sucre caramélise.</div><div class=\"etu\"><b>Étape 1</b> — <b>① et ③</b> : H₂O reste H₂O (solide/liquide/gaz) : PHYSIQUES.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : le fer + O₂ + humidité ⟹ rouille (oxyde de fer Fe₂O₃) : NOUVELLE substance : CHIMIQUE.</div><div class=\"etu\"><b>Étape 3</b> — <b>④</b> : le sucre chauffé brunit, sent le caramel : molécules transformées : CHIMIQUE. Test universel : « nouvelles substances ? » ⟹ chimique ; « mêmes molécules, autre arrangement ? » ⟹ physique.</div></div></details>\n<h3>2. L'équation de réaction : la comptabilité des atomes</h3>\n<div class=\"tip\"><b>Règle : rien ne se perd, rien ne se crée</b> : AUTANT d'atomes de chaque élément AVANT et APRÈS. <b>Équation :</b> réactifs ⟶ produits, avec des <b>coefficients</b> devant les formules pour équilibrer.<br><b>Exemple :</b> combustion du méthane : CH₄ + <b>2</b> O₂ ⟶ CO₂ + <b>2</b> H₂O.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — équilibrer combustion</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Équilibrer la combustion du propane : C₃H₈ + O₂ ⟶ CO₂ + H₂O.</div><div class=\"etu\"><b>Étape 1</b> — <b>C :</b> 3 C à gauche ⟹ 3 CO₂ à droite.</div><div class=\"etu\"><b>Étape 2</b> — <b>H :</b> 8 H à gauche ⟹ 4 H₂O à droite.</div><div class=\"etu\"><b>Étape 3</b> — <b>O :</b> à droite : 3×2 + 4×1 = 10 O ⟹ <b>5 O₂</b> à gauche. Résultat : C₃H₈ + 5 O₂ ⟶ 3 CO₂ + 4 H₂O : comptage final : C 3/3, H 8/8, O 10/10 ✓. Ordre conseillé : C, puis H, puis O en dernier (souvent le plus pénible).</div></div></details>\n<h3>3. Conservation de la masse</h3>\n<div class=\"tip\"><b>Lavoisier :</b> « Rien ne se perd, rien ne se crée » : la masse des RÉACTIFS consommés = la masse des PRODUITS formés (à l'état clos).<br><b>Attention au gaz !</b> Si un gaz s'échappe (CO₂, O₂), la balance « semble » perdre du poids : l'expérience doit être CLOSE pour vérifier la conservation.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la balance qui « maigrit »</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On brûle 4 g de fer dans un flacon OUVERT : il reste une « cendre » de 5,74 g de Fe₃O₄... mais un gaz a participé ! Expliquer la conservation.</div><div class=\"etu\"><b>Étape 1</b> — <b>Le gaz oublié</b> : le fer fixe l'O₂ de l'AIR : 4 g de Fe + 1,74 g d'O₂ ⟹ 5,74 g d'oxyde.</div><div class=\"etu\"><b>Étape 2</b> — <b>Comptage</b> : masse réactifs (fer + dioxygène) = 4 + 1,74 = 5,74 g = masse produit ✓.</div><div class=\"etu\"><b>Étape 3</b> — <b>Morale</b> : quand une réaction « prend » ou « rend » du gaz, il faut COMPTER le gaz (invisible mais massif) : 1 L d'air pèse 1,3 g : le gaz n'est pas « rien ».</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> on équilibre avec des COEFFICIENTS devant, JAMAIS en changeant les indices (H₂O reste H₂O, pas H₂O₂ !) ; un dégagement de gaz prouve une réaction chimique (sauf ébullition = physique) ; la masse se conserve en comptant le gaz échangé ; une combustion complète donne CO₂ + H₂O, incomplète (manque d'air) : monoxyde de carbone CO, toxique.</div>"},
{"id": "lois-circuits", "theme": "Électricité : tension, intensité et lois des circuits (3e)", "niveau": "3e", "titre": "Électricité : tension, intensité et lois des circuits", "cours": "<div class=\"cours-head\"><h2>Électricité : tension, intensité et lois des circuits</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Tension et intensité : les deux grandeurs</h3>\n<div class=\"tip\"><b>Tension U (volts, V)</b> : la « pression » électrique aux bornes d'un dipôle : mesurée avec un <b>voltmètre en DÉRIVATION</b> (aux bornes). <b>Intensité I (ampères, A)</b> : le « débit » de charges qui traverse : mesurée avec un <b>ampèremètre en SÉRIE</b>.<br><b>Loi des nœuds (dérivation) :</b> I(arrive) = I₁ + I₂. <b>Additivité des tensions (série) :</b> U(générateur) = U₁ + U₂.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — mesurer sans tout casser</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On veut la tension aux bornes d'une lampe et l'intensité qui la traverse. Où brancher chaque appareil ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Voltmètre</b> : en DÉRIVATION, « à cheval » sur la lampe (fils sur ses deux bornes) : il compare sans perturber.</div><div class=\"etu\"><b>Étape 2</b> — <b>Ampèremètre</b> : en SÉRIE : on OUVRE le circuit et on insère l'ampèremètre dans la boucle : il compte les charges qui passent.</div><div class=\"etu\"><b>Étape 3</b> — <b>Logique</b> : le voltmètre a une très grande résistance (il ne « vole » presque rien) ; l'ampèremètre une très petite (il ne freine presque rien) : les brancher à l'envers fausse la mesure ou crée un court-circuit.</div></div></details>\n<h3>2. La loi d'Ohm : le trésor de la 3e</h3>\n<div class=\"tip\"><b>Pour un conducteur ohmique (résistance) :</b> <b>U = R × I</b> (U en V, R en ohms Ω, I en A).<br>Conséquences : I = U/R ; R = U/I. La résistance R <b>limite</b> l'intensité : plus R est grande, plus I est petite (à tension donnée).<br><b>Puissance :</b> P = U × I (watts).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculs en chaîne</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une résistance R = 220 Ω est branchée sur U = 12 V. ① I ? ② Si on double U, que devient I ? ③ Puissance dissipée ?</div><div class=\"etu\"><b>Étape 1</b> — <b>I</b> : I = U/R = 12/220 ≈ <b>0,055 A</b> (55 mA).</div><div class=\"etu\"><b>Étape 2</b> — <b>Double U</b> : I = 24/220 ≈ 0,11 A : l'intensité DOUBLE : proportionnalité (courbe I(U) = droite passant par l'origine).</div><div class=\"etu\"><b>Étape 3</b> — <b>P</b> : P = U × I = 12 × 0,055 ≈ <b>0,65 W</b> : la résistance chauffe (effet Joule : grille-pain, radiateur, filament).</div></div></details>\n<h3>3. Résistances et sécurité</h3>\n<div class=\"tip\"><b>La résistance transforme l'électricité en chaleur</b> (effet Joule) : utile (radiateur, grille-pain, ampoule ancienne) ou gênant (pertes des lignes, chauffe des ordinateurs).<br><b>Protection :</b> fusible (fond si I dépasse son calibre) et disjoncteur (coupe la ligne) : ils protègent des surintensités. <b>Le corps humain :</b> dès ~30 mA traversent le corps, danger grave : ne JAMAIS manipuler le secteur (230 V).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi le fusible fond-il ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une ligne protégée par un fusible de 2 A alimente des lampes (R total = 100 Ω) sur 12 V. On ajoute une lampe en court-circuit (R ≈ 0,5 Ω). Que se passe-t-il ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Normalement</b> : I = 12/100 = 0,12 A : tranquille.</div><div class=\"etu\"><b>Étape 2</b> — <b>Court-circuit</b> : I = 12/0,5 = <b>24 A</b> : 12 fois le calibre du fusible !</div><div class=\"etu\"><b>Étape 3</b> — <b>Rôle du fusible</b> : il fond AVANT que les fils ne chauffent dangereusement : c'est le « maillon faible » volontaire : 24 A dans des fils de 1,5 mm² = échauffement, incendie possible : le fusible donne sa « vie » pour la ligne.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ampèremètre en SÉRIE, voltmètre en DÉRIVATION (jamais l'inverse) ; U = R×I ne vaut que pour les conducteurs OHMIQUES ; les ohms (Ω) mesurent R, les volts U, les ampères I : ne pas mélanger les unités ; en série U s'additionne, en dérivation I s'additionne ; l'effet Joule est une conversion électricité → chaleur, pas une « perte » mystérieuse.</div>"},
{"id": "energie-cinetique", "theme": "Énergie cinétique et sécurité routière (3e)", "niveau": "3e", "titre": "Énergie cinétique et sécurité routière", "cours": "<div class=\"cours-head\"><h2>Énergie cinétique et sécurité routière</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'énergie du mouvement</h3>\n<div class=\"tip\"><b>Énergie cinétique Ec :</b> l'énergie d'un corps liée à sa vitesse : <b>Ec = ½ × m × v²</b> (m en kg, v en m/s ⟹ Ec en joules J).<br><b>Deux conséquences :</b> ① la MASSE compte en ligne droite (×2) ; ② la VITESSE compte au CARRÉ (×2 la vitesse ⟹ ×4 l'Ec !) : c'est la formule la plus « punitive » du programme.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le carré de la vitesse</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une voiture de 1000 kg roule à 50 km/h (≈ 13,9 m/s), puis à 100 km/h (≈ 27,8 m/s). Comparer les Ec.</div><div class=\"etu\"><b>Étape 1</b> — <b>À 50 km/h</b> : Ec = 0,5 × 1000 × 13,9² ≈ <b>96 400 J</b> (~96 kJ).</div><div class=\"etu\"><b>Étape 2</b> — <b>À 100 km/h</b> : Ec = 0,5 × 1000 × 27,8² ≈ <b>386 000 J</b> (~386 kJ).</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : vitesse ×2 ⟹ Ec ×4 : la violence d'un choc à 100 km/h égale une chute de 12 étages : le message central de la sécurité routière.</div></div></details>\n<h3>2. Distance d'arrêt : la chaîne du danger</h3>\n<div class=\"tip\"><b>Distance d'arrêt = distance de réaction + distance de freinage.</b><br><b>réaction</b> : le temps (~1 s à jeun, 2-3 s fatigué/alcool) × la vitesse : le cerveau décide, la voiture continue tout droit. <b>freinage</b> : l'énergie cinétique est dissipée (freins, pneus) : elle grandit comme v².<br>Conséquence : la distance d'arrêt explose avec la vitesse : 50 km/h ≈ 25-30 m ; 90 km/h ≈ 60-70 m ; 130 km/h ≈ 110-130 m.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi 130 sur autoroute ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> À 130 km/h (36,1 m/s), temps de réaction 1 s. ① Distance de réaction ? ② Pourquoi la bande d'arrêt d'urgence fait-elle ~2 km ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Réaction</b> : 36,1 m/s × 1 s = <b>36 m</b> parcourus AVANT même de toucher le frein.</div><div class=\"etu\"><b>Étape 2</b> — <b>Freinage</b> : il faut dissiper Ec = ½mv² : à 1300 kg et 36,1 m/s : ~848 kJ : ~90-100 m de freinage sec.</div><div class=\"etu\"><b>Étape 3</b> — <b>Arrêt total</b> : ~135 m : mais si les freins surchauffent, la pluie, la fatigue : 2 km de BAU = la marge de sécurité : les chiffres du code raccompagnent la physique.</div></div></details>\n<h3>3. Sécurité : convertir plutôt que subir</h3>\n<div class=\"tip\"><b>En cas de choc, l'énergie cinétique doit DISPARAÎTRE</b> : soit dans la voiture (zones déformables, airbag : ils absorbent en s'écrasant), soit… dans les passagers (d'où les blessures). <b>La ceinture :</b> elle retient le corps (sinon le passager continue à la vitesse de la voiture : projectile à 50 km/h). <b>La limitation à 30 km/h en ville :</b> à 30, piéton touché : ~10 % de décès ; à 50 : ~80 % : le carré de la vitesse, encore.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la ceinture et l'airbag</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un choc frontal à 50 km/h (13,9 m/s). Pourquoi la ceinture est-elle vitale alors que « ça ne dure qu'un dixième de seconde » ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Sans ceinture</b> : le passager (75 kg) continue à 13,9 m/s jusqu'au pare-brise : Ec = ½ × 75 × 13,9² ≈ 7,2 kJ : tout se dissipe dans son corps en 0,05 s.</div><div class=\"etu\"><b>Étape 2</b> — <b>Avec ceinture</b> : le corps s'arrête en ~0,3 s avec la voiture : la même énergie, mais étalée sur un temps 6 fois plus long et sur une surface large (torse) : force divisée d'autant.</div><div class=\"etu\"><b>Étape 3</b> — <b>Airbag</b> : il complète : gaz qui amortit la tête en la freinant sur 20-30 cm. Ceinture + airbag : la chaîne de survie : « la voiture se déforme pour que le corps ne se déforme pas ».</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> toujours convertir km/h → m/s AVANT Ec (÷ 3,6) ; le v² punit : ×2 sur la vitesse = ×4 sur Ec, ×3 = ×9 ; distance d'arrêt = réaction + freinage (deux phénomènes DIFFÉRENTS, on ne les confond pas) ; la distance de réaction dépend du CONDUCTEUR (alcool, fatigue, téléphone), le freinage de la ROUTE et du VÉHICULE ; 1 s de réaction ≈ la distance parcourue = la vitesse en m/s (chiffre à retenir).</div>"},
{"id": "poids-gravitation", "theme": "Poids et gravitation (3e)", "niveau": "3e", "titre": "Poids et gravitation", "cours": "<div class=\"cours-head\"><h2>Poids et gravitation</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La gravitation, une interaction à distance</h3>\n<p>La <b>gravitation</b> est une interaction attractive entre tous les corps qui possèdent une masse : deux objets s'attirent mutuellement, à n'importe quelle distance. C'est elle qui fait tomber les objets, qui maintient la Lune autour de la Terre et les planètes autour du Soleil.</p>\n<div class=\"tip\"><b>Ce qu'il faut retenir :</b> l'attraction gravitationnelle dépend des <b>masses</b> (plus les masses sont grandes, plus l'attraction est forte) et de la <b>distance</b> (plus on est loin, plus elle est faible).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi la Lune ne tombe-t-elle pas sur la Terre ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer pourquoi la Lune tourne autour de la Terre au lieu de s'y écraser.</div><div class=\"etu\"><b>Étape 1</b> — <b>La force existe</b> : la Terre attire la Lune (interaction gravitationnelle), dirigée du centre de la Lune vers le centre de la Terre.</div><div class=\"etu\"><b>Étape 2</b> — <b>La Lune avance</b> : en même temps, la Lune possède une vitesse qui la ferait partir « tout droit » s'il n'y avait pas de force.</div><div class=\"etu\"><b>Étape 3</b> — <b>Composer les deux</b> : à chaque instant, la gravitation « courbe » la trajectoire : la Lune « rate » la Terre en permanence : elle tombe SUR elle sans jamais l'atteindre : c'est une <b>orbite</b>. C'est le principe des satellites artificiels aussi.</div></div></details>\n<h3>2. Le poids P : la force de gravitation près du sol</h3>\n<div class=\"tip\"><b>Définition :</b> le poids P d'un objet est la force de gravitation exercée par la Terre (ou un astre) sur cet objet. <br>• Direction : la <b>verticale</b> (vers le centre de la Terre)<br>• Sens : vers le bas<br>• Point d'application : le <b>centre de gravité</b> G de l'objet<br>• Valeur : <b>P = m × g</b>, en newtons (N) si m est en kg et g en N/kg</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer un poids</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un sac de sport a une masse m = 4 kg. Calculer son poids sur Terre (g = 9,8 N/kg), puis sur la Lune (g ≈ 1,6 N/kg).</div><div class=\"etu\"><b>Étape 1</b> — <b>Repérer les données</b> : m = 4 kg ; g(Terre) = 9,8 N/kg.</div><div class=\"etu\"><b>Étape 2</b> — <b>Appliquer la formule</b> : P = m × g = 4 × 9,8 = <b>39,2 N</b> sur Terre.</div><div class=\"etu\"><b>Étape 3</b> — <b>Sur la Lune</b> : P = 4 × 1,6 = <b>6,4 N</b>. La masse n'a PAS changé (c'est la même quantité de matière), c'est g qui a changé : l'objet pèse « 6 fois moins » mais contient toujours 4 kg.</div><div class=\"etu\"><b>Étape 4</b> — <b>Vérifier l'unité</b> : kg × N/kg = N ✓. Le poids s'exprime en newtons, JAMAIS en kg.</div></div></details>\n<h3>3. Masse et poids : ne pas confondre !</h3>\n<table><tr><th></th><th>Masse m</th><th>Poids P</th></tr>\n<tr><td><b>Nature</b></td><td>quantité de matière</td><td>force de gravitation</td></tr>\n<tr><td><b>Unité</b></td><td>kilogramme (kg)</td><td>newton (N)</td></tr>\n<tr><td><b>Instrument</b></td><td>balance</td><td>dynamomètre</td></tr>\n<tr><td><b>Dépend du lieu ?</b></td><td>NON (constante)</td><td>OUI (dépend de g)</td></tr></table>\n<div class=\"tip\"><b>g, l'intensité de la pesanteur :</b> g ≈ 9,8 N/kg sur Terre ; ≈ 1,6 N/kg sur la Lune ; ≈ 3,7 N/kg sur Mars. Sur un astre donné, g est quasiment constant : P est donc <b>proportionnel à m</b> : si la masse double, le poids double.</div>\n<h3>4. Représenter et utiliser le poids</h3>\n<div class=\"ex\"><b>Exemple — schématiser :</b> pour un objet de 2 kg posé sur une table, on dessine un segment fléché (vecteur) partant de son centre de gravité G, vertical, vers le bas, de longueur proportionnelle à P = 2 × 9,8 = 19,6 N (échelle : 1 cm ↔ 10 N ⟹ longueur ≈ 2 cm).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — retrouver une masse à partir du poids</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un dynamomètre indique P = 49 N sur Terre (g = 9,8 N/kg). Quelle est la masse de l'objet ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Formule de départ</b> : P = m × g, donc m = P / g.</div><div class=\"etu\"><b>Étape 2</b> — <b>Remplacer</b> : m = 49 / 9,8 = <b>5 kg</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Vérifier</b> : 5 × 9,8 = 49 N ✓. La masse en kg, le poids en N : l'inversion de la formule est le calcul le plus fréquent en exercice.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b><ul>\n<li>Ne pas confondre masse (kg, balance, constante) et poids (N, dynamomètre, dépend du lieu) : c'est LE piège du chapitre.</li>\n<li>Le poids se mesure en newtons : « un poids de 5 kg » est une erreur de langage courant.</li>\n<li>Sur la Lune, la masse ne change pas, seul le poids diminue.</li>\n<li>La direction du poids est la verticale du lieu (vers le centre de la Terre), pas « vers le sol » si l'objet est au-dessus de la tête.</li>\n<li>En énoncé, toujours convertir la masse en kg avant d'appliquer P = m×g (500 g = 0,5 kg).</li></ul></div>"}];

{"id": "eau-melanges", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Corps pur :</b> une seule espèce chimique ; <b>mélange :</b> plusieurs.</p>\n<p><b>Eau pure :</b> bout à 100 °C et gèle à 0 °C (température CONSTANTE).</p>\n<p><b>Homogène</b> = une seule phase visible ; <b>hétérogène</b> = plusieurs phases.</p>\n<h3>🧭 Séparations</h3>\n<ul>\n<li><b>Décantation :</b> 2 liquides non miscibles (le plus dense en dessous) ou solide qui se dépose.</li>\n<li><b>Filtration :</b> solide NON dissous (résidu sur filtre, filtrat au-dessous).</li>\n<li><b>Distillation :</b> liquides miscibles : on vaporise le plus volatil puis on le condense (distillat).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Homogène ≠ pur (l'air est homogène mais mélangé).</li>\n<li>Le sel dissous ne se filtre pas : il faut distiller ou évaporer.</li>\n<li>Après dissolution, la masse se CONSERVE : sel + eau = masse totale.</li>\n</ul>"},
{"id": "etats-matiere", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>3 états :</b> solide (ordonné, serré), liquide (désordonné, serré), gaz (dispersé, éloigné).</p>\n<p><b>6 changements :</b> fusion, solidification, vaporisation, liquéfaction, sublimation, condensation solide.</p>\n<p><b>Masse : conservée ; volume : PAS conservé.</b> Exception eau : la glace est moins dense que l'eau liquide.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Identifier un état</b> sur un schéma : espacement (serré ?) puis occupation (tout le cadre ?).</li>\n<li><b>Nommer un changement</b> : état initial → état final, puis vocabulaire exact.</li>\n<li><b>Ébullition</b> = vaporisation rapide avec bulles (100 °C pour l'eau pure) ; <b>évaporation</b> = lente, à toute température.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>La « vapeur blanche » visible = gouttelettes LIQUIDES, pas de la vapeur (invisible).</li>\n<li>Givre/neige : gaz → solide (condensation solide), pas fusion.</li>\n<li>La fonte d'un glaçon flottant ne fait pas monter le niveau de l'eau.</li>\n</ul>"},
{"id": "circuit-serie", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Circuit fermé</b> = boucle complète : le courant circule ; <b>ouvert</b> = arrêt total.</p>\n<p><b>Sens conventionnel :</b> de la borne + vers la borne − à l'extérieur du générateur.</p>\n<p><b>Série :</b> une seule boucle, dipôles à la chaîne : <b>unicité de l'intensité</b> (I identique partout).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma normalisé :</b> symboles, fils rectilignes, jamais de croisements inutiles.</li>\n<li><b>Panne ?</b> tester : connexions (boucle), lampe (remplacer), pile (neuve, bornes).</li>\n<li><b>Mesurer I :</b> ampèremètre EN SÉRIE dans la boucle.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Le courant n'est pas consommé : il revient au générateur identique.</li>\n<li>En série, une lampe dévissée éteint TOUT le circuit.</li>\n<li>Ampèremètre en série, voltmètre en dérivation (jamais l'inverse).</li>\n</ul>"},
{"id": "lumiere-ombres", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Source primaire</b> = produit sa lumière (Soleil, lampe) ; <b>objet diffusant</b> = renvoie la lumière reçue (Lune, murs).</p>\n<p><b>Propagation rectiligne</b> dans un milieu transparent et homogène ; vitesse ≈ 300 000 km/s.</p>\n<p><b>Ombre propre</b> (sur l'objet) ; <b>ombre portée</b> (sur l'écran) ; <b>cône d'ombre</b> (volume) ; <b>pénombre</b> (source étendue).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Rayons :</b> segments fléchés source → objet → œil (toujours orientés).</li>\n<li><b>Tracer une ombre :</b> 2 rayons tangents à l'objet, prolongés jusqu'à l'écran.</li>\n<li><b>Voir un objet :</b> lumière source → objet (diffusion) → œil : la chaîne complète.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>La Lune éclaire = diffusant, PAS source.</li>\n<li>La lumière ne contourne pas les obstacles : ligne droite.</li>\n<li>Source ponctuelle = ombre nette ; source étendue = ombre + pénombre.</li>\n</ul>"},
{"id": "son-propagation", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Son = vibration</b> d'une source, transmise de proche en proche par un milieu matériel.</p>\n<p><b>Pas de son dans le vide</b> ; la lumière, elle, traverse le vide.</p>\n<p><b>Vitesse :</b> air ≈ 340 m/s ; eau ≈ 1500 m/s ; acier ≈ 5200 m/s.</p>\n<p><b>Grave/aigu = fréquence</b> (lent/rapide) ; <b>fort/doux = amplitude</b>.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Orage :</b> d = v × t ; distance (km) ≈ secondes ÷ 3.</li>\n<li><b>Écho/sonar :</b> d = (v × t) ÷ 2 (aller-retour).</li>\n<li><b>Prouver la vibration :</b> grains de sable sur une membrane qui émet.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Explosions « dans l'espace » : cinéma : silence réel.</li>\n<li>Le son va PLUS VITE dans l'eau et l'acier que dans l'air.</li>\n<li>Voir avant d'entendre : éclair puis tonnerre, pas l'inverse.</li>\n</ul>"},
{"id": "air-pression", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Air = mélange :</b> ~78 % diazote, ~21 % dioxygène, ~1 % autres.</p>\n<p><b>Masse de l'air ≈ 1,3 g/L</b> : l'air est pesable.</p>\n<p><b>Pression = chocs des particules</b> sur les parois ; unité : hPa ; atmosphère ≈ 1013 hPa.</p>\n<p><b>À quantité d'air fixe :</b> volume ↓ ⟹ pression ↑ (compression), et inversement.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Masse d'un volume d'air :</b> m = 1,3 × V (V en litres).</li>\n<li><b>Ballon dégonflé/gonflé :</b> la différence de masse = masse d'air injecté.</li>\n<li><b>Ébullition</b> : pression plus basse (altitude) → bout plus tôt (moins chaud) ; pression plus haute (cocotte) → bout plus tard (plus chaud).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Le dioxygène n'est pas majoritaire : c'est le DIAZOTE.</li>\n<li>La pression appuie dans toutes les directions, pas seulement vers le bas.</li>\n<li>Comprimer n'ajoute pas de particules : ça les rapproche.</li>\n</ul>"},
{"id": "atomes-molecules", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Atome :</b> brique de la matière ; ~90 éléments naturels (C, H, O, N, Fe…).</p>\n<p><b>Molécule :</b> assemblage d'atomes ; formule : H₂O, O₂, N₂, CO₂, CH₄, C₆H₁₂O₆.</p>\n<p><b>Indice = nombre d'atomes de l'élément juste avant lui</b> (H₂O = 2 H + 1 O).</p>\n<p><b>Changement d'état = même molécule</b> : glace, eau, vapeur = toujours H₂O.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Décomposer une formule :</b> lire de gauche à droite, compter chaque élément avec son indice, additionner pour le total d'atomes.</li>\n<li><b>Distinguer atome/molécule :</b> O₂ = molécule (2 atomes) ; O = atome seul.</li>\n<li><b>Modèle particulaire :</b> dessiner des sphères liées (molécules) et les disposer selon l'état.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>L'indice ne « déborde » pas sur l'élément suivant.</li>\n<li>Une molécule d'eau = 3 atomes, pas 2.</li>\n<li>L'air est fait de MOLÉCULES (N₂, O₂), pas d'atomes isolés.</li>\n</ul>"},
{"id": "circuits-derivation", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Série :</b> une boucle : I identique partout (unicité).</p>\n<p><b>Dérivation :</b> nœuds + branches ; <b>loi des nœuds : I = I₁ + I₂</b> ; même tension pour toutes les branches.</p>\n<p><b>Diagnostic :</b> une panne éteint tout ⟹ série ; le reste continue ⟹ dérivation.</p>\n<p><b>Danger :</b> court-circuit = intensité très grande = échauffement (fusible/disjoncteur = protection).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Loi des nœuds :</b> I(qui arrive) = I(qui repart) : I₂ = I − I₁.</li>\n<li><b>Compter les boucles :</b> 1 seule = série ; 2 ou plus = dérivation.</li>\n<li><b>Choisir le branchement des appareils de mesure :</b> ampèremètre en série, voltmètre aux bornes (dérivation).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>En dérivation, les I des branches sont différents : c'est la loi des nœuds qui les relie.</li>\n<li>La maison est en dérivation : jamais en série.</li>\n<li>Court-circuiter une pile : interdit (chauffe, danger).</li>\n</ul>"},
{"id": "vitesse-mouvement", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Mouvement relatif au référentiel</b> (sol, rails…). <b>Trajectoire :</b> rectiligne ou curviligne (circulaire).</p>\n<p><b>v = d / t</b> (m, s ⟹ m/s) ; <b>1 m/s = 3,6 km/h</b>.</p>\n<p><b>Uniforme</b> = vitesse constante ; <b>accéléré</b> = elle augmente ; <b>ralenti</b> = elle diminue.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculs :</b> v = d/t ; d = v×t ; t = d/v : convertir en m et s d'abord.</li>\n<li><b>km/h → m/s :</b> ÷ 3,6 ; <b>m/s → km/h :</b> × 3,6.</li>\n<li><b>Lire des positions</b> : écarts réguliers = uniforme ; croissants = accéléré ; décroissants = ralenti.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« Immobile » sans référentiel = phrase vide.</li>\n<li>90 km/h = 25 m/s (et non 90 m/s).</li>\n<li>Rectiligne/uniforme : deux propriétés indépendantes, toujours les deux à préciser.</li>\n</ul>"},
{"id": "energie-electrique", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Puissance (W)</b> = énergie convertie PAR SECONDE ; 1 kW = 1000 W.</p>\n<p><b>Énergie : E = P × t</b> (Wh si P en W et t en heures).</p>\n<p><b>1 kWh</b> = 1000 W pendant 1 h : c'est l'unité du compteur et de la facture.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Énergie d'un appareil :</b> E = P × t : t en heures ⟹ Wh ; ÷1000 ⟹ kWh.</li>\n<li><b>Coût :</b> kWh × prix du kWh.</li>\n<li><b>Comparer des appareils :</b> regarder puissance ET durée d'usage.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>W = puissance ; Wh (kWh) = énergie : ne jamais confondre les unités.</li>\n<li>30 min = 0,5 h dans les calculs (pas 30).</li>\n<li>La bouilloire est puissante mais brève ; le frigo est faible mais permanent.</li>\n</ul>"},
