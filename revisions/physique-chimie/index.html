{"id": "ondes-signaux", "theme": "Ondes sonores et lumineuses (2de)", "niveau": "2de", "titre": "Ondes sonores et lumineuses", "cours": "<div class=\"cours-head\"><h2>Ondes sonores et lumineuses</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Une onde : une propagation, pas un transport de matière</h3>\n<div class=\"tip\"><b>Onde :</b> propagation d'une perturbation SANS transport de matière (mais AVEC transport d'énergie). <b>Deux familles :</b> mécaniques (son, vague, séisme : besoin d'un milieu) ; électromagnétiques (lumière, radio, X : traversent le vide).<br><b>Célérité :</b> v(dimension) = d/Δt. Son dans l'air : 340 m/s ; lumière : 3×10⁸ m/s.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la ola du stade</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La « ola » parcourt les tribunes : chaque spectateur se lève et se rassoit. Qui s'est déplacé le long du stade ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Personne ne change de place</b> : chaque spectateur bouge sur place (haut/bas) : matière immobile en moyenne.</div><div class=\"etu\"><b>Étape 2</b> — <b>Mais la PERTURBATION voyage</b> : l'information « debout/assis » se propage de tribune en tribune : c'est l'ONDE.</div><div class=\"etu\"><b>Étape 3</b> — <b>Morale</b> : le son fait pareil : chaque tranche d'air vibre sur place (compression/dépression) et passe le relais à la suivante : nos oreilles captent l'énergie du message, pas l'air du hautbois.</div></div></details>\n<h3>2. Période, fréquence, longueur d'onde</h3>\n<div class=\"tip\"><b>Période T (s) :</b> durée d'un motif complet. <b>Fréquence f (Hz) :</b> nombre de motifs par seconde : <b>f = 1/T</b>.<br><b>Longueur d'onde λ (m) :</b> distance parcourue pendant une période : <b>λ = v × T = v / f</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer λ</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un son de fréquence 680 Hz se propage à 340 m/s. ① Période ? ② Longueur d'onde ? ③ Et pour une onde radio de 100 MHz (v = 3×10⁸ m/s) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Période</b> : T = 1/f = 1/680 ≈ <b>1,47 ms</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>λ(son)</b> : λ = v/f = 340/680 = <b>0,5 m</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>λ(FM)</b> : 100 MHz = 10⁸ Hz : λ = 3×10⁸/10⁸ = <b>3 m</b> : les antennes font de l'ordre de λ/2 : d'où les tailles d'antennes des postes radio.</div></div></details>\n<h3>3. Retard et mesures</h3>\n<div class=\"tip\"><b>Retard τ = d/v :</b> le décalage entre l'émission et la réception. <b>Applications :</b> écho (sonar), tonnerre, GPS (retards de signaux des satellites), échographie.<br><b>Atténuation et absorption :</b> le signal s'affaiblit avec la distance (divergence) et selon le milieu (l'opaque, l'absorbant).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le GPS</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un satellite GPS est à 20 200 km. Quel est le retard du signal ? (v = 3×10⁸ m/s ; la précision exigée est de ~10 ns pour 3 m.)</div><div class=\"etu\"><b>Étape 1</b> — <b>Retard</b> : τ = d/v = 2,02×10⁷ / 3×10⁸ ≈ <b>0,067 s</b> (67 ms).</div><div class=\"etu\"><b>Étape 2</b> — <b>Enjeu de précision</b> : 1 ns (milliardième de seconde) d'erreur = 30 cm : il faut des horloges atomiques dans les satellites.</div><div class=\"etu\"><b>Étape 3</b> — <b>Triangulation</b> : en croisant les retards de 4 satellites, le récepteur calcule sa position : c'est un pur problème d'ondes et de retards : la technologie dépend de la formule τ = d/v.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> une onde ne transporte PAS de matière (seulement de l'énergie/Information) ; le son exige un milieu (vide = silence), la lumière non ; λ = v/f avec v dans le MILIEU considéré (le son va plus vite dans l'eau : 1500 m/s) ; f = 1/T (attention aux unités : ms, µs) ; le retard se calcule avec la distance réelle (écho : d = v×τ/2).</div>"},
{"id": "conversions-energie", "theme": "Énergie : formes et conversions (2de)", "niveau": "2de", "titre": "Énergie : formes et conversions", "cours": "<div class=\"cours-head\"><h2>Énergie : formes et conversions</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les formes d'énergie</h3>\n<div class=\"tip\"><b>Les grandes familles :</b> <b>cinétique</b> (mouvement), <b>potentielle</b> (position : gravitaire, élastique), <b>chimique</b> (liaisons : pétrole, sucre, piles), <b>électrique</b>, <b>lumineuse</b>, <b>thermique</b> (agitation microscopique), <b>nucléaire</b> (noyau).<br><b>Source et convertisseur :</b> une SOURCE stocke (pétrole, Soleil, pile) ; un CONVERTISSEUR transforme (moteur, lampe, muscle).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la chaîne d'une voiture</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire la chaîne énergétique d'une voiture à essence.</div><div class=\"etu\"><b>Étape 1</b> — <b>Source</b> : l'essence : énergie CHIMIQUE stockée dans les liaisons.</div><div class=\"etu\"><b>Étape 2</b> — <b>Convertisseur</b> : le moteur : chimique → cinétique (75 %) + thermique (perdue en chaleur, ~60-70 % !).</div><div class=\"etu\"><b>Étape 3</b> — <b>Chaîne complète</b> : chimique → thermique (combustion) → mécanique (pistons) → cinétique (la voiture avance) : à chaque flèche, une conversion ; le rendement dit la part utile.</div></div></details>\n<h3>2. Conservation et rendement</h3>\n<div class=\"tip\"><b>Principe de conservation :</b> l'énergie ne se crée ni ne se perd : elle se TRANSFORME. E(totale entrante) = E(utile) + E(perdue ou « dissipée »).<br><b>Rendement r = E(utile) / E(consommée)</b> (≤ 1, souvent en %). Un moteur thermique : ~25-35 % ; une LED : ~40 % ; une centrale nucléaire : ~33 %.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer un rendement</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une lampe reçoit 100 J et restitue 45 J de lumière. ① Rendement ? ② Où sont passés les 55 J ? ③ Et une lampe à incandescence (5 J de lumière) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>LED</b> : r = 45/100 = <b>45 %</b> : excellent pour de la lumière.</div><div class=\"etu\"><b>Étape 2</b> — <b>Les 55 J</b> : dissipés en CHALEUR (effet Joule) : l'énergie existe toujours, juste « dégradée ».</div><div class=\"etu\"><b>Étape 3</b> — <b>Incandescence</b> : r = 5/100 = <b>5 %</b> : 95 % partent en chaleur : un radiateur qui éclaire : d'où le passage mondial aux LED (même service, 6-10 fois moins de consommation).</div></div></details>\n<h3>3. Puissance : l'énergie par seconde</h3>\n<div class=\"tip\"><b>P = E / Δt</b> (watts = joules/seconde). <b>E = P × Δt</b> : le compteur électrique facture des kWh : 1 kWh = 3,6×10⁶ J.<br><b>Sources renouvelables ou non :</b> renouvelable (flux inépuisable à échelle humaine : solaire, éolien, hydraulique) vs épuisable (stock : charbon, pétrole, gaz, uranium).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la bouilloire et l'ordre de grandeur</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une bouilloire de 2000 W porte l'eau à ébullition en 3 min. ① Énergie en J ? ② En kWh ? ③ Comparer à la consommation journalière d'une LED (10 W, 5 h).</div><div class=\"etu\"><b>Étape 1</b> — <b>Joules</b> : E = P × t = 2000 × 180 = <b>360 000 J</b> = 360 kJ.</div><div class=\"etu\"><b>Étape 2</b> — <b>kWh</b> : 0,1 h × 2000 W = <b>0,1 kWh</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>LED</b> : 10 × 5 = 50 Wh = 0,05 kWh : la bouilloire de 3 min = 2 journées de LED : les fortes puissances, même brèves, pèsent : d'où les gestes qui comptent (chauffer, rouler) versus ceux qui ne comptent pas (une LED).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> l'énergie se CONSERVE toujours : c'est le rendement qui est < 1 (les « pertes » sont des conversions en chaleur, pas des disparitions) ; watt = puissance, wattheure = énergie ; renouvelable ≠ propre ≠ inépuisable en instantané (le solaire ne produit pas la nuit) ; une source ne « produit » pas de l'énergie : elle la RESTITUE (elle l'avait stockée). </div>"},
{"id": "solutions-1re", "theme": "Solutions et concentrations : préparer et diluer (1re)", "niveau": "1re", "titre": "Solutions et concentrations : préparer et diluer", "cours": "<div class=\"cours-head\"><h2>Solutions et concentrations : préparer et diluer</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Dissolution : préparer par pesée</h3>\n<div class=\"tip\"><b>Dissoudre une masse m de soluté</b> dans une fiole jaugée : n = m/M, puis <b>C = n/V</b> : donc <b>C = m/(M×V)</b>.<br><b>Protocole :</b> peser (balance au 0,001 g) ⟹ verser dans la fiole ⟹ dissoudre aux 2/3 ⟹ compléter au trait de jauge ⟹ homogénéiser.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — préparer 100 mL à 0,1 mol/L</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Préparer 100,0 mL de solution de glucose (C₆H₁₂O₆, M = 180 g/mol) à 0,100 mol/L. ① Masse à peser ? ② Protocole ?</div><div class=\"etu\"><b>Étape 1</b> — <b>n</b> : n = C × V = 0,100 × 0,1000 = 0,0100 mol.</div><div class=\"etu\"><b>Étape 2</b> — <b>m</b> : m = n × M = 0,0100 × 180 = <b>1,80 g</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Protocole</b> : 1,80 g ⟹ fiole 100 mL ⟹ eau aux 2/3, agiter ⟹ compléter au trait ⟹ retourner 10 fois : la précision vient du MATÉRIEL (fiole jaugée) et du GESTE (bas du ménisque sur le trait).</div></div></details>\n<h3>2. Dilution : préparer à partir d'une mère</h3>\n<div class=\"tip\"><b>Facteur de dilution F = C₀/C = V/V₀</b> (mère/fille). La quantité de soluté est conservée : <b>C₀V₀ = C×V</b>.<br><b>Matériel :</b> pipette jaugée (+ propipette) pour le prélèvement précis, fiole jaugée pour le volume final. Une éprouvette ne convient PAS (précision ~1 % contre 0,1 %).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — dilution en cascade</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Solution mère de permanganate à 5,0×10⁻⁴ mol/L. On veut 3 solutions filles à 1,0×10⁻⁴ ; 5,0×10⁻⁵ ; 1,0×10⁻⁵ mol/L dans des fioles de 50,0 mL. Quels prélèvements ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Fille 1</b> (F = 5) : V₀ = V/F = 50/5 = <b>10,0 mL</b> de mère.</div><div class=\"etu\"><b>Étape 2</b> — <b>Fille 2</b> (F = 10) : V₀ = <b>5,0 mL</b> ; <b>Fille 3</b> (F = 50) : V₀ = <b>1,0 mL</b> de mère (ou 5 mL de fille 2 : dilution en chaîne, moins de mère consommée).</div><div class=\"etu\"><b>Étape 3</b> — <b>Vérification visuelle</b> : les 4 solutions forment un dégradé du violet foncé au rose pâle : la couleur EST la concentration rendue visible (principe de l'échelle de teintes).</div></div></details>\n<h3>3. Concentrations en ions et absorbance (aperçu)</h3>\n<div class=\"tip\"><b>Attention aux ions :</b> si le soluté est ionique (NaCl ⟹ Na⁺ + Cl⁻), chaque mole de soluté libère 1 mole de chaque ion : [Na⁺] = [Cl⁻] = C. Pour CaCl₂ : [Cl⁻] = 2C !<br><b>Spectrophotométrie :</b> l'absorbance A d'une solution colorée est proportionnelle à C (loi de Beer-Lambert) : c'est l'outil de mesure des concentrations en TP.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — les ions comptent double</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une solution de chlorure de calcium CaCl₂ à 0,010 mol/L. Concentrations des ions Ca²⁺ et Cl⁻ ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Dissociation</b> : CaCl₂ ⟹ Ca²⁺ + 2 Cl⁻ : 1 mole de soluté libère 1 mole de Ca²⁺ et 2 moles de Cl⁻.</div><div class=\"etu\"><b>Étape 2</b> — <b>Concentrations</b> : [Ca²⁺] = 0,010 mol/L ; [Cl⁻] = 2 × 0,010 = <b>0,020 mol/L</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Généralisation</b> : toujours écrire l'équation de dissolution AVANT de compter : les coefficients deviennent des multiplicateurs : [ion] = coefficient × C. Piège d'examen classique : CaCl₂, AlCl₃ (3 Cl⁻ !), sulfate de cuivre (Cu²⁺ + SO₄²⁻ : 1 et 1).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> peser m = C×M×V en vérifiant les unités (V en L !) ; pipette jaugée pour prélever, jamais l'éprouvette ; homogénéiser à la FIN (compléter au trait AVANT d'agiter fausse tout) ; compter les ions avec leurs coefficients stoechiométriques ; le facteur de dilution est sans unité.</div>"},
{"id": "bilan-matiere", "theme": "Bilan de matière : avancement et réactif limitant (1re)", "niveau": "1re", "titre": "Bilan de matière : avancement et réactif limitant", "cours": "<div class=\"cours-head\"><h2>Bilan de matière : avancement et réactif limitant</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'avancement : la variable qui décrit la réaction</h3>\n<div class=\"tip\"><b>Tableau d'avancement :</b> pour aA + bB ⟶ cC + dD, chaque « tour de réaction » consomme a A et b B, forme c C et d D. <b>L'avancement x (mol)</b> compte les tours : n(A) = n₀(A) − a·x, etc.<br><b>xF (avancement final)</b> s'arrête quand un réactif est épuisé : le <b>réactif limitant</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — construire le tableau</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> 2,0 mol de H₂ et 1,5 mol de O₂ : 2 H₂ + O₂ ⟶ 2 H₂O. Remplir le tableau et trouver le réactif limitant.</div><div class=\"etu\"><b>Étape 1</b> — <b>Lignes</b> : état initial : H₂ : 2,0 ; O₂ : 1,5 ; H₂O : 0. En cours : 2,0−2x ; 1,5−x ; 2x.</div><div class=\"etu\"><b>Étape 2</b> — <b>Limites</b> : H₂ s'épuise si x = 1,0 ; O₂ si x = 1,5 : le premier atteint est H₂ : <b>H₂ limitant</b>, xF = 1,0 mol.</div><div class=\"etu\"><b>Étape 3</b> — <b>Final</b> : H₂ : 0 ; O₂ : 1,5−1,0 = 0,5 (excès) ; H₂O : 2×1,0 = 2,0 mol formées. Toujours vérifier : aucune quantité négative, l'excédent reste.</div></div></details>\n<h3>2. Trouver le réactif limitant : la méthode rapide</h3>\n<div class=\"tip\"><b>Méthode des rapports :</b> pour chaque réactif, calculer n₀/coefficient ; le PLUS PETIT rapport gagne (réactif limitant).<br><b>Excès :</b> les autres réactifs restent en partie. <b>Mélange stoechiométrique :</b> tous les rapports égaux : tout est consommé : xF = ce rapport commun.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la méthode éclair</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> 0,30 mol d'aluminium + 0,25 mol de dichlore : 2 Al + 3 Cl₂ ⟶ 2 AlCl₃. Limitant ? Quantités finales ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Rapports</b> : Al : 0,30/2 = 0,15 ; Cl₂ : 0,25/3 ≈ 0,083 : plus petit ⟹ <b>Cl₂ limitant</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>xF</b> : xF = 0,25/3 ≈ 0,083 mol.</div><div class=\"etu\"><b>Étape 3</b> — <b>Finaux</b> : Al : 0,30 − 2×0,083 ≈ 0,13 mol (excès) ; Cl₂ : 0 ; AlCl₃ : 2×0,083 ≈ 0,17 mol : la méthode donne tout, sans tableau.</div></div></details>\n<h3>3. Rendement et proportions</h3>\n<div class=\"tip\"><b>Rendement r = n(obtenue)/n(maximale théorique)</b> : la réaction peut être incomplète, secondaire (produits parasites), ou les réactifs se perdent (transferts).<br><b>Cuisine et industrie :</b> on choisit souvent un réactif en excès pour consommer le plus coûteux/nuisible en totalité (l'excès est recyclé ou éliminé).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — synthèse et rendement</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Synthèse de l'aspirine : on part de 0,100 mol d'acide salicylique et on isole 0,072 mol d'aspirine (l'autre réactif est en excès). Rendement ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Max théorique</b> : coefficients 1:1 ⟹ n(max) = 0,100 mol.</div><div class=\"etu\"><b>Étape 2</b> — <b>Rendement</b> : r = 0,072/0,100 = <b>72 %</b> : très honorable en synthèse organique (souvent 40-80 %).</div><div class=\"etu\"><b>Étape 3</b> — <b>Pourquoi pas 100 % ?</b> réaction incomplète (équilibre), réactions parasites, pertes lors des filtrations/lavages : le rendement mesure la QUALITÉ globale du protocole : c'est la note du chimiste.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le réactif limitant est celui qui s'épuise le PREMIER (plus petit n₀/coef) : pas le plus petit n₀ ; les coefficients multiplient x pour donner les variations (signe − pour les réactifs, + pour les produits) ; un tableau ne doit JAMAIS contenir de quantité négative (sinon le mauvais réactif a été choisi) ; dans un mélange stoechiométrique, il n'y a PLUS rien à l'état final (réactifs : 0).</div>"},
{"id": "mouvement-forces", "theme": "Mouvement et interactions : gravité et forces (1re)", "niveau": "1re", "titre": "Mouvement et interactions : gravité et forces", "cours": "<div class=\"cours-head\"><h2>Mouvement et interactions : gravité et forces</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La deuxième loi de Newton : le cœur du chapitre</h3>\n<div class=\"tip\"><b>Somme des forces = m × vecteur accélération</b> : ΣF = m·a. C'est la loi qui relie les FORCES (causes) au MOUVEMENT (effet) : si la résultante est non nulle, le mouvement change.<br><b>Cas particuliers :</b> ΣF = 0 ⟹ a = 0 ⟹ mouvement rectiligne uniforme (principe d'inertie, vu en 2de) ; chute libre : seule force = le poids.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comprendre ΣF = ma</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une voiture de 1200 kg accélère à 2 m/s² sur route horizontale. ① Résultante des forces ? ② Si la résultante devient nulle, que fait la voiture ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Résultante</b> : ΣF = m·a = 1200 × 2 = <b>2400 N</b> (horizontale, vers l'avant : motrice > frottements).</div><div class=\"etu\"><b>Étape 2</b> — <b>Forces en présence</b> : poids + réaction (verticales, se compensent) + motrice − frottement (horizontales) : la résultante horizontale vaut 2400 N.</div><div class=\"etu\"><b>Étape 3</b> — <b>ΣF = 0</b> : a = 0 : la voiture garde SA vitesse à l'instant donné (elle ne freine que si une force s'y oppose) : l'inertie au grand complet.</div></div></details>\n<h3>2. Chute libre : la gravité seule</h3>\n<div class=\"tip\"><b>Chute libre :</b> seul le poids agit : a = g (≈ 9,81 m/s², vers le bas), SANS frottement. <b>Verticale, sans vitesse initiale :</b> v = g·t et h = ½g·t².<br><b>Troublant :</b> la masse ne change PAS la chute (plume et marteau sur la Lune, filmés par Apollo 15) : tous les corps tombent à la même accélération.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la goutte d'eau du 6e étage</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une goutte tombe d'une fenêtre à 20 m (chute libre, g ≈ 10). ① Durée ? ② Vitesse à l'arrivée ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Durée</b> : h = ½g·t² ⟹ t² = 2h/g = 2×20/10 = 4 ⟹ t = <b>2 s</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Vitesse</b> : v = g·t = 10 × 2 = <b>20 m/s</b> (72 km/h).</div><div class=\"etu\"><b>Étape 3</b> — <b>Validité</b> : en réalité, la goutte atteint une vitesse limite (frottement de l'air) : la chute libre « pure » vaut pour les chutes courtes/le vide : le modèle a un domaine de validité.</div></div></details>\n<h3>3. Mouvements dans un champ uniforme et gravitation</h3>\n<div class=\"tip\"><b>Projectile</b> (frottements négligés) : la composante horizontale de la vitesse est CONSTANTE ; la composante verticale suit la chute : la trajectoire est une <b>parabole</b>.<br><b>Attraction gravitationnelle :</b> F = G·m·m'/d² : la Terre attire la Lune... et la Lune attire la Terre (marées) : les forces d'interaction sont TOUJOURS opposées et de même valeur (3e loi de Newton).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le ballon de basket</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un joueur lance un ballon à 5 m/s horizontalement, d'une hauteur de 2,5 m (g ≈ 10). Où et quand retombe-t-il ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Chute verticale</b> : 2,5 = ½×10×t² ⟹ t² = 0,5 ⟹ t ≈ <b>0,71 s</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Distance horizontale</b> : x = v×t = 5 × 0,71 ≈ <b>3,5 m</b> : le ballon avance tout en tombant : parabole.</div><div class=\"etu\"><b>Étape 3</b> — <b>Indépendance</b> : la chute (verticale) et l'avancée (horizontale) se calculent SÉPARÉMENT : elles ne se « mélangent » jamais : c'est toute la méthode du projectile.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> dans la chute libre, la masse n'intervient PAS dans a = g ; v = g·t ne vaut que si la vitesse initiale est nulle ; ΣF = ma : la résultante pointe dans le sens de l'ACCÉLÉRATION, pas forcément du mouvement (freinage : a opposé à v) ; l'action et la réaction s'appliquent sur DEUX corps différents : elles ne « s'annulent » jamais sur un même système.</div>"},
{"id": "travail-energie", "theme": "Travail et énergie : puissance et transferts (1re)", "niveau": "1re", "titre": "Travail et énergie : puissance et transferts", "cours": "<div class=\"cours-head\"><h2>Travail et énergie : puissance et transferts</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le travail : l'énergie transférée par une force</h3>\n<div class=\"tip\"><b>Travail d'une force constante :</b> <b>W = F × d × cos(α)</b> (joules) : F en N, d = déplacement en m, α = angle force/déplacement.<br><b>Trois cas :</b> α = 0° (force aidante) : W = F×d > 0 (MOTEUR) ; α = 90° : W = 0 (force perpendiculaire : le poids sur un trajet horizontal ne travaille pas) ; α = 180° : W = −F×d (RÉSISTANT : frottement).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — tirer une valise</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On tire une valise sur 10 m : force de traction 50 N à 30° au-dessus de l'horizontale ; frottement 30 N. ① W(traction) ? ② W(frottement) ? ③ Bilan ?</div><div class=\"etu\"><b>Étape 1</b> — <b>W(traction)</b> : W = 50 × 10 × cos(30°) ≈ <b>+433 J</b> (moteur).</div><div class=\"etu\"><b>Étape 2</b> — <b>W(frottement)</b> : opposé au mouvement (α = 180°) : W = −30 × 10 = <b>−300 J</b> (résistant).</div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan</b> : ΣW = 433 − 300 = +133 J : cette énergie part en énergie cinétique (la valise accélère) ou en chaleur : le travail est la MONNAIE du transfert.</div></div></details>\n<h3>2. Travail du poids et théorème de l'énergie cinétique</h3>\n<div class=\"tip\"><b>Travail du poids :</b> W(P) = ± m·g·h : en DESCENTE : +mgh (il aide) ; en MONTÉE : −mgh (il freine). <b>Il ne dépend QUE de la dénivelée h</b> : le chemin (droite, courbe, zigzag) ne compte pas !<br><b>Théorème de l'énergie cinétique :</b> <b>ΣW = ΔEc = ½mv²(final) − ½mv²(initial)</b> : la somme des travaux égale la variation d'énergie cinétique.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la descente aux lacets</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un cycliste (total 80 kg) descend une piste : dénivelée 50 m, il part arrêté, frottements négligés. ① W(poids) ? ② Vitesse en bas ?</div><div class=\"etu\"><b>Étape 1</b> — <b>W(poids)</b> : +mgh = 80 × 9,81 × 50 ≈ <b>+39 240 J</b> (descente : moteur).</div><div class=\"etu\"><b>Étape 2</b> — <b>Théorème</b> : ΣW = ΔEc ⟹ 39 240 = ½ × 80 × v² ⟹ v² = 981 ⟹ v ≈ <b>31 m/s</b> (113 km/h : casse-cou !).</div><div class=\"etu\"><b>Étape 3</b> — <b>Avec frottements réels</b> : les freins « volent » une part du travail en chaleur : v plus faible : c'est exactement le rôle des freins : convertir Ec en thermique pour survivre aux virages.</div></div></details>\n<h3>3. Puissance : la vitesse du transfert</h3>\n<div class=\"tip\"><b>P = W/Δt</b> (watts) : la puissance mesure la RAPIDITÉ du transfert d'énergie. <b>P = F·v</b> (force × vitesse instantanée, colinéaires).<br><b>Ordres de grandeur :</b> humain en pointe : ~1000 W ; cheval-vapeur : 736 W ; voiture : ~100 kW ; locomotive : ~5 MW.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — monter les escaliers</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Étudiant de 60 kg montant 15 m de dénivelée en 60 s à vitesse constante. ① Travail à fournir contre le poids ? ② Puissance développée ?</div><div class=\"etu\"><b>Étape 1</b> — <b>W(poids)</b> : montée : W = −mgh = −60 × 9,81 × 15 ≈ <b>−8830 J</b> (le poids freine : il faut fournir +8830 J).</div><div class=\"etu\"><b>Étape 2</b> — <b>Puissance</b> : P = 8830/60 ≈ <b>147 W</b> : l'équivalent d'une ampoule : l'escalier à un rythme tranquille.</div><div class=\"etu\"><b>Étape 3</b> — <b>En courant (20 s)</b> : P = 8830/20 ≈ 440 W : triple effort : la puissance dépend du TEMPS pour un même travail : c'est toute la différence entre marche et sprint.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> une force perpendiculaire au déplacement ne travaille PAS (W = 0 : réaction normale) ; le travail du poids ne dépend PAS du chemin (seulement de h) ; W négatif = force résistante (elle retire de l'énergie) ; ΣW = ΔEc : si ΣW = 0, la vitesse ne change pas ; convertir les km/h en m/s avant ½mv².</div>"},
{"id": "transferts-thermiques", "theme": "Transferts thermiques et énergie interne (1re)", "niveau": "1re", "titre": "Transferts thermiques et énergie interne", "cours": "<div class=\"cours-head\"><h2>Transferts thermiques et énergie interne</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Température et énergie interne</h3>\n<div class=\"tip\"><b>Énergie interne U :</b> la somme des énergies microscopiques (agitation + liaisons) d'un système. <b>La température T mesure l'agitation moyenne</b> des particules : plus ça bouge, plus c'est chaud.<br><b>Transfert thermique Q :</b> l'énergie échangée à cause d'une DIFFÉRENCE de température : spontanément du CHAUD vers le FROID (jamais l'inverse sans machine).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le café qui refroidit</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un café à 80 °C dans une pièce à 20 °C : que se passe-t-il à l'échelle microscopique ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Agitations différentes</b> : les molécules du café s'agitent fort (80 °C) ; l'air et la tasse, moins.</div><div class=\"etu\"><b>Étape 2</b> — <b>Chocs déséquilibrés</b> : au contact, les particules rapides cèdent un peu d'énergie aux lentes : le café ralentit en moyenne (il refroidit), l'environnement s'active légèrement.</div><div class=\"etu\"><b>Étape 3</b> — <b>Sens naturel</b> : du chaud vers le froid jusqu'à l'équilibre (même T) : jamais l'inverse spontanément : le frigo, lui, est une MACHINE qui force le transfert, en payant de l'électricité.</div></div></details>\n<h3>2. Les trois modes de transfert</h3>\n<div class=\"tip\"><b>Conduction :</b> de proche en proche, SANS déplacement de matière (barre métallique chaude à un bout : l'autre bout chauffe). <b>Convection :</b> la matière se DÉPLACE (l'air chaud monte : radiateurs, météo, ébullition de l'eau). <b>Radiation (rayonnement) :</b> ondes électromagnétiques : marche dans le VIDE (le Soleil chauffe la Terre à 150 millions de km).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la maison bien isolée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Citer les trois modes dans une maison en hiver.</div><div class=\"etu\"><b>Étape 1</b> — <b>Conduction</b> : la chaleur traverse les murs, la vitre, l'isolant (le polystyrène conduit des centaines de fois moins que l'acier).</div><div class=\"etu\"><b>Étape 2</b> — <b>Convection</b> : l'air chauffé près du radiateur s'élève, se refroidit aux fenêtres, redescend : le grand cycle qui homogénéise (courants d'air sous les portes).</div><div class=\"etu\"><b>Étape 3</b> — <b>Radiation</b> : le Soleil par la baie vitrée chauffe le sol (effet de serre) ; le poêle rouge « rayonne » à distance : la lutte contre les pertes attaque les trois modes : isolant (conduction), joints (convection), volets/reflets (radiation).</div></div></details>\n<h3>3. Chaleur et capacité thermique</h3>\n<div class=\"tip\"><b>Q = m·c·ΔT</b> : énergie transférée = masse × capacité thermique massique c (J/(kg·°C)) × variation de température.<br><b>c de l'eau : 4185 J/(kg·°C)</b> : énorme : chauffer 1 L d'eau de 1 °C = 4185 J : c'est l'eau qui régule le climat et sert de fluide caloporteur (radiateurs, centrales).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la bouilloire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une bouilloire de 2000 W chauffe 1,5 L d'eau de 18 °C à 100 °C (c = 4185). ① Q ? ② Durée (rendement 100 %) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Q</b> : Q = 1,5 × 4185 × (100−18) = 1,5 × 4185 × 82 ≈ <b>515 000 J</b> (515 kJ).</div><div class=\"etu\"><b>Étape 2</b> — <b>Durée</b> : t = Q/P = 515 000/2000 ≈ <b>258 s ≈ 4,3 min</b> : cohérent avec l'expérience.</div><div class=\"etu\"><b>Étape 3</b> — <b>Ordre de grandeur</b> : chauffer l'eau COÛTE (d'où les douches = poste majeur de la facture) : l'eau est précieuse énergétiquement : sa grande capacité est un trésor et une lourdeur.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la chaleur va TOUJOURS du chaud vers le froid (le froid « ne rentre pas » : c'est le chaud qui sort) ; le transfert thermique n'est PAS un déplacement de matière en conduction ; température ≠ chaleur : T est un état, Q un transfert ; chauffer ne change pas toujours T (changement d'état : la glace à 0 °C fond en restant à 0 °C : l'énergie casse les liaisons, Q = m·L(fusion)).</div>"},
{"id": "poids-gravitation", "theme": "Poids et gravitation (3e)", "niveau": "3e", "titre": "Poids et gravitation", "cours": "<div class=\"cours-head\"><h2>Poids et gravitation</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La gravitation, une interaction à distance</h3>\n<p>La <b>gravitation</b> est une interaction attractive entre tous les corps qui possèdent une masse : deux objets s'attirent mutuellement, à n'importe quelle distance. C'est elle qui fait tomber les objets, qui maintient la Lune autour de la Terre et les planètes autour du Soleil.</p>\n<div class=\"tip\"><b>Ce qu'il faut retenir :</b> l'attraction gravitationnelle dépend des <b>masses</b> (plus les masses sont grandes, plus l'attraction est forte) et de la <b>distance</b> (plus on est loin, plus elle est faible).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi la Lune ne tombe-t-elle pas sur la Terre ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer pourquoi la Lune tourne autour de la Terre au lieu de s'y écraser.</div><div class=\"etu\"><b>Étape 1</b> — <b>La force existe</b> : la Terre attire la Lune (interaction gravitationnelle), dirigée du centre de la Lune vers le centre de la Terre.</div><div class=\"etu\"><b>Étape 2</b> — <b>La Lune avance</b> : en même temps, la Lune possède une vitesse qui la ferait partir « tout droit » s'il n'y avait pas de force.</div><div class=\"etu\"><b>Étape 3</b> — <b>Composer les deux</b> : à chaque instant, la gravitation « courbe » la trajectoire : la Lune « rate » la Terre en permanence : elle tombe SUR elle sans jamais l'atteindre : c'est une <b>orbite</b>. C'est le principe des satellites artificiels aussi.</div></div></details>\n<h3>2. Le poids P : la force de gravitation près du sol</h3>\n<div class=\"tip\"><b>Définition :</b> le poids P d'un objet est la force de gravitation exercée par la Terre (ou un astre) sur cet objet. <br>• Direction : la <b>verticale</b> (vers le centre de la Terre)<br>• Sens : vers le bas<br>• Point d'application : le <b>centre de gravité</b> G de l'objet<br>• Valeur : <b>P = m × g</b>, en newtons (N) si m est en kg et g en N/kg</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer un poids</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un sac de sport a une masse m = 4 kg. Calculer son poids sur Terre (g = 9,8 N/kg), puis sur la Lune (g ≈ 1,6 N/kg).</div><div class=\"etu\"><b>Étape 1</b> — <b>Repérer les données</b> : m = 4 kg ; g(Terre) = 9,8 N/kg.</div><div class=\"etu\"><b>Étape 2</b> — <b>Appliquer la formule</b> : P = m × g = 4 × 9,8 = <b>39,2 N</b> sur Terre.</div><div class=\"etu\"><b>Étape 3</b> — <b>Sur la Lune</b> : P = 4 × 1,6 = <b>6,4 N</b>. La masse n'a PAS changé (c'est la même quantité de matière), c'est g qui a changé : l'objet pèse « 6 fois moins » mais contient toujours 4 kg.</div><div class=\"etu\"><b>Étape 4</b> — <b>Vérifier l'unité</b> : kg × N/kg = N ✓. Le poids s'exprime en newtons, JAMAIS en kg.</div></div></details>\n<h3>3. Masse et poids : ne pas confondre !</h3>\n<table><tr><th></th><th>Masse m</th><th>Poids P</th></tr>\n<tr><td><b>Nature</b></td><td>quantité de matière</td><td>force de gravitation</td></tr>\n<tr><td><b>Unité</b></td><td>kilogramme (kg)</td><td>newton (N)</td></tr>\n<tr><td><b>Instrument</b></td><td>balance</td><td>dynamomètre</td></tr>\n<tr><td><b>Dépend du lieu ?</b></td><td>NON (constante)</td><td>OUI (dépend de g)</td></tr></table>\n<div class=\"tip\"><b>g, l'intensité de la pesanteur :</b> g ≈ 9,8 N/kg sur Terre ; ≈ 1,6 N/kg sur la Lune ; ≈ 3,7 N/kg sur Mars. Sur un astre donné, g est quasiment constant : P est donc <b>proportionnel à m</b> : si la masse double, le poids double.</div>\n<h3>4. Représenter et utiliser le poids</h3>\n<div class=\"ex\"><b>Exemple — schématiser :</b> pour un objet de 2 kg posé sur une table, on dessine un segment fléché (vecteur) partant de son centre de gravité G, vertical, vers le bas, de longueur proportionnelle à P = 2 × 9,8 = 19,6 N (échelle : 1 cm ↔ 10 N ⟹ longueur ≈ 2 cm).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — retrouver une masse à partir du poids</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un dynamomètre indique P = 49 N sur Terre (g = 9,8 N/kg). Quelle est la masse de l'objet ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Formule de départ</b> : P = m × g, donc m = P / g.</div><div class=\"etu\"><b>Étape 2</b> — <b>Remplacer</b> : m = 49 / 9,8 = <b>5 kg</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Vérifier</b> : 5 × 9,8 = 49 N ✓. La masse en kg, le poids en N : l'inversion de la formule est le calcul le plus fréquent en exercice.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b><ul>\n<li>Ne pas confondre masse (kg, balance, constante) et poids (N, dynamomètre, dépend du lieu) : c'est LE piège du chapitre.</li>\n<li>Le poids se mesure en newtons : « un poids de 5 kg » est une erreur de langage courant.</li>\n<li>Sur la Lune, la masse ne change pas, seul le poids diminue.</li>\n<li>La direction du poids est la verticale du lieu (vers le centre de la Terre), pas « vers le sol » si l'objet est au-dessus de la tête.</li>\n<li>En énoncé, toujours convertir la masse en kg avant d'appliquer P = m×g (500 g = 0,5 kg).</li></ul></div>"}];

{"id": "eau-melanges", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Corps pur :</b> une seule espèce chimique ; <b>mélange :</b> plusieurs.</p>\n<p><b>Eau pure :</b> bout à 100 °C et gèle à 0 °C (température CONSTANTE).</p>\n<p><b>Homogène</b> = une seule phase visible ; <b>hétérogène</b> = plusieurs phases.</p>\n<h3>🧭 Séparations</h3>\n<ul>\n<li><b>Décantation :</b> 2 liquides non miscibles (le plus dense en dessous) ou solide qui se dépose.</li>\n<li><b>Filtration :</b> solide NON dissous (résidu sur filtre, filtrat au-dessous).</li>\n<li><b>Distillation :</b> liquides miscibles : on vaporise le plus volatil puis on le condense (distillat).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Homogène ≠ pur (l'air est homogène mais mélangé).</li>\n<li>Le sel dissous ne se filtre pas : il faut distiller ou évaporer.</li>\n<li>Après dissolution, la masse se CONSERVE : sel + eau = masse totale.</li>\n</ul>"},
{"id": "etats-matiere", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>3 états :</b> solide (ordonné, serré), liquide (désordonné, serré), gaz (dispersé, éloigné).</p>\n<p><b>6 changements :</b> fusion, solidification, vaporisation, liquéfaction, sublimation, condensation solide.</p>\n<p><b>Masse : conservée ; volume : PAS conservé.</b> Exception eau : la glace est moins dense que l'eau liquide.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Identifier un état</b> sur un schéma : espacement (serré ?) puis occupation (tout le cadre ?).</li>\n<li><b>Nommer un changement</b> : état initial → état final, puis vocabulaire exact.</li>\n<li><b>Ébullition</b> = vaporisation rapide avec bulles (100 °C pour l'eau pure) ; <b>évaporation</b> = lente, à toute température.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>La « vapeur blanche » visible = gouttelettes LIQUIDES, pas de la vapeur (invisible).</li>\n<li>Givre/neige : gaz → solide (condensation solide), pas fusion.</li>\n<li>La fonte d'un glaçon flottant ne fait pas monter le niveau de l'eau.</li>\n</ul>"},
{"id": "circuit-serie", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Circuit fermé</b> = boucle complète : le courant circule ; <b>ouvert</b> = arrêt total.</p>\n<p><b>Sens conventionnel :</b> de la borne + vers la borne − à l'extérieur du générateur.</p>\n<p><b>Série :</b> une seule boucle, dipôles à la chaîne : <b>unicité de l'intensité</b> (I identique partout).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma normalisé :</b> symboles, fils rectilignes, jamais de croisements inutiles.</li>\n<li><b>Panne ?</b> tester : connexions (boucle), lampe (remplacer), pile (neuve, bornes).</li>\n<li><b>Mesurer I :</b> ampèremètre EN SÉRIE dans la boucle.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Le courant n'est pas consommé : il revient au générateur identique.</li>\n<li>En série, une lampe dévissée éteint TOUT le circuit.</li>\n<li>Ampèremètre en série, voltmètre en dérivation (jamais l'inverse).</li>\n</ul>"},
{"id": "lumiere-ombres", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Source primaire</b> = produit sa lumière (Soleil, lampe) ; <b>objet diffusant</b> = renvoie la lumière reçue (Lune, murs).</p>\n<p><b>Propagation rectiligne</b> dans un milieu transparent et homogène ; vitesse ≈ 300 000 km/s.</p>\n<p><b>Ombre propre</b> (sur l'objet) ; <b>ombre portée</b> (sur l'écran) ; <b>cône d'ombre</b> (volume) ; <b>pénombre</b> (source étendue).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Rayons :</b> segments fléchés source → objet → œil (toujours orientés).</li>\n<li><b>Tracer une ombre :</b> 2 rayons tangents à l'objet, prolongés jusqu'à l'écran.</li>\n<li><b>Voir un objet :</b> lumière source → objet (diffusion) → œil : la chaîne complète.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>La Lune éclaire = diffusant, PAS source.</li>\n<li>La lumière ne contourne pas les obstacles : ligne droite.</li>\n<li>Source ponctuelle = ombre nette ; source étendue = ombre + pénombre.</li>\n</ul>"},
{"id": "son-propagation", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Son = vibration</b> d'une source, transmise de proche en proche par un milieu matériel.</p>\n<p><b>Pas de son dans le vide</b> ; la lumière, elle, traverse le vide.</p>\n<p><b>Vitesse :</b> air ≈ 340 m/s ; eau ≈ 1500 m/s ; acier ≈ 5200 m/s.</p>\n<p><b>Grave/aigu = fréquence</b> (lent/rapide) ; <b>fort/doux = amplitude</b>.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Orage :</b> d = v × t ; distance (km) ≈ secondes ÷ 3.</li>\n<li><b>Écho/sonar :</b> d = (v × t) ÷ 2 (aller-retour).</li>\n<li><b>Prouver la vibration :</b> grains de sable sur une membrane qui émet.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Explosions « dans l'espace » : cinéma : silence réel.</li>\n<li>Le son va PLUS VITE dans l'eau et l'acier que dans l'air.</li>\n<li>Voir avant d'entendre : éclair puis tonnerre, pas l'inverse.</li>\n</ul>"},
{"id": "air-pression", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Air = mélange :</b> ~78 % diazote, ~21 % dioxygène, ~1 % autres.</p>\n<p><b>Masse de l'air ≈ 1,3 g/L</b> : l'air est pesable.</p>\n<p><b>Pression = chocs des particules</b> sur les parois ; unité : hPa ; atmosphère ≈ 1013 hPa.</p>\n<p><b>À quantité d'air fixe :</b> volume ↓ ⟹ pression ↑ (compression), et inversement.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Masse d'un volume d'air :</b> m = 1,3 × V (V en litres).</li>\n<li><b>Ballon dégonflé/gonflé :</b> la différence de masse = masse d'air injecté.</li>\n<li><b>Ébullition</b> : pression plus basse (altitude) → bout plus tôt (moins chaud) ; pression plus haute (cocotte) → bout plus tard (plus chaud).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Le dioxygène n'est pas majoritaire : c'est le DIAZOTE.</li>\n<li>La pression appuie dans toutes les directions, pas seulement vers le bas.</li>\n<li>Comprimer n'ajoute pas de particules : ça les rapproche.</li>\n</ul>"},
{"id": "atomes-molecules", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Atome :</b> brique de la matière ; ~90 éléments naturels (C, H, O, N, Fe…).</p>\n<p><b>Molécule :</b> assemblage d'atomes ; formule : H₂O, O₂, N₂, CO₂, CH₄, C₆H₁₂O₆.</p>\n<p><b>Indice = nombre d'atomes de l'élément juste avant lui</b> (H₂O = 2 H + 1 O).</p>\n<p><b>Changement d'état = même molécule</b> : glace, eau, vapeur = toujours H₂O.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Décomposer une formule :</b> lire de gauche à droite, compter chaque élément avec son indice, additionner pour le total d'atomes.</li>\n<li><b>Distinguer atome/molécule :</b> O₂ = molécule (2 atomes) ; O = atome seul.</li>\n<li><b>Modèle particulaire :</b> dessiner des sphères liées (molécules) et les disposer selon l'état.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>L'indice ne « déborde » pas sur l'élément suivant.</li>\n<li>Une molécule d'eau = 3 atomes, pas 2.</li>\n<li>L'air est fait de MOLÉCULES (N₂, O₂), pas d'atomes isolés.</li>\n</ul>"},
{"id": "circuits-derivation", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Série :</b> une boucle : I identique partout (unicité).</p>\n<p><b>Dérivation :</b> nœuds + branches ; <b>loi des nœuds : I = I₁ + I₂</b> ; même tension pour toutes les branches.</p>\n<p><b>Diagnostic :</b> une panne éteint tout ⟹ série ; le reste continue ⟹ dérivation.</p>\n<p><b>Danger :</b> court-circuit = intensité très grande = échauffement (fusible/disjoncteur = protection).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Loi des nœuds :</b> I(qui arrive) = I(qui repart) : I₂ = I − I₁.</li>\n<li><b>Compter les boucles :</b> 1 seule = série ; 2 ou plus = dérivation.</li>\n<li><b>Choisir le branchement des appareils de mesure :</b> ampèremètre en série, voltmètre aux bornes (dérivation).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>En dérivation, les I des branches sont différents : c'est la loi des nœuds qui les relie.</li>\n<li>La maison est en dérivation : jamais en série.</li>\n<li>Court-circuiter une pile : interdit (chauffe, danger).</li>\n</ul>"},
{"id": "vitesse-mouvement", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Mouvement relatif au référentiel</b> (sol, rails…). <b>Trajectoire :</b> rectiligne ou curviligne (circulaire).</p>\n<p><b>v = d / t</b> (m, s ⟹ m/s) ; <b>1 m/s = 3,6 km/h</b>.</p>\n<p><b>Uniforme</b> = vitesse constante ; <b>accéléré</b> = elle augmente ; <b>ralenti</b> = elle diminue.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculs :</b> v = d/t ; d = v×t ; t = d/v : convertir en m et s d'abord.</li>\n<li><b>km/h → m/s :</b> ÷ 3,6 ; <b>m/s → km/h :</b> × 3,6.</li>\n<li><b>Lire des positions</b> : écarts réguliers = uniforme ; croissants = accéléré ; décroissants = ralenti.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« Immobile » sans référentiel = phrase vide.</li>\n<li>90 km/h = 25 m/s (et non 90 m/s).</li>\n<li>Rectiligne/uniforme : deux propriétés indépendantes, toujours les deux à préciser.</li>\n</ul>"},
{"id": "energie-electrique", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Puissance (W)</b> = énergie convertie PAR SECONDE ; 1 kW = 1000 W.</p>\n<p><b>Énergie : E = P × t</b> (Wh si P en W et t en heures).</p>\n<p><b>1 kWh</b> = 1000 W pendant 1 h : c'est l'unité du compteur et de la facture.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Énergie d'un appareil :</b> E = P × t : t en heures ⟹ Wh ; ÷1000 ⟹ kWh.</li>\n<li><b>Coût :</b> kWh × prix du kWh.</li>\n<li><b>Comparer des appareils :</b> regarder puissance ET durée d'usage.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>W = puissance ; Wh (kWh) = énergie : ne jamais confondre les unités.</li>\n<li>30 min = 0,5 h dans les calculs (pas 30).</li>\n<li>La bouilloire est puissante mais brève ; le frigo est faible mais permanent.</li>\n</ul>"},
{"id": "signaux", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Son :</b> 340 m/s (air), besoin de matière. <b>Lumière :</b> 300 000 km/s, traverse le vide.</p>\n<p><b>Éclair avant tonnerre</b> : d = v×t ; distance (km) ≈ secondes ÷ 3.</p>\n<p><b>Fréquence (Hz) :</b> petite = grave ; grande = aigu ; oreille : 20 Hz – 20 000 Hz.</p>\n<p><b>Écho/sonar :</b> d = (v × t) ÷ 2.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Distance d'un orage :</b> t(éclair→tonnerre) × 340 m/s.</li>\n<li><b>Sonar :</b> diviser le temps total par 2 AVANT d'appliquer d = v×t.</li>\n<li><b>Comparer deux sons :</b> comparer les fréquences (hauteur) et amplitudes (intensité) séparément.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Vide = silence : le son exige un milieu.</li>\n<li>2,4 s d'écho = 1,2 s d'aller : division par 2 obligatoire.</li>\n<li>« Ultrasons » = inaudibles pour nous, réels et utiles (imagerie).</li>\n</ul>"},
{"id": "atomes-ions", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Atome :</b> noyau (Z protons) + Z électrons ; neutrons = A − Z ; neutre.</p>\n<p><b>Ion :</b> perte d'électrons ⟹ cation (+) ; gain ⟹ anion (−) ; noyau inchangé.</p>\n<p><b>À connaître :</b> H⁺, Na⁺, Cu²⁺, Fe²⁺/Fe³⁺ ; Cl⁻, O²⁻, OH⁻, NO₃⁻, SO₄²⁻, CO₃²⁻.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Compter les charges :</b> charge = protons − électrons.</li>\n<li><b>Tests d'ions :</b> soude ⟹ précipité vert (Fe²⁺), bleu (Cu²⁺), rouille (Fe³⁺) ; nitrate d'argent ⟹ précipité blanc (Cl⁻).</li>\n<li><b>Lire une formule ionique :</b> SO₄²⁻ = 1 S + 4 O, charge globale −2.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Z (protons) ne change jamais quand l'atome devient ion.</li>\n<li>OH⁻, NO₃⁻, SO₄²⁻ : ions POLYatomiques (plusieurs atomes).</li>\n<li>Les solutions ioniques conduisent le courant ; l'eau pure, non.</li>\n</ul>"},
{"id": "transformations-chimiques", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Réaction chimique :</b> réactifs ⟶ produits ; NOUVELLES substances (couleur, gaz, précipité, chaleur).</p>\n<p><b>Conservation :</b> même nombre d'atomes de chaque élément de part et d'autre (et même masse).</p>\n<p><b>Équilibrage :</b> coefficients devant les formules ; ordre conseillé : C, H, O.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Équilibrer :</b> compter C, puis H, puis O ; ajuster avec des coefficients entiers.</li>\n<li><b>Test physique/chimique :</b> nouvelles molécules ? ⟹ chimique ; mêmes molécules ? ⟹ physique.</li>\n<li><b>Bilan de masse :</b> m(produits) = m(réactifs), en incluant les gaz échangés.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>On ne touche JAMAIS aux indices (H₂O devient H₂O₂ = eau oxygénée !).</li>\n<li>Un gaz qui s'échappe fait « maigrir » la balance : fermer le flacon.</li>\n<li>Combustion incomplète ⟹ CO toxique (chaudière mal réglée).</li>\n</ul>"},
{"id": "lois-circuits", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>U (voltmètre, dérivation)</b> ; <b>I (ampèremètre, série)</b>.</p>\n<p><b>Série :</b> U(générateur) = U₁ + U₂ ; I unique. <b>Dérivation :</b> I = I₁ + I₂ ; U identique.</p>\n<p><b>Loi d'Ohm :</b> U = R × I (conducteur ohmique) ; P = U × I.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Trois formules :</b> U = R×I ; I = U/R ; R = U/I : vérifier les unités (V, Ω, A).</li>\n<li><b>Additionner</b> tensions (série) ou intensités (nœuds) selon le montage.</li>\n<li><b>Effet Joule :</b> P = U×I dissipée en chaleur : dimensionner fusibles et calibres.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>U = R×I : uniquement pour une résistance ohmique.</li>\n<li>Ne jamais brancher un ampèremètre aux bornes de la pile (court-circuit).</li>\n<li>Sécurité : ~30 mA dans le corps = danger : pas de bricolage secteur.</li>\n</ul>"},
{"id": "energie-cinetique", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Ec = ½ × m × v²</b> (kg, m/s ⟹ joules) : la vitesse compte AU CARRÉ.</p>\n<p><b>Distance d'arrêt = distance de réaction + distance de freinage.</b></p>\n<p><b>Conversion :</b> km/h ÷ 3,6 = m/s.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calcul d'Ec :</b> convertir v en m/s, puis ½mv².</li>\n<li><b>Réaction :</b> d = v × t (≈ 1 s) ; <b>freinage :</b> croît comme v².</li>\n<li><b>Comparer deux vitesses :</b> rapport des carrés (50→100 km/h = ×4).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>km/h dans la formule = résultat faux (facteur 13 !).</li>\n<li>×2 vitesse = ×4 Ec : jamais ×2.</li>\n<li>Réaction (conducteur) ≠ freinage (voiture/route).</li>\n</ul>"},
{"id": "matiere-echelles", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Échelles :</b> noyau 10⁻¹⁵ m ⟵ atome 10⁻¹⁰ ⟵ molécule 10⁻⁹ ⟵ humain 10⁰ ⟵ Terre 10⁷ ⟵ Univers 10²⁶ m.</p>\n<p><b>Atome :</b> noyau massif minuscule + nuage d'électrons : surtout du vide.</p>\n<p><b>Isotopes :</b> même Z, A différent.</p>\n<p><b>Spectres :</b> chaque élément = signature lumineuse unique.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Notation scientifique :</b> a × 10ⁿ, 1 ≤ a < 10 ; additions d'exposants en multiplication.</li>\n<li><b>Convertir :</b> nano 10⁻⁹, micro 10⁻⁶, méga 10⁶, giga 10⁹.</li>\n<li><b>Lire un spectre :</b> comparer les raies aux signatures connues des éléments.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>L'atome est vide à 99,999… % : le noyau est 100 000 fois plus petit que l'atome.</li>\n<li>Isotope ≠ ion (neutrons ≠ électrons).</li>\n<li>0,1 nm = 10⁻¹⁰ m (pas 10⁻⁹).</li>\n</ul>"},
{"id": "mole-concentration", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>1 mol = 6,02 × 10²³ entités</b> (N_A) ; <b>n = m/M</b> (m en g, M en g/mol).</p>\n<p><b>Concentrations :</b> C = n/V (mol/L) ; C_m = m/V (g/L) ; C = C_m/M.</p>\n<p><b>Dilution :</b> C₀V₀ = CV ; facteur f = C₀/C = V/V₀.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Masse molaire d'une molécule :</b> additionner les M de chaque atome × son indice.</li>\n<li><b>Triangle n-m-M :</b> n = m/M ; m = n×M ; M = m/n.</li>\n<li><b>Dilution :</b> calculer V₀ = CV/C₀, prélever à la pipette, compléter à la fiole jaugée.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Préciser l'entité comptée : mole d'atomes ≠ mole de molécules.</li>\n<li>V = volume final de la SOLUTION (pas l'eau versée).</li>\n<li>Le soluté ne change pas à la dilution : seule l'eau.</li>\n</ul>"},
{"id": "forces-inertie", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Force :</b> vecteur (point, direction, sens, valeur en N) ; actions de contact ou à distance.</p>\n<p><b>Poids : P = m × g</b> (N ; g ≈ 9,81 N/kg) ; la masse ne dépend pas du lieu, le poids si.</p>\n<p><b>Principe d'inertie :</b> forces compensées ⟹ immobile OU mouvement rectiligne uniforme (et réciproquement).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Bilan des forces :</b> lister, dessiner les vecteurs, vérifier si la somme est nulle.</li>\n<li><b>Poids :</b> P = mg ; échelle : longueur = P/échelle.</li>\n<li><b>Diagnostiquer un mouvement :</b> il change ⟹ forces non compensées.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« Se compenser » = somme NULLE, pas « être petites ».</li>\n<li>Sur la Lune : masse identique, poids ÷6.</li>\n<li>Le frottement est une force : il dévie l'inertie, il ne « fuit » pas.</li>\n</ul>"},
{"id": "ondes-signaux", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Onde :</b> propagation d'une perturbation, SANS transport de matière.</p>\n<p><b>Mécanique (son : 340 m/s) vs électromagnétique (lumière : 3×10⁸ m/s, traverse le vide).</p>\n<p><b>f = 1/T ; λ = v × T = v/f ; retard τ = d/v.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>λ :</b> toujours avec la vitesse DANS le milieu : λ = v/f.</li>\n<li><b>Retard :</b> τ = d/v ; écho : diviser par 2.</li>\n<li><b>Convertir</b> les préfixes : MHz = 10⁶ Hz, ms = 10⁻³ s.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Vide : pas de son, mais la lumière passe.</li>\n<li>λ en mètres : vérifier v (m/s) et f (Hz).</li>\n<li>Onde ≠ courant de matière : la ola, pas la foule qui marche.</li>\n</ul>"},
{"id": "conversions-energie", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Formes :</b> cinétique, potentielle, chimique, électrique, lumineuse, thermique, nucléaire.</p>\n<p><b>Chaîne :</b> SOURCE (stocke) → CONVERTISSEUR (transforme) → utile + pertes (chaleur).</p>\n<p><b>Rendement :</b> r = E(utile)/E(consommée) ≤ 1.</p>\n<p><b>P = E/Δt ; E = P×t ; 1 kWh = 3,6 MJ.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Chaîne énergétique :</b> identifier la source, le convertisseur, l'utile, les pertes.</li>\n<li><b>Rendement :</b> r = utile/consommée : ×100 pour le %.</li>\n<li><b>Ordres de grandeur :</b> moteur ~30 %, LED ~40 %, ampoule à filament ~5 %.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Les « pertes » = chaleur, pas de l'énergie détruite.</li>\n<li>Puissance (W) ≠ énergie (J ou kWh).</li>\n<li>Renouvelable = flux (soleil, vent) ; fossiles = stock.</li>\n</ul>"},
{"id": "solutions-1re", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Par dissolution :</b> m = C × M × V (peser le soluté).</p>\n<p><b>Par dilution :</b> C₀V₀ = CV ; facteur F = C₀/C = V/V₀.</p>\n<p><b>Ions :</b> [ion] = coefficient × C (CaCl₂ ⟹ [Cl⁻] = 2C).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Dissolution :</b> n = CV, puis m = nM : protocole fiole jaugée.</li>\n<li><b>Dilution :</b> V₀ = CV/C₀ : pipette jaugée + fiole.</li>\n<li><b>Spectrophotométrie :</b> A proportionnelle à C : courbe d'étalonnage.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Compléter au trait AVANT d'homogénéiser (jamais l'inverse).</li>\n<li>Éprouvette ≠ précision : pipette jaugée obligatoire.</li>\n<li>Les coefficients de dissolution multiplient les concentrations ioniques.</li>\n</ul>"},
{"id": "bilan-matiere", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Tableau d'avancement :</b> n = n₀ ± coef × x ; xF arrêté par le réactif limitant.</p>\n<p><b>Limitant :</b> plus petit rapport n₀/coefficient.</p>\n<p><b>Rendement :</b> r = n(obtenue)/n(théorique).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Rapports rapides :</b> n₀/coef pour chaque réactif : le min donne xF.</li>\n<li><b>Tableau complet :</b> initial, intermédiaire, final (aucune valeur négative).</li>\n<li><b>Stoechiométrie :</b> rapports égaux ⟹ tout consommé.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Ne pas confondre n₀ petit et réactif limitant (les coefficients décident).</li>\n<li>Les produits se comptent en +coef×x.</li>\n<li>Vérifier la cohérence : excès > 0, limitant = 0.</li>\n</ul>"},
{"id": "mouvement-forces", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>2e loi de Newton : ΣF = m·a</b> (résultante des forces = masse × accélération).</p>\n<p><b>Chute libre :</b> a = g ; v = g·t ; h = ½g·t² : indépendante de la masse.</p>\n<p><b>Projectile :</b> parabole : horizontal uniforme + vertical en chute.</p>\n<p><b>Gravitation :</b> F = G·m·m'/d² : attraction mutuelle (3e loi).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Bilan des forces</b> ⟹ ΣF ⟹ a = ΣF/m ⟹ nature du mouvement.</li>\n<li><b>Chute :</b> t = √(2h/g) ; v = g·t ; v = √(2gh).</li>\n<li><b>Projectile :</b> traiter x et y séparément (indépendance).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>La masse ne change pas la chute libre (plume = marteau dans le vide).</li>\n<li>Freinage : a opposé au mouvement, mais ΣF dans le sens de a.</li>\n<li>g ≈ 9,81 m/s² = 9,81 N/kg : la même constante, deux habits.</li>\n</ul>"},
{"id": "travail-energie", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>W = F·d·cos(α)</b> (J) : moteur (α<90°), nul (90°), résistant (α>90°).</p>\n<p><b>Poids :</b> W = ±mgh : dépend de la dénivelée, pas du chemin.</p>\n<p><b>Théorème de l'Ec :</b> ΣW = ΔEc = ½mv₂² − ½mv₁².</p>\n<p><b>P = W/Δt = F·v</b> (watts).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Travail :</b> identifier force, déplacement, angle : cos(90°) = 0.</li>\n<li><b>Théorème :</b> lister les travaux, sommer, égaler à ΔEc : isoler l'inconnue.</li>\n<li><b>Puissance :</b> diviser par la durée ; ou force × vitesse.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Chemin horizontal ⟹ W(poids) = 0.</li>\n<li>W négatif = freinage : ne pas « effacer » le signe.</li>\n<li>v en m/s dans ½mv² (encore la conversion ÷3,6).</li>\n</ul>"},
{"id": "transferts-thermiques", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>U (interne)</b> : agitation microscopique ; T la mesure ; Q le transfert (chaud → froid).</p>\n<p><b>3 modes :</b> conduction (paroi), convection (matière mobile), rayonnement (vide OK).</p>\n<p><b>Q = m·c·ΔT</b> ; c(eau) = 4185 J/(kg·°C).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Q :</b> m (kg), ΔT (°C) : attention aux litres d'eau (1 L = 1 kg).</li>\n<li><b>Durée de chauffe :</b> t = Q/P.</li>\n<li><b>Identifier le mode</b> : contact immobile ⟹ conduction ; mouvement de fluide ⟹ convection ; distance/vide ⟹ rayonnement.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« Le froid entre » : faux : le chaud sort.</li>\n<li>Changement d'état : Q = m·L sans variation de T.</li>\n<li>T (état, °C) ≠ Q (transfert, J).</li>\n</ul>"},
{"id": "poids-gravitation", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Gravitation :</b> interaction attractive entre deux corps massifs, à distance ; elle diminue quand la distance augmente et augmente avec les masses.</p>\n<p><b>Poids :</b> P = m × g (P en N, m en kg, g en N/kg).</p>\n<p><b>Caractéristiques du poids :</b> vertical, vers le bas, appliqué au centre de gravité G.</p>\n<p><b>g :</b> Terre ≈ 9,8 N/kg ; Lune ≈ 1,6 ; Mars ≈ 3,7 : g dépend de l'astre.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Poids ⟶ masse :</b> m = P/g ; <b>masse ⟶ poids :</b> P = m×g.</li>\n<li><b>Convertir la masse en kg</b> avant tout calcul (g → kg : diviser par 1000).</li>\n<li><b>Schéma :</b> vecteur vertical vers le bas depuis G, longueur proportionnelle à P (échelle donnée).</li>\n<li><b>Proportionnalité :</b> à g constant, P et m sont proportionnels (droite passant par l'origine).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Masse (kg, balance, constante) ≠ poids (N, dynamomètre, varie avec g).</li>\n<li>Le poids ne se mesure « jamais » en kg dans une copie correcte.</li>\n<li>Sur la Lune : masse inchangée, poids divisé (g plus petit).</li>\n<li>Le poids est une FORCE : il se représente par un vecteur, pas par un nombre seul.</li>\n</ul>"}];
var QUESTIONS = [
{"t": "Poids et gravitation (3e)", "q": "Le poids d'un objet est…", "c": ["sa masse exprimée en kg", "une quantité de matière", "identique partout dans l'univers", "la force de gravitation exercée par la Terre sur lui"], "a": 3, "e": "Le poids est une force : la gravitation que la Terre exerce sur l'objet.", "d": "<b>Le poids est la force de gravitation</b> exercée par un astre sur l'objet : une force, mesurée en <b>newtons</b>, qui dépend du lieu.<div class='ex-detail'><u>Exemple rédigé</u> : un objet de 4 kg pèse P = 4×9,8 = 39,2 N sur Terre mais seulement 6,4 N sur la Lune : le poids change avec g, alors que la masse reste 4 kg partout. Piège : « identique partout » est FAUX, et « la masse en kg » confond les deux grandeurs du chapitre.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Un objet de masse m = 5 kg. Son poids sur Terre (g = 9,8 N/kg) vaut :", "c": ["5 N", "49 N", "0,49 N", "9,8 N"], "a": 1, "e": "P = m × g = 5 × 9,8 = 49 N.", "d": "<b>P = m × g = 5 × 9,8 = 49 N</b> : la formule centrale du chapitre.<div class='ex-detail'><u>Exemple rédigé</u> : unités : kg × (N/kg) = N ✓. Vérification par proportionnalité : 1 kg pèse 9,8 N, donc 5 kg pèsent 5 × 9,8 = 49 N. Piège : « 5 N » revient à confondre masse et poids ; le poids a presque toujours une valeur ~10 fois plus grande que la masse en kg.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Un dynamomètre indique 19,6 N sur Terre (g = 9,8 N/kg). La masse de l'objet est :", "c": ["2 kg", "192 N", "19,6 kg", "0,5 kg"], "a": 0, "e": "m = P/g = 19,6/9,8 = 2 kg.", "d": "<b>m = P / g = 19,6 / 9,8 = 2 kg</b> : on inverse la formule P = m×g.<div class='ex-detail'><u>Exemple rédigé</u> : méthode : P = m×g ⟹ m = P/g (on isole m en divisant). Contrôle : 2 × 9,8 = 19,6 N ✓. Piège : « 192 N » mélange unités (une masse ne se mesure pas en N) ; « 0,5 kg » viendrait d'une division par 4 sans raison.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Sur la Lune (g ≈ 1,6 N/kg), un objet de 10 kg pèse environ :", "c": ["98 N", "6 N", "10 N", "16 N"], "a": 3, "e": "P = 10 × 1,6 = 16 N.", "d": "<b>P = m × g = 10 × 1,6 = 16 N</b> : le poids dépend de l'astre.<div class='ex-detail'><u>Exemple rédigé</u> : sur Terre, le même objet pèserait 98 N : sur la Lune, il pèse 6 fois moins. La masse, elle, reste 10 kg dans les deux cas (même quantité de matière). Piège : « 98 N » applique le g terrestre à la Lune : toujours lire quel astre sert de cadre à l'exercice.</div>"},
{"t": "Poids et gravitation (3e)", "q": "La gravitation entre deux corps est plus forte quand…", "c": ["la distance augmente", "il fait nuit", "les masses augmentent", "les masses diminuent"], "a": 2, "e": "Attraction renforcée par de grandes masses et de courtes distances.", "d": "<b>Masses grandes + distance courte = attraction forte.</b><div class='ex-detail'><u>Exemple rédigé</u> : le Soleil (masse énorme) attire fortement les planètes malgré la distance ; deux personnes s'attirent aussi, mais avec une force infime (masses faibles). C'est pourquoi la Lune orbite autour de la Terre et pas autour d'un satellite artificiel : ordres de grandeur des masses. Piège : « la distance augmente » : c'est l'inverse, l'attraction diminue avec la distance.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Quelles sont les caractéristiques du vecteur poids ?", "c": ["vertical, vers le haut, appliqué à G", "oblique, vers le haut, appliqué à la base", "horizontal, vers la droite, appliqué au sol", "vertical, vers le bas, appliqué au centre de gravité G"], "a": 3, "e": "Poids : direction verticale, sens vers le bas, point d'application G.", "d": "<b>Vertical, vers le bas, appliqué au centre de gravité G</b>, de longueur proportionnelle à P.<div class='ex-detail'><u>Exemple rédigé</u> : pour schématiser le poids d'un objet de 20 N avec l'échelle 1 cm ↔ 10 N : tracer depuis G un segment vertical vers le bas de 2 cm, terminé par une flèche. Piège : « vers le haut » confond poids (vers le bas) et réaction du support (vers le haut) : deux forces différentes qui se compensent sur une table.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Quel instrument mesure le poids ?", "c": ["Un chronomètre", "Une balance", "Un thermomètre", "Un dynamomètre"], "a": 3, "e": "Le dynamomètre mesure des forces (N) ; la balance mesure la masse (kg).", "d": "<b>Le dynamomètre</b> : il mesure une force en newtons (le ressort s'étire proportionnellement à la force).<div class='ex-detail'><u>Exemple rédigé</u> : subtilité : quand on se pèse sur une balance, la balance mesure en réalité une force mais affiche une masse, car elle divise par g (elle « sait » qu'on est sur Terre). Sur la Lune, la même balance afficherait n'importe quoi : c'est le dynamomètre qui dit la vérité sur la force réellement subie. Piège : la balance mesure indirectement ; le dynamomètre est l'instrument de la force.</div>"},
{"t": "Poids et gravitation (3e)", "q": "La masse d'un objet sur la Lune, par rapport à sa masse sur Terre :", "c": ["est divisée par 6", "est multipliée par 6", "est nulle", "est inchangée"], "a": 3, "e": "La masse est constante : même quantité de matière partout.", "d": "<b>Inchangée</b> : la masse ne dépend pas du lieu.<div class='ex-detail'><u>Exemple rédigé</u> : le sac de 4 kg reste 4 kg sur la Lune, sur Mars ou dans l'espace : il contient la même matière. Seul le poids change (39,2 N sur Terre, 6,4 N sur la Lune). Piège : « divisée par 6 » : c'est le POIDS qui est divisé par 6, pas la masse : la confusion masse/poids est l'erreur n° 1 de ce chapitre.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Pourquoi la Lune tourne-t-elle autour de la Terre sans s'y écraser ?", "c": ["sa vitesse et la gravitation se combinent : elle « rate » la Terre en permanence", "la Terre la repousse", "elle est trop légère pour tomber", "il n'y a pas de gravité dans l'espace"], "a": 0, "e": "La gravitation courbe en permanence la trajectoire de la Lune qui, sans elle, partirait tout droit.", "d": "<b>La gravitation courbe sa trajectoire à chaque instant</b> : sans gravité, la Lune partirait en ligne droite ; sans vitesse, elle tomberait sur la Terre.<div class='ex-detail'><u>Exemple rédigé</u> : l'orbite est la combinaison des deux : la Lune « tombe » vers la Terre mais avance assez vite pour la rater en continu : sa trajectoire se referme en cercle (à peu près). C'est exactement le principe d'un satellite artificiel : on le lance assez vite pour qu'il « rate » la Terre en permanence. Piège : « pas de gravité dans l'espace » : la gravité agit à TOUTES les distances.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "L'eau distillée est…", "c": ["un mélange homogène", "un mélange hétérogène", "du dioxygène", "un corps pur"], "a": 3, "e": "L'eau distillée ne contient que H₂O : un corps pur.", "d": "<b>Corps pur</b> : l'eau distillée contient une seule espèce chimique, H₂O.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve expérimentale : l'eau distillée bout exactement à 100 °C et gèle à 0 °C, à température constante : la signature d'un corps pur. Une eau salée bout AU-DESSUS de 100 °C et sur un intervalle de température : signature d'un mélange. Piège : « mélange homogène » : c'est le piège classique : homogène ≠ pur.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Eau + huile après agitation : quel mélange ?", "c": ["Homogène", "Hétérogène", "Impossible à dire", "Un corps pur"], "a": 1, "e": "Huile et eau ne sont pas miscibles : deux phases visibles.", "d": "<b>Hétérogène</b> : l'huile (moins dense) flotte au-dessus de l'eau.<div class='ex-detail'><u>Exemple rédigé</u> : même en agitant fort, les gouttes d'huile se rassemblent : deux couches réapparaissent. On peut alors séparer par DECANTATION (ou ampoule à décanter) : la gravité fait le travail. Piège : croire qu'agiter assez longtemps rendrait le mélange homogène : non miscible veut dire insoluble pour de bon.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Séparer du sable de l'eau : quelle méthode ?", "c": ["Filtration", "Rien à faire", "Distillation", "Décantation seule"], "a": 0, "e": "Le sable (solide non dissous) reste sur le filtre.", "d": "<b>Filtration</b> : le filtre retient le sable (résidu), l'eau passe (filtrat).<div class='ex-detail'><u>Exemple rédigé</u> : vocabulaire à connaître : RÉSIDU = ce qui reste sur le filtre ; FILTRAT = ce qui passe à travers. Vérification : le filtrat est limpide. Piège : la distillation est prévue pour des liquides MISCIBLES : ici c'est surdimensionné : solide + liquide = filtration, le réflexe le plus rentable du chapitre.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Peut-on filtrer le sel dissous dans l'eau salée ?", "c": ["Oui, le filtre retient le sel", "Oui en agitant fort", "Oui si le filtre est fin", "Non, le sel dissous traverse le filtre"], "a": 3, "e": "Le sel est dissous : invisible, homogène : la filtration est inutile.", "d": "<b>Non</b> : le sel dissous traverse le filtre avec l'eau.<div class='ex-detail'><u>Exemple rédigé</u> : le filtrat d'une eau salée est... encore salée (goûter !). Pour séparer : ① DISTILLATION : on vaporise l'eau, on la condense : eau pure côté distillat, sel dans le ballon ; ② ÉVAPORATION : on fait bouillir à sec : le sel reste. Piège : la filtration ne sépare que ce qu'on VOIT : le dissous est invisible et passe partout.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Dans une distillation, le liquide récupéré s'appelle…", "c": ["le résidu", "le décantat", "le distillat", "le filtrat"], "a": 2, "e": "Le distillat : vapeur condensée dans le réfrigérant.", "d": "<b>Le distillat</b> : la vapeur est refroidie (condensation) et coule dans l'éprouvette.<div class='ex-detail'><u>Exemple rédigé</u> : montage type : ballon chauffé → colonne → réfrigérant (eau froide à contre-courant) → distillat. Dans le ballon RESTE le moins volatil (ex. le sel d'une eau salée). Piège : « résidu » appartient à la FILTRATION (ce qui reste sur le filtre) : chaque technique a son vocabulaire : ne jamais les mélanger.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "La décantation fonctionne grâce à…", "c": ["la température", "le goût", "la couleur des liquides", "la différence de densité"], "a": 3, "e": "La gravité classe les espèces : la plus dense descend.", "d": "<b>La différence de densité</b> : le plus dense va vers le fond.<div class='ex-detail'><u>Exemple rédigé</u> : exemples : huile/eau (l'eau, plus dense, dessous) ; sable/eau (le sable se dépose) ; boue/eau. Piège : la décantation ne sépare pas ce qui est DISSOUS : l'eau sucrée décantera des semaines sans se séparer : homogène = inséparable par gravité.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "L'air est…", "c": ["du dioxygène pur", "un corps pur", "un mélange hétérogène", "un mélange homogène"], "a": 3, "e": "L'air = diazote + dioxygène + autres gaz : un mélange homogène.", "d": "<b>Un mélange homogène</b> : environ 78 % de diazote, 21 % de dioxygène, 1 % d'autres gaz.<div class='ex-detail'><u>Exemple rédigé</u> : on ne voit pas les constituants (une seule phase) : homogène. Mais plusieurs espèces : mélange. La preuve : la composition varie (altitude, pollution) alors qu'un corps pur a une composition FIXE. Piège : « du dioxygène pur » : le dioxygène n'est qu'UN des constituants : respire le gaz d'une bouteille d'O₂ pure et tu comprendras la différence : l'air nous faut TOUT son mélange.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "On dissout 10 g de sel dans 100 g d'eau. La masse de la solution obtenue est :", "c": ["100 g", "90 g", "impossible à savoir", "110 g"], "a": 3, "e": "La masse se conserve : 10 + 100 = 110 g.", "d": "<b>110 g</b> : la masse totale se conserve lors d'une dissolution.<div class='ex-detail'><u>Exemple rédigé</u> : le sel « disparaît » à l'œil mais pas en masse : les particules de sel sont simplement dispersées entre les molécules d'eau. Vérification : peser avant (100 + 10 = 110 g) et après (110 g) : identique. Piège : croire que « dissous = disparu » : c'est FAUX aussi pour le goût et pour la santé : le sucre dissous dans un soda reste du sucre.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Comment prouver qu'une eau est pure (pression normale) ?", "c": ["Elle bout exactement à 100 °C", "Elle est froide", "Elle a bon goût", "Elle est transparente"], "a": 0, "e": "Corps pur : changement d'état à température constante (100 °C pour l'eau).", "d": "<b>Elle bout à 100,0 °C exactement</b> (et gèle à 0 °C) : température CONSTANTE.<div class='ex-detail'><u>Exemple rédigé</u> : méthode : suivre la température pendant l'ébullition : si le thermomètre reste bloqué à 100 °C → corps pur (probablement de l'eau pure) ; si ça monte progressivement au-delà → mélange (ex. eau salée bout vers 101-102 °C). Piège : « transparente » : l'eau salée est transparente aussi : la transparence ne prouve RIEN : seuls les changements d'état tranchent.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Mélange homogène signifie…", "c": ["qu'on ne distingue qu'une phase à l'œil nu", "qu'il n'y a qu'une seule espèce chimique", "qu'on peut le filtrer", "qu'il est liquide"], "a": 0, "e": "Homogène : une seule phase VISIBLE ; ça peut contenir plusieurs espèces.", "d": "<b>Une seule phase visible</b> — mais possiblement plusieurs espèces chimiques.<div class='ex-detail'><u>Exemple rédigé</u> : l'eau sucrée : homogène (une phase) mais deux espèces (eau + sucre dissous). L'air : homogène, plusieurs gaz. Un corps pur : homogène ET une seule espèce. Piège : « une seule espèce chimique » : ce serait un CORPS PUR : homogène ≠ pur : c'est la distinction la plus testée du chapitre.</div>"},
{"t": "États et changements d'état (5e)", "q": "Dans un liquide, les particules sont…", "c": ["très éloignées et immobiles", "serrées et ordonnées", "immobiles et ordonnées", "serrées mais désordonnées, elles glissent"], "a": 3, "e": "Liquide : serré (comme le solide) mais désordonné : les particules glissent les unes sur les autres.", "d": "<b>Serrées et désordonnées</b> : le liquide coule et prend la forme du récipient parce que ses particules GLISSENT.<div class='ex-detail'><u>Exemple rédigé</u> : comparatif complet : solide = serré + ordonné (forme propre) ; liquide = serré + désordonné (forme du récipient) ; gaz = éloigné + désordonné (occupe tout). Piège : « immobiles » : RIEN n'est immobile : même dans un solide, les particules vibrent : c'est la température qui mesure cette agitation.</div>"},
{"t": "États et changements d'état (5e)", "q": "Le passage solide → liquide s'appelle…", "c": ["la liquéfaction", "la solidification", "la fusion", "la sublimation"], "a": 2, "e": "Solide → liquide = fusion (le contraire : solidification).", "d": "<b>La fusion</b> : solide → liquide.<div class='ex-detail'><u>Exemple rédigé</u> : mémoire : « fusion » comme fondre un glaçon. Les 6 noms : fusion (S→L), solidification (L→S), vaporisation (L→G), liquéfaction (G→L), sublimation (S→G), condensation solide (G→S). Piège : « liquéfaction » est réservé au gaz→liquide : vocabulaire précis exigé en contrôle.</div>"},
{"t": "États et changements d'état (5e)", "q": "Le givre se forme sur une vitre froide : c'est une…", "c": ["solidification", "vaporisation", "condensation solide (gaz → solide)", "fusion"], "a": 2, "e": "La vapeur d'eau passe directement de l'état gazeux à l'état solide.", "d": "<b>Condensation solide</b> : vapeur d'eau (gaz) → glace (solide), sans passer par le liquide.<div class='ex-detail'><u>Exemple rédigé</u> : la vitre froide capte la vapeur d'air ambiant : les molécules se figent directement en cristaux. Identique : la neige qui se forme dans les nuages. Piège : « solidification » part d'un LIQUIDE : ici il n'y a jamais eu de goutte : le sens de lecture (état de départ → arrivée) évite l'erreur.</div>"},
{"t": "États et changements d'état (5e)", "q": "La « fumée » blanche au-dessus d'une casserole d'eau chaude est…", "c": ["de l'air chaud", "des gouttelettes d'eau liquide", "de la vapeur d'eau (gaz)", "du dioxygène"], "a": 1, "e": "La vapeur est INVISIBLE ; le nuage blanc = eau déjà liquéfiée en microgouttelettes.", "d": "<b>Des gouttelettes LIQUIDES</b> : la vapeur d'eau, invisible, se liquéfie au contact de l'air plus froid.<div class='ex-detail'><u>Exemple rédigé</u> : à 1 cm au-dessus du bec de la bouilloire, on ne voit RIEN : c'est la vapeur (gaz). Le blanc visible commence plus haut : liquéfaction déjà effectuée (comme un nuage ou la buée). Piège : ce que l'on VOIT n'est jamais de la vapeur d'eau : ce blanc « épaissit » même les énoncés pièges : invisible = gaz.</div>"},
{"t": "États et changements d'état (5e)", "q": "Un glaçon de 20 g fond complètement. On obtient…", "c": ["plus de 20 g", "20 g d'eau", "moins de 20 g (une partie s'évapore)", "10 g d'eau"], "a": 1, "e": "La masse se conserve lors d'un changement d'état.", "d": "<b>20 g d'eau</b> : la masse ne change JAMAIS lors d'un changement d'état.<div class='ex-detail'><u>Exemple rédigé</u> : seules les distances entre particules changent, pas leur quantité : 20 g de glace → 20 g d'eau liquide (dont le volume est plus petit : exception de l'eau). Piège : « une partie s'évapore » : lors d'une FUSION lente, tout se liquéfie : même si une évaporation négligeable existait, l'énoncé attend la conservation : c'est une loi du chapitre.</div>"},
{"t": "États et changements d'état (5e)", "q": "Ébullition et vaporisation : quelle relation ?", "c": ["Ce sont des synonymes", "Aucune relation", "La vaporisation est plus rapide", "L'ébullition est une vaporisation rapide qui forme des bulles"], "a": 3, "e": "Vaporisation (lente, à toute température) ⊂ ébullition = rapide, avec bulles, à 100 °C pour l'eau pure.", "d": "<b>L'ébullition est une vaporisation RAPIDE</b> : bulles qui naissent DANS le liquide.<div class='ex-detail'><u>Exemple rédigé</u> : une flaque s'évapore à 15 °C : vaporisation LENTE en surface, sans bulles. La même eau à 100 °C (pression normale) bout : bulles + vapeur massive. Piège : « synonymes » : non : l'ébullition a une température précise, la vaporisation a lieu à toute température : question de vocabulaire, réponse de précision.</div>"},
{"t": "États et changements d'état (5e)", "q": "Pourquoi la glace flotte-t-elle sur l'eau ?", "c": ["Le froid pousse vers le haut", "Elle est plus légère au sens de masse", "L'eau solide est moins dense que l'eau liquide", "Elle contient de l'air"], "a": 2, "e": "Exception de l'eau : le solide est MOINS dense que le liquide.", "d": "<b>L'eau solide est moins dense que l'eau liquide</b> : à masse égale, la glace occupe plus de volume.<div class='ex-detail'><u>Exemple rédigé</u> : la plupart des substances coulent dans leur propre liquide solidifié ; l'eau est l'exception (structure cristalline aérée de la glace). Conséquences : icebergs, canettes gelées qui explosent, étang qui gèle en surface seulement (protégeant la vie aquatique). Piège : « plus légère » : un glaçon de 1 kg pèse 1 kg : c'est la DENSITÉ (masse pour un même volume), pas la masse.</div>"},
{"t": "États et changements d'état (5e)", "q": "Solide → gaz directement : c'est…", "c": ["la sublimation", "la fusion", "la liquéfaction", "la condensation solide"], "a": 0, "e": "Solide → gaz sans passer par le liquide : sublimation.", "d": "<b>La sublimation</b> : solide → gaz directement.<div class='ex-detail'><u>Exemple rédigé</u> : exemples : la neige qui disparaît par grand froid sans mouiller le sol ; le « linge qui sèche gelé » ; la carboglace (CO₂ solide) qui fume sans laisser de flaque. Piège : ne pas confondre avec la condensation solide qui est le sens INVERSE (gaz → solide : givre) : la flèche du changement se lit TOUJOURS de l'état initial vers le final.</div>"},
{"t": "États et changements d'état (5e)", "q": "Un gaz, dans un récipient fermé :", "c": ["se place au milieu", "se tasse si on secoue", "reste en bas du récipient", "occupe tout le volume disponible"], "a": 3, "e": "Les particules de gaz, éloignées et rapides, se dispersent dans tout l'espace.", "d": "<b>Il occupe tout le volume disponible</b> : particules éloignées, très agitées.<div class='ex-detail'><u>Exemple rédigé</u> : c'est LA différence structurale avec le liquide (qui garde une surface libre) : un parfum ouvert remplit toute la pièce, un gaz dans une bouteille occupe toute la bouteille. Piège : « se tasse si on secoue » : un gaz ne se range pas : seule une PRESSION le comprime (réduction des distances entre particules), pas une agitation.</div>"},
