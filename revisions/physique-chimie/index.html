{"t": "Énergie électrique : puissance (4e)", "q": "Une bouilloire de 2000 W tourne 6 min. Énergie ?", "c": ["200 Wh", "12 000 kWh", "12 kWh", "0,2 Wh"], "a": 0, "e": "6 min = 0,1 h : E = 2000 × 0,1 = 200 Wh.", "d": "<b>200 Wh</b> : 6 min = 0,1 h, E = 2000 × 0,1.<div class='ex-detail'><u>Exemple rédigé</u> : étape indispensable : convertir 6 min en heures : 6/60 = 0,1 h. Puis E = 2000 × 0,1 = 200 Wh = 0,2 kWh (≈ 5 centimes) : chauffer l'eau reste raisonnable SI on ne re-bouille pas 10 fois. Piège : « 12 000 kWh » multiplierait 2000 × 6 sans conversion : résultat délirant (la facture annuelle d'un immeuble) : TOUJOURS les minutes → heures d'abord.</div>"},
{"t": "Énergie électrique : puissance (4e)", "q": "Le plus gros consommateur d'une maison est souvent :", "c": ["le chargeur de téléphone", "le chauffage (et le chauffe-eau)", "la box internet", "la LED de chevet"], "a": 1, "e": "Fortes puissances (2000 W) × longues durées = les postes n° 1 : chauffage, eau chaude.", "d": "<b>Le chauffage</b> (avec le chauffe-eau).<div class='ex-detail'><u>Exemple rédigé</u> : le calcul qui décide : radiateur 1500 W × 10 h/jour = 15 kWh/jour, contre box 15 W × 24 h = 0,36 kWh : rapport de 40 ! La box est branchée en permanence mais faible : le radiateur est intermittent mais énorme. Piège : « branché tout le temps » ≠ « gros consommateur » : puissance ET durée : le duo E = P × t trie toujours les vrais postes des faux.</div>"},
{"t": "Énergie électrique : puissance (4e)", "q": "Radiateur 1500 W, 8 h/jour, 30 jours, 0,25 €/kWh. Coût mensuel ?", "c": ["12 €", "90 €", "3,6 €", "36 €"], "a": 1, "e": "E = 1500×8×30 = 360 000 Wh = 360 kWh ; 360 × 0,25 = 90 €.", "d": "<b>90 €</b> : E(jour) = 1500 × 8 = 12 kWh ; ×30 = 360 kWh ; ×0,25 €.<div class='ex-detail'><u>Exemple rédigé</u> : chaîne de calcul complète : ① par jour : 12 kWh ; ② par mois : 360 kWh ; ③ en euros : 360 × 0,25 = 90 € : le chauffage d'une pièce pendant un mois d'hiver. Piège : « 36 € » oublierait de convertir les Wh en kWh (360 000 Wh × 0,25 = 90 000... centimes ?!) : le prix s'applique au kWh, pas au Wh : ÷1000 avant de payer.</div>"},
{"t": "Énergie électrique : puissance (4e)", "q": "LED de 10 W vs lampe à incandescence de 60 W. Même éclairage. La LED convertit :", "c": ["en chaleur uniquement", "6 fois plus d'énergie", "la même puissance", "6 fois moins de puissance pour le même service"], "a": 3, "e": "10 W au lieu de 60 W : 6 fois moins, à service égal.", "d": "<b>6 fois moins de puissance</b> pour le même éclairage.<div class='ex-detail'><u>Exemple rédigé</u> : l'incandescence gaspille ~90 % de son énergie en CHALEUR (elle « éclaire » comme un petit radiateur) ; la LED convertit efficacement en lumière. Économie annuelle (5 h/j) : (60−10) W × 1825 h ≈ 91 kWh ≈ 23 € par lampe. Piège : « en chaleur uniquement » : c'est le défaut de l'INCADESCENCE, pas de la LED : chaque technologie a son rendement.</div>"},
{"t": "Énergie électrique : puissance (4e)", "q": "E = 900 Wh. En kWh :", "c": ["900 000 kWh", "9 kWh", "90 kWh", "0,9 kWh"], "a": 3, "e": "kilo = 1000 : 900 Wh = 0,9 kWh.", "d": "<b>0,9 kWh</b> : ÷ 1000 (kilo = mille).<div class='ex-detail'><u>Exemple rédigé</u> : exemples : 250 Wh = 0,25 kWh (télé 100 W × 2,5 h) ; 12 000 Wh = 12 kWh (radiateur 1500 W × 8 h) ; 0,36 kWh (box 15 W × 24 h). Piège : « 9 kWh » multiplierait au lieu de diviser : kWh = GRANDE unité : les appareils quotidiens se comptent en dixièmes et unités de kWh, pas en dizaines.</div>"},
{"t": "Énergie électrique : puissance (4e)", "q": "Un frigo (150 W) tourne 24h/24. Énergie quotidienne ?", "c": ["36 kWh", "150 kWh", "3,6 kWh", "0,15 kWh"], "a": 2, "e": "E = 150 × 24 = 3600 Wh = 3,6 kWh.", "d": "<b>3,6 kWh</b> par jour : E = 150 W × 24 h = 3600 Wh.<div class='ex-detail'><u>Exemple rédigé</u> : sur l'année : 3,6 × 365 ≈ 1314 kWh ≈ 330 € : le frigo « permanent » pèse plus qu'on ne croit (d'où les labels énergie : A+++ vs C : mêmes kWh pour 2 fois moins). Piège : « 0,15 kWh » oublierait les 24 h : la PERMANENCE est le danger du frigo : faible puissance × temps ÉNORME = addition salée.</div>"},
{"t": "Énergie électrique : puissance (4e)", "q": "La puissance électrique P d'un dipôle se calcule (prépa 3e) :", "c": ["P = U / I", "P = U × I", "P = U + I", "P = I / U"], "a": 1, "e": "P = U × I (tension en volts × intensité en ampères = watts).", "d": "<b>P = U × I</b> : la puissance « mange » tension et intensité.<div class='ex-detail'><u>Exemple rédigé</u> : exemple : un appareil 230 V qui appelle 2 A : P = 230 × 2 = 460 W. Réciproque : un fer à 1000 W sur 230 V appelle I = P/U ≈ 4,3 A : c'est ce qui dimensionne les fusibles (et pourquoi un radiateur de 2000 W demande ~8,7 A : le calibre 16 A des prises). Piège : « P = U/I » inverserait le rôle : U × I : les deux facteurs se MULTIPLIENT, jamais ne se divisent.</div>"},
{"t": "Signaux sonores et lumineux (4e)", "q": "Dans le vide de l'espace, on entend…", "c": ["seulement les explosions", "tout normalement", "rien du tout (le son ne se propage pas)", "un peu moins bien"], "a": 2, "e": "Sans milieu matériel, aucune vibration ne se transmet : silence total.", "d": "<b>Rien du tout</b> : le son exige de la matière pour vibrer de proche en proche.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience de la cloche à vide : on VOIT la cloche frémir (la lumière traverse le vide) mais plus rien n'arrive aux oreilles. Les films d'explosions spatiales doublées d'un « boum » prennent une liberté artistique. Piège : « seulement les explosions » : une explosion produit une onde de choc dans l'AIR : dans l'espace, ni air, ni onde, ni son : le silence est total, quelle que soit la puissance.</div>"},
{"t": "Signaux sonores et lumineux (4e)", "q": "Un son de fréquence 50 Hz est…", "c": ["très fort", "grave", "très aigu", "inaudible forcément"], "a": 1, "e": "Petite fréquence = son grave.", "d": "<b>Grave</b> : 50 vibrations par seconde seulement.<div class='ex-detail'><u>Exemple rédigé</u> : repères : 50 Hz : basse profonde ; 440 Hz : le « la » du diapason (note médiane) ; 1000 Hz : aigu ; 15 000 Hz : très aigu (jeunes oreilles seulement). Fréquence = hauteur, indépendante du volume. Piège : « très fort » : la force (amplitude) n'est PAS dans la fréquence : un 50 Hz peut être doux ou assourdissant : deux curseurs séparés.</div>"},
{"t": "Signaux sonores et lumineux (4e)", "q": "Éclair vu, tonnerre entendu 12 s plus tard. Distance ?", "c": ["environ 36 km", "340 m", "12 km", "environ 4 km"], "a": 3, "e": "d = 340 × 12 ≈ 4080 m ≈ 4 km (astuce : 12 ÷ 3).", "d": "<b>≈ 4 km</b> : d = 340 m/s × 12 s = 4080 m.<div class='ex-detail'><u>Exemple rédigé</u> : astuce vérifiée : 12 secondes ÷ 3 = 4 km : la division par 3 est le raccourci de la multiplication par 340 m/s (≈ 1 km / 3 s). Piège : « 12 km » copie les secondes : c'est le piège favori des QCM : toujours MULTIPLIER par la vitesse (ou diviser par 3) : jamais recopier le temps.</div>"},
{"t": "Signaux sonores et lumineux (4e)", "q": "Le domaine audible humain s'étend environ de…", "c": ["20 à 200 Hz", "1000 à 10 000 Hz", "0 à 100 Hz", "20 Hz à 20 000 Hz"], "a": 3, "e": "Environ 20 Hz (graves) à 20 000 Hz (aigus).", "d": "<b>20 Hz à 20 000 Hz</b>.<div class='ex-detail'><u>Exemple rédigé</u> : sous 20 Hz : INFRAsons (inaudibles : séismes, éléphants) ; au-dessus de 20 000 Hz : ULTRAsons (inaudibles : chiens jusqu'à ~45 000 Hz, chauve-souris ~100 000 Hz, échographie). Piège : l'existence n'est pas l'audition : un ultrason EST un son (vibration réelle) : simplement hors de notre capteur : les jeunes entendent jusqu'à ~18-20 kHz, les adultes s'arrêtent plus tôt.</div>"},
{"t": "Signaux sonores et lumineux (4e)", "q": "Sonar : écho reçu 2,4 s après l'émission (v = 1500 m/s). Profondeur ?", "c": ["1800 m", "625 m", "1500 m", "3600 m"], "a": 0, "e": "t/2 = 1,2 s : d = 1500 × 1,2 = 1800 m.", "d": "<b>1800 m</b> : diviser le temps par 2 (aller-retour) puis d = v × t.<div class='ex-detail'><u>Exemple rédigé</u> : le piège éternel : le son parcourt DEUX fois la profondeur (descente + remontée) : sans la division : 1500 × 2,4 = 3600 m : le double de la réalité. Le dauphin et le sonar des sous-marins font ce calcul en permanence : la division par 2 est intégrée à leur instinct (pas au nôtre : la poser à chaque fois).</div>"},
{"t": "Signaux sonores et lumineux (4e)", "q": "Pourquoi voit-on le flash AVANT le bruit d'une explosion à 3 km ?", "c": ["l'oreille tarde", "le flash part avant", "la lumière va ~1 million de fois plus vite que le son", "le son part en arrière"], "a": 2, "e": "Lumière : 300 000 km/s (instantanée) ; son : 340 m/s (8,8 s pour 3 km).", "d": "<b>La lumière est ~1 million de fois plus rapide</b> que le son.<div class='ex-detail'><u>Exemple rédigé</u> : à 3 km : lumière : 10 millionièmes de seconde (on ne perçoit RIEN d'autre qu'instantané) ; son : 3000 ÷ 340 ≈ 8,8 s. Le décalage éclair→tonnerre est une HORLOGE : chaque seconde = 340 m. Piège : « le flash part avant » : NON : tout part au même instant : seule la VITESSE de transport crée l'écart.</div>"},
{"t": "Signaux sonores et lumineux (4e)", "q": "Un signal, c'est…", "c": ["un bruit aléatoire", "un objet lumineux", "une énergie perdue", "une information transportée par une grandeur physique (son, lumière, onde)"], "a": 3, "e": "Un signal porte une information (mots, alphabet Morse, image) via un support physique.", "d": "<b>Une information transportée par une grandeur physique</b> (onde sonore, lumière, radio).<div class='ex-detail'><u>Exemple rédigé</u> : exemples : la voix transporte des MOTS (signal sonore) ; un phare transporte un CODE lumineux ; une fibre optique transporte des DONNÉES par la lumière ; un sonar transporte une MESURE de distance par l'écho. Piège : « un bruit aléatoire » : un bruit blanc n'est PAS un signal : le signal = information VOLONTAIRE et structurée sur un support : les deux mots « signal » et « bruit » s'opposent.</div>"},
{"t": "Signaux sonores et lumineux (4e)", "q": "Plus on s'éloigne d'une source sonore, plus le son est…", "c": ["grave", "rapide", "faible (atténué)", "aigu"], "a": 2, "e": "L'énergie se répartit dans toutes les directions : moins par oreille à distance.", "d": "<b>Faible (atténué)</b> : l'énergie se dilue avec la distance.<div class='ex-detail'><u>Exemple rédigé</u> : modèle : l'onde sonore est une SPHÈRE qui grossit : la même énergie répartie sur une surface de plus en plus grande : chaque cm² d'oreille en reçoit moins. Doubler la distance ≈ diviser l'intensité par 4. Piège : la VITESSE du son ne change pas avec la distance (340 m/s constante dans l'air donné) : c'est l'AMPLITUDE (la force) qui décroît : « faible » ≠ « lent ».</div>"},
{"t": "Signaux sonores et lumineux (4e)", "q": "L'échographie médicale utilise…", "c": ["de la lumière visible", "des sons graves", "des rayons X", "des ultrasons et leur écho"], "a": 3, "e": "Les ultrasons (> 20 000 Hz) rebondissent sur les tissus : l'écho reconstitue une image.", "d": "<b>Des ultrasons et leur écho</b> : même principe que le sonar, à échelle cm.<div class='ex-detail'><u>Exemple rédigé</u> : la sonde émet, reçoit les échos des différentes interfaces (muscle/os/liquide) : l'ordinateur convertit les TEMPS de retour en DISTANCES : une image en direct. Le dauphin et la chauve-souris font exactement ça pour chasser. Piège : « rayons X » : c'est la radiographie, une AUTRE technique (lumière à très haute énergie) : échographie = ultrasons = sans danger pour le fœtus (d'où son usage en obstétrique).</div>"},
{"t": "Signaux sonores et lumineux (4e)", "q": "Vitesse de la lumière ≈", "c": ["340 m/s", "300 000 km/s", "1500 m/s", "1 million de km/h"], "a": 1, "e": "≈ 300 000 km/s = 3×10⁸ m/s.", "d": "<b>300 000 km/s</b> (3×10⁸ m/s).<div class='ex-detail'><u>Exemple rédigé</u> : repères spectaculaires : 7,5 fois le tour de la Terre en UNE seconde ; Soleil→Terre : 8 min ; Lune→Terre : 1,3 s ; Proxima du Centaure : 4,2 ANS. Piège : « 340 m/s » : c'est le SON : les deux vitesses se permutent dans les QCM ; 1 million de km/h ≈ 278 km/s : FAUX (la lumière, c'est 1 MILLIARD de km/h).</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "L'atome de carbone a Z = 6, A = 12. Nombre de neutrons ?", "c": ["6", "18", "0", "12"], "a": 0, "e": "Neutrons = A − Z = 12 − 6 = 6.", "d": "<b>6 neutrons</b> : A (nucléons) − Z (protons).<div class='ex-detail'><u>Exemple rédigé</u> : décomposition complète du carbone 12 : 6 protons (Z), 6 neutrons (A−Z), 6 électrons (atome neutre : autant d'électrons que de protons). Piège : « 12 » : c'est A, le total protons+neutrons : le nombre de neutrons s'obtient TOUJOURS par soustraction A − Z, jamais par lecture directe.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "Un ion positif (cation) s'est formé par…", "c": ["gain d'électrons", "perte d'électrons", "gain de protons", "perte de protons"], "a": 1, "e": "Moins d'électrons (−) que de protons (+) ⟹ charge +.", "d": "<b>Perte d'électrons</b> : les (+) restent, les (−) partent : excès de charges positives.<div class='ex-detail'><u>Exemple rédigé</u> : Na (11 p, 11 e) perd 1 électron ⟹ Na⁺ (11 p, 10 e) : charge = +1. Piège : « perte de protons » : IMPOSSIBLE en chimie ( changer Z changerait l'élément : le sodium deviendrait autre chose) : le noyau est intouchable dans les réactions chimiques : seul le nuage d'électrons bouge.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "L'ion Cl⁻ contient (Z = 17) :", "c": ["17 protons, 16 électrons", "16 protons, 17 électrons", "17 protons, 18 électrons", "18 protons, 17 électrons"], "a": 2, "e": "Gain d'1 électron : 17 p, 18 e : charge −1.", "d": "<b>17 protons, 18 électrons</b> : l'anion a GAGNÉ un électron.<div class='ex-detail'><u>Exemple rédigé</u> : atome Cl : 17 p, 17 e (neutre) ⟹ ion Cl⁻ : 17 p, 18 e : charge = 17(+) − 18(−) = −1. Piège : « 17 p, 16 e » serait un CATION Cl⁺ : l'anion (-) a PLUS d'électrons que de protons : le signe de la charge donne le sens du transfert (+ = moins d'électrons, − = plus).</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "L'ion hydroxyde OH⁻ est composé de :", "c": ["1 oxygène et 1 hydrogène", "1 or et 1 hydrogène", "1 oxygène seul", "2 hydrogènes et 1 oxygène"], "a": 0, "e": "O + H, charge globale −1 : ion polyatomique.", "d": "<b>1 oxygène + 1 hydrogène</b> (2 atomes, charge −1 : ion polyatomique).<div class='ex-detail'><u>Exemple rédigé</u> : l'ion hydroxyde OH⁻ est la signature des solutions BASIQUES (soude NaOH : Na⁺ + OH⁻ en solution). Ne pas confondre avec H₂O (eau, molécule neutre : 2 H + 1 O, aucune charge). Piège : le O et le H sont bien là, mais la CHARGE −1 appartient à l'ENSEMBLE des deux atomes : c'est un ion, pas une molécule.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "Test des ions chlorure Cl⁻ :", "c": ["soude ⟹ précipité vert", "rien à faire", "nitrate d'argent ⟹ précipité blanc", "chauffage ⟹ gaz"], "a": 2, "e": "AgNO₃ + Cl⁻ ⟹ AgCl blanc qui noircit à la lumière.", "d": "<b>Nitrate d'argent</b> ⟹ précipité BLANC de chlorure d'argent (noircit à la lumière).<div class='ex-detail'><u>Exemple rédigé</u> : dans une eau minérale : quelques gouttes de AgNO₃ : trouble blanc : les ions Cl⁻ sont présents. C'est aussi la base de la photo argentique (AgCl sensible à la lumière). Piège : la soude teste les cations MÉTALLIQUES (Fe²⁺ vert, Cu²⁺ bleu, Fe³⁺ rouille) : deux réactifs, deux familles d'ions : ne pas intervertir.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "Un atome neutre possède :", "c": ["autant de neutrons que de protons", "plus d'électrons", "plus de protons que d'électrons", "autant de protons que d'électrons"], "a": 3, "e": "Neutralité : Z protons (+) compensés par Z électrons (−).", "d": "<b>Autant de protons que d'électrons</b> : charges + et − se compensent exactement.<div class='ex-detail'><u>Exemple rédigé</u> : tout atome du tableau périodique : Z protons, Z électrons, charge nette nulle. Attention : le nombre de NEUTRONS n'a rien à voir avec la neutralité (les neutrons sont neutres, ils ne comptent pas dans la charge). Piège : « autant de neutrons que de protons » : c'est souvent vrai (C : 6 et 6) mais PAS toujours (Cl : 17 et 18) : la neutralité électrique, elle, est TOUJOURS protons = électrons.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "L'ion sulfate SO₄²⁻ contient au total :", "c": ["6 atomes", "4 atomes", "2 atomes", "5 atomes"], "a": 3, "e": "1 S + 4 O = 5 atomes, charge −2.", "d": "<b>5 atomes</b> : 1 soufre + 4 oxygènes.<div class='ex-detail'><u>Exemple rédigé</u> : lecture : S sans indice = 1 ; O₄ = 4 : total 5 atomes portant ensemble 2 charges négatives. Le sulfate est omniprésent : gypse (plâtre CaSO₄), sulfate de cuivre (fongicide bleu). Piège : « 4 atomes » oublierait le soufre en tête : dans les ions polyatomiques, on compte TOUS les atomes, indice par indice, comme pour les molécules.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "Cu²⁺ se forme quand l'atome de cuivre (Z = 29)…", "c": ["gagne 2 électrons", "perd 2 protons", "gagne 2 protons", "perd 2 électrons"], "a": 3, "e": "Cu²⁺ : 29 p, 27 e : charge +2 = perte de 2 électrons.", "d": "<b>Perd 2 électrons</b> : 29 p restants, 27 e : +2.<div class='ex-detail'><u>Exemple rédigé</u> : le cuivre Cu²⁺ donne la couleur BLEUE des solutions (sulfate de cuivre) et se dépose sur le fer dans le célèbre clou rouge devenu cuivré (Fe + Cu²⁺ ⟹ Fe²⁺ + Cu). Piège : « perd 2 protons » : 27 protons = COBALT : changer les protons change l'ÉLÉMENT : interdit en chimie : seuls les électrons transfèrent.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "Le numéro atomique Z correspond à :", "c": ["le nombre de protons (identité de l'élément)", "le nombre de liaisons", "la masse de l'atome", "le nombre de neutrons"], "a": 0, "e": "Z = protons : 6 = carbone, 17 = chlore, etc.", "d": "<b>Le nombre de protons</b> : la carte d'identité de l'élément.<div class='ex-detail'><u>Exemple rédigé</u> : Z = 6 ⟹ CARBONE, quel que soit le nombre de neutrons (C-12, C-14 : isotopes) ou d'électrons (C, C⁴⁺ : même élément). Piège : « la masse » : deux atomes de masses différentes (C-12 et C-14) peuvent être le MÊME élément : la masse dépend d'A (p + n), l'identité de Z (p) seul : deux informations différentes.</div>"},
{"t": "Atomes, ions et formules chimiques (3e)", "q": "Une solution de sel (Na⁺ + Cl⁻) conduit le courant parce que :", "c": ["les ions portent des charges mobiles", "le sel est métallique", "le verre conduit", "l'eau conduit"], "a": 0, "e": "Les ions libres se déplacent sous la tension : porteurs de charges mobiles.", "d": "<b>Les ions (charges mobiles) circulent</b> dans la solution sous l'effet de la tension.<div class='ex-detail'><u>Exemple rédigé</u> : expérience du circuit : lampe + solution : eau pure ⟹ lampe éteinte (pas de porteurs) ; sel dissous ⟹ lampe allumée : les Na⁺ vers une électrode, les Cl⁻ vers l'autre. Piège : « l'eau conduit » : l'eau PURE est isolante : c'est ce qu'on dissout (ions) qui conduit : d'où le danger de sèche-cheveux près du bain (l'eau du bain est PLEINE d'ions).</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Une transformation chimique se reconnaît à :", "c": ["un changement d'état", "un simple mélange", "un déplacement", "la formation de nouvelles substances"], "a": 3, "e": "Couleur, gaz, précipité, chaleur : de nouvelles espèces apparaissent.", "d": "<b>La formation de nouvelles substances</b> (produits ≠ réactifs).<div class='ex-detail'><u>Exemple rédigé</u> : indices observables : vinaigre + bicarbonate ⟹ effervescence (gaz CO₂) : chimique ; rouille : poudre brune nouvelle : chimique ; glace fond : H₂O identique : physique. Piège : « changement d'état » : fusion/ébullition conservent les molécules : physique : le critère est la NATURE des molécules, pas leur arrangement.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Équilibrer : H₂ + O₂ ⟶ H₂O donne :", "c": ["2 H₂ + 2 O₂ ⟶ H₂O", "H₂ + O₂ ⟶ H₂O", "2 H₂ + O₂ ⟶ 2 H₂O", "H₂ + 2 O₂ ⟶ 2 H₂O"], "a": 2, "e": "2 H₂ + O₂ ⟶ 2 H₂O : 4 H et 2 O de chaque côté.", "d": "<b>2 H₂ + O₂ ⟶ 2 H₂O</b> : comptage : gauche : 4 H, 2 O ; droite : 4 H, 2 O ✓.<div class='ex-detail'><u>Exemple rédigé</u> : méthode : H d'abord : 2 H₂O pour 4 H ; O ensuite : 2 H₂O contiennent 2 O = 1 O₂. Cette équation est celle de la synthèse de l'eau (et de la pile à hydrogène : énergie propre). Piège : « H₂ + O₂ ⟶ H₂O » : 2 O à gauche, 1 seul à droite : incohérence : un O aurait disparu : interdit par Lavoisier.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Dans une équation, on peut modifier :", "c": ["les coefficients devant les formules", "le sens de la flèche", "les symboles des éléments", "les indices des formules"], "a": 0, "e": "Seuls les COEFFICIENTS s'ajustent : les formules sont figées.", "d": "<b>Les coefficients</b> devant les formules (les indices sont intouchables).<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi : les indices décrivent la NATURE des molécules : H₂O (eau) et H₂O₂ (eau oxygénée) sont deux produits DIFFÉRENTS : changer un indice change l'espèce chimique : c'est la triche interdite. Le coefficient, lui, dit COMBIEN de molécules : ajustable librement. Piège : « 2 H₂O » (2 molécules d'eau) ≠ « H₂O₂ » (une molécule d'eau oxygénée) : un chiffre change de place : tout change de sens.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Combustion complète du méthane : CH₄ + … ⟶ CO₂ + 2 H₂O", "c": ["3 O₂", "2 O₂", "O₂", "4 O"], "a": 1, "e": "CH₄ + 2 O₂ ⟶ CO₂ + 2 H₂O : 4 O à droite, donc 2 O₂.", "d": "<b>2 O₂</b> : CH₄ + 2 O₂ ⟶ CO₂ + 2 H₂O.<div class='ex-detail'><u>Exemple rédigé</u> : comptage O : droite : CO₂ (2 O) + 2 H₂O (2 O) = 4 O ⟹ 2 O₂ à gauche. C : 1/1 ✓ ; H : 4/4 ✓. C'est la réaction de la gazinière : flamme bleue = complète ; flamme jaune + noir de la casserole = incomplète (suie + CO toxique). Piège : « O₂ » seul ne donnerait que 2 O : il en faut 4 : compter AVANT de choisir le coefficient.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "La conservation de la masse signifie :", "c": ["la masse peut varier de 10 %", "la masse des solides seulement se conserve", "masse des réactifs consommés = masse des produits formés", "la masse augmente toujours"], "a": 2, "e": "Rien ne se perd, rien ne se crée : même masse de chaque côté.", "d": "<b>m(réactifs consommés) = m(produits formés)</b> : comptage d'atomes ET de masse identiques.<div class='ex-detail'><u>Exemple rédigé</u> : 4 g de fer + 1,74 g d'O₂ ⟹ 5,74 g d'oxyde de fer : 5,74 = 4 + 1,74 ✓. Mais sur une balance OUVERTE : le flacon « gagne » (O₂ absorbé) ou « perd » (CO₂ envolé) : il faut CLOSE l'expérience pour la vérifier. Piège : « la masse augmente toujours » : seulement si le flacon pique un gaz de l'air : la masse TOTALE (tout compris) ne bouge JAMAIS.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Combien d'atomes d'oxygène à droite de : 3 CO₂ + 4 H₂O ?", "c": ["7", "6", "2", "10"], "a": 3, "e": "3×2 (CO₂) + 4×1 (H₂O) = 6 + 4 = 10 O.", "d": "<b>10 O</b> : 6 (des 3 CO₂) + 4 (des 4 H₂O).<div class='ex-detail'><u>Exemple rédigé</u> : c'est la clé de l'équilibrage du propane : C₃H₈ + ? O₂ ⟶ 3 CO₂ + 4 H₂O : il faut 10 O à gauche = 5 O₂ (5 × 2 = 10). Piège : « 7 » additionnerait les molécules (3 + 4) au lieu des ATOMES : on compte des atomes d'UN élément, jamais des molécules : 3 molécules de CO₂ contiennent 6 oxygènes, pas 3.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Une combustion incomplète (manque d'air) produit surtout :", "c": ["de l'eau pure", "de l'azote", "du monoxyde de carbone CO, toxique", "du méthane"], "a": 2, "e": "Carbone incomplètement oxydé ⟹ CO : gaz inodore et mortel.", "d": "<b>CO (monoxyde de carbone)</b> : inodore, invisible, mortel.<div class='ex-detail'><u>Exemple rédigé</u> : dans une chaudière mal réglée ou une pièce fermée : pas assez d'O₂ : le carbone s'arrête à CO au lieu de finir en CO₂. Le CO se fixe sur l'hémoglobine à la place de l'O₂ : asphyxie silencieuse (d'où les détecteurs obligatoires). Piège : CO₂ (dioxyde) n'est PAS toxique aux faibles doses (gaze à effet de serre, oui) : UNE lettre d'écart, deux réalités sanitaires opposées.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Effervescence du vinaigre + bicarbonate : le gaz formé est :", "c": ["du dioxyde de carbone CO₂", "du dihydrogène", "du dioxygène", "de l'azote"], "a": 0, "e": "Acide + carbonate ⟹ CO₂ : trouble l'eau de chaux.", "d": "<b>CO₂ (dioxyde de carbone)</b> : le gaz des réactions acide/carbonate.<div class='ex-detail'><u>Exemple rédigé</u> : test d'identification : l'eau de chaux se TROUBLE au contact du CO₂ : la signature du gaz (grotte de Padirac : CO₂ lourd qui stagne au fond). Autres exemples : pastilles effervescentes, pâte à cake qui gonfle (levure ⟹ CO₂). Piège : « dioxygène » : il FAIT brûler une allumette ; le CO₂, lui, l'ÉTEINT : un test simple sépare les deux gaz.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "Le fer + sulfate de cuivre : le clou se couvre de cuivre rouge. C'est :", "c": ["une dissolution", "un alliage", "une transformation physique", "une transformation chimique (Fe + Cu²⁺ ⟹ Fe²⁺ + Cu)"], "a": 3, "e": "Nouvelles espèces formées (Fe²⁺, Cu métallique) : réaction chimique.", "d": "<b>Transformation chimique</b> : Fe + Cu²⁺ ⟹ Fe²⁺ + Cu.<div class='ex-detail'><u>Exemple rédigé</u> : observations : dépôt ROUGE de cuivre sur le clou, bleu de la solution qui pâlit (Cu²⁺ consommés, remplacés par des Fe²⁺ verts pâles). Les ions ont ÉCHANGÉ leurs électrons (Fe donne 2 e à Cu²⁺). Piège : « dissolution » : le fer ne SE SÉPARE pas, il SE REMPLACE : le clou maigrit, le cuivre se dépose : bilan d'atomes : nouvelles substances ⟹ chimique.</div>"},
{"t": "Transformations chimiques et équations (3e)", "q": "La flèche ⟶ dans une équation signifie :", "c": ["une égalité de nombres", "« se transforme en » (sens réactifs ⟶ produits)", "un ajout d'énergie", "un équilibre des charges"], "a": 1, "e": "Les réactifs (à gauche) se transforment en produits (à droite).", "d": "<b>« Se transforme en »</b> : réactifs à gauche, produits à droite.<div class='ex-detail'><u>Exemple rédigé</u> : lecture de CH₄ + 2 O₂ ⟶ CO₂ + 2 H₂O : « le méthane ET le dioxygène SE TRANSFORMENT EN dioxyde de carbone et eau ». Ce n'est pas un « = » : on ne peut pas lire dans l'autre sens sans conditions (la combustion ne revient pas en arrière toute seule) : la flèche a un SENS, celui du temps de la réaction. Piège : « égalité » : la conservation porte sur les ATOMES, mais la nature des espèces CHANGE : la flèche dit le changement, les coefficients disent la conservation.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "L'ampèremètre se branche :", "c": ["en série dans la boucle", "aux bornes de la pile", "en dérivation", "n'importe où"], "a": 0, "e": "En SÉRIE : il doit être traversé par le courant qu'il mesure.", "d": "<b>En série</b>, dans la boucle.<div class='ex-detail'><u>Exemple rédigé</u> : logique : pour COMPTER les charges, il faut qu'elles passent À TRAVERS l'appareil : on ouvre le circuit, on insère l'ampèremètre. Piège : branché aux bornes de la pile (en dérivation), l'ampèremètre (petite résistance interne) se comporte comme un FIL : court-circuit : l'appareil peut être détruit : A = série, V = dérivation : le réflexe vital du chapitre.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "Loi d'Ohm pour une résistance :", "c": ["U = R / I", "U = R × I", "U = R + I", "U = I / R"], "a": 1, "e": "Tension = résistance × intensité (V = Ω × A).", "d": "<b>U = R × I</b> : la résistance multiplie l'intensité pour donner la tension.<div class='ex-detail'><u>Exemple rédigé</u> : R = 220 Ω, I = 0,05 A ⟹ U = 11 V. Contrôle d'unité : Ω × A = V ✓ (l'ohm est DEFINI comme V/A). Piège : « U = R/I » donnerait des V/A² : unité sans sens : la position de R et I dans la formule est un grand classique d'inversion : mémoriser le TRIANGLE U/R×I.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "R = 100 Ω, U = 12 V. L'intensité I vaut :", "c": ["12 A", "1200 A", "0,12 A", "0,012 A"], "a": 2, "e": "I = U/R = 12/100 = 0,12 A.", "d": "<b>0,12 A</b> : I = U ÷ R.<div class='ex-detail'><u>Exemple rédigé</u> : la résistance FREINE : plus elle est grande, plus le courant est petit : 12 V « poussés » à travers 100 Ω : il ne passe que 0,12 A. Test de cohérence : avec R = 50 Ω (moitié) : I = 0,24 A (double) : la proportionnalité inverse marche. Piège : « 1200 A » multiplierait : c'est le court-circuit absolu (R quasi nulle) : les ordres de grandeur sécurisent : quelques mA à quelques A dans les circuits d'école.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "En SÉRIE, la tension du générateur est :", "c": ["la même partout", "nulle", "divisée par le nombre de dipôles", "la somme des tensions des dipôles"], "a": 3, "e": "Additivité : U = U₁ + U₂ + …", "d": "<b>La somme des tensions</b> des dipôles : U(générateur) = U₁ + U₂.<div class='ex-detail'><u>Exemple rédigé</u> : pile 9 V + 2 lampes identiques en série : chacune reçoit 4,5 V (et brille moins que seule) ; avec 3 lampes : 3 V chacune : la tension se PARTAGE en série. Piège croisé : SÉRIE : I unique + U partagée ; DÉRIVATION : U unique + I partagée : apprendre le tableau en bloc, pas mot à mot.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "L'effet Joule correspond à :", "c": ["le stockage d'énergie", "l'aimantation", "la production de lumière seule", "la conversion électricité ⟶ chaleur dans une résistance"], "a": 3, "e": "Toute résistance traversée par un courant chauffe : radiateur, grille-pain, filament.", "d": "<b>La conversion électricité ⟶ chaleur</b> dans les résistances.<div class='ex-detail'><u>Exemple rédigé</u> : applications : grille-pain (alliage à forte résistance), radiateur, cumulus, fusible (il fond grâce à Joule !), ampoule à incandescence (filament à 2500 °C). Inconvénients : pertes en ligne, chauffe des processeurs (ventilateur obligatoire). Piège : ce n'est pas une « perte » mystérieuse : c'est une CONVERSION : l'énergie électrique ne disparaît pas, elle devient chaleur.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "Un fusible de 2 A protège une ligne. Une surintensité de 24 A survient :", "c": ["le fusible stocke le courant", "la ligne chauffe sans limite", "rien ne se passe", "le fusible fond et ouvre le circuit"], "a": 3, "e": "Le fusible FOND (maillon faible volontaire) : circuit ouvert : tout s'arrête.", "d": "<b>Le fusible fond</b> et coupe le circuit.<div class='ex-detail'><u>Exemple rédigé</u> : scénario complet : court-circuit ⟹ I = 24 A : le fil du fusible (calibré 2 A) échauffe et FOND en une fraction de seconde : la boucle s'ouvre : les câbles sont sauvés. C'est pour ça qu'on ne « répare » jamais un fusible avec du papier alu (retour au danger initial). Piège : « stocke » : un fusible ne stocke RIEN : il se SACRIFIE : il faut le REMPLACER après avoir trouvé la cause de la panne.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "Un dipôle traverse 2 A sous 230 V. Sa puissance :", "c": ["23 W", "232 W", "460 W", "115 W"], "a": 2, "e": "P = U × I = 230 × 2 = 460 W.", "d": "<b>460 W</b> : P = U × I.<div class='ex-detail'><u>Exemple rédigé</u> : application aux prises : un convecteur de 2000 W sur 230 V appelle I = P/U = 2000/230 ≈ 8,7 A : d'où les calibres des disjoncteurs (16 A par circuit). Piège : « P = U/I » ou « U − I » : la puissance est un PRODUIT : tension ET intensité contribuent ensemble : plus de tension OU plus d'intensité = plus de puissance.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "Le voltmètre mesure la tension aux bornes d'une lampe. Il affiche :", "c": ["la résistance de la lampe", "la différence de « pression » électrique entre ses deux bornes", "la puissance", "l'intensité qui la traverse"], "a": 1, "e": "La tension U = l'écart électrique entre les deux bornes (en volts).", "d": "<b>La différence de tension entre les deux bornes</b> de la lampe (en volts).<div class='ex-detail'><u>Exemple rédigé</u> : image hydraulique : la tension = l'écart de hauteur d'eau entre deux points (ce qui POUSSE) ; l'intensité = le débit (ce qui COULE). Le voltmètre compare les deux bornes (branché à cheval, en dérivation) ; l'ampèremètre compte le flux (en série). Piège : « la résistance » se calcule (R = U/I pour un ohmique) ou se mesure avec un OHMMÈTRE (appareil dédié, circuit hors tension).</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "On double la tension aux bornes d'une résistance. L'intensité :", "c": ["est divisée par 2", "double (I = U/R)", "quadruple", "reste la même"], "a": 1, "e": "Proportionnalité : I = U/R : U ×2 ⟹ I ×2 (R fixe).", "d": "<b>Elle double</b> : proportionnalité de I à U (à R constante).<div class='ex-detail'><u>Exemple rédigé</u> : la caractéristique I-U d'un conducteur ohmique est une DROITE passant par l'origine : pente = 1/R. Exemple : R = 100 Ω : 6 V ⟹ 0,06 A ; 12 V ⟹ 0,12 A ; 24 V ⟹ 0,24 A. Piège : « quadruple » : ce serait P = U×I avec U×2 ET I×2 : la puissance, elle, quadruple bien (0,72 W ⟹ 2,88 W) : d'où l'étincelle quand on suralimente.</div>"},
{"t": "Électricité : tension, intensité et lois des circuits (3e)", "q": "Un nœud reçoit 0,3 A et 0,2 A. L'intensité qui repart :", "c": ["0,5 A", "0,3 A", "0,1 A", "0,6 A"], "a": 0, "e": "Loi des nœuds : 0,3 + 0,2 = 0,5 A repart.", "d": "<b>0,5 A</b> : I(repart) = I₁ + I₂ = 0,5 A.<div class='ex-detail'><u>Exemple rédigé</u> : formulation complète : deux branches ARRIVENT au nœud (0,3 + 0,2 = 0,5 A), une seule REPART (0,5 A) : le courant ne s'accumule pas au nœud : tout ce qui entre ressort (comme des voitures à un rond-point). Piège : « 0,1 A » soustrairait : c'est le calcul inverse (trouver une branche manquante à partir du total) : ici on demande le TOTAL : addition.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "La formule de l'énergie cinétique est :", "c": ["Ec = ½ × m × v", "Ec = ½ × m × v²", "Ec = m × v²", "Ec = m × v"], "a": 1, "e": "Ec = ½ × m × v² (joules si kg et m/s).", "d": "<b>Ec = ½ × m × v²</b>.<div class='ex-detail'><u>Exemple rédigé</u> : voiture 1000 kg à 20 m/s : Ec = 0,5 × 1000 × 400 = 200 000 J = 200 kJ. Le « v² » explique TOUT le chapitre sécurité : doubler la vitesse quadruple l'énergie à dissiper au choc. Piège : « ½ × m × v » oublierait le carré : c'est la quantité de mouvement (p = mv), une AUTRE grandeur (de 1re/terminale) : en 3e, c'est Ec avec son carré.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "On double la vitesse d'une voiture. Son Ec est :", "c": ["quadruplée", "doublée", "divisée par 2", "la même"], "a": 0, "e": "Ec ∝ v² : v ×2 ⟹ Ec ×4.", "d": "<b>Quadruplée</b> : le carré fait le travail (2² = 4).<div class='ex-detail'><u>Exemple rédigé</u> : 1000 kg : à 14 m/s : Ec ≈ 98 kJ ; à 28 m/s : Ec ≈ 392 kJ : ×4. Et ×3 sur la vitesse = ×9 sur Ec : à 150 km/h, la voiture « pèse » 9 fois son choc de 50 km/h. Piège : « doublée » : intuition linéaire FAUSSE : le monde physique de l'énergie est quadratique : c'est LE point du chapitre, évalué à chaque contrôle.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "Ec d'une voiture de 800 kg à 25 m/s :", "c": ["10 000 J", "250 000 J", "20 000 J", "100 000 J"], "a": 1, "e": "½ × 800 × 625 = 250 000 J.", "d": "<b>250 000 J</b> : Ec = 0,5 × 800 × 25² = 0,5 × 800 × 625.<div class='ex-detail'><u>Exemple rédigé</u> : étapes : ① v² = 25² = 625 ; ② × m : 800 × 625 = 500 000 ; ③ × ½ : 250 000 J = 250 kJ. Ordre de grandeur : une voiture en ville contient des centaines de kJ : l'équivalent d'une chute de dizaines de mètres. Piège : « 20 000 J » oublierait le carré (800 × 25 × ½ = 10 000... non : sans carré : 10 000) : le carré d'abord, la moitié ensuite, JAMAIS dans le désordre.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "La distance d'arrêt est la somme :", "c": ["distance parcourue + longueur du véhicule", "freinage + accélération", "distance de réaction + distance de freinage", "vitesse + temps"], "a": 2, "e": "Réaction (le temps de décider) + freinage (le temps de s'arrêter).", "d": "<b>Réaction + freinage</b> : deux phases successives.<div class='ex-detail'><u>Exemple rédigé</u> : à 50 km/h : réaction (~1 s : 14 m parcourus sans freiner) + freinage (~10-15 m) ⟹ ~25-30 m d'arrêt. Piège : « freinage seul » oublie la SECONDE d'inattention : pendant que le cerveau décide, la voiture file à sa vitesse : c'est la phase la plus meurtrière du téléphone au volant.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "La distance de réaction dépend de :", "c": ["le poids de la voiture", "les freins", "l'état du conducteur (alcool, fatigue, téléphone)", "l'état de la route"], "a": 2, "e": "C'est le temps de réaction du CONDUCTEUR qui la fixe (× sa vitesse).", "d": "<b>De l'état du CONDUCTEUR</b> : sobriété, fatigue, attention.<div class='ex-detail'><u>Exemple rédigé</u> : à 90 km/h (25 m/s) : sobre : 1 s ⟹ 25 m ; alcool/fatigue : 2-3 s ⟹ 50-75 m AVANT le frein : la moitié d'un terrain de football en plus. Piège : l'état de la route et des freins jouent sur la distance de FREINAGE : réaction = humain, freinage = machine/route : la distinction est un classique d'examen.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "À 90 km/h (25 m/s), temps de réaction 1 s : distance de réaction ?", "c": ["9 m", "90 m", "25 m", "250 m"], "a": 2, "e": "d = v × t = 25 × 1 = 25 m.", "d": "<b>25 m</b> : la voiture file à sa vitesse pendant la seconde de réflexe.<div class='ex-detail'><u>Exemple rédigé</u> : règle express : d(réaction) = v en m/s × 1 s = la valeur de la vitesse en m/s. Piège : « 90 m » confond km/h et m/s : pendant 1 s à 90 km/h, on parcourt 25 m (pas 90 !) : la conversion ÷3,6 est le premier réflexe de TOUT calcul du chapitre.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "Pourquoi les zones 30 km/h en ville ?", "c": ["les voitures y vont mieux", "un piéton heurté à 30 a ~10 % de risque de décès (vs ~80 % à 50)", "la police le préfère", "pour économiser du carburant"], "a": 1, "e": "L'énergie du choc (v²) chute : le corps survit beaucoup mieux à 30 km/h.", "d": "<b>Le piéton survit à 30 km/h</b> : la statistique décroît avec v².<div class='ex-detail'><u>Exemple rédigé</u> : derrière le chiffre : Ec = ½mv² : à 30 km/h (8,3 m/s), le choc d'un piéton dissipe ~4 fois moins d'énergie qu'à 50 km/h : les lésions passent de « souvent mortelles » à « souvent survivables ». Piège : « économie de carburant » : effet réel mais secondaire : la ZONE 30 est une mesure de SANTÉ PUBLIQUE fondée sur la physique du v².</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "Un camion (20 t) et une voiture (1 t) à la même vitesse :", "c": ["impossible à comparer", "même Ec", "le camion a 20 fois plus d'Ec", "la voiture a plus d'Ec"], "a": 2, "e": "Ec ∝ m à vitesse égale : 20 × plus pour le camion.", "d": "<b>Le camion a 20 fois plus d'Ec</b> : proportionnalité simple en masse.<div class='ex-detail'><u>Exemple rédigé</u> : à 25 m/s : voiture 1 t : 312 kJ ; camion 20 t : 6250 kJ : 6 fois l'énergie d'une petite bombe. Conséquence routière : distance de freinage d'un camion bien plus longue (freins dimensionnés, mais l'inertie gagne) : doubler un camion qui freine = mauvais plan. Piège : à vitesse égale, c'est la masse qui fait la différence (×20) : à masse égale, c'est le carré de la vitesse (×4 pour v×2) : les deux leviers séparés.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "Convertir 72 km/h en m/s :", "c": ["200 m/s", "20 m/s", "26 m/s", "72 m/s"], "a": 1, "e": "72 ÷ 3,6 = 20 m/s.", "d": "<b>20 m/s</b> : ÷ 3,6.<div class='ex-detail'><u>Exemple rédigé</u> : avant TOUTE formule avec v, la conversion est OBLIGATOIRE : 50 km/h = 13,9 ; 90 = 25 ; 130 = 36,1 m/s. Ordre de grandeur autoroutier : ~10 m/s = 36 km/h : une voiture « fait » 10 à 40 m chaque seconde. Piège : oublier la conversion multiplie Ec par 3,6² ≈ 13 : un résultat 13 fois trop grand : l'ordre de grandeur (des centaines de kJ pour une voiture, pas des millions) sauve la mise.</div>"},
{"t": "Énergie cinétique et sécurité routière (3e)", "q": "En cas de choc, les zones déformables de la voiture servent à :", "c": ["embellir le véhicule", "réduire le bruit", "absorber l'énergie en se déformant (à la place des passagers)", "rendre la voiture plus rapide"], "a": 2, "e": "La tôle qui se plie dissipe l'Ec : le temps d'arrêt s'allonge : force sur les corps réduite.", "d": "<b>Absorber l'énergie à la place des passagers</b> : la tôle se sacrifie.<div class='ex-detail'><u>Exemple rédigé</u> : logique : l'Ec doit disparaître : si la voiture est rigide, tout se passe en 0,02 s : forces ÉNORMES sur les corps ; si le capot se plie sur 0,5 m : l'arrêt dure 0,1-0,2 s : forces divisées par 5-10. La ceinture prolonge encore le temps, l'airbag amortit la tête : trio de survie. Piège : « voiture rigide = plus sûre » : archi-faux : la déformation programmée EST la sécurité (les voitures modernes se démolissent « bien »).</div>"},
{"t": "Poids et gravitation (3e)", "q": "Un objet de 500 g. Son poids sur Terre (g = 9,8 N/kg) vaut :", "c": ["4,9 N", "4900 N", "500 N", "49 N"], "a": 0, "e": "m = 0,5 kg : P = 0,5 × 9,8 = 4,9 N.", "d": "<b>P = 4,9 N</b> après conversion : 500 g = 0,5 kg.<div class='ex-detail'><u>Exemple rédigé</u> : étape indispensable : convertir en kg AVANT la formule (500 g = 500/1000 = 0,5 kg). Puis P = 0,5 × 9,8 = 4,9 N. Contrôle d'ordre de grandeur : un demi-kilo pèse ~5 N : cohérent. Piège : « 4900 N » oublierait la conversion (500 × 9,8) : c'est LE réflexe de conversion à automatiser : grammes ⟶ kilogrammes d'abord, formule ensuite.</div>"}];
var currentChap = null;
var META_BY_ID = {}; var FICHE_BY_ID = {};
COURS_META.forEach(function(c){ META_BY_ID[c.id] = c; });
FICHES_DATA.forEach(function(f){ FICHE_BY_ID[f.id] = f.fiche; });

function chapHeadHTML(m){
  return '<div class="chap-head"><span class="chap-title">⚗️ Physique-chimie — ' + esc(m.titre) + '</span>' +
    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();
  if (t === 'quiz') {
    var bar = document.getElementById('quiz-chapbar');
    if (currentChap && META_BY_ID[currentChap]) { bar.innerHTML = chapHeadHTML(META_BY_ID[currentChap]); startTraining(META_BY_ID[currentChap].theme); }
    else { bar.innerHTML = ''; state.mode = 'menu'; render(); }
  }
  if (t === 'prog' || t === 'cours') window.scrollTo({top:0});
}
function clearChap(){ currentChap = null; }

function goCours(id){
  currentChap = id;
  showTab('cours');
  window.scrollTo({top:0, behavior:'smooth'});
}
function goCoursList(){ currentChap = null; showTab('cours'); }

function ficheHTML(id, num, open){
  var m = META_BY_ID[id]; var f = FICHE_BY_ID[id];
  return '<details class="fiche" id="fiche-' + id + '"' + (open ? ' open' : '') + '>' +
    '<summary><span class="fiche-num">' + num + '</span> Fiche — ' + esc(m.titre) + ' <span class="niv" style="font-size:.7rem;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-weight:700;margin-left:6px">' + esc(m.niveau) + '</span></summary>' +
    '<div class="fiche-body">' +
    '<div class="fiche-actions"><button class="btn-pdf" onclick="printFiche(\'' + id + '\')">🖨️ Imprimer</button><button class="btn-pdf" onclick="fichePDF(\'' + id + '\')">📄 PDF</button></div>' +
    '<div class="print-title">Fiche synthétique — ' + esc(m.titre) + ' (' + esc(m.niveau) + ')</div>' +
    f +
    '</div></details>';
}

function renderFiches(){
  var z = document.getElementById('fiches-zone'); var h = '';
  if (currentChap && FICHE_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += ficheHTML(currentChap, 1, true);
  } else {
    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
    var i = 1;
    FICHES_DATA.forEach(function(f){ h += ficheHTML(f.id, i); i++; });
  }
  z.innerHTML = h;
}

var PDF_CP1252 = { 0x2018:0x91, 0x2019:0x92, 0x201A:0x82, 0x201C:0x93, 0x201D:0x94, 0x201E:0x84, 0x2013:0x96, 0x2014:0x97, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x20AC:0x80, 0x0152:0x8C, 0x0153:0x9C, 0x0160:0x8A, 0x0161:0x9A, 0x0178:0x9F, 0x017D:0x8E, 0x017E:0x9E, 0x192:0x83, 0x2C6:0x88, 0x2032:0xB4, 0x2039:0x8B, 0x203A:0x9B, 0x201E2:0 };
function pdfTranslit(s){
  return s.replace(/\u2212|\u2013|\u2014/g, '-').replace(/[\u2032\u2019]/g, "'")
    .replace(/\u2192|\u21D2|\u21A6/g, '->').replace(/\u2190/g, '<-')
    .replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u2260/g, '!=').replace(/\u2248/g, '~')
    .replace(/\u2208/g, ' in ').replace(/\u2205/g, 'vide').replace(/\u2286/g, 'incl.')
    .replace(/\u221A/g, 'V').replace(/\u00B7|\u2219|\u22C5/g, '*').replace(/\u2022/g, '-')
    .replace(/\u2124/g, 'Z').replace(/\u211D/g, 'R').replace(/\u2115/g, 'N').replace(/\u2119/g, 'P')
    .replace(/\u00A0/g, ' ').replace(/\u202F|\u2009|\u200B|\uFE0F/g, '')
    .replace(/[\u2460-\u2468]/g, function(c){ return (c.charCodeAt(0) - 0x2460 + 1) + ')'; })
    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
}
function pdfEnc(s){
  var out = '';
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }
    else if (PDF_CP1252[c] !== undefined) b = PDF_CP1252[c];
    if (b !== null && b !== undefined) out += String.fromCharCode(b);
  }
  return out;
}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
var PDF_INLINE = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, SMALL:1, SUB:1, SUP:1, A:1, CODE:1, ABBR:1 };
function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';
    } else if (c.nodeType === 1){
      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }
      else if (g === 'B' || g === 'STRONG') pdfSegs(c, true, out);
      else pdfSegs(c, bold, out);
    }
  }
}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'li') segs = [{ t: '- ', b: bold || false }].concat(segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;
  function walk(n){
    for (var c = n.firstChild; c; c = c.nextSibling){
      if (c.nodeType === 3){
        var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;
        var cl = ' ' + (c.className || '') + ' ';
        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }
        emitP();
        if (/^H[1-6]$/.test(g)) emitBlock('h', c, indent);
        else if (g === 'LI') emitBlock('li', c, indent + 16);
        else if (g === 'UL' || g === 'OL') {
          for (var li = c.firstChild; li; li = li.nextSibling){
            if (li.nodeType === 1 && li.tagName === 'LI') { emitBlock('li', li, indent + 16); walk(li); }
          }
        }
        else if (g === 'TABLE' || g === 'THEAD' || g === 'TBODY'){
          for (var tr = c.firstChild; tr; tr = tr.nextSibling){
            if (tr.nodeType !== 1) continue;
            if (tr.tagName === 'TR'){
              var cells = [];
              for (var td = tr.firstChild; td; td = td.nextSibling){
                if (td.nodeType === 1 && (td.tagName === 'TD' || td.tagName === 'TH')){
                  var cs = []; pdfSegs(td, td.tagName === 'TH', cs);
                  cells.push(cs.map(function(x){ return x.t; }).join('').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
                }
              }
              var line = cells.join('   |   ');
              if (line.replace(/\s/g, '') !== '') blocks.push({ type: 'p', segs: [{ t: line, b: false }], indent: indent + 8 });
            } else if (tr.tagName === 'THEAD' || tr.tagName === 'TBODY') walk(tr);
          }
        }
        else if (g === 'P') { emitBlock('p', c, indent); }
        else { var keep = indent; walk(c); indent = keep; }
      }
    }
    emitP();
  }
  walk(root);
  return blocks;
}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    var isTitle = b.type === 'title';
    var size = isTitle ? 15 : (b.type === 'h' ? 12 : 10.5);
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [];
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) words.push({ br: true });
        p.split(' ').forEach(function(w){ if (w !== '') words.push({ w: w, b: s.b }); });
        if (pi < parts.length - 1) {} else { words.push({ sp: true, b: s.b }); }
      });
    });
    var cur = [], len = 0;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, gap: isTitle ? 0 : (b.type === 'h' ? 7 : 4) }); cur = []; len = 0; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      if (wd.sp) { continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
    if (isTitle) lines.push({ rule: true });
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var pages = [], cur = [], y = TOP;
  lines.forEach(function(ln){
    if (ln.rule){
      if (y - 14 < M) { pages.push(cur); cur = []; y = TOP; }
      y -= 12;
      cur.push('0.29 0.27 0.9 RG 1.5 w ' + M + ' ' + y.toFixed(2) + ' m ' + (W - M) + ' ' + y.toFixed(2) + ' l S\n0 0 0 RG 1 w');
      y -= 8;
      return;
    }
    var lh = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh < M) { pages.push(cur); cur = []; y = TOP; }
    y -= (ln.gap || 0);
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      var enc = pdfEnc(pdfTranslit(s.t));
      if (!enc) return;
      cur.push('BT 1 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Tm /F' + (s.b ? 2 : 1) + ' ' + ln.size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
      x += 0.52 * ln.size * enc.length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres

  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';

      }

  v.innerHTML = '<section class="card"><h2>📋 Programme de physique-chimie</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + h + '</section>';
})();

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();
