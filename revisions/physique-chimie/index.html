{"t": "Mouvement et interactions : gravité et forces (1re)", "q": "Chute libre de 45 m (g ≈ 10, v₀ = 0) : durée ?", "c": ["4,5 s", "9 s", "3 s", "45 s"], "a": 2, "e": "t = √(2h/g) = √(2×45/10) = √9 = 3 s.", "d": "<b>3 s</b> : t = √(2h/g).<div class='ex-detail'><u>Exemple rédigé</u> : manipulation de h = ½gt² : isoler t² = 2h/g = 9 : t = 3 s : vitesse à l'arrivée : v = gt = 30 m/s (108 km/h !) : la chute de 45 m ne dure que 3 s : d'où la gravité des chantiers. Piège : « 9 s » : réponse = h/5 sans racine : le t est sous le CARRÉ dans la formule : la racine carrée est l'étape que tout le monde oublie.</div>"},
{"t": "Mouvement et interactions : gravité et forces (1re)", "q": "Un projectile lancé horizontalement : sa trajectoire est :", "c": ["une droite", "une verticale", "un cercle", "une parabole"], "a": 3, "e": "Avance uniforme (x) + chute accélérée (y) = parabole.", "d": "<b>Une parabole</b>.<div class='ex-detail'><u>Exemple rédigé</u> : décomposition : x = v₀t (uniforme : aucune force horizontale) ; y = ½gt² (chute) : en éliminant t : y ∝ x² : parabole. Applications : tir de basket, plongeon, jets d'eau des fontaines. Piège : « une droite » : ce serait le cas SANS gravité : la parabole EST la signature de la gravité sur un mouvement initial.</div>"},
{"t": "Mouvement et interactions : gravité et forces (1re)", "q": "Une voiture freine : l'accélération est :", "c": ["verticale", "nulle", "opposée au mouvement", "dans le sens du mouvement"], "a": 2, "e": "Freiner = diminuer v : a opposée à v (la résultante pointe vers l'arrière).", "d": "<b>Opposée au mouvement</b> : a et v de sens contraires.<div class='ex-detail'><u>Exemple rédigé</u> : bilan du freinage : forces horizontales : frottements routes/pneus vers l'ARRIÈRE : ΣF vers l'arrière : a vers l'arrière : v diminue. Le mouvement continue vers l'avant PENDANT que a pointe en arrière : a et v peuvent être opposés. Piège : croire que « l'accélération » signifie « aller plus vite » : en physique, accélérer = CHANGER v (en plus ou en moins) : le freinage est une accélération négative.</div>"},
{"t": "Mouvement et interactions : gravité et forces (1re)", "q": "L'interaction gravitationnelle entre deux corps :", "c": ["est mutuelle (chacun attire l'autre avec une force de même valeur)", "n'existe qu'au contact", "double si la distance double", "est unique (l'un attire l'autre)"], "a": 0, "e": "3e loi : actions réciproques : F(Terre/Lune) = F(Lune/Terre), opposées.", "d": "<b>Mutuelle</b> : deux forces opposées de même valeur.<div class='ex-detail'><u>Exemple rédigé</u> : la pomme attire la Terre autant que la Terre attire la pomme (même valeur !) : mais la Terre est 10²⁵ fois plus massive : son « recul » est invisible : les marées, c'est la Lune qui attire l'océan... et l'océan qui attire la Lune. Piège : « double si la distance double » : FAUX : F ∝ 1/d² : distance ×2 ⟹ force ÷4 : le carré encore lui.</div>"},
{"t": "Mouvement et interactions : gravité et forces (1re)", "q": "Un objet de 2 kg subit une résultante de 10 N. Son accélération :", "c": ["0,2 m/s²", "10 m/s²", "5 m/s²", "20 m/s²"], "a": 2, "e": "a = ΣF/m = 10/2 = 5 m/s².", "d": "<b>5 m/s²</b> : a = ΣF ÷ m.<div class='ex-detail'><u>Exemple rédigé</u> : sens de la loi : à force égale, la masse DOUBLE accélère DEUX FOIS MOINS : 10 N sur 2 kg ⟹ 5 m/s² ; sur 4 kg ⟹ 2,5 m/s² : l'inertie (la masse) résiste à la mise en mouvement. Piège : « 20 m/s² » multiplierait (F×m) : c'est m qui DIVISE : plus c'est lourd, plus c'est dur à bouger : la division traduit l'inertie.</div>"},
{"t": "Mouvement et interactions : gravité et forces (1re)", "q": "v = g·t en chute libre suppose :", "c": ["une masse nulle", "un frottement fort", "une pente", "une vitesse initiale nulle"], "a": 3, "e": "La formule v = gt vaut pour une chute SANS vitesse initiale.", "d": "<b>Une vitesse initiale nulle</b> (lâché, pas jeté).<div class='ex-detail'><u>Exemple rédigé</u> : généralisation : v = v₀ + gt : si v₀ = 0 (lâcher) : v = gt : si on LANCE vers le bas à 3 m/s : v = 3 + 10t : la formule simple est un CAS PARTICULIER. Piège : appliquer v = gt à un objet jeté vers le HAUT : au sommet, la vraie vitesse est 0... alors que gt vaudrait des m/s : toujours vérifier les conditions d'application d'une formule avant de s'en servir.</div>"},
{"t": "Mouvement et interactions : gravité et forces (1re)", "q": "Un ballon lancé horizontalement à 4 m/s de 2 m de haut (g ≈ 10) parcourt au sol environ :", "c": ["4 m", "2,5 m", "20 m", "8 m"], "a": 1, "e": "t = √(2×2/10) ≈ 0,63 s ; x = 4×0,63 ≈ 2,5 m.", "d": "<b>≈ 2,5 m</b> : chute (t) puis avance (x = v×t).<div class='ex-detail'><u>Exemple rédigé</u> : les deux colonnes indépendantes : vertical : t = √(2h/g) = √0,4 ≈ 0,63 s ; horizontal : x = 4 × 0,63 ≈ 2,5 m. La parabole : il descend de 2 m tout en avançant de 2,5 m. Piège : « 8 m » viendrait de x = v×t avec t = 2 s (temps faux : ce serait une chute de 20 m !) : la durée vient du VERTICAL, toujours.</div>"},
{"t": "Mouvement et interactions : gravité et forces (1re)", "q": "Sur la Lune, g ≈ 1,6 m/s². Une chute de 2 m dure :", "c": ["≈ 1,6 s", "0,32 s", "0,64 s", "2 s"], "a": 0, "e": "t = √(2h/g) = √(2×2/1,6) = √2,5 ≈ 1,6 s.", "d": "<b>≈ 1,6 s</b> (contre 0,64 s sur Terre).<div class='ex-detail'><u>Exemple rédigé</u> : comparaison : Terre : t = √(4/9,81) ≈ 0,64 s ; Lune : t = √(2×2/1,6) = √2,5 ≈ 1,58 s : 2,5 fois plus lent : les astronautes semblent flotter en marchant : leurs pas « tombent » lentement. Piège : « 0,64 s » : c'est la valeur TERRESTRE : la constante g du LIEU entre dans le calcul : changer d'astre change les chronologies, pas les formules.</div>"},
{"t": "Travail et énergie : puissance et transferts (1re)", "q": "Une force perpendiculaire au déplacement a un travail :", "c": ["infini", "nul", "négatif", "maximal"], "a": 1, "e": "cos(90°) = 0 : W = 0 (ex. poids sur un trajet horizontal).", "d": "<b>Nul</b> : W = F·d·cos(90°) = 0.<div class='ex-detail'><u>Exemple rédigé</u> : cas concret : porter un plateau horizontalement : la force de soutien est verticale, le déplacement horizontal : le poids et la réaction ne travaillent PAS : on se fatigue (muscles qui se contractent) mais sans TRANSFERT mécanique : la physique ne compte que ce qui est transféré. Piège : « négatif » : c'est le cas α > 90° (frein) : à 90° pile : rien du tout : une valeur EXACTE à connaître.</div>"},
{"t": "Travail et énergie : puissance et transferts (1re)", "q": "W = F·d·cos(α). F = 50 N, d = 4 m, α = 60° :", "c": ["100 J", "200 J", "173 J", "50 J"], "a": 0, "e": "W = 50 × 4 × 0,5 = 100 J.", "d": "<b>100 J</b> : cos(60°) = 0,5.<div class='ex-detail'><u>Exemple rédigé</u> : le cosinus « rabote » la force : seule la composante dans le sens du mouvement compte : 50 N à 60° : efficace comme 25 N en plein axe : 25 × 4 = 100 J. Piège : « 200 J » oublierait le cosinus (traction à 0°) : l'angle est TOUJOURS dans le problème : dessiner force et déplacement avant de calculer.</div>"},
{"t": "Travail et énergie : puissance et transferts (1re)", "q": "Le travail du poids en descente (dénivelée h) vaut :", "c": ["−mgh", "+mgh", "0", "mgd"], "a": 1, "e": "Le poids AIDE : W = +mgh (positif, moteur).", "d": "<b>+mgh</b> : en descente, le poids est moteur.<div class='ex-detail'><u>Exemple rédigé</u> : logique des signes : descente : le poids (vers le bas) et le déplacement s'accordent : W > 0 : la gravité « offre » mgh ; montée : elle s'oppose : W = −mgh : il faut PAYER mgh (l'ascenseur, le cycliste). Piège : « mgd » avec d = la LONGUEUR de pente : le poids ne voit que la DÉNIVELÉE verticale h : sur une piste de 100 m inclinée à 30° : W = mgh avec h = 50 m, pas d = 100.</div>"},
{"t": "Travail et énergie : puissance et transferts (1re)", "q": "Le travail du poids dépend :", "c": ["du chemin suivi", "du frottement", "de la dénivelée (verticale) seulement", "de la vitesse"], "a": 2, "e": "W(poids) = ±mgh : zigzag ou ligne droite : même h, même travail.", "d": "<b>De la dénivelée h seulement</b> : le chemin ne compte pas.<div class='ex-detail'><u>Exemple rédigé</u> : expérience de pensée : monter au 3e étage par l'escalier, par l'escalier de service ou en ascenseur : dans les trois cas W(poids) = −mgh : le poids est une force « conservatrice » : l'économie (travail moteur fourni) dépend du dispositif, pas de la géométrie du poids. Piège : le TRAVAIL DES FROTTEMENTS, lui, dépend du chemin (plus long = plus de pertes) : seules les forces conservatives ignorent l'itinéraire.</div>"},
{"t": "Travail et énergie : puissance et transferts (1re)", "q": "Théorème de l'énergie cinétique : ΣW =", "c": ["mv", "0", "ΔEc = Ec(f) − Ec(i)", "Ec finale"], "a": 2, "e": "La somme des travaux égale la VARIATION d'Ec.", "d": "<b>ΔEc = Ec(f) − Ec(i)</b> : la variation, pas la valeur.<div class='ex-detail'><u>Exemple rédigé</u> : usage : voiture qui freine : ΣW(frottements) = ½mv(f)² − ½mv(i)² : si elle s'arrête : ΣW = −½mv(i)² : les freins ont « effacé » toute l'Ec initiale. Piège : « Ec finale » : oublier le −Ec(initiale) fausse tout si l'objet avait déjà de la vitesse : le théorème parle de CHANGEMENT : toujours écrire le Δ.</div>"},
{"t": "Travail et énergie : puissance et transferts (1re)", "q": "Un skieur (70 kg) descend 40 m de dénivelée sans frottement, départ arrêté : vitesse en bas ?", "c": ["40 m/s", "28 m/s", "20 m/s", "14 m/s"], "a": 1, "e": "v = √(2gh) = √(2×9,81×40) ≈ 28 m/s.", "d": "<b>≈ 28 m/s</b> : v = √(2gh) ≈ √785.<div class='ex-detail'><u>Exemple rédigé</u> : chaîne : W(poids) = mgh (moteur, départ arrêté ⟹ Ec(initiale) = 0) : mgh = ½mv² : la MASSE SE SIMPLIFIE : v = √(2gh) : encore la leçon de la chute libre : 40 m ⟹ 28 m/s ≈ 100 km/h : d'où les zones de freinage. Piège : « 20 m/s » : possible si on oublie le ×2 ou prend g = 5 : le raccourci v = √(2gh) doit être su PAR CŒUR avec ses conditions (sans frottement !).</div>"},
{"t": "Travail et énergie : puissance et transferts (1re)", "q": "P = W/Δt. Monter 8830 J en 20 s :", "c": ["176 600 W", "442 W", "20 W", "44 W"], "a": 1, "e": "P = 8830/20 ≈ 442 W.", "d": "<b>≈ 442 W</b> : le même travail, deux fois plus vite = deux fois plus de puissance.<div class='ex-detail'><u>Exemple rédigé</u> : comparaison des temps : 60 s : 147 W (tranquille) ; 20 s : 442 W (sportif) ; 10 s : 883 W (champion) : le TRAVAIL ne change pas (8830 J pour monter 15 m), seule la CADENCE change : la puissance est l'intensité de l'effort, le travail sa quantité totale. Piège : « 176 600 W » multiplierait J × s : la division par le temps est le seul geste : W/s = watt.</div>"},
{"t": "Travail et énergie : puissance et transferts (1re)", "q": "Le travail d'une force de frottement est :", "c": ["parfois positif", "toujours positif", "toujours négatif (résistant)", "nul"], "a": 2, "e": "Le frottement s'oppose au déplacement : W = −F·d.", "d": "<b>Toujours négatif</b> (force résistante).<div class='ex-detail'><u>Exemple rédigé</u> : logique : le frottement pointe TOUJOURS contre le mouvement (α = 180° : cos = −1) : W = −F·d : il retire de l'énergie mécanique, convertie en CHALEUR (freins brûlants, mains qui chauffent en glissant sur une rampe). Piège : « parfois positif » : contre-exemple apparent : la roue motrice d'une voiture est poussée par le SOL vers l'avant : c'est une ACTION de contact, pas un « frottement dissipatif » : dans les exercices, « frottement » = dissipation, signe −.</div>"},
{"t": "Travail et énergie : puissance et transferts (1re)", "q": "Un objet glisse à vitesse CONSTANTE :", "c": ["impossible", "ΣW = 0 (vitesse inchangée ⟹ ΔEc = 0)", "ΣW < 0", "ΣW > 0"], "a": 1, "e": "ΔEc = 0 ⟹ la somme des travaux est nulle : moteur = résistant.", "d": "<b>ΣW = 0</b> : les travaux se compensent exactement.<div class='ex-detail'><u>Exemple rédigé</u> : la valise tirée à vitesse constante : W(traction) = +433 J ; W(frottement) = −433 J (forcément, pour que v soit constante) : le moteur paie exactement l'addition du frottement : aucun « bénéfice » en vitesse. Piège : « ΣW > 0 » accélèrerait l'objet (ΔEc > 0) : vitesse constante = équilibre énergétique parfait : c'est le théorème de l'Ec lu à l'envers.</div>"},
{"t": "Travail et énergie : puissance et transferts (1re)", "q": "P = F·v. Un moteur pousse 4000 N à 25 m/s :", "c": ["100 kW", "4000 W", "160 W", "10 kW"], "a": 0, "e": "P = 4000 × 25 = 100 000 W = 100 kW.", "d": "<b>100 kW</b> : P = F × v.<div class='ex-detail'><u>Exemple rédigé</u> : le couple fameux : à puissance constante (100 kW), plus la voiture va VITE, moins la force disponible est grande : F = P/v : à 25 m/s : 4000 N (accélérations franches) ; à 50 m/s : 2000 N (molle) : c'est pour ça qu'on passe les rapports : maintenir F dans la bonne plage. Piège : « 160 W » diviserait au lieu de multiplier : watt = N × m/s : le produit est cohérent avec les unités.</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Le transfert thermique spontané va :", "c": ["dans les deux sens", "du chaud vers le froid", "du froid vers le chaud", "jamais"], "a": 1, "e": "Toujours du plus chaud vers le plus froid, jusqu'à l'équilibre.", "d": "<b>Du chaud vers le froid</b> : jusqu'à l'égalité des températures.<div class='ex-detail'><u>Exemple rédigé</u> : langage piège : « ferme la porte, le froid entre » : physiquement, c'est le CHAUD qui sort (les particules agitées cèdent leur énergie à l'extérieur) : le froid n'est pas une substance, c'est une absence de chaud. Le frigo ne viole pas la règle : c'est une machine POMPANT le chaud (avec un compresseur, payé en électricité). Piège : « les deux sens » : spontanément JAMAIS : c'est la flèche du temps thermodynamique (2e principe).</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Le Soleil chauffe la Terre par :", "c": ["conduction", "rayonnement (traverse le vide)", "un câble", "convection"], "a": 1, "e": "Ondes électromagnétiques : seul mode qui franchit 150 millions de km de vide.", "d": "<b>Rayonnement</b> : la lumière (et l'infrarouge) transporte l'énergie dans le vide.<div class='ex-detail'><u>Exemple rédigé</u> : élimination : la conduction exige de la MATIÈRE en contact (pas de vide) ; la convection exige un FLUIDE qui bouge (idem) : seul le rayonnement (infrarouge essentiellement) traverse le vide : la Terre reçoit ~1361 W/m² perpendiculairement au Soleil : toute la vie en dépend. Piège : « convection » marche dans l'atmosphère (brises) mais pas depuis le Soleil : le mode se lit dans le MILIEU traversé.</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Q = m·c·ΔT. Chauffer 2 kg d'eau de 10 °C (c = 4185) :", "c": ["83 700 J", "8370 J", "20 925 J", "4185 J"], "a": 0, "e": "Q = 2 × 4185 × 10 = 83 700 J.", "d": "<b>83 700 J</b> (≈ 84 kJ).<div class='ex-detail'><u>Exemple rédigé</u> : lecture de la formule : la masse (2 kg), la capacité (4185 : l'eau est une éponge thermique), l'écart (10 °C) : le produit. Comparaison : le même 84 kJ chaufferait 2 kg d'ALUMINIUM de 10 °C beaucoup plus « facilement » ? Non : c(Al) = 900 : Q = 18 000 J : chauffer l'eau coûte ~4,6× plus cher que l'aluminium. Piège : confondre m et ΔT : l'IDENTIFICATION des facteurs compte plus que leur ordre.</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "L'air chaud qui monte au-dessus d'un radiateur illustre :", "c": ["la convection", "la conduction", "le rayonnement", "l'évaporation"], "a": 0, "e": "La matière (air) se déplace en transportant la chaleur : convection.", "d": "<b>La convection</b> : mouvement de matière + chaleur embarquée.<div class='ex-detail'><u>Exemple rédigé</u> : mécanisme : l'air chauffé SE DILATE (moins dense) ⟹ il s'élève ; l'air refroidi près de la vitre retombe : boucle de convection : mêmes causes dans la météo (brises, Gulf Stream), l'ébullition (roulements d'eau dans la casserole), le manteau terrestre (dérive des continents !). Piège : la conduction, elle, se fait SANS déplacement de matière (la barre de métal chauffe à l'autre bout en restant immobile).</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "La température mesure :", "c": ["le volume", "l'agitation moyenne des particules", "la masse", "la quantité de chaleur totale"], "a": 1, "e": "T traduit l'énergie cinétique microscopique MOYENNE.", "d": "<b>L'agitation moyenne des particules</b>.<div class='ex-detail'><u>Exemple rédigé</u> : distinction clé : un lac à 20 °C contient une ÉNERGIE interne énorme (des milliards de milliards de particules à 20 °C) ; une flamme à 500 °C, peu de masse : le lac est « froid » au thermomètre, mais son réservoir est géant : T = intensive (ne dépend pas de la quantité) ; U = extensive (masse comptée). Piège : « quantité de chaleur totale » : c'est U/Q : confondre T et Q fausse les raisonnements de mélange (les températures ne s'additionnent PAS).</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Pendant la fusion de la glace à 0 °C :", "c": ["rien ne se passe", "la température reste 0 °C (l'énergie casse les liaisons)", "la température monte", "la température descend"], "a": 1, "e": "Q = m·Lf : l'énergie sert au changement d'état, pas à l'agitation.", "d": "<b>La température reste 0 °C</b> : l'énergie sert à défaire le réseau.<div class='ex-detail'><u>Exemple rédigé</u> : expérience : glaçon dans une casserole sur le feu : thermomètre bloqué à 0 °C TANT QUE la glace reste : ensuite, la T remonte : l'énergie de fusion (Lf = 334 kJ/kg : 80× plus que chauffer 1 kg d'eau de 1 °C !) est un « péage » entre deux phases. Piège : « la température monte » : le mélange eau/glace est à T CONSTANTE pendant toute la fusion : l'énergie passe, le thermomètre ne bouge pas.</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "La conduction thermique se fait :", "c": ["par électronique", "par déplacement de matière", "par ondes", "de proche en proche sans déplacement de matière"], "a": 3, "e": "Les particules agitées cognent leurs voisines : l'énergie passe, la matière reste.", "d": "<b>De proche en proche, sans déplacement de matière</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'expérience de la cuillère dans la soupe : le manche chauffe (conduction le long du métal) ; la soupe, elle, circule (convection) : la main brûlée par le manche METAL (bon conducteur) pas par le manche BOIS (isolant) : d'où les ustensiles à double matière. Piège : « par ondes » : c'est le RAYONNEMENT, troisième mode : conduction (contact fixe), convection (matière mobile), rayonnement (à distance/vide).</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Pourquoi l'eau est-elle un bon fluide caloporteur (radiateurs, centrales) ?", "c": ["elle est transparente", "elle est légère", "elle est gratuite", "sa capacité thermique est très élevée (elle stocke beaucoup par °C)"], "a": 3, "e": "c = 4185 J/(kg·°C) : 1 kg d'eau transporte ~4 kJ par degré.", "d": "<b>Sa capacité thermique est très élevée</b> : 4185 J/(kg·°C).<div class='ex-detail'><u>Exemple rédigé</u> : sens pratique : pour la MÊME masse et le MÊME ΔT, l'eau transporte ~4× plus d'énergie que l'air (c(air) = 1005) et ~4,6× plus que l'aluminium : un circuit d'eau chaude est un « camion » d'énergie compact : radiateurs et réacteurs nucléaires reposent dessus. Conséquence mondiale : les océans = régulateurs climatiques (lenteur à chauffer = lenteur à refroidir : les côtes ont des hivers doux).</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Un transfert thermique de 515 kJ est fourni par une résistance de 2000 W : durée ?", "c": ["51,5 s", "258 s", "2,6 s", "1 030 000 s"], "a": 1, "e": "t = Q/P = 515 000/2000 ≈ 258 s.", "d": "<b>≈ 258 s</b> (4,3 min).<div class='ex-detail'><u>Exemple rédigé</u> : le triangle du chauffage : t = Q/P : la puissance est un DÉBIT d'énergie (2000 J par seconde) : pour livrer 515 000 J, il faut 515 000/2000 secondes : la bouilloire réaliste (~4 min). Piège : « 51,5 s » : un facteur 10 (mauvaise conversion kJ→J) : toujours convertir les kJ en J AVANT la division : l'unité de P est le watt = J/s, pas kJ/s.</div>"},
{"t": "Transferts thermiques et énergie interne (1re)", "q": "Mélanger 1 L d'eau à 80 °C et 1 L à 20 °C (sans pertes) : T finale ?", "c": ["50 °C", "100 °C", "60 °C", "30 °C"], "a": 0, "e": "Mêmes masses, même c : moyenne des températures : 50 °C.", "d": "<b>50 °C</b> : l'équilibre se fait à la moyenne.<div class='ex-detail'><u>Exemple rédigé</u> : bilan : le chaud cède Q = m·c·(80−T) ; le froid reçoit Q = m·c·(T−20) : égalité (conservation) ⟹ 80−T = T−20 ⟹ 2T = 100 ⟹ T = 50 °C. Piège : « 100 °C » additionnerait : la température n'est pas une substance qui se cumule : c'est l'ÉNERGIE qui se conserve, puis la T d'équilibre en découle (la moyenne pondérée par les masses et les capacités).</div>"},
{"t": "Acides et bases : pH et réactions acido-basiques (Terminale)", "q": "pH = −log[H₃O⁺]. Une solution à pH = 3 a une concentration en H₃O⁺ de :", "c": ["3 mol/L", "10³ mol/L", "0,3 mol/L", "10⁻³ mol/L"], "a": 3, "e": "[H₃O⁺] = 10⁻ᵖʰ = 10⁻³ mol/L.", "d": "<b>10⁻³ mol/L</b> : pH et concentration sont liés par un log.<div class='ex-detail'><u>Exemple rédigé</u> : la formule inversée : [H₃O⁺] = 10^(−pH) : pH 3 ⟹ 10⁻³ mol/L. Piège : « 3 mol/L » confondrait la valeur et son exposant : le log « range » les puissances de dix dans le pH : 10⁻³ est ACIDE (fort), 10⁻⁷ neutre, 10⁻¹¹ basique.</div>"},
{"t": "Acides et bases : pH et réactions acido-basiques (Terminale)", "q": "Une solution passe de pH 4 à pH 6 par dilution : [H₃O⁺] a été :", "c": ["divisée par 100", "divisée par 2", "inchangée", "multipliée par 100"], "a": 0, "e": "2 unités de pH = facteur 10² = 100.", "d": "<b>Divisée par 100</b> : chaque unité de pH = facteur 10.<div class='ex-detail'><u>Exemple rédigé</u> : pH 4 : [H₃O⁺] = 10⁻⁴ ; pH 6 : 10⁻⁶ : rapport = 10⁻⁴/10⁻⁶ = 100 : la dilution a été ×100 (et non ×2 !). Piège : croire que le pH est proportionnel : il est LOGARITHMIQUE : « le pH a doublé de 3 à 6 » en langage courant signifie en chimie « 1000 fois moins acide » : l'échelle piège l'intuition.</div>"},
{"t": "Acides et bases : pH et réactions acido-basiques (Terminale)", "q": "Un acide fort est un acide dont la réaction avec l'eau est :", "c": ["totale", "lente", "partielle", "impossible"], "a": 0, "e": "Totalement dissocié dans l'eau (HCl, HNO₃) : flèche ⟶.", "d": "<b>Totale</b> : toutes les molécules cèdent leur proton.<div class='ex-detail'><u>Exemple rédigé</u> : conséquence pratique : acide fort C = 0,01 mol/L ⟹ [H₃O⁺] = C : pH = 2. Acide faible même C : dissociation partielle (~1 % pour l'éthanoïque) : [H₃O⁺] ≈ 10⁻⁵ : pH ≈ 3. Piège : « fort » ≠ « concentré » : la force qualifie la RÉACTION (totale/partielle), la concentration la QUANTITÉ : HCl très dilué reste un acide FORT peu concentré.</div>"},
{"t": "Acides et bases : pH et réactions acido-basiques (Terminale)", "q": "Couple de l'eau oxygénée H₂O₂ :", "c": ["H₂O₂/HO⁻", "H₂O₂/H₂O", "H₂O/HO⁻", "H₃O⁺/H₂O"], "a": 2, "e": "H₂O₂ est l'acide du couple H₂O₂/HO₂⁻... mais le couple de l'eau est H₂O/HO⁻.", "d": "<b>Attention, question piège corrigée :</b> le couple classique de l'eau est H₂O/HO⁻ (l'eau acide) et H₃O⁺/H₂O (l'eau base).<div class='ex-detail'><u>Exemple rédigé</u> : l'eau est AMPHOTÈRE : elle réagit comme base avec HCl (HCl + H₂O ⟶ H₃O⁺ + Cl⁻) et comme acide avec NH₃ (NH₃ + H₂O ⟶ NH₄⁺ + HO⁻) : les deux couples coexistent : H₃O⁺/H₂O et H₂O/HO⁻ : c'est le pivot de toute la chimie acide-base en solution aqueuse.</div>"},
{"t": "Acides et bases : pH et réactions acido-basiques (Terminale)", "q": "Titrage : C(acide) = ? avec V(acide) = 20 mL, C(base) = 0,10 mol/L, V(équivalence) = 15 mL", "c": ["0,075 mol/L", "1,5 mol/L", "0,13 mol/L", "0,10 mol/L"], "a": 0, "e": "C = C(b)·V(E)/V(a) = 0,10×15/20 = 0,075 mol/L.", "d": "<b>0,075 mol/L</b> : C₁V₁ = C₂V₂ à l'équivalence.<div class='ex-detail'><u>Exemple rédigé</u> : le produit en croix : l'acide dosé (20 mL, C inconnue) a été neutralisé par 15 mL de base à 0,10 : n(base) = 0,10 × 0,015 = 1,5×10⁻³ mol = n(acide) : C(acide) = 1,5×10⁻³/0,020 = 0,075 mol/L. Piège : inverser le rapport (0,13) : toujours partir des MOLES de base vers les moles d'acide : l'équivalence est un bilan de matière.</div>"},
{"t": "Acides et bases : pH et réactions acido-basiques (Terminale)", "q": "À l'équivalence d'un titrage :", "c": ["la solution est neutre", "la réaction s'arrête", "le pH vaut toujours 7", "les réactifs sont dans les proportions stoechiométriques"], "a": 3, "e": "Définition : proportions stoechiométriques ; le pH n'est 7 que pour acide fort + base forte.", "d": "<b>Proportions stoechiométriques</b> (ni plus ni moins).<div class='ex-detail'><u>Exemple rédigé</u> : titrons l'acide éthanoïque (faible) par la soude : à l'équivalence, tout l'acide est devenu CH₃COO⁻, une BASE faible : la solution est BASIQUE (pH ~8,7) : le pH 7 ne caractérise que le couple fort/fort. Piège : « pH toujours 7 » : c'est LE contresens du titrage : l'équivalence est un événement de STOECHIOMÉTRIE, pas de neutralité.</div>"},
{"t": "Acides et bases : pH et réactions acido-basiques (Terminale)", "q": "La réaction CH₃COOH + HO⁻ ⟶ CH₃COO⁻ + H₂O est :", "c": ["une précipitation", "une réaction d'oxydoréduction", "une combustion", "un transfert de proton (acido-basique)"], "a": 3, "e": "L'acide cède H⁺ à la base : réaction acido-basique.", "d": "<b>Acido-basique</b> : transfert de proton H⁺.<div class='ex-detail'><u>Exemple rédigé</u> : repère infaillible : les DEUX membres font apparaître un couple AH/A⁻ du même élément (CH₃COOH/CH₃COO⁻ d'un côté, H₂O/HO⁻ de l'autre) : l'acide 1 + base 2 ⟶ base 1 + acide 2. En oxydoréduction, ce sont les degrés d'oxydation (nombres) qui changent : ici, aucun électron échangé : que des protons.</div>"},
{"t": "Acides et bases : pH et réactions acido-basiques (Terminale)", "q": "Le pH d'une solution neutre à 25 °C :", "c": ["0", "14", "1", "7"], "a": 3, "e": "[H₃O⁺] = [HO⁻] = 10⁻⁷ : pH = 7.", "d": "<b>7</b> à 25 °C : autoprotolyse de l'eau équilibrée.<div class='ex-detail'><u>Exemple rédigé</u> : l'eau pure se dissocie très peu : H₂O + H₂O ⇌ H₃O⁺ + HO⁻ avec [H₃O⁺] = [HO⁻] = 10⁻⁷ mol/L : pH = −log(10⁻⁷) = 7. Piège : ce 7 dépend de la TEMPÉRATURE (à 0 °C : ~7,5 ; à 100 °C : ~6,1 : l'eau bouillante n'est pas « acide » pour autant) : le « neutre » suit le produit ionique de l'eau, pas une valeur absolue.</div>"},
{"t": "Acides et bases : pH et réactions acido-basiques (Terminale)", "q": "Un pH-mètre est étalonné avec :", "c": ["des solutions tampon de pH connues", "rien", "du vinaigre", "de l'eau distillée"], "a": 0, "e": "Deux ou trois solutions étalons (pH 4, 7, 10) avant toute mesure.", "d": "<b>Solutions tampon étalons</b> (pH 4,00 : 7,00 : 10,00).<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi : une électrode dérive avec le temps et la température : sans étalonnage à 2 points, les mesures sont décalées de plusieurs dixièmes : en TP, on étalonne AVANT la manip et on rince l'électrode entre chaque solution (goutte résiduelle = contamination). Piège : « eau distillée » : elle absorbe le CO₂ de l'air et devient légèrement acide (pH ~5,6) : ce n'est pas une référence.</div>"},
{"t": "Acides et bases : pH et réactions acido-basiques (Terminale)", "q": "Vinaigre titré : 10 mL dosés par 12,5 mL de soude 0,100 mol/L. Concentration ?", "c": ["0,080 mol/L", "0,125 mol/L", "0,010 mol/L", "1,25 mol/L"], "a": 1, "e": "C = 0,100 × 12,5/10 = 0,125 mol/L.", "d": "<b>0,125 mol/L</b> dans l'échantillon dilué.<div class='ex-detail'><u>Exemple rédigé</u> : le protocole complet : pipette 10 mL de vinaigre dilué, bécher, pH-mètre, burette de soude : courbe pH/V : équivalence à 12,5 mL : C = 0,100×12,5/10 = 0,125 mol/L. Si le vinaigre avait été dilué ×10 au départ : vrai vinaigre = 1,25 mol/L : c'est ainsi que les laboratoires contrôlent les étiquettes « 8° ».</div>"},
{"t": "Cinétique chimique : vitesse de réaction (Terminale)", "q": "La vitesse de réaction v = dx/dt se détermine graphiquement par :", "c": ["la pente de la tangente à la courbe x(t)", "la hauteur du plateau", "l'axe des ordonnées", "l'aire sous la courbe"], "a": 0, "e": "La dérivée = pente de la tangente à l'instant considéré.", "d": "<b>La pente de la tangente</b> à x = f(t).<div class='ex-detail'><u>Exemple rédigé</u> : en TP : on trace la tangente au point voulu (à t = 0 pour la vitesse INITIALE), on prend deux points de cette droite : v = Δx/Δt. La vitesse décroissant, les tangentes s'abaissent au fil du temps : le plateau final a une pente NULLE : la réaction est finie. Piège : la corde entre deux points donne la vitesse MOYENNE, pas l'instantanée.</div>"},
{"t": "Cinétique chimique : vitesse de réaction (Terminale)", "q": "Le temps de demi-réaction t½ est la durée pour :", "c": ["que le catalyseur agisse", "que la moitié du réactif limitant soit consommée (x = xF/2)", "que la réaction dure la moitié du temps", "diviser la température par 2"], "a": 1, "e": "x atteint la moitié de son avancement final.", "d": "<b>Atteindre x = xF/2</b>.<div class='ex-detail'><u>Exemple rédigé</u> : lecture pratique : si le plateau (xF) est atteint à 60 min, t½ est l'abscisse du point d'ordonnée xF/2 : souvent quelques minutes seulement : la moitié du travail se fait au DÉBUT (vitesse maximale), l'autre moitié étalée : la fin de réaction « traîne ». Piège : « la moitié du temps total » : c'est l'inverse : t½ est généralement BEAUCOUP plus court que la moitié de la durée totale.</div>"},
{"t": "Cinétique chimique : vitesse de réaction (Terminale)", "q": "Un catalyseur :", "c": ["accélère la réaction sans être consommé et sans changer xF", "change l'état final", "ralentit la réaction", "est consommé par la réaction"], "a": 0, "e": "Il ouvre un chemin réactionnel plus rapide : intact à la fin.", "d": "<b>Accélère sans être consommé</b>, xF inchangé.<div class='ex-detail'><u>Exemple rédigé</u> : images : le pot catalytique platine (voitures, 10 ans de service), l'enzyme catalase (une même molécule traite des millions de substrats), le fer de l'ammoniac industriel : le catalyseur est un « facilitateur » qui resort intact : il ne fournit PAS d'énergie, il ABÂISSE la barrière (activation). Piège : « change l'état final » : il ne fait qu'arriver PLUS VITE au même endroit.</div>"},
{"t": "Cinétique chimique : vitesse de réaction (Terminale)", "q": "Augmenter la température d'une réaction chimique :", "c": ["ne change rien", "augmente la vitesse (collisions plus fréquentes et plus énergiques)", "diminue la vitesse", "stoppe la réaction"], "a": 1, "e": "+10 °C ≈ vitesse ×2 à ×3 : règle empirique classique.", "d": "<b>Augmente la vitesse</b> : molécules plus agitées et chocs plus énergiques.<div class='ex-detail'><u>Exemple rédigé</u> : le frigo applique l'inverse : à 4 °C, les réactions de spoilage des aliments ralentissent fortement (d'où la conservation) ; à 20 °C, le lait tourne en quelques jours : cuisson, quarantaine, respiration cellulaire : la vie ENTIERE est gérée par cette sensibilité thermique. Piège : la température ne rend pas une réaction « impossible » à froid : elle la ralentit : tout finit par arriver, même à 4 °C (d'où les DLC).</div>"},
{"t": "Cinétique chimique : vitesse de réaction (Terminale)", "q": "La vitesse de réaction est généralement :", "c": ["croissante", "constante", "maximale au début puis décroissante", "nulle au début"], "a": 2, "e": "Les réactifs sont concentrés au début : plus de collisions efficaces : la vitesse décroît ensuite.", "d": "<b>Maximale au début, puis décroissante</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la courbe type : forte montée initiale, genou, plateau : la pente (vitesse) est raide à t = 0 (réactifs abondants), s'affaiblit à mesure qu'ils s'épuisent, s'annule au plateau (réactif limitant épuisé). Piège : « nulle au début » : c'est le moment où elle est la PLUS GRANDE : la pente de la tangente à l'origine est la vitesse INITIALE, donnée clé des exercices.</div>"},
{"t": "Cinétique chimique : vitesse de réaction (Terminale)", "q": "Suivre une réaction produisant un gaz peut se faire en mesurant :", "c": ["la pression du gaz émis", "le pH", "la masse du récipient fermé", "la couleur du gaz"], "a": 0, "e": "Pression (enceinte fermée), volume d'eau déplacé, ou perte de masse (CO₂ qui s'échappe).", "d": "<b>La pression</b> (ou le volume/perte de masse).<div class='ex-detail'><u>Exemple rédigé</u> : un réacteur fermé : P augmente proportionnellement à la quantité de gaz (loi des gaz) : le capteur de pression trace la courbe de réaction en direct. Variante ouverte : la balance affiche la perte (CO₂ s'échappe : la masse chute : menthe + soda). Chaque grandeur mesurable qui suit l'avancement = un « traqueur » de réaction.</div>"},
{"t": "Cinétique chimique : vitesse de réaction (Terminale)", "q": "La spectrophotométrie permet de suivre une réaction si :", "c": ["il y a un précipité blanc", "le milieu devient coloré (produit ou réactif absorbant)", "la réaction est lente", "la température monte"], "a": 1, "e": "L'absorbance est proportionnelle à la concentration de l'espèce colorée : A(t) trace la réaction.", "d": "<b>Une espèce absorbe la lumière</b> (produit coloré en général).<div class='ex-detail'><u>Exemple rédigé</u> : diiode I₂ jaune-brune formé par la réaction iodate/iodure : A(t) mesurée toutes les 30 s : la courbe A(t) est la réplique de x(t) (Beer-Lambert : A = kC) : on lit la cinétique SANS prélever ni doser. Piège : la technique exige une couleur : un produit incolore (eau, CO₂) est invisible au spectrophotomètre : choisir le traqueur selon la réaction.</div>"},
{"t": "Cinétique chimique : vitesse de réaction (Terminale)", "q": "Vitesse moyenne si x passe de 2 mmol à 6 mmol entre 4 et 14 min :", "c": ["0,6 mmol/min", "6 mmol/min", "0,4 mmol/min", "0,04 mmol/min"], "a": 2, "e": "v = Δx/Δt = 4 mmol / 10 min = 0,4 mmol/min.", "d": "<b>0,4 mmol/min</b> : variation d'avancement sur durée.<div class='ex-detail'><u>Exemple rédigé</u> : définition : v(moy) = (x₂−x₁)/(t₂−t₁) = (6−2)/(14−4) = 4/10 = 0,4 mmol/min : c'est la PENTE DE LA CORDE entre les deux points (à ne pas confondre avec la tangente = vitesse instantanée). Piège : « 0,6 » diviserait par la durée depuis t = 0 (6/10) : la vitesse moyenne se calcule SUR L'INTERVALLE, origine exclue.</div>"},
{"t": "Cinétique chimique : vitesse de réaction (Terminale)", "q": "Un catalyseur modifie la vitesse de réaction en :", "c": ["diluant les réactifs", "fournissant de l'énergie", "augmentant la température", "abaissant la barrière énergétique (nouveau chemin réactionnel)"], "a": 3, "e": "Le chemin catalysé demande moins d'énergie d'activation : plus de collisions réussissent.", "d": "<b>Il abaisse l'énergie d'activation</b> via un nouveau mécanisme.<div class='ex-detail'><u>Exemple rédigé</u> : image du col de montagne : le réactif doit franchir un col (activation) : le catalyseur construit un TUNNEL (autre itinéraire, moins haut) : davantage de molécules « passent » à la même température : la vitesse grimpe sans dépense d'énergie. Piège : « fournit de l'énergie » : il n'en fournit AUCUNE (il ressort intact) : d'où son efficacité industrielle : accélérer sans chauffer.</div>"},
{"t": "Cinétique chimique : vitesse de réaction (Terminale)", "q": "Augmenter la concentration des réactifs accélère la réaction car :", "c": ["les collisions efficaces sont plus fréquentes", "la température monte", "le catalyseur est plus actif", "les molecules sont plus lourdes"], "a": 0, "e": "Plus de particules par volume = plus de rencontres par seconde.", "d": "<b>Plus de collisions efficaces par seconde</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la réaction est un jeu de rencontres : à C doublée, chaque molécule rencontre deux fois plus de partenaires : statistiquement, deux fois plus de chocs utiles : la vitesse double (à peu près). Applications : la combustion est plus vive en oxygène pur qu'en air (21 %) : d'où le danger des atmosphères enrichies. Piège : la concentration ne change PAS la nature des molécules, seulement leur densité de rencontre : la température, elle, change l'ÉNERGIE des chocs.</div>"},
{"t": "Synthèse organique : estérification et polymères (Terminale)", "q": "L'estérification est la réaction entre :", "c": ["deux alcools", "un acide et une base forte", "un acide carboxylique et un alcool", "deux esters"], "a": 2, "e": "Acide + alcool ⇌ ester + eau.", "d": "<b>Acide carboxylique + alcool</b> ⟶ ester + eau.<div class='ex-detail'><u>Exemple rédigé</u> : CH₃COOH + C₅H₁₁OH ⇌ CH₃COO−C₅H₁₁ + H₂O : l'arôme de banane en flacon : la réaction est LENTE (1 h de reflux) et LIMITÉE : même parfaitement menée, elle plafonne ~67 % : c'est un équilibre, pas une transformation totale. Piège : « acide + base » donnerait un SEL et de l'eau (neutralisation), pas un ester parfumé : ne pas confondre les deux chimies de l'eau.</div>"},
{"t": "Synthèse organique : estérification et polymères (Terminale)", "q": "Le chauffage à reflux sert à :", "c": ["refroidir la réaction", "chauffer sans perdre de matière (les vapeurs se condensent)", "mesurer la température", "accélérer l'évaporation"], "a": 1, "e": "On chauffe (facteur cinétique) tout en condensant les vapeurs qui retombent dans le milieu.", "d": "<b>Chauffer sans perdre de matière</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le dilemme : la chaleur accélère, mais alcool et ester sont volatils : sans précaution, ils s'envolent (perte de rendement ET de sécurité) : le réfrigérant à eau condense toute vapeur qui monte : elle retombe goutte à goutte : « reflux » = retour. Piège : le reflux n'EST PAS la synthèse : c'est le GESTE qui permet le facteur cinétique température en système fermé matériel.</div>"},
{"t": "Synthèse organique : estérification et polymères (Terminale)", "q": "Le rendement d'une estérification est limité car :", "c": ["l'alcool s'évapore", "le catalyseur est trop faible", "la réaction est un équilibre (ester + eau ⟶ acide + alcool aussi)", "l'ester est instable"], "a": 2, "e": "Réaction LIMITÉE : elle atteint un équilibre (~67 % pour un mélange 1:1).", "d": "<b>C'est un équilibre</b> : la réaction inverse coexiste.<div class='ex-detail'><u>Exemple rédigé</u> : à partir d'un certain avancement, ester + eau régénèrent acide + alcool AUSSI VITE que la synthèse : le système fige : ~67 % (mélange équimolaire). Pour faire mieux : éliminer l'eau au fur et à mesure ou mettre un réactif en excès : on DÉPLACE l'équilibre, on ne l'annule pas. Piège : mettre plus de catalyseur change la VITESSE, jamais la position d'équilibre.</div>"},
{"t": "Synthèse organique : estérification et polymères (Terminale)", "q": "Le groupe caractéristique −COOH signale :", "c": ["un alcool", "une cétone", "un ester", "un acide carboxylique"], "a": 3, "e": "Groupe carboxyle : acides carboxyliques (vinaigre, acide citrique).", "d": "<b>Un acide carboxylique</b> (groupe carboxyle).<div class='ex-detail'><u>Exemple rédigé</u> : le réflexe de lecture : −COOH sur une chaîne ⟹ famille acide ⟹ réactions possibles : neutralisation par une base, estérification avec un alcool. Ne pas confondre : −OH seul ⟹ alcool ; −COO− entre deux chaînes ⟹ ester ; −CHO en bout ⟹ aldéhyde. La formule développée est une CARTE D'IDENTITÉ réactionnelle : lire les groupes = prédire la chimie.</div>"},
{"t": "Synthèse organique : estérification et polymères (Terminale)", "q": "Polyaddition du polystyrène : la double liaison du monomère :", "c": ["disparaît par combustion", "se transforme en eau", "s'ouvre pour créer les liaisons de chaîne", "reste intacte"], "a": 2, "e": "C=C s'ouvre : chaque monomère s'additionne au précédent, SANS éliminer de molécule.", "d": "<b>S'ouvre pour former la chaîne</b>.<div class='ex-detail'><u>Exemple rédigé</u> : mécanisme : l'initiateur crée un site actif, le monomère C=C s'y additionne, la chaîne grandit pas à pas : n monomères ⟶ 1 macromolécule : RIEN n'est perdu (contrairement à la polycondensation qui élimine de l'eau) : d'où la masse : M(polymère) = n × M(monomère) exactement. Piège : si l'énoncé dit qu'un polymère « libère de l'eau », c'est une POLYCONDENSATION (nylon, PET), pas une polyaddition.</div>"},
{"t": "Synthèse organique : estérification et polymères (Terminale)", "q": "Le nylon est obtenu par :", "c": ["polycondensation (avec élimination d'eau)", "estérification simple", "combustion", "polyaddition"], "a": 0, "e": "Acide dicarboxylique + diamine ⟶ polyamide + n H₂O.", "d": "<b>Polycondensation</b> : chaque liaison amide élimine une molécule d'eau.<div class='ex-detail'><u>Exemple rédigé</u> : mécanisme : le groupe −COOH rencontre −NH₂ : ils se lient en −CONH− (amide) en crachant H₂O : répété sur des monomères DOUBLES (deux fonctions chacun), l'enchaînement s'étend en fibres : le nylon 6,6 (1935) : bas, tapis, cordes. Test discriminant dans les exercices : petite molécule éliminée ⟹ condensation : rien perdu ⟹ addition.</div>"},
{"t": "Synthèse organique : estérification et polymères (Terminale)", "q": "L'éthanoate de pentyle sent la banane. C'est :", "c": ["un polymère", "un alcool", "un ester", "un acide"], "a": 2, "e": "Ester (éthanoate de pentyle) : arôme banane, synthétisé en TP.", "d": "<b>Un ester</b> : l'éthanoate de pentyle.<div class='ex-detail'><u>Exemple rédigé</u> : décryptage du nom : « éthanoate » = la partie acide (acide éthanoïque) ; « de pentyle » = la partie alcool (pentan-ol) : le nom EST la recette. Les esters sont les arômes de l'industrie (banane, ananas, poire, solvant à ongles pour l'éthanoate d'éthyle) : la parfumerie moderne est une filière de la chimie des esters.</div>"},
{"t": "Synthèse organique : estérification et polymères (Terminale)", "q": "Motif du polyéthylène : −(CH₂−CH₂)ₙ−. Chaîne de n = 5000 : masse molaire ?", "c": ["5000 g/mol", "28 g/mol", "70 000 g/mol", "140 000 g/mol"], "a": 3, "e": "M = n × M(motif) = 5000 × 28 = 140 000 g/mol.", "d": "<b>140 000 g/mol</b> : 5000 motifs de 28 g/mol.<div class='ex-detail'><u>Exemple rédigé</u> : le motif C₂H₄ pèse 28 g/mol (2×12 + 4×1) : la macromolécule = la répétition : 5000 × 28 = 140 000 : une seule « molécule » pèse comme 5000 éthylènes : ces masses colossales expliquent la solidité des plastiques (enchevêtrement des longues chaînes). Piège : « 28 » serait la masse du MONOMÈRE, pas du polymère : toujours multiplier par n.</div>"},
{"t": "Synthèse organique : estérification et polymères (Terminale)", "q": "Pour améliorer le rendement d'une estérification, on peut :", "c": ["refroidir", "ajouter plus de catalyseur", "agiter moins", "éliminer l'eau au fur et à mesure"], "a": 3, "e": "Retirer un produit déplace l'équilibre vers la droite (principe de Le Chatelier).", "d": "<b>Éliminer l'eau</b> (ou excès d'un réactif).<div class='ex-detail'><u>Exemple rédigé</u> : l'équilibre acide + alcool ⇌ ester + eau : si on CAPTURE l'eau (tamis moléculaire, Dean-Stark), la réaction inverse manque de carburant : l'équilibre se décale vers l'ester : rendement > 90 %. Piège : « plus de catalyseur » : accélère les DEUX sens (direct et inverse) : on arrive PLUS VITE au même 67 % : catalyseur = vitesse, équilibre = position.</div>"},
{"t": "Synthèse organique : estérification et polymères (Terminale)", "q": "Le groupe −COO− entre deux chaînes carbonées signale :", "c": ["un alcool", "un acide", "un ester", "une amine"], "a": 2, "e": "C'est la signature du groupe ester (issu de l'estérification).", "d": "<b>Un ester</b>.<div class='ex-detail'><u>Exemple rédigé</u> : détection : −COO− SANS hydrogène sur l'oxygène = ester ; avec un H (−COOH) = acide ; −OH sur carbone = alcool. La petite lettre « H » change tout : acide (réagit avec bases, métaux) vs ester (arômes, gras) : les corps gras sont des TRIESTERS du glycérol : l'huile d'olive est une famille d'esters : lire un H en plus ou en moins, c'est changer de famille chimique.</div>"},
{"t": "Cinématique : vecteurs vitesse et accélération (Terminale)", "q": "Le vecteur vitesse d'un point mobile est :", "c": ["vertical", "tangent à la trajectoire", "dirigé vers le centre", "perpendiculaire à la trajectoire"], "a": 1, "e": "Toujours tangent à la trajectoire, dans le sens du mouvement.", "d": "<b>Tangent à la trajectoire</b>, orienté dans le sens du mouvement.<div class='ex-detail'><u>Exemple rédigé</u> : sur une chronophotographie, on le construit entre deux positions proches : origine = la position, direction = la corde (qui devient tangente quand les positions se resserrent) : sa valeur = distance/Δt. Piège : la vitesse n'est JAMAIS perpendiculaire au trajet : elle le LONGE : c'est la dérivée de la position, qui ne peut « pointer » ailleurs.</div>"},
{"t": "Cinématique : vecteurs vitesse et accélération (Terminale)", "q": "x(t) = 5 + 4t + 2t². L'accélération aₓ vaut :", "c": ["2 m/s²", "4 m/s²", "4t", "5 m/s²"], "a": 1, "e": "v = 4 + 4t ⟹ a = 4 m/s² (constante).", "d": "<b>4 m/s²</b> : dérivée seconde de x.<div class='ex-detail'><u>Exemple rédigé</u> : dérivation en cascade : x = 5 + 4t + 2t² ⟹ v = 4 + 4t ⟹ a = 4 : les règles : constante ⟹ 0 : terme en t ⟹ son coefficient : terme en t² ⟹ dérivé deux fois (2t² ⟹ 4t ⟹ 4). Piège : « 2 » prendrait le coefficient du t² pour l'accélération : c'est le coefficient de la dérivée SECONDE multiplié par 2 (½a = 2 ⟹ a = 4) : toujours dériver DEUX FOIS.</div>"},
{"t": "Cinématique : vecteurs vitesse et accélération (Terminale)", "q": "Mouvement circulaire UNIFORME : l'accélération est :", "c": ["nulle", "centripète, a = v²/R", "tangente", "verticale"], "a": 1, "e": "La valeur de v est constante mais sa direction tourne : a = v²/R vers le centre.", "d": "<b>Centripète : a = v²/R</b> (non nulle !).<div class='ex-detail'><u>Exemple rédigé</u> : voiture à 20 m/s dans un virage R = 50 m : a = 400/50 = 8 m/s² : le compteur est fixe mais le VOLANT tourne : le vecteur vitesse pivote en permanence : cette rotation EST une accélération (dérivée du vecteur, pas de sa norme). Piège : « nulle » : c'est l'erreur conceptuelle du chapitre : uniforme ⟹ norme constante ⟹ mais direction variable ⟹ accélération centripète.</div>"},
{"t": "Cinématique : vecteurs vitesse et accélération (Terminale)", "q": "72 km/h en m/s :", "c": ["7,2 m/s", "26 m/s", "20 m/s", "200 m/s"], "a": 2, "e": "÷3,6 : 72/3,6 = 20 m/s.", "d": "<b>20 m/s</b> : diviser par 3,6.<div class='ex-detail'><u>Exemple rédigé</u> : le pourquoi du 3,6 : 1 h = 3600 s : 72 km = 72 000 m : 72 000/3600 = 20 : le facteur 3,6 vient de 3600/1000. Repères : 3,6 km/h = 1 m/s ; 90 km/h = 25 m/s ; 130 km/h ≈ 36 m/s. Piège : « 26 m/s » = 72×3,6 inversé (multiplier au lieu de diviser) : TOUS les calculs de mécanique se font en m/s : la conversion est la première ligne de toute copie.</div>"},
{"t": "Cinématique : vecteurs vitesse et accélération (Terminale)", "q": "Sur une chronophotographie (Δt = 0,1 s), deux positions successives distantes de 25 cm : vitesse ?", "c": ["0,4 m/s", "0,25 m/s", "25 m/s", "2,5 m/s"], "a": 3, "e": "v = 0,25/0,1 = 2,5 m/s.", "d": "<b>2,5 m/s</b> : distance/Δt (tout en m et s).<div class='ex-detail'><u>Exemple rédigé</u> : la méthode d'exploitation : convertir (25 cm = 0,25 m), diviser par l'intervalle (0,1 s), tracer le vecteur tangent : c'est la vitesse MOYENNE sur l'intervalle, très proche de l'instantanée si les points sont serrés. Piège : « 25 m/s » oublierait les cm ; « 0,025 » confondrait intervalle et fréquence : l'exploitation d'une chronophotographie commence TOUJOURS par les conversions.</div>"},
{"t": "Cinématique : vecteurs vitesse et accélération (Terminale)", "q": "Un mobile a v(t) = 3 + 6t. À t = 2 s, sa vitesse vaut :", "c": ["12 m/s", "15 m/s", "6 m/s", "9 m/s"], "a": 1, "e": "v(2) = 3 + 12 = 15 m/s.", "d": "<b>15 m/s</b> : remplacer t par 2 dans l'expression.<div class='ex-detail'><u>Exemple rédigé</u> : lecture : v₀ = 3 m/s (départ déjà lancé) ; a = 6 m/s² (la pente de v(t)) : chaque seconde ajoute 6 m/s : à t = 2 : 3 + 6×2 = 15. Piège : « 12 m/s » = seul le terme 6t : le terme constant 3 est le reste d'un mouvement déjà entamé : la vitesse s'AJOUTE, elle ne se remplace pas.</div>"},
{"t": "Cinématique : vecteurs vitesse et accélération (Terminale)", "q": "L'accélération d'un objet lancé vers le haut (chute libre) est :", "c": ["nulle au sommet", "vers le bas (g)", "horizontale", "vers le haut"], "a": 1, "e": "Toujours a = g vers le bas, y compris à la montée et au sommet.", "d": "<b>Vers le bas : a = g</b>, en permanence.<div class='ex-detail'><u>Exemple rédigé</u> : au sommet de la trajectoire, la vitesse s'annule UNE seconde, mais l'accélération, ELLE, reste g vers le bas : c'est elle qui fait « virer » le mouvement (redescendre) : v = 0 n'implique PAS a = 0. Piège : « nulle au sommet » : confusion v/a classique : la dérivée de la vitesse (la pente de v(t)) vaut −g à tout instant, même là où la courbe v(t) croise l'axe.</div>"},
{"t": "Cinématique : vecteurs vitesse et accélération (Terminale)", "q": "Le mouvement est décrit par rapport à :", "c": ["la Terre uniquement", "un référentiel (point de vue)", "l'objet lui-même", "le vide"], "a": 1, "e": "Un référentiel : terrestre, géocentrique ou héliocentrique selon le cas.", "d": "<b>Un référentiel</b> : le mouvement est relatif au point de vue.<div class='ex-detail'><u>Exemple rédigé</u> : assis dans un TGV, vous êtes immobile dans le référentiel du train, en mouvement à 300 km/h dans le référentiel terrestre : les deux descriptions sont exactes, chacune dans SON référentiel. Choix usuel : terrestre (TP, mouvements proches), géocentrique (satellites, Lune), héliocentrique (planètes). Piège : « la Terre uniquement » : pour un satellite, le référentiel terrestre donne une trajectoire absurde : choisir le référentiel adapté, c'est le prérequis de tout l'exercice.</div>"},
{"t": "Cinématique : vecteurs vitesse et accélération (Terminale)", "q": "Un mobile décrit un cercle de rayon 25 m à 15 m/s (vitesse constante). Son accélération :", "c": ["15 m/s² tangentielle", "9 m/s² centripète", "0,6 m/s²", "nulle"], "a": 1, "e": "a = v²/R = 225/25 = 9 m/s², dirigée vers le centre.", "d": "<b>9 m/s² centripète</b> : a = v²/R.<div class='ex-detail'><u>Exemple rédigé</u> : calcul : v = 15 m/s, R = 25 m : a = 15²/25 = 225/25 = 9 m/s² (proche de g : un manège qui tourne « tasse » presque comme une chute). Piège : « nulle » refait l'erreur du mouvement uniforme : la NORME de v est fixe mais le vecteur TOURNE : la rotation du vecteur est une variation : accélération centripète, jamais tangentielle en mouvement uniforme.</div>"},
{"t": "Cinématique : vecteurs vitesse et accélération (Terminale)", "q": "v(t) = 20 − 4t (m/s). Le mouvement est :", "c": ["uniforme", "impossible à décrire", "uniformément ralenti (a = −4 m/s²)", "uniformément accéléré"], "a": 2, "e": "v décroît linéairement : a = −4 m/s² constante : freinage.", "d": "<b>Uniformément ralenti</b> : a = −4 m/s² constant.<div class='ex-detail'><u>Exemple rédigé</u> : lecture du graphe v(t) : droite descendante de pente −4 : la dérivée vaut −4 à chaque instant : accélération constante NÉGATIVE (opposée au mouvement) : le mobile s'arrête à t = 5 s (v = 0). Piège : « uniformément accéléré » : la pente NÉGATIVE signale le ralentissement : le signe de a comparé à celui de v tranche : a et v de même sens ⟹ accélération ; sens opposés ⟹ freinage.</div>"},
{"t": "Deuxième loi de Newton et mouvements dans un champ uniforme (Terminale)", "q": "Dans un champ de pesanteur uniforme, un projectile (sans frottement) a une accélération :", "c": ["croissante", "g, vers le bas, constante", "nulle", "horizontale"], "a": 1, "e": "Seul le poids : a = g constant vers le bas, pendant tout le vol.", "d": "<b>a = g constante</b>, à la montée, au sommet comme à la descente.<div class='ex-detail'><u>Exemple rédigé</u> : au SOMMET, v = 0 mais a = g : c'est elle qui fait rebasculer la trajectoire : la flèche du mouvement n'est jamais « en pause ». Piège : « nulle au sommet » : confusion vitesse/accélération : l'accélération ne s'annule que si la force s'annule : ici le poids agit en permanence.</div>"},
{"t": "Deuxième loi de Newton et mouvements dans un champ uniforme (Terminale)", "q": "La composante horizontale de la vitesse d'un projectile :", "c": ["diminue", "augmente", "s'inverse", "reste constante"], "a": 3, "e": "Aucune force horizontale ⟹ vₓ = v₀cos(α) constant.", "d": "<b>Reste constante</b> : l'axe horizontal ne connaît aucune force.<div class='ex-detail'><u>Exemple rédigé</u> : la décomposition : la gravité est verticale : ΣFₓ = 0 ⟹ aₓ = 0 ⟹ vₓ figée : le ballon avance à vitesse constante TOUT en tombant : la parabole vient du mélange « horizontal uniforme + vertical accéléré ». Piège : « diminue » : c'est l'intuition du frottement : sans frottement, rien ne freine l'horizontal : la résistance de l'air est le seul coupable réel.</div>"},
{"t": "Deuxième loi de Newton et mouvements dans un champ uniforme (Terminale)", "q": "Portée maximale d'un lancer (sans frottement, départ au sol) pour un angle de :", "c": ["90°", "45°", "60°", "30°"], "a": 1, "e": "x(max) = v₀²sin(2α)/g : maximale quand sin(2α) = 1, donc α = 45°.", "d": "<b>45°</b> : le compromis parfait hauteur/distance.<div class='ex-detail'><u>Exemple rédigé</u> : la formule : portée = v₀²sin(2α)/g : à 90° (tir vertical) : sin(180°) = 0 : le projectile retombe sur place : à 30° et 60° : sin(60°) = sin(120°) : MÊME portée (angles complémentaires !) : à 45° : le sommet du sinus. Les artilleurs et les joueurs de pétanque le savent : l'expérience rejoint la formule.</div>"},
{"t": "Deuxième loi de Newton et mouvements dans un champ uniforme (Terminale)", "q": "Un électron dans un champ E uniforme subit une force :", "c": ["opposée à E (charge négative)", "dans le sens de E", "perpendiculaire à E", "nulle"], "a": 0, "e": "F = qE avec q < 0 : la force est opposée au champ.", "d": "<b>Opposée à E</b> : q(électron) = −e.<div class='ex-detail'><u>Exemple rédigé</u> : conséquence visuelle : entre deux plaques, le champ E pointe du + vers le − : l'électron « tombe » vers la plaque POSITIVE (attraction) : un proton, lui, suivrait E. Piège : « dans le sens de E » : vrai pour les charges POSITIVES : le signe de q oriente la force : c'est toute la différence d'électron/proton en déviation.</div>"},
{"t": "Deuxième loi de Newton et mouvements dans un champ uniforme (Terminale)", "q": "La 2e loi de Newton en projection sur un axe donne :", "c": ["une énergie", "ΣF = ma sur cet axe (une équation du mouvement)", "une température", "une équation sur les positions"], "a": 1, "e": "Projeter le vecteur : les sommes algébriques des forces = m × accélération sur l'axe.", "d": "<b>ΣF(axe) = m·a(axe)</b> : le pont forces ⟹ équations.<div class='ex-detail'><u>Exemple rédigé</u> : en chute : axe vertical : P = ma ⟹ a = g : en deviation électrique : qE = ma ⟹ a = qE/m : chaque axe livre UNE équation différentielle simple (a constante ici) : intégrer deux fois (v puis x) avec les conditions initiales : la mécanique de Terminale est un algorithme : bilan ⟹ projection ⟹ intégration.</div>"},
{"t": "Deuxième loi de Newton et mouvements dans un champ uniforme (Terminale)", "q": "Un mobile subit des forces qui se compensent. Son mouvement (référentiel galiléen) :", "c": ["tourne", "est rectiligne uniforme (ou immobile)", "accélère", "ralentit"], "a": 1, "e": "ΣF = 0 ⟹ a = 0 : vitesse (vectorielle) constante.", "d": "<b>Rectiligne uniforme ou au repos</b> : principe d'inertie.<div class='ex-detail'><u>Exemple rédigé</u> : c'est la 2e loi à la puissance zéro : a = ΣF/m = 0/m = 0 : la vitesse ne CHANGE pas (ni en valeur, ni en direction) : le palet de hockey glisse indéfiniment sans frottement. Piège : « ralentit » : sans force, rien ne freine : le ralentissement quotidien vient des frottements, qui sont des FORCES : l'inertie n'est jamais « consommée ».</div>"},
{"t": "Deuxième loi de Newton et mouvements dans un champ uniforme (Terminale)", "q": "Un ballon frappé à 20 m/s et 30° : durée du vol (g ≈ 10) ?", "c": ["0,5 s", "2,0 s", "4,0 s", "1,0 s"], "a": 1, "e": "t = 2v₀sin(α)/g = 2×10/10 = 2,0 s.", "d": "<b>2,0 s</b> : montée 1 s + descente 1 s.<div class='ex-detail'><u>Exemple rédigé</u> : décomposition : v_y(0) = 20×sin(30°) = 10 m/s : au sommet v_y = 0 (t = v_y/g = 1 s) : symétrie : descente = montée : total 2 s. La portée : vₓ × 2 = 17,3 × 2 ≈ 35 m. Piège : « 1,0 s » serait le temps du SOMMET seulement : le vol complet va du sol au sol : la symétrie parabolique double la montée.</div>"},
{"t": "Deuxième loi de Newton et mouvements dans un champ uniforme (Terminale)", "q": "Dans la méthode de Newton, après le bilan des forces et la projection, on :", "c": ["calcule une énergie", "intègre deux fois (a ⟹ v ⟹ position)", "dessine uniquement", "mesure la vitesse"], "a": 1, "e": "L'accélération s'intègre : v(t) puis x(t), avec les conditions initiales.", "d": "<b>On intègre deux fois</b> : a(t) ⟹ v(t) ⟹ position(t).<div class='ex-detail'><u>Exemple rédigé</u> : l'algorithme complet sur la chute : ① P = ma ⟹ a = −g ② v(t) = v₀ − gt (constante d'intégration = v₀) ③ y(t) = y₀ + v₀t − ½gt² (constantes = y₀) : chaque intégration ressort une constante : ce sont les conditions initiales : les intégrer dans la réponse est ce qui distingue une copie complète.</div>"},
{"t": "Deuxième loi de Newton et mouvements dans un champ uniforme (Terminale)", "q": "Un électron traverse des plaques (E uniforme) avec une vitesse horizontale : sa trajectoire entre les plaques est :", "c": ["verticale", "parabolique", "droite", "circulaire"], "a": 1, "e": "Horizontale uniforme + « chute » électrique accélérée : parabole, comme le projectile.", "d": "<b>Parabolique</b> : l'analogue électrique du projectile.<div class='ex-detail'><u>Exemple rédigé</u> : transposition : champ vertical ⟹ force verticale constante ⟹ accélération verticale constante : vₓ intacte, v_y croît : la courbe EST une parabole (oscilloscope, tube cathodique) : la physique du XVIIe siècle (projectiles) pilote la technologie du XXe (écrans). Piège : « circulaire » : il faudrait une force TOUJOURS perpendiculaire à v (champ magnétique, hors programme ici).</div>"},
{"t": "Deuxième loi de Newton et mouvements dans un champ uniforme (Terminale)", "q": "La portée d'un tir à v₀ = 15 m/s et α = 45° (g ≈ 10, départ au sol) vaut environ :", "c": ["11,3 m", "22,5 m", "45 m", "7,5 m"], "a": 1, "e": "x = v₀²sin(2α)/g = 225×1/10 = 22,5 m.", "d": "<b>≈ 22,5 m</b> : v₀²/g à 45°.<div class='ex-detail'><u>Exemple rédigé</u> : formule directe : x = v₀²sin(2×45°)/g = 225 × sin(90°)/10 = 22,5 m. Contrôle de cohérence : lancer une balle à 15 m/s (~54 km/h) en cloche ⟹ ~22 m : conforme à l'expérience du terrain de jeu. Piège : « 11,3 » : moitié (oublier le sin(2α) = 1 : prendre sin(α)) : la formule de portée est un réflexe à connaître PAR CŒUR avec ses conditions (sol plat, pas de frottement).</div>"},
{"t": "Énergies mécaniques : conservation et transferts (Terminale)", "q": "Em = Ec + Epp se conserve si :", "c": ["le mobile est lourd", "il y a des frottements", "seules des forces conservatives agissent (pas de frottement)", "aucune force ne travaille"], "a": 2, "e": "Sans frottement : les conversions Ec ⇄ Epp se font à somme constante.", "d": "<b>Sans frottement</b> (forces conservatives seulement).<div class='ex-detail'><u>Exemple rédigé</u> : le grand huit idéal : en haut : Epp maximale ; en bas : Ec maximale : la SOMME ne bouge pas : l'attraction redistribue sans taxer. Dès que des frottements existent : ΔEm = W(frott) < 0 : l'énergie fuit en chaleur : Em décroît. Piège : « aucune force ne travaille » : le poids travaille (c'est lui qui alimente le jeu) : il est CONSERVATIF : son travail se stocke en Epp : c'est la nature dissipative qui compte, pas l'absence de travail.</div>"},
{"t": "Énergies mécaniques : conservation et transferts (Terminale)", "q": "Une bille de 200 g tombe de 5 m sans vitesse initiale : vitesse à l'arrivée (sans frottement, g ≈ 10) ?", "c": ["5 m/s", "14 m/s", "10 m/s", "50 m/s"], "a": 2, "e": "mgh = ½mv² ⟹ v = √(2gh) = √100 = 10 m/s.", "d": "<b>10 m/s</b> : v = √(2gh).<div class='ex-detail'><u>Exemple rédigé</u> : la voie énergie : Epp(0) = mgh = 0,2×10×5 = 10 J : tout devient Ec : ½×0,2×v² = 10 ⟹ v² = 100 ⟹ v = 10 m/s. Remarquer : la MASSE s'est simplifiée : tout objet (lourd ou léger) arrive à la même vitesse en chute libre. Piège : « 50 m/s » : v² = 100, pas v = 100 : la racine carrée encore et toujours.</div>"},
{"t": "Énergies mécaniques : conservation et transferts (Terminale)", "q": "Avec frottements, l'énergie mécanique d'un mobile qui glisse :", "c": ["reste constante", "oscille", "augmente", "diminue (part en chaleur)"], "a": 3, "e": "ΔEm = W(frottements) < 0 : dissipation thermique.", "d": "<b>Diminue</b> : la différence part en chaleur.<div class='ex-detail'><u>Exemple rédigé</u> : toboggan réel : départ 900 J, arrivée 375 J : 525 J ont chauffé le pantalon et la surface : rien n'est DÉTRUIT (premier principe) mais l'énergie mécanique, elle, se dégrade (elle se disperse : second principe) : c'est pour ça qu'on doit pousser régulièrement une balançoire. Piège : « reste constante » : c'est le cas SANS frottement : l'énoncé « avec frottements » tranche.</div>"},
{"t": "Énergies mécaniques : conservation et transferts (Terminale)", "q": "Epe = ½kx². Un ressort k = 200 N/m comprimé de 10 cm stocke :", "c": ["0,1 J", "10 J", "1,0 J", "2,0 J"], "a": 2, "e": "½ × 200 × (0,10)² = 1,0 J.", "d": "<b>1,0 J</b> : la déformation en MÈTRES.<div class='ex-detail'><u>Exemple rédigé</u> : le piège de l'unité : x = 10 cm = 0,10 m (OBLIGATOIRE) : ½×200×0,01 = 1,0 J. Relâché, il lance une bille de 50 g à v = √(2×1,0/0,05) ≈ 6,3 m/s. Piège : « 10 J » : oublier la conversion cm ⟹ m (x = 10 au carré donne 100 !) : dans ½kx², le x en mètres est source d'un facteur 100 d'erreur : LE piège du ressort.</div>"},
{"t": "Énergies mécaniques : conservation et transferts (Terminale)", "q": "Au sommet de sa trajectoire, un projectile (sans frottement) a :", "c": ["Ec nulle (toute l'énergie est en Epp)", "Epp nulle", "Ec maximale", "Em nulle"], "a": 0, "e": "v_y = 0 : Ec minimale (il reste vₓ !) et Epp maximale.", "d": "<b>Ec minimale, Epp maximale</b> (et Em constante).<div class='ex-detail'><u>Exemple rédigé</u> : la nuance : la vitesse VERTICALE s'annule, mais la composante HORIZONTALE vₓ subsiste : Ec = ½mvₓ² ≠ 0 au sommet (sauf tir vertical pur) : Em se répartit sans cesse entre Ec et Epp : au sommet, Epp prend le maximum POSSIBLE. Piège : « Em nulle » : Em est CONSERVÉE, jamais nulle (elle vaut sa valeur initiale, donnée du lancer).</div>"},
{"t": "Énergies mécaniques : conservation et transferts (Terminale)", "q": "Théorème de l'énergie cinétique :", "c": ["Em = Epp", "Ec = mg", "W(ΣF) = ΔEc", "W = mv"], "a": 2, "e": "La somme des travaux égale la variation d'énergie cinétique.", "d": "<b>W(ΣF) = ΔEc</b>.<div class='ex-detail'><u>Exemple rédigé</u> : freinage d'une voiture : W(frottements) = −f×d = 0 − ½mv² : d = mv²/(2f) : la distance de freinage croît comme le CARRÉ de la vitesse (doubler v ⟹ freinage ×4) : c'est LA justification physique des limitations. Piège : « W = mv » : la force relie la variation du CARRÉ de v : la vitesse apparaît toujours au carré dans l'énergie.</div>"},
{"t": "Énergies mécaniques : conservation et transferts (Terminale)", "q": "Un wagon (1000 kg) arrive à 2 m/s et s'écrase contre un butoir (ressort k = 50 000 N/m). Compression maximale ?", "c": ["0,40 m", "4,0 m", "2,0 m", "0,28 m"], "a": 3, "e": "½mv² = ½kx² ⟹ x = √(mv²/k) = √(4000/50000) = 0,28 m.", "d": "<b>≈ 0,28 m</b> : x = √(mv²/k).<div class='ex-detail'><u>Exemple rédigé</u> : conversion : Ec = ½×1000×4 = 2000 J ; Epe(max) = ½×50 000×x² = 2000 ⟹ x² = 0,08 ⟹ x ≈ 0,28 m. Toute l'écriture : ½mv² = ½kx² : les ½ se simplifient : x = v√(m/k). Piège : « 0,40 m » viendrait d'un k mal reporté : toujours réécrire la conservation AVANT de remplacer, puis vérifier l'ordre de grandeur (un butoir de triage comprime de quelques dizaines de cm).</div>"},
{"t": "Énergies mécaniques : conservation et transferts (Terminale)", "q": "Epp = mgh dépend :", "c": ["du chemin suivi", "du référentiel uniquement", "de la vitesse", "du choix de l'origine des altitudes"], "a": 3, "e": "L'altitude zéro est arbitraire : Epp est définie « à une constante près ».", "d": "<b>De l'origine choisie</b> : Epp est relative.<div class='ex-detail'><u>Exemple rédigé</u> : au rez-de-chaussée : Epp = 0 ? Ou au fond du sous-sol ? Le physicien CHOISIT sa référence : ce qui est physique (mesurable), c'est la VARIATION ΔEpp = mgΔh : elle ne dépend PAS de l'origine : en exercice, fixer l'origine (souvent le point le plus bas) et s'y tenir : toute la suite est cohérente. Piège : comparer deux Epp d'origines différentes n'a AUCUN sens.</div>"},
{"t": "Énergies mécaniques : conservation et transferts (Terminale)", "q": "Le travail du poids lors d'une montée de 4 m d'un objet de 2 kg (g ≈ 10) :", "c": ["0", "−8 J", "+80 J", "−80 J"], "a": 3, "e": "Montée : le poids s'oppose : W = −mgh = −2×10×4 = −80 J.", "d": "<b>−80 J</b> : résistant en montée.<div class='ex-detail'><u>Exemple rédigé</u> : les 80 J sont stockés en Epp : ils seront restitués à la descente (+80 J de travail moteur) : le poids EST une force conservative : son travail ne dépend que de la dénivelée : quelle que soit la pente prise, montée de 4 m ⟹ −80 J. Piège : « +80 » : le signe dépend du SENS du déplacement vertical : montée = moins, descente = plus : une seule question à se poser : le poids aide-t-il ou freine-t-il ?</div>"},

function chapHeadHTML(m){

    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();

    var bar = document.getElementById('quiz-chapbar');

}

function renderFiches(){
  var z = document.getElementById('fiches-zone'); var h = '';

    h += chapHeadHTML(m);

    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
