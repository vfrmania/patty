 réaction", "id": null}, {"t": "Synthèse organique : estérification et polymères", "id": null}, {"t": "Cinématique : vecteurs vitesse et accélération", "id": null}, {"t": "Deuxième loi de Newton et mouvements dans un champ uniforme", "id": null}, {"t": "Énergies mécaniques : conservation et transferts", "id": null}, {"t": "Ondes : interférences et effet Doppler", "id": null}]}];
var COURS_META = [
{"id": "eau-melanges", "theme": "L'eau : mélanges et corps purs (5e)", "niveau": "5e", "titre": "L'eau : mélanges, corps purs et séparation", "cours": "<div class=\"cours-head\"><h2>L'eau : mélanges, corps purs et séparation</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Corps purs et mélanges</h3>\n<div class=\"tip\"><b>Corps pur :</b> une seule espèce chimique (eau pure, sel pur, dioxygène pur). <b>Mélange :</b> plusieurs espèces chimiques réunies sans réaction (eau sucrée, air, eau de mer).<br>Le <b>test de l'eau pure :</b> l'eau pure bout à <b>100 °C</b> exactement (pression normale) et gèle à 0 °C : ses changements d'état se font à température <b>constante</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — classer et justifier</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Classer : eau de mer, sucre, eau distillée, air, eau gazeuse.</div><div class=\"etu\"><b>Étape 1</b> — <b>Corps purs</b> : sucre (une seule espèce), eau distillée (H₂O seulement).</div><div class=\"etu\"><b>Étape 2</b> — <b>Mélanges</b> : eau de mer (eau + sel + minéraux), air (dioxygène + diazote + …), eau gazeuse (eau + CO₂ dissous).</div><div class=\"etu\"><b>Étape 3</b> — <b>Retenir</b> : « eau » dans le nom ne suffit pas à dire si c'est pur : c'est la COMPOSITION qui décide : se demander « combien d'espèces chimiques ? ».</div></div></details>\n<h3>2. Mélanges homogènes et hétérogènes</h3>\n<div class=\"tip\"><b>Mélange homogène :</b> on ne distingue pas les constituants à l'œil nu (eau sucrée, air). <b>Mélange hétérogène :</b> on voit au moins deux phases (eau + huile, eau + sable).<br><b>Attention :</b> homogène ≠ pur ! L'air est homogène mais c'est un mélange.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — eau + huile : un hétérogène célèbre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On verse de l'huile dans de l'eau et on agite. Décrire et expliquer.</div><div class=\"etu\"><b>Étape 1</b> — <b>Observation</b> : deux couches : l'huile au-DESSUS (moins dense), l'eau en dessous.</div><div class=\"etu\"><b>Étape 2</b> — <b>Système</b> : mélange hétérogène (2 phases distinctes), car huile et eau ne sont pas miscibles.</div><div class=\"etu\"><b>Étape 3</b> — <b>Séparation</b> : le système se sépare tout seul par <b>décantation</b> : la gravité range les liquides par densité : pas besoin de filtration.</div></div></details>\n<h3>3. Séparer les constituants d'un mélange</h3>\n<table><tr><th>Méthode</th><th>Sert à séparer…</th><th>Principe</th></tr>\n<tr><td><b>Décantation</b></td><td>2 liquides non miscibles ou solide/liquide</td><td>la gravité : le plus dense descend</td></tr>\n<tr><td><b>Filtration</b></td><td>solide en suspension dans un liquide</td><td>le filtre retient le solide (résidu), laisse passer le liquide (filtrat)</td></tr>\n<tr><td><b>Distillation</b></td><td>2 liquides miscibles</td><td>évaporation puis condensation : le plus volatil monte dans le réfrigérant</td></tr></table>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — quelle méthode choisir ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ① Séparer du sable et de l'eau. ② Séparer l'eau et le sel dissous de l'eau salée. ③ Séparer l'huile et l'eau.</div><div class=\"etu\"><b>Étape 1</b> — <b>Sable + eau</b> : solide/liquide : <b>filtration</b> (le sable reste sur le filtre).</div><div class=\"etu\"><b>Étape 2</b> — <b>Eau salée</b> : mélange HOMOGÈNE : le sel est dissous, invisible : la filtration ne marche PAS : il faut <b>distiller</b> (on récupère l'eau pure) ou évaporer (on récupère le sel).</div><div class=\"etu\"><b>Étape 3</b> — <b>Huile + eau</b> : non miscibles : <b>décantation</b> (ou ampoule à décanter). Réflexe : la méthode dépend de la NATURE du mélange : visible ou dissous, miscible ou non.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> filtration et distillation ne séparent PAS les mêmes choses : le sel dissous traverse le filtre ; homogène ne veut pas dire pur ; dans la distillation, c'est le distillat (le liquide récupéré) qu'on collecte, pas ce qui reste dans le ballon ; dissoudre n'est pas « disparaître » : le sel est toujours là (goût, masse).</div>"},
{"id": "etats-matiere", "theme": "États et changements d'état (5e)", "niveau": "5e", "titre": "États et changements d'état de la matière", "cours": "<div class=\"cours-head\"><h2>États et changements d'état de la matière</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les trois états et le modèle particulaire</h3>\n<div class=\"tip\"><b>Solide :</b> forme propre, particules serrées et ordonnées qui vibrent. <b>Liquide :</b> forme du récipient, particules serrées mais désordonnées qui glissent. <b>Gaz :</b> occupe tout l'espace, particules très éloignées, rapides et désordonnées.<br><b>L'état dépend de 2 paramètres :</b> température et pression.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire un schéma particulaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un schéma montre des particules très espacées, dispersées dans tout le cadre. Quel état ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Critère 1 : l'espacement</b> : particules très éloignées → pas un solide ni un liquide (tous deux sont « serrés »).</div><div class=\"etu\"><b>Étape 2</b> — <b>Critère 2 : l'occupation</b> : elles occupent TOUT le volume disponible → gaz.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : état GAZEUX. Réflexe : d'abord l'espacement (serré/loin), puis l'ordre (ordonné/désordonné) : c'est le duo qui départage les 3 états.</div></div></details>\n<h3>2. Les changements d'état</h3>\n<table><tr><th>Solidifie / Fond</th><th>Évapore / Condense</th><th>Sublime / Condense solide</th></tr>\n<tr><td>liquide ↔ solide</td><td>liquide ↔ gaz</td><td>solide ↔ gaz</td></tr></table>\n<div class=\"tip\"><b>Vocabulaire EXACT :</b> fusion (solide→liquide), solidification (liquide→solide), vaporisation (liquide→gaz), liquéfaction (gaz→liquide), sublimation (solide→gaz), condensation solide (gaz→solide).<br><b>Ébullition ≠ vaporisation :</b> la vaporisation a lieu à TOUTE température (évaporation lente d'une flaque) ; l'ébullition est une vaporisation rapide qui forme des bulles DANS le liquide (à 100 °C pour l'eau pure).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — nommer le changement d'état</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ① La rosée du matin. ② Le givre sur une vitre froide. ③ Un glaçon qui fond. ④ Le « bec » de neige qui disparaît sans mouiller.</div><div class=\"etu\"><b>Étape 1</b> — <b>Rosée</b> : vapeur d'eau (gaz) → gouttelettes (liquide) : <b>liquéfaction</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Givre</b> : vapeur d'eau → glace directement (sans passer par liquide) : <b>condensation solide</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Glaçon</b> : solide → liquide : <b>fusion</b> ; <b>neige</b> : solide → gaz : <b>sublimation</b>. Pour chaque situation : repérer état de départ et d'arrivée, puis le nom.</div></div></details>\n<h3>3. Ce qui se conserve, ce qui change</h3>\n<div class=\"tip\"><b>La MASSE se conserve</b> à chaque changement d'état : 10 g de glace donnent 10 g d'eau liquide. <b>Le VOLUME change</b> : l'eau est une exception célèbre (la glace PREND plus de place : c'est pour ça que les canettes gèlées explosent et que la glace flotte).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'expérience du glaçon dans l'éprouvette</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un glaçon de 18 g flotte dans une éprouvette. Quand il a totalement fondu, quelle est la masse d'eau ? Le niveau monte-t-il ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Masse</b> : la fusion conserve la masse : <b>18 g</b> d'eau.</div><div class=\"etu\"><b>Étape 2</b> — <b>Niveau</b> : la glace flotte car moins dense ; une fois fondue, l'eau occupe exactement le volume que la partie IMMERGÉE déplaçait : le niveau NE CHANGE PAS.</div><div class=\"etu\"><b>Étape 3</b> — <b>Bilan</b> : masse constante, mais le volume de l'eau liquide est PLUS PETIT que celui du glaçon (l'eau est anormale : solide moins dense que liquide).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « vapeur » n'est pas visible (la « vapeur » blanche au-dessus d'une casserole = gouttelettes liquides déjà liquéfiées) ; la neige et le givre ne sont PAS de la vaporisation ; le volume ne se conserve pas, la masse oui ; condensation = gaz → liquide (pas l'inverse).</div>"},
{"id": "circuit-serie", "theme": "Le circuit électrique en série (5e)", "niveau": "5e", "titre": "Le circuit électrique : composants et série", "cours": "<div class=\"cours-head\"><h2>Le circuit électrique : composants et série</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le circuit : une boucle fermée</h3>\n<div class=\"tip\"><b>Circuit fermé = boucle complète</b> : générateur, fils, dipôles. Le courant circule UNIQUEMENT si la boucle est fermée : <b>circuit ouvert = tout s'arrête</b>.<br><b>Sens conventionnel :</b> le courant sort de la borne <b>+</b> du générateur, traverse le circuit, revient à la borne −.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — diagnostiquer un circuit qui ne marche pas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une lampe montée avec une pile ne brille pas. Donner 3 hypothèses et comment les tester.</div><div class=\"etu\"><b>Étape 1</b> — <b>Hypothèse 1 : circuit ouvert</b> : fil débranché, interrupteur ouvert : vérifier chaque connexion (la boucle doit être CONTINUE).</div><div class=\"etu\"><b>Étape 2</b> — <b>Hypothèse 2 : lampe grillée</b> : la remplacer par une lampe neuve : si elle brille, coupable trouvé.</div><div class=\"etu\"><b>Étape 3</b> — <b>Hypothèse 3 : pile usée ou mal orientée</b> : tester avec une pile neuve en respectant les bornes. Méthode : on teste UNE chose à la fois : c'est la démarche scientifique.</div></div></details>\n<h3>2. Les composants et leurs symboles</h3>\n<table><tr><th>Dipôle</th><th>Symbole (description)</th><th>Rôle</th></tr>\n<tr><td>Générateur (pile)</td><td>2 barres (longue = +)</td><td>fournit l'énergie</td></tr>\n<tr><td>Lampe</td><td>cercle avec croix</td><td>convertit en lumière</td></tr>\n<tr><td>Interrupteur</td><td>pointillés ou trait plein</td><td>ouvre/ferme le circuit</td></tr>\n<tr><td>Moteur</td><td>cercle avec M</td><td>convertit en mouvement</td></tr>\n<tr><td>Ampèremètre</td><td>cercle avec A</td><td>mesure l'intensité (en A)</td></tr>\n<tr><td>Voltmètre</td><td>cercle avec V</td><td>mesure la tension (en V)</td></tr></table>\n<h3>3. La série : une seule boucle</h3>\n<div class=\"tip\"><b>Circuit en série :</b> les dipôles sont branchés les uns après les autres sur UNE SEULE boucle. Conséquence : <b>l'intensité est la MÊME partout</b>.<br><b>Loi d'unicité de l'intensité :</b> I₁ = I₂ = I₃ … partout dans la boucle.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — deux lampes en série</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux lampes identiques en série avec une pile. ① L'ampèremètre en A₁ (avant la lampe 1) indique 0,2 A. Que vaut l'ampèremètre A₂ placé entre les deux lampes ? ② Que se passe-t-il si on dévisse la lampe 2 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>A₂ = 0,2 A</b> : en série, l'intensité est la même en tout point (unicité).</div><div class=\"etu\"><b>Étape 2</b> — <b>Lampe 2 dévissée</b> : la boucle est OUVERTE : plus de courant NULLE PART : la lampe 1 s'éteint aussi.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : en série, tout dipôle est vital : une guirlande ancienne dont UNE ampoule grille s'éteint ENTIÈREMENT : c'est la signature du série.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le courant n'est pas « consommé » : ce qui sort du générateur y revient intégralement ; l'ordre des dipôles en série ne change rien (I identique partout) ; le courant ne « part pas de la borne + » par convention d'ORIENTATION seulement, mais dans une boucle fermée, la question ne se pose pas sans générateur ; une seule lampe grillée = tout s'éteint (série).</div>"},
{"id": "lumiere-ombres", "theme": "La lumière : sources et ombres (5e)", "niveau": "5e", "titre": "La lumière : sources et ombres", "cours": "<div class=\"cours-head\"><h2>La lumière : sources et ombres</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Sources et récepteurs de lumière</h3>\n<div class=\"tip\"><b>Source primaire :</b> produit SA propre lumière (Soleil, lampe allumée, flamme, luciole). <b>Objet diffusant :</b> renvoie la lumière reçue sans en produire (Lune, murs, livres) : on le voit parce qu'il EST ÉCLAIRÉ.<br><b>Œil et caméra :</b> récepteurs de lumière (ils captent la lumière pour former une image).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi voit-on la Lune ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La Lune brille-t-elle ? Explique pourquoi on la voit la nuit.</div><div class=\"etu\"><b>Étape 1</b> — <b>La Lune n'est pas une source primaire</b> : elle ne produit aucune lumière.</div><div class=\"etu\"><b>Étape 2</b> — <b>Elle est éclairée</b> par le Soleil (source primaire) et diffuse cette lumière dans toutes les directions.</div><div class=\"etu\"><b>Étape 3</b> — <b>Nous recevons</b> une partie de cette lumière diffusée : c'est pour ça qu'on la voit. Même logique pour toutes les « choses qu'on voit » : un livre, un visage : éclairés, ils diffusent, notre œil capte.</div></div></details>\n<h3>2. La propagation en ligne droite</h3>\n<div class=\"tip\"><b>Dans un milieu transparent et homogène (air, eau claire…), la lumière se propage en LIGNE DROITE</b> et très vite (300 000 km/s dans le vide).<br><b>Résultat :</b> on peut représenter la lumière par des segments fléchés (« rayons de lumière ») partant de la source vers l'œil.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — aligner 3 cartons percés</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Trois cartons percés d'un trou sont alignés. Quand on regarde par le premier trou, on voit la lampe placée derrière. On décale légèrement le carton 2 : que se passe-t-il ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Alignés</b> : la lumière passe par les 3 trous : la ligne droite relie lampe → trous → œil : preuve de la propagation rectiligne.</div><div class=\"etu\"><b>Étape 2</b> — <b>Carton 2 décalé</b> : la ligne est bloquée : plus rien ne parvient à l'œil.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : si la lumière contournait les obstacles, on verrait encore : elle ne contourne PAS : elle va tout droit. C'est l'expérience clé du chapitre.</div></div></details>\n<h3>3. Ombre propre, ombre portée, cône d'ombre</h3>\n<div class=\"tip\"><b>Ombre propre :</b> la face de l'objet non éclairée. <b>Ombre portée :</b> la zone sombre projetée derrière l'objet sur un écran. <b>Cône d'ombre :</b> le volume sombre derrière l'objet (celui qui s'y trouve ne voit pas la source).<br>La taille de l'ombre portée varie avec la <b>distance objet-écran</b> et le <b>diamètre apparent de la source</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — éclipse Soleil-Lune-Terre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer une éclipse de Soleil avec le vocabulaire du chapitre.</div><div class=\"etu\"><b>Étape 1</b> — <b>Alignement</b> : Soleil (source) — Lune (objet) — un point de la Terre (écran/œil).</div><div class=\"etu\"><b>Étape 2</b> — <b>Le cône d'ombre</b> de la Lune touche la Terre : à l'intérieur, c'est l'éclipse TOTALE.</div><div class=\"etu\"><b>Étape 3</b> — <b>Autour</b>, la zone de pénombre : éclipse PARTIELLE. Tout le phénomène = 3 lignes droites + un cône : la propagation rectiligne rend l'explication complète.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la Lune n'est pas une source primaire ; on voit un objet DIFFUSANT seulement s'il est éclairé ET que la lumière diffusée arrive à l'œil ; une ombre portée n'est pas « l'absence de lumière » au sens total : elle est éclairée par les rayons qui contournent (sources étendues → pénombre) ; vitesse de la lumière : ~300 000 km/s, quasi instantanée à notre échelle.</div>"},
{"id": "son-propagation", "theme": "Le son : vibration et propagation (5e)", "niveau": "5e", "titre": "Le son : vibration et propagation", "cours": "<div class=\"cours-head\"><h2>Le son : vibration et propagation</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Le son est une vibration</h3>\n<div class=\"tip\"><b>Tout son naît d'une source qui VIBRE</b> : corde de guitare, membrane de haut-parleur, cordes vocales. La vibration met l'air environnant en mouvement : zones de compression et de dilatation se propagent en boule jusqu'à l'oreille.<br><b>Preuve expérimentale :</b> un objet qui émet un son fait vibrer les objets touchés (grains de sable qui dansent sur une membrane).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — la corde de guitare</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pourquoi une corde de guitare pincée produit-elle un son, et pourquoi touche-t-on un son plus grave en pinçant une corde plus épaisse ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Vibration</b> : la corde pincée oscille très vite (centaines d'allers-retours par seconde) : elle « bouscule » l'air autour.</div><div class=\"etu\"><b>Étape 2</b> — <b>Grave ou aigu</b> : la fréquence (nombre de vibrations par seconde) fait le GRAVE (faible) ou l'AIGU (grande).</div><div class=\"etu\"><b>Étape 3</b> — <b>Corde épaisse</b> : plus lourde, elle vibre moins vite : fréquence plus petite : son plus GRAVE. Le guitariste ajuste aussi la TENSION et la LONGUEUR (corde raccourcie = plus aigu).</div></div></details>\n<h3>2. Le son a besoin d'un milieu matériel</h3>\n<div class=\"tip\"><b>Le son ne se propage PAS dans le vide</b> : il lui faut un milieu (air, eau, métal) dont les particules transmettent la vibration de proche en proche. <b>En revanche, la lumière traverse le vide</b> : les deux n'ont pas les mêmes besoins.<br><b>Vitesses :</b> air ≈ 340 m/s ; eau ≈ 1500 m/s ; acier ≈ 5000-6000 m/s : plus le milieu est rigide, plus le son est rapide.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'expérience de la cloche à vide</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une sonnerie fonctionne dans une cloche en verre dont on aspire l'air. Qu'observe-t-on ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Avec air</b> : on voit la cloche VIBRER et on ENTEND la sonnerie.</div><div class=\"etu\"><b>Étape 2</b> — <b>Air aspiré</b> : on voit toujours la cloche vibrer (la LUMIÈRE traverse le vide), mais le son FAIBLIT puis DISPARAÎT.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : pas d'air = pas de son : le son a besoin de MATIÈRE pour se propager. (Dans l'espace, les explosions sont silencieuses : le cinéma ment.)</div></div></details>\n<h3>3. Mesurer la vitesse du son : orage et écho</h3>\n<div class=\"tip\"><b>Technique de l'orage :</b> on voit l'éclair AVANT d'entendre le tonnerre (lumière ≈ instantanée, son = 340 m/s). <b>Distance de la foudre (km) ≈ temps (s) entre éclair et tonnerre ÷ 3.</b><br><b>Écho :</b> le son réfléchi revient : le sonar et l'échographie mesurent des distances d = v × t ÷ 2.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — compter jusqu'à l'orage</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On compte 9 secondes entre l'éclair et le tonnerre. À quelle distance se trouve l'orage ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Données</b> : t = 9 s ; v = 340 m/s.</div><div class=\"etu\"><b>Étape 2</b> — <b>Calcul</b> : d = v × t = 340 × 9 = 3060 m ≈ <b>3 km</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Astuce vérifiée</b> : diviser les secondes par 3 donne bien les kilomètres (9 s ÷ 3 = 3 km) : ordre de grandeur confirmé. Le son est lent à notre échelle : c'est ce décalage qui rend la mesure possible.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le son ne traverse PAS le vide (la lumière si) ; le son va plus vite dans l'eau que dans l'air (l'inverse de l'intuition « l'air c'est léger donc rapide » : c'est la rigidité qui compte) ; on voit l'éclair avant d'entendre le tonnerre ; le son ne « voyage » pas tout seul : c'est une VIBRATION transmise de particule en particule ; amplitude = intensité (fort/doux), fréquence = hauteur (grave/aigu) : deux propriétés différentes.</div>"},
{"id": "poids-gravitation", "theme": "Poids et gravitation (3e)", "niveau": "3e", "titre": "Poids et gravitation", "cours": "<div class=\"cours-head\"><h2>Poids et gravitation</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La gravitation, une interaction à distance</h3>\n<p>La <b>gravitation</b> est une interaction attractive entre tous les corps qui possèdent une masse : deux objets s'attirent mutuellement, à n'importe quelle distance. C'est elle qui fait tomber les objets, qui maintient la Lune autour de la Terre et les planètes autour du Soleil.</p>\n<div class=\"tip\"><b>Ce qu'il faut retenir :</b> l'attraction gravitationnelle dépend des <b>masses</b> (plus les masses sont grandes, plus l'attraction est forte) et de la <b>distance</b> (plus on est loin, plus elle est faible).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — pourquoi la Lune ne tombe-t-elle pas sur la Terre ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Expliquer pourquoi la Lune tourne autour de la Terre au lieu de s'y écraser.</div><div class=\"etu\"><b>Étape 1</b> — <b>La force existe</b> : la Terre attire la Lune (interaction gravitationnelle), dirigée du centre de la Lune vers le centre de la Terre.</div><div class=\"etu\"><b>Étape 2</b> — <b>La Lune avance</b> : en même temps, la Lune possède une vitesse qui la ferait partir « tout droit » s'il n'y avait pas de force.</div><div class=\"etu\"><b>Étape 3</b> — <b>Composer les deux</b> : à chaque instant, la gravitation « courbe » la trajectoire : la Lune « rate » la Terre en permanence : elle tombe SUR elle sans jamais l'atteindre : c'est une <b>orbite</b>. C'est le principe des satellites artificiels aussi.</div></div></details>\n<h3>2. Le poids P : la force de gravitation près du sol</h3>\n<div class=\"tip\"><b>Définition :</b> le poids P d'un objet est la force de gravitation exercée par la Terre (ou un astre) sur cet objet. <br>• Direction : la <b>verticale</b> (vers le centre de la Terre)<br>• Sens : vers le bas<br>• Point d'application : le <b>centre de gravité</b> G de l'objet<br>• Valeur : <b>P = m × g</b>, en newtons (N) si m est en kg et g en N/kg</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer un poids</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un sac de sport a une masse m = 4 kg. Calculer son poids sur Terre (g = 9,8 N/kg), puis sur la Lune (g ≈ 1,6 N/kg).</div><div class=\"etu\"><b>Étape 1</b> — <b>Repérer les données</b> : m = 4 kg ; g(Terre) = 9,8 N/kg.</div><div class=\"etu\"><b>Étape 2</b> — <b>Appliquer la formule</b> : P = m × g = 4 × 9,8 = <b>39,2 N</b> sur Terre.</div><div class=\"etu\"><b>Étape 3</b> — <b>Sur la Lune</b> : P = 4 × 1,6 = <b>6,4 N</b>. La masse n'a PAS changé (c'est la même quantité de matière), c'est g qui a changé : l'objet pèse « 6 fois moins » mais contient toujours 4 kg.</div><div class=\"etu\"><b>Étape 4</b> — <b>Vérifier l'unité</b> : kg × N/kg = N ✓. Le poids s'exprime en newtons, JAMAIS en kg.</div></div></details>\n<h3>3. Masse et poids : ne pas confondre !</h3>\n<table><tr><th></th><th>Masse m</th><th>Poids P</th></tr>\n<tr><td><b>Nature</b></td><td>quantité de matière</td><td>force de gravitation</td></tr>\n<tr><td><b>Unité</b></td><td>kilogramme (kg)</td><td>newton (N)</td></tr>\n<tr><td><b>Instrument</b></td><td>balance</td><td>dynamomètre</td></tr>\n<tr><td><b>Dépend du lieu ?</b></td><td>NON (constante)</td><td>OUI (dépend de g)</td></tr></table>\n<div class=\"tip\"><b>g, l'intensité de la pesanteur :</b> g ≈ 9,8 N/kg sur Terre ; ≈ 1,6 N/kg sur la Lune ; ≈ 3,7 N/kg sur Mars. Sur un astre donné, g est quasiment constant : P est donc <b>proportionnel à m</b> : si la masse double, le poids double.</div>\n<h3>4. Représenter et utiliser le poids</h3>\n<div class=\"ex\"><b>Exemple — schématiser :</b> pour un objet de 2 kg posé sur une table, on dessine un segment fléché (vecteur) partant de son centre de gravité G, vertical, vers le bas, de longueur proportionnelle à P = 2 × 9,8 = 19,6 N (échelle : 1 cm ↔ 10 N ⟹ longueur ≈ 2 cm).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — retrouver une masse à partir du poids</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un dynamomètre indique P = 49 N sur Terre (g = 9,8 N/kg). Quelle est la masse de l'objet ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Formule de départ</b> : P = m × g, donc m = P / g.</div><div class=\"etu\"><b>Étape 2</b> — <b>Remplacer</b> : m = 49 / 9,8 = <b>5 kg</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Vérifier</b> : 5 × 9,8 = 49 N ✓. La masse en kg, le poids en N : l'inversion de la formule est le calcul le plus fréquent en exercice.</div></div></details>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b><ul>\n<li>Ne pas confondre masse (kg, balance, constante) et poids (N, dynamomètre, dépend du lieu) : c'est LE piège du chapitre.</li>\n<li>Le poids se mesure en newtons : « un poids de 5 kg » est une erreur de langage courant.</li>\n<li>Sur la Lune, la masse ne change pas, seul le poids diminue.</li>\n<li>La direction du poids est la verticale du lieu (vers le centre de la Terre), pas « vers le sol » si l'objet est au-dessus de la tête.</li>\n<li>En énoncé, toujours convertir la masse en kg avant d'appliquer P = m×g (500 g = 0,5 kg).</li></ul></div>"}];

{"id": "eau-melanges", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Corps pur :</b> une seule espèce chimique ; <b>mélange :</b> plusieurs.</p>\n<p><b>Eau pure :</b> bout à 100 °C et gèle à 0 °C (température CONSTANTE).</p>\n<p><b>Homogène</b> = une seule phase visible ; <b>hétérogène</b> = plusieurs phases.</p>\n<h3>🧭 Séparations</h3>\n<ul>\n<li><b>Décantation :</b> 2 liquides non miscibles (le plus dense en dessous) ou solide qui se dépose.</li>\n<li><b>Filtration :</b> solide NON dissous (résidu sur filtre, filtrat au-dessous).</li>\n<li><b>Distillation :</b> liquides miscibles : on vaporise le plus volatil puis on le condense (distillat).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Homogène ≠ pur (l'air est homogène mais mélangé).</li>\n<li>Le sel dissous ne se filtre pas : il faut distiller ou évaporer.</li>\n<li>Après dissolution, la masse se CONSERVE : sel + eau = masse totale.</li>\n</ul>"},
{"id": "etats-matiere", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>3 états :</b> solide (ordonné, serré), liquide (désordonné, serré), gaz (dispersé, éloigné).</p>\n<p><b>6 changements :</b> fusion, solidification, vaporisation, liquéfaction, sublimation, condensation solide.</p>\n<p><b>Masse : conservée ; volume : PAS conservé.</b> Exception eau : la glace est moins dense que l'eau liquide.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Identifier un état</b> sur un schéma : espacement (serré ?) puis occupation (tout le cadre ?).</li>\n<li><b>Nommer un changement</b> : état initial → état final, puis vocabulaire exact.</li>\n<li><b>Ébullition</b> = vaporisation rapide avec bulles (100 °C pour l'eau pure) ; <b>évaporation</b> = lente, à toute température.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>La « vapeur blanche » visible = gouttelettes LIQUIDES, pas de la vapeur (invisible).</li>\n<li>Givre/neige : gaz → solide (condensation solide), pas fusion.</li>\n<li>La fonte d'un glaçon flottant ne fait pas monter le niveau de l'eau.</li>\n</ul>"},
{"id": "circuit-serie", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Circuit fermé</b> = boucle complète : le courant circule ; <b>ouvert</b> = arrêt total.</p>\n<p><b>Sens conventionnel :</b> de la borne + vers la borne − à l'extérieur du générateur.</p>\n<p><b>Série :</b> une seule boucle, dipôles à la chaîne : <b>unicité de l'intensité</b> (I identique partout).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Schéma normalisé :</b> symboles, fils rectilignes, jamais de croisements inutiles.</li>\n<li><b>Panne ?</b> tester : connexions (boucle), lampe (remplacer), pile (neuve, bornes).</li>\n<li><b>Mesurer I :</b> ampèremètre EN SÉRIE dans la boucle.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Le courant n'est pas consommé : il revient au générateur identique.</li>\n<li>En série, une lampe dévissée éteint TOUT le circuit.</li>\n<li>Ampèremètre en série, voltmètre en dérivation (jamais l'inverse).</li>\n</ul>"},
{"id": "lumiere-ombres", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Source primaire</b> = produit sa lumière (Soleil, lampe) ; <b>objet diffusant</b> = renvoie la lumière reçue (Lune, murs).</p>\n<p><b>Propagation rectiligne</b> dans un milieu transparent et homogène ; vitesse ≈ 300 000 km/s.</p>\n<p><b>Ombre propre</b> (sur l'objet) ; <b>ombre portée</b> (sur l'écran) ; <b>cône d'ombre</b> (volume) ; <b>pénombre</b> (source étendue).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Rayons :</b> segments fléchés source → objet → œil (toujours orientés).</li>\n<li><b>Tracer une ombre :</b> 2 rayons tangents à l'objet, prolongés jusqu'à l'écran.</li>\n<li><b>Voir un objet :</b> lumière source → objet (diffusion) → œil : la chaîne complète.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>La Lune éclaire = diffusant, PAS source.</li>\n<li>La lumière ne contourne pas les obstacles : ligne droite.</li>\n<li>Source ponctuelle = ombre nette ; source étendue = ombre + pénombre.</li>\n</ul>"},
{"id": "son-propagation", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Son = vibration</b> d'une source, transmise de proche en proche par un milieu matériel.</p>\n<p><b>Pas de son dans le vide</b> ; la lumière, elle, traverse le vide.</p>\n<p><b>Vitesse :</b> air ≈ 340 m/s ; eau ≈ 1500 m/s ; acier ≈ 5200 m/s.</p>\n<p><b>Grave/aigu = fréquence</b> (lent/rapide) ; <b>fort/doux = amplitude</b>.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Orage :</b> d = v × t ; distance (km) ≈ secondes ÷ 3.</li>\n<li><b>Écho/sonar :</b> d = (v × t) ÷ 2 (aller-retour).</li>\n<li><b>Prouver la vibration :</b> grains de sable sur une membrane qui émet.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Explosions « dans l'espace » : cinéma : silence réel.</li>\n<li>Le son va PLUS VITE dans l'eau et l'acier que dans l'air.</li>\n<li>Voir avant d'entendre : éclair puis tonnerre, pas l'inverse.</li>\n</ul>"},
{"id": "poids-gravitation", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Gravitation :</b> interaction attractive entre deux corps massifs, à distance ; elle diminue quand la distance augmente et augmente avec les masses.</p>\n<p><b>Poids :</b> P = m × g (P en N, m en kg, g en N/kg).</p>\n<p><b>Caractéristiques du poids :</b> vertical, vers le bas, appliqué au centre de gravité G.</p>\n<p><b>g :</b> Terre ≈ 9,8 N/kg ; Lune ≈ 1,6 ; Mars ≈ 3,7 : g dépend de l'astre.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Poids ⟶ masse :</b> m = P/g ; <b>masse ⟶ poids :</b> P = m×g.</li>\n<li><b>Convertir la masse en kg</b> avant tout calcul (g → kg : diviser par 1000).</li>\n<li><b>Schéma :</b> vecteur vertical vers le bas depuis G, longueur proportionnelle à P (échelle donnée).</li>\n<li><b>Proportionnalité :</b> à g constant, P et m sont proportionnels (droite passant par l'origine).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Masse (kg, balance, constante) ≠ poids (N, dynamomètre, varie avec g).</li>\n<li>Le poids ne se mesure « jamais » en kg dans une copie correcte.</li>\n<li>Sur la Lune : masse inchangée, poids divisé (g plus petit).</li>\n<li>Le poids est une FORCE : il se représente par un vecteur, pas par un nombre seul.</li>\n</ul>"}];

{"t": "Poids et gravitation (3e)", "q": "La gravitation entre deux corps est plus forte quand…", "c": ["la distance augmente", "il fait nuit", "les masses augmentent", "les masses diminuent"], "a": 2, "e": "Attraction renforcée par de grandes masses et de courtes distances.", "d": "<b>Masses grandes + distance courte = attraction forte.</b><div class='ex-detail'><u>Exemple rédigé</u> : le Soleil (masse énorme) attire fortement les planètes malgré la distance ; deux personnes s'attirent aussi, mais avec une force infime (masses faibles). C'est pourquoi la Lune orbite autour de la Terre et pas autour d'un satellite artificiel : ordres de grandeur des masses. Piège : « la distance augmente » : c'est l'inverse, l'attraction diminue avec la distance.</div>"},
