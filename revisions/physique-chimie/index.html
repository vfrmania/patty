{"id": "signaux", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Son :</b> 340 m/s (air), besoin de matière. <b>Lumière :</b> 300 000 km/s, traverse le vide.</p>\n<p><b>Éclair avant tonnerre</b> : d = v×t ; distance (km) ≈ secondes ÷ 3.</p>\n<p><b>Fréquence (Hz) :</b> petite = grave ; grande = aigu ; oreille : 20 Hz – 20 000 Hz.</p>\n<p><b>Écho/sonar :</b> d = (v × t) ÷ 2.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Distance d'un orage :</b> t(éclair→tonnerre) × 340 m/s.</li>\n<li><b>Sonar :</b> diviser le temps total par 2 AVANT d'appliquer d = v×t.</li>\n<li><b>Comparer deux sons :</b> comparer les fréquences (hauteur) et amplitudes (intensité) séparément.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Vide = silence : le son exige un milieu.</li>\n<li>2,4 s d'écho = 1,2 s d'aller : division par 2 obligatoire.</li>\n<li>« Ultrasons » = inaudibles pour nous, réels et utiles (imagerie).</li>\n</ul>"},
{"id": "atomes-ions", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Atome :</b> noyau (Z protons) + Z électrons ; neutrons = A − Z ; neutre.</p>\n<p><b>Ion :</b> perte d'électrons ⟹ cation (+) ; gain ⟹ anion (−) ; noyau inchangé.</p>\n<p><b>À connaître :</b> H⁺, Na⁺, Cu²⁺, Fe²⁺/Fe³⁺ ; Cl⁻, O²⁻, OH⁻, NO₃⁻, SO₄²⁻, CO₃²⁻.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Compter les charges :</b> charge = protons − électrons.</li>\n<li><b>Tests d'ions :</b> soude ⟹ précipité vert (Fe²⁺), bleu (Cu²⁺), rouille (Fe³⁺) ; nitrate d'argent ⟹ précipité blanc (Cl⁻).</li>\n<li><b>Lire une formule ionique :</b> SO₄²⁻ = 1 S + 4 O, charge globale −2.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Z (protons) ne change jamais quand l'atome devient ion.</li>\n<li>OH⁻, NO₃⁻, SO₄²⁻ : ions POLYatomiques (plusieurs atomes).</li>\n<li>Les solutions ioniques conduisent le courant ; l'eau pure, non.</li>\n</ul>"},
{"id": "transformations-chimiques", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Réaction chimique :</b> réactifs ⟶ produits ; NOUVELLES substances (couleur, gaz, précipité, chaleur).</p>\n<p><b>Conservation :</b> même nombre d'atomes de chaque élément de part et d'autre (et même masse).</p>\n<p><b>Équilibrage :</b> coefficients devant les formules ; ordre conseillé : C, H, O.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Équilibrer :</b> compter C, puis H, puis O ; ajuster avec des coefficients entiers.</li>\n<li><b>Test physique/chimique :</b> nouvelles molécules ? ⟹ chimique ; mêmes molécules ? ⟹ physique.</li>\n<li><b>Bilan de masse :</b> m(produits) = m(réactifs), en incluant les gaz échangés.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>On ne touche JAMAIS aux indices (H₂O devient H₂O₂ = eau oxygénée !).</li>\n<li>Un gaz qui s'échappe fait « maigrir » la balance : fermer le flacon.</li>\n<li>Combustion incomplète ⟹ CO toxique (chaudière mal réglée).</li>\n</ul>"},
{"id": "lois-circuits", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>U (voltmètre, dérivation)</b> ; <b>I (ampèremètre, série)</b>.</p>\n<p><b>Série :</b> U(générateur) = U₁ + U₂ ; I unique. <b>Dérivation :</b> I = I₁ + I₂ ; U identique.</p>\n<p><b>Loi d'Ohm :</b> U = R × I (conducteur ohmique) ; P = U × I.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Trois formules :</b> U = R×I ; I = U/R ; R = U/I : vérifier les unités (V, Ω, A).</li>\n<li><b>Additionner</b> tensions (série) ou intensités (nœuds) selon le montage.</li>\n<li><b>Effet Joule :</b> P = U×I dissipée en chaleur : dimensionner fusibles et calibres.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>U = R×I : uniquement pour une résistance ohmique.</li>\n<li>Ne jamais brancher un ampèremètre aux bornes de la pile (court-circuit).</li>\n<li>Sécurité : ~30 mA dans le corps = danger : pas de bricolage secteur.</li>\n</ul>"},
{"id": "energie-cinetique", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Ec = ½ × m × v²</b> (kg, m/s ⟹ joules) : la vitesse compte AU CARRÉ.</p>\n<p><b>Distance d'arrêt = distance de réaction + distance de freinage.</b></p>\n<p><b>Conversion :</b> km/h ÷ 3,6 = m/s.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calcul d'Ec :</b> convertir v en m/s, puis ½mv².</li>\n<li><b>Réaction :</b> d = v × t (≈ 1 s) ; <b>freinage :</b> croît comme v².</li>\n<li><b>Comparer deux vitesses :</b> rapport des carrés (50→100 km/h = ×4).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>km/h dans la formule = résultat faux (facteur 13 !).</li>\n<li>×2 vitesse = ×4 Ec : jamais ×2.</li>\n<li>Réaction (conducteur) ≠ freinage (voiture/route).</li>\n</ul>"},
{"id": "poids-gravitation", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Gravitation :</b> interaction attractive entre deux corps massifs, à distance ; elle diminue quand la distance augmente et augmente avec les masses.</p>\n<p><b>Poids :</b> P = m × g (P en N, m en kg, g en N/kg).</p>\n<p><b>Caractéristiques du poids :</b> vertical, vers le bas, appliqué au centre de gravité G.</p>\n<p><b>g :</b> Terre ≈ 9,8 N/kg ; Lune ≈ 1,6 ; Mars ≈ 3,7 : g dépend de l'astre.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Poids ⟶ masse :</b> m = P/g ; <b>masse ⟶ poids :</b> P = m×g.</li>\n<li><b>Convertir la masse en kg</b> avant tout calcul (g → kg : diviser par 1000).</li>\n<li><b>Schéma :</b> vecteur vertical vers le bas depuis G, longueur proportionnelle à P (échelle donnée).</li>\n<li><b>Proportionnalité :</b> à g constant, P et m sont proportionnels (droite passant par l'origine).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Masse (kg, balance, constante) ≠ poids (N, dynamomètre, varie avec g).</li>\n<li>Le poids ne se mesure « jamais » en kg dans une copie correcte.</li>\n<li>Sur la Lune : masse inchangée, poids divisé (g plus petit).</li>\n<li>Le poids est une FORCE : il se représente par un vecteur, pas par un nombre seul.</li>\n</ul>"}];
var QUESTIONS = [
{"t": "Poids et gravitation (3e)", "q": "Le poids d'un objet est…", "c": ["sa masse exprimée en kg", "une quantité de matière", "identique partout dans l'univers", "la force de gravitation exercée par la Terre sur lui"], "a": 3, "e": "Le poids est une force : la gravitation que la Terre exerce sur l'objet.", "d": "<b>Le poids est la force de gravitation</b> exercée par un astre sur l'objet : une force, mesurée en <b>newtons</b>, qui dépend du lieu.<div class='ex-detail'><u>Exemple rédigé</u> : un objet de 4 kg pèse P = 4×9,8 = 39,2 N sur Terre mais seulement 6,4 N sur la Lune : le poids change avec g, alors que la masse reste 4 kg partout. Piège : « identique partout » est FAUX, et « la masse en kg » confond les deux grandeurs du chapitre.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Un objet de masse m = 5 kg. Son poids sur Terre (g = 9,8 N/kg) vaut :", "c": ["5 N", "49 N", "0,49 N", "9,8 N"], "a": 1, "e": "P = m × g = 5 × 9,8 = 49 N.", "d": "<b>P = m × g = 5 × 9,8 = 49 N</b> : la formule centrale du chapitre.<div class='ex-detail'><u>Exemple rédigé</u> : unités : kg × (N/kg) = N ✓. Vérification par proportionnalité : 1 kg pèse 9,8 N, donc 5 kg pèsent 5 × 9,8 = 49 N. Piège : « 5 N » revient à confondre masse et poids ; le poids a presque toujours une valeur ~10 fois plus grande que la masse en kg.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Un dynamomètre indique 19,6 N sur Terre (g = 9,8 N/kg). La masse de l'objet est :", "c": ["2 kg", "192 N", "19,6 kg", "0,5 kg"], "a": 0, "e": "m = P/g = 19,6/9,8 = 2 kg.", "d": "<b>m = P / g = 19,6 / 9,8 = 2 kg</b> : on inverse la formule P = m×g.<div class='ex-detail'><u>Exemple rédigé</u> : méthode : P = m×g ⟹ m = P/g (on isole m en divisant). Contrôle : 2 × 9,8 = 19,6 N ✓. Piège : « 192 N » mélange unités (une masse ne se mesure pas en N) ; « 0,5 kg » viendrait d'une division par 4 sans raison.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Sur la Lune (g ≈ 1,6 N/kg), un objet de 10 kg pèse environ :", "c": ["98 N", "6 N", "10 N", "16 N"], "a": 3, "e": "P = 10 × 1,6 = 16 N.", "d": "<b>P = m × g = 10 × 1,6 = 16 N</b> : le poids dépend de l'astre.<div class='ex-detail'><u>Exemple rédigé</u> : sur Terre, le même objet pèserait 98 N : sur la Lune, il pèse 6 fois moins. La masse, elle, reste 10 kg dans les deux cas (même quantité de matière). Piège : « 98 N » applique le g terrestre à la Lune : toujours lire quel astre sert de cadre à l'exercice.</div>"},
{"t": "Poids et gravitation (3e)", "q": "La gravitation entre deux corps est plus forte quand…", "c": ["la distance augmente", "il fait nuit", "les masses augmentent", "les masses diminuent"], "a": 2, "e": "Attraction renforcée par de grandes masses et de courtes distances.", "d": "<b>Masses grandes + distance courte = attraction forte.</b><div class='ex-detail'><u>Exemple rédigé</u> : le Soleil (masse énorme) attire fortement les planètes malgré la distance ; deux personnes s'attirent aussi, mais avec une force infime (masses faibles). C'est pourquoi la Lune orbite autour de la Terre et pas autour d'un satellite artificiel : ordres de grandeur des masses. Piège : « la distance augmente » : c'est l'inverse, l'attraction diminue avec la distance.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Quelles sont les caractéristiques du vecteur poids ?", "c": ["vertical, vers le haut, appliqué à G", "oblique, vers le haut, appliqué à la base", "horizontal, vers la droite, appliqué au sol", "vertical, vers le bas, appliqué au centre de gravité G"], "a": 3, "e": "Poids : direction verticale, sens vers le bas, point d'application G.", "d": "<b>Vertical, vers le bas, appliqué au centre de gravité G</b>, de longueur proportionnelle à P.<div class='ex-detail'><u>Exemple rédigé</u> : pour schématiser le poids d'un objet de 20 N avec l'échelle 1 cm ↔ 10 N : tracer depuis G un segment vertical vers le bas de 2 cm, terminé par une flèche. Piège : « vers le haut » confond poids (vers le bas) et réaction du support (vers le haut) : deux forces différentes qui se compensent sur une table.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Quel instrument mesure le poids ?", "c": ["Un chronomètre", "Une balance", "Un thermomètre", "Un dynamomètre"], "a": 3, "e": "Le dynamomètre mesure des forces (N) ; la balance mesure la masse (kg).", "d": "<b>Le dynamomètre</b> : il mesure une force en newtons (le ressort s'étire proportionnellement à la force).<div class='ex-detail'><u>Exemple rédigé</u> : subtilité : quand on se pèse sur une balance, la balance mesure en réalité une force mais affiche une masse, car elle divise par g (elle « sait » qu'on est sur Terre). Sur la Lune, la même balance afficherait n'importe quoi : c'est le dynamomètre qui dit la vérité sur la force réellement subie. Piège : la balance mesure indirectement ; le dynamomètre est l'instrument de la force.</div>"},
{"t": "Poids et gravitation (3e)", "q": "La masse d'un objet sur la Lune, par rapport à sa masse sur Terre :", "c": ["est divisée par 6", "est multipliée par 6", "est nulle", "est inchangée"], "a": 3, "e": "La masse est constante : même quantité de matière partout.", "d": "<b>Inchangée</b> : la masse ne dépend pas du lieu.<div class='ex-detail'><u>Exemple rédigé</u> : le sac de 4 kg reste 4 kg sur la Lune, sur Mars ou dans l'espace : il contient la même matière. Seul le poids change (39,2 N sur Terre, 6,4 N sur la Lune). Piège : « divisée par 6 » : c'est le POIDS qui est divisé par 6, pas la masse : la confusion masse/poids est l'erreur n° 1 de ce chapitre.</div>"},
{"t": "Poids et gravitation (3e)", "q": "Pourquoi la Lune tourne-t-elle autour de la Terre sans s'y écraser ?", "c": ["sa vitesse et la gravitation se combinent : elle « rate » la Terre en permanence", "la Terre la repousse", "elle est trop légère pour tomber", "il n'y a pas de gravité dans l'espace"], "a": 0, "e": "La gravitation courbe en permanence la trajectoire de la Lune qui, sans elle, partirait tout droit.", "d": "<b>La gravitation courbe sa trajectoire à chaque instant</b> : sans gravité, la Lune partirait en ligne droite ; sans vitesse, elle tomberait sur la Terre.<div class='ex-detail'><u>Exemple rédigé</u> : l'orbite est la combinaison des deux : la Lune « tombe » vers la Terre mais avance assez vite pour la rater en continu : sa trajectoire se referme en cercle (à peu près). C'est exactement le principe d'un satellite artificiel : on le lance assez vite pour qu'il « rate » la Terre en permanence. Piège : « pas de gravité dans l'espace » : la gravité agit à TOUTES les distances.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "L'eau distillée est…", "c": ["un mélange homogène", "un mélange hétérogène", "du dioxygène", "un corps pur"], "a": 3, "e": "L'eau distillée ne contient que H₂O : un corps pur.", "d": "<b>Corps pur</b> : l'eau distillée contient une seule espèce chimique, H₂O.<div class='ex-detail'><u>Exemple rédigé</u> : la preuve expérimentale : l'eau distillée bout exactement à 100 °C et gèle à 0 °C, à température constante : la signature d'un corps pur. Une eau salée bout AU-DESSUS de 100 °C et sur un intervalle de température : signature d'un mélange. Piège : « mélange homogène » : c'est le piège classique : homogène ≠ pur.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Eau + huile après agitation : quel mélange ?", "c": ["Homogène", "Hétérogène", "Impossible à dire", "Un corps pur"], "a": 1, "e": "Huile et eau ne sont pas miscibles : deux phases visibles.", "d": "<b>Hétérogène</b> : l'huile (moins dense) flotte au-dessus de l'eau.<div class='ex-detail'><u>Exemple rédigé</u> : même en agitant fort, les gouttes d'huile se rassemblent : deux couches réapparaissent. On peut alors séparer par DECANTATION (ou ampoule à décanter) : la gravité fait le travail. Piège : croire qu'agiter assez longtemps rendrait le mélange homogène : non miscible veut dire insoluble pour de bon.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Séparer du sable de l'eau : quelle méthode ?", "c": ["Filtration", "Rien à faire", "Distillation", "Décantation seule"], "a": 0, "e": "Le sable (solide non dissous) reste sur le filtre.", "d": "<b>Filtration</b> : le filtre retient le sable (résidu), l'eau passe (filtrat).<div class='ex-detail'><u>Exemple rédigé</u> : vocabulaire à connaître : RÉSIDU = ce qui reste sur le filtre ; FILTRAT = ce qui passe à travers. Vérification : le filtrat est limpide. Piège : la distillation est prévue pour des liquides MISCIBLES : ici c'est surdimensionné : solide + liquide = filtration, le réflexe le plus rentable du chapitre.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Peut-on filtrer le sel dissous dans l'eau salée ?", "c": ["Oui, le filtre retient le sel", "Oui en agitant fort", "Oui si le filtre est fin", "Non, le sel dissous traverse le filtre"], "a": 3, "e": "Le sel est dissous : invisible, homogène : la filtration est inutile.", "d": "<b>Non</b> : le sel dissous traverse le filtre avec l'eau.<div class='ex-detail'><u>Exemple rédigé</u> : le filtrat d'une eau salée est... encore salée (goûter !). Pour séparer : ① DISTILLATION : on vaporise l'eau, on la condense : eau pure côté distillat, sel dans le ballon ; ② ÉVAPORATION : on fait bouillir à sec : le sel reste. Piège : la filtration ne sépare que ce qu'on VOIT : le dissous est invisible et passe partout.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Dans une distillation, le liquide récupéré s'appelle…", "c": ["le résidu", "le décantat", "le distillat", "le filtrat"], "a": 2, "e": "Le distillat : vapeur condensée dans le réfrigérant.", "d": "<b>Le distillat</b> : la vapeur est refroidie (condensation) et coule dans l'éprouvette.<div class='ex-detail'><u>Exemple rédigé</u> : montage type : ballon chauffé → colonne → réfrigérant (eau froide à contre-courant) → distillat. Dans le ballon RESTE le moins volatil (ex. le sel d'une eau salée). Piège : « résidu » appartient à la FILTRATION (ce qui reste sur le filtre) : chaque technique a son vocabulaire : ne jamais les mélanger.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "La décantation fonctionne grâce à…", "c": ["la température", "le goût", "la couleur des liquides", "la différence de densité"], "a": 3, "e": "La gravité classe les espèces : la plus dense descend.", "d": "<b>La différence de densité</b> : le plus dense va vers le fond.<div class='ex-detail'><u>Exemple rédigé</u> : exemples : huile/eau (l'eau, plus dense, dessous) ; sable/eau (le sable se dépose) ; boue/eau. Piège : la décantation ne sépare pas ce qui est DISSOUS : l'eau sucrée décantera des semaines sans se séparer : homogène = inséparable par gravité.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "L'air est…", "c": ["du dioxygène pur", "un corps pur", "un mélange hétérogène", "un mélange homogène"], "a": 3, "e": "L'air = diazote + dioxygène + autres gaz : un mélange homogène.", "d": "<b>Un mélange homogène</b> : environ 78 % de diazote, 21 % de dioxygène, 1 % d'autres gaz.<div class='ex-detail'><u>Exemple rédigé</u> : on ne voit pas les constituants (une seule phase) : homogène. Mais plusieurs espèces : mélange. La preuve : la composition varie (altitude, pollution) alors qu'un corps pur a une composition FIXE. Piège : « du dioxygène pur » : le dioxygène n'est qu'UN des constituants : respire le gaz d'une bouteille d'O₂ pure et tu comprendras la différence : l'air nous faut TOUT son mélange.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "On dissout 10 g de sel dans 100 g d'eau. La masse de la solution obtenue est :", "c": ["100 g", "90 g", "impossible à savoir", "110 g"], "a": 3, "e": "La masse se conserve : 10 + 100 = 110 g.", "d": "<b>110 g</b> : la masse totale se conserve lors d'une dissolution.<div class='ex-detail'><u>Exemple rédigé</u> : le sel « disparaît » à l'œil mais pas en masse : les particules de sel sont simplement dispersées entre les molécules d'eau. Vérification : peser avant (100 + 10 = 110 g) et après (110 g) : identique. Piège : croire que « dissous = disparu » : c'est FAUX aussi pour le goût et pour la santé : le sucre dissous dans un soda reste du sucre.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Comment prouver qu'une eau est pure (pression normale) ?", "c": ["Elle bout exactement à 100 °C", "Elle est froide", "Elle a bon goût", "Elle est transparente"], "a": 0, "e": "Corps pur : changement d'état à température constante (100 °C pour l'eau).", "d": "<b>Elle bout à 100,0 °C exactement</b> (et gèle à 0 °C) : température CONSTANTE.<div class='ex-detail'><u>Exemple rédigé</u> : méthode : suivre la température pendant l'ébullition : si le thermomètre reste bloqué à 100 °C → corps pur (probablement de l'eau pure) ; si ça monte progressivement au-delà → mélange (ex. eau salée bout vers 101-102 °C). Piège : « transparente » : l'eau salée est transparente aussi : la transparence ne prouve RIEN : seuls les changements d'état tranchent.</div>"},
{"t": "L'eau : mélanges et corps purs (5e)", "q": "Mélange homogène signifie…", "c": ["qu'on ne distingue qu'une phase à l'œil nu", "qu'il n'y a qu'une seule espèce chimique", "qu'on peut le filtrer", "qu'il est liquide"], "a": 0, "e": "Homogène : une seule phase VISIBLE ; ça peut contenir plusieurs espèces.", "d": "<b>Une seule phase visible</b> — mais possiblement plusieurs espèces chimiques.<div class='ex-detail'><u>Exemple rédigé</u> : l'eau sucrée : homogène (une phase) mais deux espèces (eau + sucre dissous). L'air : homogène, plusieurs gaz. Un corps pur : homogène ET une seule espèce. Piège : « une seule espèce chimique » : ce serait un CORPS PUR : homogène ≠ pur : c'est la distinction la plus testée du chapitre.</div>"},
{"t": "États et changements d'état (5e)", "q": "Dans un liquide, les particules sont…", "c": ["très éloignées et immobiles", "serrées et ordonnées", "immobiles et ordonnées", "serrées mais désordonnées, elles glissent"], "a": 3, "e": "Liquide : serré (comme le solide) mais désordonné : les particules glissent les unes sur les autres.", "d": "<b>Serrées et désordonnées</b> : le liquide coule et prend la forme du récipient parce que ses particules GLISSENT.<div class='ex-detail'><u>Exemple rédigé</u> : comparatif complet : solide = serré + ordonné (forme propre) ; liquide = serré + désordonné (forme du récipient) ; gaz = éloigné + désordonné (occupe tout). Piège : « immobiles » : RIEN n'est immobile : même dans un solide, les particules vibrent : c'est la température qui mesure cette agitation.</div>"},
{"t": "États et changements d'état (5e)", "q": "Le passage solide → liquide s'appelle…", "c": ["la liquéfaction", "la solidification", "la fusion", "la sublimation"], "a": 2, "e": "Solide → liquide = fusion (le contraire : solidification).", "d": "<b>La fusion</b> : solide → liquide.<div class='ex-detail'><u>Exemple rédigé</u> : mémoire : « fusion » comme fondre un glaçon. Les 6 noms : fusion (S→L), solidification (L→S), vaporisation (L→G), liquéfaction (G→L), sublimation (S→G), condensation solide (G→S). Piège : « liquéfaction » est réservé au gaz→liquide : vocabulaire précis exigé en contrôle.</div>"},
{"t": "États et changements d'état (5e)", "q": "Le givre se forme sur une vitre froide : c'est une…", "c": ["solidification", "vaporisation", "condensation solide (gaz → solide)", "fusion"], "a": 2, "e": "La vapeur d'eau passe directement de l'état gazeux à l'état solide.", "d": "<b>Condensation solide</b> : vapeur d'eau (gaz) → glace (solide), sans passer par le liquide.<div class='ex-detail'><u>Exemple rédigé</u> : la vitre froide capte la vapeur d'air ambiant : les molécules se figent directement en cristaux. Identique : la neige qui se forme dans les nuages. Piège : « solidification » part d'un LIQUIDE : ici il n'y a jamais eu de goutte : le sens de lecture (état de départ → arrivée) évite l'erreur.</div>"},
{"t": "États et changements d'état (5e)", "q": "La « fumée » blanche au-dessus d'une casserole d'eau chaude est…", "c": ["de l'air chaud", "des gouttelettes d'eau liquide", "de la vapeur d'eau (gaz)", "du dioxygène"], "a": 1, "e": "La vapeur est INVISIBLE ; le nuage blanc = eau déjà liquéfiée en microgouttelettes.", "d": "<b>Des gouttelettes LIQUIDES</b> : la vapeur d'eau, invisible, se liquéfie au contact de l'air plus froid.<div class='ex-detail'><u>Exemple rédigé</u> : à 1 cm au-dessus du bec de la bouilloire, on ne voit RIEN : c'est la vapeur (gaz). Le blanc visible commence plus haut : liquéfaction déjà effectuée (comme un nuage ou la buée). Piège : ce que l'on VOIT n'est jamais de la vapeur d'eau : ce blanc « épaissit » même les énoncés pièges : invisible = gaz.</div>"},
{"t": "États et changements d'état (5e)", "q": "Un glaçon de 20 g fond complètement. On obtient…", "c": ["plus de 20 g", "20 g d'eau", "moins de 20 g (une partie s'évapore)", "10 g d'eau"], "a": 1, "e": "La masse se conserve lors d'un changement d'état.", "d": "<b>20 g d'eau</b> : la masse ne change JAMAIS lors d'un changement d'état.<div class='ex-detail'><u>Exemple rédigé</u> : seules les distances entre particules changent, pas leur quantité : 20 g de glace → 20 g d'eau liquide (dont le volume est plus petit : exception de l'eau). Piège : « une partie s'évapore » : lors d'une FUSION lente, tout se liquéfie : même si une évaporation négligeable existait, l'énoncé attend la conservation : c'est une loi du chapitre.</div>"},
{"t": "États et changements d'état (5e)", "q": "Ébullition et vaporisation : quelle relation ?", "c": ["Ce sont des synonymes", "Aucune relation", "La vaporisation est plus rapide", "L'ébullition est une vaporisation rapide qui forme des bulles"], "a": 3, "e": "Vaporisation (lente, à toute température) ⊂ ébullition = rapide, avec bulles, à 100 °C pour l'eau pure.", "d": "<b>L'ébullition est une vaporisation RAPIDE</b> : bulles qui naissent DANS le liquide.<div class='ex-detail'><u>Exemple rédigé</u> : une flaque s'évapore à 15 °C : vaporisation LENTE en surface, sans bulles. La même eau à 100 °C (pression normale) bout : bulles + vapeur massive. Piège : « synonymes » : non : l'ébullition a une température précise, la vaporisation a lieu à toute température : question de vocabulaire, réponse de précision.</div>"},
{"t": "États et changements d'état (5e)", "q": "Pourquoi la glace flotte-t-elle sur l'eau ?", "c": ["Le froid pousse vers le haut", "Elle est plus légère au sens de masse", "L'eau solide est moins dense que l'eau liquide", "Elle contient de l'air"], "a": 2, "e": "Exception de l'eau : le solide est MOINS dense que le liquide.", "d": "<b>L'eau solide est moins dense que l'eau liquide</b> : à masse égale, la glace occupe plus de volume.<div class='ex-detail'><u>Exemple rédigé</u> : la plupart des substances coulent dans leur propre liquide solidifié ; l'eau est l'exception (structure cristalline aérée de la glace). Conséquences : icebergs, canettes gelées qui explosent, étang qui gèle en surface seulement (protégeant la vie aquatique). Piège : « plus légère » : un glaçon de 1 kg pèse 1 kg : c'est la DENSITÉ (masse pour un même volume), pas la masse.</div>"},
{"t": "États et changements d'état (5e)", "q": "Solide → gaz directement : c'est…", "c": ["la sublimation", "la fusion", "la liquéfaction", "la condensation solide"], "a": 0, "e": "Solide → gaz sans passer par le liquide : sublimation.", "d": "<b>La sublimation</b> : solide → gaz directement.<div class='ex-detail'><u>Exemple rédigé</u> : exemples : la neige qui disparaît par grand froid sans mouiller le sol ; le « linge qui sèche gelé » ; la carboglace (CO₂ solide) qui fume sans laisser de flaque. Piège : ne pas confondre avec la condensation solide qui est le sens INVERSE (gaz → solide : givre) : la flèche du changement se lit TOUJOURS de l'état initial vers le final.</div>"},
{"t": "États et changements d'état (5e)", "q": "Un gaz, dans un récipient fermé :", "c": ["se place au milieu", "se tasse si on secoue", "reste en bas du récipient", "occupe tout le volume disponible"], "a": 3, "e": "Les particules de gaz, éloignées et rapides, se dispersent dans tout l'espace.", "d": "<b>Il occupe tout le volume disponible</b> : particules éloignées, très agitées.<div class='ex-detail'><u>Exemple rédigé</u> : c'est LA différence structurale avec le liquide (qui garde une surface libre) : un parfum ouvert remplit toute la pièce, un gaz dans une bouteille occupe toute la bouteille. Piège : « se tasse si on secoue » : un gaz ne se range pas : seule une PRESSION le comprime (réduction des distances entre particules), pas une agitation.</div>"},
{"t": "États et changements d'état (5e)", "q": "Le niveau d'eau d'un verre contenant un glaçon qui fond (pas de débordement) :", "c": ["monte fortement", "ne change pas", "descend", "double"], "a": 1, "e": "Glaçon flottant : la fonte ne change pas le niveau (l'eau fondu remplace exactement le volume immergé déplacé).", "d": "<b>Il ne change pas</b> : c'est la question qui piège tout le monde.<div class='ex-detail'><u>Exemple rédigé</u> : le glaçon flotte : il déplace déjà un volume d'eau égal à sa MASSE (principe de la flottaison). En fondant, l'eau liquide produite (même masse) occupe exactement ce volume déplacé : niveau inchangé. Réalité géante : la fonte de la banquise de MER ne monte pas la mer ; c'est la fonte des GLACIERS SUR TERRE qui la fait monter. Piège : « monte fortement » : intuitif mais faux.</div>"},
{"t": "Le circuit électrique en série (5e)", "q": "Le courant circule uniquement si le circuit est…", "c": ["fermé (boucle complète)", "en plastique", "ouvert", "chaud"], "a": 0, "e": "Circuit fermé = boucle complète : condition nécessaire au passage du courant.", "d": "<b>Fermé</b> : la boucle doit être continue du + au − du générateur.<div class='ex-detail'><u>Exemple rédigé</u> : l'interrupteur est justement le composant qui ouvre/ferme la boucle à volonté : ouvert, il coupe TOUT (même les autres lampes en série). Piège : « ouvert » veut dire circuit SANS courant : vocabulaire trompeur mais standard : circuit ouvert = interrompu.</div>"},
{"t": "Le circuit électrique en série (5e)", "q": "Dans un circuit en série, l'intensité du courant…", "c": ["diminue le long du circuit", "est la même en tout point", "double à chaque lampe", "est nulle au retour"], "a": 1, "e": "Loi d'unicité : I identique partout dans la boucle.", "d": "<b>La même en tout point</b> : loi d'unicité de l'intensité en série.<div class='ex-detail'><u>Exemple rédigé</u> : mesurer avec des ampèremètres en 3 points différents : tous affichent la même valeur. Le courant n'est pas « mangé » par les lampes : ce qui est converti, c'est de l'ÉNERGIE, pas le courant. Piège : « diminue le long » est l'intuition fausse la plus répandue : elle confond courant et énergie.</div>"},
{"t": "Le circuit électrique en série (5e)", "q": "Deux lampes en série. On dévisse la lampe 2. La lampe 1…", "c": ["brille pareil", "brille plus fort", "s'éteint", "clignote"], "a": 2, "e": "La boucle est ouverte : plus de courant nulle part.", "d": "<b>Elle s'éteint</b> : le circuit est ouvert, l'intensité devient nulle partout.<div class='ex-detail'><u>Exemple rédigé</u> : application concrète : les anciennes guirlandes de Noël en série : une ampoule grillée = guirlande morte : il fallait tester chaque ampoule ! C'est le défaut du série (et l'avantage du dérivation, vu en 4e). Piège : « brille plus fort » confond avec le cas où on REMPLACE la lampe par un fil : là, oui, la lampe restante brillerait plus : mais DÉVISSER ouvre la boucle.</div>"},
{"t": "Le circuit électrique en série (5e)", "q": "Le sens conventionnel du courant va…", "c": ["de la borne − vers la borne +", "peu importe", "du moteur vers la lampe", "de la borne + vers la borne − (à l'extérieur du générateur)"], "a": 3, "e": "+ → − à l'extérieur du générateur.", "d": "<b>De la borne + vers la borne −</b> à l'extérieur du générateur.<div class='ex-detail'><u>Exemple rédigé</u> : c'est une CONVENTION (les électrons vont en fait dans l'autre sens, mais on garde le sens historique). Utilité : orienter les schémas et placer correctement les appareils (ampèremètre : courant entrant par sa borne +). Piège : « peu importe » : en 5e, sur un schéma, la flèche du courant se dessine DANS le sens conventionnel : ce n'est pas négociable.</div>"},
{"t": "Le circuit électrique en série (5e)", "q": "Quel appareil mesure l'intensité du courant ?", "c": ["L'ohmmètre", "Le compteur", "L'ampèremètre", "Le voltmètre"], "a": 2, "e": "Ampèremètre (unité : l'ampère, A) ; il se branche EN SÉRIE.", "d": "<b>L'ampèremètre</b>, en série dans la boucle ; unité : l'ampère (A).<div class='ex-detail'><u>Exemple rédigé</u> : placez-le n'importe où dans la boucle série : même valeur (unicité !). Le VOLTMÈTRE, lui, mesure la tension (en volts) et se branche en DÉRIVATION aux bornes d'un dipôle. Piège : inverser les deux détruit l'ampèremètre (il agit comme un fil : court-circuit) : question de sécurité autant que de cours.</div>"},
{"t": "Le circuit électrique en série (5e)", "q": "Le symbole du générateur : la grande barre représente…", "c": ["la borne +", "la masse", "le fusible", "la borne −"], "a": 0, "e": "Grande barre = borne + ; petite barre = borne −.", "d": "<b>La borne +</b> : la longue barre.<div class='ex-detail'><u>Exemple rédigé</u> : mémoire : « le plus, c'est le plus long ». Sur un schéma, repérer + et − en premier : tout le sens conventionnel du courant en découle (+ vers − à l'extérieur). Piège : se tromper de bornes inverse le sens du courant : si le circuit comporte une DEL, elle ne s'allume que dans UN sens : un test immédiat de l'orientation.</div>"},
{"t": "Le circuit électrique en série (5e)", "q": "Dans une boucle série avec une pile, une lampe et un moteur, si on inverse l'ordre (moteur puis lampe) :", "c": ["le moteur tourne moins vite", "la lampe brille plus", "rien ne change (mêmes effets)", "tout s'arrête"], "a": 2, "e": "En série, l'ordre ne change ni l'intensité ni le fonctionnement.", "d": "<b>Rien ne change</b> : la boucle est unique, l'intensité y est la même partout.<div class='ex-detail'><u>Exemple rédigé</u> : le courant traverse les dipôles les uns après les autres, quel que soit leur ordre : I identique, effets identiques. (Nuance pour plus tard : la tension, elle, se répartit selon les dipôles, mais leur ORDRE n'y change rien non plus.) Piège : « la lampe brille plus » : intuition fausse : il n'y a pas de « premier servi » dans une boucle série.</div>"},
{"t": "Le circuit électrique en série (5e)", "q": "Un interrupteur ouvert dans un circuit série :", "c": ["il ne coupe que la lampe suivante", "il coupe le courant dans tout le circuit", "il fait briller la lampe à moitié", "il laisse passer le courant"], "a": 1, "e": "Interrupteur ouvert = circuit ouvert = courant nul partout.", "d": "<b>Il coupe le courant dans TOUT le circuit</b> : boucle interrompue.<div class='ex-detail'><u>Exemple rédigé</u> : c'est le principe de l'interrupteur de maison : il ouvre la boucle, tout ce qui est derrière s'éteint. Fermer l'interrupteur « referme » la boucle : le courant rétablit dans l'instant (les électrons sont déjà là, prêts à bouger ensemble : comme une file de voitures qui démarre d'un coup). Piège : « ne coupe que la lampe suivante » : en série, TOUT est derrière l'interrupteur : une seule boucle, un seul destin.</div>"},
{"t": "Le circuit électrique en série (5e)", "q": "Un dipôle, c'est…", "c": ["un appareil de mesure", "un circuit fermé", "une pile", "un composant à 2 bornes de connexion"], "a": 3, "e": "Di-pôle : deux pôles/bornes (lampe, pile, moteur, interrupteur…).", "d": "<b>Un composant possédant deux bornes</b> de raccordement.<div class='ex-detail'><u>Exemple rédigé</u> : exemples : pile (2 bornes), lampe (2 bornes), moteur, interrupteur : tous les dipôles du circuit de 5e. Le mot dit tout : « di » = deux, « pôle » = borne. Piège : le mot ne dit pas ce que fait le composant : une lampe, un moteur et une résistance sont tous des dipôles, mais ils CONVERTISSENT différemment (lumière, mouvement, chaleur).</div>"},
{"t": "Le circuit électrique en série (5e)", "q": "Le rôle du générateur dans le circuit est de…", "c": ["fournir l'énergie électrique au circuit", "stocker le courant", "consommer l'énergie", "mesurer la tension"], "a": 0, "e": "Il fournit l'énergie (pile, batterie, dynamo) que les récepteurs convertissent.", "d": "<b>Fournir l'énergie électrique</b> : c'est la « source » de la boucle.<div class='ex-detail'><u>Exemple rédigé</u> : chaîne complète : générateur (fournit) → transport par le courant → récepteurs (convertissent : lampe → lumière, moteur → mouvement). Le courant, lui, ne fait que TRANSPORTER l'énergie en boucle : il n'est pas stocké ni consommé. Piège : « stocker le courant » : une pile stocke de l'ÉNERGIE chimique, pas du courant : le courant n'existe que quand la boucle est fermée.</div>"},
{"t": "La lumière : sources et ombres (5e)", "q": "La Lune est…", "c": ["invisible le jour", "un objet diffusant (renvoie la lumière du Soleil)", "une source secondaire qui fabrique sa lumière", "une source primaire de lumière"], "a": 1, "e": "La Lune ne produit pas de lumière : elle diffuse celle du Soleil.", "d": "<b>Un objet diffusant</b> : éclairée par le Soleil, elle renvoie la lumière dans toutes les directions.<div class='ex-detail'><u>Exemple rédigé</u> : test décisif : éteignez le Soleil : la Lune disparaît (nouvelle lune = face non éclairée tournée vers nous). Une lampe, elle, brillerait encore : source primaire. Piège : « source secondaire » n'est pas le bon terme : diffusant = éclairé-qui-renvoie, sans jamais PRODUIRE.</div>"},
{"t": "La lumière : sources et ombres (5e)", "q": "Dans l'air, la lumière se propage…", "c": ["en ligne droite", "en courbes qui contournent les obstacles", "en spirale", "par vagues visibles"], "a": 0, "e": "Propagation rectiligne dans un milieu transparent et homogène.", "d": "<b>En ligne droite</b> : c'est l'hypothèse de base du chapitre (milieu homogène).<div class='ex-detail'><u>Exemple rédigé</u> : preuve : les 3 cartons percés alignés : bouger UNE carte suffit à couper la lumière. Conséquences : ombres nettes, éclipses, rayons représentés par des segments fléchés. Piège : « contourne les obstacles » : si c'était vrai, il n'y aurait AUCUNE ombre derrière un mur : l'expérience quotidienne dément.</div>"},
{"t": "La lumière : sources et ombres (5e)", "q": "Un livre posé sur une table éclairée : on le voit parce que…", "c": ["il produit sa propre lumière", "il diffuse vers notre œil la lumière qu'il reçoit", "nos yeux projettent des rayons", "l'air le rend visible"], "a": 1, "e": "Objet diffusant : éclairé → renvoie la lumière → l'œil la capte.", "d": "<b>Il diffuse la lumière reçue vers notre œil</b> : chaîne source → objet → œil.<div class='ex-detail'><u>Exemple rédigé</u> : dans le noir absolu, le même livre est INVISIBLE (aucune lumière à diffuser). Piège : « nos yeux projettent des rayons » : c'est la vieille théorie grecque fausse : l'œil est un RÉCEPTEUR : il ne sort rien, il reçoit. La lumière voyage dans UN sens : source vers récepteur.</div>"},
{"t": "La lumière : sources et ombres (5e)", "q": "La zone sombre SUR l'écran derrière un objet éclairé s'appelle…", "c": ["l'ombre propre", "la pénombre", "l'ombre portée", "le cône d'ombre"], "a": 2, "e": "Ombre portée : projetée sur l'écran ; ombre propre = face non éclairée de l'objet.", "d": "<b>L'ombre portée</b> : projetée sur un support (écran, sol, mur).<div class='ex-detail'><u>Exemple rédigé</u> : vocabulaire complet : ombre PROPRE = la face sombre de la balle elle-même ; ombre PORTÉE = le disque sombre sur le mur ; CÔNE d'ombre = le volume sombre entier derrière la balle. Piège : le « propre/porté » se confond sans cesse en contrôle : propre = SUR l'objet, porté = AILLEURS (projeté).</div>"},
{"t": "La lumière : sources et ombres (5e)", "q": "Une éclipse totale de Soleil : depuis le cône d'ombre de la Lune, on voit…", "c": ["la Lune rouge", "un anneau de Soleil", "le Soleil entièrement caché par la Lune", "le Soleil en entier"], "a": 2, "e": "Dans le cône d'ombre, la source est totalement masquée : éclipse totale.", "d": "<b>Le Soleil entièrement caché</b> : la Lune intercepte tout.<div class='ex-detail'><u>Exemple rédigé</u> : alignement : Soleil (source) — Lune (objet) — Terre (écran/observateur). Dans le cône d'ombre de la Lune : jour devenu nuit, couronne solaire visible autour du disque noir. En pénombre : éclipse partielle (le Soleil semble « mordu »). Piège : la propagation RECTILIGNE explique tout : si la lumière contournait la Lune, aucune éclipse ne serait totale.</div>"},
{"t": "La lumière : sources et ombres (5e)", "q": "Vitesse de la lumière dans le vide ≈", "c": ["3 000 km/s", "300 km/s", "300 000 km/s", "instantanée (infinie)"], "a": 2, "e": "Environ 300 000 km/s (3×10⁸ m/s) : très grande mais FINIE.", "d": "<b>≈ 300 000 km/s</b> : la lumière voyage vite mais pas infiniment.<div class='ex-detail'><u>Exemple rédigé</u> : ordres de grandeur : Terre-Lune : 1,3 s ; Soleil-Terre : 8 min ; Proxima du Centaure : 4 ans. Voir une étoile lointaine = voir son PASSÉ. Piège : « instantanée » : historiquement on le croyait (Galilée n'avait pas réussi à mesurer) : mais l'infini est faux : la lumière « met » un temps : chaque regard vers le ciel est un voyage dans le temps.</div>"},
{"t": "La lumière : sources et ombres (5e)", "q": "Avec une source étendue (grande lampe), l'ombre derrière une balle présente…", "c": ["une ombre (zone totalement sombre) entourée d'une pénombre", "une ombre nette seulement", "deux ombres séparées", "aucune ombre"], "a": 0, "e": "Source étendue : ombre + pénombre (zone de demi-teinte).", "d": "<b>Ombre nette + pénombre</b> : au cœur, aucun rayon n'arrive (ombre) ; au bord, une partie de la source est visible (pénombre).<div class='ex-detail'><u>Exemple rédigé</u> : source PONCTUELLE : ombre nette seulement (tout ou rien). Source ÉTENDUE : les bords de l'ombre s'adoucissent en dégradé : c'est pour ça que les ombres du quotidien (Soleil = source étendue) ont des bords flous. Piège : la pénombre n'est pas « l'ombre légère » : c'est une zone où la source est PARTIELLEMENT visible : définition précise.</div>"},
{"t": "La lumière : sources et ombres (5e)", "q": "Pour tracer l'ombre portée d'une balle sur un écran (source ponctuelle), on dessine…", "c": ["une flèche de l'œil vers la source", "un rayon vers le centre de la balle", "deux rayons tangents à la balle, prolongés jusqu'à l'écran", "un cercle autour de la balle"], "a": 2, "e": "Les 2 rayons qui « frôlent » la balle délimitent l'ombre portée.", "d": "<b>Deux rayons tangents à l'objet</b>, prolongés jusqu'à l'écran : l'ombre est entre les deux points d'impact.<div class='ex-detail'><u>Exemple rédigé</u> : méthode de tracé : ① relier la source aux points extrêmes de l'objet (les 2 tangentes) ; ② prolonger en lignes droites jusqu'à l'écran ; ③ relier les 2 points obtenus : voilà l'ombre portée. Piège : un seul rayon (vers le centre) ne donne aucune DIMENSION : l'ombre est une surface : il faut la borner par 2 rayons.</div>"},
{"t": "La lumière : sources et ombres (5e)", "q": "L'ombre portée d'un objet devient plus grande quand…", "c": ["on rapproche l'objet de la source", "on éloigne l'objet de la source (écran fixe)", "on éteint la lampe", "on rapproche l'écran de la source"], "a": 1, "e": "Plus l'objet est loin de la source, plus le cône d'ombre s'évase : ombre portée plus grande.", "d": "<b>L'objet s'éloigne de la source</b> (à écran fixe) : l'ombre grandit.<div class='ex-detail'><u>Exemple rédigé</u> : expérience : la main près d'une lampe fait une ombre GÉANTE sur le mur opposé (théâtre d'ombres chinois !) : près de la source = grand cône. Près de l'écran : ombre quasi taille réelle. Piège : le taille de l'ombre dépend de la géométrie source-objet-écran : pas de l'intensité de la lampe.</div>"},
{"t": "La lumière : sources et ombres (5e)", "q": "Parmi ces objets, lequel est une source primaire ?", "c": ["Un miroir", "Un livre éclairé", "La Lune", "Une bougie allumée"], "a": 3, "e": "La flamme PRODUIT sa lumière : source primaire ; les trois autres ne font que diffuser.", "d": "<b>La bougie allumée</b> : sa flamme produit sa propre lumière (réaction chimique = énergie → lumière).<div class='ex-detail'><u>Exemple rédigé</u> : passez au filtre « PRODUIT ou RENVOIE ? » : miroir = renvoie (diffusion spéculaire), Lune = renvoie, livre = renvoie, flamme = PRODUIT. Autres sources primaires : Soleil, écran allumé, luciole (bioluminescence), LED alimentée. Piège : le miroir est le piège royal : il ne crée RIEN, il réfléchit : éteignez la source, le miroir devient noir.</div>"},
{"t": "Le son : vibration et propagation (5e)", "q": "Tout son est produit par…", "c": ["une lumière forte", "un objet chauffé", "une source qui vibre", "un gaz"], "a": 2, "e": "La vibration de la source bouscule le milieu : le son naît.", "d": "<b>Une source qui VIBRE</b> : corde, membrane, cordes vocales.<div class='ex-detail'><u>Exemple rédigé</u> : test au sable : sur un haut-parleur qui joue, des grains de riz dansent : la membrane vibre visiblement. Coupé le courant : plus de vibration, plus de son. Piège : « un objet chauffé » confond avec le cas particulier des explosions ; la définition générale passe toujours par la VIBRATION : 5 questions sur 10 du chapitre en découlent.</div>"},
{"t": "Le son : vibration et propagation (5e)", "q": "Le son se propage-t-il dans le vide ?", "c": ["Oui, comme la lumière", "Oui mais plus lentement", "Seulement les sons graves", "Non, il faut un milieu matériel"], "a": 3, "e": "Sans particules pour transmettre la vibration, aucun son : la cloche à vide le prouve.", "d": "<b>Non</b> : le son a besoin de matière (air, eau, métal).<div class='ex-detail'><u>Exemple rédigé</u> : expérience clé : cloche à vide : on VOIT la cloche vibrer (la lumière traverse le vide) mais on ne l'ENTEND plus quand l'air est aspiré. Différence fondamentale : la lumière se propage dans le vide, le son jamais. Piège : les explosions spatiales du cinéma : dans l'espace réel : silence total : l'air manque.</div>"},
{"t": "Le son : vibration et propagation (5e)", "q": "Vitesse du son dans l'air ≈", "c": ["300 000 km/s", "340 m/s", "150 km/h", "1500 m/s"], "a": 1, "e": "Environ 340 m/s dans l'air (à 15 °C).", "d": "<b>≈ 340 m/s</b> dans l'air.<div class='ex-detail'><u>Exemple rédigé</u> : comparaison qui marque : lumière ≈ 300 000 km/s = 1 million de fois plus vite ! Le son est « lent » : on voit le feu d'artifice AVANT le boum, l'éclair avant le tonnerre. Piège : « 1500 m/s » : c'est dans l'EAU ; « 300 000 km/s » : c'est la LUMIÈRE : les valeurs s'échangent entre les QCM dans les QCM : 340 m/s = air, à retenir absolument.</div>"},
{"t": "Le son : vibration et propagation (5e)", "q": "Un son grave diffère d'un son aigu par…", "c": ["sa fréquence (nombre de vibrations par seconde)", "son amplitude", "sa vitesse", "sa couleur"], "a": 0, "e": "Fréquence faible = grave ; fréquence grande = aigu.", "d": "<b>La fréquence</b> : le nombre de vibrations par seconde (en hertz, Hz).<div class='ex-detail'><u>Exemple rédigé</u> : la grosse caisse vibre lentement (~50 fois/s) : GRAVE ; la flûte vibre vite (~1000 fois/s) : AIGU. L'AMPLITUDE, elle, fait le FORT ou le DOUX (indépendant du grave/aigu : on peut crier grave). Piège : mélanger amplitude et fréquence est l'erreur classique : amplitude = volume, fréquence = hauteur : deux curseurs distincts.</div>"},
{"t": "Le son : vibration et propagation (5e)", "q": "Éclair vu, tonnerre entendu 6 s plus tard. Distance de l'orage ?", "c": ["≈ 18 km", "≈ 2 km", "≈ 6 km", "≈ 340 m"], "a": 1, "e": "d = 340 × 6 = 2040 m ≈ 2 km.", "d": "<b>≈ 2 km</b> : d = v × t = 340 × 6 = 2040 m.<div class='ex-detail'><u>Exemple rédigé</u> : astuce de terrain : secondes ÷ 3 = kilomètres (6 ÷ 3 = 2) : le calcul exact (340 m/s) confirme. Le décalage existe parce que la lumière est quasi instantanée alors que le son met ~3 s par km. Piège : « 6 km » : copier le nombre de secondes comme des kilomètres : toujours MULTIPLIER par la vitesse, jamais copier le temps.</div>"},
{"t": "Le son : vibration et propagation (5e)", "q": "Dans quel milieu le son se propage-t-il le plus vite ?", "c": ["Le vide", "L'eau", "L'air", "L'acier"], "a": 3, "e": "Plus le milieu est rigide, plus la vibration se transmet vite : acier > eau > air.", "d": "<b>L'acier</b> (≈ 5000-6000 m/s) : la rigidité accélère la transmission de particule à particule.<div class='ex-detail'><u>Exemple rédigé</u> : classement : acier > eau (1500) > air (340). Expérience d'école : mettre l'oreille contre un rail : on entend le train AVANT de l'entendre par l'air. Piège : « le vide » : le son n'y passe PAS du tout : ce n'est pas une question de vitesse mais d'EXISTENCE.</div>"},
{"t": "Le son : vibration et propagation (5e)", "q": "Le sonar d'un bateau mesure la profondeur : il émet, reçoit l'écho 4 s plus tard (v = 1500 m/s dans l'eau). Profondeur ?", "c": ["1500 m", "6000 m", "375 m", "3000 m"], "a": 3, "e": "d = v × t ÷ 2 = 1500 × 4 ÷ 2 = 3000 m.", "d": "<b>3000 m</b> : l'écho fait un ALLER-RETOUR : diviser par 2.<div class='ex-detail'><u>Exemple rédigé</u> : piège n° 1 du sonar : le son descend PUIS remonte : distance = (v × t)/2 = 1500×4/2 = 3000 m. Sans la division : 6000 m : le bateau « sonderait » le double de la réalité. Piège : l'écho n'est pas une propriété magique : c'est la RÉFLEXION du son sur le fond, exactement comme une balle qui rebondit.</div>"},
{"t": "Le son : vibration et propagation (5e)", "q": "Comment le son se transmet-il dans l'air ?", "c": ["Par un trou dans l'air", "Les particules d'air voyagent de la source à l'oreille", "Par une lumière particulière", "Les particules vibrent sur place et transmettent la vibration de proche en proche"], "a": 3, "e": "Les particules oscillent sur place : c'est la VIBRATION qui avance, pas la matière.", "d": "<b>De proche en proche</b> : chaque particule vibre sur place et pousse sa voisine.<div class='ex-detail'><u>Exemple rédigé</u> : modèle : une rangée de dominos ou un « rush » dans un stade : chaque personne bouge à peine sur place, mais l'onde traverse tout le stade. Preuve que l'air ne voyage pas : la source ne « vide » pas son côté : après le concert, l'air est toujours là, au même endroit. Piège : croire que le son « transporte de l'air » : il transporte de l'ÉNERGIE, pas de la matière.</div>"},
{"t": "Le son : vibration et propagation (5e)", "q": "L'amplitude de la vibration détermine…", "c": ["l'écho", "le fort ou le doux", "le grave ou l'aigu", "la vitesse du son"], "a": 1, "e": "Amplitude grande = son fort ; amplitude faible = son doux.", "d": "<b>Le FORT ou le DOUX</b> (l'intensité) : c'est l'amplitude.<div class='ex-detail'><u>Exemple rédigé</u> : frappez doucement puis fort un tambour : la membrane fait le même nombre de vibrations par seconde (même note de « basse ») mais débat sur une plus grande distance : l'air reçoit plus d'énergie : plus fort. Piège : « grave ou aigu » : c'est la FRÉQUENCE : les deux propriétés (amplitude, fréquence) sont indépendantes : un son peut être fort ET grave, doux ET aigu : toutes les combinaisons existent.</div>"},
{"t": "Le son : vibration et propagation (5e)", "q": "Pourquoi voit-on l'éclair avant d'entendre le tonnerre ?", "c": ["La lumière va ~1 million de fois plus vite que le son", "Le tonnerre est produit après l'éclair", "L'oreille hésite", "Le son repart en arrière"], "a": 0, "e": "Lumière ≈ instantanée ; son = 340 m/s : le décalage vient des vitesses.", "d": "<b>La lumière est ~1 million de fois plus rapide</b> que le son.<div class='ex-detail'><u>Exemple rédigé</u> : à 3 km : la lumière arrive en 0,00001 s (instantané), le son en ~9 s. On en fait une MESURE : secondes ÷ 3 = kilomètres. Remarque : l'éclair et le tonnerre sont produits EN MÊME TEMPS (même phénomène) : seul le transport diffère. Piège : « le tonnerre est produit après » : faux : tout est dans les vitesses de propagation.</div>"},
{"t": "L'air : composition et pression (4e)", "q": "Le gaz majoritaire de l'air est…", "c": ["le dioxygène", "le dioxyde de carbone", "l'hydrogène", "le diazote"], "a": 3, "e": "Diazote ≈ 78 % ; dioxygène ≈ 21 %.", "d": "<b>Le diazote</b> : environ 78 % de l'air.<div class='ex-detail'><u>Exemple rédigé</u> : répartition : sur 100 particules d'air : ~78 de diazote (N₂), ~21 de dioxygène (O₂), ~1 d'autres (argon, CO₂…). Piège ultra-classique : croire que l'air est « surtout de l'oxygène » parce qu'on respire : nous respirons le minoritaire : le diazote, lui, traverse nos poumons sans réagir.</div>"},
{"t": "L'air : composition et pression (4e)", "q": "L'air a une masse. Celle de 2 L d'air ≈", "c": ["0 g (impondérable)", "2,6 g", "260 g", "13 g"], "a": 1, "e": "≈ 1,3 g/L : 2 L pèsent 2,6 g.", "d": "<b>≈ 2,6 g</b> : masse volumique de l'air ≈ 1,3 g/L.<div class='ex-detail'><u>Exemple rédigé</u> : calcul : m = 1,3 × 2 = 2,6 g. Ordres de grandeur : une bouteille d'1 m³ d'air (1000 L) pèse 1,3 kg ; l'air d'une salle de classe ~250 kg. Piège : « impondérable » : l'air a une masse, comme tout gaz : c'est juste très léger au litre : l'addition des litres fait la différence.</div>"},
{"t": "L'air : composition et pression (4e)", "q": "Un ballon gonflé pèse 617 g, dégonflé 612 g. Masse d'air ajoutée ?", "c": ["5 g", "0 g", "617 g", "612 g"], "a": 0, "e": "617 − 612 = 5 g d'air injecté.", "d": "<b>5 g</b> : la différence de masse est la masse d'air ajoutée.<div class='ex-detail'><u>Exemple rédigé</u> : sous-question classique : « quel volume ? » : V = 5 ÷ 1,3 ≈ 3,8 L. L'expérience est LA preuve historique que l'air pèse (Galilée en débattait déjà). Piège : répondre « 0 g, l'air ne pèse rien » : le piège du bon sens : le ballon gonflé est MESURABLEMENT plus lourd.</div>"},
{"t": "L'air : composition et pression (4e)", "q": "La pression atmosphérique au niveau de la mer vaut environ…", "c": ["1013 hPa", "300 hPa", "1,3 hPa", "1013 Pa"], "a": 0, "e": "≈ 1013 hPa (soit 101 300 Pa, ≈ 1 bar).", "d": "<b>≈ 1013 hPa</b> (101 300 Pa).<div class='ex-detail'><u>Exemple rédigé</u> : la météo parle en hPa : une dépression (mauvais temps) passe sous 1010, l'anticyclone (beau temps) au-dessus de 1020. Sens physique : 1013 hPa sur une main (~150 cm²) = une force de ~1500 N ≈ le poids de 150 kg : la pression est ÉNORME mais équilibrée des deux côtés. Piège : « 1013 Pa » : faussement d'un facteur 100 : bien lire l'unité hPa.</div>"},
{"t": "L'air : composition et pression (4e)", "q": "On comprime la moitié d'une seringue bouchée (même air, moitié du volume). La pression de l'air dedans…", "c": ["diminue", "devient nulle", "augmente", "ne change pas"], "a": 2, "e": "Mêmes particules, moitié de volume : chocs plus fréquents : pression plus grande.", "d": "<b>Elle augmente</b> : la compression augmente la pression.<div class='ex-detail'><u>Exemple rédigé</u> : modèle : les mêmes particules dans un volume réduit frappent les parois plus souvent : pression ↑. C'est ce que ressent votre pouce qui bouche la seringue. L'inverse (détente) : on relâche, le volume augmente, la pression baisse. Piège : « ne change pas » : la pression ne dépend pas seulement de la quantité d'air mais du VOLUME offert : compression = les deux bougent en sens inverse.</div>"},
{"t": "L'air : composition et pression (4e)", "q": "En montagne à 3000 m, l'eau bout…", "c": ["elle ne bout pas", "vers 112 °C (plus tard)", "à 100 °C comme partout", "vers 88 °C (plus tôt)"], "a": 3, "e": "Pression plus basse → ébullition plus tôt, à moins de 100 °C.", "d": "<b>Vers 88 °C</b> : la température d'ébullition baisse avec la pression.<div class='ex-detail'><u>Exemple rédigé</u> : mécanisme : l'eau bout quand sa vapeur « pousse » autant que l'air au-dessus : moins d'air (altitude) = moins à pousser = ébullition plus tôt. Conséquence culinaire : eau à 88 °C : cuisson lente (œufs coulants, pâtes al dente obligées). L'inverse en cocotte-minute : pression ~2 bars → ébullition ~120 °C : cuisson express. Piège : 100 °C n'est valable qu'à pression normale.</div>"},
{"t": "L'air : composition et pression (4e)", "q": "La canette chaude retournée dans l'eau froide s'écrase parce que…", "c": ["le métal fond", "le froid ramollit le métal", "l'eau aspire la canette", "la vapeur se liquéfie : pression intérieure très inférieure à l'extérieure"], "a": 3, "e": "La vapeur devient liquide (volume ÷ ~1000) : la pression intérieure chute : l'air extérieur écrase.", "d": "<b>La vapeur se liquéfie</b> : la pression intérieure s'effondre, l'air extérieur (1013 hPa) écrase la canette.<div class='ex-detail'><u>Exemple rédigé</u> : moment clé : 1 L de vapeur ≈ 1 mL d'eau liquide : en se condensant, le gaz laisse un quasi-vide. Le déséquilibre des pressions fait le reste : la même expérience avec une bouteille en plastique la tord bruyamment. Piège : « le froid ramollit le métal » : non : le métal est intact : c'est un problème de PRESSION, pas de solidité.</div>"},
{"t": "L'air : composition et pression (4e)", "q": "La pression d'un gaz vient…", "c": ["des chocs des particules sur les parois", "de la lumière", "du vide", "du poids de la paroi"], "a": 0, "e": "La pression = l'effet des milliards de chocs des particules sur les parois.", "d": "<b>Des chocs des particules</b> sur les parois.<div class='ex-detail'><u>Exemple rédigé</u> : image : une pluie de micro-balles frappant en permanence chaque cm² : individuellement infimes, collectivement énormes (1013 hPa = ~1 kg par cm²). Chauffer un gaz = particules plus rapides = chocs plus forts : pression plus haute (d'où le danger des aérosols au soleil). Piège : « du vide » : le vide n'appuie pas : c'est justement quand IL N'Y A RIEN à l'intérieur que la pression EXTÉRIEURE gagne.</div>"},
{"t": "L'air : composition et pression (4e)", "q": "Sur 100 L d'air, le volume de dioxygène est environ…", "c": ["21 L", "1 L", "50 L", "78 L"], "a": 0, "e": "21 % de 100 L = 21 L de dioxygène (et ~78 L de diazote).", "d": "<b>21 L</b> : le dioxygène représente ~21 % du volume.<div class='ex-detail'><u>Exemple rédigé</u> : question de proportion : 21 % de 100 L = 21 L ; pour 200 L d'air : 42 L d'O₂ (et 156 L de diazote). Piège : « 78 L » est la part du DIAZOTE : les deux pourcentages s'échangent perpétuellement dans les QCM : 78 ↔ diazote, 21 ↔ dioxygène : associer fermement.</div>"},
{"t": "L'air : composition et pression (4e)", "q": "La pression atmosphérique en altitude…", "c": ["diminue", "augmente", "devient nulle au sommet des montagnes", "reste à 1013 hPa"], "a": 0, "e": "Moins d'air au-dessus = moins de chocs = pression plus basse.", "d": "<b>Elle diminue</b> avec l'altitude.<div class='ex-detail'><u>Exemple rédigé</u> : modèle : la colonne d'air au-dessus de nous raccourcit : au sommet de l'Everest (~8800 m), la pression tombe à ~310 hPa : un tiers de la normale (d'où les bouteilles d'O₂ des alpinistes). Au contraire, en mer, sous 10 m d'eau, la pression DOUBLE (~2 bars). Piège : « nulle au sommet » : la pression ne s'annule qu'au bord de l'atmosphère, bien au-delà de toute montagne.</div>"},
{"t": "Atomes et molécules (4e)", "q": "Une molécule, c'est…", "c": ["une brique indivisible de matière", "un atome coupé en deux", "un mélange homogène", "un assemblage d'atomes liés entre eux"], "a": 3, "e": "Des atomes reliés par des liaisons : H₂O = 2 H + 1 O.", "d": "<b>Un assemblage d'atomes</b> liés entre eux.<div class='ex-detail'><u>Exemple rédigé</u> : la molécule d'eau H₂O : 2 atomes d'hydrogène accrochés à 1 atome d'oxygène : toujours les mêmes proportions (pure ou dans le jus d'orange). Piège : « brique indivisible » : c'est la définition qu'on croyait de l'ATOME (et même lui est divisible : noyau + électrons) : la molécule est un ASSEMBLAGE par définition.</div>"},
{"t": "Atomes et molécules (4e)", "q": "Combien d'atomes dans une molécule de dioxygène O₂ ?", "c": ["12", "1", "2", "3"], "a": 2, "e": "O₂ = 2 atomes d'oxygène liés.", "d": "<b>2 atomes</b> d'oxygène liés.<div class='ex-detail'><u>Exemple rédigé</u> : l'indice 2 compte l'élément juste avant lui : O₂ = 2 O. Comparer : O₃ (ozone) = 3 atomes ; H₂O = 3 atomes au total ; CO₂ = 3 au total. Piège : confondre atome et molécule : l'oxygène que nous respirons est DIatomique (O₂) : l'atome d'oxygène seul (O) n'existe pas libre dans l'air.</div>"},
{"t": "Atomes et molécules (4e)", "q": "Dans la formule H₂O, le « 2 » signifie…", "c": ["2 atomes d'hydrogène", "2 charges", "2 molécules d'eau", "2 atomes d'oxygène"], "a": 0, "e": "L'indice compte l'élément qui le précède : 2 hydrogènes.", "d": "<b>2 atomes d'hydrogène</b> : l'indice s'applique à l'élément juste avant lui.<div class='ex-detail'><u>Exemple rédigé</u> : décomposition complète de H₂O : H₂ = 2 hydrogènes, puis O sans indice = 1 oxygène : total 3 atomes. Règle d'or : l'indice ne déborde JAMAIS sur l'élément suivant. Piège : « 2 oxygènes » : l'oxygène est APRÈS le 2 : sans indice, il en vaut 1 : H₂O = 2 H + 1 O, un point c'est tout.</div>"},
{"t": "Atomes et molécules (4e)", "q": "Glace, eau liquide et vapeur d'eau :", "c": ["trois éléments différents", "la même molécule H₂O dans trois arrangements", "trois molécules différentes", "trois atomes différents"], "a": 1, "e": "Changement d'état = mêmes molécules, arrangement différent.", "d": "<b>La même molécule H₂O</b> : seul l'arrangement change (ordonné / glissant / dispersé).<div class='ex-detail'><u>Exemple rédigé</u> : dans les trois états, chaque molécule reste H₂O : rien n'est cassé ni recombiné. Ce n'est PAS une transformation chimique : les molécules ne changent pas d'identité, seulement de voisines et de distances. Piège : « trois molécules différentes » : c'est la transformation CHIMIQUE (3e) qui crée d'autres molécules : fusion/vaporisation = physique, identités conservées.</div>"},
{"t": "Atomes et molécules (4e)", "q": "Le glucose C₆H₁₂O₆ contient au total :", "c": ["24 atomes", "6 atomes", "12 atomes", "18 atomes"], "a": 0, "e": "6 + 12 + 6 = 24 atomes.", "d": "<b>24 atomes</b> : 6 C + 12 H + 6 O.<div class='ex-detail'><u>Exemple rédigé</u> : lecture guidée : C₆ → 6 carbones ; H₁₂ → 12 hydrogènes ; O₆ → 6 oxygènes ; total : 6 + 12 + 6 = 24. Vérification astucieuse : H et O dans les proportions 2:1 (12 et 6) : le glucose « contient » des groupes type H₂O (d'où son nom : hydrate de carbone). Piège : « 18 » additionnerait C et O (6+6=12, +6 = 18 ?) en oubliant un élément : TOUJOURS les trois listés.</div>"},
{"t": "Atomes et molécules (4e)", "q": "Combien d'éléments naturels compose la matière de l'Univers ?", "c": ["environ 4", "une infinité", "environ 1000", "environ 90"], "a": 3, "e": "~90 éléments naturels (plus une vingtaine créés en laboratoire).", "d": "<b>Environ 90</b> éléments naturels.<div class='ex-detail'><u>Exemple rédigé</u> : tout l'Univers : étoiles, planètes, vous : ~90 briques de base ! L'hydrogène est de loin le plus abondant de l'Univers ; dans le corps humain : surtout O, C, H, N. Piège : « une infinité » : non : la liste est courte (tableau de Mendeleïev) : c'est la COMBINAISON des briques qui est infinie, comme un milliard de mots avec 26 lettres.</div>"},
{"t": "Atomes et molécules (4e)", "q": "Les molécules N₂ et O₂ de l'air sont…", "c": ["des ions", "des atomes isolés", "des molécules DIatomiques (2 atomes chacun)", "des cristaux"], "a": 2, "e": "N₂ et O₂ : chaque molécule = 2 atomes identiques liés.", "d": "<b>Diatomiques</b> : 2 atomes liés par molécule.<div class='ex-detail'><u>Exemple rédigé</u> : l'air : ~78 % de N₂ (2 azotes) + ~21 % de O₂ (2 oxygènes) : des molécules, pas des atomes libres. Les gaz « nobles » (argon, hélium), eux, se promènent en atomes seuls : monoatomiques. Piège : écrire « l'air contient des atomes d'azote et d'oxygène » : inexact : il contient des MOLÉCULES N₂ et O₂ : nuance de vocabulaire évaluée dès la 4e.</div>"},
{"t": "Atomes et molécules (4e)", "q": "Le méthane CH₄ est composé de…", "c": ["4 carbones et 1 hydrogène", "1 chlore et 4 hydrogènes", "1 atome de carbone et 4 d'hydrogène", "14 atomes d'hydrogène"], "a": 2, "e": "CH₄ : 1 C (sans indice = 1) + 4 H.", "d": "<b>1 carbone + 4 hydrogènes</b> (5 atomes au total).<div class='ex-detail'><u>Exemple rédigé</u> : lecture : C sans indice = 1 ; H₄ = 4. Le méthane est le gaz naturel des cuisinières (et un puissant gaz à effet de serre). Piège : « 4 carbones » : l'indice APRÈS le H compte les H, jamais le C ; « chlore » : le chlore s'écrit Cl : dans les formules chimiques, chaque MAJUSCULE démarre un nouvel élément : C puis H : carbone et hydrogène.</div>"},
{"t": "Atomes et molécules (4e)", "q": "La taille typique d'un atome est de l'ordre de…", "c": ["0,1 nanomètre", "1 mètre", "1 cm", "1 mm"], "a": 0, "e": "≈ 0,1 nm = 10⁻¹⁰ m : invisible même au microscope optique.", "d": "<b>0,1 nanomètre</b> (un dix-milliardième de mètre).<div class='ex-detail'><u>Exemple rédigé</u> : pour saisir l'échelle : une feuille de papier (~0,1 mm) = 1 million d'atomes empilés ; un cheveu (0,1 mm de large) = 1 million d'atomes côte à côte. Un verre d'eau contient plus de molécules que de verres d'eau dans tous les océans. Piège : « 1 mm » : mille fois trop grand : même les meilleures loupes ne voient pas les atomes : il faut des microscopes spéciaux (à effet tunnel).</div>"},
{"t": "Atomes et molécules (4e)", "q": "CO₂ (dioxyde de carbone) contient :", "c": ["1 carbone et 2 oxygènes", "2 carbones et 1 oxygène", "1 cobalt et 2 oxygènes", "12 oxygènes"], "a": 0, "e": "C sans indice = 1 ; O₂ = 2 oxygènes.", "d": "<b>1 carbone + 2 oxygènes</b> (3 atomes).<div class='ex-detail'><u>Exemple rédigé</u> : piège du nom : « dioxyde » (2 OXYgènes) et non « dicarbone » : le nom décrit les OXYGÈNES (di-oxy-de) : CO₂ = 1 C + 2 O ✓. Le CO (monoxyde de carbone, 1 O) est le gaz toxique des chaudières mal réglées : UNE lettre change tout. Piège : « 2 carbones » : le 2 est après le O : il compte les O : lecture stricte, toujours.</div>"},
{"t": "Circuits en série et en dérivation (4e)", "q": "Une ampoule grille, les autres brillent encore. Montage ?", "c": ["Dérivation", "Impossible à dire", "Série", "Court-circuit"], "a": 0, "e": "Dérivation : les autres branches restent fermées.", "d": "<b>Dérivation</b> : le courant contourne la branche morte par les autres boucles.<div class='ex-detail'><u>Exemple rédigé</u> : le test-diagnostic : « une panne = tout mort ? » : OUI → série ; NON → dérivation. La maison, les guirlandes modernes, les lampes de vélo récentes : dérivation. Piège : en SÉRIE, la boucle unique est ouverte par la panne : tout s'éteint : c'est le comportement des guirlandes anciennes.</div>"},
{"t": "Circuits en série et en dérivation (4e)", "q": "Loi des nœuds : le courant qui arrive à un nœud…", "c": ["disparaît en partie", "est égal à la somme des courants qui repartent", "double", "est divisé par le nombre de branches"], "a": 1, "e": "I(arrivée) = I₁ + I₂ + … : le courant se répartit sans se perdre.", "d": "<b>Égal à la somme des courants qui repartent</b> : rien ne se crée ni ne se perd au nœud.<div class='ex-detail'><u>Exemple rédigé</u> : application : I = 0,45 A arrive ; I₁ = 0,25 A part dans la lampe 1 ; I₂ = 0,45 − 0,25 = 0,20 A dans la lampe 2. Au nœud de retour, les courants se RÉUNISSENT : 0,25 + 0,20 = 0,45 A. Piège : « divisé par le nombre de branches » : faux si les branches sont différentes (une grosse lampe prend plus qu'une petite) : c'est la loi des nœuds qui décide, pas un partage égal.</div>"},
{"t": "Circuits en série et en dérivation (4e)", "q": "Dans un montage en dérivation, la tension aux bornes de chaque branche est…", "c": ["nulle", "partagée entre les branches", "la même (celle du générateur)", "différente à chaque branche"], "a": 2, "e": "Toutes les branches sont reliées aux mêmes deux nœuds : même tension.", "d": "<b>La même</b> : chaque branche est « branchée » directement sur le générateur.<div class='ex-detail'><u>Exemple rédigé</u> : conséquence : chaque lampe reçoit sa tension nominale : brillance normale pour toutes, quel que soit leur nombre (tant que la ligne tient). C'est le 2e avantage de la dérivation avec l'indépendance. Piège : « partagée » : c'est le comportement de la SÉRIE pour la tension : les deux montages échangent leurs propriétés : série → I unique, tension partagée ; dérivation → tensions égales, I partagé.</div>"},
{"t": "Circuits en série et en dérivation (4e)", "q": "Pourquoi la maison est-elle câblée en dérivation ?", "c": ["Pour économiser des fils", "Pour augmenter la consommation", "Parce que le série est impossible", "Pour que chaque appareil marche indépendamment avec la pleine tension"], "a": 3, "e": "Indépendance + pleine tension : les deux avantages de la dérivation.", "d": "<b>Indépendance + pleine tension</b> pour chaque appareil.<div class='ex-detail'><u>Exemple rédigé</u> : imaginez la maison en série : éteindre la lampe du salon couperait TOUT (boucle ouverte), et chaque appareil recevrait une fraction des 230 V : frigo faible, TV pâle. En dérivation : chaque appareil a sa boucle : interrupteur individuel, 230 V partout. Piège : « économiser des fils » : la dérivation consomme PLUS de fils : on la paie pour le confort et la sécurité.</div>"},
{"t": "Circuits en série et en dérivation (4e)", "q": "Un nœud dans un circuit, c'est…", "c": ["un appareil de mesure", "un interrupteur", "un point où au moins 3 fils se rejoignent", "un fil"], "a": 2, "e": "Point de jonction d'au moins 3 branches : là que s'applique la loi des nœuds.", "d": "<b>Un point de contact d'au moins 3 fils</b> (souvent plus).<div class='ex-detail'><u>Exemple rédigé</u> : dans un montage à 2 lampes en dérivation : 2 nœuds : celui qui sépare le courant principal en 2 branches, celui qui les refusionne. C'est à ces points précis qu'on écrit I = I₁ + I₂. Piège : un simple point de passage sur un fil (2 directions) n'est pas un nœud : il n'y a RIEN à compter : la loi des nœuds commence à 3 chemins.</div>"},
{"t": "Circuits en série et en dérivation (4e)", "q": "Un générateur (0,45 A mesurés) alimente 2 lampes en dérivation. I₁ = 0,25 A. I₂ = ?", "c": ["0,20 A", "0,45 A", "0,25 A", "0,70 A"], "a": 0, "e": "I₂ = I − I₁ = 0,45 − 0,25 = 0,20 A.", "d": "<b>0,20 A</b> : loi des nœuds, I₂ = I − I₁.<div class='ex-detail'><u>Exemple rédigé</u> : écriture : I(arrive) = I₁ + I₂(partent) ⟹ I₂ = 0,45 − 0,25 = 0,20 A. Vérification naturelle : la branche 2 pourrait être une lampe plus petite : normal qu'elle prenne moins. Piège : « 0,70 A » additionnerait au lieu de SOUSTRAIRE : on cherche une PARTIE à partir du TOUT : le tout est déjà mesuré : reste à retirer l'autre partie.</div>"},
{"t": "Circuits en série et en dérivation (4e)", "q": "Le court-circuit d'une pile (fil entre + et −) est…", "c": ["propre et silencieux", "utile pour tester", "dangereux : très forte intensité, échauffement", "sans effet"], "a": 2, "e": "Sans résistance pour limiter, l'intensité explose : la pile chauffe fort : danger.", "d": "<b>Dangereux</b> : le fil offre un passage quasi sans obstacle : I devient énorme : la pile chauffe (voire fuit).<div class='ex-detail'><u>Exemple rédigé</u> : ordre de grandeur : une pile court-circuitée peut dépasser 10 A : les fils chauffent, la pile s'abîme vite : risque de brûlure. Rôle du fusible : il FOND avant que la maison ne brûle : c'est un «maillon faible» volontaire. Piège : court-circuiter une LAMPE dans un circuit série (fil en parallèle d'elle) fait briller les autres PLUS fort : deux situations différentes, deux conséquences opposées.</div>"},
{"t": "Circuits en série et en dérivation (4e)", "q": "Dans un circuit SÉRIE, l'intensité est…", "c": ["nulle après la première lampe", "répartie entre les dipôles", "différente à chaque point", "la même partout"], "a": 3, "e": "Unicité de l'intensité : I identique en tout point de la boucle unique.", "d": "<b>La même partout</b> : une seule boucle, un seul courant.<div class='ex-detail'><u>Exemple rédigé</u> : ampèremètres en 3 points : mêmes valeurs. Le courant n'est pas « consommé » par les lampes : elles convertissent de l'ÉNERGIE, pas du courant. Piège récapitulatif : SÉRIE → I unique, U partagée ; DÉRIVATION → U identique partout, I partagie aux nœuds : apprendre le tableau croisé d'un coup évite tous les mélanges.</div>"},
{"t": "Circuits en série et en dérivation (4e)", "q": "On ajoute une 3e lampe en dérivation. L'intensité délivrée par le générateur…", "c": ["ne change pas", "augmente (nouvelle branche = nouveau courant)", "devient nulle", "diminue"], "a": 1, "e": "Loi des nœuds : I = I₁ + I₂ + I₃ : chaque branche ajoute sa part.", "d": "<b>Elle augmente</b> : chaque nouvelle branche pompe son courant au générateur.<div class='ex-detail'><u>Exemple rédigé</u> : c'est pour ça qu'on ne branche pas 10 radiateurs sur une multiprise : les intensités s'ADDITIONNENT : la ligne chauffe : le disjoncteur coupe (ou pire). Piège : « ne change pas » : la tension, elle, ne change pas (toujours 230 V ou la pile) : mais l'intensité totale est l'addition des branches : tension stable, courant cumulé.</div>"},
{"t": "Circuits en série et en dérivation (4e)", "q": "Le voltmètre se branche…", "c": ["en dérivation, aux bornes du dipôle à mesurer", "à la place de la pile", "en série dans la boucle", "n'importe où"], "a": 0, "e": "Voltmètre en dérivation (aux bornes) ; ampèremètre en série.", "d": "<b>En dérivation, aux bornes du dipôle</b> à mesurer.<div class='ex-detail'><u>Exemple rédigé</u> : logique des instruments : le voltmètre compare deux points (il « surveille » sans perturber : très grande résistance interne) ; l'ampèremètre compte les charges qui passent (il doit être DANS le flux : en série). Piège final : l'inverser détruit l'ampèremètre (branché aux bornes de la pile, il se comporte comme un fil : court-circuit) : réflexe de sécurité : A = série, V = dérivation.</div>"},
{"t": "Vitesse et mouvement (4e)", "q": "La formule de la vitesse est :", "c": ["v = d + t", "v = d / t", "v = t / d", "v = d × t"], "a": 1, "e": "v = distance ÷ temps (m/s si d en m et t en s).", "d": "<b>v = d / t</b> : distance divisée par le temps.<div class='ex-detail'><u>Exemple rédigé</u> : 100 m en 12 s : v = 100/12 ≈ 8,3 m/s. Contrôle d'unité qui marche toujours : m ÷ s = m/s ✓. De la même formule : d = v × t (pour les distances) et t = d / v (pour les durées). Piège : « v = d × t » donnerait 100 × 12 = 1200 (m²/s ?) : unité absurde : l'unité du résultat valide la formule.</div>"},
{"t": "Vitesse et mouvement (4e)", "q": "Convertir 10 m/s en km/h :", "c": ["36 km/h", "10 km/h", "3,6 km/h", "25 km/h"], "a": 0, "e": "1 m/s = 3,6 km/h : 10 × 3,6 = 36 km/h.", "d": "<b>36 km/h</b> : × 3,6 pour passer en km/h.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi 3,6 : 1 m/s = 1 m chaque seconde = 3600 m par heure (3600 s) = 3,6 km/h. Repères : 10 m/s = 36 km/h (ville) ; 25 m/s = 90 km/h (route) ; 33 m/s ≈ 120 km/h (autoroute). Piège : « 3,6 km/h » confond le FACTEUR de conversion avec le résultat : m/s → km/h = × 3,6, toujours.</div>"},
{"t": "Vitesse et mouvement (4e)", "q": "Une voiture roule à 72 km/h. Sa vitesse en m/s ?", "c": ["72 m/s", "20 m/s", "26 m/s", "200 m/s"], "a": 1, "e": "72 ÷ 3,6 = 20 m/s.", "d": "<b>20 m/s</b> : km/h → m/s : ÷ 3,6.<div class='ex-detail'><u>Exemple rédigé</u> : calcul : 72 ÷ 3,6 = 20 m/s. Test de vitesse réel : à 72 km/h, la voiture parcourt 20 m CHAQUE seconde : sur route, 20 m : l'équivalent de 4 voitures : d'où les distances de sécurité. Piège : « 72 m/s » = 259 km/h : une Formule 1 : l'unité du nombre change tout : toujours vérifier l'échelle de grandeur (une voiture ~20-35 m/s).</div>"},
{"t": "Vitesse et mouvement (4e)", "q": "Un mouvement uniforme est un mouvement dont…", "c": ["la trajectoire est une droite", "le mobile est lourd", "la vitesse est constante", "la vitesse augmente"], "a": 2, "e": "Uniforme = vitesse constante (quel que soit le chemin pris).", "d": "<b>La vitesse est constante</b>.<div class='ex-detail'><u>Exemple rédigé</u> : piège du vocabulaire : « uniforme » ne dit RIEN de la trajectoire : un manège qui tourne à vitesse constante a un mouvement CIRCULAIRE UNIFORME : la trajectoire (rectiligne/curviligne) et l'allure (uniforme/accéléré/ralenti) sont DEUX descriptions séparées à donner toutes les deux. Piège : « trajectoire droite » : c'est « rectiligne », un mot différent pour une information différente.</div>"},
{"t": "Vitesse et mouvement (4e)", "q": "Un piéton parcourt 600 m en 10 min. Sa vitesse (km/h) ?", "c": ["1 km/h", "6 km/h", "3,6 km/h", "60 km/h"], "a": 2, "e": "600 m en 600 s = 1 m/s = 3,6 km/h.", "d": "<b>3,6 km/h</b> : étapes : 10 min = 600 s ; v = 600/600 = 1 m/s ; 1 × 3,6 = 3,6 km/h.<div class='ex-detail'><u>Exemple rédigé</u> : méthode robuste : ① convertir le temps en secondes (10 × 60 = 600 s) ; ② v = d/t = 600/600 = 1 m/s ; ③ convertir : × 3,6 : 3,6 km/h : la vitesse typique de la marche (5 km/h = 1,4 m/s). Piège : « 60 km/h » viendrait de 600 ÷ 10 SANS convertir les minutes : piège d'unités classique du brevet blanc.</div>"},
{"t": "Vitesse et mouvement (4e)", "q": "Un vélo roule à 15 km/h. Distance parcourue en 2 h 30 ?", "c": ["7,5 km", "30 km", "37,5 km", "45 km"], "a": 2, "e": "d = v × t = 15 × 2,5 = 37,5 km.", "d": "<b>37,5 km</b> : d = v × t = 15 × 2,5.<div class='ex-detail'><u>Exemple rédigé</u> : étape clé : 2 h 30 = 2,5 h (et non 2,3 !) : convertir le « 30 min » en 0,5 h. Puis d = 15 × 2,5 = 37,5 km. Piège : « 30 km » s'arrêterait à 2 h pile en oubliant la demi-heure ; « 7,5 » diviserait au lieu de multiplier : la distance = vitesse × temps, jamais ÷.</div>"},
{"t": "Vitesse et mouvement (4e)", "q": "Assis dans un train, votre sac est immobile…", "c": ["jamais", "par rapport au train ; en mouvement par rapport au sol", "par rapport au sol seulement", "dans tous les cas"], "a": 1, "e": "Immobile DANS le train, mais il file à la vitesse du train par rapport aux rails.", "d": "<b>Immobile par rapport au train, en mouvement par rapport au sol</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le mouvement est RELATIF : il faut toujours préciser le référentiel. Par rapport au siège : distance sac-siège constante : immobile. Par rapport aux rails : cette distance change à 300 km/h : en mouvement. Piège : « dans tous les cas » : phrase interdite : sans référentiel, « immobile » ne veut rien dire : c'est LE message du chapitre.</div>"},
{"t": "Vitesse et mouvement (4e)", "q": "Positions toutes les secondes : 0 m, 2 m, 5 m, 9 m. Le mouvement est :", "c": ["immobile", "uniforme", "accéléré (les écarts grandissent)", "ralenti"], "a": 2, "e": "Écarts : +2, +3, +4 : de plus en plus de distance par seconde : accéléré.", "d": "<b>Accéléré</b> : les écarts successifs (2, 3, 4 m) grandissent.<div class='ex-detail'><u>Exemple rédigé</u> : méthode : soustraire chaque position de la suivante : 2−0=2 ; 5−2=3 ; 9−5=4 : chaque seconde couvre PLUS que la précédente : la vitesse augmente. Si les écarts étaient 4, 3, 2 : ralenti (freinage). Si constants : uniforme. Piège : « uniforme » confondrait « il avance » et « il avance à la même allure » : c'est la COMPARAISON des écarts qui décide.</div>"},
{"t": "Vitesse et mouvement (4e)", "q": "Un manège tourne à vitesse constante. Le mouvement d'une nacelle est :", "c": ["immobile", "circulaire uniforme", "rectiligne accéléré", "rectiligne uniforme"], "a": 1, "e": "Trajectoire = cercle (circulaire) ; vitesse constante (uniforme) : les DEUX précisions.", "d": "<b>Circulaire uniforme</b> : cercle + vitesse constante.<div class='ex-detail'><u>Exemple rédigé</u> : décomposition du nom : CIRCULAIRE (la trajectoire : un cercle) + UNIFORME (la vitesse : constante). La nacelle file à 5 m/s en tournant : sa direction change sans arrêt mais sa vitesse ne change pas : deux facettes indépendantes. Piège : « immobile » : par rapport au manège, la nacelle est fixe : mais par rapport au sol, elle tourne : référentiel encore !</div>"},
{"t": "Vitesse et mouvement (4e)", "q": "La trajectoire d'un mobile est rectiligne si…", "c": ["il va vite", "il tourne", "il suit une ligne droite", "il ralentit"], "a": 2, "e": "Rectiligne = ligne droite (trajectoire rectiligne, curviligne = courbe).", "d": "<b>Il suit une ligne droite</b>.<div class='ex-detail'><u>Exemple rédigé</u> : vocabulaire complet des trajectoires : RECTILIGNE (droite : chute d'une bille, voiture sur une ligne droite) ; CIRCULAIRE (cercle : manège, Terre autour du Soleil) ; CURVILIGNE (courbe quelconque : ballon de foot, virage). Piège : la vitesse n'a AUCUN rapport avec la forme du chemin : un mobile rapide peut tourner, un lent peut aller droit : trajectoire ≠ vitesse, toujours.</div>"},
{"t": "Énergie électrique : puissance (4e)", "q": "Le watt (W) mesure…", "c": ["la tension", "la puissance (énergie convertie par seconde)", "l'énergie totale", "le temps"], "a": 1, "e": "Le watt mesure la puissance : un « débit » d'énergie.", "d": "<b>La puissance</b> : l'énergie convertie CHAQUE seconde.<div class='ex-detail'><u>Exemple rédigé</u> : une bouilloire de 2000 W convertit 2000 joules d'énergie électrique en chaleur chaque seconde. Le wattheure (Wh), lui, mesure l'ÉNERGIE TOTALE (puissance × durée). Piège : W et Wh se ressemblent et sont parents mais différents : la puissance est un débit (comme des L/s), l'énergie un volume (comme des litres).</div>"},
{"t": "Énergie électrique : puissance (4e)", "q": "L'énergie consommée par un appareil de puissance P pendant t est :", "c": ["E = P × t", "E = P + t", "E = t / P", "E = P / t"], "a": 0, "e": "E = P × t (Wh pour W et h).", "d": "<b>E = P × t</b> : puissance × durée d'utilisation.<div class='ex-detail'><u>Exemple rédigé</u> : une télé de 100 W pendant 3 h : E = 100 × 3 = 300 Wh = 0,3 kWh. Piège : « E = P/t » est LA mauvaise intuition (un appareil puissant un instant peut consommer moins qu'un faible longtemps) : la durée est un FACTEUR, pas un diviseur : P × t, jamais P ÷ t.</div>"},
{"t": "Énergie électrique : puissance (4e)", "q": "1 kWh représente :", "c": ["1000 W pendant 1 heure", "1 W pendant 1 heure", "1 W pendant 1000 s", "1000 W pendant 1 seconde"], "a": 0, "e": "kilo-watt-heure : 1000 W × 1 h.", "d": "<b>1000 W pendant 1 h</b> (ou 500 W pendant 2 h, 2000 W pendant 30 min…).<div class='ex-detail'><u>Exemple rédigé</u> : c'est l'unité du compteur électrique : il « compte » les kWh : la facture = kWh × prix. Exemples concrets : 1 kWh ≈ 1 h de bouilloire, 10 h de télé, 100 h de LED. Piège : « 1000 W pendant 1 seconde » serait 1000 J (watt-seconde) : TROP PETIT d'un facteur 3600 : le kWh est une grosse unité d'énergie de vie quotidienne.</div>"},
