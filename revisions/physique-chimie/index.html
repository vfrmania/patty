 {
  "id": "eau-melanges",
  "theme": "L'eau : mélanges et corps purs (5e)",
  "niveau": "5e",
  "titre": "L'eau : mélanges, corps purs et séparation",
  "cours": "<div class=\"cours-head\"><h2>L'eau : mélanges, corps purs et séparation</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Corps purs et mélanges</h3>\n<ul>\n<li><b>Corps pur</b> : une seule sorte de molécule (eau pure = H₂O uniquement) ;</li>\n<li><b>Mélange</b> : plusieurs substances réparties ;</li>\n<li><b>Mélange homogène</b> : on ne distingue pas les constituants à l'œil (eau sucrée, air) ;</li>\n<li><b>Mélange hétérogène</b> : on voit plusieurs phases (eau + huile, eau + sable).</li>\n</ul>\n\n<h3>2. Miscibilité et solubilité</h3>\n<table>\n<tr><th>Notion</th><th>Définition</th><th>Exemple</th></tr>\n<tr><td><b>miscibles</b></td><td>deux liquides se mélangent en une phase</td><td>eau + alcool</td></tr>\n<tr><td><b>non miscibles</b></td><td>deux phases distinctes</td><td>eau + huile</td></tr>\n<tr><td><b>soluté soluble</b></td><td>se dissout dans le solvant</td><td>sucre dans l'eau</td></tr>\n<tr><td><b>insoluble</b></td><td>ne se dissout pas</td><td>sable dans l'eau</td></tr>\n</table>\n<div class=\"tip\"><b>À retenir</b> : « homogène/hétérogène » décrit ce que l'<b>œil</b> voit ; « miscible/soluble » décrit comment les corps se comportent ensemble.</div>\n\n<h3>3. L'eau, un bon solvant</h3>\n<ul>\n<li>L'eau dissout beaucoup de solides (sucre, sel) et de liquides (alcool) ;</li>\n<li>Attention : <b>dissolution ≠ disparition</b> : le soluté est toujours là (la masse se conserve : eau + sucre dissous = même masse totale) ;</li>\n<li>Certains corps ne se dissolvent pas (huile, sable) : mélanges hétérogènes.</li>\n</ul>\n\n<h3>4. Séparer les constituants d'un mélange</h3>\n<table>\n<tr><th>Technique</th><th>Utilisée pour</th><th>Principe</th></tr>\n<tr><td><b>décantation</b></td><td>hétérogène (solide/liquide ou 2 liquides)</td><td>laisser reposer : le plus dense se dépose</td></tr>\n<tr><td><b>filtration</b></td><td>solide non dissous dans un liquide</td><td>le filtre retient le solide</td></tr>\n<tr><td><b>distillation</b></td><td>homogène (liquides miscibles)</td><td>ébullition sélective puis condensation</td></tr>\n<tr><td><b>évaporation</b></td><td>solide dissous</td><td>le solvant part, le soluté reste</td></tr>\n</table>\n<div class=\"warn\"><b>Choisir la bonne technique</b> : je vois deux phases → décantation/filtration ; je ne vois rien mais je veux séparer → distillation/évaporation. L'<b>observation</b> guide le protocole.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — identifier un mélange et choisir la séparation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un jus d'orange avec pulpe : quel type de mélange ? Comment récupérer le jus clair ?</div><div class=\"etu\"><b>Étape 1 — Observer</b> : on voit la pulpe (phase solide) en suspension dans le liquide → mélange <b>hétérogène</b>.</div><div class=\"etu\"><b>Étape 2 — Identifier les constituants</b> : un solide non dissous (pulpe) + un liquide (jus).</div><div class=\"etu\"><b>Étape 3 — Choisir</b> : solide non dissous → <b>filtration</b> (ou décantation puis prélèvement).</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : le filtrat est limpide : la séparation a fonctionné ; la masse totale (pulpe + jus) est <b>conservée</b>.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Dissoudre, c'est faire disparaître » : le soluté est <b>toujours présent</b> (masse conservée, goût sucré).</li>\n<li>« Homogène = corps pur » : non ! L'eau sucrée est un <b>mélange</b> homogène.</li>\n<li>« Filtrer un mélange homogène le sépare » : le filtre ne retient que le <b>non dissous</b> — pour l'eau sucrée, il faut évaporer.</li>\n<li>« L'huile se dissout dans l'eau » : non miscible — deux <b>phases</b> subsistent.</li>\n<li>« Décantation et filtration, c'est pareil » : décanter = laisser reposer ; filtrer = <b>forcer</b> le passage à travers un filtre.</li>\n</ul>\n</div>"
 },

  "niveau": "5e",
  "titre": "États et changements d'état de la matière",
  "cours": "<div class=\"cours-head\"><h2>États et changements d'état de la matière</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois états usuels</h3>\n<table>\n<tr><th>État</th><th>Forme / volume</th><th>Particules</th><th>Exemples</th></tr>\n<tr><td><b>solide</b></td><td>forme et volume propres</td><td>serrées, ordonnées, vibratiles</td><td>glace, fer, sucre</td></tr>\n<tr><td><b>liquide</b></td><td>volume propre, forme du récipient</td><td>tassées les unes sur les autres, mobiles</td><td>eau, huile</td></tr>\n<tr><td><b>gaz</b></td><td>occupe tout l'espace disponible</td><td>très éloignées, agitées</td><td>vapeur d'eau, air</td></tr>\n</table>\n<div class=\"tip\"><b>Le même corps, trois états</b> : l'eau existe solide (glace), liquide et gazeux (vapeur) — c'est <b>toujours</b> la même molécule H₂O ; seule l'organisation change.</div>\n\n<h3>2. Les changements d'état : noms et sens</h3>\n<div class=\"formule\">solide ⇄ liquide : fusion / solidification<br>liquide ⇄ gaz : vaporisation (ébullition, évaporation) / liquéfaction<br>solide ⇄ gaz : sublimation / condensation solide</div>\n<ul>\n<li>La <b>fusion</b> nécessite de la chaleur (la glace fond) ; la <b>solidification</b> libère de la chaleur ;</li>\n<li>Pendant un changement d'état, la <b>température reste constante</b> (l'eau bout à 100 °C tant qu'elle bout, sous pression normale).</li>\n</ul>\n\n<h3>3. Conservation de la masse</h3>\n<ul>\n<li>Masse avant = masse après : la glace fondue donne la <b>même masse</b> d'eau liquide ;</li>\n<li>Mais le <b>volume change</b> : l'eau est l'exception célèbre (la glace occupe <b>plus</b> de place — elle flotte !) ;</li>\n<li>En général : solide → gaz, le volume augmente fortement (les particules s'écartent).</li>\n</ul>\n\n<h3>4. L'eau dans la nature : le cycle</h3>\n<ul>\n<li>Évaporation (océans, lacs) → condensation en altitude (nuages) → précipitations → ruissellement/infiltration → retour aux océans ;</li>\n<li>Chaque étape est un changement d'état piloté par la <b>température</b> ;</li>\n<li>L'eau salée s'évapore <b>sans sel</b> : la vaporisation n'emporte que l'eau (d'où l'eau douce de la pluie).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire un graphe de changement d'état</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On chauffe de la glace et on trace la température en fonction du temps. Décrire les étapes du graphe.</div><div class=\"etu\"><b>Étape 1 — Première montée</b> : la glace se réchauffe de -10 °C à 0 °C (état solide).</div><div class=\"etu\"><b>Étape 2 — Palier à 0 °C</b> : la température ne bouge pas pendant toute la <b>fusion</b> : l'énergie sert au changement d'état, pas au réchauffement.</div><div class=\"etu\"><b>Étape 3 — Deuxième montée</b> : l'eau liquide se réchauffe de 0 à 100 °C.</div><div class=\"etu\"><b>Étape 4 — Palier à 100 °C</b> : la <b>vaporisation</b> commence : de nouveau constant tant que de l'eau liquide reste. Les paliers sont les <b>signatures</b> des changements d'état.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La vapeur d'eau est visible » : le brouillard/les nuages = <b>gouttelettes liquides</b> ; la vapeur est invisible.</li>\n<li>« Chauffer l'eau bouillante augmente sa température » : tant qu'elle bout : <b>palier à 100 °C</b> (pression normale).</li>\n<li>« La fusion libère de la chaleur » : la fusion en <b>consomme</b> ; c'est la solidification qui en libère.</li>\n<li>« Fondre la glace change sa masse » : masse <b>conservée</b> ; c'est le volume qui varie.</li>\n<li>Confondre vaporisation / liquéfaction : liquide → gaz = vaporisation ; gaz → liquide = liquéfaction.</li>\n</ul>\n</div>"
 },
 {
  "id": "circuit-serie",
  "theme": "Le circuit électrique en série (5e)",
  "niveau": "5e",
  "titre": "Le circuit électrique : composants et série",
  "cours": "<div class=\"cours-head\"><h2>Le circuit électrique : composants et série</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Un circuit : une boucle fermée</h3>\n<ul>\n<li>Un circuit <b>fermé</b> : la lampe brille — le courant circule du générateur et revient ;</li>\n<li>Un circuit <b>ouvert</b> (interrupteur ouvert, fil débranché) : <b>plus rien ne fonctionne</b> ;</li>\n<li>Sens conventionnel du courant : de la borne <b>+</b> vers la borne − à l'extérieur du générateur.</li>\n</ul>\n<div class=\"warn\"><b>Danger</b> : ne jamais brancher directement les deux bornes d'une pile (court-circuit) : fils chauds, pile usée, risque d'incendie. On insère toujours une lampe ou un moteur.</div>\n\n<h3>2. Les composants et leurs symboles</h3>\n<table>\n<tr><th>Composant</th><th>Rôle</th><th>Symbole</th></tr>\n<tr><td><b>pile / générateur</b></td><td>fournit l'énergie électrique</td><td>2 traits parallèles (long = +)</td></tr>\n<tr><td><b>lampe</b></td><td>convertit en lumière (et chaleur)</td><td>cercle barré d'une croix</td></tr>\n<tr><td><b>moteur</b></td><td>convertit en mouvement</td><td>cercle avec M</td></tr>\n<tr><td><b>interrupteur</b></td><td>ouvre / ferme le circuit</td><td>trait mobile</td></tr>\n<tr><td><b>fils de connexion</b></td><td>relient les dipôles</td><td>trait</td></tr>\n<tr><td><b>DEL (diode)</b></td><td>s'allume dans un sens seulement</td><td>triangle + trait</td></tr>\n</table>\n\n<h3>3. Le circuit en série</h3>\n<ul>\n<li>Tous les dipôles sont branchés <b>les uns après les autres</b> : une seule boucle ;</li>\n<li>Conséquence-clé : si une lampe est dévissée ou grillée, <b>tout s'éteint</b> (la boucle est ouverte) ;</li>\n<li>Plus on ajoute de lampes en série, moins chacune brille (l'énergie du générateur se partage).</li>\n</ul>\n\n<h3>4. Le courant : même partout en série</h3>\n<ul>\n<li>L'<b>intensité</b> du courant (ampères, A) se mesure avec un <b>ampèremètre branché en série</b> ;</li>\n<li>Dans un circuit en série, l'intensité est <b>la même en tout point</b> : le courant n'est pas « consommé » par les lampes ;</li>\n<li>Analogie : une boucle de vélo : la chaîne circule pareil partout, elle ne disparaît pas dans le pédalier.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — diagnostiquer une panne en série</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un sapin de Noël en série : toutes les lampes éteintes. Une seule est grillée. Comment la trouver ?</div><div class=\"etu\"><b>Étape 1 — Raisonner</b> : en série, une seule lampe grillée ouvre la boucle → <b>tout s'éteint</b> : le symptôme correspond.</div><div class=\"etu\"><b>Étape 2 — Tester méthodiquement</b> : remplacer chaque lampe par une lampe neuve, une par une (ou utiliser un testeur).</div><div class=\"etu\"><b>Étape 3 — Retrouver</b> : quand les autres s'allument, la remplacée était la coupable.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : c'est la limite du circuit série — un seul défaut paralyse tout ; un montage en <b>dérivation</b> (4e) ne s'arrête pas entièrement.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le courant s'épuise en passant dans les lampes » : l'intensité est <b>identique</b> avant et après chaque dipôle en série.</li>\n<li>« Une lampe consomme du courant » : elle convertit de l'<b>énergie</b>, le courant traverse sans perte.</li>\n<li>« Court-circuiter une pile est sans danger » : échauffement, usure rapide, <b>risque réel</b>.</li>\n<li>« On peut brancher la lampe dans n'importe quel sens » : vrai pour une lampe ; <b>faux pour une DEL</b> (sens unique).</li>\n<li>« En série, chaque lampe brille autant que seule » : plus de lampes = <b>moins</b> d'éclat chacune.</li>\n</ul>\n</div>"
 },
 {
  "id": "lumiere-ombres",
  "theme": "La lumière : sources et ombres (5e)",
  "niveau": "5e",
  "titre": "La lumière : sources et ombres",
  "cours": "<div class=\"cours-head\"><h2>La lumière : sources et ombres</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Sources et récepteurs de lumière</h3>\n<ul>\n<li><b>Source primaire</b> : produit sa propre lumière (Soleil, lampe allumée, flamme, DEL) ;</li>\n<li><b>Objet diffusant</b> (secondaire) : renvoie la lumière reçue (Lune, mur, page d'un livre) ;</li>\n<li><b>Récepteur</b> : capte la lumière (œil, caméra, panneau solaire, peau qui bronze).</li>\n</ul>\n<div class=\"tip\"><b>La Lune ne brille pas</b> : elle <b>diffuse</b> la lumière du Soleil — comme un miroir imparfait. La voir « briller » la nuit ne fait pas d'elle une source primaire.</div>\n\n<h3>2. La propagation : en ligne droite</h3>\n<ul>\n<li>Dans un milieu <b>transparent et homogène</b> (air, eau calme, verre), la lumière se propage en <b>ligne droite</b> ;</li>\n<li>On représente le trajet par une <b>rayon</b> (flèche) partant de la source ;</li>\n<li>Preuve : les « rayons de soleil » crépusculaires, l'alignement œil–trou–objet des camera obscura.</li>\n</ul>\n\n<h3>3. Ombres propres et portées</h3>\n<table>\n<tr><th>Notion</th><th>Définition</th><th>Conditions</th></tr>\n<tr><td><b>ombre propre</b></td><td>partie non éclairée de l'objet lui-même</td><td>objet éclairé d'un côté seulement</td></tr>\n<tr><td><b>ombre portée</b></td><td>tache sombre sur un écran derrière l'objet</td><td>source ponctuelle + objet + écran alignés</td></tr>\n<tr><td><b>cône d'ombre</b></td><td>zone derrière l'objet où la lumière n'arrive pas</td><td>source ponctuelle</td></tr>\n</table>\n<div class=\"formule\">Source ponctuelle → ombres nettes ; source étendue → ombre floue avec pénombre (zone partiellement éclairée)</div>\n\n<h3>4. Jour, nuit et phases : application</h3>\n<ul>\n<li>La Terre tourne : la face éclairée = jour, l'autre = nuit (l'ombre propre de la Terre !) ;</li>\n<li>Éclipses : la Lune passe dans le cône d'ombre de la Terre (éclipse de Lune) ou masque le Soleil (éclipse de Soleil — ombre portée de la Lune sur la Terre) ;</li>\n<li>Phases de la Lune : proportions éclairées visibles selon les positions relatives.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — prévoir la taille d'une ombre portée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une lampe ponctuelle, une balle de 4 cm à 20 cm de la lampe, un écran à 60 cm. Quelle est la taille de l'ombre ?</div><div class=\"etu\"><b>Étape 1 — Constater le rapport</b> : l'écran est 3× plus loin que la balle (60/20).</div><div class=\"etu\"><b>Étape 2 — Appliquer la propagation rectiligne</b> : les bords de l'ombre prolongent les rayons tangents à la balle → l'ombre est <b>agrandie dans le même rapport</b> : 3 × 4 = 12 cm.</div><div class=\"etu\"><b>Étape 3 — Généraliser</b> : plus l'écran est loin, plus l'ombre est grande ; plus la source est loin, plus l'ombre est <b>proche de la taille de l'objet</b> (d'où les ombres courtes à midi).</div><div class=\"etu\"><b>Étape 4 — Vérifier par l'expérience</b> : déplacer la lampe et observer : le modèle « rayons droits » prévoit tout.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La Lune est une source de lumière » : objet <b>diffusant</b>.</li>\n<li>« La lumière peut tourner » : en ligne droite dans un milieu <b>transparent homogène</b> ; elle dévie en changeant de milieu.</li>\n<li>« L'ombre et la nuit, deux phénomènes différents » : la nuit = ombre <b>propre</b> de la Terre ; l'éclipse = alignement exceptionnel.</li>\n<li>« Toute absence de lumière = ombre portée » : distinguer ombre <b>propre</b> (sur l'objet) et <b>portée</b> (sur l'écran).</li>\n<li>« Une source large donne une ombre nette » : non — elle donne une <b>pénombre</b> floue.</li>\n</ul>\n</div>"
 },
 {
  "id": "son-propagation",
  "theme": "Le son : vibration et propagation (5e)",
  "niveau": "5e",
  "titre": "Le son : vibration et propagation",
  "cours": "<div class=\"cours-head\"><h2>Le son : vibration et propagation</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le son naît d'une vibration</h3>\n<ul>\n<li>Toute source sonore <b>vibre</b> : corde de guitare, membranes du haut-parleur, cordes vocales ;</li>\n<li>Cette vibration met le milieu en mouvement : le son est une <b>propagation de vibration</b>, pas un déplacement de matière.</li>\n</ul>\n\n<h3>2. Le son a besoin d'un milieu matériel</h3>\n<table>\n<tr><th>Milieu</th><th>Le son s'y propage ?</th><th>Vitesse approximative</th></tr>\n<tr><td>air</td><td>oui</td><td>≈ 340 m/s (à 15 °C)</td></tr>\n<tr><td>eau</td><td>oui</td><td>≈ 1500 m/s</td></tr>\n<tr><td>acier</td><td>oui</td><td>≈ 5000 m/s</td></tr>\n<tr><td><b>vide</b></td><td><b>non</b></td><td>—</td></tr>\n</table>\n<div class=\"warn\"><b>Dans l'espace, personne ne vous entend</b> : sans matière à faire vibrer, aucun son — les explosions de films sont silencieuses en réalité.</div>\n\n<h3>3. Vitesse du son et calculs</h3>\n<ul>\n<li>La vitesse dépend du <b>milieu</b> (et un peu de la température) ;</li>\n<li>Calcul : <b>v = d / t</b> (v en m/s, d en m, t en s) ;</li>\n<li>Application : la foudre — on voit l'éclair quasi instantanément (lumière : 300 000 km/s), le tonnerre arrive après : compter les secondes × 340 m = distance de l'orage.</li>\n</ul>\n<div class=\"formule\">Éclair vu puis tonnerre entendu 3 s plus tard : d = 340 × 3 ≈ 1 km — l'orage est à environ 1 km.</div>\n\n<h3>4. Hauteur et niveau sonore</h3>\n<ul>\n<li><b>Hauteur</b> (aigu/grave) : liée à la <b>fréquence</b> de la vibration (hertz, Hz) — plus la vibration est rapide, plus le son est aigu ;</li>\n<li><b>Niveau sonore</b> (fort/faible) : lié à l'<b>amplitude</b>, mesuré en <b>décibels (dB)</b> ;</li>\n<li>Domaine audible : ≈ 20 Hz à 20 000 Hz (au-delà : ultrasons ; en-deçà : infrasons) ;</li>\n<li>Protection : au-delà de ~85 dB en exposition prolongée, l'ouïe est en <b>danger</b> (bouchons, casques limiteurs).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — mesurer la distance d'un obstacle par écho</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un son émis vers une falaise revient 2 s plus tard. À quelle distance est la falaise ?</div><div class=\"etu\"><b>Étape 1 — Attention au trajet</b> : le son fait l'<b>aller-retour</b> : 2 s pour 2×d, pas pour d.</div><div class=\"etu\"><b>Étape 2 — Calculer</b> : distance totale = 340 × 2 = 680 m ; donc d = 680 / 2 = <b>340 m</b>.</div><div class=\"etu\"><b>Étape 3 — Généraliser</b> : d = (v × t) / 2 en écho — même principe que le sonar et l'échographie.</div><div class=\"etu\"><b>Étape 4 — Vérifier l'ordre de grandeur</b> : 2 s d'écho = falaise lointaine (plus d'un stade) : cohérent.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Le son se propage dans le vide » : <b>jamais</b> — il faut un milieu matériel.</li>\n<li>« Le son voyage plus vite dans l'air que dans l'eau » : c'est l'inverse (l'eau est plus <b>rigide</b>).</li>\n<li>« Confondre vitesse et fréquence » : la fréquence (aigu/grave) ne change pas la vitesse de propagation.</li>\n<li>« Fort = aigu » : le niveau (dB) et la hauteur (Hz) sont <b>indépendants</b>.</li>\n<li>« Oublier l'aller-retour dans l'écho » : diviser par 2 !</li>\n</ul>\n</div>"
 },
 {
  "id": "air-pression",
  "theme": "L'air : composition et pression (4e)",
  "niveau": "4e",
  "titre": "L'air : composition et pression",
  "cours": "<div class=\"cours-head\"><h2>L'air : composition et pression</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'air est un mélange de gaz</h3>\n<ul>\n<li>Composition (en volume) : ≈ <b>78 % diazote (N₂)</b>, <b>21 % dioxygène (O₂)</b>, ≈ 1 % argon et traces de CO₂, vapeur d'eau ;</li>\n<li>L'air est <b>invisible mais matériel</b> : il a une masse (≈ 1,2 g par litre) et il occupe un volume ;</li>\n<li>Le <b>dioxygène</b> est le gaz nécessaire à la respiration et à la combustion.</li>\n</ul>\n<div class=\"tip\"><b>Preuve que l'air pèse</b> : un ballon gonflé sur une balance pèse plus qu'un ballon dégonflé — la masse ajoutée est celle de l'air insufflé.</div>\n\n<h3>2. La pression de l'air</h3>\n<ul>\n<li>Les particules de gaz frappent en permanence les parois : c'est la <b>pression</b> ;</li>\n<li>Elle se mesure avec un <b>manomètre</b> ou un <b>baromètre</b> ; unité : le <b>pascal (Pa)</b> — usuellement l'<b>hectopascal (hPa)</b> ou le bar ;</li>\n<li>Pression atmosphérique moyenne : ≈ <b>1013 hPa</b> au niveau de la mer ;</li>\n<li>La pression augmente quand on <b>comprime</b> (moins de volume), diminue quand on <b>détend</b> ou qu'on chauffe (particules plus agitées → elles frappent plus fort mais sont moins nombreuses par volume).</li>\n</ul>\n<div class=\"formule\">À température constante : comprimer un gaz ×2 (volume ÷2) double sa pression ; détendre réduit la pression.</div>\n\n<h3>3. Pression et altitude</h3>\n<table>\n<tr><th>Altitude</th><th>Pression</th><th>Conséquence</th></tr>\n<tr><td>niveau de la mer</td><td>1013 hPa</td><td>—</td></tr>\n<tr><td>montagne (2000 m)</td><td>≈ 800 hPa</td><td>moins d'O₂ par inspiration : essoufflement</td></tr>\n<tr><td>avion de ligne (10 000 m)</td><td>≈ 260 hPa</td><td>cabine <b>pressurisée</b> obligatoire</td></tr>\n</table>\n<ul>\n<li>Plus on monte, moins il y a d'air au-dessus : la <b>colonne d'air</b> pèse moins → pression plus faible ;</li>\n<li>Applications : suceur de ballon d'altitude, sachets de chips qui gonflent en montagne, oreilles qui se bouchent.</li>\n</ul>\n\n<h3>4. Applications quotidiennes</h3>\n<ul>\n<li><b>Paille</b> : on aspire → moins de pression dans la bouche → l'air atmosphérique pousse le liquide ;</li>\n<li><b>Ventouse</b> : on chasse l'air dessous → la pression extérieure plaque la ventouse ;</li>\n<li>Pneus : la pression du pneu soutient le véhicule ; gonflage contrôlé au manomètre ;</li>\n<li>Météo : hautes et basses pressions prédisent le temps (anticyclone/dépression).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — expliquer une expérience de la canette</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On verse un fond d'eau dans une canette en métal, on la chauffe jusqu'à la vapeur, puis on la retourle dans l'eau froide : elle s'écrase brutalement. Pourquoi ?</div><div class=\"etu\"><b>Étape 1 — Chauffe</b> : la vapeur chasse une partie de l'air de la canette.</div><div class=\"etu\"><b>Étape 2 — Refroidissement</b> : la vapeur se <b>liquéfie</b> (redevient eau liquide) → très peu de gaz reste à l'intérieur.</div><div class=\"etu\"><b>Étape 3 — Déséquilibre</b> : la pression intérieure chute ; la pression atmosphérique extérieure (1013 hPa) n'a plus de rival.</div><div class=\"etu\"><b>Étape 4 — Conclusion</b> : c'est l'air <b>extérieur</b> qui écrase la canette — la force des pressions est réelle et considérable : environ 1 kg par cm² !</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« L'air n'a pas de masse » : ≈ 1,2 g/L à température ambiante.</li>\n<li>« La paille aspire le liquide » : c'est la pression <b>atmosphérique</b> qui le pousse quand on a abaissé la pression dans la bouche.</li>\n<li>« Comprimer l'air change sa masse » : même masse, <b>volume plus petit</b> → pression plus grande.</li>\n<li>« La pression atmosphérique est la même partout » : elle varie avec l'<b>altitude</b> et la météo.</li>\n<li>« Le dioxygène est le gaz majoritaire de l'air » : c'est le <b>diazote</b> (78 %).</li>\n</ul>\n</div>"
 },

  "niveau": "4e",
  "titre": "Atomes et molécules : décrire la matière",
  "cours": "<div class=\"cours-head\"><h2>Atomes et molécules : décrire la matière</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Du visible à l'invisible : les échelles</h3>\n<ul>\n<li>La matière est faite de <b>atomes</b> (taille ≈ 0,1 nm = 10⁻¹⁰ m) ;</li>\n<li>Un atome : un <b>noyau</b> (protons + neutrons) et des <b>électrons</b> en mouvement autour ;</li>\n<li>Le noyau est 100 000× plus petit que l'atome : presque toute la masse est dans le noyau, presque tout le volume est du vide.</li>\n</ul>\n<div class=\"tip\"><b>Analogie</b> : si le noyau était une cerise au centre d'un stade, l'atome serait le stade entier — les électrons graviteraient dans les tribunes. La matière est surtout <b>du vide</b>.</div>\n\n<h3>2. Atomes : les éléments</h3>\n<ul>\n<li>Chaque type d'atome = un <b>élément chimique</b>, symbolé par une ou deux lettres (O, H, C, N, Fe, Cu...) ;</li>\n<li>Le nombre de <b>protons</b> (numéro atomique) identifie l'élément ;</li>\n<li>Les 90 éléments naturels constituent toute la matière ; l'<b>hydrogène</b> est le plus répandu dans l'Univers.</li>\n</ul>\n\n<h3>3. Molécules : des atomes assemblés</h3>\n<table>\n<tr><th>Molécule</th><th>Formule</th><th>Composition</th></tr>\n<tr><td>eau</td><td>H₂O</td><td>2 atomes d'hydrogène + 1 d'oxygène</td></tr>\n<tr><td>dioxygène</td><td>O₂</td><td>2 atomes d'oxygène</td></tr>\n<tr><td>dioxyde de carbone</td><td>CO₂</td><td>1 carbone + 2 oxygène</td></tr>\n<tr><td>diazote</td><td>N₂</td><td>2 atomes d'azote</td></tr>\n<tr><td>méthane</td><td>CH₄</td><td>1 carbone + 4 hydrogène</td></tr>\n</table>\n<div class=\"warn\"><b>Lire une formule</b> : l'indice en bas à droite donne le <b>nombre d'atomes</b> ; sans indice = 1 atome. H₂O ≠ H₂O₂ (l'eau oxygénée) : <b>une formule, une espèce</b> précise.</div>\n\n<h3>4. Atomes, molécules et états de la matière</h3>\n<ul>\n<li>Solide : molécules <b>ordées</b> et serrées ; liquide : <b>tassées</b> mais mobiles ; gaz : <b>éloignées</b> et agitées ;</li>\n<li>Les changements d'état ne modifient <b>pas</b> les molécules : seulement leur organisation ;</li>\n<li>Une transformation <b>chimique</b>, elle, réorganise les atomes en nouvelles molécules (3e).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — décomposer une formule</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Décrire la molécule de saccharose C₁₂H₂₂O₁₁ (sucre).</div><div class=\"etu\"><b>Étape 1 — Lire chaque élément</b> : C = carbone, H = hydrogène, O = oxygène.</div><div class=\"etu\"><b>Étape 2 — Compter</b> : 12 carbones, 22 hydrogènes, 11 oxygènes.</div><div class=\"etu\"><b>Étape 3 — Vérifier</b> : total = 45 atomes dans une seule molécule.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : quelle que soit la complexité, la méthode est la même : <b>symbole + indice</b>. En brûlant, ce sucre donnera du CO₂ et de l'eau — les mêmes atomes, réassemblés.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Voir un atome à l'œil nu » : impossible — il faut des microscopes spéciaux (et encore) ; parler en <b>modèle</b>.</li>\n<li>« O₂ et O₃, pareil » : dioxygène (respiration) et ozone (couche d'ozone) : molécules <b>différentes</b>.</li>\n<li>« La molécule d'eau contient de l'oxygène respirable » : les atomes de l'eau sont <b>liés</b> : on ne peut pas respirer H₂O.</li>\n<li>« Fondre change les molécules » : changement d'état = même molécule, autre <b>organisation</b>.</li>\n<li>« Le nombre en bas = charge » : l'indice = <b>nombre d'atomes</b> ; les charges viennent plus tard (ions, 3e).</li>\n</ul>\n</div>"
 },

  "niveau": "4e",
  "titre": "Circuits en série et en dérivation",
  "cours": "<div class=\"cours-head\"><h2>Circuits en série et en dérivation</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Deux façons de brancher</h3>\n<table>\n<tr><th></th><th>Série</th><th>Dérivation</th></tr>\n<tr><td>Structure</td><td>une seule boucle</td><td>plusieurs <b>branches</b> entre deux nœuds</td></tr>\n<tr><td>Si une lampe grille</td><td><b>tout s'éteint</b></td><td>les autres <b>continuent</b></td></tr>\n<tr><td>Brightness en ajoutant</td><td>diminue</td><td>inchangée</td></tr>\n<tr><td>Exemple réel</td><td>guirlande ancienne</td><td>installations de la maison</td></tr>\n</table>\n<div class=\"tip\"><b>C'est pour cela que chez vous</b>, une ampoule grillée n'éteint pas toute la maison : les appareils sont en <b>dérivation</b>.</div>\n\n<h3>2. Nœuds et branches : le vocabulaire</h3>\n<ul>\n<li><b>Nœud</b> : point de connexion où le courant se partage (au moins 3 fils) ;</li>\n<li><b>Branche</b> : portion entre deux nœuds ;</li>\n<li><b>Branche principale</b> : celle du générateur ; <b>branches dérivées</b> : les autres.</li>\n</ul>\n\n<h3>3. Loi des intensités (en dérivation)</h3>\n<div class=\"formule\">L'intensité qui <b>arrive</b> à un nœud = la somme des intensités qui en <b>repartent</b> :<br>I(principale) = I₁ + I₂ + ...</div>\n<ul>\n<li>Le courant se <b>partage</b> aux nœuds, comme l'eau d'une rivière autour d'un île ;</li>\n<li>Dans chaque branche dérivée, l'intensité dépend de ce qui y est branché ;</li>\n<li>Mesures : ampèremètre en <b>série</b> dans chaque branche.</li>\n</ul>\n\n<h3>4. Court-circuit et dangers</h3>\n<ul>\n<li><b>Court-circuiter</b> un dipôle : le relier par un fil sans résistance — il s'éteint, et le courant <b>explose</b> dans la branche du fil ;</li>\n<li>Dans une maison : le court-circuit échauffe les fils → risque d'<b>incendie</b> ;</li>\n<li>Protection : <b>fusible</b> (fond et coupe) ou <b>disjoncteur</b> (coupe et se réarme) — calibrés à l'installation.</li>\n</ul>\n<div class=\"warn\"><b>Règle</b> : un dipôle court-circuité ne fonctionne plus, mais le reste du circuit, lui, reçoit trop de courant : d'où les protections.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — prévoir les intensités dans une installation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une guirlande en dérivation : 3 lampes identiques sur 3 branches ; le générateur débite 0,6 A. Que vaut l'intensité dans chaque lampe ?</div><div class=\"etu\"><b>Étape 1 — Identifier les nœuds</b> : les 3 branches se partagent le courant entre les deux nœuds.</div><div class=\"etu\"><b>Étape 2 — Appliquer la loi</b> : I(principale) = I₁ + I₂ + I₃.</div><div class=\"etu\"><b>Étape 3 — Symétrie</b> : lampes identiques → intensités égales : I = 0,6 / 3 = <b>0,2 A chacune</b>.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : si on retire une lampe (dérivation !), les autres brillent <b>pareil</b> ; seule l'intensité principale change — au contraire de la série.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« En dérivation, le courant est plus faible partout » : il se <b>partage</b> ; la branche principale porte la <b>somme</b>.</li>\n<li>« Une lampe grillée en dérivation coupe tout » : non, seules les <b>autres branches</b> continuent (c'est l'avantage).</li>\n<li>« Court-circuiter une lampe l'abîme » : c'est le <b>générateur et les fils</b> qui souffrent (échauffement).</li>\n<li>« L'ampèremètre se branche en dérivation » : <b>en série</b>, toujours — le voltmètre seul est en dérivation (3e).</li>\n<li>« Plus de branches = moins de sécurité » : plus de branches = <b>plus de courant total</b> → il faut un fusible calibré.</li>\n</ul>\n</div>"
 },
