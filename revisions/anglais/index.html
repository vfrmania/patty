var COURS_META = [
  {
    "id": "present-tenses",
    "theme": "Le présent : present simple et present continuous (Anglais — Collège)",
    "niveau": "Collège — Anglais",
    "titre": "Le présent : present simple et present continuous",
    "cours": "<div class=\"cours-head\"><h2>Le présent : present simple et present continuous</h2><span class=\"niv\">Collège — Anglais</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Present simple : les habitudes et les vérités</h3>\n<p>On l'emploie pour parler d'une <b>habitude</b>, d'une <b>vérité générale</b> ou d'un <b>goût</b> :</p>\n<ul>\n<li><i>She <b>works</b> in a hospital.</i> (elle travaille — métier, habitude)</li>\n<li><i>Water <b>boils</b> at 100°C.</i> (vérité scientifique)</li>\n<li><i>I <b>like</b> chocolate.</i> (goût)</li>\n</ul>\n<div class=\"formule\">Forme : S + verbe (+ <b>-s</b> à la 3e pers. sing.) — négation : <b>don't/doesn't</b> + V — question : <b>Do/Does</b> + S + V ?</div>\n<div class=\"warn\"><b>Attention :</b> à la 3e personne du singulier, le -s du présent est <b>obligatoire</b> : <i>She works</i>, jamais « She work ». Avec <i>does</i>, le verbe reprend sa forme nue : <i>Does she work ?</i> (pas « works »).</div>\n\n<h3>2. Les marqueurs de temps du present simple</h3>\n<ul>\n<li><i><b>every day / every week</b></i> (chaque jour/semaine) ;</li>\n<li><i><b>usually, often, always, sometimes, never</b></i> (adverbes de fréquence, placés <b>avant</b> le verbe) ;</li>\n<li><i><b>once/twice a week</b></i> (une/deux fois par semaine).</li>\n</ul>\n<p>Exemple : <i>He <b>usually</b> gets up at 7.</i> — l'adverbe se glisse entre le sujet et le verbe.</p>\n\n<h3>3. Present continuous : l'action en cours</h3>\n<p>Il décrit une action <b>en train de se dérouler</b> au moment où l'on parle, ou une situation <b>temporaire</b> :</p>\n<ul>\n<li><i>Look ! It <b>is raining</b>.</i> (il pleut là, maintenant)</li>\n<li><i>I <b>am staying</b> with my aunt this week.</i> (situation temporaire)</li>\n</ul>\n<div class=\"formule\">Forme : S + <b>am/is/are</b> + V<b>-ing</b> — négation : am/is/are + <b>not</b> — question : Am/Is/Are + S + V-ing ?</div>\n<p>Marqueurs : <i><b>now, right now, at the moment, today, Look! Listen!</b></i></p>\n\n<h3>4. Verbes d'état : jamais au continuous</h3>\n<p>Certains verbes expriment un <b>état</b>, pas une action : ils refusent la forme en -ing :</p>\n<ul>\n<li><i>like, love, hate, want, need, prefer, know, believe, understand, own, belong</i> ;</li>\n<li>✅ <i>I <b>know</b> him.</i> — ❌ « I am knowing him. »</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — choisir entre les deux présents</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Complétez : « Shh ! The baby ___ (sleep). She usually ___ (sleep) two hours in the afternoon. »</div><div class=\"etu\"><b>Étape 1 — Indices</b> : « Shh ! » = action en cours maintenant → present continuous : <i>is sleeping</i>.</div><div class=\"etu\"><b>Étape 2 — Deuxième phrase</b> : « usually » = habitude → present simple : <i>sleeps</i> (3e pers. + -s).</div><div class=\"etu\"><b>Étape 3 — Vérifier</b> : la même personne, deux temps différents : l'opposition « maintenant / d'habitude » est le cœur de la leçon.</div><div class=\"etu\"><b>Étape 4 — Réponse</b> : « Shh ! The baby <b>is sleeping</b>. She usually <b>sleeps</b> two hours in the afternoon. »</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Oublier le <b>-s</b> de 3e personne (<i>she play<b>s</b></i>) : l'erreur la plus fréquente au collège.</li>\n<li>« Does she <b>likes</b>... ? » : faux — après <i>do/does</i>, verbe <b>sans -s</b>.</li>\n<li>Verbes d'état en -ing : « I am wanting » n'existe pas.</li>\n<li>Orthographe du -ing : <i>run → running</i> (consonne doublée), <i>write → writing</i> (e muet supprimé).</li>\n<li>« I am working today » peut être une habitude si « today » désigne une période ; toujours relire le contexte.</li>\n</ul>\n</div>"
  },
  {
    "id": "past-simple",
    "theme": "Le passé : past simple et récit (Anglais — Collège)",
    "niveau": "Collège — Anglais",
    "titre": "Le passé : past simple et récit",
    "cours": "<div class=\"cours-head\"><h2>Le passé : past simple et récit</h2><span class=\"niv\">Collège — Anglais</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Past simple : une action finie dans le passé</h3>\n<p>Il raconte une action <b>achevée</b>, à un moment <b>déterminé</b> du passé (hier, l'année dernière, en 2010...) :</p>\n<ul>\n<li><i>I <b>visited</b> London last year.</i></li>\n<li><i>She <b>went</b> to the cinema yesterday.</i></li>\n</ul>\n<div class=\"formule\">Forme : S + V<b>-ed</b> (verbes réguliers) ou <b>forme irrégulière</b> — négation : <b>didn't</b> + V — question : <b>Did</b> + S + V ?</div>\n<div class=\"warn\"><b>Après <i>did/didn't</i>, le verbe reprend sa forme de base :</b> <i>Did you <b>go</b> ?</i> (pas « went »). L'irrégularité n'apparaît qu'à la forme affirmative.</div>\n\n<h3>2. Les marqueurs du past simple</h3>\n<ul>\n<li><i><b>yesterday, last week/month/year, in 1998, two days ago, when I was young</b></i> ;</li>\n<li><i><b>then, after that</b></i> dans un récit.</li>\n</ul>\n\n<h3>3. Raconter au passé : l'épopée du récit</h3>\n<p>Un récit au passé combine souvent <b>past simple</b> (actions qui avancent l'histoire) et <b>past continuous</b> (arrière-plan, action en cours interrompue) :</p>\n<ul>\n<li><i>I <b>was walking</b> home when I <b>saw</b> an accident.</i> (je marchais — arrière-plan — quand j'ai vu — événement soudain) ;</li>\n<li>Structure : <b>was/were + V-ing</b> + <b>when + past simple</b>.</li>\n</ul>\n<div class=\"tip\"><b>Astuce narrative :</b> « when » introduit l'événement <b>court</b>, « while » introduit l'action <b>longue</b> : <i>While I <b>was cooking</b>, the phone <b>rang</b>.</i></div>\n\n<h3>4. Les verbes irrégulaires prioritaires</h3>\n<table>\n<tr><th>Base</th><th>Past simple</th><th>Participe (pour le perfect)</th></tr>\n<tr><td>go</td><td>went</td><td>gone</td></tr>\n<tr><td>see</td><td>saw</td><td>seen</td></tr>\n<tr><td>take</td><td>took</td><td>taken</td></tr>\n<tr><td>buy</td><td>bought</td><td>bought</td></tr>\n<tr><td>think</td><td>thought</td><td>thought</td></tr>\n<tr><td>write</td><td>wrote</td><td>written</td></tr>\n<tr><td>eat</td><td>ate</td><td>eaten</td></tr>\n</table>\n<p>Méthode : apprendre les <b>trois colonnes</b> ensemble, par groupes de 5, à voix haute.</p>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — raconter une journée au passé</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Mettez au passé : « Yesterday I (wake up) at 8, I (eat) breakfast and then I (go) to school. While I (walk), I (meet) my friend. »</div><div class=\"etu\"><b>Étape 1 — Identifier les temps</b> : suite d'actions achevées → past simple : <i>woke up, ate, went</i>.</div><div class=\"etu\"><b>Étape 2 — « While »</b> : action longue en arrière-plan → past continuous : <i>was walking</i>.</div><div class=\"etu\"><b>Étape 3 — « Meet »</b> : événement soudain → past simple : <i>met</i>.</div><div class=\"etu\"><b>Étape 4 — Réponse</b> : « Yesterday I <b>woke up</b> at 8, I <b>ate</b> breakfast and then I <b>went</b> to school. While I <b>was walking</b>, I <b>met</b> my friend. »</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Did you <b>went</b> ? » : non — <i>Did you go ?</i></li>\n<li>Confusion past simple / participe : <i>I saw</i> (past) ≠ <i>I have seen</i> (perfect).</li>\n<li>Orthographe du -ed : <i>stop → stopped</i> (doublé), <i>like → liked</i> (e muet).</li>\n<li>« ago » se place <b>après</b> la durée : <i>two years <b>ago</b></i>.</li>\n<li>Prononciation du -ed : /t/ (<i>watched</i>), /d/ (<i>played</i>), /ɪd/ (<i>wanted</i>) — utile à l'oral.</li>\n</ul>\n</div>"

    "id": "articles-quantifieurs",
    "theme": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)",
    "niveau": "Collège — Anglais",
    "titre": "Articles et quantifieurs",
    "cours": "<div class=\"cours-head\"><h2>Articles et quantifieurs</h2><span class=\"niv\">Collège — Anglais</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois articles : a/an, the, Ø</h3>\n<table>\n<tr><th>Article</th><th>Emploi</th><th>Exemple</th></tr>\n<tr><td><b>a / an</b></td><td>nom singulier dénombrable, « n'importe lequel », mention nouvelle</td><td><i>I have <b>a</b> dog.</i></td></tr>\n<tr><td><b>the</b></td><td>chose déjà identifiée, connue, unique</td><td><i>The dog is black.</i> (mon chien, celui dont on parle)</td></tr>\n<tr><td><b>Ø (zéro article)</b></td><td>pluriel ou indénombrable, sens général</td><td><i>I like Ø dogs. I drink Ø water.</i></td></tr>\n</table>\n<div class=\"tip\"><b>a</b> devant consonne, <b>an</b> devant voyelle <b>sonore</b> : <i>a dog, an apple, an hour</i> (h muet), <i>a university</i> (son [ju], consonnant).</div>\n\n<h3>2. Dénombrables vs indénombrables</h3>\n<ul>\n<li><b>Dénombrables</b> : <i>a book, two books</i> — prennent a/an, pluriel en -s ;</li>\n<li><b>Indénombrables</b> : <i>water, money, information, advice, bread</i> — pas de pluriel, pas de a/an ;</li>\n<li>Quantité : <i>much/little water</i>, <i>many/few books</i>, <i>a lot of / lots of</i> (les deux).</li>\n</ul>\n<div class=\"warn\"><b>Attention aux faux amis :</b> <i>information</i>, <i>advice</i>, <i>furniture</i>, <i>news</i> sont <b>indénombrables</b> en anglais : « some information », jamais « an information » ni « informations ».</div>\n\n<h3>3. Some, any, no</h3>\n<ul>\n<li><b>some</b> : affirmatif (<i>I have <b>some</b> money</i>) ou question polie (<i>Would you like some tea ?</i>) ;</li>\n<li><b>any</b> : négatif (<i>I don't have <b>any</b> money</i>) et interrogatif (<i>Do you have <b>any</b> questions ?</i>) ;</li>\n<li><b>no</b> : négatif avec verbe <b>affirmatif</b> (<i>I have <b>no</b> money</i> = I don't have any).</li>\n</ul>\n\n<h3>4. Les quantifieurs fréquents</h3>\n<ul>\n<li><b>a few / a little</b> : « quelques, un peu » (positif) ; <b>few / little</b> : « peu (presque rien) », valeur négative ;</li>\n<li><b>enough</b> : <i>enough money</i> (avant le nom) ;</li>\n<li><b>plenty of</b> : « largement assez » ;</li>\n<li><b>another</b> (+ singulier) / <b>other</b> (+ pluriel ou the other).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — corriger les articles d'un texte</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Corrigez : « I bought a bread and the milk. The children like a music. »</div><div class=\"etu\"><b>Étape 1 — bread</b> : indénombrable → pas de « a » : <i>I bought Ø bread</i> (ou <i>a loaf of bread</i>).</div><div class=\"etu\"><b>Étape 2 — the milk</b> : OK si le lait est identifié (celui de la liste) ; sinon Ø milk.</div><div class=\"etu\"><b>Étape 3 — music</b> : indénombrable et sens général → Ø music : <i>Children like Ø music</i> ; « the children » correct si on les connaît, sinon « children » en général.</div><div class=\"etu\"><b>Étape 4 — Bilan</b> : toujours se demander : dénombrable ? identifié ? général ?</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« an information », « an advice » : non — <i>a piece of information/advice</i>.</li>\n<li>« the life is beautiful » : pour le sens général, anglais → Ø : <i>Life is beautiful</i>.</li>\n<li>« How many money ? » : non — <i>How much money ?</i></li>\n<li>Ne pas doubler la négation : « I don't have no money » est familier ; à l'écrit : <i>I don't have any money</i>.</li>\n<li>« an » devant « u » sonore comme dans <i>university, uniform</i> (on dit « a »).</li>\n</ul>\n</div>"

    "id": "modaux",
    "theme": "Les modaux : can, must, should (Anglais — Collège)",
    "niveau": "Collège — Anglais",
    "titre": "Les modaux : can, must, should",
    "cours": "<div class=\"cours-head\"><h2>Les modaux : can, must, should</h2><span class=\"niv\">Collège — Anglais</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Ce qu'est un modal</h3>\n<p>Un <b>modal</b> modifie le sens du verbe : il exprime la <b>capacité</b>, l'<b>obligation</b>, le <b>conseil</b>, la <b>permission</b>, la <b>possibilité</b>. Règles communes à tous :</p>\n<ul>\n<li>modal + <b>verbe base</b> (sans « to », sans -s, sans -ing) : <i>She can swim.</i></li>\n<li>pas de <b>-s</b> à la 3e personne : <i>He must go</i> (jamais « musts ») ;</li>\n<li>négation directe : <i>can't, mustn't, shouldn't</i> ;</li>\n<li>pas d'auxiliaire do : <i>Can you swim ?</i> (pas « Do you can »).</li>\n</ul>\n\n<h3>2. Can / can't</h3>\n<table>\n<tr><th>Valeur</th><th>Exemple</th></tr>\n<tr><td><b>Capacité</b></td><td><i>I <b>can</b> play the piano.</i></td></tr>\n<tr><td><b>Permission</b></td><td><i>You <b>can</b> use my phone.</i></td></tr>\n<tr><td><b>Possibilité</b></td><td><i>It <b>can</b> be very cold in winter.</i></td></tr>\n<tr><td><b>Demande polie</b></td><td><i><b>Can</b> you help me ?</i></td></tr>\n</table>\n<p>Passé de « can » : <b>could</b> (<i>I could swim when I was five</i>) ou <b>was/were able to</b>.</p>\n\n<h3>3. Must / mustn't / don't have to</h3>\n<ul>\n<li><b>must</b> = obligation <b>forte</b>, règle, déduction : <i>You must wear a seatbelt. He must be tired (il doit être fatigué — déduction).</i></li>\n<li><b>mustn't</b> = <b>interdiction</b> : <i>You mustn't smoke here.</i></li>\n<li><b>don't have to</b> = <b>pas obligatoire</b> : <i>You don't have to come.</i> (tu peux, mais aucune obligation)</li>\n</ul>\n<div class=\"warn\"><b>Le piège n°1 :</b> <i>mustn't</i> = interdiction, <i>don't have to</i> = absence d'obligation. « You mustn't pay » ne veut pas dire « tu n'es pas obligé de payer » mais « il t'est interdit de payer » !</div>\n\n<h3>4. Should / shouldn't : le conseil</h3>\n<ul>\n<li><b>should</b> = conseil, ce qu'il serait bon de faire : <i>You should drink more water.</i></li>\n<li><b>shouldn't</b> = déconseiller : <i>You shouldn't eat so fast.</i></li>\n<li>Renforcement : <b>ought to</b> (équivalent), <b>had better</b> (fort, « ferais mieux de »).</li>\n</ul>\n\n<h3>5. Les autres modaux à connaître</h3>\n<ul>\n<li><b>may / might</b> : permission formelle / possibilité (<i>It might rain</i>) ;</li>\n<li><b>would</b> : conditionnel, demande polie (<i>Would you open the window ?</i>) ;</li>\n<li><b>will</b> : futur, promesse ;</li>\n<li><b>shall</b> : suggestions (UK, <i>Shall we go ?</i>).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — choisir le bon modal</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Traduisez : 1) « Tu dois finir ton devoir » (obligation, la prof exige). 2) « Tu n'es pas obligé de venir » 3) « Il est interdit de crier » 4) « Tu devrais dormir plus. »</div><div class=\"etu\"><b>Étape 1</b> : obligation exigée → <b>must</b> : <i>You must finish your homework.</i></div><div class=\"etu\"><b>Étape 2</b> : pas d'obligation → <b>don't have to</b> : <i>You don't have to come.</i></div><div class=\"etu\"><b>Étape 3</b> : interdiction → <b>mustn't</b> : <i>You mustn't shout.</i></div><div class=\"etu\"><b>Étape 4</b> : conseil → <b>should</b> : <i>You should sleep more.</i></div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« He can to swim » : non — <i>He can swim</i> (pas de « to » après un modal).</li>\n<li>« She cans » : non — jamais de -s sur un modal.</li>\n<li><i>mustn't</i> ≠ <i>don't have to</i> (interdiction ≠ non-obligation).</li>\n<li>« Do you can ? » : non — inversion directe : <i>Can you ?</i></li>\n<li>Passé des modaux : <i>must</i> n'a pas de passé direct → <i>had to</i> ; <i>can</i> → <i>could</i>.</li>\n</ul>\n</div>"
  },

    "id": "comparatif-superlatif",
    "theme": "Comparatif et superlatif (Anglais — Collège)",
    "niveau": "Collège — Anglais",
    "titre": "Comparatif et superlatif",
    "cours": "<div class=\"cours-head\"><h2>Comparatif et superlatif</h2><span class=\"niv\">Collège — Anglais</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois degrés de comparaison</h3>\n<table>\n<tr><th>Degré</th><th>Règle</th><th>Exemple</th></tr>\n<tr><td><b>Égalité</b></td><td><b>as + adjectif + as</b></td><td><i>Tom is <b>as tall as</b> Jim.</i></td></tr>\n<tr><td><b>Infériorité</b></td><td><b>less + adjectif + than</b></td><td><i>This book is <b>less interesting than</b> the other.</i></td></tr>\n<tr><td><b>Supériorité</b></td><td><b>more + adjectif + than</b> ou <b>adjectif-er + than</b></td><td><i>She is <b>more intelligent than</b> me. / Jim is <b>taller than</b> Tom.</i></td></tr>\n<tr><td><b>Superlatif</b></td><td><b>the most + adjectif</b> ou <b>the adjectif-est</b></td><td><i>the most beautiful / the tallest</i></td></tr>\n</table>\n\n<h3>2. Comment choisir -er ou more ?</h3>\n<ul>\n<li>Adjectif <b>court</b> (1 syllabe) : <b>+ er / + est</b> → <i>tall → taller → the tallest</i> ;</li>\n<li>Adjectif <b>long</b> (3 syllabes et +) : <b>more / the most</b> → <i>expensive → more expensive → the most expensive</i> ;</li>\n<li>Adjectif de 2 syllabes : les deux sont souvent possibles → <i>clever → cleverer / more clever</i> ; les adjectifs en <b>-y</b> prennent -er : <i>happy → happier → the happiest</i>.</li>\n</ul>\n<div class=\"tip\"><b>Orthographe :</b> consonne finale doublée (<i>big → bigger</i>), -y → -ier (<i>easy → easier</i>), e finale conservée avec -r/-st (<i>large → larger</i>).</div>\n\n<h3>3. Les formes irrégulières</h3>\n<table>\n<tr><th>Base</th><th>Comparatif</th><th>Superlatif</th></tr>\n<tr><td>good / well</td><td>better</td><td>the best</td></tr>\n<tr><td>bad / badly</td><td>worse</td><td>the worst</td></tr>\n<tr><td>far</td><td>farther / further</td><td>the farthest / the furthest</td></tr>\n<tr><td>little</td><td>less</td><td>the least</td></tr>\n<tr><td>much / many</td><td>more</td><td>the most</td></tr>\n</table>\n\n<h3>4. Comparer des noms et des verbes</h3>\n<ul>\n<li><b>more/ fewer / less + nom</b> : <i>more books, fewer pens, less water</i> ;</li>\n<li><b>as many... as / as much... as</b> : <i>as many books as, as much water as</i> ;</li>\n<li>Verbes : <i>She runs <b>faster than</b> me / <b>as fast as</b> me</i> (adverbes : <i>fast → faster</i>, <i>hard → harder</i> ; les adverbes en -ly → <i>more quickly</i>).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — comparer trois objets</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparez : A, B et C (chaises). A coûte 20 £, B coûte 50 £, C coûte 100 £. Elles sont solides dans l'ordre croissant : C &gt; B &gt; A.</div><div class=\"etu\"><b>Étape 1 — Prix</b> : A est la <b>moins chère</b> : <i>A is less expensive than B. C is the most expensive (of all / of the three).</i></div><div class=\"etu\"><b>Étape 2 — Solidité</b> : <i>A is less solid than B. C is the most solid.</i> ou avec un adjectif court : <i>C is the strongest chair.</i></div><div class=\"etu\"><b>Étape 3 — Égalité éventuelle</b> : si deux objets sont identiques : <i>B is as expensive as C.</i></div><div class=\"etu\"><b>Étape 4 — Nuancer</b> : « of the three » ou « in the shop » précise le groupe comparé — obligatoire au superlatif.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« more taller » : non — jamais <b>more + -er</b> ensemble.</li>\n<li>« the most cheap » : non — <i>the cheapest</i> (adjectif court).</li>\n<li>« as tall than » : non — <i>as tall as</i> et <i>taller than</i>.</li>\n<li>good → <i>gooder</i> n'existe pas : <i>better, the best</i>.</li>\n<li>Comparatif double : « the more you practise, the better you get » — structure « the + comparatif..., the + comparatif... » à connaître.</li>\n</ul>\n</div>"

    "id": "futur",
    "theme": "Le futur : will et be going to (Anglais — Collège)",
    "niveau": "Collège — Anglais",
    "titre": "Le futur : will et be going to",
    "cours": "<div class=\"cours-head\"><h2>Le futur : will et be going to</h2><span class=\"niv\">Collège — Anglais</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Will : prédiction et décision spontanée</h3>\n<ul>\n<li><b>Prédiction</b> (opinion, sans preuve) : <i>I think it <b>will rain</b> tomorrow.</i></li>\n<li><b>Décision spontanée</b> (prise au moment de parler) : <i>The phone is ringing — I <b>will answer</b> !</i></li>\n<li><b>Promesse, offre</b> : <i>I <b>will help</b> you, I promise.</i></li>\n</ul>\n<div class=\"formule\">Forme : S + <b>will</b> + V base — négation : <b>won't</b> — question : <b>Will</b> + S + V ?</div>\n\n<h3>2. Be going to : intention et prédiction fondée</h3>\n<ul>\n<li><b>Intention</b> (décision <b>déjà prise</b>) : <i>I <b>am going to visit</b> my grandmother this weekend.</i></li>\n<li><b>Prédiction fondée sur des indices</b> : <i>Look at those clouds — it <b>is going to rain</b> !</i></li>\n</ul>\n<div class=\"formule\">Forme : S + <b>am/is/are going to</b> + V base</div>\n<div class=\"tip\"><b>Le réflexe :</b> décision <b>sur le moment</b> → will ; décision <b>à l'avance</b> → be going to. Indice visible → be going to ; simple opinion → will.</div>\n\n<h3>3. Présent continu pour l'avenir organisé</h3>\n<ul>\n<li>Arrangement <b>pris avec d'autres</b> (rendez-vous, billets) : <i>I <b>am meeting</b> Sarah at 6 (we have agreed).</i></li>\n<li>Différence : <i>I'm going to study</i> (intention) / <i>I'm studying tonight with Tom</i> (c'est organisé avec Tom).</li>\n</ul>\n\n<h3>4. Present simple pour l'avenir programmé</h3>\n<ul>\n<li>Horaires, calendriers : <i>The train <b>leaves</b> at 8:45 tomorrow morning.</i></li>\n<li>Subordonnées de temps : <i>I <b>will call</b> you when I <b>arrive</b>.</i> (après <i>when, as soon as, until, before</i> : présent, pas de will !)</li>\n</ul>\n\n<h3>5. Les marqueurs du futur</h3>\n<ul>\n<li><i><b>tomorrow, next week/year, in 2030, soon, in two days</b></i> ;</li>\n<li><i><b>tonight, later</b></i> pour les arrangements.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — choisir la bonne forme du futur</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Choisissez : 1) « Look at the sky ! It (rain). » 2) « I (buy) a car — I've decided, I've saved the money. » 3) « I (help) you with your bags. » 4) « The film (start) at 9 pm. »</div><div class=\"etu\"><b>Étape 1 — Indices visibles</b> : « Look at the sky » → prédiction fondée → <b>is going to rain</b>.</div><div class=\"etu\"><b>Étape 2 — Intention déjà prise</b> : « I've decided » → <b>am going to buy</b>.</div><div class=\"etu\"><b>Étape 3 — Offre spontanée</b> : → <b>will help</b> (décision sur le moment).</div><div class=\"etu\"><b>Étape 4 — Programme</b> : horaire → present simple : <b>starts</b> at 9 pm.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Après <i>when / as soon as / until / before</i> : <b>présent</b>, pas de will : <i>When he arrives, I will tell him.</i></li>\n<li>« She wills come » : non — will ne prend jamais de -s.</li>\n<li>« going to go » correct mais lourd : préférer <i>I'm going (to go)</i>.</li>\n<li>Ne pas confondre <i>will</i> (opinion) et <i>be going to</i> (indices/intention).</li>\n<li>« Won't » = refus aussi : <i>The door won't open</i> (elle refuse de s'ouvrir).</li>\n</ul>\n</div>"
  },

    "id": "questions",
    "theme": "Poser des questions (Anglais — Collège)",

    "titre": "Poser des questions : mots interrogatifs et structure",
    "cours": "<div class=\"cours-head\"><h2>Poser des questions : mots interrogatifs et structure</h2><span class=\"niv\">Collège — Anglais</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les mots interrogatifs (wh- words)</h3>\n<table>\n<tr><th>Mot</th><th>Sens</th><th>Exemple</th></tr>\n<tr><td><b>What</b></td><td>quoi / quel</td><td>What is your name ?</td></tr>\n<tr><td><b>Where</b></td><td>où</td><td>Where do you live ?</td></tr>\n<tr><td><b>When</b></td><td>quand</td><td>When is your birthday ?</td></tr>\n<tr><td><b>Who</b></td><td>qui</td><td>Who is your best friend ?</td></tr>\n<tr><td><b>Why</b></td><td>pourquoi</td><td>Why are you late ?</td></tr>\n<tr><td><b>How</b></td><td>comment</td><td>How are you ?</td></tr>\n<tr><td><b>How old</b></td><td>quel âge</td><td>How old are you ?</td></tr>\n<tr><td><b>How many / much</b></td><td>combien</td><td>How many brothers have you got ?</td></tr>\n</table>\n\n<h3>2. La structure de la question</h3>\n<div class=\"formule\">Question en wh- : <b>Wh- + auxiliaire + sujet + verbe… ?</b><br>Where <b>do</b> you live ? · What <b>is</b> your name ? · When <b>did</b> she arrive ?</div>\n<ul>\n<li>La <b>concordance des temps</b> suit l'auxiliaire : present simple → <b>do/does</b> ; past simple → <b>did</b> (le verbe reste à la base verbale) ;</li>\n<li>Question fermée (oui/non), sans mot wh- : <b>Do</b> you like pizza ? — Yes, I do. / No, I don't.</li>\n</ul>\n\n<h3>3. Les trois formulations d'une même question</h3>\n<ul>\n<li>Inversion : <b>Where does he work ?</b></li>\n<li>Est-ce que : <b>Where does he work ?</b> → « Does he work in London ? »</li>\n<li>Intonation montante (registre courant) : <b>He works in London ?</b></li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Oublier l'auxiliaire : « Where you live ? » est incorrect → <b>Where do you live ?</b></li>\n<li>Avec <b>did</b>, le verbe ne prend pas de -ed : « Where did you went ? » → <b>Where did you go ?</b></li>\n<li>Attention à la 3e personne : <b>does</b> (Does she play ?) mais <b>do</b> pour I/you/we/they.</li>\n<li>Ne pas traduire « Est-ce que » mot à mot : l'anglais n'utilise pas cette tournure.</li>\n</ul>\n</div>"

    "id": "present-perfect",
    "theme": "Le present perfect : expérience et résultat (Anglais — Lycée)",
    "niveau": "Lycée — Anglais",
    "titre": "Le present perfect",
    "cours": "<div class=\"cours-head\"><h2>Le present perfect</h2><span class=\"niv\">Lycée — Anglais</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le pont entre passé et présent</h3>\n<p>Le <b>present perfect</b> (have/has + participe passé) relie un moment du passé au <b>présent</b>. Trois emplois majeurs :</p>\n<ul>\n<li><b>Bilan d'expérience</b> (à un moment indéterminé, sans date) : <i>I <b>have visited</b> Rome twice.</i> — quand exactement ? Sans importance ;</li>\n<li><b>Action récente aux conséquences présentes</b> : <i>She <b>has broken</b> her leg (elle a le plâtre maintenant)</i> ;</li>\n<li><b>État qui dure encore</b> : <i>We <b>have lived</b> here for ten years (et nous y vivons toujours)</i>.</li>\n</ul>\n<div class=\"formule\">Forme : S + <b>have/has</b> + participe passé — négation : haven't/hasn't — question : Have/Has + S + V ?</div>\n\n<h3>2. Les marqueurs du present perfect</h3>\n<table>\n<tr><th>Marqueur</th><th>Valeur</th><th>Exemple</th></tr>\n<tr><td><b>ever / never</b></td><td>expérience</td><td><i>Have you ever been to Japan ?</i></td></tr>\n<tr><td><b>just</b></td><td>« venir de »</td><td><i>She has just left.</i></td></tr>\n<tr><td><b>already / yet</b></td><td>déjà / pas encore</td><td><i>I have already finished. He hasn't arrived yet.</i></td></tr>\n<tr><td><b>for / since</b></td><td>durée / point de départ</td><td><i>for two years / since 2019</i></td></tr>\n<tr><td><b>so far, recently, this week</b></td><td>période non terminée</td><td><i>I have read three books so far.</i></td></tr>\n</table>\n<div class=\"tip\"><b>for / since :</b> <i>for</i> + durée (for two hours) ; <i>since</i> + point de départ (since Monday, since I was born). Test : « pendant combien de temps ? » → for ; « depuis quand ? » → since.</div>\n\n<h3>3. Present perfect vs past simple : le choix crucial</h3>\n<ul>\n<li><b>Date précise ou période révolue</b> → past simple : <i>I visited Rome <b>in 2019</b>. I saw him <b>yesterday</b>.</i></li>\n<li><b>Aucune date / lien avec le présent</b> → present perfect : <i>I <b>have visited</b> Rome (un jour, peu importe).</i></li>\n<li>Comparez : <i>She has lived in Paris for 5 years</i> (elle y est toujours) / <i>She lived in Paris for 5 years</i> (elle n'y est plus).</li>\n</ul>\n\n<h3>4. Present perfect continuous</h3>\n<p>Pour souligner la <b>durée d'une action qui continue</b> (ou vient de s'arrêter) :</p>\n<ul>\n<li><i>I <b>have been waiting</b> for an hour !</i> (et j'attends toujours, et je m'impatiente) ;</li>\n<li>Forme : have/has + <b>been</b> + V-ing ; marqueurs : <i>all day, for..., since..., lately</i>.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — choisir entre perfect et past simple</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Choisissez le temps : 1) « I (see) that film last night. » 2) « I (see) that film — it's great ! » 3) « He (work) here since 2010. » 4) « He (work) here before he moved to Lyon. »</div><div class=\"etu\"><b>Étape 1 — « last night »</b> : date précise, révolue → past simple : <i>saw</i>.</div><div class=\"etu\"><b>Étape 2 — Pas de date, bilan lié au présent</b> → present perfect : <i>have seen</i>.</div><div class=\"etu\"><b>Étape 3 — « since 2010 »</b> : toujours en poste → <i>has worked / has been working</i> here.</div><div class=\"etu\"><b>Étape 4 — Période révolue</b> (« before he moved ») → past simple : <i>worked</i>.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Jamais de marqueur de date passée avec le present perfect : « I have seen him yesterday » → <i>I saw him yesterday</i>.</li>\n<li>« since two hours » : non — <i>for two hours</i> (durée).</li>\n<li>« yet » en phrase affirmative : non — <i>yet</i> appartient aux négatives et questions ; « already » aux affirmatives.</li>\n<li>Participes irréguliers : <i>go → gone</i>, mais <i>have been to</i> = être allé (et revenu) ; <i>have gone to</i> = y être encore.</li>\n<li>« He has arrived since an hour » : non — <i>He arrived an hour ago</i>.</li>\n</ul>\n</div>"

    "titre": "La voix passive",
    "cours": "<div class=\"cours-head\"><h2>La voix passive</h2><span class=\"niv\">Lycée — Anglais</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Actif vs passif</h3>\n<ul>\n<li><b>Actif</b> : le sujet <b>fait</b> l'action — <i>Shakespeare <b>wrote</b> Hamlet.</i></li>\n<li><b>Passif</b> : le sujet <b>subit</b> l'action — <i>Hamlet <b>was written</b> by Shakespeare.</i></li>\n</ul>\n<div class=\"formule\">Passif = <b>be</b> (au temps voulu) + <b>participe passé</b> — complément d'agent avec <b>by</b></div>\n\n<h3>2. La transformation, pas à pas</h3>\n<ol>\n<li>Le <b>COD</b> de la phrase active devient le <b>sujet</b> du passif ;</li>\n<li>Le verbe become <b>be + participe</b>, au même temps que l'actif ;</li>\n<li>L'ancien sujet devient <b>by + complément d'agent</b> (souvent omis).</li>\n</ol>\n<table>\n<tr><th>Temps</th><th>Actif</th><th>Passif</th></tr>\n<tr><td>Present simple</td><td>They clean the room.</td><td>The room <b>is cleaned</b>.</td></tr>\n<tr><td>Past simple</td><td>They cleaned the room.</td><td>The room <b>was cleaned</b>.</td></tr>\n<tr><td>Present perfect</td><td>They have cleaned it.</td><td>It <b>has been cleaned</b>.</td></tr>\n<tr><td>Future</td><td>They will clean it.</td><td>It <b>will be cleaned</b>.</td></tr>\n<tr><td>Modal</td><td>You must sign it.</td><td>It <b>must be signed</b>.</td></tr>\n</table>\n\n<h3>3. Pourquoi employer le passif ?</h3>\n<ul>\n<li>Mettre en <b>avant l'objet</b> ou le résultat : <i>The Mona Lisa was stolen in 1911.</i></li>\n<li><b>Agent inconnu ou sans importance</b> : <i>My bike has been stolen !</i></li>\n<li><b>Style journalistique ou scientifique</b> : <i>The results were analysed.</i></li>\n</ul>\n\n<h3>4. Cas particuliers</h3>\n<ul>\n<li>Verbes à <b>deux compléments</b> : <i>They gave her a prize → She was given a prize / A prize was given to her.</i></li>\n<li><b>Have/get something done</b> : faire faire — <i>I had my car repaired. She got her hair cut.</i></li>\n<li>Question passive : <i>When was the bridge built ?</i></li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — transformer un texte au passif</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Mettez au passif : 1) « The government built this school in 1990. » 2) « Somebody has stolen my wallet. » 3) « They are repairing the road. »</div><div class=\"etu\"><b>Étape 1</b> : COD = « this school », temps = past simple → <i>This school <b>was built</b> in 1990 (by the government).</i></div><div class=\"etu\"><b>Étape 2</b> : agent inconnu → à omettre ; present perfect → <i>My wallet <b>has been stolen</b>.</i></div><div class=\"etu\"><b>Étape 3</b> : present continuous → <i>The road <b>is being repaired</b>.</i> (être en train de subir l'action)</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : le « be » du passif porte le temps et s'accorde avec le nouveau sujet.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« The room was cleaned by clean » : non — participe passé (<i>cleaned</i>), jamais la base.</li>\n<li>Oublier d'accorder « be » : <i>The books <b>were</b> sold</i> (pluriel).</li>\n<li>Passif continu : <i>is being built</i> — ne pas oublier « being ».</li>\n<li>« It was happened » : impossible — <i>happen</i> est intransitif, pas de passif.</li>\n<li>Le passif n'est pas « plus soutenu » par magie : l'agent n'est ajouté que s'il est <b>informatif</b>.</li>\n</ul>\n</div>"

    "id": "pronoms-relatifs",
    "theme": "Les pronoms relatifs : who, which, that (Anglais — Lycée)",
    "niveau": "Lycée — Anglais",
    "titre": "Les pronoms relatifs",
    "cours": "<div class=\"cours-head\"><h2>Les pronoms relatifs</h2><span class=\"niv\">Lycée — Anglais</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le rôle du pronom relatif</h3>\n<p>Il relie une subordonnée à son <b>antécédent</b> et le remplace, comme en français :</p>\n<ul>\n<li><i>The book <b>that/which</b> I bought is great.</i> (le livre que j'ai acheté)</li>\n<li><i>The man <b>who</b> called you is my neighbour.</i> (l'homme qui t'a appelé)</li>\n</ul>\n\n<h3>2. Qui choisir : who, which, that, whose, where</h3>\n<table>\n<tr><th>Relatif</th><th>Antécédent</th><th>Exemple</th></tr>\n<tr><td><b>who / whom</b></td><td>personne</td><td><i>the woman <b>who</b> lives next door</i></td></tr>\n<tr><td><b>which</b></td><td>chose ou animal</td><td><i>the film <b>which</b> I saw</i></td></tr>\n<tr><td><b>that</b></td><td>personne ou chose (souvent après superlatif, all, nothing...)</td><td><i>the best film <b>that</b> I have ever seen</i></td></tr>\n<tr><td><b>whose</b></td><td>possession</td><td><i>the boy <b>whose</b> father is a pilot</i></td></tr>\n<tr><td><b>where</b></td><td>lieu</td><td><i>the town <b>where</b> I was born</i></td></tr>\n<tr><td><b>when / why</b></td><td>temps / raison</td><td><i>the day <b>when</b> we met / the reason <b>why</b> he left</i></td></tr>\n</table>\n\n<h3>3. Omettre le relatif : la règle</h3>\n<p>Le relatif (that/which/who) peut être <b>omis</b> quand il est <b>COD</b> de la subordonnée :</p>\n<ul>\n<li><i>The book (that) I bought is great.</i> — « that » = COD de « bought » → omissible ;</li>\n<li><i>The man who lives next door is nice.</i> — « who » est <b>sujet</b> de « lives » → <b> jamais omis</b> ;</li>\n<li><i>whose</i>, <i>where</i> et les relatifs après préposition ne s'omettent pas.</li>\n</ul>\n<div class=\"tip\"><b>Test rapide :</b> verbe juste après le relatif ? → relatif sujet, on ne peut pas l'effacer. Nom juste après ? → relatif COD, on peut l'effacer.</div>\n\n<h3>4. Relatif + préposition</h3>\n<ul>\n<li>Forme neutre : <i>the friend <b>with whom</b> I travelled / the friend (that) I travelled <b>with</b></i> ;</li>\n<li><i>whom</i> = forme objet (soutenu) ; en anglais courant, on préfère « who » ou l'omission avec préposition en fin.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — traduire « dont »</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Traduisez : 1) « le film dont je t'ai parlé » 2) « la fille dont le frère est médecin » 3) « la ville dont je rêve »</div><div class=\"etu\"><b>Étape 1</b> : « parler de » → <i>the film <b>(that) I told you about</b></i> (préposition « about » rejetée en fin).</div><div class=\"etu\"><b>Étape 2</b> : possession → <i>the girl <b>whose</b> brother is a doctor</i>.</div><div class=\"etu\"><b>Étape 3</b> : « rêver de » → <i>the city <b>(that) I dream of</b></i> — ou <i>of which I dream</i> (soutenu).</div><div class=\"etu\"><b>Étape 4 — Bilan</b> : « dont » = soit <b>whose</b> (possesseur), soit préposition rejetée en fin de phrase.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« The man which called » : non — personne → <b>who/that</b>.</li>\n<li>« The book who I read » : non — chose → <b>which/that</b>.</li>\n<li>Effacer un relatif sujet : « The man lives next door » change de sens !</li>\n<li>« whose » sans nom derrière : « the boy whose I know » — non, il faut <i>whose + nom</i>.</li>\n<li>Après une virgule (relative explicative), on n'emploie pas <i>that</i> : <i>Paris, which I love, ...</i></li>\n</ul>\n</div>"
  },

    "cours": "<div class=\"cours-head\"><h2>Les conditionnels</h2><span class=\"niv\">Lycée — Anglais</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois types de conditionnels</h3>\n<table>\n<tr><th>Type</th><th>Structure</th><th>Valeur</th><th>Exemple</th></tr>\n<tr><td><b>Type 0</b></td><td><b>if + présent, présent</b></td><td>vérité générale, logique</td><td><i>If you heat ice, it melts.</i></td></tr>\n<tr><td><b>Type 1</b></td><td><b>if + présent, will + V</b></td><td>future probable, réel</td><td><i>If it rains, we <b>will stay</b> home.</i></td></tr>\n<tr><td><b>Type 2</b></td><td><b>if + past simple, would + V</b></td><td>hypothétique, irréel du présent</td><td><i>If I <b>were</b> rich, I <b>would travel</b>.</i></td></tr>\n<tr><td><b>Type 3</b></td><td><b>if + past perfect, would have + p.p.</b></td><td>regret, irréel du passé</td><td><i>If you <b>had called</b>, I <b>would have come</b>.</i></td></tr>\n</table>\n<div class=\"warn\"><b>Règle absolue :</b> jamais de <b>will/would</b> dans la subordonnée en « if ». « If it will rain » → <i>If it rains</i> ; « If I would be » → <i>If I were</i>.</div>\n\n<h3>2. Les variantes modales</h3>\n<ul>\n<li>Type 1 : <i>If you finish early, you <b>can/may/might</b> go out.</i> (possibilité, permission)</li>\n<li>Type 2 : <i>If I won, I <b>could</b> buy a house.</i> (capacité hypothétique)</li>\n<li>Type 3 : <i>She <b>could have won</b> if she had trained.</i></li>\n</ul>\n\n<h3>3. « Were » et l'inversion</h3>\n<ul>\n<li>À toutes les personnes, l'hypothétique emploie <b>were</b> : <i>If I were you, If she were here...</i> (le subjonctif) ;</li>\n<li>Style soutenu : <b>inversion</b> sans « if » — <i><b>Were I</b> you... / <b>Had he known</b>, he would have come.</i></li>\n</ul>\n\n<h3>4. Unless, provided, as long as</h3>\n<ul>\n<li><b>unless</b> = « si... ne... pas » : <i>Unless you hurry, you will miss the train.</i> (= if you don't hurry)</li>\n<li><b>provided (that) / as long as</b> = « à condition que » : <i>You can go provided you come back at 6.</i></li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — formuler un regret (type 3)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Exprimez : « Hier je n'ai pas révisé, donc j'ai raté mon contrôle. »</div><div class=\"etu\"><b>Étape 1 — Repérer l'irréel du passé</b> : la cause est révolue → type 3.</div><div class=\"etu\"><b>Étape 2 — Subordonnée</b> : <i>If I <b>had revised</b> (if + past perfect).</i></div><div class=\"etu\"><b>Étape 3 — Principale</b> : <i>I <b>would not have failed</b> (would have + participe).</i></div><div class=\"etu\"><b>Étape 4 — Phrase complète</b> : <i>If I had revised, I wouldn't have failed my test.</i> — variante inversée : <i>Had I revised, I wouldn't have failed.</i></div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« will » dans le if : la faute la plus fréquente — bannir.</li>\n<li>Type 2 : « If I would be you » → <i>If I were you</i>.</li>\n<li>Mélanger les types : <i>If he had come, I would be happy now</i> est correct (mixte passé/présent), mais <i>If he came, I would have been happy</i> est fautif.</li>\n<li><i>unless</i> déjà négatif : « Unless you don't hurry » → non.</li>\n<li>« was » au type 2 est familier ; à l'écrit, préférer <i>were</i>.</li>\n</ul>\n</div>"

nt simple ;</li>\n<li>Évolution récente → present perfect : <i>Social media have changed teenagers' lives.</i></li>\n</ul>\n\n<h3>4. Le paragraphe idéal (bac, examens)</h3>\n<ol>\n<li><b>Topic sentence</b> : l'idée du paragraphe en une phrase ;</li>\n<li><b>Développement</b> : explication + exemple précis (chiffres, dates, œuvre) ;</li>\n<li><b>Linking words</b> pour articuler ;</li>\n<li><b>Mini-conclusion</b> qui annonce la suite.</li>\n</ol>\n<div class=\"warn\"><b>Vocabulaire à bannir</b> d'une copie : « very very », « a lot of » répété, « thing », « stuff », « good/bad » tout seuls — préférer <i>numerous, significant, crucial, harmful, beneficial</i>.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — rédiger un paragraphe argumenté</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Rédigez un paragraphe : « Is social media harmful to teenagers? » (opinion nuancée).</div><div class=\"etu\"><b>Étape 1 — Topic sentence</b> : <i>To my mind, social media can be harmful, although they also have real advantages.</i></div><div class=\"etu\"><b>Étape 2 — Argument + exemple</b> : <i>Indeed, teenagers may suffer from cyberbullying: for instance, studies show that a third of them have experienced online harassment.</i></div><div class=\"etu\"><b>Étape 3 — Concession</b> : <i>However, these platforms also help young people keep in touch and find support communities.</i></div><div class=\"etu\"><b>Étape 4 — Mini-conclusion</b> : <i>All in all, the problem is not the tool but the use we make of it.</i></div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« despite of » : non — <i>despite</i> seul, ou <i>in spite of</i>.</li>\n<li>« although + nom » : non — <i>although</i> + proposition ; <i>despite</i> + nom.</li>\n<li>« informations, advices » : indénombrables, jamais au pluriel.</li>\n<li>Calques du français : « actually » ≠ « actuellement » (= in fact) ; « eventually » ≠ « éventuellement » (= finally).</li>\n<li>« We can see that... » en boucle : varier les introducteurs d'analyse.</li>\n</ul>\n</div>"

lection de Trump</td></tr>\n</table>\n\n<h3>4. Société et valeurs</h3>\n<ul>\n<li><b>American Dream</b> : réussite possible par le travail (statue de la Liberté, « from rags to riches ») ; ses limites : inégalités, <b>American Nightmare</b> ;</li>\n<li><b>Melting pot / salad bowl</b> : métissage culturel ; immigration ;</li>\n<li><b>UK</b> : monarchie et traditions vs modernité (NHS 1948, multiculturalisme, dévolution Écosse/Galles 1999) ;</li>\n<li>Thèmes d'essai fréquents : guns (2e amendement), ségrégation, immigration, rôle des médias.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — utiliser un repère dans un essai</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> « To what extent has the American Dream come true? » — Amener un exemple historique précis.</div><div class=\"etu\"><b>Étape 1 — Choisir un exemple</b> : la marche de Selma (1965) ou l'élection d'Obama (2008) — symbole de réussite d'une minorité.</div><div class=\"etu\"><b>Étape 2 — Le préciser</b> : « In 2008, Barack Obama became the first African-American president, which seemed to embody the American Dream. »</div><div class=\"etu\"><b>Étape 3 — Nuancer</b> : « Yet, the Dream remains out of reach for many, as social mobility has declined since the 1980s. »</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : relier l'exemple à la thèse (le Dream s'est partiellement réalisé).</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre <b>UK</b>, <b>Great Britain</b> et <b>England</b> — et « British » ≠ « English ».</li>\n<li>« The Queen rules » : le monarque <b>reigns</b> but does not <b>rule</b>.</li>\n<li>Dates des uns appliquées aux autres : le Civil Rights Movement est américain, pas britannique.</li>\n<li>American Dream ≠ richesse garantie : c'est une <b>promesse</b> de mobilité sociale.</li>\n<li>Washington (État) ≠ Washington D.C. (capitale).</li>\n</ul>\n</div>"

function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });

}

function pdfDownload(pdfStr, filename){

  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();

}
