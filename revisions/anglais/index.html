{"t": "Connecteurs et expression écrite (Anglais — Lycée)", "q": "« ___ he was exhausted, he kept working. »", "c": ["Despite", "Because of", "However", "Although"], "a": 3, "e": "« he was exhausted » = PHRASE complète (sujet + verbe) → Although.", "d": "<b>La phrase complète appelle although</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « he was exhausted » contient un sujet (he) et un verbe (was) → c'est une PHRASE → <b>Although</b> : <i><b>Although</b> he was exhausted, he kept working.</i> : les transformations équivalentes : <i>Despite his exhaustion</i> (nom) / <i>Despite being exhausted</i> (gérondif) / <i>Even though he was exhausted</i> (phrase, plus emphatique) : le test systématique : verbe conjugué présent ? → although/even though ; seulement un nom/-ing ? → despite/in spite of : cette bascule although/despite est le cœur technique du chapitre — la vérifier en dix secondes avant de rendre la copie.</div>"},
{"t": "Connecteurs et expression écrite (Anglais — Lycée)", "q": "Quel énoncé décrit le mieux « moreover » ?", "c": ["Il marque une opposition entre deux idées.", "Il exprime une conséquence.", "Il introduit un exemple.", "Il ajoute un argument supplémentaire dans le même sens."], "a": 3, "e": "Moreover = en outre / de plus : ADDITION d'un argument qui renforce le précédent.", "d": "<b>Moreover, l'empileur d'arguments</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>Social networks help people stay in touch. <b>Moreover</b>, they are a powerful tool for small businesses.</i> — le second argument VA dans le même sens que le premier (empilement) : la famille : moreover, furthermore, in addition, besides, what is more : la différence fine : moreover s'utilise surtout à l'écrit formel (registre essay) ; besides, plus parlé, apporte un argument « en plus » souvent défensif : en strategy d'essay : First (argument 1) → Moreover (argument 2) → Finally (argument 3) → To conclude : l'examen valorise les connecteurs VARIES : deux moreover dans un paragraphe suffisent — ensuite, varier (furthermore, in addition) : la richesse lexicale des liens est notée en soi.</div>"},
{"t": "Civilisation britannique et américaine (Anglais — Lycée)", "q": "Au Royaume-Uni, le chef du gouvernement est :", "c": ["the Prime Minister", "the President of the Commons", "the King", "the Lord Speaker"], "a": 0, "e": "Monarchie parlementaire : le roi règne, le Premier ministre gouverne (Head of Government).", "d": "<b>Régner ou gouverner ?</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la devise résume tout : « the King reigns but does not rule » (le roi règne mais ne gouverne pas) : le souverain est Head of STATE (symbole, discours du trône, Royal Assent) ; le <b>Prime Minister</b>, chef du parti majoritaire à la Commons, est Head of GOVERNMENT (politique réelle, résidence au 10 Downing Street) : la dualité anglaise : un roi + un PM = monarchie PARLEMENTAIRE : les distracteurs mélangent les chambres et les fonctions : la comparaison USA : le Président cumule les deux casquettes (chef d'État ET de gouvernement) — c'est LA différence institutionnelle majeure entre les deux pays : question d'entrée en matière parfaite pour l'oral de bac.</div>"},
{"t": "Civilisation britannique et américaine (Anglais — Lycée)", "q": "Le Congrès américain se compose :", "c": ["de la House of Representatives et du Senate", "du Cabinet et de la House", "de la House of Commons et du Senate", "du Parlement et du White House"], "a": 0, "e": "Congrès bicaméral : House of Representatives (435) + Senate (100 sénateurs, 2 par État).", "d": "<b>Les deux chambres du Capitol</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le Congrès (au Capitol) = <b>House of Representatives</b> (435 élus, mandats de 2 ans, sièges proportionnels à la population — les grands États dominent) + <b>Senate</b> (100 sénateurs — 2 PAR État, quel que soit sa taille, mandat 6 ans) : l'équilibre fondateur : les grands États gagnent à la House, les petits se protègent au Senate — le Connecticut Compromise (1787) : le piège : « House of Commons » est l'équivalent BRITANNIQUE (le mot Commons n'existe pas aux USA) : la comparaison transversale (Commons/House vs Lords/Senate) est un exercice classique du bac — les deux mots exacts rapportent les points de terminology attendus.</div>"},
{"t": "Civilisation britannique et américaine (Anglais — Lycée)", "q": "Le Président américain est élu :", "c": ["par le Supreme Court", "par l'Electoral College (suffrage indirect)", "au suffrage universel direct", "par la House of Representatives"], "a": 1, "e": "Le vote citoyen choisit des grands électeurs, qui élisent le président : suffrage indirect.", "d": "<b>L'Electoral College, l'élection en deux temps</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les citoyens votent dans leur État → les grands électeurs (nombre = représentants + sénateurs de l'État) votent ensuite : la majorité de l'État emporte (presque toujours) TOUS ses grands électeurs (winner-takes-all) : conséquence : un candidat peut gagner l'Élection tout en perdant le vote populaire — c'est arrivé en 2000 (G. Bush) et 2016 (Trump) : le piège du « suffrage direct » : le vote citoyen choisit des grands électeurs, pas directement le président : cette subtilité est un sujet d'essay récurrent (« Should the Electoral College be abolished? ») — connaître le mécanisme est la moitié de l'argumentaire.</div>"},
{"t": "Civilisation britannique et américaine (Anglais — Lycée)", "q": "Le Bill of Rights américain (1791) :", "c": ["abolit l'esclavage", "correspond aux dix premiers amendements garantissant les libertés fondamentales", "est la constitution anglaise de 1689", "crée l'Electoral College"], "a": 1, "e": "Bill of Rights = 10 premiers amendements (1791) : liberté d'expression, presse, religion (1er), port d'armes (2e), procès équitable (5e)...", "d": "<b>Les dix premiers, la garantie des libertés</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les Pères fondateurs ont ajouté au plus vite (1791) dix amendements protégeant l'individu contre l'État : 1er : liberté d'expression, de presse, de réunion, de religion : 2e : droit de porter des armes : 5e : ne pas témoigner contre soi-même (to plead the Fifth !) : l'homonymie piège : le Bill of Rights ANGLAIS (1689) est une autre pièce — il limite le pouvoir royal après la Glorieuse Révolution : les deux « Bill of Rights » existent (1689 UK / 1791 USA) : le 1er amendement est LE texte cité dans tous les débats américains (presse, écoles, religion) — l'invoquer dans un essay (« the First Amendment protects... ») est un réflexe de civilisation apprécié.</div>"},
{"t": "Civilisation britannique et américaine (Anglais — Lycée)", "q": "Le Royaume-Uni se caractérise par :", "c": ["un régime présidentiel", "une seule chambre parlementaire", "l'absence de constitution écrite en un document unique", "une constitution écrite datant de 1787"], "a": 2, "e": "Le UK n'a PAS de constitution codifiée : coutumes, lois fondatrices (Magna Carta, Bill of Rights) et jurisprudence.", "d": "<b>Une constitution en morceaux</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le UK fonctionne SANS document fondateur unique : sa « constitution » est un assemblage : conventions (coutumes non écrites — le PM vient de la majorité), statutes (lois fondatrices : Magna Carta 1215, Bill of Rights 1689, Parliament Acts), common law (jurisprudence) : la conséquence : la flexibilité (une loi ordinaire peut changer les règles) MAIS la fragilité (pas de contrôle de constitutionnalité fort) : le contraste USA : une constitution écrite, RIGIDE (27 amendements seulement en 230 ans, majorité qualifiée exigée) : l'opposition souple/rigide est un excellent argument d'essay sur la stabilité politique — et une question d'entretien d'oral fréquente.</div>"},
{"t": "Civilisation britannique et américaine (Anglais — Lycée)", "q": "« Checks and balances » désigne :", "c": ["le vote du Congrès", "le système de freins et contrepoids entre les trois pouvoirs (exécutif, législatif, judiciaire)", "l'inspection des urnes", "le système bancaire américain"], "a": 1, "e": "Séparation des pouvoirs avec contrôle mutuel : veto présidentiel, impeachment, nomination des juges — aucun pouvoir n'est absolu.", "d": "<b>Pouvoir contre pouvoir</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la mécanique : le Président peut opposer son <i>veto</i> à une loi du Congrès — mais le Congrès peut passer outre (2/3) : le Congrès peut <i>impeach</i> (destituer) le Président : le Président nomme les juges de la Cour suprême — avec l'accord du Senate : la Cour suprême peut déclarer une loi inconstitutionnelle (judicial review, depuis Marbury v. Madison 1803) : l'idée fondatrice (Montesquieu relu par les Pères fondateurs) : « ambition must be made to counteract ambition » : employer « checks and balances » à bon escient dans un essay sur le pouvoir (et l'impeachment, l'outil ultime) montre la maîtrise du vocabulaire institutionnel exact.</div>"},
{"t": "Civilisation britannique et américaine (Anglais — Lycée)", "q": "Le « First Past the Post » britannique signifie :", "c": ["le vote des lords", "un vote à deux tours", "un système proportionnel", "le candidat arrivé en tête dans chaque circonscription est élu (scrutin uninominal à un tour)"], "a": 3, "e": "FPTP : uninominal à un tour — le premier past la poste : même avec 35 % des voix, on gagne le siège.", "d": "<b>Le premier prend tout</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le UK découpe le pays en 650 circonscriptions (constituencies) : dans chacune, le candidat avec le PLUS de voix gagne le siège — pas de répartition proportionnelle : conséquence : deux grands partis dominent (Tories/Labour), les petits (Lib Dems, Greens) sont écrasés — des millions de voix peuvent donner peu de sièges : le débat permanent : FPTP favorise la stabilité des gouvernements MAIS sous-représente les minorités : le sujet d'essay type : « Should the UK adopt proportional representation? » — l'argumentaire exige de savoir expliquer le mécanisme : un terme précis, une conséquence institutionnelle, une question de société : la civilisation en action.</div>"},

var PDF_CP1252 = { 0x2018:0x91, 0x2019:0x92, 0x201A:0x82, 0x201C:0x93, 0x201D:0x94, 0x201E:0x84, 0x2013:0x96, 0x2014:0x97, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x20AC:0x80, 0x0152:0x8C, 0x0153:0x9C, 0x0160:0x8A, 0x0161:0x9A, 0x0178:0x9F, 0x017D:0x8E, 0x017E:0x9E, 0x192:0x83, 0x2C6:0x88, 0x2032:0xB4, 0x2039:0x8B, 0x203A:0x9B, 0x201E2:0 };
function pdfTranslit(s){
  return s.replace(/\u2212|\u2013|\u2014/g, '-').replace(/[\u2032\u2019]/g, "'")
    .replace(/\u2192|\u21D2|\u21A6/g, '->').replace(/\u2190/g, '<-')
    .replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u2260/g, '!=').replace(/\u2248/g, '~')
    .replace(/\u2208/g, ' in ').replace(/\u2205/g, 'vide').replace(/\u2286/g, 'incl.')
    .replace(/\u221A/g, 'V').replace(/\u00B7|\u2219|\u22C5/g, '*').replace(/\u2022/g, '-')
    .replace(/\u2124/g, 'Z').replace(/\u211D/g, 'R').replace(/\u2115/g, 'N').replace(/\u2119/g, 'P')
    .replace(/\u00A0/g, ' ').replace(/\u202F|\u2009|\u200B|\uFE0F/g, '')
    .replace(/[\u2460-\u2468]/g, function(c){ return (c.charCodeAt(0) - 0x2460 + 1) + ')'; })
    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
}
function pdfEnc(s){
  var out = '';
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }
    else if (PDF_CP1252[c] !== undefined) b = PDF_CP1252[c];
    if (b !== null && b !== undefined) out += String.fromCharCode(b);
  }
  return out;
}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
var PDF_INLINE = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, SMALL:1, SUB:1, SUP:1, A:1, CODE:1, ABBR:1 };
function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';
    } else if (c.nodeType === 1){
      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }
      else if (g === 'B' || g === 'STRONG') pdfSegs(c, true, out);
      else pdfSegs(c, bold, out);
    }
  }
}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'li') segs = [{ t: '- ', b: bold || false }].concat(segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;
  function walk(n){
    for (var c = n.firstChild; c; c = c.nextSibling){
      if (c.nodeType === 3){
        var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;
        var cl = ' ' + (c.className || '') + ' ';
        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }
        emitP();
        if (/^H[1-6]$/.test(g)) emitBlock('h', c, indent);
        else if (g === 'LI') emitBlock('li', c, indent + 16);
        else if (g === 'UL' || g === 'OL') {
          for (var li = c.firstChild; li; li = li.nextSibling){
            if (li.nodeType === 1 && li.tagName === 'LI') { emitBlock('li', li, indent + 16); walk(li); }
          }
        }
        else if (g === 'TABLE' || g === 'THEAD' || g === 'TBODY'){
          for (var tr = c.firstChild; tr; tr = tr.nextSibling){
            if (tr.nodeType !== 1) continue;
            if (tr.tagName === 'TR'){
              var cells = [];
              for (var td = tr.firstChild; td; td = td.nextSibling){
                if (td.nodeType === 1 && (td.tagName === 'TD' || td.tagName === 'TH')){
                  var cs = []; pdfSegs(td, td.tagName === 'TH', cs);
                  cells.push(cs.map(function(x){ return x.t; }).join('').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
                }
              }
              var line = cells.join('   |   ');
              if (line.replace(/\s/g, '') !== '') blocks.push({ type: 'p', segs: [{ t: line, b: false }], indent: indent + 8 });
            } else if (tr.tagName === 'THEAD' || tr.tagName === 'TBODY') walk(tr);
          }
        }
        else if (g === 'P') { emitBlock('p', c, indent); }
        else { var keep = indent; walk(c); indent = keep; }
      }
    }
    emitP();
  }
  walk(root);
  return blocks;
}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    var isTitle = b.type === 'title';
    var size = isTitle ? 15 : (b.type === 'h' ? 12 : 10.5);
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [];
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) words.push({ br: true });
        p.split(' ').forEach(function(w){ if (w !== '') words.push({ w: w, b: s.b }); });
        if (pi < parts.length - 1) {} else { words.push({ sp: true, b: s.b }); }
      });
    });
    var cur = [], len = 0;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, gap: isTitle ? 0 : (b.type === 'h' ? 7 : 4) }); cur = []; len = 0; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      if (wd.sp) { continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
    if (isTitle) lines.push({ rule: true });
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var pages = [], cur = [], y = TOP;
  lines.forEach(function(ln){
    if (ln.rule){
      if (y - 14 < M) { pages.push(cur); cur = []; y = TOP; }
      y -= 12;
      cur.push('0.29 0.27 0.9 RG 1.5 w ' + M + ' ' + y.toFixed(2) + ' m ' + (W - M) + ' ' + y.toFixed(2) + ' l S\n0 0 0 RG 1 w');
      y -= 8;
      return;
    }
    var lh = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh < M) { pages.push(cur); cur = []; y = TOP; }
    y -= (ln.gap || 0);
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      var enc = pdfEnc(pdfTranslit(s.t));
      if (!enc) return;
      cur.push('BT 1 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Tm /F' + (s.b ? 2 : 1) + ' ' + ln.size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
      x += 0.52 * ln.size * enc.length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';

}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme d&#39;anglais</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + h + '</section>';
})();

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
