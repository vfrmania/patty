{"t": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)", "q": "« There is ___ milk in the fridge. » (phrase affirmative)", "c": ["any", "some", "a", "many"], "a": 1, "e": "Affirmatif + indénombrable → some ; any irait à la négation ou à la question.", "d": "<b>Le signe de la phrase</b>.<div class='ex-detail'><u>Exemple rédigé</u> : réflexe en trois cases : phrase (+) → <b>some</b> ; phrase (-) → <b>any</b> (<i>There isn't any milk</i>) ; question (?) → <b>any</b> (<i>Is there any milk?</i>) : l'exception polie : l'offre/invitation garde some (<i>Would you like some milk?</i> — on espère un « yes ») : « a » est impossible avec un indénombrable (on ne compte pas le lait), « many » aussi : <i>There is <b>some</b> milk in the fridge.</i> — la grille +/-/? résout la plupart des QCM du chapitre en cinq secondes.</div>"},
{"t": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)", "q": "« I don't have ___ money. »", "c": ["many", "some", "any", "a"], "a": 2, "e": "Négation → any (avec indénombrable comme dénombrable).", "d": "<b>Any, l'homme du non</b>.<div class='ex-detail'><u>Exemple rédigé</u> : phrase négative (« don't ») → <b>any</b> : <i>I don't have <b>any</b> money.</i> : la règle vaut pour les dénombrables aussi : <i>I don't have any brothers.</i> : le sens de any : « même pas une unité » (pas la moindre goutte d'argent) : astuce mnémotechnique : <b>some</b> = « il y en a » ; <b>any</b> = « pas/est-ce qu'il y en a » : la faute « some » à la négation est LE point le plus testé du chapitre à chaque contrôle — la corriger est un gain immédiat.</div>"},
{"t": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)", "q": "« How ___ sugar do you take in your tea? »", "c": ["many", "few", "a lot", "much"], "a": 3, "e": "sugar = indénombrable → How much?", "d": "<b>Much pour ce qu'on ne compte pas</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le sucre se pèse, ne se compte pas → <b>much</b> : <i>How <b>much</b> sugar do you take?</i> : le test rapide : peut-on dire « one sugar, two sugars » ? NON (en comptant les morceaux, on dirait « two lumps ») → indénombrable → much : les indénombrables types : water, milk, bread, money, time, information, advice, music, rice, hair : l'inverse : <i>How many cups of tea do you drink a day?</i> (cups est dénombrable) : la paire much/many est au programme de TOUTES les années du collège — la maîtrise se juge en trois secondes.</div>"},
{"t": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)", "q": "« I bought a bike. ___ bike is red. »", "c": ["Some", "The", "An", "A"], "a": 1, "e": "Première mention : a bike ; ensuite, l'objet est connu → the bike.", "d": "<b>La première fois, puis les suivantes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : logique du récit : 1) introduction (<i>a bike</i> = une parmi d'autres, non précisée) : 2) reprise (<i>the bike</i> = CELLE dont on vient de parler) : <i>I bought <b>a</b> bike. <b>The</b> bike is red.</i> : c'est le mécanisme de base des articles définis : la connaissance PARTAGÉE (les deux interlocuteurs savent de quoi on parle) : la même logique dans la vie courante : « Close the door » (LA porte, celle de la pièce), « the sun » (unique) : en compréhension, repérer a → the, c'est suivre le fil du texte — question d'examen très fréquente en 5e-4e.</div>"},
{"t": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)", "q": "Lequel est correct ?", "c": ["France is beautiful.", "A France is beautiful.", "Some France is beautiful.", "The France is beautiful."], "a": 0, "e": "La plupart des pays individuels sont sans article : France, England, Spain. MAIS the Netherlands, the United States, the United Kingdom.", "d": "<b>Les pays et leurs caprices</b>.<div class='ex-detail'><u>Exemple rédigé</u> : règle générale : pays au singulier « simple » → PAS d'article : <i>I live in <b>France</b>.</i> : exceptions fameuses : <i>the United States, the United Kingdom, the Netherlands, the Philippines</i> (pluriels ou formes « composées » avec adjectif) : géographie : rivières et mers avec the (the Thames, the Mediterranean), montagnes individuelles sans (Mount Everest), chaînes avec (the Alps) : villes sans article : Paris, London : la liste « pays avec the » est courte (5-6 noms) : la mémoriser règle la question pour toujours — c'est un point d'examen presque garanti sur les présentations.</div>"},
{"t": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)", "q": "« She plays ___ piano very well. »", "c": ["some piano", "piano", "the piano", "a piano"], "a": 2, "e": "Les instruments de musique prennent the : play the piano, the guitar, the violin. Les sports, non : play football.", "d": "<b>La musique avec the, le sport sans</b>.<div class='ex-detail'><u>Exemple rédigé</u> : instruments : <i>She plays <b>the</b> piano / <b>the</b> guitar / <b>the</b> violin.</i> : sports : <i>He plays football / tennis / basketball.</i> (pas d'article !) : le contraste est le piège préféré des professeurs : « play the football » ✗ : nuance utile pour l'oral de brevet (présentation des loisirs) : <i>I play the violin and I play basketball.</i> — une seule règle à double face, cinq secondes pour l'apprendre, des points à chaque contrôle de l'année.</div>"},
{"t": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)", "q": "« Can you give me ___ information about the trip? »", "c": ["some", "a", "many", "an"], "a": 0, "e": "information est indénombrable en anglais : some information (jamais « an information » ni « informations »).", "d": "<b>Les faux pluriels</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le français dit « des informations », l'anglais refuse le pluriel : <i>some information</i> : liste des indénombrables « piégeux » (car pluriels ou comptables en français) : information, advice (des conseils → <i>some advice</i>), news (des nouvelles → <i>the news IS good</i>), furniture (des meubles), luggage/baggage, hair (des cheveux → <i>her hair IS long</i>), money, progress : la règle grammaticale : indénombrable → pas de a/an, pas de pluriel, verbe au SINGULIER : cette liste est un « réflexe » à acquérir une fois — elle revient dans chaque examen du collège au lycée.</div>"},
{"t": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)", "q": "« Would you like ___ cup of coffee? » (offre polie)", "c": ["a cup", "some", "much", "any"], "a": 1, "e": "Exception polie : les offres gardent some (Would you like some...?) — ici « some cup » serait incorrect grammaticalement, donc la meilleure réponse d'offre est some ; « a cup » est aussi correct mais l'offre classique est some.", "d": "<b>L'offre qui espère un oui</b>.<div class='ex-detail'><u>Exemple rédigé</u> : règle : à l'offre/invitation (<i>Would you like...?</i>), on garde <b>some</b> même en question — parce qu'on attend une réponse positive : <i>Would you like <b>some</b> tea? / Could I have <b>some</b> water?</i> (demande polie) : la logique : some suggère l'existence du « oui » : en revanche une vraie question neutre garde any : <i>Is there any tea?</i> : la nuance some/any dans les questions est fine mais testée : offre ou demande polie → some : question d'existence/neutre → any : un point de grammaire « supérieur » qui impressionne au contrôle.</div>"},
{"t": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)", "q": "« How ___ people are there in your class? »", "c": ["many", "any", "much", "some"], "a": 0, "e": "people = pluriel dénombrable → How many?", "d": "<b>People se compte</b>.<div class='ex-detail'><u>Exemple rédigé</u> : people est le pluriel de person : on peut les compter (one person, two people) → <b>many</b> : <i>How <b>many</b> people are there in your class? — Twenty-eight.</i> : le piège : « peoples » existe mais signifie « les peuples » (ethnies) — pas des individus : la paire how much/how many est LA question de base des interviews orales (classe, famille, ville) : automatiser le réflexe (comptable ? many : sinon much) et l'oral du brevet se passe tout seul.</div>"},
{"t": "Les modaux : can, must, should (Anglais — Collège)", "q": "Choisis : « She ___ swim very fast. »", "c": ["can swims", "can", "cans", "can to"], "a": 1, "e": "can + base verbale : jamais de to, jamais de -s (que ce soit sur le modal ou le verbe).", "d": "<b>Le modal est un chef</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les règles : (1) le modal est suivi DIRECTEMENT de la base verbale (<i>can <b>swim</b></i>) : (2) le modal ne prend JAMAIS de -s, même avec she (<i>she cans</i> ✗) : (3) le verbe non plus (<i>she can swims</i> ✗) : la phrase correcte : <i>She <b>can swim</b> very fast.</i> : pourquoi : le modal porte le sens (capacité) et la marque personnelle — le verbe reste « nu » : cette règle unique vaut pour TOUS les modaux (can, must, should, could, may) : l'apprendre une fois = corriger un tiers des fautes de rédaction.</div>"},
{"t": "Les modaux : can, must, should (Anglais — Collège)", "q": "« You ___ smoke in the classroom. » (c'est strictement interdit)", "c": ["mustn't", "don't have to", "shouldn't", "can"], "a": 0, "e": "mustn't = interdiction forte (règlement) : « il est interdit de... »", "d": "<b>L'interdit à visage strict</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le contexte dit INTERDICTION (règlement de l'école) → <b>mustn't</b> : <i>You <b>mustn't</b> smoke in the classroom.</i> : le piège du « don't have to » (signifierait : « tu n'es pas obligé de fumer » — absurde ici !) : la nuance : mustn't = interdiction absolue (conséquences possibles : punition) ; shouldn't = simple déconseil (pas grave si...) : choisir le modal selon la FORCE : interdit → mustn't ; déconseillé → shouldn't ; facultatif → don't have to : la grille des trois nuances est l'objet même de l'exercice.</div>"},
{"t": "Les modaux : can, must, should (Anglais — Collège)", "q": "« You ___ wear a tie at this restaurant : it's optional. »", "c": ["mustn't", "don't have to", "can't", "must"], "a": 1, "e": "« it's optional » = pas obligatoire → don't have to.", "d": "<b>Facultatif ≠ interdit</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la phrase dit : c'est OPTIONNEL → absence d'obligation → <b>don't have to</b> : <i>You <b>don't have to</b> wear a tie.</i> : le sens : « tu PEUX en mettre un, mais rien ne t'y oblige » : l'erreur classique (étudiants francophones) : mettre mustn't (à cause du « n'est pas obligé » français) — or mustn't signifierait « c'est INTERDIT de porter une cravate » (le contraire de « optional » !) : la paire mustn't / don't have to est le point le plus subtil du chapitre — et le plus testé.</div>"},
{"t": "Les modaux : can, must, should (Anglais — Collège)", "q": "Pour un conseil (« tu devrais te reposer ») :", "c": ["You must rest.", "You shouldn't rest.", "You should rest.", "You can rest."], "a": 2, "e": "should = conseil, recommandation (pas d'obligation).", "d": "<b>Le conseil sans pression</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « tu devrais » = conseil → <b>should</b> : <i>You <b>should</b> rest.</i> : les nuances de force : must (obligation — « tu DOIS ») ; should (conseil — « tu DEVRAIS ») ; can (capacité/permission — « tu PEUX ») : la gradation est utile en expression : donner des conseils avec should est LE standard de l'oral de brevet (conseiller un ami : <i>You should see a doctor. You shouldn't worry.</i>) : mémoriser « should = conseil » suffit pour 90 % des cas du collège.</div>"},
{"t": "Les modaux : can, must, should (Anglais — Collège)", "q": "« ___ I open the window? » (demande de permission)", "c": ["Do", "May", "Should", "Must"], "a": 1, "e": "May I...? est la formule de permission formelle ; Can I...? est possible (plus courant, moins formel).", "d": "<b>Puis-je ? La politesse graduée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la permission se demande avec can (familier) ou may (formel) : <i><b>Can</b> I open the window? (courant)</i> / <i><b>May</b> I open the window? (très poli, formel)</i> : must (obligation) et should (conseil) ne demandent pas une permission : « Do I open...? » (auxiliaire do + base) interroge le fait, pas la permission : en situation d'examen (dialogue avec un professeur), may fait « très poli » — can reste parfaitement correct au collège : la nuance de registre (familier/formel) est un bonus apprécié à l'oral.</div>"},
{"t": "Les modaux : can, must, should (Anglais — Collège)", "q": "« ___ you help me with my homework, please? » (demande polie)", "c": ["Should", "Must", "Could", "May"], "a": 2, "e": "Could you...? = demande polie (could est le passé de can utilisé pour la politesse).", "d": "<b>Le could de politesse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « Could you...? » ne parle PAS du passé : c'est la forme POLIE de « can » (comme « pourriez-vous » pour « pouvez-vous ») : <i><b>Could</b> you help me, please?</i> : la hiérarchie de politesse : Can you...? (neutre) → Could you...? (poli) → Would you mind...? (très poli) : à l'écrit comme à l'oral, emploier could rend la demande plus courtoise — un détail de registre qui « fait » l'anglais naturel : les demandes d'aide sont omniprésentes dans les dialogues d'examen : la formule est à automatiser.</div>"},
{"t": "Les modaux : can, must, should (Anglais — Collège)", "q": "La question correcte avec must :", "c": ["You must go?", "Must you go?", "Does you must go?", "Do you must go?"], "a": 1, "e": "Les modaux forment leurs questions par INVERSION (Modal + sujet) : Must you go? — sans do/does.", "d": "<b>L'inversion, pas do</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le modal est déjà un auxiliaire : il s'inverse directement avec le sujet, sans emprunter do : <i><b>Must</b> you go? / <b>Can</b> she swim? / <b>Should</b> we leave?</i> : la faute « Do you must go? » double l'auxiliaire (do + must) — impossible : la même règle vaut pour la négation : mustn't (pas « don't must ») : résumé : modaux = inversion pour ?, négation directe : une seule règle, trois modaux, toutes les questions du chapitre.</div>"},
{"t": "Les modaux : can, must, should (Anglais — Collège)", "q": "« He ___ speak English when he was five. » (capacité passée)", "c": ["should", "can", "could", "must"], "a": 2, "e": "could = capacité dans le passé (can au passé) : « il savait parler » — peut aussi exprimer une capacité ponctuelle passée avec was able to.", "d": "<b>Le could du passé</b>.<div class='ex-detail'><u>Exemple rédigé</u> : capacité GÉNÉRALE passée → could : <i>He <b>could</b> speak English when he was five.</i> (il savait) : nuance (lycée) : pour une réussite PONCTUELLE, on préfère was able to / managed to (<i>He was able to escape</i> — il a réussi à fuir) : le jeune collégien retient : could = « savait / pouvait » : les autres modaux : must (pas de forme passée propre — had to à la place), should (should have + p.p. pour le regret) : la maîtrise de could comme « passé de can » est une question quasi certaine du contrôle.</div>"},
{"t": "Les modaux : can, must, should (Anglais — Collège)", "q": "Lequel donne un CONSEIL négatif ?", "c": ["You can't eat so fast.", "You don't have to eat so fast.", "You shouldn't eat so fast.", "You mustn't eat so fast."], "a": 2, "e": "shouldn't = déconseil (« tu ne devrais pas ») : pas une interdiction, un conseil négatif.", "d": "<b>Déconseiller, pas interdire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les quatre nuances : mustn't = interdiction (règlement) ; don't have to = pas obligatoire ; can't = incapacité/interdiction ; <b>shouldn't</b> = conseil négatif (avis, santé, bien-être) : <i>You <b>shouldn't</b> eat so fast — it's bad for you.</i> : en expression écrite, la paire should/shouldn't structure un paragraphe de conseils (conseils de santé, conseils de voyage) : la différence entre INTERDIRE (mustn't) et DÉCONSEILLER (shouldn't) est une nuance sociale — le prof anglais la cherche dans chaque copie.</div>"},
{"t": "Les modaux : can, must, should (Anglais — Collège)", "q": "« I ___ finish this report before Friday » (obligation venant du locuteur lui-même)", "c": ["can", "may", "must", "should"], "a": 2, "e": "must exprime l'obligation que le locuteur s'impose ou impose ; have to serait l'obligation extérieure (règle du patron).", "d": "<b>must : l'obligation de l'intérieur</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la nuance (fine, appréciée au lycée) : <b>must</b> = obligation que JE me donne ou que j'impose (<i>I must stop smoking — décision personnelle</i>) : <b>have to</b> = obligation extérieure (règle, loi, patron) : <i>I <b>have to</b> wear a suit at work.</i> : au collège, les deux se traduisent « devoir » — mais la distinction éclaire : must (fort, intérieur) vs have to (contraint, extérieur) : la conjugaison a un effet : must n'a pas de passé propre (→ had to) ni de futur (→ will have to) : réutiliser have to quand must est impossible à conjuguer — un réflexe de niveau lycée qui prépare déjà le bac.</div>"},
{"t": "Comparatif et superlatif (Anglais — Collège)", "q": "Le comparatif de « big » :", "c": ["bigest", "bigger", "more big", "biggest than"], "a": 1, "e": "big = adjectif court d'une syllabe → big + g doublé + er = bigger (than).", "d": "<b>Court ? On double et on ajoute</b>.<div class='ex-detail'><u>Exemple rédigé</u> : big : 1 syllabe, voyelle brève + consonne finale → on DOUBLE le g avant -er : <b>bigger</b> : <i>My house is <b>bigger than</b> yours.</i> : les frères : hot → hotter, thin → thinner, sad → sadder, fat → fatter : pourquoi « more big » est faux : les adjectifs courts prennent TOUJOURS -er (more est réservé aux longs) : la confusion court/long est LA question du chapitre — la règle des syllabes (1 syllabe → -er ; 2+ → more) se vérifie en deux secondes.</div>"},
{"t": "Comparatif et superlatif (Anglais — Collège)", "q": "« She is ___ girl in the class. » (superlatif, adjectif happy)", "c": ["the happiest", "happier", "the happyest", "the most happy"], "a": 0, "e": "happy → y devient i + est : the happiest (adjectif court malgré les 2 syllabes).", "d": "<b>Le y qui devient i</b>.<div class='ex-detail'><u>Exemple rédigé</u> : happy se termine par consonne + y → y → i : happy → happ<b>i</b>er → the happ<b>i</b>est : <i>She is <b>the happiest</b> girl in the class.</i> : la famille des « -y » : easy → easier → the easiest ; early → earlier ; heavy → heavier ; funny → funnier : exception : adjectifs en -y restent courts (2 syllabes mais -er/-est) — c'est le contre-pied du « more » des adjectifs longs : un cas particulier à connaître, très souvent testé au brevet.</div>"},
{"t": "Comparatif et superlatif (Anglais — Collège)", "q": "Le comparatif de « expensive » :", "c": ["expensiver", "more expensive", "expensivest", "most expensive"], "a": 1, "e": "expensive = adjectif long (3 syllabes) → more + expensive + than.", "d": "<b>Long ? On met more devant</b>.<div class='ex-detail'><u>Exemple rédigé</u> : ex-PEN-sive : 3 syllabes → trop long pour -er → <b>more expensive</b> : <i>This car is <b>more expensive than</b> mine.</i> : les longs types : beautiful, interesting, boring, famous, difficult, dangerous, comfortable : la règle (approximative mais efficace au collège) : 1 syllabe → -er ; 2 syllabes se finissant en -y → -er ; sinon → more : la faute « expensiver » sonne immédiatement « étranger » — le choix more/-er est un marqueur de niveau à l'écrit comme à l'oral.</div>"},
{"t": "Comparatif et superlatif (Anglais — Collège)", "q": "Le superlatif de « good » :", "c": ["the best", "the goodest", "the better", "the most good"], "a": 0, "e": "good est irrégulier : good → better → the best.", "d": "<b>Le trio infernal irrégulier</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les irréguliers à savoir par cœur : <b>good → better → the best</b> ; <b>bad → worse → the worst</b> ; <b>far → further → the furthest</b> ; <b>little → less → the least</b> : <i>It's <b>the best</b> film I have ever seen. / That was <b>the worst</b> day of my life.</i> : les formes « gooder/goodest » n'existent pas — et « more good » non plus : ces adjectifs ultra-courants (good, bad) sont donc des pièges permanents : les apprendre en chanson (good-better-best, bad-worse-worst) et ils ne s'oublient plus — question d'examen quasi certaine à chaque niveau.</div>"},
{"t": "Comparatif et superlatif (Anglais — Collège)", "q": "« This exercise is ___ difficult than the last one. »", "c": ["much", "most", "as", "more"], "a": 3, "e": "difficult = adjectif long → more + difficult + THAN (comparatif).", "d": "<b>More...than : le tandem</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le comparatif long se construit : <b>more</b> + adjectif + <b>than</b> : <i>This exercise is <b>more</b> difficult <b>than</b> the last one.</i> : les distracteurs : « most » (superlatif — il manquerait the et un contexte de groupe), « as » (égalité — il faudrait as...as), « much » (quantifieur) : le réflexe : voir « than » → il faut un COMPARATIF : court → -er ; long → more : le mot than est le signal qui déclenche tout le chapitre.</div>"},
{"t": "Comparatif et superlatif (Anglais — Collège)", "q": "L'égalité « aussi rapide que » :", "c": ["more fast as", "as fast as", "as fast than", "so fast as"], "a": 1, "e": "Égalité : as + adjectif + as (les DEUX as) : as fast as.", "d": "<b>Deux as, pas un de moins</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la structure d'égalité : <b>as + adjectif + as</b> : <i>She is <b>as fast as</b> her brother.</i> : la négation : <i>not as/so fast as</i> (moins rapide que) : les pièges : « as fast than » (than est réservé aux comparatifs -er/more) : « so...as » n'existe qu'en négation : l'égalité sert partout : comparaisons physiques (<i>as tall as</i>), prix (<i>as expensive as</i>), quantités (<i>as much as</i>) : en expression, une phrase as...as par paragraphe enrichit le style — et l'examen adore la tester.</div>"},
{"t": "Comparatif et superlatif (Anglais — Collège)", "q": "« It's ___ city in the country. » (the + superlatif de large)", "c": ["the most large", "the largest", "the larger", "largest"], "a": 1, "e": "large → the largest (adjectif court, e finale : on ajoute seulement -st).", "d": "<b>The + adjectif court + est</b>.<div class='ex-detail'><u>Exemple rédigé</u> : large finit par un e → superlatif : larg<b>est</b> (pas « largeest ») : <i>It's <b>the largest</b> city in the country.</i> : les règles du e : large → larger → the largest ; nice → nicer → the nicest ; safe → safer → the safest : le superlatif prend TOUJOURS <b>the</b> (le la plus...) : sans the, « largest city » serait une simple description sans superlatif : la double vérification (the + forme en -est/most) est le réflexe qui sécurise la question.</div>"},
{"t": "Comparatif et superlatif (Anglais — Collège)", "q": "Quelle phrase est correcte ?", "c": ["This book is best than that one.", "This book is more better than that one.", "This book is more good than that one.", "This book is better than that one."], "a": 3, "e": "better est DÉJÀ le comparatif de good : pas de more devant (double marquage interdit).", "d": "<b>Never double</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « more better » cumule les deux marques de comparatif (more + -er) — une faute classique : la règle : UN seul marquage par comparaison : court → -er ; long → more ; irrégulier → sa forme propre (better, worse, further) : <i>This book is <b>better than</b> that one.</i> : les trois distracteurs illustrent les trois fautes types : double marquage, régularisation d'un irrégulier (more good), superlatif sans the ni contexte : savoir EXPLIQUER pourquoi les autres sont fausses vaut mieux que deviner — c'est la démarche du correcteur.</div>"},
{"t": "Comparatif et superlatif (Anglais — Collège)", "q": "Le comparatif de « bad » :", "c": ["more bad", "worse", "badder", "worst"], "a": 1, "e": "bad → worse (comparatif) → the worst (superlatif) : irrégulier.", "d": "<b>Bad a son propre comparatif</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la famille complète : <b>bad → worse → the worst</b> : <i>The weather today is <b>worse than</b> yesterday. / It was <b>the worst</b> film of the year.</i> : attention à la prononciation de worse (/wɜːrs/) et au piège du français « pire » : « badder » n'existe pas plus que « gooder » : ces deux irréguliers (good/bad) sont les plus utilisés de la langue — donc les plus testés : les mémoriser en paire (better/worse) crée un réflexe durable pour toutes les rédactions comparatives.</div>"},
{"t": "Comparatif et superlatif (Anglais — Collège)", "q": "« The streets are getting ___ and ___. » (de plus en plus dangereuses)", "c": ["more dangerous / more dangerous", "dangerouser / dangerouser", "most dangerous / most dangerous", "dangerous / dangerouser"], "a": 0, "e": "Adjectif long : la structure progressive est more and more + adjectif : more and more dangerous.", "d": "<b>De plus en plus : more and more + adjectif long</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la structure progressive : adjectif court → <i>bigger and bigger</i> : adjectif long → <b>more and more</b> + adjectif (le more se répète) : <i>The streets are getting <b>more and more dangerous</b>.</i> : la logique : la comparaison « de plus en plus » répète le marquage : -er...-er (courts) ou more and more (longs) : la faute « dangerouser » cumule toutes les erreurs (adjectif long + -er irrégulier + double marque) : la structure « more and more » est très fréquente en expression (évolutions : villes, technologies, environnement) — parfaite pour impressionner à l'écrit du brevet.</div>"},
{"t": "Le futur : will et be going to (Anglais — Collège)", "q": "« The phone is ringing — I ___ answer it. » (décision immédiate)", "c": ["answer", "am going to", "am answering", "will"], "a": 3, "e": "Décision prise AU MOMENT de parler → will (I'll answer).", "d": "<b>La décision éclair</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le téléphone sonne MAINTENANT : la décision de répondre vient d'être prise, spontanée → <b>will</b> : <i>The phone is ringing — <b>I'll</b> answer it.</i> : si la phrase était « I decided yesterday to answer phones at reception » → going to (projet antérieur) : le critère temporel est la clé : la décision est-elle ANTERIEURE (going to) ou ACTUELLE (will) ? : ce contraste est LA question type du chapitre — les examens adorent le téléphone qui sonne et le gâteau à apporter (I'll bring a cake — je viens de le décider !).</div>"},
{"t": "Le futur : will et be going to (Anglais — Collège)", "q": "« We ___ visit Spain this summer. We booked the tickets in March. »", "c": ["won't", "are going to", "will", "go to"], "a": 1, "e": "Projet décidé AVANT (billets achetés) → be going to.", "d": "<b>Le projet préparé d'avance</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « We booked the tickets in March » prouve la décision ANTÉRIEURE → <b>are going to</b> : <i>We <b>are going to</b> visit Spain this summer.</i> : la forme complète le contexte : la décision date de mars, l'action est planifiée : will exprimerait une décision nouvelle (ou une prédiction), en contradiction avec les faits : en expression écrite, going to + un détail de préparation (tickets, réservation, budget) rend le futur crédible et naturel — un marqueur de « vrai » anglais.</div>"},
{"t": "Le futur : will et be going to (Anglais — Collège)", "q": "« Look at those black clouds! It ___ rain. »", "c": ["shall", "rains", "will", "is going to"], "a": 3, "e": "Prédiction fondée sur un indice VISIBLE (les nuages) → be going to.", "d": "<b>Le futur qu'on voit venir</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les nuages noirs sont la PREUVE immédiate → <b>is going to</b> : <i>Look at those black clouds! It <b>is going to</b> rain.</i> : la nuance avec will : <i>I think it will rain tomorrow</i> (opinion, aucun indice visible — je prédis) : le test : peux-ti POINTER un indice (nuages, valises, visage en colère) ? → going to : est-ce une opinion/intuition ? → will : cette distinction « prédiction fondée vs opinion » est fine mais très testée — elle distingue un anglais scolaire d'un anglais vécu.</div>"},
{"t": "Le futur : will et be going to (Anglais — Collège)", "q": "La forme négative de « I will come » :", "c": ["I am not will come", "I willn't come", "I don't will come", "I won't come"], "a": 3, "e": "will not → won't (contraction irrégulière, sans apostrophe après wo).", "d": "<b>Won't, le contracté capricieux</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la négation de will : <b>will not → won't</b> (l'orthographe change : wo + n't) : <i>I <b>won't</b> come.</i> : les impossibles : « willn't » (la contraction est irrégulière), « don't will » (will est un modal : négation directe, pas de do) : la même logique pour shall → shan't (rare) et can → can't : mémoriser won't une fois pour toutes — il apparaît dans CHAQUE contrôle de futur, et son orthographe (pas d'apostrophe fantôme) est un détail qui se vérifie à l'écrit.</div>"},
{"t": "Le futur : will et be going to (Anglais — Collège)", "q": "« I ___ help you with your bags. » (offre spontanée)", "c": ["will", "am helping", "help", "am going to"], "a": 0, "e": "Offre spontanée (décision du moment) → will : I'll help you.", "d": "<b>La main tendue du moment</b>.<div class='ex-detail'><u>Exemple rédigé</u> : tu vois quelqu'un qui peine avec ses sacs : tu proposes MAINTENANT → <b>will</b> : <i>I<b>'ll</b> help you with your bags.</i> : c'est le même mécanisme que la décision spontanée — l'offre est une décision instantanée de service : going to impliquerait que tu avais PRÉVU d'aider (bizarre !) : les offres (I'll carry, I'll show you, I'll get it) sont omniprésentes dans les dialogues d'examen : le réflexe « offre spontanée → 'll » rend l'oral immédiatement plus naturel.</div>"},
{"t": "Le futur : will et be going to (Anglais — Collège)", "q": "« She ___ 15 next month. » (futur simple, certitude du calendrier)", "c": ["is going to being", "will be", "is being", "wills be"], "a": 1, "e": "will + base : she will be — will ne prend jamais de -s et le verbe reste à la base.", "d": "<b>Le futur factuel</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'anniversaire est un fait calendrier : la prédiction est certaine → <b>will be</b> : <i>She <b>will be</b> 15 next month.</i> : les impossibles : « wills » (jamais de -s sur un modal), « is going to being » (going to est suivi de la BASE, jamais du -ing), « is being » (présent continu, sans sens futur ici) : remarque : « She is going to be 15 » serait AUSSI correct (going to convient aux événements certains) — mais la question teste la FORME de will : la mécanique (modal + base) est le cœur de la réponse.</div>"},
{"t": "Le futur : will et be going to (Anglais — Collège)", "q": "La question correcte au futur avec going to :", "c": ["Are you going to travel?", "You are going to travel?", "Will you going to travel?", "Do you going to travel?"], "a": 0, "e": "going to contient déjà l'auxiliaire be : la question se forme par inversion de ce be : Are you going to travel?", "d": "<b>Inverser le be de going to</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la structure going to contient déjà l'auxiliaire <b>be</b> (am/is/are) : la question inverse ce be : <i><b>Are</b> you <b>going to</b> travel?</i> : la négation aussi : <i>I'm not going to travel.</i> : les impossibles : « Do you going » (do n'entre pas dans going to), « Will you going » (will + going to ne se combinent pas — on choisit l'un OU l'autre) : la question Are you going to...? est l'une des plus utiles de l'anglais (projets de vacances, d'orientation) — la maîtriser ouvre tous les dialogues du brevet.</div>"},
{"t": "Le futur : will et be going to (Anglais — Collège)", "q": "« Shall we go to the cinema? » exprime :", "c": ["une obligation", "le passé", "une suggestion (proposition à l'interlocuteur)", "une interdiction"], "a": 2, "e": "shall + we = suggestion (« et si on allait...? »), surtout en anglais britannique.", "d": "<b>Shall we : la proposition à deux</b>.<div class='ex-detail'><u>Exemple rédigé</u> : shall ne sert quasiment plus qu'à la 1re personne du pluriel pour PROPOSER : <i><b>Shall we</b> go to the cinema? / <b>Shall I</b> open the window?</i> (offre de faire quelque chose) : la réponse typique : <i>Yes, let's go!</i> : les autres emplois de shall sont littéraires ou juridiques (legal shall) : au collège, retenir la formule Shall we...? / Shall I...? comme « marque de politesse élégante » : dans un dialogue d'examen, une suggestion avec Shall we? fait immédiatement « locuteur avancé » — un petit plus qui rapporte.</div>"},
{"t": "Le futur : will et be going to (Anglais — Collège)", "q": "« The train ___ at 8:45 tomorrow morning. » (horaire officiel)", "c": ["is leaving", "going to leave", "will leave", "leaves"], "a": 3, "e": "Programme officiel (train, avion, cinéma) → present simple : the train leaves at 8:45.", "d": "<b>Le futur des horaires</b>.<div class='ex-detail'><u>Exemple rédigé</u> : règle surprenante mais solide : les HORAIRES officiels (trains, vols, séances) se disent au present simple : <i>The train <b>leaves</b> at 8:45 tomorrow morning.</i> : la logique : l'horaire est un FAIT établi, comme une loi : on dit aussi <i>The film starts at 9 p.m.</i> : le present continuous (is leaving) exprimerait un arrangement personnel, will une prédiction — l'horaire est plus « froid » : le trio futur (will / going to / présent simple horaire) donne trois nuances d'engagement : la maîtrise de la nuance « horaire → présent simple » est un détail de niveau lycée qui impressionne.</div>"},
{"t": "Le futur : will et be going to (Anglais — Collège)", "q": "Quelle phrase est incorrecte ?", "c": ["I'll call you tonight.", "I am going to call you tonight.", "I will call you tonight.", "I am going call you tonight."], "a": 3, "e": "going to exige TO + base : « going call » est incomplet.", "d": "<b>Le to qu'on oublie</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la structure est figée : be + <b>going to</b> + base : <i>I am going <b>to</b> call you.</i> : la faute « I am going call » perd le « to » (calque du français « je vais appeler » — qui n'a pas de « à » !) : les trois autres phrases sont correctes et signifient presque la même chose (nuance : 'll = décision/opinion du moment ; going to = projet) : à l'oral, la contraction « gonna » (going to) existe mais reste familière — à l'écrit, toujours « going to » complet : ce petit « to » est la faute la plus fréquente des rédactions : le vérifier systématiquement coûte une seconde.</div>"},
{"t": "Le present perfect : expérience et résultat (Anglais — Lycée)", "q": "Choisis : « I ___ my keys — I can't open the door! »", "c": ["have lost", "lost", "am losing", "was losing"], "a": 0, "e": "Résultat présent (je ne peux pas ouvrir MAINTENANT) → present perfect : have lost.", "d": "<b>Le passé qui déborde sur le présent</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'action (perdre les clés) est passée, mais sa CONSÉQUENCE est actuelle : « I can't open the door! » — le lien avec maintenant impose le present perfect : <i>I <b>have lost</b> my keys.</i> : le past simple (<i>I lost my keys</i>) serait correct seulement avec un contexte daté et détaché (hier, sans lien) : le test du chapitre : « est-ce que ça compte MAINTENANT ? » → have + p.p. : cette nuance est LE point de bascule entre un anglais de collège et un anglais de lycée — elle est testée dans chaque contrôle.</div>"},
{"t": "Le present perfect : expérience et résultat (Anglais — Lycée)", "q": "« ___ you ever ___ to New York? »", "c": ["Did / go", "Do / been", "Have / went", "Have / been"], "a": 3, "e": "Expérience de vie (ever) → Have you ever been (past participle de go) ?", "d": "<b>Ever, le chasseur d'expériences</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « ever » demande si l'expérience existe (oui/non), sans date → present perfect : <i><b>Have</b> you ever <b>been</b> to New York?</i> : participe de go → <b>been</b> (pas « went », qui est le past simple — jamais après have) : la réponse : <i>Yes, I have. / No, I never have. / No, I haven't.</i> : la structure Have you ever + p.p. est LA question-batterie des interviews orales du lycée (voyages, films, sports) — la maîtriser vaut tous les points du dialogue.</div>"},
{"t": "Le present perfect : expérience et résultat (Anglais — Lycée)", "q": "« We have known each other ___ 2015. »", "c": ["from", "since", "during", "for"], "a": 1, "e": "since + point de départ (2015) ; for + durée (ten years).", "d": "<b>Since le pointu, for le long</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « 2015 » est un POINT de départ (une date) → <b>since</b> : <i>We have known each other <b>since</b> 2015.</i> : la répartition : since + date/événement (since Monday, since I was born) ; for + durée (for three years, for ages) : le piège du français : « depuis trois ans » → <i>for three years</i> (durée !) — le « depuis » français masque la nature du complément : le réflexe : je peux dire « depuis le.../depuis que » → since ; « depuis X ans » → for : la paire since/for est probablement la question la plus fréquente du chapitre.</div>"},
{"t": "Le present perfect : expérience et résultat (Anglais — Lycée)", "q": "« She has ___ left — the door is still warm. » (elle vient de partir)", "c": ["since", "just", "yet", "ever"], "a": 1, "e": "just = « venir de » : she has just left (action toute récente).", "d": "<b>Just, l'instantané</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « just » (entre have et le participe) marque l'action immédiatement antérieure : <i>She has <b>just</b> left.</i> (elle vient tout juste de partir) : les autres : « yet » (questions/négations : has she left yet?), « since » (point de départ), « ever » (expérience) : la place de just est fixe : have + just + p.p. — jamais « just have left » ✗ : en hotline anglaise (« I've just arrived, I've just eaten »), ce present perfect « chaud » est omniprésent à l'oral du bac : un réflexe simple, un effet naturel immédiat.</div>"},
{"t": "Le present perfect : expérience et résultat (Anglais — Lycée)", "q": "« I ___ in Lyon since I was born. »", "c": ["live", "have lived", "lived", "am living"], "a": 1, "e": "Situation commencée dans le passé et TOUJOURS vraie (since) → present perfect : have lived.", "d": "<b>L'inachevé qui dure</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « since I was born » = la situation a commencé au passé et CONTINUE maintenant : le present perfect est le temps des situations qui DURENT : <i>I <b>have lived</b> in Lyon since I was born.</i> (et j'y vis toujours) : le présent simple (<i>I live</i>) décrirait un état sans lien au passé ; le past simple (<i>I lived</i>) impliquerait que c'est FINI : le sens de « since » est le signal : point de départ + durée jusqu'à maintenant → have + p.p. : cette structure (since + sujet + past simple dans la subordonnée) est un grand classique de l'expression écrite.</div>"},
{"t": "Le present perfect : expérience et résultat (Anglais — Lycée)", "q": "« Have you finished your essay ___? »", "c": ["yet", "ever", "just", "already"], "a": 0, "e": "yet = « déjà » en question (ou « pas encore » en négation) : Have you finished yet?", "d": "<b>Yet, l'homme des questions</b>.<div class='ex-detail'><u>Exemple rédigé</u> : répartition already/yet : <b>already</b> → affirmatif (<i>I have already finished</i>) ; <b>yet</b> → questions et négations (<i>Have you finished yet? / I haven't finished yet</i>) : la phrase est une question → <i>Have you finished your essay <b>yet</b>?</i> : « already » en question exprime l'étonnement (<i>Are you done ALREADY?</i> — déjà ? si vite !) — nuance expressive : la place : yet en FIN de phrase : already/yet sont les deux faces (affirmatif vs interrogatif/négatif) d'un même mot : un QCM favori des professeurs, chaque année.</div>"},
{"t": "Le present perfect : expérience et résultat (Anglais — Lycée)", "q": "Le past participle de « write » :", "c": ["writed", "wrote", "written", "writing"], "a": 2, "e": "write → wrote (past simple) → written (participe passé) : after have → written.", "d": "<b>Trois colonnes, trois vies</b>.<div class='ex-detail'><u>Exemple rédigé</u> : chaque verbe irrégulier a trois formes : write → <b>wrote</b> (past simple : <i>She wrote a letter yesterday</i>) → <b>written</b> (participe : <i>She has written three books</i>) : la confusion wrote/written est la faute type : « She has wrote » ✗ → <i>She has <b>written</b></i> ✓ : méthode : apprendre les irréguliers en колонne de trois (base — past — participe), toujours dans cet ordre, en familles (write-wrote-written, break-broke-broken, drive-drove-driven) : le present perfect rend la 3e colonne indispensable — c'est LE chantier du lycée, 15 verbes par semaine suffisent.</div>"},
{"t": "Le present perfect : expérience et résultat (Anglais — Lycée)", "q": "Past simple ou present perfect : « I ___ (see) that film last night. »", "c": ["have seen", "am seen", "saw", "have see"], "a": 2, "e": "« last night » = date précise, action détachée → past simple : saw.", "d": "<b>La date qui fait basculer</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le marqueur « last night » DATE l'action : elle est terminée et détachée du présent → <b>past simple</b> : <i>I <b>saw</b> that film last night.</i> : la comparaison : <i>I have seen that film</i> (expérience, sans date — je connais l'histoire) vs <i>I saw it last night</i> (quand ? hier) : le réflexe d'examen : chercher un marqueur daté (yesterday, last..., ago, in + année, when...) → past simple ; sinon, si le lien au présent existe → present perfect : la présence/absence d'une DATE est le critère le plus fiable du chapitre.</div>"},
{"t": "Le present perfect : expérience et résultat (Anglais — Lycée)", "q": "« He ___ his phone. » — Il l'a cassé (et il ne marche plus)", "c": ["breaks", "broke", "has broken", "is broken"], "a": 2, "e": "Résultat présent (le téléphone ne marche PLUS maintenant) → present perfect : has broken.", "d": "<b>La conséquence visible</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'action (casser) est passée, le résultat (téléphone hors service) est PRÉSENT : <i>He <b>has broken</b> his phone.</i> (regarde, il ne s'allume plus !) : la nuance : <i>He broke his phone</i> = récit neutre, daté ; <i>He has broken his phone</i> = l'incident importe MAINTENANT (c'est pour ça qu'il ne peut pas t'appeler) : le present perfect est le temps de l'actualité (breaking news : « The Queen has died » — l'info qui touche le moment) : cette « hot news » est une signature du registre journalistique et oral — parfaite pour le bac.</div>"},
{"t": "Le present perfect : expérience et résultat (Anglais — Lycée)", "q": "« I've lived in Paris ___ ten years » (et j'y vis toujours)", "c": ["since", "from", "during", "for"], "a": 3, "e": "ten years = DURÉE → for ten years (since exigerait un point de départ : since 2014).", "d": "<b>For compte, since pointe</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « ten years » est une DURÉE (combien de temps ?) → <b>for</b> : <i>I've lived in Paris <b>for</b> ten years.</i> : le réglage fin : since + moment (since 2014, since my childhood, since I arrived) ; for + mesure (for ten years, for a while, for ages) : l'astuce de secours : si on peut poser la question « How long? » et répondre par une mesure → for : la même phrase avec « since » serait : <i>I've lived in Paris since 2014</i> — les deux formes expriment la même situation, l'angle change : cette bascule for/since est LA question à un point garanti de chaque contrôle.</div>"},
{"t": "La voix passive (Anglais — Lycée)", "q": "Le passif de « Shakespeare wrote Hamlet » :", "c": ["Hamlet wrote by Shakespeare.", "Hamlet is written by Shakespeare.", "Hamlet was written by Shakespeare.", "Hamlet was wrote by Shakespeare."], "a": 2, "e": "Past simple actif → was + participe (written) : Hamlet was written by Shakespeare.", "d": "<b>La mécanique en trois gestes</b>.<div class='ex-detail'><u>Exemple rédigé</u> : (1) COD → sujet : Hamlet monte en tête : (2) be au temps de l'actif : wrote = past simple → <b>was</b> : (3) verbe au participe : write → <b>written</b> : <i>Hamlet <b>was written</b> by Shakespeare.</i> : les distracteurs illustrent les trois fautes types : « is written » (mauvais temps), « wrote » non conjugué (be oublié), « was wrote » (participe manquant) : la routine (COD → be/temps → p.p.) transforme chaque phrase active en passif en dix secondes — c'est un exercice à points faciles au bac.</div>"},
{"t": "La voix passive (Anglais — Lycée)", "q": "« The results ___ tomorrow. » (futur, announce)", "c": ["will be announced", "will announce", "will announced", "are announced"], "a": 0, "e": "Futur passif : will + be + participe : will be announced.", "d": "<b>Le futur passif : will + be + p.p.</b>.<div class='ex-detail'><u>Exemple rédigé</u> : futur → <b>will be</b> + participe : <i>The results <b>will be announced</b> tomorrow.</i> : la faute « will announced » oublie be (le passif ne peut pas exister sans lui) : « will announce » est l'actif (les résultats annoncent ? absurde — SAUF sens intransitif) : la structure figée : modal/will + be + p.p. (must be signed, can be seen, will be done) : au passif, « will » reste invariable, seul <b>be</b> porte la marque — la logique : will porte l'avenir, be porte le passif, le p.p. porte le sens : trois pièces, un seul moteur.</div>"},
{"t": "La voix passive (Anglais — Lycée)", "q": "« This bridge ___ in 1937. » (build, passif passé)", "c": ["is built", "was build", "has built", "was built"], "a": 3, "e": "Passé daté (1937) → was + participe : was built.", "d": "<b>Le passé passif daté</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « in 1937 » = passé → <b>was</b> ; build → <b>built</b> : <i>This bridge <b>was built</b> in 1937.</i> : la nuance : <i>This bridge was built in 1937</i> (passif récit) vs <i>They built this bridge in 1937</i> (actif — mais qui est « they » ?) : le passif élude l'agent inutile : le distracteur « was build » montre la faute type (participe oublié) : le passif au past simple (was/were + p.p.) est le PLUS fréquent à l'écrit historique (monuments, inventions, découvertes) — indispensable pour décrire un document au bac.</div>"},
{"t": "La voix passive (Anglais — Lycée)", "q": "Le passif présent de « They clean the room every day » :", "c": ["The room are cleaned every day.", "The room has cleaned every day.", "The room cleans every day.", "The room is cleaned every day."], "a": 3, "e": "Présent + sujet singulier → is + cleaned : The room is cleaned every day.", "d": "<b>Is ou are ? Le sujet décide</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le nouveau sujet « the room » est SINGULIER → <b>is cleaned</b> : <i>The room <b>is cleaned</b> every day.</i> : la faute « are cleaned » vient de la mémoire de l'actif (« they » pluriel) — or au passif, l'accord se fait avec le NOUVEAU sujet : si le COD avait été « the rooms » : <i>The rooms <b>are</b> cleaned</i> : l'accord be/sujet est la seule flexion du passif présent — mais elle est systématique : la vérifier à chaque phrase (singulier → is ; pluriel → are) règle le point d'un coup.</div>"},
{"t": "La voix passive (Anglais — Lycée)", "q": "« He ___ just ___ by the police. » (arrêter, present perfect)", "c": ["was / arrested", "has / arrested", "is / been arrested", "has / been arrested"], "a": 3, "e": "Present perfect passif : has been + p.p. : He has just been arrested.", "d": "<b>Le passif perfect : has been + p.p.</b>.<div class='ex-detail'><u>Exemple rédigé</u> : present perfect → have/has + <b>been</b> + participe : <i>He <b>has just been arrested</b> by the police.</i> : la chaîne complète : has (perfect) + been (be au p.p.) + arrested (verbe au p.p.) — deux participes qui se suivent, c'est le sommet technique du chapitre : la logique : le passif insère TOUJOURS be entre l'auxiliaire et le verbe : have + been + done, will + be + done, must + be + done : la hot news policière (« Two men have been arrested ») est un genre journalistique complet — la BBC l'utilise des dizaines de fois par jour.</div>"},
{"t": "La voix passive (Anglais — Lycée)", "q": "« The road ___ at the moment. » (repair, présent continu)", "c": ["repairs", "is repairing", "is repaired", "is being repaired"], "a": 3, "e": "Présent continu passif : is being + p.p. : is being repaired (l'action est en cours MAIS le sujet subit).", "d": "<b>Being, la pièce rare</b>.<div class='ex-detail'><u>Exemple rédigé</u> : présent continu passif : be + <b>being</b> + p.p. : <i>The road <b>is being repaired</b> at the moment.</i> : « is repaired » (présent simple) serait habituel/répété ; « is being repaired » = ÇA SE PASSE MAINTENANT : la forme « being » est la plus technique du passif (rare, donc distinguée) : la même au passé : <i>The road was being repaired when I passed.</i> : repérer « at the moment / right now » + sens passif → être + being + p.p. : un détail qui signe un excellent niveau à l'écrit du bac.</div>"},
{"t": "La voix passive (Anglais — Lycée)", "q": "Le complément d'agent « by the police » est omis quand :", "c": ["la phrase est au passé", "le verbe est irrégulier", "la police est inconnue ou évidente dans le contexte", "on parle à la première personne"], "a": 2, "e": "L'agent s'omet s'il est inconnu, évident ou sans importance — c'est souvent toute la RAISON d'employer le passif.", "d": "<b>By, l'invité facultatif</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>The thief was arrested (by the police — évident, pourquoi le dire ?)</i> : <i>Mistakes were made</i> (par qui ? silence diplomatique) : <i>My wallet was stolen</i> (par un inconnu) : l'agent n'apparaît que s'il apporte une VRAIE information : <i>Hamlet was written by Shakespeare</i> (l'agent EST l'information) : comprendre cette logique (le passif gère le focus de la phrase) fait passer la grammaire au style : au bac, employer le passif à bon escient (agent omis) dans le compte-rendu d'un document montre une maîtrise fine — pas une simple transformation mécanique.</div>"},
{"t": "La voix passive (Anglais — Lycée)", "q": "« Applications ___ before June 30. » (must + send, passif)", "c": ["must send", "must are sent", "must sent", "must be sent"], "a": 3, "e": "Modal + be + p.p. : Applications must be sent before June 30.", "d": "<b>Le modal passif des règlements</b>.<div class='ex-detail'><u>Exemple rédigé</u> : structure : modal (<b>must</b>) + <b>be</b> + participe (<b>sent</b>) : <i>Applications <b>must be sent</b> before June 30.</i> : la même famille : <i>Forms can be downloaded online. ID must be shown. Results will be published in July.</i> : ce passif « administratif » est le langage des consignes officielles (candidatures, examens, procédures) — très fréquent dans les documents du bac (brochures, sites officiels) : la faute « must sent » (be oublié) est la plus courante : la routine modal + BE + p.p. sécurise toutes les consignes.</div>"},
{"t": "La voix passive (Anglais — Lycée)", "q": "Quel énoncé justifie le mieux le passif ?", "c": ["Quand on veut insister sur l'agent du procès.", "Quand le verbe est au présent.", "Quand l'agent est inconnu ou sans importance (ex : My bike has been stolen).", "Quand la phrase est affirmative."], "a": 2, "e": "L'agent s'omet s'il est inconnu, évident ou sans importance — c'est souvent la raison même du passif.", "d": "<b>Le passif, choix de communication</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>My bike has been stolen</i> — je ne sais PAS par qui (et c'est accessoire : ce qui compte, c'est le vélo) : le passif centre l'attention sur ce qui SUBIT (le vélo, les résultats, la décision) : les emplois typiques : actualité (<i>A man has been arrested</i>), science (<i>The solution is heated</i> — protocole, pas de scientifique nommé), règles (<i>Smoking is not allowed</i>) : l'inverse : raconter une histoire avec un héros → actif : savoir choisir actif/passif selon le FOCUS est une compétence de rédacteur — les copies de bac qui le maîtrisent se détachent immédiatement.</div>"},
{"t": "La voix passive (Anglais — Lycée)", "q": "« She got promoted last month » — « got » au passif signifie :", "c": ["l'actif", "le present perfect", "une erreur grammaticale", "le passif familier (get + p.p.), courant à l'oral : « elle a été promue »"], "a": 3, "e": "get + participe passé = passif familier : get promoted, get hurt, get lost — registre oral.", "d": "<b>Get, le passif décontracté</b>.<div class='ex-detail'><u>Exemple rédigé</u> : <i>She <b>got promoted</b> last month.</i> = she was promoted (mais registre oral, familier) : la famille : get hurt (se blesser), get lost (se perdre), get married (se marier), get paid (être payé), get stolen : nuances : <b>be</b> passif = état/résultat formel ; <b>get</b> = événement, changement, registre parlé : à l'écrit du bac, préférer be + p.p. ; à l'oral (compréhension de films, séries), get + p.p. est partout : la reconnaître évite le malentendu : « I got fired » = « on m'a viré » — pas « j'ai viré » ! : connaître le duo be/get passif, c'est comprendre l'anglais réel.</div>"},
{"t": "Les pronoms relatifs : who, which, that (Anglais — Lycée)", "q": "« She is the singer ___ won the prize. »", "c": ["whose", "which", "where", "who"], "a": 3, "e": "singer = personne + relatif SUJET (verbe won suit directement) → who.", "d": "<b>Personne + sujet → who</b>.<div class='ex-detail'><u>Exemple rédigé</u> : double vérification : (1) l'antécédent « the singer » est une PERSONNE → who (pas which, réservé aux choses) : (2) après le relatif vient directement le verbe « won » (sans autre sujet) → le relatif est SUJET → pas d'omission possible : <i>She is the singer <b>who</b> won the prize.</i> : la méthode du chapitre : nature de l'antécédent (personne/chose/lieu/possession) + fonction (sujet/complément) : deux questions, une réponse certaine — c'est l'exercice de fusion favori du bac.</div>"},
{"t": "Les pronoms relatifs : who, which, that (Anglais — Lycée)", "q": "« The book ___ I borrowed was fascinating. » (complément)", "c": ["who", "which", "where", "whose"], "a": 1, "e": "book = chose → which (ou that, ou omission : The book I borrowed).", "d": "<b>Chose + complément → which/that/ø</b>.<div class='ex-detail'><u>Exemple rédigé</u> : (1) antécédent : « the book » = CHOSE → which/that : (2) après le relatif : « I borrowed » — il y a un sujet (I) → le relatif est COMPLÉMENT → omission AUTORISÉE : <i>The book (which/that) I borrowed was fascinating.</i> = <i>The book I borrowed was fascinating.</i> : le test « que reste-t-il après le relatif ? » (un verbe nu = sujet ; un groupe nominal = complément) est infaillible : la même analyse s'applique aux personnes : <i>The man (that) I met</i> — complément, omission possible.</div>"},
{"t": "Les pronoms relatifs : who, which, that (Anglais — Lycée)", "q": "« This is the town ___ I was born. »", "c": ["when", "where", "which", "who"], "a": 1, "e": "town = LIEU → where : This is the town where I was born.", "d": "<b>Where, le relatif des lieux</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'antécédent « the town » est un LIEU, et la subordonnée « I was born (there) » y situe l'action → <b>where</b> : <i>This is the town <b>where</b> I was born.</i> : nuance : « which » conviendrait si le lieu était OBJET du verbe : <i>The town which I visited</i> (je visite la ville — COD) vs <i>the town where I was born</i> (je naïs DANS la ville) : le test : peut-on dire « born there / born IN it » ? « in it » → where ; « it » direct → which : la paire where/which est une nuance de complément (lieu de l'action vs objet de l'action) — question d'examen régulière au lycée.</div>"},
{"t": "Les pronoms relatifs : who, which, that (Anglais — Lycée)", "q": "« I met a girl ___ brother is in my class. »", "c": ["whose", "who's", "who", "which"], "a": 0, "e": "Possession (LE frère de la fille) → whose : whose brother.", "d": "<b>Whose, le relatif du possessif</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « le frère DE la fille » — relation de possession → <b>whose</b> : <i>I met a girl <b>whose</b> brother is in my class.</i> : whose sert aussi pour les choses : <i>a house whose roof is red</i> : le piège orthographique : « who's » = who IS ou who HAS (contraction) — jamais le possessif ! : le test mental : si on peut dire « whose = dont/lequel le » → whose : la possession par un relatif est un point de style élégant en expression écrite — qui remplace avantageusement « the brother of a girl I met » (lourd).</div>"},
{"t": "Les pronoms relatifs : who, which, that (Anglais — Lycée)", "q": "« He passed his exam, ___ surprised everyone. »", "c": ["who", "which", "that", "what"], "a": 1, "e": "Which peut reprendre toute une proposition (après une virgule) : ..., which surprised everyone.", "d": "<b>Which, le repreneur d'idées</b>.<div class='ex-detail'><u>Exemple rédigé</u> : ici « which » ne reprend pas un mot mais TOUTE LA PROPOSITION (« il a réussi son examen ») : <i>He passed his exam, <b>which</b> surprised everyone.</i> (ce qui a surpris tout le monde, c'est LE FAIT) : la virgule + which = l'anglais des commentaires et des articles : <i>He arrived an hour late, which was typical of him.</i> : la règle : en explicative, who pour les personnes, which pour les choses ET pour les propositions : jamais « what » (relatif inexistant en anglais moderne dans ce rôle) : ce « which propositionnel » est une signature d'écriture mature — appréciée dans les essays.</div>"},
{"t": "Les pronoms relatifs : who, which, that (Anglais — Lycée)", "q": "« My brother, ___ lives in Rome, is a doctor. » (relative entre virgules)", "c": ["who", "where", "that", "which"], "a": 0, "e": "Relative explicative (entre virgules) → JAMAIS that : who (personne). L'omission est aussi impossible.", "d": "<b>La virgule qui interdit that</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la relative est entre virgules = EXPLICATIVE (supplément d'information : j'ai un frère, il habite Rome) : en explicative, <b>that est interdit</b> : <i>My brother, <b>who</b> lives in Rome, is a doctor.</i> : ni omission possible, ni that : la nuance de sens : SANS virgule (<i>My brother who lives in Rome</i>) = déterminative — je précise QUEL frère (j'en ai plusieurs) : la virgule n'est pas un détail typographique : elle change l'information : maîtriser déterminative/explicative, c'est écrire juste — les correcteurs du bac y sont très sensibles.</div>"},
{"t": "Les pronoms relatifs : who, which, that (Anglais — Lycée)", "q": "« The colleague with ___ I worked has been promoted. » (registre formel)", "c": ["which", "whom", "that", "who"], "a": 1, "e": "Après une préposition en style soutenu → whom : with whom I worked.", "d": "<b>Whom, l'invité des réceptions</b>.<div class='ex-detail'><u>Exemple rédigé</u> : préposition + relatif complément → <b>whom</b> pour les personnes en registre formel : <i>The colleague with <b>whom</b> I worked has been promoted.</i> : à l'oral courant, l'anglais moderne déplace la préposition : <i>The colleague I worked with...</i> (préposition en fin, whom omis) : la hiérarchie des registres : formel écrit (with whom) / neutre (that... with) / parlé (ø... with) : au bac, « with whom » dans une reformulation marque le registre soutenu : connaître les trois variantes permet de choisir son niveau de langue — et de comprendre tous les documents.</div>"},
{"t": "Les pronoms relatifs : who, which, that (Anglais — Lycée)", "q": "Quelle phrase contient une erreur ?", "c": ["2010 was the year when everything changed.", "The book that I bought is excellent.", "The woman that I saw her was very kind.", "The man who called you is my uncle."], "a": 2, "e": "« The woman that I saw HER » : doublon ! Le relatif remplace le pronom — « that I saw » suffit.", "d": "<b>Le doublon, faute signature</b>.<div class='ex-detail'><u>Exemple rédigé</u> : en français : « la femme que je l'ai vue » — l'anglais fait la même erreur quand on traduit mot à mot : le relatif (that) EST le complément (l'accusatif) : le pronom her est UN TROP : <i>The woman (that) I <b>saw</b> was very kind.</i> (sans her) : la cause : le français garde « que » ET « la » (double marquage accepté) ; l'anglais n'accepte QU'UNE trace du complément : chasser le doublon est LE réflexe de relecture du chapitre : dans une copie, cette faute saute aux yeux du correcteur — la vérifier avant de rendre (chercher : relatif + him/her/them dans la même subordonnée).</div>"},
{"t": "Les pronoms relatifs : who, which, that (Anglais — Lycée)", "q": "Dans « The students who study hard will pass », le pronom peut être remplacé par :", "c": ["which", "whose", "whom", "that"], "a": 3, "e": "Relative déterminative (pas de virgule) : that peut remplacer who → The students that study hard.", "d": "<b>That, le joker — sauf entre virgules</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la relative est DÉTERMINATIVE (aucune virgule, information essentielle) → <b>that</b> est admis pour les personnes comme pour les choses : <i>The students <b>that</b> study hard will pass.</i> : les restrictions de that : interdit en explicative (virgules), impossible après préposition (*with that), pas d'omission quand sujet : le choix stylistique : that est neutre, who/which plus précis : certains professeurs préfèrent who/which pour les personnes — les deux sont grammaticalement corrects en déterminative : connaître les DEUX registres (that familier/écrit, who/which précis) permet de varier le style.</div>"},
{"t": "Les pronoms relatifs : who, which, that (Anglais — Lycée)", "q": "« I remember the day ___ we first met. »", "c": ["who", "when", "which", "where"], "a": 1, "e": "the day = MOMENT → when : the day when we first met.", "d": "<b>When, le relatif du temps</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'antécédent « the day » est un MOMENT temporel, et la subordonnée y situe l'événement → <b>when</b> : <i>I remember the day <b>when</b> we first met.</i> : les partenaires : the year when, the time when, the moment when, the era when : nuance : where pour les LIEUX, when pour les MOMENTS — l'erreur classique : « the day where » (calque du français « le jour où » !) : la traduction trompeuse : français « où » couvre lieu ET temps ; anglais : DEUX mots (where/when) : ce calque est la faute la plus fréquente des francophones — la corriger vaut un point quasi certain à chaque contrôle.</div>"},
{"t": "Les conditionnels : if et hypothèses (Anglais — Lycée)", "q": "« If it ___ tomorrow, we will cancel the picnic. »", "c": ["would rain", "rains", "will rain", "rained"], "a": 1, "e": "Type 1 (réel) : If + PRESENT simple — même pour l'avenir : if it rains (jamais will dans la if-clause).", "d": "<b>Le futur interdit après if</b>.<div class='ex-detail'><u>Exemple rédigé</u> : type 1 : condition réelle → If + <b>présent</b>, will dans la principale : <i>If it <b>rains</b> tomorrow, we will cancel the picnic.</i> : la règle choque les francophones (« s'il pleuvra » ✗) : le sens futur est porté par la principale, la subordonnée reste au présent — avec « tomorrow » inclus ! : l'exception rare : will dans if = VOLONTÉ (<i>If you will sign here</i> = si vous voulez bien signer) : la faute « if it will rain » est la plus fréquente du chapitre — la corriger vaut un point d'office à chaque contrôle de conditionnel.</div>"},
{"t": "Les conditionnels : if et hypothèses (Anglais — Lycée)", "q": "« If I were you, I ___ apologise. » (conseil)", "c": ["had", "am going to", "will", "would"], "a": 3, "e": "Type 2 (irréel) : would + base dans la principale : I would apologise.", "d": "<b>Le conseil imaginaire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « si j'étais toi » — irréel : je ne le suis pas → type 2 : If + past (were), <b>would</b> + base : <i>If I were you, I <b>would</b> apologise.</i> (à ta place, je m'excuserais) : la formule « If I were you, I would... » est LE conseil standard de l'anglais (aussi : I'd apologise if I were you) : le past simple dans if n'est PAS un passé chronologique : c'est un marqueur d'IRRÉALITÉ (distancing) : le français traduit par conditionnel (« je m'excuserais »), l'anglais par past dans if + would ailleurs — une asymétrie totale qui exige de sortir de la traduction mot à mot.</div>"},
{"t": "Les conditionnels : if et hypothèses (Anglais — Lycée)", "q": "« If she had studied, she ___ passed the exam. » (regret)", "c": ["will have", "would", "would have", "had"], "a": 2, "e": "Type 3 : If + had + p.p. → would have + p.p. : she would have passed.", "d": "<b>Le passé qu'on refait par la pensée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « had studied » = past perfect dans la if-clause → type 3 (regret sur le passé définitif) : la principale : <b>would have</b> + participe : <i>If she had studied, she <b>would have passed</b> the exam.</i> (elle n'a pas révisé, elle a échoué — trop tard) : la structure figée : If + had + p.p. / would have + p.p. : les reproches en anglais vivent sur ce type (<i>If you had listened to me!</i>) : la faute type : mélanger les temps (<i>she would pass</i> ✗ — ce serait le type mixte avec « now ») : le type 3 est le plus testé au bac — sa mécanique se mémorise en une récitation.</div>"},
{"t": "Les conditionnels : if et hypothèses (Anglais — Lycée)", "q": "Dans « If I ___ you, I would call her », la forme écrite correcte :", "c": ["were", "am", "had been", "was"], "a": 0, "e": "Le subjonctif : If I WERE (toutes les personnes) à l'écrit et à l'examen ; « was » s'entend à l'oral.", "d": "<b>Were, le subjonctif qui détonne</b>.<div class='ex-detail'><u>Exemple rédigé</u> : en irréel du présent, be devient <b>were</b> pour TOUTES les personnes : <i>If I <b>were</b> you, I would call her.</i> — « If I was you » s'entend dans la bouche des natifs mais l'écrit d'examen exige were : l'origine : un subjonctif ancien (mode de l'irréel) figé dans la langue : la même logique : <i>If she were here, things would be different. / If there were no exams, life would be sweet.</i> (sans s au pluriel ! were, pas « were s' ») : au bac, « If I were » est LA forme attendue — l'écrire d'instinct est un marqueur de niveau immédiat.</div>"},
{"t": "Les conditionnels : if et hypothèses (Anglais — Lycée)", "q": "« ___ I known you were coming, I would have baked a cake. » (style soutenu, sans if)", "c": ["If", "Would", "Was", "Had"], "a": 3, "e": "Inversion formelle : Had I known = If I had known (type 3 soutenu).", "d": "<b>Had I known : le if qui s'efface</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'anglais soutenu peut OMETTRE if en inversant l'auxiliaire : <i><b>Had I known</b> you were coming, I would have baked a cake.</i> (= If I had known) : la famille : <b>Had</b> + sujet + p.p. (type 3), <b>Were</b> + sujet (type 2 : Were I you...), <b>Should</b> + sujet (type 1 formel : Should you need help, call me) : ce style « inversé » est fréquent dans la correspondance formelle (lettres, e-mails professionnels) : le reconnaître à la lecture est essentiel (le bac le met dans les documents) — l'employer à l'écrit est une touche d'excellence.</div>"},
{"t": "Les conditionnels : if et hypothèses (Anglais — Lycée)", "q": "« If we had more money, we ___ buy a bigger house. » (hypothèse irréelle présente)", "c": ["had", "will", "are going to", "would"], "a": 3, "e": "Type 2 : If + past simple → would + base : we would buy.", "d": "<b>L'irréel du présent</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « if we had more money » = nous n'en avons pas (irréel MAINTENANT) → type 2 : <i>If we had more money, we <b>would buy</b> a bigger house.</i> (nous achèterions) : le past simple (had) ne veut PAS dire « nous avions » : c'est le marqueur d'hypothèse : la traduction française (imparfait « avions » + conditionnel « achèterions ») ressemble par hasard à l'anglais pour la if-clause (imparfait ≈ past) — MAIS la principale diffère : conditionnel français = would + BASE (jamais de marque de temps) : la paire past/would est le moteur du type 2 : rêves, regrets doux, souhaits (<i>If dogs could talk...</i>).</div>"},
{"t": "Les conditionnels : if et hypothèses (Anglais — Lycée)", "q": "Quel type de conditionnel : « If you heat ice, it melts. » ?", "c": ["Type 1 (réel)", "Une erreur", "Type 3 (regret)", "Type 2 (imaginaire)"], "a": 0, "e": "Vérité générale : If + présent, présent dans les deux propositions (le « zéro conditionnel » — une variante du type 1).", "d": "<b>Le conditionnel des lois de la nature</b>.<div class='ex-detail'><u>Exemple rédigé</u> : ici pas de will : la phrase énonce une LOI TOUJOURS VRAIE (chauffez de la glace → elle fond, toujours) : le « type 0 » : If + présent, présent : <i>If you heat ice, it <b>melts</b>. / If the temperature drops below zero, water freezes.</i> : la même structure pour les instructions et les règles : <i>If the alarm rings, leave the building.</i> (à chaque fois que...) : la distinction : type 1 = un cas d'avenir précis (will) ; type 0 = une loi générale (présent/présent) : la science et les manuels adorent le type 0 — le reconnaître évite de « corriger » à tort une phrase déjà juste.</div>"},
{"t": "Les conditionnels : if et hypothèses (Anglais — Lycée)", "q": "Quelle phrase est correcte ?", "c": ["If I have known, I would come.", "If I would have known, I would have come.", "If I knew, I would have come.", "If I had known, I would have come."], "a": 3, "e": "Type 3 régulier : If + had + p.p., would have + p.p. — jamais « would » dans la if-clause.", "d": "<b>Le would de trop</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la faute « If I would have known » est le calque du français (« si j'aurais su » — faute déjà en français !) : la règle : would n'entre JAMAIS dans la if-clause : <i>If I <b>had known</b>, I <b>would have come</b>.</i> : les deux places sont étanches : had + p.p. dans if, would have + p.p. dans la principale : « If I have known » confond présent et passé ; « If I knew, I would have come » mixe les types (sans marqueur « now », la phrase est bancale) : l'orthographe du type 3 se récite : IF + HAD + p.p. / WOULD HAVE + p.p. — deux blocs, un seul sens : le regret.</div>"},
{"t": "Les conditionnels : if et hypothèses (Anglais — Lycée)", "q": "« If I had taken that job, I ___ in New York now. » (conditionnel mixte)", "c": ["had been", "would be", "will be", "would have been"], "a": 1, "e": "Mixte : condition passée (had taken) mais conséquence PRÉSENTE (now) → would + base : would be.", "d": "<b>Le mixte : passé dans if, présent après</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la condition est PASSÉE (<i>had taken</i> — le choix est fait, raté) mais la conséquence est ACTUELLE (« now ») : <i>If I had taken that job, I <b>would be</b> in New York now.</i> : la règle du mixte : If + past perfect / would + BASE + now : l'erreur type : « would have been » (type 3 pur — ignorerait le « now ») : la logique temporelle : la if-clause fixe le moment de la CAUSE, la principale le moment de l'EFFET — ils peuvent différer ! : le mixte est la structure la plus fine du chapitre — la maîtriser (« If you had slept, you wouldn't be tired now ») signe un excellent copiste au bac.</div>"},
{"t": "Les conditionnels : if et hypothèses (Anglais — Lycée)", "q": "« You will burn yourself if you ___ that pan. » (ordre des clauses)", "c": ["touched", "touch", "will touch", "would touch"], "a": 1, "e": "La if-clause garde le présent, même placée après la principale : if you touch.", "d": "<b>If en seconde position : même règle</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'ordre des propositions ne change RIEN : la if-clause garde le présent (<b>touch</b>), la principale garde will : <i>You will burn yourself if you <b>touch</b> that pan.</i> (avertissement réel, type 1) : la virgule devient inutile quand la principale vient en premier : la même logique pour tous les types : <i>I would help you if you asked. / She would have come if we had invited her.</i> : la faute type : mettre will « par symétrie » avec la première proposition — or le critère n'est pas la POSITION mais la FONCTION (dans if → présent/past/had) : la règle « jamais will après if » voyage avec la if-clause, où qu'elle soit.</div>"},
{"t": "Connecteurs et expression écrite (Anglais — Lycée)", "q": "« ___, social media can also be dangerous. » (introduire une opposition)", "c": ["Therefore", "Moreover", "For instance", "However"], "a": 3, "e": "However = opposition/contraste : « cependant » — moreover additionnerait, therefore conclurait.", "d": "<b>However, le pivot du texte argumenté</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la phrase oppose (« aussi » dangereux — on tourne) → <b>However</b> : <i><b>However,</b> social media can also be dangerous.</i> : la famille de l'opposition : however, nevertheless, on the other hand, in contrast — vs la famille de l'addition : moreover, furthermore, in addition : la méthode : demander « ma phrase continue (addition), tourne (opposition), prouve (exemple) ou déduit (conséquence) ? » : l'emploi de however en tête de paragraphe est LE geste structurel d'un essay : un correcteur qui voit However + virgule sait immédiatement que l'argumentation est pilotée.</div>"},
{"t": "Connecteurs et expression écrite (Anglais — Lycée)", "q": "« ___ the rain, we enjoyed our walk. »", "c": ["Despite", "Although", "However", "Because"], "a": 0, "e": "the rain = NOM → Despite + nom (although exigerait une phrase : although it rained).", "d": "<b>Nom ou phrase ? Le test décisif</b>.<div class='ex-detail'><u>Exemple rédigé</u> : après la case, « the rain » est un groupe NOMINAL (pas de verbe) → <b>Despite</b> : <i><b>Despite</b> the rain, we enjoyed our walk.</i> : la version avec although : <i><b>Although</b> it rained, we enjoyed our walk.</i> (sujet it + verbe rained) : la règle : although/even though + PHRASE ; despite/in spite of + NOM ou -ing (<i>despite being tired</i>) : les fautes types : « despite of » (of en trop !), « although the rain » (phrase attendue) : ce test (nom ? phrase ?) départage les deux familles de concession — c'est la question la plus rentable du chapitre.</div>"},
{"t": "Connecteurs et expression écrite (Anglais — Lycée)", "q": "« He didn't revise. ___, he failed the exam. » (conséquence)", "c": ["Although", "Therefore", "Moreover", "However"], "a": 1, "e": "La conséquence logique → Therefore (donc) : par conséquent.", "d": "<b>Therefore, la conséquence qui suit</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la seconde phrase DÉCOULE de la première (pas révisé → échec) → <b>Therefore</b> : <i>He didn't revise. <b>Therefore,</b> he failed the exam.</i> : la famille conséquence : therefore, so, consequently, as a result, thus : les distracteurs : moreover (addition — la phrase n'ajouterait pas, elle conclut), however (opposition — or il n'y a pas de contraste) : le test : peut-on remplacer par « donc/par conséquent » ? oui → therefore : en expression, la chaîne because → therefore structure un raisonnement impeccable — les correcteurs du bac valorisent la logique visible.</div>"},
{"t": "Connecteurs et expression écrite (Anglais — Lycée)", "q": "« She loves sports, ___ her brother prefers video games. »", "c": ["whereas", "because", "moreover", "therefore"], "a": 0, "e": "Contraste entre DEUX faits parallèles → whereas (tandis que, alors que).", "d": "<b>Whereas, le comparateur d'opposés</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la phrase met en parallèle deux préférences OPPOSÉES → <b>whereas</b> : <i>She loves sports, <b>whereas</b> her brother prefers video games.</i> (tandis que son frère...) : la nuance fine : whereas oppose deux réalités coexistantes (comparaison) ; however tourne l'argumentation (pivote) ; but est le connecteur simple : l'emploi de whereas dans une phrase complexe est un marqueur d'écriture B2/C1 — très valorisé : la faute type : « while » serait aussi correct (tandis que temporel ou contrastif) — mais therefore (conséquence) et moreover (addition) n'ont rien à faire ici.</div>"},
{"t": "Connecteurs et expression écrite (Anglais — Lycée)", "q": "« ___ being tired, she finished the race. »", "c": ["Although", "Because", "Despite", "However"], "a": 2, "e": "being tired = gérondif (pas une phrase complète) → Despite + -ing.", "d": "<b>Le gérondif après despite</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « being tired » = un gérondif (nom verbal, pas de sujet propre) → <b>Despite</b> : <i><b>Despite</b> being tired, she finished the race.</i> : les équivalents : <i>Despite her tiredness</i> (nom) / <i>Although she was tired</i> (phrase complète) — trois formulations, un sens : la règle unique : despite tolère un NOM ou un -ING ; although exige he/she/it + verbe : la faute « Although being tired » est courante (calque du français « bien qu'étant fatiguée ») — le français accepte le gérondif de concession, l'anglais le refuse : ce point précis est un piège d'examen raffiné — le connaître fait la différence.</div>"},
{"t": "Connecteurs et expression écrite (Anglais — Lycée)", "q": "Quel connecteur introduit un EXEMPLE ?", "c": ["Therefore", "However", "Nevertheless", "For instance"], "a": 3, "e": "For instance / for example = « par exemple » — introduit une illustration concrète.", "d": "<b>For instance, l'exemple qui prouve</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un argument sans exemple reste abstrait — <b>for instance</b> l'ancre : <i>Social media spread information fast. <b>For instance,</b> a TikTok video can reach a million viewers in one day.</i> : la famille : for instance, for example, such as (+ nom : <i>apps such as Instagram</i>), notably : la méthode d'essay : affirmation → exemple → mini-conclusion : l'exameur cherche cette trame (claim-evidence) : la nuance : « such as » énumère des cas (<i>cities such as London</i>) ; « for instance » raconte UN cas : un paragraphe avec son exemple est deux fois plus convaincant qu'un paragraphe nu — c'est le réflexe rédactionnel n°1.</div>"},
{"t": "Connecteurs et expression écrite (Anglais — Lycée)", "q": "« ___ of the traffic, we arrived on time. »", "c": ["Because", "Although", "In spite", "Despite"], "a": 3, "e": "Despite OF est impossible : « despite the traffic » — ici la seule construction correcte est Despite (sans of).", "d": "<b>Le of fantôme</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le français « en dépit DE » pousse à écrire « despite of » — la règle : <b>despite</b> se suffit (jamais of) ; c'est « in spite » qui EXIGE of (in spite of) : <i><b>Despite</b> the traffic, we arrived on time.</i> = <i><b>In spite of</b> the traffic, ...</i> : le couple apparié : despite = in spite of (synonymes exacts, seule la préposition change) : la faute « despite of » est LA scorie du chapitre — elle apparaît dans une copie sur trois au bac : la corriger (vérifier : pas de of après despite) est un réflexe de relecture gratuit : deux mots, une préposition, un point gagné.</div>"},
{"t": "Connecteurs et expression écrite (Anglais — Lycée)", "q": "Pour conclure un essay, on peut écrire :", "c": ["To conclude, ...", "Whereas, ...", "Moreover, ...", "For instance, ..."], "a": 0, "e": "To conclude / All in all / In conclusion = les formules de conclusion.", "d": "<b>To conclude, la sortie propre</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la conclusion d'essay suit un canevas : balise + bilan + opinion : <i><b>To conclude,</b> social media are powerful tools. <b>In my opinion</b>, we must learn to use them wisely rather than ban them.</i> : les balises : to conclude, all in all, in conclusion, to sum up : y ajouter l'opinion personnelle : in my opinion, as far as I am concerned, I believe that : les distracteurs sont des connecteurs de MILIEU (addition, exemple, contraste) — une conclusion n'ajoute plus d'argument : la conclusion est la dernière impression du correcteur : une balise nette + une opinion claire = des points de cohérence assurés.</div>"},
