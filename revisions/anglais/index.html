var COURS_META = [
{"id": "present-tenses", "theme": "Le présent : present simple et present continuous (Anglais — Collège)", "niveau": "Collège — Anglais", "titre": "Le présent : present simple et present continuous", "cours": "<div class=\"cours-head\"><h2>Le présent en anglais : present simple et present continuous</h2><p>Deux présents, deux usages : les habitudes (present simple) et le moment présent (present continuous).</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Present simple : habitudes, vérités générales → <i>She works every day.</i><br>— Present continuous : action en cours maintenant → <i>She is working right now.</i><br>— Marqueurs : <i>every day, usually</i> (simple) vs <i>now, at the moment, look!</i> (continuous).<br>— Troisième personne : <b>-s</b> !</div>\n<h3>1. Le present simple : l'habitude et la vérité</h3>\n<div class=\"tip\"><b>Formation :</b> verbe à l'infinitif sans <i>to</i> ; à la 3e personne du singulier (he/she/it), on ajoute <b>-s</b> (ou -es : <i>goes, does, watches</i>).<br><b>Usages :</b> habitudes (<i>I play tennis on Sundays</i>), vérités générales (<i>Water boils at 100 °C</i>), horaires (<i>The train leaves at 8 a.m.</i>), états permanents (<i>She lives in Paris</i>), verbes d'état (<i>like, love, know, believe, want, need</i> — rarement au continuous).<br><b>Négation et question :</b> <i>do/does</i> : <i>She doesn't work. / Does she work?</i> — après <i>do/does</i>, le verbe reste à la forme BASE (pas de -s : <i>Does she works</i> ✗ → <i>Does she work</i> ✓).</div>\n<h3>2. Le present continuous : l'action en cours</h3>\n<div class=\"tip\"><b>Formation :</b> <i>am/is/are</i> + verbe-<b>ing</b> : <i>I am working, she is eating, they are playing.</i><br><b>Usages :</b> action en cours au moment où l'on parle (<i>Look! It is raining</i>), situation temporaire (<i>I am staying with my aunt this week</i>), arrangement futur proche (<i>We are leaving at 6 tomorrow</i>).<br><b>Verbes d'état à éviter au continuous :</b> <i>know, like, want, need, believe, understand, own</i> : on dit <i>I know</i>, pas <i>I am knowing</i> ✗.</div>\n<table><tr><th></th><th>Present simple</th><th>Present continuous</th></tr>\n<tr><td><b>Marqueurs typiques</b></td><td>every day, usually, often, never, on Mondays, always</td><td>now, right now, at the moment, today, this week, Look! Listen!</td></tr>\n<tr><td><b>Exemple</b></td><td><i>He usually walks to school.</i></td><td><i>Today he is taking the bus.</i></td></tr>\n<tr><td><b>Négation</b></td><td><i>He doesn't walk.</i></td><td><i>He isn't walking.</i></td></tr>\n<tr><td><b>Question</b></td><td><i>Does he walk?</i></td><td><i>Is he walking?</i></td></tr></table>\n<div class=\"piege\">⚠️ <b>Piège n°1 :</b> oublier le <b>-s</b> de la 3e personne : <i>She work</i> ✗ → <i>She work<b>s</b></i> ✓.<br>⚠️ <b>Piège n°2 :</b> mettre le -s ET do/does : <i>Does she works?</i> ✗ → <i>Does she work?</i> ✓.<br>⚠️ <b>Piège n°3 :</b> employer le continuous avec un verbe d'état : <i>I am wanting</i> ✗ → <i>I want</i> ✓.</div>\n<h3>3. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — un paragraphe à corriger</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Corrige : <i>My brother work in a bank. He usually start at 9 a.m. but today he is work at home because he don't feel well.</i></div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Identifier le sujet</b> : <i>My brother</i> = 3e personne singulier → chaque present simple prend un <b>-s</b> : <i>work<b>s</b></i>, <i>start<b>s</b></i>.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Choisir le bon présent</b> : « today » + action en cours → present continuous : <i>he is work<b>ing</b></i> (pas « is work »). « Il ne se sent pas bien » = état présent → present simple : <i>he <b>doesn't</b> feel</i>.</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Résultat</b> : <i>My brother work<b>s</b> in a bank. He usually start<b>s</b> at 9 a.m. but today he is work<b>ing</b> at home because he <b>doesn't</b> feel well.</i> — la méthode : (1) sujet 3e personne ? (2) habitude ou action en cours ? (3) négation → do/does + base verbale.</div></div></details>"},
{"id": "past-simple", "theme": "Le passé : past simple et récit (Anglais — Collège)", "niveau": "Collège — Anglais", "titre": "Le passé : past simple et récit", "cours": "<div class=\"cours-head\"><h2>Le past simple</h2><p>Raconter au passé : verbes réguliers (-ed) et irréguliers, négation et questions avec <i>did</i>.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Formation : verbe + <b>-ed</b> (réguliers) ; formes irrégulières à apprendre (go → went...).<br>— Négation/question : <b>didn't / did</b> + verbe BASE.<br>— Marqueurs : <i>yesterday, last week, in 2010, ago</i>.<br>— Même forme à toutes les personnes (I/you/he/we...).</div>\n<h3>1. Formation</h3>\n<div class=\"tip\"><b>Réguliers :</b> verbe + -ed : <i>work → worked, play → played, study → studied, stop → stopped</i> (orthographe : consonne finale doublée après voyelle brève ; y → ied après consonne).<br><b>Irréguliers :</b> à mémoriser par familles : <i>go → went, see → saw, have → had, do → did, take → took, come → came, buy → bought, make → made, think → thought, eat → ate, write → wrote, say → said, find → found</i>.<br><b>Même forme pour toutes les personnes :</b> <i>I worked, he worked, they worked</i> — plus de -s à la 3e personne, hourra !</div>\n<h3>2. Négation et questions : l'auxiliaire did</h3>\n<div class=\"tip\"><b>Négation :</b> <i>didn't</i> + base : <i>She didn't come</i> (PAS « didn't came » ✗).<br><b>Question :</b> <i>Did</i> + sujet + base : <i>Did you see him?</i><br><b>Question-word :</b> <i>Where did you go? What did he say?</i><br><b>Règle d'or :</b> quand <i>did</i> est présent, le verbe reste à la BASE — le marqueur du passé est dans <i>did</i>, pas dans le verbe.</div>\n<div class=\"piege\">⚠️ <b>Piège n°1 :</b> <i>She didn't went</i> ✗ → <i>She didn't <b>go</b></i> ✓.<br>⚠️ <b>Piège n°2 :</b> <i>Did you saw</i> ✗ → <i>Did you <b>see</b></i> ✓.<br>⚠️ <b>Piège n°3 :</b> confondre <i>did</i> (auxiliaire du passé) et <i>made</i> (faire, au passé) : <i>Did you make</i>...</div>\n<h3>3. Les marqueurs du passé</h3>\n<table><tr><th>Marqueur</th><th>Français</th><th>Exemple</th></tr>\n<tr><td><i>yesterday</i></td><td>hier</td><td><i>I saw him yesterday.</i></td></tr>\n<tr><td><i>last night / last week / last year</i></td><td>hier soir / la semaine dernière / l'année dernière</td><td><i>They arrived last night.</i></td></tr>\n<tr><td><i>two days ago / a year ago</i></td><td>il y a deux jours / un an</td><td><i>We met two years ago.</i></td></tr>\n<tr><td><i>in 2010, when I was young</i></td><td>en 2010, quand j'étais jeune</td><td><i>She moved to Lyon in 2010.</i></td></tr></table>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — raconter son week-end</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Rédige 4 phrases au past simple : samedi matin (jouer au foot), l'après-midi (aller au cinéma, voir un film), le soir (ne pas sortir, rester à la maison), dimanche (faire ses devoirs, être fatigué).</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Choisir les verbes</b> : play (régulier → played), go (irrégulier → went), see (irrégulier → saw), stay (régulier → stayed), do → did, be → was/were.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Construire</b> : <i>On Saturday morning, I played football with my friends.</i> / <i>In the afternoon, I went to the cinema and saw a great film.</i> / <i>In the evening, I didn't go out: I stayed at home.</i> / <i>On Sunday, I did my homework and I was tired.</i></div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Vérifier</b> : chaque phrase : (1) marqueur passé ? (2) verbe au passé (ou didn't + base) ? (3) pas de -s : la rédaction au passé est souvent la plus simple — TOUTES les personnes partagent la même forme ; le seul travail est la liste d'irréguliers (10 par semaine, c'est gagné).</div></div></details>"},
{"id": "articles-quantifieurs", "theme": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)", "niveau": "Collège — Anglais", "titre": "Articles et quantifieurs", "cours": "<div class=\"cours-head\"><h2>Articles et quantifieurs</h2><p>a/an, the, some/any, much/many, how much/how many : les petits mots qui changent tout.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— a/an : un, une (indéfini) — an devant voyelle.<br>— the : le, la, les (défini) — connu des deux côtés.<br>— some : affirmatif (+) ; any : négatif (-) et question (?).<br>— much (indénombrable) vs many (dénombrable).<br>— How much...? (prix, quantité) vs How many...? (nombre).</div>\n<h3>1. a ou an ?</h3>\n<div class=\"tip\"><b>a</b> devant son consonantique : <i>a book, a cat, a European country</i> (le « Eu- » se prononce « you »).<br><b>an</b> devant son vocalique : <i>an apple, an hour</i> (le h est muet !), <i>an honest man</i>.<br>⚠️ C'est le SON qui décide, pas l'orthographe : <i>a university</i> (son « you »), <i>an MP3</i> (son « èm »).<br><b>Emploi :</b> un seul, non précisé, mentionné pour la première fois : <i>I bought a bike.</i></div>\n<h3>2. the : le défini</h3>\n<div class=\"tip\"><b>Emplois :</b> l'objet est connu, déjà mentionné ou unique : <i>The sun, the moon, the door (celle dont on parle), the Internet.</i><br><b>Pays et géographie :</b> the Netherlands, the United States, the United Kingdom, the Alps, the Thames (rivières, mers, chaînes) MAIS France, England, Mount Everest sans article.<br><b>Musique :</b> play <i>the</i> piano/guitar (instrument), mais play football (sport, sans article).<br><b>Repas :</b> have breakfast/lunch/dinner sans article en général.</div>\n<h3>3. some / any : les quantités vagues</h3>\n<table><tr><th></th><th>Phrase affirmative (+)</th><th>Négation (-) / Question (?)]</th></tr>\n<tr><td><b>Dénombrables</b></td><td><i>There are some apples.</i></td><td><i>Are there any apples? / There aren't any apples.</i></td></tr>\n<tr><td><b>Indénombrables</b></td><td><i>I need some water.</i></td><td><i>Do you have any water? / I don't have any water.</i></td></tr></table>\n<div class=\"tip\"><b>some</b> = affirmatif (une certaine quantité) ; <b>any</b> = négatif ou interrogatif. Exception : <i>Would you like some tea?</i> (offre polie — on suggère « oui »).<br><b>Dénombrables vs indénombrables :</b> apples, books, cars (comptables) vs water, money, bread, advice, information, furniture (non comptables) : <i>advice</i> et <i>information</i> sont INDEnombrables en anglais (<i>some advice</i>, pas « an advice » ✗).</div>\n<h3>4. much, many, a lot of</h3>\n<div class=\"tip\"><b>much</b> + indénombrable : <i>much water, much time</i> (surtout en négation et question).<br><b>many</b> + dénombrable pluriel : <i>many books, many people</i>.<br><b>a lot of / lots of</b> : les deux (affirmatif surtout) : <i>a lot of money, a lot of friends.</i><br><b>How much...?</b> (prix, quantité indénombrable) : <i>How much is it? How much sugar?</i> / <b>How many...?</b> (nombre) : <i>How many brothers have you got?</i><br><b>little/few :</b> <i>little money</i> (peu, indénombrable), <i>few friends</i> (peu, dénombrable) ; <i>a little / a few</i> = un peu (nuance positive).</div>\n<div class=\"piege\">⚠️ <b>Piège :</b> « I have some questions » ✓ mais « Do you have some questions? » ✗ → <i>Do you have <b>any</b> questions?</i> (interrogatif → any).<br>⚠️ « informations » n'existe pas : <i>some information</i>.<br>⚠️ an hour (h muet) mais a horse (h aspiré).</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — faire les courses en anglais</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Chez l'épicier, rédige : (1) demander 2 pommes (dénombrable), (2) demander du pain (indénombrable), (3) demander le prix, (4) refuser poliment.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Les dénombrables</b> : <i>Could I have two apples, please? / How many apples do you want? — Just two.</i> (many avec les pommes).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Les indénombrables</b> : <i>Could I have some bread, please?</i> (some en affirmatif, bread sans pluriel) / <i>I don't need any butter, thanks.</i> (any au négatif).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Le prix et le refus</b> : <i>How much is it? / How much does it cost?</i> (prix = how much) / <i>No, thank you, I don't want any cheese.</i> — le dialogue commercial mobilise TOUTE la leçon : a/an (un article), the (l'objet désigné), some/any (quantités), much/many (quantifieurs), how much/how many (questions) : parfait pour l'oral du brevet.</div></div></details>"},
{"id": "modaux", "theme": "Les modaux : can, must, should (Anglais — Collège)", "niveau": "Collège — Anglais", "titre": "Les modaux : can, must, should", "cours": "<div class=\"cours-head\"><h2>Les modaux</h2><p>can (capacité, permission), must (obligation), should (conseil) : les auxiliaires qui modulent le sens.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Modal + verbe BASE (sans to, sans -s) : <i>She can swim.</i><br>— can/can't : capacité, permission, possibilité.<br>— must/mustn't : obligation forte, interdiction.<br>— should : conseil, recommandation.<br>— Négations : can't, mustn't (≠ don't have to !), shouldn't.</div>\n<h3>1. Les règles communes aux modaux</h3>\n<div class=\"tip\">1) <b>Modal + base verbale</b> : <i>She can swim</i> (PAS « can swims » ni « can to swim » ✗).<br>2) <b>Pas de -s à la 3e personne</b> : <i>He must go</i> (jamais « musts »).<br>3) <b>Question par inversion</b> : <i>Can you swim? / Must I go? / Should we leave?</i><br>4) <b>Négation directe</b> : <i>can't (cannot), mustn't, shouldn't.</i></div>\n<h3>2. can / can't</h3>\n<div class=\"tip\"><b>Capacité :</b> <i>I can swim, she can speak three languages.</i><br><b>Permission :</b> <i>Can I go out? You can use my phone.</i><br><b>Possibilité :</b> <i>It can be very cold in winter.</i><br><b>Demande polie :</b> <i>Could you help me?</i> (could = can plus poli).<br><b>can't = incapacité, interdiction, impossibilité :</b> <i>You can't park here. That can't be true!</i></div>\n<h3>3. must / mustn't / don't have to</h3>\n<div class=\"tip\"><b>must :</b> obligation forte (règles, loi, obligation morale) : <i>You must wear a helmet. I must finish this today.</i><br><b>mustn't :</b> INTERDICTION : <i>You mustn't smoke here.</i><br><b>don't have to :</b> absence d'obligation (facultatif !) : <i>You don't have to come, it's optional.</i><br>⚠️ <b>Le piège du chapitre :</b> mustn't ≠ don't have to ! <i>mustn't</i> = c'est interdit ; <i>don't have to</i> = ce n'est pas obligatoire (tu peux, mais tu n'es pas forcé).</div>\n<div class=\"piege\">⚠️ En français « tu n'es pas obligé » peut signifier « c'est interdit » (poliment) — en anglais, la négation de must est <b>don't have to</b> (pas mustn't !). <i>You mustn't open the door</i> = interdiction ; <i>You don't have to open the door</i> = pas nécessaire.</div>\n<h3>4. should / shouldn't</h3>\n<div class=\"tip\"><b>Conseil, recommandation :</b> <i>You should eat more vegetables. You should see a doctor.</i><br><b>shouldn't :</b> <i>You shouldn't eat so fast.</i><br><b>Demande d'avis :</b> <i>What should I do? / Do you think I should apologise?</i><br><b>should have + participe passé</b> (lycée) : regret — <i>You should have called me</i> (tu aurais dû m'appeler).</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le règlement du collège en anglais</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Traduis : (1) Interdiction de courir dans les couloirs (mustn't), (2) Obligation de porter l'uniforme (must/have to), (3) Il est conseillé d'apporter un parapluie (should), (4) Il n'est pas obligatoire d'apporter sa calculatrice (don't have to).</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Interdiction</b> : <i>You <b>mustn't</b> run in the corridors.</i> (règle stricte).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Obligation</b> : <i>You <b>must</b> wear your uniform. / You <b>have to</b> wear your uniform.</i> (must = obligation du locuteur, have to = obligation extérieure).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Conseil et non-obligation</b> : <i>You <b>should</b> bring an umbrella.</i> / <i>You <b>don't have to</b> bring your calculator.</i> — la distinction must/mustn't/don't have to est le cœur de l'exercice : interdiction, obligation, absence d'obligation : trois règles, trois modaux.</div></div></details>"},
{"id": "comparatif-superlatif", "theme": "Comparatif et superlatif (Anglais — Collège)", "niveau": "Collège — Anglais", "titre": "Comparatif et superlatif", "cours": "<div class=\"cours-head\"><h2>Comparatif et superlatif</h2><p>Plus grand que, le plus grand : adjectifs courts (-er/the -est), adjectifs longs (more/the most), et les irréguliers.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Courts : <b>-er than</b> / <b>the -est</b> (tall → taller → the tallest).<br>— Longs : <b>more ... than</b> / <b>the most ...</b> (beautiful).<br>— Irréguliers : good → better → the best ; bad → worse → the worst ; far → further.<br>— Égalité : <b>as ... as</b>.</div>\n<h3>1. Adjectifs courts : -er et -est</h3>\n<div class=\"tip\"><b>Formation :</b> adjectif + -er (+ than) : <i>tall → taller than</i> ; + the -est : <i>the tallest</i>.<br><b>Orthographe :</b> e finale : <i>large → larger</i> ; une syllabe CVC : doubler la consonne (<i>big → bigger → the biggest</i>) ; y final → ier (<i>happy → happier → the happiest</i> ; easy → easier).<br><b>Exemples :</b> <i>Tom is taller than Ben. / She is the youngest in the class. / Today is hotter than yesterday.</i></div>\n<h3>2. Adjectifs longs : more et the most</h3>\n<div class=\"tip\"><b>Adjectifs de 2 syllabes+ et se terminant en -ful, -ing, -ed, -ous :</b> beautiful, expensive, interesting, boring, famous.<br><b>Formation :</b> more + adjectif + than : <i>more beautiful than</i> ; the most + adjectif : <i>the most expensive</i>.<br><b>Exemples :</b> <i>This film is more interesting than the book. / It's the most famous painting in the world.</i><br>⚠️ Jamais « more taller » ✗ (double marquage interdit) : on choisit -er OU more, jamais les deux.</div>\n<h3>3. Les irréguliers à connaître par cœur</h3>\n<table><tr><th>Adjectif</th><th>Comparatif</th><th>Superlatif</th></tr>\n<tr><td><b>good</b> (bon)</td><td>better</td><td>the best</td></tr>\n<tr><td><b>bad</b> (mauvais)</td><td>worse</td><td>the worst</td></tr>\n<tr><td><b>far</b> (loin)</td><td>further / farther</td><td>the furthest / farthest</td></tr>\n<tr><td><b>little</b> (peu)</td><td>less</td><td>the least</td></tr>\n<tr><td><b>many/much</b> (beaucoup)</td><td>more</td><td>the most</td></tr></table>\n<div class=\"piege\">⚠️ « gooder » ✗ → <b>better</b> ; « badder » ✗ → <b>worse</b>. Attention aussi : <i>than</i> (pas « then » !) après le comparatif.</div>\n<h3>4. Les autres comparaisons</h3>\n<div class=\"tip\"><b>Égalité :</b> as + adjectif + as : <i>She is as tall as her brother. / It's not as expensive as I thought.</i><br><b>Infériorité :</b> less + adjectif + than : <i>less expensive than</i>.<br><b>Nombrables :</b> more books than, fewer books than ; indénombrables : more water than, less water than.<br><b>Superlatif avec ever :</b> <i>It's the best film I have ever seen</i> (the best... ever).<br><b>big → bigger and bigger</b> (de plus en plus) : <i>Cities are getting bigger and bigger.</i></div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comparer trois villes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Compare London, Paris et Rome : population, monuments, prix. Utilise un comparatif, un superlatif et une égalité.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Choisir la longueur</b> : big (court) → bigger ; famous (2 syllabes, -ous) → more famous ; expensive → more expensive.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Construire</b> : <i>London is bigger than Paris.</i> (comparatif court) / <i>Paris is more famous than Rome for its food.</i> (comparatif long) / <i>The Eiffel Tower is the most famous monument in France.</i> (superlatif long) / <i>The metro in Paris is as cheap as in Rome.</i> (égalité).</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Vérifier</b> : chaque comparaison : (1) adjectif court ou long ? (2) than présent ? (3) the devant le superlatif ? : la grille court/long + than/the est le plan de vérification universel du chapitre — trois questions, zéro faute.</div></div></details>"},
{"id": "futur", "theme": "Le futur : will et be going to (Anglais — Collège)", "niveau": "Collège — Anglais", "titre": "Le futur : will et be going to", "cours": "<div class=\"cours-head\"><h2>Le futur</h2><p>will (prédictions, décisions spontanées, promesses) et be going to (projets, intentions, prédictions fondées).</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— will + base : <i>I will help you.</i> (forme contractée : I'll)<br>— be going to + base : <i>I am going to visit London.</i><br>— will : décision immédiate, prédiction, promesse, offre.<br>— going to : intention, projet, prédictions avec indices visibles.<br>— Présent continu : arrangements fixes (We are leaving at 6).</div>\n<h3>1. will : le futur du moment</h3>\n<div class=\"tip\"><b>Formation :</b> will + base verbale (toutes les personnes, pas de -s) : <i>I will go, she will come.</i> Contractions : <b>I'll, you'll, she'll, won't</b> (will not).<br><b>Emplois :</b><br>— <b>Décision spontanée</b> (au moment de parler) : <i>It's cold — I'll close the window.</i><br>— <b>Prédiction</b> (opinion) : <i>I think it will rain tomorrow.</i><br>— <b>Promesse</b> : <i>I will always love you. I won't forget.</i><br>— <b>Offre / aide</b> : <i>I'll carry your bag.</i><br><b>Question :</b> <i>Will you help me?</i> — <b>shall</b> (suggestion, britannique) : <i>Shall we go?</i></div>\n<h3>2. be going to : le futur du projet</h3>\n<div class=\"tip\"><b>Formation :</b> am/is/are + going to + base : <i>I am going to study tonight. They are going to move.</i><br><b>Emplois :</b><br>— <b>Intention, projet décidé AVANT le moment de parole</b> : <i>We are going to visit Spain this summer.</i> (c'est décidé)<br>— <b>Prédiction fondée sur des indices</b> : <i>Look at those clouds — it is going to rain!</i> (on VOIT les nuages)<br><b>Négation :</b> <i>She isn't going to come.</i> — <b>Question :</b> <i>Are you going to stay?</i></div>\n<h3>3. will ou going to ? La clé du choix</h3>\n<table><tr><th>Situation</th><th>Temps</th><th>Exemple</th></tr>\n<tr><td>Décision prise AU MOMENT de parler</td><td><b>will</b></td><td><i> The phone is ringing — I'll get it!</i></td></tr>\n<tr><td>Projet décidé AVANT</td><td><b>be going to</b></td><td><i>I'm going to learn Spanish (I decided last month).</i></td></tr>\n<tr><td>Prédiction sans indice (opinion)</td><td><b>will</b></td><td><i>I'm sure she will win.</i></td></tr>\n<tr><td>Prédiction avec indice visible</td><td><b>be going to</b></td><td><i>He is going to fall! (he's on the edge)</i></td></tr>\n<tr><td>Arrangement fixe (heure, billets)</td><td><b>present continuous</b></td><td><i>We are leaving at 6 a.m.</i></td></tr>\n<tr><td>Programme officiel</td><td><b>present simple</b></td><td><i>The train leaves at 8.</i></td></tr></table>\n<div class=\"piege\">⚠️ <b>Piège :</b> « will » + « -s » ✗ (<i>she wills</i>) ; « going to » sans être ✗ (<i>I going to play</i>) ; confondre décision spontanée (will) et projet antérieur (going to) : « I'll help you » (je viens de décider) ≠ « I'm going to help you » (c'était prévu).</div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — l'anniversaire surprise</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Choisis will ou going to : (1) « On organise une fête pour Léa — on a acheté le gâteau. » (2) « Le téléphone sonne — je vais répondre. » (3) « Regarde ses valises : elle va partir. » (4) « Je te promets que je viendrai. »</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Les projets</b> : (1) décision ANTÉRIEURE, préparation en cours → <i>We <b>are going to</b> organize a party — we have bought the cake.</i></div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Les décisions spontanées</b> : (2) le téléphone sonne MAINTENANT, la décision est immédiate → <i>The phone is ringing — <b>I'll</b> answer it.</i> (3) indice VISIBLE (les valises) → <i>Look at her suitcases — she <b>is going to</b> leave!</i></div>\n<div class=\"etu\"><b>Étape 3</b> — <b>La promesse</b> : (4) engagement → <i>I promise I <b>will</b> come.</i> — le test mental : « ai-je décidé avant de parler ? » → going to ; « est-ce que je décide/prédis maintenant ? » → will : un critère simple qui résout la plupart des cas d'examen.</div></div></details>"},
{"id": "present-perfect", "theme": "Le present perfect : expérience et résultat (Anglais — Lycée)", "niveau": "Lycée — Anglais", "titre": "Le present perfect", "cours": "<div class=\"cours-head\"><h2>Le present perfect</h2><p>Le passé qui touche le présent : expériences (have been), résultats, actions récentes — avec since, for, already, yet, ever, never.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Formation : <b>have/has + participe passé</b> (worked, gone, seen).<br>— Expérience : <i>I have been to London.</i><br>— Bilan/résultat présent : <i>She has lost her keys (→ elle ne les a plus maintenant).</i><br>— Marqueurs : since, for, just, already, yet, ever, never, so far, recently.<br>— ≠ past simple (passé daté, détaché du présent).</div>\n<h3>1. Formation</h3>\n<div class=\"tip\"><b>have/has</b> (has à la 3e pers. sing.) + <b>participe passé</b> : réguliers → -ed (<i>worked, finished</i>) ; irréguliers → 3e colonne (<i>go → gone, see → seen, do → done, write → written</i>).<br><b>Négation :</b> <i>I haven't seen him. / She hasn't arrived.</i><br><b>Question :</b> <i>Have you ever eaten sushi? / Has he called?</i><br><b>Contracté :</b> I've, she's (has !), they've, haven't, hasn't.</div>\n<h3>2. Les emplois clés</h3>\n<div class=\"tip\"><b>1. Expérience de vie</b> (sans date — ce qui compte : est-ce arrivé OUI/NON ?) : <i>I have never been to Japan. Have you ever failed an exam?</i><br><b>2. Action passée avec résultat PRÉSENT</b> : <i>He has broken his leg (→ il a un plâtre maintenant).</i><br><b>3. Action récente / hot news</b> : <i>She has just left. The president has resigned.</i><br><b>4. Situation qui dure encore</b> (avec since/for) : <i>I have lived here since 2019. / We have known each other for ten years.</i> (et on vit toujours ensemble)</div>\n<h3>3. since / for / just / already / yet</h3>\n<table><tr><th>Mot</th><th>Sens</th><th>Exemple</th></tr>\n<tr><td><b>since</b></td><td>depuis un POINT de départ (date, événement)</td><td><i>since 2010, since Monday, since I was a child</i></td></tr>\n<tr><td><b>for</b></td><td>pendant une DURÉE</td><td><i>for two years, for a long time</i></td></tr>\n<tr><td><b>just</b></td><td>venir de (tout récemment)</td><td><i>I have just finished.</i></td></tr>\n<tr><td><b>already</b></td><td>déjà (affirmatif)</td><td><i>She has already left.</i></td></tr>\n<tr><td><b>yet</b></td <td>déjà ? / pas encore (question, négation)</td><td><i>Have you finished yet? / Not yet.</i></td></tr>\n<tr><td><b>ever / never</b></td><td>déjà / jamais (expérience)</td><td><i>Have you ever seen it? / I have never tried.</i></td></tr></table>\n<div class=\"piege\">⚠️ <b>Le piège du français :</b> « Il y a 10 ans que j'habite ici » → <i>I have lived here for ten years</i> (PAS « I live here for ten years » ✗ ni « I am living... » ✗).<br>⚠️ <b>Date précise → past simple :</b> <i>I went to London in 2018</i> (date) mais <i>I have been to London</i> (expérience, sans date).<br>⚠️ <b>since + past simple possible :</b> <i>He has changed a lot since I met him.</i></div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — un e-mail à un correspondant</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Rédige 5 phrases sur toi : (1) tu es déjà allé en Irlande, (2) tu n'as jamais mangé de haggis, (3) tu apprends l'anglais depuis 2015, (4) tu viens juste de finir tes devoirs, (5) tu as déjà lu deux romans en anglais.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Choisir le participe</b> : go → been, eat → eaten, learn → learned, finish → finished, read → read.</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Construire</b> : <i>I <b>have been</b> to Ireland.</i> / <i>I <b>have never eaten</b> haggis.</i> / <i>I <b>have learned</b> English <b>since</b> 2015.</i> / <i>I <b>have just finished</b> my homework.</i> / <i>I <b>have already read</b> two novels in English.</i></div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Le test de l'énoncé</b> : aucune date précise → pas de past simple ; expériences et liens avec le présent → present perfect ; « since 2015 » = point de départ d'une situation qui CONTINUE. La logique « lien avec le présent » est le critère : quand tu réponds à « Raconte ton expérience », c'est have + p.p., pas le past simple.</div></div></details>"},
{"id": "passif", "theme": "La voix passive (Anglais — Lycée)", "niveau": "Lycée — Anglais", "titre": "La voix passive", "cours": "<div class=\"cours-head\"><h2>La voix passive</h2><p>be + participe passé : quand le sujet subit l'action. Tous les temps, du présent au futur, plus les deux passifs.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Formation : <b>be (conjugué) + participe passé</b> (+ by + agent).<br>— Présent : <i>is/are made</i> ; passé : <i>was/were made</i> ; futur : <i>will be made</i> ; perfect : <i>has been made</i> ; modal : <i>must be made</i>.<br>— Le complément d'agent (by...) est souvent omis.<br>— Usage : processus, règles, actualité — quand l'agent est inconnu, évident ou peu important.</div>\n<h3>1. Formation : la mécanique en 3 étapes</h3>\n<div class=\"tip\"><b>Actif :</b> <i>Shakespeare wrote Hamlet.</i> (sujet → verbe → COD)<br><b>Passif :</b> le COD devient sujet ; le verbe devient <b>be (au temps de l'actif) + p.p.</b> ; le sujet devient <b>by...</b> (facultatif).<br><i>Hamlet <b>was written</b> by Shakespeare.</i><br>Étapes : (1) repérer le COD (Hamlet) → il devient sujet ; (2) conjuguer be au temps de la phrase (wrote = past simple → was) ; (3) mettre le verbe au participe (written).</div>\n<h3>2. Le passif à tous les temps</h3>\n<table><tr><th>Temps</th><th>Actif</th><th>Passif</th></tr>\n<tr><td>Present simple</td><td><i>They clean the room.</i></td><td>The room <b>is cleaned</b>.</td></tr>\n<tr><td>Past simple</td><td><i>They built the bridge.</i></td><td>The bridge <b>was built</b>.</td></tr>\n<tr><td>Future</td><td><i>They will announce the results.</i></td><td>The results <b>will be announced</b>.</td></tr>\n<tr><td>Present perfect</td><td><i>They have arrested him.</i></td><td>He <b>has been arrested</b>.</td></tr>\n<tr><td>Modal</td><td><i>You must sign the form.</i></td><td>The form <b>must be signed</b>.</td></tr>\n<tr><td>Present continuous</td><td><i>They are repairing the road.</i></td><td>The road <b>is being repaired</b>.</td></tr></table>\n<div class=\"piege\">⚠️ <b>Piège n°1 :</b> oublier be : « The room cleaned » ✗ → <i>The room <b>is</b> cleaned</i> ✓.<br>⚠️ <b>Piège n°2 :</b> be doit porter le TEMPS : past → <i>was done</i> (pas « is done » pour hier).<br>⚠️ <b>Piège n°3 :</b> avec les modaux : <i>must be signed</i> (pas « must is signed » ✗).<br>⚠️ <b>Piège n°4 :</b> get + p.p. (get damaged) = passif familier, à l'oral.</div>\n<h3>3. Pourquoi le passif ?</h3>\n<div class=\"tip\"><b>1. L'agent est inconnu :</b> <i>My bike has been stolen!</i> (par qui ? on ne sait pas)<br><b>2. L'agent est évident ou sans importance :</b> <i>The criminal was arrested.</i> (par la police, évidemment)<br><b>3. Style journalistique/scientifique :</b> <i>The results were published last week.</i><br><b>4. Procédés et règles :</b> <i>The mixture is heated to 100 °C. Applications must be sent before June.</i><br><b>5. Diplomatie :</b> <i>Mistakes were made</i> (on ne dit pas par qui !) — le passif permet d'éluder l'agent : un outil rhétorique, pas seulement grammatical.</div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le compte-rendu d'un vol</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Mets au passif : (1) « Somebody stole the painting yesterday. » (2) « The police have found it. » (3) « They will restore it. » (4) « You can see it next year. »</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Identifier COD et temps</b> : (1) COD = the painting, temps = past simple → <i>The painting <b>was stolen</b> yesterday.</i> (agent « somebody » omis : inconnu).</div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Adapter be au temps</b> : (2) present perfect → <i>It <b>has been found</b> by the police.</i> (3) futur → <i>It <b>will be restored</b>.</i></div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Modal</b> : (4) → <i>It <b>can be seen</b> next year.</i> — la grille : COD → sujet ; be portant le temps + participe ; agent facultatif (by...). Quatre phrases, quatre temps : le passif est une MÉCANIQUE — la routine la rend aussi simple que l'actif.</div></div></details>"},
{"id": "pronoms-relatifs", "theme": "Les pronoms relatifs : who, which, that (Anglais — Lycée)", "niveau": "Lycée — Anglais", "titre": "Les pronoms relatifs", "cours": "<div class=\"cours-head\"><h2>Les pronoms relatifs</h2><p>who, whom, which, that, whose, where, when — relier deux phrases et éviter les répétitions.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— <b>who</b> : personnes (sujet ou complément).<br>— <b>which</b> : choses et animaux.<br>— <b>that</b> : personnes ET choses (dans les phrases déterminatives).<br>— <b>whose</b> : possession ; <b>where</b> : lieux ; <b>when</b> : moments.<br>— Omettre le relatif complément d'objet : <i>The book (that) I read</i> ✓.</div>\n<h3>1. Le choix du pronom</h3>\n<table><tr><th>Fonction</th><th>Personnes</th><th>Choses/animaux</th><th>Lieu / moment / possession</th></tr>\n<tr><td><b>Sujet</b></td><td><i>The man <b>who</b> lives here</i></td><td><i>The book <b>which/that</b> tells the story</i></td><td rowspan=\"3\"><b>where</b> (lieu), <b>when</b> (moment), <b>whose</b> (possesseur)</td></tr>\n<tr><td><b>Complément</b></td><td><i>The man (who/whom/that) I met</i></td><td><i>The book (which/that) I read</i></td></tr>\n<tr><td><b>Possession</b></td><td><i>The man <b>whose</b> car... </i></td><td><i>The house <b>whose</b> roof...</i></td></tr></table>\n<div class=\"tip\"><b>who</b> = sujet personne (<i>She is the singer who won the prize.</i>) ; <b>whom</b> = complément formel (rare à l'oral, fréquent après préposition : <i>the colleague with whom I work</i>).<br><b>which</b> = choses : <i>The film which was nominated...</i> — peut reprendre toute une proposition : <i>He arrived late, which annoyed everyone.</i><br><b>that</b> = remplace who/which dans les relatives déterminatives (voir §3).</div>\n<h3>2. Sujet ou complément ? Le test du verbe</h3>\n<div class=\"tip\">Regarde le mot qui SUIT le pronom relatif :<br>— Si un <b>verbe conjugué</b> suit (sans autre sujet) → le relatif est <b>SUJET</b> : <i>The girl <b>who lives</b> next door</i> (who + verbe lives).<br>— Si un <b>sujet + verbe</b> suit → le relatif est <b>COMPLÉMENT</b> : <i>The girl (who) <b>I saw</b> yesterday</i> (I = sujet de saw) → le pronom peut être OMIS.<br><b>Omission :</b> seulement complément d'OBJET : <i>The film we watched was great.</i> ✓ MAIS jamais un sujet : <i>The man lives here who</i> ✗ (<i>The man who lives here</i> ✓).</div>\n<h3>3. Déterminatives vs explicatives (that vs which — la virgule)</h3>\n<div class=\"tip\"><b>Relative déterminative (restrictive, sans virgule)</b> : ESSENTIELLE au sens — élimine : <i>The students <b>who</b> study hard will pass.</i> (seuls ceux qui travaillent) — on peut utiliser <b>that</b>.<br><b>Relative explicative (non restrictive, entre virgules)</b> : APPOSÉE, un supplément d'information — éliminable : <i>My brother, <b>who</b> lives in Rome, is a doctor.</i> (j'ai un seul frère, l'info est un bonus) — JAMAIS « that » après une virgule, jamais d'omission.<br>⚠️ La virgule change le SENS : <i>My brother who lives in Rome</i> (déterminative : j'ai plusieurs frères, je précise lequel) ≠ <i>My brother, who lives in Rome</i> (j'ai un frère, il habite Rome).</div>\n<div class=\"piege\">⚠️ « The man that I saw him » ✗ — jamais de doublon sujet : le relatif REMPLACE le pronom.<br>⚠️ Après une préposition formelle : <i>the people <b>with whom</b> we worked</i> (pas « with who » en style soutenu ; à l'oral : the people we worked with).<br>⚠️ <i>which</i> peut reprendre une IDÉE entière : <i>He lied to me, which I can't forgive.</i></div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — fusionner deux phrases</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Fusionne avec un pronom relatif : (1) « This is the hotel. We stayed there last year. » (2) « I met a woman. Her son is in my class. » (3) « The film was boring. I watched it last night. » (4) « 2019 was the year. He moved to London then. »</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Identifier la fonction</b> : (1) lieu → <b>where</b> : <i>This is the hotel <b>where</b> we stayed last year.</i> (2) possession → <b>whose</b> : <i>I met a woman <b>whose</b> son is in my class.</i></div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Sujet ou complément ?</b> : (3) « I watched it » → it = complément → relatif omis ou that/which : <i>The film (that) I watched last night was boring.</i> (4) moment → <b>when</b> : <i>2019 was the year <b>when</b> he moved to London.</i></div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Vérifier le doublon</b> : après fusion, le promet original (there, her, it, then) a DISPARU — le relatif le remplace : « The film that I watched it » ✗. La fusion de phrases est l'exercice roi du chapitre : fonction du relatif (sujet/complément/lieu/moment/possession) puis vérification anti-doublon.</div></div></details>"},
{"id": "conditionals", "theme": "Les conditionnels : if et hypothèses (Anglais — Lycée)", "niveau": "Lycée — Anglais", "titre": "Les conditionnels", "cours": "<div class=\"cours-head\"><h2>Les conditionnels</h2><p>Si... : le type 1 (réel), le type 2 (imaginaire), le type 3 (regret) — et le fameux <b>will</b> jamais après if.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Type 1 (réel) : <b>If + présent, will + base</b> — If it rains, I will stay home.<br>— Type 2 (imaginaire) : <b>If + past simple, would + base</b> — If I were rich, I would travel.<br>— Type 3 (regret) : <b>If + past perfect, would have + p.p.</b> — If you had studied, you would have passed.<br>— Jamais will/would DANS la subordonnée en if.</div>\n<h3>1. Type 1 : le conditionnel réel</h3>\n<div class=\"tip\"><b>Structure :</b> If + present simple, ... will/can/may + base.<br><i>If it rains tomorrow, we will cancel the picnic.</i><br><i>If you help me, I will finish faster.</i><br>Utilisé pour : conditions réalistes, avertissements, promesses, menaces : <i>If you touch that, you will burn yourself.</i><br>⚠️ Le présent suffit pour le futur dans la if-clause : <i>If it <b>rains</b></i> (PAS « if it will rain » ✗).</div>\n<h3>2. Type 2 : le conditionnel imaginaire</h3>\n<div class=\"tip\"><b>Structure :</b> If + past simple, ... would/could/might + base.<br><i>If I were you, I would apologise.</i> (je ne suis pas toi — irréel du présent)<br><i>If we had more time, we could visit the museum.</i><br><b>Were pour toutes les personnes :</b> <i>If I <b>were</b> you</i> (subjonctif ; « If I was » s'entend à l'oral mais le bac écrit <b>were</b>).<br>Utilisé pour : hypothèses irréelles ou improbables, conseils (<i>If I were you...</i>), rêves.</div>\n<h3>3. Type 3 : le regret sur le passé</h3>\n<div class=\"tip\"><b>Structure :</b> If + past perfect (had + p.p.), ... would have + p.p.<br><i>If you had told me, I would have helped you.</i> (tu ne m'as pas dit — trop tard)<br><i>She wouldn't have failed if she had revised.</i><br>Utilisé pour : reproches, regrets, passés alternatifs — ce qui aurait pu être.</div>\n<h3>4. Le tableau récapitulatif</h3>\n<table><tr><th>Type</th><th>If-clause</th><th>Principale</th><th>Sens</th></tr>\n<tr><td><b>1 — réel</b></td><td>présent</td><td>will + base</td><td>si (et c'est possible) : <i>If it rains, I'll stay.</i></td></tr>\n<tr><td><b>2 — imaginaire</b></td><td>past simple (were)</td><td>would + base</td><td>si (irréel) : <i>If I were you, I'd go.</i></td></tr>\n<tr><td><b>3 — regret</b></td><td>had + p.p.</td><td>would have + p.p.</td><td>si (trop tard) : <i>If I had known...</i></td></tr>\n<tr><td><b>mixte</b></td><td>had + p.p.</td><td>would + base</td><td>regret aux conséquences présentes : <i>If I had studied, I would be a doctor now.</i></td></tr></table>\n<div class=\"piege\">⚠️ <b>Piège n°1 :</b> « If it will rain » ✗ — jamais de will dans la if-clause (sauf si will = volonté : <i>If you will help me</i> = si tu veux bien).<br>⚠️ <b>Piège n°2 :</b> « If I would be you » ✗ → <i>If I were you</i>.<br>⚠️ <b>Piège n°3 :</b> mélanger les types : <i>If I had known, I would tell you</i> ✗ → <i>I would have told you</i> (type 3) ou <i>I would tell you</i> (mixte, avec now).<br>⚠️ L'inversion sans if : <b>Had I known...</b> = If I had known (style soutenu) ; <b>Were I you...</b> ; <b>Should you need help...</b> (= If you should need).</div>\n<h3>5. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — trois conseils à un ami</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écris 3 phrases : (1) réel — s'il pleut demain, le match sera annulé ; (2) imaginaire — à ta place, je m'excuserais ; (3) regret — si tu avais révisé, tu aurais réussi.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Type 1 (réel)</b> : pluie possible demain → If + présent : <i>If it <b>rains</b> tomorrow, the match <b>will be cancelled</b>.</i></div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Type 2 (imaginaire)</b> : je ne suis pas toi → past + would : <i><b>If I were you</b>, I <b>would apologise</b>.</i> (were, pas was, à l'écrit)</div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Type 3 (regret)</b> : c'est passé, trop tard → <i><b>If you had revised</b>, you <b>would have passed</b>.</i> — la clé : identifier la RÉALITÉ d'abord (possible ? irréel ? passé définitif ?) puis appliquer la structure : le sens choisit le type, la mécanique suit.</div></div></details>"},
{"id": "connecteurs-expression", "theme": "Connecteurs et expression écrite (Anglais — Lycée)", "niveau": "Lycée — Anglais", "titre": "Connecteurs et expression écrite", "cours": "<div class=\"cours-head\"><h2>Connecteurs et expression écrite</h2><p>However, moreover, therefore, although, despite... : les mots qui structurent un essay — la différence entre une liste de phrases et un texte argumenté.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— Addition : <b>moreover, furthermore, in addition, besides</b>.<br>— Opposition : <b>but, however, nevertheless, although, whereas, on the other hand</b>.<br>— Cause : <b>because, since, as, due to, owing to</b>.<br>— Conséquence : <b>therefore, so, consequently, as a result, thus</b>.<br>— But : <b>despite + NOM</b> / <b>although + PHRASE</b>.</div>\n<h3>1. Structurer un essay : le squelette</h3>\n<div class=\"tip\"><b>Introduction :</b> reformuler le sujet (<i>Nowadays, more and more people...</i>), annoncer le plan (<i>First, we will see... then...</i>).<br><b>Paragraphes :</b> un argument = un paragraphe, ouvert par un connecteur (<i>First of all / On the one hand / Moreover / On the other hand / However</i>).<br><b>Exemples :</b> <i>For instance, ... / For example, ... / such as</i>.<br><b>Conclusion :</b> <i>To conclude / All in all / In a nutshell</i> + opinion personnelle (<i>In my opinion, / As far as I am concerned,</i>).</div>\n<h3>2. Les connecteurs par fonction</h3>\n<table><tr><th>Fonction</th><th>Connecteurs</th><th>Exemple</th></tr>\n<tr><td><b>Addition</b></td><td>moreover, furthermore, in addition, besides, what is more</td><td><i>Moreover, social media create jobs.</i></td></tr>\n<tr><td><b>Opposition</b></td><td>however, nevertheless, on the other hand, whereas, in contrast</td><td><i>However, screens can isolate people.</i></td></tr>\n<tr><td><b>Concession</b></td><td>although, even though, despite, in spite of</td><td><i>Although it is useful, it is expensive.</i></td></tr>\n<tr><td><b>Cause</b></td><td>because, since, as, due to + nom, owing to</td><td><i>Due to the crisis, sales dropped.</i></td></tr>\n<tr><td><b>Conséquence</b></td><td>therefore, so, consequently, as a result, thus</td><td><i>Therefore, we must act now.</i></td></tr>\n<tr><td><b>But</b></td><td>but, yet</td><td><i>It is expensive, but worth it.</i></td></tr>\n<tr><td><b>Exemple</b></td><td>for instance, such as, notably</td><td><i>For instance, TikTok boomed.</i></td></tr>\n<tr><td><b>Conclusion</b></td><td>to conclude, all in all, in conclusion</td><td><i>To conclude, the debate is open.</i></td></tr></table>\n<h3>3. La distinction cruciale : mot + phrase ou mot + nom ?</h3>\n<div class=\"tip\"><b>+ PHRASE (sujet + verbe) :</b> although, even though, whereas, because, since, when, if : <i><b>Although</b> he was tired, he continued.</i><br><b>+ NOM ou gérondif :</b> despite, in spite of, due to, owing to, because of : <i><b>Despite</b> his tiredness, ... / <b>Despite being</b> tired, ...</i><br>⚠️ <i>Despite of</i> ✗ (jamais de of !) ; <i>Although his tiredness</i> ✗ (although exige une phrase).<br><b>However :</b> adverbe — précédé d'un point ou point-virgule, suivi d'une virgule : <i>It was late. <b>However,</b> we continued.</i> (PAS « It was late, however we continued » à éviter à l'écrit).</div>\n<div class=\"piege\">⚠️ Confondre <b>although</b> (+ phrase) et <b>despite</b> (+ nom).<br>⚠️ <b>despite of</b> n'existe pas (in spite OF, mais DESPITE tout court).<br>⚠️ <b>moreover</b> ≠ <b>nevertheless</b> : addition ≠ opposition.<br>⚠️ « Indeed » n'est pas « en effet » de liaison logique — il renforce ce qui précède.</div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le paragraphe gagnant</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sujet : « Les réseaux sociaux : outil ou danger ? » Écris un paragraphe d'opposition (2 arguments contre, 1 nuance) avec connecteurs.</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Ouvrir avec un annonceur</b> : <i><b>On the other hand</b>, social networks can be harmful.</i></div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Enchaîner avec addition + exemple</b> : <i><b>Moreover</b>, they can spread fake news. <b>For instance</b>, during the election, false stories circulated widely.</i></div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Nuancer avec concession</b> : <i><b>Although</b> these platforms connect people, they <b>therefore</b> require caution and critical thinking.</i> — la recette : annonceur (On the other hand) + addition (Moreover) + exemple (For instance) + concession (Although) : quatre connecteurs, un paragraphe complet, une note qui grimpe. L'examinateur ne note pas seulement les idées : il note le LIEN entre les idées.</div></div></details>"},
{"id": "civilisation-us-uk", "theme": "Civilisation britannique et américaine (Anglais — Lycée)", "niveau": "Lycée — Anglais", "titre": "Civilisation britannique et américaine", "cours": "<div class=\"cours-head\"><h2>Civilisation britannique et américaine</h2><p>Institutions, symboles et repères : UK (monarchie parlementaire, Westminster) et USA (président, Congrès, Constitution) — indispensables pour l'expression et la compréhension du bac.</p></div>\n<div class=\"chap-quick\"><b>Aperçu rapide</b><br>— UK : monarchie parlementaire — roi/reine (Head of State), Premier ministre (Head of Government), Parlement (Commons + Lords), absence de constitution écrite.<br>— USA : république fédérale — Président (à la fois chef de l'État et du gouvernement), Congrès (House + Senate), Constitution (1787), Bill of Rights.<br>— Élections : UK — général elections, First Past the Post ; USA — Electoral College, midterm elections.<br>— Symboles : Union Jack, Stars and Stripes, Uncle Sam, John Bull.</div>\n<h3>1. Le Royaume-Uni : institutions</h3>\n<div class=\"tip\"><b>Monarchie parlementaire :</b> le souverain (Charles III) est <i>Head of State</i> — rôle symbolique (« the King reigns but does not rule ») ; le pouvoir exécutif appartient au <b>Prime Minister</b> (Keir Starmer depuis 2024) et au Cabinet.<br><b>Le Parlement de Westminster :</b> la <b>House of Commons</b> (élue, 650 MPs — députés) et la <b>House of Lords</b> (non élue : lords temporels, spirituels, juges) ; les lois : a bill → Royal Assent → an Act.<br><b>Pas de constitution écrite</b> en un seul document : coutumes (conventions), lois fondatrices (Magna Carta 1215, Bill of Rights 1689), jurisprudence.<br><b>Partis :</b> Conservative Party (Tories), Labour Party, Liberal Democrats ; <i>First Past the Post</i> : le candidat arrivé en tête est élu (scrutin uninominal).<br><b>Décentralisation :</b> Parlements écossais (Holyrood), assemblées galloise et nord-irlandaise ; <b>Brexit</b> : référendum de 2016, sortie de l'UE le 31 janvier 2020.</div>\n<h3>2. Les États-Unis : institutions</h3>\n<div class=\"tip\"><b>République fédérale présidentielle :</b> le <b>Président</b> est chef de l'État ET du gouvernement (élu pour 4 ans, max 2 mandats — 22e amendement), via l'<b>Electoral College</b> (grands électeurs par État).<br><b>Congrès (Capitol)</b> bicaméral : <b>House of Representatives</b> (435, proportionnelle à la population, 2 ans) et <b>Senate</b> (100 : 2 par État, 6 ans).<br><b>Séparation des pouvoirs</b> (checks and balances) : le Président peut opposer son <i>veto</i> ; le Congrès peut <i>impeach</i> (mettre en accusation).<br><b>Constitution de 1787</b> + 27 amendements : le <b>Bill of Rights</b> (1791) garantit les libertés fondamentales (1er : liberté d'expression, de presse, de religion ; 2e : port d'armes ; 13e/14e/15e : abolition de l'esclavage, égalité, droit de vote).<br><b>Partis :</b> Democratic Party (âne), Republican Party (éléphant). <i>Midterm elections</i> : législatives à mi-mandat.</div>\n<h3>3. Repères et symboles</h3>\n<table><tr><th></th><th>UK</th><th>USA</th></tr>\n<tr><td><b>Drapeau</b></td><td>Union Jack</td><td>Stars and Stripes (50 étoiles, 13 bandes)</td></tr>\n<tr><td><b>Capitale(s)</b></td><td>London (Parliament : Westminster)</td><td>Washington D.C. (Capitol, White House)</td></tr>\n<tr><td><b>Chef</b></td><td>PM — 10 Downing Street</td><td>President — the White House, Oval Office</td></tr>\n<tr><td><b>Monnaie</b></td><td>pound sterling (£)</td><td>dollar ($)</td></tr>\n<tr><td><b>Personnification</b></td><td>John Bull</td><td>Uncle Sam</td></tr>\n<tr><td><b>Journée</b></td><td>Remembrance Day (11 Nov)</td><td>Independence Day (4 July)</td></tr></table>\n<div class=\"tip\"><b>Dates clés UK :</b> 1215 Magna Carta ; 1689 Bill of Rights ; 1833 abolition de l'esclavage ; 1918/1928 suffrage féminen ; 2016 référendum Brexit.<br><b>Dates clés USA :</b> 1776 Declaration of Independence (4 juillet) ; 1787 Constitution ; 1861-65 Civil War ; 1929 Wall Street Crash, New Deal (F. D. Roosevelt) ; 1955-68 Civil Rights Movement (M. L. King, « I have a dream » 1963) ; 2001 9/11.</div>\n<div class=\"piege\">⚠️ Ne pas confondre <b>England</b> (l'Angleterre, une des 4 nations) et <b>Great Britain</b> (Angleterre + Écosse + Pays de Galles) et <b>United Kingdom</b> (+ Irlande du Nord).<br>⚠️ Le Président américain n'est PAS élu au suffrage direct populaire : l'Electoral College peut faire gagner un candidat arrivé second en voix (2000, 2016).<br>⚠️ Washington D.C. ≠ l'État de Washington (nord-ouest, Seattle).</div>\n<h3>4. Illustration</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — utiliser la civilisation dans une intro d'essay</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sujet : « Is the British political system more democratic than the American one ? » Rédige une introduction (contexte + problématique + annonce du plan).</div>\n<div class=\"etu\"><b>Étape 1</b> — <b>Contexte avec repères précis</b> : <i>The United Kingdom is a parliamentary monarchy: the British people elect the 650 members of the House of Commons, and the leader of the majority becomes Prime Minister. In the United States, a federal republic, Americans elect their President indirectly through the Electoral College.</i></div>\n<div class=\"etu\"><b>Étape 2</b> — <b>Problématique</b> : <i>So which system reflects the people's will more faithfully?</i></div>\n<div class=\"etu\"><b>Étape 3</b> — <b>Annonce du plan</b> : <i>First, I will compare how each leader is elected; then I will examine the limits of both systems, from First Past the Post to the Electoral College.</i> — une intro qui cite des institutions exactes (Commons, Electoral College, First Past the Post) montre la « culture » attendue : la civilisation n'est pas un catalogue à réciter, c'est le matériel d'argumentation de l'essay — et à l'oral, elle alimente chaque question du jury.</div></div></details>"},

{"id": "present-tenses", "fiche": "<b>L'essentiel</b><br>— Present simple : habitudes, vérités, horaires → + <b>-s</b> à he/she/it ; négation/question avec <b>do/does</b>.<br>— Present continuous : action en cours, temporaire, futur proche → <b>am/is/are + -ing</b>.<br>— Verbes d'état (know, like, want...) : jamais au continuous.<br><b>Méthodes</b><br>— Repérer le marqueur (every day → simple ; now → continuous).<br>— Négation : do/does + verbe BASE (sans -s).<br><b>Pièges</b><br>— Oublier le -s ; mettre -s avec does ; « I am knowing »."},
{"id": "past-simple", "fiche": "<b>L'essentiel</b><br>— Past simple = action terminée dans un passé défini (yesterday, last..., ago, in...).<br>— Réguliers : + -ed ; irréguliers : à apprendre (go-went, see-saw...).<br>— Négation/question : <b>didn't/did + base</b> (le verbe ne se conjugue PLUS).<br>— was/were (être) et had (avoir) sont irréguliers et n'utilisent PAS did (Was he there? I had no idea).<br><b>Méthodes</b><br>— Repérer le marqueur pour confirmer le past simple.<br>— was/were : négation was not (wasn't)/were not (weren't), sans did.<br><b>Pièges</b><br>— didn't went ✗ / Did you saw ✗.<br>— He goed ✗ → He went.<br>— « Did you went? » : le plus grand classique du contrôle."},
{"id": "articles-quantifieurs", "fiche": "<b>L'essentiel</b><br>— a/an : indéfini, un seul ; an devant SON voyelle (an hour, a university).<br>— the : défini, connu ou unique ; instruments de musique (the piano) ; rivières, chaînes, pays composés.<br>— some (+) / any (- et ?) — Would you like some...? (offre).<br>— much + indénombrable ; many + pluriel ; a lot of + les deux.<br>— How much? (prix/quantité) vs How many? (nombre).<br><b>Méthodes</b><br>— Classer le nom : comptable ou pas ? puis choisir le quantifieur.<br>— Repérer le signe de la phrase (+/-/?) pour some/any.<br><b>Pièges</b><br>— an hour (h muet) / a university.<br>— some informations ✗ → some information.<br>— « any » oublié dans les questions (Do you have some? ✗)."},
{"id": "modaux", "fiche": "<b>L'essentiel</b><br>— Modal + BASE verbale (sans to, sans -s) ; question par inversion.<br>— can : capacité, permission, possibilité (could = politesse).<br>— must : obligation ; mustn't : interdiction ; don't have to : pas obligatoire.<br>— should : conseil ; shouldn't : déconseil.<br><b>Méthodes</b><br>— Identifier la nuance : interdit ? obligatoire ? conseillé ? facultatif ?<br>— Traduire mustn't par « il est interdit », PAS par « ce n'est pas nécessaire ».<br><b>Pièges</b><br>— can to swim ✗ / He musts ✗.<br>— mustn't ≠ don't have to.<br>— « Could you...? » = demande polie, pas passé."},
{"id": "comparatif-superlatif", "fiche": "<b>L'essentiel</b><br>— Courts : -er than / the -est (big → bigger → the biggest).<br>— Longs : more...than / the most... (beautiful, expensive, interesting).<br>— Irréguliers : good-better-best, bad-worse-worst, far-further-furthest, little-less-least.<br>— Égalité : as...as ; infériorité : less...than.<br>— Le superlatif prend TOUJOURS <b>the</b>.<br><b>Méthodes</b><br>— Compter les syllabes pour choisir -er ou more.<br>— Vérifier than (comparatif) et the (superlatif).<br><b>Pièges</b><br>— more taller ✗ (double marquage).<br>— gooder ✗ → better.<br>— than ≠ then."},
{"id": "futur", "fiche": "<b>L'essentiel</b><br>— will + base : décision spontanée, prédiction (opinion), promesse, offre. Contractions : 'll, won't.<br>— am/is/are + going to + base : intention/projet décidé avant, prédiction avec indices.<br>— Arrangements fixes → present continuous ; programmes → present simple.<br>— shall : suggestion (Shall we...?), britannique.<br><b>Méthodes</b><br>— Question-test : décidé avant (going to) ou maintenant (will) ?<br>— Indice visible → going to ; opinion pure → will.<br><b>Pièges</b><br>— she wills ✗ ; I going to play ✗.<br>— won't = will not (pas « don't will »)."},
{"id": "present-perfect", "fiche": "<b>L'essentiel</b><br>— have/has + participe passé ; Négation haven't/hasn't ; Question Have you...?<br>— Emplois : expérience (ever, never), résultat présent, hot news (just), situation inachevée (since/for).<br>— since = point de départ ; for = durée.<br>— just/already → affirmatif ; yet → question/négation.<br>— Past simple si date précise (yesterday, in 2018, last week).<br><b>Méthodes</b><br>— Test : la phrase a-t-elle un lien avec MAINTENANT ? → perfect ; détachée et datée ? → past simple.<br>— Apprendre les 3 formes des irréguliers (go-went-gone).<br><b>Pièges</b><br>— I live here for 5 years ✗ → I have lived here for 5 years.<br>— She has went ✗ → has gone.<br>— ever/never/just entre have et le p.p."},
{"id": "passif", "fiche": "<b>L'essentiel</b><br>— Passif = be (au temps de la phrase) + participe passé (+ by + agent facultatif).<br>— is/are done (présent), was/were done (passé), will be done (futur), has been done (perfect), must be done (modal), is being done (continuous).<br>— Le COD actif devient sujet passif.<br>— by + agent : souvent omis (inconnu/évident/peu important).<br><b>Méthodes</b><br>— Repérer le temps de l'actif pour conjuguer be.<br>— Verbe irrégulier → 3e colonne (written, stolen, found).<br><b>Pièges</b><br>— The room cleaned ✗ (be oublié).<br>— will be + p.p. (pas « will is »).<br>— get + p.p. = registre familier."},
{"id": "pronoms-relatifs", "fiche": "<b>L'essentiel</b><br>— who (personnes) / which (choses) / that (les deux, en déterminative).<br>— whose = possession ; where = lieu ; when = moment.<br>— Verbe conjugué après le relatif → SUJET (pas d'omission) ; sujet+verbe après → COMPLÉMENT (omission possible).<br>— Virgule = explicative : jamais that, jamais d'omission.<br>— whom : formel, après préposition (with whom).<br><b>Méthodes</b><br>— Regarder ce qui suit le pronom (verbe ? sujet ?).<br>— Chasser le doublon (the man that I saw him ✗).<br><b>Pièges</b><br>— who pour choses ✗ ; which pour personnes ✗.<br>— which peut reprendre toute une phrase (..., which surprised me)."},
{"id": "conditionals", "fiche": "<b>L'essentiel</b><br>— Type 1 : If + présent, will + base (réel, possible).<br>— Type 2 : If + past simple (were), would + base (irréel du présent).<br>— Type 3 : If + had + p.p., would have + p.p. (regret).<br>— Mixte : If + had + p.p., would + base ... now.<br>— JAMAIS will/would dans la if-clause.<br><b>Méthodes</b><br>— Se demander : la condition est-elle possible (1), imaginaire (2), définitivement passée (3) ?<br>— If I were you = conseil standard.<br><b>Pièges</b><br>— If it will rain ✗ ; If I would be you ✗.<br>— Inversions soutenues : Had I known / Were I you / Should you need."},
{"id": "connecteurs-expression", "fiche": "<b>L'essentiel</b><br>— Addition : moreover, furthermore, in addition.<br>— Opposition : however, nevertheless, on the other hand, whereas.<br>— Concession : although + PHRASE / despite + NOM.<br>— Cause : because, since, as / due to + nom.<br>— Conséquence : therefore, consequently, as a result.<br>— Exemple : for instance, such as. Conclusion : to conclude, all in all.<br><b>Méthodes</b><br>— Un argument = un paragraphe, ouvert par un connecteur.<br>— However : nouvelle phrase (point/virgule + However,).<br>— Vérifier ce qui suit le connecteur : une phrase ou un nom ?<br><b>Pièges</b><br>— despite of ✗ ; although + nom ✗.<br>— moreover (addition) ≠ nevertheless (opposition)."},
{"id": "civilisation-us-uk", "fiche": "<b>L'essentiel</b><br>— UK : monarchie parlementaire ; roi (Head of State) + PM (Head of Government) ; Parlement : Commons (élue) + Lords ; pas de constitution écrite unique ; scrutin First Past the Post ; Brexit (2016/2020).<br>— USA : république fédérale ; Président (chef d'État + gouvernement, 2 mandats max) élu via l'Electoral College ; Congrès : House (435) + Senate (100) ; Constitution 1787 + 27 amendements, Bill of Rights 1791 ; checks and balances, veto, impeachment.<br>— Dates : 1776 Declaration of Independence, 1787 Constitution, 1861-65 Civil War, 1963 « I have a dream » ; 1215 Magna Carta, 1689 Bill of Rights.<br><b>Méthodes</b><br>— Comparer les deux systèmes en tableau (chef, élection, parlement, constitution).<br>— Employer les termes exacts dans les essays (Commons, Electoral College...).<br><b>Pièges</b><br>— England ≠ Great Britain ≠ UK.<br>— Suffrage présidentiel : INDIRECT (Electoral College)."},

{"t": "Le présent : present simple et present continuous (Anglais — Collège)", "q": "Choisis la phrase correcte :", "c": ["She go to school every day.", "She going to school every day.", "She is go to school every day.", "She goes to school every day."], "a": 3, "e": "Habitude (« every day ») → present simple ; 3e personne → -s.", "d": "<b>Le réflexe du -s</b>.<div class='ex-detail'><u>Exemple rédigé</u> : analyse : « every day » = marqueur d'habitude → present simple : sujet « she » = 3e personne du singulier → on ajoute <b>-s</b> au verbe : <i>She go<b>es</b> to school every day.</i> (les verbes en -o prennent -es) : les autres options : « go » sans -s (faute type 1) ; « going » seul sans be (faute type 2) ; « is go » (le -ing manque) : à l'examen, éliminer d'abord les formes impossibles (be + base ✗ ; -ing sans be ✗) laisse en général deux choix — puis le marqueur décide.</div>"},
{"t": "Le présent : present simple et present continuous (Anglais — Collège)", "q": "Look! The children ___ football in the garden.", "c": ["play", "plays", "is playing", "are playing"], "a": 3, "e": "« Look! » + action en cours → present continuous ; sujet pluriel → are + playing.", "d": "<b>Le mot qui donne l'indice</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « Look! » = tu vois maintenant → l'action se déroule SOUS TES YEUX → present continuous : sujet « the children » = pluriel → <b>are</b> : <i>Look! The children <b>are playing</b> football in the garden.</i> : « is playing » serait correct avec un sujet singulier (the child) : la double vérification (marqueur puis accord be/sujet) est le réflexe à automatiser — le marqueur seul ne suffit pas.</div>"},
{"t": "Le présent : present simple et present continuous (Anglais — Collège)", "q": "La forme négative correcte de « He likes tea » :", "c": ["He don't like tea.", "He not like tea.", "He doesn't likes tea.", "He doesn't like tea."], "a": 3, "e": "does + not + verbe BASE : le -s part du verbe et se retrouve « dans » does.", "d": "<b>Le -s déménage</b>.<div class='ex-detail'><u>Exemple rédigé</u> : règle : à la négation, l'auxiliaire <b>does</b> prend le marqueur de 3e personne (does contient déjà le « s ») : le verbe revient à la base : <i>He <b>doesn't like</b> tea.</i> : « doesn't likes » double le -s (faute ultra-courrante en collège) ; « don't » serait correct avec I/you/we/they : mémo : <b>does</b> = le -s a déménagé dans l'auxiliaire.</div>"},
{"t": "Le présent : present simple et present continuous (Anglais — Collège)", "q": "Quelques verbes comme know, want, love ou need :", "c": ["s'emploient surtout au present continuous", "s'emploient toujours avec do", "n'existent pas au présent", "s'emploient surtout au present simple (ce sont des verbes d'état)"], "a": 3, "e": "Les verbes d'état décrivent un état, pas une action en cours : <i>I know him</i>, pas <i>I am knowing him</i> ✗.", "d": "<b>Des états, pas des actions</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « know » = un état mental durable : on SAIT, on ne « est en train de savoir » : liste à mémoriser (state verbs) : <i>know, believe, understand, remember, want, need, like, love, hate, prefer, own, belong, seem, mean</i> : tous au present simple pour parler de l'état présent : nuance amusante : certains passent au continuous avec un sens ACTIF : <i>I am thinking about my holidays</i> (réflexion en cours) vs <i>I think you are right</i> (opinion, état) : distinguer état/action est la clé.</div>"},
{"t": "Le présent : present simple et present continuous (Anglais — Collège)", "q": "« We are leaving for London tomorrow morning » est :", "c": ["une erreur", "du passé", "un present continuous (qui peut exprimer un futur proche et arranged — un projet décidé)", "un present simple"], "a": 2, "e": "Le present continuous exprime aussi un futur proche : un projet décidé et organisé (billet pris, date fixée).", "d": "<b>Le présent qui parle du futur</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le present continuous exprime un FUTUR PROCHE et ORGANISÉ (billets pris, décision faite) : <i>We <b>are leaving</b> for London tomorrow morning</i> = c'est prévu, arrange : nuance avec <i>We leave tomorrow</i> (present simple : horaire officiel, programme fixe — emplois du temps) : au collège, la règle pratique : projet personnel décidé → be + -ing ; horaire/schedule → present simple : ce « présent-futur » surprend au début — mais le français fait pareil : « on part demain » !</div>"},
{"t": "Le présent : present simple et present continuous (Anglais — Collège)", "q": "Choisis : « ___ your parents ___ TV every evening ? »", "c": ["Does / watch", "Are / watching", "Do / watch", "Does / watches"], "a": 2, "e": "Sujet pluriel (your parents) → do ; « every evening » = habitude → present simple.", "d": "<b>Deux questions en une</b>.<div class='ex-detail'><u>Exemple rédigé</u> : étape 1 : le sujet : « your parents » = THEY (pluriel) → auxiliaire <b>Do</b> : étape 2 : le marqueur « every evening » → habitude → present simple (pas continuous) : étape 3 : après do, le verbe reste à la base : <b>Do your parents watch</b> TV every evening? : le piège « Does/watches » mélange la 3e personne du singulier avec un sujet pluriel — la faute classique quand on apprend le -s : toujours vérifier le SUJET avant de choisir do ou does.</div>"},
{"t": "Le présent : present simple et present continuous (Anglais — Collège)", "q": "« I usually drink coffee, but today I ___ tea. »", "c": ["drank", "drink", "drinks", "am drinking"], "a": 3, "e": "« today » + exception temporaire en cours → present continuous.", "d": "<b>Le mais qui change tout</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la première moitié (« usually ») est au present simple : la seconde introduit une situation TEMPORAIRE (« but today ») → present continuous : <i>I usually drink coffee, but today I <b>am drinking</b> tea.</i> : ce type de phrase contrastive est un grand classique du contrôle : le réflexe : « usually » d'un côté, « today/now/at the moment » de l'autre → simple puis continuous : la traduction française (« je bois d'habitude... mais aujourd'hui je bois... ») n'aide pas : le français utilise le même présent — c'est l'ANGLAIS qui oblige à choisir.</div>"},
{"t": "Le présent : present simple et present continuous (Anglais — Collège)", "q": "La question correcte pour « He is watching a film » :", "c": ["Does he watching a film?", "He is watching a film?", "Do he watch a film?", "Is he watching a film?"], "a": 3, "e": "Question sur le continuous : inversion be + sujet : Is he watching...?", "d": "<b>Inverser le bon auxiliaire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la phrase contient déjà l'auxiliaire <b>is</b> : pour questionner, on INVERSE : <b>Is he</b> watching a film? : si la phrase était au present simple (<i>He watches a film</i>), il faudrait IMPORTER do/does (<i>Does he watch...?</i>) : la règle d'or : on interroge avec l'auxiliaire DÉJÀ présent ; s'il n'y en a pas (simple), on emprunte do/does : ce test rapide évite la moitié des fautes de question.</div>"},
{"t": "Le présent : present simple et present continuous (Anglais — Collège)", "q": "« Water boils at 100 degrees Celsius » est un exemple de present simple exprimant :", "c": ["une vérité générale (loi scientifique)", "une négation", "un projet futur", "une action en cours"], "a": 0, "e": "Le present simple énonce des vérités permanentes : lois scientifiques, définitions, caractéristiques.", "d": "<b>Le présent des lois</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « L'eau bout à 100 °C » : ce n'est NI une habitude NI une action en cours — c'est une VÉRITÉ PERMANENTE : le present simple est le temps des définitions et des lois (<i>The sun rises in the east. Paris is the capital of France. Cats catch mice.</i>) : pourquoi pas le continuous ? parce que le fait ne se déroule pas « maintenant » : il est TOUJOURS vrai : en rédaction, employer le simple pour les descriptions et lois donne un anglais solide — la faute inverse (continuous partout) sonne « touristique ».</div>"},
{"t": "Le présent : present simple et present continuous (Anglais — Collège)", "q": "Trouve la phrase correcte :", "c": ["Listen! The baby cries.", "Listen! The baby is cry.", "Listen! The baby cry.", "Listen! The baby is crying."], "a": 3, "e": "« Listen! » = action en cours → be + -ing ; sujet singulier → is.", "d": "<b>Trois vérifications, une réponse</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 1) marqueur : « Listen! » → l'action se produit MAINTENANT → continuous : 2) forme : be + verbe-ing (jamais « is cry » — le -ing est obligatoire) : 3) accord : « the baby » = il/elle → <b>is</b> : <i>Listen! The baby <b>is crying</b>.</i> : les distracteurs testent chacun une connaissance : le -ing manquant, le simple inadapté, l'accord : à l'examen, éliminer les formes impossible (be + base ✗) puis choisir selon le marqueur — la méthode systématique qui rapporte des points à chaque contrôle.</div>"},
{"t": "Le passé : past simple et récit (Anglais — Collège)", "q": "Le past simple de « go » :", "c": ["goed", "went", "goed out", "gone"], "a": 1, "e": "go est irrégulier : go → went (gone est le participe passé, utilisé avec have).", "d": "<b>Ir-régu-quoi ?</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la liste des irréguliers est le cœur du collège : go → <b>went</b> (hier) → <b>gone</b> (déjà parti — participe pour present perfect) : astuce de mémorisation : chanter, grouper par familles (go/went/gone — see/saw/seen — do/did/done — take/took/taken) : au contrôle, la question « past simple de go » veut UNE réponse : went : gone serait faux (c'est le participe) — et « goed » n'existe pas, même si l'anglais a des milliers de verbes réguliers, les plus COURANTS sont souvent irréguliers (c'est le piège).</div>"},
{"t": "Le passé : past simple et récit (Anglais — Collège)", "q": "Choisis : « We ___ to the beach last Sunday. »", "c": ["were go", "go", "went", "goed"], "a": 2, "e": "« last Sunday » = passé défini → past simple ; go → went.", "d": "<b>Le marqueur décide</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « last Sunday » place l'action à un moment DÉFINI et TERMINÉ du passé → past simple obligatoire : go étant irrégulier : <i>We <b>went</b> to the beach last Sunday.</i> : « go » resterait au présent (incohérent avec le marqueur), « goed » n'existe pas : la stratégie d'examen : repérer le marqueur (yesterday, last..., ago, in + date) — s'il y en a un, c'est past simple à 95 % : le marqueur est votre boussole.</div>"},
{"t": "Le passé : past simple et récit (Anglais — Collège)", "q": "La négation correcte : « She ___ her homework yesterday. »", "c": ["didn't do", "didn't done", "doesn't do", "didn't did"], "a": 0, "e": "didn't + base : do reste à la base (do), pas did ni done.", "d": "<b>Le double past killer</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « didn't did » cumule DEUX passés (did l'auxiliaire + did le verbe) : règle : didn't contient DÉJÀ le passé : le verbe redevient neutre (base) : <i>She <b>didn't do</b> her homework yesterday.</i> : la même logique pour tous les verbes : didn't go (pas didn't went), didn't see, didn't eat : cette règle (une seule marque de passé par phrase) est LA faute la plus fréquente de tout l'anglais de collège — la corriger vaut souvent un point complet au contrôle.</div>"},
{"t": "Le passé : past simple et récit (Anglais — Collège)", "q": "« ___ you ___ the film last night? »", "c": ["Do / saw", "Did / see", "Did / saw", "Did / seen"], "a": 1, "e": "Did + sujet + base : Did you see...?", "d": "<b>Question au passé : base obligatoire</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la question au past simple importe l'auxiliaire <b>did</b> : le verbe principal revient à la base (see, saw est interdit après did) : <i><b>Did</b> you <b>see</b> the film last night?</i> : réponse courte : <i>Yes, I did. / No, I didn't.</i> (on reprend l'auxiliaire, pas le verbe) : le trio faute/piege à retenir : Did you saw ✗, Did you seen ✗ → Did you see ✓ : la question d'examen la plus rentable du chapitre.</div>"},
{"t": "Le passé : past simple et récit (Anglais — Collège)", "q": "Le past simple de « stop » (régulier) :", "c": ["stopd", "stoped", "stopped", "stopping"], "a": 2, "e": "stop : voyelle brève + consonne finale → on double le p et on ajoute -ed : stopped.", "d": "<b>Doubler la consonne</b>.<div class='ex-detail'><u>Exemple rédigé</u> : règle d'orthographe : voyelle brève + consonne finale → on DOUBLE la consonne avant -ed : stop → <b>stopped</b> (prononcé « stopt » — une seule syllabe !) : mêmes familles : plan → planned, travel → travelled (anglais britannique), drop → dropped : attention : play → played (pas de doublement : « ay » est une voyelle longue) : astuce prononciation : -ed se prononce /t/ après une consonne sourde (stopped, watched), /d/ après sonore (played, arrived), /id/ après t/d (wanted, decided) : la prononciation est régulièrement testée à l'oral du brevet.</div>"},
{"t": "Le passé : past simple et récit (Anglais — Collège)", "q": "« They were at home » — la question est :", "c": ["Did they be at home?", "Did they were at home?", "Was they at home?", "Were they at home?"], "a": 3, "e": "be (was/were) forme sa question par inversion, SANS did : Were they...?", "d": "<b>be fait cavalier seul</b>.<div class='ex-detail'><u>Exemple rédigé</u> : was/were sont déjà des formes PASSÉES de be : elles s'inversent directement (Were you...? Was he...?) et se nient en wasn't/weren't : l'auxiliaire did ne s'emploie JAMAIS avec be au passé (<i>Did you were</i> ✗ est la faute type) : <i><b>Were</b> they at home? — Yes, they <b>were</b>.</i> : la même exception vaut pour have = possession au passé (<i>Did you have a car?</i> est correct à l'oral moderne, mais « I had no idea » se nie en « hadn't » dans l'anglais soigné) : retenir : <b>be s'inverse, il n'emprunte pas did</b>.</div>"},
{"t": "Le passé : past simple et récit (Anglais — Collège)", "q": "Quel marqueur n'est PAS compatible avec le past simple ?", "c": ["every summer", "yesterday", "two years ago", "last night"], "a": 0, "e": "« every summer » exprime une habitude → present simple : les trois autres placent l'action à un moment passé défini.", "d": "<b>Le marqueur espion</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le past simple exige un passé DÉFINI (terminé, daté) : yesterday ✓, last night ✓, two years ago ✓, in 1998 ✓, when I was ten ✓ : « every summer » = répétition → present simple (<i>We go to Spain every summer</i>) : la nuance : <i>We went to Spain every summer when I was a child</i> est correct — parce que l'habitude elle-même est PASSÉE et encadrée (« when I was a child ») : le marqueur seul ne décide pas toujours : il décide EN CONTEXTE — mais à l'examen, sans contexte, « every » signale le présent.</div>"},
{"t": "Le passé : past simple et récit (Anglais — Collège)", "q": "Complète : « She ___ born in 2008. »", "c": ["was", "is", "did", "had"], "a": 0, "e": "to be born (naître) : He/She was born — pas did, pas had.", "d": "<b>Naître au passé</b>.<div class='ex-detail'><u>Exemple rédigé</u> : « naître » = be born : au passé → was born (singulier) / were born (pluriel) : <i>She <b>was born</b> in 2008. They <b>were born</b> in France.</i> : les pièges : « did born » (did + verbe conjugué ✗), « is born » (présent ✗ — sauf pour un événement en train de se produire : « a baby is born ») : cette tournure est un incontournable des présentations personnelles (se présenter : nom, âge, lieu de naissance) — la maîtriser vaut des points à CHAQUE contrôle de l'année.</div>"},
{"t": "Le passé : past simple et récit (Anglais — Collège)", "q": "La prononciation de « -ed » dans « decided » :", "c": ["/id/", "/ed/", "/d/", "/t/"], "a": 0, "e": "Après d ou t, -ed se prononce /id/ (une syllabe de plus) : decided, wanted, ended.", "d": "<b>Trois prononciations, une règle</b>.<div class='ex-detail'><u>Exemple rédigé</u> : /t/ après consonne sourde : stopped, watched, looked : /d/ après consonne sonore : played, arrived, loved : /id/ après t ou d : decided, wanted, needed, ended : test rapide : mettre la main sur la gorge — si ça vibre (sonore), c'est /d/ ; sinon /t/ ; et toujours /id/ après t/d : la faute type à l'oral : prononcer « decid-ed » comme deux sons é ou oublier la syllabe (« decidd ») : l'oral du brevet écoute précisément cette distinction — trois groupes, dix mots à répéter, c'est appris pour trois ans.</div>"},
{"t": "Le passé : past simple et récit (Anglais — Collège)", "q": "« How much ___ it cost? » (hier, au magasin)", "c": ["did", "was", "does", "is"], "a": 0, "e": "Question au passé avec un verbe d'action (cost) → did + base : How much did it cost?", "d": "<b>L'auxiliaire disparaît, la base reste</b>.<div class='ex-detail'><u>Exemple rédigé</u> : contexte passé (hier) → past simple : le verbe cost est un verbe normal (pas be) → did : <i>How much <b>did</b> it cost?</i> (le verbe reste à la base : cost, pas « costed » — cost est irrégulier et INVARIANT : cost/cost/cost) : la question complète : How much did it cost? — Yes, it cost 20 £ : les questions avec how much/where/when + did sont la base des mini-dialogues d'examen (shopping, voyage) : automatiser « wh- + did + sujet + base » et la moitié de l'épreuve orale est gagnée.</div>"},
{"t": "Articles et quantifieurs : a, an, the, some, any (Anglais — Collège)", "q": "Choisis : « She is ___ honest girl. »", "c": ["an", "the", "a", "some"], "a": 0, "e": "honest commence par un son vocalique (h muet) → an.", "d": "<b>Le h qui se tait</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la règle porte sur le SON : « honest » se prononce « onnest » (le h est muet, comme en français « l'honneur ») : la première syllabe entendue est une VOYELLE → <b>an</b> : <i>She is <b>an</b> honest girl.</i> : mêmes familles : an hour, an heir, an honour : l'inverse existe aussi : <i>a university</i> (« you-niversity », son consonantique), <i>a one-way street</i> (« ouane ») : à l'examen, prononcer le mot dans sa tête AVANT de choisir a/an — c'est l'astuce infaillible.</div>"},
