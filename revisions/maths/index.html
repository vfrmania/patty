var PROGRAMME = [{"n": "Collège — 6e", "ch": [{"t": "Nombres entiers et décimaux : opérations, divisibilité", "id": null}, {"t": "Fractions : comparaison, addition, soustraction", "id": null}, {"t": "Proportionnalité et pourcentages", "id": null}, {"t": "Géométrie de base : figures, angles, symétries", "id": null}, {"t": "Périmètres et aires", "id": null}]}, {"n": "Collège — 5e", "ch": [{"t": "Nombres relatifs : repérage, addition, soustraction", "id": null}, {"t": "Premières expressions littérales et simplification", "id": null}, {"t": "Triangles : somme des angles, inégalité triangulaire", "id": null}, {"t": "Parallélogrammes et quadrilatères", "id": null}, {"t": "Statistiques : organisation et lecture de données", "id": null}]}, {"n": "Collège — 4e", "ch": [{"t": "Puissances et écriture scientifique", "id": "puissances"}, {"t": "Théorème de Pythagore et sa réciproque", "id": "pythagore"}, {"t": "Théorème des milieux et droite des milieux", "id": "milieux"}, {"t": "Calcul littéral : distributivité, réduction", "id": "calcul-litteral"}, {"t": "Équations du premier degré à une inconnue", "id": "equations"}, {"t": "Proportionnalité : vitesses, échelles", "id": "proportionnalite"}, {"t": "Pyramides et cônes : volumes", "id": "pyramides"}]}, {"n": "Collège — 3e", "ch": [{"t": "Théorème de Thalès et sa réciproque", "id": null}, {"t": "Trigonométrie dans le triangle rectangle (cos, sin, tan)", "id": null}, {"t": "Racines carrées et calculs associés", "id": null}, {"t": "Développement et factorisation, identités remarquables", "id": null}, {"t": "Notion de fonction : image, antécédent, lecture graphique", "id": null}, {"t": "Statistiques : moyennes, médiane, étendue", "id": null}, {"t": "Sphères et sections de solides ; rotation et translation", "id": null}]}, {"n": "Lycée — 2de", "ch": [{"t": "Ensembles de nombres (N, Z, Q, R) et calcul littéral", "id": null}, {"t": "Fonctions de référence : carré, cube, inverse, racine", "id": null}, {"t": "Fonctions : variations, extremums, lectures graphiques", "id": null}, {"t": "Vecteurs et géométrie repérée", "id": null}, {"t": "Statistiques descriptives : quartiles, écart type", "id": null}, {"t": "Probabilités : événements, calculs de base", "id": null}, {"t": "Configurations du plan et trigonométrie (sinus, cosinus)", "id": null}]}, {"n": "Lycée — 1re", "ch": [{"t": "Second degré : discriminant, forme canonique, factorisation", "id": null}, {"t": "Dérivation : nombre dérivé, tangentes, dérivées usuelles", "id": "derivation"}, {"t": "Dérivation : opérations et étude des variations", "id": null}, {"t": "Suites arithmétiques et géométriques", "id": null}, {"t": "Probabilités conditionnelles et indépendance", "id": null}, {"t": "Produit scalaire et applications", "id": null}, {"t": "Variables aléatoires, espérance, variance", "id": null}]}, {"n": "Lycée — Terminale (spécialité)", "ch": [{"t": "Suites : récurrence, convergence, limites", "id": null}, {"t": "Limites de fonctions et asymptotes", "id": null}, {"t": "Continuité et théorème des valeurs intermédiaires", "id": null}, {"t": "Primitives et calcul intégral", "id": null}, {"t": "Logarithmes népériens et exponentielles", "id": null}, {"t": "Lois de probabilité : binomiale, normale", "id": null}, {"t": "Équations différentielles", "id": null}, {"t": "Arithmétique et matrices (maths expertes)", "id": null}]}];
var COURS_META = [{"id": "pythagore", "theme": "Pythagore (collège)", "niveau": "4e", "titre": "Théorème de Pythagore", "cours": "<div class=\"cours-head\"><h2>Théorème de Pythagore</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Vocabulaire</h3>\n<p>Dans un triangle rectangle, l'hypoténuse est le côté opposé à l'angle droit. C'est <b>toujours le côté le plus long</b>. Le théorème de Pythagore ne s'applique <b>que dans un triangle rectangle</b>.</p>\n<h3>2. L'énoncé du théorème</h3>\n<div class=\"tip\"><b>Théorème :</b> si un triangle est rectangle, alors le carré de l'hypoténuse est égal à la somme des carrés des deux autres côtés.<br>Si ABC est rectangle en A : <b>BC² = AB² + AC²</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — appliquer le théorème pour calculer une longueur</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ABC est un triangle rectangle en A avec AB = 8 cm et AC = 15 cm. Calculer la longueur BC.</div><div class=\"etu\"><b>Étape 1</b> — <b>Identifier la figure</b> : le triangle est rectangle en A, donc l'hypoténuse est BC, le côté opposé à l'angle droit.</div><div class=\"etu\"><b>Étape 2</b> — <b>Écrire l'égalité de Pythagore</b> : BC² = AB² + AC².</div><div class=\"etu\"><b>Étape 3</b> — <b>Remplacer par les valeurs</b> : BC² = 8² + 15² = 64 + 225 = 289.</div><div class=\"etu\"><b>Étape 4</b> — <b>Prendre la racine carrée</b> : BC = √289 = <b>17 cm</b>.</div><div class=\"etu\"><b>Étape 5</b> — <b>Vérifier la cohérence</b> : 17 &gt; 15 &gt; 8, l'hypoténuse est bien le côté le plus long. (On reconnaît le triplet (8 ; 15 ; 17).)</div></div></details>\n<h3>3. Calculer une longueur</h3>\n<div class=\"ex\"><b>Exemple 1 — calcul de l'hypoténuse :</b> ABC rectangle en A, AB = 3 cm, AC = 4 cm. Alors BC² = 3² + 4² = 9 + 16 = 25, donc BC = √25 = <b>5 cm</b>.</div>\n<div class=\"ex\"><b>Exemple 2 — calcul d'un côté de l'angle droit :</b> ABC rectangle en A, BC = 13 cm, AC = 5 cm. Alors AB² = BC² − AC² = 169 − 25 = 144, donc AB = √144 = <b>12 cm</b>.</div>\n<h3>4. Réciproque et contraposée</h3>\n<div class=\"tip\"><b>Réciproque :</b> si, dans un triangle, le carré du plus long côté est égal à la somme des carrés des deux autres, alors ce triangle est rectangle (l'angle droit est opposé au plus long côté).</div>\n<div class=\"ex\"><b>Exemple :</b> triangle de côtés 6 ; 8 ; 10. On a 10² = 100 et 6² + 8² = 36 + 64 = 100. Le triangle est donc rectangle.</div>\n<div class=\"warn\"><b>Contraposée (pour démontrer qu'un triangle n'est PAS rectangle) :</b> si BC² ≠ AB² + AC², alors le triangle ABC n'est pas rectangle.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — prouver qu'un triangle est rectangle (réciproque)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le triangle EFG a pour côtés EF = 9, FG = 12 et GE = 15. Ce triangle est-il rectangle ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Repérer le plus long côté</b> : c'est GE = 15. Si le triangle est rectangle, l'angle droit est opposé à GE, donc en F.</div><div class=\"etu\"><b>Étape 2</b> — <b>Calculer le carré du plus long côté</b> : GE² = 15² = 225.</div><div class=\"etu\"><b>Étape 3</b> — <b>Calculer la somme des carrés des deux autres</b> : EF² + FG² = 9² + 12² = 81 + 144 = 225.</div><div class=\"etu\"><b>Étape 4</b> — <b>Comparer</b> : 225 = 225, l'égalité est vérifiée.</div><div class=\"etu\"><b>Étape 5</b> — <b>Conclure avec la réciproque</b> : « D'après la réciproque du théorème de Pythagore, le triangle EFG est rectangle en F. »</div></div></details>\n<h3>5. Applications</h3>\n<ul>\n<li><b>Démontrer qu'un triangle est rectangle</b> (réciproque) ou ne l'est pas (contraposée).</li>\n<li><b>Calculs de distances</b> : diagonale d'un rectangle (√(L² + l²)), hauteur dans un carré, déplacements « en escalier » (le plus court chemin est la diagonale).</li>\n<li>Base de la <b>trigonométrie</b> et du calcul de distances en géométrie repérée : distance entre deux points M(x<sub>M</sub>; y<sub>M</sub>) et N(x<sub>N</sub>; y<sub>N</sub>) : MN = √((x<sub>N</sub> − x<sub>M</sub>)² + (y<sub>N</sub> − y<sub>M</sub>)²).</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer une diagonale (application concrète)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un écran rectangulaire mesure 48 cm sur 20 cm. Quelle est la longueur de sa diagonale ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Modéliser</b> : la diagonale d du rectangle partage celui-ci en deux triangles rectangles de côtés 48 et 20 ; d est l'hypoténuse.</div><div class=\"etu\"><b>Étape 2</b> — <b>Appliquer le théorème</b> : d² = 48² + 20².</div><div class=\"etu\"><b>Étape 3</b> — <b>Calculer</b> : d² = 2304 + 400 = 2704.</div><div class=\"etu\"><b>Étape 4</b> — <b>Prendre la racine</b> : d = √2704 = <b>52 cm</b>.</div><div class=\"etu\"><b>Étape 5</b> — <b>Vérifier l'ordre de grandeur</b> : 52 &lt; 48 + 20 = 68 ✓ (la diagonale est plus courte que le trajet en « escalier »).</div></div></details>\n<h3>6. Triplets pythagoriciens à connaître</h3>\n<table><tr><th>Triplet</th><th>Vérification</th></tr>\n<tr><td>(3 ; 4 ; 5)</td><td>9 + 16 = 25</td></tr>\n<tr><td>(5 ; 12 ; 13)</td><td>25 + 144 = 169</td></tr>\n<tr><td>(8 ; 15 ; 17)</td><td>64 + 225 = 289</td></tr>\n<tr><td>(6 ; 8 ; 10)</td><td>36 + 64 = 100 (= (3;4;5) × 2)</td></tr></table>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b><ul>\n<li>Confondre le théorème (triangle <i>déjà</i> rectangle → calcul) et la réciproque (on <i>vérifie</i> s'il l'est).</li>\n<li>Écrire BC² = AB² + AC² dans un triangle rectangle en B (c'est AC² = AB² + BC² : l'hypoténuse est le côté qui apparaît <b>seul</b>).</li>\n<li>Oublier la racine carrée : BC² = 25 signifie BC = 5, pas 25.</li>\n<li>Donner une longueur négative : une longueur est toujours positive, on prend la racine carrée positive.</li></ul></div>"}, {"id": "derivation", "theme": "Dérivation (1re)", "niveau": "1re", "titre": "Dérivation", "cours": "<div class=\"cours-head\"><h2>Dérivation</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Nombre dérivé et taux d'accroissement</h3>\n<p>Soit f une fonction définie sur un intervalle I et a ∈ I. Le <b>taux d'accroissement</b> de f entre a et a + h est :</p>\n<div class=\"tip\">T(h) = (f(a + h) − f(a)) / h</div>\n<p>Si T(h) tend vers une limite finie ℓ quand h tend vers 0, on dit que f est <b>dérivable en a</b> et ℓ = <b>f′(a)</b>, le nombre dérivé de f en a.</p>\n<div class=\"ex\"><b>Exemple :</b> f(x) = x², a = 1. T(h) = ((1+h)² − 1)/h = (2h + h²)/h = 2 + h → 2 quand h → 0. Donc f′(1) = 2.</div>\n<h3>2. Interprétation géométrique : la tangente</h3>\n<div class=\"tip\"><b>Tangente en a :</b> la tangente à la courbe de f au point d'abscisse a est la droite d'équation <b>y = f′(a)(x − a) + f(a)</b>. Son coefficient directeur est f′(a).</div>\n<p>La tangente est la « meilleure approximation affine » de f au voisinage de a : f(a + h) ≈ f(a) + h·f′(a).</p>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer un nombre dérivé puis l'équation de la tangente</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit f(x) = x². Calculer f′(3) à l'aide du taux d'accroissement, puis donner l'équation de la tangente à la courbe de f au point d'abscisse 3.</div><div class=\"etu\"><b>Étape 1</b> — <b>Écrire le taux d'accroissement</b> : T(h) = (f(3 + h) − f(3)) / h.</div><div class=\"etu\"><b>Étape 2</b> — <b>Développer le numérateur</b> : f(3 + h) = (3 + h)² = 9 + 6h + h² et f(3) = 9, donc f(3 + h) − f(3) = 6h + h².</div><div class=\"etu\"><b>Étape 3</b> — <b>Simplifier</b> : T(h) = (6h + h²) / h = 6 + h.</div><div class=\"etu\"><b>Étape 4</b> — <b>Faire tendre h vers 0</b> : 6 + h → 6, donc f′(3) = <b>6</b>.</div><div class=\"etu\"><b>Étape 5</b> — <b>Équation de la tangente</b> : y = f′(3)(x − 3) + f(3) = 6(x − 3) + 9 = <b>6x − 9</b>.</div><div class=\"etu\"><b>Étape 6</b> — <b>Vérifier</b> : en x = 3, la droite donne y = 9 = f(3) ✓ et sa pente vaut 6 = f′(3) ✓.</div></div></details>\n<h3>3. Dérivées des fonctions usuelles</h3>\n<table><tr><th>f(x)</th><th>f′(x)</th><th>Valable sur</th></tr>\n<tr><td>x<sup>n</sup> (n ∈ N*)</td><td>n·x<sup>n−1</sup></td><td>ℝ</td></tr>\n<tr><td>1/x</td><td>−1/x²</td><td>ℝ \\ {0} = ]−∞;0[ ∪ ]0;+∞[</td></tr>\n<tr><td>√x</td><td>1/(2√x)</td><td>]0; +∞[</td></tr>\n<tr><td>cos(x)</td><td>−sin(x)</td><td>ℝ</td></tr>\n<tr><td>sin(x)</td><td>cos(x)</td><td>ℝ</td></tr>\n<tr><td>x ↦ x</td><td>1</td><td>ℝ</td></tr>\n<tr><td>k (constante)</td><td>0</td><td>ℝ</td></tr></table>\n<h3>4. Opérations sur les dérivées</h3>\n<table><tr><th>Fonction</th><th>Dérivée</th><th>Conditions</th></tr>\n<tr><td>u + v</td><td>u′ + v′</td><td>u et v dérivables</td></tr>\n<tr><td>k·u (k constante)</td><td>k·u′</td><td>u dérivable</td></tr>\n<tr><td>u × v</td><td>u′v + uv′</td><td>u et v dérivables</td></tr>\n<tr><td>1/v</td><td>−v′/v²</td><td>v dérivable et v ≠ 0</td></tr>\n<tr><td>u/v</td><td>(u′v − uv′)/v²</td><td>v dérivable et v ≠ 0</td></tr>\n<tr><td>u(niveau entier) : u<sup>n</sup></td><td>n·u′·u<sup>n−1</sup></td><td>u dérivable</td></tr>\n<tr><td>√u</td><td>u′/(2√u)</td><td>u dérivable et u > 0</td></tr></table>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — dériver un quotient avec la formule (u/v)′</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit g(x) = (x² + 1)/(x − 2). Dériver g sur son domaine de définition.</div><div class=\"etu\"><b>Étape 1</b> — <b>Vérifier le domaine</b> : il faut x − 2 ≠ 0, donc g est définie sur ]−∞ ; 2[ ∪ ]2 ; +∞[.</div><div class=\"etu\"><b>Étape 2</b> — <b>Identifier la forme</b> : quotient u/v avec u(x) = x² + 1 et v(x) = x − 2.</div><div class=\"etu\"><b>Étape 3</b> — <b>Dériver u et v séparément</b> : u′(x) = 2x et v′(x) = 1.</div><div class=\"etu\"><b>Étape 4</b> — <b>Appliquer la formule</b> : (u/v)′ = (u′v − uv′)/v² — attention à l'ordre du numérateur !</div><div class=\"etu\"><b>Étape 5</b> — <b>Remplacer</b> : g′(x) = (2x(x − 2) − (x² + 1) × 1) / (x − 2)².</div><div class=\"etu\"><b>Étape 6</b> — <b>Développer et réduire le numérateur</b> : 2x² − 4x − x² − 1 = x² − 4x − 1.</div><div class=\"etu\"><b>Étape 7</b> — <b>Conclure</b> : g′(x) = (x² − 4x − 1)/(x − 2)², valable sur ]−∞ ; 2[ ∪ ]2 ; +∞[.</div></div></details>\n<h3>5. Lien dérivée / variations</h3>\n<ul>\n<li>Si f′(x) &gt; 0 sur un intervalle, alors f est <b>strictement croissante</b> sur cet intervalle.</li>\n<li>Si f′(x) &lt; 0, f est <b>strictement décroissante</b>.</li>\n<li>Si f′(x) = 0 sur un intervalle, f est <b>constante</b>.</li>\n<li>Si f′ s'annule et <b>change de signe</b> en a : f présente un <b>extremum local</b> en a (maximum si f′ passe de + à −, minimum si de − à +).</li>\n</ul>\n<div class=\"warn\"><b>Attention :</b> f′(a) = 0 ne suffit pas pour un extremum : il faut que la dérivée <b>change de signe</b> (ex. f(x) = x³ en 0 : f′(0) = 0 mais pas d'extremum, la fonction reste croissante).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — étudier les variations d'une fonction (méthode complète)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Étudier les variations de f(x) = x³ − 3x sur ℝ et déterminer ses extremums locaux.</div><div class=\"etu\"><b>Étape 1</b> — <b>Dériver</b> : f′(x) = 3x² − 3.</div><div class=\"etu\"><b>Étape 2</b> — <b>Factoriser f′ pour étudier son signe</b> : f′(x) = 3(x² − 1) = 3(x − 1)(x + 1).</div><div class=\"etu\"><b>Étape 3</b> — <b>Signe de chaque facteur</b> : (x + 1) s'annule en −1, (x − 1) s'annule en 1 ; on dresse le tableau de signes du produit.</div><div class=\"etu\"><b>Étape 4</b> — <b>En déduire le signe de f′</b> : f′ &gt; 0 sur ]−∞ ; −1[, f′ &lt; 0 sur ]−1 ; 1[, f′ &gt; 0 sur ]1 ; +∞[.</div><div class=\"etu\"><b>Étape 5</b> — <b>En déduire les variations de f</b> : f croît sur ]−∞ ; −1], décroît sur [−1 ; 1], puis recroît sur [1 ; +∞[.</div><div class=\"etu\"><b>Étape 6</b> — <b>Extremums (changement de signe de f′)</b> : en −1, f′ passe de + à − → maximum local f(−1) = (−1)³ − 3×(−1) = <b>2</b> ; en 1, f′ passe de − à + → minimum local f(1) = 1 − 3 = <b>−2</b>.</div></div></details>\n<h3>6. Méthode type d'étude de fonction</h3>\n<ul>\n<li>① Domaine de définition ;</li>\n<li>② Calcul de f′(x) (développer/factoriser pour étudier son signe) ;</li>\n<li>③ Tableau de signes de f′ ;</li>\n<li>④ Tableau de variations de f (f′ positive → flèche montante) ;</li>\n<li>⑤ Extremums locaux le cas échéant.</li>\n</ul>\n<div class=\"ex\"><b>Exemple :</b> f(x) = x³ − 3x sur ℝ. f′(x) = 3x² − 3 = 3(x − 1)(x + 1). f′ &gt; 0 sur ]−∞;−1[ ∪ ]1;+∞[, f′ &lt; 0 sur ]−1;1[. Donc f croît, décroît, recroît : maximum local en −1 (f(−1) = 2), minimum local en 1 (f(1) = −2).</div>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b><ul>\n<li>(uv)′ n'est PAS u′v′ : c'est u′v + uv′.</li>\n<li>(u/v)′ : l'ordre dans « u′v − uv′ » compte (au numérateur) ; le dénominateur est v².</li>\n<li>(1/x)′ = −1/x² (le signe − est souvent oublié) ; (√x)′ = 1/(2√x) (le 2 aussi).</li>\n<li>Une fonction peut être dérivable partout sauf en un point (ex. √x en 0 : la tangente est verticale, f n'est pas dérivable en 0).</li>\n<li>Dérivable ⇒ continue, mais continue ⇏ dérivable (ex. valeur absolue en 0).</li></ul></div>"},
{"id": "puissances", "theme": "Puissances (collège)", "niveau": "4e", "titre": "Puissances et écriture scientifique", "cours": "<div class=\"cours-head\"><h2>Puissances et écriture scientifique</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La notation aⁿ</h3>\n<p>Pour raccourcir les produits répétés, on utilise les <b>puissances</b> : aⁿ désigne le produit de n facteurs égaux à a. Le nombre n est l'<b>exposant</b>, a est la <b>base</b>.</p>\n<div class=\"tip\"><b>Définition :</b> aⁿ = a × a × … × a (n facteurs), avec a¹ = a et a⁰ = 1 (si a ≠ 0).<br>Exemples : 2⁵ = 2×2×2×2×2 = 32 ; 3⁴ = 81 ; 7⁰ = 1.</p></div>\n<p>Le <b>carré</b> a² et le <b>cube</b> a³ servent pour les aires et les volumes : côté² pour une aire, côté³ pour un volume.</p>\n<p>Attention au placement du signe : (−2)⁴ = (−2)×(−2)×(−2)×(−2) = <b>16</b>, mais −2⁴ = −(2⁴) = <b>−16</b>. Les parenthèses changent tout !</p>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer une puissance avec un signe moins</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer A = (−3)³ et B = −3⁴.</div><div class=\"etu\"><b>Étape 1</b> — <b>A = (−3)³</b> : la base est −3, prise 3 fois : (−3)×(−3)×(−3) = 9×(−3) = <b>−27</b>. Exposant impair → signe conservé.</div><div class=\"etu\"><b>Étape 2</b> — <b>B = −3⁴</b> : la base est 3 (le signe « − » est devant) : −(3×3×3×3) = <b>−81</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : A = −27 et B = −81. La présence ou l'absence de parenthèses autour de −3 donne deux résultats différents.</div></div></details>\n<h3>2. Les règles de calcul sur les puissances</h3>\n<div class=\"tip\"><b>Les 3 règles à connaître :</b><br>• Produit : aᵐ × aⁿ = aᵐ⁺ⁿ (on additionne les exposants)<br>• Quotient : aᵐ ÷ aⁿ = aᵐ⁻ⁿ (on soustrait les exposants)<br>• Puissance de puissance : (aᵐ)ⁿ = aᵐˣⁿ (on multiplie les exposants)</div>\n<p>Ces règles ne valent que si la <b>base est la même</b>. Elles servent à simplifier sans tout recalculer.</p>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — simplifier avec les règles</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Simplifier A = 2³ × 2⁵ puis B = 7⁸ ÷ 7⁵, puis C = (5²)⁴.</div><div class=\"etu\"><b>Étape 1</b> — <b>Produit</b> : même base 2, donc A = 2³⁺⁵ = 2⁸ = 256. On n'a PAS multiplié les exposants (2³ × 2⁵ ≠ 2¹⁵).</div><div class=\"etu\"><b>Étape 2</b> — <b>Quotient</b> : B = 7⁸⁻⁵ = 7³ = 343.</div><div class=\"etu\"><b>Étape 3</b> — <b>Puissance de puissance</b> : C = 5²ˣ⁴ = 5⁸. Ici on multiplie les exposants.</div><div class=\"etu\"><b>Étape 4</b> — <b>Retenir</b> : × → on additionne ; ÷ → on soustrait ; ( )ⁿ → on multiplie. Trois situations, trois opérations.</div></div></details>\n<h3>3. Les puissances de 10</h3>\n<p>10ⁿ = 1 suivi de n zéros (10³ = 1000) et 10⁻ⁿ = 0,0…01 avec n chiffres après la virgule (10⁻³ = 0,001).</p>\n<p>Multiplier par 10ⁿ déplace la virgule de n rangs vers la droite ; multiplier par 10⁻ⁿ la déplace de n rangs vers la gauche.</p>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer avec des puissances de 10</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer A = 3 × 10⁵ × 4 × 10⁻³.</div><div class=\"etu\"><b>Étape 1</b> — <b>Regrouper</b> : d'un côté les nombres, de l'autre les puissances : A = (3 × 4) × (10⁵ × 10⁻³).</div><div class=\"etu\"><b>Étape 2</b> — <b>Calculer chaque morceau</b> : 3 × 4 = 12 ; 10⁵ × 10⁻³ = 10⁵⁺⁽⁻³⁾ = 10².</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : A = 12 × 10² = <b>1200</b>. Vérification d'ordre de grandeur : 300 000 × 0,004 = 1200 ✓.</div></div></details>\n<h3>4. L'écriture scientifique</h3>\n<div class=\"tip\"><b>Définition :</b> l'écriture scientifique d'un nombre est a × 10ⁿ avec <b>1 ≤ a < 10</b> et n un entier. Elle est unique et sert à écrire les très grands ou très petits nombres (sciences, astronomie…).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — mettre un nombre en écriture scientifique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Écrire 48 500 et 0,00027 en écriture scientifique.</div><div class=\"etu\"><b>Étape 1</b> — <b>48 500</b> : placer la virgule pour obtenir un nombre entre 1 et 10 : 4,85. La virgule a bougé de 4 rangs vers la gauche, donc 48 500 = <b>4,85 × 10⁴</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>0,00027</b> : 2,7 est entre 1 et 10 ; la virgule a bougé de 4 rangs vers la droite, donc 0,00027 = <b>2,7 × 10⁻⁴</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Vérifier</b> : 4,85 × 10⁴ = 4,85 × 10 000 = 48 500 ✓ ; 2,7 × 10⁻⁴ = 2,7 ÷ 10 000 = 0,00027 ✓.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> 2³ × 2² = 2⁵ (pas 4⁵ ni 2⁶) ; 5⁰ = 1 ; (−2)⁴ = 16 mais −2⁴ = −16 ; 3⁸ ÷ 3⁶ = 3² (on soustrait, on ne divise pas les exposants).</div>"},
{"id": "milieux", "theme": "Droite des milieux (collège)", "niveau": "4e", "titre": "Théorème des milieux et droite des milieux", "cours": "<div class=\"cours-head\"><h2>Théorème des milieux et droite des milieux</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La droite des milieux</h3>\n<p>Dans un triangle ABC, si I est le milieu de [AB] et J le milieu de [AC], alors le segment [IJ] est appelé <b>segment des milieux</b>.</p>\n<div class=\"tip\"><b>Théorème 1 (parallélisme) :</b> si une droite passe par les milieux de deux côtés d'un triangle, alors elle est <b>parallèle au troisième côté</b>.<br>Si I milieu de [AB] et J milieu de [AC], alors (IJ) ∥ (BC).</div>\n<h3>2. La longueur du segment des milieux</h3>\n<div class=\"tip\"><b>Théorème 2 (longueur) :</b> le segment qui joint les milieux de deux côtés mesure <b>la moitié du troisième côté</b> : IJ = BC/2.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — utiliser la longueur des milieux</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans le triangle ABC, I est le milieu de [AB], J celui de [AC]. On donne BC = 12 cm et IJ = 5 cm. Est-ce possible ? Sinon, corriger.</div><div class=\"etu\"><b>Étape 1</b> — <b>Appliquer le théorème</b> : [IJ] joint les milieux de deux côtés, donc IJ = BC/2 = 12/2 = 6 cm.</div><div class=\"etu\"><b>Étape 2</b> — <b>Comparer</b> : l'énoncé annonce IJ = 5 cm, mais le théorème impose IJ = 6 cm : les données sont incompatibles.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : impossible ; si BC = 12, alors nécessairement IJ = 6. Réciproquement, si IJ = 5, alors BC = 2×5 = 10.</div></div></details>\n<h3>3. La réciproque : retrouver un milieu</h3>\n<div class=\"tip\"><b>Propriété :</b> si une droite passe par le milieu d'un côté et est <b>parallèle à un deuxième côté</b>, alors elle coupe le troisième côté en son milieu.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — prouver qu'un point est un milieu</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ABC est un triangle, K est le milieu de [AB]. La droite (d) passe par K et est parallèle à (BC) ; elle coupe [AC] en L. Prouver que L est le milieu de [AC].</div><div class=\"etu\"><b>Étape 1</b> — <b>Repérer les hypothèses</b> : (d) passe par le milieu K d'un côté [AB] et (d) ∥ (BC).</div><div class=\"etu\"><b>Étape 2</b> — <b>Appliquer la propriété réciproque</b> : une droite passant par le milieu d'un côté, parallèle à un deuxième côté, coupe le troisième côté en son milieu.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : (d) coupe [AC] en son milieu, donc <b>L est le milieu de [AC]</b>.</div></div></details>\n<h3>4. Application : le quadrilatère de milieux</h3>\n<p>Si on relie les milieux des quatre côtés d'un quadrilatère quelconque, on obtient toujours un <b>parallélogramme</b> : c'est une application directe du théorème des milieux dans les deux triangles formés par une diagonale.</p>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — démonstration en trois lignes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ABCD est un quadrilatère, I, J, K et L les milieux respectifs de [AB], [BC], [CD] et [DA]. Que dire du quadrilatère IJKL ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Tracer une diagonale</b> : la diagonale [AC] découpe ABCD en deux triangles : ABC et ACD.</div><div class=\"etu\"><b>Étape 2</b> — <b>Appliquer le théorème dans chaque triangle</b> : dans ABC, (IJ) joint les milieux de [AB] et [BC] donc (IJ) ∥ (AC) et IJ = AC/2. Dans ACD, (LK) joint les milieux de [AD] et [CD] donc (LK) ∥ (AC) et LK = AC/2.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : (IJ) ∥ (LK) et IJ = LK : IJKL a deux côtés parallèles et de même longueur, donc <b>IJKL est un parallélogramme</b>.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le théorème exige DEUX milieux (ou un milieu + une parallèle) ; IJ = BC/2 ne vaut que si I et J sont les milieux ; ne pas confondre « droite des milieux » (parallèle au 3ᵉ côté) et « médiane » (droite passant par un sommet et le milieu du côté opposé).</div>"},
{"id": "calcul-litteral", "theme": "Calcul littéral (collège)", "niveau": "4e", "titre": "Calcul littéral : distributivité, réduction", "cours": "<div class=\"cours-head\"><h2>Calcul littéral : distributivité, réduction</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les expressions littérales</h3>\n<p>Une <b>expression littérale</b> contient des lettres (souvent x) qui remplacent des nombres. On simplifie l'écriture : 3 × x se note 3x, x × x se note x², 1x = x, et le signe × disparaît devant une lettre ou une parenthèse : 2(x + 3) = 2×(x+3).</p>\n<div class=\"tip\"><b>À retenir :</b> 3 × x = 3x ; x × x = x² (PAS 2x !) ; x + x = 2x ; 1 × a = a ; 0 × a = 0.</div>\n<h3>2. Réduire une expression</h3>\n<p>Réduire, c'est <b>regrouper les termes de même nature</b> pour obtenir l'écriture la plus courte. On additionne les « x » avec les « x », les « x² » avec les « x² », les nombres avec les nombres — mais jamais les uns avec les autres.</p>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — réduire une expression</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Réduire A = 5x + 3 − 2x + 7.</div><div class=\"etu\"><b>Étape 1</b> — <b>Repérer les termes semblables</b> : 5x et −2x (termen en x) ; +3 et +7 (nombres).</div><div class=\"etu\"><b>Étape 2</b> — <b>Regrouper</b> : A = 5x − 2x + 3 + 7.</div><div class=\"etu\"><b>Étape 3</b> — <b>Calculer chaque groupe</b> : 5x − 2x = 3x ; 3 + 7 = 10.</div><div class=\"etu\"><b>Étape 4</b> — <b>Conclure</b> : A = <b>3x + 10</b>. On ne peut pas aller plus loin : 3x et 10 sont de natures différentes (x pas un nombre).</div></div></details>\n<div class=\"tip\"><b>⚠️ Piège :</b> x + x² ne se réduit pas ! Ce sont des natures différentes (des « carreaux » et des « cubes ») : 3x + 5x² reste 3x + 5x².</div>\n<h3>3. Développer avec la simple distributivité</h3>\n<div class=\"tip\"><b>Formules :</b> k(a + b) = ka + kb ; k(a − b) = ka − kb.<br>Exemple : 3(2x − 5) = 3×2x − 3×5 = 6x − 15.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — développer puis réduire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Développer et réduire B = 3(2x − 5) + 4(x + 1).</div><div class=\"etu\"><b>Étape 1</b> — <b>Développer chaque parenthèse</b> : 3(2x − 5) = 6x − 15 et 4(x + 1) = 4x + 4.</div><div class=\"etu\"><b>Étape 2</b> — <b>Remplacer</b> : B = 6x − 15 + 4x + 4.</div><div class=\"etu\"><b>Étape 3</b> — <b>Réduire</b> : 6x + 4x = 10x ; −15 + 4 = −11.</div><div class=\"etu\"><b>Étape 4</b> — <b>Conclure</b> : B = <b>10x − 11</b>.</div></div></details>\n<h3>4. La double distributivité</h3>\n<div class=\"tip\"><b>Formule :</b> (a + b)(c + d) = ac + ad + bc + bd — chaque terme de la 1ʳᵉ parenthèse multiplie chaque terme de la 2ᵉ.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — double distributivité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Développer et réduire C = (x + 3)(2x − 4).</div><div class=\"etu\"><b>Étape 1</b> — <b>Multiplier chaque terme par chaque terme</b> : x×2x = 2x² ; x×(−4) = −4x ; 3×2x = 6x ; 3×(−4) = −12.</div><div class=\"etu\"><b>Étape 2</b> — <b>Additionner les quatre produits</b> : C = 2x² − 4x + 6x − 12.</div><div class=\"etu\"><b>Étape 3</b> — <b>Réduire</b> : −4x + 6x = 2x.</div><div class=\"etu\"><b>Étape 4</b> — <b>Conclure</b> : C = <b>2x² + 2x − 12</b>. Vérification avec x = 1 : (1+3)(2−4) = 4×(−2) = −8 et 2+2−12 = −8 ✓.</div></div></details>\n<h3>5. Substituer : calculer pour une valeur donnée</h3>\n<p>Substituer, c'est <b>remplacer la lettre par un nombre</b>, en gardant les parenthèses quand le nombre est négatif.</p>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — substituer avec un nombre négatif</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer D = 2x² − 3x + 1 pour x = −2.</div><div class=\"etu\"><b>Étape 1</b> — <b>Remplacer en gardant les parenthèses</b> : D = 2×(−2)² − 3×(−2) + 1.</div><div class=\"etu\"><b>Étape 2</b> — <b>Calculer les puissances d'abord</b> : (−2)² = 4, donc 2×4 = 8.</div><div class=\"etu\"><b>Étape 3</b> — <b>Terminer les multiplications</b> : −3×(−2) = +6.</div><div class=\"etu\"><b>Étape 4</b> — <b>Additionner</b> : D = 8 + 6 + 1 = <b>15</b>. Sans les parenthèses, on aurait écrit −3×−2 sans réfléchir au signe : source d'erreurs classique.</div></div></details>"},
{"id": "equations", "theme": "Équations (collège)", "niveau": "4e", "titre": "Équations du premier degré à une inconnue", "cours": "<div class=\"cours-head\"><h2>Équations du premier degré à une inconnue</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Vocabulaire</h3>\n<p>Une <b>équation</b> est une égalité qui contient une inconnue, souvent notée x. Elle comporte deux <b>membres</b> (à gauche et à droite du signe =). <b>Résoudre</b> l'équation, c'est trouver TOUTES les valeurs de x qui rendent l'égalité vraie : les <b>solutions</b>.</p>\n<div class=\"tip\"><b>Tester une valeur :</b> x = 3 est-il solution de 5x − 2 = 13 ? On calcule le membre de gauche : 5×3 − 2 = 13 ✓. Donc 3 est solution.</div>\n<h3>2. Le principe de la balance</h3>\n<p>Une équation est comme une <b>balance en équilibre</b> : ce qu'on fait d'un côté, on doit le faire de l'autre. On peut ajouter, soustraire, multiplier ou diviser (sauf par 0) les DEUX membres par le même nombre sans casser l'égalité.</p>\n<div class=\"tip\"><b>Stratégie :</b> isoler x en « neutralisant » d'abord les additions/soustractions, puis les multiplications/divisions.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — résoudre 3x − 5 = 16</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre 3x − 5 = 16.</div><div class=\"etu\"><b>Étape 1</b> — <b>Supprimer la soustraction</b> : on ajoute 5 des deux côtés : 3x − 5 + 5 = 16 + 5, donc 3x = 21.</div><div class=\"etu\"><b>Étape 2</b> — <b>Supprimer la multiplication</b> : on divise les deux côtés par 3 : 3x/3 = 21/3, donc x = 7.</div><div class=\"etu\"><b>Étape 3</b> — <b>Vérifier</b> : 3×7 − 5 = 21 − 5 = 16 ✓. La solution est x = 7.</div></div></details>\n<h3>3. X des deux côtés : regrouper</h3>\n<p>Quand x apparaît dans les deux membres, on fait « passer » tous les x du même côté (soustraction) et tous les nombres de l'autre.</p>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — résoudre 5x + 2 = 2x + 14</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre 5x + 2 = 2x + 14.</div><div class=\"etu\"><b>Étape 1</b> — <b>Regrouper les x à gauche</b> : on soustrait 2x des deux côtés : 5x − 2x + 2 = 14, donc 3x + 2 = 14.</div><div class=\"etu\"><b>Étape 2</b> — <b>Regrouper les nombres à droite</b> : on soustrait 2 : 3x = 12.</div><div class=\"etu\"><b>Étape 3</b> — <b>Isoler x</b> : x = 12/3 = 4.</div><div class=\"etu\"><b>Étape 4</b> — <b>Vérifier</b> : 5×4 + 2 = 22 et 2×4 + 14 = 22 ✓. Solution : x = 4.</div></div></details>\n<h3>4. Avec des parenthèses</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — résoudre 2(3x − 1) = 4x + 6</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre 2(3x − 1) = 4x + 6.</div><div class=\"etu\"><b>Étape 1</b> — <b>Développer</b> : 6x − 2 = 4x + 6.</div><div class=\"etu\"><b>Étape 2</b> — <b>Regrouper les x à gauche</b> : 6x − 4x = 6 + 2, donc 2x = 8.</div><div class=\"etu\"><b>Étape 3</b> — <b>Isoler x</b> : x = 4.</div><div class=\"etu\"><b>Étape 4</b> — <b>Vérifier</b> : 2(3×4 − 1) = 2×11 = 22 et 4×4 + 6 = 22 ✓.</div></div></details>\n<h3>5. Mettre en équation : résoudre un problème</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — problème concret</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Pensant à 15 €, Hugo achète 3 cahiers identiques et il lui reste 3 €. Quel est le prix d'un cahier ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Choisir l'inconnue</b> : soit x le prix d'un cahier (en euros).</div><div class=\"etu\"><b>Étape 2</b> — <b>Traduire</b> : 3 cahiers coûtent 3x ; il paie 3x et il reste 3 € sur ses 15 € : 3x + 3 = 15.</div><div class=\"etu\"><b>Étape 3</b> — <b>Résoudre</b> : 3x = 12, donc x = 4.</div><div class=\"etu\"><b>Étape 4</b> — <b>Vérifier et conclure</b> : 3 cahiers à 4 € = 12 €, et 15 − 12 = 3 € de reste ✓. Un cahier coûte <b>4 €</b>.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> toujours vérifier la solution dans l'équation de départ ; « faire passer » de l'autre côté = changer le signe (soustraire revient à faire passer en changeant le signe) ; ne jamais diviser par 0 ; garder les unités dans les problèmes.</div>"},
{"id": "proportionnalite", "theme": "Proportionnalité (collège)", "niveau": "4e", "titre": "Proportionnalité : vitesses, échelles", "cours": "<div class=\"cours-head\"><h2>Proportionnalité : vitesses, échelles</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Tableaux de proportionnalité et produit en croix</h3>\n<p>Deux grandeurs sont <b>proportionnelles</b> si on passe de l'une à l'autre en multipliant toujours par le même coefficient. Un tableau est de proportionnalité quand les produits en croix sont égaux.</p>\n<div class=\"tip\"><b>Produit en croix :</b> si a/b = c/d alors a×d = c×b. C'est l'outil pour trouver la <b>quatrième proportionnelle</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — trouver la quatrième proportionnelle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> 6 kg de pommes coûtent 9 €. Combien coûtent 10 kg ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Poser le tableau</b> : masse (kg) : 6 → 10 ; prix (€) : 9 → ?</div><div class=\"etu\"><b>Étape 2</b> — <b>Produit en croix</b> : x = (10 × 9)/6 = 90/6.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : 10 kg coûtent <b>15 €</b>. Vérification avec le coefficient : 9/6 = 1,5 €/kg et 10 × 1,5 = 15 ✓.</div></div></details>\n<h3>2. La vitesse moyenne</h3>\n<div class=\"tip\"><b>Formule :</b> v = d/t (vitesse = distance ÷ temps) ⟺ d = v × t ⟺ t = d/v.<br>Unités : si d en km et t en h, v est en km/h ; si d en m et t en s, v en m/s.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer une vitesse puis un temps</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une voiture parcourt 210 km en 2 h 30 min. Quelle est sa vitesse moyenne ? Combien de temps pour 315 km à la même vitesse ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Convertir le temps en nombre décimal</b> : 2 h 30 min = 2,5 h (30 min = une demi-heure, pas 2,30 h !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Calculer v</b> : v = d/t = 210/2,5 = <b>84 km/h</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Calculer le second temps</b> : t = d/v = 315/84 = 3,75 h.</div><div class=\"etu\"><b>Étape 4</b> — <b>Reconvertir</b> : 3,75 h = 3 h + 0,75×60 min = <b>3 h 45 min</b>.</div></div></details>\n<h3>3. Conversion km/h ↔ m/s</h3>\n<div class=\"tip\"><b>Astuce :</b> 1 km/h = 1000 m / 3600 s, donc on divise par 3,6 pour passer des km/h aux m/s, et on multiplie par 3,6 dans l'autre sens.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — convertir une vitesse</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Convertir 90 km/h en m/s, puis 5 m/s en km/h.</div><div class=\"etu\"><b>Étape 1</b> — <b>km/h → m/s</b> : 90 ÷ 3,6 = <b>25 m/s</b>. (En 1 h : 90 km = 90 000 m en 3600 s, et 90 000/3600 = 25.)</div><div class=\"etu\"><b>Étape 2</b> — <b>m/s → km/h</b> : 5 × 3,6 = <b>18 km/h</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôle d'ordre de grandeur</b> : une vitesse en m/s est toujours plus PETITE qu'en km/h pour la même valeur numérique (25 < 90) : bon réflexe de vérification.</div></div></details>\n<h3>4. Les échelles</h3>\n<div class=\"tip\"><b>Définition :</b> l'échelle e = distance sur la carte / distance réelle (dans la MÊME unité). Une échelle 1/25 000 signifie : 1 cm sur la carte ⟹ 25 000 cm = 250 m en réel.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — utiliser une échelle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur une carte au 1/25 000, deux villages sont distants de 4,8 cm. Quelle est la distance réelle ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Écrire le rapport</b> : 1/25 000 = 4,8/x (x la distance réelle en cm).</div><div class=\"etu\"><b>Étape 2</b> — <b>Produit en croix</b> : x = 4,8 × 25 000 = 120 000 cm.</div><div class=\"etu\"><b>Étape 3</b> — <b>Convertir</b> : 120 000 cm = 1200 m = <b>1,2 km</b>.</div><div class=\"etu\"><b>Étape 4</b> — <b>Vérifier</b> : 1,2 km / 25 000 = 120 000/25 000 = 4,8 cm ✓.</div></div></details>\n<h3>5. Pourcentages : le lien avec la proportionnalité</h3>\n<p>Les pourcentages sont un cas de proportionnalité : augmenter de 15 % = multiplier par 1,15 ; diminuer de 20 % = multiplier par 0,8. Un prix de 40 € avec −20 % : 40 × 0,8 = 32 €.</p>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> 2 h 30 ≠ 2,30 h ; l'échelle n'a de sens qu'à unités IDENTIQUES ; la vitesse moyenne n'est pas la moyenne des vitesses ; toujours préciser l'unité dans la réponse.</div>"},
{"id": "pyramides", "theme": "Pyramides et cônes (collège)", "niveau": "4e", "titre": "Pyramides et cônes : volumes", "cours": "<div class=\"cours-head\"><h2>Pyramides et cônes : volumes</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Vocabulaire des solides</h3>\n<p>Une <b>pyramide</b> a une base polygonale (triangle, carré, pentagone…) et des faces latérales triangulaires qui se rejoignent au <b>sommet</b>. Sa <b>hauteur</b> est le segment perpendiculaire à la base, du sommet à la base. Une pyramide est <b>régulière</b> si sa base est un polygone régulier et sa hauteur passe par le centre de la base.</p>\n<p>Un <b>cône de révolution</b> est engendré par un triangle rectangle tournant autour d'un côté de l'angle droit : base circulaire (rayon r), sommet, hauteur h, et <b>génératrice</b> reliant le sommet au cercle de base.</p>\n<h3>2. Les formules de volume</h3>\n<div class=\"tip\"><b>À connaître :</b><br>• Pyramide : V = (1/3) × B × h, où B est l'AIRE de la base et h la hauteur.<br>• Cône : V = (1/3) × π × r² × h (car B = πr²).<br>Les deux sont le TIERCI du prisme/cylindre de même base et même hauteur.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — volume d'une pyramide à base carrée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une pyramide a une base carrée de côté 6 cm et une hauteur de 9 cm. Calculer son volume.</div><div class=\"etu\"><b>Étape 1</b> — <b>Calculer l'aire de la base</b> : B = 6 × 6 = 36 cm².</div><div class=\"etu\"><b>Étape 2</b> — <b>Appliquer la formule</b> : V = (1/3) × B × h = (1/3) × 36 × 9.</div><div class=\"etu\"><b>Étape 3</b> — <b>Calculer</b> : V = 12 × 9 = <b>108 cm³</b>.</div><div class=\"etu\"><b>Étape 4</b> — <b>Contrôler l'ordre de grandeur</b> : le prisme de même base (36 × 9 = 324 cm³) est exactement 3 fois plus grand ✓.</div></div></details>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — volume d'un cône</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un cône a un rayon de base de 3 cm et une hauteur de 10 cm. Donner le volume exact en fonction de π, puis arrondi au dixième.</div><div class=\"etu\"><b>Étape 1</b> — <b>Appliquer la formule</b> : V = (1/3) × π × r² × h = (1/3) × π × 9 × 10.</div><div class=\"etu\"><b>Étape 2</b> — <b>Simplifier</b> : V = (90/3) × π = <b>30π cm³</b> (valeur exacte).</div><div class=\"etu\"><b>Étape 3</b> — <b>Arrondir</b> : V ≈ 30 × 3,14 ≈ <b>94,2 cm³</b>.</div><div class=\"etu\"><b>Étape 4</b> — <b>Retenir</b> : donner la valeur exacte (avec π) AVANT l'arrondi, comme pour toute valeur impliquant π.</div></div></details>\n<h3>3. Retrouver une dimension : formules à l'envers</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — retrouver la hauteur</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une pyramide à base carrée de côté 5 cm a un volume de 75 cm³. Quelle est sa hauteur ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Écrire la formule avec les données</b> : 75 = (1/3) × 25 × h (B = 5² = 25).</div><div class=\"etu\"><b>Étape 2</b> — <b>Isoler h</b> : (25/3) × h = 75, donc h = 75 × 3/25 = 225/25.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : h = <b>9 cm</b>.</div><div class=\"etu\"><b>Étape 4</b> — <b>Vérifier</b> : (1/3) × 25 × 9 = 75 ✓.</div></div></details>\n<h3>4. Sections planes et agrandissement-réduction</h3>\n<p>Quand on coupe une pyramide (ou un cône) par un plan <b>parallèle à la base</b>, on obtient une section de même forme que la base (carré → carré, disque → disque). Si le rapport de réduction est k, alors les longueurs sont multipliées par k, les <b>aires par k²</b> et les <b>volumes par k³</b>.</p>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — réduire un cône de moitié</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On coupe un cône par un plan parallèle à la base, à mi-hauteur. Le petit cône du sommet a des dimensions réduites de moitié (k = 1/2). Par combien son volume est-il divisé ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Rapport de réduction</b> : k = 1/2 pour les longueurs.</div><div class=\"etu\"><b>Étape 2</b> — <b>Aires</b> : multipliées par k² = 1/4.</div><div class=\"etu\"><b>Étape 3</b> — <b>Volumes</b> : multipliés par k³ = 1/8 : le petit cône a un volume 8 fois plus petit.</div><div class=\"etu\"><b>Étape 4</b> — <b>Conclure</b> : diviser les dimensions par 2 divise le volume par 8 — d'où l'importance du coefficient k³.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> B est une AIRE (pas un côté !) ; la hauteur n'est pas une arête latérale (sauf cas particuliers) ; les unités de volume sont cubes (cm³) ; k² pour les aires, k³ pour les volumes.</div>"}];
var FICHES_DATA = [{"id": "pythagore", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Théorème :</b> triangle rectangle en A ⟹ BC² = AB² + AC² (hypoténuse au carré = somme des carrés des deux autres côtés).</p>\n<p><b>Réciproque :</b> BC² = AB² + AC² ⟹ triangle rectangle en A (le plus long côté est l'hypoténuse).</p>\n<p><b>Contraposée :</b> BC² ≠ AB² + AC² ⟹ le triangle n'est pas rectangle.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculer l'hypoténuse :</b> BC = √(AB² + AC²)</li>\n<li><b>Calculer un côté de l'angle droit :</b> AB = √(BC² − AC²)</li>\n<li><b>Vérifier si un triangle est rectangle :</b> comparer le plus grand carré à la somme des deux autres (réciproque).</li>\n</ul>\n<h3>🔢 Triplets utiles</h3>\n<p>(3 ; 4 ; 5) — (5 ; 12 ; 13) — (8 ; 15 ; 17) — et leurs multiples : (6 ; 8 ; 10), (9 ; 12 ; 15)…</p>\n<h3>🧮 Formules dérivées</h3>\n<ul>\n<li>Diagonale d'un rectangle : d = √(L² + l²)</li>\n<li>Distance MN = √((x<sub>N</sub>−x<sub>M</sub>)² + (y<sub>N</sub>−y<sub>M</sub>)²)</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Ne s'applique QUE dans un triangle rectangle.</li>\n<li>L'hypoténuse est toujours le côté le plus long = celui qui est <b>seul</b> dans l'égalité.</li>\n<li>Ne pas oublier la racine carrée finale (√25 = 5).</li>\n</ul>"}, {"id": "derivation", "fiche": "<h3>📌 Définitions</h3>\n<p><b>Nombre dérivé :</b> f′(a) = lim<sub>h→0</sub> (f(a+h) − f(a)) / h.</p>\n<p><b>Tangente en a :</b> y = f′(a)(x − a) + f(a) (coefficient directeur : f′(a)).</p>\n<h3>🔢 Dérivées usuelles</h3>\n<table><tr><th>f</th><th>x<sup>n</sup></th><th>1/x</th><th>√x</th><th>cos x</th><th>sin x</th><th>k</th></tr>\n<tr><td><b>f′</b></td><td>n x<sup>n−1</sup></td><td>−1/x²</td><td>1/(2√x)</td><td>−sin x</td><td>cos x</td><td>0</td></tr></table>\n<h3>➕ Opérations</h3>\n<ul>\n<li>(u + v)′ = u′ + v′ ; (k u)′ = k u′</li>\n<li>(uv)′ = u′v + uv′</li>\n<li>(1/v)′ = −v′/v² ; (u/v)′ = (u′v − uv′)/v²</li>\n<li>(u<sup>n</sup>)′ = n u′ u<sup>n−1</sup> ; (√u)′ = u′/(2√u)</li>\n</ul>\n<h3>📈 Variations</h3>\n<ul>\n<li>f′ &gt; 0 ⟹ f croissante ; f′ &lt; 0 ⟹ f décroissante.</li>\n<li>f′ s'annule ET change de signe en a ⟹ extremum local en a.</li>\n</ul>\n<h3>🎯 Méthode d'étude</h3>\n<p>Domaine → f′(x) factorisée → signe de f′ → tableau de variations → extremums.</p>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>(uv)′ ≠ u′v′.</li>\n<li>f′(a) = 0 seul ne prouve pas un extremum (changement de signe obligatoire : x³ en 0).</li>\n<li>Dérivable ⇒ continue, mais pas l'inverse (|x| en 0).</li>\n</ul>"},
{"id": "puissances", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Définition :</b> aⁿ = a × a × … × a (n facteurs) ; a¹ = a ; a⁰ = 1 (a ≠ 0).</p>\n<p><b>Les 3 règles :</b> aᵐ × aⁿ = aᵐ⁺ⁿ ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ ; (aᵐ)ⁿ = aᵐˣⁿ.</p>\n<p><b>Puissances de 10 :</b> 10⁻ⁿ = 1/10ⁿ ; multiplier par 10ⁿ déplace la virgule de n rangs.</p>\n<p><b>Écriture scientifique :</b> a × 10ⁿ avec 1 ≤ a < 10 (unique).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Simplifier un produit de puissances :</b> même base → additionner les exposants.</li>\n<li><b>Simplifier un quotient :</b> même base → soustraire les exposants.</li>\n<li><b>Écriture scientifique :</b> placer la virgule pour obtenir 1 ≤ a < 10, puis compter les rangs de déplacement (droite → exposant positif, gauche → négatif).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>(−2)⁴ = 16 mais −2⁴ = −16 (parenthèses !).</li>\n<li>2³ × 2² = 2⁵ : on N'ADDITIONNE PAS les bases.</li>\n<li>(2³)² = 2⁶ : on MULTIPLIE les exposants, contrairement au produit.</li>\n<li>5⁰ = 1, pas 0 ni 5.</li>\n</ul>"},
{"id": "milieux", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Théorème 1 :</b> droite passant par les milieux de deux côtés d'un triangle ⟹ <b>parallèle au troisième côté</b>.</p>\n<p><b>Théorème 2 :</b> segment des milieux ⟹ longueur = <b>moitié du troisième côté</b> (IJ = BC/2).</p>\n<p><b>Réciproque :</b> droite passant par le milieu d'un côté, parallèle à un deuxième côté ⟹ coupe le 3ᵉ côté en son <b>milieu</b>.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculer une longueur :</b> segment des milieux = moitié du 3ᵉ côté ; le 3ᵉ côté = 2 × segment des milieux.</li>\n<li><b>Prouver un parallélisme :</b> citer les deux milieux, conclure avec le théorème 1.</li>\n<li><b>Prouver qu'un point est un milieu :</b> citer « milieu d'un côté + parallèle au 2ᵉ côté », conclure avec la réciproque.</li>\n<li><b>Quadrilatère de milieux :</b> tracer une diagonale, appliquer le théorème dans les deux triangles ⟹ parallélogramme.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Il faut DEUX milieux (ou un milieu + une parallèle) : une seule donnée ne suffit pas.</li>\n<li>IJ = BC/2 : le 3ᵉ côté est CELUI QUI N'EST PAS coupé en son milieu.</li>\n<li>Ne pas confondre droite des milieux et médiane.</li>\n</ul>"},
{"id": "calcul-litteral", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Simplifications :</b> 3 × x = 3x ; x × x = x² ; x + x = 2x ; 1x = x.</p>\n<p><b>Simple distributivité :</b> k(a + b) = ka + kb ; k(a − b) = ka − kb.</p>\n<p><b>Double distributivité :</b> (a + b)(c + d) = ac + ad + bc + bd.</p>\n<p><b>Substituer :</b> remplacer x par sa valeur, avec des parenthèses si le nombre est négatif.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Réduire :</b> regrouper les x avec les x, les x² avec les x², les nombres avec les nombres.</li>\n<li><b>Développer :</b> multiplier chaque terme, puis réduire.</li>\n<li><b>Vérifier un développement :</b> tester avec une valeur simple (x = 0 ou 1) des deux côtés.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>x + x = 2x mais x × x = x² : ne pas confondre somme et produit.</li>\n<li>3x + 5x² ne se réduit pas (natures différentes).</li>\n<li>−3(x − 2) = −3x + 6 : le « − » change les DEUX signes.</li>\n<li>Substituer un négatif : toujours des parenthèses, (−2)² = 4 mais −2² = −4.</li>\n</ul>"},
{"id": "equations", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Équation :</b> égalité à une inconnue x ; <b>solution</b> = valeur de x qui rend l'égalité vraie.</p>\n<p><b>Principe de la balance :</b> toute opération faite d'un côté doit être faite de l'autre.</p>\n<p><b>Ordre de résolution :</b> 1) développer ; 2) regrouper les x d'un côté, les nombres de l'autre ; 3) diviser par le coefficient ; 4) VÉRIFIER.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>3x − 5 = 16 :</b> +5 des deux côtés → 3x = 21 → ÷3 → x = 7.</li>\n<li><b>5x + 2 = 2x + 14 :</b> −2x → 3x + 2 = 14 → −2 → 3x = 12 → x = 4.</li>\n<li><b>2(3x − 1) = 4x + 6 :</b> développer → 6x − 2 = 4x + 6 → 2x = 8 → x = 4.</li>\n<li><b>Problème :</b> choisir l'inconnue, traduire l'énoncé, résoudre, vérifier, conclure avec l'unité.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Toujours vérifier la solution dans l'équation INITIALE.</li>\n<li>Quand x est des deux côtés : soustraire le PETIT x pour garder un coefficient positif.</li>\n<li>« Faire passer » un terme = changer son signe (car on ajoute/soustrait des deux côtés).</li>\n<li>Dans un problème, la solution doit être cohérente (prix positif, nombre entier de personnes…).</li>\n</ul>"},
{"id": "proportionnalite", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Produit en croix :</b> a/b = c/d ⟹ a×d = b×c (quatrième proportionnelle).</p>\n<p><b>Vitesse :</b> v = d/t ⟺ d = v×t ⟺ t = d/v.</p>\n<p><b>Conversions vitesses :</b> km/h → m/s : ÷3,6 ; m/s → km/h : ×3,6.</p>\n<p><b>Échelle :</b> e = distance carte / distance réelle (même unité) ; échelle 1/25 000 ⟹ 1 cm = 250 m.</p>\n<p><b>Pourcentages :</b> +15 % = ×1,15 ; −20 % = ×0,8.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Quatrième proportionnelle :</b> poser le tableau, produit en croix, convertir l'unité à la fin.</li>\n<li><b>Temps décimal :</b> 2 h 30 min = 2,5 h ; 45 min = 0,75 h ; 3,2 h = 3 h 12 min.</li>\n<li><b>Échelle :</b> multiplier la distance carte par le dénominateur, puis convertir (cm → km : ÷100 000).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>2 h 30 min = 2,5 h (et non 2,30 h) : les minutes sont en base 60.</li>\n<li>La vitesse moyenne n'est PAS la moyenne des vitesses.</li>\n<li>Échelle : toujours les mêmes unités avant le produit en croix.</li>\n<li>Augmenter de 10 % puis de 10 % ≠ +20 % (car la seconde hausse part d'un prix plus grand).</li>\n</ul>"},
{"id": "pyramides", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Pyramide :</b> V = (1/3) × B × h (B = AIRE de la base, h = hauteur).</p>\n<p><b>Cône :</b> V = (1/3) × π × r² × h.</p>\n<p><b>Section parallèle à la base :</b> même forme que la base ; réduction de rapport k ⟹ longueurs ×k, aires ×k², volumes ×k³.</p>\n<p>Pyramide et cône = le <b>tiers</b> du prisme/cylindre de même base et hauteur.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Volume :</b> calculer B d'abord (aire !), puis appliquer V = (1/3)Bh.</li>\n<li><b>Retrouver h :</b> h = 3V/B ; retrouver r ou le côté de base : mêmes étapes à l'envers.</li>\n<li><b>Valeur exacte avec π :</b> garder « ×π » dans le résultat exact, arrondir seulement à la fin.</li>\n<li><b>Agrandissement-réduction :</b> identifier k (longueurs), puis appliquer k² (aires) ou k³ (volumes).</li>\n</ul>\n<h3>🔢 Aires de base utiles</h3>\n<ul>\n<li>Carré de côté c : B = c²</li>\n<li>Rectangle : B = L × l</li>\n<li>Disque : B = πr²</li>\n<li>Triangle : B = (b × h)/2</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>B est une AIRE : pour une base carrée de 6, B = 36 (pas 6 !).</li>\n<li>Hauteur ⟂ base : ce n'est pas une arête latérale.</li>\n<li>Unités : cm × cm² = cm³.</li>\n<li>Diviser les dimensions par 2 divise le volume par 8 (k³), pas par 2.</li>\n</ul>"}];
var QUESTIONS = [{"t": "Pythagore (collège)", "q": "Dans un triangle ABC rectangle en A, quelle égalité est toujours vraie ?", "c": ["BC = AB + AC", "AB² = BC² + AC²", "BC² = AB² + AC²", "AC² = AB² + BC²"], "a": 2, "e": "L'hypoténuse BC (côté opposé à l'angle droit) est seule dans l'égalité : BC² = AB² + AC².", "d": "La notion clé : dans un triangle <b>rectangle en A</b>, le côté opposé à l'angle droit (l'hypoténuse BC) apparaît <b>seul</b> dans l'égalité.<div class='ex-detail'><u>Exemple</u> : si AB = 6 et AC = 8, alors BC² = 6² + 8² = 100 et BC = 10. Si on avait écrit AB² = BC² + AC², on obtiendrait 36 = 100 + 64 : absurde, car AB (côté de l'angle droit) ne peut pas être le plus long côté.</div>"}, {"t": "Pythagore (collège)", "q": "ABC est rectangle en A avec AB = 3 et AC = 4. Quelle est la longueur BC ?", "c": ["12", "25", "5", "7"], "a": 2, "e": "BC² = 3² + 4² = 25, donc BC = √25 = 5.", "d": "Méthode : appliquer le théorème puis prendre la <b>racine carrée</b> du résultat.<div class='ex-detail'><u>Exemple rédigé</u> : BC² = AB² + AC² = 3² + 4² = 9 + 16 = 25. Donc BC = √25 = <b>5</b>. Attention au piège : BC² vaut 25, mais BC vaut 5 — ne pas confondre le carré et sa racine.</div>"}, {"t": "Pythagore (collège)", "q": "Comment s'appelle le côté opposé à l'angle droit dans un triangle rectangle ?", "c": ["Le côté adjacent", "La hauteur", "La médiane", "L'hypoténuse"], "a": 3, "e": "L'hypoténuse est le côté opposé à l'angle droit ; c'est toujours le plus long côté.", "d": "Vocabulaire de base : l'<b>hypoténuse</b> est le côté opposé à l'angle droit ; c'est toujours le côté le plus long, et c'est lui qui est « seul » dans l'égalité de Pythagore.<div class='ex-detail'><u>Exemple</u> : dans un triangle rectangle en A avec AB = 5 et AC = 12, l'hypoténuse est BC et BC = √(25 + 144) = 13. La hauteur et la médiane sont des <i>segments</i> (droites), pas des côtés.</div>"}, {"t": "Pythagore (collège)", "q": "Un triangle a pour côtés 5, 12 et 13. Que peut-on conclure ?", "c": ["Il est rectangle (réciproque du théorème)", "On ne peut rien conclure", "Il est équilatéral", "Il n'est pas rectangle"], "a": 0, "e": "13² = 169 = 5² + 12² = 25 + 144. La réciproque du théorème de Pythagore s'applique : le triangle est rectangle.", "d": "Pour vérifier si un triangle est rectangle, on utilise la <b>réciproque</b> : comparer le carré du plus long côté à la somme des carrés des deux autres.<div class='ex-detail'><u>Exemple rédigé</u> : 13² = 169 et 5² + 12² = 25 + 144 = 169. Comme 13² = 5² + 12², le triangle est rectangle, et l'angle droit est opposé au côté 13. (Rappel : (5 ; 12 ; 13) est un triplet pythagoricien classique, comme (3 ; 4 ; 5) et (8 ; 15 ; 17).)</div>"}, {"t": "Pythagore (collège)", "q": "Un triangle a pour côtés 4, 5 et 7. Ce triangle…", "c": ["est rectangle", "est isocèle", "n'est pas rectangle (contraposée)", "est rectangle en le sommet opposé au côté 4"], "a": 2, "e": "7² = 49 mais 4² + 5² = 41 ≠ 49 : la contraposée montre qu'il n'est pas rectangle.", "d": "La <b>contraposée</b> du théorème : si le plus grand carré ne correspond PAS à la somme des deux autres, le triangle n'est PAS rectangle.<div class='ex-detail'><u>Exemple rédigé</u> : 7² = 49 mais 4² + 5² = 16 + 25 = 41. Comme 49 ≠ 41, le triangle n'est pas rectangle (quelle que soit la position des côtés).</div>"}, {"t": "Pythagore (collège)", "q": "ABC rectangle en A, BC = 13 et AC = 5. Combien vaut AB ?", "c": ["√18", "18", "8", "12"], "a": 3, "e": "AB² = BC² − AC² = 169 − 25 = 144, donc AB = √144 = 12.", "d": "Quand on cherche un côté de l'angle droit, on <b>soustrait</b> : le carré de l'hypoténuse moins le carré de l'autre côté.<div class='ex-detail'><u>Exemple rédigé</u> : AB² = BC² − AC² = 13² − 5² = 169 − 25 = 144, donc AB = √144 = <b>12</b>. (On reconnaît le triplet (5 ; 12 ; 13).) Piège classique : additionner au lieu de soustraire donne √194 ≈ 13,9, ce qui serait plus long que l'hypoténuse : impossible.</div>"}, {"t": "Pythagore (collège)", "q": "Quelle est la diagonale d'un rectangle de longueur 8 et de largeur 6 ?", "c": ["14", "48", "10", "√14"], "a": 2, "e": "d² = 8² + 6² = 100, donc d = 10 (triplet (6 ; 8 ; 10)).", "d": "La diagonale d'un rectangle découpe le rectangle en <b>deux triangles rectangles</b> : la diagonale est l'hypoténuse de chaque triangle.<div class='ex-detail'><u>Exemple rédigé</u> : d² = 8² + 6² = 64 + 36 = 100, donc d = <b>10</b>. Astuce : (6 ; 8 ; 10) est le double du triplet (3 ; 4 ; 5) — les tripletts font gagner du temps aux examens.</div>"}, {"t": "Pythagore (collège)", "q": "Le théorème de Pythagore permet de…", "c": ["calculer une longueur dans un triangle rectangle", "calculer un angle dans un triangle rectangle", "calculer l'aire d'un triangle", "démontrer qu'un triangle est isocèle"], "a": 0, "e": "Le théorème relie les longueurs des côtés d'un triangle rectangle ; la trigonométrie sert pour les angles.", "d": "Le théorème de Pythagore relie uniquement les <b>longueurs</b> des côtés d'un triangle rectangle.<div class='ex-detail'><u>À retenir</u> : pour les <b>angles</b>, on utilise la trigonométrie (cos, sin, tan). Exemple : dans un triangle rectangle en A avec AB = 3, AC = 4, BC = 5, le théorème donne BC = 5 ; pour calculer l'angle B, on utilise cos(B) = AB/BC = 3/5. Deux outils différents pour deux données différentes.</div>"}, {"t": "Pythagore (collège)", "q": "Dans un triangle rectangle, l'hypoténuse est…", "c": ["le côté le plus court", "le côté le plus long", "toujours horizontal", "un côté de l'angle droit"], "a": 1, "e": "L'hypoténuse, opposée à l'angle droit, est toujours le côté le plus long du triangle rectangle.", "d": "L'hypoténuse est le côté opposé à l'angle droit et donc nécessairement le <b>plus long</b>. Un argument simple : dans l'égalité BC² = AB² + AC², BC² est la somme de deux nombres positifs, donc BC² dépasse AB² et AC².<div class='ex-detail'><u>Exemple</u> : avec AB = 3 et AC = 4, on trouve BC = 5 > 4 > 3. Si un « hypothénuse » était plus court qu'un autre côté, l'égalité serait impossible.</div>"}, {"t": "Pythagore (collège)", "q": "BC² = 25 dans un triangle rectangle. Combien vaut BC ?", "c": ["625", "25", "50", "5"], "a": 3, "e": "BC est la racine carrée de 25 : BC = 5. Piège classique : ne pas oublier la racine !", "d": "Erreur ultra-classique : confondre <b>le carré de la longueur</b> et <b>la longueur</b>. Le théorème donne un carré ; la longueur est sa racine carrée.<div class='ex-detail'><u>Exemple rédigé</u> : BC² = 25 ⟹ BC = √25 = <b>5</b>. Vérification inverse : si BC = 5, alors BC² = 25 ✓ ; si BC = 25, alors BC² = 625 ≠ 25 ✗. Toujours terminer par une racine.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de f(x) = x³ ?", "c": ["f′(x) = 3x²", "f′(x) = x²", "f′(x) = 3x⁴", "f′(x) = 3x"], "a": 0, "e": "Pour xⁿ, la dérivée est n·xⁿ⁻¹ : (x³)′ = 3x².", "d": "Règle générale : (xⁿ)′ = <b>n·xⁿ⁻¹</b> — l'exposant descend en coefficient, l'exposant diminue de 1.<div class='ex-detail'><u>Exemple rédigé</u> : (x³)′ = 3x². De même (x⁵)′ = 5x⁴ et (x)′ = 1 (= 1x⁰). Piège : ne pas écrire 3x⁴ (l'exposant ne monte pas !) ni x² (oubli du coefficient).</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de f(x) = 1/x sur ]0 ; +∞[ ?", "c": ["f′(x) = −1/x²", "f′(x) = 1/x²", "f′(x) = 1/(2√x)", "f′(x) = −1/x"], "a": 0, "e": "La dérivée de 1/x est −1/x² (ne pas oublier le signe moins).", "d": "Dérivées usuelles à connaître par cœur : (1/x)′ = <b>−1/x²</b> et (√x)′ = 1/(2√x).<div class='ex-detail'><u>Exemple rédigé</u> : pour f(x) = 1/x, f′(2) = −1/4. Le signe « − » signifie que f est décroissante sur ]0 ; +∞[ (ce qui se voit sur la courbe : elle descend). Oublier le « − » fausse ensuite tout le tableau de variations.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est l'équation de la tangente à la courbe de f au point d'abscisse a ?", "c": ["y = f(a)(x) + f′(a)", "y = f′(a)(x + a) − f(a)", "y = f(a)(x − a) + f′(a)", "y = f′(a)(x − a) + f(a)"], "a": 3, "e": "Tangente : y = f′(a)(x − a) + f(a). f′(a) est le coefficient directeur.", "d": "Formule à mémoriser : tangente en a : y = <b>f′(a)(x − a) + f(a)</b>. Structure : coefficient directeur f′(a) × (x − a) + ordonnée du point f(a).<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = x² en a = 1 : f′(x) = 2x donc f′(1) = 2 et f(1) = 1. Tangente : y = 2(x − 1) + 1 = 2x − 1. Vérification : en x = 1, la droite donne y = 1 = f(1) ✓ et sa pente 2 = f′(1) ✓.</div>"}, {"t": "Dérivation (1re)", "q": "Si f′(x) > 0 sur un intervalle I, alors f est…", "c": ["strictement croissante sur I", "négative sur I", "constante sur I", "strictement décroissante sur I"], "a": 0, "e": "Le signe de la dérivée donne le sens de variation : f′ > 0 ⟹ f strictement croissante.", "d": "Lien fondamental : le <b>signe de f′</b> donne le <b>sens de variation de f</b>. f′ > 0 ⟹ f monte ; f′ < 0 ⟹ f descend ; f′ = 0 ⟹ f constante.<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = x² sur ℝ. f′(x) = 2x, négatif sur ]−∞ ; 0] et positif sur [0 ; +∞[. Donc f décroît puis croît, avec un minimum en 0. On retrouve bien la parabole connue.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de f(x) = √x sur ]0 ; +∞[ ?", "c": ["f′(x) = 1/(2√x)", "f′(x) = 1/√x", "f′(x) = −1/(2√x)", "f′(x) = 2√x"], "a": 0, "e": "(√x)′ = 1/(2√x) : le 2 au dénominateur est souvent oublié.", "d": "Dérivée usuelle : (√x)′ = <b>1/(2√x)</b> — le 2 au dénominateur est souvent oublié.<div class='ex-detail'><u>Exemple rédigé</u> : en a = 4, f′(4) = 1/(2√4) = 1/4. La tangente en 4 à la courbe de √x a donc une pente de 0,25. Astuce pour retenir la formule : (√x)′ = u′/(2√u) appliqué à u = x.</div>"}, {"t": "Dérivation (1re)", "q": "f(x) = x⁴ − 3x² + 7. Que vaut f′(x) ?", "c": ["4x³ − 6", "4x³ − 6x", "x⁴ − 6x", "4x³ − 3x + 7"], "a": 1, "e": "Terme à terme : (x⁴)′ = 4x³, (−3x²)′ = −6x, (7)′ = 0.", "d": "On dérive <b>terme à terme</b> (somme) : (x⁴)′ = 4x³, (−3x²)′ = −6x (constante × xⁿ), (7)′ = 0.<div class='ex-detail'><u>Exemple rédigé</u> : f′(x) = 4x³ − 6x. Rappels : (k·xⁿ)′ = k·n·xⁿ⁻¹ et la dérivée d'une constante est 0 — le « + 7 » disparaît donc complètement.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de g(x) = (2x + 1)(x − 3) ?", "c": ["g′(x) = 2(x − 3)·(2x + 1)", "g′(x) = (2x + 1) + (x − 3)", "g′(x) = 2", "g′(x) = 2(x − 3) + (2x + 1)·1"], "a": 3, "e": "Avec (uv)′ = u′v + uv′ : u′ = 2, v′ = 1. ATTENTION : (uv)′ ≠ u′v′.", "d": "Formule du produit : (uv)′ = <b>u′v + uv′</b> — jamais u′v′ !<div class='ex-detail'><u>Exemple rédigé</u> : u = 2x + 1 (u′ = 2) et v = x − 3 (v′ = 1). g′(x) = 2(x − 3) + (2x + 1)·1 = 2x − 6 + 2x + 1 = 4x − 5. Vérification : en développant g(x) = 2x² − 5x − 3, on dérive : 4x − 5 ✓. Les deux méthodes donnent le même résultat.</div>"}, {"t": "Dérivation (1re)", "q": "f′ s'annule en a en changeant de signe (+ vers −). Que se passe-t-il ?", "c": ["f est constante après a", "f présente un minimum local en a", "f présente un point d'inflexion en a", "f présente un maximum local en a"], "a": 3, "e": "Changement de signe de la dérivée = extremum local ; + vers − = maximum.", "d": "Extremum local = la dérivée s'annule <b>ET change de signe</b> : + → − donne un maximum, − → + donne un minimum.<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = x³ − 3x. f′(x) = 3x² − 3 = 3(x − 1)(x + 1). En −1 : f′ passe de + à − → maximum local f(−1) = 2. En 1 : f′ passe de − à + → minimum local f(1) = −2. C'est le signe de f′ qui commande le tableau de variations.</div>"}, {"t": "Dérivation (1re)", "q": "f(x) = x³. En 0, f′(0) = 0. Peut-on conclure à un extremum en 0 ?", "c": ["Non, car f′ ne change pas de signe en 0", "Oui, car f′(0) = 0", "Oui, c'est un minimum", "Oui, c'est un maximum"], "a": 0, "e": "f′(x) = 3x² ≥ 0 partout : f reste croissante, pas d'extremum. f′(a) = 0 seul ne suffit pas.", "d": "Piège du chapitre : f′(a) = 0 <b>ne suffit pas</b> pour un extremum, il faut un changement de signe de f′.<div class='ex-detail'><u>Exemple rédigé</u> : f′(x) = 3x² ≥ 0 pour tout x. La dérivée s'annule en 0 mais reste positive avant et après : la fonction ne change jamais de sens de variation (elle est croissante sur ℝ). Graphiquement, la courbe de x³ traverse sa tangente horizontale en 0 (point d'inflexion), elle ne fait pas de « bosse ».</div>"}, {"t": "Dérivation (1re)", "q": "Quelle affirmation est correcte ?", "c": ["Toute fonction dérivable est continue", "Continuité et dérivabilité sont équivalentes", "Une fonction dérivable n'est jamais continue", "Toute fonction continue est dérivable"], "a": 0, "e": "Dérivable ⇒ continue, mais la réciproque est fausse : |x| est continue en 0 mais non dérivable (tangente « en coin »).", "d": "Théorème du cours : <b>dérivable ⇒ continue</b>, mais la réciproque est fausse.<div class='ex-detail'><u>Exemple clé</u> : f(x) = |x| est continue en 0 (pas de « trou ») mais non dérivable en 0 : à gauche la pente est −1, à droite elle est +1 — la courbe a un « coin », impossible d'y tracer UNE seule tangente. En revanche, toute fonction dérivable en a est automatiquement continue en a.</div>"},
{"t": "Puissances (collège)", "q": "Combien vaut 2⁵ ?", "c": ["10", "25", "32", "7"], "a": 2, "e": "2⁵ = 2×2×2×2×2 = 32 : cinq facteurs égaux à 2.", "d": "La puissance est un <b>produit répété</b> : 2⁵ = 2×2×2×2×2, on compte 5 facteurs.<div class='ex-detail'><u>Exemple rédigé</u> : 2×2 = 4 ; ×2 = 8 ; ×2 = 16 ; ×2 = <b>32</b>. Piège : 2⁵ n'est PAS 2×5 = 10 ! L'exposant indique combien de fois on multiplie la base par elle-même.</div>"},
{"t": "Puissances (collège)", "q": "Combien vaut 5⁰ ?", "c": ["0", "5", "1", "Cela dépend du contexte"], "a": 2, "e": "Par convention, a⁰ = 1 pour tout nombre a ≠ 0.", "d": "Convention du cours : <b>a⁰ = 1</b> dès que a ≠ 0.<div class='ex-detail'><u>Pourquoi ?</u> Avec la règle des quotients : aⁿ ÷ aⁿ = aⁿ⁻ⁿ = a⁰. Or aⁿ ÷ aⁿ = 1, donc a⁰ = 1. Exemple : 7⁵ ÷ 7⁵ = 1 = 7⁰ ✓. Piège fréquent au QCM : répondre 0 ou 5.</div>"},
{"t": "Puissances (collège)", "q": "Simplifier 2³ × 2⁴.", "c": ["2⁷", "2¹²", "4⁷", "2⁶"], "a": 0, "e": "Même base : on additionne les exposants, 3 + 4 = 7, donc 2⁷.", "d": "Règle du produit : <b>aᵐ × aⁿ = aᵐ⁺ⁿ</b> — on additionne les exposants quand la base est la même.<div class='ex-detail'><u>Exemple rédigé</u> : 2³ × 2⁴ = 8 × 16 = 128 = 2⁷. Pièges : 2¹² (multiplication des exposants, fausse ici) et 4⁷ (multiplication des bases, interdit). Vérification numérique : 8 × 16 = 128 ✓.</div>"},
{"t": "Puissances (collège)", "q": "Combien vaut 10⁻³ ?", "c": ["−1000", "0,001", "0,0001", "−3"], "a": 1, "e": "10⁻³ = 1/10³ = 0,001 : exposant négatif → nombre plus petit que 1.", "d": "Un exposant négatif donne l'<b>inverse</b> : 10⁻ⁿ = 1/10ⁿ, un 1 en 3ᵉ position après la virgule pour n = 3.<div class='ex-detail'><u>Exemple rédigé</u> : 10⁻³ = 1/1000 = <b>0,001</b>. Attention : ce n'est PAS un nombre négatif ! 10⁻³ = 0,001 alors que −10³ = −1000 : deux notions différentes (inverse et opposé).</div>"},
{"t": "Puissances (collège)", "q": "Combien vaut (−2)⁴ ?", "c": ["−16", "−8", "8", "16"], "a": 3, "e": "Quatre facteurs égaux à −2 : le produit est positif, (−2)⁴ = 16.", "d": "Le signe du résultat dépend de la <b>parité de l'exposant</b> : pair → positif, impair → négatif.<div class='ex-detail'><u>Exemple rédigé</u> : (−2)⁴ = (−2)×(−2)×(−2)×(−2) = 4 × 4 = <b>16</b>. Comparer : (−2)³ = −8 (impair). Et distinguer −2⁴ = −16 : là, la base est 2 et le signe « − » reste devant.</div>"},
{"t": "Puissances (collège)", "q": "Quelle est l'écriture scientifique de 48 500 ?", "c": ["48,5 × 10³", "4,85 × 10⁵", "4,85 × 10⁴", "485 × 10²"], "a": 2, "e": "4,85 est entre 1 et 10, et 4,85 × 10⁴ = 48 500.", "d": "L'écriture scientifique impose <b>1 ≤ a < 10</b> : un seul chiffre (non nul) avant la virgule.<div class='ex-detail'><u>Exemple rédigé</u> : 48 500 = 4,85 × 10 000 = <b>4,85 × 10⁴</b>. Les autres propositions sont des écritures « approchées » mais pas scientifiques : 48,5 × 10³ et 485 × 10² ont un « a » trop grand ; 4,85 × 10⁵ vaudrait 485 000 ✗.</div>"},
{"t": "Puissances (collège)", "q": "Simplifier (10²)³.", "c": ["10⁵", "10⁶", "10⁸", "10⁹"], "a": 1, "e": "Puissance de puissance : on multiplie les exposants, 2 × 3 = 6, donc 10⁶.", "d": "Règle : <b>(aᵐ)ⁿ = aᵐˣⁿ</b> — on multiplie les exposants (contrairement au produit simple où l'on additionne).<div class='ex-detail'><u>Exemple rédigé</u> : (10²)³ = 100³ = 1 000 000 = <b>10⁶</b>. Astuce pour ne pas confondre : « parenthèses → multiplication », « sans parenthèses → addition ». Vérification : (2³)² = 8² = 64 = 2⁶ ✓.</div>"},
{"t": "Puissances (collège)", "q": "Simplifier 7⁵ ÷ 7³.", "c": ["7²", "7⁸", "7¹⁵", "1"], "a": 0, "e": "Quotient de même base : on soustrait les exposants, 5 − 3 = 2, donc 7².", "d": "Règle du quotient : <b>aᵐ ÷ aⁿ = aᵐ⁻ⁿ</b> — on soustrait les exposants, on ne les divise pas.<div class='ex-detail'><u>Exemple rédigé</u> : 7⁵ ÷ 7³ = 16807 ÷ 343 = <b>49 = 7²</b>. Piège : écrire 7⁵/³ ou 1⁷² n'a aucun sens. La vérification numérique (49) confirme la règle.</div>"},
{"t": "Puissances (collège)", "q": "Calculer 3 × 10⁵ × 4 × 10⁻³.", "c": ["6 × 10⁸", "12 × 10²", "1,2 × 10³", "6 × 10²"], "a": 2, "e": "(3×4) × (10⁵×10⁻³) = 12 × 10² = 1,2 × 10³ : on regroupe nombres et puissances.", "d": "Méthode : <b>regrouper</b> les nombres d'un côté, les puissances de 10 de l'autre, puis remettre en écriture scientifique.<div class='ex-detail'><u>Exemple rédigé</u> : (3 × 4) × (10⁵⁺⁽⁻³⁾) = 12 × 10². Puis 12 = 1,2 × 10, donc le résultat vaut 1200 = <b>1,2 × 10³</b>. La réponse 12 × 10² est correcte mais pas en écriture scientifique.</div>"},
{"t": "Puissances (collège)", "q": "Combien vaut −2⁴ ?", "c": ["16", "−16", "8", "−8"], "a": 1, "e": "Sans parenthèses, la base est 2 : −2⁴ = −(2⁴) = −16.", "d": "Convention d'écriture : <b>−2⁴ = −(2⁴)</b> : la puissance est prioritaire sur le signe.<div class='ex-detail'><u>Exemple rédigé</u> : −2⁴ = −(2×2×2×2) = <b>−16</b>, alors que (−2)⁴ = +16. La présence des parenthèses autour de −2 change la base. À retenir : exposant pair sans parenthèses → résultat négatif quand le « − » est devant.</div>"},
{"t": "Droite des milieux (collège)", "q": "I est le milieu de [AB], J celui de [AC] dans le triangle ABC. Que peut-on dire de (IJ) ?", "c": ["(IJ) est perpendiculaire à (BC)", "(IJ) est parallèle à (BC)", "(IJ) passe par le sommet A", "On ne peut rien dire"], "a": 1, "e": "La droite des milieux est parallèle au troisième côté : (IJ) ∥ (BC).", "d": "C'est le <b>théorème des milieux</b> : une droite qui passe par les milieux de deux côtés d'un triangle est parallèle au troisième côté.<div class='ex-detail'><u>Exemple</u> : dessinez un triangle quelconque, placez I et J aux milieux : la droite (IJ) « suit » le côté [BC] sans jamais le couper, quel que soit le triangle. Ce théorème ne demande aucune mesure : il suffit de CONNAÎTRE les deux milieux.</div>"},
{"t": "Droite des milieux (collège)", "q": "BC = 12 cm, I et J milieux de [AB] et [AC]. Combien vaut IJ ?", "c": ["12 cm", "6 cm", "24 cm", "4 cm"], "a": 1, "e": "IJ = BC/2 = 12/2 = 6 cm : le segment des milieux mesure la moitié du troisième côté.", "d": "Le segment qui joint les milieux mesure <b>la moitié du troisième côté</b> (celui qui n'a pas de milieu marqué).<div class='ex-detail'><u>Exemple rédigé</u> : IJ = BC/2 = 6 cm. Et dans l'autre sens : si IJ = 7 cm, alors BC = 2 × 7 = 14 cm. Piège : dire IJ = BC/2 ne concerne QUE le troisième côté — pas [AB] ni [AC].</div>"},
{"t": "Droite des milieux (collège)", "q": "IJ = 4,5 cm (segment des milieux). Combien vaut BC ?", "c": ["2,25 cm", "4,5 cm", "8 cm", "9 cm"], "a": 3, "e": "BC = 2 × IJ = 2 × 4,5 = 9 cm.", "d": "Relation dans les DEUX sens : IJ = BC/2 ⟺ <b>BC = 2 × IJ</b>.<div class='ex-detail'><u>Exemple rédigé</u> : BC = 2 × 4,5 = <b>9 cm</b>. Piège classique : diviser au lieu de multiplier (répondre 2,25). Astuce de contrôle : le segment des milieux est TOUJOURS plus court que le troisième côté ; ici 4,5 < 9 ✓, alors que 2,25 donnerait un segment des milieux plus long que BC : absurde.</div>"},
{"t": "Droite des milieux (collège)", "q": "Une droite passe par le milieu de [AB] et est parallèle à (BC). Elle coupe [AC]…", "c": ["en son milieu", "aux deux tiers", "n'importe où", "au sommet C"], "a": 0, "e": "Réciproque du théorème : elle coupe le troisième côté [AC] en son milieu.", "d": "C'est la <b>réciproque</b> : un milieu + une parallèle ⟹ le point d'intersection avec le 3ᵉ côté est son milieu.<div class='ex-detail'><u>Exemple rédigé</u> : K milieu de [AB], (d) ∥ (BC), (d) coupe [AC] en L. Hypothèses : un milieu + une parallèle. Conclusion : <b>L est le milieu de [AC]</b>. C'est l'outil idéal pour prouver qu'un point est un milieu sans aucune mesure.</div>"},
{"t": "Droite des milieux (collège)", "q": "Dans un triangle, on relie les milieux des quatre côtés d'un quadrilatère quelconque. On obtient toujours…", "c": ["un rectangle", "un losange", "un parallélogramme", "un carré"], "a": 2, "e": "Le quadrilatère des milieux est toujours un parallélogramme (théorème des milieux appliqué aux deux triangles).", "d": "Avec la diagonale [AC], le théorème donne (IJ) ∥ (AC) ∥ (LK) et IJ = LK = AC/2 : deux côtés <b>parallèles et de même longueur</b> ⟹ parallélogramme.<div class='ex-detail'><u>Exemple rédigé</u> : dans ABC, IJ joint les milieux de [AB] et [BC] donc IJ = AC/2 ; dans ACD, LK joint les milieux de [AD] et [CD] donc LK = AC/2. D'où IJ = LK et (IJ) ∥ (LK). C'est le quadrilatère de Varignon — un parallélogramme, même si le quadrilatère de départ est « tordu ».</div>"},
{"t": "Droite des milieux (collège)", "q": "Le théorème des milieux s'applique…", "c": ["dans n'importe quel triangle", "seulement dans un triangle rectangle", "seulement dans un triangle isocèle", "seulement dans un triangle équilatéral"], "a": 0, "e": "Il s'applique à tout triangle, sans condition particulière d'angles ou de côtés.", "d": "Contrairement au théorème de Pythagore (qui exige un triangle <b>rectangle</b>), le théorème des milieux vaut pour <b>tout triangle</b>.<div class='ex-detail'><u>À retenir</u> : Pythagore → condition « rectangle » ; milieux → aucune condition ; Thalès (3e) → droites parallèles. Bien associer chaque théorème à SES hypothèses est la clé des démonstrations au collège.</div>"},
{"t": "Droite des milieux (collège)", "q": "I milieu de [AB], J milieu de [AC], BC = 9. Quelle est la longueur IJ ?", "c": ["9", "4,5", "18", "3"], "a": 1, "e": "IJ = BC/2 = 9/2 = 4,5.", "d": "Application directe : <b>IJ = BC/2</b>.<div class='ex-detail'><u>Exemple rédigé</u> : IJ = 9/2 = <b>4,5</b>. Remarque : même sans connaître AB ni AC, on connaît IJ ! C'est la force du théorème : le segment des milieux ne dépend QUE du troisième côté.</div>"},
{"t": "Droite des milieux (collège)", "q": "La droite qui joint un sommet au milieu du côté opposé s'appelle…", "c": ["la droite des milieux", "la médiane", "la hauteur", "la médiatrice"], "a": 1, "e": "C'est la médiane ; la droite des milieux joint les milieux de deux côtés et ne passe pas par un sommet.", "d": "Ne pas confondre les « droites remarquables » : <b>médiane</b> = sommet → milieu du côté opposé ; <b>droite des milieux</b> = milieu → milieu (parallèle au 3ᵉ côté) ; <b>hauteur</b> = perpendiculaire au côté opposé ; <b>médiatrice</b> = perpendiculaire en son milieu à un côté.<div class='ex-detail'><u>Exemple</u> : dans un triangle ABC, la médiane issue de A va de A au milieu de [BC] ; la droite des milieux, elle, ne touche A <i>jamais</i> : elle joint les milieux de [AB] et [AC].</div>"},
{"t": "Droite des milieux (collège)", "q": "Pour appliquer le théorème des milieux, il faut connaître…", "c": ["les milieux de deux côtés (ou un milieu + une parallèle)", "les trois angles du triangle", "la longueur des trois côtés", "le périmètre du triangle"], "a": 0, "e": "Deux milieux suffisent (ou un milieu plus une parallèle pour la réciproque) : aucune mesure n'est nécessaire.", "d": "Les hypothèses du théorème sont <b>purement géométriques</b> : deux milieux ⟹ parallèle + moitié du 3ᵉ côté.<div class='ex-detail'><u>Exemple</u> : « I est le milieu de [AB] et J celui de [AC] » suffit pour affirmer (IJ) ∥ (BC) ET IJ = BC/2. Aucune longueur d'angle n'est requise — c'est ce qui rend ce théorème si pratique en démonstration.</div>"},
{"t": "Droite des milieux (collège)", "q": "I et J milieux de [AB] et [AC], IJ = 7, BC = 15. Les données sont-elles cohérentes ?", "c": ["Oui, tout va bien", "Non : on devrait avoir IJ = 7,5", "Non : on devrait avoir IJ = 30", "On ne peut pas savoir"], "a": 1, "e": "Le théorème impose IJ = 15/2 = 7,5 ≠ 7 : les données contredisent le théorème.", "d": "Le théorème des milieux est une <b>contrainte</b> : si les milieux sont connus, IJ est IMPOSÉ par BC/2.<div class='ex-detail'><u>Exemple rédigé</u> : IJ doit valoir 15/2 = <b>7,5</b>. Annoncer IJ = 7 contredit le théorème : soit I ou J n'est pas réellement un milieu, soit BC ≠ 15. Ce type de question « cohérence » tombe souvent au contrôle : toujours vérifier IJ × 2 = BC.</div>"},
{"t": "Calcul littéral (collège)", "q": "Réduire 5x + 3 − 2x + 7.", "c": ["3x + 10", "7x + 10", "3x − 4", "13x"], "a": 0, "e": "5x − 2x = 3x et 3 + 7 = 10, donc 3x + 10.", "d": "On regroupe les <b>termes de même nature</b> : les « x » entre eux, les nombres entre eux.<div class='ex-detail'><u>Exemple rédigé</u> : 5x + 3 − 2x + 7 = (5x − 2x) + (3 + 7) = <b>3x + 10</b>. Piège : additionner tout (7x + 13x ?) ou mélanger x et nombres (13x) : 3x + 10 est irréductible, x désigne un nombre inconnu, pas le nombre 1.</div>"},
{"t": "Calcul littéral (collège)", "q": "x + x + x + x est égal à…", "c": ["x⁴", "4x", "4 + x", "x² + x"], "a": 1, "e": "Quatre fois x en somme : x + x + x + x = 4x.", "d": "Somme répétée ⟹ <b>4x</b> ; produit répété ⟹ x⁴. Il faut distinguer les deux situations.<div class='ex-detail'><u>Exemple</u> : avec x = 3, la somme 3+3+3+3 = 12 = 4×3 = 4x ✓, alors que x⁴ = 81. Astuce visuelle : additionner des « baguettes » donne 4 baguettes ; multiplier x par x par x par x donne un nombre totalement différent.</div>"},
