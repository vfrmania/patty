    "titre": "Dérivation : opérations et étude des variations",
    "cours": "<div class=\"cours-head\"><h2>Dérivation : opérations et étude des variations</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Somme, produit, quotient</h3>\n<div class=\"tip\"><b>Les trois règles</b> :\n(u + v)′ = u′ + v′ ;\n(uv)′ = u′v + uv′ ;\n(u/v)′ = (u′v − uv′)/v² ;\net (ku)′ = k·u′.\nLe produit et le quotient sont les deux formules qui exigent un entraînement régulier.</div>\n<table>\n<tr><th>Fonction</th><th>Décomposition</th><th>Règle</th><th>Dérivée</th></tr>\n<tr><td>f(x) = x·√x (x &gt; 0)</td><td>produit u = x, v = √x</td><td>u′v + uv′</td><td>√x + x/(2√x) = (3/2)√x</td></tr>\n<tr><td>f(x) = (x² + 1)/x</td><td>quotient</td><td>(u′v − uv′)/v²</td><td>(2x·x − (x²+1)·1)/x² = (x² − 1)/x²</td></tr>\n<tr><td>f(x) = 3x² − 5x + 7</td><td>somme</td><td>terme à terme</td><td>6x − 5</td></tr>\n<tr><td>f(x) = 1/(x² + 1)</td><td>quotient (u = 1)</td><td>−u′... plutôt : (0·v − 1·2x)/v²</td><td>−2x/(x²+1)²</td></tr>\n</table>\n<ul>\n<li>Stratégie : toujours <b>identifier la structure</b> (somme ? produit ? quotient ?) avant d'écrire la dérivée ;</li>\n<li>La dérivée d'un quotient est le refuge des erreurs de signe : écrire (bas × dérivée haut) − (haut × dérivée bas), puis diviser par le bas² ;</li>\n<li>Simplifier la dérivée avant d'étudier son signe : factoriser au maximum.</li>\n</ul>\n\n<h3>2. Composées et racines n-ièmes</h3>\n<ul>\n<li>Dérivée de f(ax + b) : a·f′(ax + b) : la règle de la <b>fonction affine composée</b> ;</li>\n<li>Exemples : (2x + 3)⁴ → 8(2x + 3)³ ; √(5x − 1) → 5/(2√(5x−1)) ; 1/(3 − x) → 1/(3−x)² (signe + : la dérivée de 3 − x est −1, et le −1/... × −1 donne +) ;</li>\n<li>Fonction racine n-ième : (ⁿ√x)′ = 1/(n(ⁿ√x)ⁿ⁻¹) : généralisation de la racine carrée ;</li>\n<li>Puissances négatives : x⁻¹ → −x⁻² : la règle (xⁿ)′ = n·xⁿ⁻¹ marche pour tout n entier relatif.</li>\n</ul>\n\n<h3>3. Étude complète : le plan de travail</h3>\n<ol>\n<li><b>Ensemble de définition</b> : valeurs interdites, racines, quotients ;</li>\n<li><b>Dérivée</b> : calculer, factoriser ;</li>\n<li><b>Signe de f′</b> : tableau de signes complet ;</li>\n<li><b>Variations de f</b> : flèches + valeurs aux bornes et aux extremums ;</li>\n<li><b>Compléments</b> : tangentes horizontales (f′ = 0), limites éventuelles, courbe.</li>\n</ol>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Courbe et pente de la derivee\">\n  <line x1=\"30\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <path d=\"M 50 40 C 120 40 140 110 200 110 C 260 110 280 60 380 30\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <circle cx=\"200\" cy=\"110\" r=\"4.5\" fill=\"#ef4444\"/>\n  <text x=\"205\" y=\"125\" font-size=\"11\" fill=\"#ef4444\">f′ = 0 : minimum local</text>\n  <text x=\"60\" y=\"35\" font-size=\"11\" fill=\"#16a34a\">f′ &lt; 0 : la courbe descend</text>\n  <text x=\"290\" y=\"50\" font-size=\"11\" fill=\"#f59e0b\">f′ &gt; 0 : la courbe monte</text>\n</svg><span class=\"fig-cap\">Le lien fondamental : le signe de f′ pilote la monotonie — le minimum (rouge) est l'endroit où f′ s'annule en changeant de signe (− vers +).</span></div>\n\n<h3>4. Optimisation sous contrainte : la recette</h3>\n<ul>\n<li>Modéliser la quantité à optimiser (aire, volume, coût, distance) comme une fonction d'<b>une</b> variable ;</li>\n<li>Exploiter la contrainte pour éliminer les autres variables ;</li>\n<li>Dériver, chercher f′ = 0, vérifier le changement de signe ;</li>\n<li>Conclure avec l'unité et une phrase en français : « l'aire maximale vaut ... m² pour x = ... ».</li>\n</ul>\n\n<h3>5. Dérivées des classiques de 1re</h3>\n<table>\n<tr><th>f(x)</th><th>f′(x)</th><th>Remarque</th></tr>\n<tr><td>xⁿ</td><td>n·xⁿ⁻¹</td><td>n entier relatif</td></tr>\n<tr><td>(ax + b)ⁿ</td><td>na(ax+b)ⁿ⁻¹</td><td>affine composée</td></tr>\n<tr><td>u·v</td><td>u′v + uv′</td><td>produit</td></tr>\n<tr><td>u/v</td><td>(u′v − uv′)/v²</td><td>quotient, v ≠ 0</td></tr>\n<tr><td>1/v</td><td>−v′/v²</td><td>cas particulier u = 1</td></tr>\n<tr><td>√v</td><td>v′/(2√v)</td><td>v &gt; 0</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — étude complète de f(x) = x + 1/x sur x &gt; 0 (la fonction « fil »)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit f(x) = x + 1/x sur ]0 ; +∞[. 1) Dériver. 2) Variations et minimum. 3) Interpréter le coût de production minimal : main-d'œuvre + stock.</div><div class=\"etu\"><b>Étape 1 — Dérivée</b> : f′(x) = 1 − 1/x² = (x² − 1)/x² : factorisée, le signe ne dépend que de x² − 1.</div><div class=\"etu\"><b>Étape 2 — Variations</b> : f′ &lt; 0 sur ]0 ; 1[, f′ &gt; 0 sur ]1 ; +∞[ : minimum en x = 1 : f(1) = <b>2</b>.</div><div class=\"etu\"><b>Étape 3 — Modèle économique</b> : coût C(q) = 0,5q + 50/q (main-d'œuvre proportionnelle + stock inverse) : minimum en q = √(50/0,5) = 10 unités : C(10) = 10 €.</div><div class=\"etu\"><b>Étape 4 — Inégalité cachée</b> : f(x) ≥ 2 pour tout x &gt; 0 équivaut à x + 1/x ≥ 2, c'est-à-dire x + 1/x ≥ 2√(x·1/x) = 2 : la dérivée redémontre l'inégalité arithmético-géométrique pour deux nombres — les maths se recouvrent.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — dériver un quotient sans se tromper de signe</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dériver et étudier les variations de g(x) = (x² + 2)/(x − 1) sur ]1 ; +∞[.</div><div class=\"etu\"><b>Étape 1 — Quotient</b> : u = x²+2 (u′ = 2x), v = x−1 (v′ = 1) : g′(x) = (2x(x−1) − (x²+2)·1)/(x−1)² = (2x² − 2x − x² − 2)/(x−1)² = (x² − 2x − 2)/(x−1)².</div><div class=\"etu\"><b>Étape 2 — Signe</b> : dénominateur (x−1)² &gt; 0 sur ]1 ; +∞[ : le signe est celui du numérateur : racines 1 ± √3 : seule 1 + √3 ≈ 2,73 est dans l'intervalle.</div><div class=\"etu\"><b>Étape 3 — Variations</b> : g′ &lt; 0 sur ]1 ; 1+√3[ (numérateur négatif), &gt; 0 ensuite : minimum local en x = 1 + √3 : g(1+√3) = ((1+√3)² + 2)/√3 = (4 + 2√3 + 2)/√3 = (6 + 2√3)/√3 = 2 + 2√3 ≈ <b>5,46</b>.</div><div class=\"etu\"><b>Étape 4 — Discipline du signe</b> : en citant « dénominateur positif car carré », le tableau ne dépend que du trinôme numérateur : chaque affirmation de signe est justifiée — c'est ce que le correcteur veut lire.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>(uv)′ = u′v′ : FAUX — la dérivée d'un produit n'est pas le produit des dérivées.</li>\n<li>(u/v)′ : inverser u′v − uv′ : l'ordre du numérateur est une convention... et une source de −1 fantômes.</li>\n<li>Dérivée d'un quotient : oublier le carré du dénominateur.</li>\n<li>(1/v)′ = v′/v² : le signe − manque (c'est −v′/v²).</li>\n<li>Étudier le signe d'une dérivée non factorisée : factoriser d'abord, toujours.</li>\n</ul>\n</div>\n\n<h3>6. Convexité : la dérivée seconde entre en jeu</h3>\n<div class=\"tip\"><b>Convexité</b> : f est convexe sur I si f″ ≥ 0 (la courbe « sourit », tangentes sous la courbe) ; concave si f″ ≤ 0 (« boude », tangentes au-dessus). Point d'inflexion : là où f″ s'annule en changeant de signe.</div>\n<ul>\n<li>x² : f″ = 2 &gt; 0 : convexe partout (le réflexe des courbes « en U ») ;</li>\n<li>x³ : f″ = 6x : négative avant 0, positive après : inflexion à l'origine — le tracé change de cambrure ;</li>\n<li>Interprétation économique : coût convexe = rendements décroissants ;</li>\n<li>La convexité contrôle la qualité des approximations : la tangente approche bien une fonction convexe <b>par défaut</b>.</li>\n</ul>\n<table>\n<tr><th>f</th><th>f′</th><th>f″</th><th>Convexité</th></tr>\n<tr><td>x²</td><td>2x</td><td>2</td><td>convexe</td></tr>\n<tr><td>x³</td><td>3x²</td><td>6x</td><td>inflexion en 0</td></tr>\n<tr><td>1/x (x&gt;0)</td><td>−1/x²</td><td>2/x³</td><td>convexe</td></tr>\n<tr><td>√x</td><td>1/(2√x)</td><td>−1/(4x√x)</td><td>concave</td></tr>\n</table>\n<details class=\"ex-util\"><summary>💡 Focus sur... — distance minimale d'une courbe à un point</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit la parabole f(x) = x² et le point A(0 ; 3). On cherche le point de la courbe le plus proche de A. 1) Modéliser la distance. 2) Dériver et optimiser (on minimise le carré de la distance). 3) Interpréter géométriquement la solution.</div><div class=\"etu\"><b>Étape 1 — Modèle</b> : d(x)² = (x − 0)² + (x² − 3)² = x² + x⁴ − 6x² + 9 = x⁴ − 5x² + 9.</div><div class=\"etu\"><b>Étape 2 — Dérivée</b> : g(x) = d(x)² : g′(x) = 4x³ − 10x = 2x(2x² − 5) : s'annule en x = 0 et x = ±√(5/2) ≈ ±1,58.</div><div class=\"etu\"><b>Étape 3 — Sélection du minimum</b> : g(0) = 9 ; g(±1,58) = 6,25 − 12,5 + 9 = 2,75 : les points (±1,58 ; 2,5) minimisent : distance ≈ √2,75 ≈ <b>1,66</b>.</div><div class=\"etu\"><b>Étape 4 — Géométrie</b> : en ces points, la tangente à la parabole est <b>perpendiculaire</b> au segment vers A (sinon on pourrait se rapprocher) : minimiser la distance = orthogonalité avec la tangente — la dérivée relie l'analyse et la géométrie pure.</div></div></details>"

    "cours": "<div class=\"cours-head\"><h2>Suites arithmétiques et géométriques</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Définitions et raisonnement par récurrence (amorce)</h3>\n<ul>\n<li>Une <b>suite</b> (uₙ) est une liste infinie de nombres indexée par n : u₀, u₁, u₂... ;</li>\n<li>Définie <b>explicitement</b> : uₙ = n² + 1 (formule directe) ou <b>par récurrence</b> : u₀ = 2 et uₙ₊₁ = 2uₙ − 1 (chaque terme par le précédent) ;</li>\n<li>Suite <b>arithmétique</b> : on ajoute une constante r : uₙ₊₁ = uₙ + r ;</li>\n<li>Suite <b>géométrique</b> : on multiplie par une constante q : uₙ₊₁ = q·uₙ ;</li>\n<li>Test express : uₙ₊₁ − uₙ constant → arithmétique ; uₙ₊₁/uₙ constant → géométrique.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Suites arithmetique et geometrique\"\n  <line x1=\"30\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"30\" y1=\"15\" x2=\"30\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <circle cx=\"70\" cy=\"115\" r=\"4\" fill=\"#4f46e5\"/><circle cx=\"120\" cy=\"100\" r=\"4\" fill=\"#4f46e5\"/><circle cx=\"170\" cy=\"85\" r=\"4\" fill=\"#4f46e5\"/><circle cx=\"220\" cy=\"70\" r=\"4\" fill=\"#4f46e5\"/><circle cx=\"270\" cy=\"55\" r=\"4\" fill=\"#4f46e5\"/>\n  <text x=\"270\" y=\"40\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">arithmétique : droite</text>\n  <circle cx=\"320\" cy=\"117\" r=\"4\" fill=\"#16a34a\"/><circle cx=\"345\" cy=\"95\" r=\"4\" fill=\"#16a34a\"/><circle cx=\"370\" cy=\"50\" r=\"4\" fill=\"#16a34a\"/><circle cx=\"388\" cy=\"20\" r=\"4\" fill=\"#16a34a\"/>\n  <text x=\"330\" y=\"125\" font-size=\"12\" fill=\"#16a34a\">géométrique (q = 2) : explose</text>\n</svg><span class=\"fig-cap\">L'arithmétique croît <b>linéairement</b> (+r à chaque pas) ; la géométrique croît <b>exponentiellement</b> (×q) : pour q &gt; 1, elle finit toujours par dominer.</span></div>\n\n<h3>2. Termes généraux : les formules clés</h3>\n<div class=\"tip\"><b>Arithmétique</b> : uₙ = u₀ + n·r (et uₙ = uₚ + (n − p)·r).\n<b>Géométrique</b> : uₙ = u₀·qⁿ (et uₙ = uₚ·qⁿ⁻ᵖ).\n<b>Sommes</b> : arithmétique : S = (nombre de termes)×(premier + dernier)/2 ; géométrique : S = u₀·(1 − qⁿ⁺¹)/(1 − q) (q ≠ 1).</div>\n<table>\n<tr><th>Suite</th><th>Premiers termes</th><th>Terme général</th><th>Somme u₀ + ... + uₙ</th></tr>\n<tr><td>u₀ = 3, r = 5</td><td>3 ; 8 ; 13 ; 18</td><td>uₙ = 3 + 5n</td><td>(n+1)(3 + uₙ)/2</td></tr>\n<tr><td>u₀ = 2, q = 3</td><td>2 ; 6 ; 18 ; 54</td><td>uₙ = 2·3ⁿ</td><td>2(3ⁿ⁺¹ − 1)/2 = 3ⁿ⁺¹ − 1</td></tr>\n<tr><td>u₀ = 1000, q = 0,9</td><td>1000 ; 900 ; 810</td><td>uₙ = 1000·0,9ⁿ</td><td>1000(1 − 0,9ⁿ⁺¹)/0,1</td></tr>\n</table>\n<ul>\n<li>Vérification d'indice : de u₃ à u₁₀, il y a 8 termes (10 − 3 + 1) — l'erreur de comptage classique ;</li>\n<li>Somme arithmétique : l'astuce de Gauss — 1 + 2 + ... + 100 = 50×101 = 5050 : paires (premier + dernier).</li>\n</ul>\n\n<h3>3. Sens de variation et suites auxiliaires</h3>\n<ul>\n<li>Arithmétique : croissante si r &gt; 0, décroissante si r &lt; 0, constante si r = 0 ;</li>\n<li>Géométrique (termes positifs) : croissante si q &gt; 1, décroissante si 0 &lt; q &lt; 1 ;</li>\n<li>Méthode générale : étudier le signe de uₙ₊₁ − uₙ, ou du rapport uₙ₊₁/uₙ (termes positifs) ;</li>\n<li><b>Suite auxiliaire</b> : pour vₙ₊₁ = a·vₙ + b, poser uₙ = vₙ − b/(1−a) : u devient géométrique de raison a — LA technique du chapitre.</li>\n</ul>\n\n<h3>4. Modéliser : placements, crédits, demi-vies</h3>\n<ul>\n<li><b>Intérêts simples</b> : arithmétique : uₙ = C + n·i (loyer constant ajouté chaque année) ;</li>\n<li><b>Intérêts composés</b> : géométrique : uₙ = C·(1 + t)ⁿ : capital ×1,03 par an → uₙ = C·1,03ⁿ ;</li>\n<li><b>Dépréciation</b> : valeur ×0,85 par an : quand vaut-elle la moitié ? 0,85ⁿ = 0,5 → n = ln(0,5)/ln(0,85) ≈ 4,3 ans ;</li>\n<li><b>Demi-vie radioactive</b> : masse ×0,5 tous les T : uₙ = m₀·0,5ⁿ : le carbone 14 (T = 5730 ans) date les fossiles.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la suite mixte : géométrique déguisée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit v₀ = 10 et vₙ₊₁ = 0,5·vₙ + 3. 1) Trouver α tel que la suite uₙ = vₙ − α soit géométrique. 2) En déduire vₙ. 3) Longueur du pliage : une feuille de 0,1 mm pliée en deux n fois a une épaisseur vₙ = 0,1×2ⁿ mm ; quand dépasse-t-elle la Tour Eiffel (330 m) ?</div><div class=\"etu\"><b>Étape 1 — Point fixe</b> : α = 0,5α + 3 → α = 6 : uₙ = vₙ − 6 vérifie uₙ₊₁ = 0,5·uₙ : géométrique de raison 0,5, u₀ = 4.</div><div class=\"etu\"><b>Étape 2 — vₙ</b> : uₙ = 4·0,5ⁿ → vₙ = <b>6 + 4·0,5ⁿ</b> : vₙ → 6 (la suite « converge » vers son point fixe).</div><div class=\"etu\"><b>Étape 3 — Pliage</b> : 0,1×2ⁿ mm &gt; 330 000 mm → 2ⁿ &gt; 3,3×10⁶ : n = 22 suffit (2²² ≈ 4,2×10⁶) : <b>22 pliages</b> seulement !</div><div class=\"etu\"><b>Étape 4 — Moralité</b> : la croissance géométrique est contre-intuitive : 22 plis = Tour Eiffel, 42 plis = distance Terre-Lune. Toute suite « +b » derrière un « ×a » cache une géométrique : chercher le point fixe α = b/(1−a) et translater.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — épargner ou rembourser ? Le duel des suites</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Option A : placer 1000 € à 3 % composés pendant 10 ans. Option B : rembourser un crédit de 1000 € au taux de 2 % composés par annuités constantes de 120 €/an pendant 10 ans (on néglige le solde résiduel final). 1) Capital A au bout de 10 ans ? 2) Solde B ? 3) Comparer.</div><div class=\"etu\"><b>Étape 1 — Option A</b> : A₁₀ = 1000×1,03¹⁰ ≈ <b>1344 €</b> : la puissance des intérêts composés.</div><div class=\"etu\"><b>Étape 2 — Option B (amorce)</b> : solde Sₙ : Sₙ₊₁ = 1,02·Sₙ − 120 : suite « géométrique déguisée » : point fixe α : α = 1,02α − 120 → α = 6000 : uₙ = Sₙ − 6000 géométrique de raison 1,02, u₀ = −5000.</div><div class=\"etu\"><b>Étape 3 — Solde B</b> : uₙ = −5000×1,02ⁿ → Sₙ = 6000 − 5000×1,02ⁿ : S₁₀ = 6000 − 5000×1,219 ≈ <b>−95 €</b> : presque soldé (léger reliquat à régler).</div><div class=\"etu\"><b>Étape 4 — Décision</b> : l'option A fructifie 344 € pendant que l'option B coûte environ 120×10 − 95 ≈ 1105 € remboursés pour 1000 € empruntés (≈ 105 € d'intérêts) : placer (si l'argent est disponible) rapporte ici plus que le crédit ne coûte — la modélisation par suites tranché un débat financier.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>uₙ = u₀ + n·r avec un premier terme u₁ : le comptage des indices décale tout — adapter (uₙ = u₁ + (n−1)r).</li>\n<li>Somme géométrique : oublier le −1 (qⁿ⁺¹ − 1) ou diviser par (1 − q) alors que q = 1.</li>\n<li>Raison q = −1 ou négative : la suite <b>alterne</b> en signe : pas de monotonie.</li>\n<li>Confondre raison arithmétique (addition) et géométrique (multiplication).</li>\n<li>Suite auxiliaire : poser uₙ = vₙ − α sans vérifier que α est bien le point fixe b/(1−a).</li>\n</ul>\n</div>\n\n<h3>5bis. Récurrence et démonstration par induction</h3>\n<ul>\n<li>Pour une suite définie par uₙ₊₁ = f(uₙ), la formule conjecturée (ex. uₙ = 3ⁿ) se prouve par <b>récurrence</b> : initialisation (u₀ vérifie la formule) + hérédité (si uₙ = 3ⁿ, alors uₙ₊₁ = 3·3ⁿ = 3ⁿ⁺¹) ;</li>\n<li>La conjecture issue des premiers termes n'est jamais une preuve : uₙ = n² − n + 41 donne des nombres premiers pour n = 0 à 39... puis se brise en n = 40 (1681 = 41²) ;</li>\n<li>Récurrence et suites arithmético-géométriques : la méthode du point fixe se démontre par récurrence, pas seulement par magie ;</li>\n<li>Structure de la rédaction : « initialisation ... hérédité ... conclusion : pour tout n ≥ 0 » — trois paragraphes, jamais deux.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la légende de Sissa et l'échiquier</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> L'inventeur du jeu d'échecs demande au roi : 1 grain de blé sur la 1re case, 2 sur la 2e, 4 sur la 3e... (doublement). 1) Grains sur la 64e case ? 2) Total de l'échiquier ? 3) Comparer à la production mondiale annuelle de blé (≈ 780 millions de tonnes, 1 grain ≈ 0,05 g).</div><div class=\"etu\"><b>Étape 1 — Case 64</b> : suite géométrique uₙ = 2ⁿ⁻¹ : u₆₄ = 2⁶³ ≈ 9,2×10¹⁸ grains.</div><div class=\"etu\"><b>Étape 2 — Total</b> : S = 1·(2⁶⁴ − 1)/(2 − 1) = 2⁶⁴ − 1 ≈ <b>1,8×10¹⁹ grains</b>.</div><div class=\"etu\"><b>Étape 3 — Masse</b> : ×0,05 g ≈ 9,2×10¹⁴ kg = 9,2×10¹¹ tonnes ≈ <b>1200 ans</b> de production mondiale — la dette était impossible à honorer.</div><div class=\"etu\"><b>Étape 4 — Leçon géométrique</b> : sur 64 cases, l'essentiel du total est sur les toutes dernières (la moitié du total est sur la seule 64e case !) : l'exponentielle concentre tout à la fin — c'est exactement pourquoi les modèles géométriques de contagion ou de dette changent de régime « soudainement ».</div></div></details>\n<ul><li>Astuce de vérification : recalculer u₁ et u₂ depuis la formule générale : pour uₙ = 3 + 5n : u₀ = 3 ✓, u₁ = 8 ✓ : deux secondes qui évitent une faute d'indice coûteuse.</li></ul>"

    "cours": "<div class=\"cours-head\"><h2>Probabilités conditionnelles et indépendance</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Probabilité conditionnelle : « sachant que... »</h3>\n<div class=\"tip\"><b>Définition</b> : P(A | B) = P(A ∩ B)/P(B) (lire « A sachant B ») : on restreint l'univers à B, on recompte. Conséquence fondamentale : <b>P(A ∩ B) = P(B) × P(A | B)</b> — la multiplication en cascade des arbres.</div>\n<ul>\n<li>Exemple : dans une classe, 60 % de filles, dont 70 % font espagnol ; P(fille ET espagnol) = 0,6 × 0,7 = <b>0,42</b> ;</li>\n<li>Attention : P(A | B) ≠ P(B | A) en général : « malade sachant test positif » n'est pas « test positif sachant malade » ;</li>\n<li>Sur un arbre : la probabilité d'un chemin est le <b>produit</b> des branches ; la probabilité d'un événement, la <b>somme</b> des chemins qui y mènent.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Arbre conditionnel test de depistage\">\n  <defs><marker id=\"a3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#64748b\"/></marker></defs>\n  <circle cx=\"55\" cy=\"80\" r=\"4\" fill=\"#1e293b\"/>\n  <line x1=\"55\" y1=\"80\" x2=\"170\" y2=\"35\" stroke=\"#4f46e5\" stroke-width=\"2\" marker-end=\"url(#a3)\"/>\n  <line x1=\"55\" y1=\"80\" x2=\"170\" y2=\"125\" stroke=\"#94a3b8\" stroke-width=\"2\" marker-end=\"url(#a3)\"/>\n  <text x=\"105\" y=\"45\" font-size=\"11\" fill=\"#4f46e5\">malade M (0,1)</text><text x=\"100\" y=\"120\" font-size=\"11\" fill=\"#64748b\">non malade (0,9)</text>\n  <line x1=\"170\" y1=\"35\" x2=\"280\" y2=\"15\" stroke=\"#16a34a\" stroke-width=\"1.5\" marker-end=\"url(#a3)\"/>\n  <line x1=\"170\" y1=\"35\" x2=\"280\" y2=\"52\" stroke=\"#ef4444\" stroke-width=\"1.5\" marker-end=\"url(#a3)\"/>\n  <text x=\"288\" y=\"18\" font-size=\"11\" fill=\"#16a34a\">T+ (0,9) : vrai positif</text>\n  <text x=\"288\" y=\"56\" font-size=\"11\" fill=\"#ef4444\">T− (0,1) : faux négatif</text>\n  <line x1=\"170\" y1=\"125\" x2=\"280\" y2=\"105\" stroke=\"#ef4444\" stroke-width=\"1.5\" marker-end=\"url(#a3)\"/>\n  <line x1=\"170\" y1=\"125\" x2=\"280\" y2=\"142\" stroke=\"#16a34a\" stroke-width=\"1.5\" marker-end=\"url(#a3)\"/>\n  <text x=\"288\" y=\"108\" font-size=\"11\" fill=\"#ef4444\">T+ (0,08) : faux positif</text>\n  <text x=\"288\" y=\"146\" font-size=\"11\" fill=\"#16a34a\">T− (0,92)</text>\n  <text x=\"120\" y=\"160\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">les branches de 2e niveau sont des probabilités conditionnelles</text>\n</svg><span class=\"fig-cap\">Arbre d'un test de dépistage : sensibilité 0,9 (T+ sachant malade), faux positifs 0,08 : le produit des branches donne P(M ∩ T+), etc.</span></div>\n\n<h3>2. Formule des probabilités totales</h3>\n<div class=\"tip\"><b>Si B₁, B₂, B₃... forment une partition de l'univers</b> (incompatibles et couvrant tout), alors : P(A) = P(B₁)×P(A|B₁) + P(B₂)×P(A|B₂) + ... En arbre : <b>sommer tous les chemins qui aboutissent à A</b>.</div>\n<ul>\n<li>Exemple : P(T+) = P(M)×P(T+|M) + P(M̄)×P(T+|M̄) = 0,1×0,9 + 0,9×0,08 = 0,09 + 0,072 = <b>0,162</b> ;</li>\n<li>C'est le théorème du « déconditionnement » : retrouver la probabilité globale depuis les cas particuliers ;</li>\n<li>Partition la plus courante : {B ; B̄} — deux branches seulement.</li>\n</ul>\n\n<h3>3. Bayes : renverser le conditionnement</h3>\n<div class=\"tip\"><b>Formule de Bayes</b> : P(B | A) = P(B)×P(A|B) / P(A) — le numérateur est le chemin, le dénominateur la somme des chemins (probabilités totales). C'est LA formule du « renversement de perspective ».</div>\n<ul>\n<li>Exemple (dépistage) : P(M | T+) = (0,1×0,9)/0,162 = 0,09/0,162 ≈ <b>0,556</b> : seulement 56 % de malades parmi les positifs !</li>\n<li>L'intuition dit « test positif = malade à 90 % » : faux — les faux positifs du grand groupe sain pèsent presque autant que les vrais ;</li>\n<li>C'est le piège du « base rate » : pour une maladie rare, P(M|T+) peut être minuscule (écran de dépistage) ;</li>\n<li>En pratique : toujours dérouler l'arbre, jamais raisonner « de tête » sur les pourcentages.</li>\n</ul>\n<table>\n<tr><th>Quantité</th><th>Calcul</th><th>Valeur</th></tr>\n<tr><td>P(M ∩ T+)</td><td>0,1 × 0,9</td><td>0,09</td></tr>\n<tr><td>P(M̄ ∩ T+)</td><td>0,9 × 0,08</td><td>0,072</td></tr>\n<tr><td>P(T+) (totaux)</td><td>0,09 + 0,072</td><td>0,162</td></tr>\n<tr><td>P(M | T+) (Bayes)</td><td>0,09/0,162</td><td>≈ 0,556</td></tr>\n<tr><td>Si prévalence 1 % : P(M|T+)</td><td>0,009/(0,009+0,00792)</td><td>≈ 0,53</td></tr>\n</table>\n\n<h3>4. Indépendance : quand le « sachant » ne change rien</h3>\n<ul>\n<li>A et B indépendants ⟺ <b>P(A ∩ B) = P(A)×P(B)</b> ⟺ P(A|B) = P(A) ;</li>\n<li>Lancer deux dés : indépendants ; tirer deux cartes <b>sans remise</b> : dépendants (l'univers change) ;</li>\n<li>Indépendance ≠ incompatibilité : incompatibles (A ∩ B = ∅, probabilités non nulles) sont toujours <b>dépendants</b> !</li>\n<li>Vérifier l'indépendance en testant le produit : P(A)×P(B) contre P(A ∩ B) — une ligne de calcul.</li>\n</ul>\n\n<h3>5. Applications : dépistage, sondages, réseaux</h3>\n<ul>\n<li><b>Médecine</b> : sensibilité, spécificité, valeurs prédictives : tout le vocabulaire médical est du Bayes ;</li>\n<li><b>Justice</b> : l'erreur du procureur (confondre P(coupable|indices) et P(indices|coupable)) a condamné des innocents — l'affaire Sally Clark en est l'exemple tragique ;</li>\n<li><b>Spam</b> : filtres bayésiens : P(spam | « GRATUIT ») se met à jour mot à mot ;</li>\n<li><b>Météo</b> : P(pluie demain | pluie aujourd'hui) : les chaînes de Markov des modèles climatiques.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'alarme antivol et le taux de fausses alertes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une alarme se déclenche : à 95 % si cambriolage, à 1 % sinon (fausse alerte). La nuit, il y a un cambriolage dans le quartier avec probabilité 0,2 %. L'alarme sonne : quelle est la probabilité de cambriolage ?</div><div class=\"etu\"><b>Étape 1 — Arbre</b> : P(C ∩ S) = 0,002×0,95 = 0,0019 ; P(C̄ ∩ S) = 0,998×0,01 = 0,00998.</div><div class=\"etu\"><b>Étape 2 — Totaux</b> : P(S) = 0,0019 + 0,00998 = <b>0,01188</b>.</div><div class=\"etu\"><b>Étape 3 — Bayes</b> : P(C | S) = 0,0019/0,01188 ≈ <b>0,16</b> : 16 % seulement !</div><div class=\"etu\"><b>Étape 4 — Leçon</b> : même une alarme « fiable à 95 % » se trompe 5 fois sur 6 si les cambriolages sont rares — le paradoxe du taux de base. Conclusion pratique : multiplier les capteurs indépendants ou hausser le seuil, car une alarme qui crie tout le temps n'informe plus rien.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — indépendance et tirages avec/sans remise</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Urne : 5 boules rouges, 3 noires. On tire deux boules. 1) Avec remise : P(2 rouges) ? Indépendance ? 2) Sans remise : P(2 rouges) ? 3) Sans remise : P(2e rouge | 1re rouge) ?</div><div class=\"etu\"><b>Étape 1 — Avec remise</b> : P = (5/8)² = <b>25/64</b> : les tirages sont indépendants (l'urne revient à l'identique).</div><div class=\"etu\"><b>Étape 2 — Sans remise</b> : P = (5/8)×(4/7) = <b>20/56 = 5/14</b> : plus petit — la première rouge « appauvrit » l'urne.</div><div class=\"etu\"><b>Étape 3 — Conditionnement</b> : P(2e rouge | 1re rouge) = 4/7 ≠ 5/8 : dépendance caractérisée par la modification de l'univers.</div><div class=\"etu\"><b>Étape 4 — Généralité</b> : avec remise = arbre à branches constantes (géométrique en Terminale) ; sans remise = branches qui se déforment (hypergéométrique) : le simple fait de remettre ou non la boule change la famille de lois — l'indépendance est une propriété physique de l'expérience, pas un calcul.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre P(A|B) et P(B|A) : l'erreur du procureur — toujours se demander dans quel sens on conditionne.</li>\n<li>Oublier le dénominateur de Bayes (probabilités totales) : il faut TOUS les chemins vers A.</li>\n<li>Croire qu'incompatibles = indépendants : c'est l'exact contraire (si l'un arrive, l'autre devient impossible).</li>\n<li>Arbre : multiplier les probabilités de deux niveaux sans vérifier que la 2e est bien conditionnelle.</li>\n<li>Bayes avec une prévalence oubliée : le taux de base change tout — toujours le placer en 1re branche.</li>\n</ul>\n</div>\n\n<h3>6. Savoir construire et lire un arbre : la méthode complète</h3>\n<ul>\n<li><b>Étape 1</b> : identifier la partition de premier niveau (malade/sain, fille/garçon, boule tirée 1/2/3...) : les branches de départ sont des probabilités « simples » ;</li>\n<li><b>Étape 2</b> : compléter le 2e niveau avec des probabilités <b>conditionnelles</b> (inscrites sur chaque branche « sachant le chemin déjà parcouru ») ;</li>\n<li><b>Étape 3</b> : vérifier : chaque nœud voit ses branches sommer à 1 ; le produit d'un chemin = probabilité de l'intersection ;</li>\n<li><b>Étape 4</b> : probabilités totales pour « déconditionner », Bayes pour renverser : l'arbre contient déjà tous les nombres — il ne reste qu'à multiplier et sommer ;</li>\n<li>Astuce de rédaction : citer la formule utilisée (totales ou Bayes) AVANT le calcul : les correcteurs cherchent la structure, pas seulement le résultat.</li>\n</ul>\n<table>\n<tr><th>Formule</th><th>En français</th><th>Sur l'arbre</th></tr>\n<tr><td>P(A ∩ B) = P(B)P(A|B)</td><td>et ... et ...</td><td>produit d'un chemin</td></tr>\n<tr><td>P(A) = Σ P(Bᵢ)P(A|Bᵢ)</td><td>toutes les manières d'avoir A</td><td>somme des chemins vers A</td></tr>\n<tr><td>P(B|A) = P(B∩A)/P(A)</td><td>renversement</td><td>un chemin ÷ la somme des chemins</td></tr>\n<tr><td>A ⊥ B ⟺ P(A∩B) = P(A)P(B)</td><td>le sachant ne change rien</td><td>produit = produit des marges</td></tr>\n</table>"

    "cours": "<div class=\"cours-head\"><h2>Produit scalaire et applications</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Trois définitions, un objet</h3>\n<div class=\"tip\"><b>Produit scalaire</b> de u→ et v→ :\n1) analytique : xx′ + yy′ (coordonnées) ;\n2) géométrique : ‖u→‖·‖v→‖·cos(θ) ;\n3) normes : (‖u→‖² + ‖v→‖² − ‖u→ − v→‖²)/2 (Al-Kashi déguisé).\nUn nombre (pas un vecteur !), qui mesure l'« alignement » des deux vecteurs.</div>\n<ul>\n<li>Exemple : u→(3 ; 4), v→(1 ; 2) : u→·v→ = 3 + 8 = <b>11</b> ;</li>\n<li>Norme : ‖u→‖² = u→·u→ : (3 ; 4) → 25 → norme 5 ;</li>\n<li>Orthogonalité : u→·v→ = 0 ⟺ angle droit ⟺ cos θ = 0 ;</li>\n<li>Signe : &gt; 0 (angle aigu), &lt; 0 (obtus), = 0 (droit) : le produit scalaire est un détecteur d'angle.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Projection et produit scalaire\">\n  <line x1=\"40\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"130\" x2=\"200\" y2=\"40\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <line x1=\"40\" y1=\"130\" x2=\"200\" y2=\"130\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <path d=\"M 70 130 A 30 30 0 0 0 68 115\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n  <text x=\"85\" y=\"122\" font-size=\"12\" fill=\"#ef4444\">θ</text>\n  <line x1=\"200\" y1=\"130\" x2=\"200\" y2=\"40\" stroke=\"#ef4444\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  \n  <text x=\"95\" y=\"60\" font-size=\"12\" fill=\"#4f46e5\">v→ (bleu)</text>\n  <text x=\"95\" y=\"145\" font-size=\"12\" fill=\"#16a34a\">projection de v→ sur u→</text>\n  <text x=\"240\" y=\"45\" font-size=\"13\" fill=\"#1e293b\">u→·v→ = ‖u→‖ × (projection de v→)</text>\n  <text x=\"240\" y=\"65\" font-size=\"13\" fill=\"#1e293b\">= ‖u→‖‖v→‖cos θ</text>\n</svg><span class=\"fig-cap\">Le produit scalaire est la norme de u→ multipliée par la projection orthogonale de v→ : quand θ = 90°, la projection s'annule — d'où le test d'orthogonalité.</span></div>\n\n<h3>2. Propriétés calculatoires</h3>\n<ul>\n<li>Symétrie : u→·v→ = v→·u→ ; bilinéarité : u→·(v→ + w→) = u→·v→ + u→·w→ ;</li>\n<li>Identités remarquables vectorielles : ‖u→ + v→‖² = ‖u→‖² + 2u→·v→ + ‖v→‖² ;</li>\n<li>Applications immédiates : trouver un angle par cos θ = (u→·v→)/(‖u→‖‖v→‖) ;</li>\n<li>Exemple : u→(1 ; 2), v→(3 ; 1) : produit 5, normes √5 et √10 : cos θ = 5/√50 = 1/√2 : <b>θ = 45°</b>.</li>\n</ul>\n\n<h3>3. Applications géométriques</h3>\n<table>\n<tr><th>Question</th><th>Traduction scalaire</th><th>Exemple</th></tr>\n<tr><td>droite perpendiculaire</td><td>AM→·u→ = 0</td><td>équation de hauteur</td></tr>\n<tr><td>droite (AB)</td><td>AM→·n→ = 0 (n→ normal)</td><td>cartésienne ax + by + c = 0</td></tr>\n<tr><td>cercle de diamètre [AB]</td><td>MA→·MB→ = 0</td><td>angle inscrit droit</td></tr>\n<tr><td>milieu et médianes</td><td>vectoriel classique</td><td>AB→ + AC→ = 2AG→</td></tr>\n<tr><td>angle (AB→, AC→)</td><td>Al-Kashi / cosinus</td><td>triangle quelconque</td></tr>\n</table>\n<ul>\n<li>Équation de droite par produit scalaire : (AB) : AM→·n→ = 0 avec n→(a ; b) normal : la forme ax + by + c = 0 retrouve son sens géométrique ;</li>\n<li>Cercle de diamètre [AB] : M sur le cercle ⟺ MA→ ⊥ MB→ ⟺ MA→·MB→ = 0 : élégant et puissant ;</li>\n<li>Projeté orthogonal d'un point sur une droite : le pied H vérifie PH→ ⊥ direction — minimisation de distance.</li>\n</ul>\n\n<h3>4. Travailler en repère orthonormé</h3>\n<ul>\n<li>Droite passant par A(x₀ ; y₀), normale n→(a ; b) : a(x − x₀) + b(y − y₀) = 0, c'est-à-dire ax + by + c = 0 ;</li>\n<li>Distance point-droite : d = |ax_A + by_A + c|/√(a² + b²) — le fameux « ax + by + c » des programmes de physique (équipotentielles) ;</li>\n<li>Exemple : droite x + 2y − 3 = 0, point (1 ; 1) : d = |1 + 2 − 3|/√5 = 0 : le point est sur la droite !</li>\n<li>Exemple : distance de l'origine O(0 ; 0) à la droite x + 2y − 3 = 0 : d = |−3|/√5 = 3/√5 ≈ 1,34 : une ligne de calcul.</li>\n</ul>\n\n<h3>5. Produit scalaire dans la nature</h3>\n<ul>\n<li><b>Travail d'une force</b> : W = F→·AB→ : pousser perpendiculairement au déplacement ne travaille pas (cos 90° = 0) ;</li>\n<li><b>Puissance électrique</b> : circuits en alternatif, le facteur cos φ est un produit scalaire ;</li>\n<li><b>Informatique</b> : similarité cosinus des moteurs de recommandation : le produit scalaire des profils mesure la proximité des goûts ;</li>\n<li><b>Lumière</b> : intensité reçue ∝ cos(angle d'incidence) : pourquoi les saisons existent (inclinaison 23,5° de la Terre).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le point le plus proche, ou comment viser droit</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit la droite D : 2x + y − 4 = 0 et le point A(3 ; 5). 1) Trouver le projeté orthogonal H de A sur D. 2) En déduire la distance AH. 3) Vérifier que AH est bien minimale.</div><div class=\"etu\"><b>Étape 1 — Direction et paramétrage</b> : normale n→(2 ; 1) ; direction d→(1 ; −2) : M sur D : M(x ; 4 − 2x) : HM le long de d→.</div><div class=\"etu\"><b>Étape 2 — Orthogonalité</b> : AM→·d→ = 0 : (x−3 ; 4−2x−5)·(1 ; −2) = (x−3) + (−2)(−1−2x) = x − 3 + 2 + 4x = 5x − 1 = 0 → x = 0,2 : H(0,2 ; 3,6).</div><div class=\"etu\"><b>Étape 3 — Distance</b> : AH = √((2,8)² + (1,4)²) = √(7,84 + 1,96) = √9,8 ≈ <b>3,13</b>.</div><div class=\"etu\"><b>Étape 4 — Vérification du minimum</b> : pour tout M sur D, AM² = AH² + HM² ≥ AH² (Pythagore, AH ⊥ D) : la perpendicularité EST la preuve du minimum — le produit scalaire nul est le « certificat d'optimalité » : c'est la même logique que la droite des moindres carrés en statistiques.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — Al-Kashi et l'angle du triangle quelconque</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Triangle ABC avec AB = 5, AC = 7, BC = 8. 1) Calculer l'angle Â. 2) En déduire l'aire du triangle. 3) Retrouver le résultat par le produit scalaire analytique.</div><div class=\"etu\"><b>Étape 1 — Al-Kashi</b> : BC² = AB² + AC² − 2·AB·AC·cos Â : 64 = 25 + 49 − 70cos Â → cos Â = 10/70 = 1/7 : Â ≈ <b>81,8°</b>.</div><div class=\"etu\"><b>Étape 2 — Aire</b> : (1/2)·AB·AC·sin Â : sin Â = √(1 − 1/49) = √48/7 : aire = (1/2)×35×√48/7 = 2,5√48 ≈ <b>17,3</b>.</div><div class=\"etu\"><b>Étape 3 — Cohérence</b> : placer A(0 ; 0), B(5 ; 0), C(1/7×7 ; √48) = (1 ; √48) : vérifier BC = √(16 + 48) = 8 ✓ : les trois approches (longueurs, angle, coordonnées) racontent le même triangle.</div><div class=\"etu\"><b>Étape 4 — Stratégie d'examen</b> : face à un triangle « quelconque », l'ordre gagnant est : Al-Kashi pour un angle, loi des sinus pour les autres, (1/2)bc sin Â pour l'aire — le produit scalaire est le chef d'orchestre silencieux de toute la trigonométrie du triangle.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Le produit scalaire est un vecteur : non — un NOMBRE (le réflexe « xx′ + yy′ » sauve).</li>\n<li>Formule ‖u‖‖v‖cos θ dans un repère non orthonormé : la version analytique exige l'orthonormé.</li>\n<li>Signe : produit négatif ne veut pas dire angle négatif mais angle obtus.</li>\n<li>Confondre vecteur normal n→(a ; b) et vecteur directeur d→(−b ; a) : ils tournent de 90°, rôles opposés.</li>\n<li>Distance point-droite : oublier la racine carrée de a² + b² au dénominateur.</li>\n</ul>\n</div>\n\n<h3>6. Équations de cercles et ensembles du plan</h3>\n<ul>\n<li>Équation de cercle de centre Ω(a ; b), rayon r : (x − a)² + (y − b)² = r² : c'est ‖ΩM→‖² = r², donc un produit scalaire ;</li>\n<li>Ensemble des M tels que MA→·MB→ = 0 : cercle de diamètre [AB] privé de A et B (théorème de l'angle inscrit droit) ;</li>\n<li>Ensemble des M tels que MA→·MH→ = k (constante) : un cercle ou une droite selon le cas — penser « produit scalaire = projection » pour deviner la forme ;</li>\n<li>Méthode d'identification : développer, regrouper en (x − a)² + (y − b)² = R² : le centre et le rayon « tombent » tout seuls ;</li>\n<li>Exemple complet : x² + y² − 4x + 6y − 3 = 0 → (x − 2)² + (y + 3)² = 3 + 4 + 9 = 16 : cercle de centre (2 ; −3), rayon 4 — un réflexe à automatiser ;</li>\n<li>Erreur type : oublier de compenser chaque terme constant introduit : toujours vérifier en remplaçant un point du cercle dans l'équation finale ;</li>\n<li>Lien physique : les équipotentielles d'une charge ponctuelle sont des familles de cercles — résoudre une équation de cercle, c'est parfois dessiner un paysage physique.</li>\n<li>Réflexe d'examen : une équation du 2e degré en x et y, sans terme en xy → penser cercle ; avec terme xy → faire tourner les axes (hors programme, mais savoir le reconnaître).</li>\n</ul>"

    "titre": "Variables aléatoires, espérance, variance",
    "cours": "<div class=\"cours-head\"><h2>Variables aléatoires, espérance, variance</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Variable aléatoire : quantifier le hasard</h3>\n<ul>\n<li>Une <b>variable aléatoire</b> X associe un nombre à chaque issue d'une expérience : gain au jeu, nombre de faces, durée de vie ;</li>\n<li>Sa <b>loi de probabilité</b> : tableau des valeurs xᵢ et de leurs probabilités pᵢ (somme des pᵢ = 1) ;</li>\n<li>Exemple : jeu à 2 € : on lance un dé : 6 → gain 10 €, 5 → 5 €, sinon 0 : X = {10 ; 5 ; 0} avec p = {1/6 ; 1/6 ; 4/6} (gain brut) ;</li>\n<li>La loi transforme l'aléatoire en objet calculable : espérance, variance, décisions.</li>\n</ul>\n<table>\n<tr><th>xᵢ</th><th>pᵢ</th><th>xᵢ·pᵢ</th><th>(xᵢ − E)²·pᵢ</th></tr>\n<tr><td>10</td><td>1/6</td><td>10/6</td><td>25/6</td></tr>\n<tr><td>5</td><td>1/6</td><td>5/6</td><td>0,17</td></tr>\n<tr><td>0</td><td>4/6</td><td>0</td><td>13,5/6</td></tr>\n<tr><td colspan=\"2\">E(X) = 2,5</td><td>15/6 = 2,5</td><td>V ≈ 6,45</td></tr>\n</table>\n\n<h3>2. Espérance : le gain moyen</h3>\n<div class=\"tip\"><b>E(X) = Σxᵢpᵢ</b> : la moyenne théorique sur un très grand nombre de répétitions (loi des grands nombres). Pour un jeu, E(gain net) &lt; 0 = jeu perdant ; le casino vit de l'écart entre mise et espérance.</div>\n<ul>\n<li>Exemple ci-dessus : E = 2,5 € de gain brut par partie : à 2 € de mise, le jeu est gagnant en moyenne (+0,50 €) ;</li>\n<li>Jeu équitable : E(gain net) = 0 : la mise équitable du dé ci-dessus serait 2,50 € ;</li>\n<li>E(aX + b) = a·E(X) + b : l'espérance est <b>linéaire</b> — changer d'unité ou de mise se calcule sans recommencer ;</li>\n<li>Attention : E(X + Y) = E(X) + E(Y) toujours, même si X et Y ne sont pas indépendantes.</li>\n</ul>\n\n<h3>3. Variance et écart type : le risque</h3>\n<ul>\n<li><b>V(X) = Σpᵢ(xᵢ − E)² = E(X²) − E(X)²</b> : les deux formules se valent — la seconde est souvent plus rapide ;</li>\n<li><b>σ(X) = √V</b> : l'écart type, dans l'unité de X : dispersion du gain autour de sa moyenne ;</li>\n<li>V(aX + b) = a²·V(X) : la translation (b) ne change pas le risque ;</li>\n<li>Deux jeux de même espérance : celui de plus petite variance est préféré par un joueur prudent — la finance moderne n'est que la généralisation de cette phrase.</li>\n</ul>\n\n<h3>4. Schéma de Bernoulli et binomiale (amorce)</h3>\n<ul>\n<li>Épreuve de Bernoulli : deux issues, succès (p) / échec (1−p) : X = 1 (succès) ou 0 ;</li>\n<li>E = p, V = p(1−p) : la loi la plus simple du programme ;</li>\n<li>n répétitions indépendantes : X = nombre de succès suit la <b>binomiale</b> B(n ; p) (au programme de Terminale) ;</li>\n<li>En 1re, on combine des Bernoulli à la main : P(exactement 2 succès en 3 essais) = 3×p²(1−p) : le 3 compte les ordres (SSE, SES, ESS).</li>\n</ul>\n\n<h3>5. Modéliser des situations réelles</h3>\n<ul>\n<li><b>Assurance</b> : prime = E(coût) + marge : 0,1 % de sinistre à 20 000 € : E = 20 € : prime ~30 € ;</li>\n<li><b>Loterie</b> : le taux de retour des jeux à gratter (~70 %) est une espérance déguisée ;</li>\n<li><b>Investissement</b> : espérance de rendement vs variance : couple rendement/risque ;</li>\n<li><b>Qualité</b> : coût moyen des défauts = espérance : oriente la maintenance préventive.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la loterie truquée ? Le pari du forain</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un forain propose : « lance une pièce trois fois ; trois faces → 12 € ; exactement deux faces → 3 € ; sinon rien ». La mise est 2 €. 1) Loi du gain brut G ? 2) Espérance et variance du gain net N. 3) Quelle mise rendrait le jeu équitable ? 4) Le joueur perd 4 fois sur 5 : pourquoi joue-t-il quand même ?</div><div class=\"etu\"><b>Étape 1 — Loi</b> : P(3 faces) = 1/8 ; P(exactement 2) = 3/8 ; sinon 4/8 : G = {12 ; 3 ; 0} avec {1/8 ; 3/8 ; 1/2}.</div><div class=\"etu\"><b>Étape 2 — Gain net</b> : N = G − 2 : E(N) = 12/8 + 9/8 + 0 − 2 = 21/8 − 2 = <b>0,625 €</b> : étonnamment favorable !</div><div class=\"etu\"><b>Étape 3 — Variance</b> : E(G²) = 144/8 + 9×3/8 = 18 + 27/8 = 21,375 : V(G) = 21,375 − (2,625)² ≈ 14,48 : σ ≈ 3,8 € : le résultat typique s'écarte de presque 4 € de la moyenne — très volatil.</div><div class=\"etu\"><b>Étape 4 — Psychologie</b> : N est négatif 1 fois sur 2 (0 gain brut − 2), et petit gain 3/8 du temps : le joueur <b>sent</b> perdre souvent alors que l'espérance est positive — la variance masque la valeur : exactement pourquoi il faut calculer, et pas seulement jouer.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — assurance : qui gagne, et de combien ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un smartphone vaut 800 €. Probabilité annuelle de casse : 15 % (coût 800 €), de panne mineure : 30 % (coût 100 €). L'assurance facture 180 €/an. 1) Espérance du coût pour l'assureur. 2) Marge moyenne ? 3) Pour quel profil s'assurer ?</div><div class=\"etu\"><b>Étape 1 — Espérance du coût</b> : E = 0,15×800 + 0,30×100 = 120 + 30 = <b>150 €</b>.</div><div class=\"etu\"><b>Étape 2 — Marge</b> : 180 − 150 = <b>30 €</b> par contrat et par an (20 % de marge) : l'assureur gagne en moyenne sur chaque client.</div><div class=\"etu\"><b>Étape 3 — Vision client</b> : payer 180 € contre un risque espéré de 150 € « coûte » 30 € en moyenne : on paie l'écart pour supprimer la <b>variance</b> (pas de mauvaise surprise possible) : l'assurance vend de la certitude, pas de l'espérance.</div><div class=\"etu\"><b>Étape 4 — Décision rationnelle</b> : pour un risque ruineux (800 € = insupportable), payer 30 € de prime d'écart est raisonnable ; pour une micro-panne que l'on peut absorber, ne pas s'assurer est plus rentable en espérance : on s'assure contre les catastrophes, pas contre les désagréments — une leçon d'espérance qui vaut de l'argent réel.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre E(X) et valeur « probable » : l'espérance 2,5 n'est même pas une valeur possible du dé.</li>\n<li>V(X) = E(X²) − E(X)² : oublier le carré dans le second terme (écrire E(X) sans carré renverse tout).</li>\n<li>La variance n'est PAS linéaire : V(aX + b) = a²V(X), pas aV(X).</li>\n<li>Sommer les probabilités sans vérifier Σpᵢ = 1 : premier contrôle de toute loi.</li>\n<li>Calculer l'espérance du gain brut en oubliant la mise : toujours préciser brut vs net.</li>\n</ul>\n</div>\n\n<h3>6. Fonction de répartition et lecture graphique</h3>\n<ul>\n<li>Chaque loi peut se représenter par un diagramme en barres (xᵢ en abscisse, pᵢ en hauteur) : l'œil repère immédiatement la moyenne et la dispersion ;</li>\n<li>Comparer deux lois : même espérance mais barres étalées = plus risqué : c'est la variance vue à l'œil nu ;</li>\n<li>Loi symétrique (dé équilibré) : espérance au centre ; loi dissymétrique avec une grosse valeur rare : l'espérance est tirée vers la valeur rare (loteries !) ;</li>\n<li>Réflexe d'analyse : face à un énoncé de jeu, toujours construire le tableau {xᵢ ; pᵢ} AVANT tout calcul : la moitié des erreurs disparaissent ;</li>\n<li>Inégalité de position : P(X ≥ a) se lit en sommant les barres concernées — c'est souvent l'objet réel de la question (seuil, garantie, rentabilité) ;</li>\n<li>Exemple : pour G = {12 ; 3 ; 0} avec {1/8 ; 3/8 ; 1/2}, P(G ≥ 3) = 1/8 + 3/8 = 1/2 : lire le tableau, pas recalculer la loi ;</li>\n<li>Changement de variable : si les prix doublent et la mise passe de 2 à 5 €, N′ = 2G − 5 : E(N′) = 2E(G) − 5 et V(N′) = 4V(G) : linéarité et carré du coefficient, sans refaire le tableau.</li>\n</ul>\n\n<h3>7. Sommes de variables : quand on additionne le hasard</h3>\n<ul>\n<li>Linéarité complète : E(X + Y) = E(X) + E(Y) — TOUJOURS, même si X et Y sont dépendantes (deux notes d'un même élève, par exemple) ;</li>\n<li>Variance d'une somme : V(X + Y) = V(X) + V(Y) <b>+ 2 cov(X ; Y)</b> ; si X et Y sont indépendantes, V(X + Y) = V(X) + V(Y) — les variances s'ajoutent, pas les écarts types !</li>\n<li>Exemple : 10 lancers d'une pièce, gain 1 € par face : X = somme de 10 Bernoulli indépendantes : E = 10×0,5 = 5 ; V = 10×0,25 = 2,5 : σ ≈ 1,58 : le gain typique s'écarte de ±1,6 € ;</li>\n<li>Intuition clé : additionner n tirages indépendants fait croître la moyenne en n mais l'écart type seulement en √n : c'est pourquoi les grands échantillons « se stabilisent » — le hasard se dilue (racine carrée !) ;</li>\n<li>Cette dilution √n est le cœur de la loi des grands nombres et, en Terminale, du théorème central limite : les casinos gagnent « sûrement » sur la masse, jamais sur l'individu.</li>\n<li>Réflexe : quand l'énoncé dit « on répète n fois », penser immédiatement E(nX) = nE(X) et V(nX) = nV(X).</li>\n</ul>"

    "cours": "<div class=\"cours-head\"><h2>Suites : récurrence, convergence, limites</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Rappels : ce qu'est une suite</h3>\n<p>Une <b>suite numérique</b> est une fonction définie sur une partie de ℕ : à chaque entier n, elle associe un nombre u(n), noté <b>u<sub>n</sub></b>.</p>\n<p>Le nombre u<sub>n</sub> s'appelle le <b>terme de rang n</b> (ou d'indice n). Attention : le premier terme est souvent u<sub>0</sub>, parfois u<sub>1</sub> — toujours vérifier ce que dit l'énoncé.</p>\n<p>Une suite peut être définie de deux façons, et il faut savoir passer de l'une à l'autre :</p>\n<table>\n<tr><th>Définition</th><th>Signification</th><th>Exemple</th></tr>\n<tr><td><b>Explicite</b> : u<sub>n</sub> = f(n)</td><td>u<sub>n</sub> se calcule directement à partir de n</td><td>u<sub>n</sub> = 3n − 1 : on a u<sub>10</sub> = 29 sans calculer les termes précédents</td></tr>\n<tr><td><b>Par récurrence</b> : u<sub>0</sub> donné, u<sub>n+1</sub> = f(u<sub>n</sub>)</td><td>u<sub>n</sub> se calcule à partir du terme précédent</td><td>u<sub>0</sub> = 1 et u<sub>n+1</sub> = 2u<sub>n</sub> : u<sub>1</sub> = 2, u<sub>2</sub> = 4, u<sub>3</sub> = 8…</td></tr>\n</table>\n<p>Vocabulaire à connaître pour décrire une suite :</p>\n<ul>\n<li><b>Croissante</b> : u<sub>n+1</sub> ≥ u<sub>n</sub> pour tout n (chaque terme est au moins le précédent).</li>\n<li><b>Décroissante</b> : u<sub>n+1</sub> ≤ u<sub>n</sub> pour tout n.</li>\n<li><b>Majorée</b> : il existe un réel M tel que u<sub>n</sub> ≤ M pour tout n (M est un <b>majorant</b>).</li>\n<li><b>Minorée</b> : il existe un réel m tel que u<sub>n</sub> ≥ m pour tout n (m est un <b>minorant</b>).</li>\n<li><b>Bornée</b> : majorée et minorée à la fois.</li>\n</ul>\n\n<h3>2. Le raisonnement par récurrence</h3>\n<p>Problème typique : on veut prouver qu'une propriété P(n) est vraie <b>pour tous les entiers n</b> à partir d'un rang n₀. Testons-la un par un ? Impossible, il y en a une infinité. Le raisonnement par récurrence résout ce problème avec l'image des dominos :</p>\n<ul>\n<li>si le premier domino tombe (P(n₀) est vraie) ;</li>\n<li>et si chaque domino fait tomber le suivant (P(n) entraîne P(n+1)) ;</li>\n<li>alors toute la rangée tombe (P est vraie pour tout n ≥ n₀).</li>\n</ul>\n<div class=\"tip\"><b>Structure d'une récurrence (à rédiger toujours dans cet ordre) :</b>\n<ol>\n<li><b>Initialisation</b> : vérifier que P(n₀) est vraie (souvent un simple calcul).</li>\n<li><b>Hérédité</b> : supposer P(n) vraie pour un entier n fixé ≥ n₀ (c'est l'<b>hypothèse de récurrence</b>), puis montrer que P(n+1) est vraie.</li>\n<li><b>Conclusion</b> : « Par récurrence, P(n) est vraie pour tout entier n ≥ n₀. »</li>\n</ol>\n</div>\n<p>La rédaction de l'hérédité doit être rigoureuse, point par point :</p>\n<ul>\n<li>Écrire explicitement l'hypothèse de récurrence : « Soit n ≥ n₀ tel que P(n) soit vraie. »</li>\n<li>Utiliser P(n) pour transformer l'expression de u<sub>n</sub>.</li>\n<li>Retomber exactement sur la propriété P(n+1), formulée avec n+1.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — une récurrence complète, rédigée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit la suite définie par u<sub>0</sub> = 1 et u<sub>n+1</sub> = 2u<sub>n</sub> + 1. Montrer que u<sub>n</sub> = 2<sup>n+1</sup> − 1 pour tout n ∈ ℕ.</div><div class=\"etu\"><b>Étape 1 — Poser la propriété</b> : pour tout n ≥ 0, P(n) : « u<sub>n</sub> = 2<sup>n+1</sup> − 1 ».</div><div class=\"etu\"><b>Étape 2 — Initialisation</b> : u<sub>0</sub> = 1 et 2<sup>0+1</sup> − 1 = 2 − 1 = 1. Donc P(0) est vraie.</div><div class=\"etu\"><b>Étape 3 — Hérédité (hypothèse)</b> : soit n ≥ 0 un entier tel que P(n) soit vraie, c'est-à-dire u<sub>n</sub> = 2<sup>n+1</sup> − 1.</div><div class=\"etu\"><b>Étape 4 — Hérédité (calcul)</b> : u<sub>n+1</sub> = 2u<sub>n</sub> + 1 = 2(2<sup>n+1</sup> − 1) + 1 = 2<sup>n+2</sup> − 2 + 1 = 2<sup>n+2</sup> − 1 = 2<sup>(n+1)+1</sup> − 1.</div><div class=\"etu\"><b>Étape 5 — Conclusion</b> : P(n+1) est vraie ; par récurrence, u<sub>n</sub> = 2<sup>n+1</sup> − 1 pour tout n ≥ 0. Vérification : u<sub>1</sub> = 3 = 2² − 1 ✓, u<sub>2</sub> = 7 = 2³ − 1 ✓.</div></div></details>\n\n<h3>3. Limite d'une suite : l'idée et la définition</h3>\n<p>Intuitivement, une suite (u<sub>n</sub>) <b>converge vers un réel ℓ</b> lorsque u<sub>n</sub> se rapproche de ℓ autant qu'on veut, à condition de prendre n assez grand.</p>\n<p>Graphiquement, les points de la suite s'approchent de la droite horizontale y = ℓ :</p>\n<div class=\"fig\"><svg viewBox=\"0 0 430 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Suite convergeant vers 1\">\n  <line x1=\"46\" y1=\"160\" x2=\"410\" y2=\"160\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"416\" y=\"164\" font-size=\"11\" fill=\"#64748b\">n</text>\n  <line x1=\"46\" y1=\"160\" x2=\"46\" y2=\"30\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"26\" font-size=\"11\" fill=\"#64748b\">u&#8247;</text>\n  <line x1=\"46\" y1=\"138\" x2=\"410\" y2=\"138\" stroke=\"#ef4444\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/>\n  <text x=\"412\" y=\"142\" font-size=\"11\" fill=\"#ef4444\">&#8467; = 1</text>\n  <polyline points=\"46,30 85,84 125,102 164,111 203,117 243,120 282,123 321,125 361,126 400,128\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"1.6\" opacity=\".45\"/>\n  <circle cx=\"46\" cy=\"30\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"85\" cy=\"84\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"125\" cy=\"102\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"164\" cy=\"111\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"203\" cy=\"117\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"243\" cy=\"120\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"282\" cy=\"123\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"321\" cy=\"125\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"361\" cy=\"126\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"400\" cy=\"128\" r=\"3.5\" fill=\"#4f46e5\"/>\n</svg><span class=\"fig-cap\">La suite u<sub>n</sub> = 1 + 3/(n+1) converge vers ℓ = 1 : tous les termes finissent par entrer dans n'importe quelle bande autour de ℓ.</span></div>\n<p>La définition formalise « aussi proche qu'on veut » : pour tout écart ε &gt; 0 (aussi petit soit-il), il existe un rang N tel que pour tout n ≥ N, |u<sub>n</sub> − ℓ| ≤ ε.</p>\n<p>Deux points essentiels sur cette définition :</p>\n<ul>\n<li>ℓ est un <b>nombre réel fini</b>. Si les termes grandissent sans borne, la suite ne converge pas : on dit qu'elle <b>diverge vers +∞</b> (ou −∞).</li>\n<li>Si une suite converge, sa limite est <b>unique</b> : une suite ne peut pas tendre vers deux valeurs différentes.</li>\n<li>Une suite peut diverger <b>sans tendre vers ±∞</b> : c'est le cas de (−1)<sup>n</sup>, qui oscille indéfiniment entre −1 et 1 sans jamais se stabiliser.</li>\n</ul>\n\n<h3>4. Opérations sur les limites</h3>\n<p>Quand les limites de u<sub>n</sub> et v<sub>n</sub> sont connues, on peut en déduire celles de u<sub>n</sub> + v<sub>n</sub>, u<sub>n</sub> × v<sub>n</sub> et u<sub>n</sub>/v<sub>n</sub> avec des tableaux de règles :</p>\n<table>\n<tr><th>Limite de u<sub>n</sub></th><th>Limite de v<sub>n</sub></th><th>Limite de u<sub>n</sub> + v<sub>n</sub></th><th>Limite de u<sub>n</sub> × v<sub>n</sub></th></tr>\n<tr><td>ℓ</td><td>ℓ′</td><td>ℓ + ℓ′</td><td>ℓ × ℓ′</td></tr>\n<tr><td>ℓ</td><td>+∞</td><td>+∞</td><td>signe de ℓ × (+∞), ou ±∞ si ℓ &gt; 0 ou ℓ &lt; 0, ou 0 si ℓ = 0</td></tr>\n<tr><td>+∞</td><td>+∞</td><td>+∞</td><td>+∞</td></tr>\n<tr><td>+∞</td><td>−∞</td><td>forme indéterminée (±∞)</td><td>−∞</td></tr>\n</table>\n<p>Certaines combinaisons ne donnent <b>pas de réponse automatique</b> : ce sont les <b>formes indéterminées</b> (FI) à reconnaître immédiatement :</p>\n<ul>\n<li><b>« +∞ − ∞ »</b> : deux quantités qui tendent vers l'infini de signes opposés — qui gagne ?</li>\n<li><b>« 0 × ∞ »</b> : un terme minuscule contre un terme énorme.</li>\n<li><b>« ∞/∞ »</b> et <b>« 0/0 »</b> : rapports dont numérateur et dénominateur jouent dans la même catégorie.</li>\n</ul>\n<p>La stratégie universelle pour lever une indétermination sur les suites rationnelles : <b>factoriser par le terme de plus haut degré</b>, simplifier, puis utiliser les limites de référence.</p>\n\n<h3>5. Limites de référence et croissances comparées</h3>\n<p>À connaître par cœur — elles servent dans tous les calculs :</p>\n<table>\n<tr><th>Suite</th><th>Comportement quand n → +∞</th></tr>\n<tr><td>1/n, 1/n², 1/n³…</td><td>tendent vers <b>0</b></td></tr>\n<tr><td>n, n², n³…</td><td>tendent vers <b>+∞</b> (plus le degré est grand, plus ça va vite)</td></tr>\n<tr><td>q<sup>n</sup> avec 0 &lt; q &lt; 1</td><td>tend vers <b>0</b></td></tr>\n<tr><td>q<sup>n</sup> avec q &gt; 1</td><td>tend vers <b>+∞</b></td></tr>\n<tr><td>√n</td><td>tend vers <b>+∞</b>, mais beaucoup plus lentement que n</td></tr>\n</table>\n<p>Quand plusieurs « infinis » s'affrontent, il y a une hiérarchie à retenir :</p>\n<div class=\"formule\"><b>Croissances comparées :</b> ln(n) ≪ n<sup>k</sup> ≪ a<sup>n</sup> ≪ n! ≪ n<sup>n</sup>&nbsp;&nbsp;(pour k &gt; 0 et a &gt; 1)</div>\n<p>Concrètement, dans une somme ou un produit de termes qui tendent vers l'infini, <b>c'est le terme qui croît le plus vite qui impose la limite</b> :</p>\n<ul>\n<li>n² + 3n → +∞ car n² domine 3n ;</li>\n<li>2<sup>n</sup>/n¹⁰⁰ → +∞ car l'exponentielle domine toute puissance de n ;</li>\n<li>ln(n)/n → 0 car le logarithme est dominé par n.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — lever une forme indéterminée « ∞/∞ »</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer la limite de v<sub>n</sub> = (3n² + 2n − 1)/(n² + 5).</div><div class=\"etu\"><b>Étape 1 — Identifier la FI</b> : numérateur → +∞ (terme 3n²), dénominateur → +∞ : forme « ∞/∞ », on ne peut pas conclure directement.</div><div class=\"etu\"><b>Étape 2 — Factoriser par le terme dominant</b> : v<sub>n</sub> = [n²(3 + 2/n − 1/n²)] / [n²(1 + 5/n²)].</div><div class=\"etu\"><b>Étape 3 — Simplifier</b> : v<sub>n</sub> = (3 + 2/n − 1/n²)/(1 + 5/n²).</div><div class=\"etu\"><b>Étape 4 — Utiliser les limites de référence</b> : 2/n → 0, 1/n² → 0 et 5/n² → 0, donc le numérateur tend vers 3 et le dénominateur vers 1.</div><div class=\"etu\"><b>Étape 5 — Conclure</b> : v<sub>n</sub> → <b>3</b>. Règle à retenir : pour un quotient de polynômes, la limite est le <b>rapport des coefficients des termes de plus haut degré</b>.</div></div></details>\n\n<h3>6. Théorèmes de convergence</h3>\n<p>Certains théorèmes garantissent l'existence d'une limite sans calculer celle-ci explicitement. Ce sont eux qui permettent de prouver qu'une limite existe <i>avant</i> de chercher sa valeur.</p>\n<div class=\"tip\"><b>Théorème de convergence monotone :</b>\n<ul>\n<li>une suite <b>croissante et majorée</b> converge ;</li>\n<li>une suite <b>décroissante et minorée</b> converge.</li>\n</ul>\nSi la suite est croissante et non majorée, elle diverge vers +∞.\n</div>\n<div class=\"tip\"><b>Théorème des gendarmes (encadrement) :</b> si pour tout n, u<sub>n</sub> ≤ v<sub>n</sub> ≤ w<sub>n</sub>, et si u<sub>n</sub> et w<sub>n</sub> convergent vers la <b>même limite ℓ</b>, alors v<sub>n</sub> converge aussi vers ℓ.</div>\n<p>Le principe des gendarmes : la suite v<sub>n</sub> est « coincée » entre deux suites qui se resserrent autour de ℓ, elle n'a pas d'autre choix que de tendre vers ℓ :</p>\n<div class=\"fig\"><svg viewBox=\"0 0 430 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Theoreme des gendarmes\">\n  <line x1=\"46\" y1=\"160\" x2=\"410\" y2=\"160\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"416\" y=\"164\" font-size=\"11\" fill=\"#64748b\">n</text>\n  <line x1=\"46\" y1=\"160\" x2=\"46\" y2=\"30\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"46\" y1=\"102\" x2=\"410\" y2=\"102\" stroke=\"#ef4444\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/>\n  <text x=\"412\" y=\"106\" font-size=\"11\" fill=\"#ef4444\">&#8467; = 2</text>\n  <polyline points=\"46,66 85,84 125,90 164,93 203,95 243,96 282,97 321,98 361,98 400,99\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"1.8\"/>\n  <polyline points=\"46,138 85,120 125,114 164,111 203,110 243,108 282,108 321,107 361,106 400,106\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"1.8\"/>\n  <text x=\"70\" y=\"58\" font-size=\"10\" fill=\"#b45309\">2 + 1/n</text>\n  <text x=\"70\" y=\"154\" font-size=\"10\" fill=\"#b45309\">2 &#8722; 1/n</text>\n  <circle cx=\"46\" cy=\"138\" r=\"3.5\" fill=\"#7c3aed\"/><circle cx=\"85\" cy=\"84\" r=\"3.5\" fill=\"#7c3aed\"/><circle cx=\"125\" cy=\"114\" r=\"3.5\" fill=\"#7c3aed\"/><circle cx=\"164\" cy=\"93\" r=\"3.5\" fill=\"#7c3aed\"/><circle cx=\"203\" cy=\"110\" r=\"3.5\" fill=\"#7c3aed\"/><circle cx=\"243\" cy=\"96\" r=\"3.5\" fill=\"#7c3aed\"/><circle cx=\"282\" cy=\"108\" r=\"3.5\" fill=\"#7c3aed\"/><circle cx=\"321\" cy=\"98\" r=\"3.5\" fill=\"#7c3aed\"/><circle cx=\"361\" cy=\"106\" r=\"3.5\" fill=\"#7c3aed\"/><circle cx=\"400\" cy=\"99\" r=\"3.5\" fill=\"#7c3aed\"/>\n</svg><span class=\"fig-cap\">La suite w<sub>n</sub> = 2 + (−1)<sup>n</sup>/n (points violets) oscille, mais elle est encadrée par 2 − 1/n et 2 + 1/n, qui tendent toutes deux vers 2. Donc w<sub>n</sub> → 2.</span></div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — appliquer le théorème des gendarmes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Montrer que w<sub>n</sub> = 2 + (−1)<sup>n</sup>/n converge vers 2.</div><div class=\"etu\"><b>Étape 1 — Encadrer le terme oscillant</b> : quel que soit le signe de (−1)<sup>n</sup>, on a −1/n ≤ (−1)<sup>n</sup>/n ≤ 1/n.</div><div class=\"etu\"><b>Étape 2 — En déduire l'encadrement de w<sub>n</sub></b> : 2 − 1/n ≤ w<sub>n</sub> ≤ 2 + 1/n.</div><div class=\"etu\"><b>Étape 3 — Limites des deux gendarmes</b> : 2 − 1/n → 2 et 2 + 1/n → 2 : les deux suites encadrantes tendent vers la même limite.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : d'après le théorème des gendarmes, w<sub>n</sub> → <b>2</b>. L'encadrement neutralise les oscillations : c'est exactement son rôle.</div></div></details>\n\n<h3>7. Suites arithmétiques et géométriques : comportement</h3>\n<p>Rappels des formules, puis comportement à l'infini :</p>\n<table>\n<tr><th></th><th>Arithmétique (u<sub>n+1</sub> = u<sub>n</sub> + r)</th><th>Géométrique (u<sub>n+1</sub> = q·u<sub>n</sub>)</th></tr>\n<tr><td>Terme général</td><td>u<sub>n</sub> = u<sub>0</sub> + n·r</td><td>u<sub>n</sub> = u<sub>0</sub>·q<sup>n</sup></td></tr>\n<tr><td>Somme des premiers termes</td><td>1 + 2 + … + n = n(n+1)/2</td><td>1 + q + q² + … + q<sup>n</sup> = (1 − q<sup>n+1</sup>)/(1 − q) si q ≠ 1</td></tr>\n<tr><td>Comportement si r &gt; 0 / 0 &lt; q &lt; 1</td><td>u<sub>n</sub> → +∞</td><td>u<sub>n</sub> → 0</td></tr>\n</table>\n<p>Pour une suite géométrique de raison q, tout dépend de q :</p>\n<div class=\"fig\"><svg viewBox=\"0 0 430 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Suites geometriques selon q\">\n  <line x1=\"40\" y1=\"170\" x2=\"400\" y2=\"170\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"406\" y=\"174\" font-size=\"11\" fill=\"#64748b\">n</text>\n  <line x1=\"40\" y1=\"170\" x2=\"40\" y2=\"20\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"155\" x2=\"400\" y2=\"155\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/>\n  <text x=\"44\" y=\"150\" font-size=\"10\" fill=\"#64748b\">0,5</text>\n  <polyline points=\"40,140 84,155 128,162 171,166 215,168 259,169 302,170 346,170 390,170\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"1.6\" opacity=\".5\"/>\n  <circle cx=\"40\" cy=\"140\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"84\" cy=\"155\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"128\" cy=\"162\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"171\" cy=\"166\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"215\" cy=\"168\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"259\" cy=\"169\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"302\" cy=\"170\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"346\" cy=\"170\" r=\"3.5\" fill=\"#16a34a\"/><circle cx=\"390\" cy=\"170\" r=\"3.5\" fill=\"#16a34a\"/>\n  <circle cx=\"40\" cy=\"140\" r=\"3.5\" fill=\"#dc2626\"/><circle cx=\"84\" cy=\"131\" r=\"3.5\" fill=\"#dc2626\"/><circle cx=\"128\" cy=\"119\" r=\"3.5\" fill=\"#dc2626\"/><circle cx=\"171\" cy=\"104\" r=\"3.5\" fill=\"#dc2626\"/><circle cx=\"215\" cy=\"84\" r=\"3.5\" fill=\"#dc2626\"/><circle cx=\"259\" cy=\"59\" r=\"3.5\" fill=\"#dc2626\"/><circle cx=\"302\" cy=\"25\" r=\"3.5\" fill=\"#dc2626\"/><path d=\"M 302 22 L 346 6\" stroke=\"#dc2626\" stroke-width=\"2\" fill=\"none\"/><path d=\"M 338 5 L 348 5 L 343 13\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"34\" font-size=\"11\" fill=\"#dc2626\">q = 1,3 : u&#8247; &#8594; +&#8734;</text>\n  <text x=\"300\" y=\"160\" font-size=\"11\" fill=\"#16a34a\">q = 0,5 : u&#8247; &#8594; 0</text>\n</svg><span class=\"fig-cap\">Deux suites géométriques de premier terme 1 : avec q = 0,5, les termes s'écrasent vers 0 ; avec q = 1,3, ils explosent vers +∞.</span></div>\n<table>\n<tr><th>Valeur de q</th><th>Comportement de q<sup>n</sup> quand n → +∞</th></tr>\n<tr><td>q &gt; 1</td><td>q<sup>n</sup> → <b>+∞</b></td></tr>\n<tr><td>q = 1</td><td>q<sup>n</sup> = 1 : suite constante</td></tr>\n<tr><td>−1 &lt; q &lt; 1</td><td>q<sup>n</sup> → <b>0</b></td></tr>\n<tr><td>q = −1</td><td>la suite alterne entre 1 et −1 : pas de limite</td></tr>\n<tr><td>q &lt; −1</td><td>les termes alternent en explosant : pas de limite</td></tr>\n</table>\n<p>Ce tableau est la clé des exercices classiques du type « la suite géométrique converge-t-elle ? ». Par exemple, u<sub>n</sub> = 0,8<sup>n</sup> + 5 converge vers 5, car 0,8<sup>n</sup> → 0.</p>\n\n<h3>8. Méthode type : étudier une suite définie par récurrence</h3>\n<p>Dans un exercice complet sur une suite récurrente u<sub>n+1</sub> = f(u<sub>n</sub>), les questions suivent presque toujours le même plan :</p>\n<ol>\n<li><b>Calculer les premiers termes</b> (u<sub>0</sub>, u<sub>1</sub>, u<sub>2</sub>…) pour conjecturer le comportement (croissance ? valeur limite approximative ?).</li>\n<li><b>Montrer une propriété par récurrence</b> (souvent un encadrement : 0 &lt; u<sub>n</sub> ≤ 2, ou l'existence d'un majorant).</li>\n<li><b>Étudier la monotonie</b> : comparer u<sub>n+1</sub> − u<sub>n</sub> (ou le quotient u<sub>n+1</sub>/u<sub>n</sub> si les termes sont positifs) pour connaître le signe.</li>\n<li><b>En déduire la convergence</b> grâce au théorème de convergence monotone (croissante + majorée, par exemple).</li>\n<li><b>Calculer la limite ℓ</b> : passer la relation de récurrence à la limite — si u<sub>n+1</sub> = f(u<sub>n</sub>) et u<sub>n</sub> → ℓ, alors ℓ = f(ℓ) — et résoudre l'équation obtenue.</li>\n</ol>\n<div class=\"ex\"><b>Exemple de la dernière étape :</b> si u<sub>n+1</sub> = 0,5·u<sub>n</sub> + 3 et u<sub>n</sub> → ℓ, alors ℓ = 0,5ℓ + 3, d'où 0,5ℓ = 3 et ℓ = <b>6</b>. Attention : ce raisonnement n'a de sens que si l'on a <b>déjà prouvé</b> que la suite converge.</div>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Une récurrence sans initialisation ne prouve rien ; une initialisation sans hérédité non plus. Les <b>deux étapes sont obligatoires</b>.</li>\n<li>« Croissante ⟹ divergente » est <b>faux</b> : une suite croissante <b>majorée</b> converge (ex. u<sub>n</sub> = 1 − 1/n, croissante et majorée par 1, converge vers 1).</li>\n<li>Une suite ne peut pas avoir deux limites : si un calcul donne deux valeurs, l'une des étapes est fausse.</li>\n<li>Le passage « ℓ = f(ℓ) » suppose que la limite existe : il faut le prouver avant (souvent via le théorème de convergence monotone).</li>\n<li>Les formes indéterminées (∞ − ∞, 0 × ∞, ∞/∞, 0/0) ne se « calculent » pas : on les <b>lève</b> en factorisant le terme dominant ou en utilisant les croissances comparées.</li>\n<li>q = −1 et q &lt; −1 : la suite géométrique ne converge pas — ne pas écrire q<sup>n</sup> → 0 sous prétexte que |q| ≤ 1… pour q = −1 ce n'est pas vrai.</li>\n</ul>\n</div>"

    "titre": "Limites de fonctions et asymptotes",
    "cours": "<div class=\"cours-head\"><h2>Limites de fonctions</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Notion de limite : tendre sans atteindre</h3>\n<div class=\"tip\"><b>Idée</b> : lim f(x) = L quand x → a si f(x) se rapproche de L autant qu'on veut dès que x est assez proche de a. Trois situations clés : x → a (valeur finie), x → ±∞ (comportement à l'infini), f(x) → ±∞ (asymptote verticale).</div>\n<ul>\n<li>Exemple : f(x) = 1/x : en 0+, f → +∞ ; en 0−, f → −∞ ; en ±∞, f → 0 : asymptotes x = 0 (verticale) et y = 0 (horizontale) ;</li>\n<li>La limite décrit un <b>comportement</b>, pas une valeur : f peut ne pas être définie en a (1/x en 0) et pourtant avoir une limite ;</li>\n<li>Unicité : si la limite existe, elle est unique — c'est ce qui permet de « deviner » puis de prouver ;</li>\n<li>Lire une limite sur un graphique : vers où fuient les ordonnées quand les abscisses s'enfuient ?</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Asymptotes de la fonction inverse\">\n  <line x1=\"215\" y1=\"10\" x2=\"215\" y2=\"160\" stroke=\"#ef4444\" stroke-width=\"1\" stroke-dasharray=\"5,4\"/>\n  <line x1=\"20\" y1=\"85\" x2=\"410\" y2=\"85\" stroke=\"#16a34a\" stroke-width=\"1\" stroke-dasharray=\"5,4\"/>\n  <path d=\"M 220 15 C 235 50 270 72 410 81\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <path d=\"M 210 155 C 195 120 160 98 20 89\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"228\" y=\"25\" font-size=\"11\" fill=\"#ef4444\">x = 0 : asymptote verticale</text>\n  <text x=\"300\" y=\"72\" font-size=\"11\" fill=\"#16a34a\">y = 0 : asymptote horizontale</text>\n</svg><span class=\"fig-cap\">La fonction inverse : les deux branches fuient les axes sans jamais les toucher — asymptote verticale (limite infinie en 0) et horizontale (limite nulle à l'infini).</span></div>\n\n<h3>2. Limites de référence à connaître par cœur</h3>\n<table>\n<tr><th>Fonction</th><th>en 0⁺</th><th>en 0⁻</th><th>en +∞</th><th>en −∞</th></tr>\n<tr><td>1/x</td><td>+∞</td><td>−∞</td><td>0⁺</td><td>0⁻</td></tr>\n<tr><td>1/x²</td><td>+∞</td><td>+∞</td><td>0⁺</td><td>0⁺</td></tr>\n<tr><td>√x</td><td>0</td><td>—</td><td>+∞</td><td>—</td></tr>\n<tr><td>xⁿ (n ≥ 1)</td><td>0</td><td>0</td><td>+∞</td><td>±∞ (parité)</td></tr>\n<tr><td>x·(1/x)... x eˣ</td><td>1</td><td>—</td><td>+∞</td><td>0⁺</td></tr>\n</table>\n<ul>\n<li>eˣ : en +∞ → +∞ ; en −∞ → 0 : l'exponentielle écrase tout à droite, s'éteint à gauche ;</li>\n<li>ln x : en 0⁺ → −∞ ; en +∞ → +∞ (mais très lentement : ln(10⁶) ≈ 13,8 !) ;</li>\n<li>Croissances comparées : eˣ/xⁿ → +∞ ; xⁿ/ln x → +∞ : l'exponentielle domine les puissances, qui dominent les logarithmes — la hiérarchie des vitesses.</li>\n</ul>\n\n<h3>3. Opérations sur les limites</h3>\n<ul>\n<li>Somme, produit, quotient : on « propage » les limites (limite d'une somme = somme des limites) SAUF aux <b>formes indéterminées</b> ;</li>\n<li>Formes indéterminées classiques : « ∞ − ∞ », « 0 × ∞ », « ∞/∞ », « 0/0 » : il faut factoriser, réduire, utiliser le taux d'accroissement ;</li>\n<li>Exemple : x² − x en +∞ : factoriser par x² : x²(1 − 1/x) → +∞ : l'indétermination « ∞ − ∞ » se lève par factorisation ;</li>\n<li>Exemple : (x² + 3x)/(x³) en +∞ : ≈ x²/x³ = 1/x → 0 : garder le terme dominant de chaque étage.</li>\n</ul>\n\n<h3>4. Limites et asymptotes</h3>\n<ul>\n<li>lim f = ±∞ en a ⟹ <b>droite x = a asymptote verticale</b> (souvent aux bornes interdites du domaine) ;</li>\n<li>lim f = ℓ en ±∞ ⟹ <b>droite y = ℓ asymptote horizontale</b> du côté concerné ;</li>\n<li>Asymptote oblique y = ax + b : quand f(x) − (ax + b) → 0 à l'infini : la courbe « colle » à sa droite ;</li>\n<li>Méthode : division ou identification : f(x) = ax + b + c/(x−1) donne l'oblique ET la position relative selon le signe de c/(x−1).</li>\n</ul>\n\n<h3>5. Continuité, dérivée et limites : la trilogie</h3>\n<ul>\n<li>Taux d'accroissement : lim (f(a+h) − f(a))/h : c'est f′(a) : la limite EST la définition de la dérivée — tout le chapitre dérivation repose sur les limites ;</li>\n<li>Nombre dérivé des références : (sin h)/h → 1 ; (e^h − 1)/h → 1 ; (ln(1+h))/h → 1 : trois limites fondamentales à mémoriser ;</li>\n<li>Si f a une limite ℓ en a et qu'on prolonge f(a) = ℓ : f devient continue : « réparer » une fonction par prolongement ;</li>\n<li>Théorème de la bijection (cf. chapitre continuité) : sans limite, pas de TVI — les chapitres s'articulent.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — lever une indétermination ∞ − ∞</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Étudier lim en +∞ de f(x) = √(x² + x) − x. Et en −∞ ?</div><div class=\"etu\"><b>Étape 1 — Diagnostic</b> : en +∞ : √(x²+x) → +∞ et x → +∞ : forme « ∞ − ∞ » : interdit d'écrire « ça fait 0 » !</div><div class=\"etu\"><b>Étape 2 — Astuce de la quantité conjuguée</b> : multiplier par (√(x²+x) + x)/(√(x²+x) + x) : le numérateur devient (x² + x) − x² = x : f(x) = x/(√(x²+x) + x).</div><div class=\"etu\"><b>Étape 3 — Factorisation</b> : ≈ x/(x√(1 + 1/x) + x) = 1/(√(1+1/x) + 1) → <b>1/2</b>.</div><div class=\"etu\"><b>Étape 4 — Interprétation</b> : la courbe de √(x²+x) se rapproche de celle de x avec un écart qui tend vers 1/2 : asymptote « parallèle » oblique y = x + 1/2 — la quantité conjuguée est LE réflexe des différences de racines.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — croissance comparée : exponentielle vs puissance</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer lim en +∞ de g(x) = (eˣ + x³)/(2eˣ − 5x) puis lim en −∞.</div><div class=\"etu\"><b>Étape 1 — En +∞</b> : factoriser par eˣ (terme dominant) : g(x) = (1 + x³/eˣ)/(2 − 5x/eˣ).</div><div class=\"etu\"><b>Étape 2 — Croissances comparées</b> : x³/eˣ → 0 et x/eˣ → 0 : g → 1/2 : l'exponentielle « mange » les puissances.</div><div class=\"etu\"><b>Étape 3 — En −∞</b> : eˣ → 0 : g(x) ≈ x³/(−5x) = −x²/5 → <b>−∞</b> : les rôles s'inversent, c'est la puissance qui domine.</div><div class=\"etu\"><b>Étape 4 — Morale</b> : « qui domine qui » dépend du côté ! En +∞ : eˣ &gt; xⁿ &gt; ln x ; en −∞ : eˣ s'éteint et laisse le terrain aux puissances — toujours factoriser par le terme dominant AVANT de conclure, jamais additionner des infinis.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Écrire lim = +∞ − +∞ = 0 : les formes indéterminées n'obéissent pas à l'arithmétique.</li>\n<li>Confondre limite en a et valeur en a : f(a) peut ne pas exister (1/x en 0) ou différer de la limite.</li>\n<li>1/x en 0 : oublier de distinguer 0⁺ et 0⁻ (+∞ d'un côté, −∞ de l'autre).</li>\n<li>Croissances comparées : croire que x² domine eˣ à l'infini : c'est l'inverse.</li>\n<li>Asymptote oblique : conclure sans vérifier que f(x) − (ax+b) → 0 (une simple ressemblance ne suffit pas).</li>\n</ul>\n</div>\n\n<h3>6. Méthodes de levée d'indétermination : le kit complet</h3>\n<table>\n<tr><th>Forme</th><th>Situation type</th><th>Outil</th></tr>\n<tr><td>∞ − ∞</td><td>x² − x ; √(x²+x) − x</td><td>factoriser / quantité conjuguée</td></tr>\n<tr><td>∞/∞</td><td>(x²+3x)/x³ ; (2x+1)/(x−5)</td><td>factoriser haut et bas par le dominant</td></tr>\n<tr><td>0/0</td><td>taux d'accroissement</td><td>reconnaître f′(a)</td></tr>\n<tr><td>0 × ∞</td><td>x·ln x en 0⁺</td><td>transformer en quotient (croissances comparées)</td></tr>\n<tr><td>racines</td><td>√(x+1) − √x</td><td>quantité conjuguée</td></tr>\n</table>\n<ul>\n<li><b>Factoriser par le terme de plus haut degré</b> : (3x² − x + 1)/(x² + 5) : diviser haut et bas par x² : (3 − 1/x + 1/x²)/(1 + 5/x²) → 3 : dans toute fraction rationnelle, la limite en ±∞ est le rapport des coefficients dominants ;</li>\n<li><b>Taux d'accroissement</b> : (f(x) − f(a))/(x − a) → f′(a) : exemple : (e^x − 1)/x → e⁰ = 1 en 0 : reconnaître au lieu de calculer ;</li>\n<li><b>Changement de variable mental</b> : x → 0⁺ dans ln(1+x)/x : poser h = 1/x pour se ramener à l'infini quand c'est plus confortable — les deux infinis se répondent.</li>\n</ul>\n\n<h3>7. Limites unilatérales et asymptotes : le résumé visuel</h3>\n<ul>\n<li>Une asymptote verticale x = a apparaît dès que la limite (même unilatérale) est infinie : 1/(x−2)³ : +∞ à droite de 2, −∞ à gauche : la courbe « explose » des deux côtés du mur ;</li>\n<li>La même fonction peut avoir jusqu'à trois asymptotes : f(x) = (x²+1)/(x−1) : verticale x = 1, et en ±∞ : f(x) ≈ x + 1 : oblique y = x + 1 : division polynomiale : x²+1 = (x−1)(x+1) + 2 : f(x) = x + 1 + 2/(x−1) ;</li>\n<li>Position courbe/asymptote : le signe du reste (2/(x−1)) dit si la courbe est au-dessus (x &gt; 1) ou en dessous (x &lt; 1) : une question classique de bac ;</li>\n<li>Astuce : toujours faire la division pour écrire f = (ax+b) + reste/x−... : les trois questions (limite, asymptote, position) se lisent dans la même ligne.</li>\n</ul>"
