{"id": "variables-aleatoires", "theme": "Variables aléatoires (1re)", "niveau": "1re", "titre": "Variables aléatoires, espérance, variance", "cours": "<div class=\"cours-head\"><h2>Variables aléatoires, espérance, variance</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Variable aléatoire et loi de probabilité</h3>\n<div class=\"tip\"><b>X</b> associe un nombre à chaque issue d'une expérience. Sa <b>loi</b> : les valeurs x_i avec leurs probabilités p_i = P(X = x_i). Contrôle : la somme des p_i vaut <b>1</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — établir une loi de probabilité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On lance deux pièces. X = nombre de piles. Donner la loi de X.</div><div class=\"etu\"><b>Étape 1</b> — <b>Univers</b> : {FF, FP, PF, PP} équiprobables (1/4 chacun).</div><div class=\"etu\"><b>Étape 2</b> — <b>Valeurs de X</b> : X = 0 (FF), X = 1 (FP ou PF), X = 2 (PP).</div><div class=\"etu\"><b>Étape 3</b> — <b>Loi</b> : P(X=0) = 1/4 ; P(X=1) = 1/2 ; P(X=2) = 1/4. Contrôle : 1/4 + 1/2 + 1/4 = 1 ✓. Toujours finir par cette vérification.</div></div></details>\n<h3>2. Espérance</h3>\n<div class=\"tip\"><b>E(X) = Σ x_i·p_i</b> : la valeur moyenne de X sur un grand nombre de répétitions. Pour un JEU : E(gain) &gt; 0 ⟹ jeu favorable au joueur ; E = 0 ⟹ équitable ; E &lt; 0 ⟹ défavorable.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer et interpréter une espérance</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Jeu : on mise 2 €, on lance une pièce : pile ⟹ on gagne 5 € (gain net +3), face ⟹ rien (gain net −2). ① Loi du gain net G ? ② E(G) ? Le jeu est-il favorable ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Loi</b> : P(G = 3) = 1/2 ; P(G = −2) = 1/2 (les gains NETS, mise déduite).</div><div class=\"etu\"><b>Étape 2</b> — <b>Espérance</b> : E(G) = 3×0,5 + (−2)×0,5 = 1,5 − 1 = <b>0,5 €</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Interpréter</b> : E &gt; 0 : favorable AU JOUEUR : en moyenne +0,50 € par partie. Sur 100 parties : ≈ +50 € — mais la variance (section 3) dit si le trajet est tranquille.</div></div></details>\n<h3>3. Variance et écart type</h3>\n<div class=\"tip\"><b>V(X) = Σ p_i·(x_i − E(X))²</b> : moyenne des écarts au carré à l'espérance. <b>σ(X) = √V(X)</b> : dispersion autour de la moyenne. <b>Propriété :</b> V(aX + b) = a²·V(X) (le b disparaît ; le a se met AU CARRÉ).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer une variance</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Avec la loi du jeu précédent (G = 3 ou −2, p = 1/2, E = 0,5) : calculer V(G) et σ(G).</div><div class=\"etu\"><b>Étape 1</b> — <b>Écarts</b> : 3 − 0,5 = 2,5 ; −2 − 0,5 = −2,5.</div><div class=\"etu\"><b>Étape 2</b> — <b>Variance</b> : V = 0,5×(2,5)² + 0,5×(2,5)² = 6,25.</div><div class=\"etu\"><b>Étape 3</b> — <b>Écart type</b> : σ = √6,25 = <b>2,5 €</b> : les gains s'écartent typiquement de 2,50 € autour de la moyenne de 0,50 € : un jeu « équilibré » mais secoué.</div></div></details>\n<h3>4. Linéarité</h3>\n<div class=\"tip\"><b>E(aX + b) = a·E(X) + b</b> ; <b>V(aX + b) = a²·V(X)</b>. Applications directes : changement d'unité, ajout d'un coût fixe.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la loi doit totaliser 1 ; l'espérance n'est pas forcément une valeur prise par X ; gains NETS vs gains BRUTS (toujours déduire la mise) ; V(aX + b) : le b disparaît, le a se met au carré ; ne pas confondre V et σ (σ = √V).</div>"},
{"id": "suites-term", "theme": "Suites et limites (Terminale)", "niveau": "Terminale", "titre": "Suites : récurrence, convergence, limites", "cours": "<div class=\"cours-head\"><h2>Suites : récurrence, convergence, limites</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Raisonnement par récurrence</h3>\n<div class=\"tip\"><b>Principe :</b> pour prouver « P(n) pour tout n ≥ n₀ » : ① <b>Initialisation</b> : P(n₀) vraie ; ② <b>Hérédité</b> : si P(n) alors P(n+1). Conclusion : P vraie pour tout n ≥ n₀.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — une récurrence complète</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> u_0 = 1 et u_{n+1} = 2u_n + 1. Prouver que u_n = 2^{n+1} − 1 pour tout n.</div><div class=\"etu\"><b>Étape 1</b> — <b>Initialisation</b> : u_0 = 1 et 2^1 − 1 = 1 ✓ : P(0) vraie.</div><div class=\"etu\"><b>Étape 2</b> — <b>Hérédité</b> : supposons u_n = 2^{n+1} − 1. Alors u_{n+1} = 2(2^{n+1} − 1) + 1 = 2^{n+2} − 2 + 1 = 2^{n+2} − 1 : P(n+1) vraie.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : par récurrence, u_n = 2^{n+1} − 1 pour tout n ≥ 0. Vérification numérique : u_1 = 3 = 2²−1 ✓, u_2 = 7 = 2³−1 ✓.</div></div></details>\n<h3>2. Limites de suites</h3>\n<div class=\"tip\"><b>Croissante et majorée ⟹ convergente</b> (théorème de convergence monotone). <b>Limites usuelles :</b> qⁿ → 0 si |q| &lt; 1, → +∞ si q &gt; 1 ; n → +∞ ⟹ 1/n → 0 ; nⁿ domine n! domine aⁿ domine nᵏ (croissances comparées).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer une limite de suite</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer la limite de v_n = (3n² + 2n − 1)/(n² + 5).</div><div class=\"etu\"><b>Étape 1</b> — <b>Factoriser le terme dominant</b> : v_n = n²(3 + 2/n − 1/n²)/(n²(1 + 5/n²)).</div><div class=\"etu\"><b>Étape 2</b> — <b>Simplifier</b> : v_n = (3 + 2/n − 1/n²)/(1 + 5/n²).</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : 2/n → 0, 1/n² → 0, 5/n² → 0 : v_n → <b>3</b>. Règle générale : limite = rapport des coefficients dominants.</div></div></details>\n<h3>3. Convergence : définition et gendarmes</h3>\n<div class=\"tip\"><b>Encadrement (gendarmes) :</b> si u_n ≤ v_n ≤ w_n et u_n, w_n → ℓ, alors v_n → ℓ. <b>Divergence :</b> vers ±∞ ou sans limite (ex. (−1)ⁿ : alternée).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — théorème des gendarmes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> w_n = (−1)ⁿ/n + 2. Montrer que w_n → 2.</div><div class=\"etu\"><b>Étape 1</b> — <b>Encadrer</b> : −1/n ≤ (−1)ⁿ/n ≤ 1/n, donc 2 − 1/n ≤ w_n ≤ 2 + 1/n.</div><div class=\"etu\"><b>Étape 2</b> — <b>Limites des gendarmes</b> : 2 − 1/n → 2 et 2 + 1/n → 2.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : w_n est « coincée » entre deux suites tendant vers 2 : w_n → <b>2</b>. Les gendarmes neutralisent les oscillations.</div></div></details>\n<h3>4. Suites géométriques : convergence</h3>\n<div class=\"tip\"><b>u_n = u_0·qⁿ :</b> si 0 &lt; q &lt; 1 : u_n → 0 ; si q &gt; 1 et u_0 &gt; 0 : → +∞ ; si q = 1 : constante u_0 ; si q &lt; 0 : alternée (divergence en général).</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la récurrence exige les DEUX étapes (initialisation sans hérédité ne prouve rien) ; « croissante ⟹ divergente » est FAUX (croissante MAJORÉE ⟹ convergente) ; une suite ne peut tendre que vers UNE limite ; limite finie des termes ≠ convergence du calcul sur les formes indéterminées (∞−∞, ∞/∞, 0×∞ : factoriser le dominant).</div>"},
{"id": "limites-fonctions", "theme": "Limites de fonctions (Terminale)", "niveau": "Terminale", "titre": "Limites de fonctions et asymptotes", "cours": "<div class=\"cours-head\"><h2>Limites de fonctions et asymptotes</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Limites en l'infini et asymptotes</h3>\n<div class=\"tip\"><b>lim x→+∞ :</b> 1/x → 0 ; x² → +∞ ; √x → +∞. <b>Asymptote horizontale y = ℓ</b> si lim f(x) = ℓ en ±∞ ; <b>asymptote verticale x = a</b> si lim f(x) = ±∞ en a.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire une limite et son asymptote</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> f(x) = (2x + 1)/(x − 3). ① lim en +∞ ? ② Comportement en x = 3 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>+∞</b> : termes dominants : 2x/x = <b>2</b> : asymptote horizontale y = 2.</div><div class=\"etu\"><b>Étape 2</b> — <b>x → 3</b> : dénominateur → 0, numérateur → 7 ≠ 0 : f(x) → <b>±∞</b> : asymptote verticale x = 3.</div><div class=\"etu\"><b>Étape 3</b> — <b>Signe</b> : x → 3⁺ (par valeurs supérieures) : x − 3 &gt; 0 : +∞ ; x → 3⁻ : −∞. Deux asymptotes : la courbe s'aplatit vers y = 2 et fuit la droite x = 3.</div></div></details>\n<h3>2. Formes indéterminées</h3>\n<div class=\"tip\"><b>FI à connaître :</b> ∞−∞, ∞/∞, 0/0, 0×∞. <b>Techniques :</b> factoriser le terme dominant (polynômes) ; quantité conjuguée (racines) ; simplification (fractions).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lever une indétermination</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ① lim x→+∞ de √(x² + x) − x. ② lim x→+∞ de x² − 3x.</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : forme ∞−∞ : multiplier par le conjugué : (√(x²+x) − x)(√(x²+x) + x)/(√(x²+x)+x) = x/(√(x²+x)+x).</div><div class=\"etu\"><b>Étape 2</b> — <b>Conclure ①</b> : diviser par x : 1/(√(1+1/x) + 1) → <b>1/2</b>. Le conjugué a transformé ∞−∞ en 0/0… résoluble.</div><div class=\"etu\"><b>Étape 3</b> — <b>②</b> : x² − 3x = x²(1 − 3/x) → +∞ (le dominant x² l'emporte) : ∞−∞ levé par factorisation. Deux techniques, un même objectif : faire apparaître les rapports qui tendent vers 0.</div></div></details>\n<h3>3. Croissances comparées</h3>\n<div class=\"tip\"><b>En +∞ :</b> ln x ≪ xᵃ (a &gt; 0) ≪ e^x ; donc lim ln x/x = 0, lim e^x/x = +∞, lim x·ln x = +∞, lim x·e^{−x} = 0.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — appliquer les croissances comparées</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer : ① lim x→+∞ de e^x/x². ② lim x→0⁺ de x·ln x.</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : l'exponentielle domine TOUT polynôme : e^x/x² → <b>+∞</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : poser X = 1/x → +∞ : x·ln x = −ln X/X → <b>0</b> (ln X ≪ X).</div><div class=\"etu\"><b>Étape 3</b> — <b>Retenir</b> : à l'infini, l'exponentielle est la plus forte, le logarithme le plus faible ; en 0⁺, x·ln x est une FI dont la réponse est 0 par croissance comparée inversée.</div></div></details>\n<h3>4. Composition et asymptotes obliques</h3>\n<div class=\"tip\"><b>Asymptote oblique y = ax + b</b> si lim [f(x) − (ax + b)] = 0 en ±∞ : la courbe se colle à sa droite. <b>Composition :</b> lim g(u(x)) se traite par la limite intermédiaire de u.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « +∞ − ∞ » n'est pas toujours +∞ : FACTORISER ; une asymptote horizontale peut être la MÊME en +∞ et −∞ (1/x²) ; e^{−x} → 0 en +∞ mais → +∞ en −∞ ; ne pas confondre limite en un point (des deux côtés : ±∞ différents) ; x·ln x → 0 en 0⁺ : résultat à connaître, pas à inventer.</div>"},
{"id": "continuite-tvi", "theme": "Continuité et TVI (Terminale)", "niveau": "Terminale", "titre": "Continuité et théorème des valeurs intermédiaires", "cours": "<div class=\"cours-head\"><h2>Continuité et théorème des valeurs intermédiaires</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Continuité : l'idée et la définition</h3>\n<div class=\"tip\"><b>Intuition :</b> la courbe se trace « sans lever le stylo ». <b>f continue en a</b> si lim x→a f(x) = f(a) ; <b>continue sur un intervalle</b> si continue en chaque point. Toute fonction dérivable est continue (réciproque fausse : |x| en 0).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — étudier la continuité en un point</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> f(x) = x² + 1 si x &lt; 2 ; f(x) = 5 si x ≥ 2. f est-elle continue en 2 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Limiter à gauche</b> : lim x→2⁻ f(x) = 2² + 1 = 5.</div><div class=\"etu\"><b>Étape 2</b> — <b>Valeur en 2</b> : f(2) = 5 (branche x ≥ 2).</div><div class=\"etu\"><b>Étape 3</b> — <b>Comparer</b> : limite à gauche = valeur : 5 = 5 ⟹ <b>continue en 2</b>. Si f(2) avait valu 7 : saut de 2 : discontinue. La continuité d'une fonction définie par morceaux se vérifie à CHAQUE jonction.</div></div></details>\n<h3>2. Théorème des valeurs intermédiaires (TVI)</h3>\n<div class=\"tip\"><b>TVI :</b> f CONTINUE sur [a ; b] : pour toute valeur k comprise ENTRE f(a) et f(b), il existe c ∈ [a ; b] tel que f(c) = k. Autrement dit : la courbe passe par toutes les hauteurs intermédiaires.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — appliquer le TVI</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> f(x) = x³ + x − 1. Montrer que l'équation f(x) = 0 admet une solution dans [0 ; 1].</div><div class=\"etu\"><b>Étape 1</b> — <b>Continuité</b> : polynôme ⟹ continue sur [0 ; 1].</div><div class=\"etu\"><b>Étape 2</b> — <b>Signe aux bornes</b> : f(0) = −1 &lt; 0 ; f(1) = 1 &gt; 0 : 0 ∈ [f(0) ; f(1)].</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure (TVI)</b> : il existe c ∈ [0 ; 1] tel que f(c) = 0. Bonus (corollaire) : f strictement croissante (f′ = 3x²+1 &gt; 0) ⟹ la solution est UNIQUE. Rédaction type : citer la continuité, la monotonie, le changement de signe.</div></div></details>\n<h3>3. Corollaire : unicité et balayage</h3>\n<div class=\"tip\"><b>Corollaire :</b> f continue ET STRICTEMENT monotone sur [a ; b], avec f(a)·f(b) &lt; 0 : l'équation f(x) = 0 a UNE UNIQUE solution α. Le <b>balayage par dichotomie</b> la localise : on coupe l'intervalle en deux, on garde la moitié du changement de signe : précision doublée à chaque étape.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — dichotomie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> f(x) = x³ + x − 1, f(0) = −1, f(1) = 1. Encadrer α à 0,25 près.</div><div class=\"etu\"><b>Étape 1</b> — <b>Milieu</b> : m = 0,5 : f(0,5) = 0,125 + 0,5 − 1 = −0,375 &lt; 0 : le changement de signe est dans [0,5 ; 1].</div><div class=\"etu\"><b>Étape 2</b> — <b>Milieu suivant</b> : m = 0,75 : f(0,75) ≈ 0,422 + 0,75 − 1 = 0,172 &gt; 0 : changement de signe dans [0,5 ; 0,75].</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : α ∈ [0,5 ; 0,75], soit α ≈ <b>0,68 à 0,25 près</b> (0,75 − 0,5 = 0,25). Chaque étape DIVISE l'incertitude par 2 : balayage exponentiellement efficace.</div></div></details>\n<h3>4. Contre-exemples et conditions</h3>\n<div class=\"tip\"><b>Sans continuité, pas de TVI :</b> la fonction « partie entière » saute de 1 à 2 sans passer par 1,5. <b>Sans stricte monotonie, pas d'unicité :</b> une parabole coupe deux fois l'axe. Les deux hypothèses sont INDISSOCIABLES de leur conclusion.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> dérivable ⟹ continue, mais continue ⇏ dérivable (|x|) ; le TVI exige k ENTRE f(a) et f(b) ; l'unicité exige la STRICTE monotonie (croissante suffit ? non : strictement) ; à une jonction de fonctions morceaux : comparer limite ET valeur ; une racine peut exister même sans changement de signe aux bornes si l'intervalle est mal choisi.</div>"},
{"id": "integrales", "theme": "Intégrales (Terminale)", "niveau": "Terminale", "titre": "Primitives et calcul intégral", "cours": "<div class=\"cours-head\"><h2>Primitives et calcul intégral</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Primitives</h3>\n<div class=\"tip\"><b>F est une primitive de f sur I si F′ = f.</b> Toute fonction continue sur un intervalle admet des primitives, toutes différant d'une constante : F(x) + k.<br><b>Primitives usuelles :</b> xⁿ ⟹ x^{n+1}/(n+1) ; 1/x ⟹ ln x (x &gt; 0) ; 1/x² ⟹ −1/x ; e^x ⟹ e^x ; u′·uⁿ ⟹ u^{n+1}/(n+1) ; u′/u ⟹ ln|u| ; u′e^u ⟹ e^u.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — trouver une primitive</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ① Primitive de f(x) = 3x² + 2x − 5 ? ② Primitive de g(x) = (2x)/(x² + 1) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : terme à terme : F(x) = x³ + x² − 5x + k (dériver pour vérifier : 3x² + 2x − 5 ✓).</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : forme u′/u avec u = x² + 1, u′ = 2x : G(x) = <b>ln(x² + 1)</b> + k (x² + 1 &gt; 0 : pas de valeur absolue nécessaire).</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôle</b> : G′(x) = (2x)/(x²+1) = g(x) ✓. Réflexe : une primitive se VÉRIFIE en dérivant — 10 secondes qui valent tous les points.</div></div></details>\n<h3>2. Intégrale : définition et aire</h3>\n<div class=\"tip\"><b>∫_a^b f(x)dx = F(b) − F(a)</b> pour F une primitive de f. <b>Sens géométrique :</b> si f ≥ 0, c'est l'AIRE entre la courbe et l'axe des abscisses (en unités d'aire).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer une intégrale</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer I = ∫₀² (3x² + 2x − 5) dx.</div><div class=\"etu\"><b>Étape 1</b> — <b>Primitive</b> : F(x) = x³ + x² − 5x.</div><div class=\"etu\"><b>Étape 2</b> — <b>Évaluer</b> : F(2) = 8 + 4 − 10 = 2 ; F(0) = 0.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : I = F(2) − F(0) = <b>2</b>. L'ordre compte TOUJOURS : F(b) − F(a), et ∫_b^a = −∫_a^b.</div></div></details>\n<h3>3. Propriétés de l'intégrale</h3>\n<div class=\"tip\"><b>Linéarité :</b> ∫(f+g) = ∫f + ∫g ; ∫k·f = k∫f. <b>Chasles :</b> ∫_a^c = ∫_a^b + ∫_b^c. <b>Positivité :</b> f ≤ g sur [a;b] ⟹ ∫f ≤ ∫g. <b>Valeur moyenne :</b> (1/(b−a))·∫_a^b f.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — linéarité et moyenne</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Avec ∫₀² f = 6 et ∫₀² g = 2 : ① ∫₀² (2f + g) ? ② ∫₀² f + ∫₂³ f = ∫₀³ f si ∫₂³ f = 1 : valeur de ∫₀³ f ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : linéarité : 2×6 + 2 = <b>14</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : Chasles : ∫₀³ f = 6 + 1 = <b>7</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Moyenne de f sur [0 ; 3]</b> : 7/(3−0) ≈ <b>2,33</b> : la hauteur moyenne de la courbe, comme une « moyenne de notes ».</div></div></details>\n<h3>4. Intégration par parties (aperçu) et aire entre courbes</h3>\n<div class=\"tip\"><b>Aire entre deux courbes :</b> ∫_a^b (f(x) − g(x))dx si f ≥ g. <b>IPP :</b> ∫u′v = [uv] − ∫uv′ : pour les produits « mixtes » (x·e^x, x·ln x).</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> oublier le +k ne gêne PAS dans ∫ (il s'élimine dans F(b) − F(a)) ; inverser les bornes change le SIGNE ; ∫ f ≥ 0 exige f ≥ 0 (sinon « aire algébrique » : négative sous l'axe) ; primitive de 1/x : ln|...| : attention au domaine ; u′ doit ÊTRE LÀ dans les formes composées (sinon ajuster).</div>"},
{"id": "logs-exp", "theme": "Logarithmes et exponentielles (Terminale)", "niveau": "Terminale", "titre": "Logarithmes népériens et exponentielles", "cours": "<div class=\"cours-head\"><h2>Logarithmes népériens et exponentielles</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La fonction exponentielle</h3>\n<div class=\"tip\"><b>Définition :</b> e^x est l'unique fonction f telle que f′ = f et f(0) = 1. <b>Propriétés :</b> e^{a+b} = e^a·e^b ; e^{−a} = 1/e^a ; e^{a−b} = e^a/e^b ; (e^a)^n = e^{an}. <b>Valeurs :</b> e⁰ = 1, e¹ ≈ 2,718 ; dérivée de e^x : e^x ; de e^{u} : u′·e^u.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculs avec l'exponentielle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Simplifier : ① e³·e⁵ ; ② e⁷/e² ; ③ (e²)³ ; ④ résoudre e^x = 5.</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : e³⁺⁵ = <b>e⁸</b> (produit ⟹ somme des exposants).</div><div class=\"etu\"><b>Étape 2</b> — <b>②③</b> : e⁷⁻² = <b>e⁵</b> ; (e²)³ = <b>e⁶</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>④</b> : e^x = 5 ⟹ x = <b>ln 5</b> ≈ 1,61. Le ln « défait » l'exponentielle : ln(e^x) = x et e^{ln x} = x.</div></div></details>\n<h3>2. La fonction logarithme népérien</h3>\n<div class=\"tip\"><b>Définition :</b> ln x est la primitive de 1/x sur ]0 ; +∞[ qui s'annule en 1. <b>Réciproque de exp :</b> ln(e^x) = x ; e^{ln x} = x (x &gt; 0). <b>Propriétés :</b> ln(a·b) = ln a + ln b ; ln(a/b) = ln a − ln b ; ln(aⁿ) = n·ln a ; ln(1/a) = −ln a ; ln 1 = 0 ; ln e = 1.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — transformer avec ln</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Simplifier A = ln 8 + ln 3 − ln 6, puis résoudre ln(x) + ln(x−1) = ln 6.</div><div class=\"etu\"><b>Étape 1</b> — <b>A</b> : = ln(8×3/6) = <b>ln 4</b> (produit ⟹ somme, quotient ⟹ différence).</div><div class=\"etu\"><b>Étape 2</b> — <b>Équation</b> : domaine : x &gt; 0 ET x − 1 &gt; 0 ⟹ x &gt; 1. Puis ln(x(x−1)) = ln 6 ⟹ x² − x = 6.</div><div class=\"etu\"><b>Étape 3</b> — <b>Résoudre</b> : x² − x − 6 = 0 : Δ = 25 : x = 3 ou x = −2 (rejeté : x &gt; 1). S = <b>{3}</b>. TOUJOURS poser le domaine AVANT de transformer.</div></div></details>\n<h3>3. Dérivées</h3>\n<div class=\"tip\"><b>(ln x)′ = 1/x</b> ; <b>(ln u)′ = u′/u</b> ; <b>(e^x)′ = e^x</b> ; <b>(e^u)′ = u′·e^u</b> ; (a^x)′ = a^x·ln a.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — dériver des composées</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dériver : ① f(x) = ln(x² + 1) ; ② g(x) = e^{−x²}.</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : u = x² + 1, u′ = 2x : f′(x) = <b>2x/(x² + 1)</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : u = −x², u′ = −2x : g′(x) = <b>−2x·e^{−x²}</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Interpréter ②</b> : g′(x) &gt; 0 pour x &lt; 0 : la « cloche » de e^{−x²} monte puis descend (max en 0) : la dérivée raconte la forme de la courbe.</div></div></details>\n<h3>4. Croissances comparées et équations</h3>\n<div class=\"tip\"><b>Références :</b> ln x ≪ x ≪ e^x en +∞ ; x·ln x → 0 en 0⁺ ; e^x·x → 0 en −∞. <b>Équations :</b> e^x = k (k&gt;0) ⟹ x = ln k ; ln x = k ⟹ x = e^k. <b>Croissances :</b> exp strictement croissante sur ℝ ; ln strictement croissante sur ]0 ; +∞[.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ln(a + b) ≠ ln a + ln b ! (ln 2 + ln 3 = ln 6 ≈ 1,79, mais ln 5 ≈ 1,61) ; ln x exige x &gt; 0 (domaine !) ; e^{a+b} = e^a·e^b (pas e^a + e^b) ; (ln x)′ = 1/x mais (ln u)′ = u′/u : le u′ est vital ; ln 1 = 0 et e⁰ = 1 : les deux « points d'ancrage ».</div>"},
{"id": "lois-binomiale-normale", "theme": "Lois de probabilité (Terminale)", "niveau": "Terminale", "titre": "Lois de probabilité : binomiale, normale", "cours": "<div class=\"cours-head\"><h2>Lois de probabilité : binomiale, normale</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Loi binomiale B(n ; p)</h3>\n<div class=\"tip\"><b>Contexte :</b> n répétitions IDENTIQUES et INDÉPENDANTES d'une épreuve à deux issues (succès de proba p). <b>X = nombre de succès ⟹ X ~ B(n ; p).</b> <b>P(X = k) = C(n,k)·p^k·(1−p)^{n−k}.</b> <b>E(X) = np ; V(X) = np(1−p) ; σ = √(np(1−p)).</b></div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — loi binomiale complète</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> QCM : 10 questions, 4 choix, on répond au hasard. X = bonnes réponses. ① Loi de X ? ② P(X = 10) ? ③ E(X) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : 10 épreuves indépendantes, succès p = 1/4 : X ~ <b>B(10 ; 0,25)</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : P(X = 10) = (1/4)^{10} ≈ <b>9,5×10⁻⁷</b> : obtenir 10/10 au hasard est quasi impossible.</div><div class=\"etu\"><b>Étape 3</b> — <b>③</b> : E(X) = 10×0,25 = <b>2,5</b> bonnes réponses en moyenne ; V = 10×0,25×0,75 = 1,875, σ ≈ 1,37. L'espérance np sert à calibrer l'intuition : 2,5/10 au hasard.</div></div></details>\n<h3>2. Calculs binomiaux et seuils</h3>\n<div class=\"tip\"><b>P(X ≥ k) = 1 − P(X ≤ k−1)</b> (calculatrice : binomFdp / binomFRép). <b>Intervalle du type P(X ≥ seuil) :</b> passer au complémentaire. Exemple : « au moins 1 succès » : 1 − (1−p)ⁿ.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — au moins un succès</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un dé est lancé 5 fois. P(obtenir au moins un 6) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Contraire</b> : « aucun 6 » : chaque lancer rate avec proba 5/6, indépendamment : (5/6)⁵.</div><div class=\"etu\"><b>Étape 2</b> — <b>Calcul</b> : (5/6)⁵ ≈ 0,402.</div><div class=\"etu\"><b>Étape 3</b> — <b>Complément</b> : P = 1 − 0,402 ≈ <b>0,598</b> : environ 60 % de chances. Le « au moins » se traite PRESQUE TOUJOURS par le contraire : 1 − P(aucun).</div></div></details>\n<h3>3. Loi normale N(μ ; σ²)</h3>\n<div class=\"tip\"><b>Modèle continu</b> (tailles, mesures) : courbe « en cloche », symétrique autour de μ, d'écart type σ. <b>Règles 68-95-99,7 :</b> ≈68 % des valeurs dans [μ−σ ; μ+σ], ≈95 % dans [μ−2σ ; μ+2σ], ≈99,7 % dans [μ−3σ ; μ+3σ].<br><b>Normalisation :</b> si X ~ N(μ ; σ²), alors Z = (X − μ)/σ suit N(0 ; 1).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire une loi normale</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Tailles : X ~ N(170 ; 64) (σ = 8 cm). ① P(162 ≤ X ≤ 178) ? ② P(X ≥ 186) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : [170−8 ; 170+8] = ±1σ : P ≈ <b>0,68</b> (règle 68).</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : 186 = 170 + 2σ : P(X ≥ μ+2σ) ≈ (1 − 0,95)/2 = <b>0,025</b> (2,5 % : la moitié des 5 % hors ±2σ, par symétrie).</div><div class=\"etu\"><b>Étape 3</b> — <b>Normalisation</b> : Z = (X−170)/8 : P(X ≥ 186) = P(Z ≥ 2) : les tables N(0;1) s'appliquent après ce changement de variable.</div></div></details>\n<h3>4. Approximation et fluctuation (aperçu)</h3>\n<div class=\"tip\"><b>Approximation normale d'une binomiale :</b> si n ≥ 30, np ≥ 5, np(1−p) ≥ 5 : B(n ; p) ≈ N(np ; np(1−p)). <b>Intervalle de fluctuation (seuil 95 %) :</b> [p − 1,96·√(p(1−p)/n) ; p + 1,96·√(p(1−p)/n)].</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> binomiale = DISCRÈTE (P(X = k)) mais normale = CONTINUE (P(X = a) = 0 : seulement des intervalles) ; vérifier les 3 conditions d'une binomiale (identique, indépendant, deux issues) ; le contraire de « au moins un » est « AUCUN » ; en loi normale : 95 % à ±2σ, pas ±3σ (c'est 99,7 %) ; σ² est la VARIANCE dans N(μ ; σ²) : σ = √(σ²).</div>"},
{"id": "equations-differentielles", "theme": "Équations différentielles (Terminale)", "niveau": "Terminale", "titre": "Équations différentielles", "cours": "<div class=\"cours-head\"><h2>Équations différentielles</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. L'équation de base y′ = ay + b</h3>\n<div class=\"tip\"><b>Solution générale de y′ = ay + b (a ≠ 0) :</b> y(x) = C·e^{ax} − b/a, où C est une constante réelle quelconque.<br><b>Cas particulier y′ = ay :</b> y = C·e^{ax}. Le terme −b/a est la « solution constante » (équilibre).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — résoudre y′ = 2y + 3</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre y′ = 2y + 3, puis trouver la solution telle que y(0) = 1.</div><div class=\"etu\"><b>Étape 1</b> — <b>Solution générale</b> : a = 2, b = 3 : y(x) = C·e^{2x} − 3/2.</div><div class=\"etu\"><b>Étape 2</b> — <b>Vérifier</b> : y′ = 2C·e^{2x} et 2y + 3 = 2C·e^{2x} − 3 + 3 = 2C·e^{2x} ✓.</div><div class=\"etu\"><b>Étape 3</b> — <b>Condition initiale</b> : y(0) = C − 3/2 = 1 ⟹ C = 5/2. Solution : <b>y(x) = (5/2)e^{2x} − 3/2</b>. La condition initiale FIXE l'unique C.</div></div></details>\n<h3>2. Avec second membre en exponentielle : y′ = ay + b·e^{x}</h3>\n<div class=\"tip\"><b>Solution particulière :</b> chercher y_p = d·e^{x} (même base) : d·e^{x} = a·d·e^{x} + b·e^{x} ⟹ d(1 − a) = b ⟹ d = b/(1−a). <b>Solution générale : y = C·e^{ax} + (b/(1−a))·e^{x}</b> (si a ≠ 1).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — second membre exponentiel</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre y′ = 3y + 2e^{x}.</div><div class=\"etu\"><b>Étape 1</b> — <b>Solution particulière</b> : y_p = d·e^{x} : d = 2/(1−3) = −1 : y_p = −e^{x}.</div><div class=\"etu\"><b>Étape 2</b> — <b>Vérifier</b> : y_p′ = −e^{x} ; 3y_p + 2e^{x} = −3e^{x} + 2e^{x} = −e^{x} ✓.</div><div class=\"etu\"><b>Étape 3</b> — <b>Générale</b> : y(x) = <b>C·e^{3x} − e^{x}</b>. Méthode générale : solution homogène + solution particulière.</div></div></details>\n<h3>3. Modélisation : décroissance et croissance</h3>\n<div class=\"tip\"><b>Croissance/décroissance proportionnelle :</b> y′ = ay : si a &lt; 0 : décroissance exponentielle (désintégration, refroidissement) ; si a &gt; 0 : croissance (intérêts composés, épidémie en phase initiale). <b>Demi-vie :</b> T telle que e^{aT} = 1/2 ⟹ T = ln 2/|a|.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — demi-vie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une substance radioactive vérifie N′ = −0,05N (N en fonction du temps t en années). ① Solution avec N(0) = 1000 ? ② Demi-vie ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Solution</b> : N(t) = 1000·e^{−0,05t} (C = 1000 : condition initiale).</div><div class=\"etu\"><b>Étape 2</b> — <b>Demi-vie</b> : N(T) = 500 ⟹ e^{−0,05T} = 1/2 ⟹ T = ln 2/0,05 ≈ <b>13,9 ans</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Interprétation</b> : chaque tranche de 13,9 ans divise la quantité par 2 : 1000 → 500 → 250… La demi-vie est l'horloge naturelle de la décroissance exponentielle.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> ne pas oublier le −b/a (équilibre) dans y′ = ay + b ; la constante C n'est déterminée QUE par la condition initiale ; vérifier la solution en remplaçant dans l'équation (10 secondes) ; dans y_p = d·e^{x}, le coefficient d se calcule par identification : ne pas le deviner ; a = 1 est un cas à part (second membre e^{x} : solution particulière en x·e^{x}).</div>"},
{"id": "arithmetique-matrices", "theme": "Arithmétique et matrices (Terminale)", "niveau": "Terminale", "titre": "Arithmétique et matrices (maths expertes)", "cours": "<div class=\"cours-head\"><h2>Arithmétique et matrices (maths expertes)</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Divisibilité et division euclidienne</h3>\n<div class=\"tip\"><b>Division euclidienne :</b> a = bq + r avec 0 ≤ r &lt; b. <b>Divisibilité :</b> a | b si r = 0. <b>Critères :</b> divisible par 2 (pair), 3 (somme des chiffres), 4 (2 derniers), 5 (fin 0/5), 9 (somme des chiffres), 10 (fin 0), 11 (différence alternée).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — division euclidienne</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Division euclidienne de 2027 par 6 ? Le reste de 2027⁷ par 6 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Division</b> : 2027 = 6×337 + 5 : quotient 337, reste <b>5</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Congruence</b> : 2027 ≡ 5 [6], et 5² = 25 ≡ 1 [6] : les puissances de 2027 alternent : 5, 1, 5, 1…</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : 2027⁷ : exposant impair ⟹ ≡ 5 [6] : reste <b>5</b>. La congruence transforme un calcul géant en un calcul minuscule.</div></div></details>\n<h3>2. PGCD, nombres premiers et Bézout</h3>\n<div class=\"tip\"><b>PGCD par l'algorithme d'Euclide :</b> pgcd(a, b) = pgcd(b, r). <b>Nombres premiers entre eux :</b> pgcd = 1. <b>Théorème de Bézout :</b> a et b premiers entre eux ⟺ il existe u, v tels que au + bv = 1. <b>Gauss :</b> si a | bc et a premier avec b, alors a | c.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — Bézout et inverse modulaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ① Montrer que 3 et 5 sont premiers entre eux. ② Trouver l'inverse de 3 modulo 5. ③ Résoudre 3x ≡ 1 [5].</div><div class=\"etu\"><b>Étape 1</b> — <b>Bézout</b> : 2×3 − 1×5 = 1 : u = 2, v = −1 : premiers entre eux ✓.</div><div class=\"etu\"><b>Étape 2</b> — <b>Inverse</b> : 3×2 = 6 ≡ 1 [5] : l'inverse de 3 modulo 5 est <b>2</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Équation</b> : 3x ≡ 1 [5] ⟺ x ≡ 3⁻¹ ≡ 2 [5] : <b>x = 2 + 5k</b> (k entier). Bézout est la clé des équations modulaires.</div></div></details>\n<h3>3. Matrices : opérations</h3>\n<div class=\"tip\"><b>Somme :</b> terme à terme (mêmes dimensions). <b>Produit :</b> lignes × colonnes : (AB)_{ij} = Σ a_{ik}·b_{kj} (dimensions compatibles : (m×n)·(n×p) = (m×p)). <b>Non commutatif :</b> AB ≠ BA en général ! <b>Iₙ :</b> matrice identité : AI = IA = A.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — produit de matrices</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> A = (1 2 ; 3 4), B = (0 1 ; 1 0). Calculer AB puis BA.</div><div class=\"etu\"><b>Étape 1</b> — <b>AB</b> : ligne 1 × colonnes : (1×0+2×1 ; 1×1+2×0) = (2 ; 1) ; ligne 2 : (4 ; 3). AB = <b>(2 1 ; 4 3)</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>BA</b> : (3 4 ; 1 2). <b>AB ≠ BA</b> : le produit n'est PAS commutatif : l'ordre des facteurs compte.</div><div class=\"etu\"><b>Étape 3</b> — <b>Lecture</b> : B = (0 1 ; 1 0) échange les colonnes (pour AB, appliqué APRÈS) ou les lignes (pour BA, appliqué AVANT) : le sens de lecture (droite → gauche) guide l'interprétation.</div></div></details>\n<h3>4. Puissances et systèmes</h3>\n<div class=\"tip\"><b>Inverse 2×2 :</b> A = (a b ; c d) inversible ssi det = ad − bc ≠ 0 ; alors A⁻¹ = (1/det)·(d −b ; −c a). <b>Système :</b> AX = B ⟹ X = A⁻¹B. <b>Puissances :</b> A² = A·A, Aⁿ par itération ou par récurrence (type suites de Fibonacci : Fₙ₊₁ = Fₙ + Fₙ₋₁ se modélise par une matrice).</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> AB ≠ BA (jamais d'échange de facteurs) ; produit ligne×colonne, pas terme à terme ; det nul ⟹ PAS d'inverse ; reste toujours dans [0 ; b) (reste 5, pas −1) ; congruence : on peut multiplier/additionner les congrus, mais PAS diviser ; puissances de matrices : calculer A² AVANT de généraliser Aⁿ.</div>"},
{"id": "perimetres", "theme": "Périmètres et aires (6e)", "niveau": "6e", "titre": "Périmètres et aires", "cours": "<div class=\"cours-head\"><h2>Périmètres et aires</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Périmètres</h3>\n<p>Le <b>périmètre</b> est la longueur du contour d'une figure (une LONGUEUR, en cm, m, km…).</p>\n<div class=\"tip\"><b>Formules :</b><br>• Carré : P = 4 × c<br>• Rectangle : P = 2 × (L + l)<br>• Triangle : P = somme des 3 côtés<br>• Cercle : P = 2 × π × r = π × d (appelé « circonférence »)</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — périmètre d'une figure composée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un jardin rectangulaire de 12 m sur 8 m est entouré d'une clôture. Quelle longueur de clôture faut-il ? Et pour un jardin carré de côté 10 m, qui a le même périmètre ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Rectangle</b> : P = 2 × (12 + 8) = 2 × 20 = <b>40 m</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Carré</b> : P = 4 × 10 = <b>40 m</b> aussi.</div><div class=\"etu\"><b>Étape 3</b> — <b>Comparer les aires</b> (voir section 3) : rectangle 96 m², carré 100 m² : à périmètre égal, le carré offre plus de surface ! Une clôture de 40 m délimite au mieux un carré.</div></div></details>\n<h3>2. Aires : l'unité et l'esprit du calcul</h3>\n<p>L'<b>aire</b> mesure la surface couverte (en cm², m²…). On peut la voir comme le nombre de petits carrés unités qui recouvrent la figure.</p>\n<div class=\"tip\"><b>Conversions d'aires :</b> 1 cm² = 100 mm² ; 1 dm² = 100 cm² ; 1 m² = 100 dm² = 10 000 cm². L'unité « saute » de 100 en 100 car les longueurs passent de 10 en 10 sur DEUX dimensions.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — convertir des aires</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Convertir 3,5 m² en cm², et 250 000 cm² en m².</div><div class=\"etu\"><b>Étape 1</b> — <b>m² → cm²</b> : 1 m² = 10 000 cm², donc 3,5 m² = 35 000 cm².</div><div class=\"etu\"><b>Étape 2</b> — <b>cm² → m²</b> : on divise par 10 000 : 250 000 cm² = 25 m².</div><div class=\"etu\"><b>Étape 3</b> — <b>Retenir</b> : pour les aires, on multiplie/divise par 100 à CHAQUE échelon (mm²→cm²→dm²→m²), soit ×100 entre unités voisines, ×10 000 de m² à cm² (deux échelons).</div></div></details>\n<h3>3. Les formules d'aires</h3>\n<div class=\"tip\"><b>Carré :</b> A = c × c = c²<br><b>Rectangle :</b> A = L × l<br><b>Triangle :</b> A = (base × hauteur) ÷ 2<br><b>Disque :</b> A = π × r²<br><b>Parallélogramme :</b> A = base × hauteur</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — aire d'un triangle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un triangle a une base de 8 cm et une hauteur de 5 cm. Calculer son aire.</div><div class=\"etu\"><b>Étape 1</b> — <b>Repérer base et hauteur</b> : la hauteur est PERPENDICULAIRE à la base (pas un côté !).</div><div class=\"etu\"><b>Étape 2</b> — <b>Appliquer la formule</b> : A = (8 × 5)/2 = 40/2 = <b>20 cm²</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Comprendre le ÷ 2</b> : deux triangles identiques se collent en un rectangle 8 × 5 = 40 cm² : un seul triangle en vaut la moitié.</div></div></details>\n<h3>4. Périmètre ≠ aire !</h3>\n<p>Deux figures de même aire peuvent avoir des périmètres différents, et inversement (voir l'exemple du jardin). <b>Ne pas confondre</b> : un périmètre s'exprime en mètres, une aire en mètres CARRÉS.</p>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> pour le disque, A = πr² (rayon au carré) mais P = 2πr (rayon simple) ; la hauteur d'un triangle n'est pas un côté ; doubler les longueurs quadruple l'aire (×4) ; conversions d'aires par 100, pas par 10.</div>"}];
var FICHES_DATA = [{"id": "pythagore", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Théorème :</b> triangle rectangle en A ⟹ BC² = AB² + AC² (hypoténuse au carré = somme des carrés des deux autres côtés).</p>\n<p><b>Réciproque :</b> BC² = AB² + AC² ⟹ triangle rectangle en A (le plus long côté est l'hypoténuse).</p>\n<p><b>Contraposée :</b> BC² ≠ AB² + AC² ⟹ le triangle n'est pas rectangle.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculer l'hypoténuse :</b> BC = √(AB² + AC²)</li>\n<li><b>Calculer un côté de l'angle droit :</b> AB = √(BC² − AC²)</li>\n<li><b>Vérifier si un triangle est rectangle :</b> comparer le plus grand carré à la somme des deux autres (réciproque).</li>\n</ul>\n<h3>🔢 Triplets utiles</h3>\n<p>(3 ; 4 ; 5) — (5 ; 12 ; 13) — (8 ; 15 ; 17) — et leurs multiples : (6 ; 8 ; 10), (9 ; 12 ; 15)…</p>\n<h3>🧮 Formules dérivées</h3>\n<ul>\n<li>Diagonale d'un rectangle : d = √(L² + l²)</li>\n<li>Distance MN = √((x<sub>N</sub>−x<sub>M</sub>)² + (y<sub>N</sub>−y<sub>M</sub>)²)</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Ne s'applique QUE dans un triangle rectangle.</li>\n<li>L'hypoténuse est toujours le côté le plus long = celui qui est <b>seul</b> dans l'égalité.</li>\n<li>Ne pas oublier la racine carrée finale (√25 = 5).</li>\n</ul>"}, {"id": "derivation", "fiche": "<h3>📌 Définitions</h3>\n<p><b>Nombre dérivé :</b> f′(a) = lim<sub>h→0</sub> (f(a+h) − f(a)) / h.</p>\n<p><b>Tangente en a :</b> y = f′(a)(x − a) + f(a) (coefficient directeur : f′(a)).</p>\n<h3>🔢 Dérivées usuelles</h3>\n<table><tr><th>f</th><th>x<sup>n</sup></th><th>1/x</th><th>√x</th><th>cos x</th><th>sin x</th><th>k</th></tr>\n<tr><td><b>f′</b></td><td>n x<sup>n−1</sup></td><td>−1/x²</td><td>1/(2√x)</td><td>−sin x</td><td>cos x</td><td>0</td></tr></table>\n<h3>➕ Opérations</h3>\n<ul>\n<li>(u + v)′ = u′ + v′ ; (k u)′ = k u′</li>\n<li>(uv)′ = u′v + uv′</li>\n<li>(1/v)′ = −v′/v² ; (u/v)′ = (u′v − uv′)/v²</li>\n<li>(u<sup>n</sup>)′ = n u′ u<sup>n−1</sup> ; (√u)′ = u′/(2√u)</li>\n</ul>\n<h3>📈 Variations</h3>\n<ul>\n<li>f′ &gt; 0 ⟹ f croissante ; f′ &lt; 0 ⟹ f décroissante.</li>\n<li>f′ s'annule ET change de signe en a ⟹ extremum local en a.</li>\n</ul>\n<h3>🎯 Méthode d'étude</h3>\n<p>Domaine → f′(x) factorisée → signe de f′ → tableau de variations → extremums.</p>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>(uv)′ ≠ u′v′.</li>\n<li>f′(a) = 0 seul ne prouve pas un extremum (changement de signe obligatoire : x³ en 0).</li>\n<li>Dérivable ⇒ continue, mais pas l'inverse (|x| en 0).</li>\n</ul>"},
{"id": "puissances", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Définition :</b> aⁿ = a × a × … × a (n facteurs) ; a¹ = a ; a⁰ = 1 (a ≠ 0).</p>\n<p><b>Les 3 règles :</b> aᵐ × aⁿ = aᵐ⁺ⁿ ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ ; (aᵐ)ⁿ = aᵐˣⁿ.</p>\n<p><b>Puissances de 10 :</b> 10⁻ⁿ = 1/10ⁿ ; multiplier par 10ⁿ déplace la virgule de n rangs.</p>\n<p><b>Écriture scientifique :</b> a × 10ⁿ avec 1 ≤ a < 10 (unique).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Simplifier un produit de puissances :</b> même base → additionner les exposants.</li>\n<li><b>Simplifier un quotient :</b> même base → soustraire les exposants.</li>\n<li><b>Écriture scientifique :</b> placer la virgule pour obtenir 1 ≤ a < 10, puis compter les rangs de déplacement (droite → exposant positif, gauche → négatif).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>(−2)⁴ = 16 mais −2⁴ = −16 (parenthèses !).</li>\n<li>2³ × 2² = 2⁵ : on N'ADDITIONNE PAS les bases.</li>\n<li>(2³)² = 2⁶ : on MULTIPLIE les exposants, contrairement au produit.</li>\n<li>5⁰ = 1, pas 0 ni 5.</li>\n</ul>"},
{"id": "milieux", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Théorème 1 :</b> droite passant par les milieux de deux côtés d'un triangle ⟹ <b>parallèle au troisième côté</b>.</p>\n<p><b>Théorème 2 :</b> segment des milieux ⟹ longueur = <b>moitié du troisième côté</b> (IJ = BC/2).</p>\n<p><b>Réciproque :</b> droite passant par le milieu d'un côté, parallèle à un deuxième côté ⟹ coupe le 3ᵉ côté en son <b>milieu</b>.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculer une longueur :</b> segment des milieux = moitié du 3ᵉ côté ; le 3ᵉ côté = 2 × segment des milieux.</li>\n<li><b>Prouver un parallélisme :</b> citer les deux milieux, conclure avec le théorème 1.</li>\n<li><b>Prouver qu'un point est un milieu :</b> citer « milieu d'un côté + parallèle au 2ᵉ côté », conclure avec la réciproque.</li>\n<li><b>Quadrilatère de milieux :</b> tracer une diagonale, appliquer le théorème dans les deux triangles ⟹ parallélogramme.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Il faut DEUX milieux (ou un milieu + une parallèle) : une seule donnée ne suffit pas.</li>\n<li>IJ = BC/2 : le 3ᵉ côté est CELUI QUI N'EST PAS coupé en son milieu.</li>\n<li>Ne pas confondre droite des milieux et médiane.</li>\n</ul>"},
{"id": "calcul-litteral", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Simplifications :</b> 3 × x = 3x ; x × x = x² ; x + x = 2x ; 1x = x.</p>\n<p><b>Simple distributivité :</b> k(a + b) = ka + kb ; k(a − b) = ka − kb.</p>\n<p><b>Double distributivité :</b> (a + b)(c + d) = ac + ad + bc + bd.</p>\n<p><b>Substituer :</b> remplacer x par sa valeur, avec des parenthèses si le nombre est négatif.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Réduire :</b> regrouper les x avec les x, les x² avec les x², les nombres avec les nombres.</li>\n<li><b>Développer :</b> multiplier chaque terme, puis réduire.</li>\n<li><b>Vérifier un développement :</b> tester avec une valeur simple (x = 0 ou 1) des deux côtés.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>x + x = 2x mais x × x = x² : ne pas confondre somme et produit.</li>\n<li>3x + 5x² ne se réduit pas (natures différentes).</li>\n<li>−3(x − 2) = −3x + 6 : le « − » change les DEUX signes.</li>\n<li>Substituer un négatif : toujours des parenthèses, (−2)² = 4 mais −2² = −4.</li>\n</ul>"},
{"id": "equations", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Équation :</b> égalité à une inconnue x ; <b>solution</b> = valeur de x qui rend l'égalité vraie.</p>\n<p><b>Principe de la balance :</b> toute opération faite d'un côté doit être faite de l'autre.</p>\n<p><b>Ordre de résolution :</b> 1) développer ; 2) regrouper les x d'un côté, les nombres de l'autre ; 3) diviser par le coefficient ; 4) VÉRIFIER.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>3x − 5 = 16 :</b> +5 des deux côtés → 3x = 21 → ÷3 → x = 7.</li>\n<li><b>5x + 2 = 2x + 14 :</b> −2x → 3x + 2 = 14 → −2 → 3x = 12 → x = 4.</li>\n<li><b>2(3x − 1) = 4x + 6 :</b> développer → 6x − 2 = 4x + 6 → 2x = 8 → x = 4.</li>\n<li><b>Problème :</b> choisir l'inconnue, traduire l'énoncé, résoudre, vérifier, conclure avec l'unité.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Toujours vérifier la solution dans l'équation INITIALE.</li>\n<li>Quand x est des deux côtés : soustraire le PETIT x pour garder un coefficient positif.</li>\n<li>« Faire passer » un terme = changer son signe (car on ajoute/soustrait des deux côtés).</li>\n<li>Dans un problème, la solution doit être cohérente (prix positif, nombre entier de personnes…).</li>\n</ul>"},
{"id": "proportionnalite", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Produit en croix :</b> a/b = c/d ⟹ a×d = b×c (quatrième proportionnelle).</p>\n<p><b>Vitesse :</b> v = d/t ⟺ d = v×t ⟺ t = d/v.</p>\n<p><b>Conversions vitesses :</b> km/h → m/s : ÷3,6 ; m/s → km/h : ×3,6.</p>\n<p><b>Échelle :</b> e = distance carte / distance réelle (même unité) ; échelle 1/25 000 ⟹ 1 cm = 250 m.</p>\n<p><b>Pourcentages :</b> +15 % = ×1,15 ; −20 % = ×0,8.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Quatrième proportionnelle :</b> poser le tableau, produit en croix, convertir l'unité à la fin.</li>\n<li><b>Temps décimal :</b> 2 h 30 min = 2,5 h ; 45 min = 0,75 h ; 3,2 h = 3 h 12 min.</li>\n<li><b>Échelle :</b> multiplier la distance carte par le dénominateur, puis convertir (cm → km : ÷100 000).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>2 h 30 min = 2,5 h (et non 2,30 h) : les minutes sont en base 60.</li>\n<li>La vitesse moyenne n'est PAS la moyenne des vitesses.</li>\n<li>Échelle : toujours les mêmes unités avant le produit en croix.</li>\n<li>Augmenter de 10 % puis de 10 % ≠ +20 % (car la seconde hausse part d'un prix plus grand).</li>\n</ul>"},
{"id": "pyramides", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Pyramide :</b> V = (1/3) × B × h (B = AIRE de la base, h = hauteur).</p>\n<p><b>Cône :</b> V = (1/3) × π × r² × h.</p>\n<p><b>Section parallèle à la base :</b> même forme que la base ; réduction de rapport k ⟹ longueurs ×k, aires ×k², volumes ×k³.</p>\n<p>Pyramide et cône = le <b>tiers</b> du prisme/cylindre de même base et hauteur.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Volume :</b> calculer B d'abord (aire !), puis appliquer V = (1/3)Bh.</li>\n<li><b>Retrouver h :</b> h = 3V/B ; retrouver r ou le côté de base : mêmes étapes à l'envers.</li>\n<li><b>Valeur exacte avec π :</b> garder « ×π » dans le résultat exact, arrondir seulement à la fin.</li>\n<li><b>Agrandissement-réduction :</b> identifier k (longueurs), puis appliquer k² (aires) ou k³ (volumes).</li>\n</ul>\n<h3>🔢 Aires de base utiles</h3>\n<ul>\n<li>Carré de côté c : B = c²</li>\n<li>Rectangle : B = L × l</li>\n<li>Disque : B = πr²</li>\n<li>Triangle : B = (b × h)/2</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>B est une AIRE : pour une base carrée de 6, B = 36 (pas 6 !).</li>\n<li>Hauteur ⟂ base : ce n'est pas une arête latérale.</li>\n<li>Unités : cm × cm² = cm³.</li>\n<li>Diviser les dimensions par 2 divise le volume par 8 (k³), pas par 2.</li>\n</ul>"},
{"id": "thales", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Thalès :</b> deux droites sécantes + deux parallèles ⟹ AM/AB = AN/AC = MN/BC.</p>\n<p><b>Réciproque :</b> AM/AB = AN/AC (même ordre des points) ⟹ (MN) ∥ (BC).</p>\n<p><b>Agrandissement-réduction :</b> longueurs ×k, aires ×k².</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculer une longueur :</b> identifier la configuration, écrire les 3 rapports, produit en croix.</li>\n<li><b>Prouver un parallélisme :</b> calculer les 2 rapports séparément, comparer, citer la réciproque.</li>\n<li><b>Aires :</b> le rapport des longueurs au carré donne le rapport des aires.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Côtés homologues : AM avec AB, jamais AM avec AC.</li>\n<li>Réciproque : points alignés dans le même ordre, sinon théorème faux.</li>\n<li>k² pour les aires, k pour les longueurs.</li>\n<li>Thalès ne s'applique que si on CONNAÎT (ou prouve) le parallélisme pour le théorème direct.</li>\n</ul>"},
{"id": "trigonometrie", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>SOH-CAH-TOA :</b> sin(x) = Opp/Hyp ; cos(x) = Adj/Hyp ; tan(x) = Opp/Adj.</p>\n<p>Le rapport ne dépend que de l'angle, pas de la taille du triangle.</p>\n<p>Valeurs remarquables : cos(60°) = 1/2 ; sin(30°) = 1/2 ; tan(45°) = 1.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Longueur connue + angle connu :</b> choisir la formule qui relie les DEUX côtés concernés, isoler, calculer (mode DEGRÉ).</li>\n<li><b>Deux côtés connus, angle inconnu :</b> former le rapport, puis touche inverse : cos⁻¹, sin⁻¹ ou tan⁻¹.</li>\n<li><b>Étape 0 obligatoire :</b> nommer Hypoténuse / Adjacent / Opposé par rapport à l'angle choisi.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Adjacent et opposé s'échangent quand on change d'angle.</li>\n<li>Calculatrice en degrés (DEG), pas en radians.</li>\n<li>cos(x) et sin(x) d'un angle aigu sont toujours entre 0 et 1.</li>\n<li>cos⁻¹(0,5) = 60°, mais 1/cos(60°) = 2 : la touche inverse n'est pas l'inverse du nombre.</li>\n</ul>"},
{"id": "racines", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Définition :</b> √a = le nombre positif dont le carré est a (a ≥ 0).</p>\n<p><b>Règles :</b> √a × √b = √(ab) ; √a/√b = √(a/b).</p>\n<p><b>PAS de règle pour la somme :</b> √a + √b ≠ √(a+b).</p>\n<p><b>Équation x² = a (a > 0) :</b> x = √a ou x = −√a.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Simplifier √N :</b> chercher le plus grand carré parfait qui divise N (√50 = 5√2, √72 = 6√2, √75 = 5√3).</li>\n<li><b>Réduire une somme :</b> simplifier chaque racine, puis regrouper les √ identiques (3√2 + 5√2 = 8√2).</li>\n<li><b>Carrés parfaits à connaître :</b> 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>√9 = 3 uniquement (positif) ; x² = 9 a deux solutions : −3 et 3.</li>\n<li>√2 + √3 ne se simplifie pas (√5 serait faux).</li>\n<li>(√3)² = 3 : élever au carré « fait tomber » la racine.</li>\n<li>√(−5) n'existe pas.</li>\n</ul>"},
{"id": "factorisation", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Identités remarquables :</b> (a+b)² = a² + 2ab + b² ; (a−b)² = a² − 2ab + b² ; (a+b)(a−b) = a² − b².</p>\n<p><b>Facteur commun :</b> ka + kb = k(a+b).</p>\n<p><b>Produit nul :</b> A×B = 0 ⟺ A = 0 ou B = 0.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Développer (a±b)² :</b> carré du 1ᵉʳ + double produit + carré du 2ᵉ (attention au signe du double produit).</li>\n<li><b>Factoriser :</b> 1) facteur commun ? 2) a² − b² ? 3) sinon, développer/réduire d'abord.</li>\n<li><b>Équation-produit :</b> factoriser, puis chaque facteur = 0 séparément.</li>\n<li><b>Vérification systématique :</b> redévelopper la forme factorisée.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>(x+3)² = x² + 6x + 9 (pas x² + 9, ni x² + 3x + 9).</li>\n<li>(3x)² = 9x² (le coefficient est au carré).</li>\n<li>x² − 49 = 0 : factoriser en (x+7)(x−7), ne JAMAIS diviser par (x−7).</li>\n<li>a² − b² se factorise, mais a² + b² non (pas d'identité).</li>\n</ul>"},
{"id": "fonctions", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Fonction :</b> un procédé qui à chaque x associe UN SEUL nombre f(x).</p>\n<p><b>f(x) = image de x</b> ; x = un antécédent de f(x).</p>\n<p>L'image est unique ; un nombre peut avoir 0, 1 ou plusieurs antécédents.</p>\n<p><b>Linéaire :</b> f(x) = ax (droite par l'origine, proportionnalité). <b>Affine :</b> f(x) = ax + b.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculer une image :</b> remplacer x par la valeur (parenthèses si négatif).</li>\n<li><b>Chercher un antécédent :</b> résoudre l'équation f(x) = valeur.</li>\n<li><b>Sur un graphique :</b> image → verticale depuis l'abscisse ; antécédents → horizontale depuis l'ordonnée.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>f(2) se calcule ; « l'antécédent de 2 » se trouve en résolvant f(x) = 2.</li>\n<li>Sur une courbe, une valeur du tableau peut avoir plusieurs antécédents.</li>\n<li>(−2)² = 4 : vigilance sur les substitutions.</li>\n<li>Le vocabulaire est NOTÉ au brevet : image ≠ antécédent.</li>\n</ul>"},
{"id": "statistiques", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Moyenne :</b> somme des valeurs ÷ effectif ; pondérée : Σ(valeur×coef) ÷ Σcoef.</p>\n<p><b>Médiane :</b> valeur qui coupe la série ORDONNÉE en deux moitiés (central si impair ; moyenne des deux centraux si pair).</p>\n<p><b>Étendue :</b> max − min (dispersion).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Médiane :</b> 1) ordonner, 2) compter, 3) prendre la (ou les) valeur(s) centrale(s).</li>\n<li><b>Moyenne pondérée :</b> tout multiplier, tout additionner, diviser par le total des poids.</li>\n<li><b>Choisir l'indicateur :</b> série avec valeur extrême → médiane ; situation proportionnelle → moyenne.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Chercher la médiane SANS trier la série : erreur garantie.</li>\n<li>Effectif pair : la médiane peut ne pas être une valeur de la série.</li>\n<li>La moyenne « ne ressemble à personne » si les valeurs sont dispersées.</li>\n<li>Étendue = une seule valeur (max − min), pas « de … à … ».</li>\n</ul>"},
{"id": "spheres", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Sphère</b> (surface) : A = 4πr². <b>Boule</b> (volume) : V = (4/3)πr³.</p>\n<p><b>Section par un plan :</b> toujours un cercle ; grand cercle si le plan passe par le centre.</p>\n<p><b>Sections de solides :</b> parallèle à la base ⟹ même forme réduite (k, k², k³).</p>\n<p><b>Translation :</b> glissement selon un vecteur. <b>Rotation :</b> pivotement autour d'un centre d'un angle donné. Les deux conservent longueurs et angles.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Aire/volume d'une sphère :</b> identifier r² ou r³, garder la valeur exacte avec π.</li>\n<li><b>Rayon d'un cercle de section :</b> Pythagore : rsection² = Rsphère² − d² (d = distance du plan au centre).</li>\n<li><b>Rotation :</b> conserver OM' = OM et l'angle donné ; <b>translation :</b> parallélisme et longueur du vecteur.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>A = 4πr² (pas 4πr³ !) et V = (4/3)πr³ (pas 4πr²).</li>\n<li>Plan à distance d du centre : le rayon de section vaut √(R² − d²), toujours plus petit que R.</li>\n<li>Translation ≠ rotation : une seule change l'orientation de la figure.</li>\n<li>Les transformations du chapitre ne déforment RIEN (isométries).</li>\n</ul>"},
{"id": "entiers-decimaux", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Comparaison :</b> parties entières d'abord, puis dixièmes, centièmes… chiffre par chiffre.</p>\n<p><b>Produit de décimaux :</b> virgule à (nb de décimales du 1ᵉʳ) + (nb du 2ᵉ) chiffres.</p>\n<p><b>Divisibilité :</b> par 2 (pair), par 5 (0 ou 5), par 10 (0), par 3 et 9 (somme des chiffres), par 4 (2 derniers chiffres).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Comparer :</b> aligner en colonnes, comparer de gauche à droite.</li>\n<li><b>Multiplier :</b> sans virgule d'abord, compter les décimales, placer la virgule.</li>\n<li><b>Ordre de grandeur :</b> arrondir avant de calculer pour prévoir le résultat.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« Plus de chiffres » ne veut pas dire « plus grand » (5,4 &gt; 5,379).</li>\n<li>Multiplier par un nombre &lt; 1 rétrécit le résultat.</li>\n<li>Diviser par 100 : la virgule part de 2 rangs vers la gauche.</li>\n<li>Critère par 3 : la SOMME des chiffres, pas le dernier.</li>\n</ul>"},
{"id": "fractions", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Fraction d'une quantité :</b> diviser par le dénominateur, multiplier par le numérateur.</p>\n<p><b>Comparer :</b> même dénominateur → numérateurs ; même numérateur → le plus petit dénominateur gagne.</p>\n<p><b>Addition/soustraction :</b> même dénominateur UNIQUEMENT : (a+b)/c. Sinon, réduire d'abord.</p>\n<p><b>Fractions égales :</b> multiplier/diviser haut et bas par le même nombre.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>3/4 de 24 :</b> 24 ÷ 4 = 6, puis 6 × 3 = 18.</li>\n<li><b>Réduire au même dénominateur :</b> prendre le plus petit multiple commun, multiplier chaque fraction pour l'atteindre.</li>\n<li><b>Simplifier :</b> chercher un diviseur commun (6/8 = 3/4).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>1/2 + 1/3 = 5/6, PAS 2/5.</li>\n<li>2/3 &gt; 2/5 : à numérateur égal, plus le dénominateur est petit, plus la part est grande.</li>\n<li>Le dénominateur ne change JAMAIS dans une addition.</li>\n<li>7/4 &gt; 1 : une fraction peut dépasser l'unité.</li>\n</ul>"},
{"id": "pourcentages", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Proportionnalité :</b> coefficient constant ; « doubler l'un double l'autre ».</p>\n<p><b>Quatrième proportionnelle :</b> coefficient (passage par l'unité) ou produit en croix.</p>\n<p><b>Pourcentage :</b> t % de N = (t/100) × N. 50 % = moitié, 25 % = quart, 10 % = ÷ 10, 75 % = 3/4.</p>\n<p><b>Réduction :</b> prix après −t % = (100 − t) % du prix.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Tester un tableau :</b> calculer tous les quotients ; égaux ⟹ proportionnel.</li>\n<li><b>Valeur manquante :</b> diviser pour 1 unité, multiplier pour le nombre cherché.</li>\n<li><b>Solde −30 % :</b> remise = 0,3 × prix ; prix soldé = 0,7 × prix.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>+50 % puis −50 % ≠ retour au prix de départ (100 → 150 → 75).</li>\n<li>Le pourcentage se rapporte toujours à un nombre de départ précis.</li>\n<li>25 % de 40 = 10, mais 25 % de 80 = 20 : le résultat dépend du total.</li>\n<li>100 % d'une quantité = la quantité entière.</li>\n</ul>"},
{"id": "geometrie", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Angles :</b> droit 90°, plat 180° ; complémentaires (somme 90°), supplémentaires (somme 180°).</p>\n<p><b>Somme des angles :</b> triangle 180°, quadrilatère 360°.</p>\n<p><b>Symétrie axiale :</b> l'axe est la médiatrice du segment [M M′] ; <b>centrale :</b> O est le milieu de [M M′].</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Angle manquant d'un triangle :</b> 180° − (les deux autres).</li>\n<li><b>Complémentaire/supplémentaire :</b> 90° − x ou 180° − x.</li>\n<li><b>Construire M′ (axiale) :</b> perpendiculaire à l'axe, reporter HM′ = HM.</li>\n</ul>\n<h3>🔢 Axes de symétrie à connaître</h3>\n<ul>\n<li>Isocèle : 1 — équilatéral : 3 — carré : 4 — rectangle/losange : 2.</li>\n<li>Parallélogramme : 0 axe (centre de symétrie seulement).</li>\n<li>Cercle : une infinité (tous les diamètres).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Rayon ≠ diamètre (d = 2r).</li>\n<li>Angle obtus : ENTRE 90° et 180° (pas « plus de 90° tout court »).</li>\n<li>Symétrie centrale = demi-tour : la figure est retournée.</li>\n</ul>"},
{"id": "relatifs", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Ordre :</b> négatifs &lt; 0 &lt; positifs ; chez les négatifs, le plus loin de zéro est le plus petit.</p>\n<p><b>Addition :</b> même signe → distances à zéro ajoutées, signe commun ; signes contraires → différence des distances, signe du plus loin de zéro.</p>\n<p><b>Soustraction :</b> a − b = a + (−b) : on ajoute l'opposé. − (−x) = +x.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Somme longue :</b> regrouper les positifs, regrouper les négatifs, puis une seule addition finale.</li>\n<li><b>Vérification :</b> se représenter la droite graduée (avancer/reculer).</li>\n<li><b>Distance à zéro :</b> toujours positive : |−8| = 8.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>−5 &lt; −3 : le « plus grand nombre » négatif est le plus proche de zéro.</li>\n<li>3 − (−7) = 10 : deux moins qui se suivent s'annulent.</li>\n<li>−4 + 6 = 2 : le résultat porte le signe du plus loin de zéro.</li>\n<li>(−3) + (−5) = −8 : signe conservé, distances additionnées.</li>\n</ul>"},
{"id": "litteral-5e", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Expression littérale :</b> des lettres remplacent des nombres ; × disparaît devant une lettre : 4c, 3(x+1).</p>\n<p><b>Simplifications :</b> x + x = 2x ; x × x = x² ; 3x + 5x = 8x ; 1x = x.</p>\n<p><b>Tester une égalité :</b> calculer chaque membre séparément et comparer.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Écrire une expression :</b> traduire l'énoncé mot à mot (monter → +, descendre → −, le double → × 2).</li>\n<li><b>Simplifier :</b> regrouper les termes de même nature, jamais x et nombres.</li>\n<li><b>Contrôler :</b> remplacer x par une valeur simple (0, 1 ou 2) avant et après.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>x + x = 2x mais x × x = x² : somme ≠ produit.</li>\n<li>3x + 5 reste tel quel : 8 n'est pas « 3x + 5x ».</li>\n<li>4 × x × 2 = 8x (les nombres se multiplient entre eux).</li>\n<li>Ne jamais « mélanger » cm et cm² (périmètre et aire).</li>\n</ul>"},
{"id": "triangles", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Somme des angles :</b> toujours 180°, quel que soit le triangle.</p>\n<p><b>Cas particuliers :</b> rectangle ⟹ deux aigus complémentaires (somme 90°) ; isocèle ⟹ angles à la base égaux ; équilatéral ⟹ 3 × 60°.</p>\n<p><b>Inégalité triangulaire :</b> le plus grand côté doit être PLUS PETIT que la somme des deux autres.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Troisième angle :</b> 180 − (angle1 + angle2).</li>\n<li><b>Isocèle :</b> d'abord ôter l'angle au sommet, puis diviser le reste par 2.</li>\n<li><b>Existence d'un triangle :</b> identifier le plus grand côté, comparer, conclure.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>47 + 68 = 115 : le troisième angle est 180 − 115 = 65° (pas 180 − 68).</li>\n<li>3 + 4 = 7 &lt; 8 : pas de triangle possible avec 3, 4 et 8 cm.</li>\n<li>Triangle rectangle : les deux aigus font 90° À EUX DEUX.</li>\n<li>Isocèle : ce sont les angles à la BASE qui sont égaux, pas l'angle au sommet.</li>\n</ul>"},
{"id": "parallelogrammes", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Parallélogramme :</b> côtés opposés parallèles ⟹ opposés égaux, angles opposés égaux, diagonales coupées en leur milieu, centre de symétrie.</p>\n<p><b>Angles :</b> consécutifs supplémentaires (somme 180°) ; total 360°.</p>\n<p><b>Famille :</b> losange = 4 côtés égaux (diagonales ⊥) ; rectangle = 4 angles droits (diagonales égales) ; carré = les deux.</p>\n<p><b>Aire :</b> base × hauteur (hauteur ⟂ base).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Démontrer « parallélogramme » :</b> le plus rapide = diagonales de même milieu.</li>\n<li><b>Trouver un côté opposé :</b> reporter la longueur du côté qui lui fait face.</li>\n<li><b>Angle consécutif :</b> 180° − angle donné.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Le losange EST un parallélogramme ; le cerf-volant n'en est PAS un.</li>\n<li>Hauteur ≠ côté incliné : tracer le segment perpendiculaire à la base.</li>\n<li>Rectangle : diagonales ÉGALES ; losange : diagonales PERPENDICULAIRES — ne pas échanger.</li>\n<li>ABCD parallélogramme : AB = CD mais AB ≠ BC (côtés consécutifs).</li>\n</ul>"},
{"id": "stats-5e", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Effectif :</b> nombre d'apparitions d'une valeur ; <b>effectif total :</b> somme des effectifs.</p>\n<p><b>Fréquence :</b> effectif ÷ effectif total (fraction, décimal ou %) ; somme des fréquences = 1.</p>\n<p><b>Diagramme circulaire :</b> angle = (effectif ÷ effectif total) × 360°.</p>\n<p><b>Moyenne pondérée :</b> somme(valeur × effectif) ÷ effectif total.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Lire « au moins » / « plus de » :</b> inclure ou non la valeur frontière.</li>\n<li><b>Retrouver un effectif :</b> effectif total − somme des effectifs connus.</li>\n<li><b>Contrôles :</b> fréquences = 100 % ; angles = 360° ; moyenne entre min et max.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« Au moins 4 » = valeurs 4 et 5 (13 élèves sur l'exemple du cours, pas 8).</li>\n<li>La moyenne peut ne correspondre à AUCUN élève (3,72 n'est pas une note).</li>\n<li>Diviser par l'effectif total, jamais par le nombre de VALEURS distinctes.</li>\n<li>Diagramme circulaire : × 360°, pas × 100.</li>\n</ul>"},
{"id": "ensembles-2de", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Emboîtement :</b> ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ; irrationnels (√2, π) = ℝ∖ℚ.</p>\n<p><b>Intervalles :</b> [a ; b] compris ; ]a ; b[ exclu ; ±∞ toujours exclu.</p>\n<p><b>Identités remarquables :</b> (a+b)² = a²+2ab+b² ; (a−b)² = a²−2ab+b² ; (a+b)(a−b) = a²−b².</p>\n<p><b>Racines :</b> √(ab) = √a·√b ; √(a²) = |a| ; MAIS √(a+b) ≠ √a + √b.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Classer un nombre :</b> entier ? relatif ? quotient d'entiers ? sinon ℝ∖ℚ.</li>\n<li><b>Inéquation → intervalle :</b> ≤ ou ≥ ⟹ crochet fermé ; &lt; ou &gt; ⟹ ouvert.</li>\n<li><b>Calcul mental :</b> 101² = (100+1)² ; 99² = (100−1)² ; 102×98 = (100+2)(100−2).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>0,7 = 7/10 est rationnel : un décimal EST un quotient.</li>\n<li>√16 = 4 ∈ ℕ, mais √5 est irrationnel.</li>\n<li>(a + b)² ≠ a² + b² : le double produit 2ab manque toujours.</li>\n<li>√9 + √16 = 7 ≠ √25 = 5 : la racine d'une somme ≠ somme des racines.</li>\n</ul>"},
{"id": "fonctions-reference", "fiche": "<h3>📌 Les 4 fonctions de référence</h3>\n<p><b>Carré x² :</b> ℝ → [0 ; +∞[ ; parabole ; ↓ sur ]−∞;0], ↑ sur [0;+∞[ ; min 0 ; toujours ≥ 0.</p>\n<p><b>Cube x³ :</b> ℝ → ℝ ; croissante PARTOUT ; signe de x ; symétrique par rapport à l'origine.</p>\n<p><b>Inverse 1/x :</b> ℝ∖{0} ; hyperbole à 2 branches ; ↓ sur chaque branche ; signe de x.</p>\n<p><b>Racine √x :</b> [0 ; +∞[ → [0 ; +∞[ ; croissante ; toujours ≥ 0.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>x² = a (a > 0) :</b> deux solutions √a et −√a.</li>\n<li><b>x² < a :</b> S = ]−√a ; √a[ (lecture sur la parabole).</li>\n<li><b>Ordre des inverses :</b> pour a, b > 0 : a < b ⟹ 1/a > 1/b (ordre renversé).</li>\n<li><b>Position √x vs x :</b> √x ≥ x sur [0;1], √x ≤ x sur [1;+∞[.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>x² = 16 : S = {−4 ; 4}, pas seulement 4.</li>\n<li>1/x n'est pas décroissante sur ℝ∖{0} : seulement sur CHAQUE intervalle.</li>\n<li>√(−9) n'existe pas dans ℝ.</li>\n<li>x² = −4 n'a aucune solution (un carré est ≥ 0).</li>\n</ul>"},
{"id": "variations-2de", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Image :</b> f(a), unique ; <b>antécédents de k :</b> solutions de f(x) = k : 0, 1, 2… possibles.</p>\n<p><b>Tableau de variations :</b> flèches ↗ (croît) / ↘ (décroît) ; valeurs aux extrémités = bornes atteintes.</p>\n<p><b>Extremum :</b> sommet d'une flèche ; minimum m en a : f(x) ≥ m pour tout x.</p>\n<p><b>Graphique :</b> f(x) = k ⟹ intersections avec la droite y = k ; f(x) &lt; k ⟹ portion sous la droite.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Antécédents :</b> résoudre f(x) = k (pas seulement « lire en k »).</li>\n<li><b>Maximum sur [a ; b] :</b> comparer les valeurs aux bornes et aux sommets des flèches.</li>\n<li><b>f(x) &lt; 0 :</b> portions de courbe sous l'axe des abscisses.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« L'image de 25 » vs « les antécédents de 25 » : sens inversés.</li>\n<li>f(x) = k peut avoir deux solutions ; une lecture graphique reste APPROCHÉE.</li>\n<li>f(x) ≥ 2 : intervalles en LUO (crochets inclus car égalité permise).</li>\n<li>Un extremum n'est atteint que si la valeur figure au bout d'une flèche du tableau.</li>\n</ul>"},
{"id": "vecteurs", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Vecteur AB→ = (x_B − x_A ; y_B − y_A)</b> ; direction + sens + norme.</p>\n<p><b>Norme :</b> ‖u→(x;y)‖ = √(x² + y²) (repère orthonormé).</p>\n<p><b>Chasles :</b> AB→ + BC→ = AC→ ; AB→ = −BA→.</p>\n<p><b>Colinéarité :</b> u→(x;y), v→(x′;y′) colinéaires ⟺ xy′ − x′y = 0.</p>\n<p><b>Milieu :</b> ((x_A+x_B)/2 ; (y_A+y_B)/2) ; <b>distance :</b> AB = √((Δx)² + (Δy)²).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Parallélogramme :</b> prouver AB→ = DC→ (attention à l'ordre : AB et DC, pas AD).</li>\n<li><b>Alignement de A, B, C :</b> tester la colinéarité de AB→ et AC→.</li>\n<li><b>Quadrilatère particulier :</b> d'abord parallélogramme, puis côtés égaux (losange) ou diagonales égales (rectangle).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>AB→ = arrivée − départ : (x_B − x_A), jamais l'inverse.</li>\n<li>La formule de distance ne vaut qu'en repère orthonormé.</li>\n<li>Colinéarité : xy′ − x′y = 0 (déterminant nul).</li>\n<li>AB→ = CD→ signifie ABDC parallélogramme (et non ABCD !).</li>\n</ul>"},
{"id": "stats-2de", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Moyenne :</b> Σx·n / N ; <b>médiane :</b> partage la série ordonnée en 50/50 (moyenne des 2 centrales si N pair).</p>\n<p><b>Quartiles :</b> Q1 (25 % en dessous), Q3 (75 %) ; <b>écart interquartile :</b> Q3 − Q1.</p>\n<p><b>Variance :</b> V = moyenne des (x − x̄)² ; <b>écart type :</b> σ = √V.</p>\n<p><b>Étendue :</b> max − min.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Médiane :</b> ordonner ; rang (N+1)/2 si N impair, moyenne des rangs N/2 et N/2 + 1 si pair.</li>\n<li><b>Q1/Q3 :</b> rangs ⌈N/4⌉ et ⌈3N/4⌉ sur la série ordonnée.</li>\n<li><b>Comparer deux séries :</b> même moyenne ? regarder alors σ : le plus petit = série plus homogène.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Ne jamais calculer médiane ou quartiles sans ordonner la série.</li>\n<li>Médiane d'une série paire : moyenne des DEUX valeurs centrales.</li>\n<li>σ = √V : ne pas confondre variance et écart type.</li>\n<li>Une valeur aberrante tire la moyenne mais laisse la médiane quasi intacte.</li>\n</ul>"},
{"id": "probas-2de", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Équiprobabilité :</b> P(A) = favorables / possibles.</p>\n<p><b>Bornes :</b> 0 ≤ P ≤ 1 ; P(Ω) = 1 ; P(∅) = 0.</p>\n<p><b>Contraire :</b> P(Ā) = 1 − P(A) (« au moins un » ⟹ passer par AUCUN).</p>\n<p><b>Réunion :</b> P(A ∪ B) = P(A) + P(B) − P(A ∩ B) ; si incompatibles : P(A) + P(B).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Tirage unique :</b> compter favorables et possibles, simplifier la fraction.</li>\n<li><b>« Ou »/« et » :</b> traduire en ∪ / ∩ avant de calculer.</li>\n<li><b>« Au moins un » :</b> calculer 1 − P(aucun).</li>\n<li><b>Deux tirages successifs :</b> arbre, produit le long des branches.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Diviser les comptes ne vaut qu'en équiprobabilité.</li>\n<li>Ne pas retrancher l'intersection dans P(A ∪ B) quand elle existe.</li>\n<li>P(bonne réponse) = 1/4 au QCM : équiprobabilité, pas 4 favorable !</li>\n<li>Un événement et son contraire couvrent tout : P(A) + P(Ā) = 1.</li>\n</ul>"},
{"id": "configurations-trigo", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>SOH-CAH-TOA :</b> sin = opposé/hypoténuse ; cos = adjacent/hypoténuse ; tan = opposé/adjacent.</p>\n<p><b>Valeurs clés :</b> sin30 = 1/2 ; cos60 = 1/2 ; sin45 = cos45 = √2/2 ; sin60 = cos30 = √3/2.</p>\n<p><b>Identité :</b> cos²(θ) + sin²(θ) = 1 ; −1 ≤ cos, sin ≤ 1.</p>\n<p><b>Demi-cercle :</b> triangle inscrit ⟹ rectangle (diamètre = hypoténuse).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Longueur inconnue :</b> identifier hypoténuse / opposé / adjacent, choisir sin ou cos, résoudre.</li>\n<li><b>Angle inconnu :</b> calculer le rapport, utiliser cos⁻¹ ou sin⁻¹ (calculatrice en degrés).</li>\n<li><b>sin par cos :</b> sin² = 1 − cos², racine positive si l'angle est aigu.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>sin prend le côté OPPOSÉ, cos le côté ADJACENT — toujours par rapport à l'angle choisi.</li>\n<li>Calculatrice en mode DEGRÉS.</li>\n<li>cos(θ) + sin(θ) ≠ 1 : c'est cos² + sin² = 1.</li>\n<li>L'hypoténuse est au dénominateur : un résultat > hypoténuse est impossible.</li>\n</ul>"},
{"id": "second-degre", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Formes :</b> développée ax²+bx+c ; canonique a(x−α)²+β ; factorisée a(x−x₁)(x−x₂).</p>\n<p><b>Δ = b² − 4ac</b> : Δ>0 ⟹ 2 racines (−b±√Δ)/2a ; Δ=0 ⟹ −b/2a ; Δ<0 ⟹ aucune racine réelle.</p>\n<p><b>Sommet :</b> S(−b/2a ; f(−b/2a)) — α = −b/2a.</p>\n<p><b>Somme/produit :</b> x₁+x₂ = −b/a ; x₁x₂ = c/a.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Résoudre ax²+bx+c = 0 :</b> calculer Δ, appliquer les formules, VÉRIFIER avec somme et produit.</li>\n<li><b>Signe :</b> a &gt; 0 : positif dehors, négatif dedans ; Δ ≤ 0 : signe de a partout.</li>\n<li><b>Inéquation stricte :</b> racines exclues (crochets ouverts).</li>\n<li><b>Factoriser :</b> a(x−x₁)(x−x₂) — ne pas oublier le facteur a !</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Δ = b² − 4ac : erreur de signe classique sur −4ac.</li>\n<li>2x² − 3x − 2 &gt; 0 : S = ]−∞ ; −1/2[ ∪ ]2 ; +∞[ — l'UNION, pas l'intervalle entre les racines.</li>\n<li>Le facteur a de la factorisation disparaît souvent à tort.</li>\n<li>x₁x₂ = c/a : si le produit ne colle pas, les racines sont fausses.</li>\n</ul>"},
{"id": "derivation-operations", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>(uv)′ = u′v + uv′</b> ; <b>(u/v)′ = (u′v − uv′)/v²</b> ; (1/v)′ = −v′/v² ; (ku)′ = ku′ ; (u+v)′ = u′+v′.</p>\n<p><b>Variations :</b> f′ &gt; 0 ⟹ f ↑ ; f′ &lt; 0 ⟹ f ↓ ; f′ change de signe en a ⟹ extremum.</p>\n<p><b>Tangente en a :</b> y = f′(a)(x − a) + f(a).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Dériver un produit :</b> identifier u et v, dériver séparément, appliquer u′v + uv′, développer/réduire.</li>\n<li><b>Étude de variations :</b> f′ factorisée → signe de f′ → tableau → valeurs de f aux points critiques.</li>\n<li><b>Audit :</b> pour un produit, redériver après développement : les deux résultats doivent coïncider.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>(uv)′ ≠ u′v′ : erreur no 1 du chapitre.</li>\n<li>(u/v)′ : numérateur u′v − uv′, ordre imposé ; dénominateur v².</li>\n<li>x³ en 0 : f′(0) = 0 mais pas d'extremum (pas de changement de signe).</li>\n<li>Un extremum exige f′(a) = 0 ET changement de signe.</li>\n</ul>"},
{"id": "suites", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Arithmétique :</b> u_{n+1} = u_n + r ; u_n = u_0 + nr ; somme = nb × (1er + dernier)/2.</p>\n<p><b>Géométrique :</b> u_{n+1} = q·u_n ; u_n = u_0·qⁿ ; somme = u_0·(q^{nb} − 1)/(q − 1).</p>\n<p><b>Tests :</b> différences constantes ⟹ arithmétique ; quotients constants ⟹ géométrique.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Identifier :</b> calculer u_{n+1} − u_n ou u_{n+1}/u_n sur deux-trois rangs.</li>\n<li><b>Terme général :</b> vérifier avec un terme connu (u_1 en général) avant d'extrapoler.</li>\n<li><b>Sommes :</b> compter les TERMES (de u_0 à u_n : n+1 termes !).</li>\n<li><b>Modéliser :</b> +k par an ⟹ arithmétique ; ×q par an (intérêts composés) ⟹ géométrique.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>De u_0 à u_10 : 11 termes, pas 10.</li>\n<li>u_n = u_0 + nr ; avec départ en u_1 : u_n = u_1 + (n−1)r.</li>\n<li>q = 0,5 : géométrique DÉCROISSANTE (0 &lt; q &lt; 1).</li>\n<li>Somme géométrique : (q^{nb} − 1)/(q − 1), l'exposant = nombre de TERMES.</li>\n</ul>"},
{"id": "probas-conditionnelles", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Conditionnelle :</b> P_B(A) = P(A ∩ B)/P(B) ; P(A ∩ B) = P(B)·P_B(A).</p>\n<p><b>Arbre :</b> produit sur le chemin, somme entre chemins ; branches d'un nœud : total 1.</p>\n<p><b>Indépendance :</b> P(A ∩ B) = P(A)·P(B) ⟺ P_B(A) = P(A).</p>\n<p><b>Probabilités totales :</b> P(A) = P(B)·P_B(A) + P(B̄)·P_B̄(A).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>« Sachant que B » :</b> nouvel univers B : tout est divisé par P(B).</li>\n<li><b>Arbre :</b> le remplir avec les données, calculer chaque chemin, sommer.</li>\n<li><b>Test d'indépendance :</b> comparer P(A∩B) à P(A)×P(B) — conclure par une phrase.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Indépendant ≠ incompatible : incompatibles ⟹ P(A∩B) = 0.</li>\n<li>P_B(A) = P(A∩B)/P(B) : c'est B au dénominateur (l'événement SACHANT).</li>\n<li>Tirage SANS remise : les probabilités du 2e tirage changent.</li>\n<li>Sur l'arbre : les 2e branches sont CONDITIONNELLES, pas absolues.</li>\n</ul>"},
{"id": "produit-scalaire", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>u→·v→ = ‖u→‖‖v→‖cos θ</b> = <b>xx′ + yy′</b> (repère orthonormé).</p>\n<p><b>Orthogonalité :</b> u→ ⊥ v→ ⟺ u→·v→ = 0.</p>\n<p><b>Norme :</b> ‖u→‖² = u→·u→.</p>\n<p><b>Al-Kashi :</b> a² = b² + c² − 2bc·cos(Â).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Rectangle en B ?</b> : calculer BA→·BC→ : nul ⟹ oui.</li>\n<li><b>Angle entre vecteurs :</b> cos θ = (u→·v→)/(‖u→‖‖v→‖), puis cos⁻¹.</li>\n<li><b>Longueur par Al-Kashi :</b> quand Pythagore est impossible (pas d'angle droit).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Le produit scalaire est un NOMBRE (positif, nul ou négatif).</li>\n<li>xx′ + yy′ : seulement en repère orthonormé.</li>\n<li>u→·v→ = 0 : orthogonalité, pas un vecteur nul.</li>\n<li>Al-Kashi : le signe MOINS de −2bc·cos(Â) disparaît souvent.</li>\n</ul>"},
{"id": "variables-aleatoires", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Loi de X :</b> tableau valeurs / probabilités ; Σp_i = 1.</p>\n<p><b>E(X) = Σ x_i·p_i</b> : moyenne attendue ; jeu favorable ⟺ E &gt; 0.</p>\n<p><b>V(X) = Σ p_i(x_i − E)²</b> ; <b>σ = √V</b>.</p>\n<p><b>Linéarité :</b> E(aX+b) = aE(X)+b ; V(aX+b) = a²V(X).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Établir une loi :</b> lister les issues, compter les valeurs de X, vérifier Σp = 1.</li>\n<li><b>Jeu :</b> travailler en gains NETS (mise déduite), calculer E, conclure par une phrase.</li>\n<li><b>Comparaison de jeux :</b> même E ? comparer alors σ : le plus petit = le moins risqué.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Une loi dont les probabilités ne totalisent pas 1 est fausse.</li>\n<li>E(X) peut ne correspondre à AUCUNE valeur possible de X.</li>\n<li>Gain net = gain brut − mise : toujours préciser lequel on utilise.</li>\n<li>V(2X + 3) = 4V(X) : a au carré, b éliminé.</li>\n</ul>"},
{"id": "suites-term", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Récurrence :</b> initialisation + hérédité + conclusion.</p>\n<p><b>Convergence monotone :</b> croissante et majorée ⟹ converge ; décroissante et minorée ⟹ converge.</p>\n<p><b>Gendarmes :</b> u_n ≤ v_n ≤ w_n, u_n, w_n → ℓ ⟹ v_n → ℓ.</p>\n<p><b>Références :</b> qⁿ → 0 si |q| &lt; 1 ; 1/n → 0 ; nᵏ ≪ aⁿ ≪ n! ≪ nⁿ.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Forme indéterminée ∞/∞ :</b> factoriser le terme de plus haut degré, simplifier.</li>\n<li><b>Avec (−1)ⁿ ou cos/sin :</b> encadrer puis gendarmes.</li>\n<li><b>Récurrence :</b> toujours tester la formule sur n = 0, 1, 2 AVANT de rédiger.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Croissante non majorée ⟹ +∞ ; croissante MAJORÉE ⟹ converge : ne pas confondre.</li>\n<li>Une suite alternée ((−1)ⁿ) n'a pas de limite, même bornée.</li>\n<li>Récurrence sans initialisation = démonstration incomplète (rédaction notée).</li>\n<li>(3n²+2n−1)/(n²+5) → 3/1 : rapport des coefficients dominants.</li>\n</ul>"},
