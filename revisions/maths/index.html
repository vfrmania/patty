    "cours": "<div class=\"cours-head\"><h2>Fonctions de référence : carré, cube, inverse, racine</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La fonction carré : x ↦ x²</h3>\n<ul>\n<li>Définie sur R ; toujours ≥ 0 ; parabole d'axe vertical, sommet à l'origine ;</li>\n<li>Décroissante sur ]−∞ ; 0], croissante sur [0 ; +∞[ : minimum 0 atteint en 0 ;</li>\n<li>Parité : (−x)² = x² : courbe <b>symétrique</b> par rapport à l'axe des ordonnées (fonction paire) ;</li>\n<li>Comportement : x² croît très vite : 10² = 100, 30² = 900 — la courbe se resserre sur l'axe vertical à grande échelle.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Parabole carree, inverse et racine\">\n  <line x1=\"215\" y1=\"150\" x2=\"215\" y2=\"10\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"20\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <path d=\"M 215 130 Q 260 130 300 80 Q 330 40 345 25\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <path d=\"M 215 130 Q 170 130 130 80 Q 100 40 85 25\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"355\" y=\"30\" font-size=\"12\" fill=\"#4f46e5\">x² (parabole)</text>\n  <path d=\"M 230 22 Q 280 90 405 122\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <path d=\"M 200 22 Q 150 90 25 122\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/>\n  <text x=\"270\" y=\"15\" font-size=\"12\" fill=\"#ef4444\">1/x (hyperbole)</text>\n  <path d=\"M 230 130 Q 240 80 300 40\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <text x=\"305\" y=\"45\" font-size=\"12\" fill=\"#16a34a\">√x</text>\n</svg><span class=\"fig-cap\">Trois fonctions de référence : parabole (paire, sur R), hyperbole (impaire, définie sur R*), racine (sur R+, croissante, « s'essouffle »).</span></div>\n\n<h3>2. La fonction inverse : x ↦ 1/x</h3>\n<ul>\n<li>Définie sur R* (jamais x = 0 : 1/0 n'existe pas) ;</li>\n<li>Hyperbole à deux branches, symétrique par rapport à l'<b>origine</b> (fonction impaire : 1/(−x) = −1/x) ;</li>\n<li>Décroissante sur ]−∞ ; 0[ ET sur ]0 ; +∞[ — mais jamais sur R* entier (interdit de le dire) ;</li>\n<li>Plus x est grand, plus 1/x est petit (vers 0) : la courbe s'approche des axes sans les toucher.</li>\n</ul>\n<table>\n<tr><th>x</th><th>−2</th><th>−1</th><th>−0,5</th><th>0</th><th>0,5</th><th>1</th><th>2</th><th>10</th></tr>\n<tr><td>1/x</td><td>−0,5</td><td>−1</td><td>−2</td><td>∥</td><td>2</td><td>1</td><td>0,5</td><td>0,1</td></tr>\n</table>\n<ul>\n<li>L'inversion échange l'ordre sur les positifs : si 0 &lt; a &lt; b, alors 1/a &gt; 1/b ;</li>\n<li>C'est la source de l'inégalité moyenne harmonique/arithmétique et des ponts de la 1re sur les limites.</li>\n</ul>\n\n<h3>3. La fonction racine et la fonction cube</h3>\n<ul>\n<li><b>Racine</b> : définie sur [0 ; +∞[, croissante, concave (« plafond de plus en plus bas ») ; √4 = 2, √2 ≈ 1,414 ;</li>\n<li><b>Cube</b> : définie sur R, impaire (courbe symétrique par rapport à l'origine), croissante sur R ;</li>\n<li>Nombres cachés : x³ = 8 → x = 2 ; x³ = −27 → x = −3 ; (−2)³ = −8 (signe conservé, contrairement au carré) ;</li>\n<li>Ordre de croissance à droite : pour x ≥ 1, √x ≤ x ≤ x² ≤ x³ : les exposants hauts gagnent la course.</li>\n</ul>\n\n<h3>4. Résolution d'équations et inéquations de référence</h3>\n<table>\n<tr><th>Équation</th><th>Solutions</th><th>Inéquation type</th><th>Ensemble de solutions</th></tr>\n<tr><td>x² = 9</td><td>x = ±3</td><td>x² &gt; 9</td><td>]−∞ ; −3[ ∪ ]3 ; +∞[</td></tr>\n<tr><td>x² = 5</td><td>x = ±√5</td><td>x² ≤ 5</td><td>[−√5 ; √5]</td></tr>\n<tr><td>1/x = 4</td><td>x = 1/4</td><td>1/x &lt; 4 (x&gt;0)</td><td>]1/4 ; +∞[</td></tr>\n<tr><td>√x = 3</td><td>x = 9</td><td>√x &gt; 2</td><td>]4 ; +∞[</td></tr>\n<tr><td>x³ = 8</td><td>x = 2</td><td>x³ &gt; 8</td><td>]2 ; +∞[</td></tr>\n</table>\n<ul>\n<li>Lecture graphique de x² &gt; 9 : la parabole est au-dessus de la droite y = 9 <b>en dehors</b> de [−3 ; 3] — le « dehors » du parabole est un réflexe ;</li>\n<li>√x = 3 se résout en élevant au carré : x = 9 — vérifier que la solution respecte le domaine (x ≥ 0) ;</li>\n<li>1/x = 4 se résout en inversant (x = 1/4) : l'inverse de l'inverse redonne x.</li>\n</ul>\n\n<h3>5. Comparer, encadrer, appliquer</h3>\n<ul>\n<li>Positions relatives : sur [0 ; 1], x² ≤ x ≤ √x (élever au carré un nombre inférieur à 1 le rapetisse) ; sur [1 ; +∞[, l'ordre s'inverse ;</li>\n<li>Encadrement : 1,4 &lt; √2 &lt; 1,5 car 1,96 &lt; 2 &lt; 2,25 — toujours encadrer par des carrés parfaits voisins ;</li>\n<li>Physique : aire d'un disque A(r) = πr² (fonction carré), période d'un pendule (racine de la longueur), dilution (inverse) ;</li>\n<li>Informatique : coût quadratique vs linéarité d'un algorithme — la fonction carré punit le désordre des données.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'encadrement piégé de √40</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> 1) Encadrer √40 entre deux entiers consécutifs. 2) Encadrer entre deux dixièmes. 3) Sans calculatrice, comparer √40 et 6,5.</div><div class=\"etu\"><b>Étape 1 — Entiers</b> : 36 &lt; 40 &lt; 49 → 6 &lt; √40 &lt; 7.</div><div class=\"etu\"><b>Étape 2 — Dixièmes</b> : 6,3² = 39,69 &lt; 40 et 6,4² = 40,96 &gt; 40 → 6,3 &lt; √40 &lt; 6,4.</div><div class=\"etu\"><b>Étape 3 — Comparaison</b> : 6,5² = 42,25 &gt; 40 → √40 &lt; 6,5 (la racine est croissante : comparer les carrés suffit).</div><div class=\"etu\"><b>Étape 4 — Généralisation</b> : la racine « écrase » les grands nombres (√(10⁶) = 10³) : c'est pour cela que les échelles Richter (logarithmiques) et les écarts-types utilisent des racines — comparer sans calculatrice est une compétence d'examen.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — traquer les solutions de x² = a</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre : 1) x² = 16 ; 2) x² = −9 ; 3) x² = 7 ; 4) (x − 2)² = 25 ; 5) x² = 3 puis donner une valeur approchée à 0,01 près.</div><div class=\"etu\"><b>Étape 1 — Cas a &gt; 0</b> : x² = 16 → x = 4 ou x = −4 ; x² = 7 → x = √7 ou x = −√7.</div><div class=\"etu\"><b>Étape 2 — Cas a &lt; 0</b> : x² = −9 : <b>aucune solution</b> — un carré n'est jamais négatif.</div><div class=\"etu\"><b>Étape 3 — Décalage</b> : (x−2)² = 25 → x − 2 = 5 ou x − 2 = −5 → x = 7 ou x = −3 : le raisonnement « ± » se décale avec la parenthèse.</div><div class=\"etu\"><b>Étape 4 — Approximation</b> : √3 : 1,7² = 2,89 &lt; 3 &lt; 3,24 = 1,8² → √3 ≈ 1,73 (car 1,73² = 2,9929). Toujours deux solutions symétriques pour a &gt; 0 — et jamais une seule : l'oubli du « −√a » est l'erreur la plus punie.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>x² = 9 → « x = 3 » : il manque −3 — deux solutions toujours (si a &gt; 0).</li>\n<li>√x = −2 a une solution : non — la racine est positive, aucune solution.</li>\n<li>1/x décroissante « sur R* » : faux — seulement sur chaque intervalle séparément.</li>\n<li>x² &gt; 9 → x &gt; 3 : la parabole est aussi au-dessus à gauche : x &lt; −3.</li>\n<li>Croire que x² ≥ x toujours : faux sur ]0 ; 1[ (0,5² = 0,25 &lt; 0,5) — tester les petits nombres.</li>\n</ul>\n</div>\n\n<h3>6. Fonctions de référence et transformations</h3>\n<ul>\n<li>Translation verticale : g(x) = x² + 3 : la parabole monte de 3 (sommet en (0 ; 3)) ;</li>\n<li>Translation horizontale : h(x) = (x − 2)² : la parabole glisse à droite de 2 (sommet (2 ; 0)) ;</li>\n<li>Le signe dans la parenthèse est <b>inversé</b> : (x − 2)² décale vers les x positifs — piège classique ;</li>\n<li>Combinaison : k(x) = (x − 2)² + 3 : sommet (2 ; 3) : les deux translations se composent.</li>\n</ul>\n<table>\n<tr><th>Fonction</th><th>Courbe de référence</th><th>Transformation</th><th>Point remarquable</th></tr>\n<tr><td>x² + 3</td><td>parabole</td><td>+3 vertical</td><td>sommet (0 ; 3)</td></tr>\n<tr><td>(x − 2)²</td><td>parabole</td><td>+2 horizontal</td><td>sommet (2 ; 0)</td></tr>\n<tr><td>1/x + 2</td><td>hyperbole</td><td>+2 vertical</td><td>asymptote y = 2</td></tr>\n<tr><td>√(x + 1)</td><td>racine</td><td>−1 horizontal</td><td>départ en (−1 ; 0)</td></tr>\n</table>\n<ul>\n<li>Les fonctions de référence sont des <b>briques</b> : comprendre x², c'est comprendre toute la famille (x − a)² + b ;</li>\n<li>Ce vocabulaire de translation prépare la forme canonique du second degré de 1re.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — comparer 1/√2 et √2/2 : le grand classique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> 1) Montrer que 1/√2 = √2/2. 2) Sans calculatrice, ranger √0,5 ; 7/10 ; 0,8. 3) Pourquoi cette égalité sert-elle en trigonométrie ?</div><div class=\"etu\"><b>Étape 1 — Rendre rationnel</b> : 1/√2 = √2/(√2·√2) = √2/2 ≈ 0,707 : multiplier haut et bas par √2.</div><div class=\"etu\"><b>Étape 2 — Comparer</b> : √0,5 = √(1/2) = 1/√2 = √2/2 ; 7/10 = 0,7 ; 0,8 = 4/5. Or (0,7)² = 0,49 &lt; 0,5 &lt; 0,64 = (0,8)² → 0,7 &lt; √0,5 &lt; 0,8.</div><div class=\"etu\"><b>Étape 3 — Conclusion</b> : 0,7 &lt; √0,5 = √2/2 &lt; 0,8 : la racine s'insère entre deux décimaux par ses carrés.</div><div class=\"etu\"><b>Étape 4 — Lien trigo</b> : cos(45°) = √2/2 = 1/√2 : les deux écritures coexistent ; la forme « racine au dénominateur » gêne les calculs, la forme √2/2 s'additionne facilement — d'où le réflexe de rendre rationnel tout dénominateur irrationnel.</div></div></details>"

    "cours": "<div class=\"cours-head\"><h2>Fonctions : variations, extremums, lectures graphiques</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Vocabulaire des variations</h3>\n<ul>\n<li>f est <b>croissante</b> sur I si pour tous a &lt; b dans I, f(a) ≤ f(b) : la courbe monte (ou reste plate) ;</li>\n<li>f est <b>décroissante</b> si a &lt; b ⟹ f(a) ≥ f(b) : la courbe descend ;</li>\n<li>Le <b>tableau de variations</b> résume le sens de variation : flèches ↗ et ↘, bornes de l'intervalle en haut, images aux extrémités ;</li>\n<li>Un <b>maximum</b> local en x₀ : f(x₀) ≥ f(x) pour x proche de x₀ ; global : pour tout x de l'ensemble de définition.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Courbe avec minimum et maximum locaux\">\n  <line x1=\"30\" y1=\"140\" x2=\"410\" y2=\"140\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"30\" y1=\"140\" x2=\"30\" y2=\"15\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <path d=\"M 40 50 C 100 50 110 120 160 120 C 210 120 210 60 270 45 C 320 35 340 80 400 90\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <circle cx=\"160\" cy=\"120\" r=\"5\" fill=\"#16a34a\"/>\n  <text x=\"160\" y=\"138\" font-size=\"11\" fill=\"#16a34a\" text-anchor=\"middle\">minimum local</text>\n  <circle cx=\"268\" cy=\"45\" r=\"5\" fill=\"#ef4444\"/>\n  <text x=\"268\" y=\"35\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\">maximum local</text>\n  <text x=\"70\" y=\"40\" font-size=\"11\" fill=\"#4f46e5\">↘ décroissante</text>\n  <text x=\"185\" y=\"80\" font-size=\"11\" fill=\"#4f46e5\">↗ croissante</text>\n  <text x=\"330\" y=\"70\" font-size=\"11\" fill=\"#4f46e5\">↘</text>\n</svg><span class=\"fig-cap\">Lecture d'une courbe : descente, creux (minimum local), montée, bosse (maximum local), redescente — chaque virage est un extremum.</span></div>\n\n<h3>2. Construire un tableau de variations</h3>\n<table>\n<tr><th>x</th><th>−∞ ... ... ... ... 2</th><th>2 ... ... ... ... 5</th><th>5 ... +∞</th></tr>\n<tr><td>f</td><td>3 ↘ ... ... −1</td><td>−1 ↗ ... ... 4</td><td>4 ↘ ... ...</td></tr>\n</table>\n<ul>\n<li>Convention : les valeurs de la ligne x sont <b>croissantes</b> de gauche à droite ; les images aux angles des flèches ;</li>\n<li>Ce tableau se lit : f décroît de f = 3 (en −∞) à f = −1 atteint en x = 2, puis croît jusqu'à 4 en x = 5, puis décroît ;</li>\n<li>Le minimum <b>global</b> sur R : −1 (en x = 2) ; le maximum global : 4 (en x = 5) — s'ils existent ;</li>\n<li>Antécédents par lecture : f(x) = 0 possède 3 solutions (une par branche qui traverse 0) : à vérifier sur la courbe.</li>\n</ul>\n\n<h3>3. Images, antécédents, résolution graphique</h3>\n<ul>\n<li>Équation f(x) = k : les solutions sont les abscisses des points d'intersection de la courbe avec la droite horizontale y = k ;</li>\n<li>Inéquation f(x) ≤ k : on garde les intervalles de x où la courbe est <b>sous</b> la droite ;</li>\n<li>Équation f(x) = g(x) : abscisses des points d'intersection des deux courbes ;</li>\n<li>Position relative : comparer f et g sur un intervalle = lire quelle courbe est au-dessus.</li>\n</ul>\n<table>\n<tr><th>Question</th><th>Lecture graphique</th><th>Exemple sur le tableau ci-dessus</th></tr>\n<tr><td>image de 2</td><td>hauteur de la courbe en 2</td><td>−1</td></tr>\n<tr><td>antécédents de 4</td><td>intersections avec y = 4</td><td>x = 5 (et un point à gauche)</td></tr>\n<tr><td>solutions de f(x) ≥ −1</td><td>portions au-dessus de y = −1</td><td>[2 ; +∞[ environ</td></tr>\n<tr><td>extremums</td><td>sommets des flèches</td><td>min −1 (x=2), max 4 (x=5)</td></tr>\n</table>\n\n<h3>4. Fonctions affines et taux de variation</h3>\n<div class=\"tip\"><b>Critère algébrique</b> : f est croissante sur I si pour tous a &lt; b dans I, f(b) − f(a) ≥ 0. Pour une affine f(x) = mx + p : f(b) − f(a) = m(b − a), du signe de m : croissante si m &gt; 0, décroissante si m &lt; 0. Le taux (f(b) − f(a))/(b − a) = m est <b>constant</b> — c'est la signature de la droite.</div>\n<ul>\n<li>Exemple : f(x) = −2x + 7 : décroissante sur R (m = −2 &lt; 0), taux constant −2 ;</li>\n<li>Pour x² : taux entre 1 et 3 : (9 − 1)/2 = 4 ; entre 3 et 5 : (25 − 9)/2 = 8 — le taux <b>augmente</b> : accélération de la croissance, courbe de plus en plus pentue ;</li>\n<li>Ordre et variations : si f est croissante, a ≤ b ⟺ f(a) ≤ f(b) — l'ordre est <b>préservé</b> ; si décroissante, il est renversé (clef des inéquations) ;</li>\n<li>Composition d'ordre : soustraire 3 préserve l'ordre ; multiplier par −2 le renverse — d'où le retournement des inégalités.</li>\n</ul>\n\n<h3>5. Applications concrètes</h3>\n<ul>\n<li><b>Trajectoire</b> : hauteur d'un ballon h(t) = −5t² + 20t : maximum en t = 2 (sommet de parabole) : h(2) = 20 m ;</li>\n<li><b>Coût et recette</b> : bénéfice B(q) = R(q) − C(q) : le seuil de rentabilité est l'antécédent de 0 par B ;</li>\n<li><b>Températures</b> : maximum diurne = lecture du sommet de la courbe des relevés ;</li>\n<li><b>Optimisation</b> : maximiser une aire sous contrainte = chercher l'extremum d'une fonction — le geste central de l'année de 1re avec la dérivée.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'enclos du fermier, maximiser une aire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un fermier dispose de 40 m de clôture pour un enclos rectangulaire adossé à une rivière (pas de clôture côté rivière). 1) Exprimer l'aire en fonction de la largeur x. 2) Dresser le tableau de variations pour x ∈ ]0 ; 20]. 3) Dimensions optimales ?</div><div class=\"etu\"><b>Étape 1 — Modéliser</b> : deux largeurs et une longueur : 2x + L = 40 → L = 40 − 2x ; A(x) = x(40 − 2x) = −2x² + 40x.</div><div class=\"etu\"><b>Étape 2 — Variations</b> : A(x) = −2(x² − 20x) = −2(x − 10)² + 200 : forme canonique, sommet en x = 10 : croissante sur ]0 ; 10], décroissante sur [10 ; 20].</div><div class=\"etu\"><b>Étape 3 — Optimum</b> : maximum A(10) = 200 m² pour l'enclos 10 m × 20 m.</div><div class=\"etu\"><b>Étape 4 — Interprétation</b> : proche du mur (x → 0) ou très étroit (x → 20), l'aire s'annule : l'optimum est un <b>compromis</b> au sommet de la parabole. Toute optimisation de 2de est un problème de sommet de parabole : la forme canonique est l'outil de la victoire.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — intersections d'une courbe et d'une droite</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit f(x) = x² − 2x − 3 et g(x) = x + 1. 1) Résoudre f(x) = g(x). 2) En déduire les positions relatives des courbes. 3) Résoudre f(x) &gt; g(x).</div><div class=\"etu\"><b>Étape 1 — Égaliser</b> : x² − 2x − 3 = x + 1 → x² − 3x − 4 = 0 → (x − 4)(x + 1) = 0 → x = 4 ou x = −1.</div><div class=\"etu\"><b>Étape 2 — Factoriser la différence</b> : f(x) − g(x) = x² − 3x − 4 = (x − 4)(x + 1) : négatif entre −1 et 4, positif dehors.</div><div class=\"etu\"><b>Étape 3 — Positions</b> : f au-dessus de g sur ]−∞ ; −1[ ∪ ]4 ; +∞[ ; en dessous sur ]−1 ; 4[ ; croisements en x = −1 et x = 4.</div><div class=\"etu\"><b>Étape 4 — Résolution de l'inéquation</b> : f &gt; g ⟺ (x−4)(x+1) &gt; 0 → S = ]−∞ ; −1[ ∪ ]4 ; +∞[. Le tableau de signes et la lecture graphique racontent <b>la même histoire</b> : l'algèbre confirme l'œil.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre maximum local et global : le plus haut sommet « visible » n'est pas forcément le record absolu.</li>\n<li>Lire un antécédent au lieu d'une image : image = lecture verticale, antécédent = horizontale.</li>\n<li>Tableau non ordonné : la ligne x doit croître strictement de gauche à droite.</li>\n<li>Croire qu'une fonction décroissante traverse partout l'axe : elle peut rester positive (ex. 1/x sur ]0 ; +∞[).</li>\n<li>Diviser une inégalité par x sans discuter son signe : règle de 2de stricte.</li>\n</ul>\n</div>\n\n<h3>6. Comparer algébriquement : la méthode de la différence</h3>\n<div class=\"tip\"><b>Méthode</b> : pour comparer f(a) et f(b), étudier le signe de f(b) − f(a). Si ≥ 0 pour a &lt; b : f est croissante. La différence factorisée révèle le signe — c'est la version « preuve » de la lecture graphique.</div>\n<ul>\n<li>Exemple sur x² : f(b) − f(a) = b² − a² = (b − a)(b + a) : pour 0 ≤ a &lt; b, les deux facteurs sont positifs → f croissante sur [0 ; +∞[ : <b>preuve</b> en deux lignes ;</li>\n<li>Sur ]−∞ ; 0] : b + a &lt; 0 → différence négative → décroissante : le tableau de la fonction carré est maintenant <b>démontré</b> ;</li>\n<li>Exemple sur 1/x : 1/b − 1/a = (a − b)/(ab) : sur ]0 ; +∞[, ab &gt; 0 et a − b &lt; 0 : différence négative : décroissante — la preuve exige de connaître le signe du dénominateur ;</li>\n<li>Forme canonique et extremum : −2(x − 10)² + 200 ≤ 200 pour tout x : le maximum 200 est <b>prouvé</b> par le signe du carré.</li>\n</ul>\n<table>\n<tr><th>Fonction</th><th>Différence factorisée</th><th>Signe sur l'intervalle</th><th>Conclusion</th></tr>\n<tr><td>x² sur [0 ; +∞[</td><td>(b−a)(b+a)</td><td>+ (+)</td><td>croissante</td></tr>\n<tr><td>x² sur ]−∞ ; 0]</td><td>(b−a)(b+a)</td><td>+ (−)</td><td>décroissante</td></tr>\n<tr><td>1/x sur ]0 ; +∞[</td><td>(a−b)/(ab)</td><td>−</td><td>décroissante</td></tr>\n<tr><td>√x sur [0 ; +∞[</td><td>(b−a)/(√b+√a)</td><td>+</td><td>croissante</td></tr>\n</table>\n<ul>\n<li>La ligne racine utilise l'identité b − a = (√b − √a)(√b + √a) : mise en forme élégante, signe évident ;</li>\n<li>Ces preuves de 2de sont les ancêtres directs du sens de variation par dérivée de 1re.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — lire un tableau, résoudre sans courbe</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une fonction g est définie sur [−3 ; 6], impaire, avec le tableau suivant sur [0 ; 6] : x : 0 → 2 ↗ 5, 2 → 4 ↘ 1, 4 → 6 ↗ 7. 1) Compléter sur [−3 ; 0]. 2) Quel est le maximum global sur [−3 ; 6] ? 3) Combien de solutions a g(x) = 3 ?</div><div class=\"etu\"><b>Étape 1 — Imparité</b> : g(−x) = −g(x) : sur [−6 ; 0], les variations s'inversent et les valeurs s'opposent : 0 → −2 ↘ −5, −2 → −4 ↗ −1, −4 → −6 ↘ −7 (sur la partie définie).</div><div class=\"etu\"><b>Étape 2 — Maximum global</b> : sur [0 ; 6], max = 5 ; sur [−3 ; 0], valeurs ≤ 0 : maximum global <b>5</b> (en x = 2), minimum −5 (en x = −2).</div><div class=\"etu\"><b>Étape 3 — Compter les solutions</b> : g(x) = 3 : une sur chaque branche montante qui dépasse 3 : sur [0 ; 2] (0 → 5) et sur [4 ; 6] (1 → 7) : deux solutions positives ; par imparité, g(x) = −3 en a aussi deux : <b>quatre solutions</b> au total.</div><div class=\"etu\"><b>Étape 4 — Leçon</b> : l'imparité <b>double</b> l'information : connaître la moitié droite suffit. Le tableau remplace la courbe — l'exercice type du chapitre.</div></div></details>"

    "theme": "Vecteurs et repérage (2de)",
    "niveau": "2de",
    "titre": "Vecteurs et géométrie repérée",
    "cours": "<div class=\"cours-head\"><h2>Vecteurs et géométrie repérée</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le vecteur : une translation fléchée</h3>\n<ul>\n<li>Un <b>vecteur</b> AB→ est défini par sa <b>direction</b>, son <b>sens</b> et sa <b>norme</b> (longueur) — trois attributs indépendants ;</li>\n<li>Représenter la translation de A vers B : c'est la flèche ;</li>\n<li>Deux vecteurs sont <b>égaux</b> s'ils ont les trois attributs identiques : AB→ = CD→ si ABDC est un parallélogramme (AB ∥ CD, mêmes longueur et sens) ;</li>\n<li>Vecteur opposé : BA→ = −AB→ (même direction et norme, sens contraire).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Egalite de vecteurs et somme Chasles\">\n  <defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#1e293b\"/></marker></defs>\n  <line x1=\"40\" y1=\"110\" x2=\"140\" y2=\"60\" stroke=\"#4f46e5\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n  <text x=\"35\" y=\"120\" font-size=\"12\" fill=\"#1e293b\">A</text><text x=\"145\" y=\"55\" font-size=\"12\" fill=\"#1e293b\">B</text>\n  <line x1=\"180\" y1=\"110\" x2=\"280\" y2=\"60\" stroke=\"#4f46e5\" stroke-width=\"2.5\" stroke-dasharray=\"5,3\" marker-end=\"url(#ar)\"/>\n  <text x=\"175\" y=\"120\" font-size=\"12\" fill=\"#1e293b\">C</text><text x=\"285\" y=\"55\" font-size=\"12\" fill=\"#1e293b\">D</text>\n  <text x=\"95\" y=\"135\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\">AB→ = CD→ (translation)</text>\n  <line x1=\"40\" y1=\"45\" x2=\"110\" y2=\"45\" stroke=\"#16a34a\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n  <line x1=\"110\" y1=\"45\" x2=\"150\" y2=\"80\" stroke=\"#f59e0b\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n  <line x1=\"40\" y1=\"45\" x2=\"150\" y2=\"80\" stroke=\"#ef4444\" stroke-width=\"2\" stroke-dasharray=\"6,3\" marker-end=\"url(#ar)\"/>\n  <text x=\"230\" y=\"25\" font-size=\"12\" fill=\"#1e293b\">u→ + v→ : le vert puis l'orange = le rouge</text>\n</svg><span class=\"fig-cap\">À gauche : égalité de vecteurs (translation qui envoie A sur B et C sur D). À droite : somme de vecteurs — le chemin en deux étapes égale la flèche directe.</span></div>\n\n<h3>2. Relation de Chasles et somme</h3>\n<div class=\"tip\"><b>Chasles</b> : AB→ + BC→ = AC→ (le détour par B ne change pas le point d'arrivée). <b>Somme</b> : u→ + v→ se construit en mettant bout à bout les flèches (ou par le parallélogramme si même origine). <b>Règle du parallélogramme</b> : AB→ + AD→ = AC→ où ABCD est un parallélogramme.</div>\n<ul>\n<li>Chasles « à rebours » : AC→ = AB→ + BC→ découpe n'importe quel trajet en étapes ;</li>\n<li>Milieu : M milieu de [AB] ⟺ MA→ + MB→ = 0→ (isobarycentre) ;</li>\n<li>La somme est commutative : u→ + v→ = v→ + u→ — le parallélogramme le montre ;</li>\n<li>Colinéarité et alignement : A, B, C alignés ⟺ AB→ et AC→ colinéaires (l'un est k fois l'autre).</li>\n</ul>\n\n<h3>3. Coordonnées : calculer en repère</h3>\n<ul>\n<li>Si A(x_A ; y_A) et B(x_B ; y_B) : <b>AB→ (x_B − x_A ; y_B − y_A)</b> — arriver moins départ ;</li>\n<li>Somme : (x ; y) + (x′ ; y′) = (x + x′ ; y + y′) ; produit k·u→ = (kx ; ky) ;</li>\n<li>Norme : ‖u→‖ = √(x² + y²) — Pythagore en coordonnées ;</li>\n<li>Milieu : M((x_A + x_B)/2 ; (y_A + y_B)/2) ; distance AB = √((x_B−x_A)² + (y_B−y_A)²).</li>\n</ul>\n<table>\n<tr><th>Calcul</th><th>Données</th><th>Résultat</th></tr>\n<tr><td>coordonnées de AB→</td><td>A(1 ; 2), B(4 ; 6)</td><td>(3 ; 4)</td></tr>\n<tr><td>norme de AB→</td><td>(3 ; 4)</td><td>√(9+16) = 5</td></tr>\n<tr><td>2u→ − v→</td><td>u→(1 ; −1), v→(2 ; 3)</td><td>(0 ; −5)</td></tr>\n<tr><td>milieu de [AB]</td><td>A(1 ; 2), B(4 ; 6)</td><td>(2,5 ; 4)</td></tr>\n<tr><td>AB→ colinéaire à CD→ ?</td><td>AB→(2 ; 3), CD→(4 ; 6)</td><td>oui : CD→ = 2·AB→ (xy′ − yx′ = 0)</td></tr>\n</table>\n<ul>\n<li>Critère de colinéarité : u→(x ; y) et v→(x′ ; y′) colinéaires ⟺ <b>xy′ − yx′ = 0</b> (determinant nul) ;</li>\n<li>Exemple : (2 ; 3) et (4 ; 6) : 2×6 − 3×4 = 0 → colinéaires ; (1 ; 2) et (1 ; 3) : 3 − 2 = 1 ≠ 0 → non ;</li>\n<li>Le déterminant xy′ − yx′ est l'outil d'alignement : trois points alignés ssi deux vecteurs associés sont colinéaires.</li>\n</ul>\n\n<h3>4. Applications du repère : alignements et parallélismes</h3>\n<ul>\n<li><b>Alignement</b> : A(1 ; 1), B(3 ; 4), C(5 ; 7) : AB→(2 ; 3), AC→(4 ; 6) : déterminant 2×6 − 3×4 = 0 : alignés ;</li>\n<li><b>Parallélisme</b> : (AB) ∥ (CD) ⟺ AB→ colinéaire à CD→ ;</li>\n<li><b>Parallélogramme</b> : ABCD parallélogramme ⟺ AB→ = DC→ (attention à l'ordre des lettres) ;</li>\n<li><b>Appartenance</b> : M ∈ (AB) ssi AM→ = k·AB→ pour un certain k : résoudre deux petites équations.</li>\n</ul>\n\n<h3>5. Vecteurs et physique : forces et vitesses</h3>\n<ul>\n<li>Une force est un vecteur : direction, sens, intensité (en newtons) — la somme des forces est la somme vectorielle ;</li>\n<li>Équilibre : un objet immobile ⟺ somme des forces = vecteur nul (la résultante s'annule) ;</li>\n<li>Navigation : vitesse du bateau + vitesse du courant = vitesse réelle (triangle des vitesses) ;</li>\n<li>Le vent de face ralentit le coureur : sa vitesse est vectorielle, pas seulement un nombre.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — ABCD est-il un parallélogramme ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> A(−1 ; 0), B(2 ; 1), C(4 ; 4), D(1 ; 3). 1) Calculer AB→ et DC→. 2) Conclure. 3) Que dire de AC→ et BD→ ?</div><div class=\"etu\"><b>Étape 1 — Coordonnées</b> : AB→ = (2−(−1) ; 1−0) = (3 ; 1) ; DC→ = (4−1 ; 4−3) = (3 ; 1).</div><div class=\"etu\"><b>Étape 2 — Conclusion</b> : AB→ = DC→ : ABCD est un <b>parallélogramme</b> (côtés opposés égaux et parallèles).</div><div class=\"etu\"><b>Étape 3 — Diagonales</b> : AC→ = (5 ; 4) et BD→ = (1−2 ; 3−1) = (−1 ; 2) : vérifier le milieu commun des diagonales : milieu [AC] = (1,5 ; 2) = milieu [BD] : les diagonales se coupent en leur milieu — seconde preuve du parallélogramme.</div><div class=\"etu\"><b>Étape 4 — Deux critères équivalents</b> : AB→ = DC→ (côtés) ou diagonales de même milieu — deux regards sur la même figure ; savoir alterner les critères selon les données de l'énoncé.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le point qui aligne tout</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> A(1 ; 2), B(4 ; 6). Trouver le point M de la droite (AB) d'abscisse 10. Puis : le point K tel que AK→ = 3·AB→.</div><div class=\"etu\"><b>Étape 1 — Vecteur directeur</b> : AB→ = (3 ; 4) : chaque pas sur (AB) ajoute (3 ; 4).</div><div class=\"etu\"><b>Étape 2 — M d'abscisse 10</b> : AM→ = k·AB→ → (10−1 ; y−2) = (3k ; 4k) → 3k = 9 → k = 3 → y = 2 + 12 = 14 : M(10 ; 14).</div><div class=\"etu\"><b>Étape 3 — Point K</b> : AK→ = 3·AB→ = (9 ; 12) → K(1+9 ; 2+12) = (10 ; 14) : même point que M — cohérence totale.</div><div class=\"etu\"><b>Étape 4 — Paramétrage</b> : tout point de (AB) s'écrit (1 + 3k ; 2 + 4k), k ∈ R : la droite est une « ligne de production » de points, pilotée par un seul paramètre k — le brouillon de l'équation paramétrique de 1re.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>AB→ = (x_A − x_B ; ...) : inverser départ et arrivée — c'est l'inverse (arrivée − départ).</li>\n<li>Parallélogramme : écrire AB→ = CD→ au lieu de AB→ = DC→ (les lettres tournent dans le même sens).</li>\n<li>Déterminant xy′ − yx′ inversé : le résultat change de signe — le test « = 0 » reste heureusement valable.</li>\n<li>Confondre norme (nombre ≥ 0) et vecteur (objet à trois attributs).</li>\n<li>Croire que deux vecteurs de même norme sont égaux : il faut AUSSI même direction et même sens.</li>\n</ul>\n</div>\n\n<h3>6. Vecteurs et repérage : distances et figures classiques</h3>\n<ul>\n<li><b>Distance</b> : AB = √((x_B − x_A)² + (y_B − y_A)²) : A(1 ; 2), B(4 ; 6) : AB = √(9 + 16) = 5 ;</li>\n<li><b>Triangle rectangle ?</b> : calculer les trois côtés et vérifier Pythagore : la plus belle application du repère ;</li>\n<li><b>Quadrilatère particulier</b> : vérifier un losange = parallélogramme + diagonales perpendiculaires (produit scalaire nul, en 1re) ou quatre côtés égaux ;</li>\n<li><b>Cercle</b> : M(x ; y) ∈ cercle de centre A(a ; b), rayon r ⟺ (x − a)² + (y − b)² = r² : équation de cercle.</li>\n</ul>\n<table>\n<tr><th>Objet</th><th>Critère vectoriel/analytique</th><th>Exemple</th></tr>\n<tr><td>alignement A, B, C</td><td>det(AB→ ; AC→) = 0</td><td>AB→(2;3), AC→(4;6) : 0 ✓</td></tr>\n<tr><td>parallélogramme ABCD</td><td>AB→ = DC→</td><td>(3;1) = (3;1) ✓</td></tr>\n<tr><td>rectangle</td><td>parallélogramme + Pythagore sur les côtés</td><td>AB² + BC² = AC²</td></tr>\n<tr><td>losange</td><td>parallélogramme + AB = BC</td><td>deux normes égales</td></tr>\n<tr><td>cercle de centre A rayon r</td><td>AM = r</td><td>(x−a)² + (y−b)² = r²</td></tr>\n</table>\n<ul>\n<li>Le repère transforme la géométrie en <b>calcul</b> : plus de figure à tracer, des coordonnées à vérifier ;</li>\n<li>Méthode générale : traduire l'hypothèse en vecteurs, calculer, conclure — puis vérifier la plausibilité sur un croquis.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la traversée du fleuve</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un nageur vise le point B directement en face, à 60 m. Il nage à 1,5 m/s perpendiculairement au courant, qui porte à 2 m/s. 1) Vecteur vitesse réelle ? 2) Où arrive-t-il après la traversée ? 3) Que viser pour arriver en B ?</div><div class=\"etu\"><b>Étape 1 — Somme vectorielle</b> : v→ = (2 ; 1,5) (courant + nage) : vitesse réelle de norme √(4 + 2,25) = 2,5 m/s.</div><div class=\"etu\"><b>Étape 2 — Dérive</b> : traversée : 60/1,5 = 40 s ; dérive du courant : 2 × 40 = <b>80 m aval</b> — il ratera B de loin.</div><div class=\"etu\"><b>Étape 3 — Compensation</b> : pour arriver en B, la composante longitudinale de sa nage doit annuler le courant : nager en biais vers l'amont à 2 m/s de composante : le vecteur nage doit avoir une norme ≥ 2 m/s... ici impossible exactement (1,5 &lt; 2) : il subira toujours une dérive résiduelle.</div><div class=\"etu\"><b>Étape 4 — Modèle général</b> : la vitesse réelle est la SOMME des vitesses, pas leur moyenne : direction ∝ vecteur somme. Les problèmes de courant, de vent et de marée sont des additions de vecteurs — la géométrie repérée devient navigation.</div></div></details>"

    "cours": "<div class=\"cours-head\"><h2>Statistiques descriptives : quartiles, écart type</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Rappels et indicateurs de position</h3>\n<ul>\n<li><b>Moyenne</b> : x̄ = Σnᵢxᵢ/N (pondérée par les effectifs) — centre de gravité de la série ;</li>\n<li><b>Médiane</b> Me : valeur qui partage la série ordonnée en deux moitiés — position, pas moyenne ;</li>\n<li>La moyenne est <b>sensible aux valeurs extrêmes</b>, la médiane non : choisir selon la question posée ;</li>\n<li>Exemple : {1 ; 2 ; 3 ; 98} : moyenne 26, médiane 2,5 : deux indicateurs, deux histoires.</li>\n</ul>\n\n<h3>2. Quartiles et diagramme en boîte</h3>\n<div class=\"tip\"><b>Quartiles</b> : Q1 = plus petite valeur telle qu'au moins 25 % des données lui soient inférieures ; Q3 : au moins 75 %. <b>Écart interquartile</b> : Q3 − Q1 : largeur de la boîte centrale. Le <b>diagramme en boîte</b> (boxplot) résume : min, Q1, Me, Q3, max.</div>\n<ul>\n<li>Série de 8 valeurs ordonnées : Q1 ≈ 2e valeur, Me = moyenne des 4e et 5e, Q3 ≈ 7e (conventions du lycée) ;</li>\n<li>La boîte [Q1 ; Q3] contient la <b>moitié centrale</b> des données ; les moustaches vont jusqu'aux extrêmes ;</li>\n<li>Deux boxplots superposés comparent deux distributions d'un coup d'œil : positions et dispersions.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Deux boxplots compares\">\n  <line x1=\"30\" y1=\"135\" x2=\"410\" y2=\"135\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"35\" y=\"130\" font-size=\"10\" fill=\"#64748b\">0</text><text x=\"95\" y=\"130\" font-size=\"10\" fill=\"#64748b\">5</text><text x=\"155\" y=\"130\" font-size=\"10\" fill=\"#64748b\">10</text><text x=\"215\" y=\"130\" font-size=\"10\" fill=\"#64748b\">15</text><text x=\"275\" y=\"130\" font-size=\"10\" fill=\"#64748b\">20</text>\n  <line x1=\"50\" y1=\"55\" x2=\"180\" y2=\"55\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <rect x=\"80\" y=\"40\" width=\"80\" height=\"30\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"40\" x2=\"120\" y2=\"70\" stroke=\"#ef4444\" stroke-width=\"2.5\"/>\n  <line x1=\"50\" y1=\"40\" x2=\"50\" y2=\"70\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"180\" y1=\"40\" x2=\"180\" y2=\"70\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <text x=\"60\" y=\"30\" font-size=\"11\" fill=\"#4f46e5\">classe A (serrée)</text>\n  <line x1=\"100\" y1=\"105\" x2=\"330\" y2=\"105\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <rect x=\"150\" y=\"90\" width=\"130\" height=\"30\" fill=\"#ecfdf5\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <line x1=\"205\" y1=\"90\" x2=\"205\" y2=\"120\" stroke=\"#ef4444\" stroke-width=\"2.5\"/>\n  <line x1=\"100\" y1=\"90\" x2=\"100\" y2=\"120\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <line x1=\"330\" y1=\"90\" x2=\"330\" y2=\"120\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <text x=\"230\" y=\"82\" font-size=\"11\" fill=\"#16a34a\">classe B (dispersée)</text>\n</svg><span class=\"fig-cap\">Deux classes : même médiane environ, mais la classe B est bien plus dispersée (boîte et moustaches larges) — le boxplot montre ce que la moyenne cache.</span></div>\n\n<h3>3. Variance et écart type : mesurer la dispersion</h3>\n<div class=\"tip\"><b>Variance</b> : V = (1/N) Σnᵢ(xᵢ − x̄)² — moyenne des carrés des écarts à la moyenne. <b>Écart type</b> : σ = √V, dans les mêmes unités que les données. Petit σ = valeurs groupées ; grand σ = valeurs éparpillées.</div>\n<ul>\n<li>Calcul pratique : V = (moyenne des carrés) − (carré de la moyenne) : V = x̄₂ − x̄², souvent plus rapide ;</li>\n<li>Exemple : série {2 ; 4 ; 6 ; 8} : x̄ = 5 ; écarts −3, −1, 1, 3 ; carrés 9, 1, 1, 9 : V = 20/4 = 5 ; σ = √5 ≈ 2,24 ;</li>\n<li>La série {4 ; 5 ; 5 ; 6} a même moyenne 5 mais σ ≈ 0,7 : dispersion dix fois plus faible ;</li>\n<li>Règle empirique (courbe en cloche) : environ 95 % des données dans [x̄ − 2σ ; x̄ + 2σ] — contrôle qualité industriel.</li>\n</ul>\n<table>\n<tr><th>Série</th><th>Moyenne</th><th>Écarts</th><th>Variance</th><th>σ</th></tr>\n<tr><td>2 ; 4 ; 6 ; 8</td><td>5</td><td>±3, ±1</td><td>5</td><td>≈2,24</td></tr>\n<tr><td>4 ; 5 ; 5 ; 6</td><td>5</td><td>±1, 0, 0</td><td>0,5</td><td>≈0,71</td></tr>\n<tr><td>1 ; 2 ; 3</td><td>2</td><td>±1, 0</td><td>2/3</td><td>≈0,82</td></tr>\n<tr><td>0 ; 10</td><td>5</td><td>±5</td><td>25</td><td>5</td></tr>\n</table>\n\n<h3>4. Linéarité : transformations de la série</h3>\n<ul>\n<li>Ajouter a à toutes les données : moyenne + a, <b>σ inchangé</b> (translation) ;</li>\n<li>Multiplier par k : moyenne × k, écart type <b>× |k|</b> (dilatation) ;</li>\n<li>Exemple : températures de °C en °F (F = 1,8C + 32) : moyenne et σ se transforment par la même relation ;</li>\n<li>Changement d'unité (cm → mm) : tout est ×10, la dispersion aussi — la variance est multipliée par k².</li>\n</ul>\n\n<h3>5. Séries groupées en classes : le compromis</h3>\n<ul>\n<li>Quand les données sont nombreuses, on regroupe en classes [a ; b[ et on calcule avec les <b>centres de classes</b> (a+b)/2 ;</li>\n<li>L'estimation de la moyenne est approchée : on perd la précision individuelle, on gagne la lisibilité ;</li>\n<li>Polygone des effectifs cumulés croissants : la médiane se lit à l'intersection avec la horizontale N/2 ;</li>\n<li>Interpolation linéaire dans la classe médiane : estimation fine entre deux bornes — méthode de référence.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — deux usines, un cahier des charges</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux machines produisent des vis de diamètre cible 10 mm. Machine A : moyenne 10,02, σ = 0,05. Machine B : moyenne 10,00, σ = 0,15. Le client accepte [9,9 ; 10,1]. Quelle machine livrer ?</div><div class=\"etu\"><b>Étape 1 — Critère de justesse</b> : B est parfaitement centrée (10,00) ; A dévie légèrement (+0,02).</div><div class=\"etu\"><b>Étape 2 — Critère de précision</b> : σ(A) = 0,05 &lt; 0,15 = σ(B) : A est trois fois plus régulière.</div><div class=\"etu\"><b>Étape 3 — Taux de conformité</b> : A : presque tout dans [10,02 − 2σ ; 10,02 + 2σ] = [9,92 ; 10,12] — l'essentiel dans la tolérance ; B : [9,7 ; 10,3] : beaucoup de pièces hors tolérance malgré le centrage.</div><div class=\"etu\"><b>Étape 4 — Décision</b> : livrer <b>A</b> : dans l'industrie, la dispersion (σ) tue plus que le biais (moyenne) : un réglage corrige la moyenne, mais seule la maintenance réduit σ. La statistique descriptive est un outil de décision industrielle.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — moyenne manquante d'un groupe fusionné</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Classe 1 : 28 élèves, moyenne 12,4. Classe 2 : 22 élèves, moyenne 13,1. 1) Moyenne du groupe fusionné ? 2) Quelle classe « tire » la moyenne ? 3) Un élève arrive en classe 1 avec 18 : nouvelle moyenne de la classe 1 ?</div><div class=\"etu\"><b>Étape 1 — Pondération</b> : m = (28×12,4 + 22×13,1)/50 = (347,2 + 288,2)/50 = 635,4/50 = <b>12,71</b>.</div><div class=\"etu\"><b>Étape 2 — Lecture</b> : 12,71 &gt; 12,4 : la classe 2, plus forte, tire le groupe vers le haut — mais le résultat reste plus proche de 12,4 car l'effectif 28 pèse plus lourd.</div><div class=\"etu\"><b>Étape 3 — Nouvel arrivant</b> : m′ = (347,2 + 18)/29 = 365,2/29 ≈ <b>12,59</b> : la moyenne monte de 0,19.</div><div class=\"etu\"><b>Étape 4 — Sensibilité</b> : un élève parmi 29 bouge la moyenne de 0,19 ; parmi 500 élèves, de 0,01 : plus l'effectif est grand, plus la moyenne est <b>rigide</b> — c'est pourquoi une note isolée ne change pas un bilan annuel, mais une classe fusionnée change tout un palier.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Moyenne des moyennes sans pondérer par les effectifs : faux dès que les groupes diffèrent.</li>\n<li>Confondre écart type (racine) et variance (carré) : les unités ne sont même pas les mêmes.</li>\n<li>σ inchangé par translation : vrai — mais σ × k par multiplication : ne pas confondre les deux transformations.</li>\n<li>Q1 = « valeur du milieu de la première moitié » : convention approximative — appliquer la définition du cours (au moins 25 %).</li>\n<li>Croire que Q3 − Q1 remplace σ : deux mesures de dispersion différentes, complémentaires.</li>\n</ul>\n</div>\n\n<h3>6. Comparer deux séries : le protocole complet</h3>\n<div class=\"tip\"><b>Méthode en trois temps</b> : 1) comparer les positions (moyennes/médianes) ; 2) comparer les dispersions (σ ou interquartile) ; 3) conclure en français, avec les chiffres à l'appui. Une comparaison sans indicateur de dispersion est une comparaison aveugle.</div>\n<ul>\n<li>Série A : 11 ; 12 ; 12 ; 13 ; 12 (moyenne 12, σ ≈ 0,63) ; série B : 8 ; 12 ; 16 ; 10 ; 14 (moyenne 12, σ ≈ 2,83) ;</li>\n<li>Mêmes positions, dispersions ×4,5 : B est bien plus <b>inégalitaire</b> — même moyenne, histoires opposées ;</li>\n<li>La moyenne seule est un résumé trompeur : le couple (position ; dispersion) est le vrai résumé ;</li>\n<li>Dans une copie : toujours citer les deux indicateurs, et une phrase d'interprétation.</li>\n</ul>\n<table>\n<tr><th>Situation</th><th>Position</th><th>Dispersion</th><th>Conclusion type</th></tr>\n<tr><td>A plus haute et plus régulière</td><td>x̄(A) &gt; x̄(B)</td><td>σ(A) &lt; σ(B)</td><td>A domine « nettement »</td></tr>\n<tr><td>A plus haute mais très irrégulière</td><td>x̄(A) &gt; x̄(B)</td><td>σ(A) ≫ σ(B)</td><td>A domine « en moyenne » mais avec des risques</td></tr>\n<tr><td>Mêmes moyennes</td><td>x̄(A) = x̄(B)</td><td>σ(A) ≠ σ(B)</td><td>homogénéité différente</td></tr>\n</table>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'écart type qui sauve une équipe de foot</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux attaquants sur 5 matchs. Djibril : 0 ; 0 ; 3 ; 0 ; 2. Moussa : 1 ; 1 ; 1 ; 2 ; 0. 1) Moyennes et écarts types. 2) Le coach cherche un buteur régulier : qui choisir ? 3) Et pour un match couperet unique ?</div><div class=\"etu\"><b>Étape 1 — Positions</b> : Djibril : 5/5 = 1 but/match ; Moussa : 5/5 = 1 : même moyenne.</div><div class=\"etu\"><b>Étape 2 — Dispersions</b> : Djibril : écarts −1, −1, +2, −1, +1 : V = (1+1+4+1+1)/5 = 1,6 : σ ≈ 1,26 ; Moussa : écarts 0, 0, 0, +1, −1 : V = 2/5 = 0,4 : σ ≈ 0,63 : deux fois plus régulier.</div><div class=\"etu\"><b>Étape 3 — Régularité</b> : pour une saison (espérance de buts cumulés), les deux valent 5 buts ; mais Moussa limite les matchs à zéro... en fait Djibril fait 0 but 3 fois sur 5 : pour la <b>fiabilité</b>, Moussa.</div><div class=\"etu\"><b>Étape 4 — Match couperet</b> : si l'essentiel est de marquer au moins un but dans un match crucial, Djibril marque avec probabilité 2/5 = 0,4, Moussa 3/5 = 0,6 : encore Moussa ! Même moyenne + dispersion plus faible = joueur plus souvent utile : le duel moyenne/σ se retrouve partout, du foot au portefeuille d'actions.</div></div></details>"

    "cours": "<div class=\"cours-head\"><h2>Probabilités : événements, calculs de base</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Vocabulaire : univers, événements</h3>\n<ul>\n<li>L'<b>univers</b> Ω est l'ensemble des issues (résultats possibles) d'une expérience aléatoire ;</li>\n<li>Un <b>événement</b> est un ensemble d'issues : « tirer un roi » = {roi de cœur, roi de carreau, roi de pique, roi de trèfle} ;</li>\n<li>Événement <b>élémentaire</b> : une seule issue ; <b>certain</b> : Ω entier ; <b>impossible</b> : ensemble vide ∅ ;</li>\n<li>Équiprobabilité : quand toutes les issues ont la même chance : P(A) = (issues favorables)/(issues possibles).</li>\n</ul>\n<div class=\"tip\"><b>La formule fondamentale (cas équiprobable)</b> : P(A) = nombre de cas favorables / nombre de cas possibles. Exemple : P(roi) = 4/52 = 1/13 ; P(cœur) = 13/52 = 1/4 ; P(figure) = 12/52 = 3/13.</div>\n\n<h3>2. Union, intersection, événement contraire</h3>\n<ul>\n<li><b>A ∪ B</b> (union) : « A ou B » (au moins l'un) ; <b>A ∩ B</b> (intersection) : « A et B » (les deux) ;</li>\n<li><b>Contraire</b> : Ā = « non A », P(Ā) = 1 − P(A) — l'arme des « au moins un » ;</li>\n<li>Formule des probabilités : <b>P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</b> (on retire le doublon) ;</li>\n<li>Événements <b>incompatibles</b> : A ∩ B = ∅ → P(A ∪ B) = P(A) + P(B).</li>\n</ul>\n<table>\n<tr><th>Événement</th><th>Écriture</th><th>Exemple (32 cartes)</th><th>Probabilité</th></tr>\n<tr><td>roi ou cœur</td><td>A ∪ B</td><td>4 + 13 − 1 = 16 cas</td><td>16/32 = 0,5</td></tr>\n<tr><td>roi ET cœur</td><td>A ∩ B</td><td>1 cas (roi de cœur)</td><td>1/32</td></tr>\n<tr><td>ni roi ni cœur</td><td>contraire de A ∪ B</td><td>32 − 16 = 16</td><td>0,5</td></tr>\n<tr><td>pas un roi</td><td>Ā</td><td>28 cas</td><td>28/32 = 0,875</td></tr>\n</table>\n<ul>\n<li>Astuce du « au moins » : P(au moins un...) = 1 − P(aucun) : presque toujours plus simple ;</li>\n<li>Exemple : sur 3 lancers de pièce, P(au moins une face) = 1 − P(que des piles) = 1 − 1/8 = 7/8.</li>\n</ul>\n\n<h3>3. Arbres de probabilités et répétitions</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 430 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Arbre de probabilites deux lancers\">\n  <defs><marker id=\"ar2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#64748b\"/></marker></defs>\n  <circle cx=\"60\" cy=\"80\" r=\"4\" fill=\"#1e293b\"/>\n  <line x1=\"60\" y1=\"80\" x2=\"180\" y2=\"35\" stroke=\"#4f46e5\" stroke-width=\"2\" marker-end=\"url(#ar2)\"/>\n  <line x1=\"60\" y1=\"80\" x2=\"180\" y2=\"125\" stroke=\"#16a34a\" stroke-width=\"2\" marker-end=\"url(#ar2)\"/>\n  <text x=\"120\" y=\"45\" font-size=\"11\" fill=\"#4f46e5\">P (0,5)</text><text x=\"120\" y=\"120\" font-size=\"11\" fill=\"#16a34a\">F (0,5)</text>\n  <line x1=\"180\" y1=\"35\" x2=\"300\" y2=\"15\" stroke=\"#4f46e5\" stroke-width=\"1.5\" marker-end=\"url(#ar2)\"/>\n  <line x1=\"180\" y1=\"35\" x2=\"300\" y2=\"55\" stroke=\"#4f46e5\" stroke-width=\"1.5\" marker-end=\"url(#ar2)\"/>\n  <line x1=\"180\" y1=\"125\" x2=\"300\" y2=\"105\" stroke=\"#16a34a\" stroke-width=\"1.5\" marker-end=\"url(#ar2)\"/>\n  <line x1=\"180\" y1=\"125\" x2=\"300\" y2=\"145\" stroke=\"#16a34a\" stroke-width=\"1.5\" marker-end=\"url(#ar2)\"/>\n  <text x=\"310\" y=\"18\" font-size=\"11\" fill=\"#1e293b\">PP (0,25)</text>\n  <text x=\"310\" y=\"58\" font-size=\"11\" fill=\"#1e293b\">PF (0,25)</text>\n  <text x=\"310\" y=\"108\" font-size=\"11\" fill=\"#1e293b\">FP (0,25)</text>\n  <text x=\"310\" y=\"148\" font-size=\"11\" fill=\"#1e293b\">FF (0,25)</text>\n  <text x=\"220\" y=\"160\" font-size=\"11\" fill=\"#64748b\">le produit des branches donne la probabilité du chemin</text>\n</svg><span class=\"fig-cap\">Arbre d'une expérience à deux lancers : chaque chemin a pour probabilité le produit des branches — ici 4 issues équiprobables de 0,25.</span></div>\n<ul>\n<li>Règle du <b>produit</b> le long d'un chemin ; règle de l'<b>addition</b> entre chemins menant au même événement ;</li>\n<li>P(exactement une face en 2 lancers) = PF + FP = 0,25 + 0,25 = 0,5 : compter les chemins ;</li>\n<li>À retenir : (a + b)ⁿ compte les chemins : 2 lancers → 1 + 2 + 1 ; 3 lancers → 1 + 3 + 3 + 1 (triangle de Pascal).</li>\n</ul>\n\n<h3>4. Échantillonnage : fluctuation et simulation</h3>\n<ul>\n<li>Si on répète n fois une épreuve de probabilité p, la <b>fréquence</b> observée fluctue autour de p ;</li>\n<li>Intervalle de fluctuation (seconde) : environ 95 % des fréquences tombent dans [p − 1/√n ; p + 1/√n] ;</li>\n<li>Exemple : p = 0,5, n = 100 : [0,4 ; 0,6] : une fréquence observée de 0,65 est <b>anormale</b> — soupçon de truquage ;</li>\n<li>Prendre une décision à partir d'un échantillon : comparer la fréquence observée à l'intervalle — prudence statistique.</li>\n</ul>\n\n<h3>5. Situations classiques : dés, urnes, sondages</h3>\n<ul>\n<li><b>Deux dés</b> : 36 issues ; P(somme = 7) = 6/36 = 1/6 (la plus probable) ; P(double) = 6/36 = 1/6 ;</li>\n<li><b>Urne</b> : 3 rouges, 2 bleues : P(rouge) = 3/5 ; avec remise, les tirages sont <b>identiques et indépendants</b> ;</li>\n<li><b>Sondage</b> : 55 % d'intentions sur 100 personnes : marge d'erreur ± 10 points : ne pas conclure trop vite ;</li>\n<li>Simulation : 1000 lancers simulés en 1 seconde : la loi des grands nombres stabilise la fréquence vers p.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le jeu de fête foraine honnête ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un forain propose : lance deux dés ; si la somme est 12, tu gagnes 20 € ; somme 11, tu gagnes 5 € ; sinon rien. La mise est de 1,50 €. 1) Probabilité de chaque gain ? 2) Gain moyen par partie ? 3) Le jeu est-il équitable ?</div><div class=\"etu\"><b>Étape 1 — Probabilités</b> : P(12) = 1/36 (double six) ; P(11) = 2/36 (5+6, 6+5) ; P(rien) = 33/36.</div><div class=\"etu\"><b>Étape 2 — Gain moyen</b> : E = (1/36)×20 + (2/36)×5 = 20/36 + 10/36 = 30/36 ≈ 0,83 € de gain brut, moins la mise 1,50 : <b>−0,67 € par partie</b>.</div><div class=\"etu\"><b>Étape 3 — Verdict</b> : le joueur perd en moyenne 67 centimes par lancer : jeu nettement <b>défavorable</b>.</div><div class=\"etu\"><b>Étape 4 — Généralisation</b> : la mise équitable serait 0,83 € : c'est le principe des assurances et casinos — fixer le prix juste au-dessus de l'espérance (ici l'espérance se calcule comme en 1re : le gain moyen pondéré par les probabilités).</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — au moins un six en quatre lancers</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On lance 4 dés. 1) Probabilité d'obtenir au moins un six ? 2) Et au moins un double en 24 lancers de 2 dés ? (Le chevalier de Méré se plaignait de perdre...) 3) Qui avait raison ?</div><div class=\"etu\"><b>Étape 1 — Passer au contraire</b> : P(aucun six en 4 lancers) = (5/6)⁴ ≈ 0,482 : P(au moins un) = 1 − 0,482 ≈ <b>0,518</b> : légèrement plus qu'une chance sur deux.</div><div class=\"etu\"><b>Étape 2 — Le pari de Méré</b> : P(aucun double en 24 lancers) = (35/36)²⁴ ≈ 0,509 : P(au moins un double) ≈ <b>0,491 &lt; 0,5</b> : le pari est perdant !</div><div class=\"etu\"><b>Étape 3 — L'erreur du chevalier</b> : Méré croyait que 4 lancers ÷ 6 faces = 24 lancers ÷ 36 couples : même « ratio », mais les probabilités ne se comportent pas linéairement : (5/6)⁴ ≠ (35/36)²⁴ en compensant 1/2.</div><div class=\"etu\"><b>Étape 4 — Histoire des maths</b> : c'est ce paradoxe (soumis à Pascal, 1654) qui a fait naître le <b>calcul des probabilités</b> : l'intuition trompe, la formule 1 − (1−p)ⁿ ne ment jamais.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Additionner P(A) + P(B) sans retirer P(A ∩ B) : les doublons comptent deux fois.</li>\n<li>Oublier le passage au contraire pour les « au moins un » : 1 − P(aucun) est LA méthode.</li>\n<li>Deux dés : 11 issues de somme ? Non : 36 issues, les sommes ne sont pas équiprobables (7 sort 6 fois plus que 2).</li>\n<li>Croire qu'après 5 piles, « face est due » : les lancers sont indépendants — la pièce n'a pas de mémoire.</li>\n<li>Confondre fréquence observée et probabilité théorique : l'une fluctue autour de l'autre.</li>\n</ul>\n</div>\n\n<h3>6. Tableaux croisés et probabilités conditionnelles amont</h3>\n<ul>\n<li>Un <b>tableau à double entrée</b> croise deux caractères : « porte le permis » × « âge » ;</li>\n<li>Les totaux de lignes/colonnes donnent les probabilités marginales ; les cases intérieures, les conjointes ;</li>\n<li>Lire P(A ∩ B) dans la case, P(A ∪ B) par la formule : la mécanique du chapitre en un tableau ;</li>\n<li>Attention à l'effectif total : toutes les probabilités se divisent par lui.</li>\n</ul>\n<table>\n<tr><th></th><th>Fumeur</th><th>Non-fumeur</th><th>Total</th></tr>\n<tr><td>Sportif</td><td>8</td><td>52</td><td>60</td></tr>\n<tr><td>Non sportif</td><td>22</td><td>18</td><td>40</td></tr>\n<tr><td>Total</td><td>30</td><td>70</td><td>100</td></tr>\n</table>\n<ul>\n<li>P(sportif ET fumeur) = 8/100 = 0,08 ; P(fumeur) = 30/100 = 0,3 ;</li>\n<li>P(fumeur ∪ sportif) = 0,3 + 0,6 − 0,08 = 0,82 : vérif par le tableau (8+52+22 = 82 cases favorables) ;</li>\n<li>P(fumeur OU sportif, au sens non exclusif) ≠ 82 % des gens « au moins un des deux » : si — c'est l'union ; le tableau rend l'union <b>visible</b>.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — anniversaires partagés : le paradoxe des 23</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans une classe de 23 élèves, quelle est la probabilité qu'au moins deux partagent la même date d'anniversaire ? (a) Estimation intuitive ? (b) Calcul exact ?</div><div class=\"etu\"><b>Étape 1 — Passer au contraire</b> : P(au moins un doublon) = 1 − P(tous distincts).</div><div class=\"etu\"><b>Étape 2 — Calculer la probabilité de coïncidence nulle</b> : 365/365 × 364/365 × ... : chaque élève doit « éviter » les dates prises : P(distincts) = 365!/(342!·365²³) ≈ 0,493.</div><div class=\"etu\"><b>Étape 3 — Conclusion</b> : P(doublon) ≈ 1 − 0,493 = <b>0,507 &gt; 0,5</b> : dès 23 personnes, plus probable qu'un doublon existe — contre toute intuition.</div><div class=\"etu\"><b>Étape 4 — Pourquoi</b> : il n'y a pas 23 mais 23×22/2 = 253 paires possibles : les occasions de coïncider explosent quadratiquement. Le « au moins » et le passage au contraire restent les deux réflexes royaux des probabilités.</div></div></details>"
  },

    "id": "configurations-trigo",

    "titre": "Configurations du plan et trigonométrie (sinus, cosinus)",
    "cours": "<div class=\"cours-head\"><h2>Configurations du plan et trigonométrie (sinus, cosinus)</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le cercle trigonométrique : le nouveau cadre</h3>\n<ul>\n<li>Cercle de rayon 1, orienté (sens <b>positif</b> = inverse des aiguilles d'une montre) ;</li>\n<li>À chaque angle x (en degrés ou radians) correspond un point M du cercle : <b>cos x = abscisse</b>, <b>sin x = ordonnée</b> de M ;</li>\n<li>D'où l'encadrement fondamental : <b>−1 ≤ cos x ≤ 1</b> et <b>−1 ≤ sin x ≤ 1</b> ;</li>\n<li>Relation : <b>cos²x + sin²x = 1</b> (Pythagore sur le rayon 1) — valable pour tout angle.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Cercle trigo quadrants et valeurs\">\n  <line x1=\"60\" y1=\"85\" x2=\"390\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"215\" y1=\"160\" x2=\"215\" y2=\"10\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <circle cx=\"215\" cy=\"85\" r=\"70\" fill=\"none\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/>\n  <line x1=\"215\" y1=\"85\" x2=\"276\" y2=\"50\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <circle cx=\"276\" cy=\"50\" r=\"3.5\" fill=\"#ef4444\"/>\n  <line x1=\"276\" y1=\"50\" x2=\"276\" y2=\"85\" stroke=\"#16a34a\" stroke-width=\"2\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"215\" y1=\"85\" x2=\"276\" y2=\"85\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-dasharray=\"4,3\"/>\n  <text x=\"283\" y=\"75\" font-size=\"11\" fill=\"#16a34a\">sin x</text>\n  <text x=\"245\" y=\"98\" font-size=\"11\" fill=\"#f59e0b\">cos x</text>\n  <text x=\"330\" y=\"35\" font-size=\"11\" fill=\"#64748b\">I : tout positif</text>\n  <text x=\"60\" y=\"35\" font-size=\"11\" fill=\"#64748b\">II : cos −, sin +</text>\n  <text x=\"60\" y=\"145\" font-size=\"11\" fill=\"#64748b\">III : tout négatif</text>\n  <text x=\"335\" y=\"145\" font-size=\"11\" fill=\"#64748b\">IV : cos +, sin −</text>\n</svg><span class=\"fig-cap\">Le point M(cos x ; sin x) tourne sur le cercle : les signes des coordonnées se lisent par quadrant — le cercle remplace le triangle rectangle.</span></div>\n\n<h3>2. Valeurs remarquables et symétries</h3>\n<table>\n<tr><th>x (degrés)</th><th>0</th><th>30</th><th>45</th><th>60</th><th>90</th><th>180</th><th>270</th></tr>\n<tr><td>cos x</td><td>1</td><td>√3/2</td><td>√2/2</td><td>1/2</td><td>0</td><td>−1</td><td>0</td></tr>\n<tr><td>sin x</td><td>0</td><td>1/2</td><td>√2/2</td><td>√3/2</td><td>1</td><td>0</td><td>−1</td></tr>\n</table>\n<ul>\n<li>Symétries : cos(−x) = cos x (paire) ; sin(−x) = −sin x (impaire) ;</li>\n<li>Angles associés : cos(180 − x) = −cos x ; sin(180 − x) = sin x : « le sinus aime son supplément » ;</li>\n<li>cos(90 − x) = sin x : complémentaires — à 30° et 60°, cos et sin échangent leurs valeurs ;</li>\n<li>Chaque valeur remarquable se retrouve par géométrie : demi-carré (45°) et demi-triangle équilatéral (30°/60°).</li>\n</ul>\n\n<h3>3. Résoudre des équations trigonométriques</h3>\n<ul>\n<li>cos x = 1/2 : x = 60° <b>ou</b> x = −60° (deux points du cercle à abscisse 1/2) : x = ±60° + 360°k ;</li>\n<li>sin x = √2/2 : x = 45° ou x = 180 − 45 = 135° : deux solutions par tour ;</li>\n<li>Toujours <b>deux familles de solutions</b> par tour (sauf cas limites ±1, 0) — les trouver sur le cercle, pas au hasard ;</li>\n<li>tan x = sin x/cos x (défini si cos x ≠ 0) : complète le trio.</li>\n</ul>\n<table>\n<tr><th>Équation</th><th>Lecture du cercle</th><th>Solutions sur [0 ; 360°)</th></tr>\n<tr><td>cos x = 1/2</td><td>abscisse 1/2</td><td>60° ; 300°</td></tr>\n<tr><td>sin x = 0,5</td><td>ordonnée 0,5</td><td>30° ; 150°</td></tr>\n<tr><td>cos x = 0</td><td>sur l'axe vertical</td><td>90° ; 270°</td></tr>\n<tr><td>sin x = 1</td><td>sommet du cercle</td><td>90° (une seule)</td></tr>\n<tr><td>cos x = −√3/2</td><td>quadrants II et III</td><td>150° ; 210°</td></tr>\n</table>\n\n<h3>4. Configurations du plan : les théorèmes de collège, niveau 2de</h3>\n<ul>\n<li><b>Pythagore</b> (rectangle) ; <b>Thalès</b> (parallèles et sécantes) ; <b>angles inscrits</b> : inscrite = moitié de l'angle au centre qui intercepte le même arc ;</li>\n<li>Triangle inscrit dans un demi-cercle : <b>rectangle</b> (l'angle inscrit droit intercepte un diamètre) ;</li>\n<li>Sinus de la loi des... : aire d'un triangle quelconque = (1/2)·b·c·sin(Â) — l'aire par deux côtés et l'angle ;</li>\n<li>Loi des sinus a/sin Â = b/sin B̂ = c/sin Ĉ = 2R (R rayon du cercle circonscrit) : pont entre angles et longueurs.</li>\n</ul>\n<div class=\"tip\"><b>Angle inscrit, cas d'école</b> : un angle au centre de 100° interceptant le même arc qu'un angle inscrit vaut le double : l'inscrit mesure <b>50°</b>. Et si l'angle au centre est 180° (diamètre), l'inscrit vaut 90° — c'est exactement le théorème du triangle inscrit dans un demi-cercle.</div>\n\n<h3>5. Applications : mesurer l'inaccessible</h3>\n<ul>\n<li><b>Hauteur d'une falaise</b> : depuis un bateau, angle de 25° vers le sommet, distance au pied 120 m : h = 120 × tan 25° ≈ 56 m ;</li>\n<li><b>Triangulation</b> : mesurer une base inaccessible par deux angles : le procédé des géomètres et du GPS ;</li>\n<li><b>Ombre et hauteur</b> : rapport des tangentes — méthode d'Ératosthène pour le rayon terrestre ;</li>\n<li>Radar et navigation : cap, relèvement et distance = cosinus et sinus en actes.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'angle au centre du pont</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un pont en arc enjambe une rivière. L'arc AB est un arc de cercle de centre O, l'angle AOB = 110°. 1) Un promeneur au point C sur l'arc (C ≠ A, B) voit AB sous quel angle ? 2) Et depuis un point D sur le cercle, de l'autre côté de AB (arc majeur) ? 3) Cas limite : AOB = 180° ?</div><div class=\"etu\"><b>Étape 1 — Angle inscrit</b> : C sur l'arc <b>majeur</b> : ACB intercepte l'arc AB du côté de O : ACB = 110/2 = <b>55°</b>.</div><div class=\"etu\"><b>Étape 2 — Point opposé</b> : D sur l'arc mineur (entre A et B côté O) : l'angle ADB intercepte l'arc majeur : ADB = (360 − 110)/2 = <b>125°</b> : les deux positions complètent 55 + 125 = 180°.</div><div class=\"etu\"><b>Étape 3 — Cas du diamètre</b> : AOB = 180° : AB est un diamètre : tout point du cercle voit AB sous un angle droit : c'est le triangle inscrit dans le demi-cercle.</div><div class=\"etu\"><b>Étape 4 — Application</b> : c'est la propriété des théâtres grecs : tous les spectateurs placés sur le même arc de cercle voient la scène sous le <b>même angle</b> — l'angle inscrit constant, un théorème d'acoustique visuelle.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — résoudre sin x = 0,8 sans calculatrice, puis avec</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> 1) Montrer que sin x = 0,8 = 4/5 correspond à un triangle rectangle « remarquable ». 2) Trouver les solutions de sin x = 4/5 sur [0 ; 360°) (arrondir). 3) En déduire cos x dans les deux cas.</div><div class=\"etu\"><b>Étape 1 — Triangle 3-4-5</b> : sin x = 4/5 : côté opposé 4, hypoténuse 5 : le triangle associé est le fameux 3-4-5 (adjacent 3).</div><div class=\"etu\"><b>Étape 2 — Solutions</b> : x ≈ 53,13° (le triangle) et x = 180 − 53,13 = 126,87° (symétrique sur le cercle, sin identique) : deux points du cercle à hauteur 0,8.</div><div class=\"etu\"><b>Étape 3 — Cosinus</b> : pour x ≈ 53° : cos x = +3/5 = 0,6 ; pour x ≈ 127° : cos x = −0,6 : cos² + sin² = 0,36 + 0,64 = 1 ✓ dans les deux cas.</div><div class=\"etu\"><b>Étape 4 — Réflexe</b> : toute équation trigo se résout par <b>position sur le cercle</b> : sin x = a = chercher la hauteur a (horizontale), cos x = a = la verticale a ; les symétries donnent la seconde solution — le cercle est le plan de travail, la calculatrice ne fait que chiffrer.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Une seule solution à cos x = 1/2 : il y a TOUJOURS deux points du cercle (±) — sauf valeurs 0, ±1.</li>\n<li>sin(180 − x) = −sin x : faux — le sinus garde son signe sur le supplément : sin(180 − x) = sin x.</li>\n<li>Croire que cos et sin dépassent 1 : encadrés dans [−1 ; 1], toujours.</li>\n<li>Mélanger degrés et radians en cours de calcul : choisir une unité et la garder.</li>\n<li>Angle inscrit = angle au centre : non — l'inscrit vaut la MOITIÉ (attention à l'arc intercepté).</li>\n</ul>\n</div>\n\n<h3>6. Radians : la nouvelle unité</h3>\n<ul>\n<li>Un <b>radian</b> est l'angle qui intercepte un arc de longueur 1 sur le cercle de rayon 1 ;</li>\n<li>Conversion : 180° = π rad ; donc 30° = π/6, 45° = π/4, 60° = π/3, 90° = π/2 ;</li>\n<li>Périmètre du cercle 2π : un tour complet = 2π radians — l'unité « naturelle » des maths ;</li>\n<li>Arcs et aires : sur un cercle de rayon r, un angle α (radians) intercepte un arc de longueur rα et un secteur d'aire (1/2)r²α.</li>\n</ul>\n<table>\n<tr><th>Degrés</th><th>30</th><th>45</th><th>60</th><th>90</th><th>120</th><th>180</th><th>270</th><th>360</th></tr>\n<tr><td>Radians</td><td>π/6</td><td>π/4</td><td>π/3</td><td>π/2</td><td>2π/3</td><td>π</td><td>3π/2</td><td>2π</td></tr>\n</table>\n<ul>\n<li>Le radian rend la longueur d'arc proportionnelle : L = rα sans facteur de conversion — c'est toute sa force ;</li>\n<li>En 1re, les dérivées de cos et sin ne sont simples qu'en radians : cos′ = −sin n'est vrai que dans cette unité ;</li>\n<li>Si les angles s'additionnent comme des arcs, c'est le radien qui gère la géométrie du cercle.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la piste d'athlétisme et les arcs</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une piste standard : deux lignes droites de 84,39 m et deux demi-cercles de rayon 36,5 m. 1) Périmètre de la corde ? 2) Le couloir 2 est à 1 m de plus (rayon +1) : quelle avance donner au départ pour équité ?</div><div class=\"etu\"><b>Étape 1 — Périmètre corde</b> : 2×84,39 + 2×π×36,5 ≈ 168,78 + 229,34 ≈ <b>398,1 m</b>.</div><div class=\"etu\"><b>Étape 2 — Couloir 2</b> : 2×84,39 + 2×π×37,5 ≈ 404,4 m : écart ≈ 2π ≈ <b>6,28 m</b>.</div><div class=\"etu\"><b>Étape 3 — Décalage</b> : le couloir 2 doit partir 6,28 m en avance : exactement 2π, indépendant du rayon — la magie de la formule L = rα : seul le cercle diffère, les droites sont communes.</div><div class=\"etu\"><b>Étape 4 — Généralité</b> : chaque couloir supplémentaire coûte 2π mètres : les décalages successifs 6,28 ; 12,57 ; 18,85 m forment une suite arithmétique — la géométrie circulaire alimente les suites de 1re.</div></div></details>"

    "titre": "Second degré : discriminant, forme canonique, factorisation",
    "cours": "<div class=\"cours-head\"><h2>Second degré : discriminant, forme canonique, factorisation</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois formes d'un trinôme</h3>\n<ul>\n<li><b>Développée</b> : f(x) = ax² + bx + c (a ≠ 0) : la forme de calcul ;</li>\n<li><b>Canonique</b> : f(x) = a(x − α)² + β avec α = −b/2a et β = f(α) : la forme du sommet — variations et extremum lus directement ;</li>\n<li><b>Factorisée</b> : f(x) = a(x − x₁)(x − x₂) : la forme des racines — signe et solutions lus directement ;</li>\n<li>Chaque forme a son usage : canonique pour tracer, factorisée pour résoudre, développée pour calculer.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Parabole sommet et racines\">\n  <line x1=\"30\" y1=\"120\" x2=\"410\" y2=\"120\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"215\" y1=\"160\" x2=\"215\" y2=\"15\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/>\n  <path d=\"M 60 40 Q 215 250 370 40\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <circle cx=\"215\" cy=\"145\" r=\"5\" fill=\"#ef4444\"/>\n  <text x=\"222\" y=\"158\" font-size=\"12\" fill=\"#ef4444\">S(α ; β) : sommet</text>\n  <circle cx=\"139\" cy=\"120\" r=\"4\" fill=\"#16a34a\"/><circle cx=\"291\" cy=\"120\" r=\"4\" fill=\"#16a34a\"/>\n  <text x=\"128\" y=\"112\" font-size=\"12\" fill=\"#16a34a\">x₁</text>\n  <text x=\"297\" y=\"112\" font-size=\"12\" fill=\"#16a34a\">x₂</text>\n  <text x=\"60\" y=\"30\" font-size=\"12\" fill=\"#1e293b\">a &lt; 0 : parabole « vers le bas », β = maximum</text>\n</svg><span class=\"fig-cap\">Le sommet S(−b/2a ; f(−b/2a)) est le pivot : la parabole est symétrique autour de son axe vertical, racines à égale distance de α.</span></div>\n\n<h3>2. Discriminant et racines</h3>\n<div class=\"tip\"><b>Le discriminant</b> : Δ = b² − 4ac.\nΔ &gt; 0 : deux racines x = (−b ± √Δ)/2a ;\nΔ = 0 : une racine double x₀ = −b/2a ;\nΔ &lt; 0 : aucune racine réelle.\nSomme et produit : x₁ + x₂ = −b/a et x₁·x₂ = c/a — contrôler ses calculs en une ligne.</div>\n<table>\n<tr><th>Équation</th><th>Δ</th><th>Racines</th><th>Factorisation</th></tr>\n<tr><td>x² − 5x + 6 = 0</td><td>25 − 24 = 1</td><td>2 et 3</td><td>(x−2)(x−3)</td></tr>\n<tr><td>2x² + 4x + 2 = 0</td><td>16 − 16 = 0</td><td>−1 (double)</td><td>2(x+1)²</td></tr>\n<tr><td>x² + x + 3 = 0</td><td>1 − 12 = −11</td><td>aucune</td><td>irréductible</td></tr>\n<tr><td>3x² − 12 = 0</td><td>144</td><td>±2</td><td>3(x−2)(x+2)</td></tr>\n</table>\n<ul>\n<li>Racines évidentes : tester 1 (si a+b+c = 0, x = 1 est racine) et −1 (si a+c = b) : gagner du temps ;</li>\n<li>Contrôle somme/produit : pour x² − 5x + 6 : 2 + 3 = 5 ✓ et 2×3 = 6 ✓ — deux vérifications gratuites.</li>\n</ul>\n\n<h3>3. Signe du trinôme : le tableau rituel</h3>\n<ul>\n<li>Signe de a <b>dehors</b> des racines, signe de −a dedans : « dehors comme a » ;</li>\n<li>Δ &lt; 0 : le trinôme garde le signe de a partout (toujours positif si a &gt; 0) ;</li>\n<li>Δ = 0 : signe de a partout, sauf nul en x₀ ;</li>\n<li>Exemple : x² − 5x + 6 &gt; 0 ⟺ x ∈ ]−∞ ; 2[ ∪ ]3 ; +∞[ : positif dehors.</li>\n</ul>\n<table>\n<tr><th>x</th><th>−∞ ... x₁</th><th>x₁ ... x₂</th><th>x₂ ... +∞</th></tr>\n<tr><td>signe de ax²+bx+c (a &gt; 0)</td><td>+</td><td>−</td><td>+</td></tr>\n<tr><td>signe de ax²+bx+c (a &lt; 0)</td><td>−</td><td>+</td><td>−</td></tr>\n</table>\n\n<h3>4. Variations et extremum par la forme canonique</h3>\n<ul>\n<li>a &gt; 0 : décroissante puis croissante : <b>minimum</b> β en α ; a &lt; 0 : maximum β en α ;</li>\n<li>Mise sous forme canonique : x² − 6x + 5 = (x − 3)² − 4 : sommet (3 ; −4), minimum −4 ;</li>\n<li>L'extremum β = −Δ/4a : relier les deux points de vue (canonique ↔ discriminant) ;</li>\n<li>Toute optimisation du programme (bénéfice, aire, trajectoire) est une question de sommet.</li>\n</ul>\n\n<h3>5. Équations et inéquations : la méthode complète</h3>\n<ol>\n<li>Regrouper pour obtenir un trinôme nul ; calculer Δ ;</li>\n<li>Trouver les racines ; factoriser si nécessaire ;</li>\n<li>Signe → inéquation ; racines → équation ;</li>\n<li>Vérifier avec la somme et le produit des racines, et un point test (x = 0 souvent).</li>\n</ol>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le bénéfice maximal de la boulangerie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une boulangerie vend ses croissants 1,50 € pièce. Le coût total pour q croissants est C(q) = 0,01q² + 0,5q + 40 (€). 1) Exprimer le bénéfice B(q). 2) Sur quel intervalle est-il positif ? 3) Combien de croissants maximisent le bénéfice ?</div><div class=\"etu\"><b>Étape 1 — Modéliser</b> : recette R(q) = 1,5q : B(q) = 1,5q − (0,01q² + 0,5q + 40) = −0,01q² + q − 40.</div><div class=\"etu\"><b>Étape 2 — Rentabilité</b> : Δ = 1 − 4×0,01×40 = 1 − 1,6 = −0,6 &lt; 0 : a = −0,01 &lt; 0 : B &lt; 0 partout : <b>jamais rentable</b> — le coût fixe écrase tout.</div><div class=\"etu\"><b>Étape 3 — Corriger le modèle</b> : à 2 € le croissant : B(q) = −0,01q² + 1,5q − 40 : Δ = 2,25 − 1,6 = 0,65 &gt; 0 : racines (−1,5 ± 0,81)/(−0,02) : environ 34 et 116 : rentable pour q ∈ [34 ; 116].</div><div class=\"etu\"><b>Étape 4 — Optimum</b> : sommet α = −b/2a = 1,5/0,02 = 75 croissants : B(75) = −0,01×5625 + 112,5 − 40 = <b>16,25 €</b> de bénéfice maximal. Discriminant pour la rentabilité, forme canonique pour l'optimum : les deux faces du trinôme au service de la décision économique.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — racines cachées et somme-produit</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> 1) Trouver deux nombres de somme 10 et de produit 21. 2) Résoudre x⁴ − 5x² + 4 = 0 (poser X = x²). 3) Retrouver le lien avec les racines évidentes.</div><div class=\"etu\"><b>Étape 1 — Somme/produit</b> : x² − 10x + 21 = 0 : Δ = 100 − 84 = 16 : x = 3 ou 7 : les nombres cherchés (3 et 7).</div><div class=\"etu\"><b>Étape 2 — Changement de variable</b> : X² − 5X + 4 = 0 : Δ = 9 : X = 1 ou X = 4 : x² = 1 → x = ±1 ; x² = 4 → x = ±2 : <b>quatre solutions</b> : −2, −1, 1, 2.</div><div class=\"etu\"><b>Étape 3 — Vérification rapide</b> : a + b + c = 1 − 5 + 4 = 0 : X = 1 racine évidente : cohérent avec l'étape 2.</div><div class=\"etu\"><b>Étape 4 — Moralité</b> : le couple somme/produit remplace le discriminant quand l'énoncé donne x₁+x₂ et x₁x₂ (reconstituer x² − Sx + P) ; le changement de variable ramène les équations bicarrées au second degré — deux techniques express à connaître.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Δ = b² − 4ac et non b² − 4ac/2 : aucune division dans le discriminant.</li>\n<li>Oublier le dénominateur 2a dans (−b ± √Δ)/2a : l'erreur la plus fréquente.</li>\n<li>a négatif : la parabole est « vers le bas » : l'extremum est un maximum, pas un minimum.</li>\n<li>Signe du tableau : « a dehors, −a dedans » — se tromper renverse toutes les solutions.</li>\n<li>Δ &lt; 0 avec a &lt; 0 : conclure « positif » : non — toujours le signe de a.</li>\n</ul>\n</div>\n\n<h3>6. Équations avec paramètre et signe pour tout x</h3>\n<ul>\n<li><b>Signe constant</b> : pour que ax² + bx + c soit de signe de a pour tout x, il faut et il suffit que <b>Δ ≤ 0</b> (la parabole ne traverse jamais l'axe) ;</li>\n<li>Exemple : pour quelles valeurs de m, x² + mx + 1 &gt; 0 pour tout x ? Δ = m² − 4 ≤ 0 → <b>m ∈ [−2 ; 2]</b> : le paramètre fait du discriminant un outil d'analyse ;</li>\n<li>Deux racines de signes contraires : c/a &lt; 0 ; deux racines positives : S &gt; 0 et P &gt; 0 (somme/produit) ;</li>\n<li>Position d'une droite et d'une parabole : étudier le signe de f(x) − (mx + p) : trinôme → discussion par discriminant.</li>\n</ul>\n<table>\n<tr><th>Question sur x² + bx + c</th><th>Traduction</th><th>Résolution</th></tr>\n<tr><td>toujours positif</td><td>Δ &lt; 0 et a &gt; 0</td><td>intervalle de b</td></tr>\n<tr><td>racines de signes opposés</td><td>c/a &lt; 0</td><td>condition sur c</td></tr>\n<tr><td>deux racines &gt; 3</td><td>S &gt; 6 et P &gt; 9 et f(3) &gt; 0</td><td>discussion</td></tr>\n<tr><td>une seule racine</td><td>Δ = 0</td><td>b = ±2√c</td></tr>\n</table>\n\n<h3>7. Histoire et géométrie du trinôme</h3>\n<ul>\n<li>Babyloniens (1800 av. J.-C.) : tablettes résolvant déjà des problèmes « carré + côté = 14,5 » : le second degré a 4000 ans ;</li>\n<li>Al-Khwarizmi (IXe siècle) : la méthode de « complétion » (al-jabr) — l'ancêtre mot à mot de « algèbre » ;</li>\n<li>La forme canonique est sa complétion du carré : x² + bx = (x + b/2)² − b²/4 : l'histoire des maths se réécrit à chaque génération de lycéens ;</li>\n<li>Géométrie : aire d'un carré augmenté d'une bande : la complétion du carré se <b>dessine</b>, comme les identités remarquables de 3e.</li>\n</ul>"
