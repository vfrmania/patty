    "cours": "<div class=\"cours-head\"><h2>Données, tableaux et graphiques : organiser l'information</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Pourquoi organiser des données ?</h3>\n<p>Une liste de valeurs brutes est illisible : on organise les <b>données</b> dans des <b>tableaux</b> ou des <b>graphiques</b> pour comparer, classer et prendre des décisions.</p>\n\n<h3>2. Lire et compléter un tableau à double entrée</h3>\n<table>\n<tr><th>Loisir</th><th>Garçons</th><th>Filles</th><th>Total</th></tr>\n<tr><td>Sport</td><td>12</td><td>9</td><td>21</td></tr>\n<tr><td>Lecture</td><td>4</td><td>11</td><td>15</td></tr>\n<tr><td>Musique</td><td>6</td><td>6</td><td>12</td></tr>\n<tr><td><b>Total</b></td><td><b>22</b></td><td><b>26</b></td><td><b>48</b></td></tr>\n</table>\n<ul>\n<li>Chaque case se lit en croisant une <b>ligne</b> et une <b>colonne</b> ;</li>\n<li>Vérifier la cohérence : les totaux en ligne et en colonne doivent correspondre au total général (12+4+6 = 22 ✓).</li>\n</ul>\n\n<h3>3. Les représentations graphiques</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 430 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Exemple de graphique en barres : sport 21, lecture 15, musique 12\">\n  <g stroke=\"#cbd5e1\" stroke-width=\"1\">\n    <line x1=\"70\" y1=\"20\" x2=\"70\" y2=\"150\"/><line x1=\"70\" y1=\"150\" x2=\"400\" y2=\"150\"/>\n    <line x1=\"70\" y1=\"120\" x2=\"400\" y2=\"120\"/><line x1=\"70\" y1=\"90\" x2=\"400\" y2=\"90\"/><line x1=\"70\" y1=\"60\" x2=\"400\" y2=\"60\"/><line x1=\"70\" y1=\"30\" x2=\"400\" y2=\"30\"/>\n  </g>\n  <g fill=\"#4f46e5\"><rect x=\"100\" y=\"60\" width=\"50\" height=\"90\"/><rect x=\"200\" y=\"105\" width=\"50\" height=\"45\" fill=\"#16a34a\"/><rect x=\"300\" y=\"120\" width=\"50\" height=\"30\" fill=\"#f59e0b\"/></g>\n  <g font-size=\"11\" fill=\"#334155\" text-anchor=\"middle\">\n    <text x=\"125\" y=\"52\" fill=\"#4f46e5\" font-weight=\"bold\">21</text><text x=\"225\" y=\"97\" fill=\"#16a34a\" font-weight=\"bold\">15</text><text x=\"325\" y=\"112\" fill=\"#f59e0b\" font-weight=\"bold\">12</text>\n    <text x=\"125\" y=\"166\">Sport</text><text x=\"225\" y=\"166\">Lecture</text><text x=\"325\" y=\"166\">Musique</text>\n    <text x=\"60\" y=\"154\">0</text><text x=\"60\" y=\"124\">10</text><text x=\"60\" y=\"94\">20</text><text x=\"60\" y=\"34\">30</text>\n  </g>\n</svg><span class=\"fig-cap\">Un diagramme en barres : la hauteur de chaque barre est proportionnelle à l'effectif (1 graduation = 10 élèves).</span></div>\n<ul>\n<li><b>Diagramme en barres</b> : comparer des effectifs par catégories ;</li>\n<li><b>Diagramme circulaire</b> (camembert) : montrer des parts d'un total (angles proportionnels) ;</li>\n<li><b>Courbe</b> (graphique cartésien) : suivre une évolution dans le temps (températures) ;</li>\n<li>Règle d'or : un graphique a toujours un <b>titre</b>, des <b>axes gradués</b> et une <b>légende</b>.</li>\n</ul>\n\n<h3>3 bis. Fréquence et pourcentage</h3>\n<ul>\n<li>Effectif total = somme des effectifs (ici 48) ;</li>\n<li>Fréquence d'une valeur = effectif ÷ effectif total : Sport → 21/48 ≈ 0,44 soit <b>44 %</b> ;</li>\n<li>La somme des fréquences vaut 1 (soit 100 %).</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Lire une valeur sans regarder l'<b>unité</b> et la <b>graduation</b> des axes (1 carreau = 10, pas 1).</li>\n<li>Couper l'axe vertical d'un diagramme en barres : les différences paraissent exagérées — commencer à 0 quand c'est possible.</li>\n<li>Un diagramme circulaire doit être complet : tous les pourcentages s'additionnent à 100 %.</li>\n<li>Ne pas confondre l'<b>effectif</b> (12 élèves) et la <b>fréquence</b> (0,25 ou 25 %).</li>\n</ul>\n</div>"

    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Théorème :</b> triangle rectangle en A ⟹ BC² = AB² + AC² (hypoténuse au carré = somme des carrés des deux autres côtés).</p>\n<p><b>Réciproque :</b> BC² = AB² + AC² ⟹ triangle rectangle en A (le plus long côté est l'hypoténuse).</p>\n<p><b>Contraposée :</b> BC² ≠ AB² + AC² ⟹ le triangle n'est pas rectangle.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculer l'hypoténuse :</b> BC = √(AB² + AC²)</li>\n<li><b>Calculer un côté de l'angle droit :</b> AB = √(BC² − AC²)</li>\n<li><b>Vérifier si un triangle est rectangle :</b> comparer le plus grand carré à la somme des deux autres (réciproque).</li>\n</ul>\n<h3>🔢 Triplets utiles</h3>\n<p>(3 ; 4 ; 5) — (5 ; 12 ; 13) — (8 ; 15 ; 17) — et leurs multiples : (6 ; 8 ; 10), (9 ; 12 ; 15)…</p>\n<h3>🧮 Formules dérivées</h3>\n<ul>\n<li>Diagonale d'un rectangle : d = √(L² + l²)</li>\n<li>Distance MN = √((x<sub>N</sub>−x<sub>M</sub>)² + (y<sub>N</sub>−y<sub>M</sub>)²)</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Ne s'applique QUE dans un triangle rectangle.</li>\n<li>L'hypoténuse est toujours le côté le plus long = celui qui est <b>seul</b> dans l'égalité.</li>\n<li>Ne pas oublier la racine carrée finale (√25 = 5).</li>\n</ul>"

    "id": "derivation",
    "fiche": "<h3>📌 Définitions</h3>\n<p><b>Nombre dérivé :</b> f′(a) = lim<sub>h→0</sub> (f(a+h) − f(a)) / h.</p>\n<p><b>Tangente en a :</b> y = f′(a)(x − a) + f(a) (coefficient directeur : f′(a)).</p>\n<h3>🔢 Dérivées usuelles</h3>\n<table><tr><th>f</th><th>x<sup>n</sup></th><th>1/x</th><th>√x</th><th>cos x</th><th>sin x</th><th>k</th></tr>\n<tr><td><b>f′</b></td><td>n x<sup>n−1</sup></td><td>−1/x²</td><td>1/(2√x)</td><td>−sin x</td><td>cos x</td><td>0</td></tr></table>\n<h3>➕ Opérations</h3>\n<ul>\n<li>(u + v)′ = u′ + v′ ; (k u)′ = k u′</li>\n<li>(uv)′ = u′v + uv′</li>\n<li>(1/v)′ = −v′/v² ; (u/v)′ = (u′v − uv′)/v²</li>\n<li>(u<sup>n</sup>)′ = n u′ u<sup>n−1</sup> ; (√u)′ = u′/(2√u)</li>\n</ul>\n<h3>📈 Variations</h3>\n<ul>\n<li>f′ &gt; 0 ⟹ f croissante ; f′ &lt; 0 ⟹ f décroissante.</li>\n<li>f′ s'annule ET change de signe en a ⟹ extremum local en a.</li>\n</ul>\n<h3>🎯 Méthode d'étude</h3>\n<p>Domaine → f′(x) factorisée → signe de f′ → tableau de variations → extremums.</p>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>(uv)′ ≠ u′v′.</li>\n<li>f′(a) = 0 seul ne prouve pas un extremum (changement de signe obligatoire : x³ en 0).</li>\n<li>Dérivable ⇒ continue, mais pas l'inverse (|x| en 0).</li>\n</ul>"

  {
    "id": "puissances",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Définition :</b> aⁿ = a × a × … × a (n facteurs) ; a¹ = a ; a⁰ = 1 (a ≠ 0).</p>\n<p><b>Les 3 règles :</b> aᵐ × aⁿ = aᵐ⁺ⁿ ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ ; (aᵐ)ⁿ = aᵐˣⁿ.</p>\n<p><b>Puissances de 10 :</b> 10⁻ⁿ = 1/10ⁿ ; multiplier par 10ⁿ déplace la virgule de n rangs.</p>\n<p><b>Écriture scientifique :</b> a × 10ⁿ avec 1 ≤ a < 10 (unique).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Simplifier un produit de puissances :</b> même base → additionner les exposants.</li>\n<li><b>Simplifier un quotient :</b> même base → soustraire les exposants.</li>\n<li><b>Écriture scientifique :</b> placer la virgule pour obtenir 1 ≤ a < 10, puis compter les rangs de déplacement (droite → exposant positif, gauche → négatif).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>(−2)⁴ = 16 mais −2⁴ = −16 (parenthèses !).</li>\n<li>2³ × 2² = 2⁵ : on N'ADDITIONNE PAS les bases.</li>\n<li>(2³)² = 2⁶ : on MULTIPLIE les exposants, contrairement au produit.</li>\n<li>5⁰ = 1, pas 0 ni 5.</li>\n</ul>"

  {
    "id": "milieux",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Théorème 1 :</b> droite passant par les milieux de deux côtés d'un triangle ⟹ <b>parallèle au troisième côté</b>.</p>\n<p><b>Théorème 2 :</b> segment des milieux ⟹ longueur = <b>moitié du troisième côté</b> (IJ = BC/2).</p>\n<p><b>Réciproque :</b> droite passant par le milieu d'un côté, parallèle à un deuxième côté ⟹ coupe le 3ᵉ côté en son <b>milieu</b>.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculer une longueur :</b> segment des milieux = moitié du 3ᵉ côté ; le 3ᵉ côté = 2 × segment des milieux.</li>\n<li><b>Prouver un parallélisme :</b> citer les deux milieux, conclure avec le théorème 1.</li>\n<li><b>Prouver qu'un point est un milieu :</b> citer « milieu d'un côté + parallèle au 2ᵉ côté », conclure avec la réciproque.</li>\n<li><b>Quadrilatère de milieux :</b> tracer une diagonale, appliquer le théorème dans les deux triangles ⟹ parallélogramme.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Il faut DEUX milieux (ou un milieu + une parallèle) : une seule donnée ne suffit pas.</li>\n<li>IJ = BC/2 : le 3ᵉ côté est CELUI QUI N'EST PAS coupé en son milieu.</li>\n<li>Ne pas confondre droite des milieux et médiane.</li>\n</ul>"

    "id": "calcul-litteral",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Simplifications :</b> 3 × x = 3x ; x × x = x² ; x + x = 2x ; 1x = x.</p>\n<p><b>Simple distributivité :</b> k(a + b) = ka + kb ; k(a − b) = ka − kb.</p>\n<p><b>Double distributivité :</b> (a + b)(c + d) = ac + ad + bc + bd.</p>\n<p><b>Substituer :</b> remplacer x par sa valeur, avec des parenthèses si le nombre est négatif.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Réduire :</b> regrouper les x avec les x, les x² avec les x², les nombres avec les nombres.</li>\n<li><b>Développer :</b> multiplier chaque terme, puis réduire.</li>\n<li><b>Vérifier un développement :</b> tester avec une valeur simple (x = 0 ou 1) des deux côtés.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>x + x = 2x mais x × x = x² : ne pas confondre somme et produit.</li>\n<li>3x + 5x² ne se réduit pas (natures différentes).</li>\n<li>−3(x − 2) = −3x + 6 : le « − » change les DEUX signes.</li>\n<li>Substituer un négatif : toujours des parenthèses, (−2)² = 4 mais −2² = −4.</li>\n</ul>"

  {
    "id": "equations",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Équation :</b> égalité à une inconnue x ; <b>solution</b> = valeur de x qui rend l'égalité vraie.</p>\n<p><b>Principe de la balance :</b> toute opération faite d'un côté doit être faite de l'autre.</p>\n<p><b>Ordre de résolution :</b> 1) développer ; 2) regrouper les x d'un côté, les nombres de l'autre ; 3) diviser par le coefficient ; 4) VÉRIFIER.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>3x − 5 = 16 :</b> +5 des deux côtés → 3x = 21 → ÷3 → x = 7.</li>\n<li><b>5x + 2 = 2x + 14 :</b> −2x → 3x + 2 = 14 → −2 → 3x = 12 → x = 4.</li>\n<li><b>2(3x − 1) = 4x + 6 :</b> développer → 6x − 2 = 4x + 6 → 2x = 8 → x = 4.</li>\n<li><b>Problème :</b> choisir l'inconnue, traduire l'énoncé, résoudre, vérifier, conclure avec l'unité.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Toujours vérifier la solution dans l'équation INITIALE.</li>\n<li>Quand x est des deux côtés : soustraire le PETIT x pour garder un coefficient positif.</li>\n<li>« Faire passer » un terme = changer son signe (car on ajoute/soustrait des deux côtés).</li>\n<li>Dans un problème, la solution doit être cohérente (prix positif, nombre entier de personnes…).</li>\n</ul>"

  {
    "id": "proportionnalite",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Produit en croix :</b> a/b = c/d ⟹ a×d = b×c (quatrième proportionnelle).</p>\n<p><b>Vitesse :</b> v = d/t ⟺ d = v×t ⟺ t = d/v.</p>\n<p><b>Conversions vitesses :</b> km/h → m/s : ÷3,6 ; m/s → km/h : ×3,6.</p>\n<p><b>Échelle :</b> e = distance carte / distance réelle (même unité) ; échelle 1/25 000 ⟹ 1 cm = 250 m.</p>\n<p><b>Pourcentages :</b> +15 % = ×1,15 ; −20 % = ×0,8.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Quatrième proportionnelle :</b> poser le tableau, produit en croix, convertir l'unité à la fin.</li>\n<li><b>Temps décimal :</b> 2 h 30 min = 2,5 h ; 45 min = 0,75 h ; 3,2 h = 3 h 12 min.</li>\n<li><b>Échelle :</b> multiplier la distance carte par le dénominateur, puis convertir (cm → km : ÷100 000).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>2 h 30 min = 2,5 h (et non 2,30 h) : les minutes sont en base 60.</li>\n<li>La vitesse moyenne n'est PAS la moyenne des vitesses.</li>\n<li>Échelle : toujours les mêmes unités avant le produit en croix.</li>\n<li>Augmenter de 10 % puis de 10 % ≠ +20 % (car la seconde hausse part d'un prix plus grand).</li>\n</ul>"

    "id": "pyramides",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Pyramide :</b> V = (1/3) × B × h (B = AIRE de la base, h = hauteur).</p>\n<p><b>Cône :</b> V = (1/3) × π × r² × h.</p>\n<p><b>Section parallèle à la base :</b> même forme que la base ; réduction de rapport k ⟹ longueurs ×k, aires ×k², volumes ×k³.</p>\n<p>Pyramide et cône = le <b>tiers</b> du prisme/cylindre de même base et hauteur.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Volume :</b> calculer B d'abord (aire !), puis appliquer V = (1/3)Bh.</li>\n<li><b>Retrouver h :</b> h = 3V/B ; retrouver r ou le côté de base : mêmes étapes à l'envers.</li>\n<li><b>Valeur exacte avec π :</b> garder « ×π » dans le résultat exact, arrondir seulement à la fin.</li>\n<li><b>Agrandissement-réduction :</b> identifier k (longueurs), puis appliquer k² (aires) ou k³ (volumes).</li>\n</ul>\n<h3>🔢 Aires de base utiles</h3>\n<ul>\n<li>Carré de côté c : B = c²</li>\n<li>Rectangle : B = L × l</li>\n<li>Disque : B = πr²</li>\n<li>Triangle : B = (b × h)/2</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>B est une AIRE : pour une base carrée de 6, B = 36 (pas 6 !).</li>\n<li>Hauteur ⟂ base : ce n'est pas une arête latérale.</li>\n<li>Unités : cm × cm² = cm³.</li>\n<li>Diviser les dimensions par 2 divise le volume par 8 (k³), pas par 2.</li>\n</ul>"

  {
    "id": "thales",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Thalès :</b> deux droites sécantes + deux parallèles ⟹ AM/AB = AN/AC = MN/BC.</p>\n<p><b>Réciproque :</b> AM/AB = AN/AC (même ordre des points) ⟹ (MN) ∥ (BC).</p>\n<p><b>Agrandissement-réduction :</b> longueurs ×k, aires ×k².</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculer une longueur :</b> identifier la configuration, écrire les 3 rapports, produit en croix.</li>\n<li><b>Prouver un parallélisme :</b> calculer les 2 rapports séparément, comparer, citer la réciproque.</li>\n<li><b>Aires :</b> le rapport des longueurs au carré donne le rapport des aires.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Côtés homologues : AM avec AB, jamais AM avec AC.</li>\n<li>Réciproque : points alignés dans le même ordre, sinon théorème faux.</li>\n<li>k² pour les aires, k pour les longueurs.</li>\n<li>Thalès ne s'applique que si on CONNAÎT (ou prouve) le parallélisme pour le théorème direct.</li>\n</ul>"

    "id": "trigonometrie",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>SOH-CAH-TOA :</b> sin(x) = Opp/Hyp ; cos(x) = Adj/Hyp ; tan(x) = Opp/Adj.</p>\n<p>Le rapport ne dépend que de l'angle, pas de la taille du triangle.</p>\n<p>Valeurs remarquables : cos(60°) = 1/2 ; sin(30°) = 1/2 ; tan(45°) = 1.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Longueur connue + angle connu :</b> choisir la formule qui relie les DEUX côtés concernés, isoler, calculer (mode DEGRÉ).</li>\n<li><b>Deux côtés connus, angle inconnu :</b> former le rapport, puis touche inverse : cos⁻¹, sin⁻¹ ou tan⁻¹.</li>\n<li><b>Étape 0 obligatoire :</b> nommer Hypoténuse / Adjacent / Opposé par rapport à l'angle choisi.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Adjacent et opposé s'échangent quand on change d'angle.</li>\n<li>Calculatrice en degrés (DEG), pas en radians.</li>\n<li>cos(x) et sin(x) d'un angle aigu sont toujours entre 0 et 1.</li>\n<li>cos⁻¹(0,5) = 60°, mais 1/cos(60°) = 2 : la touche inverse n'est pas l'inverse du nombre.</li>\n</ul>"

  {
    "id": "racines",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Définition :</b> √a = le nombre positif dont le carré est a (a ≥ 0).</p>\n<p><b>Règles :</b> √a × √b = √(ab) ; √a/√b = √(a/b).</p>\n<p><b>PAS de règle pour la somme :</b> √a + √b ≠ √(a+b).</p>\n<p><b>Équation x² = a (a > 0) :</b> x = √a ou x = −√a.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Simplifier √N :</b> chercher le plus grand carré parfait qui divise N (√50 = 5√2, √72 = 6√2, √75 = 5√3).</li>\n<li><b>Réduire une somme :</b> simplifier chaque racine, puis regrouper les √ identiques (3√2 + 5√2 = 8√2).</li>\n<li><b>Carrés parfaits à connaître :</b> 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>√9 = 3 uniquement (positif) ; x² = 9 a deux solutions : −3 et 3.</li>\n<li>√2 + √3 ne se simplifie pas (√5 serait faux).</li>\n<li>(√3)² = 3 : élever au carré « fait tomber » la racine.</li>\n<li>√(−5) n'existe pas.</li>\n</ul>"

    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Identités remarquables :</b> (a+b)² = a² + 2ab + b² ; (a−b)² = a² − 2ab + b² ; (a+b)(a−b) = a² − b².</p>\n<p><b>Facteur commun :</b> ka + kb = k(a+b).</p>\n<p><b>Produit nul :</b> A×B = 0 ⟺ A = 0 ou B = 0.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Développer (a±b)² :</b> carré du 1ᵉʳ + double produit + carré du 2ᵉ (attention au signe du double produit).</li>\n<li><b>Factoriser :</b> 1) facteur commun ? 2) a² − b² ? 3) sinon, développer/réduire d'abord.</li>\n<li><b>Équation-produit :</b> factoriser, puis chaque facteur = 0 séparément.</li>\n<li><b>Vérification systématique :</b> redévelopper la forme factorisée.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>(x+3)² = x² + 6x + 9 (pas x² + 9, ni x² + 3x + 9).</li>\n<li>(3x)² = 9x² (le coefficient est au carré).</li>\n<li>x² − 49 = 0 : factoriser en (x+7)(x−7), ne JAMAIS diviser par (x−7).</li>\n<li>a² − b² se factorise, mais a² + b² non (pas d'identité).</li>\n</ul>"

  {
    "id": "fonctions",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Fonction :</b> un procédé qui à chaque x associe UN SEUL nombre f(x).</p>\n<p><b>f(x) = image de x</b> ; x = un antécédent de f(x).</p>\n<p>L'image est unique ; un nombre peut avoir 0, 1 ou plusieurs antécédents.</p>\n<p><b>Linéaire :</b> f(x) = ax (droite par l'origine, proportionnalité). <b>Affine :</b> f(x) = ax + b.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculer une image :</b> remplacer x par la valeur (parenthèses si négatif).</li>\n<li><b>Chercher un antécédent :</b> résoudre l'équation f(x) = valeur.</li>\n<li><b>Sur un graphique :</b> image → verticale depuis l'abscisse ; antécédents → horizontale depuis l'ordonnée.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>f(2) se calcule ; « l'antécédent de 2 » se trouve en résolvant f(x) = 2.</li>\n<li>Sur une courbe, une valeur du tableau peut avoir plusieurs antécédents.</li>\n<li>(−2)² = 4 : vigilance sur les substitutions.</li>\n<li>Le vocabulaire est NOTÉ au brevet : image ≠ antécédent.</li>\n</ul>"

    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Moyenne :</b> somme des valeurs ÷ effectif ; pondérée : Σ(valeur×coef) ÷ Σcoef.</p>\n<p><b>Médiane :</b> valeur qui coupe la série ORDONNÉE en deux moitiés (central si impair ; moyenne des deux centraux si pair).</p>\n<p><b>Étendue :</b> max − min (dispersion).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Médiane :</b> 1) ordonner, 2) compter, 3) prendre la (ou les) valeur(s) centrale(s).</li>\n<li><b>Moyenne pondérée :</b> tout multiplier, tout additionner, diviser par le total des poids.</li>\n<li><b>Choisir l'indicateur :</b> série avec valeur extrême → médiane ; situation proportionnelle → moyenne.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Chercher la médiane SANS trier la série : erreur garantie.</li>\n<li>Effectif pair : la médiane peut ne pas être une valeur de la série.</li>\n<li>La moyenne « ne ressemble à personne » si les valeurs sont dispersées.</li>\n<li>Étendue = une seule valeur (max − min), pas « de … à … ».</li>\n</ul>"

    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Sphère</b> (surface) : A = 4πr². <b>Boule</b> (volume) : V = (4/3)πr³.</p>\n<p><b>Section par un plan :</b> toujours un cercle ; grand cercle si le plan passe par le centre.</p>\n<p><b>Sections de solides :</b> parallèle à la base ⟹ même forme réduite (k, k², k³).</p>\n<p><b>Translation :</b> glissement selon un vecteur. <b>Rotation :</b> pivotement autour d'un centre d'un angle donné. Les deux conservent longueurs et angles.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Aire/volume d'une sphère :</b> identifier r² ou r³, garder la valeur exacte avec π.</li>\n<li><b>Rayon d'un cercle de section :</b> Pythagore : rsection² = Rsphère² − d² (d = distance du plan au centre).</li>\n<li><b>Rotation :</b> conserver OM' = OM et l'angle donné ; <b>translation :</b> parallélisme et longueur du vecteur.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>A = 4πr² (pas 4πr³ !) et V = (4/3)πr³ (pas 4πr²).</li>\n<li>Plan à distance d du centre : le rayon de section vaut √(R² − d²), toujours plus petit que R.</li>\n<li>Translation ≠ rotation : une seule change l'orientation de la figure.</li>\n<li>Les transformations du chapitre ne déforment RIEN (isométries).</li>\n</ul>"

    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Comparaison :</b> parties entières d'abord, puis dixièmes, centièmes… chiffre par chiffre.</p>\n<p><b>Produit de décimaux :</b> virgule à (nb de décimales du 1ᵉʳ) + (nb du 2ᵉ) chiffres.</p>\n<p><b>Divisibilité :</b> par 2 (pair), par 5 (0 ou 5), par 10 (0), par 3 et 9 (somme des chiffres), par 4 (2 derniers chiffres).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Comparer :</b> aligner en colonnes, comparer de gauche à droite.</li>\n<li><b>Multiplier :</b> sans virgule d'abord, compter les décimales, placer la virgule.</li>\n<li><b>Ordre de grandeur :</b> arrondir avant de calculer pour prévoir le résultat.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« Plus de chiffres » ne veut pas dire « plus grand » (5,4 &gt; 5,379).</li>\n<li>Multiplier par un nombre &lt; 1 rétrécit le résultat.</li>\n<li>Diviser par 100 : la virgule part de 2 rangs vers la gauche.</li>\n<li>Critère par 3 : la SOMME des chiffres, pas le dernier.</li>\n</ul>"

  {
    "id": "fractions",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Fraction d'une quantité :</b> diviser par le dénominateur, multiplier par le numérateur.</p>\n<p><b>Comparer :</b> même dénominateur → numérateurs ; même numérateur → le plus petit dénominateur gagne.</p>\n<p><b>Addition/soustraction :</b> même dénominateur UNIQUEMENT : (a+b)/c. Sinon, réduire d'abord.</p>\n<p><b>Fractions égales :</b> multiplier/diviser haut et bas par le même nombre.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>3/4 de 24 :</b> 24 ÷ 4 = 6, puis 6 × 3 = 18.</li>\n<li><b>Réduire au même dénominateur :</b> prendre le plus petit multiple commun, multiplier chaque fraction pour l'atteindre.</li>\n<li><b>Simplifier :</b> chercher un diviseur commun (6/8 = 3/4).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>1/2 + 1/3 = 5/6, PAS 2/5.</li>\n<li>2/3 &gt; 2/5 : à numérateur égal, plus le dénominateur est petit, plus la part est grande.</li>\n<li>Le dénominateur ne change JAMAIS dans une addition.</li>\n<li>7/4 &gt; 1 : une fraction peut dépasser l'unité.</li>\n</ul>"

  {
    "id": "pourcentages",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Proportionnalité :</b> coefficient constant ; « doubler l'un double l'autre ».</p>\n<p><b>Quatrième proportionnelle :</b> coefficient (passage par l'unité) ou produit en croix.</p>\n<p><b>Pourcentage :</b> t % de N = (t/100) × N. 50 % = moitié, 25 % = quart, 10 % = ÷ 10, 75 % = 3/4.</p>\n<p><b>Réduction :</b> prix après −t % = (100 − t) % du prix.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Tester un tableau :</b> calculer tous les quotients ; égaux ⟹ proportionnel.</li>\n<li><b>Valeur manquante :</b> diviser pour 1 unité, multiplier pour le nombre cherché.</li>\n<li><b>Solde −30 % :</b> remise = 0,3 × prix ; prix soldé = 0,7 × prix.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>+50 % puis −50 % ≠ retour au prix de départ (100 → 150 → 75).</li>\n<li>Le pourcentage se rapporte toujours à un nombre de départ précis.</li>\n<li>25 % de 40 = 10, mais 25 % de 80 = 20 : le résultat dépend du total.</li>\n<li>100 % d'une quantité = la quantité entière.</li>\n</ul>"

  {
    "id": "geometrie",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Angles :</b> droit 90°, plat 180° ; complémentaires (somme 90°), supplémentaires (somme 180°).</p>\n<p><b>Somme des angles :</b> triangle 180°, quadrilatère 360°.</p>\n<p><b>Symétrie axiale :</b> l'axe est la médiatrice du segment [M M′] ; <b>centrale :</b> O est le milieu de [M M′].</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Angle manquant d'un triangle :</b> 180° − (les deux autres).</li>\n<li><b>Complémentaire/supplémentaire :</b> 90° − x ou 180° − x.</li>\n<li><b>Construire M′ (axiale) :</b> perpendiculaire à l'axe, reporter HM′ = HM.</li>\n</ul>\n<h3>🔢 Axes de symétrie à connaître</h3>\n<ul>\n<li>Isocèle : 1 — équilatéral : 3 — carré : 4 — rectangle/losange : 2.</li>\n<li>Parallélogramme : 0 axe (centre de symétrie seulement).</li>\n<li>Cercle : une infinité (tous les diamètres).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Rayon ≠ diamètre (d = 2r).</li>\n<li>Angle obtus : ENTRE 90° et 180° (pas « plus de 90° tout court »).</li>\n<li>Symétrie centrale = demi-tour : la figure est retournée.</li>\n</ul>"

    "id": "relatifs",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Ordre :</b> négatifs &lt; 0 &lt; positifs ; chez les négatifs, le plus loin de zéro est le plus petit.</p>\n<p><b>Addition :</b> même signe → distances à zéro ajoutées, signe commun ; signes contraires → différence des distances, signe du plus loin de zéro.</p>\n<p><b>Soustraction :</b> a − b = a + (−b) : on ajoute l'opposé. − (−x) = +x.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Somme longue :</b> regrouper les positifs, regrouper les négatifs, puis une seule addition finale.</li>\n<li><b>Vérification :</b> se représenter la droite graduée (avancer/reculer).</li>\n<li><b>Distance à zéro :</b> toujours positive : |−8| = 8.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>−5 &lt; −3 : le « plus grand nombre » négatif est le plus proche de zéro.</li>\n<li>3 − (−7) = 10 : deux moins qui se suivent s'annulent.</li>\n<li>−4 + 6 = 2 : le résultat porte le signe du plus loin de zéro.</li>\n<li>(−3) + (−5) = −8 : signe conservé, distances additionnées.</li>\n</ul>"

  {
    "id": "litteral-5e",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Expression littérale :</b> des lettres remplacent des nombres ; × disparaît devant une lettre : 4c, 3(x+1).</p>\n<p><b>Simplifications :</b> x + x = 2x ; x × x = x² ; 3x + 5x = 8x ; 1x = x.</p>\n<p><b>Tester une égalité :</b> calculer chaque membre séparément et comparer.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Écrire une expression :</b> traduire l'énoncé mot à mot (monter → +, descendre → −, le double → × 2).</li>\n<li><b>Simplifier :</b> regrouper les termes de même nature, jamais x et nombres.</li>\n<li><b>Contrôler :</b> remplacer x par une valeur simple (0, 1 ou 2) avant et après.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>x + x = 2x mais x × x = x² : somme ≠ produit.</li>\n<li>3x + 5 reste tel quel : 8 n'est pas « 3x + 5x ».</li>\n<li>4 × x × 2 = 8x (les nombres se multiplient entre eux).</li>\n<li>Ne jamais « mélanger » cm et cm² (périmètre et aire).</li>\n</ul>"

  {
    "id": "parallelogrammes",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Parallélogramme :</b> côtés opposés parallèles ⟹ opposés égaux, angles opposés égaux, diagonales coupées en leur milieu, centre de symétrie.</p>\n<p><b>Angles :</b> consécutifs supplémentaires (somme 180°) ; total 360°.</p>\n<p><b>Famille :</b> losange = 4 côtés égaux (diagonales perpendiculaires) ; rectangle = 4 angles droits (diagonales égales) ; carré = les deux.</p>\n<p><b>Aire :</b> base × hauteur (hauteur ⟂ base).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Démontrer « parallélogramme » :</b> le plus rapide = diagonales de même milieu.</li>\n<li><b>Trouver un côté opposé :</b> reporter la longueur du côté qui lui fait face.</li>\n<li><b>Angle consécutif :</b> 180° − angle donné.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Le losange EST un parallélogramme ; le cerf-volant n'en est PAS un.</li>\n<li>Hauteur ≠ côté incliné : tracer le segment perpendiculaire à la base.</li>\n<li>Rectangle : diagonales ÉGALES ; losange : diagonales PERPENDICULAIRES — ne pas échanger.</li>\n<li>ABCD parallélogramme : AB = CD mais AB ≠ BC (côtés consécutifs).</li>\n</ul>"

  {
    "id": "stats-5e",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Effectif :</b> nombre d'apparitions d'une valeur ; <b>effectif total :</b> somme des effectifs.</p>\n<p><b>Fréquence :</b> effectif ÷ effectif total (fraction, décimal ou %) ; somme des fréquences = 1.</p>\n<p><b>Diagramme circulaire :</b> angle = (effectif ÷ effectif total) × 360°.</p>\n<p><b>Moyenne pondérée :</b> somme(valeur × effectif) ÷ effectif total.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Lire « au moins » / « plus de » :</b> inclure ou non la valeur frontière.</li>\n<li><b>Retrouver un effectif :</b> effectif total − somme des effectifs connus.</li>\n<li><b>Contrôles :</b> fréquences = 100 % ; angles = 360° ; moyenne entre min et max.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« Au moins 4 » = valeurs 4 et 5 (13 élèves sur l'exemple du cours, pas 8).</li>\n<li>La moyenne peut ne correspondre à AUCUN élève (3,72 n'est pas une note).</li>\n<li>Diviser par l'effectif total, jamais par le nombre de VALEURS distinctes.</li>\n<li>Diagramme circulaire : × 360°, pas × 100.</li>\n</ul>"

  {
    "id": "ensembles-2de",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Emboîtement :</b> ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ; irrationnels (√2, π) = ℝ∖ℚ.</p>\n<p><b>Intervalles :</b> [a ; b] compris ; ]a ; b[ exclu ; ±∞ toujours exclu.</p>\n<p><b>Identités remarquables :</b> (a+b)² = a²+2ab+b² ; (a−b)² = a²−2ab+b² ; (a+b)(a−b) = a²−b².</p>\n<p><b>Racines :</b> √(ab) = √a·√b ; √(a²) = |a| ; MAIS √(a+b) ≠ √a + √b.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Classer un nombre :</b> entier ? relatif ? quotient d'entiers ? sinon ℝ∖ℚ.</li>\n<li><b>Inéquation → intervalle :</b> ≤ ou ≥ ⟹ crochet fermé ; &lt; ou &gt; ⟹ ouvert.</li>\n<li><b>Calcul mental :</b> 101² = (100+1)² ; 99² = (100−1)² ; 102×98 = (100+2)(100−2).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>0,7 = 7/10 est rationnel : un décimal EST un quotient.</li>\n<li>√16 = 4 ∈ ℕ, mais √5 est irrationnel.</li>\n<li>(a + b)² ≠ a² + b² : le double produit 2ab manque toujours.</li>\n<li>√9 + √16 = 7 ≠ √25 = 5 : la racine d'une somme ≠ somme des racines.</li>\n</ul>"

  {
    "id": "fonctions-reference",
    "fiche": "<h3>📌 Les 4 fonctions de référence</h3>\n<p><b>Carré x² :</b> ℝ → [0 ; +∞[ ; parabole ; ↓ sur ]−∞;0], ↑ sur [0;+∞[ ; min 0 ; toujours ≥ 0.</p>\n<p><b>Cube x³ :</b> ℝ → ℝ ; croissante PARTOUT ; signe de x ; symétrique par rapport à l'origine.</p>\n<p><b>Inverse 1/x :</b> ℝ∖{0} ; hyperbole à 2 branches ; ↓ sur chaque branche ; signe de x.</p>\n<p><b>Racine √x :</b> [0 ; +∞[ → [0 ; +∞[ ; croissante ; toujours ≥ 0.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>x² = a (a > 0) :</b> deux solutions √a et −√a.</li>\n<li><b>x² < a :</b> S = ]−√a ; √a[ (lecture sur la parabole).</li>\n<li><b>Ordre des inverses :</b> pour a, b > 0 : a < b ⟹ 1/a > 1/b (ordre renversé).</li>\n<li><b>Position √x vs x :</b> √x ≥ x sur [0;1], √x ≤ x sur [1;+∞[.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>x² = 16 : S = {−4 ; 4}, pas seulement 4.</li>\n<li>1/x n'est pas décroissante sur ℝ∖{0} : seulement sur CHAQUE intervalle.</li>\n<li>√(−9) n'existe pas dans ℝ.</li>\n<li>x² = −4 n'a aucune solution (un carré est ≥ 0).</li>\n</ul>"

  {
    "id": "variations-2de",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Image :</b> f(a), unique ; <b>antécédents de k :</b> solutions de f(x) = k : 0, 1, 2… possibles.</p>\n<p><b>Tableau de variations :</b> flèches ↗ (croît) / ↘ (décroît) ; valeurs aux extrémités = bornes atteintes.</p>\n<p><b>Extremum :</b> sommet d'une flèche ; minimum m en a : f(x) ≥ m pour tout x.</p>\n<p><b>Graphique :</b> f(x) = k ⟹ intersections avec la droite y = k ; f(x) &lt; k ⟹ portion sous la droite.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Antécédents :</b> résoudre f(x) = k (pas seulement « lire en k »).</li>\n<li><b>Maximum sur [a ; b] :</b> comparer les valeurs aux bornes et aux sommets des flèches.</li>\n<li><b>f(x) &lt; 0 :</b> portions de courbe sous l'axe des abscisses.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>« L'image de 25 » vs « les antécédents de 25 » : sens inversés.</li>\n<li>f(x) = k peut avoir deux solutions ; une lecture graphique reste APPROCHÉE.</li>\n<li>f(x) ≥ 2 : intervalles en LUO (crochets inclus car égalité permise).</li>\n<li>Un extremum n'est atteint que si la valeur figure au bout d'une flèche du tableau.</li>\n</ul>"

  {
    "id": "vecteurs",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Vecteur AB→ = (x_B − x_A ; y_B − y_A)</b> ; direction + sens + norme.</p>\n<p><b>Norme :</b> ‖u→(x;y)‖ = √(x² + y²) (repère orthonormé).</p>\n<p><b>Chasles :</b> AB→ + BC→ = AC→ ; AB→ = −BA→.</p>\n<p><b>Colinéarité :</b> u→(x;y), v→(x′;y′) colinéaires ⟺ xy′ − x′y = 0.</p>\n<p><b>Milieu :</b> ((x_A+x_B)/2 ; (y_A+y_B)/2) ; <b>distance :</b> AB = √((Δx)² + (Δy)²).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Parallélogramme :</b> prouver AB→ = DC→ (attention à l'ordre : AB et DC, pas AD).</li>\n<li><b>Alignement de A, B, C :</b> tester la colinéarité de AB→ et AC→.</li>\n<li><b>Quadrilatère particulier :</b> d'abord parallélogramme, puis côtés égaux (losange) ou diagonales égales (rectangle).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>AB→ = arrivée − départ : (x_B − x_A), jamais l'inverse.</li>\n<li>La formule de distance ne vaut qu'en repère orthonormé.</li>\n<li>Colinéarité : xy′ − x′y = 0 (déterminant nul).</li>\n<li>AB→ = CD→ signifie ABDC parallélogramme (et non ABCD !).</li>\n</ul>"

  {
    "id": "stats-2de",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Moyenne :</b> Σx·n / N ; <b>médiane :</b> partage la série ordonnée en 50/50 (moyenne des 2 centrales si N pair).</p>\n<p><b>Quartiles :</b> Q1 (25 % en dessous), Q3 (75 %) ; <b>écart interquartile :</b> Q3 − Q1.</p>\n<p><b>Variance :</b> V = moyenne des (x − x̄)² ; <b>écart type :</b> σ = √V.</p>\n<p><b>Étendue :</b> max − min.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Médiane :</b> ordonner ; rang (N+1)/2 si N impair, moyenne des rangs N/2 et N/2 + 1 si pair.</li>\n<li><b>Q1/Q3 :</b> rangs ⌈N/4⌉ et ⌈3N/4⌉ sur la série ordonnée.</li>\n<li><b>Comparer deux séries :</b> même moyenne ? regarder alors σ : le plus petit = série plus homogène.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Ne jamais calculer médiane ou quartiles sans ordonner la série.</li>\n<li>Médiane d'une série paire : moyenne des DEUX valeurs centrales.</li>\n<li>σ = √V : ne pas confondre variance et écart type.</li>\n<li>Une valeur aberrante tire la moyenne mais laisse la médiane quasi intacte.</li>\n</ul>"

    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Équiprobabilité :</b> P(A) = favorables / possibles.</p>\n<p><b>Bornes :</b> 0 ≤ P ≤ 1 ; P(Ω) = 1 ; P(∅) = 0.</p>\n<p><b>Contraire :</b> P(Ā) = 1 − P(A) (« au moins un » ⟹ passer par AUCUN).</p>\n<p><b>Réunion :</b> P(A ∪ B) = P(A) + P(B) − P(A ∩ B) ; si incompatibles : P(A) + P(B).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Tirage unique :</b> compter favorables et possibles, simplifier la fraction.</li>\n<li><b>« Ou »/« et » :</b> traduire en ∪ / ∩ avant de calculer.</li>\n<li><b>« Au moins un » :</b> calculer 1 − P(aucun).</li>\n<li><b>Deux tirages successifs :</b> arbre, produit le long des branches.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Diviser les comptes ne vaut qu'en équiprobabilité.</li>\n<li>Ne pas retrancher l'intersection dans P(A ∪ B) quand elle existe.</li>\n<li>P(bonne réponse) = 1/4 au QCM : équiprobabilité, pas 4 favorable !</li>\n<li>Un événement et son contraire couvrent tout : P(A) + P(Ā) = 1.</li>\n</ul>"

  {

    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>SOH-CAH-TOA :</b> sin = opposé/hypoténuse ; cos = adjacent/hypoténuse ; tan = opposé/adjacent.</p>\n<p><b>Valeurs clés :</b> sin30 = 1/2 ; cos60 = 1/2 ; sin45 = cos45 = √2/2 ; sin60 = cos30 = √3/2.</p>\n<p><b>Identité :</b> cos²(θ) + sin²(θ) = 1 ; −1 ≤ cos, sin ≤ 1.</p>\n<p><b>Demi-cercle :</b> triangle inscrit ⟹ rectangle (diamètre = hypoténuse).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Longueur inconnue :</b> identifier hypoténuse / opposé / adjacent, choisir sin ou cos, résoudre.</li>\n<li><b>Angle inconnu :</b> calculer le rapport, utiliser cos⁻¹ ou sin⁻¹ (calculatrice en degrés).</li>\n<li><b>sin par cos :</b> sin² = 1 − cos², racine positive si l'angle est aigu.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>sin prend le côté OPPOSÉ, cos le côté ADJACENT — toujours par rapport à l'angle choisi.</li>\n<li>Calculatrice en mode DEGRÉS.</li>\n<li>cos(θ) + sin(θ) ≠ 1 : c'est cos² + sin² = 1.</li>\n<li>L'hypoténuse est au dénominateur : un résultat > hypoténuse est impossible.</li>\n</ul>"

    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Formes :</b> développée ax²+bx+c ; canonique a(x−α)²+β ; factorisée a(x−x₁)(x−x₂).</p>\n<p><b>Δ = b² − 4ac</b> : Δ>0 ⟹ 2 racines (−b±√Δ)/2a ; Δ=0 ⟹ −b/2a ; Δ<0 ⟹ aucune racine réelle.</p>\n<p><b>Sommet :</b> S(−b/2a ; f(−b/2a)) — α = −b/2a.</p>\n<p><b>Somme/produit :</b> x₁+x₂ = −b/a ; x₁x₂ = c/a.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Résoudre ax²+bx+c = 0 :</b> calculer Δ, appliquer les formules, VÉRIFIER avec somme et produit.</li>\n<li><b>Signe :</b> a &gt; 0 : positif dehors, négatif dedans ; Δ ≤ 0 : signe de a partout.</li>\n<li><b>Inéquation stricte :</b> racines exclues (crochets ouverts).</li>\n<li><b>Factoriser :</b> a(x−x₁)(x−x₂) — ne pas oublier le facteur a !</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Δ = b² − 4ac : erreur de signe classique sur −4ac.</li>\n<li>2x² − 3x − 2 &gt; 0 : S = ]−∞ ; −1/2[ ∪ ]2 ; +∞[ — l'UNION, pas l'intervalle entre les racines.</li>\n<li>Le facteur a de la factorisation disparaît souvent à tort.</li>\n<li>x₁x₂ = c/a : si le produit ne colle pas, les racines sont fausses.</li>\n</ul>"

  {
    "id": "derivation-operations",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>(uv)′ = u′v + uv′</b> ; <b>(u/v)′ = (u′v − uv′)/v²</b> ; (1/v)′ = −v′/v² ; (ku)′ = ku′ ; (u+v)′ = u′+v′.</p>\n<p><b>Variations :</b> f′ &gt; 0 ⟹ f ↑ ; f′ &lt; 0 ⟹ f ↓ ; f′ change de signe en a ⟹ extremum.</p>\n<p><b>Tangente en a :</b> y = f′(a)(x − a) + f(a).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Dériver un produit :</b> identifier u et v, dériver séparément, appliquer u′v + uv′, développer/réduire.</li>\n<li><b>Étude de variations :</b> f′ factorisée → signe de f′ → tableau → valeurs de f aux points critiques.</li>\n<li><b>Audit :</b> pour un produit, redériver après développement : les deux résultats doivent coïncider.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>(uv)′ ≠ u′v′ : erreur no 1 du chapitre.</li>\n<li>(u/v)′ : numérateur u′v − uv′, ordre imposé ; dénominateur v².</li>\n<li>x³ en 0 : f′(0) = 0 mais pas d'extremum (pas de changement de signe).</li>\n<li>Un extremum exige f′(a) = 0 ET changement de signe.</li>\n</ul>"

  {
    "id": "suites",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Arithmétique :</b> u_{n+1} = u_n + r ; u_n = u_0 + nr ; somme = nb × (1er + dernier)/2.</p>\n<p><b>Géométrique :</b> u_{n+1} = q·u_n ; u_n = u_0·qⁿ ; somme = u_0·(q^{nb} − 1)/(q − 1).</p>\n<p><b>Tests :</b> différences constantes ⟹ arithmétique ; quotients constants ⟹ géométrique.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Identifier :</b> calculer u_{n+1} − u_n ou u_{n+1}/u_n sur deux-trois rangs.</li>\n<li><b>Terme général :</b> vérifier avec un terme connu (u_1 en général) avant d'extrapoler.</li>\n<li><b>Sommes :</b> compter les TERMES (de u_0 à u_n : n+1 termes !).</li>\n<li><b>Modéliser :</b> +k par an ⟹ arithmétique ; ×q par an (intérêts composés) ⟹ géométrique.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>De u_0 à u_10 : 11 termes, pas 10.</li>\n<li>u_n = u_0 + nr ; avec départ en u_1 : u_n = u_1 + (n−1)r.</li>\n<li>q = 0,5 : géométrique DÉCROISSANTE (0 &lt; q &lt; 1).</li>\n<li>Somme géométrique : (q^{nb} − 1)/(q − 1), l'exposant = nombre de TERMES.</li>\n</ul>"

  {
    "id": "probas-conditionnelles",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Conditionnelle :</b> P_B(A) = P(A ∩ B)/P(B) ; P(A ∩ B) = P(B)·P_B(A).</p>\n<p><b>Arbre :</b> produit sur le chemin, somme entre chemins ; branches d'un nœud : total 1.</p>\n<p><b>Indépendance :</b> P(A ∩ B) = P(A)·P(B) ⟺ P_B(A) = P(A).</p>\n<p><b>Probabilités totales :</b> P(A) = P(B)·P_B(A) + P(B̄)·P_B̄(A).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>« Sachant que B » :</b> nouvel univers B : tout est divisé par P(B).</li>\n<li><b>Arbre :</b> le remplir avec les données, calculer chaque chemin, sommer.</li>\n<li><b>Test d'indépendance :</b> comparer P(A∩B) à P(A)×P(B) — conclure par une phrase.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Indépendant ≠ incompatible : incompatibles ⟹ P(A∩B) = 0.</li>\n<li>P_B(A) = P(A∩B)/P(B) : c'est B au dénominateur (l'événement SACHANT).</li>\n<li>Tirage SANS remise : les probabilités du 2e tirage changent.</li>\n<li>Sur l'arbre : les 2e branches sont CONDITIONNELLES, pas absolues.</li>\n</ul>"

  {
    "id": "produit-scalaire",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>u→·v→ = ‖u→‖‖v→‖cos θ</b> = <b>xx′ + yy′</b> (repère orthonormé).</p>\n<p><b>Orthogonalité :</b> u→ et v→ sont <b>orthogonaux</b> ⟺ u→·v→ = 0.</p>\n<p><b>Norme :</b> ‖u→‖² = u→·u→.</p>\n<p><b>Al-Kashi :</b> a² = b² + c² − 2bc·cos(Â).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Rectangle en B ?</b> : calculer BA→·BC→ : nul ⟹ oui.</li>\n<li><b>Angle entre vecteurs :</b> cos θ = (u→·v→)/(‖u→‖‖v→‖), puis cos⁻¹.</li>\n<li><b>Longueur par Al-Kashi :</b> quand Pythagore est impossible (pas d'angle droit).</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Le produit scalaire est un NOMBRE (positif, nul ou négatif).</li>\n<li>xx′ + yy′ : seulement en repère orthonormé.</li>\n<li>u→·v→ = 0 : orthogonalité, pas un vecteur nul.</li>\n<li>Al-Kashi : le signe MOINS de −2bc·cos(Â) disparaît souvent.</li>\n</ul>"

  {
    "id": "variables-aleatoires",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Loi de X :</b> tableau valeurs / probabilités ; Σp_i = 1.</p>\n<p><b>E(X) = Σ x_i·p_i</b> : moyenne attendue ; jeu favorable ⟺ E &gt; 0.</p>\n<p><b>V(X) = Σ p_i(x_i − E)²</b> ; <b>σ = √V</b>.</p>\n<p><b>Linéarité :</b> E(aX+b) = aE(X)+b ; V(aX+b) = a²V(X).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Établir une loi :</b> lister les issues, compter les valeurs de X, vérifier Σp = 1.</li>\n<li><b>Jeu :</b> travailler en gains NETS (mise déduite), calculer E, conclure par une phrase.</li>\n<li><b>Comparaison de jeux :</b> même E ? comparer alors σ : le plus petit = le moins risqué.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Une loi dont les probabilités ne totalisent pas 1 est fausse.</li>\n<li>E(X) peut ne correspondre à AUCUNE valeur possible de X.</li>\n<li>Gain net = gain brut − mise : toujours préciser lequel on utilise.</li>\n<li>V(2X + 3) = 4V(X) : a au carré, b éliminé.</li>\n</ul>"

  {
    "id": "suites-term",
    "fiche": "\n<h3>📌 L'essentiel</h3>\n<ul>\n<li><b>Suite</b> = fonction u : ℕ → ℝ ; définie explicitement (u<sub>n</sub> = f(n)) ou par <b>récurrence</b> (u<sub>0</sub> donné, u<sub>n+1</sub> = f(u<sub>n</sub>)).</li>\n<li><b>Suite croissante</b> : u<sub>n+1</sub> ≥ u<sub>n</sub> ; <b>décroissante</b> : u<sub>n+1</sub> ≤ u<sub>n</sub> ; on étudie le signe de u<sub>n+1</sub> − u<sub>n</sub> ou le sens de variation de f.</li>\n<li><b>Suite majorée / minorée / bornée</b> : il existe M tel que u<sub>n</sub> ≤ M pour tout n (resp. m ≥).</li>\n<li><b>Convergence</b> : u<sub>n</sub> → ℓ si tout intervalle ouvert autour de ℓ contient tous les u<sub>n</sub> à partir d'un certain rang.</li>\n<li><b>Théorèmes</b> : toute suite croissante et majorée converge ; comparaison et gendarmes ; opérations sur les limites ; convergence des suites géométriques : q<sup>n</sup> → 0 si |q| &lt; 1, ±∞ si |q| &gt; 1.</li>\n<li><b>Récurrence</b> : initialisation + hérédité = conclusion.</li>\n</ul>\n<h3>🧭 Méthodes</h3>\n<ol>\n<li>Montrer une propriété par récurrence : vérifier P(0), supposer P(n), prouver P(n+1), conclure.</li>\n<li>Étudier les variations : signe de u<sub>n+1</sub> − u<sub>n</sub>, ou f croissante/décroissante sur [0 ; +∞[.</li>\n<li>Calculer une limite : opérations, gendarmes, comparaison, ou q<sup>n</sup> selon |q|.</li>\n<li>Prouver la convergence : majoration + croissance (théorème de convergence monotone).</li>\n</ol>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Une suite peut être divergente sans tendre vers ±∞ (ex. (−1)<sup>n</sup> oscille).</li>\n<li>q<sup>n</sup> → 0 seulement si <b>|q| &lt; 1</b> ; si q = 1, q<sup>n</sup> = 1.</li>\n<li>La récurrence exige l'initialisation : sans elle, l'hérédité ne prouve rien.</li>\n<li>Croissante + majorée ⇒ converge, mais la limite n'est pas forcément la majoration M.</li>\n<li>Limites des opérations : formes indéterminées ∞ − ∞, 0 × ∞, ∞/∞ à lever avant de conclure.</li>\n</ul>"

  {
    "id": "limites-fonctions",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Asymptotes :</b> y = ℓ (horizontale) si lim f = ℓ en ±∞ ; x = a (verticale) si lim = ±∞ en a ; y = ax+b (oblique) si lim [f(x)−(ax+b)] = 0.</p>\n<p><b>Croissances comparées (+∞) :</b> ln x ≪ xᵏ ≪ e^x ⟹ lim ln x/x = 0 ; lim e^x/xⁿ = +∞.</p>\n<p><b>En 0⁺ :</b> x·ln x → 0.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>∞/∞, ∞−∞ :</b> factoriser le terme dominant.</li>\n<li><b>Racines (√(x²+x) − x) :</b> quantité conjuguée.</li>\n<li><b>Fraction rationnelle :</b> limite = rapport des coefficients dominants.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>e^{−x} → 0 en +∞ mais +∞ en −∞ : l'exponentiel « change de camp ».</li>\n<li>Asymptote verticale : limite DIFFÉRENTE à gauche/droite possible (+∞/−∞).</li>\n<li>x·ln x : FI en 0⁺, la réponse est 0 (croissance comparée).</li>\n<li>(2x+1)/(x−3) : asymptotes y = 2 ET x = 3 — souvent les deux.</li>\n</ul>"

  {
    "id": "continuite-tvi",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Continuité en a :</b> lim x→a f(x) = f(a) ; polynômes, exp, ln, racines : continues sur leur domaine.</p>\n<p><b>Dérivable ⟹ continue</b> ; réciproque fausse (|x| en 0).</p>\n<p><b>TVI :</b> f continue sur [a;b], k entre f(a) et f(b) ⟹ f(c) = k a une solution.</p>\n<p><b>Corollaire :</b> continue + STRICTEMENT monotone + f(a)f(b) &lt; 0 ⟹ racine UNIQUE.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Racine de f(x) = 0 :</b> continuité → monotonie stricte (via f′) → f(a)f(b) &lt; 0 → TVI/corollaire.</li>\n<li><b>Encadrement (dichotomie) :</b> couper en deux, garder le sous-intervalle du changement de signe.</li>\n<li><b>Fonction morceaux :</b> continuité = limite à gauche = valeur à la jonction.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>TVI sans continuité : faux (partie entière saute des valeurs).</li>\n<li>Unicité sans STRICTE monotonie : fausse (deux racines possibles).</li>\n<li>Continue en a : les DEUX limites (gauche/droite) doivent égaler f(a).</li>\n<li>La rédaction doit CITER les hypothèses du théorème : elles rapportent des points.</li>\n</ul>"

  {
    "id": "logs-exp",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>exp :</b> e^{a+b} = e^a·e^b ; e^{a−b} = e^a/e^b ; (e^a)ⁿ = e^{an} ; e⁰ = 1.</p>\n<p><b>ln :</b> ln(ab) = ln a + ln b ; ln(a/b) = ln a − ln b ; ln(aⁿ) = n·ln a ; ln 1 = 0 ; ln e = 1.</p>\n<p><b>Réciproques :</b> ln(e^x) = x ; e^{ln x} = x ; e^x = k ⟹ x = ln k.</p>\n<p><b>Dérivées :</b> (e^x)′ = e^x ; (e^u)′ = u′e^u ; (ln x)′ = 1/x ; (ln u)′ = u′/u.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Équation avec ln :</b> domaine AVANT tout, puis regrouper en UN seul ln, puis égaler les intérieurs.</li>\n<li><b>ln 8 + ln 3 − ln 6 = ln(8×3/6) = ln 4</b> : toujours regrouper.</li>\n<li><b>Croissances comparées :</b> ln x ≪ x ≪ e^x en +∞ ; x·ln x → 0 en 0⁺.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>ln(a + b) ≠ ln a + ln b : le ln ne « traverse » NI une somme, NI une différence.</li>\n<li>ln x défini seulement pour x &gt; 0 : domaine obligatoire dans toute équation.</li>\n<li>(e^u)′ = u′e^u : ne pas oublier le u′.</li>\n<li>e^{a+b} ≠ e^a + e^b.</li>\n</ul>"

    "id": "lois-binomiale-normale",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Binomiale B(n;p) :</b> n épreuves identiques, indépendantes, 2 issues. P(X=k) = C(n,k)pᵏ(1−p)ⁿ⁻ᵏ ; E = np ; V = np(1−p).</p>\n<p><b>« Au moins un » :</b> 1 − (1−p)ⁿ.</p>\n<p><b>Normale N(μ;σ²) :</b> 68 % à ±σ, 95 % à ±2σ, 99,7 % à ±3σ ; Z = (X−μ)/σ ~ N(0;1).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Identifier une binomiale :</b> vérifier identique/indépendant/deux issues, puis poser n et p.</li>\n<li><b>P(X ≥ k) :</b> 1 − P(X ≤ k−1) ; à la calculatrice : binomFRép.</li>\n<li><b>Normale :</b> centrer-réduire (X−μ)/σ, puis règles 68-95-99,7 ou table.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Normale : P(X = 3,14) = 0 : une valeur exacte a une probabilité NULLE (loi continue).</li>\n<li>N(170 ; 64) : 64 est la VARIANCE : σ = 8, pas 64.</li>\n<li>P(« au moins 1 ») ≠ pⁿ : passer par le contraire 1 − (1−p)ⁿ.</li>\n<li>95 % = ±2σ (approx. 1,96σ) ; 99,7 % = ±3σ : ne pas échanger.</li>\n</ul>"

    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>y′ = ay ⟹ y = C·e^{ax}</b> (C réel quelconque).</p>\n<p><b>y′ = ay + b ⟹ y = C·e^{ax} − b/a</b>.</p>\n<p><b>y′ = ay + b·e^{x} ⟹ y = C·e^{ax} + (b/(1−a))·e^{x}</b> (a ≠ 1).</p>\n<p><b>Condition initiale y(0) = y₀ ⟹ C = y₀ + b/a</b> : unique solution.</p>\n<p><b>Demi-vie :</b> T = ln 2/|a| pour y′ = ay (a &lt; 0).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Résolution type :</b> solution générale, puis condition initiale pour trouver C.</li>\n<li><b>Solution particulière :</b> la chercher « de la même forme » que le second membre (constante, exponentielle).</li>\n<li><b>Vérification :</b> dériver la solution et remplacer dans l'équation.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>−b/a est l'équilibre : l'oublier fausse tout (vérifier : y constante = −b/a est solution).</li>\n<li>C sans condition initiale reste indéterminé : une équation différentielle a UNE INFINITÉ de solutions.</li>\n<li>Demi-vie : ln 2/|a|, pas 1/|a| : la source d'erreur n° 1.</li>\n<li>Refroidissement, désintégration : a &lt; 0 : la quantité décroît vers l'équilibre, jamais en dessous.</li>\n</ul>"

    "id": "arithmetique-matrices",
    "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Division euclidienne :</b> a = bq + r, 0 ≤ r &lt; b. Congruences : a ≡ b [n] ⟺ n | (a − b).</p>\n<p><b>Euclide :</b> pgcd(a, b) = pgcd(b, r) ; <b>Bézout :</b> premiers entre eux ⟺ au + bv = 1.</p>\n<p><b>Produit matriciel :</b> (AB)_{ij} = Σ a_{ik}b_{kj} ; AB ≠ BA ; AI = A.</p>\n<p><b>Inverse 2×2 :</b> det = ad − bc ; A⁻¹ = (1/det)(d −b ; −c a) si det ≠ 0.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Reste d'une grande puissance :</b> réduire la base par congruence, chercher le CYCLE des restes.</li>\n<li><b>Équation ax ≡ 1 [n] :</b> Bézout : inverse de a modulo n.</li>\n<li><b>Système linéaire :</b> forme AX = B, puis X = A⁻¹B.</li>\n<li><b>Puissances de matrices :</b> itérer A², A³, conjecturer, démontrer par récurrence.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Produit de matrices : lignes × colonnes (pas coefficient à coefficient) : AB ≠ BA.</li>\n<li>det = 0 ⟹ pas d'inverse : vérifier AVANT de renverser le système.</li>\n<li>Reste toujours positif : 2027 = 6×338 − 1 a pour reste 5, pas −1.</li>\n<li>Congruences : on additionne et multiplie, mais JAMAIS on ne divise.</li>\n</ul>"

      T(M + 14, y - 21, 14, true, curTitle, COL.wht);
      T(M + 14, y - 33, 8.5, false, 'Fiche synth\u00e9tique' + (typeof PDF_MATIERE !== 'undefined' && PDF_MATIERE ? ' \u2014 ' + PDF_MATIERE : ''), COL.wht);
      y -= bh + 14;
      return;
    }
    if (ln.table){ renderTable(ln.table); return; }
    var lh2 = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh2 - (ln.h ? 12 : 0) < M + 22) newPage();
    y -= (ln.gap || 0);
    if (ln.h){
      y -= 2;
      var bh3 = ln.size + 10;
      cur.push(rg(COL.lav) + ' ' + M + ' ' + (y - ln.size - 3).toFixed(2) + ' ' + (W - 2 * M) + ' ' + bh3 + ' re f');
      y -= ln.size * 1.05;
      var hx = M + 8, prevEnd = true;
      ln.segs.forEach(function(s){
        if (!s.t) return;
        var enc2 = pdfEnc(pdfTranslit(s.t));
        if (!enc2) return;
        var gapSp = (hx > M + 8 && !prevEnd && s.t.charAt(0) !== ' ') ? 1 : 0;
        T(hx + 0.52 * ln.size * gapSp, y, ln.size, true, s.t, COL.ind);
        hx += 0.52 * ln.size * (enc2.length + gapSp);
        prevEnd = / $/.test(s.t);
      });
      y -= ln.size * 0.37 + 3;
      return;
    }
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    if (ln.li) T(x - 11, y, ln.size, false, '\u2022', COL.ind);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      T(x, y, ln.size, s.b, s.t, COL.blk);
      x += 0.52 * ln.size * pdfEnc(pdfTranslit(s.t)).length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  for (var p = 0; p < pages.length; p++){
    var pgFoot = 'Fiche synth\u00e9tique' + (typeof PDF_MATIERE !== 'undefined' && PDF_MATIERE ? ' \u2014 ' + PDF_MATIERE : '') + ' \u2014 ' + curTitle;
    var fx = M, fw = 0.52 * 7.5 * pdfEnc(pdfTranslit(pgFoot)).length;
    pages[p].push(rg(COL.gry) + ' BT 1 0 0 1 ' + fx + ' 30 Tm /F1 7.5 Tf (' + pdfEsc(pdfEnc(pdfTranslit(pgFoot))) + ') Tj ET');
    var pn = 'Page ' + (p + 1) + ' / ' + pages.length;
    var pw = 0.52 * 7.5 * pn.length;
    pages[p].push('BT 1 0 0 1 ' + (W - M - pw).toFixed(2) + ' 30 Tm /F1 7.5 Tf (' + pdfEsc(pn) + ') Tj ET');
  }
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p2 = 0; p2 < pages.length; p2++){
    var po = 5 + 2 * p2, co = 6 + 2 * p2;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p2].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i2 = 1; i2 < objs.length; i2++){
    offs[i2] = out.length;
    if (objs[i2].indexOf('STREAM:') === 0){
      var st = objs[i2].slice(7);
      out += i2 + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i2 + ' 0 obj\n' + objs[i2] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i3 = 1; i3 < objs.length; i3++) out += ('0000000000' + offs[i3]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
// ===== Progression QCM (enregistrement local, navigateur uniquement) =====
var PG_MATIERE = 'maths';
function pgHash(s){ var h = 5381; for (var i = 0; i < s.length; i++){ h = ((h << 5) + h + s.charCodeAt(i)) | 0; } return (h >>> 0).toString(36); }
function pgKey(){ return 'patty-qcm-pg-' + PG_MATIERE; }
function pgLoad(){ try { return JSON.parse(localStorage.getItem(pgKey()) || '{}'); } catch(e){ return {}; } }
function pgSave(q, ok){
  try {
    var d = pgLoad(); var t = q.t;
    if (!d[t]) d[t] = { n: 0, q: {} };
    d[t].n = QUESTIONS.filter(function(x){ return x.t === t; }).length;
    if (!d[t].q) d[t].q = {};
    d[t].q[pgHash(q.q)] = ok ? 1 : 0;
    localStorage.setItem(pgKey(), JSON.stringify(d));
    pgResume();
  } catch(e) {}
}
function pgReset(){ if (!window.confirm('Réinitialiser la progression de cette matière ?')) return; try { localStorage.removeItem(pgKey()); } catch(e){} pgResume(); }
function pgResume(){
  var el = document.getElementById('pg-resume'); if (!el) return;
  var d = pgLoad(); var ans = 0, ok = 0;
  Object.keys(d).forEach(function(t){ var qq = (d[t] && d[t].q) || {}; Object.keys(qq).forEach(function(h){ ans++; if (qq[h]) ok++; }); });
  if (!ans) { el.style.display = 'none'; return; }
  var tot = QUESTIONS.length || 1;
  var pctA = Math.round(100 * Math.min(ans, tot) / tot);
  var pctR = Math.round(100 * ok / ans);
  var c = (2 * Math.PI * 14).toFixed(1);
  var col = pctR >= 70 ? '#4ade80' : (pctR >= 50 ? '#fbbf24' : '#f87171');
  el.style.display = 'flex';
  el.innerHTML = '<svg width=\"34\" height=\"34\" viewBox=\"0 0 34 34\" aria-hidden=\"true\"><circle cx=\"17\" cy=\"17\" r=\"14\" fill=\"none\" stroke=\"rgba(255,255,255,.30)\" stroke-width=\"5\"/><circle cx=\"17\" cy=\"17\" r=\"14\" fill=\"none\" stroke=\"' + col + '\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-dasharray=\"' + (c * pctA / 100).toFixed(1) + ' ' + c + '\" transform=\"rotate(-90 17 17)\"/></svg>'
    + '<span><b>' + ans + ' / ' + tot + '</b> questions répondues (' + pctA + ' %) · réussite <b style=\"color:' + col + '\">' + pctR + ' %</b></span>'
    + '<button class=\"pg-rz\" onclick=\"pgReset()\" title=\"Réinitialiser la progression de cette matière\">réinitialiser</button>';
}

function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  pgSave(state.qs[state.idx], i === state.qs[state.idx].a);
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {

        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de mathématiques</h2><p style="font-size:.9rem;margin-bottom:8px">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p><div style="margin:12px 0 0"><input type="text" id="prog-search" oninput="progSearchList(this.value)" placeholder="🔎 Rechercher dans les cours..." style="width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.9rem;font-family:inherit;outline:none"></div><div id="prog-search-results"></div>' + h + '</section>';
})();

// Recherche dans les cours
function progNorm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function progSearchList(q){
  var box = document.getElementById('prog-search-results'); if (!box) return;
  var raw = (q || '').trim();
  q = progNorm(raw);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var res = [];
  COURS_META.forEach(function(c){ if (progNorm((c.titre || '') + ' ' + (c.cours || '')).indexOf(q) !== -1) res.push(c); });
  var html = '';
  if (!res.length) html = '<p style="font-size:.85rem;color:#64748b;margin:6px 0 0">Aucun résultat pour « ' + esc(raw) + ' ».</p>';
  else {
    html = '<p style="font-size:.8rem;color:#4338ca;margin:10px 0 4px;font-weight:700">' + res.length + ' cours trouvé' + (res.length > 1 ? 's' : '') + ' :</p>';
    res.forEach(function(c){ html += '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">voir</span></button>'; });
  }
  box.innerHTML = html;
}

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">En début du cours selectionné, vous trouverez la « 🗂️ Fiche synthétique de cours » et le « 🧪 QCM ».</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
