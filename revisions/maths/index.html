{"t": "Produit scalaire (1re)", "q": "L'expression u→·v→ = xx′ + yy′ exige…", "c": ["des coordonnées entières", "un repère orthonormé", "des normes égales à 1", "des vecteurs colinéaires"], "a": 1, "e": "La formule coordonnées n'est valable qu'en repère ORTHONORMÉ (axes perpendiculaires, unités égales).", "d": "xx′ + yy′ n'est valable qu'en <b>repère orthonormé</b> : dans un repère quelconque (axes obliques), la formule est fausse.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi : la preuve s'appuie sur cos(θ) calculé via les normes ORTHOGONALES des axes. En repère oblique, ‖u→‖ ≠ √(x²+y²) non plus : toutes les formules du chapitre (norme, orthogonalité, angle) partagent cette exigence. Réflexe d'énoncé : repérer « orthonormé » AVANT d'utiliser xx′ + yy′.</div>"},
{"t": "Produit scalaire (1re)", "q": "Une force F→ déplace un objet selon D→. Le travail est nul si…", "c": ["D→ est petit", "F→ est perpendiculaire à D→", "F→ est petite", "F→ est parallèle à D→"], "a": 1, "e": "W = F→·D→ : nul si les vecteurs sont orthogonaux (toute la force est « perdue » perpendiculairement).", "d": "Travail = <b>F→·D→</b> : nul ⟺ <b>F→ ⊥ D→</b>.<div class='ex-detail'><u>Exemple rédigé</u> : image physique : porter un plateau à l'horizontale : la force (verticale, le poids soutenu) est perpendiculaire au déplacement (horizontal) : travail NUL. Le produit scalaire est né de cette question d'« efficacité » : seule la composante DANS la direction du mouvement travaille.</div>"},
{"t": "Produit scalaire (1re)", "q": "Al-Kashi avec Â = 90°. On retrouve…", "c": ["le théorème de Pythagore", "le produit scalaire nul", "la formule de la médiane", "le théorème de Thalès"], "a": 0, "e": "cos(90°) = 0 : a² = b² + c² : c'est Pythagore.", "d": "Â = 90° ⟹ cos(Â) = 0 ⟹ a² = b² + c² : <b>Pythagore</b>.<div class='ex-detail'><u>Exemple rédigé</u> : Al-Kashi est la GÉNÉRALISATION de Pythagore à tout triangle : le terme correctif −2bc·cos(Â) mesure l'écart à l'angle droit. Exemple : Â = 60° : a² &lt; b² + c² (l'angle est plus « fermé », le côté opposé plus court). Ce recadrage aide à retenir le signe : angle aigu ⟹ cos &gt; 0 ⟹ on RETRANCHE.</div>"},
{"t": "Variables aléatoires (1re)", "q": "Deux pièces. X = nombre de piles. P(X = 1) = ?", "c": ["3/4", "1/2", "1/4", "1/3"], "a": 1, "e": "X = 1 pour FP ou PF : 2 issues sur 4 : 1/2.", "d": "Univers {FF, FP, PF, PP} : X = 1 pour FP ET PF : P = <b>2/4 = 1/2</b>.<div class='ex-detail'><u>Exemple rédigé</u> : loi complète : P(X=0) = 1/4, P(X=1) = 1/2, P(X=2) = 1/4 : total 1 ✓. Piège : « 1/3 » : il y a bien 3 VALEURS de X, mais elles ne sont pas équiprobables : les PROBABILITÉS ne se répartissent pas uniformément entre les valeurs. Toujours revenir aux ISSUES.</div>"},
{"t": "Variables aléatoires (1re)", "q": "E(X) = Σ…", "c": ["x_i/p_i", "x_i + p_i", "p_i²", "x_i·p_i"], "a": 3, "e": "E(X) = somme des (valeur × probabilité) : moyenne pondérée.", "d": "<b>E(X) = Σ x_i·p_i</b> : chaque valeur pondérée par sa probabilité.<div class='ex-detail'><u>Exemple rédigé</u> : pour la loi (−2 ; 0,5) et (3 ; 0,5) : E = −1 + 1,5 = 0,5 : une MOYENNE PONDÉRÉE. Piège : « x_i + p_i » additionnerait des objets de natures différentes (des euros et des probabilités). L'espérance a la même unité que les valeurs de X : des €, des points, des kg…</div>"},
{"t": "Variables aléatoires (1re)", "q": "Jeu : mise 2 €, pile ⟺ reçoit 5 €, sinon rien. Gain net : pile +3, face −2. E(G) = ?", "c": ["0,5 € (favorable)", "0 € (équitable)", "−0,5 € (défavorable)", "1,5 €"], "a": 0, "e": "E = 0,5×3 + 0,5×(−2) = 0,5 € > 0 : favorable au joueur.", "d": "E(G) = 3×0,5 + (−2)×0,5 = <b>+0,50 €</b> : E &gt; 0 ⟹ <b>favorable au joueur</b>.<div class='ex-detail'><u>Exemple rédigé</u> : lecture concrète : sur 100 parties, le joueur gagne en moyenne ≈ 50 €. Piège : « 1,5 € » oublierait la moitié « face » ; travailler en gains NETS (5 − 2 = 3, pas 5) est LE réflexe : la mise est TOUJOURS déduite.</div>"},
{"t": "Variables aléatoires (1re)", "q": "V(X) = ?", "c": ["Σ p_i·x_i", "E(X)²", "Σ p_i·(x_i − E(X))²", "σ(X)"], "a": 2, "e": "Variance : moyenne pondérée des ÉCARTS AU CARRÉ à l'espérance.", "d": "<b>V(X) = Σ p_i(x_i − E(X))²</b> : la dispersion autour de la moyenne.<div class='ex-detail'><u>Exemple rédigé</u> : pour G : écarts 3 − 0,5 = 2,5 et −2 − 0,5 = −2,5 : V = 0,5×6,25 + 0,5×6,25 = 6,25, σ = 2,5 € : typiquement ±2,50 € par partie. Piège : « E(X)² » confond variance et carré de l'espérance (V = E(X²) − E(X)² : les deux coïncident rarement).</div>"},
{"t": "Variables aléatoires (1re)", "q": "V(2X + 3) = ?", "c": ["4V(X)", "2V(X)", "4V(X) + 3", "2V(X) + 3"], "a": 0, "e": "V(aX + b) = a²V(X) : le coefficient se met au carré, la constante disparaît.", "d": "<b>V(2X + 3) = 4V(X)</b> : a = 2 se met AU CARRÉ, b = 3 disparaît.<div class='ex-detail'><u>Exemple rédigé</u> : intuition : ajouter 3 ne change pas la DISPERSION (tout est décalé pareillement) ; multiplier par 2 double les écarts, donc ×4 les écarts AU CARRÉ. Comparer : E(2X+3) = 2E(X)+3 : le b, lui, RESTE dans l'espérance. Piège : « 2V(X) + 3 » cumule les deux erreurs.</div>"},
{"t": "Variables aléatoires (1re)", "q": "Une loi de probabilité correcte exige…", "c": ["Σ p_i = 1", "E(X) = 0", "des valeurs positives", "des probabilités toutes égales"], "a": 0, "e": "La somme des probabilités doit valoir 1 (ni plus, ni moins).", "d": "Le contrôle indispensable : <b>Σ p_i = 1</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les probabilités n'ont PAS besoin d'être égales (P(X=1) = 1/2 contre 1/4 pour les autres valeurs du lancer double : légitime) ; les VALEURS peuvent être négatives (gains nets). Seule la somme 1 est non négociable : un tableau dont le total vaut 0,95 ou 1,1 est faux à coup sûr — c'est le premier réflexe de correction.</div>"},
{"t": "Variables aléatoires (1re)", "q": "L'espérance d'une variable aléatoire X est…", "c": ["le milieu des valeurs", "toujours une valeur prise par X", "la valeur la plus probable", "une moyenne pondérée, pas forcément atteinte"], "a": 3, "e": "E(X) est une moyenne : elle peut très bien ne correspondre à aucune valeur de X.", "d": "L'espérance est <b>une moyenne pondérée</b>, PAS forcément une valeur de X.<div class='ex-detail'><u>Exemple rédigé</u> : X = nombre de piles sur 2 lancers : E(X) = 0×1/4 + 1×1/2 + 2×1/4 = 1 : atteinte, ici. Mais pour G (3 ou −2, p = 1/2) : E = 0,5 € : AUCUNE partie ne rapportera exactement 0,50 €. L'espérance décrit le LONG TERME (loi des grands nombres), pas une partie individuelle. Piège : la valeur la plus probable s'appelle le MODE : autre notion.</div>"},
{"t": "Variables aléatoires (1re)", "q": "σ(X) = 2,5 et V(X) = ?", "c": ["√2,5", "6,25", "5", "2,5"], "a": 1, "e": "V = σ² = 2,5² = 6,25.", "d": "<b>V(X) = σ(X)² = 6,25</b> : l'écart type est la racine de la variance.<div class='ex-detail'><u>Exemple rédigé</u> : les deux conversions : σ = 2,5 ⟹ V = 6,25 ; V = 6,25 ⟹ σ = 2,5. Piège : 5 = 2×2,5 : la relation est un CARRE, pas un doublement. Unités : V en unités² (€²), σ en unités (€) : comme pour la physique, c'est l'écart type qui « parle » dans l'unité des données.</div>"},
{"t": "Variables aléatoires (1re)", "q": "Deux jeux : même espérance +10 €, σ_A = 2 € et σ_B = 20 €. Lequel préfère-t-on en général ?", "c": ["A (même gain moyen, moins de risque)", "B (plus de suspense)", "Impossible de choisir", "Les deux pareils"], "a": 0, "e": "À espérance égale, la moindre variance (σ_A) offre le même gain moyen avec moins de risque.", "d": "On préfère <b>A</b> : même gain moyen, dispersion réduite : le résultat est plus fiable partie après partie.<div class='ex-detail'><u>Exemple rédigé</u> : typiquement : A = gain quasi constant de ≈ 10 € ; B = souvent −30 €, parfois +50 € : la MOYENNE est identique, mais le trajet de B est une montagne russe. C'est exactement la logique d'un portefeuille d'investissement : à rendement égal, on choisit le risque le plus faible. L'espérance seule ne suffit jamais à décrire un jeu.</div>"},
{"t": "Variables aléatoires (1re)", "q": "E(aX + b) = ?", "c": ["aE(X)", "aE(X) + b", "E(X) + b", "a²E(X) + b"], "a": 1, "e": "Linéarité de l'espérance : E(aX + b) = a·E(X) + b.", "d": "<b>E(aX + b) = aE(X) + b</b> : les deux coefficients passent TELS QUELS dans l'espérance.<div class='ex-detail'><u>Exemple rédigé</u> : application classique : un forfait de 5 € (b) et un gain triplé (a = 3) : E(3X + 5) = 3E(X) + 5. À comparer avec la variance : V(aX + b) = a²V(X) : SEULE l'espérance est « purement linéaire » : le carré de la variance mesure la propagation de l'aléa. Piège : « a²E(X) + b » mélange les deux formules.</div>"},
{"t": "Suites et limites (Terminale)", "q": "Une suite croissante et majorée est…", "c": ["convergente", "divergente vers +∞", "alternée", "constante"], "a": 0, "e": "Théorème de convergence monotone : croissante + majorée ⟹ converge (vers une limite ≤ majorant).", "d": "<b>Croissante et majorée ⟹ convergente</b> (théorème de convergence monotone).<div class='ex-detail'><u>Exemple rédigé</u> : u_n = 1 − 1/n : croissante (chaque cran ajoute du positif) et majorée par 1 : converge vers 1. Contre-exemple : u_n = n : croissante mais NON majorée : diverge vers +∞. Piège : « croissante ⟹ +∞ » : seule la croissance ne suffit PAS : c'est l'absence de majorant qui fait diverger. Ce théorème est la base de la preuve de convergence des suites récurrentes.</div>"},
{"t": "Suites et limites (Terminale)", "q": "lim (3n² + 2n − 1)/(n² + 5) quand n → +∞ = ?", "c": ["5", "2", "0", "3"], "a": 3, "e": "Rapport des termes dominants : 3n²/n² = 3.", "d": "<b>3</b> : limite = rapport des coefficients des termes de plus haut degré.<div class='ex-detail'><u>Exemple rédigé</u> : justification par factorisation : n²(3 + 2/n − 1/n²)/(n²(1 + 5/n²)) : les 2/n, 1/n², 5/n² s'évanouissent, reste 3/1. Piège : additionner 3+2+... rien de tel : chaque terme NON dominant disparaît, pas les coefficients principaux. Généralisation : (anᵏ + …)/(bnᵏ + …) → a/b ; degrés différents : 0 (num. plus petit) ou ±∞ (num. plus grand).</div>"},
{"t": "Suites et limites (Terminale)", "q": "q = 1/2. La suite u_n = 5×(1/2)ⁿ tend vers…", "c": ["+∞", "0", "5", "1"], "a": 1, "e": "|q| < 1 : qⁿ → 0, donc u_n → 0.", "d": "|q| = 1/2 &lt; 1 ⟹ (1/2)ⁿ → 0 ⟹ u_n → <b>0</b>.<div class='ex-detail'><u>Exemple rédigé</u> : intuition : 5 ; 2,5 ; 1,25 ; 0,625… on divise sans cesse par 2 : on s'écrase vers 0. Comparaison : q &gt; 1 : qⁿ EXPLOSE (+∞) ; q = 1 : constante. Piège : « 5 » confond la valeur de départ avec la limite : le facteur u_0 = 5 est multiplié par quelque chose de plus en plus PETIT : le produit s'annule. Application : demi-vie, amortissements.</div>"},
{"t": "Suites et limites (Terminale)", "q": "u_n = (−1)ⁿ. Cette suite…", "c": ["converge vers 1", "converge vers 0", "diverge, mais reste bornée", "tend vers +∞"], "a": 2, "e": "Elle oscille entre −1 et 1 sans s'approcher d'aucune valeur : pas de limite (divergence), mais bornée.", "d": "(−1)ⁿ : −1, 1, −1, 1… : <b>pas de limite (divergence) bien que bornée</b> (par −1 et 1).<div class='ex-detail'><u>Exemple rédigé</u> : définition de la limite : tout intervalle autour de ℓ doit contenir TOUS les termes à partir d'un rang : ici, toute limite candidate ℓ est trahie par les termes alternés (distance 2 entre −1 et 1 : aucun resserrement). Moralité : bornée ≠ convergente : la convergence monotone exige majorée ET MONOTONE. Les suites géométriques à raison négative héritent de cette oscillation.</div>"},
{"t": "Suites et limites (Terminale)", "q": "2 − 1/n ≤ w_n ≤ 2 + 1/n. Que peut-on conclure ?", "c": ["w_n → 0", "w_n est constante", "w_n → 2 (gendarmes)", "Rien"], "a": 2, "e": "Encadrement entre deux suites de limite 2 : w_n → 2.", "d": "<b>w_n → 2</b> : c'est le théorème des GENDARMES : coincée entre 2 − 1/n et 2 + 1/n, toutes deux → 2.<div class='ex-detail'><u>Exemple rédigé</u> : cas typique : w_n = 2 + (−1)ⁿ/n : l'oscillation (−1)ⁿ/n est neutralisée par l'encadrement ±1/n : les gendarmes « étranglent » la suite vers 2. Piège : « rien » : l'encadrement est justement l'OUTIL qui conclut ; sans gendarmes, une suite oscillante reste impénétrable.</div>"},
{"t": "Suites et limites (Terminale)", "q": "Une récurrence exige…", "c": ["seulement l'initialisation", "seulement l'hérédité", "initialisation ET hérédité", "une vérification sur n = 0 seulement"], "a": 2, "e": "Les deux étapes, puis la conclusion « pour tout n » : rien d'autre ne prouve P(n).", "d": "Récurrence = <b>initialisation (P(0)) + hérédité (P(n) ⟹ P(n+1))</b> + conclusion.<div class='ex-detail'><u>Exemple rédigé</u> : l'hérédité seule prouve « P(n) ⟹ P(n+1) » mais SANS point de départ : P pourrait être fausse partout (une rangée de dominos prête à tomber… sans premier domino) ; l'initialisation seule prouve un seul rang. Les deux ensembles : tous les dominos tombent. La rédaction type est notée : ces trois phrases dans l'ordre.</div>"},
{"t": "Suites et limites (Terminale)", "q": "u_{n+1} = 2u_n + 1, u_0 = 1. Formule conjecturée : u_n = 2^{n+1} − 1. L'hérédité suppose…", "c": ["u_{n+1} directement sans hypothèse", "que la suite est croissante", "u_n = 2^{n+1} − 1 et calcule u_{n+1}", "que u_0 = 1 suffit"], "a": 2, "e": "On SUPPOSE P(n) (la formule au rang n) et on DÉMONTRE P(n+1) en l'utilisant.", "d": "Hérédité : <b>supposer u_n = 2^{n+1} − 1</b>, puis calculer u_{n+1} = 2(2^{n+1} − 1) + 1 = 2^{n+2} − 1 = formule au rang n+1 ✓.<div class='ex-detail'><u>Exemple rédigé</u> : la logique : « SI la formule vaut au rang n, ALORS elle vaut au rang n+1 » : l'hypothèse de récurrence s'UTILISE dans le calcul (on remplace u_n par la formule). Piège rédactionnel : « calculer u_{n+1} directement » sans hypothèse : impossible, la relation relie u_{n+1} à u_n. Toujours écrire « Supposons P(n) pour un entier n ≥ 0 ».</div>"},
{"t": "Suites et limites (Terminale)", "q": "Si une suite converge vers ℓ, elle…", "c": ["a une limite UNIQUE", "est forcément monotone", "diverge forcément", "peut avoir deux limites"], "a": 0, "e": "Unicité de la limite : une suite convergente a exactement une limite.", "d": "<b>Une limite UNIQUE</b> : si u_n → ℓ et u_n → ℓ′, alors ℓ = ℓ′ (preuve par encadrement : à partir d'un rang, |ℓ − ℓ′| ≤ ε pour tout ε : contradiction sinon).<div class='ex-detail'><u>Exemple rédigé</u> : cette unicité est un OUTIL de preuve : pour montrer qu'une limite vaut 3, on peut encadrer de deux façons différentes. Contre-exemple de monotonie : (−1)ⁿ/n converge vers 0 sans être monotone (elle oscille en s'amortissant) : convergence ⇏ monotonie : seule la réciproque partielle (monotone + bornée ⟹ converge) tient.</div>"},
{"t": "Suites et limites (Terminale)", "q": "nⁿ, n!, 2ⁿ, n² : la croissance la plus rapide à l'infini ?", "c": ["n!", "n²", "2ⁿ", "nⁿ"], "a": 3, "e": "Hiérarchie : n² ≪ 2ⁿ ≪ n! ≪ nⁿ.", "d": "<b>nⁿ</b> : hiérarchie des croissances : nᵏ ≪ aⁿ ≪ n! ≪ nⁿ.<div class='ex-detail'><u>Exemple rédigé</u> : test n = 10 : n² = 100, 2ⁿ = 1024, n! = 3 628 800, nⁿ = 10 milliards. Les échelles : n² polynomial, 2ⁿ exponentiel, n! factoriel, nⁿ le sommet. Application : dans une limite de quotient, le terme le plus fort l'emporte : lim n!/nⁿ = 0. Piège : croire que 2ⁿ « croît plus vite que tout » : battu par n! (chaque facteur de n! finit par dépasser 2).</div>"},
{"t": "Suites et limites (Terminale)", "q": "Une suite décroissante et minorée par 0…", "c": ["converge vers 0 exactement", "est alternée", "diverge vers −∞", "converge vers une limite ≥ 0"], "a": 3, "e": "Décroissante + minorée ⟹ converge, et sa limite est ≥ 0 (le minorant).", "d": "<b>Converge</b>, vers une limite ℓ ≥ 0 (≥ minorant).<div class='ex-detail'><u>Exemple rédigé</u> : u_n = 1 + 1/n : décroissante, minorée par 0 : converge vers 1 ≥ 0 ✓. Nuance : la limite n'est PAS forcément 0 : elle est simplement au-dessus du minorant (ici 1). Piège : « converge vers 0 » : seul le cas limite = minorant donne 0 (ex. 1/n : minorée par 0, limite 0). Le théorème garantit l'EXISTENCE de la limite, pas sa valeur : un calcul séparé la trouve.</div>"},
{"t": "Limites de fonctions (Terminale)", "q": "lim x→+∞ de (2x + 1)/(x − 3) = ?", "c": ["2", "−1", "3", "+∞"], "a": 0, "e": "Rapport des dominants : 2x/x = 2 (asymptote horizontale y = 2).", "d": "<b>2</b> : limite = rapport des termes dominants (2x/x), asymptote horizontale y = 2.<div class='ex-detail'><u>Exemple rédigé</u> : justification : (2x+1)/(x−3) = (2 + 1/x)/(1 − 3/x) : les 1/x et 3/x s'évanouissent : 2/1. Piège : « +∞ » : les DEUX polynômes ont le même degré : ils s'équilibrent ; ce n'est que si le numérateur domine (x²/(x−3)) que la limite explose.</div>"},
{"t": "Limites de fonctions (Terminale)", "q": "f(x) = (2x+1)/(x−3). En x = 3, la courbe admet…", "c": ["une asymptote horizontale y = 3", "un maximum", "une asymptote verticale x = 3", "un point d'inflexion"], "a": 2, "e": "Dénominateur nul, numérateur 7 ≠ 0 : f → ±∞ : asymptote verticale x = 3.", "d": "En x = 3 : dénominateur → 0, numérateur → 7 : f → ±∞ ⟹ <b>asymptote verticale x = 3</b>.<div class='ex-detail'><u>Exemple rédigé</u> : précision utile au contrôle : x → 3⁺ : f → +∞ ; x → 3⁻ : f → −∞ (signe du dénominateur) : la courbe « fuit » la droite de chaque côté, en sens opposés. Condition à vérifier : le numérateur NON NUL en 3 (sinon : simplification possible, pas d'asymptote : ex. (x−3)/(x−3) = 1).</div>"},
{"t": "Limites de fonctions (Terminale)", "q": "lim x→+∞ de e^x/x² = ?", "c": ["e²", "+∞", "0", "1"], "a": 1, "e": "L'exponentielle domine toute puissance : +∞.", "d": "<b>+∞</b> : croissance comparée : e^x ≫ xⁿ pour tout n.<div class='ex-detail'><u>Exemple rédigé</u> : hiérarchie à retenir : ln x ≪ xᵏ ≪ e^x. Test numérique : x = 10 : e¹⁰ ≈ 22 026 contre 100 ; x = 20 : e²⁰ ≈ 485 millions contre 400 : l'écart se creuse sans fin. Applications : lim e^x/x = +∞ ; lim x²e^{−x} = 0 (produit par l'inverse). Piège : croire qu'un polynôme « rattrape » l'exponentielle : jamais à l'infini.</div>"},
{"t": "Limites de fonctions (Terminale)", "q": "lim x→0⁺ de x·ln x = ?", "c": ["+∞", "0", "−∞", "1"], "a": 1, "e": "Croissance comparée en 0 : x·ln x → 0 (le logarithme s'effondre plus vite que x ne disparaît).", "d": "<b>0</b> : résultat à connaître : x·ln x → 0 quand x → 0⁺ (forme 0×(−∞) levée par croissance comparée).<div class='ex-detail'><u>Exemple rédigé</u> : intuition : x = 0,01 : 0,01×(−4,6) = −0,046 ; x = 0,0001 : 0,0001×(−9,2) ≈ −0,00092 : le produit tend vers 0 par valeurs négatives. Justification par substitution X = 1/x → +∞ : x ln x = −ln X/X → 0. Piège : « −∞ » : le ln s'effondre, mais le facteur x l'écrase : c'est x qui gagne.</div>"},
{"t": "Limites de fonctions (Terminale)", "q": "lim x→+∞ de √(x² + x) − x = ?", "c": ["0", "−1/2", "+∞", "1/2"], "a": 3, "e": "Quantité conjuguée : x/(√(x²+x)+x) → 1/2.", "d": "<b>1/2</b> : ∞−∞ levée par le CONJUGUÉ : (√(x²+x)−x) = x/(√(x²+x)+x) = 1/(√(1+1/x)+1) → 1/2.<div class='ex-detail'><u>Exemple rédigé</u> : la technique : multiplier par (√(x²+x)+x)/(√(x²+x)+x) : le numérateur devient (x²+x) − x² = x (identité (a−b)(a+b) = a²−b²) : l'indétermination disparaît. Test : x = 100 : √10100 − 100 ≈ 100,5 − 100 = 0,5 ✓. Piège : « 0 » : les deux termes de ∞−∞ se rapprochent… mais PAS jusqu'à s'annuler.</div>"},
{"t": "Limites de fonctions (Terminale)", "q": "La droite y = ax + b est asymptote oblique à Cf si…", "c": ["f coupe y = ax+b", "lim [f(x) − (ax + b)] = 0 en ±∞", "les pentes sont égales", "lim f(x) = ax + b"], "a": 1, "e": "L'ÉCART entre la courbe et la droite tend vers 0.", "d": "<b>lim [f(x) − (ax+b)] = 0</b> en ±∞ : la courbe se COLLE à la droite.<div class='ex-detail'><u>Exemple rédigé</u> : exemple : f(x) = (x²+1)/x = x + 1/x : f(x) − x = 1/x → 0 : y = x asymptote oblique en ±∞. La courbe peut CROISER son asymptote (par exemple plusieurs fois) : la définition ne l'interdit pas : seul l'écart à l'infini compte. Piège : « les pentes égales » : une droite de même pente mais décalée n'est pas asymptote.</div>"},
{"t": "Limites de fonctions (Terminale)", "q": "lim x→−∞ de e^{−x} = ?", "c": ["0", "1", "+∞", "−∞"], "a": 2, "e": "−x → +∞ quand x → −∞ : e^{−x} → +∞.", "d": "x → −∞ ⟹ −x → +∞ ⟹ e^{−x} → <b>+∞</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'exponentielle « inverse son camp » : e^{−x} → 0 en +∞ mais → +∞ en −∞. Test : x = −10 : e¹⁰ ≈ 22 026 ✓. Piège : répondre 0 par réflexe « exponentielle décroissante » : la décroissance de e^{−x} l'emmène de +∞ (à gauche) vers 0 (à droite) : chaque direction a SA limite. Règle : e^X → +∞ si X → +∞, quel que soit le X en fonction de x.</div>"},
{"t": "Limites de fonctions (Terminale)", "q": "lim x→+∞ de ln x/x = ?", "c": ["+∞", "0", "−∞", "1"], "a": 1, "e": "ln x ≪ x : le quotient tend vers 0.", "d": "<b>0</b> : le logarithme croît INFINIMENT plus lentement que x.<div class='ex-detail'><u>Exemple rédigé</u> : test : x = 10⁶ : ln(10⁶)/10⁶ ≈ 13,8/1 000 000 ≈ 0,0000138 : déjà écrasé. Généralisation : ln x/xᵃ → 0 pour tout a &gt; 0. Application : étude de f(x) = (ln x)/x : f(x) → 0 en +∞, maximum en x = e (f(e) = 1/e). Piège : « +∞ » : le numérateur tend vers +∞, mais INFINIMENT plus lentement : la hiérarchie ln x ≪ xᵏ ≪ e^x tranche TOUS ces quotients.</div>"},
{"t": "Limites de fonctions (Terminale)", "q": "x² − 3x quand x → +∞ : la forme indéterminée est…", "c": ["∞−∞ : factoriser par x²", "aucune : directement +∞", "∞/∞ : règle du dominant au dénominateur", "0×∞"], "a": 0, "e": "∞−∞ : factoriser x²(1 − 3/x) → +∞.", "d": "Forme <b>∞−∞</b> : on FACTORISE : x² − 3x = x²(1 − 3/x) : le facteur (1 − 3/x) → 1 et x² → +∞ : limite <b>+∞</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'erreur à éviter : « +∞ − ∞ = 0 » ou « = +∞ toujours » : SANS factorisation, on ne peut pas conclure : √(x²+x) − x donnait 1/2 ! La factorisation du terme dominant est LA réponse universelle aux polynômes. Le degré le plus haut (ici 2) commande : la limite est celle du monôme dominant.</div>"},
{"t": "Limites de fonctions (Terminale)", "q": "Asymptote horizontale de f(x) = 1/x² :", "c": ["x = 0", "y = 0 en +∞ ET en −∞", "y = 0 seulement en +∞", "n'existe pas"], "a": 1, "e": "1/x² → 0 en +∞ et en −∞ : l'axe des abscisses est asymptote des deux côtés.", "d": "1/x² → 0 des DEUX côtés : y = 0 (axe des abscisses) asymptote en <b>+∞ et −∞</b>.<div class='ex-detail'><u>Exemple rédigé</u> : à comparer avec 1/x : → 0 aussi des deux côtés (y = 0 asymptote des deux côtés aussi), MAIS avec des comportements différents en 0 : 1/x → +∞ à droite, −∞ à gauche ; 1/x² → +∞ DES DEUX côtés de 0 : asymptote verticale « symétrique ». Réflexe : une fonction peut avoir des asymptotes HORIZONTALES à chaque infini, éventuellement différentes ((e^x)/(e^x+1) : 1 en +∞, 0 en −∞).</div>"},
{"t": "Continuité et TVI (Terminale)", "q": "Toute fonction dérivable est…", "c": ["continue", "discontinue", "bijective", "strictement croissante"], "a": 0, "e": "Dérivable ⟹ continue ; réciproque fausse (|x| en 0).", "d": "<b>Dérivable ⟹ continue</b> ; la réciproque est FAUSSE : |x| est continue en 0 mais non dérivable (« coin » : pentes −1 puis +1).<div class='ex-detail'><u>Exemple rédigé</u> : intuition : la dérivabilité dit que la courbe a une tangente (donc pas de « trou » ni de saut) : la continuité s'ensuit ; le contraire ne va pas : un point « lisse mais anguleux » peut se tracer sans lever le stylo sans admettre UNE tangente. Hiérarchie : dérivable ⊂ continue ⊂ définie.</div>"},
{"t": "Continuité et TVI (Terminale)", "q": "f continue sur [a ; b], f(a) = −1, f(b) = 3. Le TVI garantit que f(x) = 0…", "c": ["a exactement une solution", "a exactement trois solutions", "n'a pas de solution", "a AU MOINS une solution dans [a ; b]"], "a": 3, "e": "0 ∈ [−1 ; 3] ⟹ il existe c tel que f(c) = 0 : AU MOINS une solution.", "d": "0 est compris entre f(a) = −1 et f(b) = 3 : le TVI garantit <b>au moins une</b> solution.<div class='ex-detail'><u>Exemple rédigé</u> : le TVI donne l'EXISTENCE, jamais le NOMBRE : la courbe peut couper l'axe 1 fois… ou 5 fois : tout ce qu'on sait, c'est qu'elle y passe. Pour l'UNICITÉ, il faut la STRICTE monotonie (corollaire). Piège : « exactement une » : sans monotonie, rien ne l'assure. Rédaction : citer la continuité AVANT d'invoquer le théorème.</div>"},
{"t": "Continuité et TVI (Terminale)", "q": "f continue, f(a)·f(b) < 0 et f STRICTEMENT croissante sur [a ; b]. f(x) = 0 a…", "c": ["aucune solution", "exactement f(a) solutions", "exactement une solution", "au moins deux"], "a": 2, "e": "TVI : existence ; stricte croissance : unicité ⟹ exactement une racine α ∈ [a ; b].", "d": "<b>Exactement une</b> : le TVI (existence) + la stricte monotonie (unicité) : le corollaire complet.<div class='ex-detail'><u>Exemple rédigé</u> : exemple : x³ + x − 1 sur [0 ; 1] : f′ = 3x² + 1 &gt; 0 (strictement croissante), f(0) = −1, f(1) = 1 : une unique solution ≈ 0,68. Piège : « strictement » est indispensable : croissante « au sens large » avec un plateau sur l'axe (f nulle sur tout un intervalle) donnerait une infinité de racines.</div>"},
{"t": "Continuité et TVI (Terminale)", "q": "La fonction partie entière E(x) (saut de 1 à 2 sans passer par 1,5) illustre…", "c": ["la dérivabilité partout", "la continuité", "une bijection", "un échec du TVI faute de continuité"], "a": 3, "e": "E saute des valeurs : sans continuité, le TVI ne s'applique pas.", "d": "La partie entière <b>SAUTE</b> de 1 à 2 : jamais 1,5 : le TVI échoue faute de <b>continuité</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le rôle des hypothèses : E(1) = 1, E(2) = 2, et pourtant aucune valeur entre : la courbe est un « escalier ». Moralité : chaque hypothèse d'un théorème EXISTE pour quelque chose : la continuité du TVI garantit le passage par toutes les hauteurs ; sans elle, tout permis. C'est l'exemple-type à citer dans une question de cours.</div>"},
{"t": "Continuité et TVI (Terminale)", "q": "f(x) = x³ + x − 1. f(0) et f(1) valent…", "c": ["−1 et 1 : changement de signe", "1 et −1", "0 et 2", "2 et 3"], "a": 0, "e": "f(0) = −1, f(1) = 1 : la racine est entre 0 et 1.", "d": "f(0) = <b>−1</b> &lt; 0 ; f(1) = <b>1</b> &gt; 0 : changement de signe ⟹ racine dans [0 ; 1] (TVI, f polynôme donc continue, et strictement croissante : unique).<div class='ex-detail'><u>Exemple rédigé</u> : le changement de signe entre deux bornes est LE déclencheur de l'exercice type « montrer que l'équation admet une solution » : la rédaction complète : ① f continue (polynôme) ; ② f(0)·f(1) &lt; 0 ; ③ f strictement croissante (f′ = 3x² + 1 &gt; 0) ; ④ donc une unique solution. Dichotomie : α ∈ [0,5 ; 0,75] au bout de deux étapes.</div>"},
{"t": "Continuité et TVI (Terminale)", "q": "La dichotomie encadre la racine de x³+x−1 : f(0,5) ≈ −0,375, f(0,75) ≈ 0,172. Après ces deux étapes, α ∈ ?", "c": ["[0 ; 0,5]", "[0,5 ; 0,75]", "[0,75 ; 1]", "[0,6 ; 0,7]"], "a": 1, "e": "f(0,5) < 0 < f(0,75) : le changement de signe est entre 0,5 et 0,75.", "d": "Le changement de signe (négatif → positif) est entre 0,5 et 0,75 : <b>α ∈ [0,5 ; 0,75]</b> (amplitude 0,25).<div class='ex-detail'><u>Exemple rédigé</u> : mécanique de la dichotomie : ① couper l'intervalle en deux ; ② évaluer au milieu ; ③ GARDER la moitié qui contient le changement de signe. Efficacité : l'amplitude est DIVISÉE par 2 à chaque étape : pour 0,001 de précision depuis [0 ; 1] : 10 étapes (2⁻¹⁰ ≈ 0,001). Piège : choisir la moitié où f garde le signe : c'est l'autre qui contient la racine.</div>"},
{"t": "Continuité et TVI (Terminale)", "q": "f(x) = x² + 1 si x < 2 ; 5 si x ≥ 2. Continuité en 2 :", "c": ["discontinue (saut de 2)", "impossible à déterminer", "continue : limite à gauche = f(2) = 5", "continue car polynôme"], "a": 2, "e": "lim x→2⁻ (x²+1) = 5 = f(2) : continue.", "d": "Limite à gauche : 2² + 1 = 5 ; f(2) = 5 : <b>continue en 2</b>.<div class='ex-detail'><u>Exemple rédigé</u> : méthode pour les fonctions par morceaux : à CHAQUE jonction, comparer limite à gauche, limite à droite et valeur. Contre-exemple : si le second morceau était 7 : saut de 2 : discontinue (la courbe aurait un « trou sauté »). Piège : « polynôme donc continue » : CHAQUE branche est polynôme, mais la CONTINUITÉ GLOBALE se joue aux jonctions uniquement.</div>"},
{"t": "Continuité et TVI (Terminale)", "q": "La fonction valeur absolue |x| en 0 est…", "c": ["ni l'une ni l'autre", "continue mais non dérivable", "dérivable et continue", "dérivable mais non continue"], "a": 1, "e": "Le « coin » en 0 : continue (pas de trou) mais pas de tangente unique.", "d": "<b>Continue mais non dérivable en 0</b> : à gauche pente −1, à droite pente +1 : aucune tangente unique.<div class='ex-detail'><u>Exemple rédigé</u> : calcul : (|h| − 0)/h vaut −1 pour h &lt; 0 et +1 pour h &gt; 0 : le taux d'accroissement n'a pas de limite : pas dérivable. Mais lim |x| = 0 = |0| : continue ✓. C'est LE contre-exemple de la réciproque « dérivable ⟹ continue ». Autres exemples : x^(1/3) (tangente verticale en 0), les fonctions en escalier.</div>"},
{"t": "Continuité et TVI (Terminale)", "q": "f continue sur [2 ; 5], f(2) = 1, f(5) = 4. Le TVI garantit que 2,5 est atteint…", "c": ["exactement une fois", "au moins une fois", "seulement en x = 3,5", "jamais"], "a": 1, "e": "2,5 ∈ [1 ; 4] = [f(2) ; f(5)] : la valeur 2,5 est atteinte au moins une fois.", "d": "2,5 est compris entre f(2) = 1 et f(5) = 4 ⟹ il existe c ∈ [2 ; 5] avec f(c) = 2,5 : <b>au moins une fois</b>.<div class='ex-detail'><u>Exemple rédigé</u> : lecture image du TVI : la courbe, allant de la hauteur 1 à la hauteur 4, passe nécessairement par toutes les hauteurs intermédiaires (2,5 compris) — c'est le « sans lever le stylo ». Piège : « exactement une fois » : la courbe peut onduler et repasser par 2,5 plusieurs fois : sans monotonie, rien à faire. Le TVI est un théorème d'EXISTENCE, pas de comptage.</div>"},
{"t": "Continuité et TVI (Terminale)", "q": "f continue et strictement décroissante sur [a ; b], f(a) = 3, f(b) = −2. L'équation f(x) = 0 a…", "c": ["une solution si k > 0", "deux solutions", "une unique solution", "aucune solution"], "a": 2, "e": "0 ∈ [−2 ; 3] et décroissance stricte : exactement une solution.", "d": "0 entre f(b) = −2 et f(a) = 3, et f strictement MONOTONE ⟹ <b>une unique solution</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la décroissance fonctionne aussi bien que la croissance pour le corollaire : ce qui compte est la STRICTE monotonie (un seul passage par chaque hauteur). Rédaction adaptée : « f est continue et strictement décroissante sur [a ; b] ; f(a) = 3 &gt; 0 et f(b) = −2 &lt; 0 ; d'après le corollaire du TVI, f(x) = 0 admet une unique solution sur [a ; b] ». Piège : le signe du changement importe peu : c'est l'ENCADREMENT de 0 par f(a) et f(b) qui compte.</div>"},
{"t": "Intégrales (Terminale)", "q": "F est une primitive de f si…", "c": ["F = f", "f′ = F", "F′ = f", "F·f = 1"], "a": 2, "e": "F′ = f : la dérivée de la primitive redonne la fonction.", "d": "<b>F′ = f</b> : dériver F redonne f. Toutes les primitives diffèrent d'une constante k.<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = 2x : F(x) = x² + k, pour TOUT k : F′ = 2x ✓. C'est pourquoi une intégrale DÉFINIE ne dépend pas de k : F(b) + k − (F(a) + k) = F(b) − F(a). Piège : « F = f » serait l'identité, pas la primitive ; « f′ = F » est la définition de la DÉRIVÉE, l'opération inverse.</div>"},
{"t": "Intégrales (Terminale)", "q": "Primitive de f(x) = 3x² + 2x − 5 ?", "c": ["x³ + x² − 5x", "x³ + x² − 5", "3x³ + 2x² − 5x", "6x + 2"], "a": 0, "e": "Terme à terme : x³ + x² − 5x (+ k) : en dérivant on retrouve 3x² + 2x − 5.", "d": "<b>x³ + x² − 5x + k</b> : chaque exposant monte de 1, chaque coefficient se divise par le nouvel exposant.<div class='ex-detail'><u>Exemple rédigé</u> : vérification : (x³ + x² − 5x)′ = 3x² + 2x − 5 ✓. Pièges : « 3x³ » ne divise pas par 3 ; « 6x + 2 » est la DÉRIVÉE (opération à l'envers) ; « −5 » garde le terme constant… la primitive d'une constante −5 est −5x : le x manque. Réflexe : TOUJOURS redériver mentalement.</div>"},
{"t": "Intégrales (Terminale)", "q": "∫₀² (3x² + 2x − 5) dx = ?", "c": ["−2", "0", "2", "4"], "a": 2, "e": "F(x) = x³ + x² − 5x : F(2) − F(0) = 2 − 0 = 2.", "d": "<b>2</b> : [x³ + x² − 5x]₀² = (8 + 4 − 10) − 0 = 2.<div class='ex-detail'><u>Exemple rédigé</u> : structure du calcul : primitive SANS constante, crochet avec les bornes, évaluer en b, soustraire la valeur en a. Piège : inverser les bornes (0 − 2 = −2) ; la constante k s'élimine toute seule : ne pas l'écrire. Vérification d'ordre de grandeur : f(0) = −5, f(2) = 9 : l'aire algébrique 2 est plausible (négatif puis positif).</div>"},
{"t": "Intégrales (Terminale)", "q": "Primitive de (2x)/(x² + 1) ?", "c": ["ln(x² + 1)", "x²ln(x² + 1)", "2ln(x² + 1)", "1/(x² + 1)"], "a": 0, "e": "Forme u′/u avec u = x²+1 : primitive ln(u) = ln(x² + 1).", "d": "<b>ln(x² + 1)</b> : forme u′/u (u = x² + 1, u′ = 2x).<div class='ex-detail'><u>Exemple rédigé</u> : vérification : (ln(x²+1))′ = (2x)/(x²+1) ✓. La reconnaissance des FORMES composées est la compétence clé : u′/u ⟹ ln|u| ; u′uⁿ ⟹ u^{n+1}/(n+1) ; u′e^u ⟹ e^u. Piège : « 2ln(x²+1) » : sa dérivée serait (4x)/(x²+1) : le facteur 2 est déjà DANS u′ = 2x.</div>"},
{"t": "Intégrales (Terminale)", "q": "Si f est négative sur [a ; b], alors ∫_a^b f est…", "c": ["nulle", "positive", "négative (aire algébrique)", "impossible à calculer"], "a": 2, "e": "L'intégrale d'une fonction négative est négative : c'est l'opposé de l'aire.", "d": "f ≤ 0 sur [a ; b] ⟹ ∫_a^b f ≤ 0 : <b>aire ALGÉBRIQUE négative</b> (l'aire géométrique est −∫f).<div class='ex-detail'><u>Exemple rédigé</u> : exemple : ∫₀¹ (−1)dx = −1 : la courbe (constante −1) est sous l'axe. Pour l'AIRE GÉOMÉTRIQUE : −(−1) = 1 u.a. Piège : confondre intégrale (signée) et aire (positive) : sous l'axe, les signes s'inversent ; une aire se calcule par ∫|f| après découpage aux zéros de f.</div>"},
{"t": "Intégrales (Terminale)", "q": "∫₀² f = 6 et ∫₀² g = 2. ∫₀² (2f + g) = ?", "c": ["8", "16", "12", "14"], "a": 3, "e": "Linéarité : 2×6 + 2 = 14.", "d": "<b>14</b> : linéarité de l'intégrale : ∫(2f + g) = 2∫f + ∫g = 12 + 2.<div class='ex-detail'><u>Exemple rédigé</u> : la linéarité évite de TOUT recalculer : les intégrales déjà connues se combinent. Autre propriété du même type (Chasles) : ∫₀³f = ∫₀²f + ∫₂³f = 6 + 1 = 7 : découper l'intervalle sans rien recalculer. Piège : 8 = 6 + 2 additionnerait SANS le coefficient 2 sur f.</div>"},
{"t": "Intégrales (Terminale)", "q": "Valeur moyenne de f sur [0 ; 3] sachant ∫₀³ f = 7 ?", "c": ["7/3", "7", "21", "3/7"], "a": 0, "e": "Moyenne = (1/(b−a))·∫ = 7/3 ≈ 2,33.", "d": "Valeur moyenne = <b>7/3 ≈ 2,33</b> : (1/(3−0))×7.<div class='ex-detail'><u>Exemple rédigé</u> : sens géométrique : la hauteur du RECTANGLE de même aire : 7 u.a. étalées sur une largeur 3 : 7/3 de haut. C'est exactement une moyenne de notes : somme des valeurs ÷ étendue. Piège : 3/7 inverse la fraction ; 21 multiplierait par (b−a). Formule à retenir : m = ∫_a^b f/(b−a).</div>"},
{"t": "Intégrales (Terminale)", "q": "∫_a^b f = F(b) − F(a). Et ∫_b^a f ?", "c": ["La même valeur", "Le double", "0", "F(a) − F(b) = −∫_a^b f"], "a": 3, "e": "Échanger les bornes change le signe.", "d": "<b>∫_b^a f = −∫_a^b f</b> : échanger les bornes OPPOSE l'intégrale.<div class='ex-detail'><u>Exemple rédigé</u> : exemple : ∫₀¹ x dx = 1/2 mais ∫₁⁰ x dx = −1/2. Conséquence immédiate : ∫_a^a f = 0 (bornes identiques). Ce signe est cohérent avec l'aire algébrique parcourue « à l'envers ». Piège d'inattention dans les applications de Chasles : vérifier l'ORIENTATION de chaque morceau avant d'additionner.</div>"},
{"t": "Intégrales (Terminale)", "q": "Aire entre la courbe de f (au-dessus) et celle de g sur [a ; b] (f ≥ g) ?", "c": ["∫_a^b (g − f) dx", "∫_a^b (f − g) dx", "∫_a^b f × ∫_a^b g", "f(b) − g(a)"], "a": 1, "e": "On intègre la DIFFÉRENCE (celle du dessus moins celle du dessous).", "d": "Aire = <b>∫_a^b (f(x) − g(x))dx</b> : la différence reste positive (f ≥ g).<div class='ex-detail'><u>Exemple rédigé</u> : exemple : entre y = x et y = x² sur [0 ; 1] : ∫₀¹(x − x²)dx = 1/2 − 1/3 = 1/6 u.a. (positif ✓). Piège : (g − f) donnerait le SIGNE opposé (et un résultat négatif, impossible pour une aire : c'est même le test de dépistage) ; le produit des intégrales n'a aucun sens géométrique.</div>"},
{"t": "Intégrales (Terminale)", "q": "Primitive de 1/x sur ]0 ; +∞[ ?", "c": ["−1/x²", "x", "ln x", "1/x"], "a": 2, "e": "(ln x)′ = 1/x (pour x > 0) ; sur ]−∞ ; 0[ : ln(−x).", "d": "<b>ln x</b> (sur ]0 ; +∞[) ; sur ]−∞ ; 0[ : ln(−x) : d'où la formule générale <b>ln|x|</b>.<div class='ex-detail'><u>Exemple rédigé</u> : sur les NÉGATIFS : (ln(−x))′ = (−1)/(−x) = 1/x ✓. Attention : il n'existe PAS de primitive unique sur ℝ∖{0} tout entier de la forme ln|x| ? Si : ln|x| marche sur chaque intervalle, mais PAS de primitive SUR ℝ∖{0} de l'expression unique : ln|x| est définie sur ℝ∖{0} et convient… en fait ln|x| EST la réponse sur ℝ∖{0} pris comme réunion de deux intervalles. Piège : « −1/x² » est la DÉRIVÉE de 1/x, pas sa primitive.</div>"},
{"t": "Logarithmes et exponentielles (Terminale)", "q": "ln 2 + ln 3 = ?", "c": ["ln 5", "5", "ln 2×3 seulement si a>0 : oui ici : ln 6", "ln 6"], "a": 3, "e": "ln a + ln b = ln(ab) : ln 2 + ln 3 = ln 6.", "d": "<b>ln 6</b> : la somme de logarithmes est le logarithme du PRODUIT.<div class='ex-detail'><u>Exemple rédigé</u> : contre-vérification numérique : ln 2 ≈ 0,693, ln 3 ≈ 1,099 : somme ≈ 1,79 ≈ ln 6 ✓ ; alors que ln 5 ≈ 1,61 : différent ! Piège : « ln 5 » appliquerait la règle FAUSSE ln(a+b) = ln a + ln b : le ln ne traverse NI une somme NI un produit à l'intérieur : seule la MULTIPLICATION extérieure se transforme en addition.</div>"},
{"t": "Logarithmes et exponentielles (Terminale)", "q": "e³ × e⁵ = ?", "c": ["e⁸", "e²", "e¹⁵", "8e"], "a": 0, "e": "e^{a+b} : e³⁺⁵ = e⁸.", "d": "<b>e⁸</b> : produit d'exponentielles ⟹ SOMME des exposants.<div class='ex-detail'><u>Exemple rédigé</u> : règle complète : e^a·e^b = e^{a+b} ; e^a/e^b = e^{a−b} ; (e^a)ⁿ = e^{an}. Piège : « e¹⁵ » multiplierait les exposants (confusion avec (e³)⁵ = e¹⁵) ; « e² » les soustrairait. Contrôle d'ordre de grandeur : e³ ≈ 20, e⁵ ≈ 148 : produit ≈ 2980 ≈ e⁸ (≈ 2981) ✓.</div>"},
{"t": "Logarithmes et exponentielles (Terminale)", "q": "Résoudre e^x = 5.", "c": ["x = ln 5", "x = 5e", "x = e⁵", "x = 5"], "a": 0, "e": "Le ln défait l'exponentielle : x = ln 5 ≈ 1,61.", "d": "<b>x = ln 5 ≈ 1,61</b> : ln(e^x) = x.<div class='ex-detail'><u>Exemple rédigé</u> : contrôle : e^{1,61} ≈ 5 ✓. L'existence est garantie : e^x est strictement croissante de −∞ (en −∞) à +∞ : toute valeur positive 5 est atteinte UNE fois. Piège : « x = 5 » confond l'égalité e^x = 5 avec x = 5 (e⁵ ≈ 148 : non). Réciproque : ln x = 5 ⟹ x = e⁵ : les deux fonctions se défont l'une l'autre.</div>"},
{"t": "Logarithmes et exponentielles (Terminale)", "q": "Résoudre ln(x) + ln(x−1) = ln 6.", "c": ["x = −2 seulement", "x = 3 ou x = −2", "x = 3 seulement (domaine x > 1)", "x = 6"], "a": 2, "e": "Domaine x > 1 ; x² − x = 6 : x = 3 ou −2, mais −2 est rejeté par le domaine.", "d": "<b>x = 3 seulement</b> : x² − x − 6 = 0 donne 3 et −2, mais le domaine (x &gt; 0 ET x−1 &gt; 0) exclut −2.<div class='ex-detail'><u>Exemple rédigé</u> : la rédaction type : ① domaine : x &gt; 1 ; ② regrouper : ln(x(x−1)) = ln 6 ⟹ x(x−1) = 6 ; ③ résoudre : x = 3 ou −2 ; ④ CONTRÔLER le domaine : S = {3}. Piège : « 3 ou −2 » oublie le domaine : ln(−2) n'existe pas : la moitié de la réponse est un mirage. Vérification : ln 3 + ln 2 = ln 6 ✓.</div>"},
{"t": "Logarithmes et exponentielles (Terminale)", "q": "Dérivée de f(x) = ln(x² + 1) ?", "c": ["2x/(x²+1)", "1/x", "2x·ln(x²+1)", "1/(x²+1)"], "a": 0, "e": "(ln u)′ = u′/u = 2x/(x²+1).", "d": "<b>2x/(x² + 1)</b> : (ln u)′ = u′/u avec u = x²+1, u′ = 2x.<div class='ex-detail'><u>Exemple rédigé</u> : le u′ est la clé : « 1/(x²+1) » l'omettrait (c'est la dérivée de ln(x+x²)?? non : ce serait (2x+1)/(x+x²) : toujours le u′). Application : f′(x) = 2x/(x²+1) &gt; 0 pour x &gt; 0 : f croît : la dérivée d'un ln est une fonction RATIONNELLE : les études de variations des ln se ramènent à des quotients de polynômes.</div>"},
{"t": "Logarithmes et exponentielles (Terminale)", "q": "Dérivée de g(x) = e^{−x²} ?", "c": ["−2x·e^{−x²}", "−2x", "e^{−x²}", "2x·e^{−x²}"], "a": 0, "e": "(e^u)′ = u′e^u avec u′ = −2x : g′ = −2x·e^{−x²}.", "d": "<b>−2x·e^{−x²}</b> : (e^u)′ = u′·e^u avec u = −x², u′ = −2x.<div class='ex-detail'><u>Exemple rédigé</u> : lecture de la dérivée : g′ &gt; 0 si x &lt; 0 : la cloche de e^{−x²} (forme « gaussienne ») monte jusqu'à x = 0 (max : g(0) = 1) puis descend : la dérivée dessine la courbe. Piège : « e^{−x²} » sans le u′ = −2x : la dérivée de e^x est e^x, mais PAS celle de e^u : la chaîne u′ doit TOUJOURS accompagner.</div>"},
{"t": "Logarithmes et exponentielles (Terminale)", "q": "ln(a/b) = ?", "c": ["ln a − ln b", "a/b", "ln(a−b)", "ln a + ln b"], "a": 0, "e": "Le quotient devient une différence : ln(a/b) = ln a − ln b.", "d": "<b>ln(a/b) = ln a − ln b</b> ; cas particulier : ln(1/b) = −ln b.<div class='ex-detail'><u>Exemple rédigé</u> : exemple complet : ln 8 + ln 3 − ln 6 = ln(8×3/6) = ln 4 : le regroupement est l'outil n° 1 des simplifications. Vérification : ln 4 ≈ 1,386 ; (2,079 + 1,099 − 1,792) ≈ 1,386 ✓. Piège : « ln(a−b) » : le ln ne traverse PAS une différence intérieure : ln(8−6) = ln 2 ≠ ln 8 − ln 6.</div>"},
{"t": "Logarithmes et exponentielles (Terminale)", "q": "Croissances comparées en +∞ :", "c": ["ln x ≪ e^x ≪ x", "ln x ≪ x ≪ e^x", "e^x ≪ x ≪ ln x", "x ≪ ln x ≪ e^x"], "a": 1, "e": "ln x ≪ x ≪ e^x : le log pousse doucement, l'exponentielle explose.", "d": "<b>ln x ≪ x ≪ e^x</b> en +∞ : ln pousse « au ralenti », e^x fonce.<div class='ex-detail'><u>Exemple rédigé</u> : conséquences directes : lim ln x/x = 0 ; lim e^x/x = +∞ ; lim (ln x)·e^{−x} = 0. Test numérique x = 100 : ln 100 ≈ 4,6 ; 100 ; e¹⁰⁰ = 2,7×10⁴³ : les trois échelles sont déjà des mondes séparés. Piège : cette hiérarchie tranche TOUTES les formes indéterminées de type ∞/∞ avec exp ou ln : la connaître = éviter les calculs.</div>"},
{"t": "Logarithmes et exponentielles (Terminale)", "q": "ln(aⁿ) = ?", "c": ["a·ln n", "n·ln a", "ln n + ln a", "ln a × ln n"], "a": 1, "e": "L'exposant devient un facteur : ln(aⁿ) = n·ln a.", "d": "<b>n·ln a</b> : l'exposant DESCEND en facteur.<div class='ex-detail'><u>Exemple rédigé</u> : applications : ln 8 = ln(2³) = 3 ln 2 ; ln(√x) = ln(x^{1/2}) = (1/2)ln x ; ln(1/a) = ln(a^{−1}) = −ln a. Cette règle sert aussi en sens INVERSE : n·ln 2 = ln(2ⁿ) : pour résoudre 2ⁿ = 10 : n·ln 2 = ln 10 : n = ln 10/ln 2 ≈ 3,32 (logarithme « base 2 » de 10). Piège : « ln n + ln a » serait ln(an).</div>"},
{"t": "Logarithmes et exponentielles (Terminale)", "q": "ln 1 = ? Et e⁰ = ?", "c": ["0 et 1", "0 et 0", "1 et 1", "1 et 0"], "a": 0, "e": "ln 1 = 0 et e⁰ = 1 : les deux points d'ancrage des deux fonctions.", "d": "<b>ln 1 = 0 et e⁰ = 1</b> : les « points d'ancrage » réciproques l'un de l'autre (ln est la réciproque de exp).<div class='ex-detail'><u>Exemple rédigé</u> : ces deux valeurs structurent tous les calculs : ln(e⁰) = ln 1 = 0 ✓ (cohérence des réciproques) ; ln 1 = 0 vient de e⁰ = 1. Applications rapides : ln x = 0 ⟺ x = 1 ; e^x = 1 ⟺ x = 0. Piège de tableur : les confondre (répondre « 1 et 0 ») fausse toutes les équations : mémoriser le couple (ln 1 ; e⁰) = (0 ; 1) comme une image inversée.</div>"},
{"t": "Lois de probabilité (Terminale)", "q": "X ~ B(50 ; 0,2). E(X) = ?", "c": ["50", "0,2", "10", "8"], "a": 2, "e": "E(X) = np = 50 × 0,2 = 10.", "d": "<b>E(X) = np = 10</b> : en moyenne 10 succès sur 50 épreuves.<div class='ex-detail'><u>Exemple rédigé</u> : complément : V(X) = np(1−p) = 50×0,2×0,8 = 8 ; σ = √8 ≈ 2,83. Contrôle d'intuition : p = 0,2 = 1 succès sur 5 : sur 50 épreuves : ≈ 10 ✓. Piège : « 8 » est la VARIANCE, pas l'espérance : les deux quantités sortent du même calcul mais mesurent des choses différentes (moyenne vs dispersion).</div>"},
{"t": "Lois de probabilité (Terminale)", "q": "Un dé lancé 5 fois. P(au moins un 6) ≈ ?", "c": ["(1/6)⁵", "5/6", "0,5", "1 − (5/6)⁵ ≈ 0,598"], "a": 3, "e": "Contraire : aucun 6 = (5/6)⁵ ≈ 0,402 ; P = 1 − 0,402 ≈ 0,598.", "d": "<b>1 − (5/6)⁵ ≈ 0,598</b> : « au moins un » ⟹ contraire « aucun » : chaque lancer raté (5/6), indépendamment 5 fois.<div class='ex-detail'><u>Exemple rédigé</u> : intuition : 1/6 de réussite par lancer paraît faible, mais CINQ chances cumulées : ≈ 60 %. Généralisation : P(au moins un succès) = 1 − (1−p)ⁿ : avec n grand, « au moins un » devient quasi certain. Piège : « 5/6 » additionnerait naïvement les chances ; « (1/6)⁵ » ≈ 0,00013 calculerait « tous des 6 » : l'autre extrême.</div>"},
{"t": "Lois de probabilité (Terminale)", "q": "X ~ B(10 ; 0,25) (QCM au hasard). P(X = 10) = ?", "c": ["0,25¹⁰ ≈ 9,5×10⁻⁷", "2,5", "1", "0,25"], "a": 0, "e": "Tous les 10 succès : (1/4)¹⁰ ≈ 0,00000095.", "d": "<b>(0,25)¹⁰ ≈ 9,5×10⁻⁷</b> : tous les lancers sont des succès.<div class='ex-detail'><u>Exemple rédigé</u> : formule complète : P(X = k) = C(n,k)pᵏ(1−p)ⁿ⁻ᵏ ; pour k = 10 : C(10,10) = 1 et (1−p)⁰ = 1 : reste p¹⁰. L'ordre de grandeur : 1 chance sur un million. En revanche E(X) = 2,5 : le score MOYEN au hasard. Piège : « 2,5 » est l'espérance, pas une probabilité : ne pas mélanger les deux questions.</div>"},
{"t": "Lois de probabilité (Terminale)", "q": "Loi normale : P(X = 170) pour X ~ N(170 ; 64) ?", "c": ["0", "1", "0,5", "0,68"], "a": 0, "e": "Loi CONTINUE : la probabilité d'une valeur exacte est nulle ; seuls les INTERVALLES ont une probabilité.", "d": "<b>0</b> : en loi normale (continue), P(X = a) = 0 pour toute valeur a : seuls comptent les intervalles.<div class='ex-detail'><u>Exemple rédigé</u> : intuition : mesurer EXACTEMENT 170,000… cm est impossible physiquement : l'aire sous la cloche en un point est nulle. Conséquence pratique : P(X ≤ 170) = P(X &lt; 170) : pas de différence « ≤ vs &lt; » en continu, contrairement à la binomiale (discrète). Piège : « 0,5 » : c'est P(X ≤ 170) (par symétrie autour de μ = 170) : l'intervalle, pas le point.</div>"},
{"t": "Lois de probabilité (Terminale)", "q": "Règle 68-95-99,7 : P(μ − 2σ ≤ X ≤ μ + 2σ) ≈ ?", "c": ["95 %", "68 %", "99,7 %", "50 %"], "a": 0, "e": "±2σ : ≈ 95 % des valeurs d'une loi normale.", "d": "<b>≈ 95 %</b> : à ±1σ : 68 % ; à ±2σ : 95 % ; à ±3σ : 99,7 %.<div class='ex-detail'><u>Exemple rédigé</u> : application X ~ N(170 ; 64) : σ = 8 : [154 ; 186] = ±2σ contient ≈ 95 % des tailles. La précision « exacte » : 1,96σ (d'où l'intervalle de fluctuation à 95 %). Piège d'échange : 68 % ↔ ±1σ, 95 % ↔ ±2σ : les réponses croisées (68 % à ±2σ) sont le piège classique du QCM : mémoriser la progression 1-2-3 ↔ 68-95-99,7.</div>"},
{"t": "Lois de probabilité (Terminale)", "q": "X ~ N(170 ; 64). σ = ?", "c": ["8", "√170", "32", "64"], "a": 0, "e": "64 est la VARIANCE : σ = √64 = 8.", "d": "<b>σ = 8</b> : dans N(μ ; σ²), le second paramètre est la VARIANCE σ² : σ = √64.<div class='ex-detail'><u>Exemple rédigé</u> : conséquences : ±1σ = [162 ; 178] (68 % des tailles) ; ±2σ = [154 ; 186] (95 %). Piège : prendre σ = 64 donnerait des intervalles absurdes ([106 ; 234]) : la cohérence des largeurs avec les données est un excellent contrôle. Convention à vérifier dans chaque énoncé : certains notent N(μ ; σ) : lire la question de cours.</div>"},
{"t": "Lois de probabilité (Terminale)", "q": "Les 3 conditions d'une loi binomiale sont…", "c": ["μ, σ, symétrie", "n grand, p petit, X continue", "au moins un succès, aucun échec, E > 0", "épreuves identiques, indépendantes, deux issues"], "a": 3, "e": "Répétition d'épreuves IDENTIQUES, INDÉPENDANTES, à DEUX issues (succès/échec).", "d": "<b>Identiques + indépendantes + deux issues</b> : les trois hypothèses fondatrices de B(n ; p).<div class='ex-detail'><u>Exemple rédigé</u> : contre-exemples pédagogiques : tirages SANS remise : PAS indépendants (hypergéométrique, pas binomiale) ; nombre de faces sur un dé : PAS deux issues (multinomiale) ; probabilité qui change à chaque essai : pas identiques. Vérifier les trois AVANT d'écrire X ~ B(n ; p) : c'est la première question de tout exercice.</div>"},
{"t": "Lois de probabilité (Terminale)", "q": "P(X ≥ 3) avec X ~ B(8 ; 0,4) se calcule comme…", "c": ["1 − P(X = 3)", "1 − P(X ≤ 2)", "P(X ≤ 5)", "P(X = 3) + P(X = 4) + …"], "a": 1, "e": "Complémentaire : P(X ≥ 3) = 1 − P(X ≤ 2), le plus court chemin (calculatrice : binomFRép).", "d": "<b>1 − P(X ≤ 2)</b> : le complémentaire : tout sauf 0, 1 ou 2 succès.<div class='ex-detail'><u>Exemple rédigé</u> : les deux voies : ① additionner P(3) + P(4) + … + P(8) : 6 termes de formule ; ② 1 − [P(0) + P(1) + P(2)] : 3 termes, ou UNE touche binomFRép(8, 0,4, 2) : la voie du complément est presque toujours la plus économique. Piège : « 1 − P(X = 3) » retirerait UNE valeur, mais le contraire de « ≥ 3 » est « ≤ 2 » (toute la zone 0-2, pas seulement 3).</div>"},
{"t": "Lois de probabilité (Terminale)", "q": "Z = (X − μ)/σ avec X ~ N(μ ; σ²). Z suit…", "c": ["N(0 ; 1)", "N(μ ; σ²)", "une loi uniforme", "B(μ ; σ)"], "a": 0, "e": "Centrer-réduire : Z suit la loi normale CENTRÉE RÉDUITE N(0 ; 1).", "d": "<b>Z ~ N(0 ; 1)</b> : centrage (−μ : moyenne 0) et réduction (÷σ : écart type 1).<div class='ex-detail'><u>Exemple rédigé</u> : exemple : X ~ N(170 ; 64) : P(X ≥ 186) = P(Z ≥ (186−170)/8) = P(Z ≥ 2) ≈ 0,025 : la normalisation ramène TOUTES les lois normales à la même table N(0;1). Piège : « N(μ ; σ²) » : ce serait X lui-même : le changement de variable est justement ce qui standardise. Applications : comparaison de notes entre matières (« 14 en maths où μ = 10, σ = 3 » vs « 12 en LV où μ = 11, σ = 1 » : Z = 1,33 vs Z = 1 : le 14 vaut mieux).</div>"},
{"t": "Lois de probabilité (Terminale)", "q": "Fluctuation à 95 % : n = 100, p = 0,5. La demi-largeur 1,96·√(p(1−p)/n) vaut…", "c": ["0,098", "0,049", "0,0098", "0,5"], "a": 0, "e": "√(0,25/100) = 0,05 ; 1,96×0,05 = 0,098.", "d": "1,96·√(0,5×0,5/100) = 1,96×√0,0025 = 1,96×0,05 = <b>0,098</b> : intervalle [0,402 ; 0,598].<div class='ex-detail'><u>Exemple rédigé</u> : sens : si on sonde 100 personnes, la fréquence observée varie dans [40,2 % ; 59,8 %] dans 95 % des cas (sous p = 0,5). Rôles des ingrédients : le 1,96 vient des 95 % (loi normale) ; le √(1/n) : la précision croît comme la RACINE de n : pour diviser l'erreur par 2, il faut 4 FOIS plus de données. Piège : « 0,049 » oublierait le facteur 2 du 1,96.</div>"},
{"t": "Équations différentielles (Terminale)", "q": "Solution générale de y′ = 2y ?", "c": ["y = C·e^{x/2}", "y = e^{2x} seulement", "y = 2x + C", "y = C·e^{2x}"], "a": 3, "e": "y′ = ay ⟹ y = C·e^{ax} : ici y = C·e^{2x}.", "d": "<b>y(x) = C·e^{2x}</b> avec C réel quelconque.<div class='ex-detail'><u>Exemple rédigé</u> : vérification : y′ = 2C·e^{2x} = 2y ✓ pour TOUT C. Sans condition initiale, il y a une infinité de solutions (une par valeur de C). Piège : « y = e^{2x} » n'est que le cas C = 1 ; « 2x + C » est la solution de y″ = 0, pas de y′ = 2y. Réflexe : C·e^{ax} est LA famille de base, tout le reste s'en déduit.</div>"},
{"t": "Équations différentielles (Terminale)", "q": "Solution générale de y′ = 2y + 3 ?", "c": ["y = C·e^{2x}", "y = C·e^{2x} + 3/2", "y = C·e^{2x} − 3/2", "y = 2x + 3"], "a": 2, "e": "y = C·e^{ax} − b/a : ici −3/2.", "d": "<b>y = C·e^{2x} − 3/2</b> : solution homogène C·e^{2x} + solution d'équilibre −b/a = −3/2.<div class='ex-detail'><u>Exemple rédigé</u> : double contrôle : ① y = −3/2 (constant) : y′ = 0 = 2(−3/2) + 3 ✓ : l'équilibre est TOUJOURS solution ; ② y(0) = C − 3/2 : avec y(0) = 1 : C = 5/2 : y = (5/2)e^{2x} − 3/2. Piège : « + 3/2 » inverse le signe de l'équilibre : −b/a, avec b = +3.</div>"},
{"t": "Équations différentielles (Terminale)", "q": "y′ = ay + b, y(0) = y₀. C vaut…", "c": ["y₀", "y₀·a", "y₀ + b/a", "y₀ − b/a"], "a": 2, "e": "y(0) = C − b/a = y₀ ⟹ C = y₀ + b/a.", "d": "<b>C = y₀ + b/a</b> : y(0) = C − b/a = y₀.<div class='ex-detail'><u>Exemple rédigé</u> : exemple complet : y′ = 2y + 3, y(0) = 1 : C = 1 + 3/2 = 5/2 : y = (5/2)e^{2x} − 3/2. Contrôle : y(0) = 5/2 − 3/2 = 1 ✓. Piège : « C = y₀ » oublierait le terme d'équilibre −b/a : la condition initiale lit la solution GÉNÉRALE, pas seulement sa partie exponentielle. La constante est déterminée de manière UNIQUE : une équation + une condition = UNE solution.</div>"},
{"t": "Équations différentielles (Terminale)", "q": "y′ = 3y + 2e^{x}. Solution particulière de la forme d·e^{x} : d = ?", "c": ["3", "−1", "2/3", "2"], "a": 1, "e": "d(1−3) = 2 ⟹ d = −1.", "d": "<b>d = −1</b> : y_p = d·e^x : y_p′ = d·e^x = 3d·e^x + 2e^x ⟹ d = 3d + 2 ⟹ d = −1.<div class='ex-detail'><u>Exemple rédigé</u> : solution générale complète : y = C·e^{3x} − e^x. Vérification de y_p = −e^x : y_p′ = −e^x ; 3(−e^x) + 2e^x = −e^x ✓. Piège : « 2/3 » diviserait au lieu d'identifier : l'équation d(1−a) = b donne d = b/(1−a) = 2/(−2) = −1 : signe au carré de nothing : attention au 1−a NÉGATIF.</div>"},
{"t": "Équations différentielles (Terminale)", "q": "N′ = −0,05N, N(0) = 1000. N(t) = ?", "c": ["0,05·e^{1000t}", "1000 − 0,05t", "e^{−0,05t} + 1000", "1000·e^{−0,05t}"], "a": 3, "e": "N = C·e^{−0,05t} avec C = N(0) = 1000.", "d": "<b>N(t) = 1000·e^{−0,05t}</b> : décroissance exponentielle (a = −0,05 &lt; 0).<div class='ex-detail'><u>Exemple rédigé</u> : ici b = 0 (pas d'équilibre) : C = y₀ directement. Contrôles : N(0) = 1000 ✓ ; N(10) = 1000·e^{−0,5} ≈ 607 : en 10 ans, il reste ~61 % : la décroissance est RAPIDE au début puis ralentit (asymptote 0). Piège : « 1000 − 0,05t » est une décroissance LINÉAIRE : les phénomènes proportionnels à la quantité restante sont exponentiels, pas linéaires.</div>"},
{"t": "Équations différentielles (Terminale)", "q": "Demi-vie de N′ = −0,05N ?", "c": ["1/0,05 = 20 ans", "50 ans", "0,05 an", "ln 2/0,05 ≈ 13,9 ans"], "a": 3, "e": "e^{−0,05T} = 1/2 ⟹ T = ln 2/0,05 ≈ 13,9 ans.", "d": "<b>T = ln 2/0,05 ≈ 13,9 ans</b> : le temps de division par 2.<div class='ex-detail'><u>Exemple rédigé</u> : dérivation de la formule : N(T) = N₀/2 ⟹ e^{−0,05T} = 1/2 = e^{−ln 2} ⟹ T = ln 2/0,05. Propriété remarquable : la demi-vie ne dépend PAS de N₀ : de 1000 → 500 en 13,9 ans, et de 500 → 250 aussi : c'est la signature de l'exponentielle. Piège : « 20 ans » remplacerait ln 2 ≈ 0,693 par 1 : la demi-vie est plus COURTE que 1/|a|.</div>"},
{"t": "Équations différentielles (Terminale)", "q": "y = −b/a (constante) est solution de y′ = ay + b parce que…", "c": ["elle est toujours positive", "a = 0", "y′ = 0 et a(−b/a) + b = −b + b = 0", "c'est la dérivée de b"], "a": 2, "e": "Solution constante ⟹ y′ = 0 ; le second membre s'annule aussi : équilibre.", "d": "<b>y′ = 0 = a·(−b/a) + b = −b + b = 0</b> : le point d'équilibre.<div class='ex-detail'><u>Exemple rédigé</u> : sens physique : si y = −b/a, la dérivée est nulle : la solution RESTE là : c'est un équilibre (température ambiante de Newton, population stable). Si y &gt; −b/a : y′ = ay + b &gt; 0 : y monte TOUT DROIT vers l'équilibre (pour a &lt; 0). Piège : l'équilibre attire les solutions quand a &lt; 0, mais les REPUSSE quand a &gt; 0 : le signe de a change toute la géométrie.</div>"},
{"t": "Équations différentielles (Terminale)", "q": "Vérification d'une solution : y = 4e^{3x} pour y′ = 3y ?", "c": ["on ne peut pas vérifier", "y′ = 4e^{3x} ≠ 3y", "y′ = 3e^{3x}", "y′ = 12e^{3x} = 3y ✓"], "a": 3, "e": "y′ = 4·3e^{3x} = 12e^{3x} = 3·(4e^{3x}) = 3y ✓.", "d": "<b>y′ = 12e^{3x} = 3y ✓</b> : dériver puis comparer.<div class='ex-detail'><u>Exemple rédigé</u> : la vérification est un réflexe GRATUIT : dériver la solution proposée (la constante C sort, l'exposant 3x descend en facteur) et remplacer dans l'équation. Application redoutée : les QCM proposent des « solutions » proches : seule la dérivation les départage : 4e^{3x} marche, 4e^{x/3} donnerait y′ = (4/3)e^{x/3} ≠ 3y. Toujours 10 secondes pour valider.</div>"},
{"t": "Équations différentielles (Terminale)", "q": "Loi de refroidissement de Newton : T′ = −k(T − T_amb). La solution tend vers…", "c": ["0", "l'infini", "−k", "la température ambiante T_amb"], "a": 3, "e": "L'équilibre T = T_amb : les solutions tendent vers la température ambiante.", "d": "<b>T_amb</b> : posons u = T − T_amb : u′ = −ku ⟹ u = Ce^{−kt} : T = T_amb + Ce^{−kt} → T_amb.<div class='ex-detail'><u>Exemple rédigé</u> : le changement de variable u = T − T_amb ramène l'équation à la forme de base u′ = −ku : c'est LA technique de normalisation. Physique : un café chaud refroidit vers la température de la pièce, de plus en plus lentement à mesure qu'il s'en approche (asymptote). Piège : la limite est l'équilibre −b/a = T_amb, PAS 0 (sauf si la pièce est à 0 degré).</div>"},
{"t": "Équations différentielles (Terminale)", "q": "Une équation différentielle SANS condition initiale possède…", "c": ["aucune solution", "une unique solution", "une infinité de solutions (une par valeur de C)", "exactement deux solutions"], "a": 2, "e": "La constante C reste libre : une infinité de solutions.", "d": "<b>Une infinité de solutions</b> : C parcourt ℝ.<div class='ex-detail'><u>Exemple rédigé</u> : y′ = 2y : y = Ce^{2x} pour TOUT C : une famille de courbes (les « clones » dilatés verticalement). La condition initiale y(0) = y₀ SÉLECTIONNE exactement une courbe : c'est le rôle du problème de CAUCHY (équation + condition). Piège conceptuel : « une unique solution » n'est vrai qu'AVEC condition initiale : le QCM joue sur cette précision. Géométriquement : par un point donné ne passe QU'UNE courbe solution.</div>"},
{"t": "Arithmétique et matrices (Terminale)", "q": "Division euclidienne de 2027 par 6 : reste ?", "c": ["1", "5", "337", "−1"], "a": 1, "e": "2027 = 6×337 + 5 : reste 5.", "d": "<b>5</b> : 6×337 = 2022, et 2027 − 2022 = 5.<div class='ex-detail'><u>Exemple rédigé</u> : structure : dividende = diviseur × quotient + reste, avec 0 ≤ reste &lt; 6. Contrôle : 337 serait le QUOTIENT (confusion classique) ; « −1 » violerait 0 ≤ r : on peut écrire 2027 = 6×338 − 1, mais le reste doit rester dans [0 ; 6). La division euclidienne est UNIQUE : c'est ce qui fonde les congruences (2027 ≡ 5 [6]).</div>"},
{"t": "Arithmétique et matrices (Terminale)", "q": "2027⁷ ≡ ? [6] sachant 2027 ≡ 5 [6] et 5² ≡ 1 [6]", "c": ["5", "0", "1", "25"], "a": 0, "e": "5⁷ = (5²)³×5 ≡ 1×5 = 5 [6].", "d": "<b>5</b> : les puissances de 5 mod 6 alternent : 5, 1, 5, 1… (exposants impairs ⟹ 5).<div class='ex-detail'><u>Exemple rédigé</u> : le cycle : 5¹ ≡ 5, 5² ≡ 25 ≡ 1, 5³ ≡ 5, … : période 2. Exposant 7 (impair) : reste 5. Stratégie générale pour les GRANDES puissances : ① réduire la base modulo n ; ② calculer les premières puissances ; ③ repérer le CYCLE ; ④ conclure avec la parité ou la division de l'exposant. Piège : « 25 » n'est pas réduit (doit être &lt; 6).</div>"},
{"t": "Arithmétique et matrices (Terminale)", "q": "2×3 − 1×5 = 1 prouve que…", "c": ["15 est premier", "3 et 5 sont premiers entre eux (Bézout)", "3 divise 5", "5 est inverse de 3"], "a": 1, "e": "Bézout : une relation au + bv = 1 avec a = 3, b = 5 ⟹ pgcd = 1.", "d": "<b>3 et 5 premiers entre eux</b> : la relation de Bézout 3×2 + 5×(−1) = 1 l'atteste.<div class='ex-detail'><u>Exemple rédigé</u> : lecture de l'identité : u = 2 et v = −1 sont les COEFFICIENTS de Bézout. Bonus immédiat : 3×2 ≡ 1 [5] (le terme 5×(−1) disparaît modulo 5) : 2 est l'INVERSE de 3 modulo 5. Piège : « 5 est inverse de 3 » n'a pas de sens tel quel (inverse MODULO n seulement) ; l'inverse de 3 mod 5 est 2, pas 5.</div>"},
{"t": "Arithmétique et matrices (Terminale)", "q": "Résoudre 3x ≡ 1 [5] :", "c": ["x ≡ 0 [5]", "x ≡ 2 [5]", "x ≡ 3 [5]", "x ≡ 4 [5]"], "a": 1, "e": "3×2 = 6 ≡ 1 [5] : x ≡ 2 [5].", "d": "<b>x ≡ 2 [5]</b> : 2 est l'inverse de 3 modulo 5 (car 3×2 ≡ 1).<div class='ex-detail'><u>Exemple rédigé</u> : méthode : ① chercher l'inverse de 3 mod 5 (essais : 3×1=3, 3×2=6≡1 ✓) ou via Bézout (2×3 − 1×5 = 1) ; ② multiplier : x ≡ 2×1 = 2 [5]. Solutions : x = 2 + 5k. Piège : on NE DIVISE JAMAIS par 3 dans une congruence (3 n'est pas inversible modulo 6, par exemple : la division n'est licite que si le nombre est premier avec le module). Test : x = 7 : 3×7 = 21 ≡ 1 [5] ✓.</div>"},
{"t": "Arithmétique et matrices (Terminale)", "q": "A = (1 2 ; 3 4) et B = (0 1 ; 1 0). AB = ?", "c": ["(1 1 ; 3 3)", "(2 1 ; 4 3)", "(0 2 ; 3 4)", "(3 4 ; 1 2)"], "a": 1, "e": "Ligne × colonne : (1×0+2×1 ; 1×1+2×0 ; …) = (2 1 ; 4 3).", "d": "<b>AB = (2 1 ; 4 3)</b> : coefficient (1,1) : 1×0 + 2×1 = 2 ; (1,2) : 1×1 + 2×0 = 1 ; (2,1) : 3×0 + 4×1 = 4 ; (2,2) : 3×1 + 4×0 = 3.<div class='ex-detail'><u>Exemple rédigé</u> : la règle : ligne i de A × colonne j de B. Alors que BA = (3 4 ; 1 2) : AB ≠ BA : le produit matriciel N'EST PAS commutatif : la vérification BA sert souvent de question piège. Piège : « (0 2 ; 3 4) » est le produit TERME à TERME, qui n'est PAS la définition du produit matriciel.</div>"},
{"t": "Arithmétique et matrices (Terminale)", "q": "det de A = (1 2 ; 3 4) et A⁻¹ ?", "c": ["det = 7, A⁻¹ = (1/7)(1 −3 ; −2 4)", "det = −2, A⁻¹ = (−1/2)(4 −2 ; −3 1)", "det = −2, A⁻¹ = (−1/2)(1 −2 ; −3 4)", "det = 4, A⁻¹ = (1/4)(4 −2 ; −3 1)"], "a": 1, "e": "det = 1×4 − 2×3 = −2 ; A⁻¹ = (1/det)(d −b ; −c a).", "d": "<b>det = −2 ; A⁻¹ = (1/(−2))·(4 −2 ; −3 1)</b> : échanger la diagonale, opposer l'autre, diviser par det.<div class='ex-detail'><u>Exemple rédigé</u> : formule : A = (a b ; c d) ⟹ A⁻¹ = (1/(ad−bc))·(d −b ; −c a). Vérification rapide : A·A⁻¹ = I ✓ (produit : (1×(−2)+2×(3/2) ; …) = (1 0 ; 0 1)). Piège : « det = 4 » additionnerait ad + bc au lieu de ad − bc ; garder le signe NÉGATIF du det jusqu'au bout.</div>"},
{"t": "Arithmétique et matrices (Terminale)", "q": "Système : x + 2y = 5 et 3x + 4y = 6, écrit AX = B. Alors X = ?", "c": ["A⁻¹B", "B A⁻¹", "AB", "A + B"], "a": 0, "e": "AX = B ⟹ X = A⁻¹B (multiplier par l'inverse À GAUCHE).", "d": "<b>X = A⁻¹B</b> : on multiplie l'égalité à GAUCHE par A⁻¹ : A⁻¹(AX) = (A⁻¹A)X = X.<div class='ex-detail'><u>Exemple rédigé</u> : ici det = −2 ≠ 0 : A inversible : X = A⁻¹B = (−1/2)(4 −2 ; −3 1)(5 ; 6) = (−1/2)(20−12 ; −15+6) = (−1/2)(8 ; −9) = (−4 ; 4,5). Contrôle : x = −4, y = 4,5 : −4 + 9 = 5 ✓ ; −12 + 18 = 6 ✓. Piège : « BA⁻¹ » n'a même pas toujours de sens dimensionnel : l'ordre est IMPOSÉ par la position de A (à gauche de X). Conclusion : x = −4, y = 4,5.</div>"},
{"t": "Arithmétique et matrices (Terminale)", "q": "Le PGCD de 48 et 18 par l'algorithme d'Euclide :", "c": ["9", "6", "3", "2"], "a": 1, "e": "48 = 18×2 + 12 ; 18 = 12×1 + 6 ; 12 = 6×2 + 0 : pgcd = 6.", "d": "<b>6</b> : 48 = 2×18 + 12, puis 18 = 1×12 + 6, puis 12 = 2×6 + 0.<div class='ex-detail'><u>Exemple rédigé</u> : l'algorithme : pgcd(a, b) = pgcd(b, reste), jusqu'au reste nul. Le dernier reste NON NUL est le pgcd (6). Contrôle : 6 | 48 (48 = 6×8) et 6 | 18 (18 = 6×3), et 8, 3 premiers entre eux ✓. Piège : s'arrêter à 12 (l'avant-dernier reste) : le pgcd est le DERNIER reste non nul, juste AVANT le reste 0.</div>"},
{"t": "Arithmétique et matrices (Terminale)", "q": "Théorème de Gauss : si a | bc et a premier avec b, alors…", "c": ["b | c", "a | c", "a | b", "c | a"], "a": 1, "e": "Gauss : a divise alors nécessairement c.", "d": "<b>a | c</b> : Gauss : si a divise bc et est premier avec b, sa « force de division » passe dans c.<div class='ex-detail'><u>Exemple rédigé</u> : exemple : 6 | 10×9 = 90 ; 6 premier avec 10 ⟹ 6 | 9 ? NON : attention : 6 n'est pas premier avec 10 ? pgcd(6,10) = 2 : l'hypothèse échoue : l'exemple est invalide, ce qui confirme la nécessité de VÉRIFIER la primalité. Exemple valide : 6 | 35×12 ; pgcd(6, 35) = 1 ⟹ 6 | 12 ✓. Application type : résolution d'équations diophantiennes ax + by = c : décomposition par Gauss. Piège : sans l'hypothèse « premiers entre eux », la conclusion est fausse : 2 | 4×3 et 2 | 4, mais 2 ∤ 3 : l'hypothèse manquait.</div>"},
{"t": "Arithmétique et matrices (Terminale)", "q": "A×A⁻¹ = ?", "c": ["det(A)", "I (identité)", "A", "0"], "a": 1, "e": "A·A⁻¹ = A⁻¹·A = I : la définition même de l'inverse.", "d": "<b>I</b> : A·A⁻¹ = I = A⁻¹·A (l'inverse marche des DEUX côtés).<div class='ex-detail'><u>Exemple rédigé</u> : pour les matrices 2×2 : I = (1 0 ; 0 1) : la « neutralité multiplicative » (comme ×1 pour les nombres, comme +0 pour l'addition). Rôles : I sert à « ne rien changer » : AI = IA = A. Piège : « det(A) » sort de la formule de l'inverse mais n'est pas le produit A·A⁻¹ : refaire le calcul sur un exemple (A = (2 0 ; 0 2) : A⁻¹ = (0,5 0 ; 0 0,5) : produit = I ✓) ancre la définition.</div>"},
{"t": "Périmètres et aires (6e)", "q": "Aire d'un carré de périmètre 20 cm ?", "c": ["400 cm²", "5 cm²", "25 cm²", "80 cm²"], "a": 2, "e": "Côté = 20/4 = 5 cm, donc aire = 5² = 25 cm².", "d": "Enchaînement : périmètre → côté (P/4) → aire (c²).<div class='ex-detail'><u>Exemple rédigé</u> : côté = 20 ÷ 4 = 5 cm ; aire = 5 × 5 = <b>25 cm²</b>. Piège majeur : 400 = 20² — on ne peut PAS appliquer « aire = périmètre au carré » ! Le périmètre est une longueur d'unité cm, l'aire une surface d'unité cm² : les deux grandeurs ne se mélangent jamais directement.</div>"}];
var currentChap = null;
var META_BY_ID = {}; var FICHE_BY_ID = {};
COURS_META.forEach(function(c){ META_BY_ID[c.id] = c; });
FICHES_DATA.forEach(function(f){ FICHE_BY_ID[f.id] = f.fiche; });

function chapHeadHTML(m){
  return '<div class="chap-head"><span class="chap-title">📖 Mathématiques — ' + esc(m.titre) + '</span>' +
    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();
  if (t === 'quiz') {
    var bar = document.getElementById('quiz-chapbar');
    if (currentChap && META_BY_ID[currentChap]) { bar.innerHTML = chapHeadHTML(META_BY_ID[currentChap]); startTraining(META_BY_ID[currentChap].theme); }
    else { bar.innerHTML = ''; state.mode = 'menu'; render(); }
  }
  if (t === 'prog' || t === 'cours') window.scrollTo({top:0});
}
function clearChap(){ currentChap = null; }

function goCours(id){
  currentChap = id;
  showTab('cours');
  window.scrollTo({top:0, behavior:'smooth'});
}
function goCoursList(){ currentChap = null; showTab('cours'); }

function ficheHTML(id, num, open){
  var m = META_BY_ID[id]; var f = FICHE_BY_ID[id];
  return '<details class="fiche" id="fiche-' + id + '"' + (open ? ' open' : '') + '>' +
    '<summary><span class="fiche-num">' + num + '</span> Fiche — ' + esc(m.titre) + ' <span class="niv" style="font-size:.7rem;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-weight:700;margin-left:6px">' + esc(m.niveau) + '</span></summary>' +
    '<div class="fiche-body">' +
    '<div class="fiche-actions"><button class="btn-pdf" onclick="printFiche(\'' + id + '\')">🖨️ Imprimer</button><button class="btn-pdf" onclick="fichePDF(\'' + id + '\')">📄 PDF</button></div>' +
    '<div class="print-title">Fiche synthétique — ' + esc(m.titre) + ' (' + esc(m.niveau) + ')</div>' +
    f +
    '</div></details>';
}

function renderFiches(){
  var z = document.getElementById('fiches-zone'); var h = '';
  if (currentChap && FICHE_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += ficheHTML(currentChap, 1, true);
  } else {
    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
    var i = 1;
    FICHES_DATA.forEach(function(f){ h += ficheHTML(f.id, i); i++; });
  }
  z.innerHTML = h;
}

// ===== Générateur PDF autonome (A4, Helvetica) — aucune dépendance externe =====
var PDF_CP1252 = { 0x2018:0x91, 0x2019:0x92, 0x201A:0x82, 0x201C:0x93, 0x201D:0x94, 0x201E:0x84, 0x2013:0x96, 0x2014:0x97, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x20AC:0x80, 0x0152:0x8C, 0x0153:0x9C, 0x0160:0x8A, 0x0161:0x9A, 0x0178:0x9F, 0x017D:0x8E, 0x017E:0x9E, 0x192:0x83, 0x2C6:0x88, 0x2032:0xB4, 0x2039:0x8B, 0x203A:0x9B, 0x201E2:0 };
function pdfTranslit(s){
  return s.replace(/\u2212|\u2013|\u2014/g, '-').replace(/[\u2032\u2019]/g, "'")
    .replace(/\u2192|\u21D2|\u21A6/g, '->').replace(/\u2190/g, '<-')
    .replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u2260/g, '!=').replace(/\u2248/g, '~')
    .replace(/\u2208/g, ' in ').replace(/\u2205/g, 'vide').replace(/\u2286/g, 'incl.')
    .replace(/\u221A/g, 'V').replace(/\u00B7|\u2219|\u22C5/g, '*').replace(/\u2022/g, '-')
    .replace(/\u2124/g, 'Z').replace(/\u211D/g, 'R').replace(/\u2115/g, 'N').replace(/\u2119/g, 'P')
    .replace(/\u00A0/g, ' ').replace(/\u202F|\u2009|\u200B|\uFE0F/g, '')
    .replace(/[\u2460-\u2468]/g, function(c){ return (c.charCodeAt(0) - 0x2460 + 1) + ')'; })
    .replace(/[\u2600-\u27BF\uD800-\uDFFF\uE000-\uF8FF]/g, '')
    .replace(/[\uD83C-\uFFFD]/g, function(c){ return c.charCodeAt(0) < 0x10000 && c.charCodeAt(0) > 0xFFF0 ? '' : c; })
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '');
}
function pdfEnc(s){
  var out = '';
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i), b = null;
    if (c < 256) { if (c >= 32 || c === 10) b = c; }
    else if (PDF_CP1252[c] !== undefined) b = PDF_CP1252[c];
    if (b !== null && b !== undefined) out += String.fromCharCode(b);
  }
  return out;
}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
var PDF_INLINE = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, SMALL:1, SUB:1, SUP:1, A:1, CODE:1, ABBR:1 };
function pdfSegs(node, bold, out){
  for (var c = node.firstChild; c; c = c.nextSibling){
    if (c.nodeType === 3){
      var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
      if (t.trim() !== '') out.push({ t: t, b: bold });
      else if (t === ' ' && out.length && out[out.length - 1].t.charAt(out[out.length - 1].t.length - 1) !== ' ') out[out.length - 1].t += ' ';
    } else if (c.nodeType === 1){
      var g = c.tagName;
      if (g === 'BR') { out.push({ t: '\n', b: bold }); }
      else if (g === 'B' || g === 'STRONG') pdfSegs(c, true, out);
      else pdfSegs(c, bold, out);
    }
  }
}
function pdfNodeCollect(root){
  var blocks = [];
  function flushPending(){ pend = []; }
  var pend = [];
  function emitP(){ if (pend.length) { blocks.push({ type: 'p', segs: pend, indent: indent }); pend = []; } }
  function emitBlock(type, el, ind, bold){
    var segs = []; pdfSegs(el, bold || false, segs);
    if (type === 'li') segs = [{ t: '- ', b: bold || false }].concat(segs);
    if (type === 'h') segs.forEach(function(s){ s.b = true; });
    if (segs.length) blocks.push({ type: type, segs: segs, indent: ind });
  }
  var indent = 0;
  function walk(n){
    for (var c = n.firstChild; c; c = c.nextSibling){
      if (c.nodeType === 3){
        var t = c.textContent.replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ');
        if (t.trim() !== '') pend.push({ t: t, b: false });
      } else if (c.nodeType === 1){
        var g = c.tagName;
        var cl = ' ' + (c.className || '') + ' ';
        if (cl.indexOf('fiche-actions') >= 0 || cl.indexOf('print-title') >= 0) continue;
        if (g === 'BR') { emitP(); continue; }
        if (PDF_INLINE[g]) { pdfSegs(c, false, pend); continue; }
        emitP();
        if (/^H[1-6]$/.test(g)) emitBlock('h', c, indent);
        else if (g === 'LI') emitBlock('li', c, indent + 16);
        else if (g === 'UL' || g === 'OL') {
          for (var li = c.firstChild; li; li = li.nextSibling){
            if (li.nodeType === 1 && li.tagName === 'LI') { emitBlock('li', li, indent + 16); walk(li); }
          }
        }
        else if (g === 'TABLE' || g === 'THEAD' || g === 'TBODY'){
          for (var tr = c.firstChild; tr; tr = tr.nextSibling){
            if (tr.nodeType !== 1) continue;
            if (tr.tagName === 'TR'){
              var cells = [];
              for (var td = tr.firstChild; td; td = td.nextSibling){
                if (td.nodeType === 1 && (td.tagName === 'TD' || td.tagName === 'TH')){
                  var cs = []; pdfSegs(td, td.tagName === 'TH', cs);
                  cells.push(cs.map(function(x){ return x.t; }).join('').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
                }
              }
              var line = cells.join('   |   ');
              if (line.replace(/\s/g, '') !== '') blocks.push({ type: 'p', segs: [{ t: line, b: false }], indent: indent + 8 });
            } else if (tr.tagName === 'THEAD' || tr.tagName === 'TBODY') walk(tr);
          }
        }
        else if (g === 'P') { emitBlock('p', c, indent); }
        else { var keep = indent; walk(c); indent = keep; }
      }
    }
    emitP();
  }
  walk(root);
  return blocks;
}
function pdfWrap(blocks){
  var W = 595.28, M = 50, lines = [];
  blocks.forEach(function(b, bi){
    var isTitle = b.type === 'title';
    var size = isTitle ? 15 : (b.type === 'h' ? 12 : 10.5);
    var indent = b.indent || 0;
    var budget = Math.floor((W - 2 * M - indent) / (0.52 * size));
    var words = [];
    b.segs.forEach(function(s){
      var parts = s.t.split('\n');
      parts.forEach(function(p, pi){
        if (pi > 0) words.push({ br: true });
        p.split(' ').forEach(function(w){ if (w !== '') words.push({ w: w, b: s.b }); });
        if (pi < parts.length - 1) {} else { words.push({ sp: true, b: s.b }); }
      });
    });
    var cur = [], len = 0;
    function flushLine(){ if (cur.length) { lines.push({ segs: cur, size: size, indent: indent, gap: isTitle ? 0 : (b.type === 'h' ? 7 : 4) }); cur = []; len = 0; } }
    for (var i = 0; i < words.length; i++){
      var wd = words[i];
      if (wd.br) { flushLine(); continue; }
      if (wd.sp) { continue; }
      var wlen = wd.w.length + 1;
      if (len + wlen > budget && cur.length) flushLine();
      var last = cur.length ? cur[cur.length - 1] : null;
      var piece = (last ? ' ' : '') + wd.w;
      if (last && last.b === wd.b) last.t += piece;
      else cur.push({ t: piece, b: wd.b });
      len += wlen;
    }
    flushLine();
    if (isTitle) lines.push({ rule: true });
  });
  return lines;
}
function pdfBuild(lines){
  var W = 595.28, H = 841.89, M = 50, TOP = H - M;
  var pages = [], cur = [], y = TOP;
  lines.forEach(function(ln){
    if (ln.rule){
      if (y - 14 < M) { pages.push(cur); cur = []; y = TOP; }
      y -= 12;
      cur.push('0.29 0.27 0.9 RG 1.5 w ' + M + ' ' + y.toFixed(2) + ' m ' + (W - M) + ' ' + y.toFixed(2) + ' l S\n0 0 0 RG 1 w');
      y -= 8;
      return;
    }
    var lh = ln.size * 1.42 + (ln.gap || 0);
    if (y - lh < M) { pages.push(cur); cur = []; y = TOP; }
    y -= (ln.gap || 0);
    y -= ln.size * 1.15;
    var x = M + (ln.indent || 0);
    ln.segs.forEach(function(s){
      if (!s.t) return;
      var enc = pdfEnc(pdfTranslit(s.t));
      if (!enc) return;
      cur.push('BT 1 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Tm /F' + (s.b ? 2 : 1) + ' ' + ln.size + ' Tf (' + pdfEsc(enc) + ') Tj ET');
      x += 0.52 * ln.size * enc.length;
    });
    y -= ln.size * 0.27;
  });
  if (cur.length) pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  var kids = [];
  for (var i = 0; i < pages.length; i++) kids.push((5 + 2 * i) + ' 0 R');
  objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for (var p = 0; p < pages.length; p++){
    var po = 5 + 2 * p, co = 6 + 2 * p;
    objs[po] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + co + ' 0 R >>';
    var stream = pages[p].join('\n');
    objs[co] = 'STREAM:' + stream;
  }
  var out = '%PDF-1.4\n';
  var offs = [];
  for (var i = 1; i < objs.length; i++){
    offs[i] = out.length;
    if (objs[i].indexOf('STREAM:') === 0){
      var st = objs[i].slice(7);
      out += i + ' 0 obj\n<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream\nendobj\n';
    } else out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
  }
  var xr = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
  for (var i = 1; i < objs.length; i++) out += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
  return out;
}
function pdfDownload(pdfStr, filename){
  var bytes = new Uint8Array(pdfStr.length);
  for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/["«»“”*<>|\\/]/g, '').replace(/[:?]/g, ' -').replace(/\s+/g, ' ').trim() + '.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function downloadFichePDF(elt, name){
  var t = elt.querySelector('.print-title');
  var raw = t ? (t.textContent || '') : ''; if (!raw) raw = (name || ''); raw = raw + ''; var title = raw.replace(/\s+/g, ' ').trim() || 'Fiche';
  var body = elt.querySelector('.fiche-body') || elt;
  var blocks = pdfNodeCollect(body);
  blocks.unshift({ type: 'title', segs: [{ t: title, b: true }], indent: 0 });
  pdfDownload(pdfBuild(pdfWrap(blocks)), title);
}

function fichePDF(id){ var el = document.getElementById('fiche-' + id); if (!el) return;
  downloadFichePDF(el, META_BY_ID[id] ? META_BY_ID[id].titre : id); }
function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
