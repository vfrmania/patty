var PROGRAMME = [{"n": "Collège — 6e", "ch": [{"t": "Nombres entiers et décimaux : opérations, divisibilité", "id": null}, {"t": "Fractions : comparaison, addition, soustraction", "id": null}, {"t": "Proportionnalité et pourcentages", "id": null}, {"t": "Géométrie de base : figures, angles, symétries", "id": null}, {"t": "Périmètres et aires", "id": null}]}, {"n": "Collège — 5e", "ch": [{"t": "Nombres relatifs : repérage, addition, soustraction", "id": null}, {"t": "Premières expressions littérales et simplification", "id": null}, {"t": "Triangles : somme des angles, inégalité triangulaire", "id": null}, {"t": "Parallélogrammes et quadrilatères", "id": null}, {"t": "Statistiques : organisation et lecture de données", "id": null}]}, {"n": "Collège — 4e", "ch": [{"t": "Puissances et écriture scientifique", "id": null}, {"t": "Théorème de Pythagore et sa réciproque", "id": "pythagore"}, {"t": "Théorème des milieux et droite des milieux", "id": null}, {"t": "Calcul littéral : distributivité, réduction", "id": null}, {"t": "Équations du premier degré à une inconnue", "id": null}, {"t": "Proportionnalité : vitesses, échelles", "id": null}, {"t": "Pyramides et cônes : volumes", "id": null}]}, {"n": "Collège — 3e", "ch": [{"t": "Théorème de Thalès et sa réciproque", "id": null}, {"t": "Trigonométrie dans le triangle rectangle (cos, sin, tan)", "id": null}, {"t": "Racines carrées et calculs associés", "id": null}, {"t": "Développement et factorisation, identités remarquables", "id": null}, {"t": "Notion de fonction : image, antécédent, lecture graphique", "id": null}, {"t": "Statistiques : moyennes, médiane, étendue", "id": null}, {"t": "Sphères et sections de solides ; rotation et translation", "id": null}]}, {"n": "Lycée — 2de", "ch": [{"t": "Ensembles de nombres (N, Z, Q, R) et calcul littéral", "id": null}, {"t": "Fonctions de référence : carré, cube, inverse, racine", "id": null}, {"t": "Fonctions : variations, extremums, lectures graphiques", "id": null}, {"t": "Vecteurs et géométrie repérée", "id": null}, {"t": "Statistiques descriptives : quartiles, écart type", "id": null}, {"t": "Probabilités : événements, calculs de base", "id": null}, {"t": "Configurations du plan et trigonométrie (sinus, cosinus)", "id": null}]}, {"n": "Lycée — 1re", "ch": [{"t": "Second degré : discriminant, forme canonique, factorisation", "id": null}, {"t": "Dérivation : nombre dérivé, tangentes, dérivées usuelles", "id": "derivation"}, {"t": "Dérivation : opérations et étude des variations", "id": null}, {"t": "Suites arithmétiques et géométriques", "id": null}, {"t": "Probabilités conditionnelles et indépendance", "id": null}, {"t": "Produit scalaire et applications", "id": null}, {"t": "Variables aléatoires, espérance, variance", "id": null}]}, {"n": "Lycée — Terminale (spécialité)", "ch": [{"t": "Suites : récurrence, convergence, limites", "id": null}, {"t": "Limites de fonctions et asymptotes", "id": null}, {"t": "Continuité et théorème des valeurs intermédiaires", "id": null}, {"t": "Primitives et calcul intégral", "id": null}, {"t": "Logarithmes népériens et exponentielles", "id": null}, {"t": "Lois de probabilité : binomiale, normale", "id": null}, {"t": "Équations différentielles", "id": null}, {"t": "Arithmétique et matrices (maths expertes)", "id": null}]}];
var COURS_META = [{"id": "pythagore", "theme": "Pythagore (collège)", "niveau": "4e", "titre": "Théorème de Pythagore", "cours": "<div class=\"cours-head\"><h2>Théorème de Pythagore</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche de ce chapitre</a><a onclick=\"showTab('quiz')\">🧪 QCM de ce chapitre</a></div>\n<h3>1. Vocabulaire</h3>\n<p>Dans un triangle rectangle, l'hypoténuse est le côté opposé à l'angle droit. C'est <b>toujours le côté le plus long</b>. Le théorème de Pythagore ne s'applique <b>que dans un triangle rectangle</b>.</p>\n<h3>2. L'énoncé du théorème</h3>\n<div class=\"tip\"><b>Théorème :</b> si un triangle est rectangle, alors le carré de l'hypoténuse est égal à la somme des carrés des deux autres côtés.<br>Si ABC est rectangle en A : <b>BC² = AB² + AC²</b>.</div>\n<h3>3. Calculer une longueur</h3>\n<div class=\"ex\"><b>Exemple 1 — calcul de l'hypoténuse :</b> ABC rectangle en A, AB = 3 cm, AC = 4 cm. Alors BC² = 3² + 4² = 9 + 16 = 25, donc BC = √25 = <b>5 cm</b>.</div>\n<div class=\"ex\"><b>Exemple 2 — calcul d'un côté de l'angle droit :</b> ABC rectangle en A, BC = 13 cm, AC = 5 cm. Alors AB² = BC² − AC² = 169 − 25 = 144, donc AB = √144 = <b>12 cm</b>.</div>\n<h3>4. Réciproque et contraposée</h3>\n<div class=\"tip\"><b>Réciproque :</b> si, dans un triangle, le carré du plus long côté est égal à la somme des carrés des deux autres, alors ce triangle est rectangle (l'angle droit est opposé au plus long côté).</div>\n<div class=\"ex\"><b>Exemple :</b> triangle de côtés 6 ; 8 ; 10. On a 10² = 100 et 6² + 8² = 36 + 64 = 100. Le triangle est donc rectangle.</div>\n<div class=\"warn\"><b>Contraposée (pour démontrer qu'un triangle n'est PAS rectangle) :</b> si BC² ≠ AB² + AC², alors le triangle ABC n'est pas rectangle.</div>\n<h3>5. Applications</h3>\n<ul>\n<li><b>Démontrer qu'un triangle est rectangle</b> (réciproque) ou ne l'est pas (contraposée).</li>\n<li><b>Calculs de distances</b> : diagonale d'un rectangle (√(L² + l²)), hauteur dans un carré, déplacements « en escalier » (le plus court chemin est la diagonale).</li>\n<li>Base de la <b>trigonométrie</b> et du calcul de distances en géométrie repérée : distance entre deux points M(x<sub>M</sub>; y<sub>M</sub>) et N(x<sub>N</sub>; y<sub>N</sub>) : MN = √((x<sub>N</sub> − x<sub>M</sub>)² + (y<sub>N</sub> − y<sub>M</sub>)²).</li>\n</ul>\n<h3>6. Triplets pythagoriciens à connaître</h3>\n<table><tr><th>Triplet</th><th>Vérification</th></tr>\n<tr><td>(3 ; 4 ; 5)</td><td>9 + 16 = 25</td></tr>\n<tr><td>(5 ; 12 ; 13)</td><td>25 + 144 = 169</td></tr>\n<tr><td>(8 ; 15 ; 17)</td><td>64 + 225 = 289</td></tr>\n<tr><td>(6 ; 8 ; 10)</td><td>36 + 64 = 100 (= (3;4;5) × 2)</td></tr></table>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b><ul>\n<li>Confondre le théorème (triangle <i>déjà</i> rectangle → calcul) et la réciproque (on <i>vérifie</i> s'il l'est).</li>\n<li>Écrire BC² = AB² + AC² dans un triangle rectangle en B (c'est AC² = AB² + BC² : l'hypoténuse est le côté qui apparaît <b>seul</b>).</li>\n<li>Oublier la racine carrée : BC² = 25 signifie BC = 5, pas 25.</li>\n<li>Donner une longueur négative : une longueur est toujours positive, on prend la racine carrée positive.</li></ul></div>"}, {"id": "derivation", "theme": "Dérivation (1re)", "niveau": "1re", "titre": "Dérivation", "cours": "<div class=\"cours-head\"><h2>Dérivation</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche de ce chapitre</a><a onclick=\"showTab('quiz')\">🧪 QCM de ce chapitre</a></div>\n<h3>1. Nombre dérivé et taux d'accroissement</h3>\n<p>Soit f une fonction définie sur un intervalle I et a ∈ I. Le <b>taux d'accroissement</b> de f entre a et a + h est :</p>\n<div class=\"tip\">T(h) = (f(a + h) − f(a)) / h</div>\n<p>Si T(h) tend vers une limite finie ℓ quand h tend vers 0, on dit que f est <b>dérivable en a</b> et ℓ = <b>f′(a)</b>, le nombre dérivé de f en a.</p>\n<div class=\"ex\"><b>Exemple :</b> f(x) = x², a = 1. T(h) = ((1+h)² − 1)/h = (2h + h²)/h = 2 + h → 2 quand h → 0. Donc f′(1) = 2.</div>\n<h3>2. Interprétation géométrique : la tangente</h3>\n<div class=\"tip\"><b>Tangente en a :</b> la tangente à la courbe de f au point d'abscisse a est la droite d'équation <b>y = f′(a)(x − a) + f(a)</b>. Son coefficient directeur est f′(a).</div>\n<p>La tangente est la « meilleure approximation affine » de f au voisinage de a : f(a + h) ≈ f(a) + h·f′(a).</p>\n<h3>3. Dérivées des fonctions usuelles</h3>\n<table><tr><th>f(x)</th><th>f′(x)</th><th>Valable sur</th></tr>\n<tr><td>x<sup>n</sup> (n ∈ N*)</td><td>n·x<sup>n−1</sup></td><td>ℝ</td></tr>\n<tr><td>1/x</td><td>−1/x²</td><td>ℝ \\ {0} = ]−∞;0[ ∪ ]0;+∞[</td></tr>\n<tr><td>√x</td><td>1/(2√x)</td><td>]0; +∞[</td></tr>\n<tr><td>cos(x)</td><td>−sin(x)</td><td>ℝ</td></tr>\n<tr><td>sin(x)</td><td>cos(x)</td><td>ℝ</td></tr>\n<tr><td>x ↦ x</td><td>1</td><td>ℝ</td></tr>\n<tr><td>k (constante)</td><td>0</td><td>ℝ</td></tr></table>\n<h3>4. Opérations sur les dérivées</h3>\n<table><tr><th>Fonction</th><th>Dérivée</th><th>Conditions</th></tr>\n<tr><td>u + v</td><td>u′ + v′</td><td>u et v dérivables</td></tr>\n<tr><td>k·u (k constante)</td><td>k·u′</td><td>u dérivable</td></tr>\n<tr><td>u × v</td><td>u′v + uv′</td><td>u et v dérivables</td></tr>\n<tr><td>1/v</td><td>−v′/v²</td><td>v dérivable et v ≠ 0</td></tr>\n<tr><td>u/v</td><td>(u′v − uv′)/v²</td><td>v dérivable et v ≠ 0</td></tr>\n<tr><td>u(niveau entier) : u<sup>n</sup></td><td>n·u′·u<sup>n−1</sup></td><td>u dérivable</td></tr>\n<tr><td>√u</td><td>u′/(2√u)</td><td>u dérivable et u > 0</td></tr></table>\n<h3>5. Lien dérivée / variations</h3>\n<ul>\n<li>Si f′(x) &gt; 0 sur un intervalle, alors f est <b>strictement croissante</b> sur cet intervalle.</li>\n<li>Si f′(x) &lt; 0, f est <b>strictement décroissante</b>.</li>\n<li>Si f′(x) = 0 sur un intervalle, f est <b>constante</b>.</li>\n<li>Si f′ s'annule et <b>change de signe</b> en a : f présente un <b>extremum local</b> en a (maximum si f′ passe de + à −, minimum si de − à +).</li>\n</ul>\n<div class=\"warn\"><b>Attention :</b> f′(a) = 0 ne suffit pas pour un extremum : il faut que la dérivée <b>change de signe</b> (ex. f(x) = x³ en 0 : f′(0) = 0 mais pas d'extremum, la fonction reste croissante).</div>\n<h3>6. Méthode type d'étude de fonction</h3>\n<ul>\n<li>① Domaine de définition ;</li>\n<li>② Calcul de f′(x) (développer/factoriser pour étudier son signe) ;</li>\n<li>③ Tableau de signes de f′ ;</li>\n<li>④ Tableau de variations de f (f′ positive → flèche montante) ;</li>\n<li>⑤ Extremums locaux le cas échéant.</li>\n</ul>\n<div class=\"ex\"><b>Exemple :</b> f(x) = x³ − 3x sur ℝ. f′(x) = 3x² − 3 = 3(x − 1)(x + 1). f′ &gt; 0 sur ]−∞;−1[ ∪ ]1;+∞[, f′ &lt; 0 sur ]−1;1[. Donc f croît, décroît, recroît : maximum local en −1 (f(−1) = 2), minimum local en 1 (f(1) = −2).</div>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b><ul>\n<li>(uv)′ n'est PAS u′v′ : c'est u′v + uv′.</li>\n<li>(u/v)′ : l'ordre dans « u′v − uv′ » compte (au numérateur) ; le dénominateur est v².</li>\n<li>(1/x)′ = −1/x² (le signe − est souvent oublié) ; (√x)′ = 1/(2√x) (le 2 aussi).</li>\n<li>Une fonction peut être dérivable partout sauf en un point (ex. √x en 0 : la tangente est verticale, f n'est pas dérivable en 0).</li>\n<li>Dérivable ⇒ continue, mais continue ⇏ dérivable (ex. valeur absolue en 0).</li></ul></div>"}];
var FICHES_DATA = [{"id": "pythagore", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Théorème :</b> triangle rectangle en A ⟹ BC² = AB² + AC² (hypoténuse au carré = somme des carrés des deux autres côtés).</p>\n<p><b>Réciproque :</b> BC² = AB² + AC² ⟹ triangle rectangle en A (le plus long côté est l'hypoténuse).</p>\n<p><b>Contraposée :</b> BC² ≠ AB² + AC² ⟹ le triangle n'est pas rectangle.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calculer l'hypoténuse :</b> BC = √(AB² + AC²)</li>\n<li><b>Calculer un côté de l'angle droit :</b> AB = √(BC² − AC²)</li>\n<li><b>Vérifier si un triangle est rectangle :</b> comparer le plus grand carré à la somme des deux autres (réciproque).</li>\n</ul>\n<h3>🔢 Triplets utiles</h3>\n<p>(3 ; 4 ; 5) — (5 ; 12 ; 13) — (8 ; 15 ; 17) — et leurs multiples : (6 ; 8 ; 10), (9 ; 12 ; 15)…</p>\n<h3>🧮 Formules dérivées</h3>\n<ul>\n<li>Diagonale d'un rectangle : d = √(L² + l²)</li>\n<li>Distance MN = √((x<sub>N</sub>−x<sub>M</sub>)² + (y<sub>N</sub>−y<sub>M</sub>)²)</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Ne s'applique QUE dans un triangle rectangle.</li>\n<li>L'hypoténuse est toujours le côté le plus long = celui qui est <b>seul</b> dans l'égalité.</li>\n<li>Ne pas oublier la racine carrée finale (√25 = 5).</li>\n</ul>"}, {"id": "derivation", "fiche": "<h3>📌 Définitions</h3>\n<p><b>Nombre dérivé :</b> f′(a) = lim<sub>h→0</sub> (f(a+h) − f(a)) / h.</p>\n<p><b>Tangente en a :</b> y = f′(a)(x − a) + f(a) (coefficient directeur : f′(a)).</p>\n<h3>🔢 Dérivées usuelles</h3>\n<table><tr><th>f</th><th>x<sup>n</sup></th><th>1/x</th><th>√x</th><th>cos x</th><th>sin x</th><th>k</th></tr>\n<tr><td><b>f′</b></td><td>n x<sup>n−1</sup></td><td>−1/x²</td><td>1/(2√x)</td><td>−sin x</td><td>cos x</td><td>0</td></tr></table>\n<h3>➕ Opérations</h3>\n<ul>\n<li>(u + v)′ = u′ + v′ ; (k u)′ = k u′</li>\n<li>(uv)′ = u′v + uv′</li>\n<li>(1/v)′ = −v′/v² ; (u/v)′ = (u′v − uv′)/v²</li>\n<li>(u<sup>n</sup>)′ = n u′ u<sup>n−1</sup> ; (√u)′ = u′/(2√u)</li>\n</ul>\n<h3>📈 Variations</h3>\n<ul>\n<li>f′ &gt; 0 ⟹ f croissante ; f′ &lt; 0 ⟹ f décroissante.</li>\n<li>f′ s'annule ET change de signe en a ⟹ extremum local en a.</li>\n</ul>\n<h3>🎯 Méthode d'étude</h3>\n<p>Domaine → f′(x) factorisée → signe de f′ → tableau de variations → extremums.</p>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>(uv)′ ≠ u′v′.</li>\n<li>f′(a) = 0 seul ne prouve pas un extremum (changement de signe obligatoire : x³ en 0).</li>\n<li>Dérivable ⇒ continue, mais pas l'inverse (|x| en 0).</li>\n</ul>"}];
var QUESTIONS = [{"t": "Pythagore (collège)", "q": "Dans un triangle ABC rectangle en A, quelle égalité est toujours vraie ?", "c": ["BC = AB + AC", "AB² = BC² + AC²", "BC² = AB² + AC²", "AC² = AB² + BC²"], "a": 2, "e": "L'hypoténuse BC (côté opposé à l'angle droit) est seule dans l'égalité : BC² = AB² + AC².", "d": "La notion clé : dans un triangle <b>rectangle en A</b>, le côté opposé à l'angle droit (l'hypoténuse BC) apparaît <b>seul</b> dans l'égalité.<div class='ex-detail'><u>Exemple</u> : si AB = 6 et AC = 8, alors BC² = 6² + 8² = 100 et BC = 10. Si on avait écrit AB² = BC² + AC², on obtiendrait 36 = 100 + 64 : absurde, car AB (côté de l'angle droit) ne peut pas être le plus long côté.</div>"}, {"t": "Pythagore (collège)", "q": "ABC est rectangle en A avec AB = 3 et AC = 4. Quelle est la longueur BC ?", "c": ["12", "25", "5", "7"], "a": 2, "e": "BC² = 3² + 4² = 25, donc BC = √25 = 5.", "d": "Méthode : appliquer le théorème puis prendre la <b>racine carrée</b> du résultat.<div class='ex-detail'><u>Exemple rédigé</u> : BC² = AB² + AC² = 3² + 4² = 9 + 16 = 25. Donc BC = √25 = <b>5</b>. Attention au piège : BC² vaut 25, mais BC vaut 5 — ne pas confondre le carré et sa racine.</div>"}, {"t": "Pythagore (collège)", "q": "Comment s'appelle le côté opposé à l'angle droit dans un triangle rectangle ?", "c": ["Le côté adjacent", "La hauteur", "La médiane", "L'hypoténuse"], "a": 3, "e": "L'hypoténuse est le côté opposé à l'angle droit ; c'est toujours le plus long côté.", "d": "Vocabulaire de base : l'<b>hypoténuse</b> est le côté opposé à l'angle droit ; c'est toujours le côté le plus long, et c'est lui qui est « seul » dans l'égalité de Pythagore.<div class='ex-detail'><u>Exemple</u> : dans un triangle rectangle en A avec AB = 5 et AC = 12, l'hypoténuse est BC et BC = √(25 + 144) = 13. La hauteur et la médiane sont des <i>segments</i> (droites), pas des côtés.</div>"}, {"t": "Pythagore (collège)", "q": "Un triangle a pour côtés 5, 12 et 13. Que peut-on conclure ?", "c": ["Il est rectangle (réciproque du théorème)", "On ne peut rien conclure", "Il est équilatéral", "Il n'est pas rectangle"], "a": 0, "e": "13² = 169 = 5² + 12² = 25 + 144. La réciproque du théorème de Pythagore s'applique : le triangle est rectangle.", "d": "Pour vérifier si un triangle est rectangle, on utilise la <b>réciproque</b> : comparer le carré du plus long côté à la somme des carrés des deux autres.<div class='ex-detail'><u>Exemple rédigé</u> : 13² = 169 et 5² + 12² = 25 + 144 = 169. Comme 13² = 5² + 12², le triangle est rectangle, et l'angle droit est opposé au côté 13. (Rappel : (5 ; 12 ; 13) est un triplet pythagoricien classique, comme (3 ; 4 ; 5) et (8 ; 15 ; 17).)</div>"}, {"t": "Pythagore (collège)", "q": "Un triangle a pour côtés 4, 5 et 7. Ce triangle…", "c": ["est rectangle", "est isocèle", "n'est pas rectangle (contraposée)", "est rectangle en le sommet opposé au côté 4"], "a": 2, "e": "7² = 49 mais 4² + 5² = 41 ≠ 49 : la contraposée montre qu'il n'est pas rectangle.", "d": "La <b>contraposée</b> du théorème : si le plus grand carré ne correspond PAS à la somme des deux autres, le triangle n'est PAS rectangle.<div class='ex-detail'><u>Exemple rédigé</u> : 7² = 49 mais 4² + 5² = 16 + 25 = 41. Comme 49 ≠ 41, le triangle n'est pas rectangle (quelle que soit la position des côtés).</div>"}, {"t": "Pythagore (collège)", "q": "ABC rectangle en A, BC = 13 et AC = 5. Combien vaut AB ?", "c": ["√18", "18", "8", "12"], "a": 3, "e": "AB² = BC² − AC² = 169 − 25 = 144, donc AB = √144 = 12.", "d": "Quand on cherche un côté de l'angle droit, on <b>soustrait</b> : le carré de l'hypoténuse moins le carré de l'autre côté.<div class='ex-detail'><u>Exemple rédigé</u> : AB² = BC² − AC² = 13² − 5² = 169 − 25 = 144, donc AB = √144 = <b>12</b>. (On reconnaît le triplet (5 ; 12 ; 13).) Piège classique : additionner au lieu de soustraire donne √194 ≈ 13,9, ce qui serait plus long que l'hypoténuse : impossible.</div>"}, {"t": "Pythagore (collège)", "q": "Quelle est la diagonale d'un rectangle de longueur 8 et de largeur 6 ?", "c": ["14", "48", "10", "√14"], "a": 2, "e": "d² = 8² + 6² = 100, donc d = 10 (triplet (6 ; 8 ; 10)).", "d": "La diagonale d'un rectangle découpe le rectangle en <b>deux triangles rectangles</b> : la diagonale est l'hypoténuse de chaque triangle.<div class='ex-detail'><u>Exemple rédigé</u> : d² = 8² + 6² = 64 + 36 = 100, donc d = <b>10</b>. Astuce : (6 ; 8 ; 10) est le double du triplet (3 ; 4 ; 5) — les tripletts font gagner du temps aux examens.</div>"}, {"t": "Pythagore (collège)", "q": "Le théorème de Pythagore permet de…", "c": ["calculer une longueur dans un triangle rectangle", "calculer un angle dans un triangle rectangle", "calculer l'aire d'un triangle", "démontrer qu'un triangle est isocèle"], "a": 0, "e": "Le théorème relie les longueurs des côtés d'un triangle rectangle ; la trigonométrie sert pour les angles.", "d": "Le théorème de Pythagore relie uniquement les <b>longueurs</b> des côtés d'un triangle rectangle.<div class='ex-detail'><u>À retenir</u> : pour les <b>angles</b>, on utilise la trigonométrie (cos, sin, tan). Exemple : dans un triangle rectangle en A avec AB = 3, AC = 4, BC = 5, le théorème donne BC = 5 ; pour calculer l'angle B, on utilise cos(B) = AB/BC = 3/5. Deux outils différents pour deux données différentes.</div>"}, {"t": "Pythagore (collège)", "q": "Dans un triangle rectangle, l'hypoténuse est…", "c": ["le côté le plus court", "le côté le plus long", "toujours horizontal", "un côté de l'angle droit"], "a": 1, "e": "L'hypoténuse, opposée à l'angle droit, est toujours le côté le plus long du triangle rectangle.", "d": "L'hypoténuse est le côté opposé à l'angle droit et donc nécessairement le <b>plus long</b>. Un argument simple : dans l'égalité BC² = AB² + AC², BC² est la somme de deux nombres positifs, donc BC² dépasse AB² et AC².<div class='ex-detail'><u>Exemple</u> : avec AB = 3 et AC = 4, on trouve BC = 5 > 4 > 3. Si un « hypothénuse » était plus court qu'un autre côté, l'égalité serait impossible.</div>"}, {"t": "Pythagore (collège)", "q": "BC² = 25 dans un triangle rectangle. Combien vaut BC ?", "c": ["625", "25", "50", "5"], "a": 3, "e": "BC est la racine carrée de 25 : BC = 5. Piège classique : ne pas oublier la racine !", "d": "Erreur ultra-classique : confondre <b>le carré de la longueur</b> et <b>la longueur</b>. Le théorème donne un carré ; la longueur est sa racine carrée.<div class='ex-detail'><u>Exemple rédigé</u> : BC² = 25 ⟹ BC = √25 = <b>5</b>. Vérification inverse : si BC = 5, alors BC² = 25 ✓ ; si BC = 25, alors BC² = 625 ≠ 25 ✗. Toujours terminer par une racine.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de f(x) = x³ ?", "c": ["f′(x) = 3x²", "f′(x) = x²", "f′(x) = 3x⁴", "f′(x) = 3x"], "a": 0, "e": "Pour xⁿ, la dérivée est n·xⁿ⁻¹ : (x³)′ = 3x².", "d": "Règle générale : (xⁿ)′ = <b>n·xⁿ⁻¹</b> — l'exposant descend en coefficient, l'exposant diminue de 1.<div class='ex-detail'><u>Exemple rédigé</u> : (x³)′ = 3x². De même (x⁵)′ = 5x⁴ et (x)′ = 1 (= 1x⁰). Piège : ne pas écrire 3x⁴ (l'exposant ne monte pas !) ni x² (oubli du coefficient).</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de f(x) = 1/x sur ]0 ; +∞[ ?", "c": ["f′(x) = −1/x²", "f′(x) = 1/x²", "f′(x) = 1/(2√x)", "f′(x) = −1/x"], "a": 0, "e": "La dérivée de 1/x est −1/x² (ne pas oublier le signe moins).", "d": "Dérivées usuelles à connaître par cœur : (1/x)′ = <b>−1/x²</b> et (√x)′ = 1/(2√x).<div class='ex-detail'><u>Exemple rédigé</u> : pour f(x) = 1/x, f′(2) = −1/4. Le signe « − » signifie que f est décroissante sur ]0 ; +∞[ (ce qui se voit sur la courbe : elle descend). Oublier le « − » fausse ensuite tout le tableau de variations.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est l'équation de la tangente à la courbe de f au point d'abscisse a ?", "c": ["y = f(a)(x) + f′(a)", "y = f′(a)(x + a) − f(a)", "y = f(a)(x − a) + f′(a)", "y = f′(a)(x − a) + f(a)"], "a": 3, "e": "Tangente : y = f′(a)(x − a) + f(a). f′(a) est le coefficient directeur.", "d": "Formule à mémoriser : tangente en a : y = <b>f′(a)(x − a) + f(a)</b>. Structure : coefficient directeur f′(a) × (x − a) + ordonnée du point f(a).<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = x² en a = 1 : f′(x) = 2x donc f′(1) = 2 et f(1) = 1. Tangente : y = 2(x − 1) + 1 = 2x − 1. Vérification : en x = 1, la droite donne y = 1 = f(1) ✓ et sa pente 2 = f′(1) ✓.</div>"}, {"t": "Dérivation (1re)", "q": "Si f′(x) > 0 sur un intervalle I, alors f est…", "c": ["strictement croissante sur I", "négative sur I", "constante sur I", "strictement décroissante sur I"], "a": 0, "e": "Le signe de la dérivée donne le sens de variation : f′ > 0 ⟹ f strictement croissante.", "d": "Lien fondamental : le <b>signe de f′</b> donne le <b>sens de variation de f</b>. f′ > 0 ⟹ f monte ; f′ < 0 ⟹ f descend ; f′ = 0 ⟹ f constante.<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = x² sur ℝ. f′(x) = 2x, négatif sur ]−∞ ; 0] et positif sur [0 ; +∞[. Donc f décroît puis croît, avec un minimum en 0. On retrouve bien la parabole connue.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de f(x) = √x sur ]0 ; +∞[ ?", "c": ["f′(x) = 1/(2√x)", "f′(x) = 1/√x", "f′(x) = −1/(2√x)", "f′(x) = 2√x"], "a": 0, "e": "(√x)′ = 1/(2√x) : le 2 au dénominateur est souvent oublié.", "d": "Dérivée usuelle : (√x)′ = <b>1/(2√x)</b> — le 2 au dénominateur est souvent oublié.<div class='ex-detail'><u>Exemple rédigé</u> : en a = 4, f′(4) = 1/(2√4) = 1/4. La tangente en 4 à la courbe de √x a donc une pente de 0,25. Astuce pour retenir la formule : (√x)′ = u′/(2√u) appliqué à u = x.</div>"}, {"t": "Dérivation (1re)", "q": "f(x) = x⁴ − 3x² + 7. Que vaut f′(x) ?", "c": ["4x³ − 6", "4x³ − 6x", "x⁴ − 6x", "4x³ − 3x + 7"], "a": 1, "e": "Terme à terme : (x⁴)′ = 4x³, (−3x²)′ = −6x, (7)′ = 0.", "d": "On dérive <b>terme à terme</b> (somme) : (x⁴)′ = 4x³, (−3x²)′ = −6x (constante × xⁿ), (7)′ = 0.<div class='ex-detail'><u>Exemple rédigé</u> : f′(x) = 4x³ − 6x. Rappels : (k·xⁿ)′ = k·n·xⁿ⁻¹ et la dérivée d'une constante est 0 — le « + 7 » disparaît donc complètement.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de g(x) = (2x + 1)(x − 3) ?", "c": ["g′(x) = 2(x − 3)·(2x + 1)", "g′(x) = (2x + 1) + (x − 3)", "g′(x) = 2", "g′(x) = 2(x − 3) + (2x + 1)·1"], "a": 3, "e": "Avec (uv)′ = u′v + uv′ : u′ = 2, v′ = 1. ATTENTION : (uv)′ ≠ u′v′.", "d": "Formule du produit : (uv)′ = <b>u′v + uv′</b> — jamais u′v′ !<div class='ex-detail'><u>Exemple rédigé</u> : u = 2x + 1 (u′ = 2) et v = x − 3 (v′ = 1). g′(x) = 2(x − 3) + (2x + 1)·1 = 2x − 6 + 2x + 1 = 4x − 5. Vérification : en développant g(x) = 2x² − 5x − 3, on dérive : 4x − 5 ✓. Les deux méthodes donnent le même résultat.</div>"}, {"t": "Dérivation (1re)", "q": "f′ s'annule en a en changeant de signe (+ vers −). Que se passe-t-il ?", "c": ["f est constante après a", "f présente un minimum local en a", "f présente un point d'inflexion en a", "f présente un maximum local en a"], "a": 3, "e": "Changement de signe de la dérivée = extremum local ; + vers − = maximum.", "d": "Extremum local = la dérivée s'annule <b>ET change de signe</b> : + → − donne un maximum, − → + donne un minimum.<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = x³ − 3x. f′(x) = 3x² − 3 = 3(x − 1)(x + 1). En −1 : f′ passe de + à − → maximum local f(−1) = 2. En 1 : f′ passe de − à + → minimum local f(1) = −2. C'est le signe de f′ qui commande le tableau de variations.</div>"}, {"t": "Dérivation (1re)", "q": "f(x) = x³. En 0, f′(0) = 0. Peut-on conclure à un extremum en 0 ?", "c": ["Non, car f′ ne change pas de signe en 0", "Oui, car f′(0) = 0", "Oui, c'est un minimum", "Oui, c'est un maximum"], "a": 0, "e": "f′(x) = 3x² ≥ 0 partout : f reste croissante, pas d'extremum. f′(a) = 0 seul ne suffit pas.", "d": "Piège du chapitre : f′(a) = 0 <b>ne suffit pas</b> pour un extremum, il faut un changement de signe de f′.<div class='ex-detail'><u>Exemple rédigé</u> : f′(x) = 3x² ≥ 0 pour tout x. La dérivée s'annule en 0 mais reste positive avant et après : la fonction ne change jamais de sens de variation (elle est croissante sur ℝ). Graphiquement, la courbe de x³ traverse sa tangente horizontale en 0 (point d'inflexion), elle ne fait pas de « bosse ».</div>"}, {"t": "Dérivation (1re)", "q": "Quelle affirmation est correcte ?", "c": ["Toute fonction dérivable est continue", "Continuité et dérivabilité sont équivalentes", "Une fonction dérivable n'est jamais continue", "Toute fonction continue est dérivable"], "a": 0, "e": "Dérivable ⇒ continue, mais la réciproque est fausse : |x| est continue en 0 mais non dérivable (tangente « en coin »).", "d": "Théorème du cours : <b>dérivable ⇒ continue</b>, mais la réciproque est fausse.<div class='ex-detail'><u>Exemple clé</u> : f(x) = |x| est continue en 0 (pas de « trou ») mais non dérivable en 0 : à gauche la pente est −1, à droite elle est +1 — la courbe a un « coin », impossible d'y tracer UNE seule tangente. En revanche, toute fonction dérivable en a est automatiquement continue en a.</div>"}];
var currentChap = null;
var META_BY_ID = {}; var FICHE_BY_ID = {};
COURS_META.forEach(function(c){ META_BY_ID[c.id] = c; });
FICHES_DATA.forEach(function(f){ FICHE_BY_ID[f.id] = f.fiche; });

function chapHeadHTML(m){
  return '<div class="chap-head"><span class="chap-title">📖 Mathématiques — ' + esc(m.titre) + '</span>' +
    '<span class="chap-links"><a href="#" onclick="goCoursList();return false;">📚 Tous les cours</a> &nbsp;·&nbsp; <a href="#" onclick="clearChap();showTab(\'prog\');return false;">← Programme</a> &nbsp;·&nbsp; <a href="../index.html">↩ Matières</a></span></div>';
}
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showTab(t){
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; });
  ['prog','cours','fiches','quiz'].forEach(function(v){ document.getElementById('tab-'+v).className = (v===t)?'active':''; });
  if (t === 'fiches') renderFiches();
  if (t === 'cours') renderCours();
  if (t === 'quiz') {
    var bar = document.getElementById('quiz-chapbar');
    if (currentChap && META_BY_ID[currentChap]) { bar.innerHTML = chapHeadHTML(META_BY_ID[currentChap]); startTraining(META_BY_ID[currentChap].theme); }
    else { bar.innerHTML = ''; state.mode = 'menu'; render(); }
  }
  if (t === 'prog' || t === 'cours') window.scrollTo({top:0});
}
function clearChap(){ currentChap = null; }

function goCours(id){
  currentChap = id;
  showTab('cours');
  window.scrollTo({top:0, behavior:'smooth'});
}
function goCoursList(){ currentChap = null; showTab('cours'); }

function ficheHTML(id, num, open){
  var m = META_BY_ID[id]; var f = FICHE_BY_ID[id];
  return '<details class="fiche" id="fiche-' + id + '"' + (open ? ' open' : '') + '>' +
    '<summary><span class="fiche-num">' + num + '</span> Fiche — ' + esc(m.titre) + ' <span class="niv" style="font-size:.7rem;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-weight:700;margin-left:6px">' + esc(m.niveau) + '</span></summary>' +
    '<div class="fiche-body">' +
    '<div class="fiche-actions"><button class="btn-pdf" onclick="printFiche(\'' + id + '\')">🖨️ Imprimer / PDF</button></div>' +
    '<div class="print-title">Fiche synthétique — ' + esc(m.titre) + ' (' + esc(m.niveau) + ')</div>' +
    f +
    '</div></details>';
}

function renderFiches(){
  var z = document.getElementById('fiches-zone'); var h = '';
  if (currentChap && FICHE_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += ficheHTML(currentChap, 1, true);
  } else {
    h += '<section class="card"><h2>🗂️ Fiches synthétiques</h2><p style="font-size:.92rem">Toutes les fiches, une par chapitre. Ouvrez un cours : l\'onglet 🗂️ Fiche affichera uniquement la fiche de ce chapitre.</p></section>';
    var i = 1;
    FICHES_DATA.forEach(function(f){ h += ficheHTML(f.id, i); i++; });
  }
  z.innerHTML = h;
}

function printFiche(id){
  var el = document.getElementById('fiche-' + id);
  if (!el) return;
  var details = document.querySelectorAll('details.fiche');
  details.forEach(function(d){ d.classList.remove('print-target'); d.removeAttribute('open'); });
  el.classList.add('print-target');
  el.setAttribute('open','');
  window.print();
}

var state = { mode:'menu', theme:null, idx:0, qs:[], answers:[] };
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startTraining(theme){ state.mode='train'; state.theme = theme; state.qs = shuffle(QUESTIONS.filter(function(q){ return q.t === theme; })); state.idx = 0; state.answers = []; render(); }
function backMenu(){ state.mode='menu'; render(); }
function select(i){
  if (state.mode !== 'train' || state.idx >= state.qs.length) return;
  state.answers[state.idx] = i;
  var q = state.qs[state.idx]; var btns = document.querySelectorAll('#quiz-app .choice');
  btns.forEach(function(b, k){ b.classList.remove('sel'); if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('ko'); else b.classList.add('dim'); b.disabled = true; });
  var ex = document.getElementById('expl');
  if (ex) {
    ex.style.display = 'block';
    if (i === q.a) { ex.innerHTML = '✅ Exact ! 💡 ' + esc(q.e); }
    else { ex.innerHTML = '❌ Mauvaise réponse. La bonne réponse était : <b class="green">' + esc(q.c[q.a]) + '</b>.<br><b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e)); }
  }
  var nx = document.getElementById('btn-next'); if (nx) nx.disabled = false;
}
function nextQ(){ if (state.idx < state.qs.length - 1){ state.idx++; render(); } else { state.mode='result'; render(); } }
function prevQ(){ if (state.idx > 0){ state.idx--; render(); } }
function render(){
  var app = document.getElementById('quiz-app'); var h = '';
  if (state.mode === 'menu'){
    h += '<h2 class="q">Choisissez un chapitre à réviser</h2>';
    COURS_META.forEach(function(c){
      var n = QUESTIONS.filter(function(q){ return q.t === c.theme; }).length;
      h += '<button class="theme-btn" onclick="startTraining(\'' + c.theme.replace(/\'/g, "\\'") + '\')"><span>🧪 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">' + n + ' q.</span></button>';
    });
    h += '<p style="margin-top:14px;font-size:.82rem;color:#64748b">Ouvrez un cours (onglet 📖) : l\'onglet 🧪 lancera directement son QCM.</p>';
  } else if (state.mode === 'train'){
    var q = state.qs[state.idx];
    h += '<div class="meta"><span>' + esc(q.t) + '</span><span>' + (state.idx + 1) + ' / ' + state.qs.length + '</span></div>';
    h += '<h2 class="q">' + esc(q.q) + '</h2>';
    q.c.forEach(function(c, k){ h += '<button class="choice" onclick="select(' + k + ')">' + String.fromCharCode(65 + k) + '. ' + esc(c) + '</button>'; });
    h += '<div class="expl" id="expl" style="display:none"></div>';
    h += '<div class="quiz-foot"><button class="btn-gray btn-small" id="btn-prev" onclick="prevQ()" ' + (state.idx === 0 ? 'disabled' : '') + '>← Précédent</button>' +
      '<span><button class="btn-gray btn-small" onclick="backMenu()">✖ Quitter</button> <button class="btn btn-primary btn-small" id="btn-next" style="width:auto" onclick="nextQ()" ' + (state.answers[state.idx] === undefined ? '' : '') + (state.answers[state.idx] === undefined ? 'disabled' : '') + '>Suivant →</button></span></div>';
  } else {
    var ok = 0; state.qs.forEach(function(q, i){ if (state.answers[i] === q.a) ok++; });
    var pct = Math.round(100 * ok / state.qs.length);
    h += '<div class="meta"><span>Résultat — ' + esc(state.theme) + '</span><span>' + ok + ' / ' + state.qs.length + '</span></div>';
    h += '<div class="res-note ' + (pct >= 70 ? 'green' : 'red') + '">' + pct + ' %</div>';
    state.qs.forEach(function(q, i){
      h += '<div class="res-card">' + (state.answers[i] === q.a ? '✅' : '❌') + ' <b>' + esc(q.q) + '</b><br>' +
        (state.answers[i] === q.a ? '' : 'Réponse correcte : <b class="green">' + esc(q.c[q.a]) + '</b><br>') + '<span style="font-size:.82rem;color:#64748b">' + (state.answers[i] === q.a ? '💡 ' + esc(q.e) : '<b>🧠 Pour comprendre :</b><br>' + (q.d || esc(q.e))) + '</span></div>';
    });
    h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="startTraining(state.theme)">🔄 Recommencer</button></div>';
    h += '<div style="margin-top:10px"><button class="btn-gray btn-small" onclick="backMenu()">← Autre chapitre</button></div>';
  }
  app.innerHTML = h;
}

// Programme : liste cliquable des niveaux/chapitres
(function(){
  var v = document.getElementById('view-prog'); var h = '';
  PROGRAMME.forEach(function(niv){
    h += '<h2 class="niveau">' + esc(niv.n) + '</h2>';
    niv.ch.forEach(function(ch){
      if (ch.id) {
        h += '<button class="chap-btn" onclick="goCours(\'' + ch.id + '\')"><span>📖 ' + esc(ch.t) + '</span><span class="actions"><span class="mini">Cours</span><span class="mini">Fiche</span><span class="mini">QCM</span></span></button>';
      } else {
        h += '<div class="chap-btn soon"><span>📖 ' + esc(ch.t) + '</span><span class="soon-badge">à venir</span></div>';
      }
    });
  });
  v.innerHTML = '<section class="card"><h2>📋 Programme de mathématiques</h2><p style="font-size:.9rem;margin-bottom:8px">Cliquez sur un chapitre rédigé pour ouvrir son cours. Les onglets « 🗂️ Fiche » et « 🧪 QCM » suivront alors ce chapitre.</p>' + h + '</section>';
})();

// Cours : rendu contextuel
function renderCours(){
  var v = document.getElementById('view-cours'); var h = '';
  if (currentChap && META_BY_ID[currentChap]) {
    var m = META_BY_ID[currentChap];
    h += chapHeadHTML(m);
    h += '<section class="card" id="cours-' + m.id + '">' + m.cours + '</section>';
  } else {
    var list = COURS_META.map(function(c){ return '<button class="theme-btn" onclick="goCours(\'' + c.id + '\')"><span>📖 ' + esc(c.titre) + ' <span style="color:#94a3b8;font-size:.8rem">(' + c.niveau + ')</span></span><span class="cnt">cours</span></button>'; }).join('');
    h += '<section class="card"><h2>📖 Les cours</h2><p style="font-size:.92rem">Cliquez sur un chapitre : l\'onglet affichera ensuite uniquement ce cours, sa fiche et son QCM.</p>' + list + '</section>';
    COURS_META.forEach(function(c){
      h += '<section class="card" id="cours-' + c.id + '">' + c.cours + '</section>';
    });
  }
  v.innerHTML = h;
}
renderCours();

var backTop = document.getElementById('back-top');
backTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', function(){ if (window.scrollY > 300) backTop.classList.add('visible'); else backTop.classList.remove('visible'); }, { passive: true });
showTab('prog');
</script>
