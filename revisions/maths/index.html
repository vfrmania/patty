{"t": "Statistiques (5e)", "q": "Combien d'élèves ont eu AU MOINS 4 (12 à 3, 8 à 4, 5 à 5) ?", "c": ["13", "25", "5", "8"], "a": 0, "e": "Au moins 4 = notes 4 et 5 : 8 + 5 = 13 élèves.", "d": "« Au moins 4 » inclut les notes <b>4 ET 5</b> : 8 + 5 = <b>13</b>.<div class='ex-detail'><u>Exemple rédigé</u> : vocabulaire : « au moins x » ⟹ x inclus ; « plus de x » ⟹ x EXCLU (« plus de 4 » donnerait ici seulement 5 : un seul élève ? non, 5). Piège : 8 (seulement les 4) ; 5 (seulement les 5). Contrôle : 25 − 12 (les 3) = 13 ✓.</div>"},
{"t": "Statistiques (5e)", "q": "La somme des fréquences de toutes les valeurs d'une série vaut…", "c": ["n'importe quoi", "360", "100 ou 1 selon l'unité", "l'effectif total"], "a": 2, "e": "En % : 100 ; en décimal : 1. C'est un excellent contrôle.", "d": "Fréquences en décimal : somme = <b>1</b> ; en pourcentage : <b>100 %</b>.<div class='ex-detail'><u>Exemple rédigé</u> : avec 48 %, 32 % et 20 % : 48 + 32 + 20 = 100 ✓. Ce contrôle détecte une erreur d'effectif ou de division. Piège : 360° : c'est la somme des ANGLES d'un diagramme circulaire, pas des fréquences.</div>"},
{"t": "Statistiques (5e)", "q": "Diagramme circulaire : 10 élèves sur 40 préfèrent le foot. Angle du secteur ?", "c": ["90°", "100°", "36°", "25°"], "a": 0, "e": "10/40 de 360° = 360 ÷ 4 = 90°.", "d": "Angle = (effectif ÷ total) × 360 = 0,25 × 360 = <b>90°</b>.<div class='ex-detail'><u>Exemple rédigé</u> : proportionnalité : un quart des élèves = un quart du tour complet = 90°. Piège : 25° (utiliser le POURCENTAGE comme angle) ; 100° (croiser % et degrés). Contrôle : tous les angles du diagramme doivent totaliser 360°.</div>"},
{"t": "Statistiques (5e)", "q": "Moyenne pondérée : 12 élèves à 3, 8 à 4, 5 à 5. La moyenne vaut…", "c": ["3,72", "3", "4", "93"], "a": 0, "e": "(3×12 + 4×8 + 5×5) ÷ 25 = 93 ÷ 25 = 3,72.", "d": "Somme pondérée : 36 + 32 + 25 = 93 ; effectif total 25 : moyenne = <b>3,72</b>.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi pondérer : 12 élèves à 3 « pèsent » 12 fois la note 3. Piège : 4 = moyenne SIMPLE de {3, 4, 5} (qui donnerait le même poids à chaque note). Contrôle d'ordre de grandeur : la majorité a 3, la moyenne doit rester proche de 3 : 3,72 ✓.</div>"},
{"t": "Statistiques (5e)", "q": "On connaît l'effectif total (25) et deux effectifs (12 et 8). Le troisième vaut…", "c": ["5", "30", "11", "20"], "a": 0, "e": "25 − (12 + 8) = 5.", "d": "Effectif manquant = total − somme des autres : 25 − 20 = <b>5</b>.<div class='ex-detail'><u>Exemple rédigé</u> : ce calcul revient dans presque tous les tableaux d'effectifs incomplets. Variante avec fréquences : si deux fréquences valent 48 % et 32 %, la troisième vaut 100 − 80 = 20 %. Piège : additionner 12 + 8 = 20 sans soustraire du total.</div>"},
{"t": "Statistiques (5e)", "q": "Dans un diagramme en bâtons, la hauteur d'un bâton représente…", "c": ["le pourcentage de la classe suivante", "l'effectif de la valeur", "la fréquence en degrés", "la valeur elle-même"], "a": 1, "e": "Bâton = effectif (ou fréquence) de la valeur portée en abscisse.", "d": "Le diagramme en bâtons porte les VALEURS en abscisse et les <b>EFFECTIFS</b> en hauteur.<div class='ex-detail'><u>Exemple rédigé</u> : pour la série de notes : trois bâtons (abscisses 3, 4, 5) de hauteurs 12, 8, 5. Distinction : histogramme/bâtons ⟹ valeurs ou CLASSES ; circulaire ⟹ ANGLES. Piège : « la valeur elle-même » : 3, 4 et 5 seraient alors des hauteurs, et les effectifs auraient disparu du graphique.</div>"},
{"t": "Statistiques (5e)", "q": "La moyenne d'une série est 3,72. Que dire des notes des élèves ?", "c": ["Ceux qui ont eu 3 sont au-dessus de la moyenne", "Tous ont eu 3,72", "Aucun n'a forcément eu 3,72", "La moyenne est fausse si personne n'a 3,72"], "a": 2, "e": "La moyenne est un nombre « fictif » : elle n'apparaît pas forcément dans la série.", "d": "La moyenne est un <b>indicateur théorique</b> : ici personne n'a 3,72 (notes : 3, 4, 5 seulement) et pourtant elle est correcte.<div class='ex-detail'><u>Exemple rédigé</u> : elle sert à COMPARER des groupes (deux classes, deux mois) même si elle ne correspond à aucun individu. Piège : « tous ont eu 3,72 » : impossible, les notes étaient des entiers ; « ceux qui ont 3 sont au-dessus » : 3 &lt; 3,72, ils sont en DESSOUS.</div>"},
{"t": "Statistiques (5e)", "q": "« Plus de 4 » signifie…", "c": ["strictement au-delà de 4 (5 ici)", "exactement 4", "moins de 4", "4 et plus"], "a": 0, "e": "« Plus de 4 » exclut 4 ; « au moins 4 » l'inclurait.", "d": "« <b>Plus de</b> 4 » = strictement supérieur : ici la note 5 uniquement. « <b>Au moins</b> 4 » = 4 et 5.<div class='ex-detail'><u>Exemple rédigé</u> : sur la série (12 à 3, 8 à 4, 5 à 5) : « plus de 4 » ⟹ 5 élèves ; « au moins 4 » ⟹ 13 élèves : la frontière CHANGE TOUT. Piège : confondre les deux expressions est l'erreur la plus fréquente des lectures de tableaux ; souligner « au moins » ou « plus de » dans l'énoncé avant de calculer.</div>"},
{"t": "Ensembles de nombres (2de)", "q": "Le nombre −5 appartient à…", "c": ["ℤ mais pas à ℕ", "ℕ seulement", "ℚ mais pas à ℤ", "ℝ seulement"], "a": 0, "e": "−5 est un entier relatif : il est dans ℤ (et donc ℚ et ℝ), mais pas dans ℕ.", "d": "−5 ∈ <b>ℤ</b> (entiers relatifs = positifs ET négatifs). Il appartient aussi à ℚ et ℝ (emboîtement ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ).<div class='ex-detail'><u>Exemple rédigé</u> : ℕ = {0 ; 1 ; 2…} ne contient aucun négatif. Piège : croire que « négatif ⟹ pas rationnel » : −5 = −10/2 est un quotient d'entiers, donc rationnel. Seul ℕ lui est interdit.</div>"},
{"t": "Ensembles de nombres (2de)", "q": "Quel est le plus petit ensemble contenant 0,75 ?", "c": ["ℤ", "ℚ", "ℝ∖ℚ", "ℕ"], "a": 1, "e": "0,75 = 75/100 = 3/4 : quotient d'entiers ⟹ ℚ.", "d": "0,75 = <b>3/4</b> : un décimal est toujours un quotient d'entiers ⟹ <b>ℚ</b>.<div class='ex-detail'><u>Exemple rédigé</u> : tout nombre à virgule FINI s'écrit p/10^n : 0,75 = 75/100, simplifié en 3/4. Piège : « ℝ∖ℚ » désigne les irrationnels comme π ou √2, dont l'écriture décimale est INFINIE et non périodique. Un décimal fini est toujours rationnel.</div>"},
{"t": "Ensembles de nombres (2de)", "q": "√16 appartient à…", "c": ["ℕ", "ℚ mais pas ℤ", "ℝ∖ℚ (irrationnel)", "aucun ensemble"], "a": 0, "e": "√16 = 4, un entier naturel : donc ∈ ℕ.", "d": "√16 = <b>4</b> ⟹ ∈ ℕ (et donc ℤ, ℚ, ℝ).<div class='ex-detail'><u>Exemple rédigé</u> : toujours SIMPLIFIER la racine avant de classer. √25 = 5 ∈ ℕ ; √(1/4) = 1/2 ∈ ℚ ; mais √5, √2 restent irrationnels. Piège : dire « une racine carrée est irrationnelle » : c'est vrai pour √5, faux pour √16 — le calcul décide, pas le symbole √.</div>"},
{"t": "Ensembles de nombres (2de)", "q": "L'inéquation −2 ≤ x < 5 correspond à l'intervalle…", "c": ["[−2 ; 5]", "]−2 ; 5[", "[−2 ; 5[", "]−2 ; 5]"], "a": 2, "e": "−2 est compris (≤ : crochet fermé), 5 est exclu (< : crochet ouvert).", "d": "Règle des crochets : <b>≤ ou ≥ ⟹ crochet FERMÉ</b> ; <b>&lt; ou &gt; ⟹ crochet OUVERT</b> : [−2 ; 5[.<div class='ex-detail'><u>Exemple rédigé</u> : contrôle par valeurs : x = −2 : −2 ≤ −2 ✓ (inclus) ; x = 5 : 5 &lt; 5 faux (exclu). Astuce mnémotechnique : le « = » de ≤ « ferme la porte » au bord, le « &lt; » strict la laisse ouverte.</div>"},
{"t": "Ensembles de nombres (2de)", "q": "Développer (x + 5)².", "c": ["x² + 5x + 25", "x² + 10x + 25", "x² + 25", "x² + 10x + 5"], "a": 1, "e": "(a+b)² = a² + 2ab + b² : x² + 2×5×x + 25 = x² + 10x + 25.", "d": "Identité ① : (a + b)² = a² + <b>2ab</b> + b². Ici : x² + 2·x·5 + 5² = <b>x² + 10x + 25</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le piège x² + 25 oublie le DOUBLE PRODUIT 10x. Contrôle numérique : en x = 1, (1+5)² = 36 et 1 + 10 + 25 = 36 ✓ alors que 1 + 25 = 26 ✗. Toujours vérifier une identité avec une valeur simple.</div>"},
{"t": "Ensembles de nombres (2de)", "q": "Factoriser x² − 9.", "c": ["(x − 3)²", "(x + 3)(x − 3)", "(x − 9)(x + 1)", "x(x − 9)"], "a": 1, "e": "x² − 9 = x² − 3² = (x+3)(x−3) : identité a² − b².", "d": "Identité ③ : <b>a² − b² = (a + b)(a − b)</b>. Avec a = x et b = 3 : <b>(x + 3)(x − 3)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : réflexe : une différence de deux carrés se factorise TOUJOURS ainsi. Applications : factoriser x² − 100 = (x+10)(x−10), ou résoudre x² = 9 ⟹ (x+3)(x−3) = 0 ⟹ x = 3 ou x = −3 (deux solutions, pas une seule : piège x = 3 seul).</div>"},
{"t": "Ensembles de nombres (2de)", "q": "√9 + √16 = ?", "c": ["5", "12", "√25", "7"], "a": 3, "e": "√9 + √16 = 3 + 4 = 7, alors que √(9+16) = √25 = 5 : les deux ne coïncident pas.", "d": "3 + 4 = <b>7</b>. La racine d'une somme n'est PAS la somme des racines : √(9+16) = <b>5</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les seules règles valables : √(a×b) = √a×√b et √(a/b) = √a/√b. Piège type : √(9+16) = √9 + √16 = 7 est FAUX (√25 = 5). La racine « traverse » un produit ou un quotient, JAMAIS une somme.</div>"},
{"t": "Ensembles de nombres (2de)", "q": "Calculer 101² mentalement.", "c": ["10 100", "10 001", "1 111", "10 201"], "a": 3, "e": "101² = (100+1)² = 10 000 + 200 + 1 = 10 201.", "d": "101 = 100 + 1 : (100 + 1)² = 100² + 2×100×1 + 1² = 10 000 + 200 + 1 = <b>10 201</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la même technique : 99² = (100−1)² = 10 000 − 200 + 1 = 9 801 ; 102×98 = (100+2)(100−2) = 10 000 − 4 = 9 996. Piège : 10 100 = 10 000 + 100 additionne sans DOUBLER le produit croisé : le 2ab de l'identité est le cœur du calcul.</div>"},
{"t": "Ensembles de nombres (2de)", "q": "L'intervalle ]−∞ ; 7] contient…", "c": ["tous les x ≥ 7", "tous les x ≤ 7", "tous les x < 7", "seulement x = 7"], "a": 1, "e": "Crochet fermé en 7 : 7 est inclus ; −∞ toujours exclu. Donc x ≤ 7.", "d": "]−∞ ; 7] = {x ∈ ℝ ; <b>x ≤ 7</b>} : le crochet FERMÉ en 7 signifie « 7 compris ». Le symbole −∞ n'est pas un nombre : crochet toujours ouvert de ce côté.<div class='ex-detail'><u>Exemple rédigé</u> : contrôles : x = 7 ∈ ]−∞ ; 7] ✓ ; x = 7,1 ∉ ✗ ; x = −1000 ∈ ✓. Piège : « −∞ exclu » ne veut pas dire qu'une borne manque : l'intervalle s'étend indéfiniment vers la gauche, il contient tous les nombres réels jusqu'à 7 inclus.</div>"},
{"t": "Ensembles de nombres (2de)", "q": "Lequel est irrationnel (∈ ℝ∖ℚ) ?", "c": ["−4/3", "√25", "0,333… (période 3)", "√7"], "a": 3, "e": "0,333… = 1/3 est rationnel ; √7 ne s'écrit pas comme quotient d'entiers : irrationnel.", "d": "<b>√7 est irrationnel</b>. Les autres : 0,333… = 1/3 ∈ ℚ (toute écriture périodique est un quotient) ; −4/3 ∈ ℚ par définition ; √25 = 5 ∈ ℕ.<div class='ex-detail'><u>Exemple rédigé</u> : test rapide : peut-on écrire le nombre sous forme p/q (p, q entiers) ? Oui ⟹ rationnel ; non (écriture décimale infinie non périodique) ⟹ irrationnel. √7 ≈ 2,6457513… sans période : irrationnel, comme √2 et π.</div>"},
{"t": "Fonctions de référence (2de)", "q": "Le domaine de définition de f(x) = 1/x est…", "c": ["[0 ; +∞[", "ℕ∖{0}", "ℝ∖{0}", "ℝ"], "a": 2, "e": "Il faut x ≠ 0 (division interdite) : domaine = ℝ∖{0} = ]−∞;0[ ∪ ]0;+∞[.", "d": "f(x) = 1/x est définie pour tout réel <b>non nul</b> : <b>ℝ∖{0}</b>, réunion de deux intervalles.<div class='ex-detail'><u>Exemple rédigé</u> : méthode générale : lister les opérations interdites — division par 0, racine d'un négatif. Ici seul 0 pose problème. Piège : « [0 ; +∞[ » inclurait 0 (interdit) ; la règle vaut aussi pour √x qui exige x ≥ 0 : chaque fonction a SON domaine.</div>"},
{"t": "Fonctions de référence (2de)", "q": "Résoudre x² = 16 dans ℝ.", "c": ["x = 4", "x = 16", "x = 4 ou x = −4", "x = ±8"], "a": 2, "e": "Deux nombres ont un carré égal à 16 : 4 et −4.", "d": "S = <b>{−4 ; 4}</b> : (−4)² = 16 = 4².<div class='ex-detail'><u>Exemple rédigé</u> : réflexe : une équation en x² = a (a &gt; 0) a TOUJOURS deux solutions opposées, √a et −√a. Contrôle graphique : la droite horizontale y = 16 coupe la parabole en deux points. Pièges : x = 4 seul (moitié de la réponse) ; ±8 confond carré et racine (8² = 64).</div>"},
{"t": "Fonctions de référence (2de)", "q": "La fonction carré est…", "c": ["croissante sur ]−∞ ; 0]", "décroissante sur ]−∞ ; 0] et croissante sur [0 ; +∞[", "croissante sur ℝ", "décroissante sur ℝ"], "a": 1, "e": "Parabole : elle descend jusqu'à 0 (minimum), puis remonte.", "d": "x² : <b>décroissante sur ]−∞ ; 0]</b>, <b>croissante sur [0 ; +∞[</b>, minimum 0 atteint en 0.<div class='ex-detail'><u>Exemple rédigé</u> : test numérique : f(−3) = 9 &gt; f(−1) = 1 : sur les négatifs, x monte et f(x) descend ⟹ décroissante ✓ ; f(1) = 1 &lt; f(3) = 9 : croissante sur les positifs ✓. Piège : « croissante sur ℝ » vaut pour la FONCTION CUBE, pas pour le carré.</div>"},
{"t": "Fonctions de référence (2de)", "q": "La fonction cube est…", "c": ["croissante sur ℝ", "décroissante sur ]−∞ ; 0]", "décroissante sur ℝ", "nulle en 0 seulement"], "a": 0, "e": "x³ est strictement croissante sur tout ℝ — c'est sa grande différence avec x².", "d": "x³ est <b>croissante sur ℝ ENTIER</b> : (−2)³ = −8 &lt; (−1)³ = −1 &lt; 0³ = 0 &lt; 1³ = 1.<div class='ex-detail'><u>Exemple rédigé</u> : contrairement au carré, le cube garde le SIGNE : plus x augmente, plus x³ augmente, même chez les négatifs. Conséquence : x³ = 8 a une seule solution (x = 2), alors que x² = 8 en a deux. Piège : croire que « toute fonction puissance décroît puis croît ».</div>"},
{"t": "Fonctions de référence (2de)", "q": "Comparer 1/3 et 1/5.", "c": ["1/3 < 1/5", "On ne peut pas comparer", "1/3 > 1/5", "1/3 = 1/5"], "a": 2, "e": "3 < 5 (positifs) ⟹ 1/3 > 1/5 : l'inverse renverse l'ordre.", "d": "3 &lt; 5 ⟹ <b>1/3 &gt; 1/5</b> (0,333… &gt; 0,2). L'inverse renverse l'ordre entre nombres POSITIFS.<div class='ex-detail'><u>Exemple rédigé</u> : c'est la traduction de « 1/x décroît sur ]0 ; +∞[ ». Piège : appliquer la règle aux négatifs sans précaution : −3 &lt; 2 mais 1/(−3) ≈ −0,33 &lt; 0,5 = 1/2 : l'ordre N'EST PAS renversé entre un négatif et un positif — la décroissance n'est valable que BRANCHE PAR BRANCHE.</div>"},
{"t": "Fonctions de référence (2de)", "q": "√x est définie pour…", "c": ["x > 0", "x ≥ 0", "x ≥ 1", "tout x réel"], "a": 1, "e": "On ne prend la racine que d'un nombre positif ou nul : domaine [0 ; +∞[.", "d": "Domaine de √ : <b>[0 ; +∞[</b> — √0 = 0 existe, mais √(−9) n'existe pas dans ℝ.<div class='ex-detail'><u>Exemple rédigé</u> : test : √0 = 0 ✓ (0 est ADMIS, contrairement à 1/x où 0 est interdit). Piège : « x &gt; 0 » exclurait 0 à tort. Pour √(x−2), le domaine serait x − 2 ≥ 0, soit [2 ; +∞[ : on résout l'intérieur ≥ 0.</div>"},
{"t": "Fonctions de référence (2de)", "q": "Résoudre x² < 9.", "c": ["x < 3", "x < −3 ou x > 3", "−3 < x < 3", "x < ±3"], "a": 2, "e": "Les points de la parabole sous la hauteur 9 sont entre −3 et 3 : S = ]−3 ; 3[.", "d": "S = <b>]−3 ; 3[</b> : lecture sur la parabole, la portion de courbe sous y = 9.<div class='ex-detail'><u>Exemple rédigé</u> : contrôles : x = 0 : 0 &lt; 9 ✓ ; x = 2,9 : 8,41 &lt; 9 ✓ ; x = 3 : 9 &lt; 9 FAUX (3 exclu) ; x = −4 : 16 &gt; 9 ✗. Piège : « x &lt; 3 » oublie que (−5)² = 25 dépasse aussi 9 : les grands négatifs sont exclus par l'autre borne −3.</div>"},
{"t": "Fonctions de référence (2de)", "q": "La courbe de x² est symétrique par rapport à…", "c": ["l'origine", "l'axe des abscisses", "rien", "l'axe des ordonnées"], "a": 3, "e": "f(−x) = f(x) : (−3)² = 3² = 9. Symétrie axiale (axe vertical).", "d": "x² : f(−x) = f(x) ⟹ symétrie par rapport à <b>l'axe des ordonnées</b> ; x³ : f(−x) = −f(x) ⟹ symétrie par rapport à <b>l'origine</b>.<div class='ex-detail'><u>Exemple rédigé</u> : test rapide : (−2)² = 4 = 2² (mêmes images ⟹ axe vertical) ; (−2)³ = −8 = −(2³) (images opposées ⟹ centre O). Piège : intervertir les deux symétries — carré = MIROIR vertical, cube = DEMI-TOUR autour de O.</div>"},
{"t": "Fonctions de référence (2de)", "q": "Sur ]0 ; 1], comparer √x et x.", "c": ["√x = x", "Cela dépend de x", "√x ≥ x", "√x < x"], "a": 2, "e": "Sur [0 ; 1] : √x ≥ x (ex. √0,25 = 0,5 ≥ 0,25). Égalité en 0 et 1.", "d": "Sur <b>[0 ; 1] : √x ≥ x</b> ; sur [1 ; +∞[ : √x ≤ x ; égalité en 0 et 1.<div class='ex-detail'><u>Exemple rédigé</u> : √0,25 = 0,5 ≥ 0,25 ✓ ; √0,81 = 0,9 ≥ 0,81 ✓ ; mais √4 = 2 ≤ 4. Intuition : entre 0 et 1, prendre la racine « rapproche de 1 » (relève), au-delà de 1, elle « rapproche de 1 » aussi (abaisse). Piège : croire que la racine réduit toujours.</div>"},
{"t": "Fonctions de référence (2de)", "q": "x² = −4. Combien de solutions dans ℝ ?", "c": ["Aucune", "Une", "Deux", "Une infinité"], "a": 0, "e": "Un carré n'est jamais négatif : aucune solution.", "d": "<b>Aucune solution</b> : pour tout x ∈ ℝ, x² ≥ 0 &gt; −4.<div class='ex-detail'><u>Exemple rédigé</u> : même raisonnement pour x² = −0,01 : impossible. En revanche x³ = −8 a UNE solution (x = −2 : le cube garde le signe). Piège lié : x² + 1 = 0 n'a pas de solution réelle non plus. Retenir : carré = plage [0 ; +∞[ seulement ; cube = toute la droite ℝ.</div>"},
{"t": "Variations de fonctions (2de)", "q": "f(x) = x². Quels sont les antécédents de 25 ?", "c": ["25 seulement", "5 et −5", "√25 et −√25 = aucun", "5 seulement"], "a": 1, "e": "x² = 25 ⟹ x = 5 ou x = −5 : deux antécédents.", "d": "Antécédents de 25 : solutions de x² = 25 : <b>5 et −5</b>.<div class='ex-detail'><u>Exemple rédigé</u> : vocabulaire : l'ANTÉCÉDENT est la valeur de départ (abscisse), l'IMAGE la valeur d'arrivée (ordonnée). Piège : « 25 » confond antécédent et image ; « 5 seul » oublie la symétrie de la parabole. Contre-exemple utile : antécédents de −9 : AUCUN (un carré ≥ 0).</div>"},
{"t": "Variations de fonctions (2de)", "q": "L'image d'un nombre x par une fonction f est…", "c": ["toujours un entier", "identique à l'antécédent", "toujours unique", "parfois multiple"], "a": 2, "e": "Chaque x a une seule image f(x) ; en revanche une valeur peut avoir plusieurs antécédents.", "d": "Par définition d'une fonction, chaque antécédent a <b>UNE SEULE image</b> ; c'est la flèche d'arrivée qui peut être multiple (plusieurs x donnant la même image).<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = x² : image de −3 : 9, UNE. Antécédents de 9 : −3 ET 3, DEUX. Piège récurrent : dire « l'image de 9 est ±3 » : c'est l'inverse — 9 est l'image, ±3 sont les antécédents. Test visuel : une droite verticale x = a coupe la courbe en un point AU PLUS ; une horizontale peut en couper plusieurs.</div>"},
{"t": "Variations de fonctions (2de)", "q": "Résoudre graphiquement f(x) = 2, c'est…", "c": ["lire l'ordonnée du point d'abscisse 2", "compter les points d'intersection avec l'axe x", "lire les abscisses des points de la courbe à hauteur 2", "chercher l'image de 2"], "a": 2, "e": "On trace la droite horizontale y = 2 : les abscisses des intersections sont les solutions.", "d": "f(x) = 2 ⟹ points de la courbe à la <b>hauteur 2</b> : abscisses des intersections avec la droite y = 2.<div class='ex-detail'><u>Exemple rédigé</u> : piège type : « lire l'ordonnée du point d'abscisse 2 » donne f(2), c'est-à-dire l'IMAGE de 2 — l'opération INVERSE. Moyen mnémotechnique : f(x) = 2 cherche « où vaut-elle 2 ? » (x inconnu), f(2) demande « que vaut-elle en 2 ? » (y inconnu).</div>"},
{"t": "Variations de fonctions (2de)", "q": "Le tableau de variations montre f ↘ de 5 (x = −2) vers −1 (x = 1) puis ↗ vers 3 (x = 4). Le minimum de f sur [−2 ; 4] est…", "c": ["−1", "5", "−2", "3"], "a": 0, "e": "Le point bas de la « vallée » : −1, atteint en x = 1.", "d": "La flèche descend jusqu'à <b>−1</b> puis remonte : minimum <b>−1 en x = 1</b>.<div class='ex-detail'><u>Exemple rédigé</u> : lecture du tableau : chaque flèche donne un sens de pente ; les valeurs basses sont aux pieds ↘↗ (vallée : minimum), les valeurs hautes aux sommets ↗↘ (crête : maximum). Piège : confondre le minimum (valeur −1) et l'abscisse où il est atteint (1) : « minimum −1 atteint EN 1 ».</div>"},
{"t": "Variations de fonctions (2de)", "q": "Même tableau : le maximum de f sur [−2 ; 4] est…", "c": ["5", "3", "4", "−1"], "a": 0, "e": "On compare les valeurs aux sommets des flèches : 5 (en −2) et 3 (en 4) : maximum 5.", "d": "Bornes hautes : 5 en x = −2 et 3 en x = 4 : le plus grand est <b>5</b>.<div class='ex-detail'><u>Exemple rédigé</u> : méthode : sur un intervalle FERME, le maximum est soit à une borne, soit à un sommet de crête. Ici, pas de crête ↗↘ : on compare les bornes : 5 &gt; 3. Piège : choisir 3 en oubliant la valeur de gauche ; ou « 4 » en confondant abscisse maximale et valeur.</div>"},
{"t": "Variations de fonctions (2de)", "q": "f(x) < 0 graphiquement : les solutions sont…", "c": ["les abscisses où la courbe coupe l'axe x", "les abscisses où la courbe est sous l'axe x", "l'image de 0", "les ordonnées négatives de la courbe"], "a": 1, "e": "f(x) < 0 ⟹ portions de courbe STRICTEMENT sous l'axe des abscisses.", "d": "f(x) &lt; 0 ⟹ la courbe est <b>sous l'axe des abscisses</b> : on lit les intervalles d'abscisses correspondants.<div class='ex-detail'><u>Exemple rédigé</u> : distinctions fines : f(x) &lt; 0 : SOUS l'axe (points de l'axe EXCLUS) ; f(x) ≤ 0 : sous l'axe PLUS les points d'intersection ; f(x) = 0 : seulement les intersections. Piège : « couper l'axe » ne donne que f(x) = 0, la frontière — l'inéquation demande la RÉGION.</div>"},
{"t": "Variations de fonctions (2de)", "q": "Une lecture graphique de la solution de f(x) = 3 donne x ≈ 1,7. Cela signifie…", "c": ["x = 1,7 exactement", "x = 1,7 à 0,001 près", "x est proche de 1,7 : la valeur exacte peut être irrationnelle", "le calcul est impossible"], "a": 2, "e": "Le graphique est approximatif : seul le calcul donne la valeur exacte.", "d": "Une lecture graphique est <b>APPROCHÉE</b> : x ≈ 1,7 ; la valeur exacte (ex. √3 ≈ 1,732) exige un calcul.<div class='ex-detail'><u>Exemple rédigé</u> : protocole du contrôle : « résoudre GRAPHIQUEMENT » ⟹ lecture avec ≈ et tracés apparents (droite y = 3) ; « résoudre » seul ⟹ calcul exact. Piège : répondre « x = 1,7 » sans le ≈ : la précision d'une lecture au millimètre n'est pas une égalité mathématique.</div>"},
{"t": "Variations de fonctions (2de)", "q": "« f atteint son minimum m en a » signifie…", "c": ["f(m) = a", "f(a) = m seulement", "m est la plus petite abscisse", "f(a) = m et f(x) ≥ m pour tout x"], "a": 3, "e": "Deux conditions : la valeur est atteinte (f(a) = m) ET jamais dépassée vers le bas (f(x) ≥ m).", "d": "Minimum m en a : <b>f(a) = m ET f(x) ≥ m pour tout x</b> du domaine.<div class='ex-detail'><u>Exemple rédigé</u> : pour f(x) = x² : minimum 0 en 0 car f(0) = 0 et x² ≥ 0 partout. Contre-exemple instructif : si f(a) = m mais qu'ailleurs f descend sous m, alors m n'est PAS un minimum : la première condition seule ne suffit pas. Piège : « f(m) = a » inverse les rôles (m est une VALEUR, a une abscisse).</div>"},
{"t": "Variations de fonctions (2de)", "q": "Sur le tableau : f ↗ de 1 (x = 0) à 7 (x = 3). Alors pour 0 < x1 < x2 < 3…", "c": ["f(x1) = f(x2)", "f(x1) > f(x2)", "On ne sait pas", "f(x1) < f(x2)"], "a": 3, "e": "f croissante sur [0 ; 3] : l'ordre des images suit l'ordre des abscisses.", "d": "f strictement croissante ⟹ <b>x1 &lt; x2 ⟹ f(x1) &lt; f(x2)</b> : l'ordre est CONSERVÉ.<div class='ex-detail'><u>Exemple rédigé</u> : c'est la DÉFINITION de « croissante ». Symétriquement, décroissante ⟹ ordre INVERSÉ. Piège : « on ne sait pas » : le tableau suffit, pas besoin de la formule de f. Cette propriété sert à comparer des images sans calcul (ex. comparer f(1,2) et f(2,8)).</div>"},
{"t": "Variations de fonctions (2de)", "q": "La courbe de f coupe l'axe des abscisses en x = −1 et x = 4. L'ensemble de solutions de f(x) = 0 est…", "c": ["{0 ; −1 ; 4}", "]−1 ; 4[", "[−1 ; 4]", "{−1 ; 4}"], "a": 3, "e": "f(x) = 0 ⟹ abscisses des intersections avec l'axe : S = {−1 ; 4}.", "d": "Couper l'axe ⟹ f(x) = 0 en ces points : S = <b>{−1 ; 4}</b> (ensemble de deux nombres).<div class='ex-detail'><u>Exemple rédigé</u> : pièges voisins : [−1 ; 4] serait la réponse de « f(x) &lt; 0 » si la courbe plonge sous l'axe entre les deux racines (parabole vers le bas) ; ]−∞ ; −1[ ∪ ]4 ; +∞[ si elle est au-dessus. Il faut TOUJOURS regarder la position de la courbe, pas seulement les intersections. « 0 » n'est pas solution : c'est l'ordonnée.</div>"},
{"t": "Vecteurs et repérage (2de)", "q": "A(−1 ; 2) et B(3 ; 5). Coordonnées de AB→ ?", "c": ["(2 ; 3)", "(−4 ; −3)", "(4 ; 3)", "(3 ; 4)"], "a": 2, "e": "AB→ = (x_B − x_A ; y_B − y_A) = (3+1 ; 5−2) = (4 ; 3).", "d": "AB→ = <b>(arrivée − départ)</b> = (3 − (−1) ; 5 − 2) = <b>(4 ; 3)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : piège : (2 ; 3) = coordonnées du MILIEU, un autre objet mathématique. Contrôle rapide : ajouter AB→ à A doit donner B : (−1+4 ; 2+3) = (3 ; 5) = B ✓. Ce test « retour » détecte toute inversion de signe.</div>"},
{"t": "Vecteurs et repérage (2de)", "q": "‖AB→‖ avec AB→ = (4 ; 3) vaut…", "c": ["7", "√7", "5", "25"], "a": 2, "e": "√(4² + 3²) = √25 = 5.", "d": "‖AB→‖ = √(4² + 3²) = <b>5</b> (c'est aussi la distance AB en repère orthonormé).<div class='ex-detail'><u>Exemple rédigé</u> : c'est Pythagore : le vecteur (4 ; 3) est l'hypoténuse d'un triangle de côtés 4 et 3 (triplet (3;4;5)). Pièges : 7 = 4 + 3 additionne sans carrés ; 25 = ‖AB→‖², la norme AU CARRÉ. « Prendre la racine finale » : même réflexe que Pythagore.</div>"},
{"t": "Vecteurs et repérage (2de)", "q": "Relation de Chasles : AB→ + BC→ = ?", "c": ["BA→", "AC→", "CA→", "CB→"], "a": 1, "e": "On met bout à bout : de A à B puis B à C = de A à C.", "d": "AB→ + BC→ = <b>AC→</b> : le déplacement A→B puis B→C équivaut au déplacement direct A→C.<div class='ex-detail'><u>Exemple rédigé</u> : avec AB→ = (4 ; 3) et BC→ = (1 ; 7) : AC→ = (5 ; 10). Contrôle par les points : A(−1;2) + (5;10) = (4 ; 12) : c'est bien C = B + BC→ = (3;5) + (1;7) ✓. Piège : CA→ = −AC→ est l'OPPOSÉ de la somme.</div>"},
{"t": "Vecteurs et repérage (2de)", "q": "u→(2 ; 3) et w→(4 ; 6). Sont-ils colinéaires ?", "c": ["Non", "Non, car 4 ≠ 2", "Oui, car 2×6 − 4×3 = 0", "Oui, car leurs coordonnées sont égales"], "a": 2, "e": "Déterminant : xy′ − x′y = 12 − 12 = 0 : colinéaires (w→ = 2u→).", "d": "Test de colinéarité : xy′ − x′y = 2×6 − 4×3 = 0 ⟹ <b>colinéaires</b> (ici w→ = 2u→, mêmes direction et sens).<div class='ex-detail'><u>Exemple rédigé</u> : applications : A, B, C alignés ⟺ AB→ et AC→ colinéaires ; droites (AB) et (CD) parallèles ⟺ AB→ et CD→ colinéaires. Piège : « coordonnées égales » est trop fort : (2;3) et (4;6) diffèrent mais restent colinéaires : seule la PROPORTIONNALITÉ compte.</div>"},
{"t": "Vecteurs et repérage (2de)", "q": "Milieu de [AB] avec A(1 ; 1) et B(5 ; 7) ?", "c": ["(4 ; 6)", "(6 ; 8)", "(3 ; 4)", "(2 ; 3)"], "a": 2, "e": "((1+5)/2 ; (1+7)/2) = (3 ; 4).", "d": "Milieu = <b>mi-coordonnées</b> : ((1+5)/2 ; (1+7)/2) = <b>(3 ; 4)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : contrôle : M doit être ÉQUIDISTANT de A et B : AM = √(4+9) = √13 ; MB = √(4+9) = √13 ✓. Piège : (6 ; 8) additionne sans diviser par 2 — c'est le point A + B, qui n'a pas de nom géométrique simple. Le milieu est au « centre de gravité » des deux points.</div>"},
{"t": "Vecteurs et repérage (2de)", "q": "AB→ = CD→ caractérise…", "c": ["ABCD parallélogramme", "ABCD losange", "ABCD rectangle", "ABDC parallélogramme"], "a": 3, "e": "AB→ = CD→ ⟹ ABDC parallélogramme : l'ordre des sommets est ABDC.", "d": "AB→ = CD→ (même vecteur) ⟹ <b>ABDC</b> est un parallélogramme (AB et CD sont parallèles, égaux, de même sens).<div class='ex-detail'><u>Exemple rédigé</u> : pour prouver que ABCD (dans cet ordre !) est un parallélogramme, il faut AB→ = <b>DC→</b> : le sommet C « répond » à B. Piège ultra-fréquent : écrire AB→ = CD→ et conclure « ABCD » : les lettres du milieu s'échangent. Vérification : A(0;0), B(2;0), C(3;1), D(1;1) : AB→ = (2;0) = DC→ ✓ et ABCD est bien le parallélogramme.</div>"},
{"t": "Vecteurs et repérage (2de)", "q": "A(1 ; 1), B(4 ; 2), C(5 ; 5), D(2 ; 4). AB→ = (3 ; 1) et DC→ = ?", "c": ["(−3 ; −1)", "(3 ; 1) : ABCD parallélogramme", "(1 ; 3)", "(−3 ; 1)"], "a": 1, "e": "DC→ = (5−2 ; 5−4) = (3 ; 1) = AB→ : ABCD est bien un parallélogramme.", "d": "DC→ = (x_C − x_D ; y_C − y_D) = (3 ; 1) = AB→ ⟹ <b>ABCD parallélogramme</b>.<div class='ex-detail'><u>Exemple rédigé</u> : suite logique de l'exercice : AB→ = DC→ prouve le parallélogramme ; puis BC = √10 = AB prouve le LOSANGE ; puis diagonales AC = √(16+16) = √32 et BD = √(4+4) = √8, différentes : PAS rectangle. Une hiérarchie de tests dans l'ordre : parallélogramme ⟹ losange ⟹ carré.</div>"},
{"t": "Vecteurs et repérage (2de)", "q": "Comment montrer que A, B et C sont alignés ?", "c": ["Calculer AC", "Comparer les abscisses", "Montrer que AB→ = AC→", "Montrer que AB→ et AC→ sont colinéaires"], "a": 3, "e": "Trois points alignés ⟺ les vecteurs AB→ et AC→ sont colinéaires.", "d": "A, B, C alignés ⟺ <b>AB→ et AC→ colinéaires</b> : xy′ − x′y = 0.<div class='ex-detail'><u>Exemple rédigé</u> : A(1;2), B(3;6), C(4;8) : AB→ = (2;4), AC→ = (3;6) : 2×6 − 3×4 = 0 ✓ alignés. Piège : « AB→ = AC→ » est FAUX en général (B ≠ C !) : l'égalité stricte est trop forte ; seule la colinéarité (proportionnalité) est requise.</div>"},
{"t": "Vecteurs et repérage (2de)", "q": "Le point M(x ; y) est sur la courbe de f si et seulement si…", "c": ["y = f(x)", "x = f(y)", "y = x", "f(x) = 0"], "a": 0, "e": "L'ordonnée de M est l'image de son abscisse : y = f(x).", "d": "M(x ; y) ∈ courbe de f ⟺ <b>y = f(x)</b> : abscisse ⟶ image en ordonnée.<div class='ex-detail'><u>Exemple rédigé</u> : pour f(x) = x² : M(3 ; 9) est sur la courbe (9 = 3² ✓) ; M(9 ; 3) ne l'est PAS (3 ≠ 81). Piège : inverser les rôles (x = f(y)) est l'erreur classique de lecture : l'abscisse est TOUJOURS la valeur de départ. Test pratique : un point se vérifie en une ligne.</div>"},
{"t": "Vecteurs et repérage (2de)", "q": "2u→ − v→ avec u→(2 ; 3), v→(−1 ; 4) ?", "c": ["(5 ; 2)", "(3 ; 2)", "(3 ; 7)", "(5 ; 10)"], "a": 0, "e": "2u→ = (4 ; 6) ; 2u→ − v→ = (4−(−1) ; 6−4) = (5 ; 2).", "d": "2u→ = (4 ; 6), puis 2u→ − v→ = (4 + 1 ; 6 − 4) = <b>(5 ; 2)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : linéarité : k·u→ = (kx ; ky) ; soustraire v→ = additionner (−v→) : (1 ; −4). Ordre des opérations respecté comme sur les nombres. Piège : (3 ; 7) correspondrait à u→ + v→ ; les coefficients se distribuent sur CHAQUE coordonnée, pas seulement la première.</div>"},
{"t": "Statistiques descriptives (2de)", "q": "Série ordonnée : 3 ; 5 ; 7 ; 8 ; 12. La médiane est…", "c": ["7", "35/5 = 7,0 donc 3", "8", "5"], "a": 0, "e": "5 valeurs : la médiane est la 3e : 7.", "d": "N = 5 (impair) : médiane = valeur de rang (5+1)/2 = 3 : <b>7</b>.<div class='ex-detail'><u>Exemple rédigé</u> : définition : au moins 50 % des valeurs ≤ 7 (3 ; 5 ; 7 : OUI, 3 sur 5 = 60 %) et 50 % ≥ 7 (7 ; 8 ; 12). Piège : la médiane n'est PAS la moyenne (ici (3+5+7+8+12)/5 = 7, elle coïncide PAR HASARD). Autre piège : oublier d'ORDONNER avant.</div>"},
{"t": "Statistiques descriptives (2de)", "q": "Série : 3 ; 5 ; 7 ; 8 (paire). La médiane est…", "c": ["5", "6", "7", "7,5"], "a": 1, "e": "Effectif pair : médiane = moyenne des 2 valeurs centrales : (5+7)/2 = 6.", "d": "N = 4 : médiane = <b>(5 + 7)/2 = 6</b>, moyenne des 2e et 3e valeurs (série déjà ordonnée).<div class='ex-detail'><u>Exemple rédigé</u> : contrôle : 2 valeurs ≤ 6 (3 ; 5) et 2 valeurs ≥ 6 (7 ; 8) : partage exact ✓. Piège : répondre 7 (la « 3e valeur » d'une série de 4 n'existe pas de façon symétrique) ou 5. Le cas pair est LE cas piège des contrôles.</div>"},
{"t": "Statistiques descriptives (2de)", "q": "Étendue de la série 3 ; 5 ; 7 ; 8 ; 12 ?", "c": ["3", "15", "12", "9"], "a": 3, "e": "Étendue = max − min = 12 − 3 = 9.", "d": "Étendue = <b>12 − 3 = 9</b> : l'écart entre la plus grande et la plus petite valeur.<div class='ex-detail'><u>Exemple rédigé</u> : c'est l'indicateur de dispersion le plus SIMPLE (et le plus fragile : deux valeurs extrêmes le déterminent entièrement). Piège : 3 = première valeur recopiée ; 12 = max seul. La série 3 ; 5 ; 7 ; 8 ; 95 aurait une étendue de 92 — d'où l'intérêt de l'écart interquartile, insensible aux extrêmes.</div>"},
{"t": "Statistiques descriptives (2de)", "q": "Série ordonnée de 10 valeurs. Q1 est approximativement…", "c": ["la moyenne", "la plus petite valeur", "la 3e valeur", "la 5e valeur"], "a": 2, "e": "Q1 : rang ⌈10/4⌉ = 3e valeur de la série ordonnée.", "d": "Q1 = valeur de rang <b>⌈N/4⌉</b> : pour N = 10, ⌈2,5⌉ = 3 : <b>la 3e valeur</b>.<div class='ex-detail'><u>Exemple rédigé</u> : sur la série 3;4;5;5;6;6;7;7;8;9 : Q1 = 5, Q3 = ⌈7,5⌉ = 8e valeur = 7. Pièges : « la 5e valeur » est la MÉDIANE (rang N/2) ; Q1 n'est ni le minimum ni la moyenne : c'est une position précise dans la série ORDONNÉE.</div>"},
{"t": "Statistiques descriptives (2de)", "q": "L'écart interquartile est…", "c": ["Q1 − Q3", "max − min", "la moyenne des quartiles", "Q3 − Q1"], "a": 3, "e": "IQR = Q3 − Q1 : la largeur de la boîte centrale (50 % des données).", "d": "Écart interquartile = <b>Q3 − Q1</b> : il contient les 50 % de données les plus « centrales ».<div class='ex-detail'><u>Exemple rédigé</u> : Q1 = 5, Q3 = 7 : IQR = 2. Intérêt : contrairement à l'étendue, il IGNORE les 25 % plus petits et plus grands : une valeur aberrante ne le change pas. Piège : « max − min » est l'ÉTENDUE, l'indicateur jumeau mais fragile.</div>"},
{"t": "Statistiques descriptives (2de)", "q": "Classe A : 8;9;10;11;12 — Classe B : 4;7;10;13;16. Que dire ?", "c": ["Moyennes égales, B plus dispersée", "B a une meilleure moyenne", "Moyennes différentes, dispersions égales", "B moins dispersée"], "a": 0, "e": "Deux moyennes de 10 ; écarts types σ_A ≈ 1,4 < σ_B ≈ 4,2.", "d": "Les deux moyennes valent <b>10</b> ; mais σ_A = √2 ≈ 1,4 &lt; σ_B = √18 ≈ 4,2 : <b>B est plus dispersée</b>.<div class='ex-detail'><u>Exemple rédigé</u> : calculs : A : écarts ±2, ±1, 0 : V = 10/5 = 2. B : écarts ±6, ±3, 0 : V = 90/5 = 18. La moyenne seule ne suffit JAMAIS à comparer : deux classes de même moyenne peuvent être très différentes (hétérogène vs homogène). Piège : « B a une meilleure moyenne » : les moyennes sont ÉGALES.</div>"},
{"t": "Statistiques descriptives (2de)", "q": "Variance V = 18. L'écart type vaut…", "c": ["18", "36", "√18 ≈ 4,24", "9"], "a": 2, "e": "σ = √V = √18 ≈ 4,24.", "d": "σ = <b>√V = √18 ≈ 4,24</b> : l'écart type est la RACINE de la variance.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi une racine : V est en unités CARRÉES (des (x−x̄)²), σ retrouve l'unité des données (des points de note, des cm…). Piège type : confondre V et σ : si σ = 3, alors V = 9 — et réciproquement, si V = 18, σ ≈ 4,24, PAS 18 ni 9.</div>"},
{"t": "Statistiques descriptives (2de)", "q": "On remplace la note 12 par 20 dans la série 3;5;7;8;12. Quel indicateur bouge le moins ?", "c": ["La variance", "La médiane", "L'étendue", "La moyenne"], "a": 1, "e": "La médiane (7) ne dépend pas de la valeur extrême ; moyenne, étendue et variance changent.", "d": "La <b>médiane</b> reste 7 : elle ne dépend que des POSITIONS, pas des valeurs extrêmes.<div class='ex-detail'><u>Exemple rédigé</u> : série 3;5;7;8;20 : moyenne passe de 7 à 8,6 ; étendue de 9 à 17 ; variance explose. Mais la 3e valeur ordonnée reste 7 : médiane immobile. C'est pourquoi on dit que la médiane est ROBUSTE : elle est l'indicateur à privilégier en présence de valeurs aberrantes (salaires, temps de réponse…).</div>"},
{"t": "Statistiques descriptives (2de)", "q": "La moyenne pondérée de 3 ; 5 ; 7 ; 8 ; 12 est…", "c": ["6", "7", "8", "35"], "a": 1, "e": "(3+5+7+8+12)/5 = 35/5 = 7.", "d": "x̄ = 35/5 = <b>7</b>.<div class='ex-detail'><u>Exemple rédigé</u> : avec effectifs : si 3 est obtenu 2 fois : (3×2 + 5 + 7 + 8 + 12)/6 = 41/6 ≈ 6,83 : pondérer change le résultat. Contrôle d'ordre de grandeur : la moyenne doit rester ENTRE 3 et 12 ✓. Piège : diviser par le nombre de VALEURS DIFFÉRENTES au lieu de l'effectif total.</div>"},
{"t": "Statistiques descriptives (2de)", "q": "Deux séries ont la même moyenne. Pour les comparer, on regarde alors…", "c": ["la dispersion (écart type ou écart interquartile)", "la plus grande valeur", "l'étendue maximale", "rien à faire"], "a": 0, "e": "À moyenne égale, c'est la dispersion qui départage : σ plus petit = série plus homogène.", "d": "À moyenne égale, comparer la <b>dispersion</b> : écart type (ou écart interquartile).<div class='ex-detail'><u>Exemple rédigé</u> : classes A et B de moyenne 10 : A homogène (σ ≈ 1,4 : tous autour de 10), B hétérogène (σ ≈ 4,2 : des très faibles et des très forts). Pour un professeur, la situation pédagogique est radicalement différente. Piège : l'étendue seule est un mauvais indicateur (2 valeurs aberrantes la faussent).</div>"},
{"t": "Probabilités (2de)", "q": "Dé équilibré à 6 faces : P(obtenir 4) = ?", "c": ["6", "1/6", "4/6", "1/4"], "a": 1, "e": "Une issue favorable sur 6 équiprobables : 1/6.", "d": "Équiprobabilité : P = <b>favorables/possibles</b> = 1/6.<div class='ex-detail'><u>Exemple rédigé</u> : pièges : « 4/6 » confond la VALEUR cherchée avec un comptage de cas ; « 6 » n'est pas une probabilité (une probabilité est ≤ 1). Contrôle : la somme 1/6 + … + 1/6 des 6 issues vaut bien 1.</div>"},
{"t": "Probabilités (2de)", "q": "Urne : 5 rouges, 3 bleues, 2 vertes. P(pas rouge) = ?", "c": ["7/10", "1/2", "3/10", "5/10"], "a": 1, "e": "Pas rouge = 3 + 2 = 5 boules sur 10 : 1/2 (ou 1 − 5/10).", "d": "P(pas rouge) = P(rouge barre) = 1 − 5/10 = <b>1/2</b>, ou directement (3 bleues + 2 vertes)/10 = 5/10.<div class='ex-detail'><u>Exemple rédigé</u> : DEUX voies possibles : le contraire (1 − P) ou le comptage direct (5/10) : elles coïncident — excellent contrôle. Piège : « 3/10 » ne compterait que les bleues (oubli des vertes). Vocabulaire : « pas rouge » = événement CONTRAIRE de « rouge ».</div>"},
{"t": "Probabilités (2de)", "q": "P(A) = 0,3 et P(B) = 0,5, A et B incompatibles. P(A ∪ B) = ?", "c": ["0,8", "1", "0,2", "0,15"], "a": 0, "e": "Incompatibles : P(A ∪ B) = 0,3 + 0,5 = 0,8 (aucune intersection à retrancher).", "d": "A ∩ B = ∅ ⟹ P(A ∪ B) = P(A) + P(B) = <b>0,8</b>.<div class='ex-detail'><u>Exemple rédigé</u> : si l'énoncé avait dit « P(A ∩ B) = 0,1 », on calculerait 0,3 + 0,5 − 0,1 = 0,7. La formule générale : P(A ∪ B) = P(A) + P(B) − P(A ∩ B) ; le cas incompatible EST le cas particulier P(A ∩ B) = 0. Piège : 0,15 multiplierait les probabilités (réservé aux événements successifs indépendants).</div>"},
{"t": "Probabilités (2de)", "q": "P(A) = 0,6, P(B) = 0,4, P(A ∩ B) = 0,25. P(A ∪ B) = ?", "c": ["0,75", "0,85", "1", "0,95"], "a": 0, "e": "P(A∪B) = 0,6 + 0,4 − 0,25 = 0,75.", "d": "P(A ∪ B) = 0,6 + 0,4 − <b>0,25</b> = <b>0,75</b> : l'intersection, comptée dans A ET dans B, doit être retranchée une fois.<div class='ex-detail'><u>Exemple rédigé</u> : exemple concret : espagnol 60 %, allemand 40 %, les deux 25 % : au moins une langue : 75 %. Sans le −0,25, on compterait deux fois les bilingues (1,0 &gt; 1 : signal d'alarme immédiat, une probabilité ne dépasse JAMAIS 1). Piège : 0,85 oublierait que le −0,25 porte sur le TOTAL, pas sur un seul ensemble.</div>"},
{"t": "Probabilités (2de)", "q": "Deux lancers de pièce. P(obtenir au moins une pile) = ?", "c": ["3/4", "1/4", "1/2", "2/4"], "a": 0, "e": "Contraire : aucune pile = deux faces = 1/4. P = 1 − 1/4 = 3/4.", "d": "« Au moins une pile » ⟹ passer par le CONTRAIRE : « aucune pile » = face-face = 1/2 × 1/2 = 1/4. P = 1 − 1/4 = <b>3/4</b>.<div class='ex-detail'><u>Exemple rédigé</u> : énumération directe : FF, FP, PF, PP : 3 cas avec pile sur 4 ✓. La technique du contraire évite l'énumération quand les cas sont nombreux (« au moins un 6 en 4 lancers » : 1 − (5/6)⁴). Piège : additionner 1/2 + 1/2 = 1 serait faux : les lancers ne sont pas incompatibles.</div>"},
{"t": "Probabilités (2de)", "q": "P(Ā) = 0,3. Que vaut P(A) ?", "c": ["0,7", "0", "1,3", "0,3"], "a": 0, "e": "P(A) + P(Ā) = 1 : P(A) = 1 − 0,3 = 0,7.", "d": "P(A) = 1 − P(Ā) = <b>0,7</b> : un événement et son contraire se partagent tout l'univers.<div class='ex-detail'><u>Exemple rédigé</u> : applications directes : P(plein) = 0,15 ⟹ P(vide) = 0,85 ; P(réussir) = 0,72 ⟹ P(échouer) = 0,28. Piège : 1,3 = 1 + 0,3 : une probabilité ne dépasse jamais 1, signe d'une ADDITION au lieu d'une SOUSTRACTION. Rappel : Ā se lit « A barre » ou « non-A ».</div>"},
{"t": "Probabilités (2de)", "q": "Une probabilité peut-elle valoir 1,2 ?", "c": ["Oui pour les événements certains", "Oui si l'événement est très probable", "Seulement en pourcentage", "Non : toute probabilité est ≤ 1"], "a": 3, "e": "0 ≤ P ≤ 1 : 1,2 est impossible ; 1 = certain, 0 = impossible.", "d": "Toute probabilité est dans <b>[0 ; 1]</b> : 0 (impossible) à 1 (certain).<div class='ex-detail'><u>Exemple rédigé</u> : c'est un excellent contrôle automatique : si un calcul donne 1,2 ou −0,1, une erreur est garantie (intersection oubliée, comptage double). Nuance : « 120 % » en pourcentage de probabilité est aussi FAUX : 1,2 = 120 % &gt; 100 % = certitude dépassée : absurde.</div>"},
{"t": "Probabilités (2de)", "q": "Arbre : 1er tirage P(A) = 0,4, puis sachant A : P(B) = 0,5. P(A puis B) = ?", "c": ["0,1", "0,2", "0,45", "0,9"], "a": 1, "e": "Produit le long des branches : 0,4 × 0,5 = 0,2.", "d": "P(A ∩ B) = <b>0,4 × 0,5 = 0,2</b> : le long d'un chemin d'arbre, on MULTIPLIE.<div class='ex-detail'><u>Exemple rédigé</u> : vérification par comptage : sur 100 essais, 40 donnent A, et parmi eux 20 (la moitié) donnent ensuite B : 20/100 = 0,2 ✓. Piège : 0,9 additionnerait les branches (on additionne seulement les chemins ALTERNATIFS menant au même événement). Règle : produit SUR un chemin, somme ENTRE chemins.</div>"},
{"t": "Probabilités (2de)", "q": "Tirer une carte dans un jeu de 32 : P(roi) = ?", "c": ["1/32", "4/32 = 1/8", "8/32", "1/4"], "a": 1, "e": "4 rois sur 32 cartes : 4/32 = 1/8.", "d": "P = favorables/possibles = <b>4/32 = 1/8</b> (un jeu de 32 a 4 rois : cœur, carreau, trèfle, pique).<div class='ex-detail'><u>Exemple rédigé</u> : la précision du dénominateur est cruciale : dans un jeu de 52 cartes, ce serait 4/52 = 1/13. Piège : répondre avant d'avoir identifié l'univers. Suite logique : P(roi ou cœur) = 4/32 + 8/32 − 1/32 (le roi de cœur, compté deux fois) = 11/32.</div>"},
{"t": "Probabilités (2de)", "q": "Équiprobabilité signifie que…", "c": ["les événements sont incompatibles", "toutes les issues ont la même probabilité", "il y a exactement deux issues", "la probabilité vaut toujours 1/2"], "a": 1, "e": "Équiprobabilité = toutes les issues de l'univers sont de même probabilité.", "d": "Équiprobabilité : toutes les issues de Ω ont la <b>même probabilité</b> (dé équilibré : 1/6 chacune).<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi c'est important : la formule P = favorables/possibles ne vaut QUE dans ce cadre (une pièce DÉSÉQUILIBRÉE aurait P(pile) = 0,6 : le comptage des cas ne marche plus). Piège : « 1/2 pour tout » : avec 6 issues équiprobables, chacune vaut 1/6, pas 1/2 : c'est 1/n où n = nombre d'issues.</div>"},
{"t": "Configurations et trigonométrie (2de)", "q": "Dans un triangle rectangle, sin(θ) = ?", "c": ["opposé / adjacent", "hypoténuse / opposé", "opposé / hypoténuse", "adjacent / hypoténuse"], "a": 2, "e": "SOH-CAH-TOA : sin = opposé sur hypoténuse.", "d": "<b>sin(θ) = opposé/hypoténuse</b> ; cos(θ) = adjacent/hypoténuse ; tan(θ) = opposé/adjacent.<div class='ex-detail'><u>Exemple rédigé</u> : « opposé » et « adjacent » se décident PAR RAPPORT à l'angle θ visé : si on change d'angle dans le même triangle, opposé et adjacent s'échangent. Piège type : confondre sin et cos (la ligne « adjacent » du cos). Moyen mnémotechnique : SOH-CAH-TOA.</div>"},
{"t": "Configurations et trigonométrie (2de)", "q": "Hypoténuse 10 cm, angle 35°, côté opposé à chercher. On utilise…", "c": ["cos(35°) = côté/10", "tan(35°) = côté/10", "sin(35°) = côté/10", "Pythagore seul"], "a": 2, "e": "Opposé et hypoténuse connus/cherchés : c'est le sinus.", "d": "On connaît l'hypoténuse (10) et on cherche l'OPPOSÉ : <b>sin(35°) = côté/10</b> ⟹ côté = 10 sin(35°) ≈ 5,74 cm.<div class='ex-detail'><u>Exemple rédigé</u> : méthode de choix : 1) repérer l'angle ; 2) classer les deux côtés en jeu (opposé / adjacent / hypoténuse) ; 3) sélectionner sin, cos ou tan ; 4) résoudre. Contrôle final : le côté trouvé (5,74) doit être INFÉRIEUR à l'hypoténuse (10) ✓.</div>"},
{"t": "Configurations et trigonométrie (2de)", "q": "sin(45°) = ?", "c": ["1/2", "1", "√2/2", "√3/2"], "a": 2, "e": "Dans le demi-carré : sin(45°) = cos(45°) = √2/2 ≈ 0,707.", "d": "sin(45°) = <b>√2/2 ≈ 0,707</b> : l'angle de 45° découpe un carré en deux : les deux côtés de l'angle droit sont égaux.<div class='ex-detail'><u>Exemple rédigé</u> : calcul : triangle rectangle isocèle de côtés 1, 1 : hypoténuse √2 ; sin(45°) = opposé/hypoténuse = 1/√2 = √2/2. Pièges : 1/2 = sin(30°) ; √3/2 = sin(60°). À retenir : 45° est le SEUL angle aigu dont sinus et cosinus sont ÉGAUX.</div>"},
{"t": "Configurations et trigonométrie (2de)", "q": "cos(θ) = 0,6, θ aigu. sin(θ) = ?", "c": ["√0,6", "0,8", "0,36", "0,4"], "a": 1, "e": "sin² = 1 − 0,36 = 0,64 ⟹ sin = 0,8.", "d": "cos² + sin² = 1 ⟹ sin²(θ) = 1 − 0,36 = 0,64 ⟹ sin(θ) = <b>0,8</b> (positif, θ aigu).<div class='ex-detail'><u>Exemple rédigé</u> : on retrouve le triangle 3-4-5 (÷5) : adjacent 3, opposé 4, hypoténuse 5. Piège : 0,4 = 1 − 0,6 soustrait les valeurs au lieu des CARRÉS ; 0,36 = 0,6² confond cos² et cos. L'identité porte sur les carrés, toujours.</div>"},
{"t": "Configurations et trigonométrie (2de)", "q": "cos(30°) = ?", "c": ["√3", "√3/2", "√2/2", "1/2"], "a": 1, "e": "cos(30°) = √3/2 ≈ 0,866 (et sin(30°) = 1/2).", "d": "cos(30°) = <b>√3/2</b> ; symétriquement sin(30°) = 1/2, sin(60°) = √3/2, cos(60°) = 1/2.<div class='ex-detail'><u>Exemple rédigé</u> : moyen de retenir : les angles 30° et 60° sont COMPLÉMENTAIRES (30 + 60 = 90) ⟹ cos(30°) = sin(60°) et sin(30°) = cos(60°). Les valeurs se répondent en miroir. Piège : échanger les deux (√3/2 et 1/2) : pour 30°, le SINUS est le petit (1/2) et le COSINUS le grand (√3/2).</div>"},
{"t": "Configurations et trigonométrie (2de)", "q": "Un triangle inscrit dans un cercle, un côté étant un diamètre, est…", "c": ["isocèle", "quelconque", "équilatéral", "rectangle"], "a": 3, "e": "L'angle inscrit qui sous-tend un demi-cercle est droit : triangle rectangle.", "d": "Si [AB] est un DIAMÈTRE du cercle et C un point du cercle, alors ABC est <b>rectangle en C</b> (AB est l'hypoténuse).<div class='ex-detail'><u>Exemple rédigé</u> : application type : cercle de diamètre AB = 8, C sur le cercle : ACB = 90°, et AC² + BC² = 64 (Pythagore). Réciproque précieuse : tout triangle rectangle s'inscrit dans le cercle de diamètre son hypoténuse (cercle CIRCONSCRIT, centre au milieu de l'hypoténuse).</div>"},
{"t": "Configurations et trigonométrie (2de)", "q": "Droites parallèles coupées par une sécante : les angles correspondants sont…", "c": ["égaux", "complémentaires", "supplémentaires", "opposés par le sommet"], "a": 0, "e": "Angles correspondants (même position aux deux intersections) : ÉGAUX.", "d": "Angles <b>correspondants</b> = ÉGAUX quand les droites sont parallèles.<div class='ex-detail'><u>Exemple rédigé</u> : conséquence phare : si deux angles correspondants sont égaux, les droites sont PARALLÈLES (caractérisation dans les deux sens). À distinguer : alternes-internes = égaux aussi (parallèles) ; supplémentaires = somme 180° (parallèles + intérieurs même côté : angles CO-INTERNES, eux font 180°). Piège : « supplémentaires » vaut pour les co-internes, pas les correspondants.</div>"},
{"t": "Configurations et trigonométrie (2de)", "q": "Un sinus peut-il valoir 1,2 ?", "c": ["Oui si l'hypoténuse est grande", "Non : −1 ≤ sin ≤ 1", "Seulement en degrés", "Oui pour un grand angle"], "a": 1, "e": "Sur le cercle trigonométrique, sin et cos restent dans [−1 ; 1].", "d": "<b>Non</b> : −1 ≤ sin ≤ 1 et −1 ≤ cos ≤ 1 (coordonnées d'un point du cercle de rayon 1).<div class='ex-detail'><u>Exemple rédigé</u> : justification par le triangle : sin = opposé/hypoténuse, et l'hypoténuse est le PLUS LONG côté ⟹ opposé &lt; hypoténuse ⟹ rapport &lt; 1. Contrôle automatique : sin(θ) = 1,2 dans un exercice ⟹ erreur d'angle ou de mode degrés/radians garanti.</div>"},
{"t": "Configurations et trigonométrie (2de)", "q": "La droite des milieux dans un triangle…", "c": ["joint les milieux de deux côtés, parallèle au 3e, de longueur sa moitié", "mesure le double du 3e côté", "passe par un sommet et le milieu du côté opposé", "joint deux milieux et est perpendiculaire au 3e côté"], "a": 0, "e": "Segment des milieux : parallèle au troisième côté, de longueur MOITIÉ.", "d": "La droite des milieux joint les milieux de deux côtés : <b>parallèle au 3e côté et de longueur la moitié</b>.<div class='ex-detail'><u>Exemple rédigé</u> : si BC = 12 et que M, N sont les milieux de [AB], [AC] : MN = 6 et (MN) ∥ (BC). Réciproque : une droite passant par un milieu et parallèle à un côté coupe le 3e côté en son milieu. Piège : la MEDIANE (sommet-milieu du côté opposé) est un autre objet : ne pas confondre les deux « droites des milieux ».</div>"},
{"t": "Configurations et trigonométrie (2de)", "q": "Calculatrice en mode radians, on tape sin(30). Le résultat usuel attendu (0,5)…", "c": ["est faux : sin(30°) = 0,5 mais sin(30 rad) ≈ −0,988", "est obtenu", "est doublé", "est impossible à corriger"], "a": 0, "e": "Les fonctions trigonométriques dépendent de l'unité : 30 radians ≠ 30°.", "d": "Le mode de la calculatrice est crucial : sin(30 <b>radians</b>) ≈ −0,99 alors que sin(30<b>°</b>) = 0,5.<div class='ex-detail'><u>Exemple rédigé</u> : en 2de, les angles du triangle sont en DEGRÉS : vérifier l'affichage « D » ou « DEG » avant tout calcul. Symptômes d'un mode erroné : un cosinus &gt; 1, un sinus négatif pour un angle aigu. C'est l'erreur matérielle la plus fréquente aux contrôles : un réflexe de vérification coûte 2 secondes.</div>"},
{"t": "Second degré (1re)", "q": "Le discriminant de 2x² − 3x − 2 est…", "c": ["9", "25", "17", "−25"], "a": 1, "e": "Δ = b² − 4ac = 9 − 4×2×(−2) = 9 + 16 = 25.", "d": "Δ = (−3)² − 4×2×(−2) = 9 + 16 = <b>25</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le piège de signe : −4ac = −4×2×(−2) = +16 (moins fois moins). Δ = 17 oublierait le signe de c ; Δ = −25 inverserait le rôle. Contrôle express : Δ = 25 est un carré parfait (5²) : les racines seront RATIONNELLES, un bon indice de cohérence.</div>"},
{"t": "Second degré (1re)", "q": "Δ = 25 pour 2x² − 3x − 2 = 0. Les racines sont…", "c": ["−2 et 1/2", "2 et 1/2", "5 et −5", "2 et −1/2"], "a": 3, "e": "x = (3 ± 5)/4 : x = 2 et x = −1/2.", "d": "x = (−b ± √Δ)/(2a) = (3 ± 5)/4 : <b>2 et −1/2</b>.<div class='ex-detail'><u>Exemple rédigé</u> : vérification par somme et produit : x₁ + x₂ = 3/2 = −b/a = 3/2 ✓ ; x₁x₂ = −1 = c/a = −2/2 ✓. Ce double contrôle détecte TOUTE erreur de calcul. Piège : « −2 et 1/2 » inverse les signes : −b = +3 (b vaut −3 : moins d'un moins).</div>"},
{"t": "Second degré (1re)", "q": "Si Δ < 0, l'équation ax² + bx + c = 0 (a ≠ 0)…", "c": ["a une seule racine", "n'a aucune solution réelle", "a deux racines opposées", "a une infinité de solutions"], "a": 1, "e": "Δ < 0 : pas de racine réelle ; la parabole ne coupe jamais l'axe des abscisses.", "d": "Δ &lt; 0 ⟹ <b>aucune solution réelle</b> : la parabole reste entièrement au-dessus (a &gt; 0) ou en dessous (a &lt; 0) de l'axe.<div class='ex-detail'><u>Exemple rédigé</u> : exemple : x² + x + 1 : Δ = 1 − 4 = −3 &lt; 0 : pas de racine, et le trinôme est positif pour tout x (signe de a). Piège : confondre « pas de solution » avec « une solution » (cas Δ = 0 : racine DOUBLE) ; en Terminale, on verra deux racines COMPLEXES.</div>"},
{"t": "Second degré (1re)", "q": "La forme canonique de f(x) = 2x² − 8x + 5 est…", "c": ["2(x − 2)² − 3", "2(x − 2)² + 3", "2(x + 2)² − 3", "(x − 2)² − 3"], "a": 0, "e": "2(x² − 4x) + 5 = 2((x−2)² − 4) + 5 = 2(x − 2)² − 3.", "d": "f(x) = <b>2(x − 2)² − 3</b> : sommet S(2 ; −3).<div class='ex-detail'><u>Exemple rédigé</u> : la forme canonique se LIT directement : α = 2 (abscisse du sommet), β = −3 (ordonnée). Contrôles : f(2) = 8 − 16 + 5 = −3 ✓ ; a = 2 &gt; 0 : parabole vers le HAUT ⟹ minimum −3 en 2. Piège : « (x − 2)² − 3 » sans le facteur 2 ne redonne pas le trinôme ; le coefficient a se distribue sur TOUT le carré.</div>"},
{"t": "Second degré (1re)", "q": "2x² − 3x − 2 > 0 (racines −1/2 et 2). S = ?", "c": ["]−∞ ; −1/2[ ∪ ]2 ; +∞[", "]−1/2 ; 2[", "[−1/2 ; 2]", "ℝ"], "a": 0, "e": "a > 0 : positif SAUF entre les racines ; inéquation stricte : racines exclues.", "d": "a = 2 &gt; 0 : positif à l'EXTÉRIEUR des racines : S = <b>]−∞ ; −1/2[ ∪ ]2 ; +∞[</b>.<div class='ex-detail'><u>Exemple rédigé</u> : règle « positif dehors, négatif dedans » (pour a &gt; 0). Test : x = 0 (entre les racines) : 0 − 0 − 2 = −2 &lt; 0 ✓ (négatif dedans) ; x = 3 : 18 − 9 − 2 = 7 &gt; 0 ✓. Piège : donner [−1/2 ; 2] (réponse de l'inéquation ≤ 0) : la phrase « positif dehors » évite toute inversion.</div>"},
{"t": "Second degré (1re)", "q": "Si Δ = 0, le trinôme…", "c": ["n'a pas de racine", "a deux racines distinctes", "a une racine double −b/(2a)", "est toujours nul"], "a": 2, "e": "Δ = 0 : racine double x₀ = −b/(2a) ; le sommet est sur l'axe des abscisses.", "d": "Δ = 0 ⟹ racine <b>double</b> x₀ = −b/(2a) : la parabole est TANGENTE à l'axe des abscisses au sommet.<div class='ex-detail'><u>Exemple rédigé</u> : exemple : x² − 6x + 9 = (x − 3)² : Δ = 0, racine double 3. Le trinôme ne s'annule qu'en 3 mais reste du signe de a AILLEURS : « toujours nul » est faux. Piège : « pas de racine » correspond à Δ &lt; 0 — les trois cas Δ&gt;0/Δ=0/Δ&lt;0 sont LA question piège du chapitre.</div>"},
{"t": "Second degré (1re)", "q": "Somme des racines d'un trinôme ax² + bx + c (Δ > 0) ?", "c": ["−b/a", "−b/(2a)", "b/a", "c/a"], "a": 0, "e": "x₁ + x₂ = −b/a et x₁x₂ = c/a.", "d": "<b>x₁ + x₂ = −b/a</b> ; produit : x₁x₂ = c/a.<div class='ex-detail'><u>Exemple rédigé</u> : application en sens inverse : « deux nombres de somme 5 et produit 6 » : racines de x² − 5x + 6 = 0 : Δ = 1, x = 2 et 3 ✓. Ce raccourci fabrique des exercices entiers. Piège : −b/(2a) est l'abscisse du SOMMET (une seule valeur), pas la somme des racines : ne pas confondre les deux formules « −b/a » et « −b/2a ».</div>"},
{"t": "Second degré (1re)", "q": "Factoriser 2x² − 3x − 2 (racines 2 et −1/2) :", "c": ["2(x − 2)(x + 1/2)", "2(x + 2)(x − 1/2)", "2(x − 2)(x − 1/2)", "(x − 2)(x + 1/2)"], "a": 0, "e": "a(x − x₁)(x − x₂) = 2(x − 2)(x + 1/2).", "d": "<b>2(x − 2)(x + 1/2)</b> : forme a(x − x₁)(x − x₂).<div class='ex-detail'><u>Exemple rédigé</u> : contrôles : en x = 0 : 2×(−2)×(1/2) = −2 = f(0) ✓ ; en x = 2 : 0 ✓. Développement de contrôle : 2(x² − (3/2)x − 1) = 2x² − 3x − 2 ✓. Piège no 1 : oublier le facteur 2 ; piège no 2 : écrire (x − (−1/2)) = (x − 1/2) : le MOINS de la racine devient PLUS.</div>"},
{"t": "Second degré (1re)", "q": "L'abscisse du sommet de la parabole de f(x) = ax² + bx + c est…", "c": ["b/(2a)", "−b/a", "−b/(2a)", "c/a"], "a": 2, "e": "α = −b/(2a) : axe de symétrie de la parabole.", "d": "Sommet : S(<b>−b/(2a)</b> ; f(−b/(2a))) ; la droite x = −b/(2a) est l'axe de symétrie.<div class='ex-detail'><u>Exemple rédigé</u> : pour 2x² − 8x + 5 : α = 8/4 = 2, β = f(2) = −3 (on retrouve la forme canonique 2(x−2)² − 3). Application : maximiser un bénéfice, optimiser une aire : la réponse est presque toujours « en x = −b/2a ». Piège : confondre α = −b/2a avec la somme des racines −b/a.</div>"},
{"t": "Second degré (1re)", "q": "Un trinôme avec a < 0 et Δ < 0 est…", "c": ["positif entre les racines", "nul quelque part", "toujours positif", "toujours négatif"], "a": 3, "e": "Δ < 0 : aucune racine, signe constant = signe de a : négatif partout.", "d": "Δ &lt; 0 ⟹ pas de racine ⟹ le trinôme ne change jamais de signe : signe de <b>a</b> partout. a &lt; 0 ⟹ <b>toujours négatif</b>.<div class='ex-detail'><u>Exemple rédigé</u> : exemple : −x² + x − 1 : Δ = 1 − 4 = −3 &lt; 0, a = −1 : négatif pour tout x (la parabole, tournée vers le bas, reste sous l'axe). Règle générale : Δ &lt; 0 ⟹ signe de a SUR ℝ ENTIER, qu'il soit positif ou négatif. Piège : « positif entre les racines » suppose des racines… inexistantes ici.</div>"},
{"t": "Opérations sur dérivées (1re)", "q": "(uv)′ = ?", "c": ["u′v + uv′", "uv′ + u", "u′v − uv′", "u′v′"], "a": 0, "e": "Produit : (uv)′ = u′v + uv′.", "d": "<b>(uv)′ = u′v + uv′</b> : la dérivée d'un produit N'EST PAS le produit des dérivées.<div class='ex-detail'><u>Exemple rédigé</u> : contre-exemple éclair : u = x, v = x : uv = x², (uv)′ = 2x ; mais u′v′ = 1×1 = 1 ≠ 2x. Le contre-exemple x·x se retient en une seconde et invalide u′v′ pour toujours. Application : g(x) = (x²+1)(3x−2) : g′(x) = 2x(3x−2) + 3(x²+1) = 9x² − 4x + 3.</div>"},
{"t": "Opérations sur dérivées (1re)", "q": "(u/v)′ = ?", "c": ["(u′v + uv′)/v²", "(u′ − v′)/v²", "(u′v − uv′)/v²", "(uv′ − u′v)/v²"], "a": 2, "e": "Quotient : (u/v)′ = (u′v − uv′)/v².", "d": "<b>(u/v)′ = (u′v − uv′)/v²</b> : au numérateur, « dérivée du haut fois bas MOINS haut fois dérivée du bas », dans cet ordre.<div class='ex-detail'><u>Exemple rédigé</u> : h(x) = x/(x²+1) : h′(x) = (1×(x²+1) − x×2x)/(x²+1)² = (1 − x²)/(x²+1)². L'inversion du numérateur (uv′ − u′v) changerait le SIGNE de toute l'étude de variations. Contrôle : h′(0) = 1 &gt; 0 : h croît en 0 (cohérent avec h(x) ≈ x près de 0).</div>"},
{"t": "Opérations sur dérivées (1re)", "q": "f(x) = 3x⁴ − 2x³ + 5x − 7. f′(x) = ?", "c": ["12x³ − 6x² − 7", "12x³ − 6x² + 5 − 7", "12x³ − 6x² + 5", "7x³ − 5x² + 5"], "a": 2, "e": "Terme à terme : 12x³ − 6x² + 5 (la constante disparaît).", "d": "f′(x) = <b>12x³ − 6x² + 5</b> : (3x⁴)′ = 12x³, (−2x³)′ = −6x², (5x)′ = 5, (−7)′ = 0.<div class='ex-detail'><u>Exemple rédigé</u> : deux réflexes de contrôle : ① la constante disparaît TOUJOURS (« + 5 − 7 » la garde à tort) ; ② le degré baisse de 1 (4 → 3) et chaque coefficient gagne l'exposant initial (3×4 = 12, 2×3 = 6). Ces deux vérifications prennent 5 secondes.</div>"},
{"t": "Opérations sur dérivées (1re)", "q": "(1/v)′ = ?", "c": ["v′/v²", "−v′/v²", "1/v′", "−1/v²"], "a": 1, "e": "Cas spécial du quotient : (1/v)′ = −v′/v².", "d": "<b>(1/v)′ = −v′/v²</b> : cas particulier de (u/v)′ avec u = 1 (u′ = 0).<div class='ex-detail'><u>Exemple rédigé</u> : vérification avec la formule générale : (u′v − uv′)/v² = (0×v − 1×v′)/v² = −v′/v² ✓. Application : (1/(x²+1))′ = −2x/(x²+1)² : négatif pour x &gt; 0 : la fonction 1/(x²+1) décroît ✓ (cohérent avec la courbe connue). Piège : « −1/v² » oublie v′ : ne vaut que pour v = x.</div>"},
{"t": "Opérations sur dérivées (1re)", "q": "f(x) = x³ − 3x. f′(x) factorisée = ?", "c": ["3x² − 3", "x(3x − 3)", "3(x − 1)(x + 1)", "3(x − 1)²"], "a": 2, "e": "f′(x) = 3x² − 3 = 3(x − 1)(x + 1) : forme FACTORISÉE pour le tableau de signes.", "d": "f′(x) = <b>3(x − 1)(x + 1)</b> : la factorisation est la CLÉ de l'étude du signe.<div class='ex-detail'><u>Exemple rédigé</u> : signe : + sur ]−∞;−1[ (deux négatifs), − sur ]−1;1[ (un négatif), + sur ]1;+∞[. Variations : maximum local f(−1) = 2, minimum local f(1) = −2. Piège : laisser f′ = 3x² − 3 non factorisée : le tableau de signes devient impraticable — TOUJOURS factoriser avant d'étudier un signe.</div>"},
{"t": "Opérations sur dérivées (1re)", "q": "f′ s'annule en a en passant de − à +. Alors f présente en a…", "c": ["un point d'inflexion", "un minimum local", "aucun extremum", "un maximum local"], "a": 1, "e": "Changement − → + : la décroissance s'inverse en croissance : minimum local.", "d": "f′ : − → + ⟹ f décroît puis croît : <b>minimum local en a</b> (le « fond de vallée »).<div class='ex-detail'><u>Exemple rédigé</u> : pour x³ − 3x : en 1, f′ passe de − à + : minimum f(1) = −2 ; en −1, de + à − : maximum f(−1) = 2. Moyen de retenir : « la flèche de f′ monte ⟹ le point est un creux ». Piège : un point d'inflexion (x³ en 0) exige f′ SANS changement de signe.</div>"},
{"t": "Opérations sur dérivées (1re)", "q": "g(x) = (x² + 1)(3x − 2). g′(x) = ?", "c": ["2x(3x − 2) + 3(x² + 1)", "6x(3x − 2)", "3(3x − 2) + 2x(x² + 1)", "9x² − 4x"], "a": 0, "e": "u′v + uv′ = 2x(3x − 2) + (x² + 1)×3 (= 9x² − 4x + 3 développé).", "d": "g′(x) = 2x(3x−2) + 3(x²+1) = <b>9x² − 4x + 3</b>.<div class='ex-detail'><u>Exemple rédigé</u> : audit par développement : g(x) = 3x³ − 2x² + 3x − 2 ⟹ g′(x) = 9x² − 4x + 3 ✓ : produit et développement concordent. Pièges : « 6x(3x−2) » oublie le terme uv′ ; « 9x² − 4x » perd la constante 3 : le développement de contrôle l'aurait signalée.</div>"},
{"t": "Opérations sur dérivées (1re)", "q": "Tangente à f en a = 2, avec f(2) = 5 et f′(2) = 3 :", "c": ["y = 3x + 5", "y = 5(x − 2) + 3", "y = 2x + 3", "y = 3(x − 2) + 5"], "a": 3, "e": "y = f′(a)(x − a) + f(a) = 3(x − 2) + 5 = 3x − 1.", "d": "Tangente : y = <b>f′(a)(x − a) + f(a)</b> = 3(x − 2) + 5 = 3x − 1.<div class='ex-detail'><u>Exemple rédigé</u> : double contrôle : en x = 2 : y = 1 + 5... non : 3×0 + 5 = 5 = f(2) ✓ (passe par le point) ; pente = 3 = f′(2) ✓. Structure à mémoriser : pente × (x − a) + ordonnée du point : « la droite qui effleure la courbe ». Piège : « 3x + 5 » colle f(a) au mauvais endroit : elle ne passerait pas par (2 ; 5).</div>"},
{"t": "Opérations sur dérivées (1re)", "q": "h(x) = x/(x² + 1). h′(x) = ?", "c": ["(x² + 1 − 2x²)/(x²+1)² = (1 − x²)/(x²+1)²", "2x/(x² + 1)", "1/(2x)", "(x² + 1 + 2x²)/(x²+1)²"], "a": 0, "e": "(u′v − uv′)/v² = ((x²+1) − 2x²)/(x²+1)² = (1 − x²)/(x²+1)².", "d": "h′(x) = <b>(1 − x²)/(x² + 1)²</b> : numérateur 1×(x²+1) − x×(2x).<div class='ex-detail'><u>Exemple rédigé</u> : lecture du résultat : h′ &gt; 0 pour −1 &lt; x &lt; 1 : h croît de h(−1) = −1/2 à h(1) = 1/2. Signe du dénominateur : (x²+1)² &gt; 0 TOUJOURS : pas de valeur interdite (x² + 1 ≠ 0) : domaine = ℝ. Piège : « (x² + 1 + 2x²) » signe PLUS au numérateur : la formule est u′v MOINS uv′.</div>"},
{"t": "Opérations sur dérivées (1re)", "q": "f′(x) = (2x + 1)² ≥ 0 pour tout x. Que dire des variations de f ?", "c": ["f est décroissante", "f décroît puis croît", "f est croissante sur ℝ", "f est constante"], "a": 2, "e": "Un carré est toujours positif : f′ ≥ 0 : f croissante sur ℝ.", "d": "f′(x) = (2x+1)² ≥ 0 (nul seulement en x = −1/2, sans changer de signe) ⟹ f <b>croissante sur ℝ</b>.<div class='ex-detail'><u>Exemple rédigé</u> : exemple concret : f(x) = (2x+1)³/6 : f′(x) = (2x+1)²/2. La tangente horizontale en −1/2 est un point de la courbe qui « ralentit » sans s'arrêter (comme x³ en 0). Piège : « décroît puis croît » supposerait un changement de signe de f′ : un CARRE ne change jamais de signe.</div>"},
{"t": "Suites (1re)", "q": "u_0 = 5, r = 3 (arithmétique). u_10 = ?", "c": ["50", "35", "305", "38"], "a": 1, "e": "u_n = u_0 + nr = 5 + 3×10 = 35.", "d": "u_10 = 5 + 3×10 = <b>35</b> : u_n = u_0 + n·r.<div class='ex-detail'><u>Exemple rédigé</u> : contrôles : u_1 = 8, u_2 = 11… chaque terme gagne 3 : u_10 = 5 + 10 « marches » de 3 ✓. Piège : 50 = 5×10 multiplierait au lieu d'additionner (confusion avec le cas géométrique) ; 305 = 5 + 3×100 fausserait le rang. Arithmétique = ON AJOUTE, le terme général est LINÉAIRE en n.</div>"},
{"t": "Suites (1re)", "q": "v_0 = 2, q = 3 (géométrique). v_5 = ?", "c": ["243", "10", "486", "30"], "a": 2, "e": "v_n = 2×3ⁿ : v_5 = 2×243 = 486.", "d": "v_5 = 2×3⁵ = 2×243 = <b>486</b> : v_n = u_0·qⁿ.<div class='ex-detail'><u>Exemple rédigé</u> : énumération de contrôle : 2, 6, 18, 54, 162, 486 ✓. Piège : 30 = 2 + 28 ? Non : 30 viendrait d'une addition (confusion arithmétique/géométrique : +28 à chaque étape) ; 243 = 3⁵ sans le facteur u_0 = 2. Géométrique = ON MULTIPLIE, croissance EXPONENTIELLE.</div>"},
{"t": "Suites (1re)", "q": "Somme u_0 + … + u_10 avec u_0 = 5, r = 3 (u_10 = 35) ?", "c": ["220", "200", "350", "385"], "a": 0, "e": "11 termes, du premier (5) au dernier (35) : 11×(5+35)/2 = 220.", "d": "S = <b>11 × (5 + 35)/2 = 220</b> : nombre de termes × moyenne des extrêmes.<div class='ex-detail'><u>Exemple rédigé</u> : le comptage des termes est LE piège : de u_0 à u_10, il y a 11 termes (10 − 0 + 1), pas 10. Vérification Gauss : (5+35) + (8+32) + … chaque paire vaut 40 : 5,5 paires × 40 = 220 ✓. Piège : 350 = 10×35 utiliserait 10 termes et seulement le dernier.</div>"},
{"t": "Suites (1re)", "q": "5 ; 10 ; 20 ; 40… Cette suite est…", "c": ["géométrique de raison 5", "arithmétique de raison 5", "aucune des deux", "géométrique de raison 2"], "a": 3, "e": "Quotients : 10/5 = 20/10 = 40/20 = 2 constants : géométrique, q = 2.", "d": "Quotients constants = 2 ⟹ <b>géométrique de raison 2</b>.<div class='ex-detail'><u>Exemple rédigé</u> : test systématique : différences : 5, 10, 20 (non constantes ⟹ pas arithmétique) ; quotients : 2, 2, 2 (constants ⟹ géométrique). Piège : « arithmétique de raison 5 » : seule la PREMIÈRE différence vaut 5. Application type : capital doublé chaque année : ×2 = géométrique.</div>"},
{"t": "Suites (1re)", "q": "Suite géométrique de raison 0,5 avec u_0 = 100. Elle est…", "c": ["croissante", "décroissante", "constante", "alternée"], "a": 1, "e": "0 < q < 1 : chaque terme est plus petit que le précédent : décroissante.", "d": "q = 0,5 ∈ ]0 ; 1[ ⟹ suite strictement <b>décroissante</b> : 100 ; 50 ; 25 ; 12,5…<div class='ex-detail'><u>Exemple rédigé</u> : règle complète pour une suite géométrique à termes POSITIFS : q &gt; 1 ⟹ croissante ; 0 &lt; q &lt; 1 ⟹ décroissante ; q = 1 ⟹ constante ; q &lt; 0 ⟹ alternée. Piège : croire « géométrique = toujours croissante » : une raison INFÉRIEURE à 1 rétrécit. Application : demi-vie, dépréciation à 50 %.</div>"},
{"t": "Suites (1re)", "q": "u_n = u_0 + n·r. Cette formule suppose que…", "c": ["la suite commence à u_1", "la suite commence à u_0", "r = 1", "la suite est géométrique"], "a": 1, "e": "u_n = u_0 + nr compte n crans depuis u_0 ; si la suite démarre à u_1 : u_n = u_1 + (n−1)r.", "d": "Le terme général dépend du TERME DE DÉPART : u_n = u_0 + nr (départ u_0) ; sinon <b>u_n = u_1 + (n−1)r</b>.<div class='ex-detail'><u>Exemple rédigé</u> : exemple révélateur : u_1 = 5, r = 3 : u_10 = 5 + 9×3 = 32 (et non 5 + 30 = 35 : l'exposant/nombre de crans depuis u_1 est n − 1). Ce décalage d'indice est l'erreur la plus fréquente du chapitre : TOUJOURS vérifier u_1 avec la formule proposée avant de l'appliquer.</div>"},
{"t": "Suites (1re)", "q": "Épargne : 1 000 € placés à +5 % d'intérêts composés par an. Capital après n ans ?", "c": ["1000 + 50n (arithmétique)", "50n", "1000×1,05ⁿ (géométrique)", "1000×5ⁿ"], "a": 2, "e": "×1,05 chaque année : suite géométrique de raison 1,05 : 1000×1,05ⁿ.", "d": "Intérêts COMPOSÉS : le capital est MULTIPLIÉ par 1,05 chaque année ⟹ C_n = <b>1000 × 1,05ⁿ</b> (géométrique, q = 1,05).<div class='ex-detail'><u>Exemple rédigé</u> : distinction clé : intérêts SIMPLES : 1000 + 50n (arithmétique, +50 € fixes) ; composés : chaque intérêt produit à son tour des intérêts. Après 10 ans : 1000×1,05¹⁰ ≈ 1629 € contre 1500 € en simple. Piège : « 1000×5ⁿ » confond le TAUX (5 %) et le FACTEUR (1,05).</div>"},
{"t": "Suites (1re)", "q": "1 ; 4 ; 9 ; 16… (les carrés). Cette suite est…", "c": ["aucune des deux", "géométrique", "arithmétique de raison 3", "arithmétique"], "a": 0, "e": "Différences 3, 5, 7 non constantes ; quotients non constants : aucune des deux.", "d": "Ni les différences (3 ; 5 ; 7) ni les quotients ne sont constants : <b>aucune des deux</b> (u_n = n², croissance quadratique).<div class='ex-detail'><u>Exemple rédigé</u> : le test double est indispensable : une suite peut échapper aux deux catégories. Piège : « arithmétique de raison 3 » : seule la première différence vaut 3 (elle augmente ensuite). Autres suites hors catégorie : n², 2ⁿ + n, les factorielles… Toutes ne se rangent pas dans les deux moules.</div>"},
{"t": "Suites (1re)", "q": "Somme 1 + 2 + … + 100 = ?", "c": ["5 000", "5050", "101", "100² = 10 000"], "a": 1, "e": "n(n+1)/2 = 100×101/2 = 5050 (méthode de Gauss).", "d": "1 + 2 + … + n = <b>n(n+1)/2</b> : pour n = 100 : 100×101/2 = <b>5050</b>.<div class='ex-detail'><u>Exemple rédigé</u> : l'astuce de Gauss : paire (1+100) = 101, (2+99) = 101… : 50 paires × 101 = 5050. Version arithmétique générale : nombre de termes (100) × (premier + dernier)/2 = 100×101/2 : la même formule. Piège : 10 000 = 100² : la formule des carrés, pas des entiers.</div>"},
{"t": "Suites (1re)", "q": "Somme géométrique 1 + 3 + 9 + 27 + 81 + 243 = ?", "c": ["512", "728", "364", "729"], "a": 1, "e": "(3⁶ − 1)/(3 − 1) = (729 − 1)/2 = 364.", "d": "S = (q^{nb} − 1)/(q − 1) : 6 termes, q = 3 : (3⁶ − 1)/2 = <b>364</b>.<div class='ex-detail'><u>Exemple rédigé</u> : vérification directe : 1+3 = 4, +9 = 13, +27 = 40, +81 = 121, +243 = 364 ✓. Piège : 728 doublerait à tort (c'était la somme AVEC le facteur 2 de l'exemple du cours : 2×364 = 728) ; 729 = 3⁶ confond la somme avec la puissance. Rappel : l'exposant dans la formule = nombre de TERMES (ici 6), pas le dernier exposant + 1… si : 3⁶ = le terme SUIVANT, exactement.</div>"},
{"t": "Probabilités conditionnelles (1re)", "q": "P_B(A) = ?", "c": ["P(A)×P(B)", "P(A)/P(B)", "P(A ∩ B)/P(B)", "P(A ∩ B)/P(A)"], "a": 2, "e": "P_B(A) = P(A∩B)/P(B) : on restreint l'univers à B.", "d": "<b>P_B(A) = P(A ∩ B)/P(B)</b> : « A sachant B » = la part de A∩B DANS B.<div class='ex-detail'><u>Exemple rédigé</u> : contrôle du dénominateur : c'est l'événement SACHANT (B) qui divise. Exemple : 60 % des filles font latin : le dénominateur est P(fille) = 0,55, et P(fille ∩ latin) = 0,55 × 0,6 = 0,33. Piège : P(A∩B)/P(A) = P_A(B), l'autre conditionnelle — les deux se lisent dans les deux sens, mais chacune a SON dénominateur.</div>"},
{"t": "Probabilités conditionnelles (1re)", "q": "P(fille) = 0,55 et 60 % des filles font latin. P(fille ∩ latin) = ?", "c": ["0,6", "0,55", "0,33", "1,15"], "a": 2, "e": "P(fille ∩ latin) = 0,55 × 0,6 = 0,33.", "d": "P(fille ∩ latin) = P(fille) × <b>P_fille(latin)</b> = 0,55 × 0,6 = <b>0,33</b>.<div class='ex-detail'><u>Exemple rédigé</u> : dénombrement de contrôle : sur 100 élèves, 55 filles ; 60 % d'entre elles : 0,6×55 = 33 filles latinistes : 33/100 = 0,33 ✓. Piège : 1,15 additionnerait 0,55 et 0,6 (une probabilité ne dépasse pas 1 : signal d'alarme) ; 0,6 est la conditionnelle, pas l'intersection.</div>"},
{"t": "Probabilités conditionnelles (1re)", "q": "A et B indépendants signifie…", "c": ["P(A ∪ B) = 1", "P(A ∩ B) = P(A) × P(B)", "A ∩ B = ∅", "P(A) = P(B)"], "a": 1, "e": "Indépendance : P(A∩B) = P(A)×P(B) ; incompatible : A ∩ B = ∅ — deux notions différentes !", "d": "Indépendants ⟺ <b>P(A ∩ B) = P(A) × P(B)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la confusion avec « incompatibles » (A∩B = ∅) est l'erreur no 1 : deux événements incompatibles non impossibles ne sont JAMAIS indépendants (si B est réalisé, A devient impossible : B INFORME sur A). Exemple d'indépendance : deux lancers de pièce séparés : P(2 piles) = 0,5 × 0,5 = 0,25.</div>"},
{"t": "Probabilités conditionnelles (1re)", "q": "Test : P(+) = 0,9 chez malade, 0,08 chez sain, 10 % malades. P(+) = ?", "c": ["0,98", "0,18", "0,162", "0,09"], "a": 2, "e": "Probabilités totales : 0,1×0,9 + 0,9×0,08 = 0,09 + 0,072 = 0,162.", "d": "P(+) = P(M)·P_M(+) + P(M̄)·P_M̄(+) = 0,09 + 0,072 = <b>0,162</b>.<div class='ex-detail'><u>Exemple rédigé</u> : sur 1000 personnes : 100 malades dont 90 +, 900 sains dont 72 + : 162 positifs / 1000 = 0,162 ✓. C'est la FORMULE DES PROBABILITÉS TOTALES : la somme des chemins de l'arbre menant au même événement. Piège : 0,98 additionnerait 0,9 et 0,08 sans pondérer par les fréquences M/M̄.</div>"},
{"t": "Probabilités conditionnelles (1re)", "q": "Sur un arbre, la probabilité d'un chemin complet s'obtient en…", "c": ["prenant la plus grande branche", "additionnant les branches", "multipliant les branches du chemin", "multipliant par le nombre de branches"], "a": 2, "e": "Produit le long du chemin ; addition ENTRE les chemins menant au même événement.", "d": "Un chemin d'arbre : <b>PRODUIT</b> des probabilités de ses branches (ex. 0,1 × 0,9 = 0,09).<div class='ex-detail'><u>Exemple rédigé</u> : la règle complète : « produit sur le chemin, somme entre chemins ». Justification : P(A ∩ B) = P(A) × P_A(B) : c'est la formule des probabilités composées. Piège : additionner les branches d'un même chemin (0,1 + 0,9 = 1 : absurde, la probabilité du chemin serait la certitude).</div>"},
{"t": "Probabilités conditionnelles (1re)", "q": "Deux tirages AVEC remise d'une boule. Les épreuves sont…", "c": ["incompatibles", "conditionnelles l'une à l'autre", "impossibles", "indépendantes"], "a": 3, "e": "Avec remise, le 2e tirage ne « sait rien » du premier : indépendance (produit des probabilités).", "d": "Avec remise ⟹ <b>indépendance</b> : le sac est réinitialisé, P(2e) ne dépend pas du 1er résultat : P(A puis A) = P(A)².<div class='ex-detail'><u>Exemple rédigé</u> : urne 3 rouges / 7 bleues, avec remise : P(2 rouges) = 0,3 × 0,3 = 0,09. SANS remise : 2e tirage dans 2R/7B : P = 0,3 × (2/9) ≈ 0,067 : les probabilités BOUGENT (conditionnelles). La remise est LE critère d'indépendance des tirages.</div>"},
{"t": "Probabilités conditionnelles (1re)", "q": "P(A) = 0,5, P(B) = 0,4, P(A ∩ B) = 0,2. A et B sont…", "c": ["indépendants", "incompatibles", "contraires", "conditionnels"], "a": 0, "e": "P(A)×P(B) = 0,2 = P(A ∩ B) : indépendants.", "d": "P(A)×P(B) = 0,5×0,4 = 0,2 = P(A∩B) ⟹ <b>indépendants</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la vérification est toujours une COMPARAISON : calculer le produit, comparer à l'intersection, conclure par phrase. Autre lecture : P_B(A) = 0,2/0,4 = 0,5 = P(A) : savoir B ne change rien à A. Piège : si P(A∩B) = 0,1 ≠ 0,2 : PAS indépendants, même si les nombres sont « proches » : l'égalité est EXACTE ou n'est pas.</div>"},
{"t": "Probabilités conditionnelles (1re)", "q": "« Sachant que B est réalisé », la probabilité d'un événement A se calcule en divisant par…", "c": ["P(A)", "1", "P(A ∪ B)", "P(B)"], "a": 3, "e": "L'univers devient B : P_B(A) = P(A∩B)/P(B).", "d": "« Sachant B » ⟹ l'univers se RESTREINT à B : on divise par <b>P(B)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : exemple parlant : P(« heureux ») = 0,3 dans la population ; parmi les gagnants du loto (B, P = 10⁻⁶), P_B(heureux) = 0,9 : l'univers « gagnants » est minuscule (dénominateur P(B)), mais la proportion d'heureux y est énorme. Piège : diviser par P(A) donnerait P_A(B) : l'autre direction.</div>"},
{"t": "Probabilités conditionnelles (1re)", "q": "Deux événements incompatibles avec P(A) > 0 et P(B) > 0 sont…", "c": ["jamais indépendants", "toujours indépendants", "parfois indépendants", "contraires"], "a": 0, "e": "Incompatibles : A∩B = ∅, donc P(A∩B) = 0 ≠ P(A)×P(B) > 0 : jamais indépendants.", "d": "Incompatibles (et non impossibles) ⟹ <b>jamais indépendants</b> : P(A∩B) = 0 mais P(A)×P(B) &gt; 0 : l'égalité d'indépendance échoue.<div class='ex-detail'><u>Exemple rédigé</u> : intuition : si B est réalisé, A devient IMPOSSIBLE (A∩B = ∅) : la réalisation de B informe totalement sur A : dépendance maximale. Exemple : « tirer un roi » et « tirer un 7 » en une carte : incompatibles ; savoir qu'on a tiré un 7 exclut le roi. Seul le cas P(A) = 0 (ou P(B) = 0) blanchit l'indépendance, trivialement.</div>"},
{"t": "Probabilités conditionnelles (1re)", "q": "Formule des probabilités totales avec B et B̄ :", "c": ["P(A) = P(A∩B) + P(A∩B̄)", "P(A) = P_B(A) + P_B̄(A)", "P(A) = P(B) × P(B̄)", "P(A) = P(A) × P(B) + P(A) × P(B̄)"], "a": 0, "e": "A se réalise soit avec B, soit avec B̄ : P(A) = P(A∩B) + P(A∩B̄) = P(B)P_B(A) + P(B̄)P_B̄(A).", "d": "<b>P(A) = P(A∩B) + P(A∩B̄)</b> : B et B̄ partitionnent l'univers, donc A se produit « via » l'un ou l'autre chemin.<div class='ex-detail'><u>Exemple rédigé</u> : version arbre : P(+) = 0,1×0,9 + 0,9×0,08 = 0,162 : la somme des DEUX chemins menant à +. Piège : P_B(A) + P_B̄(A) ne donne pas P(A) (cette somme peut valoir n'importe quoi, même 1,3) : il faut PONDÉRER par P(B) et P(B̄). La partition {B ; B̄} est le réflexe de tout exercice de type « test de dépistage ».</div>"},
{"t": "Produit scalaire (1re)", "q": "u→(3 ; 4) et v→(−2 ; 6). u→·v→ = ?", "c": ["18", "−24", "6", "24"], "a": 0, "e": "3×(−2) + 4×6 = −6 + 24 = 18.", "d": "u→·v→ = xx′ + yy′ = <b>18</b>.<div class='ex-detail'><u>Exemple rédigé</u> : la formule coordonnées : produit des abscisses + produit des ordonnées. Piège : −6 + 24 se calcule AVEC les signes : « 24 » oublierait le −6 ; « −24 » additionnerait −6 et −18 ? Non : bien respecter −2. Rappel : le résultat est un NOMBRE (18), jamais un vecteur.</div>"},
{"t": "Produit scalaire (1re)", "q": "u→·v→ = 0 signifie…", "c": ["u→ ⊥ v→ (ou l'un est nul)", "u→ et v→ colinéaires", "u→ = v→", "u→ = 0→ et v→ = 0→"], "a": 0, "e": "Produit scalaire nul ⟺ orthogonalité.", "d": "u→·v→ = 0 ⟺ <b>u→ ⊥ v→</b> (si aucun des deux n'est nul).<div class='ex-detail'><u>Exemple rédigé</u> : contre-piège : « colinéaires » : deux vecteurs colinéaires ont u→·v→ = ±‖u→‖‖v→‖ ≠ 0 (sauf vecteur nul) : c'est l'ORTHOGONALITÉ qui annule le produit scalaire (cos 90° = 0). Application : prouver qu'un triangle est rectangle en B : BA→·BC→ = 0 suffit — une ligne remplace Pythagore.</div>"},
{"t": "Produit scalaire (1re)", "q": "A(1;2), B(4;3), C(5;0). BA→·BC→ = ?", "c": ["−6", "−3", "6", "0"], "a": 3, "e": "BA→ = (−3;−1), BC→ = (1;−3) : −3 + 3 = 0 : rectangle en B !", "d": "BA→ = (−3 ; −1), BC→ = (1 ; −3) : BA→·BC→ = −3×1 + (−1)×(−3) = <b>0</b> ⟹ rectangle en B.<div class='ex-detail'><u>Exemple rédigé</u> : l'ordre des lettres compte : BA→ = A − B (arrivée moins départ), pas B − A. Contrôle Pythagore : BA = √10, BC = √10, AC = √(16+4) = √20 : 10 + 10 = 20 ✓. Les deux méthodes concordent : le produit scalaire est la plus RAPIDE (aucune racine à extraire).</div>"},
{"t": "Produit scalaire (1re)", "q": "‖u→‖² avec u→(x ; y) = ?", "c": ["u→·v→", "x + y", "x² + y²", "√(x² + y²)"], "a": 2, "e": "u→·u→ = x² + y² = ‖u→‖².", "d": "<b>‖u→‖² = u→·u→ = x² + y²</b> (et ‖u→‖ = √(x²+y²)).<div class='ex-detail'><u>Exemple rédigé</u> : c'est Pythagore réécrit : u→·u→ = ‖u→‖²·cos(0°) = ‖u→‖² (l'angle de u→ avec lui-même est nul). Application élégante : AB² = AB→·AB→ : pour prouver une égalité de longueurs, on compare des carrés via des produits scalaires — sans jamais extraire de racine.</div>"},
{"t": "Produit scalaire (1re)", "q": "Le produit scalaire u→·v→ est…", "c": ["un nombre", "toujours positif", "une longueur", "un vecteur"], "a": 0, "e": "C'est un nombre réel, positif si l'angle est aigu, nul s'il est droit, négatif s'il est obtus.", "d": "Le produit scalaire est <b>un NOMBRE</b> : &gt; 0 (angle aigu), = 0 (droit), &lt; 0 (obtus).<div class='ex-detail'><u>Exemple rédigé</u> : la lecture du SIGNE informe sur l'angle : u→·v→ &lt; 0 ⟹ l'angle entre les vecteurs dépasse 90°. Piège : écrire le résultat avec une flèche (u→·v→ = (3 ; 2)…) : c'est un scalaire, le nom le dit. Seuls le produit « vectoriel » (hors programme) et les vecteurs gardent une flèche.</div>"},
{"t": "Produit scalaire (1re)", "q": "Al-Kashi : b = 5, c = 7, Â = 60°. a² = ?", "c": ["39", "109", "74", "35"], "a": 0, "e": "a² = 25 + 49 − 2×5×7×0,5 = 74 − 35 = 39.", "d": "a² = b² + c² − <b>2bc·cos(Â)</b> = 74 − 35 = <b>39</b> (cos 60° = 1/2).<div class='ex-detail'><u>Exemple rédigé</u> : Al-Kashi = « Pythagore non rectangle » : si Â = 90°, cos(Â) = 0 et on retrouve a² = b² + c² : le théorème de Pythagore est le CAS PARTICULIER d'angle droit. Piège : 74 oublierait le terme −2bc·cos(Â) ; 109 additionnerait +35 : le MOINS est la clé.</div>"},
{"t": "Produit scalaire (1re)", "q": "cos θ = (u→·v→)/(‖u→‖‖v→‖) = 18/(5×2√10). θ est…", "c": ["≈ 55° (aigu)", "impossible à déterminer", "≈ 125° (obtus)", "90°"], "a": 0, "e": "18/(10√10) ≈ 0,57 > 0 : angle aigu, θ ≈ 55°.", "d": "cos θ ≈ 0,57 &gt; 0 ⟹ θ <b>aigu, ≈ 55°</b>.<div class='ex-detail'><u>Exemple rédigé</u> : méthode complète : ① produit scalaire en coordonnées (18) ; ② normes (5 et 2√10) ; ③ quotient (toujours dans [−1 ; 1] : sinon erreur de calcul) ; ④ cos⁻¹. Le SIGNE du produit scalaire donne déjà le type d'angle avant tout calcul d'angle : 18 &gt; 0 ⟹ aigu, sans machine.</div>"},
