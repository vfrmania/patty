{"id": "fractions", "theme": "Fractions (6e)", "niveau": "6e", "titre": "Fractions : comparaison, addition, soustraction", "cours": "<div class=\"cours-head\"><h2>Fractions : comparaison, addition, soustraction</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Vocabulaire et sens de la fraction</h3>\n<p>Dans la fraction a/b : a est le <b>numérateur</b> (nombre de parts), b le <b>dénominateur</b> (taille des parts). La fraction a/b désigne aussi le quotient a ÷ b : 3/4 = 3 ÷ 4 = 0,75.</p>\n<div class=\"tip\"><b>Partage :</b> 3/4 d'une pizza = 3 parts d'une pizza coupée en 4. <b>Quotient :</b> 3/4 = 0,75. Une fraction est un NOMBRE, pas seulement un « partage ».</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — prendre une fraction d'une quantité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une classe de 24 élèves : combien représentent 3/4 des élèves ? Et 2/3 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Diviser par le dénominateur</b> : 24 ÷ 4 = 6, c'est 1/4 de la classe.</div><div class=\"etu\"><b>Étape 2</b> — <b>Multiplier par le numérateur</b> : 6 × 3 = 18 élèves = 3/4 de la classe.</div><div class=\"etu\"><b>Étape 3</b> — <b>De même pour 2/3</b> : 24 ÷ 3 = 8, puis 8 × 2 = 16 élèves.</div><div class=\"etu\"><b>Étape 4</b> — <b>Contrôle</b> : 18 ≤ 24 ✓ et 16 ≤ 24 ✓ (une fraction de la classe ne peut pas dépasser la classe).</div></div></details>\n<h3>2. Comparer des fractions</h3>\n<div class=\"tip\"><b>Same dénominateur :</b> on compare les numérateurs (5/7 &gt; 3/7).<br><b>Same numérateur :</b> la fraction au PLUS PETIT dénominateur est la plus grande (2/3 &gt; 2/5 : des parts plus grosses).<br><b>Cas général :</b> réduire au même dénominateur, ou comparer les quotients décimaux.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comparer 2/3 et 3/5</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparer 2/3 et 3/5.</div><div class=\"etu\"><b>Étape 1</b> — <b>Même dénominateur</b> : 15 convient (3 × 5 et 5 × 3) : 2/3 = 10/15 et 3/5 = 9/15.</div><div class=\"etu\"><b>Étape 2</b> — <b>Comparer les numérateurs</b> : 10 &gt; 9.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : 2/3 &gt; 3/5. (Vérification décimale : 0,667 &gt; 0,6 ✓.)</div></div></details>\n<h3>3. Addition et soustraction</h3>\n<div class=\"tip\"><b>Règle d'or :</b> on n'additionne QUE des fractions de MÊME dénominateur : on additionne les numérateurs, on garde le dénominateur : a/c + b/c = (a+b)/c.<br>Si les dénominateurs diffèrent, on réduit au même dénominateur D'ABORD.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — additionner deux fractions</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer 1/4 + 2/3.</div><div class=\"etu\"><b>Étape 1</b> — <b>Même dénominateur</b> : 12 (4 × 3) : 1/4 = 3/12 et 2/3 = 8/12.</div><div class=\"etu\"><b>Étape 2</b> — <b>Additionner les numérateurs</b> : 3/12 + 8/12 = 11/12.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : 1/4 + 2/3 = <b>11/12</b>. Contrôle décimal : 0,25 + 0,667 ≈ 0,917 = 11/12 ✓.</div></div></details>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — soustraire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer 7/10 − 2/5.</div><div class=\"etu\"><b>Étape 1</b> — <b>Réduire au dénominateur 10</b> : 2/5 = 4/10.</div><div class=\"etu\"><b>Étape 2</b> — <b>Soustraire</b> : 7/10 − 4/10 = 3/10.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : 7/10 − 2/5 = <b>3/10</b> = 0,3. On ne touche JAMAIS aux dénominateurs dans l'opération.</div></div></details>\n<h3>4. Fractions égales et simplification</h3>\n<div class=\"tip\"><b>Propriété :</b> a/b = (a×k)/(b×k) = (a÷k)/(b÷k). Exemple : 6/8 = 3/4 (on divise par 2). Simplifier = diviser haut et bas par le même nombre.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> 1/2 + 1/3 ≠ 2/5 (on n'additionne JAMAIS dénominateurs et numérateurs séparément) ; 2/3 &gt; 2/5 (plus petit dénominateur = plus grand, à numérateur égal) ; une fraction peut être plus grande que 1 (7/4 = 1,75).</div>"},
{"id": "pourcentages", "theme": "Proportionnalité et pourcentages (6e)", "niveau": "6e", "titre": "Proportionnalité et pourcentages", "cours": "<div class=\"cours-head\"><h2>Proportionnalité et pourcentages</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Situations de proportionnalité</h3>\n<p>Deux grandeurs sont <b>proportionnelles</b> si on passe de l'une à l'autre en multipliant toujours par le même nombre (le <b>coefficient</b>). Exemples : prix et quantité achetée ; distance et temps à vitesse constante. Contre-exemple : l'âge et la taille d'une personne.</p>\n<div class=\"tip\"><b>Reconnaître :</b> dans un tableau, les quotients ligne/ligne doivent être tous égaux (le coefficient) ; « si je double la quantité, le prix double aussi ».</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — tester la proportionnalité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Tableau 1 : 2 kg → 6 € et 5 kg → 15 €. Tableau 2 : 2 kg → 6 € et 5 kg → 14 €. Lequel est proportionnel ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Tableau 1 : chercher le coefficient</b> : 6/2 = 3 et 15/5 = 3. Coefficient constant → <b>proportionnel</b> (3 €/kg).</div><div class=\"etu\"><b>Étape 2</b> — <b>Tableau 2</b> : 6/2 = 3 mais 14/5 = 2,8. Coefficients différents → PAS proportionnel (peut-être une remise au-delà d'une certaine quantité).</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : seul le tableau 1 traduit une situation de proportionnalité. C'est ce qu'on appelle le « test des quotients ».</div></div></details>\n<h3>2. Le produit en croix (quatrième proportionnelle)</h3>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — retrouver une valeur manquante</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> 4 cahiers coûtent 6 €. Combien coûtent 10 cahiers ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Méthode 1 : le coefficient</b> : 6/4 = 1,5 € par cahier, donc 10 × 1,5 = <b>15 €</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Méthode 2 : le passage par l'unité</b> (même idée) : 1 cahier = 6/4 = 1,5 €, puis × 10.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôle de proportionnalité</b> : 6/4 = 15/10 = 1,5 ✓ : les deux colonnes respectent le même coefficient.</div></div></details>\n<h3>3. Les pourcentages</h3>\n<p>Un pourcentage est une façon d'écrire une fraction sur 100 : <b>25 % = 25/100 = 0,25</b> = un quart. « Prendre 25 % de 80 » = prendre un quart de 80 = 20.</p>\n<div class=\"tip\"><b>Appliquer un pourcentage :</b> t % de N = (t/100) × N = N × t ÷ 100.<br>Exemples : 50 % = la moitié ; 25 % = le quart ; 10 % = diviser par 10 ; 75 % = trois quarts.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer un pourcentage d'un prix</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un pull à 40 € est soldé à −30 %. Quel est le prix soldé ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Calculer la remise</b> : 30 % de 40 = (30/100) × 40 = 0,3 × 40 = 12 €.</div><div class=\"etu\"><b>Étape 2</b> — <b>Soustraire</b> : 40 − 12 = <b>28 €</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Raccourci expert</b> : payer après −30 % = payer 70 % du prix : 0,7 × 40 = 28 € ✓. Cette astuce servira en 4e (× 0,7 = coefficient multiplicateur).</div></div></details>\n<h3>4. Pourcentages particuliers et échelles (aperçu)</h3>\n<p>Les pourcentages courants à connaître par cœur : 10 % (÷ 10), 25 % (÷ 4), 50 % (÷ 2), 75 % (3 × ÷ 4). Sur un plan, l'<b>échelle</b> indique combien de fois la réalité est réduite : au 1/1000, 1 cm représente 10 m (l'échelle sera approfondie en 4e).</p>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « +50 % puis −50 % » ne ramène PAS au prix initial (100 → 150 → 75 !) ; un pourcentage s'applique TOUJOURS à une quantité précise (30 % de 40 ≠ 30 % de 60) ; 100 % = la totalité, pas « beaucoup ».</div>"},
{"id": "geometrie", "theme": "Géométrie de base (6e)", "niveau": "6e", "titre": "Géométrie de base : figures, angles, symétries", "cours": "<div class=\"cours-head\"><h2>Géométrie de base : figures, angles, symétries</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les figures usuelles</h3>\n<div class=\"tip\"><b>Polygones :</b> triangle (3 côtés), quadrilatère (4), pentagone (5), hexagone (6).<br><b>Triangles particuliers :</b> équilatéral (3 côtés égaux), isocèle (2 côtés égaux), rectangle (un angle droit).<br><b>Quadrilatères particuliers :</b> trapèze (2 côtés parallèles), parallélogramme (côtés parallèles 2 à 2), rectangle (4 angles droits), losange (4 côtés égaux), carré (rectangle ET losange).</div>\n<p>Le <b>cercle</b> de centre O et rayon r est formé des points à distance r de O ; le rayon relie O au cercle, le diamètre (2r) le traverse, la corde relie deux points du cercle.</p>\n<h3>2. Les angles</h3>\n<div class=\"tip\"><b>Mesures :</b> angle droit = 90° ; angle aigu &lt; 90° ; angle obtus entre 90° et 180° ; angle plat = 180°.<br>Deux angles sont <b>complémentaires</b> si leur somme vaut 90°, <b>supplémentaires</b> si elle vaut 180°.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer un angle dans une figure</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux angles complémentaires : l'un mesure 35°. Combien mesure l'autre ? Et s'ils étaient supplémentaires ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Complémentaires</b> : 90° − 35° = <b>55°</b> (35 + 55 = 90 ✓).</div><div class=\"etu\"><b>Étape 2</b> — <b>Supplémentaires</b> : 180° − 35° = <b>145°</b> (35 + 145 = 180 ✓).</div><div class=\"etu\"><b>Étape 3</b> — <b>Retenir</b> : complémentaire pense « 90 », supplémentaire pense « 180 » — le vocabulaire s'entend dans le mot : comPLÉMENTAIRE complète pour atteindre l'angle droit.</div></div></details>\n<p>Propriété fondamentale : la somme des angles d'un <b>triangle</b> vaut 180° ; celle d'un <b>quadrilatère</b> vaut 360°.</p>\n<h3>3. Les symétries</h3>\n<div class=\"tip\"><b>Axe de symétrie :</b> une figure possède un axe de symétrie (d) si elle se superpose à elle-même après pliage le long de (d). Le symétrique d'un point M est tel que (d) est la MÉDIATRICE de [MM′].<br><b>Symétrie centrale :</b> symétrique par rapport à un point O : M, O et M′ alignés avec OM = OM′ (retournement de 180°).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — construire un symétrique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Construire le symétrique M′ de M par rapport à la droite (d).</div><div class=\"etu\"><b>Étape 1</b> — <b>Tracer la perpendiculaire</b> à (d) passant par M (équerre).</div><div class=\"etu\"><b>Étape 2</b> — <b>Marquer le point H</b> d'intersection avec (d).</div><div class=\"etu\"><b>Étape 3</b> — <b>Reporter la longueur</b> de l'autre côté : HM′ = HM, sur la même perpendiculaire.</div><div class=\"etu\"><b>Étape 4</b> — <b>Contrôler</b> : (d) doit être la médiatrice de [MM′] : pliage virtuel ⟹ M tombe sur M′.</div></div></details>\n<h3>4. Symétries des figures usuelles</h3>\n<p>Segment : 2 axes (sa médiatrice + sa droite) ; angle : 1 axe (sa bissectrice) ; cercle : une infinité d'axes (tous les diamètres) ; isocèle : 1 axe ; équilatéral : 3 axes ; rectangle : 2 axes ; losange : 2 axes ; carré : 4 axes ; parallélogramme : 0 axe (mais un centre de symétrie !).</p>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le parallélogramme n'a PAS d'axe de symétrie (mais un centre) ; ne pas confondre rayon et diamètre ; deux angles supplémentaires ne sont pas forcément adjacents ; 35° et 55° sont complémentaires, 35° et 145° supplémentaires.</div>"},
{"id": "relatifs", "theme": "Nombres relatifs (5e)", "niveau": "5e", "titre": "Nombres relatifs : repérage, addition, soustraction", "cours": "<div class=\"cours-head\"><h2>Nombres relatifs : repérage, addition, soustraction</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Vocabulaire et repérage</h3>\n<p>Les <b>nombres relatifs</b> sont les nombres positifs (avec ou sans signe +) et négatifs (avec un signe −). −3 se lit « moins trois » ; +5 ou 5 désignent le même nombre positif.</p>\n<div class=\"tip\"><b>Ordre :</b> deux nombres de même signe sont rangés comme leurs distances à zéro (3 &lt; 5 donc −3 &gt; −5 : plus proche de zéro = plus grand chez les négatifs). Tout nombre négatif est inférieur à tout nombre positif.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comparer et ranger des relatifs</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Ranger dans l'ordre croissant : 2 ; −5 ; −2,5 ; 0 ; 3,1.</div><div class=\"etu\"><b>Étape 1</b> — <b>Placer sur une droite graduée</b> : les négatifs à gauche de 0 (−5 le plus loin), les positifs à droite.</div><div class=\"etu\"><b>Étape 2</b> — <b>Lire l'ordre</b> : −5 &lt; −2,5 &lt; 0 &lt; 2 &lt; 3,1.</div><div class=\"etu\"><b>Étape 3</b> — <b>Retenir</b> : chez les négatifs, « plus loin de zéro » = plus petit (−5 &lt; −2,5). Le thermomètre est une bonne image : −5° est plus froid que −2,5°.</div></div></details>\n<h3>2. Addition de relatifs</h3>\n<div class=\"tip\"><b>Règle 1 — même signe :</b> on ajoute les distances à zéro et on garde le signe commun : (−3) + (−5) = −8 ; (+2) + (+4) = +6.<br><b>Règle 2 — signes contraires :</b> on soustrait les distances à zéro et on prend le signe du plus « loin de zéro » : (−7) + (+4) = −3 ; (+8) + (−5) = +3.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — additionner tous les cas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer A = (−6) + (−9) ; B = (−8) + (+3) ; C = (+5) + (−12).</div><div class=\"etu\"><b>Étape 1</b> — <b>A : même signe (−)</b> : 6 + 9 = 15, signe − : A = <b>−15</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>B : signes contraires</b> : 8 − 3 = 5, signe du plus loin de zéro (8 &gt; 3, c'était le −) : B = <b>−5</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>C : signes contraires</b> : 12 − 5 = 7, signe du 12 (le −) : C = <b>−7</b>.</div><div class=\"etu\"><b>Étape 4</b> — <b>Contrôler avec la droite graduée</b> : partir de +5 et reculer de 12 : on tombe bien sur −7 ✓.</div></div></details>\n<h3>3. Soustraction : transformer en addition</h3>\n<div class=\"tip\"><b>Règle d'or :</b> soustraire un nombre = AJOUTER son opposé : a − b = a + (−b).<br>Exemples : 5 − 9 = 5 + (−9) = −4 ; 3 − (−7) = 3 + (+7) = 10 ; −4 − (−6) = −4 + (+6) = +2.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — soustractions pièges</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer D = 3 − (−7) et E = −4 − (−6).</div><div class=\"etu\"><b>Étape 1</b> — <b>D : « moins un négatif »</b> : 3 − (−7) = 3 + (+7) = <b>10</b>. Soustraire −7, c'est RECULER de −7, donc avancer de 7.</div><div class=\"etu\"><b>Étape 2</b> — <b>E : même transformation</b> : −4 − (−6) = −4 + (+6) = <b>+2</b> (signes contraires, 6 &gt; 4, signe +).</div><div class=\"etu\"><b>Étape 3</b> — <b>Retenir</b> : deux signes « − » qui se suivent « s'annulent » en un + : − (−x) = +x. C'est le réflexe clé du chapitre.</div></div></details>\n<h3>4. Sommes algébriques (enchaînements)</h3>\n<p>Pour une suite comme A = −7 + 3 − 5 + 12, on peut : 1) tout transformer en additions, 2) ou regrouper les positifs d'un côté, les négatifs de l'autre : A = (3 + 12) + (−7 − 5) = 15 − 12 = <b>3</b>.</p>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> −5 &gt; −3 est FAUX (−5 &lt; −3) ; − (−7) = +7 (pas −7) ; distance à zéro de −8 : c'est 8 (positive) ; ne pas confondre « moins » (opérateur) et « négatif » (signe).</div>"},
{"id": "litteral-5e", "theme": "Expressions littérales (5e)", "niveau": "5e", "titre": "Premières expressions littérales et simplification", "cours": "<div class=\"cours-head\"><h2>Premières expressions littérales et simplification</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Qu'est-ce qu'une expression littérale ?</h3>\n<p>Une <b>expression littérale</b> contient une ou plusieurs lettres qui représentent des nombres : la lettre est une « boîte » qui peut prendre différentes valeurs. Exemple : l'aire d'un rectangle s'écrit A = L × l ; le périmètre d'un carré P = 4 × c.</p>\n<div class=\"tip\"><b>Conventions d'écriture :</b> le signe × disparaît devant une lettre ou une parenthèse : 4 × c = 4c ; 3 × (x + 1) = 3(x + 1) ; x × 2 = 2x (le nombre AVANT la lettre) ; 1 × a = a (pas « 1a »).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — écrire une formule en lettres</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un car de 52 places part avec p personnes ; à chaque arrêt, m personnes montent. Écrire le nombre de passagers après 3 arrêts, puis calculer pour p = 20 et m = 6.</div><div class=\"etu\"><b>Étape 1</b> — <b>Traduire</b> : après 3 arrêts : N = p + 3 × m = p + 3m.</div><div class=\"etu\"><b>Étape 2</b> — <b>Substituer</b> : N = 20 + 3 × 6 = 20 + 18 = <b>38 passagers</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Vérifier la cohérence</b> : 38 ≤ 52 ✓ : tout le monde a une place. L'expression littérale sert UNE fois pour tous les calculs.</div></div></details>\n<h3>2. Simplifier une expression</h3>\n<p>Simplifier, c'est écrire plus court <b>sans changer la valeur</b> : x + x = 2x ; x × x = x² ; 3x + 5x = 8x ; 2 × 3 × x = 6x.</p>\n<div class=\"tip\"><b>Règles :</b> on ne peut additionner que des termes de MÊME nature : 3x + 5x = 8x, mais 3x + 5 ne se simplifie pas ; x + x² ne se simplifie pas non plus.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — simplifier une expression</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Simplifier A = 5 × x + 3 × x et B = 4 × x × 2 + x + x².</div><div class=\"etu\"><b>Étape 1</b> — <b>A :</b> 5 × x = 5x et 3 × x = 3x ; A = 5x + 3x = <b>8x</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>B :</b> d'abord 4 × x × 2 = 8x ; puis B = 8x + x + x² = 8x + 1x + x² = <b>9x + x²</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôle numérique</b> : avec x = 2 : B initial = 4×2×2 + 2 + 4 = 16 + 2 + 4 = 22 ; B simplifié = 9×2 + 4 = 18 + 4 = 22 ✓. Tester une valeur est LE réflexe anti-erreur.</div></div></details>\n<h3>3. Tester une égalité</h3>\n<p>Pour vérifier qu'une égalité est vraie pour une valeur donnée, on calcule <b>chaque membre séparément</b> et on compare. Exemple : 3x + 2 = 17 est-elle vraie pour x = 5 ? Gauche : 3×5 + 2 = 17 ; droite : 17 : vraie ✓.</p>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — tester une formule</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La formule du périmètre d'un rectangle est-elle P = 2(L + l) ou P = L × l ? Tester avec L = 8 et l = 3, sachant que le périmètre vaut 22.</div><div class=\"etu\"><b>Étape 1</b> — <b>Tester P = 2(L + l)</b> : 2 × (8 + 3) = 2 × 11 = 22 ✓.</div><div class=\"etu\"><b>Étape 2</b> — <b>Tester P = L × l</b> : 8 × 3 = 24 ≠ 22 ✗ (et surtout, L × l est l'AIRE !).</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : la bonne formule est P = 2(L + l). Remarque : 24 est l'aire en cm², 22 le périmètre en cm : unités différentes, formules différentes.</div></div></details>\n<h3>4. Périmètres et aires en lettres</h3>\n<div class=\"tip\"><b>Formules littérales :</b> carré : P = 4c, A = c² ; rectangle : P = 2(L + l), A = L × l ; triangle : A = (b × h)/2 ; disque : P = 2πr, A = πr².</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> x + x = 2x (pas x² !) ; x × x = x² (pas 2x !) ; 3 + x ne se simplifie pas ; toujours tester une valeur numérique pour vérifier une simplification ; dans 4 × x × 2, l'ordre ne compte pas (16 → 8x).</div>"},
{"id": "triangles", "theme": "Triangles (5e)", "niveau": "5e", "titre": "Triangles : somme des angles, inégalité triangulaire", "cours": "<div class=\"cours-head\"><h2>Triangles : somme des angles, inégalité triangulaire</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Somme des angles d'un triangle</h3>\n<div class=\"tip\"><b>Propriété fondamentale :</b> la somme des angles de n'importe quel triangle vaut <b>180°</b>. Donc si deux angles sont connus : troisième = 180 − (somme des deux).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — trouver le troisième angle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans un triangle ABC, l'angle A mesure 47° et l'angle B mesure 68°. Que vaut l'angle C ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Écrire la propriété</b> : A + B + C = 180°.</div><div class=\"etu\"><b>Étape 2</b> — <b>Substituer</b> : 47 + 68 + C = 180, donc C = 180 − 115 = <b>65°</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôler</b> : 47 + 68 + 65 = 180 ✓. Si on avait trouvé 95°, la somme 47 + 68 + 95 = 210 dépasserait 180° : signal d'alerte immédiat.</div></div></details>\n<h3>2. Cas particuliers</h3>\n<div class=\"tip\"><b>Triangle rectangle :</b> les deux angles aigus sont <b>complémentaires</b> : leur somme vaut 90° (car le troisième vaut déjà 90°).<br><b>Triangle isocèle :</b> deux côtés égaux ⟹ deux angles égaux (à la base).<br><b>Triangle équilatéral :</b> trois côtés égaux ⟹ trois angles de 180 ÷ 3 = <b>60°</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — triangle isocèle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un triangle isocèle possède un angle au sommet de 40°. Quels sont ses angles à la base ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Identifer la propriété</b> : isocèle ⟹ les deux angles à la base (pas celui au sommet) sont égaux.</div><div class=\"etu\"><b>Étape 2</b> — <b>Calculer ce qui reste</b> : 180 − 40 = 140° pour les DEUX angles de base.</div><div class=\"etu\"><b>Étape 3</b> — <b>Partager</b> : 140 ÷ 2 = <b>70° chacun</b>. Contrôle : 40 + 70 + 70 = 180 ✓.</div></div></details>\n<h3>3. Inégalité triangulaire</h3>\n<div class=\"tip\"><b>Propriété :</b> un triangle existe si et seulement si la somme des DEUX plus petits côtés est <b>plus grande</b> que le plus grand côté. Autrement dit : chaque côté est inférieur à la somme des deux autres.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — le triangle existe-t-il ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Peut-on construire un triangle avec 3 cm, 4 cm et 8 cm ? Et avec 3 cm, 4 cm et 6 cm ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Cas 3-4-8</b> : plus grand côté : 8 ; somme des deux autres : 3 + 4 = 7 &lt; 8 : le triangle N'EXISTE PAS (les deux petits côtés ne « referment » pas le trajet).</div><div class=\"etu\"><b>Étape 2</b> — <b>Cas 3-4-6</b> : 3 + 4 = 7 &gt; 6 : le triangle EXISTE.</div><div class=\"etu\"><b>Étape 3</b> — <b>Image mentale</b> : un chemin « détourné » (3 + 4) est toujours PLUS LONG que la ligne droite (le grand côté) — c'est le principe même de l'inégalité triangulaire. Cas limite : 3 + 4 = 7 et grand côté 7 : les points sont alignés, ce n'est plus un triangle.</div></div></details>\n<h3>4. Droites remarquables (aperçu)</h3>\n<div class=\"tip\"><b>Médiatrice d'un côté :</b> droite perpendiculaire à ce côté en son milieu ; les points de la médiatrice sont à égale distance des extrémités du côté.<br><b>Hauteur :</b> droite passant par un sommet, perpendiculaire au côté opposé. Les trois hauteurs se coupent en un point.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> la somme 180° vaut pour TOUS les triangles (même très « aplatis ») ; dans un triangle rectangle, ne pas compter l'angle droit dans les 90° restants deux fois ; l'inégalité triangulaire compare au PLUS GRAND côté uniquement.</div>"},
{"id": "parallelogrammes", "theme": "Parallélogrammes (5e)", "niveau": "5e", "titre": "Parallélogrammes et quadrilatères", "cours": "<div class=\"cours-head\"><h2>Parallélogrammes et quadrilatères</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Définition et propriétés</h3>\n<p>Un <b>parallélogramme</b> est un quadrilatère dont les côtés opposés sont <b>parallèles</b>. Cette seule définition entraîne des propriétés :</p>\n<div class=\"tip\"><b>Propriétés :</b> ① côtés opposés de même LONGUEUR ; ② angles opposés de même MESURE ; ③ diagonales qui se coupent en leur MILIEU ; ④ le point d'intersection des diagonales est le centre de symétrie.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — utiliser les propriétés</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ABCD est un parallélogramme avec AB = 5 cm, BC = 3 cm, l'angle A = 110°. Sans dessin, donner CD, AD et l'angle C.</div><div class=\"etu\"><b>Étape 1</b> — <b>Côtés opposés</b> : CD est opposé à AB : CD = <b>5 cm</b> ; AD est opposé à BC : AD = <b>3 cm</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Angles opposés</b> : C est opposé à A : angle C = <b>110°</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Compléter</b> : angles consécutifs supplémentaires : B = D = 180 − 110 = <b>70°</b>. Contrôle : 110 + 70 + 110 + 70 = 360° ✓ (somme des angles d'un quadrilatère).</div></div></details>\n<h3>2. Reconnaître un parallélogramme</h3>\n<div class=\"tip\"><b>Conditions suffisantes (une seule suffit) :</b> ① deux côtés opposés parallèles ET de même longueur ; ② diagonales de même milieu ; ③ angles opposés égaux ; ④ côtés opposés parallèles deux à deux.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — démontrer avec les diagonales</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ABCD : [AC] et [BD] se coupent en I, avec IA = 4 cm et IC = 4 cm, IB = 2,5 cm et ID = 2,5 cm. ABCD est-il un parallélogramme ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Critère des diagonales</b> : si les diagonales se coupent en leur MILIEU, c'est un parallélogramme.</div><div class=\"etu\"><b>Étape 2</b> — <b>Vérifier</b> : I est le milieu de [AC] (IA = IC) ET de [BD] (IB = ID) ✓.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : ABCD est un parallélogramme. Ce critère est le plus utilisé en exercices car il ne demande QUE deux longueurs vérifiées.</div></div></details>\n<h3>3. La famille des quadrilatères</h3>\n<div class=\"tip\"><b>Hiérarchie :</b> parallélogramme → rectangle (4 angles droits) → carré (rectangle + losange) ; parallélogramme → losange (4 côtés égaux) → carré.<br><b>Rectangle :</b> diagonales de même LONGUEUR. <b>Losange :</b> diagonales PERPENDICULAIRES. <b>Carré :</b> les deux à la fois.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — identifier la bonne famille</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un quadrilatère a 4 côtés de 5 cm et des diagonales perpendiculaires. Est-il rectangle ?</div><div class=\"etu\"><b>Étape 1</b> — <b>4 côtés égaux + diagonales perpendiculaires</b> : c'est un <b>LOSANGE</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Tester « rectangle »</b> : un rectangle exigerait 4 angles droits (donc des diagonales de même longueur) : rien ne le dit ici.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclusion</b> : ce n'est pas un rectangle (sauf cas spécial : le carré, losange ET rectangle à la fois, mais il faudrait une info d'angle en plus).</div></div></details>\n<h3>4. Aire du parallélogramme</h3>\n<div class=\"tip\"><b>Formule :</b> A = base × hauteur (la hauteur est perpendiculaire à la base choisie, pas un côté incliné !).</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le losange est un parallélogramme (le cerf-volant n'en est pas un) ; le rectangle n'est pas un losange (sauf le carré) ; la hauteur d'un parallélogramme n'est PAS son côté incliné ; ne pas confondre « côtés opposés égaux » (parallélogramme) et « 4 côtés égaux » (losange).</div>"},
{"id": "stats-5e", "theme": "Statistiques (5e)", "niveau": "5e", "titre": "Statistiques : organisation et lecture de données", "cours": "<div class=\"cours-head\"><h2>Statistiques : organisation et lecture de données</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Vocabulaire</h3>\n<div class=\"tip\"><b>Série statistique :</b> liste de données (les valeurs) collectées auprès d'une population d'<b>individus</b>, sur un <b>caractère</b> étudié (taille, note, sport préféré…).<br><b>Effectif d'une valeur :</b> combien de fois elle apparaît. <b>Effectif total :</b> somme de tous les effectifs.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire un tableau d'effectifs</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Notes d'un contrôle (sur 5) : 12 élèves ont eu 3 ; 8 élèves ont eu 4 ; 5 élèves ont eu 5. Quel est l'effectif total ? Combien d'élèves ont eu au moins 4 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Effectif total</b> : 12 + 8 + 5 = <b>25 élèves</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>« au moins 4 »</b> : valeurs 4 ET 5 : 8 + 5 = <b>13 élèves</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Vérifier</b> : 12 élèves ont eu 3, et 12 + 13 = 25 ✓ : la phrase « au moins » inclut TOUJOURS la valeur frontière.</div></div></details>\n<h3>2. Fréquences</h3>\n<div class=\"tip\"><b>Fréquence d'une valeur :</b> effectif de la valeur ÷ effectif total. Elle s'exprime en fraction, décimal (ex. 0,48) ou pourcentage (48 %). Contrôle : la somme des fréquences vaut 1 (100 %).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer une fréquence</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur 25 élèves, 12 ont eu la note 3. Quelle est la fréquence (en %) de la note 3 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Poser le quotient</b> : 12 ÷ 25 = 0,48.</div><div class=\"etu\"><b>Étape 2</b> — <b>Convertir</b> : 0,48 × 100 = <b>48 %</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôler la série</b> : 8/25 = 32 % et 5/25 = 20 % ; 48 + 32 + 20 = 100 % ✓. Si la somme dépassait 100 %, une effectif serait faux.</div></div></details>\n<h3>3. Représentations graphiques</h3>\n<div class=\"tip\"><b>Diagramme en bâtons :</b> une valeur = un bâton de hauteur l'effectif (valeurs isolées, comme des notes).<br><b>Histogramme / diagramme en barres :</b> classes d'intervalles.<br><b>Diagramme circulaire :</b> angle = fréquence × 360° : la part de chaque valeur est proportionnelle à son effectif.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer un angle d'un diagramme circulaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur 40 élèves, 10 préfèrent le foot. Quel angle occupe le secteur « foot » dans le diagramme circulaire ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Fréquence</b> : 10 ÷ 40 = 0,25 (soit 25 %).</div><div class=\"etu\"><b>Étape 2</b> — <b>Angle</b> : 0,25 × 360 = <b>90°</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Retenir</b> : c'est un tableau de proportionnalité : angle = effectif × 360 ÷ effectif total. Contrôle : 10/40 des élèves = un quart = un quart de tour ✓.</div></div></details>\n<h3>4. Moyenne (première approche)</h3>\n<div class=\"tip\"><b>Moyenne simple :</b> somme des valeurs ÷ nombre de valeurs. <b>Moyenne pondérée :</b> somme des (valeur × effectif) ÷ effectif total.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — moyenne pondérée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Notes : 12 élèves à 3, 8 élèves à 4, 5 élèves à 5. Calculer la moyenne.</div><div class=\"etu\"><b>Étape 1</b> — <b>Somme pondérée</b> : 3×12 + 4×8 + 5×5 = 36 + 32 + 25 = 93.</div><div class=\"etu\"><b>Étape 2</b> — <b>Diviser par l'effectif total</b> : 93 ÷ 25 = <b>3,72</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Raisonner en ordre de grandeur</b> : la moyenne doit être ENTRE 3 et 5, plus proche de 3 (majorité de 3) ✓ : 3,72 est cohérent ; 3,75 serait déjà suspect.</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> « au moins x » inclut x ; « plus de x » l'exclut ; la moyenne n'est pas forcément une valeur de la série ; additionner des fréquences doit donner 1 (100 %) ; en circulaire, raisonner en ANGLES (× 360), pas en pourcentages.</div>"},
{"id": "ensembles-2de", "theme": "Ensembles de nombres (2de)", "niveau": "2de", "titre": "Ensembles de nombres (N, Z, Q, R) et calcul littéral", "cours": "<div class=\"cours-head\"><h2>Ensembles de nombres et calcul littéral</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Les ensembles de nombres</h3>\n<div class=\"tip\"><b>Emboîtement :</b> ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ.<br>• <b>ℕ</b> : entiers naturels (0 ; 1 ; 2…)<br>• <b>ℤ</b> : entiers relatifs (… −2 ; −1 ; 0 ; 1 ; 2…)<br>• <b>ℚ</b> : rationnels (quotients d'entiers : 3/4 ; −7/2 ; 0,125)<br>• <b>ℝ</b> : réels (tout nombre d'une droite graduée, y compris √2 et π qui sont <b>irrationnels</b>)</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — classer des nombres</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Classer dans le plus petit ensemble possible : −3 ; 5/2 ; 0,7 ; √16 ; √5 ; π.</div><div class=\"etu\"><b>Étape 1</b> — <b>−3</b> : entier négatif ⟹ ℤ (pas ℕ).</div><div class=\"etu\"><b>Étape 2</b> — <b>5/2 et 0,7</b> : 0,7 = 7/10, donc les deux sont des quotients d'entiers ⟹ ℚ.</div><div class=\"etu\"><b>Étape 3</b> — <b>√16 = 4</b> : c'est un entier ! (√5, lui, ne se simplifie pas : irrationnel ⟹ ℝ).</div><div class=\"etu\"><b>Étape 4</b> — <b>π</b> : irrationnel célèbre ⟹ ℝ. Conclusion : −3 ∈ ℤ ; 5/2, 0,7 ∈ ℚ ; √16 ∈ ℕ ; √5, π ∈ ℝ∖ℚ.</div></div></details>\n<h3>2. Intervalles</h3>\n<div class=\"tip\"><b>Notations :</b> [a ; b] = {x ∈ ℝ ; a ≤ x ≤ b} (bornes comprises) ; ]a ; b[ = {x ; a &lt; x &lt; b} (bornes exclues) ; [a ; +∞[ ; ]−∞ ; b].<br><b>Règle :</b> ±∞ est toujours exclu (crochet ouvert) ; une inéquation stricte (&lt; ou &gt;) donne un crochet ouvert.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — traduire une inéquation en intervalle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Traduire par un intervalle : ① −2 ≤ x &lt; 5 ; ② x &gt; 3 ; ③ x ≤ 7.</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : −2 compris (≤), 5 exclu (&lt;) : x ∈ [−2 ; 5[.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : x &gt; 3 strictement : x ∈ ]3 ; +∞[.</div><div class=\"etu\"><b>Étape 3</b> — <b>③</b> : x ≤ 7 : x ∈ ]−∞ ; 7]. Contrôle : dans chaque cas, tester une valeur (ex. x = 3 pour ① : −2 ≤ 3 &lt; 5 ✓ ; x = 5 pour ① : 5 &lt; 5 faux, donc 5 bien exclu ✓).</div></div></details>\n<h3>3. Calcul littéral : développer, factoriser</h3>\n<div class=\"tip\"><b>Identités remarquables :</b> ① (a + b)² = a² + 2ab + b² ; ② (a − b)² = a² − 2ab + b² ; ③ (a + b)(a − b) = a² − b².</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — utiliser les identités remarquables</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ① Développer (x + 5)². ② Factoriser x² − 9. ③ Calculer mentalement 101².</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : (x + 5)² = x² + 2×x×5 + 25 = <b>x² + 10x + 25</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : x² − 9 = x² − 3² = <b>(x + 3)(x − 3)</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>③</b> : 101² = (100 + 1)² = 10000 + 200 + 1 = <b>10 201</b>. La même identité ① sert à développer et à calculer vite.</div></div></details>\n<h3>4. Racine carrée : règles de calcul</h3>\n<div class=\"tip\"><b>Règles :</b> √(a×b) = √a × √b et √(a/b) = √a/√b (a, b ≥ 0) ; √(a²) = |a|.<br><b>⚠️ MAIS :</b> √(a + b) ≠ √a + √b ! (√9 + √16 = 3 + 4 = 7 alors que √25 = 5.)</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> un nombre décimal est rationnel (donc ∈ ℚ) ; √16 ∈ ℕ mais √5 ∉ ℚ ; l'infini prend toujours un crochet ouvert ; (a + b)² ≠ a² + b² ; √x n'existe (dans ℝ) que si x ≥ 0 ; −5 ∈ ℤ mais −5 ∉ ℕ.</div>"},
{"id": "fonctions-reference", "theme": "Fonctions de référence (2de)", "niveau": "2de", "titre": "Fonctions de référence : carré, cube, inverse, racine", "cours": "<div class=\"cours-head\"><h2>Fonctions de référence</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. La fonction carré : f(x) = x²</h3>\n<div class=\"tip\"><b>Courbe :</b> parabole. <b>Domaine :</b> ℝ. <b>Variations :</b> décroissante sur ]−∞ ; 0], croissante sur [0 ; +∞[ ; minimum 0 en 0.<br><b>Symétrie :</b> f(−x) = f(x) : courbe symétrique par rapport à l'axe des ordonnées. <b>Signe :</b> f(x) ≥ 0 pour tout x.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — résoudre x² = 16 puis x² &lt; 9</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre dans ℝ : ① x² = 16 ; ② x² &lt; 9.</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : deux nombres ont un carré égal à 16 : x = <b>4</b> ou x = <b>−4</b>. (16 = 4², et (−4)² = 16 aussi.)</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : x² &lt; 9 ⟺ −3 &lt; x &lt; 3 : S = <b>]−3 ; 3[</b>. Sur la parabole, les points d'ordonnée inférieure à 9 sont entre les abscisses −3 et 3.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôler</b> : x = 0 : 0 &lt; 9 ✓ (0 est bien dans ]−3 ; 3[) ; x = 4 : 16 &gt; 9 ✗. Piège type : ne pas oublier −4 à la question ①.</div></div></details>\n<h3>2. La fonction inverse : f(x) = 1/x</h3>\n<div class=\"tip\"><b>Domaine :</b> ℝ∖{0} = ]−∞ ; 0[ ∪ ]0 ; +∞[. <b>Courbe :</b> hyperbole, deux branches. <b>Variations :</b> décroissante sur chaque branche (attention : PAS sur tout ℝ∖{0} !). <b>Signe :</b> celui de x.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comparer 1/3 et 1/5, puis résoudre 1/x ≥ 2</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ① Comparer 1/3 et 1/5. ② Résoudre 1/x ≥ 2 (x > 0).</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : 3 &lt; 5 et les deux sont positifs ⟹ 1/3 &gt; <b>1/5</b>. L'inverse « renverse l'ordre » pour les positifs.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : sur x &gt; 0, multiplier par x : 1 ≥ 2x, donc x ≤ 1/2 : S = <b>]0 ; 1/2]</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôler</b> : x = 0,25 : 1/0,25 = 4 ≥ 2 ✓ ; x = 1 : 1 ≥ 2 ✗. La borne 0 reste exclue (division interdite).</div></div></details>\n<h3>3. La fonction racine carrée : f(x) = √x</h3>\n<div class=\"tip\"><b>Domaine :</b> [0 ; +∞[ (on ne prend la racine que d'un nombre POSITIF ou nul). <b>Variations :</b> croissante sur [0 ; +∞[. <b>Courbe :</b> demi-parabole « couchée ». <b>Signe :</b> f(x) ≥ 0.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comparer √2 et √10, et l'ordre sur les racines</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Comparer √2 et √10 ; puis comparer √0,5 et 0,5.</div><div class=\"etu\"><b>Étape 1</b> — <b>√x est croissante</b> : 2 &lt; 10 ⟹ √2 &lt; <b>√10</b> (l'ordre est conservé).</div><div class=\"etu\"><b>Étape 2</b> — <b>√0,5 ≈ 0,707</b> &gt; 0,5 : entre 0 et 1, la racine « relève » le nombre (√x ≥ x sur [0 ; 1]).</div><div class=\"etu\"><b>Étape 3</b> — <b>Retenir</b> : sur [0 ; 1] : √x ≥ x ; sur [1 ; +∞[ : √x ≤ x. Contrôle : √0,25 = 0,5 ≥ 0,25 ✓ ; √4 = 2 ≤ 4 ✓.</div></div></details>\n<h3>4. La fonction cube : f(x) = x³</h3>\n<div class=\"tip\"><b>Domaine :</b> ℝ. <b>Variations :</b> croissante sur ℝ ENTIER (contrairement au carré !). <b>Signe :</b> celui de x. <b>Symétrie :</b> courbe symétrique par rapport à l'ORIGINE (f(−x) = −f(x)).</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> x² = 16 a DEUX solutions ; l'inverse décroît sur chaque branche mais pas « globalement » (√ : −1 &lt; 1 mais 1/(−1) = −1 &lt; 1 = 1/1) ; √x n'existe que pour x ≥ 0 ; x³ garde le signe de x et x² jamais négatif.</div>"},
{"id": "variations-2de", "theme": "Variations de fonctions (2de)", "niveau": "2de", "titre": "Fonctions : variations, extremums, lectures graphiques", "cours": "<div class=\"cours-head\"><h2>Variations, extremums, lectures graphiques</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Vocabulaire : image, antécédent</h3>\n<div class=\"tip\"><b>Image :</b> f(a) est l'image de a (UNIQUE : une flèche part de a vers une seule valeur). <b>Antécédent :</b> b est un antécédent de b si f(x) = b — il peut y en avoir PLUSIEURS (ou aucun).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — images et antécédents de f(x) = x²</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Avec f(x) = x² : ① image de −3 ? ② antécédents de 25 ? ③ antécédents de −1 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : f(−3) = (−3)² = <b>9</b>. Une seule image.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : x² = 25 ⟹ x = 5 ou x = −5 : <b>deux antécédents</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>③</b> : x² = −1 est impossible (un carré ≥ 0) : <b>aucun antécédent</b>. Les trois cas — unique, plusieurs, aucun — se rencontrent tous.</div></div></details>\n<h3>2. Tableau de variations</h3>\n<div class=\"tip\"><b>Lecture :</b> une flèche ↗ montante = fonction croissante ; ↘ descendante = décroissante. Les valeurs aux extrémités des flèches donnent les bornes atteintes.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — lire un tableau de variations</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Tableau : f décroît de x = −2 (valeur 5) à x = 1 (valeur −1), puis croît de x = 1 à x = 4 (valeur 3). Quel est le minimum de f ? Le maximum sur [−2 ; 4] ? f(−2) comparé à f(4) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Minimum</b> : le point bas de la « vallée » : <b>−1</b>, atteint en x = 1.</div><div class=\"etu\"><b>Étape 2</b> — <b>Maximum sur [−2 ; 4]</b> : comparer les sommets des flèches : 5 (en −2) et 3 (en 4) ⟹ maximum <b>5</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>f(−2) vs f(4)</b> : 5 &gt; 3, donc f(−2) &gt; f(4). Le tableau donne TOUTE l'histoire de la fonction sans calcul.</div></div></details>\n<h3>3. Résolutions graphiques d'équations et inéquations</h3>\n<div class=\"tip\"><b>Équation f(x) = k :</b> lire les abscisses des points de la courbe à la HAUTEUR k (droite horizontale y = k). <b>Inéquation f(x) &lt; k :</b> lire la portion de courbe SOUS la droite.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — résoudre graphiquement f(x) = 2 et f(x) ≥ 2</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La parabole de f(x) = x² − 2 est tracée. Résoudre graphiquement : ① f(x) = 2 ; ② f(x) ≥ 2 ; ③ f(x) = 3 d'après la courbe ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : tracer y = 2 : la courbe coupe la droite en x = −2 et x = 2 : S = <b>{−2 ; 2}</b> (contrôle : (−2)² − 2 = 2 ✓).</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : la courbe est AU-DESSUS de la droite y = 2 pour x ≤ −2 ou x ≥ 2 : S = <b>]−∞ ; −2] ∪ [2 ; +∞[</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>③</b> : y = 3 coupe la parabole en x = −√5 et x = √5 (≈ ±2,24) — les solutions peuvent être irrationnelles : la lecture graphique donne des VALEURS APPROCHÉES, le calcul donne les exactes.</div></div></details>\n<h3>4. Extremum</h3>\n<div class=\"tip\"><b>Maximum</b> de f sur un intervalle : plus grande valeur atteinte (point haut de la courbe) ; <b>minimum</b> : plus petite. « f atteint son minimum m en a » signifie : f(a) = m et f(x) ≥ m pour tout x.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> l'image est unique mais pas l'antécédent ; résoudre f(x) &lt; 0 ⟹ portions de courbe SOUS l'axe des abscisses ; une lecture graphique est approchée (dire « ≈ ») ; croissante sur [a ; b] s'écrit avec des crochets dans le tableau mais l'ordre des extrémités compte (toujours de gauche à droite).</div>"},
{"id": "vecteurs", "theme": "Vecteurs et repérage (2de)", "niveau": "2de", "titre": "Vecteurs et géométrie repérée", "cours": "<div class=\"cours-head\"><h2>Vecteurs et géométrie repérée</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Vecteur : direction, sens, norme</h3>\n<div class=\"tip\"><b>Vecteur AB→</b> : défini par sa <b>direction</b> (la droite qui le porte), son <b>sens</b> (de A vers B) et sa <b>norme</b> ‖AB→‖ (la longueur AB). Deux vecteurs sont <b>égaux</b> s'ils ont les trois identiques.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — coordonnées d'un vecteur</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> A(−1 ; 2) et B(3 ; 5). ① Coordonnées de AB→ ? ② Norme de AB→ ? ③ Le point C(4 ; 9) est-il sur la droite (AB) avec AB→ = AM→ pour M ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : AB→ = (x_B − x_A ; y_B − y_A) = (3 − (−1) ; 5 − 2) = <b>(4 ; 3)</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : ‖AB→‖ = √(4² + 3²) = √25 = <b>5</b> (distance AB).</div><div class=\"etu\"><b>Étape 3</b> — <b>③</b> : chercher M tel que AM→ = AB→ : M = B… ou un point vérifiant AM→ = (4 ; 3). Le vecteur ne dépend que du déplacement, pas du point de départ : c'est « une flèche libre ».</div></div></details>\n<h3>2. Opérations sur les vecteurs</h3>\n<div class=\"tip\"><b>Somme :</b> u→ + v→ : on met bout à bout (relation de Chasles : AB→ + BC→ = AC→). <b>Opposé :</b> −u→ a même direction, même norme, sens CONTRAIRE. <b>Colinéarité :</b> u→(x ; y) et v→(x′ ; y′) colinéaires ⟺ xy′ − x′y = 0.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — somme et colinéarité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> u→ = (2 ; 3) et v→ = (−1 ; 4). ① Calculer u→ + v→ et 2u→. ② u→(2 ; 3) et w→(4 ; 6) sont-ils colinéaires ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : u→ + v→ = (2 + (−1) ; 3 + 4) = <b>(1 ; 7)</b> ; 2u→ = (4 ; 6).</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : xy′ − x′y = 2×6 − 4×3 = 12 − 12 = 0 : <b>colinéaires</b> (w→ = 2u→).</div><div class=\"etu\"><b>Étape 3</b> — <b>Interpréter</b> : des vecteurs colinéaires ont la même DIRECTION (ils sont parallèles). Deux points A, B, C sont alignés ⟺ AB→ et AC→ sont colinéaires : c'est LE test d'alignement en repère.</div></div></details>\n<h3>3. Coordonnées du milieu et distances</h3>\n<div class=\"tip\"><b>Milieu de [AB] :</b> M((x_A + x_B)/2 ; (y_A + y_B)/2). <b>Distance :</b> AB = √((x_B − x_A)² + (y_B − y_A)²) (Pythagore en repère orthonormé).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — nature d'un quadrilatère</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> A(1 ; 1), B(4 ; 2), C(5 ; 5), D(2 ; 4). Montrer que ABCD est un parallélogramme, puis calculer son périmètre.</div><div class=\"etu\"><b>Étape 1</b> — <b>Vecteurs opposés</b> : AB→ = (3 ; 1) et DC→ = (5−2 ; 5−4) = (3 ; 1). AB→ = DC→ ⟹ <b>ABCD parallélogramme</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Longueurs</b> : AB = √(9+1) = √10 ; BC→ = (1 ; 3), BC = √(1+9) = √10.</div><div class=\"etu\"><b>Étape 3</b> — <b>Périmètre</b> : 2×(AB + BC) = 2×(√10 + √10) = <b>4√10 ≈ 12,6</b>. Bonus : AB = BC ⟹ le parallélogramme a deux côtés consécutifs égaux : c'est un LOSANGE.</div></div></details>\n<h3>4. Repérage : image et antécédents d'une fonction dans un repère</h3>\n<div class=\"tip\">Un point M(x ; y) est sur la courbe de f ⟺ <b>y = f(x)</b> : l'abscisse x, l'ordonnée son image. Lire un point de la courbe = vérifier cette égalité.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> AB→ = (arrivée − départ), ordre des termes inversé dans BA→ = −AB→ ; la formule de distance exige un repère ORTHONORMÉ ; milieu ≠ moyenne des vecteurs ; colinéarité xy′ − x′y = 0 (pas = 1).</div>"},
{"id": "stats-2de", "theme": "Statistiques descriptives (2de)", "niveau": "2de", "titre": "Statistiques descriptives : quartiles, écart type", "cours": "<div class=\"cours-head\"><h2>Statistiques descriptives : quartiles, écart type</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Rappels : moyenne, médiane, étendue</h3>\n<div class=\"tip\"><b>Moyenne :</b> x̄ = (Σ x_i·n_i)/N (pondérée par les effectifs). <b>Médiane :</b> valeur qui partage la série ORDONNÉE en deux moitiés d'effectifs égaux (au moins 50 % en dessous, 50 % au-dessus). <b>Étendue :</b> max − min.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — moyenne, médiane, étendue</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Série ordonnée : 3 ; 5 ; 7 ; 8 ; 12. ① Médiane ? ② Étendue ? ③ Et pour 3 ; 5 ; 7 ; 8 (effectif pair) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : 5 valeurs, la médiane est la 3e : <b>7</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : 12 − 3 = <b>9</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>③</b> : 4 valeurs : la médiane est la MOYENNE des 2e et 3e : (5 + 7)/2 = <b>6</b>. Remarque : la médiane ne se calcule PAS avec les valeurs extrêmes, elle résiste aux valeurs aberrantes (l'inverse de la moyenne).</div></div></details>\n<h3>2. Quartiles</h3>\n<div class=\"tip\"><b>Q1 :</b> plus petite valeur telle qu'au moins 25 % des données soient ≤ Q1. <b>Q3 :</b> au moins 75 % ≤ Q3. <b>Écart interquartile :</b> Q3 − Q1 (la « boîte » centrale contenant 50 % des données).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer Q1 et Q3</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Série ordonnée de 20 notes (extraites) : position de Q1 et Q3 ? Sur 3 ; 4 ; 5 ; 5 ; 6 ; 6 ; 7 ; 7 ; 8 ; 9 (10 valeurs), donner Q1 et Q3.</div><div class=\"etu\"><b>Étape 1</b> — <b>Méthode des positions</b> : N = 10 ; Q1 est au rang ⌈N/4⌉ = 3e valeur ; Q3 au rang ⌈3N/4⌉ = 8e valeur.</div><div class=\"etu\"><b>Étape 2</b> — <b>Lire</b> : 3e valeur = <b>5</b> (Q1) ; 8e valeur = <b>7</b> (Q3). Au moins 25 % des notes sont ≤ 5 et au moins 75 % ≤ 7 ✓.</div><div class=\"etu\"><b>Étape 3</b> — <b>Écart interquartile</b> : Q3 − Q1 = 7 − 5 = <b>2</b> : la moitié centrale des notes tient dans un intervalle de largeur 2 : série assez homogène.</div></div></details>\n<h3>3. Dispersion : écart type</h3>\n<div class=\"tip\"><b>Variance :</b> V = moyenne des (x_i − x̄)². <b>Écart type :</b> σ = √V : il mesure l'écart moyen des valeurs à la moyenne (même unité que les données).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — comparer deux séries par l'écart type</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Classe A : notes 8 ; 9 ; 10 ; 11 ; 12. Classe B : 4 ; 7 ; 10 ; 13 ; 16. Même moyenne ? Quel écart type plus grand ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Moyennes</b> : les deux : (8+9+10+11+12)/5 = 50/5 = <b>10</b> et (4+7+10+13+16)/5 = 50/5 = <b>10</b>. Identiques !</div><div class=\"etu\"><b>Étape 2</b> — <b>Variance A</b> : écarts à la moyenne : ±2, ±1, 0 : V_A = (4+1+0+1+4)/5 = 2.</div><div class=\"etu\"><b>Étape 3</b> — <b>Variance B</b> : ±6, ±3, 0 : V_B = (36+9+0+9+36)/5 = 18. σ_A = √2 ≈ 1,4 &lt; σ_B = √18 ≈ 4,2. <b>Conclusion :</b> même moyenne, mais la classe B est BEAUCOUP plus dispersée : l'écart type départage ce que la moyenne masque.</div></div></details>\n<h3>4. Choisir l'indicateur</h3>\n<div class=\"tip\"><b>Moyenne :</b> sensible aux valeurs extrêmes. <b>Médiane :</b> robuste (une valeur aberrante ne la bouge pas). <b>Comparer deux séries :</b> regarder moyenne ET dispersion (σ ou écart interquartile).</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> toujours ORDONNER avant médiane/quartiles ; avec effectif pair, médiane = moyenne des deux valeurs centrales ; l'écart type est une RACINE (σ² = V) ; moyenne égales ne signifient pas séries identiques ; Q1 n'est PAS la plus petite valeur.</div>"},
{"id": "probas-2de", "theme": "Probabilités (2de)", "niveau": "2de", "titre": "Probabilités : événements, calculs de base", "cours": "<div class=\"cours-head\"><h2>Probabilités : événements, calculs de base</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Vocabulaire : expérience, univers, événement</h3>\n<div class=\"tip\"><b>Expérience aléatoire :</b> plusieurs issues possibles, imprévisibles. <b>Univers Ω :</b> ensemble de toutes les issues. <b>Événement :</b> partie de Ω (« obtenir un 6 » = {6}). <b>Équiprobabilité :</b> toutes les issues ont la même probabilité (dé équilibré, tirage au hasard).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — probabilité en situation équiprobable</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On lance un dé à 6 faces. ① P(obtenir 4) ? ② P(obtenir un nombre pair) ? ③ P(obtenir &gt; 6) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : une issue favorable sur 6 équiprobables : P = <b>1/6</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : issues {2 ; 4 ; 6} : 3/6 = <b>1/2</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>③</b> : aucune issue : P = <b>0</b> (événement impossible). La formule : P = (cas favorables)/(cas possibles) ne vaut qu'en ÉQUIPROBABILITÉ.</div></div></details>\n<h3>2. Probabilité d'un événement</h3>\n<div class=\"tip\"><b>En équiprobabilité :</b> P(A) = nombre de cas favorables / nombre de cas possibles. <b>Bornes :</b> 0 ≤ P(A) ≤ 1 ; P(Ω) = 1 ; P(∅) = 0.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — tirage de boules</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Urne : 5 rouges, 3 bleues, 2 vertes. On tire une boule. ① P(rouge) ? ② P(pas rouge) ? ③ P(rouge ou verte) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : 5 favorables sur 10 : P = <b>5/10 = 1/2</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : événement contraire : 1 − 1/2 = <b>1/2</b> (ou 5/10 directement : 3 + 2 = 5).</div><div class=\"etu\"><b>Étape 3</b> — <b>③</b> : rouge OU verte = 5 + 2 = 7 favorables : P = <b>7/10</b> (événements incompatibles : on ADDITIONNE).</div></div></details>\n<h3>3. Intersection, réunion, contraire</h3>\n<div class=\"tip\"><b>Contraire :</b> P(Ā) = 1 − P(A). <b>Réunion :</b> P(A ∪ B) = P(A) + P(B) − P(A ∩ B) (on RETRANCHE l'intersection comptée deux fois). <b>Incompatibles :</b> A ∩ B = ∅ ⟹ P(A ∪ B) = P(A) + P(B).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — formule des deux événements</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans une classe : 60 % font espagnol (E), 40 % font allemand (D), 25 % font les deux. Un élève au hasard : ① P(E ou D) ? ② P(ni E ni D) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : P(E ∪ D) = 0,6 + 0,4 − 0,25 = <b>0,75</b>. Sans retrancher l'intersection, on compterait deux fois les bilingues.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : contraire de (E ∪ D) : 1 − 0,75 = <b>0,25</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôler</b> : 0,75 + 0,25 = 1 ✓. La traduction « ou »/« et » : OU = réunion (∪), ET = intersection (∩) : le langage courant guide le symbole.</div></div></details>\n<h3>4. Arbres de probabilité (première approche)</h3>\n<div class=\"tip\">Pour deux expériences successives, on multiplie le long des branches : P(chemin) = produit des probabilités du chemin. La somme des probabilités des branches issues d'un nœud vaut 1.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> une probabilité est entre 0 et 1 (jamais 1,5) ; en cas d'équiprobabilité seulement on divise les comptes ; P(A ∪ B) = P(A) + P(B) uniquement si A et B sont INCOMPATIBLES ; « au moins un » se calcule presque toujours par le contraire : 1 − P(aucun).</div>"},
{"id": "configurations-trigo", "theme": "Configurations et trigonométrie (2de)", "niveau": "2de", "titre": "Configurations du plan et trigonométrie (sinus, cosinus)", "cours": "<div class=\"cours-head\"><h2>Configurations du plan et trigonométrie</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Sinus et cosinus d'un angle aigu</h3>\n<div class=\"tip\"><b>Dans un triangle rectangle</b>, pour un angle aigu θ :<br><b>cos(θ) = adjacent / hypoténuse</b> ; <b>sin(θ) = opposé / hypoténuse</b> ; <b>tan(θ) = opposé / adjacent</b> (SOH-CAH-TOA).<br>Le sinus et le cosinus d'un angle aigu sont des nombres <b>entre 0 et 1</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer une longueur par la trigonométrie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Triangle ABC rectangle en C, avec AB (hypoténuse) = 10 cm et l'angle B = 35°. Calculer AC.</div><div class=\"etu\"><b>Étape 1</b> — <b>Identifier les côtés par rapport à B</b> : AC est OPPOSÉ à B ; AB est l'hypoténuse.</div><div class=\"etu\"><b>Étape 2</b> — <b>Choisir la formule</b> : opposé/hypoténuse ⟹ sin(35°) = AC/10.</div><div class=\"etu\"><b>Étape 3</b> — <b>Calculer</b> : AC = 10 × sin(35°) ≈ 10 × 0,574 = <b>5,74 cm</b>. Contrôle : AC &lt; AB (10) ✓, l'hypoténuse reste la plus grande.</div></div></details>\n<h3>2. Angles remarquables</h3>\n<div class=\"tip\"><b>Valeurs à connaître :</b> sin(30°) = 1/2 ; cos(30°) = √3/2 ; sin(45°) = cos(45°) = √2/2 ; sin(60°) = √3/2 ; cos(60°) = 1/2.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — utiliser les valeurs remarquables</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Triangle rectangle avec un angle de 45° et hypoténuse 6. Calculer les deux côtés de l'angle droit.</div><div class=\"etu\"><b>Étape 1</b> — <b>45° ⟹ demi-carré</b> : le triangle est isocèle : les deux côtés de l'angle droit sont ÉGAUX (notés a).</div><div class=\"etu\"><b>Étape 2</b> — <b>Appliquer</b> : cos(45°) = a/6 ⟹ a = 6 × √2/2 = <b>3√2 ≈ 4,24</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôler avec Pythagore</b> : a² + a² = 6² ⟹ 2a² = 36 ⟹ a² = 18 ⟹ a = √18 = 3√2 ✓. Trigonométrie et Pythagore racontent la même histoire.</div></div></details>\n<h3>3. Cercle trigonométrique (aperçu)</h3>\n<div class=\"tip\">Le cosinus se lit sur l'axe <b>horizontal</b>, le sinus sur l'axe <b>vertical</b> du cercle de rayon 1. On a toujours <b>−1 ≤ cos ≤ 1</b> et <b>−1 ≤ sin ≤ 1</b>, et <b>cos²(θ) + sin²(θ) = 1</b> (Pythagore sur le cercle).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — retrouver un sinus par le cosinus</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> cos(θ) = 0,6 avec θ aigu. Calculer sin(θ) sans calculatrice.</div><div class=\"etu\"><b>Étape 1</b> — <b>Poser l'identité</b> : sin²(θ) = 1 − cos²(θ) = 1 − 0,36 = 0,64.</div><div class=\"etu\"><b>Étape 2</b> — <b>Prendre la racine</b> : sin(θ) = √0,64 = <b>0,8</b> (positif car θ est aigu).</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôler</b> : on retrouve le triplet (0,6 ; 0,8 ; 1) : le triangle 3-4-5 divisé par 5. L'identité cos² + sin² = 1 est LE Pythagore du cercle trigonométrique.</div></div></details>\n<h3>4. Configurations : rappels utiles</h3>\n<div class=\"tip\"><b>Angles :</b> correspondants égaux (droites parallèles) ; angles inscrits : moitié de l'angle au centre. <b>Triangle inscrit dans un demi-cercle :</b> rectangle (l'hypoténuse est le diamètre). <b>Droite des milieux :</b> parallèle au troisième côté, de longueur moitié.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> sinus et cosinus se confondent facilement : sin = opposé/hypoténuse (le cosinus prend le côté ADJACENT) ; sin(60°) ≠ 60 × qqch : la calculatrice doit être en DEGRÉS ; cos² + sin² = 1 : ne pas écrire cos + sin = 1 ; l'hypoténuse est TOUJOURS au dénominateur des deux rapports.</div>"},
{"id": "second-degre", "theme": "Second degré (1re)", "niveau": "1re", "titre": "Second degré : discriminant, forme canonique, factorisation", "cours": "<div class=\"cours-head\"><h2>Second degré : discriminant, forme canonique, factorisation</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Formes d'un trinôme</h3>\n<div class=\"tip\"><b>Forme développée :</b> f(x) = ax² + bx + c (a ≠ 0). <b>Forme canonique :</b> a(x − α)² + β avec α = −b/(2a) et β = f(α). <b>Forme factorisée :</b> a(x − x₁)(x − x₂) si Δ &gt; 0.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — mise sous forme canonique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Mettre f(x) = 2x² − 8x + 5 sous forme canonique et en déduire le minimum.</div><div class=\"etu\"><b>Étape 1</b> — <b>Factoriser par a</b> : f(x) = 2(x² − 4x) + 5.</div><div class=\"etu\"><b>Étape 2</b> — <b>Démarrer le carré</b> : x² − 4x = (x − 2)² − 4 (le « −4 » compense le double produit 2×2).</div><div class=\"etu\"><b>Étape 3</b> — <b>Assembler</b> : f(x) = 2((x − 2)² − 4) + 5 = <b>2(x − 2)² − 3</b>. Sommet S(2 ; −3) : a = 2 &gt; 0, parabole vers le haut ⟹ <b>minimum −3 atteint en 2</b>.</div></div></details>\n<h3>2. Discriminant et racines</h3>\n<div class=\"tip\"><b>Δ = b² − 4ac.</b> Δ &gt; 0 : deux racines x = (−b ± √Δ)/(2a) ; Δ = 0 : racine double −b/(2a) ; Δ &lt; 0 : <b>aucune racine réelle</b>.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — résoudre une équation du second degré</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre 2x² − 3x − 2 = 0, puis factoriser le trinôme.</div><div class=\"etu\"><b>Étape 1</b> — <b>Calculer Δ</b> : a = 2, b = −3, c = −2 : Δ = 9 − 4×2×(−2) = 9 + 16 = 25.</div><div class=\"etu\"><b>Étape 2</b> — <b>Racines</b> : √25 = 5 : x = (3 + 5)/4 = <b>2</b> et x = (3 − 5)/4 = <b>−1/2</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Factoriser</b> : 2(x − 2)(x + 1/2). Contrôle : en développant, on retrouve 2x² − 3x − 2 ✓ ; en remplaçant : 2×4 − 3×2 − 2 = 0 ✓.</div></div></details>\n<h3>3. Signe du trinôme</h3>\n<div class=\"tip\"><b>Règle (a &gt; 0) :</b> le trinôme est positif SAUF entre les racines ; (a &lt; 0) : négatif sauf entre les racines. Δ ≤ 0 : le trinôme est du signe de a sur ℝ (nul seulement si Δ = 0 en la racine double).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — résoudre une inéquation</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre 2x² − 3x − 2 &gt; 0 puis 2x² − 3x − 2 ≤ 0.</div><div class=\"etu\"><b>Étape 1</b> — <b>Racines</b> (déjà trouvées) : −1/2 et 2 ; a = 2 &gt; 0.</div><div class=\"etu\"><b>Étape 2</b> — <b>&gt; 0</b> : positif SAUF entre les racines : S = <b>]−∞ ; −1/2[ ∪ ]2 ; +∞[</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>≤ 0</b> : l'entre-racines FERMÉ (racines incluses car égalité permise) : S = <b>[−1/2 ; 2]</b>. Mnémotechnique : « positif dehors, négatif dedans » quand a &gt; 0.</div></div></details>\n<h3>4. Somme et produit des racines</h3>\n<div class=\"tip\">Si Δ ≥ 0 : <b>x₁ + x₂ = −b/a</b> et <b>x₁x₂ = c/a</b>. Vérification express de tout calcul de racines.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> Δ = b² − 4ac (pas b² + 4ac) ; les formules de racines exigent a ≠ 0 ; erreur de signe dans −b : « −(−3) = 3 » ; inéquation stricte ⟹ crochets ouverts aux racines ; Δ &lt; 0 ne veut pas dire « pas de solutions au problème » mais « pas de racine RÉELLE ».</div>"},
{"id": "derivation-operations", "theme": "Opérations sur dérivées (1re)", "niveau": "1re", "titre": "Dérivation : opérations et étude des variations", "cours": "<div class=\"cours-head\"><h2>Dérivation : opérations et étude des variations</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Rappel : dérivées usuelles</h3>\n<div class=\"tip\">xⁿ ⟹ n·xⁿ⁻¹ ; k (constante) ⟹ 0 ; 1/x ⟹ −1/x² ; √x ⟹ 1/(2√x) ; u + v ⟹ u′ + v′ ; k·u ⟹ k·u′.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — dérivée d'un polynôme</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dériver f(x) = 3x⁴ − 2x³ + 5x − 7.</div><div class=\"etu\"><b>Étape 1</b> — <b>Terme à terme</b> : (3x⁴)′ = 12x³ ; (−2x³)′ = −6x² ; (5x)′ = 5 ; (−7)′ = 0.</div><div class=\"etu\"><b>Étape 2</b> — <b>Assembler</b> : f′(x) = <b>12x³ − 6x² + 5</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôler</b> : chaque exposant a baissé de 1 et chaque coefficient a été multiplié par l'exposant initial : la constante a disparu. Le degré de f′ est deg(f) − 1.</div></div></details>\n<h3>2. Produit et quotient</h3>\n<div class=\"tip\"><b>Produit :</b> (u·v)′ = <b>u′v + uv′</b> — jamais u′v′ ! <b>Quotient :</b> (u/v)′ = <b>(u′v − uv′)/v²</b> (v ≠ 0) — l'ORDRE du numérateur compte ; cas spécial : (1/v)′ = −v′/v².</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — dériver un produit puis un quotient</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ① Dériver g(x) = (x² + 1)(3x − 2). ② Dériver h(x) = x/(x² + 1).</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : u = x² + 1 (u′ = 2x), v = 3x − 2 (v′ = 3). g′(x) = 2x(3x − 2) + (x² + 1)×3 = 6x² − 4x + 3x² + 3 = <b>9x² − 4x + 3</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : u = x (u′ = 1), v = x² + 1 (v′ = 2x). h′(x) = (1×(x²+1) − x×2x)/(x²+1)² = <b>(1 − x²)/(x² + 1)²</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôler ①</b> en développant d'abord : g(x) = 3x³ − 2x² + 3x − 2, g′(x) = 9x² − 4x + 3 ✓ : les deux méthodes concordent — précieux réflexe d'audit.</div></div></details>\n<h3>3. Signe de f′ et variations de f</h3>\n<div class=\"tip\"><b>Théorème :</b> f′ &gt; 0 sur I ⟹ f croissante sur I ; f′ &lt; 0 ⟹ f décroissante. f′ s'annule et CHANGE de signe en a ⟹ extremum local en a (max si + → −, min si − → +).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — étude complète de variations</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Étudier les variations de f(x) = x³ − 3x sur ℝ.</div><div class=\"etu\"><b>Étape 1</b> — <b>Dériver et factoriser</b> : f′(x) = 3x² − 3 = 3(x − 1)(x + 1).</div><div class=\"etu\"><b>Étape 2</b> — <b>Signe de f′</b> : tableau de signes du produit : f′ &gt; 0 sur ]−∞ ; −1[, f′ &lt; 0 sur ]−1 ; 1[, f′ &gt; 0 sur ]1 ; +∞[.</div><div class=\"etu\"><b>Étape 3</b> — <b>Variations</b> : f croît jusqu'à f(−1) = 2 (maximum local), décroît jusqu'à f(1) = −2 (minimum local), puis recroît. Toujours CALCULER f aux valeurs où f′ s'annule.</div></div></details>\n<h3>4. Tangentes (rappel)</h3>\n<div class=\"tip\"><b>Tangente en a :</b> y = f′(a)(x − a) + f(a). Pour une lecture de pente : f′(a) est le coefficient directeur.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> (uv)′ = u′v + uv′ (PAS u′v′) ; dans (u/v)′, le numérateur est u′v − uv′ dans CET ordre ; ne pas oublier de factoriser f′ pour étudier son signe ; f′(a) = 0 seul ne prouve rien (x³ en 0) ; toujours vérifier que v ≠ 0 avant d'utiliser (u/v)′.</div>"},
{"id": "suites", "theme": "Suites (1re)", "niveau": "1re", "titre": "Suites arithmétiques et géométriques", "cours": "<div class=\"cours-head\"><h2>Suites arithmétiques et géométriques</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Suites arithmétiques : raison r</h3>\n<div class=\"tip\"><b>Définition :</b> u_{n+1} = u_n + r (on AJOUTE r à chaque terme). <b>Terme général :</b> u_n = u_0 + n·r (ou u_n = u_1 + (n−1)·r si la suite démarre à u_1). <b>Somme :</b> 1 + 2 + … + n = n(n+1)/2 ; somme de termes = (nombre de termes) × (premier + dernier)/2.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — étudier une suite arithmétique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> u_0 = 5 et chaque terme s'obtient en ajoutant 3. ① u_10 ? ② Somme u_0 + … + u_10 ? ③ Sens de variation ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : u_n = 5 + 3n : u_10 = 5 + 30 = <b>35</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : 11 termes (de 0 à 10), premier 5, dernier 35 : S = 11 × (5 + 35)/2 = <b>220</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>③</b> : r = 3 &gt; 0 : suite strictement <b>croissante</b> (r &lt; 0 : décroissante ; r = 0 : constante).</div></div></details>\n<h3>2. Suites géométriques : raison q</h3>\n<div class=\"tip\"><b>Définition :</b> u_{n+1} = q·u_n (on MULTIPLIE par q). <b>Terme général :</b> u_n = u_0·qⁿ. <b>Somme :</b> 1 + q + … + qⁿ = (q^{n+1} − 1)/(q − 1) (q ≠ 1).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — étudier une suite géométrique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> v_0 = 2 et chaque terme est multiplié par 3. ① v_5 ? ② Somme v_0 + … + v_5 ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : v_n = 2×3ⁿ : v_5 = 2×243 = <b>486</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : S = 2×(3⁶ − 1)/(3 − 1) = (729 − 1) = <b>728</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôler</b> : 2 + 6 + 18 + 54 + 162 + 486 = 728 ✓. La formule de somme géométrique : premier terme × (q^{nb} − 1)/(q − 1) où nb = nombre de termes.</div></div></details>\n<h3>3. Croissances comparées</h3>\n<div class=\"tip\">Pour q &gt; 1, la suite géométrique dépasse TOUTE suite arithmétique à partir d'un certain rang : la multiplication l'emporte sur l'addition (croissance exponentielle vs linéaire).</div>\n<h3>4. Reconnaître la nature d'une suite</h3>\n<div class=\"tip\"><b>Test :</b> u_{n+1} − u_n CONSTANT ⟹ arithmétique (la constante = r) ; u_{n+1}/u_n CONSTANT ⟹ géométrique (la constante = q). Ni l'un ni l'autre ⟹ aucune des deux.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — arithmétique, géométrique, ou aucune ?</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Classer : ① 3 ; 7 ; 11 ; 15… ② 5 ; 10 ; 20 ; 40… ③ 1 ; 4 ; 9 ; 16…</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : différences : 4, 4, 4 constantes ⟹ <b>arithmétique</b>, r = 4.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : quotients : 2, 2, 2 constants ⟹ <b>géométrique</b>, q = 2.</div><div class=\"etu\"><b>Étape 3</b> — <b>③</b> : différences 3, 5, 7 (pas constantes), quotients 4, 9/4… (pas constants) : <b>aucune</b> des deux (c'est n², croissance quadratique).</div></div></details>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> arithmétique = on AJOUTE (terme général avec n·r), géométrique = on MULTIPLIE (terme général avec qⁿ) ; u_n = u_0 + nr ne vaut que si le premier terme est u_0 (décalage de 1 avec u_1) ; la formule de somme géométrique exige q ≠ 1 ; 0 < q < 1 : suite géométrique DÉCROISSANTE (ex. 100×0,5ⁿ).</div>"},
{"id": "probas-conditionnelles", "theme": "Probabilités conditionnelles (1re)", "niveau": "1re", "titre": "Probabilités conditionnelles et indépendance", "cours": "<div class=\"cours-head\"><h2>Probabilités conditionnelles et indépendance</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Probabilité conditionnelle</h3>\n<div class=\"tip\"><b>P_B(A) = P(A ∩ B)/P(B)</b> : probabilité de A SACHANT que B est réalisé (on se restreint à l'univers B). Autres écritures : P(A ∩ B) = P(B) × P_B(A) = P(A) × P_A(B).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer une probabilité conditionnelle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une classe : 55 % de filles, dont 60 % font latin. On prend une fille au hasard : P(fait latin) ? Et P(fille ∩ latin) pour un élève quelconque ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Restriction de l'univers</b> : « une fille au hasard » ⟹ univers = les filles : P(fille)(latin) = 60 % = <b>0,6</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>Formule</b> : P(fille ∩ latin) = P(fille) × P_fille(latin) = 0,55 × 0,6 = <b>0,33</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Contrôler</b> : sur 100 élèves : 55 filles, dont 60 % = 33 filles latinistes : 33/100 = 0,33 ✓. La formule « proba du chemin = produit des branches » raconte le même dénombrement.</div></div></details>\n<h3>2. Arbres de probabilité</h3>\n<div class=\"tip\"><b>Sur chaque branche :</b> une probabilité conditionnelle. <b>Chemin :</b> le produit des branches ; les branches issues d'un même nœud totalisent 1. <b>P(A) :</b> somme des chemins menant à A (formule des probabilités totales).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — arbre et probabilités totales</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Maladie : touche 10 % d'une population. Test : positif chez 90 % des malades, mais aussi chez 8 % des sains. P(test positif) ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Arbre</b> : deux branches : malade (0,1) / sain (0,9) ; puis test + / − conditionnels.</div><div class=\"etu\"><b>Étape 2</b> — <b>Chemins vers « + »</b> : 0,1 × 0,9 (malade et +) + 0,9 × 0,08 (sain et +) = 0,09 + 0,072 = <b>0,162</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Lire</b> : P(+) = 0,162 soit 16,2 %. C'est la formule des probabilités totales : P(+) = P(M ∩ +) + P(M̄ ∩ +).</div></div></details>\n<h3>3. Indépendance</h3>\n<div class=\"tip\"><b>A et B indépendants ⟺ P(A ∩ B) = P(A) × P(B)</b> ⟺ P_B(A) = P(A) (la réalisation de B ne change pas la probabilité de A).</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — tester une indépendance</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> P(A) = 0,5, P(B) = 0,4, P(A ∩ B) = 0,2. A et B sont-ils indépendants ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Comparer</b> : P(A) × P(B) = 0,5 × 0,4 = 0,2.</div><div class=\"etu\"><b>Étape 2</b> — <b>Conclure</b> : P(A ∩ B) = 0,2 = P(A)×P(B) ⟹ <b>indépendants</b>. (Si P(A ∩ B) avait valu 0,1, ils ne le seraient pas.)</div><div class=\"etu\"><b>Étape 3</b> — <b>Attention</b> : indépendant ≠ incompatible ! Incompatibles : A ∩ B = ∅ (P(A∩B) = 0) ; indépendants avec P(A), P(B) &gt; 0 : P(A∩B) &gt; 0. Deux événements incompatibles non triviaux ne sont JAMAIS indépendants.</div></div></details>\n<h3>4. Succession d'épreuves</h3>\n<div class=\"tip\">Deux tirages AVEC REMISE (ou répétition identique) : les épreuves sont indépendantes ⟹ on multiplie : P(les deux) = P(A)². SANS remise : les probabilités changent au 2e tirage (conditional).</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> indépendant ≠ incompatible (confusion majeure) ; dans P_B(A), diviser par P(B) — jamais par P(A) ; sur un arbre, multiplier le LONG d'un chemin, additionner ENTRE chemins ; « sachant que » restreint l'univers (dénominateur changé).</div>"},
{"id": "produit-scalaire", "theme": "Produit scalaire (1re)", "niveau": "1re", "titre": "Produit scalaire et applications", "cours": "<div class=\"cours-head\"><h2>Produit scalaire et applications</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Définition et expressions</h3>\n<div class=\"tip\"><b>u→ · v→ = ‖u→‖ × ‖v→‖ × cos(θ)</b> (θ = angle entre les vecteurs).<br><b>En repère orthonormé :</b> u→(x ; y), v→(x′ ; y′) ⟹ u→·v→ = <b>xx′ + yy′</b>.<br>C'est un NOMBRE (pas un vecteur !), qui peut être positif, nul ou négatif.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — calculer un produit scalaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> u→(3 ; 4) et v→(−2 ; 6). ① u→·v→ ? ② Normes de u→ et v→ ?</div><div class=\"etu\"><b>Étape 1</b> — <b>①</b> : u→·v→ = 3×(−2) + 4×6 = −6 + 24 = <b>18</b>.</div><div class=\"etu\"><b>Étape 2</b> — <b>②</b> : ‖u→‖ = √(9+16) = 5 ; ‖v→‖ = √(4+36) = √40 = 2√10.</div><div class=\"etu\"><b>Étape 3</b> — <b>Angle</b> : cos(θ) = 18/(5×2√10) = 18/(10√10) ≈ 0,57 ⟹ θ ≈ 55°. Le produit scalaire relie algèbre (coordonnées) et géométrie (angle) : c'est sa puissance.</div></div></details>\n<h3>2. Orthogonalité</h3>\n<div class=\"tip\"><b>u→ ⊥ v→ ⟺ u→·v→ = 0.</b> C'est LE test d'orthogonalité, en repère comme en géométrie pure.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — prouver une orthogonalité</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> A(1 ; 2), B(4 ; 3), C(5 ; 0). Le triangle ABC est-il rectangle en B ?</div><div class=\"etu\"><b>Étape 1</b> — <b>Vecteurs</b> : BA→ = (1−4 ; 2−3) = (−3 ; −1) ; BC→ = (5−4 ; 0−3) = (1 ; −3).</div><div class=\"etu\"><b>Étape 2</b> — <b>Produit scalaire</b> : BA→·BC→ = −3×1 + (−1)×(−3) = −3 + 3 = <b>0</b>.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : BA→ ⊥ BC→ ⟹ <b>ABC rectangle en B</b>. Une ligne de calcul remplace Pythagore : c'est l'outil le plus rentable du chapitre.</div></div></details>\n<h3>3. Applications géométriques</h3>\n<div class=\"tip\"><b>Norme :</b> ‖u→‖² = u→·u→ = x² + y². <b>Médiatrice :</b> ensemble des M tels que MA→·MB→... plutôt : MA = MB. <b>Théorème de la médiane (aperçu) :</b> MA→·MB→ = (MI² − AB²/4) où I milieu de [AB]. <b>Al-Kashi (aperçu) :</b> a² = b² + c² − 2bc·cos(Â) : Pythagore généralisé.</div>\n<details class=\"ex-util\"><summary>💡 Exemple détaillé — Al-Kashi</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Triangle : b = 5, c = 7, angle Â = 60°. Calculer a (le côté opposé à Â).</div><div class=\"etu\"><b>Étape 1</b> — <b>Poser Al-Kashi</b> : a² = b² + c² − 2bc·cos(Â) = 25 + 49 − 2×5×7×cos(60°).</div><div class=\"etu\"><b>Étape 2</b> — <b>Calculer</b> : cos(60°) = 1/2 : a² = 74 − 35 = 39.</div><div class=\"etu\"><b>Étape 3</b> — <b>Conclure</b> : a = √39 ≈ <b>6,2</b>. Contrôle : |b − c| = 2 &lt; 6,2 &lt; 12 = b + c : inégalité triangulaire respectée ✓.</div></div></details>\n<h3>4. Projection et travail</h3>\n<div class=\"tip\">Le produit scalaire mesure l'« efficacité » d'une force dans une direction : une force perpendiculaire au déplacement ne travaille pas (u→·v→ = 0). C'est la physique qui a engendré la notion.</div>\n<div class=\"tip\"><b>⚠️ Pièges classiques :</b> le produit scalaire est un NOMBRE, pas un vecteur ; l'expression xx′ + yy′ exige un repère ORTHONORMÉ ; u→·v→ = 0 n'implique pas u→ = 0→ ou v→ = 0→ (orthogonalité !) ; dans Al-Kashi, ne pas oublier le −2bc·cos(Â).</div>"},
