    "id": "relatifs",
    "theme": "Nombres relatifs (5e)",
    "niveau": "5e",
    "titre": "Nombres relatifs : repérage, addition, soustraction",
    "cours": "<div class=\"cours-head\"><h2>Nombres relatifs : repérage, addition, soustraction</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les nombres relatifs : au-dessus et en dessous de zéro</h3>\n<ul>\n<li>Un <b>nombre relatif</b> est un nombre muni d'un <b>signe</b> : +7 (positif), −3 (négatif) ;</li>\n<li>Zéro est le seul nombre à la fois positif et négatif ; il n'a pas de signe ;</li>\n<li>Deux nombres opposés ont la même « valeur » mais des signes contraires : +4 et −4 ; leur somme vaut 0 ;</li>\n<li>Les relatifs servent partout : températures (−5 °C), altitude (−400 m pour la mer Morte), étages d'un immeuble (−2 : sous-sol), compte bancaire, chronologie (−52 : 52 ans avant J.-C.).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Droite graduee avec relatifs\">\n  <line x1=\"20\" y1=\"60\" x2=\"410\" y2=\"60\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <line x1=\"410\" y1=\"60\" x2=\"400\" y2=\"55\" stroke=\"#94a3b8\" stroke-width=\"2\"/><line x1=\"410\" y1=\"60\" x2=\"400\" y2=\"65\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <g font-size=\"12\" text-anchor=\"middle\">\n    <circle cx=\"40\" cy=\"60\" r=\"3.5\" fill=\"#ef4444\"/><text x=\"40\" y=\"45\" fill=\"#ef4444\">−4</text>\n    <circle cx=\"105\" cy=\"60\" r=\"3.5\" fill=\"#ef4444\"/><text x=\"105\" y=\"45\" fill=\"#ef4444\">−3</text>\n    <circle cx=\"170\" cy=\"60\" r=\"3.5\" fill=\"#ef4444\"/><text x=\"170\" y=\"45\" fill=\"#ef4444\">−2</text>\n    <circle cx=\"235\" cy=\"60\" r=\"3.5\" fill=\"#ef4444\"/><text x=\"235\" y=\"45\" fill=\"#ef4444\">−1</text>\n    <circle cx=\"300\" cy=\"60\" r=\"4\" fill=\"#1e293b\"/><text x=\"300\" y=\"45\" fill=\"#1e293b\">0</text>\n    <circle cx=\"365\" cy=\"60\" r=\"3.5\" fill=\"#4f46e5\"/><text x=\"365\" y=\"45\" fill=\"#4f46e5\">+1</text>\n  </g>\n  <text x=\"215\" y=\"90\" font-size=\"12\" fill=\"#64748b\" text-anchor=\"middle\">Plus on va à GAUCHE, plus le nombre est PETIT : −4 &lt; −1 &lt; 0 &lt; +1</text>\n</svg><span class=\"fig-cap\">Sur la droite graduée, l'ordre des relatifs se lit de gauche à droite : tout nombre négatif est plus petit que tout nombre positif.</span></div>\n\n<h3>2. Comparer des relatifs</h3>\n<div class=\"tip\"><b>Règle absolue</b> : entre deux nombres positifs, le plus grand est celui qui a la plus grande « valeur » ; entre deux négatifs, c'est l'inverse : le plus grand est celui qui a la plus PETITE valeur numérique. −2 &gt; −7 car −2 est « moins profond » que −7.</div>\n<ul>\n<li>Comparaison à deux négatifs : −8 &lt; −3 (à −8 °C il fait plus froid qu'à −3 °C) ;</li>\n<li>Tout négatif &lt; 0 &lt; tout positif : −100 &lt; +0,5 ;</li>\n<li><b>Distance à zéro</b> (valeur absolue, notée |a|) : |−7| = 7 ; |+3| = 3. Deux nombres opposés ont la même distance à zéro.</li>\n</ul>\n<table>\n<tr><th>Couple</th><th>Le plus grand</th><th>Pourquoi</th></tr>\n<tr><td>−5 et −2</td><td>−2</td><td>moins « profond », plus proche de zéro</td></tr>\n<tr><td>−9 et +1</td><td>+1</td><td>un positif bat toujours un négatif</td></tr>\n<tr><td>0 et −0,5</td><td>0</td><td>zéro &gt; tout négatif</td></tr>\n<tr><td>−13 et −25</td><td>−13</td><td>|−13| &lt; |−25| → −13 &gt; −25</td></tr>\n</table>\n\n<h3>3. Repérage dans le plan : abscisse et ordonnée</h3>\n<ul>\n<li>Un <b>repère</b> = deux axes perpendiculaires gradués qui se croisent à l'origine O ;</li>\n<li>Chaque point a une <b>coordonnée</b> : (abscisse ; ordonnée) — l'abscisse se lit sur l'axe horizontal, l'ordonnée sur l'axe vertical ;</li>\n<li>Le point A(−3 ; 2) : 3 unités à gauche (abscisse négative), puis 2 unités vers le haut ;</li>\n<li>L'ordre compte : (2 ; −3) n'est PAS (−3 ; 2) — ce sont des points différents ;</li>\n<li>Les coordonnées permettent de jouer à la bataille navale, de programmer un jeu vidéo, de localiser sur une carte.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Repere avec point A(-3;2)\">\n  <line x1=\"215\" y1=\"15\" x2=\"215\" y2=\"145\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"30\" y1=\"80\" x2=\"400\" y2=\"80\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"405\" y=\"84\" font-size=\"11\" fill=\"#64748b\">x</text><text x=\"220\" y=\"20\" font-size=\"11\" fill=\"#64748b\">y</text>\n  <line x1=\"130\" y1=\"80\" x2=\"130\" y2=\"38\" stroke=\"#4f46e5\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"215\" y1=\"38\" x2=\"130\" y2=\"38\" stroke=\"#4f46e5\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <circle cx=\"130\" cy=\"38\" r=\"5\" fill=\"#ef4444\"/>\n  <text x=\"120\" y=\"30\" font-size=\"13\" fill=\"#ef4444\" font-weight=\"bold\">A(−3 ; 2)</text>\n  <text x=\"130\" y=\"95\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">−3</text>\n  <text x=\"222\" y=\"42\" font-size=\"11\" fill=\"#64748b\">2</text>\n  <circle cx=\"215\" cy=\"80\" r=\"3\" fill=\"#1e293b\"/><text x=\"225\" y=\"95\" font-size=\"11\" fill=\"#1e293b\">O</text>\n</svg><span class=\"fig-cap\">Pour placer A(−3 ; 2) : abscisse −3 (à gauche de O), ordonnée +2 (au-dessus). Les pointillés aident à vérifier les deux projections.</span></div>\n\n<h3>4. Additionner des relatifs : la règle du « match »</h3>\n<div class=\"tip\"><b>Cas 1 — mêmes signes</b> : on additionne les valeurs et on garde le signe commun. (+8) + (+3) = +11 ; (−8) + (−3) = −11.\n<b>Cas 2 — signes différents</b> : match ! On soustrait la plus petite valeur de la plus grande, et le signe du vainqueur (la plus grande valeur) l'emporte. (+8) + (−3) = +5 ; (−8) + (+3) = −5.</div>\n<ul>\n<li>Si les deux valeurs sont égales et les signes opposés : nul, résultat 0. (+7) + (−7) = 0 ;</li>\n<li>Somme de plusieurs relatifs : on peut les regrouper intelligemment — d'abord les positifs entre eux, puis les négatifs ;</li>\n<li>Écrire (+8) + (−3) = 8 − 3 = 5 est la version « allégée » qu'on utilise dès qu'on est à l'aise.</li>\n</ul>\n\n<h3>5. Soustraire : l'astuce qui change tout</h3>\n<div class=\"warn\"><b>Soustraire un nombre = additionner son opposé.</b> a − b = a + (−b). C'est LA transformation à connaître : toute soustraction se convertit en addition, puis on applique les règles du paragraphe 4.</div>\n<ul>\n<li>(+5) − (+8) = (+5) + (−8) = −3 : on « enlève » 8 alors qu'on n'en a que 5, on passe sous zéro ;</li>\n<li>(−4) − (−9) = (−4) + (+9) = +5 : enlever une dette, c'est s'enrichir ! ;</li>\n<li>(−2) − (+6) = (−2) + (−6) = −8 : descendre de 6 étages depuis le sous-sol −2 → −8 ;</li>\n<li>Le « moins devant la parenthèse » inverse le signe : −(−7) = +7 ; −(+7) = −7.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Thermometre et additions\">\n  <rect x=\"60\" y=\"20\" width=\"20\" height=\"90\" rx=\"10\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <circle cx=\"70\" cy=\"50\" r=\"3\" fill=\"#ef4444\"/><circle cx=\"70\" cy=\"80\" r=\"3\" fill=\"#ef4444\"/>\n  <line x1=\"70\" y1=\"80\" x2=\"70\" y2=\"110\" stroke=\"#ef4444\" stroke-width=\"4\"/><line x1=\"70\" y1=\"50\" x2=\"70\" y2=\"80\" stroke=\"#ef4444\" stroke-width=\"4\" stroke-dasharray=\"4,3\" opacity=\"0.5\"/>\n  <circle cx=\"70\" cy=\"110\" r=\"6\" fill=\"#ef4444\"/>\n  <text x=\"90\" y=\"55\" font-size=\"11\" fill=\"#ef4444\" font-weight=\"bold\">−3 °C (après +5)</text>\n  <text x=\"90\" y=\"93\" font-size=\"11\" fill=\"#64748b\">−8 °C</text>\n  <path d=\"M 62 105 Q 50 80 62 52\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/><path d=\"M 58 58 L 62 50 L 66 58\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"82\" font-size=\"12\" fill=\"#16a34a\" text-anchor=\"end\">+5</text>\n  <text x=\"270\" y=\"55\" font-size=\"12\" fill=\"#1e293b\">−8 + 5 = −3</text>\n  <text x=\"270\" y=\"75\" font-size=\"12\" fill=\"#1e293b\">−8 − (−5) = −3 aussi</text>\n  <text x=\"270\" y=\"95\" font-size=\"12\" fill=\"#4f46e5\" font-weight=\"bold\">ajouter du chaud /</text>\n  <text x=\"270\" y=\"112\" font-size=\"12\" fill=\"#4f46e5\" font-weight=\"bold\">enlever du froid : pareil !</text>\n</svg><span class=\"fig-cap\">Le thermomètre est le meilleur modèle : monter de 5 degrés ou retirer 5 degrés de froid, cela revient au même. a + b = a − (−b).</span></div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le compte bancaire de Noé</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Noé a −25 € sur son compte. Il reçoit 40 € (anniversaire), dépense 18 €, puis sa grand-mère lui « annule » une dette de 12 € (elle paie à sa place). Solde final ?</div><div class=\"etu\"><b>Étape 1 — Traduire en relatifs</b> : départ −25 ; +40 (reçu) ; −18 (dépense) ; annuler une dette de 12 = +12.</div><div class=\"etu\"><b>Étape 2 — Regrouper les positifs</b> : +40 + 12 = +52 ; les négatifs : −25 − 18 = −43.</div><div class=\"etu\"><b>Étape 3 — Match final</b> : +52 + (−43) = <b>+9</b>. Signes différents : 52 − 43 = 9, signe du vainqueur (positif).</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : −25 + 40 = 15 ; 15 − 18 = −3 ; −3 + 12 = +9 ✓. Deux chemins, même résultat : le regroupement n'est pas une obligation, juste un confort.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — distance entre deux points sur un axe</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un ascenseur part de l'étage −3 et monte jusqu'au +7. Quelle distance parcourt-il ? Et s'il descendait de −3 à −10 ?</div><div class=\"etu\"><b>Étape 1 — Distance = écart</b> : la distance entre deux niveaux a et b vaut |a − b| (ou |b − a|, c'est pareil).</div><div class=\"etu\"><b>Étape 2 — Premier trajet</b> : |−3 − (+7)| = |−10| = <b>10 étages</b>.</div><div class=\"etu\"><b>Étape 3 — Second trajet</b> : |−3 − (−10)| = |−3 + 10| = |+7| = <b>7 étages</b> : descendre de −3 à −10 fait bien 7 niveaux.</div><div class=\"etu\"><b>Étape 4 — Astuce visuelle</b> : sur la droite graduée, compter les graduations entre les deux points ; ou additionner les deux valeurs absolues si les points sont de part et d'autre de zéro (3 + 7 = 10 ✓). La distance est toujours positive.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« −8 &gt; −3 car 8 &gt; 3 » : FAUX — chez les négatifs, l'ordre est inversé : −8 &lt; −3.</li>\n<li>Soustraire sans transformer : (−4) − (−9) ≠ −13 ! Convertir d'abord : (−4) + (+9) = +5.</li>\n<li>« Deux moins font un plus partout » : seulement entre deux facteurs — dans (−4) − (−9), les deux moins de droite fusionnent ; mais −4 − 9 reste −13 (un seul moins là).</li>\n<li>Oublier que 0 est plus grand que tout négatif : −0,1 &lt; 0.</li>\n<li>Coordonnées : lire (3 ; −2) comme (−2 ; 3) — l'abscisse est TOUJOURS en premier.</li>\n</ul>\n</div>"

    "id": "litteral-5e",
    "theme": "Expressions littérales (5e)",

    "titre": "Premières expressions littérales et simplification",
    "cours": "<div class=\"cours-head\"><h2>Premières expressions littérales et simplification</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le calcul littéral : des lettres pour généraliser</h3>\n<ul>\n<li>Une <b>expression littérale</b> contient une ou plusieurs <b>lettres</b> (variables) qui remplacent des nombres : « le prix de n cahiers à 3 € » s'écrit 3 × n, souvent noté 3n ;</li>\n<li>La lettre est une <b>boîte</b> : on remplace par la valeur qui convient au contexte (n = 5 cahiers → 15 €) ;</li>\n<li>Avantage : une seule formule pour <b>tous les cas</b> — périmètre du carré 4×c, quelle que soit la taille du carré ;</li>\n<li>Convention d'écriture : le signe × se supprime devant ou derrière une lettre ou une parenthèse : 4×a = 4a ; a×b = ab ; 2×(x+3) = 2(x+3) ; a×a = a².</li>\n</ul>\n<table>\n<tr><th>Phrase française</th><th>Expression littérale</th><th>Si a = 4</th></tr>\n<tr><td>le double de a</td><td>2a</td><td>8</td></tr>\n<tr><td>la moitié de a</td><td>a ÷ 2</td><td>2</td></tr>\n<tr><td>le suivant de l'entier n</td><td>n + 1</td><td>—</td></tr>\n<tr><td>le triple diminué de 5</td><td>3a − 5</td><td>7</td></tr>\n<tr><td>le carré de a</td><td>a²</td><td>16</td></tr>\n<tr><td>la somme de a et du produit de 3 par a</td><td>a + 3a</td><td>16</td></tr>\n</table>\n<div class=\"tip\"><b>Tester une formule</b> : pour vérifier qu'une expression est juste, remplacer la lettre par un nombre simple (a = 2, n = 10) des deux côtés. Si « le double augmenté de 1 » : 2a + 1 ; test avec a = 3 : le double est 6, augmenté de 1 → 7 ; et 2×3 + 1 = 7 ✓.</div>\n\n<h3>2. Simplifier : réduire une expression</h3>\n<ul>\n<li>Réduire, c'est <b>compter ensemble</b> les termes de même nature : 3 cahiers + 5 cahiers = 8 cahiers → 3a + 5a = 8a ;</li>\n<li>On peut additionner des « pommes » avec des « pommes », jamais avec des « poires » : 3a + 5b ne se réduit pas ;</li>\n<li>Le nombre devant la lettre s'appelle le <b>coefficient</b> : dans 7x, le coefficient est 7 ; dans x, c'est 1 (x = 1x) ;</li>\n<li>a² se traite comme une troisième famille : 3a² + 2a + 4a² = 7a² + 2a (les a² ensemble, les a ensemble).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Familles de termes\">\n  <rect x=\"30\" y=\"25\" width=\"120\" height=\"70\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <text x=\"90\" y=\"55\" font-size=\"14\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">famille des a</text>\n  <text x=\"90\" y=\"80\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">3a + 5a = 8a</text>\n  <rect x=\"170\" y=\"25\" width=\"120\" height=\"70\" rx=\"8\" fill=\"#dcfce7\" stroke=\"#16a34a\"/>\n  <text x=\"230\" y=\"55\" font-size=\"14\" fill=\"#16a34a\" text-anchor=\"middle\" font-weight=\"bold\">famille des b</text>\n  <text x=\"230\" y=\"80\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">2b + b = 3b</text>\n  <rect x=\"310\" y=\"25\" width=\"100\" height=\"70\" rx=\"8\" fill=\"#fee2e2\" stroke=\"#ef4444\"/>\n  <text x=\"360\" y=\"55\" font-size=\"14\" fill=\"#ef4444\" text-anchor=\"middle\" font-weight=\"bold\">nombres seuls</text>\n  <text x=\"360\" y=\"80\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">7 − 3 = 4</text>\n  <text x=\"215\" y=\"112\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">3a + 2b + 5a − 4 + b = 8a + 3b − 4 : on trie par familles, puis on réduit chaque famille</text>\n</svg><span class=\"fig-cap\">Chaque « famille » (mêmes lettres, même exposant) se réduit séparément ; les familles cohabitent ensuite dans l'expression réduite.</span></div>\n\n<h3>3. Substituer : remplacer une lettre par une valeur</h3>\n<ol>\n<li>Écrire l'expression ;</li>\n<li>Remplacer chaque lettre par sa valeur, <b>entre parenthèses</b> si le nombre est négatif ;</li>\n<li>Calculer en respectant les <b>priorités</b> opératoires.</li>\n</ol>\n<div class=\"tip\"><b>Priorités</b> : 1) parenthèses ; 2) carrés et puissances ; 3) multiplications et divisions (de gauche à droite) ; 4) additions et soustractions (de gauche à droite). Dans 5 + 3×2² : d'abord 2² = 4, puis 3×4 = 12, enfin 5 + 12 = 17.</div>\n<ul>\n<li>Expression E = 4x − 7 pour x = 5 : E = 4×5 − 7 = 13 ;</li>\n<li>Expression F = 3a² pour a = −2 : F = 3×(−2)² = 3×4 = 12 — attention, (−2)² = +4, mais −2² = −4 !</li>\n</ul>\n\n<h3>4. Tester une égalité</h3>\n<ul>\n<li>Une égalité est vraie ou fausse <b>pour une valeur donnée</b> : on calcule chaque membre séparément et on compare ;</li>\n<li>Tester l'égalité 3x + 2 = 17 pour x = 5 : membre de gauche 3×5 + 2 = 17 ; membre de droite 17 : 17 = 17, l'égalité est vraie pour x = 5 ;</li>\n<li>Tester pour x = 4 : 3×4 + 2 = 14 ≠ 17 : l'égalité est fausse pour cette valeur ;</li>\n<li>Trouver la valeur qui rend l'égalité vraie, c'est <b>résoudre une équation</b> — le grand programme des classes suivantes !</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 110\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Balance\">\n  <line x1=\"215\" y1=\"20\" x2=\"215\" y2=\"70\" stroke=\"#94a3b8\" stroke-width=\"4\"/>\n  <path d=\"M 215 20 L 90 55 L 340 55 Z\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"3\"/>\n  <line x1=\"90\" y1=\"55\" x2=\"90\" y2=\"80\" stroke=\"#4f46e5\" stroke-width=\"2\"/><line x1=\"340\" y1=\"55\" x2=\"340\" y2=\"80\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <rect x=\"55\" y=\"80\" width=\"70\" height=\"22\" rx=\"4\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <text x=\"90\" y=\"96\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">3x + 2</text>\n  <rect x=\"305\" y=\"80\" width=\"70\" height=\"22\" rx=\"4\" fill=\"#dcfce7\" stroke=\"#16a34a\"/>\n  <text x=\"340\" y=\"96\" font-size=\"12\" fill=\"#16a34a\" text-anchor=\"middle\">17</text>\n  <text x=\"215\" y=\"108\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">Pour x = 5, la balance est équilibrée : l'égalité est vraie</text>\n</svg><span class=\"fig-cap\">L'égalité comme une balance : les deux plateaux doivent afficher la même valeur. Tester, c'est vérifier si la balance s'équilibre.</span></div>\n\n<h3>5. Les formules dans la vie courante</h3>\n<ul>\n<li>Périmètre du rectangle : P = 2×(L + ℓ) — formule littérale prête pour toutes les dimensions ;</li>\n<li>Aire du triangle : A = (b × h)/2 ;</li>\n<li>Conversion des degrés Fahrenheit : F = 1,8×C + 32 ;</li>\n<li>Vitesse moyenne : v = d/t (distance sur durée) ;</li>\n<li>Chaque formule se teste avec un cas simple : rectangle 5×3 : P = 2×(5+3) = 16 ✓ (5+3+5+3 = 16 à la main).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le programme de calcul</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Programme : « choisir un nombre ; le multiplier par 5 ; ajouter 12 au résultat ». Écrire l'expression littérale, puis l'appliquer à 0, 4 et −2. Quel nombre faut-il choisir pour obtenir 42 ?</div><div class=\"etu\"><b>Étape 1 — Traduire</b> : nombre choisi n ; multiplié par 5 → 5n ; puis +12 → expression <b>5n + 12</b>.</div><div class=\"etu\"><b>Étape 2 — Substituer</b> : n = 0 → 12 ; n = 4 → 20 + 12 = 32 ; n = −2 → 5×(−2) + 12 = −10 + 12 = 2.</div><div class=\"etu\"><b>Étape 3 — Chercher 42</b> : il faut 5n + 12 = 42, donc 5n = 30, donc n = 6 (en soustrayant 12 puis divisant par 5 — essais successifs possibles : n = 7 → 47, trop grand ; n = 6 → 42 ✓).</div><div class=\"etu\"><b>Étape 4 — Contrôler</b> : 5×6 + 12 = 42 ✓. Le programme de calcul est le pont vers les équations : chaque expression est une machine, chaque question « quel nombre pour obtenir ... ? » est une équation déguisée.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — prouver avec le calcul littéral</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Prouve que la somme de trois nombres consécutifs est toujours un multiple de 3.</div><div class=\"etu\"><b>Étape 1 — Choisir la lettre</b> : soit n le premier nombre ; les suivants sont n + 1 et n + 2.</div><div class=\"etu\"><b>Étape 2 — Écrire la somme</b> : n + (n + 1) + (n + 2).</div><div class=\"etu\"><b>Étape 3 — Réduire</b> : n + n + n + 1 + 2 = 3n + 3 = 3×(n + 1).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la somme vaut 3×(n+1), c'est un multiple de 3, quel que soit n. Test : 5+6+7 = 18 = 3×6 ✓ ; 40+41+42 = 123 = 3×41 ✓. Une seule écriture littérale prouve ce que mille exemples suggèrent : c'est toute la puissance du calcul littéral.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Réduire des familles différentes : 3a + 5b ≠ 8ab — les pommes ne s'ajoutent pas aux poires.</li>\n<li>Confondre a + a + a ( = 3a) et a × a × a ( = a³) ; de même a + a = 2a, jamais a².</li>\n<li>Oublier les parenthèses en substituant un négatif : x² avec x = −3 → (−3)² = 9, pas −9.</li>\n<li>Supprimer le × à tort : 3×5 ne s'écrit pas « 35 » — la suppression ne marche qu'avec des lettres ou des parenthèses.</li>\n<li>Tester une égalité en remplaçant des deux côtés à la fois : calculer chaque membre séparément, sinon on « force » le résultat.</li>\n</ul>\n</div>\n<h3>6. Distributivité : une première fenêtre</h3>\n<div class=\"tip\"><b>k × (a + b) = k×a + k×b</b> et <b>k × (a − b) = k×a − k×b</b>. Le facteur devant la parenthèse se « distribue » à chacun des termes — comme un professeur qui distribue une feuille à chaque élève du groupe.</div>\n<ul>\n<li>Calcul malin : 7 × 99 = 7 × (100 − 1) = 700 − 7 = 693 — la distributivité répare le calcul mental ;</li>\n<li>Calcul malin : 12 × 21 = 12 × (20 + 1) = 240 + 12 = 252 ;</li>\n<li>Aire du grand rectangle (largeur k, longueurs a puis b accolés) : k×(a+b) — le découper en deux rectangles (k×a et k×b) prouve la formule ;</li>\n<li>Développer : 5×(x + 3) = 5x + 15 ; réduire ensuite si possible : 5x + 15 reste tel quel, 5x + 3x = 8x ;</li>\n<li>Ce mécanisme reviendra en 4e (développement complet) et tout au long du lycée : le voir d'abord sur des nombres, c'est le comprendre pour de bon.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Rectangle decoupe prouvant la distributivite\">\n  <rect x=\"30\" y=\"30\" width=\"150\" height=\"70\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"130\" y1=\"30\" x2=\"130\" y2=\"100\" stroke=\"#4f46e5\" stroke-width=\"2\" stroke-dasharray=\"5,4\"/>\n  <text x=\"80\" y=\"70\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">aire = 5x</text>\n  <text x=\"160\" y=\"70\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">5×3</text>\n  <text x=\"80\" y=\"22\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">largeur 5</text>\n  <text x=\"290\" y=\"55\" font-size=\"13\" fill=\"#1e293b\">5(x + 3) = 5x + 15</text>\n  <text x=\"290\" y=\"78\" font-size=\"12\" fill=\"#4f46e5\">aire du grand =</text>\n  <text x=\"290\" y=\"96\" font-size=\"12\" fill=\"#4f46e5\">somme des deux petits</text>\n</svg><span class=\"fig-cap\">La distributivité se voit : le grand rectangle d'aire 5×(x+3) se découpe en deux rectangles (5x et 15). Même aire, deux écritures — donc une égalité.</span></div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le calcul mental de champion</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer sans poser et sans calculatrice : 47 × 102 et 8 × 19,5.</div><div class=\"etu\"><b>Étape 1 — Décortiquer 102</b> : 102 = 100 + 2, donc 47 × 102 = 47×100 + 47×2 = 4 700 + 94 = <b>4 794</b>.</div><div class=\"etu\"><b>Étape 2 — Décortiquer 19,5</b> : 19,5 = 20 − 0,5, donc 8 × 19,5 = 160 − 4 = <b>156</b>.</div><div class=\"etu\"><b>Étape 3 — Vérifier par ordre de grandeur</b> : 47×102 ≈ 50×100 = 5 000 ✓ ; 8×19,5 ≈ 8×20 = 160 ✓.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : les nombres « presque ronds » (99, 101, 19,8, 45) se ramènent au rond voisin par une somme ou une différence : k×(a±b) = k×a ± k×b est l'arme absolue du calcul mental — et la première rencontre sérieuse avec le calcul littéral appliqué aux nombres.</div></div></details>\n"
  },
  {
    "id": "triangles",
    "theme": "Triangles (5e)",
    "niveau": "5e",
    "titre": "Triangles : somme des angles, inégalité triangulaire",
    "cours": "<div class=\"cours-head\"><h2>Triangles : somme des angles, inégalité triangulaire</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le triangle : une figure indestructible</h3>\n<ul>\n<li>Un triangle est formé de <b>3 côtés</b> et <b>3 angles</b> ; c'est le polygone le plus simple — le seul impossible à déformer sans casser un côté (rigidité) ;</li>\n<li>C'est pour cela que les charpentes, ponts, échafaudages et vélos sont truffés de triangles ;</li>\n<li>Familles : triangle <b>quelconque</b> ; <b>isocèle</b> (2 côtés égaux, 2 angles égaux à la base) ; <b>équilatéral</b> (3 côtés égaux, 3 angles de 60°) ; <b>rectangle</b> (un angle droit, côté opposé : l'hypoténuse).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Trois familles de triangles\">\n  <path d=\"M 40 110 L 110 110 L 55 35 Z\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"70\" y=\"125\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">quelconque</text>\n  <path d=\"M 160 110 L 260 110 L 210 35 Z\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <circle cx=\"160\" cy=\"110\" r=\"20\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"1.5\"/>\n  <circle cx=\"260\" cy=\"110\" r=\"20\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"1.5\"/>\n  <text x=\"210\" y=\"125\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">isocèle (2 côtés =)</text>\n  <path d=\"M 320 110 L 400 110 L 360 41 Z\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <path d=\"M 352 41 A 42 42 0 0 1 368 41\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"125\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">équilatéral (60° partout)</text>\n</svg><span class=\"fig-cap\">Les angles marqués en vert sont égaux dans l'isocèle ; dans l'équilatéral, chaque angle mesure exactement 60°.</span></div>\n\n<h3>2. La somme des angles : toujours 180°</h3>\n<div class=\"tip\"><b>Propriété fondamentale</b> : dans TOUT triangle, la somme des trois angles vaut exactement 180°. Peu importe la forme, la taille, la « maigreur » du triangle : 180°, sans exception.</div>\n<ul>\n<li>Application n°1 : deux angles connus → le troisième s'obtient par soustraction : 180 − (55 + 65) = 60° ;</li>\n<li>Application n°2 : triangle rectangle : les deux angles aigus sont <b>complémentaires</b> (somme 90°) ;</li>\n<li>Application n°3 : angles opposés par le sommet, angles alternes-internes : les configurations de droites parallèles donnent des angles égaux qu'on exploite dans les triangles.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Angles couleurs triangle\">\n  <path d=\"M 60 115 L 200 115 L 115 30 Z\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2.5\"/>\n  <path d=\"M 90 115 A 30 30 0 0 0 76 90\" fill=\"#4f46e5\" fill-opacity=\"0.5\" stroke=\"#4f46e5\"/>\n  <path d=\"M 170 115 A 30 30 0 0 1 179 94\" fill=\"#16a34a\" fill-opacity=\"0.5\" stroke=\"#16a34a\"/>\n  <path d=\"M 101 52 A 26 26 0 0 1 131 52\" fill=\"#ef4444\" fill-opacity=\"0.5\" stroke=\"#ef4444\"/>\n  <text x=\"105\" y=\"110\" font-size=\"11\" fill=\"#4f46e5\">bleu</text>\n  <text x=\"165\" y=\"108\" font-size=\"11\" fill=\"#16a34a\">vert</text>\n  <text x=\"128\" y=\"50\" font-size=\"11\" fill=\"#ef4444\">rouge</text>\n  <text x=\"300\" y=\"55\" font-size=\"13\" fill=\"#1e293b\">bleu + vert + rouge</text>\n  <text x=\"300\" y=\"78\" font-size=\"14\" fill=\"#4f46e5\" font-weight=\"bold\">= 180° toujours</text>\n  <text x=\"300\" y=\"100\" font-size=\"11\" fill=\"#64748b\">découpe-ment : les 3 angles,</text>\n  <text x=\"300\" y=\"116\" font-size=\"11\" fill=\"#64748b\">côte à côte, forment un angle plat</text>\n</svg><span class=\"fig-cap\">Preuve visuelle : détacher les trois angles et les poser côte à côte sur une droite : ils occupent exactement un angle plat de 180°.</span></div>\n\n<h3>3. L'inégalité triangulaire : un garde-fou</h3>\n<div class=\"warn\"><b>Dans un triangle, chaque côté est PLUS COURT que la somme des deux autres.</b> Réciproquement, le triangle ABC n'existe que si AB &lt; BC + CA, BC &lt; CA + AB et CA &lt; AB + BC. Une seule inégalité défaite → pas de triangle possible.</div>\n<ul>\n<li>C'est le « trajet » : aller directement de A à B est toujours plus court que de passer par C ;</li>\n<li>Exemple : 4 cm, 7 cm, 12 cm → 12 &gt; 4 + 7 = 11 : triangle impossible !</li>\n<li>Exemple : 5 cm, 7 cm, 10 cm → 5 &lt; 17, 7 &lt; 15, 10 &lt; 12 : triangle constructible ;</li>\n<li>Cas limite : 3 cm, 5 cm, 8 cm : 8 = 3 + 5, les points sont alignés — « triangle aplati », refusé aussi.</li>\n</ul>\n\n<h3>4. Constructions : les bons programmes</h3>\n<table>\n<tr><th>Données</th><th>Outils</th><th>Programme de construction</th></tr>\n<tr><td>3 côtés</td><td>règle + compas</td><td>[AB] tracé ; arc de centre A (rayon AC) ; arc de centre B (rayon BC) ; C = intersection</td></tr>\n<tr><td>2 angles + 1 côté</td><td>règle + rapporteur</td><td>[AB] tracé ; angle en A ; angle en B ; les deux demi-droites se coupent en C</td></tr>\n<tr><td>2 côtés + 1 angle</td><td>règle + rapporteur + compas</td><td>angle posé au sommet connu, deux reports de longueur</td></tr>\n</table>\n<div class=\"tip\"><b>Avant de construire</b>, vérifier l'inégalité triangulaire ; <b>après</b> construire, contrôler le troisième angle ou le troisième côté à la règle. Une construction sans contrôle n'est pas terminée.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'angle caché du triangle isocèle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un triangle isocèle a un angle de 110°. Trouver les deux autres. Puis refaire avec un angle de 70° : que remarque-t-on ?</div><div class=\"etu\"><b>Étape 1 — Situer le grand angle</b> : 110° est obtus. Dans un isocèle, l'angle principal (entre les deux côtés égaux) ne peut pas être... testons les deux cas.</div><div class=\"etu\"><b>Étape 2 — Cas 1 : 110° est l'angle principal</b> : les deux angles de base sont égaux : (180 − 110)/2 = 35° chacun. Vérif : 110 + 35 + 35 = 180 ✓.</div><div class=\"etu\"><b>Étape 3 — Cas 2 : 70° serait-il un angle de base ?</b> : l'autre angle de base vaut aussi 70°, et l'angle principal 180 − 140 = 40°. Vérif : 40 + 70 + 70 = 180 ✓ — solution possible aussi !</div><div class=\"etu\"><b>Étape 4 — Moralité</b> : avec « un angle de 70° », DEUX triangles isocèles existent (70-70-40 et 70-55-55). Toujours examiner les cas selon la place de l'angle donné — c'est la rigueur du géomètre.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le fils tendu entre deux arbres</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux arbres distants de 9 m. On veut accrocher une guirlande de 8 m du premier arbre à un point du second, et de 3,5 m de ce point au premier. Réalisable ?</div><div class=\"etu\"><b>Étape 1 — Modéliser</b> : triangle de côtés 9, 8 et 3,5 (le point d'accroche = sommet C).</div><div class=\"etu\"><b>Étape 2 — Tester l'inégalité triangulaire</b> : le plus grand côté est 9 : 8 + 3,5 = 11,5 &gt; 9 ✓ ; 8 &lt; 9 + 3,5 ✓ ; 3,5 &lt; 17 ✓.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : le triangle existe, l'accroche est <b>réalisable</b>.</div><div class=\"etu\"><b>Étape 4 — Et si la guirlande faisait 4 m ?</b> : 4 + 3,5 = 7,5 &lt; 9 → impossible : les deux segments n'atteignent pas l'un l'autre. L'inégalité triangulaire est un test d'existence : elle répond « possible/impossible » avant tout calcul fin.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« La somme des angles dépend du triangle » : non, 180° partout, du plus petit au plus étiré.</li>\n<li>Oublier le cas limite : 3 + 5 = 8 → points alignés, pas de triangle (inégalité STRICTE exigée).</li>\n<li>Tester seulement le plus grand côté pour l'inégalité triangulaire : en fait cela suffit (si le plus grand passe, les autres aussi) — mais tester les trois « pour être sûr » n'est jamais une erreur.</li>\n<li>Triangle isocèle : croire que l'angle donné est forcément l'angle principal — explorer les deux positions possibles.</li>\n<li>Rectangle : oublier que les deux angles aigus sont complémentaires (90° à eux deux).</li>\n</ul>\n</div>\n<h3>5. Angles et parallèles : le trio alternes-internes</h3>\n<ul>\n<li>Deux droites coupées par une sécante forment 8 angles ; quand les droites sont <b>parallèles</b>, certains sont égaux :</li>\n<li><b>alternes-internes</b> : de part et d'autre de la sécante, entre les deux droites — égaux si les droites sont parallèles ;</li>\n<li><b>correspondants</b> : même position relative aux deux droites — égaux si les droites sont parallèles ;</li>\n<li>Cette propriété, associée à la somme des angles du triangle, permet de retrouver TOUT angle d'une figure à base de parallèles : les configurations se résolvent en chaîne.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Alternes-internes\">\n  <line x1=\"40\" y1=\"40\" x2=\"400\" y2=\"40\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"40\" y1=\"105\" x2=\"400\" y2=\"105\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"140\" y1=\"15\" x2=\"240\" y2=\"135\" stroke=\"#1e293b\" stroke-width=\"2\"/>\n  <path d=\"M 175 57 A 22 22 0 0 0 183 40\" fill=\"#ef4444\" fill-opacity=\"0.4\" stroke=\"#ef4444\"/>\n  <path d=\"M 193 105 A 22 22 0 0 1 201 88\" fill=\"#ef4444\" fill-opacity=\"0.4\" stroke=\"#ef4444\"/>\n  <text x=\"255\" y=\"75\" font-size=\"12\" fill=\"#ef4444\">égaux !</text>\n  <text x=\"80\" y=\"30\" font-size=\"11\" fill=\"#4f46e5\">(d1)</text>\n  <text x=\"80\" y=\"95\" font-size=\"11\" fill=\"#4f46e5\">(d2) ∥ (d1)</text>\n  <text x=\"215\" y=\"132\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">sécante</text>\n</svg><span class=\"fig-cap\">Angles alternes-internes en rouge : dès que (d1) ∥ (d2), ils sont égaux — la base de tous les raisonnements d'angles en 5e.</span></div>\n\n<h3>6. Hauteurs, médiatrices : les droites qui aident</h3>\n<ul>\n<li>Une <b>hauteur</b> d'un triangle passe par un sommet et est perpendiculaire au côté opposé : les trois hauteurs se coupent en un même point ;</li>\n<li>La <b>médiatrice</b> d'un segment est la droite perpendiculaire au milieu de ce segment : tout point de la médiatrice est à égale distance des extrémités ;</li>\n<li>Les trois médiatrices d'un triangle se coupent au <b>cercle circonscrit</b> (le cercle passant par les trois sommets) ;</li>\n<li>Utilisation : la médiatrice sert à partager équitablement un territoire (équidistance), la hauteur à calculer des aires (base × hauteur ÷ 2).</li>\n</ul>\n<table>\n<tr><th>Droite</th><th>Définition</th><th>Propriété d'intersection</th></tr>\n<tr><td>hauteur issue de A</td><td>perpendiculaire à [BC] passant par A</td><td>les 3 hauteurs : point commun</td></tr>\n<tr><td>médiatrice de [AB]</td><td>perpendiculaire à [AB] en son milieu</td><td>les 3 médiatrices : centre du cercle circonscrit</td></tr>\n<tr><td>bissectrice</td><td>coupe un angle en deux angles égaux</td><td>les 3 bissectrices : centre du cercle inscrit</td></tr>\n</table>\n<div class=\"tip\"><b>Médiatrice = équidistance</b> : chercher un point à la fois à 5 cm de A et 5 cm de B ? Il est sur la médiatrice de [AB]. La caractérisation par les distances est souvent plus puissante que le tracé.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'angle perdu de la figure à parallèles</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans une figure, (AB) ∥ (CD), la sécante coupe (AB) en E et (CD) en F. L'angle BEF mesure 48° et le triangle BEF est isocèle en B... Que vaut l'angle EBF ?</div><div class=\"etu\"><b>Étape 1 — Alterne-interne</b> : (AB) ∥ (CD), donc l'angle EFD (alterne-interne avec BEF) vaut aussi <b>48°</b>.</div><div class=\"etu\"><b>Étape 2 — Somme des angles du triangle EBF</b> : les trois angles de BEF totalisent 180°.</div><div class=\"etu\"><b>Étape 3 — Isocèle en B</b> : les angles en E et F sont égaux : 48° chacun... mais vérifions la cohérence : 48 + 48 = 96, et l'angle EBF = 180 − 96 = <b>84°</b>.</div><div class=\"etu\"><b>Étape 4 — Contrôle croisé</b> : l'isocèle en B exigeait plutôt EB = BF (côtés), donc ce sont les angles <b>en E et en F</b> qui sont égaux ✓ — cohérent avec l'énoncé. Enchaîner alternes-internes → somme 180° → propriété d'isocèle : c'est le standard du raisonnement géométrique complet.</div></div></details>\n"
  },

    "niveau": "5e",
    "titre": "Parallélogrammes et quadrilatères",
    "cours": "<div class=\"cours-head\"><h2>Parallélogrammes et quadrilatères particuliers</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le parallélogramme : la figure qui glisse</h3>\n<ul>\n<li>Définition : un quadrilatère dont les côtés opposés sont <b>parallèles</b> deux à deux ;</li>\n<li>C'est un rectangle qu'on aurait « poussé » en biais : les côtés gardent leurs longueurs, mais les angles perdent leurs 90° ;</li>\n<li>On le rencontre partout : losanges du jeu de cartes, bras articulés d'un essuie-glace, pantographs, tables à repasser pliantes.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Parallelogramme pousse depuis un rectangle\">\n  <rect x=\"30\" y=\"30\" width=\"120\" height=\"80\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-dasharray=\"6,4\"/>\n  <path d=\"M 200 110 L 330 110 L 380 30 L 250 30 Z\" fill=\"#eef2ff\" fill-opacity=\"0.6\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <path d=\"M 150 70 L 200 70\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <text x=\"175\" y=\"60\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\">on pousse</text>\n  <text x=\"265\" y=\"125\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">côtés opposés parallèles ET de même longueur</text>\n  <line x1=\"265\" y1=\"110\" x2=\"325\" y2=\"110\" stroke=\"#16a34a\" stroke-width=\"3\"/>\n  <line x1=\"250\" y1=\"30\" x2=\"310\" y2=\"30\" stroke=\"#16a34a\" stroke-width=\"3\"/>\n</svg><span class=\"fig-cap\">Le rectangle (en pointillé gris) devient parallélogramme quand on le « pousse » : les côtés restent parallèles et égaux deux à deux, les angles cessent d'être droits.</span></div>\n\n<h3>2. Les propriétés du parallélogramme</h3>\n<table>\n<tr><th>Élément</th><th>Propriété</th><th>Conséquence pratique</th></tr>\n<tr><td>côtés opposés</td><td>parallèles et de même longueur</td><td>AB = CD et AD = BC</td></tr>\n<tr><td>angles opposés</td><td>de même mesure</td><td>angle A = angle C</td></tr>\n<tr><td>angles consécutifs</td><td>supplémentaires (somme 180°)</td><td>angle A + angle B = 180°</td></tr>\n<tr><td>diagonales</td><td>se coupent en leur MILIEU</td><td>le point d'intersection est le centre de symétrie</td></tr>\n</table>\n<div class=\"tip\"><b>Centre de symétrie</b> : l'intersection des diagonales. Le parallélogramme a un centre de symétrie, mais PAS d'axe de symétrie (sauf s'il est rectangle, losange ou carré).</div>\n\n<h3>3. La hiérarchie des quadrilatères</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Arbre des quadrilateres\">\n  <rect x=\"170\" y=\"15\" width=\"90\" height=\"26\" rx=\"6\" fill=\"#4f46e5\"/>\n  <text x=\"215\" y=\"33\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">Quadrilatère</text>\n  <rect x=\"170\" y=\"55\" width=\"90\" height=\"26\" rx=\"6\" fill=\"#4f46e5\" fill-opacity=\"0.85\"/>\n  <text x=\"215\" y=\"73\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">Parallélogramme</text>\n  <rect x=\"40\" y=\"95\" width=\"90\" height=\"26\" rx=\"6\" fill=\"#16a34a\" fill-opacity=\"0.85\"/>\n  <text x=\"85\" y=\"113\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">Rectangle</text>\n  <rect x=\"170\" y=\"95\" width=\"90\" height=\"26\" rx=\"6\" fill=\"#f59e0b\" fill-opacity=\"0.9\"/>\n  <text x=\"215\" y=\"113\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">Losange</text>\n  <rect x=\"300\" y=\"95\" width=\"90\" height=\"26\" rx=\"6\" fill=\"#64748b\"/>\n  <text x=\"345\" y=\"113\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">trapèze*</text>\n  <rect x=\"170\" y=\"130\" width=\"90\" height=\"20\" rx=\"6\" fill=\"#ef4444\"/>\n  <text x=\"215\" y=\"145\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">Carré</text>\n  <line x1=\"215\" y1=\"41\" x2=\"215\" y2=\"55\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <line x1=\"215\" y1=\"81\" x2=\"85\" y2=\"95\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <line x1=\"215\" y1=\"81\" x2=\"215\" y2=\"95\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <line x1=\"215\" y1=\"81\" x2=\"345\" y2=\"95\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"85\" y1=\"121\" x2=\"180\" y2=\"130\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n  <line x1=\"215\" y1=\"121\" x2=\"215\" y2=\"130\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n</svg><span class=\"fig-cap\">Le carré descend du rectangle ET du losange. Le trapèze (un seul couple de côtés parallèles) n'est pas un parallélogramme.</span></div>\n<ul>\n<li><b>Rectangle</b> = parallélogramme + un angle droit (les 4 suivent) ; diagonales de même longueur ;</li>\n<li><b>Losange</b> = parallélogramme + 2 côtés consécutifs égaux (les 4 suivent) ; diagonales perpendiculaires ;</li>\n<li><b>Carré</b> = rectangle + losange : 4 côtés égaux ET 4 angles droits.</li>\n</ul>\n\n<h3>4. Reconnaître un parallélogramme : les tests</h3>\n<ul>\n<li>Test 1 : côtés opposés <b>parallèles</b> deux à deux ;</li>\n<li>Test 2 : côtés opposés de <b>même longueur</b> deux à deux ;</li>\n<li>Test 3 : diagonales qui se coupent en leur <b>milieu</b> ;</li>\n<li>Test 4 : deux côtés opposés à la fois <b>parallèles et égaux</b> ;</li>\n<li>Un seul test suffit pour affirmer « c'est un parallélogramme » — mais énoncer lequel, sinon la preuve est incomplète.</li>\n</ul>\n\n<h3>5. Aires et périmètres des quadrilatères</h3>\n<table>\n<tr><th>Figure</th><th>Aire</th><th>Détail</th></tr>\n<tr><td>parallélogramme</td><td>base × hauteur</td><td>la hauteur est perpendiculaire à la base choisie</td></tr>\n<tr><td>rectangle</td><td>L × ℓ</td><td>cas particulier : hauteur = côté</td></tr>\n<tr><td>losange</td><td>(grande diagonale × petite) ÷ 2</td><td>les diagonales se coupent à angle droit</td></tr>\n<tr><td>trapèze</td><td>(petite base + grande base) × h ÷ 2</td><td>moyenne des bases × hauteur</td></tr>\n<tr><td>carré</td><td>c²</td><td>—</td></tr>\n</table>\n<div class=\"tip\"><b>Parallélogramme → rectangle</b> : en découpant le triangle qui dépasse à droite et en le recollant à gauche, le parallélogramme devient un rectangle de même aire : c'est la preuve de la formule base × hauteur.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — identifier la figure mystère</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Quadrilatère ABCD : diagonales [AC] et [BD] de même longueur 10 cm, se coupant perpendiculairement en leur milieu. Quelle est la figure ?</div><div class=\"etu\"><b>Étape 1 — Diagonales se coupant en leur milieu</b> : c'est un <b>parallélogramme</b> (test 3 validé).</div><div class=\"etu\"><b>Étape 2 — Diagonales de même longueur</b> : le parallélogramme est alors un <b>rectangle</b>.</div><div class=\"etu\"><b>Étape 3 — Diagonales perpendiculaires</b> : le parallélogramme est alors un <b>losange</b>.</div><div class=\"etu\"><b>Étape 4 — Cumul</b> : rectangle ET losange → <b>carré</b>. Ses diagonales valent 10 cm : côté = 10 ÷ √2 ≈ 7,07 cm, aire ≈ 50 cm². On vérifie : dans un carré, aire = d²/2 = 100/2 = 50 ✓ — le triangle rectangle isocèle formé par une demi-diagonale est un ami fidèle.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'aire qui résiste</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un losange a des diagonales de 12 cm et 7 cm. Périmètre et aire ? Et un parallélogramme de base 9 cm et hauteur 4 cm ?</div><div class=\"etu\"><b>Étape 1 — Aire du losange</b> : (12 × 7)/2 = <b>42 cm²</b> — la formule des diagonales, rien d'autre.</div><div class=\"etu\"><b>Étape 2 — Côté du losange</b> : les diagonales se coupent en leur milieu à angle droit → demi-diagonales 6 et 3,5 ; côté = √(6² + 3,5²) = √(36 + 12,25) = √48,25 ≈ 6,95 cm (Pythagore arrive en 4e : ici on l'utilise en avant-première).</div><div class=\"etu\"><b>Étape 3 — Périmètre du losange</b> : 4 × 6,95 ≈ <b>27,8 cm</b>.</div><div class=\"etu\"><b>Étape 4 — Parallélogramme</b> : aire = 9 × 4 = <b>36 cm²</b> — sans rien savoir des côtés obliques ! Base × hauteur suffit : la hauteur « redresse » mentalement la figure en rectangle.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>« Un parallélogramme a des axes de symétrie » : non — un centre seulement ; les axes arrivent avec rectangle (2), losange (2), carré (4).</li>\n<li>Confondre trapèze et parallélogramme : le trapèze n'a qu'UN couple de côtés parallèles.</li>\n<li>Aire du parallélogramme = produit de deux côtés adjacents : FAUX — base × <b>hauteur</b> (perpendiculaire !).</li>\n<li>« Les diagonales du parallélogramme sont égales » : seulement dans le rectangle ; dans le losange, elles sont perpendiculaires mais pas égales.</li>\n<li>Utiliser la formule du losange (diagonales) pour un parallélogramme quelconque : elle exige des diagonales perpendiculaires.</li>\n</ul>\n</div>\n<h3>6. Aires : la preuve par découpage</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 430 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Decoupage du parallelogramme en rectangle\">\n  <path d=\"M 40 95 L 175 95 L 215 35 L 80 35 Z\" fill=\"#eef2ff\" fill-opacity=\"0.6\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <path d=\"M 40 95 L 40 35 L 80 35 L 40 95\" fill=\"#4f46e5\" fill-opacity=\"0.5\"/>\n  <path d=\"M 175 95 L 175 35 L 215 35 L 175 95\" fill=\"#4f46e5\" fill-opacity=\"0.5\" stroke=\"#4f46e5\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <path d=\"M 250 95 L 385 95 L 385 35 L 250 35 Z\" fill=\"#dcfce7\" fill-opacity=\"0.6\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <text x=\"107\" y=\"115\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">parallélogramme base × h</text>\n  <text x=\"317\" y=\"115\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">rectangle obtenu (triangle déplacé)</text>\n  <path d=\"M 220 65 L 242 65\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <path d=\"M 238 61 L 245 65 L 238 69\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n</svg><span class=\"fig-cap\">Le triangle de gauche découpé et recollé à droite transforme le parallélogramme en rectangle de mêmes base et hauteur : aire = base × hauteur, preuve à l'appui.</span></div>\n<ul>\n<li>Le parallélogramme et le rectangle de même base et même hauteur ont la <b>même aire</b> : c'est le sens profond de la formule ;</li>\n<li>Conséquence : deux parallélogrammes de même base et hauteur situés différemment sur la page ont des aires identiques — l'aire ne dépend pas de l'« inclinaison ».</li>\n</ul>\n\n<h3>7. Constructions au programme</h3>\n<ol>\n<li><b>Avec 3 sommets</b> : placer A, B, C ; le quadrilatère ABCD est un parallélogramme, donc D = A + (C − B) : reporter au compas AD = BC et CD = AB (deux arcs) ;</li>\n<li><b>Avec le centre</b> : le centre de symétrie est le milieu des diagonales — placer A et C opposés, puis B, et construire D comme le symétrique de B par rapport au centre ;</li>\n<li><b>Contrôle obligatoire</b> : mesurer les côtés opposés (égaux ?) et vérifier le parallélisme à l'équerre ;</li>\n<li>Les quadrilatères particuliers se construisent comme le parallélogramme + leur condition : angle droit (équerre) pour le rectangle, côtés égaux (compas) pour le losange.</li>\n</ol>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — construire le parallélogramme à trois sommets</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Placer A(0 ; 0), B(5 ; 0), C(6 ; 3) dans un repère. Construire D pour que ABCD soit un parallélogramme, et lire ses coordonnées.</div><div class=\"etu\"><b>Étape 1 — Propriété vectorielle en langage simple</b> : dans un parallélogramme, « aller de A à B » = « aller de D à C » : les côtés opposés sont parallèles et égaux.</div><div class=\"etu\"><b>Étape 2 — Décalage</b> : de A à B, on avance de 5 et on monte de 0. Donc de D à C, même déplacement : en partant de C, revenir de (−5 ; 0) → D = (6 − 5 ; 3 − 0) = (1 ; 3).</div><div class=\"etu\"><b>Étape 3 — Autre chemin</b> : « de B à C » = avancer de 1, monter de 3 ; donc « de A à D » pareille : D = (0+1 ; 0+3) = (1 ; 3) ✓ — les deux chemins coïncident, c'est la signature du parallélogramme.</div><div class=\"etu\"><b>Étape 4 — Contrôle</b> : milieu de [AC] = (3 ; 1,5) ; milieu de [BD] = ((5+1)/2 ; 3/2) = (3 ; 1,5) ✓ — les diagonales ont le même milieu : la figure est validée par la propriété 3.</div></div></details>\n"
  },

    "titre": "Statistiques : organisation et lecture de données",
    "cours": "<div class=\"cours-head\"><h2>Statistiques : organisation et lecture de données</h2><span class=\"niv\">5e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Collecter et organiser : le point de départ</h3>\n<ul>\n<li>Une <b>statistique</b> résume une série de <b>données</b> : notes d'une classe, tailles des élèves, buts marqués par match ;</li>\n<li>Les données brutes en vrac sont illisibles : on les organise dans un <b>tableau d'effectifs</b> (valeur → nombre de fois où elle apparaît) ;</li>\n<li>Le caractère étudié peut être <b>quantitatif</b> (une mesure : taille, note) ou <b>qualitatif</b> (une catégorie : sport préféré, couleur) ;</li>\n<li>L'<b>effectif total</b> est la somme des effectifs : c'est le nombre de données collectées.</li>\n</ul>\n<div class=\"ex\"><b>Exemple :</b> notes d'un contrôle : 12 ; 15 ; 8 ; 12 ; 10 ; 15 ; 12 ; 9 ; 15 ; 10. En vrac : illisible. En tableau : 8→1, 9→1, 10→2, 12→3, 15→3, total 10 données. La structure jaillit.</div>\n\n<h3>2. Les représentations graphiques : choisir la bonne</h3>\n<table>\n<tr><th>Digramme</th><th>Idéal pour...</th><th>Lecture clé</th></tr>\n<tr><td>en barres (ou bâtons)</td><td>comparer des effectifs par valeur</td><td>la hauteur = l'effectif</td></tr>\n<tr><td>circulaire (camembert)</td><td>montrer des parts d'un tout</td><td>angle = fréquence × 360°</td></tr>\n<tr><td>graphique cartésien</td><td>suivre une évolution dans le temps</td><td>courbe qui monte/descend</td></tr>\n<tr><td>tableau</td><td>donner les valeurs exactes</td><td>précision maximale</td></tr>\n</table>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Diagramme en barres notes\">\n  <line x1=\"40\" y1=\"120\" x2=\"400\" y2=\"120\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"120\" x2=\"40\" y2=\"20\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <rect x=\"60\" y=\"100\" width=\"30\" height=\"20\" fill=\"#4f46e5\"/>\n  <rect x=\"120\" y=\"100\" width=\"30\" height=\"20\" fill=\"#4f46e5\"/>\n  <rect x=\"180\" y=\"80\" width=\"30\" height=\"40\" fill=\"#4f46e5\"/>\n  <rect x=\"240\" y=\"40\" width=\"30\" height=\"80\" fill=\"#4f46e5\"/>\n  <rect x=\"300\" y=\"40\" width=\"30\" height=\"80\" fill=\"#4f46e5\"/>\n  <text x=\"75\" y=\"135\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">8</text>\n  <text x=\"135\" y=\"135\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">9</text>\n  <text x=\"195\" y=\"135\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">10</text>\n  <text x=\"255\" y=\"135\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">12</text>\n  <text x=\"315\" y=\"135\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">15</text>\n  <text x=\"30\" y=\"105\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"end\">1</text>\n  <text x=\"30\" y=\"45\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"end\">4</text>\n  <text x=\"220\" y=\"15\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">Notes du contrôle : 12 et 15 sont les modes</text>\n</svg><span class=\"fig-cap\">Diagramme en barres des effectifs : chaque barre part de zéro et sa hauteur correspond au nombre d'élèves. Les barres de même hauteur signalent les valeurs les plus fréquentes.</span></div>\n\n<h3>3. Moyenne : répartir équitablement</h3>\n<div class=\"tip\"><b>Moyenne = somme des valeurs ÷ effectif total.</b> C'est la valeur que tous auraient s'ils étaient tous égaux : on rassemble tout, puis on redistribue équitablement.</div>\n<ul>\n<li>Avec le tableau, la moyenne se calcule en comptant chaque valeur autant de fois que son effectif : (8×1 + 9×1 + 10×2 + 12×3 + 15×3)/10 = 111/10 = <b>11,1</b> ;</li>\n<li>La moyenne est <b>sensible aux valeurs extrêmes</b> : un 0 ou un 20 tire la moyenne vers lui ;</li>\n<li>Moyenne de vitesse : si on va à 60 km/h à l'aller et 80 km/h au retour (même distance), la moyenne n'est PAS 70 : c'est la moyenne « harmonique », piège célèbre (2×60×80/140 ≈ 68,6 km/h).</li>\n</ul>\n\n<h3>4. Médiane : couper la série en deux</h3>\n<ul>\n<li>La <b>médiane</b> est la valeur qui partage la série ordonnée en deux moitiés d'effectif égal : autant en dessous qu'au-dessus ;</li>\n<li>Méthode : <b>ordonner</b> les valeurs, puis couper au milieu ;</li>\n<li>Effectif impair : la médiane est la valeur centrale ; effectif pair : la médiane est la moyenne des deux valeurs centrales ;</li>\n<li>Notes ordonnées : 8 ; 9 ; 10 ; 10 ; 12 ; 12 ; 12 ; 15 ; 15 ; 15 → médiane = (12 + 12)/2 = <b>12</b> ;</li>\n<li>La médiane <b>résiste</b> aux extrêmes : un élève très faible ne fait pas baisser la médiane de la classe.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 110\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Moyenne vs mediane\">\n  <line x1=\"30\" y1=\"60\" x2=\"400\" y2=\"60\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <circle cx=\"80\" cy=\"60\" r=\"4\" fill=\"#64748b\"/><circle cx=\"110\" cy=\"60\" r=\"4\" fill=\"#64748b\"/><circle cx=\"140\" cy=\"60\" r=\"4\" fill=\"#64748b\"/>\n  <circle cx=\"170\" cy=\"60\" r=\"4\" fill=\"#64748b\"/><circle cx=\"200\" cy=\"60\" r=\"5\" fill=\"#16a34a\"/><circle cx=\"230\" cy=\"60\" r=\"4\" fill=\"#64748b\"/>\n  <circle cx=\"260\" cy=\"60\" r=\"4\" fill=\"#64748b\"/><circle cx=\"290\" cy=\"60\" r=\"4\" fill=\"#64748b\"/><circle cx=\"320\" cy=\"60\" r=\"4\" fill=\"#64748b\"/>\n  <circle cx=\"390\" cy=\"60\" r=\"6\" fill=\"#ef4444\"/>\n  <text x=\"200\" y=\"85\" font-size=\"12\" fill=\"#16a34a\" text-anchor=\"middle\">médiane</text>\n  <text x=\"260\" y=\"35\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">moyenne tirée</text>\n  <text x=\"260\" y=\"50\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">par la valeur extrême</text>\n  <text x=\"385\" y=\"40\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\">outlier</text>\n</svg><span class=\"fig-cap\">Une valeur extrême (rouge) attire la moyenne à droite, mais laisse la médiane (verte) en place : la médiane est robuste, la moyenne est informative mais fragile.</span></div>\n\n<h3>5. Fréquences et pourcentages</h3>\n<ul>\n<li><b>Fréquence</b> = effectif ÷ effectif total : elle s'exprime en fraction, décimal (0,3) ou pourcentage (30 %) ;</li>\n<li>La somme des fréquences vaut toujours 1 (ou 100 %) — test de contrôle obligatoire ;</li>\n<li>Fréquence → angle de camembert : fréquence × 360° ;</li>\n<li>Exemple : 3 élèves sur 10 ont eu 15 → fréquence 0,3 = 30 % = 108° dans le camembert.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le match moyenne vs médiane</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans une entreprise de 9 personnes, les salaires mensuels (en k€) : 1,5 ; 1,6 ; 1,7 ; 1,7 ; 1,8 ; 1,8 ; 1,9 ; 2,0 ; 12. Calculer moyenne et médiane. Le patron dit « salaire moyen 2,78 k€ » : honnête ?</div><div class=\"etu\"><b>Étape 1 — Moyenne</b> : somme = 1,5+1,6+1,7+1,7+1,8+1,8+1,9+2,0+12 = 26 k€ ; 26/9 ≈ <b>2,89 k€</b>.</div><div class=\"etu\"><b>Étape 2 — Médiane</b> : série déjà ordonnée, 9 valeurs (impair) → 5e valeur = <b>1,8 k€</b>.</div><div class=\"etu\"><b>Étape 3 — Comparer</b> : 7 employés sur 9 gagnent moins que la « moyenne » : le très gros salaire (12) a tout décalé vers le haut.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : la phrase est mathématiquement exacte mais <b>trompeuse</b> : la médiane (1,8 k€) décrit mieux le salaire typique. Quand un chiffre « paraît trop beau », demander la médiane — réflexe de citoyen statistiquement averti.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — construire le camembert du sport</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sport préféré de 24 élèves : foot 12, basket 6, tennis 4, natation 2. Calculer les fréquences, les angles, et vérifier la cohérence.</div><div class=\"etu\"><b>Étape 1 — Fréquences</b> : 12/24 = 50 % ; 6/24 = 25 % ; 4/24 ≈ 16,7 % ; 2/24 ≈ 8,3 %. Somme = 100 % ✓.</div><div class=\"etu\"><b>Étape 2 — Angles</b> : 50 % → 180° ; 25 % → 90° ; 16,7 % → 60° ; 8,3 % → 30°.</div><div class=\"etu\"><b>Étape 3 — Contrôle</b> : 180 + 90 + 60 + 30 = 360° ✓ — le tour est complet, la construction est validée.</div><div class=\"etu\"><b>Étape 4 — Astuce des quarts</b> : repérer 25 % = un quart du disque (90°) aide à dessiner à l'économie : foot = 2 quarts, basket = 1 quart, le reste se partage mentalement. Un diagramme bien construit se lit sans calculs.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Calculer la moyenne sans ordonner... c'est permis ! Mais la médiane exige ABSOLUMENT la série ordonnée d'abord.</li>\n<li>Effectif pair : oublier de faire la moyenne des deux valeurs centrales.</li>\n<li>Croire que moyenne et médiane coïncident toujours : elles divergent dès qu'une valeur extrême existe.</li>\n<li>Angles du camembert : sommer les fréquences (100 %) au lieu des angles (360°) — les deux contrôles sont séparés.</li>\n<li>« Le diagramme en barres ne part pas de zéro » : une barre tronquée (hauteur coupée) exagère visuellement les différences — toujours vérifier l'axe vertical.</li>\n</ul>\n</div>\n<h3>6. L'effectif cumulé : voir le « combien au moins »</h3>\n<ul>\n<li>Les <b>effectifs cumulés croissants</b> répondent à « combien de valeurs en dessous de ... ? » ;</li>\n<li>Notes : 8→1 ; 9→1 ; 10→2 ; 12→3 ; 15→3. Cumulés : 8→1 ; 9→2 ; 10→4 ; 12→7 ; 15→10 ;</li>\n<li>Lecture : « 7 élèves ont eu 12 ou moins » ; « 4 élèves ont eu moins de 12 » ;</li>\n<li>Les cumulés servent pour les seuils : combien d'élèves ont la moyenne ? Combien de pièces dépassent la norme ?</li>\n</ul>\n<table>\n<tr><th>Note</th><th>Effectif</th><th>Cumul croissant</th><th>Lecture</th></tr>\n<tr><td>8</td><td>1</td><td>1</td><td>1 élève à 8 ou moins</td></tr>\n<tr><td>9</td><td>1</td><td>2</td><td>2 élèves à 9 ou moins</td></tr>\n<tr><td>10</td><td>2</td><td>4</td><td>4 élèves à 10 ou moins</td></tr>\n<tr><td>12</td><td>3</td><td>7</td><td>7 élèves à 12 ou moins</td></tr>\n<tr><td>15</td><td>3</td><td>10</td><td>tous les 10 élèves</td></tr>\n</table>\n\n<h3>7. L'esprit critique : interroger les chiffres</h3>\n<ul>\n<li>Qui a collecté les données, comment, sur quel échantillon ? Un sondage auprès de 10 personnes ne dit rien sur des millions ;</li>\n<li>Un graphique peut mentir par ses <b>axes</b> : échelle tronquée, absente, ou ne commençant pas à zéro pour les barres ;</li>\n<li>Une moyenne sans contexte est muette : moyenne de 11,1 mais est-ce homogène (tous entre 8 et 15) ou polarisé (des 0 et des 20) ? ;</li>\n<li>Corrélation n'est pas cause : les ventes de glaces et les noyades montent ensemble en été — l'une ne cause pas l'autre, la chaleur cause les deux !</li>\n</ul>\n<div class=\"tip\"><b>Réflexe du lecteur averti</b> : devant un chiffre choc, toujours demander (1) l'effectif, (2) la médiane à côté de la moyenne, (3) l'axe du graphique. Trois questions, et la plupart des manipulations s'effondrent.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le graphique qui exagère</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Deux graphiques montrent la même série : ventes de 100 à 110 (en milliers d'euros) sur un an. Le premier axe va de 0 à 120, le second de 95 à 112. Pourquoi le second semble-t-il spectaculaire ?</div><div class=\"etu\"><b>Étape 1 — Analyser l'écart d'échelle</b> : de 0 à 120, la variation de 100 à 110 occupe 10/120 ≈ 8 % de la hauteur : quasi plate.</div><div class=\"etu\"><b>Étape 2 — Seconde échelle</b> : de 95 à 112 (17 d'amplitude), la même variation occupe 10/17 ≈ 59 % de la hauteur : la courbe semble s'envoler.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : mêmes données, impressions opposées — l'axe pilote l'émotion.</div><div class=\"etu\"><b>Étape 4 — Se protéger</b> : toujours lire les graduations d'un graphique avant d'en croire la « pente ». Un diagramme en barres doit partir de zéro ; une courbe d'évolution peut être tronquée mais doit l'annoncer. L'esprit critique statistique commence par la lecture des axes.</div></div></details>\n"
  },

    "titre": "Ensembles de nombres (N, Z, Q, R) et calcul littéral",
    "cours": "<div class=\"cours-head\"><h2>Ensembles de nombres (N, Z, Q, R) et calcul littéral</h2><span class=\"niv\">2de</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les ensembles emboîtés : N ⊂ Z ⊂ Q ⊂ R</h3>\n<ul>\n<li><b>N</b> (naturels) : 0, 1, 2, 3... — les nombres du comptage ;</li>\n<li><b>Z</b> (entiers relatifs) : ..., −2, −1, 0, 1, 2... — les naturels munis du signe ;</li>\n<li><b>Q</b> (rationnels) : tous les quotients a/b (b ≠ 0) — 3/4, −7/2, 0,125 = 1/8 ;</li>\n<li><b>R</b> (réels) : toute la droite graduée — Q plus les irrationnels (√2, π, e) ;</li>\n<li>Chaque ensemble est <b>inclus</b> dans le suivant : un naturel est un relatif, qui est un rationnel, qui est un réel : N ⊂ Z ⊂ Q ⊂ R.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ensembles emboites N Z Q R\">\n  <ellipse cx=\"215\" cy=\"75\" rx=\"200\" ry=\"65\" fill=\"#f8fafc\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <ellipse cx=\"215\" cy=\"80\" rx=\"160\" ry=\"50\" fill=\"#e2e8f0\" fill-opacity=\"0.6\" stroke=\"#64748b\" stroke-width=\"2\"/>\n  <ellipse cx=\"215\" cy=\"85\" rx=\"115\" ry=\"36\" fill=\"#cbd5e1\" fill-opacity=\"0.6\" stroke=\"#475569\" stroke-width=\"2\"/>\n  <ellipse cx=\"215\" cy=\"90\" rx=\"70\" ry=\"22\" fill=\"#94a3b8\" fill-opacity=\"0.6\" stroke=\"#1e293b\" stroke-width=\"2\"/>\n  <text x=\"215\" y=\"95\" font-size=\"13\" fill=\"#1e293b\" text-anchor=\"middle\" font-weight=\"bold\">N</text>\n  <text x=\"215\" y=\"62\" font-size=\"13\" fill=\"#1e293b\" text-anchor=\"middle\" font-weight=\"bold\">Z</text>\n  <text x=\"215\" y=\"38\" font-size=\"13\" fill=\"#1e293b\" text-anchor=\"middle\" font-weight=\"bold\">Q</text>\n  <text x=\"215\" y=\"14\" font-size=\"13\" fill=\"#1e293b\" text-anchor=\"middle\" font-weight=\"bold\">R</text>\n  <text x=\"385\" y=\"70\" font-size=\"12\" fill=\"#ef4444\">√2, π ∉ Q</text>\n</svg><span class=\"fig-cap\">Emboîtement des ensembles : les irrationnels (√2, π) vivent dans R mais pas dans Q — la découverte de √2 a mis fin à la croyance « tout est quotient d'entiers ».</span></div>\n\n<h3>2. Reconnaître le plus petit ensemble d'un nombre</h3>\n<table>\n<tr><th>Nombre</th><th>Le plus petit ensemble</th><th>Pourquoi</th></tr>\n<tr><td>−7</td><td>Z</td><td>entier négatif : pas dans N</td></tr>\n<tr><td>3/4 = 0,75</td><td>Q</td><td>quotient exact, pas entier</td></tr>\n<tr><td>0,333... (= 1/3)</td><td>Q</td><td>développement périodique → quotient</td></tr>\n<tr><td>√16</td><td>N</td><td>= 4 : se simplifie en naturel</td></tr>\n<tr><td>√2</td><td>R</td><td>irrationnel (preuve par l'absurde)</td></tr>\n<tr><td>π</td><td>R</td><td>irrationnel, et même transcendant</td></tr>\n<tr><td>4,25</td><td>Q</td><td>= 17/4</td></tr>\n</table>\n<ul>\n<li>Piège classique : √9 = 3 ∈ N — toujours <b>simplifier</b> avant de classer ;</li>\n<li>Un décimal est un rationnel particulier (dénominateur en puissance de 10) : Q les contient tous ;</li>\n<li>Périodicité = quotient : 0,272727... = 27/99 = 3/11 — astuce de la lettre x multipliée par 100.</li>\n</ul>\n\n<h3>3. Calcul littéral : développer et réduire</h3>\n<ul>\n<li>Développer : (x+2)(x−5) = x² − 5x + 2x − 10 = <b>x² − 3x − 10</b> ;</li>\n<li>Identités remarquables : (a+b)² = a² + 2ab + b² ; (a−b)² = a² − 2ab + b² ; (a−b)(a+b) = a² − b² ;</li>\n<li>Réduire : 3x² − x + 2x² + 4x = 5x² + 3x — regrouper par puissances de x ;</li>\n<li>Suppression de parenthèses : −(x² − 3x) = −x² + 3x — le signe moins <b>inverse tous les termes</b>.</li>\n</ul>\n<div class=\"tip\"><b>Les trois identités, version 2de</b> : elles servent autant au développement ((2x+3)² = 4x² + 12x + 9) qu'à la factorisation (x² − 49 = (x−7)(x+7)). Les connaître dans les deux sens est le premier réflexe de l'année.</div>\n\n<h3>4. Équations et inéquations produit-quotient</h3>\n<ul>\n<li>Équation : (x−1)(x+4) = 0 → x = 1 ou x = −4 (produit nul) ;</li>\n<li>Inéquation produit : étudier le <b>signe de chaque facteur</b> dans un tableau, lire le signe du produit, conclure ;</li>\n<li>Inéquation quotient : idem mais la valeur qui annule le dénominateur est <b>interdite</b> (double barre) ;</li>\n<li>Règles des signes : (−)(+) = −, (−)(−) = + ; par exemple (x−1)/(x+4) &gt; 0 sur ]−∞ ; −4[ ∪ ]1 ; +∞[.</li>\n</ul>\n<table>\n<tr><th>x</th><th>−∞ ... −4</th><th>−4</th><th>−4 ... 1</th><th>1</th><th>1 ... +∞</th></tr>\n<tr><td>x−1</td><td>−</td><td>−</td><td>−</td><td>0</td><td>+</td></tr>\n<tr><td>x+4</td><td>−</td><td>0</td><td>+</td><td>+</td><td>+</td></tr>\n<tr><td>quotient</td><td>+</td><td>∥</td><td>−</td><td>0</td><td>+</td></tr>\n</table>\n<ul>\n<li>La double barre ∥ signale la valeur interdite : jamais de solution là ;</li>\n<li>L'ensemble des solutions s'écrit avec des intervalles : union, intersection, crochets ouverts/fermés ;</li>\n<li>A ∩ B = éléments dans les deux ; A ∪ B = dans l'un au moins : ne pas confondre « et » (∩) et « ou » (∪).</li>\n</ul>\n\n<h3>5. Intervalles et valeur absolue</h3>\n<ul>\n<li>Notations : [2 ; 5] (fermé, bornes comprises), ]2 ; 5[ (ouvert), [2 ; +∞[ ;</li>\n<li>Intersection : [0 ; 6] ∩ ]3 ; 8] = ]3 ; 6] ; union : [0 ; 2] ∪ [5 ; 7] (deux morceaux) ;</li>\n<li><b>Encadrement</b> : si 2,7 &lt; π &lt; 2,8, on dit que 2,7 est une valeur approchée par défaut, 2,8 par excès ;</li>\n<li>Valeur absolue : |x| = distance à zéro ; |x − a| = distance de x à a : |x − 3| ≤ 2 signifie « x est à moins de 2 de 3 » → x ∈ [1 ; 5] ;</li>\n<li>L'inégalité |x − a| &lt; r décrit toujours l'intervalle ouvert ]a − r ; a + r[ : centre et rayon.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — π est-il rationnel ? L'arnaque de 22/7</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> 1) Montrer que 0,181818... (période 18) est rationnel. 2) Le célèbre 22/7 ≈ 3,1428 est-il égal à π ? 3) À quoi sert alors une valeur approchée ?</div><div class=\"etu\"><b>Étape 1 — Nombre périodique</b> : x = 0,181818... → 100x = 18,1818... → 100x − x = 18 → 99x = 18 → x = 18/99 = 2/11 : quotient d'entiers, donc rationnel.</div><div class=\"etu\"><b>Étape 2 — Tester 22/7</b> : π ≈ 3,14159 et 22/7 ≈ 3,14285 : les décimales divergent dès la 3e : π ≠ 22/7 — c'est une <b>approximation</b> commode, pas une égalité.</div><div class=\"etu\"><b>Étape 3 — Irrationalité de π</b> : prouvée par Lambert (1761) : π n'est le quotient d'aucun couple d'entiers — il vit dans R \\ Q, comme √2.</div><div class=\"etu\"><b>Étape 4 — Usage des approximations</b> : en ingénierie, on encadre : 3,14 &lt; π &lt; 3,15 suffit pour un terrassement ; la NASA utilise 15 décimales pour interplanétaire. L'encadrement, c'est la rigueur pratiquée.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — tableau de signes complet d'un quotient</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre (2x − 6)/(x + 1) ≥ 0, puis (2x − 6)/(x + 1) &gt; 0. Quelle différence entre ≥ et &gt; ici ?</div><div class=\"etu\"><b>Étape 1 — Valeurs charnières</b> : 2x − 6 = 0 → x = 3 ; x + 1 = 0 → x = −1 (interdit).</div><div class=\"etu\"><b>Étape 2 — Tableau</b> : x−1... placer les signes : (2x−6) : − avant 3, + après ; (x+1) : − avant −1, + après ; quotient : + sur ]−∞ ; −1[, − sur ]−1 ; 3], + sur ]3 ; +∞[.</div><div class=\"etu\"><b>Étape 3 — Avec l'égalité (≥)</b> : solutions S = ]−∞ ; −1[ ∪ [3 ; +∞[ : le 3 est inclus (numérateur nul), le −1 jamais.</div><div class=\"etu\"><b>Étape 4 — Sans l'égalité (&gt;)</b> : S = ]−∞ ; −1[ ∪ ]3 ; +∞[ : un seul crochet change. Toute la rigueur de la 2de tient dans ces crochets : les relire deux fois avant de conclure.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Classer √25 dans R : non, √25 = 5 ∈ N — simplifier d'abord.</li>\n<li>Croire que tous les réels sont des décimaux : 1/3 = 0,333... n'est pas décimal (période infinie).</li>\n<li>−(x² − 3x) = −x² − 3x : le moins distribue sur TOUT : −x² + 3x.</li>\n<li>Oublier la double barre pour les quotients : la valeur interdite n'est jamais solution.</li>\n<li>Confondre A ∩ B et A ∪ B : « et » restreint, « ou » élargit.</li>\n</ul>\n</div>\n\n<h3>6. Approximations décimales et troncature</h3>\n<ul>\n<li><b>Troncature</b> à 2 décimales de π = 3,14 : on coupe (3,14159 → 3,14) ;</li>\n<li><b>Arrondi</b> à 2 décimales : on regarde la 3e décimale (1 &lt; 5) : 3,14 ; pour 2,718 → 2,72 ;</li>\n<li>Valeur approchée par défaut/excès : 3,14 &lt; π &lt; 3,15 : encadrement d'amplitude 0,01 ;</li>\n<li>Doubler la précision demande souvent bien plus de calcul : le choix de la précision est un <b>choix d'ingénieur</b> (tolérances de fabrication, arrondis bancaires, arrondi des notes).</li>\n</ul>\n<table>\n<tr><th>Nombre</th><th>Troncature 10⁻²</th><th>Arrondi 10⁻²</th><th>Encadrement</th></tr>\n<tr><td>π</td><td>3,14</td><td>3,14</td><td>3,14 &lt; π &lt; 3,15</td></tr>\n<tr><td>√2</td><td>1,41</td><td>1,41</td><td>1,41 &lt; √2 &lt; 1,42</td></tr>\n<tr><td>10/3</td><td>3,33</td><td>3,33</td><td>3,33 &lt; 10/3 &lt; 3,34</td></tr>\n<tr><td>7/6</td><td>1,16</td><td>1,17</td><td>1,16 &lt; 7/6 &lt; 1,17</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — racines carrées et ensembles : le tri complet</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Classer dans le plus petit ensemble possible : √64 ; √5 ; −√25 ; 0,666... ; 3π ; (√3)² ; 12/4.</div><div class=\"etu\"><b>Étape 1 — Simplifier d'abord</b> : √64 = 8 ∈ N ; −√25 = −5 ∈ Z ; (√3)² = 3 ∈ N ; 12/4 = 3 ∈ N.</div><div class=\"etu\"><b>Étape 2 — Périodes</b> : 0,666... = 2/3 ∈ Q (astuce : 10x − x = 6 → x = 6/9 = 2/3).</div><div class=\"etu\"><b>Étape 3 — Irrationnels</b> : √5 ∈ R \\ Q ; 3π ∈ R \\ Q (multiple rationnel d'un irrationnel non nul : irrationnel).</div><div class=\"etu\"><b>Étape 4 — Moralité</b> : la question « quel ensemble ? » se répond TOUJOURS après simplification : un nombre écrit compliqué peut cacher un naturel. L'automatisme : simplifier, chercher une période, invoquer les grands irrationnels (√2, √3, π, e).</div></div></details>"
