    "theme": "Pythagore (collège)",
    "niveau": "4e",
    "titre": "Théorème de Pythagore",
    "cours": "<div class=\"cours-head\"><h2>Théorème de Pythagore</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le triangle rectangle : le cadre du théorème</h3>\n<ul>\n<li>Un triangle <b>rectangle</b> possède un angle droit (90°) ; les deux côtés qui forment cet angle s'appellent les <b>cathètes</b> (ou côtés de l'angle droit) ;</li>\n<li>Le côté opposé à l'angle droit, le plus long, s'appelle l'<b>hypoténuse</b> ;</li>\n<li>Les deux angles aigus sont complémentaires : leur somme vaut 90° ;</li>\n<li>Le théorème de Pythagore ne s'applique <b>QUE</b> dans un triangle rectangle : le vérifier d'abord est la première étape de tout exercice.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Triangle rectangle ABC\">\n  <path d=\"M 60 130 L 260 130 L 60 40 Z\" fill=\"#eef2ff\" fill-opacity=\"0.6\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <rect x=\"60\" y=\"114\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <text x=\"50\" y=\"30\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">A</text>\n  <text x=\"265\" y=\"140\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">B</text>\n  <text x=\"50\" y=\"140\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">C</text>\n  <text x=\"160\" y=\"25\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">hypoténuse [AB] : face à l'angle droit</text>\n  <text x=\"160\" y=\"122\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">cathète BC</text>\n  <text x=\"38\" y=\"85\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\" transform=\"rotate(-90 38 85)\">cathète AC</text>\n  <text x=\"330\" y=\"60\" font-size=\"13\" fill=\"#1e293b\">ABC rectangle en C</text>\n  <text x=\"330\" y=\"82\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"bold\">AB² = AC² + BC²</text>\n  <text x=\"330\" y=\"104\" font-size=\"11\" fill=\"#64748b\">le carré de l'hypoténuse =</text>\n  <text x=\"330\" y=\"120\" font-size=\"11\" fill=\"#64748b\">somme des carrés des cathètes</text>\n</svg><span class=\"fig-cap\">Dans ABC rectangle en C, l'hypoténuse est [AB]. Le théorème relie les trois côtés par une égalité de carrés.</span></div>\n\n<h3>2. Le théorème : calculer un côté manquant</h3>\n<div class=\"tip\"><b>Théorème de Pythagore</b> : si un triangle est rectangle, alors le carré de l'hypoténuse est égal à la somme des carrés des deux autres côtés. En pratique : il permet de calculer le troisième côté dès que deux sont connus.</div>\n<ul>\n<li><b>Chercher l'hypoténuse</b> (le cas le plus fréquent) : AB² = AC² + BC². Si AC = 3 et BC = 4 : AB² = 9 + 16 = 25, donc AB = √25 = <b>5</b> ;</li>\n<li><b>Chercher une cathète</b> : BC² = AB² − AC² (soustraction !). Si AB = 13 et AC = 5 : BC² = 169 − 25 = 144, donc BC = <b>12</b> ;</li>\n<li>Le résultat est une <b>longueur</b> : on prend la racine carrée positive ;</li>\n<li>Valeurs exactes : garder √50 si 50 n'est pas un carré parfait ; √50 = √(25×2) = 5√2, valeur simplifiée ; valeur approchée ≈ 7,07.</li>\n</ul>\n<table>\n<tr><th>Triangle rectangle</th><th>Côtés connus</th><th>Calcul</th><th>Résultat</th></tr>\n<tr><td>rectangle en C</td><td>AC = 6 ; BC = 8</td><td>AB² = 36 + 64 = 100</td><td>AB = 10</td></tr>\n<tr><td>rectangle en C</td><td>AB = 10 ; AC = 6</td><td>BC² = 100 − 36 = 64</td><td>BC = 8</td></tr>\n<tr><td>rectangle en C</td><td>AC = 5 ; BC = 5</td><td>AB² = 50</td><td>AB = √50 = 5√2 ≈ 7,07</td></tr>\n<tr><td>rectangle en C</td><td>AB = 4 ; AC = 2</td><td>BC² = 16 − 4 = 12</td><td>BC = √12 = 2√3 ≈ 3,46</td></tr>\n</table>\n<div class=\"warn\"><b>Erreur interdite</b> : additionner au lieu de soustraire quand on cherche une cathète. Test mental : l'hypoténuse est le PLUS LONG côté — si le résultat est plus petit que l'hypoténuse, c'est cohérent ; sinon, on s'est trompé de signe.</div>\n\n<h3>3. La réciproque : prouver qu'un triangle est rectangle</h3>\n<ul>\n<li><b>Réciproque</b> : si dans un triangle le carré du plus grand côté égale la somme des carrés des deux autres, alors ce triangle est <b>rectangle</b> (l'angle droit est face au plus grand côté) ;</li>\n<li>Méthode : identifier le plus grand côté ; calculer séparément AB² d'une part et AC² + BC² d'autre part ; comparer ; conclure ;</li>\n<li>Exemple : 9, 12, 15 : 15² = 225 et 9² + 12² = 81 + 144 = 225 → rectangle, hypoténuse 15 ;</li>\n<li><b>Contraposée</b> (pour montrer qu'il n'est PAS rectangle) : si 5² = 25 mais 3² + 4²... prenons 5, 3, 3 : 5² = 25 ≠ 9 + 9 = 18 → pas rectangle.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Carres sur les cotes\">\n  <path d=\"M 100 55 L 140 95 L 100 95 Z\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <rect x=\"60\" y=\"55\" width=\"40\" height=\"40\" fill=\"#fde68a\" fill-opacity=\"0.6\" stroke=\"#f59e0b\"/>\n  <rect x=\"100\" y=\"95\" width=\"40\" height=\"40\" fill=\"#c7d2fe\" fill-opacity=\"0.7\" stroke=\"#4f46e5\"/>\n  <path d=\"M 100 55 L 140 95 L 111.7 123.3 L 71.7 83.3 Z\" fill=\"#fecaca\" fill-opacity=\"0.7\" stroke=\"#ef4444\"/>\n  <text x=\"80\" y=\"78\" font-size=\"11\" fill=\"#f59e0b\" text-anchor=\"middle\">AC²</text>\n  <text x=\"120\" y=\"118\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\">BC²</text>\n  <text x=\"106\" y=\"82\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\">AB²</text>\n  <text x=\"96\" y=\"52\" font-size=\"10\" fill=\"#1e293b\">A</text><text x=\"105\" y=\"92\" font-size=\"10\" fill=\"#1e293b\">C</text><text x=\"143\" y=\"92\" font-size=\"10\" fill=\"#1e293b\">B</text>\n  <text x=\"290\" y=\"55\" font-size=\"12\" fill=\"#1e293b\">aire du grand carré rouge</text>\n  <text x=\"290\" y=\"75\" font-size=\"12\" fill=\"#4f46e5\" font-weight=\"bold\">= aire jaune + aire bleue</text>\n  <text x=\"290\" y=\"95\" font-size=\"11\" fill=\"#64748b\">la preuve « par les aires »</text>\n</svg><span class=\"fig-cap\">Version aires du théorème : le carré construit sur l'hypoténuse (rouge) a exactement l'aire des deux carrés des cathètes (jaune + bleu).</span></div>\n\n<h3>4. Triangles rectangles remarquables</h3>\n<table>\n<tr><th>Triangle</th><th>Côtés</th><th>Où le rencontrer</th></tr>\n<tr><td>3-4-5</td><td>3² + 4² = 5²</td><td>maçonnerie : équerrer un mur avec une corde à 12 nœuds</td></tr>\n<tr><td>5-12-13</td><td>25 + 144 = 169</td><td>échelles et murs</td></tr>\n<tr><td>8-15-17</td><td>64 + 225 = 289</td><td>exercices classiques</td></tr>\n<tr><td>1-1-√2</td><td>1 + 1 = 2</td><td>moitié d'un carré : diagonale = côté × √2</td></tr>\n<tr><td>1-√3-2</td><td>1 + 3 = 4</td><td>triangle équilatéral coupé en deux (lien avec le cosinus 30°/60°)</td></tr>\n</table>\n<div class=\"tip\"><b>Astuce de maçon</b> : pour vérifier un angle droit, les bâtisseurs utilisent une corde bouclée en 12 segments égaux (3+4+5) : tendue en triangle, elle forme un angle droit parfait — Pythagore en pratique depuis l'Égypte antique.</div>\n\n<h3>5. Distance et hauteur : les applications directes</h3>\n<ul>\n<li><b>Diagonale d'un rectangle</b> L×ℓ : d = √(L² + ℓ²) ; diagonale d'un carré de côté c : d = c√2 ;</li>\n<li><b>Hauteur d'un arbre</b> : l'ombre, l'échelle appuyée, la corde tendue : chaque situation modèle un triangle rectangle ;</li>\n<li><b>Dans l'espace</b> : diagonale d'un pavé droit : d = √(L² + ℓ² + h²) — Pythagore appliqué deux fois ;</li>\n<li><b>Distance d'un point à une droite</b> : le chemin le plus court est perpendiculaire — encore un triangle rectangle.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'échelle du pompier</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une échelle de 5 m est appuyée contre un mur vertical. Son pied est à 1,4 m du pied du mur. À quelle hauteur atteint-elle ? L'échelle glisse et le pied s'éloigne à 2,4 m : nouvelle hauteur ?</div><div class=\"etu\"><b>Étape 1 — Modéliser</b> : triangle rectangle mur-sol-échelle ; l'échelle (5 m) est l'hypoténuse, 1,4 m et h les cathètes.</div><div class=\"etu\"><b>Étape 2 — Premier calcul</b> : h² = 5² − 1,4² = 25 − 1,96 = 23,04, donc h = <b>4,8 m</b>.</div><div class=\"etu\"><b>Étape 3 — Après glissement</b> : h² = 25 − 5,76 = 19,24, donc h = <b>√19,24 ≈ 4,39 m</b>.</div><div class=\"etu\"><b>Étape 4 — Observer</b> : le pied ne s'est éloigné que d'un mètre, mais l'échelle a « perdu » 40 cm de hauteur : la relation n'est pas linéaire. Le triangle 1,4-4,8-5 est un multiple (×10) du 7-24-25, un Pythagore caché !</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le triangle est-il rectangle ? (réciproque complète)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Triangle de côtés 7 ; 24 ; 25. Est-il rectangle ? Et celui de côtés 6 ; 7 ; 9 ?</div><div class=\"etu\"><b>Étape 1 — Repérer le plus grand côté</b> : 25 (c'est lui le candidat hypoténuse).</div><div class=\"etu\"><b>Étape 2 — Calculer séparément</b> : 25² = 625 ; 7² + 24² = 49 + 576 = 625.</div><div class=\"etu\"><b>Étape 3 — Comparer et conclure</b> : 625 = 625 → le triangle est <b>rectangle</b>, l'angle droit est face au côté 25.</div><div class=\"etu\"><b>Étape 4 — Second triangle</b> : 9² = 81 ; 6² + 7² = 36 + 49 = 85. 81 ≠ 85 → PAS rectangle. La contraposée tranche : aucun angle droit ici. Rédiger la conclusion avec la propriété utilisée (réciproque ou contraposée), sinon la démonstration est incomplète.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Appliquer Pythagore dans un triangle quelconque : d'abord prouver/acquérir l'angle droit.</li>\n<li>Additionner pour chercher une cathète : c'est une <b>soustraction</b> (hypoténuse² − cathète connue²).</li>\n<li>Confondre AB² et (AB)²... avec 2×AB : AB² est l'aire du carré sur [AB], pas le double !</li>\n<li>Oublier la racine finale : AB² = 25 donne AB = 5, pas 25.</li>\n<li>Prendre le mauvais côté pour hypoténuse dans la réciproque : toujours le PLUS GRAND.</li>\n</ul>\n</div>\n<h3>6. Racines carrées : l'outil du théorème</h3>\n<ul>\n<li>La <b>racine carrée</b> de a (√a) est le nombre positif dont le carré vaut a : √49 = 7 car 7² = 49 ;</li>\n<li>√a × √a = a ; √(a×b) = √a × √b : on peut séparer les facteurs d'une racine ;</li>\n<li><b>Simplifier</b> : √72 = √(36×2) = 6√2 ; √50 = 5√2 ; √18 = 3√2 — sortir les plus grands carrés possibles ;</li>\n<li>Carrés parfaits à connaître : 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169, 196, 225 ;</li>\n<li>Racines célèbres : √2 ≈ 1,414 (diagonale du carré) ; √3 ≈ 1,732 (hauteur du triangle équilatéral) ; √5 ≈ 2,236.</li>\n</ul>\n<table>\n<tr><th>Expression</th><th>Calcul</th><th>Valeur exacte</th><th>Arrondi</th></tr>\n<tr><td>√8</td><td>√(4×2)</td><td>2√2</td><td>≈ 2,83</td></tr>\n<tr><td>√45</td><td>√(9×5)</td><td>3√5</td><td>≈ 6,71</td></tr>\n<tr><td>√200</td><td>√(100×2)</td><td>10√2</td><td>≈ 14,14</td></tr>\n<tr><td>√0,04</td><td>√(4/100)</td><td>2/10</td><td>0,2</td></tr>\n<tr><td>3√2 × √2</td><td>3 × 2</td><td>6</td><td>6</td></tr>\n</table>\n<div class=\"tip\"><b>Comparer des racines sans calculatrice</b> : comparer les carrés ! √50 vs 7 : 50 &gt; 49 donc √50 &gt; 7. √80 vs 9 : 80 &lt; 81 donc √80 &lt; 9. Encadrer une racine entre deux entiers consécutifs est un réflexe brevet.</div>\n\n<h3>7. Pythagore dans la vraie vie : ériger, naviguer, mesurer</h3>\n<ul>\n<li><b>Équerre de maçon</b> : la corde à 13 nœuds (12 intervalles, triangle 3-4-5) donne un angle droit sans instrument moderne ;</li>\n<li><b>Navigation</b> : cap au nord puis dérive vers l'est : la distance réellement parcourue est l'hypoténuse du triangle des déplacements ;</li>\n<li><b>Télévision et écrans</b> : un écran « 55 pouces » mesure 55 pouces de <b>diagonale</b> : format 16/9 : largeur = 16k, hauteur = 9k, diagonale = √(256+81)k = √337 k ;</li>\n<li><b>Cartographie</b> : distance à vol d'oiseau entre deux points : Pythagore sur les écarts de longitude/latitude (petites distances) ;</li>\n<li><b>Sécurité routière</b> : distance de freinage + distance de réaction composées (somme quadratique dans certains modèles) : le carré de la vitesse apparaît toujours.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ecran 16/9 et diagonale\">\n  <rect x=\"93\" y=\"50\" width=\"141\" height=\"79\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <line x1=\"93\" y1=\"50\" x2=\"234\" y2=\"129\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <text x=\"140\" y=\"70\" font-size=\"12\" fill=\"#ef4444\">diagonale = 55″</text>\n  <text x=\"163\" y=\"135\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">largeur = 16k ≈ 121 cm</text>\n  <text x=\"270\" y=\"95\" font-size=\"11\" fill=\"#64748b\">hauteur = 9k ≈ 68 cm</text>\n  <text x=\"215\" y=\"20\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">(16k)² + (9k)² = (55)² en pouces : Pythagore au magasin</text>\n</svg><span class=\"fig-cap\">La diagonale d'un écran 16/9 relie largeur et hauteur par Pythagore : format 16-9-diagonale √337, environ 18,4-10,4-21,2.</span></div>\n\n<h3>8. Rédiger une réponse complète (modèle brevet)</h3>\n<ol>\n<li><b>Identifier</b> le triangle rectangle et son angle droit (« ABC est rectangle en C ») ;</li>\n<li><b>Énoncer</b> le théorème (« d'après le théorème de Pythagore ») ;</li>\n<li><b>Écrire l'égalité</b> adaptée (AB² = AC² + BC²) ;</li>\n<li><b>Remplacer</b> par les valeurs, calculer le carré ;</li>\n<li><b>Conclure</b> avec la racine, l'unité, et l'arrondi demandé (« AB = √50 ≈ 7,1 cm »).</li>\n</ol>\n<div class=\"warn\"><b>La rédaction compte autant que le calcul</b> : sans l'énoncé du théorème et la mention du triangle rectangle, la démonstration est inachevée. Cinq lignes propres valent mieux qu'un calcul nu.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la diagonale du pavé droit (Pythagore en 3D)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une boîte mesure 30 cm × 40 cm × 50 cm. Une fourmi part du coin inférieur avant gauche et rejoint le coin supérieur arrière droit en ligne droite. Quelle distance parcourt-elle ?</div><div class=\"etu\"><b>Étape 1 — Premier Pythagore (au sol)</b> : diagonale du fond : d₁ = √(30² + 40²) = √2500 = 50 cm.</div><div class=\"etu\"><b>Étape 2 — Second Pythagore (vertical)</b> : la grande diagonale joint d₁ et la hauteur : D = √(50² + 50²) = √5000 ≈ <b>70,7 cm</b>.</div><div class=\"etu\"><b>Étape 3 — Vérifier la formule directe</b> : D = √(30² + 40² + 50²) = √(900+1600+2500) = √5000 ✓ : la formule en trois dimensions généralise le théorème.</div><div class=\"etu\"><b>Étape 4 — Remarque</b> : la fourmi « volante » gagne 30+40+50 − 70,7 ≈ 49 cm par rapport au chemin des arêtes. La diagonale de l'espace : une application immédiate et spectaculaire de Pythagore appliqué deux fois.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — encadrer une racine à la main</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sans calculatrice, donner un encadrement de √52 entre deux entiers consécutifs, puis une valeur approchée au dixième.</div><div class=\"etu\"><b>Étape 1 — Situer entre carrés parfaits</b> : 49 &lt; 52 &lt; 64, donc 7² &lt; 52 &lt; 8².</div><div class=\"etu\"><b>Étape 2 — En déduire l'encadrement</b> : la racine croît comme le carré, donc <b>7 &lt; √52 &lt; 8</b>.</div><div class=\"etu\"><b>Étape 3 — Affiner au dixième</b> : 7,2² = 51,84 &lt; 52 ; 7,3² = 53,29 &gt; 52 → 7,2 &lt; √52 &lt; 7,3. Comme 52 est plus proche de 51,84 : √52 ≈ <b>7,2</b>.</div><div class=\"etu\"><b>Étape 4 — Contrôler</b> : 7,2² = 51,84 et 7,21² = 51,98 : la vraie valeur ≈ 7,211. La méthode des encadrements successifs est exactement ce que fait la calculatrice, en plus rapide : comprendre l'algorithme, c'est ne plus jamais dépendre de la machine.</div></div></details>\n"

    "titre": "Dérivation",
    "cours": "<div class=\"cours-head\"><h2>Dérivation</h2><span class=\"niv\">1re</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n<h3>1. Nombre dérivé et taux d'accroissement</h3>\n<p>Soit f une fonction définie sur un intervalle I et a ∈ I. Le <b>taux d'accroissement</b> de f entre a et a + h est :</p>\n<div class=\"tip\">T(h) = (f(a + h) − f(a)) / h</div>\n<p>Si T(h) tend vers une limite finie ℓ quand h tend vers 0, on dit que f est <b>dérivable en a</b> et ℓ = <b>f′(a)</b>, le nombre dérivé de f en a.</p>\n<div class=\"ex\"><b>Exemple :</b> f(x) = x², a = 1. T(h) = ((1+h)² − 1)/h = (2h + h²)/h = 2 + h → 2 quand h → 0. Donc f′(1) = 2.</div>\n<h3>2. Interprétation géométrique : la tangente</h3>\n<div class=\"tip\"><b>Tangente en a :</b> la tangente à la courbe de f au point d'abscisse a est la droite d'équation <b>y = f′(a)(x − a) + f(a)</b>. Son coefficient directeur est f′(a).</div>\n<p>La tangente est la « meilleure approximation affine » de f au voisinage de a : f(a + h) ≈ f(a) + h·f′(a).</p>\n<details class=\"ex-util\"><summary>💡 Focus sur... — calculer un nombre dérivé puis l'équation de la tangente</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit f(x) = x². Calculer f′(3) à l'aide du taux d'accroissement, puis donner l'équation de la tangente à la courbe de f au point d'abscisse 3.</div><div class=\"etu\"><b>Étape 1</b> — <b>Écrire le taux d'accroissement</b> : T(h) = (f(3 + h) − f(3)) / h.</div><div class=\"etu\"><b>Étape 2</b> — <b>Développer le numérateur</b> : f(3 + h) = (3 + h)² = 9 + 6h + h² et f(3) = 9, donc f(3 + h) − f(3) = 6h + h².</div><div class=\"etu\"><b>Étape 3</b> — <b>Simplifier</b> : T(h) = (6h + h²) / h = 6 + h.</div><div class=\"etu\"><b>Étape 4</b> — <b>Faire tendre h vers 0</b> : 6 + h → 6, donc f′(3) = <b>6</b>.</div><div class=\"etu\"><b>Étape 5</b> — <b>Équation de la tangente</b> : y = f′(3)(x − 3) + f(3) = 6(x − 3) + 9 = <b>6x − 9</b>.</div><div class=\"etu\"><b>Étape 6</b> — <b>Vérifier</b> : en x = 3, la droite donne y = 9 = f(3) ✓ et sa pente vaut 6 = f′(3) ✓.</div></div></details>\n<h3>3. Dérivées des fonctions usuelles</h3>\n<table><tr><th>f(x)</th><th>f′(x)</th><th>Valable sur</th></tr>\n<tr><td>x<sup>n</sup> (n ∈ N*)</td><td>n·x<sup>n−1</sup></td><td>ℝ</td></tr>\n<tr><td>1/x</td><td>−1/x²</td><td>ℝ \\ {0} = ]−∞;0[ ∪ ]0;+∞[</td></tr>\n<tr><td>√x</td><td>1/(2√x)</td><td>]0; +∞[</td></tr>\n<tr><td>cos(x)</td><td>−sin(x)</td><td>ℝ</td></tr>\n<tr><td>sin(x)</td><td>cos(x)</td><td>ℝ</td></tr>\n<tr><td>x ↦ x</td><td>1</td><td>ℝ</td></tr>\n<tr><td>k (constante)</td><td>0</td><td>ℝ</td></tr></table>\n<h3>4. Opérations sur les dérivées</h3>\n<table><tr><th>Fonction</th><th>Dérivée</th><th>Conditions</th></tr>\n<tr><td>u + v</td><td>u′ + v′</td><td>u et v dérivables</td></tr>\n<tr><td>k·u (k constante)</td><td>k·u′</td><td>u dérivable</td></tr>\n<tr><td>u × v</td><td>u′v + uv′</td><td>u et v dérivables</td></tr>\n<tr><td>1/v</td><td>−v′/v²</td><td>v dérivable et v ≠ 0</td></tr>\n<tr><td>u/v</td><td>(u′v − uv′)/v²</td><td>v dérivable et v ≠ 0</td></tr>\n<tr><td>u(niveau entier) : u<sup>n</sup></td><td>n·u′·u<sup>n−1</sup></td><td>u dérivable</td></tr>\n<tr><td>√u</td><td>u′/(2√u)</td><td>u dérivable et u > 0</td></tr></table>\n<details class=\"ex-util\"><summary>💡 Focus sur... — dériver un quotient avec la formule (u/v)′</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit g(x) = (x² + 1)/(x − 2). Dériver g sur son domaine de définition.</div><div class=\"etu\"><b>Étape 1</b> — <b>Vérifier le domaine</b> : il faut x − 2 ≠ 0, donc g est définie sur ]−∞ ; 2[ ∪ ]2 ; +∞[.</div><div class=\"etu\"><b>Étape 2</b> — <b>Identifier la forme</b> : quotient u/v avec u(x) = x² + 1 et v(x) = x − 2.</div><div class=\"etu\"><b>Étape 3</b> — <b>Dériver u et v séparément</b> : u′(x) = 2x et v′(x) = 1.</div><div class=\"etu\"><b>Étape 4</b> — <b>Appliquer la formule</b> : (u/v)′ = (u′v − uv′)/v² — attention à l'ordre du numérateur !</div><div class=\"etu\"><b>Étape 5</b> — <b>Remplacer</b> : g′(x) = (2x(x − 2) − (x² + 1) × 1) / (x − 2)².</div><div class=\"etu\"><b>Étape 6</b> — <b>Développer et réduire le numérateur</b> : 2x² − 4x − x² − 1 = x² − 4x − 1.</div><div class=\"etu\"><b>Étape 7</b> — <b>Conclure</b> : g′(x) = (x² − 4x − 1)/(x − 2)², valable sur ]−∞ ; 2[ ∪ ]2 ; +∞[.</div></div></details>\n<h3>5. Lien dérivée / variations</h3>\n<ul>\n<li>Si f′(x) &gt; 0 sur un intervalle, alors f est <b>strictement croissante</b> sur cet intervalle.</li>\n<li>Si f′(x) &lt; 0, f est <b>strictement décroissante</b>.</li>\n<li>Si f′(x) = 0 sur un intervalle, f est <b>constante</b>.</li>\n<li>Si f′ s'annule et <b>change de signe</b> en a : f présente un <b>extremum local</b> en a (maximum si f′ passe de + à −, minimum si de − à +).</li>\n</ul>\n<div class=\"warn\"><b>Attention :</b> f′(a) = 0 ne suffit pas pour un extremum : il faut que la dérivée <b>change de signe</b> (ex. f(x) = x³ en 0 : f′(0) = 0 mais pas d'extremum, la fonction reste croissante).</div>\n<details class=\"ex-util\"><summary>💡 Focus sur... — étudier les variations d'une fonction (méthode complète)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Étudier les variations de f(x) = x³ − 3x sur ℝ et déterminer ses extremums locaux.</div><div class=\"etu\"><b>Étape 1</b> — <b>Dériver</b> : f′(x) = 3x² − 3.</div><div class=\"etu\"><b>Étape 2</b> — <b>Factoriser f′ pour étudier son signe</b> : f′(x) = 3(x² − 1) = 3(x − 1)(x + 1).</div><div class=\"etu\"><b>Étape 3</b> — <b>Signe de chaque facteur</b> : (x + 1) s'annule en −1, (x − 1) s'annule en 1 ; on dresse le tableau de signes du produit.</div><div class=\"etu\"><b>Étape 4</b> — <b>En déduire le signe de f′</b> : f′ &gt; 0 sur ]−∞ ; −1[, f′ &lt; 0 sur ]−1 ; 1[, f′ &gt; 0 sur ]1 ; +∞[.</div><div class=\"etu\"><b>Étape 5</b> — <b>En déduire les variations de f</b> : f croît sur ]−∞ ; −1], décroît sur [−1 ; 1], puis recroît sur [1 ; +∞[.</div><div class=\"etu\"><b>Étape 6</b> — <b>Extremums (changement de signe de f′)</b> : en −1, f′ passe de + à − → maximum local f(−1) = (−1)³ − 3×(−1) = <b>2</b> ; en 1, f′ passe de − à + → minimum local f(1) = 1 − 3 = <b>−2</b>.</div></div></details>\n<h3>6. Méthode type d'étude de fonction</h3>\n<ul>\n<li>① Domaine de définition ;</li>\n<li>② Calcul de f′(x) (développer/factoriser pour étudier son signe) ;</li>\n<li>③ Tableau de signes de f′ ;</li>\n<li>④ Tableau de variations de f (f′ positive → flèche montante) ;</li>\n<li>⑤ Extremums locaux le cas échéant.</li>\n</ul>\n<div class=\"ex\"><b>Exemple :</b> f(x) = x³ − 3x sur ℝ. f′(x) = 3x² − 3 = 3(x − 1)(x + 1). f′ &gt; 0 sur ]−∞;−1[ ∪ ]1;+∞[, f′ &lt; 0 sur ]−1;1[. Donc f croît, décroît, recroît : maximum local en −1 (f(−1) = 2), minimum local en 1 (f(1) = −2).</div>\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b><ul>\n<li>(uv)′ n'est PAS u′v′ : c'est u′v + uv′.</li>\n<li>(u/v)′ : l'ordre dans « u′v − uv′ » compte (au numérateur) ; le dénominateur est v².</li>\n<li>(1/x)′ = −1/x² (le signe − est souvent oublié) ; (√x)′ = 1/(2√x) (le 2 aussi).</li>\n<li>Une fonction peut être dérivable partout sauf en un point (ex. √x en 0 : la tangente est verticale, f n'est pas dérivable en 0).</li>\n<li>Dérivable ⇒ continue, mais continue ⇏ dérivable (ex. valeur absolue en 0).</li></ul></div>"
  },

    "cours": "<div class=\"cours-head\"><h2>Puissances et écriture scientifique</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Puissance d'un nombre : la multiplication répétée</h3>\n<ul>\n<li>aⁿ = a × a × ... × a (n facteurs) : « a puissance n » ou « a exposant n » ;</li>\n<li>10³ = 10 × 10 × 10 = 1 000 : trois facteurs dix — et trois zéros ;</li>\n<li>2⁵ = 32 : la légende de l'échiquier (grains de blé doublés 63 fois) montre la croissance explosive des puissances ;</li>\n<li>Cas particuliers : a¹ = a ; a⁰ = 1 (convention qui rend toutes les formules valides) ;</li>\n<li>Attention au signe : (−2)⁴ = +16 (4 facteurs, signe pair) ; −2⁴ = −(2⁴) = −16 : les parenthèses changent tout.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Croissance exponentielle vs lineaire\">\n  <line x1=\"40\" y1=\"120\" x2=\"410\" y2=\"120\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"120\" x2=\"40\" y2=\"15\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"120\" x2=\"400\" y2=\"40\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-dasharray=\"6,4\"/>\n  <path d=\"M 40 120 C 150 115 250 95 300 60 C 330 40 350 25 370 15\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <circle cx=\"130\" cy=\"112\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"200\" cy=\"98\" r=\"3.5\" fill=\"#4f46e5\"/>\n  <circle cx=\"270\" cy=\"72\" r=\"3.5\" fill=\"#4f46e5\"/><circle cx=\"340\" cy=\"45\" r=\"3.5\" fill=\"#4f46e5\"/>\n  <text x=\"390\" y=\"45\" font-size=\"11\" fill=\"#94a3b8\" text-anchor=\"end\">×2 à chaque pas (ligne droite en pointillé)</text>\n  <text x=\"340\" y=\"35\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\">2ⁿ explose !</text>\n</svg><span class=\"fig-cap\">Doubler à chaque étape (2, 4, 8, 16, 32...) : la croissance devient très vite verticale — c'est la force des puissances.</span></div>\n\n<h3>2. Les règles de calcul sur les puissances</h3>\n<div class=\"tip\"><b>Les trois règles d'or</b> (pour a ≠ 0) :\naⁿ × aᵖ = aⁿ⁺ᵖ (on additionne les exposants) ;\naⁿ ÷ aᵖ = aⁿ⁻ᵖ (on soustrait) ;\n(aⁿ)ᵖ = aⁿˣᵖ (on multiplie).\nCes règles ne valent que pour des <b>mêmes bases</b> — ou des mêmes exposants avec (a×b)ⁿ = aⁿ×bⁿ.</div>\n<table>\n<tr><th>Règle</th><th>Exemple numérique</th><th>Pourquoi ça marche</th></tr>\n<tr><td>aⁿ × aᵖ = aⁿ⁺ᵖ</td><td>2³ × 2⁴ = 2⁷ = 128</td><td>3 facteurs + 4 facteurs = 7 facteurs</td></tr>\n<tr><td>aⁿ ÷ aᵖ = aⁿ⁻ᵖ</td><td>5⁷ ÷ 5⁴ = 5³ = 125</td><td>on « barre » 4 facteurs en haut et en bas</td></tr>\n<tr><td>(aⁿ)ᵖ = aⁿˣᵖ</td><td>(3²)³ = 3⁶ = 729</td><td>3 paquets de 2 facteurs = 6 facteurs</td></tr>\n<tr><td>a⁻ⁿ = 1/aⁿ</td><td>2⁻³ = 1/8 = 0,125</td><td>prolonge la règle de division (5⁰=1 puis 5⁻¹=1/5)</td></tr>\n<tr><td>(a×b)ⁿ = aⁿ × bⁿ</td><td>6⁴ = 2⁴ × 3⁴</td><td>chaque facteur du produit est répété n fois</td></tr>\n</table>\n<div class=\"warn\"><b>Erreurs à bannir</b> : 2³ × 2⁵ ≠ 2¹⁵ (on additionne les exposants : 2⁸) ; 3² + 3³ ne se combine PAS (addition ≠ multiplication) ; (2+3)⁴ ≠ 2⁴ + 3⁴.</div>\n\n<h3>3. Les puissances de 10 : le moteur de la notation scientifique</h3>\n<ul>\n<li>10ⁿ = 1 suivi de n zéros : 10⁴ = 10 000 ; 10⁻ⁿ = 0,000...01 (n décimales) : 10⁻³ = 0,001 ;</li>\n<li>Multiplier par 10ⁿ décale la virgule de n crans vers la droite ; par 10⁻ⁿ vers la gauche ;</li>\n<li>Préfixes : kilo (10³), méga (10⁶), giga (10⁹), téra (10¹²) ; milli (10⁻³), micro (10⁻⁶), nano (10⁻⁹) ;</li>\n<li>Conversions : 3,5 Go = 3,5 × 10⁹ octets ; 250 nm = 2,5 × 10⁻⁷ m.</li>\n</ul>\n<table>\n<tr><th>Écriture décimale</th><th>Produit</th><th>Scientifique</th></tr>\n<tr><td>123 000</td><td>123 × 10³</td><td>1,23 × 10⁵</td></tr>\n<tr><td>0,000 45</td><td>45 × 10⁻⁵</td><td>4,5 × 10⁻⁴</td></tr>\n<tr><td>7</td><td>—</td><td>7 × 10⁰</td></tr>\n<tr><td>6 022 000 000 000 000 000 000</td><td>—</td><td>6,022 × 10²³ (nombre d'Avogadro)</td></tr>\n</table>\n\n<h3>4. L'écriture scientifique : un format unique pour l'Univers</h3>\n<div class=\"tip\"><b>Définition</b> : a × 10ⁿ avec 1 ≤ a &lt; 10 (un seul chiffre non nul avant la virgule) et n entier. C'est LA norme des sciences : du rayon de l'atome (10⁻¹⁰ m) au diamètre de la Galaxie (10²¹ m).</div>\n<ul>\n<li>Mettre en scientifique : décaler la virgule jusqu'à avoir un chiffre entre 1 et 9, compter les crans = exposant ;</li>\n<li>5 600 000 → 5,6 (cinq crans à gauche → exposant +5) : <b>5,6 × 10⁶</b> ;</li>\n<li>0,00072 → 7,2 (quatre crans à droite → exposant −4) : <b>7,2 × 10⁻⁴</b> ;</li>\n<li>Multiplier deux scientifiques : (a×10ⁿ)×(b×10ᵖ) = (a×b) × 10ⁿ⁺ᵖ, puis réajuster si a×b ≥ 10 ;</li>\n<li>Exemple : (2 × 10⁸) × (3 × 10⁵) = 6 × 10¹³ ; (4 × 10⁶) × (5 × 10³) = 20 × 10⁹ = <b>2 × 10¹⁰</b> (réajustement !).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Echelle de l Univers en puissances de 10\">\n  <line x1=\"20\" y1=\"75\" x2=\"410\" y2=\"75\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <g font-size=\"10\" fill=\"#1e293b\" text-anchor=\"middle\">\n    <circle cx=\"40\" cy=\"75\" r=\"4\" fill=\"#ef4444\"/><text x=\"40\" y=\"60\">10⁻¹⁵</text><text x=\"40\" y=\"95\">noyau</text>\n    <circle cx=\"105\" cy=\"75\" r=\"4\" fill=\"#ef4444\"/><text x=\"105\" y=\"60\">10⁻¹⁰</text><text x=\"105\" y=\"95\">atome</text>\n    <circle cx=\"170\" cy=\"75\" r=\"4\" fill=\"#4f46e5\"/><text x=\"170\" y=\"60\">10⁻²</text><text x=\"170\" y=\"95\">fourmi</text>\n    <circle cx=\"235\" cy=\"75\" r=\"4\" fill=\"#4f46e5\"/><text x=\"235\" y=\"60\">10⁰</text><text x=\"235\" y=\"95\">humain</text>\n    <circle cx=\"300\" cy=\"75\" r=\"4\" fill=\"#16a34a\"/><text x=\"300\" y=\"60\">10⁷</text><text x=\"300\" y=\"95\">Terre</text>\n    <circle cx=\"375\" cy=\"75\" r=\"4\" fill=\"#16a34a\"/><text x=\"375\" y=\"60\">10²⁶</text><text x=\"375\" y=\"95\">Univers</text>\n  </g>\n  <text x=\"215\" y=\"130\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">Un seul système de nombres pour décrire 41 ordres de grandeur : la puissance de la notation scientifique</text>\n</svg><span class=\"fig-cap\">De l'infiniment petit à l'infiniment grand : les puissances de 10 donnent une échelle commune à toutes les sciences.</span></div>\n\n<h3>5. Priorités et pièges de calcul</h3>\n<ul>\n<li>Priorité : parenthèses → puissances → × et ÷ → + et − ;</li>\n<li>3² + 4² = 9 + 16 = 25, mais (3+4)² = 7² = 49 : les puissances n'aiment pas les sommes sans parenthèses ;</li>\n<li>−3² = −9 alors que (−3)² = +9 : le signe « − » ne fait pas partie de la base sans parenthèses ;</li>\n<li>Puissance de puissance : ((2²)³) = 2⁶ — on multiplie les exposants à chaque étage.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la légende de l'échiquier</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur la 1re case d'un échiquier : 1 grain de blé ; sur la 2e : 2 ; sur la 3e : 4 ; on double à chaque case. Combien de grains sur la 64e case ? Et au total ?</div><div class=\"etu\"><b>Étape 1 — Modéliser</b> : la case n reçoit 2ⁿ⁻¹ grains (la 1re case = 2⁰ = 1).</div><div class=\"etu\"><b>Étape 2 — La 64e case</b> : 2⁶³ ≈ 9,2 × 10¹⁸ grains — écriture scientifique indispensable, le nombre complet a 20 chiffres.</div><div class=\"etu\"><b>Étape 3 — Le total</b> : 1 + 2 + 4 + ... + 2⁶³ = 2⁶⁴ − 1 ≈ 1,8 × 10¹⁹ grains.</div><div class=\"etu\"><b>Étape 4 — Donner du sens</b> : ≈ 400 milliards de tonnes de blé, soit des milliers de fois la production mondiale annuelle : le roi imprudent a promis l'impossible. La croissance exponentielle dépasse toujours l'intuition — d'où l'utilité vitale des puissances.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — calculer avec les scientifiques</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La lumière voyage à 3 × 10⁸ m/s. Le Soleil est à 1,5 × 10¹¹ m. Combien de temps met-elle pour nous atteindre ?</div><div class=\"etu\"><b>Étape 1 — Formule</b> : t = d ÷ v = (1,5 × 10¹¹) ÷ (3 × 10⁸).</div><div class=\"etu\"><b>Étape 2 — Séparer</b> : (1,5 ÷ 3) × 10¹¹⁻⁸ = 0,5 × 10³.</div><div class=\"etu\"><b>Étape 3 — Réajuster</b> : 0,5 × 10³ = 500 s (ou 5 × 10²).</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : 500 s ≈ <b>8 min 20 s</b> : le Soleil que l'on voit est celui d'il y a huit minutes ! Diviser les scientifiques : diviser les « a » entre eux, soustraire les exposants, réajuster — trois gestes, une habitude.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Multiplier les exposants dans un produit : 2³ × 2⁴ = 2⁷ (addition !), pas 2¹².</li>\n<li>Additionner des puissances de bases différentes : 2³ + 2⁴ = 8 + 16 = 24, point final — aucune règle ne « fusionne » une somme.</li>\n<li>Oublier le réajustement en scientifique : 20 × 10⁹ n'est pas scientifique, c'est 2 × 10¹⁰.</li>\n<li>Signes : (−2)² = 4 mais −2² = −4 ; (−2)³ = −8 (exposant impair : signe conservé).</li>\n<li>10⁻³ = 0,001 : l'exposant négatif n'est pas un nombre négatif, c'est une <b>division</b> par 10³.</li>\n</ul>\n</div>\n<h3>6. Priorité des opérations : où se glissent les exposants</h3>\n<ul>\n<li>Ordre complet : <b>parenthèses → puissances → multiplications/divisions → additions/soustractions</b> ;</li>\n<li>Exemple guidé : 5 + 2 × 3² = 5 + 2 × 9 = 5 + 18 = 23 — la puissance précède la multiplication, qui précède l'addition ;</li>\n<li>Avec parenthèses : (5 + 2) × 3² = 7 × 9 = 63 : la somme d'abord, puis la puissance du résultat ;</li>\n<li>Chaîne de puissances : 2 × 3² + 4² × 2 = 18 + 32 = 50 : traiter chaque puissance avant de composer.</li>\n</ul>\n<table>\n<tr><th>Expression</th><th>Piège</th><th>Calcul correct</th></tr>\n<tr><td>−3²</td><td>≠ (−3)²</td><td>−(3 × 3) = −9</td></tr>\n<tr><td>(−3)²</td><td>—</td><td>(−3) × (−3) = +9</td></tr>\n<tr><td>2³²</td><td>≠ (2³)²</td><td>2⁹ = 512 (l'exposant le plus proche gagne)</td></tr>\n<tr><td>(2³)²</td><td>—</td><td>2⁶ = 64</td></tr>\n<tr><td>3 + 2²</td><td>≠ (3+2)²</td><td>3 + 4 = 7</td></tr>\n</table>\n\n<h3>7. Calculer avec des puissances de 10 : la mécanique des virgules</h3>\n<ul>\n<li><b>Multiplier</b> un décimal par 10ⁿ : virgule de n crans à droite ; par 10⁻ⁿ : à gauche ;</li>\n<li><b>Produit de deux puissances de 10</b> : 10⁴ × 10⁻² = 10² — l'exposant se calcule même négatif ;</li>\n<li><b>Quotient</b> : 10⁸ ÷ 10³ = 10⁵ ; 10⁵ ÷ 10⁸ = 10⁻³ — soustraction toujours ;</li>\n<li><b>Application concrète</b> : 2,5 × 10³ × 4 × 10⁻² = (2,5×4) × 10¹ = 10 × 10 = 100 : les nombres « gérés » séparément des exposants.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Préfixes du système international\">\n  <rect x=\"25\" y=\"45\" width=\"66\" height=\"40\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#ef4444\"/>\n  <text x=\"58\" y=\"63\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">nano</text>\n  <text x=\"58\" y=\"78\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\">10⁻⁹</text>\n  <rect x=\"103\" y=\"45\" width=\"66\" height=\"40\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#ef4444\"/>\n  <text x=\"136\" y=\"63\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">micro</text>\n  <text x=\"136\" y=\"78\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\">10⁻⁶</text>\n  <rect x=\"181\" y=\"45\" width=\"66\" height=\"40\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#ef4444\"/>\n  <text x=\"214\" y=\"63\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">milli</text>\n  <text x=\"214\" y=\"78\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\">10⁻³</text>\n  <rect x=\"259\" y=\"45\" width=\"66\" height=\"40\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#16a34a\"/>\n  <text x=\"292\" y=\"63\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">kilo</text>\n  <text x=\"292\" y=\"78\" font-size=\"11\" fill=\"#16a34a\" text-anchor=\"middle\">10³</text>\n  <rect x=\"337\" y=\"45\" width=\"66\" height=\"40\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#16a34a\"/>\n  <text x=\"370\" y=\"63\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">méga</text>\n  <text x=\"370\" y=\"78\" font-size=\"11\" fill=\"#16a34a\" text-anchor=\"middle\">10⁶</text>\n  <text x=\"215\" y=\"110\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">1 Go = 10³ Mo = 10⁶ ko = 10⁹ octets — chaque préfixe vaut 1000 fois le précédent</text>\n</svg><span class=\"fig-cap\">Les préfixes du système international sont des puissances de 10 : les convertir, c'est additionner des exposants.</span></div>\n\n<h3>8. Les ordres de grandeur : estimer comme un scientifique</h3>\n<ul>\n<li>L'<b>ordre de grandeur</b> d'un nombre est la puissance de 10 la plus proche : 6 × 10⁷ ≈ 10⁷ ; 8 × 10⁷ ≈ 10⁸ (règle : si a ≥ 5, on arrondit à l'exposant suivant) ;</li>\n<li>Comparer deux grandeurs = comparer leurs ordres de grandeur : 10⁹ est 1000 fois plus grand que 10⁶ ;</li>\n<li>Exemples : population de la France ≈ 10⁸ ; battements cardiaques d'une vie ≈ 3 × 10⁹ ; secondes dans un an ≈ 3 × 10⁷ ;</li>\n<li>Vérifier un calcul : 4 × 10³ × 2 × 10⁵ doit être de l'ordre de 10⁹ — si on trouve 10¹², une erreur d'exposant s'est glissée.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le stockage du téléphone</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un téléphone de 128 Go stocke des photos de 4 Mo chacune. Combien de photos ? Et si les photos sont en fait des vidéos de 800 Mo ?</div><div class=\"etu\"><b>Étape 1 — Convertir en unités cohérentes</b> : 128 Go = 128 × 10⁹ octets ; 4 Mo = 4 × 10⁶ octets.</div><div class=\"etu\"><b>Étape 2 — Diviser</b> : 128 × 10⁹ ÷ (4 × 10⁶) = (128 ÷ 4) × 10³ = 32 × 10³ = <b>32 000 photos</b>.</div><div class=\"etu\"><b>Étape 3 — Pour les vidéos</b> : 128 × 10⁹ ÷ (8 × 10⁸) = 16 × 10¹ = <b>160 vidéos</b>.</div><div class=\"etu\"><b>Étape 4 — Contrôler par ordre de grandeur</b> : 10¹¹ ÷ 10⁷ ≈ 10⁴ photos et 10¹¹ ÷ 10⁸ ≈ 10³ vidéos : les résultats (3,2 × 10⁴ et 1,6 × 10²) sont cohérents. Les exposants font le gros du travail : le calcul sur les « petits nombres » (128 ÷ 4) est presque secondaire.</div></div></details>\n"
  },

    "cours": "<div class=\"cours-head\"><h2>Théorème des milieux et droite des milieux</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La droite des milieux : une droite discrète et puissante</h3>\n<ul>\n<li>Dans un triangle, la <b>droite des milieux</b> joint les milieux de <b>deux côtés</b> ;</li>\n<li>Elle possède deux propriétés remarquables, l'une sur sa longueur, l'autre sur sa direction ;</li>\n<li>Ce théorème est un « Pythagore du parallélisme » : il relie des milieux à des parallèles et des moitiés de longueurs.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Droite des milieux dans ABC\">\n  <path d=\"M 80 130 L 330 130 L 150 30 Z\" fill=\"#eef2ff\" fill-opacity=\"0.5\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"143\" y=\"26\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">A</text>\n  <text x=\"340\" y=\"140\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">B</text>\n  <text x=\"70\" y=\"140\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">C</text>\n  <line x1=\"115\" y1=\"80\" x2=\"205\" y2=\"130\" stroke=\"#ef4444\" stroke-width=\"3\"/>\n  <circle cx=\"115\" cy=\"80\" r=\"5\" fill=\"#ef4444\"/>\n  <circle cx=\"205\" cy=\"130\" r=\"5\" fill=\"#ef4444\"/>\n  <text x=\"128\" y=\"72\" font-size=\"12\" fill=\"#ef4444\">I (milieu de [AC])</text>\n  <text x=\"212\" y=\"122\" font-size=\"12\" fill=\"#ef4444\">J (milieu de [BC])</text>\n  <text x=\"148\" y=\"103\" font-size=\"12\" fill=\"#ef4444\" font-weight=\"bold\">(IJ)</text>\n  <path d=\"M 172 42 A 25 25 0 0 1 136 50\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <text x=\"330\" y=\"55\" font-size=\"13\" fill=\"#1e293b\">(IJ) ∥ (AB)</text>\n  <text x=\"330\" y=\"75\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"bold\">IJ = AB ÷ 2</text>\n</svg><span class=\"fig-cap\">I et J sont les milieux de [AC] et [BC] : le segment [IJ] est parallèle au troisième côté [AB] et en mesure exactement la moitié.</span></div>\n\n<h3>2. Les trois théorèmes du triangle</h3>\n<div class=\"tip\"><b>Propriété 1 (longueur)</b> : le segment qui joint les milieux de deux côtés mesure la <b>moitié</b> du troisième côté.\n<b>Propriété 2 (parallélisme)</b> : ce segment est <b>parallèle</b> au troisième côté.\n<b>Propriété 3 (réciproque)</b> : la droite qui passe par le milieu d'un côté et qui est parallèle à un second coupe le troisième côté en son <b>milieu</b>.</div>\n<ul>\n<li>Propriété 1 sert à <b>calculer des longueurs</b> : connaître AB donne IJ, connaître IJ donne AB (×2 !) ;</li>\n<li>Propriété 2 sert à <b>prouver des parallèles</b> sans mesurer ;</li>\n<li>Propriété 3 sert à <b>placer un milieu</b> ou prouver qu'un point est un milieu — clé des problèmes de construction.</li>\n</ul>\n<table>\n<tr><th>Situation</th><th>Données</th><th>Conclusion</th><th>Outil</th></tr>\n<tr><td>2 milieux connus</td><td>I, J milieux de [AC], [BC] ; AB = 12</td><td>IJ = 6 et (IJ) ∥ (AB)</td><td>propriétés 1 et 2</td></tr>\n<tr><td>1 milieu + parallèle</td><td>I milieu de [AC] ; (IJ) ∥ (AB)</td><td>J milieu de [BC]</td><td>propriété 3</td></tr>\n<tr><td>moitié retrouvée</td><td>IJ = 4,5 ; I, J milieux</td><td>AB = 9</td><td>propriété 1 à l'envers</td></tr>\n</table>\n\n<h3>3. Le théorème direct dans un triangle : midpoints et médianes</h3>\n<ul>\n<li>Une <b>médiane</b> d'un triangle joint un sommet au milieu du côté opposé ; les trois médianes se coupent au <b>centre de gravité</b> G ;</li>\n<li>Le centre de gravité se situe aux <b>2/3</b> de chaque médiane depuis le sommet (et 1/3 depuis le côté) : AG = 2/3 × AI ;</li>\n<li>Physique : une plaque triangulaire homogène tient en équilibre sur une pointe placée en G — la géométrie rejoint la mécanique ;</li>\n<li>Le triangle des milieux (IJK) a une aire <b>4 fois plus petite</b> que ABC, et des côtés moitié : c'est la « version réduite » exacte du triangle.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Medianes et centre de gravite\">\n  <path d=\"M 90 130 L 340 130 L 180 30 Z\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"172\" y=\"26\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">A</text>\n  <text x=\"350\" y=\"140\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">B</text>\n  <text x=\"80\" y=\"140\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">C</text>\n  <line x1=\"180\" y1=\"30\" x2=\"215\" y2=\"130\" stroke=\"#16a34a\" stroke-width=\"1.8\"/>\n  <line x1=\"90\" y1=\"130\" x2=\"260\" y2=\"80\" stroke=\"#16a34a\" stroke-width=\"1.8\"/>\n  <line x1=\"340\" y1=\"130\" x2=\"135\" y2=\"80\" stroke=\"#16a34a\" stroke-width=\"1.8\"/>\n  <circle cx=\"203\" cy=\"97\" r=\"6\" fill=\"#ef4444\"/>\n  <text x=\"215\" y=\"92\" font-size=\"13\" fill=\"#ef4444\" font-weight=\"bold\">G</text>\n  <text x=\"290\" y=\"60\" font-size=\"11\" fill=\"#16a34a\">3 médianes</text>\n  <text x=\"290\" y=\"95\" font-size=\"11\" fill=\"#64748b\">AG = 2/3 de la médiane</text>\n  <text x=\"290\" y=\"112\" font-size=\"11\" fill=\"#64748b\">GI = 1/3</text>\n</svg><span class=\"fig-cap\">Les trois médianes concourent en G, le centre de gravité, situé aux 2/3 de chaque médiane à partir du sommet.</span></div>\n\n<h3>4. Applications : les classiques du brevet</h3>\n<ul>\n<li><b>Calculer une longueur cachée</b> : IJ donné → AB = 2×IJ ;</li>\n<li><b>Prouver un parallélisme</b> : milieux + conclusion « (IJ) ∥ (AB) » sert ensuite pour les angles (alternes-internes) ;</li>\n<li><b>Problème de partage</b> : couper un segment en parties égales en construisant des milieux successifs ;</li>\n<li><b>Dans un quadrilatère</b> : joindre les milieux des côtés d'un quadrilatère quelconque... donne toujours un <b>parallélogramme</b> ! (Varignon) : les côtés sont les droites des milieux des quatre triangles.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la piste du parc triangulaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un parc triangulaire ABC : AB = 120 m. I et J sont les milieux de [AC] et [BC]. On aménage la piste (IJ). Quelle est sa longueur ? Quelle est l'économie si l'on devait longer (AB) à la place ?</div><div class=\"etu\"><b>Étape 1 — Reconnaître la configuration</b> : I et J milieux de deux côtés → [IJ] est le segment des milieux.</div><div class=\"etu\"><b>Étape 2 — Appliquer la propriété 1</b> : IJ = AB ÷ 2 = 120 ÷ 2 = <b>60 m</b>.</div><div class=\"etu\"><b>Étape 3 — Bonus</b> : (IJ) ∥ (AB), la piste est parallèle à la route : information gratuite offerte par la propriété 2.</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : toute « traversée » par les milieux divise les distances par 2 : c'est le principe des cartes à mi-échelle et des plans de masse réduits. Un théorème, deux usages (calcul + parallélisme) : toujours rédiger les deux conclusions.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — Varignon : le parallélogramme surprise</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans un quadrilatère quelconque ABCD, on joint les milieux I, J, K, L des côtés consécutifs. Prouver que IJKL est un parallélogramme.</div><div class=\"etu\"><b>Étape 1 — Tracer une diagonale</b> : [AC] découpe ABCD en deux triangles ABC et ACD.</div><div class=\"etu\"><b>Étape 2 — Dans ABC</b> : I et J milieux de [AB] et [BC] → (IJ) ∥ (AC) et IJ = AC/2 (droite des milieux).</div><div class=\"etu\"><b>Étape 3 — Dans ACD</b> : K et L milieux de [CD] et [DA] → (KL) ∥ (AC) et KL = AC/2.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : (IJ) et (KL) parallèles à (AC) donc parallèles entre elles, et IJ = KL. Deux côtés opposés parallèles et égaux → IJKL est un <b>parallélogramme</b>, quel que soit le quadrilatère de départ ! La droite des milieux transforme n'importe quelle figure en figure régulière : c'est sa superpuissance.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Appliquer aux deux milieux des côtés... qui ne sont pas ceux qu'on croit : la droite des milieux joint les milieux de DEUX côtés, le « troisième côté » est celui qui reste.</li>\n<li>La longueur moitié : IJ = AB/2 — et non le tiers ou la même longueur.</li>\n<li>Utiliser la réciproque sans la parallèle : prouver qu'un point est un milieu exige le milieu d'un côté ET une parallèle à un second côté.</li>\n<li>Oublier le ×2 dans le sens inverse : si IJ = 3,8, alors AB = 7,6 (doubler, pas diviser).</li>\n<li>Croire que le théorème donne des angles : il donne parallélisme et longueurs ; les angles égaux en résultent seulement via les parallèles.</li>\n</ul>\n</div>\n<h3>5. Milieux et coordonnées : la formule du milieu</h3>\n<div class=\"tip\"><b>Dans un repère</b> : le milieu M de [AB] a pour coordonnées la <b>moyenne</b> des coordonnées : M( (x_A + x_B)/2 ; (y_A + y_B)/2 ). Le milieu est « à mi-chemin » sur chaque axe, indépendamment.</div>\n<ul>\n<li>A(−2 ; 3) et B(6 ; −1) : M( (−2+6)/2 ; (3−1)/2 ) = M(2 ; 1) ;</li>\n<li>Vérification graphique : M doit tomber « au centre » du segment — tracer les pointillés vers les axes confirme ;</li>\n<li>À l'envers : si M est le milieu de [AB] et qu'on connaît A et M, on retrouve B : x_B = 2×x_M − x_A (le « double moins ») ;</li>\n<li>Ce pont entre géométrie (milieu) et calcul (moyenne) annonce les vecteurs de 2de.</li>\n</ul>\n<table>\n<tr><th>A</th><th>B</th><th>Milieu M</th></tr>\n<tr><td>(1 ; 2)</td><td>(5 ; 6)</td><td>(3 ; 4)</td></tr>\n<tr><td>(−4 ; 0)</td><td>(2 ; 8)</td><td>(−1 ; 4)</td></tr>\n<tr><td>(7 ; −3)</td><td>(−1 ; −3)</td><td>(3 ; −3)</td></tr>\n<tr><td>(0 ; 0)</td><td>(2a ; 2b)</td><td>(a ; b)</td></tr>\n</table>\n\n<h3>6. Aires et agrandissement : l'effet rapport 2</h3>\n<ul>\n<li>Le triangle des milieux (IJK) a des côtés <b>moitié</b> et une aire <b>quart</b> : les aires se comportent comme le carré du rapport ;</li>\n<li>Règle générale d'<b>agrandissement</b> de rapport k : longueurs ×k, aires ×k², (volumes ×k³ — en 3e) ;</li>\n<li>Avec k = 1/2 : longueurs divisées par 2, aires divisées par 4 : c'est exactement le triangle des milieux ;</li>\n<li>Cette règle éclaire les cartes au 1/25 000 : un lac de 4 cm² sur la carte couvre 4 × 25 000² cm²... soit 250 000 m² = 25 ha réels.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Triangle des milieux aire quart\">\n  <path d=\"M 60 130 L 320 130 L 120 30 Z\" fill=\"#eef2ff\" fill-opacity=\"0.5\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <path d=\"M 90 80 L 190 130 L 220 80 Z\" fill=\"#c7d2fe\" fill-opacity=\"0.9\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <circle cx=\"90\" cy=\"80\" r=\"5\" fill=\"#ef4444\"/><circle cx=\"190\" cy=\"130\" r=\"5\" fill=\"#ef4444\"/><circle cx=\"220\" cy=\"80\" r=\"5\" fill=\"#ef4444\"/>\n  <text x=\"150\" y=\"90\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">IJK : côtés ÷2</text>\n  <text x=\"150\" y=\"108\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\" font-weight=\"bold\">aire ÷4</text>\n  <text x=\"360\" y=\"60\" font-size=\"12\" fill=\"#1e293b\">aire(ABC) = 4 ×</text>\n  <text x=\"360\" y=\"78\" font-size=\"12\" fill=\"#1e293b\">aire(IJK)</text>\n</svg><span class=\"fig-cap\">Le triangle des milieux IJK est une réduction exacte de ABC au rapport 1/2 : quatre copies de IJK reconstituent ABC (une au centre + trois pointes tronquées... ici via la médiane).</span></div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — retrouver un point manquant par le milieu</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> M(3 ; −1) est le milieu de [AB]. On connaît A(−1 ; 4). Quelles sont les coordonnées de B ? Vérifier avec la droite des milieux d'un triangle au besoin.</div><div class=\"etu\"><b>Étape 1 — Écrire la formule</b> : 3 = (−1 + x_B)/2 et −1 = (4 + y_B)/2.</div><div class=\"etu\"><b>Étape 2 — Résoudre pour x_B</b> : 3 × 2 = −1 + x_B → x_B = 6 + 1 = <b>7</b>.</div><div class=\"etu\"><b>Étape 3 — Résoudre pour y_B</b> : −1 × 2 = 4 + y_B → y_B = −2 − 4 = <b>−6</b>. Donc B(7 ; −6).</div><div class=\"etu\"><b>Étape 4 — Contrôler</b> : milieu de A(−1 ; 4) et B(7 ; −6) : ((−1+7)/2 ; (4−6)/2) = (3 ; −1) = M ✓. La formule « double moins » (x_B = 2x_M − x_A) donne le même résultat en une ligne : les milieux convertissent la géométrie en équations simples.</div></div></details>\n"
  },

    "id": "calcul-litteral",
    "theme": "Calcul littéral (collège)",
    "niveau": "4e",
    "titre": "Calcul littéral : distributivité, réduction",
    "cours": "<div class=\"cours-head\"><h2>Calcul littéral : distributivité, réduction, factorisation</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Développer : ouvrir les parenthèses</h3>\n<div class=\"tip\"><b>Simple distributivité</b> : k(a + b) = ka + kb et k(a − b) = ka − kb. Le facteur extérieur se distribue sur chaque terme, en gardant les signes.\n<b>Double distributivité</b> : (a + b)(c + d) = ac + ad + bc + bd — chaque terme de la première parenthèse multiplie chaque terme de la seconde.</div>\n<ul>\n<li>3(x + 5) = 3x + 15 ; −2(4 − x) = −8 + 2x (le −2 multiplie aussi le −x → +2x) ;</li>\n<li>(x + 3)(x + 2) = x² + 2x + 3x + 6 = x² + 5x + 6 (après réduction) ;</li>\n<li>(x − 4)(x + 7) = x² + 7x − 4x − 28 = x² + 3x − 28 ;</li>\n<li>La double distributivité se vérifie par l'aire du grand rectangle découpé en quatre petits.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Double distributivite par les aires\">\n  <rect x=\"40\" y=\"30\" width=\"290\" height=\"100\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <line x1=\"180\" y1=\"30\" x2=\"180\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/>\n  <line x1=\"40\" y1=\"80\" x2=\"330\" y2=\"80\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/>\n  <text x=\"110\" y=\"26\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">x</text>\n  <text x=\"255\" y=\"26\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">3</text>\n  <text x=\"33\" y=\"58\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"end\">x</text>\n  <text x=\"33\" y=\"108\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"end\">2</text>\n  <text x=\"110\" y=\"58\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">x²</text>\n  <text x=\"255\" y=\"58\" font-size=\"12\" fill=\"#16a34a\" text-anchor=\"middle\">3x</text>\n  <text x=\"110\" y=\"108\" font-size=\"12\" fill=\"#f59e0b\" text-anchor=\"middle\">2x</text>\n  <text x=\"255\" y=\"108\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">6</text>\n  <text x=\"365\" y=\"70\" font-size=\"12\" fill=\"#1e293b\">(x+2)</text>\n  <text x=\"365\" y=\"88\" font-size=\"12\" fill=\"#1e293b\">×(x+3)</text>\n  <text x=\"365\" y=\"110\" font-size=\"12\" fill=\"#4f46e5\" font-weight=\"bold\">= x²+5x+6</text>\n  <text x=\"185\" y=\"148\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">aire du grand = somme des 4 morceaux : la preuve par découpage</text>\n</svg><span class=\"fig-cap\">(x+2)(x+3) en quatre zones : x², 3x, 2x et 6. La somme des aires donne le développement — chaque terme a une « surface ».</span></div>\n\n<h3>2. Réduire : ordonner une expression</h3>\n<ul>\n<li>Réduire = additionner les termes de même nature (même partie littérale) : 5x + 3x = 8x ; 4x² − x² = 3x² ;</li>\n<li>Ordonner = écrire par exposants décroissants : 3 + 2x − 5x² devient −5x² + 2x + 3 : l'expression est « propre » ;</li>\n<li>Les termes ne se mélangent pas : 3x² + 2x reste tel quel (des x² et des x sont des familles différentes) ;</li>\n<li>Signe devant parenthèse : −(3x − 5) = −3x + 5 : le moins <b>inverse tous les signes</b> de la parenthèse.</li>\n</ul>\n<table>\n<tr><th>Expression</th><th>Développement</th><th>Réduction</th></tr>\n<tr><td>4(2x − 3)</td><td>8x − 12</td><td>—</td></tr>\n<tr><td>−3(x − 7)</td><td>−3x + 21</td><td>—</td></tr>\n<tr><td>(x + 2)(x + 5)</td><td>x² + 5x + 2x + 10</td><td>x² + 7x + 10</td></tr>\n<tr><td>(2x − 1)(x − 3)</td><td>2x² − 6x − x + 3</td><td>2x² − 7x + 3</td></tr>\n<tr><td>5x − 2(x − 4)</td><td>5x − 2x + 8</td><td>3x + 8</td></tr>\n<tr><td>(x + 3) − (2x − 5)</td><td>x + 3 − 2x + 5</td><td>−x + 8</td></tr>\n</table>\n\n<h3>3. Factoriser : fermer les parenthèses</h3>\n<div class=\"warn\"><b>Factoriser</b> = transformer une somme en un produit, en repérant le <b>facteur commun</b>. C'est le mouvement inverse du développement : ka + kb = k(a + b).</div>\n<ul>\n<li>Facteur commun numérique et littéral : 5x² + 3x = x(5x + 3) — le x est commun ;</li>\n<li>4x − 8 = 4(x − 2) : le facteur commun est 4 ;</li>\n<li>7x + 7y = 7(x + y) ; 3a² + 6a = 3a(a + 2) (facteur commun 3a) ;</li>\n<li>Pourquoi factoriser ? Pour résoudre des équations-produits (3e) et pour calculer malin : 37 × 8 + 37 × 2 = 37 × (8 + 2) = 370.</li>\n</ul>\n<div class=\"tip\"><b>Contrôle systématique</b> : redévelopper mentalement la factorisation. 4(x − 2) = 4x − 8 ✓ : la boucle développement-factorisation se vérifie dans les deux sens.</div>\n\n<h3>4. Substituer et prouver</h3>\n<ul>\n<li>Calculer une expression pour une valeur donnée : remplacer la lettre, respecter les priorités, parenthèser les négatifs ;</li>\n<li>E = 2x² − 3x + 1 pour x = −2 : 2×(−2)² − 3×(−2) + 1 = 8 + 6 + 1 = <b>15</b> ;</li>\n<li><b>Prouver une identité</b> : montrer que (n + 1)² − n² = 2n + 1 pour tout n : développer (n² + 2n + 1) − n² = 2n + 1 ✓ — le calcul littéral démontre ce que le test numérique suggère ;</li>\n<li>Deux expressions égales pour toutes valeurs : on les prouve par développement, jamais par un seul exemple.</li>\n</ul>\n\n<h3>5. Les trois identités remarquables (avant-goût de la 3e)</h3>\n<table>\n<tr><th>Identité</th><th>Forme développée</th><th>Vérification numérique (a=2, b=3)</th></tr>\n<tr><td>(a + b)²</td><td>a² + 2ab + b²</td><td>25 = 4 + 12 + 9 ✓</td></tr>\n<tr><td>(a − b)²</td><td>a² − 2ab + b²</td><td>1 = 16 − 12 + 9 ✓ (a=4, b=3)</td></tr>\n<tr><td>(a + b)(a − b)</td><td>a² − b²</td><td>−5 = 4 − 9 ✓</td></tr>\n</table>\n<ul>\n<li>Ces formules évitent la double distributivité quand on les reconnaît ;</li>\n<li>Elles se prouvent par développement : (a+b)² = (a+b)(a+b) = a² + ab + ab + b² = a² + 2ab + b² ;</li>\n<li>Piége historique : (a + b)² ≠ a² + b² ! Test : (1+1)² = 4 mais 1 + 1 = 2.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le programme de calcul, preuve par l'algèbre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Programme A : « choisir un nombre ; le multiplier par 3 ; ajouter 6 ». Programme B : « choisir un nombre ; lui ajouter 2 ; multiplier le tout par 3 ». Donnent-ils toujours le même résultat ?</div><div class=\"etu\"><b>Étape 1 — Traduire A</b> : nombre n → 3n → 3n + 6.</div><div class=\"etu\"><b>Étape 2 — Traduire B</b> : nombre n → n + 2 → 3(n + 2).</div><div class=\"etu\"><b>Étape 3 — Comparer</b> : développer B : 3(n + 2) = 3n + 6. Les deux expressions sont <b>identiques</b>.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : oui, toujours le même résultat, et ce n'est pas une coïncidence testée sur quelques valeurs : c'est une <b>preuve</b> pour TOUS les nombres. Un seul exemple convainc ; une identité littérale démontre — toute la différence entre croire et savoir.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — factoriser pour calculer vite</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer mentalement : 87 × 13 + 87 × 7, puis 54 × 99 + 54.</div><div class=\"etu\"><b>Étape 1 — Repérer le facteur commun</b> : 87 × 13 + 87 × 7 = 87 × (13 + 7).</div><div class=\"etu\"><b>Étape 2 — Calculer la parenthèse</b> : 13 + 7 = 20, donc 87 × 20 = <b>1 740</b>.</div><div class=\"etu\"><b>Étape 3 — Second calcul</b> : 99 + 1 = 100 : 54 × 99 + 54×1 = 54 × (99 + 1) = 54 × 100 = <b>5 400</b> (le 54 isolé = 54 × 1).</div><div class=\"etu\"><b>Étape 4 — Moralité</b> : la factorisation n'est pas un exercice d'école : c'est un outil de calcul mental d'efficacité redoutable. Chaque fois qu'un même nombre apparaît deux fois dans une somme de produits, il appelle la factorisation.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Distribuer le signe : −2(4 − x) = −8 − 2x est FAUX : le −2 × (−x) donne +2x.</li>\n<li>Oublier un terme dans la double distributivité : (a+b)(c+d) a QUATRE produits, pas trois.</li>\n<li>(a + b)² = a² + b² : NON — l'identité ajoute 2ab.</li>\n<li>Retirer une parenthèse précédée de − sans inverser : −(3x − 5) = −3x + 5.</li>\n<li>Factoriser partiellement : 3x² + 6x = 3x(x + 2) et non 3(x² + 6x)... vérifier en redéveloppant.</li>\n</ul>\n</div>\n<h3>6. Supprimer des parenthèses : la règle des signes</h3>\n<ul>\n<li>Parenthèse précédée de <b>+</b> : on la supprime sans rien changer : 3x + (2 − 5x) = 3x + 2 − 5x ;</li>\n<li>Parenthèse précédée de <b>−</b> : on la supprime en <b>inversant tous les signes</b> : 3x − (2 − 5x) = 3x − 2 + 5x = 8x − 2 ;</li>\n<li>Parenthèses emboîtées : travailler de l'intérieur vers l'extérieur, ou de gauche à droite avec méthode : 5x − (3 − (2x − 1)) = 5x − (3 − 2x + 1) = 5x − (4 − 2x) = 5x − 4 + 2x = 7x − 4 ;</li>\n<li>Réflexe : compter les « moins » devant une parenthèse : nombre impair → on inverse, pair → on garde.</li>\n</ul>\n<table>\n<tr><th>Expression</th><th>Résultat</th><th>Signe dominant</th></tr>\n<tr><td>5 − (x − 3)</td><td>8 − x</td><td>inversion complète</td></tr>\n<tr><td>4x − (−2x + 7)</td><td>6x − 7</td><td>−(−2x) = +2x</td></tr>\n<tr><td>a + (b − c)</td><td>a + b − c</td><td>aucun changement</td></tr>\n<tr><td>a − (b + c − d)</td><td>a − b − c + d</td><td>tous inversés</td></tr>\n</table>\n\n<h3>7. Les expressions : lire avant de calculer</h3>\n<ul>\n<li>Les <b>termes</b> sont séparés par + et − ; les <b>facteurs</b> par × ;</li>\n<li>Dans 3x² − 5x + 7 : trois termes (3x²), (−5x), (+7) ; dans 3x² : deux facteurs (3 et x²) ;</li>\n<li>Cette lecture détermine tout : on réduit les termes de même famille, on distribue sur les facteurs, on factorise les facteurs communs ;</li>\n<li>Le <b>degré</b> d'une expression polynomiale est le plus grand exposant de x : 3x² − 5x + 7 est de degré 2 (une « expression du second degré », bientôt résoluble en 1re).</li>\n</ul>\n\n<div class=\"tip\"><b>Méthode de lecture d'une expression</b> : 1) repérer les signes extérieurs (+/−) : ce sont les frontières des termes ; 2) regarder chaque terme : nombres et lettres multipliés = facteurs ; 3) demander à chaque terme sa famille (x² ? x ? nombre seul ?) : la réduction ne mélange que les jumeaux. Cette grammaire du calcul littéral, une fois automatisée, rend le développement et la factorisation quasi mécaniques — et prépare la factorisation des trinômes de 1re.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — prouver que deux programmes sont inverses</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Programme P : « choisir x ; ajouter 5 ; multiplier par 2 ». Programme Q : « choisir x ; diviser par 2 ; soustraire 5 ». Prouver que Q défait P, c'est-à-dire que Q(P(x)) = x pour tout x.</div><div class=\"etu\"><b>Étape 1 — Écrire P</b> : P(x) = 2(x + 5) = 2x + 10.</div><div class=\"etu\"><b>Étape 2 — Composer Q après P</b> : Q prend le résultat : (2x + 10) ÷ 2 − 5.</div><div class=\"etu\"><b>Étape 3 — Développer-réduire</b> : (2x + 10)/2 = x + 5, puis x + 5 − 5 = <b>x</b> ✓.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : Q est la « machine inverse » de P — exactement comme −5 puis ÷2 défait +5 puis ×2, dans l'ordre contraire. Composer et simplifier des expressions littérales, c'est la naissance des fonctions et de leurs inverses (programme de 2de et 1re).</div></div></details>\n"

    "titre": "Équations du premier degré à une inconnue",
    "cours": "<div class=\"cours-head\"><h2>Équations du premier degré à une inconnue</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. L'équation : une question de balance</h3>\n<ul>\n<li>Une <b>équation</b> est une égalité contenant une <b>inconnue</b> (souvent x) dont on cherche les valeurs ;</li>\n<li><b>Résoudre</b> = trouver toutes les valeurs de x qui rendent l'égalité vraie ;</li>\n<li>Modèle mental : une <b>balance à deux plateaux</b> — l'égalité tient tant que les deux côtés restent équilibrés ;</li>\n<li>Toute opération faite d'un côté doit être faite de l'autre : c'est la règle d'or de la balance.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Balance equation\">\n  <line x1=\"215\" y1=\"20\" x2=\"215\" y2=\"65\" stroke=\"#94a3b8\" stroke-width=\"4\"/>\n  <path d=\"M 215 20 L 105 50 L 325 50 Z\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"3\"/>\n  <line x1=\"105\" y1=\"50\" x2=\"105\" y2=\"75\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"325\" y1=\"50\" x2=\"325\" y2=\"75\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <rect x=\"70\" y=\"75\" width=\"70\" height=\"24\" rx=\"5\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <text x=\"105\" y=\"92\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">x + 3</text>\n  <rect x=\"290\" y=\"75\" width=\"70\" height=\"24\" rx=\"5\" fill=\"#dcfce7\" stroke=\"#16a34a\"/>\n  <text x=\"325\" y=\"92\" font-size=\"12\" fill=\"#16a34a\" text-anchor=\"middle\">11</text>\n  <text x=\"215\" y=\"118\" font-size=\"12\" fill=\"#64748b\" text-anchor=\"middle\">x + 3 = 11 : la balance s'équilibre pour x = 8</text>\n</svg><span class=\"fig-cap\">Chaque plateau est un membre de l'égalité. Ajouter ou retirer la même masse des deux côtés préserve l'équilibre — c'est toute la méthode de résolution.</span></div>\n\n<h3>2. Les deux règles de transformation</h3>\n<div class=\"tip\"><b>Règle 1 (addition/soustraction)</b> : on peut ajouter (ou soustraire) un même nombre aux deux membres sans changer l'ensemble des solutions.\n<b>Règle 2 (multiplication/division)</b> : on peut multiplier (ou diviser) les deux membres par un même nombre NON NUL.</div>\n<ul>\n<li>x + 7 = 12 → x + 7 − 7 = 12 − 7 → <b>x = 5</b> : on « chasse » le +7 en soustrayant 7 ;</li>\n<li>x − 4 = 9 → x = 9 + 4 = <b>13</b> : le −4 part en +4 de l'autre côté ;</li>\n<li>3x = 21 → x = 21 ÷ 3 = <b>7</b> : on divise par le coefficient ;</li>\n<li>x/5 = 4 → x = 4 × 5 = <b>20</b> : on multiplie par le dénominateur.</li>\n</ul>\n\n<h3>3. La méthode complète en quatre gestes</h3>\n<ol>\n<li><b>Développer</b> et réduire chaque membre (éliminer parenthèses et produits) ;</li>\n<li><b>Regrouper</b> : les x d'un côté, les nombres de l'autre (en ajoutant/soustrayant) ;</li>\n<li><b>Isoler</b> x en divisant par son coefficient ;</li>\n<li><b>Vérifier</b> en remplaçant x dans l'équation d'origine : c'est la preuve que la solution est juste.</li>\n</ol>\n<div class=\"ex\"><b>Exemple complet</b> : 5x − 3 = 2x + 9.\nÉtape 2 : 5x − 2x = 9 + 3 (les x à gauche, les nombres à droite) → 3x = 12.\nÉtape 3 : x = 12 ÷ 3 = <b>4</b>.\nVérification : 5×4 − 3 = 17 et 2×4 + 9 = 17 ✓. La vérification est la signature du travail sérieux.</div>\n<table>\n<tr><th>Équation</th><th>Transformation</th><th>Solution</th></tr>\n<tr><td>x + 5 = 12</td><td>x = 12 − 5</td><td>x = 7</td></tr>\n<tr><td>4x = −20</td><td>x = −20 ÷ 4</td><td>x = −5</td></tr>\n<tr><td>−3x = 15</td><td>x = 15 ÷ (−3)</td><td>x = −5</td></tr>\n<tr><td>2x + 6 = 5x − 9</td><td>15 = 3x</td><td>x = 5</td></tr>\n<tr><td>3(x − 2) = x + 4</td><td>3x − 6 = x + 4 → 2x = 10</td><td>x = 5</td></tr>\n</table>\n\n<h3>4. Équations et problèmes : la modélisation</h3>\n<ul>\n<li>Choisir l'inconnue (« soit x le prix du cahier ») ;</li>\n<li>Traduire l'énoncé en équation (les phrases deviennent des égalités) ;</li>\n<li>Résoudre ;</li>\n<li><b>Répondre à la question posée</b>, avec l'unité — la solution de l'équation n'est pas toujours la réponse du problème (on demande parfois un âge alors que x était un prix).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Schema de resolution\">\n  <rect x=\"25\" y=\"35\" width=\"85\" height=\"50\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <text x=\"67\" y=\"56\" font-size=\"11\" fill=\"#1e293b\" text-anchor=\"middle\">Énoncé</text>\n  <text x=\"67\" y=\"72\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">français</text>\n  <rect x=\"145\" y=\"35\" width=\"85\" height=\"50\" rx=\"8\" fill=\"#fef3c7\" stroke=\"#f59e0b\"/>\n  <text x=\"187\" y=\"56\" font-size=\"11\" fill=\"#1e293b\" text-anchor=\"middle\">Équation</text>\n  <text x=\"187\" y=\"72\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">algèbre</text>\n  <rect x=\"265\" y=\"35\" width=\"85\" height=\"50\" rx=\"8\" fill=\"#dcfce7\" stroke=\"#16a34a\"/>\n  <text x=\"307\" y=\"56\" font-size=\"11\" fill=\"#1e293b\" text-anchor=\"middle\">Solution</text>\n  <text x=\"307\" y=\"72\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">x = ...</text>\n  <rect x=\"385\" y=\"35\" width=\"40\" height=\"50\" rx=\"8\" fill=\"#fee2e2\" stroke=\"#ef4444\"/>\n  <text x=\"405\" y=\"56\" font-size=\"11\" fill=\"#1e293b\" text-anchor=\"middle\">Rép.</text>\n  <text x=\"405\" y=\"72\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">franç.</text>\n  <path d=\"M 112 60 L 143 60\" stroke=\"#94a3b8\" stroke-width=\"2\"/><path d=\"M 232 60 L 263 60\" stroke=\"#94a3b8\" stroke-width=\"2\"/><path d=\"M 352 60 L 383 60\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <text x=\"215\" y=\"105\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">traduire — résoudre — interpréter : le trajet complet d'un problème</text>\n</svg><span class=\"fig-cap\">Résoudre un problème, c'est faire traduire l'énoncé, résoudre l'équation, puis re-traduire la solution en phrase française.</span></div>\n\n<h3>5. Cas particuliers et pièges</h3>\n<ul>\n<li>Coefficient négatif : −2x = 10 → x = <b>−5</b> (diviser par un négatif inverse le signe) ;</li>\n<li>x des deux côtés : toujours regrouper — choisir le côté où le coefficient de x restera <b>positif</b> simplifie les calculs ;</li>\n<li>Fractions : x/3 = 7 → x = 21 ; (2x)/5 = 4 → 2x = 20 → x = 10 : multiplier par le dénominateur d'abord ;</li>\n<li>Produit en chaîne : 3(2x − 1) = 15 → 6x − 3 = 15 → 6x = 18 → x = 3 : développer d'abord, ou diviser par 3 d'abord (2x − 1 = 5) : les deux chemins mènent à x = 3.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le budget de la sortie scolaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La sortie coûte 240 € au total. Chaque élève paie 8 €, mais la caisse de la classe ajoute 60 €. Combien d'élèves participent ?</div><div class=\"etu\"><b>Étape 1 — Choisir l'inconnue</b> : soit n le nombre d'élèves.</div><div class=\"etu\"><b>Étape 2 — Traduire</b> : participation des élèves (8n) + caisse (60) = coût total (240) : 8n + 60 = 240.</div><div class=\"etu\"><b>Étape 3 — Résoudre</b> : 8n = 240 − 60 = 180, donc n = 180 ÷ 8 = <b>22,5</b>.</div><div class=\"etu\"><b>Étape 4 — Interpréter</b> : 22,5 élèves n'existe pas ! Le problème tel qu'il est posé n'a pas de solution entière : soit 22 élèves (et il manquera 4 €), soit 23 (et il restera 4 €). Une solution mathématique correcte peut être <b>inadaptée</b> au contexte réel : la modélisation exige de revenir à la question posée.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'âge du père et du fils</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un père a 26 ans de plus que son fils. Dans 12 ans, son âge sera le double de celui du fils. Quels sont leurs âges actuels ?</div><div class=\"etu\"><b>Étape 1 — Inconnue</b> : soit x l'âge du fils ; le père a x + 26.</div><div class=\"etu\"><b>Étape 2 — Traduire « dans 12 ans »</b> : fils : x + 12 ; père : x + 26 + 12 = x + 38. L'égalité « double » : x + 38 = 2(x + 12).</div><div class=\"etu\"><b>Étape 3 — Résoudre</b> : x + 38 = 2x + 24 → 38 − 24 = 2x − x → x = <b>14</b>. Le père a 14 + 26 = <b>40 ans</b>.</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : dans 12 ans : fils 26, père 52 = 2 × 26 ✓. Le schéma temporel (« maintenant » vs « dans 12 ans ») est le cœur de ces problèmes : chaque âge vieillit de la même durée.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Agir sur un seul membre : toute opération doit toucher les DEUX côtés de la balance.</li>\n<li>Oublier de vérifier : la substitution dans l'équation initiale détecte 100 % des erreurs de calcul.</li>\n<li>Diviser par un nombre négatif sans changer le signe : −3x = 12 → x = −4.</li>\n<li>Développer incorrectement : 3(x − 2) = 3x − 6 (pas 3x − 2 !).</li>\n<li>Donner « x = 22,5 » comme réponse à un problème de personnes : la solution mathématique doit être <b>interprétée</b> dans le contexte.</li>\n</ul>\n</div>\n<h3>6. Équations et inégalités : un avant-goût</h3>\n<ul>\n<li>Une <b>inéquation</b> remplace le = par &lt;, &gt;, ≤ ou ≥ : on la résout pareil, SAUF qu'en multipliant/divisant par un négatif, l'inégalité <b>se retourne</b> : −2x &lt; 6 → x &gt; −3 ;</li>\n<li>Les solutions d'une inéquation forment un <b>intervalle</b> (une infinité de valeurs) : x &gt; 3 se représente sur une droite graduée ;</li>\n<li>Tester une inéquation : prendre deux nombres (un dedans, un dehors) et vérifier le classement ;</li>\n<li>Ce prolongement prépare la 3e où inéquations et systèmes seront au programme.</li>\n</ul>\n<table>\n<tr><th>Équation</th><th>Solution</th><th>Inéquation liée</th><th>Solutions</th></tr>\n<tr><td>3x = 12</td><td>x = 4</td><td>3x ≤ 12</td><td>x ≤ 4</td></tr>\n<tr><td>x − 2 = 5</td><td>x = 7</td><td>x − 2 &gt; 5</td><td>x &gt; 7</td></tr>\n<tr><td>−2x = 8</td><td>x = −4</td><td>−2x ≤ 8</td><td>x ≥ −4 (signe retourné !)</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le tarif du cinéma</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Abonnement : 15 €/an, puis 4 € par séance. Sans abonnement : 9 € par séance. À partir de combien de séances l'abonnement devient-il rentable ?</div><div class=\"etu\"><b>Étape 1 — Modéliser</b> : avec abonnement, n séances coûtent 15 + 4n ; sans, 9n.</div><div class=\"etu\"><b>Étape 2 — Poser l'inéquation</b> : abonnement rentable quand 15 + 4n &lt; 9n.</div><div class=\"etu\"><b>Étape 3 — Résoudre</b> : 15 &lt; 5n → n &gt; 3 : dès la <b>4e séance</b>, l'abonnement gagne.</div><div class=\"etu\"><b>Étape 4 — Vérifier aux bornes</b> : 3 séances : 15+12 = 27 vs 27 : égalité ; 4 séances : 31 vs 36 : l'abonnement économise 5 €. Les inéquations comparent deux stratégies : l'égalité (27 = 27) donne le <b>seuil d'indifférence</b>, l'inégalité stricte donne la décision.</div></div></details>\n"
