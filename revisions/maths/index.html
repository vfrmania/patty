{"id": "limites-fonctions", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Asymptotes :</b> y = ℓ (horizontale) si lim f = ℓ en ±∞ ; x = a (verticale) si lim = ±∞ en a ; y = ax+b (oblique) si lim [f(x)−(ax+b)] = 0.</p>\n<p><b>Croissances comparées (+∞) :</b> ln x ≪ xᵏ ≪ e^x ⟹ lim ln x/x = 0 ; lim e^x/xⁿ = +∞.</p>\n<p><b>En 0⁺ :</b> x·ln x → 0.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>∞/∞, ∞−∞ :</b> factoriser le terme dominant.</li>\n<li><b>Racines (√(x²+x) − x) :</b> quantité conjuguée.</li>\n<li><b>Fraction rationnelle :</b> limite = rapport des coefficients dominants.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>e^{−x} → 0 en +∞ mais +∞ en −∞ : l'exponentiel « change de camp ».</li>\n<li>Asymptote verticale : limite DIFFÉRENTE à gauche/droite possible (+∞/−∞).</li>\n<li>x·ln x : FI en 0⁺, la réponse est 0 (croissance comparée).</li>\n<li>(2x+1)/(x−3) : asymptotes y = 2 ET x = 3 — souvent les deux.</li>\n</ul>"},
{"id": "continuite-tvi", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Continuité en a :</b> lim x→a f(x) = f(a) ; polynômes, exp, ln, racines : continues sur leur domaine.</p>\n<p><b>Dérivable ⟹ continue</b> ; réciproque fausse (|x| en 0).</p>\n<p><b>TVI :</b> f continue sur [a;b], k entre f(a) et f(b) ⟹ f(c) = k a une solution.</p>\n<p><b>Corollaire :</b> continue + STRICTEMENT monotone + f(a)f(b) &lt; 0 ⟹ racine UNIQUE.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Racine de f(x) = 0 :</b> continuité → monotonie stricte (via f′) → f(a)f(b) &lt; 0 → TVI/corollaire.</li>\n<li><b>Encadrement (dichotomie) :</b> couper en deux, garder le sous-intervalle du changement de signe.</li>\n<li><b>Fonction morceaux :</b> continuité = limite à gauche = valeur à la jonction.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>TVI sans continuité : faux (partie entière saute des valeurs).</li>\n<li>Unicité sans STRICTE monotonie : fausse (deux racines possibles).</li>\n<li>Continue en a : les DEUX limites (gauche/droite) doivent égaler f(a).</li>\n<li>La rédaction doit CITER les hypothèses du théorème : elles rapportent des points.</li>\n</ul>"},
{"id": "integrales", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Primitive :</b> F′ = f ; toutes = F + k.</p>\n<p><b>∫_a^b f = F(b) − F(a)</b> ; aire sous la courbe si f ≥ 0 (u.a.).</p>\n<p><b>Usuelles :</b> xⁿ ⟹ x^{n+1}/(n+1) ; 1/x ⟹ ln x ; 1/x² ⟹ −1/x ; e^x ⟹ e^x ; u′/u ⟹ ln|u| ; u′e^u ⟹ e^u.</p>\n<p><b>Chasles :</b> ∫_a^c = ∫_a^b + ∫_b^c ; <b>linéarité</b> ; <b>moyenne</b> = ∫/(b−a).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Calcul d'intégrale :</b> primitive → évaluer aux bornes → soustraire (ordre b puis a).</li>\n<li><b>Vérifier une primitive :</b> DÉRIVER (réflexe systématique).</li>\n<li><b>Forme u′/u ou u′e^u :</b> repérer le u et vérifier que u′ est présent.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>∫₀² 3x² = [x³]₀² = 8 : ne pas évaluer F(a) − F(b) (signe inversé).</li>\n<li>Sous l'axe des abscisses : l'intégrale est NÉGATIVE (aire algébrique).</li>\n<li>Primitive de 1/x sur ℝ* : ln|x|, deux formules (x>0, x<0).</li>\n<li>La constante k disparaît dans les intégrales définies : pas besoin de la chercher.</li>\n</ul>"},
{"id": "logs-exp", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>exp :</b> e^{a+b} = e^a·e^b ; e^{a−b} = e^a/e^b ; (e^a)ⁿ = e^{an} ; e⁰ = 1.</p>\n<p><b>ln :</b> ln(ab) = ln a + ln b ; ln(a/b) = ln a − ln b ; ln(aⁿ) = n·ln a ; ln 1 = 0 ; ln e = 1.</p>\n<p><b>Réciproques :</b> ln(e^x) = x ; e^{ln x} = x ; e^x = k ⟹ x = ln k.</p>\n<p><b>Dérivées :</b> (e^x)′ = e^x ; (e^u)′ = u′e^u ; (ln x)′ = 1/x ; (ln u)′ = u′/u.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Équation avec ln :</b> domaine AVANT tout, puis regrouper en UN seul ln, puis égaler les intérieurs.</li>\n<li><b>ln 8 + ln 3 − ln 6 = ln(8×3/6) = ln 4</b> : toujours regrouper.</li>\n<li><b>Croissances comparées :</b> ln x ≪ x ≪ e^x en +∞ ; x·ln x → 0 en 0⁺.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>ln(a + b) ≠ ln a + ln b : le ln ne « traverse » NI une somme, NI une différence.</li>\n<li>ln x défini seulement pour x &gt; 0 : domaine obligatoire dans toute équation.</li>\n<li>(e^u)′ = u′e^u : ne pas oublier le u′.</li>\n<li>e^{a+b} ≠ e^a + e^b.</li>\n</ul>"},
{"id": "lois-binomiale-normale", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Binomiale B(n;p) :</b> n épreuves identiques, indépendantes, 2 issues. P(X=k) = C(n,k)pᵏ(1−p)ⁿ⁻ᵏ ; E = np ; V = np(1−p).</p>\n<p><b>« Au moins un » :</b> 1 − (1−p)ⁿ.</p>\n<p><b>Normale N(μ;σ²) :</b> 68 % à ±σ, 95 % à ±2σ, 99,7 % à ±3σ ; Z = (X−μ)/σ ~ N(0;1).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Identifier une binomiale :</b> vérifier identique/indépendant/deux issues, puis poser n et p.</li>\n<li><b>P(X ≥ k) :</b> 1 − P(X ≤ k−1) ; à la calculatrice : binomFRép.</li>\n<li><b>Normale :</b> centrer-réduire (X−μ)/σ, puis règles 68-95-99,7 ou table.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Normale : P(X = 3,14) = 0 : une valeur exacte a une probabilité NULLE (loi continue).</li>\n<li>N(170 ; 64) : 64 est la VARIANCE : σ = 8, pas 64.</li>\n<li>P(« au moins 1 ») ≠ pⁿ : passer par le contraire 1 − (1−p)ⁿ.</li>\n<li>95 % = ±2σ (approx. 1,96σ) ; 99,7 % = ±3σ : ne pas échanger.</li>\n</ul>"},
{"id": "equations-differentielles", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>y′ = ay ⟹ y = C·e^{ax}</b> (C réel quelconque).</p>\n<p><b>y′ = ay + b ⟹ y = C·e^{ax} − b/a</b>.</p>\n<p><b>y′ = ay + b·e^{x} ⟹ y = C·e^{ax} + (b/(1−a))·e^{x}</b> (a ≠ 1).</p>\n<p><b>Condition initiale y(0) = y₀ ⟹ C = y₀ + b/a</b> : unique solution.</p>\n<p><b>Demi-vie :</b> T = ln 2/|a| pour y′ = ay (a &lt; 0).</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Résolution type :</b> solution générale, puis condition initiale pour trouver C.</li>\n<li><b>Solution particulière :</b> la chercher « de la même forme » que le second membre (constante, exponentielle).</li>\n<li><b>Vérification :</b> dériver la solution et remplacer dans l'équation.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>−b/a est l'équilibre : l'oublier fausse tout (vérifier : y constante = −b/a est solution).</li>\n<li>C sans condition initiale reste indéterminé : une équation différentielle a UNE INFINITÉ de solutions.</li>\n<li>Demi-vie : ln 2/|a|, pas 1/|a| : la source d'erreur n° 1.</li>\n<li>Refroidissement, désintégration : a &lt; 0 : la quantité décroît vers l'équilibre, jamais en dessous.</li>\n</ul>"},
{"id": "arithmetique-matrices", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Division euclidienne :</b> a = bq + r, 0 ≤ r &lt; b. Congruences : a ≡ b [n] ⟺ n | (a − b).</p>\n<p><b>Euclide :</b> pgcd(a, b) = pgcd(b, r) ; <b>Bézout :</b> premiers entre eux ⟺ au + bv = 1.</p>\n<p><b>Produit matriciel :</b> (AB)_{ij} = Σ a_{ik}b_{kj} ; AB ≠ BA ; AI = A.</p>\n<p><b>Inverse 2×2 :</b> det = ad − bc ; A⁻¹ = (1/det)(d −b ; −c a) si det ≠ 0.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Reste d'une grande puissance :</b> réduire la base par congruence, chercher le CYCLE des restes.</li>\n<li><b>Équation ax ≡ 1 [n] :</b> Bézout : inverse de a modulo n.</li>\n<li><b>Système linéaire :</b> forme AX = B, puis X = A⁻¹B.</li>\n<li><b>Puissances de matrices :</b> itérer A², A³, conjecturer, démontrer par récurrence.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Produit de matrices : lignes × colonnes (pas coefficient à coefficient) : AB ≠ BA.</li>\n<li>det = 0 ⟹ pas d'inverse : vérifier AVANT de renverser le système.</li>\n<li>Reste toujours positif : 2027 = 6×338 − 1 a pour reste 5, pas −1.</li>\n<li>Congruences : on additionne et multiplie, mais JAMAIS on ne divise.</li>\n</ul>"},
{"id": "perimetres", "fiche": "<h3>📌 L'essentiel</h3>\n<p><b>Périmètres :</b> carré 4c ; rectangle 2(L+l) ; cercle 2πr.</p>\n<p><b>Aires :</b> carré c² ; rectangle L×l ; triangle (b×h)/2 ; disque πr² ; parallélogramme b×h.</p>\n<p><b>Conversions d'aires :</b> ×100 entre unités voisines (1 m² = 10 000 cm²).</p>\n<p>Périmètre = longueur du contour (m) ; aire = surface (m²) : jamais confondus.</p>\n<h3>🧭 Méthodes</h3>\n<ul>\n<li><b>Figure composée :</b> découper en figures simples, additionner les aires, ajouter les contours utiles.</li>\n<li><b>Triangle :</b> vérifier que la hauteur est ⟂ à la base avant d'appliquer (b×h)/2.</li>\n<li><b>Retrouver une dimension :</b> aire rectangle = L×l ⟹ l = A/L.</li>\n</ul>\n<h3>⚠️ Pièges</h3>\n<ul>\n<li>Disque : A = πr², P = 2πr — ne pas intervertir.</li>\n<li>Doubler les longueurs multiplie l'aire par 4.</li>\n<li>1 m² = 10 000 cm² (pas 100 !).</li>\n<li>À périmètre égal, le carré a la plus grande aire.</li>\n</ul>"}];
var QUESTIONS = [{"t": "Pythagore (collège)", "q": "Dans un triangle ABC rectangle en A, quelle égalité est toujours vraie ?", "c": ["BC = AB + AC", "AB² = BC² + AC²", "BC² = AB² + AC²", "AC² = AB² + BC²"], "a": 2, "e": "L'hypoténuse BC (côté opposé à l'angle droit) est seule dans l'égalité : BC² = AB² + AC².", "d": "La notion clé : dans un triangle <b>rectangle en A</b>, le côté opposé à l'angle droit (l'hypoténuse BC) apparaît <b>seul</b> dans l'égalité.<div class='ex-detail'><u>Exemple</u> : si AB = 6 et AC = 8, alors BC² = 6² + 8² = 100 et BC = 10. Si on avait écrit AB² = BC² + AC², on obtiendrait 36 = 100 + 64 : absurde, car AB (côté de l'angle droit) ne peut pas être le plus long côté.</div>"}, {"t": "Pythagore (collège)", "q": "ABC est rectangle en A avec AB = 3 et AC = 4. Quelle est la longueur BC ?", "c": ["12", "25", "5", "7"], "a": 2, "e": "BC² = 3² + 4² = 25, donc BC = √25 = 5.", "d": "Méthode : appliquer le théorème puis prendre la <b>racine carrée</b> du résultat.<div class='ex-detail'><u>Exemple rédigé</u> : BC² = AB² + AC² = 3² + 4² = 9 + 16 = 25. Donc BC = √25 = <b>5</b>. Attention au piège : BC² vaut 25, mais BC vaut 5 — ne pas confondre le carré et sa racine.</div>"}, {"t": "Pythagore (collège)", "q": "Comment s'appelle le côté opposé à l'angle droit dans un triangle rectangle ?", "c": ["Le côté adjacent", "La hauteur", "La médiane", "L'hypoténuse"], "a": 3, "e": "L'hypoténuse est le côté opposé à l'angle droit ; c'est toujours le plus long côté.", "d": "Vocabulaire de base : l'<b>hypoténuse</b> est le côté opposé à l'angle droit ; c'est toujours le côté le plus long, et c'est lui qui est « seul » dans l'égalité de Pythagore.<div class='ex-detail'><u>Exemple</u> : dans un triangle rectangle en A avec AB = 5 et AC = 12, l'hypoténuse est BC et BC = √(25 + 144) = 13. La hauteur et la médiane sont des <i>segments</i> (droites), pas des côtés.</div>"}, {"t": "Pythagore (collège)", "q": "Un triangle a pour côtés 5, 12 et 13. Que peut-on conclure ?", "c": ["Il est rectangle (réciproque du théorème)", "On ne peut rien conclure", "Il est équilatéral", "Il n'est pas rectangle"], "a": 0, "e": "13² = 169 = 5² + 12² = 25 + 144. La réciproque du théorème de Pythagore s'applique : le triangle est rectangle.", "d": "Pour vérifier si un triangle est rectangle, on utilise la <b>réciproque</b> : comparer le carré du plus long côté à la somme des carrés des deux autres.<div class='ex-detail'><u>Exemple rédigé</u> : 13² = 169 et 5² + 12² = 25 + 144 = 169. Comme 13² = 5² + 12², le triangle est rectangle, et l'angle droit est opposé au côté 13. (Rappel : (5 ; 12 ; 13) est un triplet pythagoricien classique, comme (3 ; 4 ; 5) et (8 ; 15 ; 17).)</div>"}, {"t": "Pythagore (collège)", "q": "Un triangle a pour côtés 4, 5 et 7. Ce triangle…", "c": ["est rectangle", "est isocèle", "n'est pas rectangle (contraposée)", "est rectangle en le sommet opposé au côté 4"], "a": 2, "e": "7² = 49 mais 4² + 5² = 41 ≠ 49 : la contraposée montre qu'il n'est pas rectangle.", "d": "La <b>contraposée</b> du théorème : si le plus grand carré ne correspond PAS à la somme des deux autres, le triangle n'est PAS rectangle.<div class='ex-detail'><u>Exemple rédigé</u> : 7² = 49 mais 4² + 5² = 16 + 25 = 41. Comme 49 ≠ 41, le triangle n'est pas rectangle (quelle que soit la position des côtés).</div>"}, {"t": "Pythagore (collège)", "q": "ABC rectangle en A, BC = 13 et AC = 5. Combien vaut AB ?", "c": ["√18", "18", "8", "12"], "a": 3, "e": "AB² = BC² − AC² = 169 − 25 = 144, donc AB = √144 = 12.", "d": "Quand on cherche un côté de l'angle droit, on <b>soustrait</b> : le carré de l'hypoténuse moins le carré de l'autre côté.<div class='ex-detail'><u>Exemple rédigé</u> : AB² = BC² − AC² = 13² − 5² = 169 − 25 = 144, donc AB = √144 = <b>12</b>. (On reconnaît le triplet (5 ; 12 ; 13).) Piège classique : additionner au lieu de soustraire donne √194 ≈ 13,9, ce qui serait plus long que l'hypoténuse : impossible.</div>"}, {"t": "Pythagore (collège)", "q": "Quelle est la diagonale d'un rectangle de longueur 8 et de largeur 6 ?", "c": ["14", "48", "10", "√14"], "a": 2, "e": "d² = 8² + 6² = 100, donc d = 10 (triplet (6 ; 8 ; 10)).", "d": "La diagonale d'un rectangle découpe le rectangle en <b>deux triangles rectangles</b> : la diagonale est l'hypoténuse de chaque triangle.<div class='ex-detail'><u>Exemple rédigé</u> : d² = 8² + 6² = 64 + 36 = 100, donc d = <b>10</b>. Astuce : (6 ; 8 ; 10) est le double du triplet (3 ; 4 ; 5) — les tripletts font gagner du temps aux examens.</div>"}, {"t": "Pythagore (collège)", "q": "Le théorème de Pythagore permet de…", "c": ["calculer une longueur dans un triangle rectangle", "calculer un angle dans un triangle rectangle", "calculer l'aire d'un triangle", "démontrer qu'un triangle est isocèle"], "a": 0, "e": "Le théorème relie les longueurs des côtés d'un triangle rectangle ; la trigonométrie sert pour les angles.", "d": "Le théorème de Pythagore relie uniquement les <b>longueurs</b> des côtés d'un triangle rectangle.<div class='ex-detail'><u>À retenir</u> : pour les <b>angles</b>, on utilise la trigonométrie (cos, sin, tan). Exemple : dans un triangle rectangle en A avec AB = 3, AC = 4, BC = 5, le théorème donne BC = 5 ; pour calculer l'angle B, on utilise cos(B) = AB/BC = 3/5. Deux outils différents pour deux données différentes.</div>"}, {"t": "Pythagore (collège)", "q": "Dans un triangle rectangle, l'hypoténuse est…", "c": ["le côté le plus court", "le côté le plus long", "toujours horizontal", "un côté de l'angle droit"], "a": 1, "e": "L'hypoténuse, opposée à l'angle droit, est toujours le côté le plus long du triangle rectangle.", "d": "L'hypoténuse est le côté opposé à l'angle droit et donc nécessairement le <b>plus long</b>. Un argument simple : dans l'égalité BC² = AB² + AC², BC² est la somme de deux nombres positifs, donc BC² dépasse AB² et AC².<div class='ex-detail'><u>Exemple</u> : avec AB = 3 et AC = 4, on trouve BC = 5 > 4 > 3. Si un « hypothénuse » était plus court qu'un autre côté, l'égalité serait impossible.</div>"}, {"t": "Pythagore (collège)", "q": "BC² = 25 dans un triangle rectangle. Combien vaut BC ?", "c": ["625", "25", "50", "5"], "a": 3, "e": "BC est la racine carrée de 25 : BC = 5. Piège classique : ne pas oublier la racine !", "d": "Erreur ultra-classique : confondre <b>le carré de la longueur</b> et <b>la longueur</b>. Le théorème donne un carré ; la longueur est sa racine carrée.<div class='ex-detail'><u>Exemple rédigé</u> : BC² = 25 ⟹ BC = √25 = <b>5</b>. Vérification inverse : si BC = 5, alors BC² = 25 ✓ ; si BC = 25, alors BC² = 625 ≠ 25 ✗. Toujours terminer par une racine.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de f(x) = x³ ?", "c": ["f′(x) = 3x²", "f′(x) = x²", "f′(x) = 3x⁴", "f′(x) = 3x"], "a": 0, "e": "Pour xⁿ, la dérivée est n·xⁿ⁻¹ : (x³)′ = 3x².", "d": "Règle générale : (xⁿ)′ = <b>n·xⁿ⁻¹</b> — l'exposant descend en coefficient, l'exposant diminue de 1.<div class='ex-detail'><u>Exemple rédigé</u> : (x³)′ = 3x². De même (x⁵)′ = 5x⁴ et (x)′ = 1 (= 1x⁰). Piège : ne pas écrire 3x⁴ (l'exposant ne monte pas !) ni x² (oubli du coefficient).</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de f(x) = 1/x sur ]0 ; +∞[ ?", "c": ["f′(x) = −1/x²", "f′(x) = 1/x²", "f′(x) = 1/(2√x)", "f′(x) = −1/x"], "a": 0, "e": "La dérivée de 1/x est −1/x² (ne pas oublier le signe moins).", "d": "Dérivées usuelles à connaître par cœur : (1/x)′ = <b>−1/x²</b> et (√x)′ = 1/(2√x).<div class='ex-detail'><u>Exemple rédigé</u> : pour f(x) = 1/x, f′(2) = −1/4. Le signe « − » signifie que f est décroissante sur ]0 ; +∞[ (ce qui se voit sur la courbe : elle descend). Oublier le « − » fausse ensuite tout le tableau de variations.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est l'équation de la tangente à la courbe de f au point d'abscisse a ?", "c": ["y = f(a)(x) + f′(a)", "y = f′(a)(x + a) − f(a)", "y = f(a)(x − a) + f′(a)", "y = f′(a)(x − a) + f(a)"], "a": 3, "e": "Tangente : y = f′(a)(x − a) + f(a). f′(a) est le coefficient directeur.", "d": "Formule à mémoriser : tangente en a : y = <b>f′(a)(x − a) + f(a)</b>. Structure : coefficient directeur f′(a) × (x − a) + ordonnée du point f(a).<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = x² en a = 1 : f′(x) = 2x donc f′(1) = 2 et f(1) = 1. Tangente : y = 2(x − 1) + 1 = 2x − 1. Vérification : en x = 1, la droite donne y = 1 = f(1) ✓ et sa pente 2 = f′(1) ✓.</div>"}, {"t": "Dérivation (1re)", "q": "Si f′(x) > 0 sur un intervalle I, alors f est…", "c": ["strictement croissante sur I", "négative sur I", "constante sur I", "strictement décroissante sur I"], "a": 0, "e": "Le signe de la dérivée donne le sens de variation : f′ > 0 ⟹ f strictement croissante.", "d": "Lien fondamental : le <b>signe de f′</b> donne le <b>sens de variation de f</b>. f′ > 0 ⟹ f monte ; f′ < 0 ⟹ f descend ; f′ = 0 ⟹ f constante.<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = x² sur ℝ. f′(x) = 2x, négatif sur ]−∞ ; 0] et positif sur [0 ; +∞[. Donc f décroît puis croît, avec un minimum en 0. On retrouve bien la parabole connue.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de f(x) = √x sur ]0 ; +∞[ ?", "c": ["f′(x) = 1/(2√x)", "f′(x) = 1/√x", "f′(x) = −1/(2√x)", "f′(x) = 2√x"], "a": 0, "e": "(√x)′ = 1/(2√x) : le 2 au dénominateur est souvent oublié.", "d": "Dérivée usuelle : (√x)′ = <b>1/(2√x)</b> — le 2 au dénominateur est souvent oublié.<div class='ex-detail'><u>Exemple rédigé</u> : en a = 4, f′(4) = 1/(2√4) = 1/4. La tangente en 4 à la courbe de √x a donc une pente de 0,25. Astuce pour retenir la formule : (√x)′ = u′/(2√u) appliqué à u = x.</div>"}, {"t": "Dérivation (1re)", "q": "f(x) = x⁴ − 3x² + 7. Que vaut f′(x) ?", "c": ["4x³ − 6", "4x³ − 6x", "x⁴ − 6x", "4x³ − 3x + 7"], "a": 1, "e": "Terme à terme : (x⁴)′ = 4x³, (−3x²)′ = −6x, (7)′ = 0.", "d": "On dérive <b>terme à terme</b> (somme) : (x⁴)′ = 4x³, (−3x²)′ = −6x (constante × xⁿ), (7)′ = 0.<div class='ex-detail'><u>Exemple rédigé</u> : f′(x) = 4x³ − 6x. Rappels : (k·xⁿ)′ = k·n·xⁿ⁻¹ et la dérivée d'une constante est 0 — le « + 7 » disparaît donc complètement.</div>"}, {"t": "Dérivation (1re)", "q": "Quelle est la dérivée de g(x) = (2x + 1)(x − 3) ?", "c": ["g′(x) = 2(x − 3)·(2x + 1)", "g′(x) = (2x + 1) + (x − 3)", "g′(x) = 2", "g′(x) = 2(x − 3) + (2x + 1)·1"], "a": 3, "e": "Avec (uv)′ = u′v + uv′ : u′ = 2, v′ = 1. ATTENTION : (uv)′ ≠ u′v′.", "d": "Formule du produit : (uv)′ = <b>u′v + uv′</b> — jamais u′v′ !<div class='ex-detail'><u>Exemple rédigé</u> : u = 2x + 1 (u′ = 2) et v = x − 3 (v′ = 1). g′(x) = 2(x − 3) + (2x + 1)·1 = 2x − 6 + 2x + 1 = 4x − 5. Vérification : en développant g(x) = 2x² − 5x − 3, on dérive : 4x − 5 ✓. Les deux méthodes donnent le même résultat.</div>"}, {"t": "Dérivation (1re)", "q": "f′ s'annule en a en changeant de signe (+ vers −). Que se passe-t-il ?", "c": ["f est constante après a", "f présente un minimum local en a", "f présente un point d'inflexion en a", "f présente un maximum local en a"], "a": 3, "e": "Changement de signe de la dérivée = extremum local ; + vers − = maximum.", "d": "Extremum local = la dérivée s'annule <b>ET change de signe</b> : + → − donne un maximum, − → + donne un minimum.<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = x³ − 3x. f′(x) = 3x² − 3 = 3(x − 1)(x + 1). En −1 : f′ passe de + à − → maximum local f(−1) = 2. En 1 : f′ passe de − à + → minimum local f(1) = −2. C'est le signe de f′ qui commande le tableau de variations.</div>"}, {"t": "Dérivation (1re)", "q": "f(x) = x³. En 0, f′(0) = 0. Peut-on conclure à un extremum en 0 ?", "c": ["Non, car f′ ne change pas de signe en 0", "Oui, car f′(0) = 0", "Oui, c'est un minimum", "Oui, c'est un maximum"], "a": 0, "e": "f′(x) = 3x² ≥ 0 partout : f reste croissante, pas d'extremum. f′(a) = 0 seul ne suffit pas.", "d": "Piège du chapitre : f′(a) = 0 <b>ne suffit pas</b> pour un extremum, il faut un changement de signe de f′.<div class='ex-detail'><u>Exemple rédigé</u> : f′(x) = 3x² ≥ 0 pour tout x. La dérivée s'annule en 0 mais reste positive avant et après : la fonction ne change jamais de sens de variation (elle est croissante sur ℝ). Graphiquement, la courbe de x³ traverse sa tangente horizontale en 0 (point d'inflexion), elle ne fait pas de « bosse ».</div>"}, {"t": "Dérivation (1re)", "q": "Quelle affirmation est correcte ?", "c": ["Toute fonction dérivable est continue", "Continuité et dérivabilité sont équivalentes", "Une fonction dérivable n'est jamais continue", "Toute fonction continue est dérivable"], "a": 0, "e": "Dérivable ⇒ continue, mais la réciproque est fausse : |x| est continue en 0 mais non dérivable (tangente « en coin »).", "d": "Théorème du cours : <b>dérivable ⇒ continue</b>, mais la réciproque est fausse.<div class='ex-detail'><u>Exemple clé</u> : f(x) = |x| est continue en 0 (pas de « trou ») mais non dérivable en 0 : à gauche la pente est −1, à droite elle est +1 — la courbe a un « coin », impossible d'y tracer UNE seule tangente. En revanche, toute fonction dérivable en a est automatiquement continue en a.</div>"},
{"t": "Puissances (collège)", "q": "Combien vaut 2⁵ ?", "c": ["10", "25", "32", "7"], "a": 2, "e": "2⁵ = 2×2×2×2×2 = 32 : cinq facteurs égaux à 2.", "d": "La puissance est un <b>produit répété</b> : 2⁵ = 2×2×2×2×2, on compte 5 facteurs.<div class='ex-detail'><u>Exemple rédigé</u> : 2×2 = 4 ; ×2 = 8 ; ×2 = 16 ; ×2 = <b>32</b>. Piège : 2⁵ n'est PAS 2×5 = 10 ! L'exposant indique combien de fois on multiplie la base par elle-même.</div>"},
{"t": "Puissances (collège)", "q": "Combien vaut 5⁰ ?", "c": ["0", "5", "1", "Cela dépend du contexte"], "a": 2, "e": "Par convention, a⁰ = 1 pour tout nombre a ≠ 0.", "d": "Convention du cours : <b>a⁰ = 1</b> dès que a ≠ 0.<div class='ex-detail'><u>Pourquoi ?</u> Avec la règle des quotients : aⁿ ÷ aⁿ = aⁿ⁻ⁿ = a⁰. Or aⁿ ÷ aⁿ = 1, donc a⁰ = 1. Exemple : 7⁵ ÷ 7⁵ = 1 = 7⁰ ✓. Piège fréquent au QCM : répondre 0 ou 5.</div>"},
{"t": "Puissances (collège)", "q": "Simplifier 2³ × 2⁴.", "c": ["2⁷", "2¹²", "4⁷", "2⁶"], "a": 0, "e": "Même base : on additionne les exposants, 3 + 4 = 7, donc 2⁷.", "d": "Règle du produit : <b>aᵐ × aⁿ = aᵐ⁺ⁿ</b> — on additionne les exposants quand la base est la même.<div class='ex-detail'><u>Exemple rédigé</u> : 2³ × 2⁴ = 8 × 16 = 128 = 2⁷. Pièges : 2¹² (multiplication des exposants, fausse ici) et 4⁷ (multiplication des bases, interdit). Vérification numérique : 8 × 16 = 128 ✓.</div>"},
{"t": "Puissances (collège)", "q": "Combien vaut 10⁻³ ?", "c": ["−1000", "0,001", "0,0001", "−3"], "a": 1, "e": "10⁻³ = 1/10³ = 0,001 : exposant négatif → nombre plus petit que 1.", "d": "Un exposant négatif donne l'<b>inverse</b> : 10⁻ⁿ = 1/10ⁿ, un 1 en 3ᵉ position après la virgule pour n = 3.<div class='ex-detail'><u>Exemple rédigé</u> : 10⁻³ = 1/1000 = <b>0,001</b>. Attention : ce n'est PAS un nombre négatif ! 10⁻³ = 0,001 alors que −10³ = −1000 : deux notions différentes (inverse et opposé).</div>"},
{"t": "Puissances (collège)", "q": "Combien vaut (−2)⁴ ?", "c": ["−16", "−8", "8", "16"], "a": 3, "e": "Quatre facteurs égaux à −2 : le produit est positif, (−2)⁴ = 16.", "d": "Le signe du résultat dépend de la <b>parité de l'exposant</b> : pair → positif, impair → négatif.<div class='ex-detail'><u>Exemple rédigé</u> : (−2)⁴ = (−2)×(−2)×(−2)×(−2) = 4 × 4 = <b>16</b>. Comparer : (−2)³ = −8 (impair). Et distinguer −2⁴ = −16 : là, la base est 2 et le signe « − » reste devant.</div>"},
{"t": "Puissances (collège)", "q": "Quelle est l'écriture scientifique de 48 500 ?", "c": ["48,5 × 10³", "4,85 × 10⁵", "4,85 × 10⁴", "485 × 10²"], "a": 2, "e": "4,85 est entre 1 et 10, et 4,85 × 10⁴ = 48 500.", "d": "L'écriture scientifique impose <b>1 ≤ a < 10</b> : un seul chiffre (non nul) avant la virgule.<div class='ex-detail'><u>Exemple rédigé</u> : 48 500 = 4,85 × 10 000 = <b>4,85 × 10⁴</b>. Les autres propositions sont des écritures « approchées » mais pas scientifiques : 48,5 × 10³ et 485 × 10² ont un « a » trop grand ; 4,85 × 10⁵ vaudrait 485 000 ✗.</div>"},
{"t": "Puissances (collège)", "q": "Simplifier (10²)³.", "c": ["10⁵", "10⁶", "10⁸", "10⁹"], "a": 1, "e": "Puissance de puissance : on multiplie les exposants, 2 × 3 = 6, donc 10⁶.", "d": "Règle : <b>(aᵐ)ⁿ = aᵐˣⁿ</b> — on multiplie les exposants (contrairement au produit simple où l'on additionne).<div class='ex-detail'><u>Exemple rédigé</u> : (10²)³ = 100³ = 1 000 000 = <b>10⁶</b>. Astuce pour ne pas confondre : « parenthèses → multiplication », « sans parenthèses → addition ». Vérification : (2³)² = 8² = 64 = 2⁶ ✓.</div>"},
{"t": "Puissances (collège)", "q": "Simplifier 7⁵ ÷ 7³.", "c": ["7²", "7⁸", "7¹⁵", "1"], "a": 0, "e": "Quotient de même base : on soustrait les exposants, 5 − 3 = 2, donc 7².", "d": "Règle du quotient : <b>aᵐ ÷ aⁿ = aᵐ⁻ⁿ</b> — on soustrait les exposants, on ne les divise pas.<div class='ex-detail'><u>Exemple rédigé</u> : 7⁵ ÷ 7³ = 16807 ÷ 343 = <b>49 = 7²</b>. Piège : écrire 7⁵/³ ou 1⁷² n'a aucun sens. La vérification numérique (49) confirme la règle.</div>"},
{"t": "Puissances (collège)", "q": "Calculer 3 × 10⁵ × 4 × 10⁻³.", "c": ["6 × 10⁸", "12 × 10²", "1,2 × 10³", "6 × 10²"], "a": 2, "e": "(3×4) × (10⁵×10⁻³) = 12 × 10² = 1,2 × 10³ : on regroupe nombres et puissances.", "d": "Méthode : <b>regrouper</b> les nombres d'un côté, les puissances de 10 de l'autre, puis remettre en écriture scientifique.<div class='ex-detail'><u>Exemple rédigé</u> : (3 × 4) × (10⁵⁺⁽⁻³⁾) = 12 × 10². Puis 12 = 1,2 × 10, donc le résultat vaut 1200 = <b>1,2 × 10³</b>. La réponse 12 × 10² est correcte mais pas en écriture scientifique.</div>"},
{"t": "Puissances (collège)", "q": "Combien vaut −2⁴ ?", "c": ["16", "−16", "8", "−8"], "a": 1, "e": "Sans parenthèses, la base est 2 : −2⁴ = −(2⁴) = −16.", "d": "Convention d'écriture : <b>−2⁴ = −(2⁴)</b> : la puissance est prioritaire sur le signe.<div class='ex-detail'><u>Exemple rédigé</u> : −2⁴ = −(2×2×2×2) = <b>−16</b>, alors que (−2)⁴ = +16. La présence des parenthèses autour de −2 change la base. À retenir : exposant pair sans parenthèses → résultat négatif quand le « − » est devant.</div>"},
{"t": "Droite des milieux (collège)", "q": "I est le milieu de [AB], J celui de [AC] dans le triangle ABC. Que peut-on dire de (IJ) ?", "c": ["(IJ) est perpendiculaire à (BC)", "(IJ) est parallèle à (BC)", "(IJ) passe par le sommet A", "On ne peut rien dire"], "a": 1, "e": "La droite des milieux est parallèle au troisième côté : (IJ) ∥ (BC).", "d": "C'est le <b>théorème des milieux</b> : une droite qui passe par les milieux de deux côtés d'un triangle est parallèle au troisième côté.<div class='ex-detail'><u>Exemple</u> : dessinez un triangle quelconque, placez I et J aux milieux : la droite (IJ) « suit » le côté [BC] sans jamais le couper, quel que soit le triangle. Ce théorème ne demande aucune mesure : il suffit de CONNAÎTRE les deux milieux.</div>"},
{"t": "Droite des milieux (collège)", "q": "BC = 12 cm, I et J milieux de [AB] et [AC]. Combien vaut IJ ?", "c": ["12 cm", "6 cm", "24 cm", "4 cm"], "a": 1, "e": "IJ = BC/2 = 12/2 = 6 cm : le segment des milieux mesure la moitié du troisième côté.", "d": "Le segment qui joint les milieux mesure <b>la moitié du troisième côté</b> (celui qui n'a pas de milieu marqué).<div class='ex-detail'><u>Exemple rédigé</u> : IJ = BC/2 = 6 cm. Et dans l'autre sens : si IJ = 7 cm, alors BC = 2 × 7 = 14 cm. Piège : dire IJ = BC/2 ne concerne QUE le troisième côté — pas [AB] ni [AC].</div>"},
{"t": "Droite des milieux (collège)", "q": "IJ = 4,5 cm (segment des milieux). Combien vaut BC ?", "c": ["2,25 cm", "4,5 cm", "8 cm", "9 cm"], "a": 3, "e": "BC = 2 × IJ = 2 × 4,5 = 9 cm.", "d": "Relation dans les DEUX sens : IJ = BC/2 ⟺ <b>BC = 2 × IJ</b>.<div class='ex-detail'><u>Exemple rédigé</u> : BC = 2 × 4,5 = <b>9 cm</b>. Piège classique : diviser au lieu de multiplier (répondre 2,25). Astuce de contrôle : le segment des milieux est TOUJOURS plus court que le troisième côté ; ici 4,5 < 9 ✓, alors que 2,25 donnerait un segment des milieux plus long que BC : absurde.</div>"},
{"t": "Droite des milieux (collège)", "q": "Une droite passe par le milieu de [AB] et est parallèle à (BC). Elle coupe [AC]…", "c": ["en son milieu", "aux deux tiers", "n'importe où", "au sommet C"], "a": 0, "e": "Réciproque du théorème : elle coupe le troisième côté [AC] en son milieu.", "d": "C'est la <b>réciproque</b> : un milieu + une parallèle ⟹ le point d'intersection avec le 3ᵉ côté est son milieu.<div class='ex-detail'><u>Exemple rédigé</u> : K milieu de [AB], (d) ∥ (BC), (d) coupe [AC] en L. Hypothèses : un milieu + une parallèle. Conclusion : <b>L est le milieu de [AC]</b>. C'est l'outil idéal pour prouver qu'un point est un milieu sans aucune mesure.</div>"},
{"t": "Droite des milieux (collège)", "q": "Dans un triangle, on relie les milieux des quatre côtés d'un quadrilatère quelconque. On obtient toujours…", "c": ["un rectangle", "un losange", "un parallélogramme", "un carré"], "a": 2, "e": "Le quadrilatère des milieux est toujours un parallélogramme (théorème des milieux appliqué aux deux triangles).", "d": "Avec la diagonale [AC], le théorème donne (IJ) ∥ (AC) ∥ (LK) et IJ = LK = AC/2 : deux côtés <b>parallèles et de même longueur</b> ⟹ parallélogramme.<div class='ex-detail'><u>Exemple rédigé</u> : dans ABC, IJ joint les milieux de [AB] et [BC] donc IJ = AC/2 ; dans ACD, LK joint les milieux de [AD] et [CD] donc LK = AC/2. D'où IJ = LK et (IJ) ∥ (LK). C'est le quadrilatère de Varignon — un parallélogramme, même si le quadrilatère de départ est « tordu ».</div>"},
{"t": "Droite des milieux (collège)", "q": "Le théorème des milieux s'applique…", "c": ["dans n'importe quel triangle", "seulement dans un triangle rectangle", "seulement dans un triangle isocèle", "seulement dans un triangle équilatéral"], "a": 0, "e": "Il s'applique à tout triangle, sans condition particulière d'angles ou de côtés.", "d": "Contrairement au théorème de Pythagore (qui exige un triangle <b>rectangle</b>), le théorème des milieux vaut pour <b>tout triangle</b>.<div class='ex-detail'><u>À retenir</u> : Pythagore → condition « rectangle » ; milieux → aucune condition ; Thalès (3e) → droites parallèles. Bien associer chaque théorème à SES hypothèses est la clé des démonstrations au collège.</div>"},
{"t": "Droite des milieux (collège)", "q": "I milieu de [AB], J milieu de [AC], BC = 9. Quelle est la longueur IJ ?", "c": ["9", "4,5", "18", "3"], "a": 1, "e": "IJ = BC/2 = 9/2 = 4,5.", "d": "Application directe : <b>IJ = BC/2</b>.<div class='ex-detail'><u>Exemple rédigé</u> : IJ = 9/2 = <b>4,5</b>. Remarque : même sans connaître AB ni AC, on connaît IJ ! C'est la force du théorème : le segment des milieux ne dépend QUE du troisième côté.</div>"},
{"t": "Droite des milieux (collège)", "q": "La droite qui joint un sommet au milieu du côté opposé s'appelle…", "c": ["la droite des milieux", "la médiane", "la hauteur", "la médiatrice"], "a": 1, "e": "C'est la médiane ; la droite des milieux joint les milieux de deux côtés et ne passe pas par un sommet.", "d": "Ne pas confondre les « droites remarquables » : <b>médiane</b> = sommet → milieu du côté opposé ; <b>droite des milieux</b> = milieu → milieu (parallèle au 3ᵉ côté) ; <b>hauteur</b> = perpendiculaire au côté opposé ; <b>médiatrice</b> = perpendiculaire en son milieu à un côté.<div class='ex-detail'><u>Exemple</u> : dans un triangle ABC, la médiane issue de A va de A au milieu de [BC] ; la droite des milieux, elle, ne touche A <i>jamais</i> : elle joint les milieux de [AB] et [AC].</div>"},
{"t": "Droite des milieux (collège)", "q": "Pour appliquer le théorème des milieux, il faut connaître…", "c": ["les milieux de deux côtés (ou un milieu + une parallèle)", "les trois angles du triangle", "la longueur des trois côtés", "le périmètre du triangle"], "a": 0, "e": "Deux milieux suffisent (ou un milieu plus une parallèle pour la réciproque) : aucune mesure n'est nécessaire.", "d": "Les hypothèses du théorème sont <b>purement géométriques</b> : deux milieux ⟹ parallèle + moitié du 3ᵉ côté.<div class='ex-detail'><u>Exemple</u> : « I est le milieu de [AB] et J celui de [AC] » suffit pour affirmer (IJ) ∥ (BC) ET IJ = BC/2. Aucune longueur d'angle n'est requise — c'est ce qui rend ce théorème si pratique en démonstration.</div>"},
{"t": "Droite des milieux (collège)", "q": "I et J milieux de [AB] et [AC], IJ = 7, BC = 15. Les données sont-elles cohérentes ?", "c": ["Oui, tout va bien", "Non : on devrait avoir IJ = 7,5", "Non : on devrait avoir IJ = 30", "On ne peut pas savoir"], "a": 1, "e": "Le théorème impose IJ = 15/2 = 7,5 ≠ 7 : les données contredisent le théorème.", "d": "Le théorème des milieux est une <b>contrainte</b> : si les milieux sont connus, IJ est IMPOSÉ par BC/2.<div class='ex-detail'><u>Exemple rédigé</u> : IJ doit valoir 15/2 = <b>7,5</b>. Annoncer IJ = 7 contredit le théorème : soit I ou J n'est pas réellement un milieu, soit BC ≠ 15. Ce type de question « cohérence » tombe souvent au contrôle : toujours vérifier IJ × 2 = BC.</div>"},
{"t": "Calcul littéral (collège)", "q": "Réduire 5x + 3 − 2x + 7.", "c": ["3x + 10", "7x + 10", "3x − 4", "13x"], "a": 0, "e": "5x − 2x = 3x et 3 + 7 = 10, donc 3x + 10.", "d": "On regroupe les <b>termes de même nature</b> : les « x » entre eux, les nombres entre eux.<div class='ex-detail'><u>Exemple rédigé</u> : 5x + 3 − 2x + 7 = (5x − 2x) + (3 + 7) = <b>3x + 10</b>. Piège : additionner tout (7x + 13x ?) ou mélanger x et nombres (13x) : 3x + 10 est irréductible, x désigne un nombre inconnu, pas le nombre 1.</div>"},
{"t": "Calcul littéral (collège)", "q": "x + x + x + x est égal à…", "c": ["x⁴", "4x", "4 + x", "x² + x"], "a": 1, "e": "Quatre fois x en somme : x + x + x + x = 4x.", "d": "Somme répétée ⟹ <b>4x</b> ; produit répété ⟹ x⁴. Il faut distinguer les deux situations.<div class='ex-detail'><u>Exemple</u> : avec x = 3, la somme 3+3+3+3 = 12 = 4×3 = 4x ✓, alors que x⁴ = 81. Astuce visuelle : additionner des « baguettes » donne 4 baguettes ; multiplier x par x par x par x donne un nombre totalement différent.</div>"},
{"t": "Calcul littéral (collège)", "q": "Développer 3(2x − 5).", "c": ["6x − 5", "6x − 15", "5x − 15", "6x + 15"], "a": 1, "e": "Le 3 multiplie les DEUX termes : 3×2x = 6x et 3×5 = 15.", "d": "Simple distributivité : <b>k(a − b) = ka − kb</b> — le facteur multiplie chaque terme de la parenthèse.<div class='ex-detail'><u>Exemple rédigé</u> : 3(2x − 5) = 6x − <b>15</b>. Piège : 6x − 5 (oubli de multiplier le second terme). Vérification avec x = 1 : 3(2 − 5) = −9 et 6 − 15 = −9 ✓, alors que 6 − 5 = 1 ✗.</div>"},
{"t": "Calcul littéral (collège)", "q": "Développer et réduire (x + 3)(2x − 4).", "c": ["2x² − 12", "2x² + 2x − 12", "2x² − 2x − 12", "3x − 1"], "a": 1, "e": "Double distributivité : x×2x − x×4 + 3×2x − 3×4 = 2x² + 2x − 12.", "d": "Chaque terme de la première parenthèse multiplie chaque terme de la seconde : <b>4 produits</b> en tout.<div class='ex-detail'><u>Exemple rédigé</u> : x×2x = 2x² ; x×(−4) = −4x ; 3×2x = 6x ; 3×(−4) = −12. Somme : 2x² − 4x + 6x − 12 = <b>2x² + 2x − 12</b>. Vérification x = 1 : (4)(−2) = −8 et 2 + 2 − 12 = −8 ✓.</div>"},
{"t": "Calcul littéral (collège)", "q": "Développer −2(x − 4).", "c": ["−2x − 8", "−2x + 8", "2x − 8", "−2x − 4"], "a": 1, "e": "−2×x = −2x et −2×(−4) = +8 : moins fois moins donne plus.", "d": "Le facteur négatif multiplie chaque terme : <b>−2(x − 4) = −2x + 8</b>, car (−2)×(−4) = +8.<div class='ex-detail'><u>Exemple rédigé</u> : −2×x = −2x ; −2×(−4) = +8 (règle des signes). Piège ultra-fréquent : écrire −8 (on « garde » le signe du −4 au lieu de multiplier). Vérification x = 3 : −2(3−4) = −2×(−1) = 2 et −6 + 8 = 2 ✓.</div>"},
{"t": "Calcul littéral (collège)", "q": "Calculer 2x² − 3x + 1 pour x = −2.", "c": ["3", "15", "−1", "−3"], "a": 1, "e": "2×(−2)² − 3×(−2) + 1 = 8 + 6 + 1 = 15.", "d": "Substitution : remplacer x par (−2), <b>avec parenthèses</b>, puis respecter les priorités (puissance, multiplication, addition).<div class='ex-detail'><u>Exemple rédigé</u> : 2×(−2)² − 3×(−2) + 1 = 2×4 + 6 + 1 = <b>15</b>. Deux pièges : (−2)² = +4 (pas −4) et −3×(−2) = +6. Sans parenthèses, on écrirait −3×−2 sans gérer les signes.</div>"},
{"t": "Calcul littéral (collège)", "q": "Parmi ces expressions, laquelle est REDUITE (ne peut plus se simplifier) ?", "c": ["5x + 3x", "4x + 7", "2x + x²", "3(x + 1)"], "a": 1, "e": "4x et 7 sont de natures différentes : 4x + 7 est irréductible.", "d": "Une expression est réduite quand <b>plus aucun regroupement n'est possible</b>.<div class='ex-detail'><u>Exemple</u> : 5x + 3x = 8x (même nature) ; 2x + x² ne se réduit PAS (x et x² : natures différentes) ; 3(x + 1) se développe en 3x + 3. Seule <b>4x + 7</b> est déjà réduite : x et nombre ne s'additionnent pas.</div>"},
{"t": "Calcul littéral (collège)", "q": "x × x × x est égal à…", "c": ["3x", "x³", "x + 3", "3 + x"], "a": 1, "e": "Trois facteurs égaux à x : c'est x³ (produit répété).", "d": "Produit répété ⟹ <b>puissance</b> : x×x×x = x³ ; somme répétée ⟹ coefficient : x + x + x = 3x.<div class='ex-detail'><u>Exemple</u> : avec x = 2, le produit 2×2×2 = 8 = 2³, alors que 3x = 6. Les deux résultats différent : d'où l'importance du signe (× ou +) entre les facteurs. Rappel des aires et volumes : côté × côté = aire (c²), côté × côté × côté = volume (c³).</div>"},
{"t": "Calcul littéral (collège)", "q": "Développer et réduire 2(3x + 1) − (x − 5).", "c": ["6x + 2 − x + 5 = 5x + 7", "5x − 3", "6x + 2 − x − 5 = 5x − 3", "7x + 7"], "a": 0, "e": "La parenthèse précédée de « − » change les signes : −(x − 5) = −x + 5.", "d": "Deux étapes : distributivité puis gestion du signe « − » devant la parenthèse, qui <b>inverse chaque terme</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 2(3x + 1) = 6x + 2 ; −(x − 5) = −x + 5. Total : 6x + 2 − x + 5 = <b>5x + 7</b>. Piège : écrire −x − 5 (le « − » ne s'applique qu'au premier terme pour beaucoup d'élèves, erreur classique). Vérification x = 0 : 2(1) − (−5) = 7 et 5×0 + 7 = 7 ✓.</div>"},
{"t": "Calcul littéral (collège)", "q": "Quelle est la forme développée de 5(x + 2) ?", "c": ["5x + 2", "5x + 10", "x + 10", "5x + 7"], "a": 1, "e": "5×x + 5×2 = 5x + 10.", "d": "Distributivité directe : le facteur 5 multiplie <b>chaque terme</b> de la parenthèse.<div class='ex-detail'><u>Exemple rédigé</u> : 5(x + 2) = 5x + <b>10</b>. Piège : 5x + 2 (le « 2 » n'a pas été multiplié). Vérification avec x = 1 : 5×3 = 15 ; 5 + 10 = 15 ✓ mais 5 + 2 = 7 ✗. Toujours tester sur un exemple numérique !</div>"},
{"t": "Équations (collège)", "q": "Quelle est la solution de 3x − 5 = 16 ?", "c": ["x = 7", "x = 21", "x = 3", "x = 5"], "a": 0, "e": "+5 des deux côtés : 3x = 21 ; ÷3 : x = 7.", "d": "Principe de la balance : <b>on ajoute 5</b> aux deux membres (3x = 21), puis <b>on divise par 3</b> (x = 7).<div class='ex-detail'><u>Exemple rédigé</u> : 3x − 5 + 5 = 16 + 5 ⟹ 3x = 21 ⟹ x = 21/3 = <b>7</b>. Vérification : 3×7 − 5 = 16 ✓. Piège : s'arrêter à x = 21 (oubli de la division) ou répondre x = 3 en « divisant » 16 − 5 par… rien.</div>"},
{"t": "Équations (collège)", "q": "Résoudre 5x + 2 = 2x + 14.", "c": ["x = 12", "x = 4", "x = 16/7", "x = 2"], "a": 1, "e": "−2x : 3x + 2 = 14 ; −2 : 3x = 12 ; x = 4.", "d": "Quand x est des deux côtés : <b>soustraire le x du côté le plus petit</b> pour garder un coefficient positif, puis isoler.<div class='ex-detail'><u>Exemple rédigé</u> : 5x + 2 = 2x + 14 ⟹ (5x − 2x) + 2 = 14 ⟹ 3x + 2 = 14 ⟹ 3x = 12 ⟹ <b>x = 4</b>. Vérification : 5×4 + 2 = 22 = 2×4 + 14 ✓. Piège : regrouper les x à droite donne −3x = −12, même solution mais plus de risques d'erreur de signe.</div>"},
{"t": "Équations (collège)", "q": "Résoudre 2(3x − 1) = 4x + 6.", "c": ["x = 2", "x = 4", "x = 1", "x = 6"], "a": 1, "e": "On développe : 6x − 2 = 4x + 6 ; puis 2x = 8 ; x = 4.", "d": "Avec des parenthèses : <b>développer d'abord</b>, puis résoudre comme d'habitude.<div class='ex-detail'><u>Exemple rédigé</u> : 2(3x − 1) = 6x − 2, donc 6x − 2 = 4x + 6 ⟹ 6x − 4x = 6 + 2 ⟹ 2x = 8 ⟹ <b>x = 4</b>. Vérification : 2(12 − 1) = 22 et 16 + 6 = 22 ✓. Oublier le « −2 × (−1) » en développant est l'erreur la plus fréquente.</div>"},
{"t": "Équations (collège)", "q": "Quelle est la solution de x/4 = 7 ?", "c": ["x = 28", "x = 11", "x = 3/4", "x = 7/4"], "a": 0, "e": "On multiplie les deux côtés par 4 : x = 28.", "d": "Division ⟹ on <b>multiplie</b> les deux membres par le dénominateur.<div class='ex-detail'><u>Exemple rédigé</u> : (x/4) × 4 = 7 × 4 ⟹ <b>x = 28</b>. Vérification : 28/4 = 7 ✓. Piège : additionner 4 (x = 11 ne marche pas : 11/4 = 2,75 ≠ 7). Règle d'or : une division se « défait » par une multiplication, une soustraction par une addition.</div>"},
{"t": "Équations (collège)", "q": "Hugo paie 3 cahiers identiques avec 15 € et il lui reste 3 €. Quel est le prix d'un cahier ?", "c": ["5 €", "4 €", "3 €", "12 €"], "a": 1, "e": "3x + 3 = 15 donne 3x = 12, donc x = 4 €.", "d": "Mise en équation : <b>choisir l'inconnue</b> (x = prix d'un cahier), <b>traduire</b> (3x + 3 = 15), <b>résoudre</b> (x = 4), <b>vérifier</b> (12 + 3 = 15 ✓).<div class='ex-detail'><u>Exemple rédigé</u> : 3x = 15 − 3 = 12, donc x = <b>4 €</b>. Piège : répondre 5 € en divisant 15 par 3 sans tenir compte de la monnaie rendue. Toujours vérifier la cohérence avec l'énoncé : 3 × 4 + 3 = 15 ✓.</div>"},
{"t": "Équations (collège)", "q": "Résoudre −2x + 8 = 0.", "c": ["x = 8", "x = 4", "x = −4", "x = 2"], "a": 1, "e": "−2x = −8, donc x = (−8)/(−2) = 4.", "d": "Attention aux signes : <b>diviser par un négatif</b> donne x = (−8)/(−2) = +4.<div class='ex-detail'><u>Exemple rédigé</u> : −2x + 8 = 0 ⟹ −2x = −8 ⟹ x = (−8) ÷ (−2) = <b>4</b> (négatif ÷ négatif = positif). Vérification : −2×4 + 8 = 0 ✓. Piège : écrire x = −4 (le signe « − » reste collé). Astuce : on peut aussi multiplier d'abord toute l'équation par −1 : 2x − 8 = 0.</div>"},
{"t": "Équations (collège)", "q": "Le nombre 2 est-il solution de 4x − 3 = 5 ?", "c": ["Oui", "Non, la solution est 5", "Non, la solution est 8", "Non, la solution est 2/3"], "a": 0, "e": "4×2 − 3 = 8 − 3 = 5 : l'égalité est vraie, donc 2 est bien solution.", "d": "Tester une valeur : remplacer x par 2 dans le <b>membre de gauche</b> et comparer au membre de droite.<div class='ex-detail'><u>Exemple rédigé</u> : 4×2 − 3 = 5. Le membre de gauche vaut 5, comme le membre de droite : l'égalité est VRAIE, donc <b>2 est solution</b>. Si on avait testé 3 : 4×3 − 3 = 9 ≠ 5, pas solution. Cette vérification est aussi la preuve finale obligatoire après TOUTE résolution.</div>"},
{"t": "Équations (collège)", "q": "Quelle est la première étape pour résoudre 7x − 12 = 9 ?", "c": ["Diviser les deux côtés par 7", "Ajouter 12 aux deux côtés", "Soustraire 9 aux deux côtés", "Multiplier les deux côtés par 12"], "a": 1, "e": "On supprime d'abord la soustraction : +12 des deux côtés, puis on divisera par 7.", "d": "Ordre des opérations : on neutralise <b>d'abord additions/soustractions</b>, <b>ensuite</b> multiplications/divisions.<div class='ex-detail'><u>Exemple rédigé</u> : 7x − 12 = 9 ⟹ 7x = 21 (en ajoutant 12) ⟹ x = 3 (en divisant par 7). Si on divise d'abord : (7x − 12)/7 = 9/7 complique inutilement les fractions. Vérification : 7×3 − 12 = 9 ✓.</div>"},
{"t": "Équations (collège)", "q": "Résoudre 3(x + 2) = 3x + 8.", "c": ["x = 2", "x = 0", "Aucune solution", "Tous les nombres sont solutions"], "a": 2, "e": "En développant : 3x + 6 = 3x + 8 ⟹ 6 = 8, faux : aucune solution.", "d": "Parfois les x <b>s'annulent</b> : si l'égalité finale est fausse, l'équation n'a <b>aucune solution</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 3x + 6 = 3x + 8 ⟹ 6 = 8 après soustraction de 3x. C'est FAUX pour tout x : <b>aucune solution</b>. (Si on avait obtenu 6 = 6, tous les nombres seraient solutions.) Ce cas piège beaucoup d'élèves : « disparaître des x » n'est pas une erreur, c'est une information.</div>"},
{"t": "Équations (collège)", "q": "Après avoir résolu une équation, que faut-il TOUJOURS faire ?", "c": ["Rédiger une phrase avec l'unité", "Vérifier la solution dans l'équation de départ", "Encadrer le résultat", "Convertir en écriture scientifique"], "a": 1, "e": "La vérification dans l'équation initiale confirme le calcul et évite les erreurs de signe.", "d": "La <b>vérification</b> (remplacer x par la valeur trouvée et contrôler l'égalité) est la meilleure protection contre les erreurs de signe et d'étourderie.<div class='ex-detail'><u>Exemple</u> : pour 3x − 5 = 16, on trouve x = 7, puis on teste : 3×7 − 5 = 16 ✓. Si le test échoue (ex. x = 8 donnerait 19 ≠ 16), on repère l'erreur AVANT de rendre la copie. C'est aussi une attente de rédaction au contrôle.</div>"},
{"t": "Proportionnalité (collège)", "q": "6 kg de pommes coûtent 9 €. Combien coûtent 10 kg ?", "c": ["12 €", "15 €", "16 €", "10 €"], "a": 1, "e": "Produit en croix : (10 × 9)/6 = 15 €.", "d": "La <b>quatrième proportionnelle</b> se calcule par produit en croix : x = (10×9)/6 = <b>15 €</b>.<div class='ex-detail'><u>Exemple rédigé</u> : coefficient de proportionnalité = 9/6 = 1,5 € par kg, donc 10 × 1,5 = <b>15 €</b>. Piège : les grandeurs doivent être proportionnelles (ici, le prix l'est) ; pour 10 kg, ne pas additionner 9 + 6 = 15 par hasard sans méthode : ici le produit en croix le justifie proprement.</div>"},
{"t": "Proportionnalité (collège)", "q": "Une voiture parcourt 210 km en 2 h 30 min. Sa vitesse moyenne est…", "c": ["105 km/h", "84 km/h", "90 km/h", "78,5 km/h"], "a": 1, "e": "2 h 30 = 2,5 h, donc v = 210/2,5 = 84 km/h.", "d": "Étape indispensable : <b>convertir le temps en heures décimales</b> (2 h 30 = 2,5 h) AVANT de diviser.<div class='ex-detail'><u>Exemple rédigé</u> : v = d/t = 210/2,5 = <b>84 km/h</b>. Piège classique : 210/2,30 ≈ 91 km/h (les minutes ne sont PAS des centièmes). Convertir aussi dans l'autre sens : 3,75 h = 3 h 45 min (0,75 × 60 = 45).</div>"},
{"t": "Proportionnalité (collège)", "q": "Convertir 90 km/h en m/s.", "c": ["9 m/s", "25 m/s", "324 m/s", "2,5 m/s"], "a": 1, "e": "km/h → m/s : on divise par 3,6 : 90/3,6 = 25 m/s.", "d": "Règle : <b>÷3,6</b> pour km/h → m/s, <b>×3,6</b> pour m/s → km/h (car 1 h = 3600 s et 1 km = 1000 m : 1000/3600 = 1/3,6).<div class='ex-detail'><u>Exemple rédigé</u> : 90 km = 90 000 m parcourus en 3600 s : 90 000/3600 = <b>25 m/s</b>. Contrôle d'ordre de grandeur : la valeur en m/s est toujours plus petite qu'en km/h (25 < 90). Répondre 324 (×3,6) est le piège inverse.</div>"},
{"t": "Proportionnalité (collège)", "q": "Sur une carte au 1/25 000, 4,8 cm séparent deux villages. Distance réelle ?", "c": ["1,2 km", "120 km", "12 km", "480 m"], "a": 0, "e": "4,8 × 25 000 = 120 000 cm = 1,2 km.", "d": "L'échelle 1/25 000 signifie : 1 cm (carte) = 25 000 cm (réel), <b>mêmes unités</b> avant le produit en croix.<div class='ex-detail'><u>Exemple rédigé</u> : distance réelle = 4,8 × 25 000 = 120 000 cm, puis conversion : 120 000 cm = 1200 m = <b>1,2 km</b>. Piège : oublier la conversion finale (répondre « 120 000 ») ou diviser au lieu de multiplier. Contrôle : une carte est une RÉDUCTION, donc la distance réelle doit être bien plus grande.</div>"},
{"t": "Proportionnalité (collège)", "q": "À 84 km/h, combien de temps pour parcourir 315 km ?", "c": ["3,75 h soit 3 h 45 min", "3 h 75 min", "2,5 h", "4,2 h"], "a": 0, "e": "t = d/v = 315/84 = 3,75 h = 3 h 45 min.", "d": "Trois formules à connaître : v = d/t, d = v×t, <b>t = d/v</b> — et convertir l'heure décimale en h/min.<div class='ex-detail'><u>Exemple rédigé</u> : t = 315/84 = 3,75 h. La partie décimale se convertit en MULTIPLIANT par 60 : 0,75 × 60 = 45 min, donc <b>3 h 45 min</b>. Piège : « 3 h 75 min » n'existe pas (75 min = 1 h 15 min !) ; 0,75 h ≠ 75 min.</div>"},
{"t": "Proportionnalité (collège)", "q": "Un article de 40 € est soldé à −20 %. Nouveau prix ?", "c": ["38 €", "32 €", "20 €", "8 €"], "a": 1, "e": "40 × 0,8 = 32 € : diminuer de 20 % = multiplier par 0,8.", "d": "Diminuer de t % = multiplier par (1 − t/100) : <b>−20 % = ×0,8</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 40 × (1 − 20/100) = 40 × 0,8 = <b>32 €</b>. Piège : 40 × 20 = 800 (les pourcentages se calculent par rapport au PRIX, pas sur 100) ; ou 40 − 20 = 20 (confondre % et €). La remise vaut 40 × 0,2 = 8 €, et 40 − 8 = 32 ✓.</div>"},
{"t": "Proportionnalité (collège)", "q": "Vrai ou faux : 2 h 30 min s'écrit 2,30 h en heure décimale.", "c": ["Vrai", "Faux : c'est 2,5 h", "Faux : c'est 2,3 h", "Cela dépend du contexte"], "a": 1, "e": "30 min = une demi-heure : 2 h 30 min = 2,5 h, pas 2,30 h.", "d": "Les minutes sont en <b>base 60</b> : pour obtenir l'heure décimale, on divise les minutes par 60.<div class='ex-detail'><u>Exemple rédigé</u> : 30/60 = 0,5, donc 2 h 30 = <b>2,5 h</b>. De même 45 min = 0,75 h, et 2,4 h = 2 h 24 min (0,4×60). Piège du contrôle : utiliser 2,30 h fausse tout calcul de vitesse (210/2,30 ≈ 91 au lieu de 84).</div>"},
{"t": "Proportionnalité (collège)", "q": "Un cycliste fait 12 km à 24 km/h puis 12 km à 12 km/h. Sa vitesse moyenne est…", "c": ["18 km/h", "20 km/h", "16 km/h", "17 km/h"], "a": 2, "e": "t1 = 12/24 = 0,5 h et t2 = 12/12 = 1 h : distance totale 24 km en 1,5 h, donc v = 24/1,5 = 16 km/h.", "d": "La vitesse moyenne se calcule sur l'ENSEMBLE du trajet : <b>distance totale ÷ temps total</b> — ce n'est pas la moyenne des vitesses.<div class='ex-detail'><u>Exemple rédigé</u> : t1 = 12/24 = 0,5 h ; t2 = 12/12 = 1 h. Distance totale 24 km, temps total 1,5 h : v = 24/1,5 = <b>16 km/h</b>, et non (24+12)/2 = 18. On passe plus de temps à vitesse lente, ce qui tire la moyenne vers le bas.</div>"},
{"t": "Proportionnalité (collège)", "q": "Sur un plan à l'échelle 1/100, une longueur réelle de 2 m est représentée par…", "c": ["0,2 cm", "2 cm", "20 cm", "0,02 cm"], "a": 1, "e": "2 m = 200 cm, et 200/100 = 2 cm sur le plan.", "d": "Échelle 1/100 = le plan est 100 fois plus petit : distance plan = distance réelle <b>÷ 100</b>, unités identiques.<div class='ex-detail'><u>Exemple rédigé</u> : 2 m = 200 cm ; 200/100 = <b>2 cm</b>. Astuce : au 1/100, 1 m réel = 1 cm plan (pratique pour les plans d'appartement). Piège : convertir avant de diviser — mélanger m et cm ruine le résultat (0,02 vient de 2/100 sans conversion).</div>"},
{"t": "Proportionnalité (collège)", "q": "Le coefficient de proportionnalité entre les quantités et les prix vaut 1,5 (€/kg). 10 kg coûtent…", "c": ["15 €", "11,5 €", "10,5 €", "1,5 €"], "a": 0, "e": "10 × 1,5 = 15 € : on multiplie la quantité par le coefficient.", "d": "Le <b>coefficient de proportionnalité</b> multiplie chaque ligne du tableau : prix = 1,5 × quantité.<div class='ex-detail'><u>Exemple rédigé</u> : 10 × 1,5 = <b>15 €</b>. Vérification : 6 kg → 9 €, et 9/6 = 1,5 ✓. Piège : additionner le coefficient (10 + 1,5 = 11,5) : le coefficient MULTIPLIE, il ne s'ajoute pas — c'est la différence entre situation linéaire (proportionnelle) et affine.</div>"},
{"t": "Pyramides et cônes (collège)", "q": "Pyramide à base carrée de côté 6 cm, hauteur 9 cm. Son volume vaut…", "c": ["324 cm³", "108 cm³", "54 cm³", "162 cm³"], "a": 1, "e": "V = (1/3) × 36 × 9 = 108 cm³.", "d": "Deux étapes : <b>aire de base</b> B = 6² = 36 cm², puis V = (1/3) × B × h.<div class='ex-detail'><u>Exemple rédigé</u> : V = (1/3) × 36 × 9 = 12 × 9 = <b>108 cm³</b>. Piège : 324 correspond au PRISME (36 × 9 sans le tiers), 54 vient de (1/3) × 6 × 9 (oubli de mettre le côté au carré). Contrôle : la pyramide est 3 fois plus petite que le prisme ✓.</div>"},
{"t": "Pyramides et cônes (collège)", "q": "Cône de rayon 3 cm et de hauteur 10 cm. Volume exact ?", "c": ["30π cm³", "90π cm³", "10π cm³", "94,2 cm³"], "a": 0, "e": "V = (1/3) × π × 9 × 10 = 30π cm³ (94,2 n'est pas une valeur exacte).", "d": "V = (1/3)πr²h avec r² = <b>9</b> (pas 6 !) : V = (1/3) × π × 9 × 10 = <b>30π cm³</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 90/3 = 30, donc 30π ≈ 94,2 cm³. Pièges : 90π (oubli du tiers) ; confondre r² = 9 avec 2r = 6 ; donner 94,2 comme valeur « exacte » : seul 30π est exact, 94,2 en est l'ARRONDI.</div>"},
{"t": "Pyramides et cônes (collège)", "q": "Pyramide à base carrée de côté 5, volume 75 cm³. Quelle est sa hauteur ?", "c": ["15 cm", "9 cm", "3 cm", "5 cm"], "a": 1, "e": "h = 3V/B = 75 × 3/25 = 9 cm.", "d": "Formule à l'envers : h = <b>3V/B</b>, avec B = 5² = 25 cm².<div class='ex-detail'><u>Exemple rédigé</u> : h = (3 × 75)/25 = 225/25 = <b>9 cm</b>. Vérification : (1/3) × 25 × 9 = 75 ✓. Piège : oublier le facteur 3 (répondre 3 cm en divisant 75 par 25). Toujours vérifier en recalculant V avec la hauteur trouvée.</div>"},
{"t": "Pyramides et cônes (collège)", "q": "Dans la formule V = (1/3) × B × h, que représente B ?", "c": ["Le périmètre de la base", "Un côté de la base", "L'AIRE de la base", "La hauteur de la base"], "a": 2, "e": "B est l'aire de la base (cm² si les longueurs sont en cm).", "d": "B est une <b>AIRE</b> : c'est la première cause d'erreur dans les calculs de volumes.<div class='ex-detail'><u>Exemple</u> : pour une base carrée de côté 6, B = 6 × 6 = 36 cm² — écrire B = 6 dans la formule fausse tout le calcul. Rappels : carré → c², rectangle → L×l, disque → πr², triangle → (b×h)/2. L'unité de B est le cm², celle de V le cm³.</div>"},
{"t": "Pyramides et cônes (collège)", "q": "On divise toutes les dimensions d'un cône par 2. Son volume est divisé par…", "c": ["2", "4", "8", "6"], "a": 2, "e": "k = 1/2 pour les longueurs : les volumes sont multipliés par k³ = 1/8.", "d": "Agrandissement-réduction : longueurs ×k, aires ×k², <b>volumes ×k³</b>.<div class='ex-detail'><u>Exemple rédigé</u> : avec k = 1/2, le volume du petit cône vaut (1/2)³ = 1/8 du grand : divisé par <b>8</b>. Intuition : cm × cm × cm — le facteur k intervient TROIS fois dans un produit de trois longueurs. Piège : répondre 2 (comme les longueurs) ou 4 (comme les aires).</div>"},
{"t": "Pyramides et cônes (collège)", "q": "Une pyramide régulière a pour base…", "c": ["n'importe quel polygone", "un polygone régulier, avec la hauteur passant par son centre", "un cercle", "un triangle quelconque"], "a": 1, "e": "Pyramide régulière = base polygonale régulière + hauteur issue du centre de la base.", "d": "Définition : pyramide <b>régulière</b> ⟺ base <b>polygone régulier</b> (côtés et angles égaux : carré, triangle équilatéral…) ET la hauteur passe par le <b>centre</b> de la base.<div class='ex-detail'><u>À retenir</u> : conséquence pratique — les arêtes latérales (et les faces latérales) sont toutes identiques, ce qui permet de calculer une hauteur latérale avec Pythagore. Une pyramide à base carrée mais « penchée » (sommet décalé) n'est PAS régulière. Base circulaire = cône, pas pyramide.</div>"},
{"t": "Pyramides et cônes (collège)", "q": "Section d'un cône par un plan parallèle à la base : on obtient…", "c": ["un triangle", "un disque", "un rectangle", "un demi-disque"], "a": 1, "e": "La section est un disque, réduction du disque de base.", "d": "Une section par un plan <b>parallèle à la base</b> donne toujours une figure de même nature que la base (cône → disque ; pyramide à base carrée → carré).<div class='ex-detail'><u>Exemple rédigé</u> : à mi-hauteur du cône, le disque obtenu a un rayon moitié de celui de la base (théorème non exigé, mais l'idée de réduction est au programme). Si le plan n'est PAS parallèle, la section est différente (ellipse…), mais au collège on se limite au plan parallèle.</div>"},
{"t": "Pyramides et cônes (collège)", "q": "Un cylindre et un cône ont même base (rayon 3 cm) et même hauteur (10 cm). Rapport des volumes ?", "c": ["Le cône vaut le tiers du cylindre", "Ils ont le même volume", "Le cône vaut le double", "Le cône vaut la moitié"], "a": 0, "e": "Vcône = (1/3)πr²h et Vcylindre = πr²h : le cône est 3 fois plus petit.", "d": "Formules à comparer : cylindre V = πr²h ; cône V = <b>(1/3)</b>πr²h — même base, même hauteur, rapport de 3.<div class='ex-detail'><u>Exemple rédigé</u> : avec r = 3 et h = 10 : cylindre 90π ≈ 282,7 cm³ ; cône 30π ≈ 94,2 cm³ ; 282,7/94,2 = 3 ✓. C'est aussi vrai pyramide/prisme. Astuce mémo : il faut 3 cônes de sable pour remplir le cylindre du même seau.</div>"},
{"t": "Pyramides et cônes (collège)", "q": "Volume d'une pyramide de base 50 cm² et de hauteur 12 cm.", "c": ["600 cm³", "200 cm³", "50 cm³", "120 cm³"], "a": 1, "e": "V = (1/3) × 50 × 12 = 600/3 = 200 cm³.", "d": "Application directe quand B est <b>déjà une aire</b> : V = (1/3) × B × h.<div class='ex-detail'><u>Exemple rédigé</u> : (1/3) × 50 × 12 = 50 × 4 = <b>200 cm³</b> (diviser 12 par 3 donne 4 : calcul astucieux). Piège : 600 est le volume du PRISME (50 × 12 sans le tiers). Toujours se demander « ai-je bien mis le tiers ? » avant de conclure.</div>"},
{"t": "Pyramides et cônes (collège)", "q": "Dans un cône de révolution, la génératrice relie…", "c": ["le centre de la base au sommet", "un point du cercle de base au sommet", "deux points du cercle de base", "le sommet au pied de la hauteur"], "a": 1, "e": "La génératrice joint un point du cercle de base au sommet ; avec r et h, sa longueur se calcule par Pythagore.", "d": "La <b>génératrice</b> est l'hypoténuse du triangle rectangle formé par le rayon et la hauteur.<div class='ex-detail'><u>Exemple rédigé</u> : avec r = 3 et h = 4, génératrice = √(3² + 4²) = 5 (triplet (3 ; 4 ; 5)). Piège : la confondre avec la hauteur (sommet → pied perpendiculaire au centre) : dans un cône « allongé », la génératrice est plus longue que la hauteur.</div>"},
{"t": "Thalès (collège)", "q": "(MN) ∥ (BC) avec M sur (AB), N sur (AC). Quelle égalité de rapports est garantie ?", "c": ["AM/AN = AB/AC = MN/BC", "AM/MB = AN/NC", "AB/AM = AC/BC", "AM/AB = AN/AC = MN/BC"], "a": 3, "e": "Thalès : les trois rapports de côtés homologues sont égaux.", "d": "Les côtés homologues se correspondent « petit sur grand » : <b>AM/AB = AN/AC = MN/BC</b>.<div class='ex-detail'><u>Exemple</u> : avec AM = 3, AB = 9 : le rapport vaut 1/3 ; alors AN = AC/3 et MN = BC/3. Piège : écrire AM/AN = AB/AC mélange les deux droites sécantes ; on reconnaît la bonne égalité au fait que chaque rapport prend un point de la paire M/B et son homologue N/C.</div>"},
{"t": "Thalès (collège)", "q": "AM = 3, AB = 9, AN = 4. Avec (MN) ∥ (BC), que vaut AC ?", "c": ["4/3", "27", "12", "6"], "a": 2, "e": "3/9 = 4/AC ⟹ AC = 9×4/3 = 12.", "d": "Produit en croix sur les rapports de Thalès : <b>AC = (AB × AN)/AM</b>.<div class='ex-detail'><u>Exemple rédigé</u> : AM/AB = AN/AC ⟹ 3/9 = 4/AC ⟹ AC = 36/3 = <b>12</b>. Contrôle : AN = 4 doit être le tiers de AC = 12 ✓ (rapport 1/3 partout). Piège : diviser au lieu de multiplier (répondre 4/3 ≈ 1,33) — vérifier que le triangle « réduit » garde des proportions cohérentes.</div>"},
{"t": "Thalès (collège)", "q": "A, M, B et A, N, C alignés. AM = 2, AB = 5, AN = 3, AC = 7,5. Que peut-on conclure ?", "c": ["(MN) ∥ (BC) (réciproque de Thalès)", "On ne peut rien conclure", "Le triangle AMN est isocèle", "(MN) et (BC) sont sécantes"], "a": 0, "e": "2/5 = 0,4 et 3/7,5 = 0,4 : rapports égaux ⟹ (MN) ∥ (BC) par la réciproque.", "d": "La <b>réciproque de Thalès</b> : deux rapports égaux (points alignés dans le même ordre) ⟹ parallélisme.<div class='ex-detail'><u>Exemple rédigé</u> : AM/AB = 2/5 = 0,4 et AN/AC = 3/7,5 = 0,4. Égalité des rapports + ordre des points identique ⟹ <b>(MN) ∥ (BC)</b>. Piège : si les rapports étaient différents, on ne pourrait RIEN conclure (surtout pas que les droites sont sécantes) — seule l'égalité permet de conclure.</div>"},
{"t": "Thalès (collège)", "q": "Le théorème de Thalès direct exige comme hypothèse…", "c": ["deux triangles isocèles", "trois points alignés seulement", "deux droites parallèles coupant deux sécantes", "un triangle rectangle"], "a": 2, "e": "Pour le théorème direct, il FAUT connaître le parallélisme des deux droites.", "d": "Configuration obligatoire : <b>deux sécantes + deux parallèles</b>. Sans parallélisme, pas de rapports égaux.<div class='ex-detail'><u>À retenir</u> : théorème direct = on SAIT que (MN) ∥ (BC), on calcule des longueurs ; réciproque = on SAIT que les rapports sont égaux, on PROUVE le parallélisme. Bien identifier dans quel sens on travaille avant de rédiger.</div>"},
{"t": "Thalès (collège)", "q": "Rapport de réduction k = 1/3 entre AMN et ABC. L'aire de AMN vaut… (aire de ABC = 54 cm²)", "c": ["6 cm²", "2 cm²", "27 cm²", "18 cm²"], "a": 0, "e": "Les aires sont multipliées par k² = 1/9 : 54/9 = 6 cm².", "d": "Règle : longueurs ×k, <b>aires ×k²</b>, volumes ×k³.<div class='ex-detail'><u>Exemple rédigé</u> : k = 1/3 ⟹ k² = 1/9, donc aire(AMN) = 54 × 1/9 = <b>6 cm²</b>. Pièges : 18 (en divisant par k au lieu de k²) ou 27 (en multipliant par k). Intuition : une dimension divisée par 3, deux dimensions → division par 9 pour l'aire.</div>"},
{"t": "Thalès (collège)", "q": "Dans la configuration de Thalès, on a AM = 4, MB = 6, AN = 6. Que vaut NC ?", "c": ["8", "4", "10", "9"], "a": 3, "e": "AM/MB = AN/NC ⟹ NC = MB×AN/AM = 6×6/4 = 9.", "d": "Les rapports peuvent aussi s'écrire avec les « petits morceaux » : AM/MB = AN/NC (même position relative sur chaque sécante).<div class='ex-detail'><u>Exemple rédigé</u> : AM/MB = 4/6 ; AN/NC = 6/NC. Égalité : 4/6 = 6/NC ⟹ NC = 36/4 = <b>9</b>. Vérification avec la version classique : AB = 10, AC = 15, et 4/10 = 6/15 = 0,4 ✓. Les deux écritures sont équivalentes.</div>"},
{"t": "Thalès (collège)", "q": "Quelle configuration NE permet PAS d'appliquer le théorème de Thalès ?", "c": ["Deux parallèles coupant deux autres parallèles formant un rectangle", "Un triangle et la droite parallèle à un côté passant par un point d'un autre côté", "Deux droites sécantes coupées par deux parallèles", "Deux triangles « emboîtés » de même sommet avec bases parallèles"], "a": 0, "e": "Thalès exige deux droites SÉCANTES : des rectangles/parallélogrammes ne relèvent pas de Thalès.", "d": "Configuration clé : <b>deux sécantes</b> (elles se coupent en un point A) <b>+ deux parallèles</b>. Sans point de concours, pas de triangles emboîtés.<div class='ex-detail'><u>Exemple</u> : le rectangle formé de deux paires de parallèles n'a pas de « sommet commun A » : les triangles ne sont pas en configuration de Thalès. En revanche, M sur (AB) et N sur (AC) avec (MN) ∥ (BC) : sécantes en A ✓, parallèles ✓ — configuration valable, triangle AMN réduction de ABC.</div>"},
{"t": "Thalès (collège)", "q": "(MN) ∥ (BC), AM/AB = 0,25, BC = 12. Que vaut MN ?", "c": ["3", "4", "48", "6"], "a": 0, "e": "MN/BC = 0,25 ⟹ MN = 12 × 0,25 = 3.", "d": "Le rapport de Thalès EST le rapport de réduction : MN = BC × k.<div class='ex-detail'><u>Exemple rédigé</u> : MN/BC = AM/AB = 0,25, donc MN = 12 × 0,25 = <b>3</b>. Contrôle d'ordre de grandeur : le triangle réduit doit être PLUS PETIT (3 < 12 ✓). Répondre 48 (division par 0,25) donnerait un segment plus long que BC alors que AMN est une réduction : incohérent.</div>"},
{"t": "Thalès (collège)", "q": "La réciproque de Thalès sert à…", "c": ["calculer un angle", "calculer une aire", "prouver que deux droites sont parallèles", "prouver qu'un triangle est rectangle"], "a": 2, "e": "Réciproque : rapports égaux ⟹ parallélisme des deux droites.", "d": "Chaque théorème a sa « spécialité » : réciproque de Thalès → <b>parallélisme</b> ; réciproque de Pythagore → <b>triangle rectangle</b>.<div class='ex-detail'><u>Exemple rédigé</u> : A, M, B et A, N, C alignés dans le même ordre ; on calcule AM/AB et AN/AC ; s'ils sont égaux, on cite la réciproque de Thalès pour conclure (MN) ∥ (BC). Cette rédaction est exigée au brevet : calculs séparés, comparaison, puis conclusion avec la propriété citée.</div>"},
{"t": "Thalès (collège)", "q": "Thalès et Pythagore : quelle différence de rôle ?", "c": ["Pythagore exige des droites parallèles", "Ils sont interchangeables", "Thalès calcule des longueurs via des parallèles ; Pythagore via l'angle droit", "Thalès s'applique seulement aux triangles rectangles"], "a": 2, "e": "Thalès = parallélisme + rapports ; Pythagore = triangle rectangle + carrés des côtés.", "d": "Deux outils différents avec des <b>hypothèses différentes</b> : Thalès exige deux parallèles et donne des proportions ; Pythagore exige un angle droit et relie les trois côtés.<div class='ex-detail'><u>Exemple</u> : pour calculer BC dans un triangle quelconque avec (MN) ∥ (BC), on utilise Thalès ; pour l'hypoténuse d'un triangle rectangle, Pythagore. Au brevet, les deux se combinent souvent : Thalès pour une longueur, puis Pythagore sur le triangle rectangle trouvé.</div>"},
{"t": "Trigonométrie (collège)", "q": "Dans ABC rectangle en A, quel est le côté ADJACENT à l'angle B ?", "c": ["[BA]", "[BC]", "Cela dépend de la taille du triangle", "[AC]"], "a": 0, "e": "Le côté adjacent à B touche l'angle B sans être l'hypoténuse : c'est [BA].", "d": "Pour l'angle B : l'hypoténuse est [BC] (opposée à l'angle droit) ; l'adjacent <b>touche B</b> sans être l'hypoténuse : [BA] ; l'opposé ne touche pas B : [AC].<div class='ex-detail'><u>Exemple</u> : cos(B) = BA/BC et sin(B) = AC/BC. Si on passe à l'angle C, les rôles s'échangent : adjacent = [AC], opposé = [BA]. Toujours préciser « par rapport à quel angle » avant d'écrire une formule.</div>"},
{"t": "Trigonométrie (collège)", "q": "ABC rectangle en A, BC = 10, angle B = 40°. Que vaut BA (arrondi) ?", "c": ["12,6", "6,4 sin 40°", "7,7", "6,4"], "a": 2, "e": "cos(40°) = BA/10 ⟹ BA = 10 × cos(40°) ≈ 7,7.", "d": "On connaît l'hypoténuse et on cherche l'adjacent de B : <b>cosinus</b>.<div class='ex-detail'><u>Exemple rédigé</u> : cos(B) = BA/BC ⟹ BA = 10 × cos(40°) ≈ 10 × 0,766 = <b>7,7</b>. Contrôle : BA < BC ✓. Piège : utiliser sin(40°) donnerait l'opposé AC ≈ 6,4. Choisir la formule = choisir le bon PAIR de côtés.</div>"},
{"t": "Trigonométrie (collège)", "q": "AC = 5, BC = 8, triangle rectangle en A. L'angle B vaut environ…", "c": ["45°", "51°", "32°", "39°"], "a": 3, "e": "sin(B) = AC/BC = 5/8 = 0,625 ⟹ B = sin⁻¹(0,625) ≈ 39°.", "d": "Deux côtés connus → rapport, puis <b>touche inverse</b> de la calculatrice (mode degrés).<div class='ex-detail'><u>Exemple rédigé</u> : AC est l'opposé de B, BC l'hypoténuse : sin(B) = 5/8 = 0,625, donc B = arcsin(0,625) ≈ <b>39°</b>. Piège : répondre 51° en utilisant cos(B) = 5/8 alors que 5 est l'OPPOSÉ de B, pas son adjacent. Dessiner la figure avant de choisir sin ou cos !</div>"},
{"t": "Trigonométrie (collège)", "q": "Que signifie le moyen mnémotechnique « SOH-CAH-TOA » ?", "c": ["C'est une formule d'aire", "Sin × Cos × Tan = 1", "Sin = Adj/Hyp, Cos = Opp/Hyp, Tan = Adj/Opp", "Sin = Opp/Hyp, Cos = Adj/Hyp, Tan = Opp/Adj"], "a": 3, "e": "SOH : Sinus = Opposé/Hypoténuse ; CAH : Cosinus = Adjacent/Hypoténuse ; TOA : Tangente = Opposé/Adjacent.", "d": "Chaque triplet donne la <b>fonction et ses deux côtés</b> : S-O-H, C-A-H, T-O-A.<div class='ex-detail'><u>Exemple</u> : pour retrouver cos(x) : « C-A-H » → Cosinus = Adjacent sur Hypoténuse. À écrire en tête de chaque exercice jusqu'à ce que le réflexe soit automatique. La tangente, elle, n'utilise JAMAIS l'hypoténuse.</div>"},
{"t": "Trigonométrie (collège)", "q": "Pour un angle aigu, cos(x) est toujours…", "c": ["entre 0 et 1", "entre 0 et 90", "négatif", "strictement supérieur à 1"], "a": 0, "e": "L'adjacent est plus court que l'hypoténuse, donc 0 < cos(x) < 1.", "d": "Dans un triangle rectangle, chaque côté de l'angle droit est <b>plus court que l'hypoténuse</b> : les rapports cos et sin sont donc compris entre 0 et 1.<div class='ex-detail'><u>Exemple</u> : cos(60°) = 0,5 ; cos(30°) ≈ 0,87 ; quand l'angle grandit vers 90°, le cosinus diminue vers 0. Contrôle automatique : si un calcul donne cos(x) = 2,3, c'est une ERREUR (mauvais côté choisi ou mauvaise formule).</div>"},
{"t": "Trigonométrie (collège)", "q": "La calculatrice affiche cos(40°) ≈ 0,766. Que vaut l'angle dont le cosinus est 0,766 ?", "c": ["On ne peut pas savoir", "50°", "140°", "40°"], "a": 3, "e": "cos⁻¹(0,766) = 40° : la fonction réciproque retrouve l'angle.", "d": "La touche <b>cos⁻¹</b> (ou « arccos ») inverse la fonction cosinus : elle retrouve l'angle à partir du rapport.<div class='ex-detail'><u>Exemple rédigé</u> : x = cos⁻¹(0,766) ≈ <b>40°</b>. Attention : cos⁻¹ n'est PAS 1/cos — c'est la fonction réciproque, pas l'inverse numérique (1/cos(40°) ≈ 1,3). Piège complémentaire : la calculatrice doit être en DEGRÉS, sinon le résultat (radians) fausse tout.</div>"},
{"t": "Trigonométrie (collège)", "q": "Quelle est la valeur exacte de tan(45°) ?", "c": ["1", "√2", "0,5", "0"], "a": 0, "e": "À 45°, opposé = adjacent (triangle rectangle isocèle) : tan(45°) = 1.", "d": "Dans un triangle rectangle isocèle, les côtés de l'angle droit sont égaux, donc <b>Opp/Adj = 1</b> pour l'angle de 45°.<div class='ex-detail'><u>Exemple rédigé</u> : avec les deux côtés de l'angle droit égaux à 1 : hypoténuse = √2 (Pythagore) ; tan(45°) = 1/1 = <b>1</b>. Valeurs associées : sin(45°) = cos(45°) = 1/√2 ≈ 0,707 — les deux égales car les rôles opposé/adjacent sont symétriques.</div>"},
{"t": "Trigonométrie (collège)", "q": "Le rapport sin(x) dépend-il de la taille du triangle ?", "c": ["Non, il ne dépend que de l'angle", "Seulement pour les triangles isocèles", "Oui, il double si les côtés doublent", "Il dépend aussi de l'unité choisie"], "a": 0, "e": "Tous les triangles rectangles d'angles égaux sont semblables : leurs rapports de côtés sont identiques.", "d": "Triangles semblables ⟹ <b>mêmes proportions</b> : doubler tous les côtés ne change pas le rapport Opp/Hyp.<div class='ex-detail'><u>Exemple</u> : un triangle 3-4-5 et un triangle 6-8-10 ont le même angle aigu (sin = 3/5 = 6/10 = 0,6). C'est ce qui rend la trigonométrie utile : une seule table de valeurs par angle suffit, quel que soit le triangle — du plan de la classe à la hauteur d'un immeuble.</div>"},
{"t": "Trigonométrie (collège)", "q": "ABC rectangle en A. On connaît AB = 6 (adjacent de B) et AC = 8 (opposé de B). Quelle formule donne l'angle B directement ?", "c": ["B = tan(8/6)", "B = cos⁻¹(6/8)", "B = sin⁻¹(8/6)", "B = tan⁻¹(8/6)"], "a": 3, "e": "Avec opposé et adjacent (pas l'hypoténuse) : tan(B) = 8/6, donc B = tan⁻¹(8/6) ≈ 53°.", "d": "Quand l'hypoténuse est absente, c'est forcément la <b>tangente</b> : elle relie opposé et adjacent.<div class='ex-detail'><u>Exemple rédigé</u> : tan(B) = AC/AB = 8/6 ≈ 1,33 ⟹ B = tan⁻¹(1,33) ≈ <b>53°</b>. Piège : sin⁻¹(8/6) est impossible (0,625 > 1 impossible pour un sinus… ici 8/6 ≈ 1,33 > 1) : un sinus ou un cosinus ne dépassent jamais 1, la tangente, si.</div>"},
{"t": "Trigonométrie (collège)", "q": "Que vaut cos(60°) ?", "c": ["0,5", "0,6", "1/3", "≈ 0,87"], "a": 0, "e": "cos(60°) = 0,5 exactement : l'adjacent vaut la moitié de l'hypoténuse dans un triangle équilatéral coupé en deux.", "d": "Valeurs remarquables à mémoriser : <b>cos(60°) = 0,5</b> ; sin(30°) = 0,5 ; tan(45°) = 1.<div class='ex-detail'><u>Pourquoi ?</u> Dans un triangle équilatéral de côté 1 coupé par une hauteur : l'angle de 60° a pour adjacent un demi-côté (0,5) et pour hypoténuse le côté (1) : cos(60°) = 0,5. Et comme 30° = 90° − 60° : sin(30°) = cos(60°) = 0,5 (angles complémentaires : sin et cos s'échangent).</div>"},
{"t": "Racines carrées (collège)", "q": "Combien vaut √144 ?", "c": ["12", "72", "144/2", "14"], "a": 0, "e": "12² = 144, donc √144 = 12.", "d": "La racine carrée demande : quel nombre au <b>carré</b> donne 144 ? 12 × 12 = 144, donc <b>√144 = 12</b>.<div class='ex-detail'><u>Exemple</u> : liste des carrés parfaits à connaître : 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169 (13²), 196 (14²), 225 (15²). Piège : 144/2 = 72 (confondre racine et division par 2) ou 14 (le double de la racine de 49 : aucune raison).</div>"},
{"t": "Racines carrées (collège)", "q": "Simplifier √50.", "c": ["25√2", "√5 × √10", "2√5", "5√2"], "a": 3, "e": "√50 = √(25×2) = √25 × √2 = 5√2.", "d": "Chercher le <b>plus grand carré parfait</b> divisant 50 : 25, donc √50 = <b>5√2</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 50 = 25 × 2 = 5² × 2, donc √50 = √25 × √2 = 5√2 ≈ 7,07. Piège : 2√5 vient de √(4×5) (on n'a pas pris le PLUS GRAND carré) — c'est correct mais non simplifié au maximum. Test : (2√5)² = 20 ≠ 50 ✗ d'ailleurs (2√5 = √20).</div>"},
{"t": "Racines carrées (collège)", "q": "Réduire 3√2 + 5√2.", "c": ["15√4", "√16", "8√4", "8√2"], "a": 3, "e": "Mêmes racines : (3+5)√2 = 8√2, comme 3x + 5x = 8x.", "d": "Les racines identiques s'additionnent comme des <b>termes en x</b> : 3√2 + 5√2 = (3+5)√2 = <b>8√2</b>.<div class='ex-detail'><u>Exemple rédigé</u> : comme 3x + 5x = 8x. Piège : 15√4 (= 30 !) vient de la multiplication des racines entre elles. Contrôle : 3×1,414 + 5×1,414 = 4,24 + 7,07 = 11,31 = 8 × 1,414 ✓.</div>"},
{"t": "Racines carrées (collège)", "q": "Combien vaut √2 + √3 ?", "c": ["On ne peut pas réduire", "5", "√5", "√6"], "a": 0, "e": "Il n'existe AUCUNE règle pour la somme : √2 + √3 ne se simplifie pas.", "d": "Les règles ne concernent que le <b>produit et le quotient</b> : √2 × √3 = √6, mais <b>√2 + √3 est irréductible</b>.<div class='ex-detail'><u>Contrôle numérique</u> : √2 + √3 ≈ 1,414 + 1,732 = 3,146 ; or √5 ≈ 2,236 et √6 ≈ 2,449 : aucune égalité. Retenir : √(a+b) ≠ √a + √b. Seule exception : quand les racines sont IDENTIQUES après simplification (√3 + √12 = √3 + 2√3 = 3√3).</div>"},
{"t": "Racines carrées (collège)", "q": "Résoudre x² = 49.", "c": ["x = √49 seulement", "x = 7 seulement", "x = 7 ou x = −7", "x = 49/2"], "a": 2, "e": "7² = 49 et (−7)² = 49 : deux solutions opposées.", "d": "Une équation x² = a (a > 0) a TOUJOURS <b>deux solutions</b> : +√a et −√a.<div class='ex-detail'><u>Exemple rédigé</u> : x² = 49 ⟹ x = 7 ou x = −7, S = {−7 ; 7}. Piège majeur : oublier la solution négative. Seule x² = 0 a une solution unique (0), et x² = −4 n'a aucune solution (un carré n'est jamais négatif).</div>"},
{"t": "Racines carrées (collège)", "q": "Combien vaut (√5)² ?", "c": ["5", "10", "25", "√25 donc 5 ou −5"], "a": 0, "e": "Élever une racine au carré « fait tomber » la racine : (√5)² = 5.", "d": "(√a)² = a : le carré et la racine se <b>neutralisent</b>.<div class='ex-detail'><u>Exemple rédigé</u> : (√5)² = √5 × √5 = √25 = <b>5</b>. De même (√3)² = 3, (√7)² = 7. C'est la définition même de la racine. Attention : √(5²) = 5 aussi, mais √(−5)² = 5 également (le carré a effacé le signe) alors que √(−5) n'existe pas.</div>"},
{"t": "Racines carrées (collège)", "q": "Combien vaut √2 × √8 ?", "c": ["16", "2√8", "√10", "√16 = 4"], "a": 3, "e": "√2 × √8 = √(2×8) = √16 = 4.", "d": "Règle du produit : <b>√a × √b = √(ab)</b> — souvent, le produit redonne un carré parfait.<div class='ex-detail'><u>Exemple rédigé</u> : √2 × √8 = √16 = <b>4</b>. Autre voie : √8 = 2√2, donc √2 × 2√2 = 2 × (√2)² = 2 × 2 = 4 ✓. Les deux méthodes concordent. Piège : √10 viendrait d'une addition des radicandes (2+8) : c'est √2 + √8 qui serait ≈ 4,24, pas le produit.</div>"},
{"t": "Racines carrées (collège)", "q": "Quelle est la solution de x² = 5 ?", "c": ["x = √5 ou x = −√5", "x = 25", "x = √5 seulement", "x = 5/2"], "a": 0, "e": "5 n'est pas un carré parfait : x = √5 ≈ 2,24 ou x = −√5.", "d": "Même principe avec un <b>radicande quelconque</b> : x² = a ⟹ x = ±√a.<div class='ex-detail'><u>Exemple rédigé</u> : (√5)² = 5 et (−√5)² = 5, donc S = {−√5 ; √5}, soit environ {−2,236 ; 2,236}. On garde la valeur EXACTE (√5) et on donne l'arrondi en plus. Piège : répondre « pas de solution car 5 n'est pas un carré parfait » — la racine existe même si elle n'est pas entière !</div>"},
{"t": "Racines carrées (collège)", "q": "Réduire √3 + √12.", "c": ["On ne peut pas réduire", "2√15", "√15", "3√3"], "a": 3, "e": "√12 = 2√3, donc √3 + √12 = √3 + 2√3 = 3√3.", "d": "Réflexe : <b>simplifier CHAQUE racine</b> avant de réduire la somme.<div class='ex-detail'><u>Exemple rédigé</u> : √12 = √(4×3) = 2√3 ; la somme devient √3 + 2√3 = <b>3√3</b> ≈ 5,20. Contrôle : √3 + √12 ≈ 1,732 + 3,464 = 5,196 ✓. Piège : √15 (addition des radicandes) est faux : √3 + √12 ≈ 5,2 mais √15 ≈ 3,87.</div>"},
{"t": "Racines carrées (collège)", "q": "Parmi ces nombres, lequel n'a pas de racine carrée (réelle) ?", "c": ["0", "−4", "16", "2"], "a": 1, "e": "√(−4) n'existe pas : un carré n'est jamais négatif.", "d": "La racine carrée n'est définie que pour les nombres <b>positifs ou nuls</b> : √(−4) est impossible.<div class='ex-detail'><u>Pourquoi ?</u> La racine de a est le nombre dont le carré vaut a ; or tout carré x² est ≥ 0, donc a = −4 ne peut être atteint par aucun carré. Cas particuliers : √0 = 0 (unique cas à une seule solution dans x² = a) et √1 = 1. Attention à ne pas confondre avec √((−4)²) = √16 = 4, qui existe !</div>"},
{"t": "Identités remarquables (collège)", "q": "Développer (x + 5)².", "c": ["x² + 10x + 25", "x² + 25", "x² + 10x + 10", "x² + 5x + 25"], "a": 0, "e": "(a+b)² = a² + 2ab + b² : x² + 10x + 25.", "d": "Identité 1 : <b>(a+b)² = a² + 2ab + b²</b> avec a = x, b = 5 : 2ab = 2 × x × 5 = 10x.<div class='ex-detail'><u>Exemple rédigé</u> : (x + 5)² = x² + 10x + <b>25</b>. Piège majeur : x² + 25 (oubli du double produit) — test numérique avec x = 1 : (1+5)² = 36, alors que 1 + 25 = 26 ✗ et 1 + 10 + 25 = 36 ✓. Toujours tester sur une valeur !</div>"},
{"t": "Identités remarquables (collège)", "q": "Développer (3x − 4)².", "c": ["9x² − 12x + 16", "9x² − 12x − 16", "9x² − 24x + 16", "3x² − 12x + 16"], "a": 2, "e": "(3x)² − 2×3x×4 + 4² = 9x² − 24x + 16.", "d": "Deux pièges dans une seule identité : le coefficient <b>au carré</b> ((3x)² = 9x²) et le <b>double produit complet</b> (2×3×4 = 24).<div class='ex-detail'><u>Exemple rédigé</u> : (3x − 4)² = 9x² − 24x + <b>16</b>. Test avec x = 1 : (3−4)² = 1 et 9 − 24 + 16 = 1 ✓, alors que 9 − 12 + 16 = 13 ✗. Le test numérique détecte instantanément l'oubli du carré ou du double produit.</div>"},
{"t": "Identités remarquables (collège)", "q": "Factoriser x² − 49.", "c": ["x(x − 49)", "(x − 7)²", "(x + 7)(x − 7)", "On ne peut pas factoriser"], "a": 2, "e": "a² − b² = (a+b)(a−b) avec b = 7 : (x + 7)(x − 7).", "d": "Toute <b>différence de deux carrés</b> se factorise : x² − 49 = x² − 7² = <b>(x+7)(x−7)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : vérification en redéveloppant : (x+7)(x−7) = x² − 7x + 7x − 49 = x² − 49 ✓. Piège : (x−7)² = x² − 14x + 49 ≠ x² − 49. La 3ᵉ identité est la seule qui « supprime » le terme en x.</div>"},
{"t": "Identités remarquables (collège)", "q": "Factoriser 5x² + 3x.", "c": ["5x(x + 3)", "5(x² + 3x)", "x(5x + 3)", "x(5x² + 3)"], "a": 2, "e": "Facteur commun x : x(5x + 3).", "d": "Le facteur commun est le <b>plus petit</b> : x divise 5x² et 3x, donc 5x² + 3x = <b>x(5x + 3)</b>.<div class='ex-detail'><u>Exemple rédigé</u> : vérification : x(5x + 3) = 5x² + 3x ✓. Piège : 5x(x + 3) = 5x² + 15x ✗ (on a « sorti » trop). Astuce : chaque terme doit contenir le facteur commun ; le quotient de chaque terme par x donne le contenu de la parenthèse.</div>"},
{"t": "Identités remarquables (collège)", "q": "Factoriser (x + 3)² − 25.", "c": ["(x + 8)(x − 2)", "x² + 6x − 16", "(x + 3 − 5)²", "(x − 2)²"], "a": 0, "e": "C'est une différence de carrés : (x+3)² − 5² = (x+3+5)(x+3−5) = (x+8)(x−2).", "d": "Il faut voir la forme <b>a² − b²</b> MÊME quand « a » est une expression : a = (x+3), b = 5.<div class='ex-detail'><u>Exemple rédigé</u> : (x+3)² − 25 = (x+3)² − 5² = (x+3+5)(x+3−5) = <b>(x+8)(x−2)</b>. Vérification : (x+8)(x−2) = x² + 6x − 16 = (x² + 6x + 9) − 25 ✓. Piège : « soustraire 5 partout » ((x+3−5)² = (x−2)²) ne respecte aucune identité.</div>"},
