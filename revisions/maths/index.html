    "id": "statistiques",
    "theme": "Statistiques (collège)",
    "niveau": "3e",
    "titre": "Statistiques : moyennes, médiane, étendue",
    "cours": "<div class=\"cours-head\"><h2>Statistiques : moyennes, médiane, étendue</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Vocabulaire : série, effectifs, fréquences</h3>\n<ul>\n<li>Une <b>série statistique</b> est une liste de données relevées (notes, tailles, durées...) ;</li>\n<li>L'<b>effectif</b> d'une valeur est le nombre de fois où elle apparaît ; l'effectif total est la somme des effectifs ;</li>\n<li>La <b>fréquence</b> = effectif / effectif total : en décimal (0,25) ou en pourcentage (25 %) ; la somme des fréquences vaut 1 (100 %) ;</li>\n<li>Exemple : notes {8 ; 10 ; 10 ; 12 ; 14 ; 10} : effectif de 10 = 3, fréquence = 3/6 = 0,5 = 50 %.</li>\n</ul>\n\n<h3>2. La moyenne : pondérée ou simple</h3>\n<div class=\"tip\"><b>Moyenne</b> = somme des valeurs ÷ nombre de valeurs. Version pondérée : moyenne = (somme des valeur×effectif) ÷ effectif total. La moyenne est <b>sensible aux valeurs extrêmes</b> : une note catastrophique la tire vers le bas.</div>\n<table>\n<tr><th>Série</th><th>Calcul</th><th>Moyenne</th></tr>\n<tr><td>8 ; 10 ; 12</td><td>(8+10+12)/3</td><td>10</td></tr>\n<tr><td>8 ; 10 ; 10 ; 12 ; 10</td><td>(8+30+12)/5</td><td>10</td></tr>\n<tr><td>8 ; 10 ; 12 ; 60</td><td>90/4</td><td>22,5 (!)</td></tr>\n<tr><td>notes pondérées : 12 (coef 1), 15 (coef 2)</td><td>(12×1 + 15×2)/3</td><td>14</td></tr>\n</table>\n<ul>\n<li>La moyenne pondérée est un <b>centre de gravité</b> : les gros effectifs pèsent plus lourd ;</li>\n<li>Moyennes de sous-groupes ≠ moyenne des moyennes : moyenne de 2 classes = (n₁×m₁ + n₂×m₂)/(n₁+n₂), jamais (m₁+m₂)/2 si les effectifs diffèrent ;</li>\n<li>Retrouver une valeur manquante : si la moyenne de {5, x, 11} vaut 8, alors x = 8×3 − 16 = 8.</li>\n</ul>\n\n<h3>3. La médiane : le couperet du milieu</h3>\n<div class=\"tip\"><b>Médiane</b> : on range les valeurs dans l'ordre croissant. Effectif impair : c'est la valeur du milieu. Effectif pair : c'est la <b>moyenne des deux valeurs centrales</b>. La médiane coupe la série en deux moitiés : 50 % au-dessous, 50 % au-dessus.</div>\n<ul>\n<li>{2 ; 5 ; 7 ; 10 ; 12} : médiane 7 (3 valeurs dessous, 3 dessus) ;</li>\n<li>{2 ; 5 ; 7 ; 10} : médiane (5+7)/2 = 6 ;</li>\n<li>La médiane est <b>robuste</b> aux valeurs extrêmes : {1 ; 2 ; 3 ; 1000} : moyenne 251,5, médiane 2,5 — laquelle décrit le mieux le groupe ?</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Mediane sur une serie ordonnee\">\n  <circle cx=\"60\" cy=\"70\" r=\"7\" fill=\"#94a3b8\"/><circle cx=\"110\" cy=\"70\" r=\"7\" fill=\"#94a3b8\"/><circle cx=\"160\" cy=\"70\" r=\"7\" fill=\"#94a3b8\"/><circle cx=\"210\" cy=\"70\" r=\"9\" fill=\"#ef4444\" stroke-width=\"2\"/><circle cx=\"270\" cy=\"70\" r=\"7\" fill=\"#94a3b8\"/><circle cx=\"320\" cy=\"70\" r=\"7\" fill=\"#94a3b8\"/><circle cx=\"390\" cy=\"70\" r=\"7\" fill=\"#16a34a\"/>\n  <text x=\"210\" y=\"45\" font-size=\"13\" fill=\"#ef4444\" text-anchor=\"middle\" font-weight=\"bold\">médiane</text>\n  <text x=\"390\" y=\"45\" font-size=\"11\" fill=\"#16a34a\" text-anchor=\"middle\">valeur extrême</text>\n  <text x=\"210\" y=\"105\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">3 valeurs à gauche, 3 à droite</text>\n  <text x=\"210\" y=\"125\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">la médiane ignore la distance, seule la place compte</text>\n</svg><span class=\"fig-cap\">La médiane regarde les <b>rangs</b>, pas les valeurs : le point vert, même très loin, ne déplace pas la médiane rouge — mais il emporte la moyenne.</span></div>\n\n<h3>4. Étendue et quartiles : mesurer la dispersion</h3>\n<ul>\n<li>L'<b>étendue</b> = valeur maximale − valeur minimale : simple mais brutale (deux valeurs seulement) ;</li>\n<li>Les <b>quartiles</b> Q1 et Q3 : au moins 25 % des valeurs ≤ Q1, au moins 25 % ≥ Q3 — l'écart interquartile Q3 − Q1 mesure la zone où se concentre le milieu de la série ;</li>\n<li>{1 ; 3 ; 5 ; 7 ; 9 ; 11 ; 13} : Q1 = 3, Q3 = 11, interquartile 8, étendue 12 ;</li>\n<li>Deux séries de même moyenne peuvent être très différentes : {5 ; 5 ; 5} et {1 ; 5 ; 9} ont toutes deux moyenne 5, mais étendues 0 et 8.</li>\n</ul>\n<table>\n<tr><th>Indicateur</th><th>Idée</th><th>Sensible aux extrêmes ?</th><th>Usage type</th></tr>\n<tr><td>moyenne</td><td>équilibre des valeurs</td><td>oui, fortement</td><td>notes, salaires, consommations</td></tr>\n<tr><td>médiane</td><td>position du milieu</td><td>non, robuste</td><td>revenus, prix immobiliers</td></tr>\n<tr><td>étendue</td><td>amplitude totale</td><td>oui (elle n'utilise QUE les extrêmes)</td><td>contrôle qualité, météo</td></tr>\n<tr><td>quartiles</td><td>répartition fine</td><td>peu</td><td>boxplots, comparaisons</td></tr>\n</table>\n\n<h3>5. Lire et interpréter un tableau statistique</h3>\n<table>\n<tr><th>Note</th><th>Effectif</th><th>Fréquence (%)</th><th>Effectif cumulé</th></tr>\n<tr><td>8</td><td>4</td><td>20</td><td>4</td></tr>\n<tr><td>10</td><td>9</td><td>45</td><td>13</td></tr>\n<tr><td>12</td><td>5</td><td>25</td><td>18</td></tr>\n<tr><td>16</td><td>2</td><td>10</td><td>20</td></tr>\n</table>\n<ul>\n<li>Moyenne = (8×4 + 10×9 + 12×5 + 16×2)/20 = 248/20 = 12,4 ;</li>\n<li>Médiane : 20 valeurs → moyenne des 10e et 11e : les effectifs cumulés montrent que les 10e et 11e valeurs valent 10 → médiane 10 ;</li>\n<li>Moyenne 12,4 &gt; médiane 10 : la série est tirée vers le haut par les 16 — signature d'une distribution <b>asymétrique</b> ;</li>\n<li>Règle de lecture : moyenne &gt; médiane → queue vers la droite (valeurs hautes rares mais fortes) ; c'est le cas des salaires, d'où l'usage de la médiane.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le paradoxe des salaires</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une entreprise de 11 personnes : 10 salariés à 2 000 € et un dirigeant à 32 000 €. 1) Moyenne et médiane ? 2) Le PDG annonce : « salaire moyen 4 000 € ». Que penser ? 3) Recruter un employé à 2 000 € : quels indicateurs bougent ?</div><div class=\"etu\"><b>Étape 1 — Calculs bruts</b> : moyenne = (10×2000 + 32000)/11 = 52000/11 ≈ 4 727 € ; médiane = 2 000 € (6e valeur sur 11).</div><div class=\"etu\"><b>Étape 2 — Critique de l'annonce</b> : le PDG dit même moins que la vraie moyenne — mais dans les deux cas le « salaire moyen » ne décrit <b>aucun employé</b> : la médiane (2 000 €) est l'indicateur honnête du salarié typique.</div><div class=\"etu\"><b>Étape 3 — Nouvel employé</b> : moyenne = 54000/12 = 4 500 € (elle baisse !) ; médiane = 2 000 € (inchangée, 6e et 7e valeurs).</div><div class=\"etu\"><b>Étape 4 — Leçon statistique</b> : la médiane est l'arme anti-manipulation ; un écart grandissant entre moyenne et médiane signale une concentration des revenus — c'est exactement ce que font les économistes avec les revenus des ménages.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — notes et coefficients, le calcul qui sauve un trimestre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Léa a 14 en maths (coef 4), 11 en français (coef 3), 16 en EPS (coef 1) et x en LV (coef 2). Sa moyenne pondérée vaut 13,2. Quelle est sa note de LV ?</div><div class=\"etu\"><b>Étape 1 — Poser l'équation de moyenne</b> : (14×4 + 11×3 + 16×1 + 2x)/10 = 13,2.</div><div class=\"etu\"><b>Étape 2 — Développer</b> : 56 + 33 + 16 + 2x = 132 → 105 + 2x = 132.</div><div class=\"etu\"><b>Étape 3 — Résoudre</b> : 2x = 27 → x = 13,5.</div><div class=\"etu\"><b>Étape 4 — Vérification</b> : (56 + 33 + 16 + 27)/10 = 132/10 = 13,2 ✓. La moyenne pondée est réversible : connaître la moyenne permet de retrouver une note manquante — l'équation rejoint les statistiques.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Moyenner des moyennes sans pondérer par les effectifs : faux dès que les groupes sont de tailles différentes.</li>\n<li>Oublier de trier la série avant la médiane : la médiane exige l'ordre croissant.</li>\n<li>Effectif pair : prendre « une » valeur centrale — non, la moyenne des deux centrales.</li>\n<li>Confondre étendue (max − min) et écart-type (plus tard) : l'étendue ignore tout le milieu de la série.</li>\n<li>Croire que la médiane « vaut la moitié de la moyenne » : aucun lien — ce sont deux indicateurs indépendants.</li>\n</ul>\n</div>\n\n<h3>6. Moyenne, médiane et graphiques : dialoguer avec les données</h3>\n<ul>\n<li><b>Diagramme en bâtons</b> : hauteur = effectif ; parfait pour comparer peu de valeurs ;</li>\n<li><b>Histogramme / barres</b> : classes d'égale amplitude ; l'aire doit rester proportionnelle aux effectifs ;</li>\n<li><b>Diagramme circulaire</b> : angle = fréquence × 360° : la part visuelle reprend la fréquence en pourcentage ;</li>\n<li>L'œil lit les graphiques plus vite que les tableaux, mais l'œil se trompe facilement : vérifier axes tronqués et échelles non uniformes.</li>\n</ul>\n<table>\n<tr><th>Représentation</th><th>À quoi ça sert</th><th>Piège de lecture</th></tr>\n<tr><td>bâtons</td><td>comparer des valeurs isolées</td><td>échelle de l'axe y non départ à zéro</td></tr>\n<tr><td>circulaire (camembert)</td><td>visualiser des parts d'un tout</td><td>trop de secteurs illisibles (au-delà de 6)</td></tr>\n<tr><td>histogramme</td><td>répartir en classes</td><td>classes d'amplitudes différentes sans normalisation</td></tr>\n<tr><td>nuage de points</td><td>corréler deux variables</td><td>corrélation ≠ causalité</td></tr>\n</table>\n<ul>\n<li>Calcul d'angles du camembert : fréquence 45 % → 0,45 × 360 = 162° ;</li>\n<li>Effectif d'une classe : fréquence × effectif total : 0,25 × 320 = 80 ;</li>\n<li>Construire un graphique honnête : commencer l'axe des ordonnées à 0, sinon « amplifier » artificiellement les écarts.</li>\n</ul>\n\n<h3>7. Médiane et effectifs cumulés : la méthode complète</h3>\n<div class=\"tip\"><b>Méthode des effectifs cumulés croissants</b> : ranger les valeurs, cumuler les effectifs ligne à ligne, chercher le premier cumul atteignant la moitié de l'effectif total (ou la moyenne des deux valeurs qui l'encadrent si l'effectif est pair). C'est LA méthode pour la médiane d'une série groupée.</div>\n<table>\n<tr><th>Durée (min)</th><th>Effectif</th><th>Cumul croissant</th><th>Cumul décroissant</th></tr>\n<tr><td>[0 ; 10)</td><td>3</td><td>3</td><td>40</td></tr>\n<tr><td>[10 ; 20)</td><td>7</td><td>10</td><td>37</td></tr>\n<tr><td>[20 ; 30)</td><td>12</td><td>22</td><td>30</td></tr>\n<tr><td>[30 ; 40)</td><td>10</td><td>32</td><td>18</td></tr>\n<tr><td>[40 ; 50]</td><td>8</td><td>40</td><td>8</td></tr>\n</table>\n<ul>\n<li>Effectif total : 40 → la médiane est entre les 20e et 21e valeurs, toutes deux dans [20 ; 30) : la classe médiane est <b>[20 ; 30)</b> ;</li>\n<li>Pour une estimation plus fine (programme de 2de) : interpolation linéaire dans la classe médiane ;</li>\n<li>Q1 ≈ 10e valeur → classe [10 ; 20) ; Q3 ≈ 30e valeur → classe [30 ; 40) : le boxplot se construit à partir des cumuls.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Boxplot minimal maximal\">\n  <line x1=\"40\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"45\" y=\"125\" font-size=\"10\" fill=\"#64748b\">0</text><text x=\"95\" y=\"125\" font-size=\"10\" fill=\"#64748b\">10</text><text x=\"145\" y=\"125\" font-size=\"10\" fill=\"#64748b\">20</text><text x=\"195\" y=\"125\" font-size=\"10\" fill=\"#64748b\">30</text><text x=\"245\" y=\"125\" font-size=\"10\" fill=\"#64748b\">40</text><text x=\"295\" y=\"125\" font-size=\"10\" fill=\"#64748b\">50</text>\n  <line x1=\"60\" y1=\"70\" x2=\"115\" y2=\"70\" stroke=\"#1e293b\" stroke-width=\"2\"/>\n  <rect x=\"115\" y=\"55\" width=\"115\" height=\"30\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"145\" y1=\"55\" x2=\"145\" y2=\"85\" stroke=\"#ef4444\" stroke-width=\"2.5\"/>\n  <line x1=\"60\" y1=\"55\" x2=\"60\" y2=\"85\" stroke=\"#1e293b\" stroke-width=\"2\"/>\n  <line x1=\"290\" y1=\"55\" x2=\"290\" y2=\"85\" stroke=\"#1e293b\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"70\" x2=\"290\" y2=\"70\" stroke=\"#1e293b\" stroke-width=\"2\"/>\n  <text x=\"145\" y=\"45\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\">médiane</text>\n  <text x=\"115\" y=\"100\" font-size=\"10\" fill=\"#4f46e5\">Q1</text>\n  <text x=\"228\" y=\"100\" font-size=\"10\" fill=\"#4f46e5\">Q3</text>\n  <text x=\"55\" y=\"45\" font-size=\"10\" fill=\"#64748b\">min</text>\n  <text x=\"285\" y=\"45\" font-size=\"10\" fill=\"#64748b\">max</text>\n</svg><span class=\"fig-cap\">Le boxplot résume la série : min, Q1, médiane, Q3, max — la boîte contient la moitié centrale des données.</span></div>"

    "cours": "<div class=\"cours-head\"><h2>Sphères et sections de solides ; rotation et translation</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La sphère et la boule : définir en 3D</h3>\n<ul>\n<li>La <b>sphère</b> de centre O et rayon r est l'ensemble des points situés à exactement r de O : une <b>surface</b> (la peau du ballon) ;</li>\n<li>La <b>boule</b> est l'ensemble des points à ≤ r de O : un <b>volume</b> (l'intérieur du ballon) ;</li>\n<li>Comme le cercle définit le disque en 2D, la sphère définit la boule en 3D ;</li>\n<li>Grands cercles : tout plan passant par le centre découpe la sphère en deux hémisphères — méridiens et équateur terrestres.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sphere, grand cercle et petite latitude\">\n  <circle cx=\"150\" cy=\"80\" r=\"70\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <ellipse cx=\"150\" cy=\"80\" rx=\"70\" ry=\"18\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <line x1=\"150\" y1=\"80\" x2=\"207\" y2=\"38\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <circle cx=\"150\" cy=\"80\" r=\"3\" fill=\"#1e293b\"/>\n  <text x=\"150\" y=\"95\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">O</text>\n  <text x=\"180\" y=\"30\" font-size=\"12\" fill=\"#ef4444\">r</text>\n  <text x=\"240\" y=\"75\" font-size=\"12\" fill=\"#16a34a\">équateur (grand cercle)</text>\n  <ellipse cx=\"150\" cy=\"45\" rx=\"50\" ry=\"10\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <text x=\"240\" y=\"115\" font-size=\"12\" fill=\"#f59e0b\">latitude (petit cercle)</text>\n</svg><span class=\"fig-cap\">Sphère de centre O et rayon r. L'équateur est le plus grand des cercles ; en s'éloignant du centre, les cercles de latitude rétrécissent.</span></div>\n\n<h3>2. Aires et volumes des solides ronds</h3>\n<div class=\"tip\"><b>À connaître :</b>\naire de la sphère : A = 4πr² ;\nvolume de la boule : V = (4/3)πr³ ;\nvolume du cylindre : V = πr²h ;\nvolume du cône : V = (1/3)πr²h.\nLe cône est le tiers du cylindre de même base et même hauteur — check visuel : trois cônes remplissent un cylindre.</div>\n<table>\n<tr><th>Solide</th><th>Rayon/hauteur</th><th>Aire</th><th>Volume</th></tr>\n<tr><td>sphère r = 3</td><td>—</td><td>4π×9 = 36π ≈ 113</td><td>36π ≈ 113</td></tr>\n<tr><td>boule r = 6</td><td>—</td><td>144π ≈ 452</td><td>288π ≈ 905</td></tr>\n<tr><td>cylindre r = 2, h = 5</td><td>—</td><td>—</td><td>20π ≈ 63</td></tr>\n<tr><td>cône r = 3, h = 4</td><td>—</td><td>—</td><td>12π ≈ 38</td></tr>\n</table>\n<ul>\n<li>Volume et aire de la boule de rayon 3 sont numériquement égaux (36π) : coïncidence du nombre 3, pas une règle ;</li>\n<li>Doubler le rayon : aire ×4, volume ×8 — même règle que les agrandissements de Thalès (k², k³) ;</li>\n<li>Ordres de grandeur : la Terre (r ≈ 6 371 km) a une aire ≈ 5,1×10⁸ km² et un volume ≈ 1,1×10¹² km³ : les formules sont les mêmes du ballon de foot à la planète.</li>\n</ul>\n\n<h3>3. Sections planes : ce que la scie révèle</h3>\n<ul>\n<li>Section d'une <b>boule</b> par un plan : toujours un <b>disque</b> ; plus le plan est proche du centre, plus le disque est grand (maximum : le grand cercle) ;</li>\n<li>Section d'un <b>cylindre</b> par un plan parallèle à la base : un disque ; par un plan contenant l'axe : un rectangle ;</li>\n<li>Section d'un <b>cône</b> parallèle à la base : un disque plus petit (réduction de la base) ; perpendiculaire à l'axe passant par le sommet : un triangle ;</li>\n<li>Section d'un cube par un plan : triangle, quadrilatère (jusqu'à hexagone !) selon l'angle de coupe.</li>\n</ul>\n<table>\n<tr><th>Solide coupé</th><th>Plan de coupe</th><th>Section obtenue</th></tr>\n<tr><td>boule</td><td>quelconque</td><td>disque</td></tr>\n<tr><td>cylindre</td><td>parallèle aux bases</td><td>disque</td></tr>\n<tr><td>cylindre</td><td>contenant l'axe</td><td>rectangle</td></tr>\n<tr><td>cône</td><td>parallèle à la base</td><td>disque (réduction)</td></tr>\n<tr><td>cône</td><td>perpendiculaire à la base par le sommet</td><td>triangle</td></tr>\n</table>\n<ul>\n<li>Calcul de la section d'une boule : à 4 cm du centre d'une boule de rayon 5 : rayon du disque = √(5² − 4²) = 3 (Pythagore dans le triangle centre-rayon-section) ;</li>\n<li>Application géographique : la section à la latitude θ a un rayon r·cos(θ) — d'où le raccourcissement des parallèles près des pôles.</li>\n</ul>\n\n<h3>4. Rotation et translation : les deux transformations douces</h3>\n<ul>\n<li><b>Translation</b> : glisser la figure selon un vecteur (direction, sens, longueur) : la figure garde sa forme, son orientation, ses angles — seul le support change ;</li>\n<li><b>Rotation</b> d'angle α autour d'un point O : chaque point tourne de α autour de O (au compas : garder la distance à O et reporter l'angle) ;</li>\n<li>Les deux transformations conservent les <b>longueurs, les angles, les aires et les volumes</b> : ce sont des isométries ;</li>\n<li>L'angle de rotation se mesure avec le rapporteur depuis O ; image et antécédent sont à même distance de O.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Rotation autour de O\">\n  <path d=\"M 140 95 L 170 110 L 150 65 Z\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <path d=\"M 147.8 36.1 L 158.4 67.9 L 176.1 22 Z\" fill=\"#ecfdf5\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <circle cx=\"215\" cy=\"75\" r=\"3.5\" fill=\"#ef4444\"/>\n  <text x=\"222\" y=\"72\" font-size=\"12\" fill=\"#ef4444\">O</text>\n  <path d=\"M 162 89 A 55 55 0 0 1 167 48\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <text x=\"152\" y=\"72\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"end\">45°</text>\n  <text x=\"95\" y=\"132\" font-size=\"12\" fill=\"#4f46e5\">figure</text>\n  <text x=\"245\" y=\"30\" font-size=\"12\" fill=\"#16a34a\">image (rotation de 45° autour de O)</text>\n  <text x=\"215\" y=\"142\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">chaque sommet tourne au compas autour de O ; la forme reste identique</text>\n</svg><span class=\"fig-cap\">Rotation de 45° autour de O : chaque sommet tourne au compas autour de O ; la forme reste identique.</span></div>\n\n<h3>5. Applications : du ballon au globe</h3>\n<ul>\n<li><b>Balle de tennis</b> (r = 3,3 cm) : aire de la feutre ≈ 4π×10,9 ≈ 137 cm² ;</li>\n<li><b>Terre</b> : méridiens = grands cercles passant par les pôles ; équateur = grand cercle perpendiculaire à l'axe ;</li>\n<li><b>Clôture à translation</b> : les poteaux d'une clôture droite se déduisent les uns des autres par translation du même vecteur ;</li>\n<li><b>Papillon à rotation</b> : les ailes d'un dessin symétrique se correspondent par rotation de 180° autour du point du corps — la rotation retrouve le pliage.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la boule creuse à l'échelle</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une boule pleine de rayon 6 cm est évidée d'une boule concentrique de rayon 3 cm. 1) Volume restant (exact, puis approché) ? 2) On agrandit le solide au double : nouveau volume restant ? 3) Le rapport (creux/total) change-t-il ?</div><div class=\"etu\"><b>Étape 1 — Différence de boules</b> : V = (4/3)π(6³ − 3³) = (4/3)π(216 − 27) = (4/3)π×189 = 252π ≈ <b>792 cm³</b>.</div><div class=\"etu\"><b>Étape 2 — Agrandissement ×2</b> : les volumes doublent au cube : 252π × 8 = 2016π ≈ 6 333 cm³.</div><div class=\"etu\"><b>Étape 3 — Rapport</b> : creux/total = 27/216 = 1/8 avant, 216/1728 = 1/8 après : le rapport de volumes est <b>invariant</b> par agrandissement.</div><div class=\"etu\"><b>Étape 4 — Persistance géométrique</b> : c'est la même loi ×k³ que les maquettes : une icosphère au 1/10 pèse (en volume) le millième de l'originale — les sections et les proportions voyagent à travers toutes les échelles.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le tunnel sous la sphère</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On perce une boule de rayon 5 par un trou cylindrique d'axe passant par le centre, tel que le rayon du trou vaut 3. Quelle est la hauteur du trou (longueur du tunnel visible) ?</div><div class=\"etu\"><b>Étape 1 — Couper par un plan axial</b> : le trou apparaît comme un rectangle inscrit dans le grand cercle de rayon 5, de demi-largeur 3.</div><div class=\"etu\"><b>Étape 2 — Pythagore</b> : demi-hauteur = √(5² − 3²) = √16 = 4 → hauteur du tunnel = <b>8</b>.</div><div class=\"etu\"><b>Étape 3 — Vérifier la cohérence</b> : le trou traverse entièrement la boule : les bords du rectangle touchent le grand cercle aux points (3 ; ±4) — 3² + 4² = 5² ✓.</div><div class=\"etu\"><b>Étape 4 — Bonus (le trou de Napoleon)</b> : le volume restant de la sphère percée ne dépend <b>que de la hauteur du tunnel</b> (8 ici) : V = πh³/6 = 512π/6 ≈ 268 cm³ — résultat troublant et vrai : le rayon de la boule a disparu de la formule. La section pythagoricienne est la clé de toutes ces merveilles.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre sphère (surface) et boule (volume) : l'aire de la boule n'existe pas, c'est l'aire de la sphère.</li>\n<li>Volume boule : oublier le 4/3 ou mettre r² au lieu de r³.</li>\n<li>Doubler r dans les formules : aire ×4, volume ×8 — pas ×2.</li>\n<li>Section de boule : croire que le rayon du disque vaut la distance au centre — c'est √(R² − d²), Pythagore.</li>\n<li>Rotation : déplacer la figure au lieu de la faire tourner autour de O : chaque point garde SA distance au centre.</li>\n</ul>\n</div>\n\n<h3>6. Sphères et repérage : latitude, longitude</h3>\n<ul>\n<li>Un point à la surface terrestre se repère par sa <b>latitude</b> (angle depuis l'équateur, de −90° à +90°) et sa <b>longitude</b> (angle depuis le méridien de Greenwich, de −180° à +180°) ;</li>\n<li>Paris ≈ (48,85° N ; 2,35° E), Quito ≈ (0° ; 78,5° O) : sur l'équateur ;</li>\n<li>Deux points de même longitude partagent un méridien ; même latitude, un parallèle ;</li>\n<li>Le plus court chemin entre deux villes (orthodromie) est un <b>arc de grand cercle</b> : les compagnies aériennes en tirent des routes surprenantes au-dessus du Groenland.</li>\n</ul>\n<table>\n<tr><th>Objet</th><th>Cercle</th><th>Rayon (Terre R ≈ 6 371 km)</th><th>Remarque</th></tr>\n<tr><td>équateur</td><td>grand cercle</td><td>6 371</td><td>parallèle le plus long</td></tr>\n<tr><td>parallèle 45°</td><td>petit cercle</td><td>6 371 × cos 45° ≈ 4 503</td><td>~71 % de l'équateur</td></tr>\n<tr><td>parallèle 60°</td><td>petit cercle</td><td>≈ 3 186</td><td>la moitié de l'équateur</td></tr>\n<tr><td>méridiens</td><td>grands cercles</td><td>6 371</td><td>passent tous par les pôles</td></tr>\n</table>\n<ul>\n<li>Ce tableau justifie les cartes à décrochement : près des pôles, les parallèles se contractent sérieusement ;</li>\n<li>Sections concentriques de la boule : les « tranches » de la Terre à latitude croissante sont des disques de rayon décroissant R·cos(θ) — la formule des sections au service de la géographie.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — la calotte polaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On coupe une boule de rayon 10 cm par un plan situé à 6 cm du centre. 1) Rayon du disque de section ? 2) Aire de la sphère ? 3) Ordre de grandeur de l'aire de la petite calotte découpée ?</div><div class=\"etu\"><b>Étape 1 — Pythagore</b> : rayon du disque = √(10² − 6²) = √64 = <b>8 cm</b>.</div><div class=\"etu\"><b>Étape 2 — Aire de la sphère</b> : A = 4π×100 = 400π ≈ <b>1 257 cm²</b>.</div><div class=\"etu\"><b>Étape 3 — Calotte</b> : la calotte ne touche qu'une petite couronne : son aire vaut 2πRh avec h = hauteur de la calotte = r − d = 10 − 6 = 4 : aire ≈ 2π×10×4 = 80π ≈ <b>251 cm²</b> — environ 1/5 de la sphère, cohérent avec un plan proche du pôle.</div><div class=\"etu\"><b>Étape 4 — Contrôle visuel</b> : plus le plan s'éloigne du centre (d → r), plus h → 0 et plus la calotte devient minuscule : la formule 2πRh redonne bien 0 à la limite — un bon test de crédibilité pour toute formule.</div></div></details>"
  },
  {
    "id": "entiers-decimaux",
    "theme": "Nombres et calculs (6e)",

    "titre": "Nombres entiers et décimaux : opérations, divisibilité",
    "cours": "<div class=\"cours-head\"><h2>Nombres entiers et décimaux : opérations, divisibilité</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les différentes sortes de nombres</h3>\n<ul>\n<li>Les <b>entiers naturels</b> servent à <b>compter</b> des objets entiers : 0, 1, 2, 3, 4... Un classeur ne peut pas contenir 2,5 cahiers !</li>\n<li>Les <b>nombres décimaux</b> servent à mesurer des quantités qui ne tombent pas juste : 1,5 L de lait, 3,14 m, 25,37 kg.</li>\n<li>Un nombre décimal s'écrit avec une <b>virgule</b> (en français ! les Anglais utilisent un point) : partie entière à gauche, partie décimale à droite.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Position des chiffres dans 25,37\">\n  <text x=\"40\" y=\"45\" font-size=\"30\" font-weight=\"bold\" fill=\"#1e293b\" text-anchor=\"middle\">2</text>\n  <text x=\"90\" y=\"45\" font-size=\"30\" font-weight=\"bold\" fill=\"#1e293b\" text-anchor=\"middle\">5</text>\n  <text x=\"120\" y=\"45\" font-size=\"30\" font-weight=\"bold\" fill=\"#ef4444\" text-anchor=\"middle\">,</text>\n  <text x=\"155\" y=\"45\" font-size=\"30\" font-weight=\"bold\" fill=\"#1e293b\" text-anchor=\"middle\">3</text>\n  <text x=\"205\" y=\"45\" font-size=\"30\" font-weight=\"bold\" fill=\"#1e293b\" text-anchor=\"middle\">7</text>\n  <line x1=\"25\" y1=\"60\" x2=\"115\" y2=\"60\" stroke=\"#4f46e5\" stroke-width=\"3\"/>\n  <line x1=\"130\" y1=\"60\" x2=\"220\" y2=\"60\" stroke=\"#16a34a\" stroke-width=\"3\"/>\n  <text x=\"70\" y=\"80\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">partie entière</text>\n  <text x=\"175\" y=\"80\" font-size=\"12\" fill=\"#16a34a\" text-anchor=\"middle\">partie décimale</text>\n  <text x=\"40\" y=\"100\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">dizaines</text>\n  <text x=\"90\" y=\"100\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">unités</text>\n  <text x=\"155\" y=\"100\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">dixièmes</text>\n  <text x=\"205\" y=\"100\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">centièmes</text>\n</svg><span class=\"fig-cap\">Dans 25,37 : 25 est la partie entière, 37 la partie décimale. Chaque chiffre a une <b>position</b> : le 3 vaut 3 dixièmes, le 7 vaut 7 centièmes.</span></div>\n\n<h3>2. Poser une addition et une soustraction</h3>\n<ul>\n<li>Règle d'or : <b>aligner les virgules</b> (et donc les unités sous les unités, les dizaines sous les dizaines...) ;</li>\n<li>Additionner ou soustraire colonne par colonne, en commençant par la droite, avec les retenues ;</li>\n<li>Le résultat garde la virgule <b>alignée</b> avec les autres.</li>\n</ul>\n<div class=\"tip\"><b>Ordre de grandeur</b> : avant de calculer, estimer le résultat. 25,37 + 48,9 ≈ 25 + 49 = 74 : le résultat doit être proche de 74. Cela évite l'erreur classique de virgule (743 ou 7,43).</div>\n<table>\n<tr><th>Calcul</th><th>Estimation</th><th>Résultat</th></tr>\n<tr><td>25,37 + 48,9</td><td>≈ 25 + 49 = 74</td><td>74,27</td></tr>\n<tr><td>8,4 − 2,65</td><td>≈ 8 − 3 = 5</td><td>5,75</td></tr>\n<tr><td>102,5 − 98,7</td><td>≈ 103 − 99 = 4</td><td>3,8</td></tr>\n</table>\n\n<h3>3. Poser une multiplication à virgules</h3>\n<ol>\n<li><b>Estimer</b> le résultat (ordre de grandeur) ;</li>\n<li>Poser la multiplication <b>sans les virgules</b> et calculer ;</li>\n<li>Compter le nombre total de chiffres après la virgule <b>dans les deux facteurs</b> ;</li>\n<li>Placer la virgule au résultat pour qu'il ait ce nombre de chiffres après la virgule.</li>\n</ol>\n<div class=\"ex\"><b>Exemple :</b> 4,75 × 2,3. Estimation : 5 × 2 = 10. Calcul sans virgules : 475 × 23 = 10 925. Chiffres après la virgule : 2 (pour 4,75) + 1 (pour 2,3) = 3. Résultat : <b>10,925</b>. Vérification : proche de 10 ✓.</div>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Multiplication par 10, 100, 1000\">\n  <rect x=\"30\" y=\"30\" width=\"110\" height=\"60\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <text x=\"85\" y=\"55\" font-size=\"14\" fill=\"#1e293b\" text-anchor=\"middle\" font-weight=\"bold\">× 10</text>\n  <text x=\"85\" y=\"78\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\">virgule → 1 cran</text>\n  <rect x=\"160\" y=\"30\" width=\"110\" height=\"60\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <text x=\"215\" y=\"55\" font-size=\"14\" fill=\"#1e293b\" text-anchor=\"middle\" font-weight=\"bold\">× 100</text>\n  <text x=\"215\" y=\"78\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\">virgule → 2 crans</text>\n  <rect x=\"290\" y=\"30\" width=\"110\" height=\"60\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <text x=\"345\" y=\"55\" font-size=\"14\" fill=\"#1e293b\" text-anchor=\"middle\" font-weight=\"bold\">÷ 10</text>\n  <text x=\"345\" y=\"78\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\">virgule ← 1 cran</text>\n  <text x=\"215\" y=\"115\" font-size=\"12\" fill=\"#64748b\" text-anchor=\"middle\">3,7 × 10 = 37 ; 3,7 × 100 = 370 ; 37 ÷ 10 = 3,7</text>\n</svg><span class=\"fig-cap\">Multiplier par 10, 100, 1 000 revient à décaler la virgule vers la droite ; diviser la décale vers la gauche.</span></div>\n\n<h3>4. La division euclidienne</h3>\n<ul>\n<li>La division euclidienne est la division « avec reste » des entiers : on partage 47 bonbons entre 5 enfants ;</li>\n<li>Rélation fondamentale : <b>dividende = diviseur × quotient + reste</b>, avec reste &lt; diviseur ;</li>\n<li>47 = 5 × 9 + 2 : chaque enfant a 9 bonbons, il en reste 2 ;</li>\n<li>Le quotient est la réponse à « combien chacun ? », le reste à « combien en trop ? ».</li>\n</ul>\n\n<h3>5. Critères de divisibilité</h3>\n<table>\n<tr><th>Divisible par</th><th>Critère</th><th>Exemple</th></tr>\n<tr><td>2</td><td>le chiffre des unités est 0, 2, 4, 6 ou 8</td><td>148 ✓ (finit par 8)</td></tr>\n<tr><td>3</td><td>la somme des chiffres est divisible par 3</td><td>471 ✓ (4+7+1 = 12 = 3×4)</td></tr>\n<tr><td>4</td><td>les deux derniers chiffres forment un multiple de 4</td><td>516 ✓ (16 = 4×4)</td></tr>\n<tr><td>5</td><td>le chiffre des unités est 0 ou 5</td><td>935 ✓</td></tr>\n<tr><td>9</td><td>la somme des chiffres est divisible par 9</td><td>648 ✓ (6+4+8 = 18 = 9×2)</td></tr>\n<tr><td>10</td><td>le chiffre des unités est 0</td><td>720 ✓</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — un partage de bonbons bien rempli</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On partage 138 bonbons en sacs de 12, pour une kermesse. Combien de sacs pleins, et reste-t-il des bonbons ? Et si on utilise des sacs de 9 ?</div><div class=\"etu\"><b>Étape 1 — Poser la division</b> : 138 ÷ 12. 12 × 11 = 132, 12 × 12 = 144 &gt; 138, donc quotient = 11.</div><div class=\"etu\"><b>Étape 2 — Calculer le reste</b> : reste = 138 − 132 = 6. Vérification : 12 × 11 + 6 = 138 ✓ et 6 &lt; 12 ✓.</div><div class=\"etu\"><b>Étape 3 — Répondre</b> : 11 sacs pleins et 6 bonbons restants (pour les organisateurs !).</div><div class=\"etu\"><b>Étape 4 — Avec des sacs de 9</b> : 138 = 9 × 15 + 3 (test du critère : 1+3+8 = 12, divisible par 3 mais pas par 9 — le reste 3 le confirme). Toujours vérifier la division par la relation dividende = diviseur × quotient + reste.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — estimer avant de calculer</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Mumu affirme que 19,8 × 4,05 = 801,9. Est-ce plausible ? Sinon, où est l'erreur et quel est le bon résultat ?</div><div class=\"etu\"><b>Étape 1 — Ordre de grandeur</b> : 19,8 ≈ 20 et 4,05 ≈ 4, donc le produit doit valoir ≈ 80.</div><div class=\"etu\"><b>Étape 2 — Comparer</b> : 801,9 est 10 fois trop grand — l'erreur est une <b>virgule mal placée</b>.</div><div class=\"etu\"><b>Étape 3 — Recalculer proprement</b> : 198 × 405 = 80 190 ; chiffres après la virgule : 1 + 2 = 3 → <b>80,19</b>.</div><div class=\"etu\"><b>Étape 4 — Moralité</b> : l'ordre de grandeur détecte instantanément les erreurs de virgule, l'erreur la plus fréquente. Estimer AVANT, vérifier APRÈS : les deux réflexes du calculateur qui se respecte.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Poser une addition sans aligner les virgules : 25,37 + 48,9 n'est pas 25,37 + 48,90 mal aligné — toujours <b>virgule sous virgule</b>.</li>\n<li>Multiplier les virgules « à la fin n'importe comment » : on compte les chiffres après la virgule <b>des deux facteurs</b>.</li>\n<li>« Divisible par 3 si le nombre finit par 3 » : non — c'est la <b>somme des chiffres</b> qui doit être divisible par 3 (13 n'est pas divisible par 3 !).</li>\n<li>Confondre le chiffre des dizaines (le 5 de 58) et le nombre de dizaines (58 contient 5 dizaines, soit 50).</li>\n<li>Un reste plus grand que le diviseur : impossible — c'est le signe d'une erreur de calcul.</li>\n</ul>\n</div>\n<h3>6. Les grands nombres et les puissances de 10</h3>\n<ul>\n<li>Lire un grand nombre : grouper les chiffres par 3 à partir de la droite (espace insécable) : 1 234 567 se lit « un million deux cent trente-quatre mille cinq cent soixante-sept » ;</li>\n<li>Chaque groupe a un nom : unités, <b>mille</b>, <b>millions</b>, <b>milliards</b> — les classes ;</li>\n<li>Écrire 80 millions : 80 000 000 (suivi de six zéros) ; écrire 7 milliards 25 millions : 7 025 000 000.</li>\n</ul>\n<table>\n<tr><th>Puissance de 10</th><th>Valeur</th><th>Nom</th><th>Utilisation</th></tr>\n<tr><td>10³</td><td>1 000</td><td>mille</td><td>population d'un village</td></tr>\n<tr><td>10⁶</td><td>1 000 000</td><td>un million</td><td>population d'une grande ville</td></tr>\n<tr><td>10⁹</td><td>1 000 000 000</td><td>un milliard</td><td>population mondiale (~8)</td></tr>\n</table>\n<div class=\"tip\"><b>Comparer deux décimaux</b> : d'abord les parties entières ; si égales, comparer les dixièmes, puis les centièmes... 5,4 &lt; 5,39 ? Non : 5,4 = 5,40 et 40 centièmes &gt; 39 centièmes, donc 5,4 &gt; 5,39. Ajouter des zéros à droite pour aligner !</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — ranger des décimaux dans l'ordre</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Ranger par ordre croissant : 7,05 ; 7,5 ; 7,45 ; 7,099 ; 7,4.</div><div class=\"etu\"><b>Étape 1 — Même partie entière</b> : toutes commencent par 7, il faut comparer les parties décimales.</div><div class=\"etu\"><b>Étape 2 — Aligner au même nombre de chiffres</b> : 7,050 ; 7,500 ; 7,450 ; 7,099 ; 7,400. On compare alors comme des entiers : 50 &lt; 99 &lt; 400 &lt; 450 &lt; 500.</div><div class=\"etu\"><b>Étape 3 — Ordonner</b> : 7,05 &lt; 7,099 &lt; 7,4 &lt; 7,45 &lt; 7,5.</div><div class=\"etu\"><b>Étape 4 — Contrôler</b> : placer mentalement sur une droite graduée — chaque nombre est bien entre 7 et 8, dans cet ordre croissant. Le piège classique : croire que 7,099 &gt; 7,4 « car il y a plus de chiffres ». Non : ce sont les <b>positions</b> qui comptent, pas le nombre de chiffres.</div></div></details>\n"
  },
  {
    "id": "fractions",
    "theme": "Fractions (6e)",
    "niveau": "6e",
    "titre": "Fractions : comparaison, addition, soustraction",
    "cours": "<div class=\"cours-head\"><h2>Fractions : comparaison, addition, soustraction</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Une fraction, ça veut dire quoi ?</h3>\n<ul>\n<li>Une fraction décrit un <b>partage en parts égales</b> : 3/8 = « 3 parts sur 8 parts égales » ;</li>\n<li>Le <b>dénominateur</b> (en bas) dit en combien de parts on a coupé ; le <b>numérateur</b> (en haut) dit combien de parts on prend ;</li>\n<li>Une fraction est aussi une <b>division</b> : 3/4 = 3 ÷ 4 = 0,75 ;</li>\n<li>Condition essentielle : les parts doivent être <b>égales</b> — un « partage » inégal n'est pas une fraction.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Trois quarts d un disque\">\n  <circle cx=\"80\" cy=\"60\" r=\"40\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n  <path d=\"M 80 60 L 80 20 A 40 40 0 0 1 120 60 Z\" fill=\"#4f46e5\"/>\n  <path d=\"M 80 60 L 40 60 A 40 40 0 0 1 80 20 Z\" fill=\"#4f46e5\"/>\n  <path d=\"M 80 60 L 40 60 A 40 40 0 0 0 80 100 Z\" fill=\"#c7d2fe\"/>\n  <text x=\"80\" y=\"115\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">3/4</text>\n  <circle cx=\"230\" cy=\"60\" r=\"40\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n  <path d=\"M 230 60 L 270 60 A 40 40 0 0 1 230 100 Z\" fill=\"#4f46e5\"/>\n  <text x=\"230\" y=\"115\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">1/4</text>\n  <text x=\"355\" y=\"55\" font-size=\"13\" fill=\"#1e293b\" text-anchor=\"middle\">3/4 + 1/4</text>\n  <text x=\"355\" y=\"75\" font-size=\"13\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">= 4/4 = 1</text>\n</svg><span class=\"fig-cap\">Trois quarts + un quart = quatre quarts = l'unité entière. Quand le numérateur atteint le dénominateur, on a 1.</span></div>\n\n<h3>2. Fractions égales et simplification</h3>\n<div class=\"tip\"><b>Règle d'or</b> : une fraction ne change pas de valeur si on multiplie (ou divise) son numérateur ET son dénominateur par le même nombre. 1/2 = 2/4 = 3/6 = 5/10 : c'est toujours « la moitié ».</div>\n<ul>\n<li>Simplifier une fraction : diviser haut et bas par un même nombre, jusqu'à ne plus pouvoir ;</li>\n<li>12/18 : les deux sont divisibles par 6 → 2/3. On ne peut plus simplifier : la fraction est <b>irréductible</b> ;</li>\n<li>Prendre une fraction d'une quantité : 3/4 de 20 = (20 ÷ 4) × 3 = 15. On divise par le dénominateur, on multiplie par le numérateur.</li>\n</ul>\n<table>\n<tr><th>Fraction</th><th>Égales à...</th><th>Valeur décimale</th></tr>\n<tr><td>1/2</td><td>2/4 ; 3/6 ; 25/50</td><td>0,5</td></tr>\n<tr><td>1/4</td><td>2/8 ; 25/100</td><td>0,25</td></tr>\n<tr><td>1/5</td><td>2/10 ; 20/100</td><td>0,2</td></tr>\n<tr><td>3/4</td><td>6/8 ; 75/100</td><td>0,75</td></tr>\n<tr><td>2/3</td><td>4/6 ; 12/18</td><td>≈ 0,667</td></tr>\n</table>\n\n<h3>3. Comparer des fractions</h3>\n<ul>\n<li><b>Même dénominateur</b> : la plus grande est celle qui a le plus grand numérateur — 5/7 &gt; 3/7 (5 parts de taille identique, c'est plus que 3) ;</li>\n<li><b>Même numérateur</b> : la plus grande est celle qui a le plus petit dénominateur — 3/4 &gt; 3/9 (couper en 4 donne des parts plus grosses que couper en 9) ;</li>\n<li><b>Comparer à 1</b> : si numérateur &gt; dénominateur, la fraction dépasse 1 (7/5 &gt; 1) ; sinon elle est plus petite ;</li>\n<li>Cas général : tout mettre <b>au même dénominateur</b>, ou comparer les valeurs décimales.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 110\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Comparaison sur une demi-droite graduee\">\n  <line x1=\"30\" y1=\"55\" x2=\"400\" y2=\"55\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <circle cx=\"80\" cy=\"55\" r=\"4\" fill=\"#4f46e5\"/><circle cx=\"230\" cy=\"55\" r=\"4\" fill=\"#16a34a\"/><circle cx=\"380\" cy=\"55\" r=\"4\" fill=\"#ef4444\"/>\n  <text x=\"80\" y=\"85\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">3/4 = 0,75</text>\n  <text x=\"230\" y=\"85\" font-size=\"12\" fill=\"#16a34a\" text-anchor=\"middle\">1</text>\n  <text x=\"380\" y=\"85\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">7/5 = 1,4</text>\n  <text x=\"230\" y=\"35\" font-size=\"12\" fill=\"#64748b\" text-anchor=\"middle\">3/4 &lt; 1 &lt; 7/5 : à gauche = plus petit</text>\n</svg><span class=\"fig-cap\">Placer les fractions sur une droite graduée : la plus à gauche est la plus petite. C'est le test visuel infaillible.</span></div>\n\n<h3>4. Additionner et soustraire</h3>\n<div class=\"tip\"><b>Règle unique</b> : même dénominateur → on ajoute (ou soustrait) les numérateurs, on garde le dénominateur. Dénominateurs différents → on met d'abord au même dénominateur.</div>\n<ul>\n<li>3/11 + 5/11 = 8/11 (jamais 8/22 !) ;</li>\n<li>1/2 + 1/3 : dénominateur commun 6 → 3/6 + 2/6 = <b>5/6</b> ;</li>\n<li>7/8 − 1/4 = 7/8 − 2/8 = 5/8 ;</li>\n<li>Astuce pour trouver le dénominateur commun : prendre le plus petit multiple commun (pour 2 et 3 : 6 ; pour 4 et 6 : 12).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la tablette de chocolat disputée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Léa mange 1/3 d'une tablette, Tom 1/4, Ana 5/12. La tablette est-elle finie ? Qui en a mangé le plus ?</div><div class=\"etu\"><b>Étape 1 — Chercher le dénominateur commun</b> : 3, 4 et 12 → 12 convient (12 = 3×4, multiple de chacun).</div><div class=\"etu\"><b>Étape 2 — Convertir chaque fraction</b> : 1/3 = 4/12 (×4 haut et bas) ; 1/4 = 3/12 (×3 haut et bas) ; Ana a déjà 5/12.</div><div class=\"etu\"><b>Étape 3 — Comparer</b> : 5/12 (Ana) &gt; 4/12 (Léa) &gt; 3/12 (Tom) : c'est Ana la plus gourmande.</div><div class=\"etu\"><b>Étape 4 — Additionner</b> : 4/12 + 3/12 + 5/12 = 12/12 = 1 : la tablette est <b>entièrement</b> mangée. Le total 12/12 = 1 est la preuve que le partage est complet.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — prendre une fraction d'une recette</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une recette de gâteaux pour 8 personnes demande 600 g de farine. On ne veut cuisiner que pour 3 personnes. Quelle fraction de la recette préparer, et quelle masse de farine ?</div><div class=\"etu\"><b>Étape 1 — Traduire</b> : 3 personnes sur 8 → fraction 3/8 de la recette.</div><div class=\"etu\"><b>Étape 2 — Diviser par le dénominateur</b> : 600 ÷ 8 = 75 g (la part d'une personne).</div><div class=\"etu\"><b>Étape 3 — Multiplier par le numérateur</b> : 75 × 3 = <b>225 g</b> de farine.</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : 225/600 = 3/8 ✓ (simplification par 75). Prendre a/b d'une quantité Q : (Q ÷ b) × a — toujours dans cet ordre.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Additionner les dénominateurs : 1/2 + 1/3 ≠ 2/5 ! D'abord le même dénominateur (5/6).</li>\n<li>« 1/4 plus grand que 1/3 car 4 &gt; 3 » : c'est l'inverse — couper en 4 donne des parts plus <b>petites</b>.</li>\n<li>Simplifier en divisant seulement le haut (12/18 → 2/18) : il faut diviser <b>haut et bas</b>.</li>\n<li>Oublier que n/n = 1 (8/8 = 1) et 0/n = 0.</li>\n<li>Comparer des fractions sans mettre au même dénominateur : 3/5 et 2/3 ne se comparent pas « au jugé » → 9/15 et 10/15.</li>\n</ul>\n</div>\n<h3>5. La demi-droite graduée : donner une adresse aux fractions</h3>\n<ul>\n<li>Graduer une demi-droite, c'est choisir une <b>unité</b> (longueur du segment unité) et partager chaque unité en parts égales ;</li>\n<li>Si l'unité est coupée en 6, chaque graduation vaut 1/6 : le point situé à 3 graduations vaut 3/6 = 1/2 ;</li>\n<li>Une fraction « dépasse l'unité » : 7/4 = 1 + 3/4 se place une unité après 0, plus 3/4 de l'unité suivante ;</li>\n<li>Au-dessus de la droite, on écrit les fractions ; en dessous, leurs valeurs décimales (3/6 → 0,5) : les deux écritures cohabitent.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 110\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Droite graduee en quarts\">\n  <line x1=\"20\" y1=\"60\" x2=\"420\" y2=\"60\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <circle cx=\"30\" cy=\"60\" r=\"4\" fill=\"#ef4444\"/>\n  <text x=\"30\" y=\"85\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">0</text>\n  <g stroke=\"#4f46e5\" stroke-width=\"2\">\n    <line x1=\"60\" y1=\"52\" x2=\"60\" y2=\"68\"/><line x1=\"90\" y1=\"55\" x2=\"90\" y2=\"65\"/><line x1=\"120\" y1=\"55\" x2=\"120\" y2=\"65\"/><line x1=\"150\" y1=\"52\" x2=\"150\" y2=\"68\"/>\n    <line x1=\"180\" y1=\"55\" x2=\"180\" y2=\"65\"/><line x1=\"210\" y1=\"55\" x2=\"210\" y2=\"65\"/><line x1=\"240\" y1=\"55\" x2=\"240\" y2=\"65\"/><line x1=\"270\" y1=\"52\" x2=\"270\" y2=\"68\"/>\n    <line x1=\"300\" y1=\"52\" x2=\"300\" y2=\"68\"/><line x1=\"330\" y1=\"55\" x2=\"330\" y2=\"65\"/><line x1=\"360\" y1=\"55\" x2=\"360\" y2=\"65\"/><line x1=\"390\" y1=\"55\" x2=\"390\" y2=\"65\"/>\n  </g>\n  <text x=\"60\" y=\"85\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">1/4</text>\n  <text x=\"120\" y=\"85\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">3/4</text>\n  <text x=\"150\" y=\"85\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">1</text>\n  <text x=\"270\" y=\"85\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">2</text>\n  <text x=\"240\" y=\"35\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">7/4 ici</text>\n  <circle cx=\"240\" cy=\"60\" r=\"5\" fill=\"#ef4444\"/>\n</svg><span class=\"fig-cap\">Droite graduée en quarts : chaque petite graduation vaut 1/4. Le point rouge à 7/4 se situe à 1 + 3/4 : au-delà de l'unité 1.</span></div>\n\n<h3>6. Fractions et partages de la vie courante</h3>\n<ul>\n<li><b>Horloge</b> : « et quart » = 1/4 h ; « et demie » = 1/2 h ; « moins le quart » = 3/4 de l'heure écoulée ;</li>\n<li><b>Sport</b> : mi-temps = 1/2 match ; sets au tennis : 1/3 du match gagné par set ;</li>\n<li><b>Cuisine</b> : un demi-citron, 3/4 de litre de lait, 1/2 cuillère à café de sel — la cuisine est un immense terrain de fractions ;</li>\n<li><b>Cartes</b> : l'échelle 1/25 000 est une fraction : 1 cm sur la carte = 25 000 cm = 250 m en réalité.</li>\n</ul>\n<table>\n<tr><th>Fraction</th><th>Usage courant</th><th>Valeur</th></tr>\n<tr><td>1/2</td><td>un demi (heure, pomme)</td><td>0,5</td></tr>\n<tr><td>1/3</td><td>un tiers (de tour, de gâteau)</td><td>≈ 0,333</td></tr>\n<tr><td>1/4</td><td>un quart (d'heure, de kilo)</td><td>0,25</td></tr>\n<tr><td>1/10</td><td>un dixième (de seconde)</td><td>0,1</td></tr>\n<tr><td>1/100</td><td>un centième (de seconde au chrono)</td><td>0,01</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'heure et les quarts</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Il est 8 h moins le quart. Quelle fraction de l'heure de 8 h à 9 h reste-t-il à « remplir » avant 9 h ? Et combien de minutes ?</div><div class=\"etu\"><b>Étape 1 — Traduire</b> : 8 h moins le quart = 7 h + 3/4 h, soit 45 min après 7 h.</div><div class=\"etu\"><b>Étape 2 — Fraction écoulée depuis 8 h</b> : il reste de 8 h moins le quart à 9 h : 15 min avant 8 h + 60 min, soit 75 min au total.</div><div class=\"etu\"><b>Étape 3 — En fraction d'heure</b> : 75 min = 75/60 h = 5/4 h (simplification par 15) = 1 h + 1/4 h.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : il reste 5/4 d'heure. On vérifie : 5/4 × 60 = 75 min ✓. Une fraction peut dépasser 1 : 5/4 d'heure est parfaitement légitime.</div></div></details>\n"

  {
    "id": "pourcentages",
    "theme": "Proportionnalité et pourcentages (6e)",
    "niveau": "6e",
    "titre": "Proportionnalité et pourcentages",
    "cours": "<div class=\"cours-head\"><h2>Proportionnalité et pourcentages</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La proportionnalité : un coefficient qui ne change pas</h3>\n<ul>\n<li>Deux grandeurs sont <b>proportionnelles</b> quand on passe de l'une à l'autre en multipliant toujours par le <b>même nombre</b> (le coefficient de proportionnalité) ;</li>\n<li>Exemple : le prix des pommes est proportionnel à la masse (0,5 kg → 1,75 € ; 1 kg → 3,50 € : coefficient 7 €/kg) ;</li>\n<li>Contre-exemple : l'âge et la taille d'un enfant ne sont pas proportionnels (on ne grandit pas 6 cm par an toute sa vie !) ;</li>\n<li>Outil universel : le <b>tableau de proportionnalité</b>, où les produits en croix sont égaux.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Graphe proportionnel ligne droite\">\n  <line x1=\"50\" y1=\"120\" x2=\"400\" y2=\"120\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"50\" y1=\"120\" x2=\"50\" y2=\"20\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"405\" y=\"125\" font-size=\"11\" fill=\"#64748b\">masse (kg)</text>\n  <text x=\"28\" y=\"24\" font-size=\"11\" fill=\"#64748b\">€</text>\n  <line x1=\"50\" y1=\"120\" x2=\"380\" y2=\"13\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <circle cx=\"130\" cy=\"95\" r=\"4\" fill=\"#4f46e5\"/><circle cx=\"230\" cy=\"60\" r=\"4\" fill=\"#4f46e5\"/><circle cx=\"310\" cy=\"36\" r=\"4\" fill=\"#4f46e5\"/>\n  <text x=\"130\" y=\"112\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">1 kg</text>\n  <text x=\"230\" y=\"78\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">2 kg</text>\n  <text x=\"310\" y=\"54\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">3 kg</text>\n  <text x=\"290\" y=\"20\" font-size=\"11\" fill=\"#4f46e5\" font-weight=\"bold\">droite qui passe par zéro</text>\n</svg><span class=\"fig-cap\">Signature graphique de la proportionnalité : les points sont <b>alignés</b> sur une droite qui passe par l'origine.</span></div>\n\n<h3>2. Le produit en croix (quatrième proportionnelle)</h3>\n<div class=\"tip\">Dans un tableau de proportionnalité : a/b = c/d ⟺ a×d = b×c. Pour trouver la valeur manquante : on multiplie « en croix » puis on divise.</div>\n<ul>\n<li>3 kg de pommes → 7,50 € ; combien pour 5 kg ? 5 × 7,50 ÷ 3 = <b>12,50 €</b> ;</li>\n<li>Le produit en croix remplace tous les raisonnements : c'est l'outil n°1 de la proportionnalité.</li>\n</ul>\n\n<h3>3. Les pourcentages : des fractions sur 100</h3>\n<div class=\"tip\"><b>Prendre p % d'une quantité</b> : (p ÷ 100) × quantité = p × quantité ÷ 100. Un pourcentage est une fraction : 15 % = 15/100 = 0,15.</div>\n<table>\n<tr><th>Pourcentage</th><th>Fraction</th><th>Astuce de calcul mental</th></tr>\n<tr><td>50 %</td><td>1/2</td><td>diviser par 2</td></tr>\n<tr><td>25 %</td><td>1/4</td><td>diviser par 4</td></tr>\n<tr><td>10 %</td><td>1/10</td><td>diviser par 10</td></tr>\n<tr><td>20 %</td><td>1/5</td><td>diviser par 5</td></tr>\n<tr><td>75 %</td><td>3/4</td><td>diviser par 4, ×3</td></tr>\n<tr><td>5 %</td><td>1/20</td><td>diviser par 20</td></tr>\n</table>\n<ul>\n<li>15 % de 80 € : 15 × 80 ÷ 100 = <b>12 €</b> (ou 10 % = 8 €, 5 % = 4 €, total 12 €) ;</li>\n<li>Les pourcentages servent partout : soldes, sondages, statistiques, recettes, mélanges.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Camembert 50 30 20\">\n  <circle cx=\"100\" cy=\"55\" r=\"42\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n  <path d=\"M 100 55 L 100 13 A 42 42 0 0 1 100 97 Z\" fill=\"#4f46e5\"/>\n  <path d=\"M 100 55 L 100 97 A 42 42 0 0 1 60 42 Z\" fill=\"#16a34a\"/>\n  <text x=\"100\" y=\"52\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\">50 %</text>\n  <text x=\"76\" y=\"74\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">30 %</text>\n  <text x=\"76\" y=\"26\" font-size=\"11\" fill=\"#1e293b\" text-anchor=\"middle\">20 %</text>\n  <text x=\"280\" y=\"35\" font-size=\"13\" fill=\"#1e293b\">Angle = fréquence × 360°</text>\n  <text x=\"280\" y=\"55\" font-size=\"12\" fill=\"#4f46e5\">50 % → 180°</text>\n  <text x=\"280\" y=\"75\" font-size=\"12\" fill=\"#16a34a\">30 % → 108°</text>\n  <text x=\"280\" y=\"95\" font-size=\"12\" fill=\"#64748b\">20 % → 72° (somme 360°)</text>\n</svg><span class=\"fig-cap\">Diagramme circulaire : chaque part est proportionnelle à son pourcentage — l'angle se calcule en multipliant par 360°.</span></div>\n\n<h3>4. Augmenter, réduire : le coefficient multiplicateur</h3>\n<ul>\n<li>Augmenter de 15 % = garder 115 % → multiplier par <b>1,15</b> ;</li>\n<li>Réduire de 20 % = garder 80 % → multiplier par <b>0,80</b> ;</li>\n<li>Pantalon à 40 € soldé à −25 % : 40 × 0,75 = <b>30 €</b> ;</li>\n<li>Échelles : une carte au 1/100 000 : 1 cm sur la carte = 100 000 cm en réalité = <b>1 km</b> ;</li>\n<li>Vitesse : à vitesse constante, distance et temps sont proportionnels (d = v × t).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — deux remises successives</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une console à 250 € : −20 % pendant les soldes, puis carte de fidélité : −10 % supplémentaires sur le prix soldé. Prix final ? Est-ce équivalent à −30 % ?</div><div class=\"etu\"><b>Étape 1 — Première remise</b> : 250 × 0,80 = 200 € (−20 % = ×0,80).</div><div class=\"etu\"><b>Étape 2 — Seconde remise</b> : elle s'applique au <b>nouveau</b> prix : 200 × 0,90 = <b>180 €</b>.</div><div class=\"etu\"><b>Étape 3 — Comparer avec −30 %</b> : 250 × 0,70 = 175 € ≠ 180 € : les remises ne s'additionnent <b>jamais</b>.</div><div class=\"etu\"><b>Étape 4 — Réflexe</b> : chaque pourcentage s'applique au prix courant ; on enchaîne les coefficients multiplicateurs (0,80 puis 0,90), on n'additionne pas les taux.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le fameux +20 % puis −20 %</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un article subit une hausse de 20 % puis une baisse de 20 %. Retrouve-t-il son prix de départ ?</div><div class=\"etu\"><b>Étape 1 — Tester avec 100 €</b> : départ 100 €.</div><div class=\"etu\"><b>Étape 2 — Hausse</b> : 100 × 1,20 = 120 €.</div><div class=\"etu\"><b>Étape 3 — Baisse</b> : 120 × 0,80 = <b>96 €</b>.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : on ne revient pas au départ — il reste une perte de 4 %. La baisse de 20 % s'applique à un prix plus élevé : elle « enlève » plus que la hausse n'a ajouté. Contre-intuitif mais inattaquable.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Additionner des remises successives (−20 % puis −10 % ≠ −30 %) : elles se <b>composent</b> (×0,80 puis ×0,90).</li>\n<li>Appliquer le pourcentage au prix de départ au lieu du prix courant dans une remise en cascade.</li>\n<li>Confondre 0,15 et 15 % : passer de l'un à l'autre impose ×100 ou ÷100.</li>\n<li>« Plus le pourcentage de remise est écrit gros, plus c'est intéressant » : calculer le prix final, toujours.</li>\n<li>Dire « proportionnel » pour des grandeurs liées par un abonnement (prix = fixe + par unité) : la présence d'une valeur fixe casse la proportionnalité.</li>\n</ul>\n</div>\n<h3>5. Tableaux et diagrammes : lire et interpréter</h3>\n<ul>\n<li>Un <b>tableau</b> organise des données en lignes et colonnes : ligne = une catégorie, colonne = une caractéristique ;</li>\n<li>Un <b>diagramme en barres</b> compare des quantités (hauteur proportionnelle) : idéal pour comparer des catégories ;</li>\n<li>Un <b>diagramme circulaire</b> (camembert) montre des parts d'un tout : chaque angle = fréquence × 360° ;</li>\n<li>Un <b>graphique cartésien</b> montre l'évolution d'une grandeur en fonction d'une autre (température selon l'heure) ;</li>\n<li>Règle de lecture : toujours regarder le <b>titre</b>, les <b>axes</b> (que représentent-ils ? dans quelle unité ?) avant d'interpréter.</li>\n</ul>\n<table>\n<tr><th>Moyen de transport</th><th>Élèves</th><th>Fréquence</th><th>Angle (sur 360°)</th></tr>\n<tr><td>À pied</td><td>15</td><td>30 %</td><td>108°</td></tr>\n<tr><td>Bus</td><td>20</td><td>40 %</td><td>144°</td></tr>\n<tr><td>Vélo</td><td>10</td><td>20 %</td><td>72°</td></tr>\n<tr><td>Voiture</td><td>5</td><td>10 %</td><td>36°</td></tr>\n<tr><td><b>Total</b></td><td><b>50</b></td><td><b>100 %</b></td><td><b>360°</b></td></tr>\n</table>\n<div class=\"tip\"><b>Méthode des fréquences</b> : fréquence = effectif ÷ total. Pour l'angle d'un camembert : fréquence × 360 (ou effectif × 360 ÷ total). Contrôle : la somme des angles doit faire 360°, la somme des fréquences 100 %.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le sondage du club</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur 40 élèves sondés, 26 préfèrent le foot, 10 le basket, 4 le tennis. Construire le tableau des fréquences et les angles du diagramme circulaire.</div><div class=\"etu\"><b>Étape 1 — Fréquences</b> : foot 26/40 = 65 % ; basket 10/40 = 25 % ; tennis 4/40 = 10 %. Somme : 100 % ✓.</div><div class=\"etu\"><b>Étape 2 — Angles</b> : foot 0,65 × 360 = 234° ; basket 0,25 × 360 = 90° ; tennis 0,10 × 360 = 36°.</div><div class=\"etu\"><b>Étape 3 — Contrôler</b> : 234 + 90 + 36 = 360° ✓ — la vérification est obligatoire.</div><div class=\"etu\"><b>Étape 4 — Commenter</b> : le foot occupe presque deux tiers du disque : lecture immédiate. Un bon diagramme n'a pas besoin d'être relu : il se comprend d'un coup d'œil, c'est tout l'intérêt des représentations graphiques.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — retrouver le pourcentage à l'envers</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Après une remise, un pull coûte 24 € ; l'étiquette indique « −40 % ». Quel était le prix initial ?</div><div class=\"etu\"><b>Étape 1 — Comprendre</b> : 24 € représente les 60 % restants (100 − 40).</div><div class=\"etu\"><b>Étape 2 — Produit en croix</b> : prix × 0,60 = 24, donc prix = 24 ÷ 0,60.</div><div class=\"etu\"><b>Étape 3 — Calculer</b> : 24 ÷ 0,60 = <b>40 €</b>.</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : 40 × 0,60 = 24 ✓. Attention au piège inverse : « 24 + 40 % de 24 = 33,60 € » est FAUX — on ne remonte pas en ajoutant p % au prix soldé, car les 40 % s'appliquaient au prix initial, plus élevé.</div></div></details>\n"
  },

    "titre": "Géométrie de base : figures, angles, symétries",
    "cours": "<div class=\"cours-head\"><h2>Géométrie de base : figures, angles, symétries</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Points, droites, segments : le vocabulaire</h3>\n<ul>\n<li>Une <b>droite</b> est illimitée des deux côtés : on la note (AB) avec des parenthèses — elle n'a pas de longueur ;</li>\n<li>Un <b>segment</b> a deux extrémités : [AB] avec des crochets — sa longueur se note AB et se mesure ;</li>\n<li>Une <b>demi-droite</b> [AB) : origine A, illimitée au-delà de B ;</li>\n<li>Droites <b>parallèles</b> : elles ne se coupent jamais, même distance partout ; droites <b>perpendiculaires</b> : elles se coupent à angle droit.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Droite segment demi-droite\">\n  <line x1=\"30\" y1=\"30\" x2=\"400\" y2=\"30\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <circle cx=\"120\" cy=\"30\" r=\"3.5\" fill=\"#ef4444\"/><circle cx=\"280\" cy=\"30\" r=\"3.5\" fill=\"#ef4444\"/>\n  <text x=\"120\" y=\"20\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">A</text>\n  <text x=\"280\" y=\"20\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">B</text>\n  <text x=\"215\" y=\"52\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">(AB) : la droite ENTIERE — illimitée</text>\n  <line x1=\"80\" y1=\"90\" x2=\"200\" y2=\"90\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <circle cx=\"80\" cy=\"90\" r=\"3.5\" fill=\"#ef4444\"/><circle cx=\"200\" cy=\"90\" r=\"3.5\" fill=\"#ef4444\"/>\n  <text x=\"80\" y=\"80\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">A</text>\n  <text x=\"200\" y=\"80\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">B</text>\n  <text x=\"140\" y=\"112\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">[AB] : le segment — mesurable</text>\n  <line x1=\"280\" y1=\"90\" x2=\"400\" y2=\"90\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <circle cx=\"280\" cy=\"90\" r=\"3.5\" fill=\"#ef4444\"/>\n  <text x=\"280\" y=\"80\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">A</text>\n  <text x=\"340\" y=\"112\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">[Ax) : demi-droite</text>\n</svg><span class=\"fig-cap\">Les notations racontent tout : parenthèses = illimité, crochets = borné. Une droite ne se mesure pas ; un segment, oui.</span></div>\n\n<h3>2. Les angles : mesurer l'écartement</h3>\n<ul>\n<li>Un <b>angle</b> est formé de deux demi-droites de même origine (le sommet) ;</li>\n<li>Il mesure l'<b>ouverture</b> entre elles, en <b>degrés</b> (°), au rapporteur ;</li>\n<li>La <b>bissectrice</b> est la demi-droite qui partage l'angle en deux angles égaux.</li>\n</ul>\n<table>\n<tr><th>Angle</th><th>Mesure</th><th>Exemple dans la vie</th></tr>\n<tr><td>nul</td><td>0°</td><td>deux rayons confondus</td></tr>\n<tr><td>aigu</td><td>entre 0° et 90°</td><td>aiguille du « 7 h moins le quart »</td></tr>\n<tr><td>droit</td><td>90°</td><td>coin d'une feuille, coin de l'équerre</td></tr>\n<tr><td>obtus</td><td>entre 90° et 180°</td><td>aiguilles à 17 h</td></tr>\n<tr><td>plat</td><td>180°</td><td>roue de vélo vue de côté (diamètre)</td></tr>\n<tr><td>rentrant (tour complet)</td><td>360°</td><td>aiguille après un tour de cadran</td></tr>\n</table>\n<ul>\n<li>Deux angles sont <b>complémentaires</b> si leur somme vaut 90° ; <b>supplémentaires</b> si elle vaut 180°.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Angles aigu droit obtus plat\">\n  <line x1=\"40\" y1=\"95\" x2=\"110\" y2=\"95\" stroke=\"#4f46e5\" stroke-width=\"2\"/><line x1=\"40\" y1=\"95\" x2=\"90\" y2=\"55\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <path d=\"M 62 95 A 22 22 0 0 0 55 81\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"118\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">aigu (~40°)</text>\n  <line x1=\"180\" y1=\"95\" x2=\"260\" y2=\"95\" stroke=\"#4f46e5\" stroke-width=\"2\"/><line x1=\"180\" y1=\"95\" x2=\"180\" y2=\"35\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <path d=\"M 202 95 A 22 22 0 0 0 180 73\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n  <rect x=\"180\" y=\"95\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n  <text x=\"220\" y=\"118\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">droit (90°)</text>\n  <line x1=\"320\" y1=\"95\" x2=\"410\" y2=\"95\" stroke=\"#4f46e5\" stroke-width=\"2\"/><line x1=\"320\" y1=\"95\" x2=\"300\" y2=\"45\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <path d=\"M 342 95 A 22 22 0 0 0 311 75\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n  <text x=\"365\" y=\"118\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">obtus (~110°)</text>\n</svg><span class=\"fig-cap\">De gauche à droite : l'écartement augmente. Le rapporteur se centre sur le sommet et s'aligne sur un côté.</span></div>\n\n<h3>3. Polygones : une famille nombreuse</h3>\n<ul>\n<li><b>Triangle</b> (3 côtés) : quelconque, <b>isocèle</b> (2 côtés égaux), <b>équilatéral</b> (3 côtés égaux, 3 angles de 60°), <b>rectangle</b> (un angle droit) ;</li>\n<li><b>Quadrilatères</b> (4 côtés) : trapèze, parallélogramme, losange, rectangle, carré ;</li>\n<li>Somme des angles : <b>180° dans un triangle</b>, 360° dans un quadrilatère ;</li>\n<li><b>Cercle</b> : l'ensemble des points à distance r (rayon) du centre ; diamètre = 2×rayon.</li>\n</ul>\n<div class=\"tip\"><b>La hiérarchie des quadrilatères</b> : le carré est à la fois un rectangle (4 angles droits) et un losange (4 côtés égaux) ; le rectangle et le losange sont des parallélogrammes. Mais un losange n'a pas d'angles droits en général, et un rectangle n'a pas 4 côtés égaux en général.</div>\n\n<h3>4. Symétries : plier et pivoter</h3>\n<ul>\n<li><b>Symétrie axiale</b> (par rapport à une droite (d)) : en pliant le long de (d), la figure coïncide avec son image ; chaque point est à la même <b>distance</b> de l'axe, sur la perpendiculaire ;</li>\n<li><b>Symétrie centrale</b> (par rapport à un point O) : O est le <b>milieu</b> du segment reliant un point à son image ;</li>\n<li>La symétrie conserve les longueurs, les angles et les alignements ;</li>\n<li>Axes de symétrie : rectangle 2, losange 2, carré 4, cercle une infinité (tous les diamètres) ; le parallélogramme n'a pas d'axe, mais un <b>centre</b> de symétrie.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — construire un symétrique au compas</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Construire le symétrique A′ du point A par rapport à la droite (d), sans équerre, au compas seul.</div><div class=\"etu\"><b>Étape 1 — Choisir deux points</b> P et Q sur la droite (d), assez écartés.</div><div class=\"etu\"><b>Étape 2 — Premier arc</b> : tracer l'arc de cercle de centre P et de rayon PA (le même écartement !).</div><div class=\"etu\"><b>Étape 3 — Second arc</b> : tracer l'arc de centre Q et de rayon QA.</div><div class=\"etu\"><b>Étape 4 — Conclure</b> : les deux arcs se coupent en A et en un autre point : c'est <b>A′</b>. Plier le long de (d) : A et A′ coïncident — test de validation universel de la symétrie axiale.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — retrouver un angle sans rapporteur</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Dans un triangle isocèle, l'angle au sommet principal mesure 40°. Que valent les deux autres angles ?</div><div class=\"etu\"><b>Étape 1 — Propriété de l'isocèle</b> : les deux angles à la base sont <b>égaux</b>.</div><div class=\"etu\"><b>Étape 2 — Somme des angles</b> : 180° − 40° = 140° pour les deux ensemble.</div><div class=\"etu\"><b>Étape 3 — Partager</b> : 140 ÷ 2 = <b>70° chacun</b>.</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : 40 + 70 + 70 = 180 ✓. La somme 180° est le contrôle qualité de tout calcul d'angles dans un triangle.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre [AB] (segment mesurable) et (AB) (droite infinie) : la notation est un message, pas un détail.</li>\n<li>« Isocèle = équilatéral » : l'isocèle n'exige que 2 côtés égaux.</li>\n<li>« Le losange a 4 angles droits » : non — c'est le rectangle/carré ; le losange a seulement 4 côtés égaux.</li>\n<li>Symétrie axiale mesurée « en biais » : la distance à l'axe se mesure <b>perpendiculairement</b>.</li>\n<li>« Un parallélogramme a des axes de symétrie » : il n'a qu'un centre (l'intersection des diagonales) ; les axes sont pour le rectangle, losange, carré.</li>\n</ul>\n</div>\n<h3>5. Le cercle : centre, rayon, corde, arc</h3>\n<ul>\n<li>Le <b>centre</b> O : le point équidistant de tous les points du cercle ;</li>\n<li>Le <b>rayon</b> r relie le centre à un point du cercle ; le <b>diamètre</b> d = 2r traverse le cercle en passant par le centre ;</li>\n<li>Une <b>corde</b> relie deux points du cercle ; le diamètre est la plus grande des cordes ;</li>\n<li>Un <b>arc de cercle</b> est une portion du cercle entre deux points.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Cercle rayon diametre corde\">\n  <circle cx=\"120\" cy=\"65\" r=\"48\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <circle cx=\"120\" cy=\"65\" r=\"3.5\" fill=\"#ef4444\"/>\n  <text x=\"120\" y=\"55\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">O</text>\n  <line x1=\"120\" y1=\"65\" x2=\"168\" y2=\"65\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <text x=\"150\" y=\"58\" font-size=\"12\" fill=\"#16a34a\">r</text>\n  <line x1=\"72\" y1=\"65\" x2=\"168\" y2=\"65\" stroke=\"#4f46e5\" stroke-width=\"2\" stroke-dasharray=\"5,4\"/>\n  <text x=\"120\" y=\"80\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\">d = 2r</text>\n  <line x1=\"155\" y1=\"99\" x2=\"75\" y2=\"49\" stroke=\"#f59e0b\" stroke-width=\"2\"/><circle cx=\"155\" cy=\"99\" r=\"2.5\" fill=\"#f59e0b\"/><circle cx=\"75\" cy=\"49\" r=\"2.5\" fill=\"#f59e0b\"/>\n  <text x=\"160\" y=\"108\" font-size=\"11\" fill=\"#f59e0b\">corde</text>\n  <text x=\"330\" y=\"50\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">Tous les points du cercle</text>\n  <text x=\"330\" y=\"68\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">sont à la MÊME distance</text>\n  <text x=\"330\" y=\"86\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">du centre : c'est r</text>\n</svg><span class=\"fig-cap\">Le cercle est l'ensemble des points situés à la distance r du centre. C'est cette égalité de distance qui définit le compas.</span></div>\n\n<h3>6. Reproduire et construire : les bons outils</h3>\n<table>\n<tr><th>Outil</th><th>Sert à...</th><th>Objet construit</th></tr>\n<tr><td>règle graduée</td><td>mesurer, tracer des segments</td><td>segment de longueur donnée</td></tr>\n<tr><td>équerre</td><td>vérifier/tracer des angles droits</td><td>perpendiculaires, parallèles</td></tr>\n<tr><td>compas</td><td>reporter des longueurs, tracer des cercles</td><td>cercle, triangle (3 côtés donnés), médiatrice</td></tr>\n<tr><td>rapporteur</td><td>mesurer des angles</td><td>angle de mesure donnée</td></tr>\n</table>\n<div class=\"tip\"><b>Construction au compas</b> d'un triangle de côtés 5 cm, 4 cm, 3 cm : tracer le segment [AB] de 5 cm ; arc de centre A de rayon 4 cm ; arc de centre B de rayon 3 cm ; le point C est l'intersection des deux arcs. La distance entre les arcs se contrôle au final à la règle : construction vérifiée.</div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — reconnaître un quadrilatère mystère</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> ABCD a ses côtés [AB] et [CD] parallèles et égaux. Que peut-on affirmer ? Et si de plus AB = BC ?</div><div class=\"etu\"><b>Étape 1 — Un quadrilatère avec deux côtés opposés parallèles et égaux</b> est un <b>parallélogramme</b> (ses diagonales se couperont en leur milieu).</div><div class=\"etu\"><b>Étape 2 — Condition supplémentaire</b> : AB = BC, c'est-à-dire deux côtés consécutifs égaux.</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : parallélogramme + deux côtés consécutifs égaux = <b>losange</b> (les 4 côtés sont alors égaux).</div><div class=\"etu\"><b>Étape 4 — Et si en plus un angle est droit</b> : losange + angle droit = <b>carré</b>. La hiérarchie se parcourt comme un arbre de décision : chaque propriété ajoutée fait descendre d'un étage vers la figure la plus précise.</div></div></details>\n"
  },

    "id": "cercle",
    "theme": "Le cercle et le disque (6e)",
    "niveau": "6e",
    "titre": "Le cercle et le disque : vocabulaire et construction",
    "cours": "<div class=\"cours-head\"><h2>Le cercle et le disque : vocabulaire et construction</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le vocabulaire du cercle</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 430 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Cercle de centre O avec un rayon, un diametre et une corde annotes, et un point interieur et un point exterieur\">\n  <circle cx=\"180\" cy=\"95\" r=\"70\" fill=\"#4f46e5\" opacity=\"0.08\" stroke=\"#1e293b\" stroke-width=\"2.5\"/>\n  <circle cx=\"180\" cy=\"95\" r=\"2.6\" fill=\"#1e293b\"/>\n  <text x=\"180\" y=\"87\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\" font-weight=\"bold\">O</text>\n  <line x1=\"180\" y1=\"95\" x2=\"250\" y2=\"95\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"208\" y=\"88\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\" font-weight=\"bold\">rayon</text>\n  <line x1=\"110\" y1=\"95\" x2=\"250\" y2=\"95\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <text x=\"180\" y=\"112\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\" font-weight=\"bold\">diamètre</text>\n  <line x1=\"131\" y1=\"58\" x2=\"229\" y2=\"58\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <text x=\"180\" y=\"52\" font-size=\"11\" fill=\"#16a34a\" text-anchor=\"middle\" font-weight=\"bold\">corde</text>\n  <circle cx=\"120\" cy=\"45\" r=\"2.6\" fill=\"#f59e0b\"/>\n  <text x=\"112\" y=\"40\" font-size=\"11\" fill=\"#f59e0b\" font-weight=\"bold\">E</text>\n  <circle cx=\"330\" cy=\"95\" r=\"2.6\" fill=\"#f59e0b\"/>\n  <text x=\"338\" y=\"90\" font-size=\"11\" fill=\"#f59e0b\" font-weight=\"bold\">F</text>\n  <text x=\"330\" y=\"120\" font-size=\"10.5\" fill=\"#334155\" text-anchor=\"middle\">F est extérieur : OF &gt; rayon</text>\n</svg><span class=\"fig-cap\">Un cercle de centre O : rayon (bleu), diamètre (rouge, = 2 rayons), corde (verte), point E intérieur, point F extérieur.</span></div>\n<ul>\n<li>Le <b>cercle</b> de centre O et de rayon r est l'ensemble des points situés à la distance <b>r</b> de O ;</li>\n<li><b>Rayon</b> : segment du centre à un point du cercle ; <b>diamètre</b> : corde passant par le centre, longueur = 2 × rayon ;</li>\n<li><b>Corde</b> : segment reliant deux points du cercle ; le diamètre est la plus grande des cordes ;</li>\n<li>Un point est <b>sur</b> le cercle si sa distance au centre vaut exactement le rayon ;</li>\n<li>Le <b>disque</b> est la surface intérieure (cercle = seulement la ligne).</li>\n</ul>\n\n<h3>2. Construire un cercle au compas</h3>\n<ol>\n<li>Écarter le compas d'une longueur égale au <b>rayon</b> demandé (vérifier sur la règle) ;</li>\n<li>Piquer en O (le centre) sans déplacer la pointe ;</li>\n<li>Tourner le compas en tenant la charnière, d'un mouvement continu ;</li>\n<li>Pour reproduire une distance : « piquer-écarter-reporter » ; c'est le report de longueur.</li>\n</ol>\n\n<h3>3. Périmètre et aire du disque</h3>\n<div class=\"formule\">Périmètre du cercle : P = 2 × π × r = π × D &nbsp;&nbsp;|&nbsp;&nbsp; Aire du disque : A = π × r²</div>\n<ul>\n<li>Exemple : r = 4 cm → P = 2 × π × 4 ≈ 25,1 cm ; A = π × 4² ≈ 50,3 cm² ;</li>\n<li>π ≈ 3,14 (le périmètre vaut un peu plus de 3 diamètres) ;</li>\n<li>Quand on <b>double le rayon</b>, le périmètre double, mais l'aire est <b>multipliée par 4</b>.</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre <b>cercle</b> (la ligne) et <b>disque</b> (la surface) : l'aire du cercle n'existe pas, c'est l'aire du disque.</li>\n<li>Utiliser le rayon dans la formule du diamètre : π × r est le demi-périmètre, pas le périmètre.</li>\n<li>Oublier le carré : π × 4 = 12,6 mais π × 4² ≈ 50,3 : r² ≠ 2r.</li>\n<li>Un point à 5 cm du centre appartient au cercle de rayon 5 cm — mais pas à celui de rayon 4 cm (intérieur) ni 6 cm (extérieur).</li>\n</ul>\n</div>"
  },
