    "cours": "<div class=\"cours-head\"><h2>Continuité et théorème des valeurs intermédiaires</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Continuité : tracer sans lever le crayon</h3>\n<div class=\"tip\"><b>Définition</b> : f est continue en a si lim f en a = f(a) : la valeur annoncée coïncide avec le comportement. Continue sur un intervalle = continue en tout point. Toutes les fonctions de référence (polynômes, exp, ln, racines sur leur domaine, sin, cos) sont continues.</div>\n<ul>\n<li>Contre-exemple phare : la fonction « partie entière » : saute d'un cran à chaque entier : discontinue en chaque entier ;</li>\n<li>1/x : continue sur son domaine ]−∞ ; 0[ ∪ ]0 ; +∞[ : la « rupture » est au bord, pas à l'intérieur ;</li>\n<li>Somme, produit, quotient (dénominateur non nul) et composée de continues = continues : la continuité se transmet par les opérations ;</li>\n<li>Prolongement par continuité : si f a une limite ℓ en a mais n'y est pas définie, on peut « réparer » en posant f(a) = ℓ : le trou disparaît.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Fonction discontinue et correction\">\n  <line x1=\"20\" y1=\"140\" x2=\"410\" y2=\"140\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n  <line x1=\"30\" y1=\"15\" x2=\"30\" y2=\"145\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n  <line x1=\"60\" y1=\"60\" x2=\"205\" y2=\"35\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <circle cx=\"205\" cy=\"35\" r=\"3.5\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <circle cx=\"205\" cy=\"60\" r=\"3.5\" fill=\"#4f46e5\"/>\n  <line x1=\"205\" y1=\"60\" x2=\"330\" y2=\"30\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"215\" y=\"25\" font-size=\"11\" fill=\"#ef4444\">saut : f(205) ≠ limite à gauche</text>\n  <line x1=\"60\" y1=\"115\" x2=\"330\" y2=\"100\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <text x=\"255\" y=\"92\" font-size=\"11\" fill=\"#16a34a\">fonction continue : aucun saut</text>\n</svg><span class=\"fig-cap\">À gauche : discontinuité par saut (le point est ailleurs que la limite) ; à droite : la courbe se traverse sans lever le crayon.</span></div>\n\n<h3>2. Le théorème des valeurs intermédiaires (TVI)</h3>\n<div class=\"tip\"><b>TVI</b> : si f est continue sur [a ; b], alors f parcourt toutes les valeurs entre f(a) et f(b) : pour tout k entre f(a) et f(b), il existe c dans [a ; b] tel que f(c) = k. Continuité + intervalle fermé = aucune valeur n'est « sautée ».</div>\n<ul>\n<li>Cas particulier : si f(a) et f(b) sont de <b>signes opposés</b> (f(a)·f(b) &lt; 0), alors f s'annule au moins une fois : c'est le corollaire des valeurs intermédiaires, LE théorème de résolution d'équations ;</li>\n<li>Attention : le TVI ne dit ni combien de solutions ni où — il affirme l'EXISTENCE ;</li>\n<li>Exemple : x³ + x − 1 : f(0) = −1, f(1) = 1 : au moins une racine entre 0 et 1 (en fait exactement une, car strictement croissante).</li>\n</ul>\n\n<h3>3. Bijection : quand le TVI devient précis</h3>\n<div class=\"tip\"><b>Théorème de la bijection</b> : si f est continue ET strictement monotone sur [a ; b], alors f réalise une bijection : pour tout k entre f(a) et f(b), l'équation f(x) = k a <b>exactement une</b> solution. La stricte monotonie transforme « au moins une » en « exactement une ».</div>\n<ul>\n<li>Démonstration type en 3 lignes : (1) existence par TVI ; (2) unicité par stricte monotonie (supposons deux solutions distinctes : la croissance stricte donne f(x₁) &lt; f(x₂), contradiction avec f(x₁) = f(x₂)) ;</li>\n<li>Application reine : prouver qu'une équation x³ + x = 5 admet une unique solution, puis l'encadrer ;</li>\n<li>La bijection justifie aussi les fonctions réciproques (ln ↔ exp, racine ↔ carré sur les bons domaines).</li>\n</ul>\n\n<h3>4. Encadrement et résolution approchée</h3>\n<ul>\n<li>Méthode de la <b>dichotomie</b> : couper l'intervalle en deux, regarder le signe au milieu, garder la moitié qui contient la racine : précision 10⁻ⁿ garantie en environ n×log₂(10) ≈ 3,3n étapes (dichotomie : 0,5ⁿ) ;</li>\n<li>Exemple : racine de x³ + x − 1 : [0 ; 1] → f(0,5) = −0,375 : [0,5 ; 1] → f(0,75) = 0,172 : [0,5 ; 0,75] → f(0,625) = −0,117 : [0,625 ; 0,75] → ... : la solution ≈ 0,682 ;</li>\n<li>Balayage (pas de 0,1 puis 0,01) : plus simple mais moins performant : on garde l'intervalle où le signe change ;</li>\n<li>C'est exactement ce que fait la calculatrice (solveur) derrière l'écran — le théorème garantit que le résultat affiché a un sens.</li>\n</ul>\n<table>\n<tr><th>Étape</th><th>Intervalle</th><th>Milieu</th><th>Signe de f</th></tr>\n<tr><td>1</td><td>[0 ; 1]</td><td>0,5</td><td>−</td></tr>\n<tr><td>2</td><td>[0,5 ; 1]</td><td>0,75</td><td>+</td></tr>\n<tr><td>3</td><td>[0,5 ; 0,75]</td><td>0,625</td><td>−</td></tr>\n<tr><td>4</td><td>[0,625 ; 0,75]</td><td>0,6875</td><td>+</td></tr>\n<tr><td>5</td><td>[0,625 ; 0,6875]</td><td>0,656</td><td>−</td></tr>\n<tr><td>...</td><td>[0,656 ; 0,6875]</td><td>—</td><td>solution ≈ 0,682</td></tr>\n</table>\n\n<h3>5. Pourquoi la continuité compte partout</h3>\n<ul>\n<li><b>Modélisation</b> : température, tension électrique, altitude : des grandeurs physiques discontinues sont suspectes (sauf chocs et interruptions) ;</li>\n<li><b>Économie</b> : coût total, offre, demande : les modèles continus justifient l'existence d'un prix d'équilibre ;</li>\n<li><b>Informatique</b> : le zéro d'une fonction par dichotomie est l'ancêtre de tous les algorithmes « diviser pour régner » ;</li>\n<li><b>Logique</b> : le TVI échoue dans ℚ : la fonction x ↦ x² − 2 est continue sur [1 ; 2] avec f(1)f(2) &lt; 0, mais √2 n'est pas rationnel : la complétude de ℝ est cachée dans le théorème.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — existence et unicité d'une solution (grand classique)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit f(x) = x³ + 3x − 1. Montrer que l'équation f(x) = 0 admet une unique solution α sur ℝ, puis encadrer α à 10⁻² près.</div><div class=\"etu\"><b>Étape 1 — Monotonie</b> : f′(x) = 3x² + 3 &gt; 0 : f strictement croissante sur ℝ : injectivité garantie.</div><div class=\"etu\"><b>Étape 2 — Signes aux bornes</b> : f(0) = −1 &lt; 0 ; f(1) = 3 &gt; 0 : f continue, TVI : au moins une solution dans ]0 ; 1[.</div><div class=\"etu\"><b>Étape 3 — Unicité</b> : stricte croissance : deux solutions distinctes imposeraient f(x₁) &lt; f(x₂) : absurde avec deux zéros : <b>exactement une</b> solution α ∈ ]0 ; 1[.</div><div class=\"etu\"><b>Étape 4 — Encadrement</b> : f(0,3) = 0,027 + 0,9 − 1 &lt; 0 ; f(0,4) = 0,064 + 1,2 − 1 &gt; 0 : α ∈ ]0,3 ; 0,4[ ; affiner : f(0,32) ≈ −0,003, f(0,33) ≈ 0,03 : <b>0,32 &lt; α &lt; 0,33</b> : rédaction : existence (TVI) + unicité (monotonie) + encadrement (balayage) : la trilogie parfaite du bac.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le TVI sans continuité : un contre-exemple instructif</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> f définie par f(x) = −1 si x &lt; 0 et f(x) = 1 si x ≥ 0. On a f(−1) = −1 et f(1) = 1 : la valeur 0 est-elle atteinte ? Pourquoi le TVI ne s'applique-t-il pas ?</div><div class=\"etu\"><b>Étape 1 — Observation</b> : f passe de −1 à 1 mais ne prend jamais la valeur 0 : le saut en 0 « saute par-dessus » 0.</div><div class=\"etu\"><b>Étape 2 — Diagnostic</b> : f est discontinue en 0 (limite à gauche = −1 ≠ 1 = f(0)) : l'hypothèse « continue sur [−1 ; 1] » n'est pas vérifiée.</div><div class=\"etu\"><b>Étape 3 — Leçon structurelle</b> : le TVI est un théorème d'existence FONDÉ sur la continuité : retirez l'hypothèse et la conclusion tombe — en DS, vérifier les hypothèses AVANT de citer un théorème est exactement ce que le correcteur regarde.</div><div class=\"etu\"><b>Étape 4 — Lien réel</b> : un interrupteur (0 → 1 volt), un seuil de déclenchement, une marche d'escalier : la nature regorge de discontinuités — mais alors, pour garantir un niveau intermédiaire, il faut de la physique (un régime transitoire) qui « continuifie » le saut : le condensateur fait ce travail en électronique.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Citer le TVI sans vérifier la continuité (ni la stricte monotonie pour la bijection).</li>\n<li>Croire que le TVI donne le nombre de solutions : seule la monotonie précise l'unicité.</li>\n<li>Prolongement : oublier de vérifier que la limite existe avant de poser f(a) = ℓ.</li>\n<li>Confondre « f s'annule » (f = 0) et « f change de signe » : le changement de signe est la preuve, l'annulation est la conclusion.</li>\n<li>Dichotomie : conserver le mauvais demi-intervalle (garder celui où le signe ne change PAS).</li>\n</ul>\n</div>\n\n<h3>6. Rédaction type d'une question « existence/unicité »</h3>\n<ul>\n<li><b>Étape 1</b> : vérifier la continuité (somme, produit, composée de fonctions de référence : une phrase suffit) ;</li>\n<li><b>Étape 2</b> : vérifier la stricte monotonie (calculer f′, étudier son SIGNE, conclure « f strictement croissante/décroissante ») ;</li>\n<li><b>Étape 3</b> : évaluer f aux bornes d'un intervalle bien choisi, constater le changement de signe ;</li>\n<li><b>Étape 4</b> : citer le théorème de la bijection SUR CET intervalle, conclure à l'unique solution α, puis encadrer par balayage ou dichotomie ;</li>\n<li>Erreur de rédaction fréquente : dire « f′ &gt; 0 donc f s'annule » : la monotonie seule ne donne PAS l'existence : il faut le changement de signe aux bornes (c'est le TVI qui crée la solution, pas la croissance !).</li>\n</ul>\n<table>\n<tr><th>Théorème</th><th>Hypothèses</th><th>Conclusion</th></tr>\n<tr><td>TVI</td><td>continue sur [a;b]</td><td>toute valeur entre f(a) et f(b) est atteinte</td></tr>\n<tr><td>Corollaire</td><td>continue + f(a)f(b) &lt; 0</td><td>au moins un zéro dans ]a;b[</td></tr>\n<tr><td>Bijection</td><td>continue + strictement monotone</td><td>exactement un antécédent par valeur intermédiaire</td></tr>\n<tr><td>Prolongement</td><td>limite ℓ finie en a</td><td>f prolongeable continûment par f(a) = ℓ</td></tr>\n</table>\n\n<ul><li>Conseil final : à l'examen, le théorème de la bijection vaut souvent un point entier de rédaction — le citer par son nom exact, avec l'intervalle, jamais « d'après le cours ».</li></ul>"
  },
  {
    "id": "integrales",
    "theme": "Intégrales (Terminale)",
    "niveau": "Terminale",
    "titre": "Primitives et calcul intégral",
    "cours": "<div class=\"cours-head\"><h2>Intégrales et primitives</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Primitives : dériver à l'envers</h3>\n<div class=\"tip\"><b>Primitive</b> de f : une fonction F telle que F′ = f. Toute fonction continue sur un intervalle admet des primitives ; deux primitives diffèrent d'une constante : F(x) = G(x) + c. Notation : ∫f(x)dx = F(x) + c (intégrale indéfinie).</div>\n<ul>\n<li>Linéarité : primitive d'une somme = somme des primitives ; primitive de kf = k×primitive de f ;</li>\n<li>Tableau de lecture inversée : xⁿ → xⁿ⁺¹/(n+1) ; 1/x → ln x (x &gt; 0) ; eˣ → eˣ ; cos → sin ; 1/x² → −1/x ;</li>\n<li>u′eᵘ → eᵘ ; u′/u → ln u ; u′uⁿ → uⁿ⁺¹/(n+1) : les trois formes composées du bac ;</li>\n<li>La constante c se détermine par une condition initiale : F(0) = 5 fixe la courbe verticalement.</li>\n</ul>\n<table>\n<tr><th>f(x)</th><th>Primitive F(x)</th><th>Condition</th></tr>\n<tr><td>x³</td><td>x⁴/4 + c</td><td>—</td></tr>\n<tr><td>1/x (x&gt;0)</td><td>ln x + c</td><td>—</td></tr>\n<tr><td>e³ˣ</td><td>e³ˣ/3 + c</td><td>—</td></tr>\n<tr><td>cos(2x)</td><td>sin(2x)/2 + c</td><td>—</td></tr>\n<tr><td>2x·e^(x²)</td><td>e^(x²) + c</td><td>u′eᵘ</td></tr>\n<tr><td>(2x)/(x²+1)</td><td>ln(x²+1) + c</td><td>u′/u</td></tr>\n</table>\n\n<h3>2. Intégrale : l'aire algébrique</h3>\n<div class=\"tip\"><b>Définition</b> : ∫[a;b] f(x)dx = F(b) − F(a) où F est une primitive de f (théorème fondamental). Géométriquement : l'aire entre la courbe et l'axe des abscisses, comptée POSITIVE si f ≥ 0 et NÉGATIVE si f ≤ 0 (aire algébrique).</div>\n<ul>\n<li>Exemple : ∫[0;1] x²dx = [x³/3]₀¹ = 1/3 : l'aire sous la parabole ;</li>\n<li>L'aire géométrique (toujours positive) s'obtient en intégrant |f| : découper selon le signe ;</li>\n<li>Relation de Chasles : ∫[a;b] + ∫[b;c] = ∫[a;c] : on découpe les intervalles ;</li>\n<li>Linéarité : ∫(f + g) = ∫f + ∫g : indispensable pour les sommes.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Aire sous une courbe\">\n  <line x1=\"40\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <path d=\"M 60 128 Q 150 90 235 40 T 380 20\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <path d=\"M 60 128 Q 150 90 235 40 T 380 20 L 380 130 L 60 130 Z\" fill=\"#4f46e5\" fill-opacity=\"0.18\"/>\n  <line x1=\"60\" y1=\"128\" x2=\"60\" y2=\"135\" stroke=\"#1e293b\"/><line x1=\"380\" y1=\"20\" x2=\"380\" y2=\"135\" stroke=\"#1e293b\"/>\n  <text x=\"55\" y=\"146\" font-size=\"11\" fill=\"#1e293b\">a</text><text x=\"375\" y=\"146\" font-size=\"11\" fill=\"#1e293b\">b</text>\n  <text x=\"200\" y=\"105\" font-size=\"12\" fill=\"#1e293b\">∫[a;b] f(x)dx = aire hachurée</text>\n</svg><span class=\"fig-cap\">L'intégrale de a à b est l'aire entre la courbe, l'axe des x et les droites x = a et x = b — algébrique : négative si la courbe plonge sous l'axe.</span></div>\n\n<h3>3. Techniques d'intégration</h3>\n<ul>\n<li><b>IPP</b> (intégration par parties) : ∫u′v = [uv] − ∫uv′ : quand un produit mêle polynôme et exp/trigonométrie : ∫x eˣ = xeˣ − eˣ ;</li>\n<li>De plus en plus fort : ∫x²eˣ : deux IPP successives font « descendre » le degré du polynôme ;</li>\n<li>Formes composées : reconnaître u′eᵘ, u′uⁿ, u′/u sans calcul : le réflexe « qui est la dérivée de qui ? » ;</li>\n<li>Vérification systématique : dériver le résultat — si on ne retrouve pas f, l'intégration est fausse : 10 secondes d'assurance.</li>\n</ul>\n\n<h3>4. Valeur moyenne et valeur efficace</h3>\n<ul>\n<li>Valeur moyenne de f sur [a ; b] : μ = (1/(b−a))∫[a;b] f(x)dx : la hauteur du rectangle équivalent ;</li>\n<li>Inégalité de la moyenne : si m ≤ f ≤ M alors m ≤ μ ≤ M : encadrement sans calculer l'intégrale ;</li>\n<li>Exemple : moyenne de x² sur [0 ; 3] : (1/3)×(27/3) = 3 : alors que (f(0)+f(3))/2 = 4,5 : la moyenne intégrale N'EST PAS la moyenne des extrêmes ;</li>\n<li>Physique : valeur efficace d'un courant alternatif : la racine de la moyenne du carré (RMS) : pourquoi 230 V « efficaces » correspondent à ~325 V de crête.</li>\n</ul>\n\n<h3>5. L'intégrale dans le monde</h3>\n<ul>\n<li><b>Physique</b> : distance = ∫vitesse dt ; travail = ∫force dx ; charge = ∫courant dt : toute grandeur « accumulée » est une intégrale ;</li>\n<li><b>Probabilités</b> : P(a ≤ X ≤ b) = ∫ densité : la loi normale se calcule par intégrales ;</li>\n<li><b>Économie</b> : surplus du consommateur = aire entre courbe de demande et prix : une intégrale ;</li>\n<li><b>Histoire</b> : la méthode d'Archimède (découpage en tranches) pour l'aire du cercle est déjà du calcul intégral, 2000 ans avant Newton et Leibniz.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — aire entre deux courbes</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer l'aire du domaine délimité par y = x² et y = x.</div><div class=\"etu\"><b>Étape 1 — Intersection</b> : x² = x → x(x − 1) = 0 : les courbes se croisent en x = 0 et x = 1 : l'aire est sur [0 ; 1].</div><div class=\"etu\"><b>Étape 2 — Position</b> : sur ]0 ; 1[, x − x² = x(1 − x) &gt; 0 : la droite est AU-DESSUS de la parabole.</div><div class=\"etu\"><b>Étape 3 — Intégrale</b> : A = ∫[0;1](x − x²)dx = [x²/2 − x³/3]₀¹ = 1/2 − 1/3 = <b>1/6</b>.</div><div class=\"etu\"><b>Étape 4 — Réflexe général</b> : toujours (1) chercher les intersections, (2) déterminer qui est au-dessus, (3) intégrer la différence : l'aire entre courbes est TOUJOURS ∫(haut − bas) : jamais intégrer les deux fonctions séparément sans soustraire.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — IPP : bien choisir qui dériver</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Calculer I = ∫[0;1] x eˣ dx, puis J = ∫[0;π] x cos(x) dx.</div><div class=\"etu\"><b>Étape 1 — Choix stratégique</b> : dans I, poser u = x (se dérive vers 1 : se simplifie) et v′ = eˣ (s'intègre sans s'aggraver) : dériver le polynôme, intégrer l'exponentielle.</div><div class=\"etu\"><b>Étape 2 — Application I</b> : ∫u′v... I = [x eˣ]₀¹ − ∫[0;1] eˣdx = e − (e − 1) = <b>1</b>.</div><div class=\"etu\"><b>Étape 3 — Application J</b> : u = x, v′ = cos x : J = [x sin x]₀^π − ∫[0;π] sin x dx = 0 − [−cos x]₀^π = −(−cos π + cos 0) = −(1 + 1) = <b>−2</b> : attention aux signes des crochets !</div><div class=\"etu\"><b>Étape 4 — Règle d'or de l'IPP</b> : dériver ce qui se simplifie (polynôme, ln), intégrer ce qui ne s'aggrave pas (exp, cos, sin) ; si le degré du polynôme dépasse 1, répéter l'IPP jusqu'à épuiser le polynôme : chaque itération « mange » un degré.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Oublier les crochets : ∫[a;b] = F(b) − F(a) : écrire F(b) seul coûte la moitié des points.</li>\n<li>Aire algébrique : intégrer une fonction négative donne un résultat négatif — l'aire, elle, est positive : découper selon le signe.</li>\n<li>Primitive de 1/x : ln|x| (valeur absolue) sur les deux intervalles de définition.</li>\n<li>IPP : choisir u = eˣ et v′ = x : tout s'aggrave, l'intégrale empire : dériver le polynôme !</li>\n<li>Changement de bornes oublié lors d'un changement de variable (hors programme mais utile) : les bornes se transforment aussi.</li>\n</ul>\n</div>\n\n<h3>6. Intégrales et aires : la marche à suivre universelle</h3>\n<ul>\n<li><b>Cas 1</b> : aire entre courbe et axe des x : ∫f si f ≥ 0 ; ∫(−f) si f ≤ 0 ; découper si le signe change ;</li>\n<li><b>Cas 2</b> : aire entre deux courbes : ∫(f − g) où f est la courbe du haut, après avoir trouvé les intersections qui délimitent le domaine ;</li>\n<li><b>Cas 3</b> : aire d'un domaine « mixte » (courbe + droites verticales) : écrire l'intégrale de la différence sur l'intervalle délimité par les droites ;</li>\n<li>Réflexe préalable TOUJOURS : esquisser ou imaginer la figure : choisir la bonne différence AVANT de calculer ; une intégrale sans figure est un calcul à l'aveugle.</li>\n</ul>\n<table>\n<tr><th>Situation</th><th>Intégrale à poser</th><th>Erreur à éviter</th></tr>\n<tr><td>f ≥ 0 sur [a;b]</td><td>∫[a;b] f</td><td>oublier que le résultat est une aire positive</td></tr>\n<tr><td>f ≤ 0 sur [a;b]</td><td>−∫[a;b] f</td><td>rendre une « aire négative »</td></tr>\n<tr><td>f change de signe</td><td>découper puis sommer les |aires|</td><td>intégrer d'un coup (les zones se compensent !)</td></tr>\n<tr><td>deux courbes</td><td>∫(haut − bas)</td><td>intégrer chaque courbe séparément</td></tr>\n</table>\n\n<ul>\n<li><b>Ordre de grandeur de contrôle</b> : l'aire doit être plausible : ∫[0;1] x dx = 0,5 = l'aire du triangle de base 1 et hauteur 1 : quand un résultat dépasse le rectangle circonscrit, chercher l'erreur.</li>\n<li>Unités : en physique, l'intégrale transporte les unités (m/s × s = m : une vitesse intégrée sur du temps donne une distance) : vérifier l'homogénéité est un réflexe d'ingénieur.</li>\n</ul>"

    "id": "logs-exp",
    "theme": "Logarithmes et exponentielles (Terminale)",
    "niveau": "Terminale",
    "titre": "Logarithmes népériens et exponentielles",
    "cours": "<div class=\"cours-head\"><h2>Logarithmes et exponentielles</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La fonction exponentielle : la fonction qui ne bouge pas</h3>\n<div class=\"tip\"><b>Définition</b> : exp est l'unique fonction f telle que f′ = f et f(0) = 1. Notation eˣ avec e ≈ 2,718. Propriété fondamentale : e^(a+b) = eᵃ·eᵇ : transformer une somme en produit — c'est pour ça qu'elle règne sur la croissance.</div>\n<ul>\n<li>e⁰ = 1 ; e¹ = e ; e^(−x) = 1/eˣ : l'exponentielle est toujours strictement positive ;</li>\n<li>Strictement croissante, convexe, eˣ &gt; x pour tout x (l'exponentielle dépasse toujours sa tangente) ;</li>\n<li>Limites : en +∞ → +∞ (et eˣ/x → +∞ : plus vite que toute puissance) ; en −∞ → 0⁺ ;</li>\n<li>Dérivée de e^(u) : u′e^(u) : le réflexe « dérivée de l'exposant × la fonction ».</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Courbes exp et ln symetriques\">\n  <line x1=\"40\" y1=\"80\" x2=\"410\" y2=\"80\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n  <line x1=\"215\" y1=\"10\" x2=\"215\" y2=\"150\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n  <line x1=\"145\" y1=\"10\" x2=\"285\" y2=\"150\" stroke=\"#cbd5e1\" stroke-width=\"1\" stroke-dasharray=\"5,4\"/>\n  <path d=\"M 40 78 Q 150 70 215 55 Q 232 50 250 12\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <path d=\"M 219 150 Q 232 110 240 80 Q 252 52 300 38 Q 340 30 410 26\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <circle cx=\"215\" cy=\"55\" r=\"3.5\" fill=\"#ef4444\"/>\n  <circle cx=\"240\" cy=\"80\" r=\"3.5\" fill=\"#ef4444\"/>\n  <text x=\"228\" y=\"50\" font-size=\"11\" fill=\"#ef4444\">(0 ; 1) sur exp</text>\n  <text x=\"248\" y=\"93\" font-size=\"11\" fill=\"#ef4444\">(1 ; 0) sur ln</text>\n  <text x=\"262\" y=\"22\" font-size=\"12\" fill=\"#4f46e5\">y = eˣ</text>\n  <text x=\"330\" y=\"52\" font-size=\"12\" fill=\"#16a34a\">y = ln x</text>\n  <text x=\"290\" y=\"142\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">symétrie par rapport à la droite y = x</text>\n</svg><span class=\"fig-cap\">exp et ln sont symétriques par rapport à la droite y = x : chacune est la réciproque de l'autre — ln(eˣ) = x et e^(ln x) = x.</span></div>\n\n<h3>2. La fonction logarithme népérien : l'anti-exponentielle</h3>\n<div class=\"tip\"><b>Définition</b> : ln x est l'exposant qu'il faut mettre à e pour obtenir x : ln x = y ⟺ e^y = x. Définie sur ]0 ; +∞[. Propriété fondamentale : ln(ab) = ln a + ln b : transformer un produit en somme — le « couteau suisse » des équations.</div>\n<ul>\n<li>ln 1 = 0 ; ln e = 1 ; ln(1/x) = −ln x ; ln(a/b) = ln a − ln b ;</li>\n<li>ln(√x) = (1/2)ln x ; ln(xⁿ) = n·ln x : les puissances « descendent » en coefficient ;</li>\n<li>Limites : en 0⁺ → −∞ ; en +∞ → +∞ (mais ln x/x → 0 : plus lentement que toute puissance) ;</li>\n<li>Dérivée de ln(u) : u′/u (u &gt; 0) ; dérivée de ln x : 1/x.</li>\n</ul>\n\n<h3>3. Équations et inéquations</h3>\n<ul>\n<li>Règle d'or : <b>toujours regrouper d'un côté, transformer en produit/quotient, PUIS appliquer ln</b> : e^(2x+1) = e^(3x) ⟺ 2x + 1 = 3x ⟺ x = 1 ;</li>\n<li>ln x = a ⟺ x = eᵃ ; eˣ = a (a &gt; 0) ⟺ x = ln a : les deux fonctions se défont mutuellement ;</li>\n<li>Inéquations : exp et ln sont croissantes → l'inégalité se conserve ; ATTENTION au domaine : ln exige x &gt; 0 ;</li>\n<li>ln(x−1) + ln(x+1) = ln(3x−1) : domaine x &gt; 1 ; produit : ln((x−1)(x+1)) = ln(3x−1) ⟺ x² − 1 = 3x − 1 : x = 0 (rejeté) ou x = 3 : toujours vérifier le domaine APRÈS.</li>\n</ul>\n\n<h3>4. Croissances comparées et hiérarchie</h3>\n<table>\n<tr><th>Limite en +∞</th><th>Résultat</th><th>Interprétation</th></tr>\n<tr><td>eˣ/xⁿ</td><td>+∞</td><td>l'exponentielle écrase les puissances</td></tr>\n<tr><td>xⁿ/ln x</td><td>+∞</td><td>les puissances écrasent le log</td></tr>\n<tr><td>x·ln x</td><td>0 en 0⁺</td><td>le log s'efface devant x</td></tr>\n<tr><td>(eˣ − 1)/x</td><td>1 en 0</td><td>nombre dérivé de exp en 0</td></tr>\n</table>\n<ul>\n<li>Hiérarchie des croissances : eˣ ≫ xⁿ ≫ ln x : le classement des vitesses à l'infini ;</li>\n<li>Conséquence pratique : dans une somme à l'infini, le terme le plus « rapide » gouverne la limite : factoriser par lui ;</li>\n<li>Croissance concrète : une population qui double tous les 10 ans : N(t) = N₀·2^(t/10) = N₀·e^(0,069t) : le passage base 2 → base e se fait par ln 2 : le « taux continu ».</li>\n</ul>\n\n<h3>5. Applications partout</h3>\n<ul>\n<li><b>Chimie</b> : pH = −log[H⁺] ; décroissance radioactive : N(t) = N₀e^(−λt) : demi-vie t½ = ln 2/λ ;</li>\n<li><b>Finance</b> : capitalisation continue : e^(rt) ; le rendement « logarithmique » des banquiers ;</li>\n<li><b>Acoustique</b> : décibels = 10·log(I/I₀) : pourquoi l'échelle est logarithmique (de 0 à 120 dB pour un rapport de 10¹² en intensité) ;</li>\n<li><b>Informatique</b> : complexité logarithmique (recherche dichotomique) : doubler la taille du problème ne coûte qu'UN cran de plus : ln est la signature des algorithmes efficaces.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — équation avec paramètre et discussion</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre e^(2x) − (m+1)eˣ + m = 0 selon les valeurs du réel m.</div><div class=\"etu\"><b>Étape 1 — Substitution</b> : poser X = eˣ &gt; 0 : l'équation devient X² − (m+1)X + m = 0 : le second degré entre en jeu.</div><div class=\"etu\"><b>Étape 2 — Factorisation</b> : Δ = (m+1)² − 4m = (m−1)² : racines X = 1 et X = m : toujours réelles.</div><div class=\"etu\"><b>Étape 3 — Retour à x</b> : X = 1 → x = 0 ; X = m → solution seulement si m &gt; 0 : x = ln m.</div><div class=\"etu\"><b>Étape 4 — Discussion</b> : m &lt; 0 : unique solution x = 0 ; m = 0 : X = 0 rejeté et X = 1 : x = 0 (simple) ; m &gt; 0, m ≠ 1 : deux solutions x = 0 et x = ln m ; m = 1 : racine double : x = 0 : le couple (exp − second degré) est un duo incontournable du bac : toujours conditionner le retour à la positivité de X.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — décroissance radioactive et demi-vie</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Le carbone 14 a une demi-vie de 5730 ans. 1) Exprimer N(t)/N₀. 2) Un échantillon contient 12 % du carbone initial : quel âge ? 3) Pourquoi la datation dépasse difficilement 50 000 ans ?</div><div class=\"etu\"><b>Étape 1 — Modèle</b> : N(t) = N₀e^(−λt) avec t½ = ln 2/λ : λ = ln 2/5730 ≈ 1,21×10⁻⁴ an⁻¹ : N(t)/N₀ = e^(−1,21×10⁻⁴ t).</div><div class=\"etu\"><b>Étape 2 — Datation</b> : 0,12 = e^(−1,21×10⁻⁴ t) → t = −ln(0,12)/λ ≈ 2,12/1,21×10⁻⁴ ≈ <b>17 500 ans</b> : passer par ln des deux côtés.</div><div class=\"etu\"><b>Étape 3 — Limite physique</b> : à 50 000 ans, il reste e^(−6) ≈ 0,25 % du carbone : les mesures deviennent noyées dans le bruit de fond.</div><div class=\"etu\"><b>Étape 4 — Morale mathématique</b> : la demi-vie est INVARIANTE (toujours 5730 ans pour diviser par 2) : c'est la signature de l'exponentielle — « diviser par 2 en un temps fixe » se dit « décroître exponentiellement » : les demi-vies successives s'additionnent linéairement pendant que la quantité s'effondre géométriquement.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>ln(a + b) ≠ ln a + ln b : seule la MULTIPLICATION devient une somme.</li>\n<li>Résoudre ln(x−1) = 3 sans exiger x &gt; 1 : le domaine est une partie de la solution.</li>\n<li>e^(2x) = 2eˣ ⟺ 2x = 2x... non : diviser par eˣ : eˣ = 2 : x = ln 2 : ne jamais « simplifier » l'exposant par la base.</li>\n<li>ln x² = 2 ln x seulement si x &gt; 0 : pour x &lt; 0, ln x² = 2 ln(−x) = 2 ln|x|.</li>\n<li>Croissances comparées : croire que ln x rattrape xⁿ à l'infini : jamais.</li>\n</ul>\n</div>\n\n<h3>6. Dérivées et primitives : le formulaire complet</h3>\n<table>\n<tr><th>Fonction</th><th>Dérivée</th><th>Primitive (sur les bons domaines)</th></tr>\n<tr><td>eˣ</td><td>eˣ</td><td>eˣ</td></tr>\n<tr><td>e^(u)</td><td>u′e^(u)</td><td>∫u′e^(u) = e^(u)</td></tr>\n<tr><td>ln x</td><td>1/x</td><td>x ln x − x</td></tr>\n<tr><td>ln(u)</td><td>u′/u</td><td>∫u′/u = ln|u|</td></tr>\n<tr><td>x·eˣ</td><td>(x+1)eˣ</td><td>par IPP : xeˣ − eˣ</td></tr>\n<tr><td>(ln x)/x</td><td>(1 − ln x)/x²</td><td>(ln x)²/2</td></tr>\n</table>\n<ul>\n<li>Trois réflexes : (e^u)′ = u′e^u ; (ln u)′ = u′/u ; primitive de u′e^u = e^u : les candidats au bac sont presque tous des cas particuliers de ces trois lignes ;</li>\n<li>Primitive de ln x : pas dans le tableau direct : par IPP avec u = ln x, v′ = 1 : ∫ln x = x ln x − x : une IPP déguisée ;</li>\n<li>Toujours vérifier en dérivant : deux secondes par ligne, la copie devient inattaquable.</li>\n</ul>\n\n<h3>7. Changement de base et log10 : le pH et les décibels</h3>\n<ul>\n<li>Logarithme décimal : log x = ln x/ln 10 ≈ ln x/2,303 : le « log » des sciences (pH, décibels, magnitude) ;</li>\n<li>Formule de changement de base : log_a(x) = ln x/ln a : toute base se ramène au ln ;</li>\n<li>pH = −log[H⁺] : pH 7 est neutre car [H⁺] = 10⁻⁷ : un cran de pH = un facteur 10 en concentration : les échelles log rendent visibles des mondes invisibles ;</li>\n<li>Règle mnémotechnique : quand le phénomène va « par multiples » (×10 par cran), l'échelle est logarithmique : c'est le détecteur d'un log caché dans un énoncé.</li>\n</ul>"

    "cours": "<div class=\"cours-head\"><h2>Loi binomiale et loi normale</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Loi binomiale : compter les succès</h3>\n<div class=\"tip\"><b>Schéma de Bernoulli</b> : répétition de n épreuves IDENTIQUES et INDÉPENDANTES, succès de probabilité p. X = nombre de succès suit B(n ; p) : P(X = k) = (n k) pᵏ(1−p)^(n−k). Le coefficient binomial compte les ordres possibles.</div>\n<ul>\n<li>Exemple : 8 lancers de pièce, X = nombre de piles : B(8 ; 0,5) : P(X = 3) = C(8;3)×(1/2)³(1/2)⁵ = 56/256 = 0,219 ;</li>\n<li>E(X) = np ; V(X) = np(1−p) : la moyenne et le risque en une ligne chacun ;</li>\n<li>P(X ≥ 1) = 1 − P(X = 0) = 1 − (1−p)ⁿ : l'astuce du « au moins un » (paradoxe des anniversaires : avec n = 23 et p = 1/365... ≈ 50 % !) ;</li>\n<li>Conditions à CITER en DS : répétition ✓, identique ✓, indépendance ✓, deux issues ✓ : quatre cases à cocher.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Distribution binomiale B(20 ; 0,5)\">\n  <line x1=\"30\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n  <g fill=\"#4f46e5\">\n  <rect x=\"40\" y=\"127\" width=\"8\" height=\"3\"/><rect x=\"52\" y=\"125\" width=\"8\" height=\"5\"/><rect x=\"64\" y=\"121\" width=\"8\" height=\"9\"/><rect x=\"76\" y=\"115\" width=\"8\" height=\"15\"/><rect x=\"88\" y=\"107\" width=\"8\" height=\"23\"/><rect x=\"100\" y=\"97\" width=\"8\" height=\"33\"/><rect x=\"112\" y=\"87\" width=\"8\" height=\"43\"/><rect x=\"124\" y=\"76\" width=\"8\" height=\"54\"/><rect x=\"136\" y=\"68\" width=\"8\" height=\"62\"/><rect x=\"148\" y=\"62\" width=\"8\" height=\"68\"/><rect x=\"160\" y=\"60\" width=\"8\" height=\"70\"/><rect x=\"172\" y=\"62\" width=\"8\" height=\"68\"/><rect x=\"184\" y=\"68\" width=\"8\" height=\"62\"/><rect x=\"196\" y=\"76\" width=\"8\" height=\"54\"/><rect x=\"208\" y=\"87\" width=\"8\" height=\"43\"/><rect x=\"220\" y=\"97\" width=\"8\" height=\"33\"/><rect x=\"232\" y=\"107\" width=\"8\" height=\"23\"/><rect x=\"244\" y=\"115\" width=\"8\" height=\"15\"/><rect x=\"256\" y=\"121\" width=\"8\" height=\"9\"/><rect x=\"268\" y=\"125\" width=\"8\" height=\"5\"/><rect x=\"280\" y=\"127\" width=\"8\" height=\"3\"/>\n  </g>\n  <line x1=\"160\" y1=\"20\" x2=\"160\" y2=\"130\" stroke=\"#ef4444\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/>\n  <text x=\"150\" y=\"16\" font-size=\"11\" fill=\"#ef4444\">moyenne np = 10</text>\n  <text x=\"320\" y=\"60\" font-size=\"11\" fill=\"#1e293b\">B(20 ; 0,5) : symétrique,</text>\n  <text x=\"320\" y=\"74\" font-size=\"11\" fill=\"#1e293b\">en cloche autour de np</text>\n</svg><span class=\"fig-cap\">B(20 ; 0,5) : la distribution est en cloche, centrée sur np = 10 : quand n grandit, la cloche s'adoucit et devient... la loi normale.</span></div>\n\n<h3>2. De la binomiale à la normale : la cloche universelle</h3>\n<div class=\"tip\"><b>Théorème de Moivre-Laplace</b> : si n est grand et p pas trop extrême, la binomiale ressemble à la loi normale N(np ; np(1−p)). Le passage à la limite des probabilités discrètes vers le continu : l'histogramme devient une courbe.</div>\n<ul>\n<li>Intervalle de fluctuation (binomiale) : I = [q₁ ; q₉] où q₁, q₉ sont les quantiles d'ordre 0,025 et 0,975 : « 95 % des échantillons tombent dans I » ;</li>\n<li>Prendre la décision : si la fréquence observée sort de I, on rejette l'hypothèse p au seuil de 5 % : le test d'hypothèse ;</li>\n<li>Intervalle de fluctuation asymptotique : [p − 1,96√(p(1−p)/n) ; p + 1,96√(...)] : les sondages (« marge d'erreur ±3 % ») ;</li>\n<li>Intervalle de confiance : fréquence observée f ± 1,96√(f(1−f)/n) : estimer p inconnue à partir d'un échantillon.</li>\n</ul>\n\n<h3>3. La loi normale N(μ ; σ²)</h3>\n<ul>\n<li>Densité « en cloche », symétrique autour de μ (l'espérance) ; σ (écart type) règle l'étalement : 68 % des valeurs dans [μ−σ ; μ+σ], 95 % dans [μ−2σ ; μ+2σ], 99,7 % dans [μ−3σ ; μ+3σ] ;</li>\n<li>Loi normale centrée réduite N(0 ; 1) : la table donne P(Z &lt; t) ; toute N(μ ; σ²) s'y ramène par Z = (X − μ)/σ : standardiser puis lire la table ;</li>\n<li>Exemple : X suit N(10 ; 4) (σ = 2) : P(X &gt; 14) = P(Z &gt; 2) ≈ 0,0228 : au-delà de 2σ, il ne reste que 2,3 % ;</li>\n<li>Utilisation calculatrice : normalFRéP(a, b, μ, σ) : toujours dessiner la cloche et hachurer la zone cherchée AVANT de calculer.</li>\n</ul>\n<table>\n<tr><th>Intervalle</th><th>Probabilité</th><th>Exemple N(10 ; 2)</th></tr>\n<tr><td>[μ−σ ; μ+σ]</td><td>≈ 68 %</td><td>[8 ; 12]</td></tr>\n<tr><td>[μ−2σ ; μ+2σ]</td><td>≈ 95 %</td><td>[6 ; 14]</td></tr>\n<tr><td>[μ−3σ ; μ+3σ]</td><td>≈ 99,7 %</td><td>[4 ; 16]</td></tr>\n<tr><td>au-delà de ±3σ</td><td>≈ 0,3 %</td><td>événement rare</td></tr>\n</table>\n\n<h3>4. Échantillonnage : mesurer le hasard</h3>\n<ul>\n<li>Un sondage : tirer n personnes : la fréquence observée « vacille » autour de p avec un écart-type √(p(1−p)/n) : le fameux 1/√n ;</li>\n<li>Pour diviser la marge d'erreur par 2, il faut QUADRUPLER l'échantillon : d'où le coût des sondages précis ;</li>\n<li>Test : une machine annonce 5 % de pièces défectueuses : sur 400 pièces, 8 % de défauts : sortie de l'intervalle de fluctuation → on met le procédé en cause au seuil de 5 % ;</li>\n<li>Le contrôle qualité industriel (cartes de contrôle, six sigma : ±6σ !) n'est que cet intervalle de fluctuation appliqué en continu.</li>\n</ul>\n\n<h3>5. La normale dans la nature</h3>\n<ul>\n<li><b>Tailles, notes, erreurs de mesure</b> : quand une grandeur est la SOMME de nombreux petits effets indépendants, le théorème central limite impose la cloche — d'où son omniprésence ;</li>\n<li><b>Médecine</b> : constantes biologiques (tension, glycémie) : « normal » = dans μ ± 2σ : la définition statistique de la santé ;</li>\n<li><b>Finance</b> : les rendements quotidiens modélisés par des normales (avec des limites célèbres : les « queues épaisses » des krachs) ;</li>\n<li><b>Psychométrie</b> : le QI est calibré N(100 ; 15) : « 130 » = 2σ : les percentiles du QI sont des aires sous la cloche.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — test d'hypothèse : une élection et un sondage surprenant</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un candidat annonce 52 % d'intentions de vote. Un sondage de 1000 personnes donne 48 %. Peut-on douter de l'annonce (seuil 5 %) ?</div><div class=\"etu\"><b>Étape 1 — Hypothèse</b> : p = 0,52 ; n = 1000 ; fluctuation : σ = √(0,52×0,48/1000) ≈ 0,0158.</div><div class=\"etu\"><b>Étape 2 — Intervalle</b> : 0,52 ± 1,96×0,0158 = [0,489 ; 0,551] : la fréquence observée devrait tomber ici dans 95 % des cas.</div><div class=\"etu\"><b>Étape 3 — Décision</b> : 0,48 &lt; 0,489 : la valeur observée SORT de l'intervalle : au seuil de 5 %, on rejette p = 0,52 : l'annonce est douteuse.</div><div class=\"etu\"><b>Étape 4 — Nuance</b> : rejeter au seuil de 5 % n'est pas « prouver le mensonge » : dans 5 % des cas, un sondage honnête sort aussi de l'intervalle — la statistique quantifie le doute, elle ne l'élimine pas : c'est toute la différence entre une preuve et un faisceau d'indices.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — fabriquer un intervalle de confiance</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Sur 400 pièces, 36 sont défectueuses. 1) Intervalle de confiance à 95 % du taux de défaut ? 2) Le fournisseur promet « moins de 10 % » : que conclure ?</div><div class=\"etu\"><b>Étape 1 — Fréquence</b> : f = 36/400 = 0,09 : 9 % observé.</div><div class=\"etu\"><b>Étape 2 — Formule</b> : IC = f ± 1,96√(f(1−f)/n) = 0,09 ± 1,96×√(0,0819/400) = 0,09 ± 0,028 : [0,062 ; 0,118].</div><div class=\"etu\"><b>Étape 3 — Conclusion</b> : la promesse « moins de 10 % » est COMPATIBLE avec l'intervalle (10 % y est) : on ne peut pas la rejeter, ni la certifier : l'échantillon ne tranche pas.</div><div class=\"etu\"><b>Étape 4 — Taille d'échantillon</b> : pour distinguer 9 % de 10 % il faudrait 1,96√(0,09×0,91)/0,01 ≈ 3137 pièces : la précision coûte cher en échantillon (règle : marge ≈ 1/√n, doubler la précision quadruple le coût) — dire « l'échantillon est insuffisant pour conclure » est une réponse de statisticien, pas un aveu d'échec.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Appliquer la binomiale sans vérifier l'indépendance (tirages SANS remise dans une petite population).</li>\n<li>P(X ≥ 1) recalculé terme à terme au lieu de 1 − (1−p)ⁿ : le « au moins un » se calcule par son complémentaire.</li>\n<li>Confondre σ et σ² : N(μ ; σ²) — la calculatrice attend l'ÉCART TYPE.</li>\n<li>Standardisation oubliée : lire la table N(0;1) avec des valeurs non centrées.</li>\n<li>Croire qu'un test au seuil de 5 % prouve l'hypothèse : il ne la rejette (ou non) — nuance rédactionnelle essentielle.</li>\n</ul>\n</div>\n\n<h3>6. Récapitulatif des situations types</h3>\n<table>\n<tr><th>Question posée</th><th>Outil</th><th>Piège</th></tr>\n<tr><td>P(X = k) exactement</td><td>formule binomiale</td><td>oublier le C(n;k)</td></tr>\n<tr><td>P(a ≤ X ≤ b)</td><td>somme des P(X = k)</td><td>bornes incluses ou non</td></tr>\n<tr><td>au moins un succès</td><td>1 − (1−p)ⁿ</td><td>additionner les probabilités</td></tr>\n<tr><td>fréquence observée anormale ?</td><td>intervalle de fluctuation</td><td>confondre seuil et certitude</td></tr>\n<tr><td>estimer p inconnue</td><td>intervalle de confiance</td><td>conditions n ≥ 30, np ≥ 5</td></tr>\n<tr><td>P(X &lt; a) avec X normale</td><td>standardiser + table/calculatrice</td><td>σ² au lieu de σ</td></tr>\n</table>\n<ul>\n<li>Lecture d'énoncé : « prélever AVEC remise » ou « population très grande » → binomiale ; sans remise et petite population → PAS une binomiale (les probabilités changent) ;</li>\n<li>Les deux intervalles ne sont pas interchangeables : fluctuation = « si p est vrai, où sera la fréquence ? » ; confiance = « j'ai vu f, où est p ? » : deux questions miroir, souvent confondues ;</li>\n<li>Réflexe de rédaction : annoncer l'outil par son nom (« intervalle de fluctuation au seuil de 5 % ») avant le calcul : la méthode vaut plus que le résultat.</li>\n</ul>"

    "titre": "Équations différentielles",
    "cours": "<div class=\"cours-head\"><h2>Équations différentielles</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Qu'est-ce qu'une équation différentielle ?</h3>\n<div class=\"tip\"><b>Définition</b> : une équation où l'inconnue est une FONCTION, liée à ses dérivées. Exemple : y′ = ay + b : « le taux de variation de y est proportionnel à y (plus une constante) ». Résoudre = trouver toutes les fonctions f qui la satisfont.</div>\n<ul>\n<li>Le langage de la NATURE : évolution d'une population, refroidissement d'un café, charge d'un condensateur, désintégration : « comment ça change dépend de là où on en est » ;</li>\n<li>Une équation différentielle a une INFINITÉ de solutions (une par condition initiale) : la condition f(x₀) = y₀ sélectionne LA solution du problème ;</li>\n<li>Courbe des solutions : une famille de courbes « parallèles » ; la condition initiale choisit celle qui passe par le point.</li>\n</ul>\n\n<h3>2. y′ = ay : la référence exponentielle</h3>\n<div class=\"tip\"><b>Solutions de y′ = ay</b> : y = Ce^(ax), C réel. Vérification : y′ = aCe^(ax) = ay ✓. Avec y(x₀) = y₀ : C = y₀e^(−ax₀) : la solution unique est y = y₀e^(a(x−x₀)).</div>\n<ul>\n<li>a &gt; 0 : croissance exponentielle (population sans prédateur, intérêts composés) ;</li>\n<li>a &lt; 0 : décroissance exponentielle (refroidissement : a = −1/τ, radioactivité : a = −λ) ;</li>\n<li>Temps caractéristique : τ = 1/|a| : au bout de τ, il reste e⁻¹ ≈ 37 % de l'écart initial ; au bout de 5τ, moins de 1 % : la règle des « 5τ » des ingénieurs ;</li>\n<li>Demi-vie : t½ = ln 2/|a| : le temps pour diviser l'écart par 2, indépendant du point de départ — la signature de l'exponentielle.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Solutions de y prime egale moins y\">\n  <line x1=\"40\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n  <line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n  <path d=\"M 40 25 Q 140 35 240 95 T 410 128\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <path d=\"M 40 60 Q 160 68 280 108 T 410 128\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <path d=\"M 40 100 Q 180 104 320 124 T 410 128\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2.5\"/>\n  <circle cx=\"40\" cy=\"25\" r=\"3\" fill=\"#4f46e5\"/><circle cx=\"40\" cy=\"60\" r=\"3\" fill=\"#16a34a\"/><circle cx=\"40\" cy=\"100\" r=\"3\" fill=\"#f59e0b\"/>\n  <text x=\"300\" y=\"60\" font-size=\"11\" fill=\"#1e293b\">y′ = −y : toutes les solutions</text>\n  <text x=\"300\" y=\"74\" font-size=\"11\" fill=\"#1e293b\">tendent vers l'équilibre 0</text>\n</svg><span class=\"fig-cap\">Trois solutions de y′ = −y pour trois conditions initiales : toutes convergent vers 0 — le même comportement, des amplitudes différentes.</span></div>\n\n<h3>3. y′ = ay + b : ajouter l'équilibre</h3>\n<div class=\"tip\"><b>Solutions de y′ = ay + b (a ≠ 0)</b> : y = Ce^(ax) − b/a. La valeur −b/a est la solution constante (l'équilibre) : toutes les autres solutions convergent vers elle (a &lt; 0) ou s'en écartent (a &gt; 0).</div>\n<ul>\n<li>Exemple : y′ = −2y + 6 : équilibre y = 3 : solutions y = 3 + Ce^(−2x) : toutes les solutions convergent vers 3 ;</li>\n<li>Si y(0) = 3 (l'équilibre) : la solution est CONSTANTE : partir de l'équilibre, c'est d'y rester ;</li>\n<li>Méthode alternative élégante : poser z = y + b/a : z′ = az : retomber sur la référence — « décaler l'origine » ;</li>\n<li>Vérification systématique : dériver la solution proposée et comparer à ay + b : dix secondes qui sécurisent la copie.</li>\n</ul>\n\n<h3>4. Modèles à traverser le monde réel</h3>\n<table>\n<tr><th>Phénomène</th><th>Équation</th><th>Solution</th><th>Usage</th></tr>\n<tr><td>refroidissement</td><td>T′ = −k(T − T_amb)</td><td>T = T_amb + Ce^(−kt)</td><td>heure d'un décès (médecine légale)</td></tr>\n<tr><td>radioactivité</td><td>N′ = −λN</td><td>N = N₀e^(−λt)</td><td>datation</td></tr>\n<tr><td>charge RC</td><td>q′ = −q/(RC) + E/(RC)</td><td>q = E(1 − e^(−t/RC))</td><td>électronique</td></tr>\n<tr><td>croissance</td><td>N′ = rN</td><td>N = N₀e^(rt)</td><td>biologie, finance</td></tr>\n<tr><td>chute avec frottement</td><td>v′ = g − kv/m</td><td>v = v_lim(1 − e^(−kt))</td><td>vitesse terminale</td></tr>\n</table>\n<ul>\n<li>Refroidissement de Newton : un café à 90 °C dans une pièce à 20 °C : T(t) = 20 + 70e^(−kt) : l'écart à l'ambiance décroît exponentiellement ;</li>\n<li>Chute avec frottement : la vitesse tend vers une vitesse limite sans jamais la dépasser : pourquoi un parachutiste cesse d'accélérer ;</li>\n<li>Charge d'un condensateur : 63 % de la charge à t = RC, ~99 % à 5RC : la constante RC règle le rythme de tout circuit.</li>\n</ul>\n\n<h3>5. Au-delà du programme : un aperçu</h3>\n<ul>\n<li>y″ + ω²y = 0 : les solutions sont sin(ωx) et cos(ωx) : le ressort, le pendule : l'oscillation naît de la dérivée SECONDE ;</li>\n<li>Équations non linéaires (logistique : y′ = ry(1 − y/K)) : croissance plafonnée : la courbe en S des ventes d'un produit et des épidémies ;</li>\n<li>Quand il n'y a pas de solution formelle : les méthodes numériques (Euler : y_(n+1) = y_n + h·f(y_n)) marchent toujours : le simulateur de vol et la météo tournent sur Euler et ses cousins ;</li>\n<li>L'équation de la chaleur, de Schrödinger, de Navier-Stokes : le XXᵉ siècle physique s'écrit en équations différentielles — vous manipulez déjà leurs briques élémentaires.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — médecine légale : l'heure du décès</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un corps est découvert à 22 h avec une température de 27 °C ; la pièce est à 20 °C. On sait T′ = −k(T − 20), k = 0,06 (par heure), température initiale 37 °C. À quelle heure le décès a-t-il eu lieu ?</div><div class=\"etu\"><b>Étape 1 — Solution générale</b> : T(t) = 20 + Ce^(−0,06t) avec T(0) = 37 : C = 17 : T(t) = 20 + 17e^(−0,06t).</div><div class=\"etu\"><b>Étape 2 — Équation</b> : 27 = 20 + 17e^(−0,06t) → e^(−0,06t) = 7/17 → t = ln(17/7)/0,06.</div><div class=\"etu\"><b>Étape 3 — Calcul</b> : ln(17/7) ≈ 0,888 : t ≈ <b>14,8 h</b> : environ 14 h 48 avant 22 h : décès vers <b>7 h 12</b>.</div><div class=\"etu\"><b>Étape 4 — Esprit critique</b> : le modèle suppose k constant (température ambiante stable, corps non couvert...) : la police présente toujours une fourchette, jamais un chiffre sec — le modèle mathématique est une lampe, pas un verdict : c'est la bonne posture face à tout modèle.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — charge d'un condensateur et vitesse terminale</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un parachutiste : v′ = 10 − 0,2v (unités SI). 1) Vitesse limite ? 2) Solution avec v(0) = 0 ? 3) Temps pour atteindre 95 % de la limite ?</div><div class=\"etu\"><b>Étape 1 — Équilibre</b> : v′ = 0 → v_lim = 10/0,2 = <b>50 m/s</b> (180 km/h, position aiguille du funambule).</div><div class=\"etu\"><b>Étape 2 — Solution</b> : v(t) = 50(1 − e^(−0,2t)) : l'écart à la limite décroît de moitié toutes les ln 2/0,2 ≈ 3,5 s.</div><div class=\"etu\"><b>Étape 3 — Question 3</b> : 0,95 = 1 − e^(−0,2t) → e^(−0,2t) = 0,05 → t = ln 20/0,2 ≈ <b>15 s</b> : trois « demi-vies » de l'écart.</div><div class=\"etu\"><b>Étape 4 — Structure universelle</b> : « écart à l'équilibre × exponentielle » est LA solution de tous les modèles linéaires du programme (condensateur, thermomètre, parachutiste) : reconnaître la structure (constante + Ce^(at)) permet de répondre à trois exercices avec UNE méthode : le même squelette, trois habillages.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Oublier la constante C : sans condition initiale, la solution est une FAMILLE, pas une fonction.</li>\n<li>y′ = ay + b : proposer y = Ce^(ax) : il manque le −b/a (la solution particulière constante).</li>\n<li>Confondre équilibre (−b/a) et valeur initiale (y₀) : l'équilibre attire, l'initiale lance.</li>\n<li>Refroidissement : intégrer T au lieu de l'ÉCART (T − T_amb).</li>\n<li>Vérification zappée : toujours redériver la solution et la réinjecter dans l'équation.</li>\n</ul>\n</div>\n\n<h3>6. Méthode de résolution pas à pas</h3>\n<ul>\n<li><b>Étape 1</b> : identifier la forme : y′ = ay (type 1) ou y′ = ay + b (type 2) — écrire a et b explicitement ;</li>\n<li><b>Étape 2</b> : écrire la solution générale : y = Ce^(ax) ou y = Ce^(ax) − b/a ;</li>\n<li><b>Étape 3</b> : injecter la condition initiale pour déterminer C (une équation en C) ;</li>\n<li><b>Étape 4</b> : conclure avec la solution particulière ET vérifier en redérivant : la vérification est la moitié du contrat.</li>\n</ul>\n<table>\n<tr><th>Équation</th><th>Solution générale</th><th>Avec y(0) = y₀</th></tr>\n<tr><td>y′ = 3y</td><td>Ce^(3x)</td><td>y₀e^(3x)</td></tr>\n<tr><td>y′ = −0,5y</td><td>Ce^(−0,5x)</td><td>y₀e^(−0,5x)</td></tr>\n<tr><td>y′ = y + 2</td><td>Ce^x − 2</td><td>(y₀+2)e^x − 2</td></tr>\n<tr><td>y′ = −2y + 6</td><td>Ce^(−2x) + 3</td><td>(y₀−3)e^(−2x) + 3</td></tr>\n</table>\n<ul>\n<li>Lecture asymptotique : a &lt; 0 → y → −b/a (équilibre) ; a &gt; 0 → explosion (ou extinction si C = 0) : le signe de a décide de tout ;</li>\n<li>Cohérence physique : vérifier que la limite a du sens (le café tend vers la température ambiante, pas vers 500 °C) : un modèle qui contredit le bon sens cache une erreur de signe.</li>\n</ul>"

    "id": "arithmetique-matrices",

    "titre": "Arithmétique et matrices (maths expertes)",
    "cours": "<div class=\"cours-head\"><h2>Arithmétique et matrices</h2><span class=\"niv\">Terminale</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Divisibilité et division euclidienne</h3>\n<div class=\"tip\"><b>Division euclidienne</b> : pour tous a, b (b ≠ 0), il existe UNIQUES q et r : a = bq + r avec 0 ≤ r &lt; |b|. Le reste r classe les entiers en « familles » (congruences) : c'est le socle de toute l'arithmétique.</div>\n<ul>\n<li>a divise b (noté a | b) si b = aq pour un entier q : 7 | 91 car 91 = 7×13 ;</li>\n<li>Propriétés : a | a ; transitivité : si a | b et b | c alors a | c ; si a | b et a | c alors a | (b+c) et a | (bu+cv) (combinaison linéaire) ;</li>\n<li>Critères de divisibilité : par 3 (somme des chiffres), par 9 (idem), par 4 (deux derniers chiffres), par 11 (alternance) : tous démontrables par congruences ;</li>\n<li>Exemple type : montrer que n(n+1) est toujours pair : deux entiers consécutifs, l'un est pair ; n(n+1)(n+2) est divisible par 6 : par 2 (idem) et par 3 (trois consécutifs contiennent un multiple de 3).</li>\n</ul>\n\n<h3>2. PGCD et théorème de Bézout</h3>\n<div class=\"tip\"><b>Algorithme d'Euclide</b> : pgcd(a, b) = pgcd(b, r) où r est le reste de a par b : on itère jusqu'au reste nul. <b>Bézout</b> : a et b premiers entre eux ⟺ il existe u, v tels que au + bv = 1. <b>Gauss</b> : si a | bc et a premier avec b, alors a | c.</div>\n<ul>\n<li>Exemple : pgcd(357 ; 187) : 357 = 1×187 + 170 ; 187 = 1×170 + 17 ; 170 = 10×17 + 0 : pgcd = 17 ;</li>\n<li>Bézout pratique : remonter l'algorithme : 17 = 187 − 170 = 187 − (357 − 187) = 2×187 − 357 : en divisant par 17 : −21 + 2×11 = 1 : Bézout pour 21 et 11 (premiers entre eux) : u = −1, v = 2 ✓ ;</li>\n<li>Équation diophantienne ax + by = c : soluble ⟺ pgcd(a,b) | c : solutions trouvées par Bézout puis « famille » x = x₀ + kb/d ;</li>\n<li>Petit théorème de Fermat : si p premier et p ∤ a, alors a^(p−1) ≡ 1 (mod p) : la tour de contrôle de la cryptographie.</li>\n</ul>\n<table>\n<tr><th>Étape</th><th>Division</th><th>Reste</th></tr>\n<tr><td>1</td><td>357 = 1×187 + 170</td><td>170</td></tr>\n<tr><td>2</td><td>187 = 1×170 + 17</td><td>17</td></tr>\n<tr><td>3</td><td>170 = 10×17 + 0</td><td>0 : pgcd = 17</td></tr>\n</table>\n\n<h3>3. Congruences : l'horloge des entiers</h3>\n<div class=\"tip\"><b>a ≡ b (mod n)</b> ⟺ n | (a − b) ⟺ a et b ont le même reste dans la division par n. On peut additionner, soustraire, multiplier des congruences comme des égalités — et élever à des puissances.</div>\n<ul>\n<li>Exemple : 2023 ≡ 3 (mod 10) : le chiffre des unités de 2023⁷ est celui de 3⁷ = 2187 : <b>7</b> ;</li>\n<li>Chiffres de fin : pour les unités, tout est mod 10 ; pour « divisible par 3 », tout est mod 3 : la congruence fait circuler les grands nombres dans de petits anneaux ;</li>\n<li>Fermat en action : 2¹⁰⁰ mod 11 : 2¹⁰ ≡ 1 (Fermat, p = 11) : 2¹⁰⁰ = (2¹⁰)¹⁰ ≡ 1 : résultat sans calculer les 2¹⁰⁰ ;</li>\n<li>Réflexe d'énoncé : « montrer que n³ − n est divisible par 6 » : n³ − n = (n−1)n(n+1) : trois entiers consécutifs : un multiple de 2 et un multiple de 3 obligatoires : 6 divise le produit : une preuve par congruence ou par factorisation, jamais en testant des valeurs.</li>\n</ul>\n\n<h3>4. Les nombres premiers : les atomes</h3>\n<ul>\n<li>Premier : exactement deux diviseurs (1 et lui-même) ; 1 n'est PAS premier ; 2 est le seul pair premier ;</li>\n<li>Crible d'Ératosthène : barrer les multiples : les survivants sont premiers ;</li>\n<li>Décomposition en facteurs premiers : UNIQUE (théorème fondamental) : 2024 = 2³×11×23 : tout entier est un produit d'atomes ;</li>\n<li>Infinité des premiers : preuve d'Euclide : supposer la liste finie p₁...pₙ : N = p₁×...×pₙ + 1 a un diviseur premier qui n'est pas dans la liste : contradiction — l'une des plus belles preuves de l'histoire ;</li>\n<li>Cryptographie RSA : la sécurité repose sur « multiplier est facile, factoriser est impossible en pratique » : la clé publique de votre navigateur est un produit de deux énormes premiers.</li>\n</ul>\n\n<h3>5. Matrices : des tableaux qui se calculent</h3>\n<div class=\"tip\"><b>Matrice</b> : tableau n×p de nombres. Somme : terme à terme (même format). <b>Produit</b> : ligne × colonne — A (n×m) × B (m×p) = C (n×p) : C_ij = Σ A_ik B_kj. ATTENTION : le produit n'est PAS commutatif et AB = 0 n'implique pas A = 0 ou B = 0.</div>\n<ul>\n<li>Exemple : [[1;2];[3;4]] × [[0;1];[1;0]] = [[2;1];[4;3]] : multiplier par [[0;1];[1;0]] échange les colonnes : les matrices encodent des TRANSFORMATIONS ;</li>\n<li>Identité I : A×I = I×A = A : le « 1 » des matrices ;</li>\n<li>Puissances : A² = A×A, A³ = A²×A... : exponentiation rapide : A⁸ = (A⁴)² : le secret des calculs massifs ;</li>\n<li>Inverse : A×B = I ⟹ B = A⁻¹ (carrée, déterminant non nul) : résoudre AX = Y par X = A⁻¹Y.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Produit matriciel ligne fois colonne\">\n  <rect x=\"30\" y=\"30\" width=\"150\" height=\"80\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <rect x=\"30\" y=\"30\" width=\"150\" height=\"40\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"105\" y=\"75\" font-size=\"11\" fill=\"#1e293b\" text-anchor=\"middle\">ligne i de A (1×m)</text>\n  <rect x=\"240\" y=\"30\" width=\"140\" height=\"80\" fill=\"#f0fdf4\" stroke=\"#16a34a\"/>\n  <rect x=\"310\" y=\"30\" width=\"70\" height=\"80\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <text x=\"310\" y=\"118\" font-size=\"11\" fill=\"#1e293b\" text-anchor=\"middle\">colonne j de B (m×1)</text>\n  <text x=\"225\" y=\"72\" font-size=\"16\" fill=\"#1e293b\">×</text>\n  <text x=\"400\" y=\"75\" font-size=\"14\" fill=\"#ef4444\">= C_ij</text>\n  <text x=\"105\" y=\"132\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">on multiplie deux à deux et on somme : C_ij = Σ A_ik·B_kj</text>\n</svg><span class=\"fig-cap\">Règle du produit : l'élément (i, j) du résultat est le produit scalaire de la ligne i de A par la colonne j de B : formats (n×m)(m×p) → n×p.</span></div>\n\n<h3>6. Matrices et suites : le pouvoir itératif</h3>\n<ul>\n<li>Suite récurrente (u_(n+1) = a·u_n + b) : poser U_n = (u_n ; 1) : U_(n+1) = M·U_n avec M = [[a;b];[0;1]] : U_n = Mⁿ·U₀ : linéariser une récurrence ;</li>\n<li>Mⁿ se calcule par diagonalisation (spécialité maths) ou par exponentiation rapide : 20 multiplications au lieu de 1000 : Fibonacci en O(log n) ;</li>\n<li>Chaînes de Markov (probabilités) : répartitions successives = Mⁿ × vecteur initial : PageRank de Google est une chaîne de Markov géante ;</li>\n<li>Graphes : matrice d'adjacence : le nombre de chemins de longueur k de i à j est l'élément (i,j) de Aᵏ : compter les chemins devient une multiplication.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — équation diophantienne : le problème des poules</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Des poules coûtent 3 €, des lapins 5 €. On dépense exactement 46 € en achetant x poules et y lapins (x, y ≥ 1). Résoudre 3x + 5y = 46 dans ℕ.</div><div class=\"etu\"><b>Étape 1 — Solubilité</b> : pgcd(3 ; 5) = 1 divise 46 : des solutions existent (Bézout).</div><div class=\"etu\"><b>Étape 2 — Solution particulière</b> : 46 = 3×2 + 5×8 : x₀ = 2, y₀ = 8 convient (remarquer 46 − 5×8 = 6 = 3×2).</div><div class=\"etu\"><b>Étape 3 — Famille générale</b> : 3x + 5y = 3x₀ + 5y₀ ⟺ 3(x−x₀) = 5(y₀−y) : 5 | 3(x−x₀) et 5 premier avec 3 (Gauss) : 5 | x−x₀ : x = 2 + 5k, y = 8 − 3k.</div><div class=\"etu\"><b>Étape 4 — Solutions entières positives</b> : x ≥ 1 → k ≥ 0 (k=0 : x=2) ; y ≥ 1 → k ≤ 2 : <b>k = 0, 1, 2</b> : (2 ; 8), (7 ; 5), (12 ; 2) : trois achats possibles — la structure « une solution + balayage du paramètre » résout TOUTE équation diophantienne.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — Fibonacci par matrices</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> F₀ = 0, F₁ = 1, F_(n+2) = F_(n+1) + F_n. 1) Montrer que (F_(n+1) ; F_n) = Mⁿ(1 ; 0) avec M = [[1;1];[1;0]]. 2) En déduire l'identité de Cassini F_(n+1)F_(n−1) − F_n² = (−1)ⁿ.</div><div class=\"etu\"><b>Étape 1 — Vérification</b> : M(1 ; 0) = (1 ; 1) = (F₂ ; F₁) ✓ ; par ailleurs M(F_(n+1) ; F_n) = (F_(n+1) + F_n ; F_(n+1)) = (F_(n+2) ; F_(n+1)) ✓ : la récurrence EST la matrice.</div><div class=\"etu\"><b>Étape 2 — Déterminant</b> : det M = −1 : det(Mⁿ) = (det M)ⁿ = (−1)ⁿ (formule det(AB) = det A × det B).</div><div class=\"etu\"><b>Étape 3 — Cassini</b> : Mⁿ = [[F_(n+1) ; F_n];[F_n ; F_(n−1)]] : son déterminant est F_(n+1)F_(n−1) − F_n² : égal à (−1)ⁿ : l'identité tombe toute seule.</div><div class=\"etu\"><b>Étape 4 — Leçon</b> : une identité combinatoire profonde (valable pour tout n) obtenue par un simple det(Mⁿ) : les matrices condensent les récurrences en objets algébriques — c'est aussi ainsi qu'on calcule F₁₀⁰⁰⁰ en quelques multiplications au lieu de mille.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Croire que 1 est premier (il n'a qu'UN diviseur) ou qu'il existe un plus grand premier (Euclide : non).</li>\n<li>Reste de la division euclidienne : r doit vérifier 0 ≤ r &lt; b : un reste négatif ou ≥ b est une erreur de rédaction.</li>\n<li>Congruences : on peut additionner et multiplier, mais PAS diviser (sauf si le facteur est premier avec n : Gauss).</li>\n<li>Produit matriciel : AB ≠ BA en général ; vérifier les formats avant de multiplier ((n×m)×(m×p)).</li>\n<li>AB = 0 avec A ≠ 0 et B ≠ 0 est possible : ne pas « simplifier » par une matrice non inversible.</li>\n</ul>\n</div>\n\n<h3>7. Le petit théorème de Fermat en exercice : chiffres et cryptographie</h3>\n<ul>\n<li>Unités de 7²⁰²³ : mod 10 : 7⁴ ≡ 1 (car 7⁴ = 2401) : 2023 = 4×505 + 3 : 7²⁰²³ ≡ 7³ = 343 : unités <b>3</b> : toujours réduire l'exposant modulo le cycle ;</li>\n<li>Le « cycle » de a mod n divise n−1 si n premier (Fermat) : chercher l'ordre, diviser l'exposant, conclure : la méthode universelle des « grands restes » ;</li>\n<li>RSA (idée) : chiffrer par m^(e) mod n : le déchiffrement exige d tel que ed ≡ 1 (mod (p−1)(q−1)) : Bézout sur des nombres à 600 chiffres : votre connexion https vit sur ce théorème de Terminale ;</li>\n<li>Test de primalité : si a^(p−1) ≢ 1 (mod p), alors p n'est PAS premier : un témoin suffit pour rejeter — c'est le test utilisé en pratique.</li>\n</ul>\n<table>\n<tr><th>Outil</th><th>Quand l'utiliser</th><th>Mot-clé de l'énoncé</th></tr>\n<tr><td>Division euclidienne</td><td>poser un reste</td><td>« en écrivant a = bq + r »</td></tr>\n<tr><td>Euclide</td><td>calculer un pgcd</td><td>« montrer que a et b sont premiers entre eux »</td></tr>\n<tr><td>Bézout</td><td>coefficients / diophantienne</td><td>« déterminer u, v tels que au+bv = ... »</td></tr>\n<tr><td>Gauss</td><td>divisibilité composée</td><td>« a divise bc et a premier avec b »</td></tr>\n<tr><td>Fermat</td><td>grandes puissances</td><td>« reste de la division de ... par p premier »</td></tr>\n</table>"
  },

    "titre": "Périmètres et aires",
    "cours": "<div class=\"cours-head\"><h2>Périmètres et aires</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Deux grandeurs différentes : le tour et la surface</h3>\n<ul>\n<li>Le <b>périmètre</b> est la longueur du <b>contour</b> : c'est la longueur d'une clôture, d'un ruban autour de la figure — unité : le mètre (m) ;</li>\n<li>L'<b>aire</b> mesure la <b>surface occupée</b> : c'est la quantité de gazon, de peinture, de carrelage — unité : le mètre carré (m²) ;</li>\n<li>Les deux sont indépendantes : deux figures de même périmètre peuvent avoir des aires très différentes.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Meme perimetre aires differentes\">\n  <rect x=\"40\" y=\"30\" width=\"180\" height=\"16\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"130\" y=\"60\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\">P = 2×(180+16) = 392 (en px)</text>\n  <text x=\"130\" y=\"78\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">figure très « étirée »</text>\n  <rect x=\"270\" y=\"25\" width=\"116\" height=\"80\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <text x=\"328\" y=\"120\" font-size=\"11\" fill=\"#16a34a\" text-anchor=\"middle\">forme presque carrée</text>\n  <text x=\"215\" y=\"135\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\" font-weight=\"bold\">À périmètre égal, c'est la forme « ramassée » qui a la plus grande aire</text>\n</svg><span class=\"fig-cap\">À périmètre donné, plus la figure est « ramassée » (proche du carré ou du cercle), plus son aire est grande. Le cercle est le champion toutes catégories.</span></div>\n\n<h3>2. Les formules à connaître par cœur</h3>\n<table>\n<tr><th>Figure</th><th>Périmètre</th><th>Aire</th><th>À retenir</th></tr>\n<tr><td>carré de côté c</td><td>4×c</td><td>c×c = c²</td><td>le « 4 » du tour, le « carré » de l'aire</td></tr>\n<tr><td>rectangle L × ℓ</td><td>2×(L + ℓ)</td><td>L × ℓ</td><td>additionner pour le tour, multiplier pour l'aire</td></tr>\n<tr><td>triangle base b, hauteur h</td><td>côte + côté + côté</td><td>(b × h) ÷ 2</td><td>le ÷2 vient du triangle « coupé » dans un rectangle</td></tr>\n<tr><td>cercle de rayon r</td><td>2 × π × r</td><td>π × r²</td><td>π ≈ 3,14 ; diamètre d = 2r</td></tr>\n<tr><td>disque</td><td>le tour est le cercle</td><td>π × r²</td><td>le disque est la surface, le cercle est la ligne</td></tr>\n</table>\n<div class=\"tip\"><b>Triangle</b> : la hauteur est <b>perpendiculaire</b> à la base — ce n'est pas forcément un côté du triangle ! Aire = (base × hauteur)/2, et ça marche avec n'importe quel côté choisi comme base.</div>\n\n<h3>3. Les unités et leurs conversions</h3>\n<ul>\n<li>Longueurs : 1 m = 100 cm ; 1 km = 1000 m ; 1 dm = 10 cm ;</li>\n<li><b>Aires</b> : chaque saut de ligne multiplie par 100 (pas 10 !) : 1 m² = 100 dm² = 10 000 cm² ;</li>\n<li>Unité agricole : 1 ha (hectare) = 1 hm² = 10 000 m² (un hectare ≈ un terrain de football) ;</li>\n<li>Capacités (lien avec les volumes, 5e) : 1 L = 1 dm³.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 110\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Escalier des unites d aire\">\n  <rect x=\"30\" y=\"40\" width=\"80\" height=\"50\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <text x=\"70\" y=\"70\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">km²</text>\n  <rect x=\"130\" y=\"40\" width=\"80\" height=\"50\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <text x=\"170\" y=\"70\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">hm² = ha</text>\n  <rect x=\"230\" y=\"40\" width=\"80\" height=\"50\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <text x=\"270\" y=\"70\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">dam²</text>\n  <rect x=\"330\" y=\"40\" width=\"80\" height=\"50\" fill=\"#eef2ff\" stroke=\"#4f46e5\"/>\n  <text x=\"370\" y=\"70\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">m²</text>\n  <path d=\"M 110 40 Q 120 25 130 40\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"22\" font-size=\"10\" fill=\"#ef4444\" text-anchor=\"middle\">×100</text>\n  <path d=\"M 210 40 Q 220 25 230 40\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n  <text x=\"220\" y=\"22\" font-size=\"10\" fill=\"#ef4444\" text-anchor=\"middle\">×100</text>\n  <path d=\"M 310 40 Q 320 25 330 40\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n  <text x=\"320\" y=\"22\" font-size=\"10\" fill=\"#ef4444\" text-anchor=\"middle\">×100</text>\n</svg><span class=\"fig-cap\">Les unités d'aire vont de 100 en 100 : 1 dam² = 100 m², donc 1 m² = 10 000 cm². Le « 2 » de l'exposant se retrouve dans le ×100.</span></div>\n\n<h3>4. Figures composées : la stratégie du découpage</h3>\n<ol>\n<li>Repérer les figures simples cachées (rectangles, triangles, disques) ;</li>\n<li>Découper mentalement, calculer chaque morceau ;</li>\n<li><b>additionner</b> les aires côte à côte, <b>soustraire</b> les « trous » (piscine dans un jardin, fenêtre dans un mur) ;</li>\n<li>Vérifier que toutes les mesures sont dans la <b>même unité</b> avant de calculer.</li>\n</ol>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — clôturer et gazonner le jardin</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Jardin rectangulaire 12 m × 7 m avec une piscine circulaire (rayon 2 m) en son milieu. Grillage à 15 €/m, gazon à 5 €/m². Budget total ?</div><div class=\"etu\"><b>Étape 1 — Clôture = périmètre</b> : P = 2×(12 + 7) = 38 m → 38 × 15 = <b>570 €</b>. (La piscine n'intervient pas : la clôture suit le contour extérieur.)</div><div class=\"etu\"><b>Étape 2 — Gazon = aire avec un trou</b> : aire du jardin : 12 × 7 = 84 m² ; aire de la piscine : π × 2² ≈ 12,6 m² ; gazonné : 84 − 12,6 ≈ 71,4 m².</div><div class=\"etu\"><b>Étape 3 — Coût du gazon</b> : 71,4 × 5 = <b>357 €</b>.</div><div class=\"etu\"><b>Étape 4 — Total</b> : 570 + 357 = <b>927 €</b>. Réflexe : clôturer → périmètre ; couvrir → aire ; trou → soustraction. Trois mots-clés qui guident tout l'exercice.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'agrandissement qui surprend</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On double les dimensions d'une photo carrée de 10 cm de côté. Le périmètre double-t-il ? L'aire aussi ?</div><div class=\"etu\"><b>Étape 1 — Périmètre initial</b> : 4 × 10 = 40 cm ; nouveau : 4 × 20 = 80 cm : le périmètre <b>double</b> bien (×2).</div><div class=\"etu\"><b>Étape 2 — Aire initiale</b> : 10² = 100 cm² ; nouvelle : 20² = 400 cm².</div><div class=\"etu\"><b>Étape 3 — Comparer</b> : l'aire est multipliée par <b>4</b>, pas par 2 !</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : longueurs ×k → périmètre ×k mais aire ×k² (×2 → ×4 ; ×3 → ×9). C'est pour ça qu'une maquette au 1/10 a une aire 100 fois plus petite et (en 5e) un volume 1000 fois plus petit.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre périmètre (m) et aire (m²) — et pire : les additionner ou les convertir entre eux.</li>\n<li>Aire du triangle = produit de deux côtés ÷ 2 : non — c'est base × <b>hauteur perpendiculaire</b> ÷ 2.</li>\n<li>Conversions : 1 m² = 100 cm² ? Non : <b>10 000</b> cm² (les unités d'aire vont de 100 en 100).</li>\n<li>Utiliser le diamètre dans πr² : la formule exige le rayon (r = d/2).</li>\n<li>« Doubler les dimensions double l'aire » : l'aire est ×4 — la règle du carré est incontournable.</li>\n</ul>\n</div>\n<h3>5. Figures composées au quotidien : estimer intelligemment</h3>\n<ul>\n<li>Estimer une aire par <b>comptage de carreaux</b> : compter les carreaux entiers, puis assembler les morceaux (deux demi-carreaux = un carreau) ;</li>\n<li>Estimer un périmètre « à la louche » : mesurer chaque côté et arrondir — la précision vient ensuite ;</li>\n<li>Pour une figure courbe (terrain de sport aux coins arrondis), approcher par des segments : le résultat est un encadrement, pas une valeur exacte ;</li>\n<li>Réflexe d'unité : un périmètre en cm, une aire en cm² — si le résultat est en cm³ ou sans unité, c'est qu'une erreur s'est glissée.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Comptage de carreaux pour une figure\">\n  <g stroke=\"#cbd5e1\" stroke-width=\"1\">\n    <path d=\"M 70 20 V 120 M 95 20 V 120 M 120 20 V 120 M 145 20 V 120 M 170 20 V 120 M 195 20 V 120 M 220 20 V 120\"/>\n    <path d=\"M 70 20 H 220 M 70 45 H 220 M 70 70 H 220 M 70 95 H 220 M 70 120 H 220\"/>\n  </g>\n  <path d=\"M 120 20 H 195 V 45 H 220 V 95 H 145 V 120 H 95 V 70 H 120 Z\" fill=\"#c7d2fe\" fill-opacity=\"0.7\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"330\" y=\"50\" font-size=\"12\" fill=\"#1e293b\">carreaux couverts : 14</text>\n  <text x=\"330\" y=\"70\" font-size=\"12\" fill=\"#1e293b\">aucune formule : on compte</text>\n  <text x=\"330\" y=\"90\" font-size=\"12\" fill=\"#4f46e5\" font-weight=\"bold\">aire ≈ 14 carreaux</text>\n  <text x=\"330\" y=\"110\" font-size=\"11\" fill=\"#64748b\">(1 carreau = 1 cm²)</text>\n</svg><span class=\"fig-cap\">Méthode du comptage : le polygone recouvre 14 carreaux-unités, donc son aire ≈ 14 cm². Précieuse quand aucune formule ne s'applique.</span></div>\n\n<h3>6. Volumes : un avant-goût (parallélépipède rectangle)</h3>\n<ul>\n<li>Le <b>pavé droit</b> (boîte à chaussures) a un volume V = longueur × largeur × hauteur — en cm³ ;</li>\n<li>Le <b>cube</b> de côté c a un volume c³ : c'est « l'aire au carré » un étage plus haut ;</li>\n<li>Unités de volume : 1 L = 1 dm³ = 1 000 cm³ ; 1 m³ = 1 000 L (les unités de volume vont de 1000 en 1000) ;</li>\n<li>Lien de famille : longueur (m) → aire (m²) → volume (m³) ; doubler les dimensions double la longueur, quadruple l'aire et multiplie par <b>8</b> le volume.</li>\n</ul>\n<table>\n<tr><th>Figure (arête c)</th><th>Aire totale</th><th>Volume</th><th>c = 2 alors...</th></tr>\n<tr><td>carré</td><td>c²</td><td>—</td><td>aire ×4</td></tr>\n<tr><td>cube</td><td>6×c²</td><td>c³</td><td>aire ×4, volume ×8</td></tr>\n<tr><td>pavé L×ℓ×h</td><td>2×(Lℓ + Lh + ℓh)</td><td>L×ℓ×h</td><td>volume ×8 si tout double</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la boîte la plus économique</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> On veut une boîte sans couvercle de base carrée 6 cm et de volume 108 cm³. Quelle hauteur choisir, et quelle est l'aire de carton utilisée ?</div><div class=\"etu\"><b>Étape 1 — Trouver la hauteur</b> : V = 6 × 6 × h = 36 h = 108, donc h = 108 ÷ 36 = <b>3 cm</b>.</div><div class=\"etu\"><b>Étape 2 — Identifier les faces</b> : un fond 6×6, quatre faces latérales 6×3.</div><div class=\"etu\"><b>Étape 3 — Calculer l'aire de carton</b> : fond 36 cm² + 4 × (6×3) = 4×18 = 72 cm², total <b>108 cm²</b>.</div><div class=\"etu\"><b>Étape 4 — Remarquer</b> : aire 108 cm² pour un volume 108 cm³ — coïncidence amusante ici, mais les deux grandeurs n'ont <b>rien à voir</b> : l'une est en cm², l'autre en cm³. Toute « comparaison » entre elles serait un non-sens d'unités.</div></div></details>\n"
  },

    "cours": "<div class=\"cours-head\"><h2>Grandeurs et mesures : unités et conversions</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Des grandeurs pour tout mesurer</h3>\n<table>\n<tr><th>Grandeur</th><th>Unité principale</th><th>Exemples d'usage</th></tr>\n<tr><td><b>longueur</b></td><td>mètre (m)</td><td>taille, distance, tour de piste</td></tr>\n<tr><td><b>masse</b></td><td>gramme (g)</td><td>masse d'un cartable, d'une personne</td></tr>\n<tr><td><b>volume (capacité)</b></td><td>litre (L) / dm³</td><td>bouteille, citerne</td></tr>\n<tr><td><b>durée</b></td><td>seconde (s)</td><td>temps d'un trajet, d'une chanson</td></tr>\n</table>\n\n<h3>2. Conversions de longueurs et masses</h3>\n<p>Le tableau de conversion : chaque colonne vaut 10 fois la suivante (on déplace la virgule, on ne multiplie jamais « au hasard »).</p>\n<div class=\"fig\"><svg viewBox=\"0 0 430 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Tableau de conversion des longueurs avec 2,5 km convertis en 2500 m\">\n  <g stroke=\"#1e293b\" stroke-width=\"1.5\" fill=\"none\">\n    <rect x=\"30\" y=\"25\" width=\"70\" height=\"45\"/><rect x=\"100\" y=\"25\" width=\"70\" height=\"45\"/>\n    <rect x=\"170\" y=\"25\" width=\"70\" height=\"45\"/><rect x=\"240\" y=\"25\" width=\"70\" height=\"45\"/>\n    <rect x=\"310\" y=\"25\" width=\"70\" height=\"45\"/>\n  </g>\n  <g font-size=\"11.5\" fill=\"#334155\" text-anchor=\"middle\">\n    <text x=\"65\" y=\"85\">km</text><text x=\"135\" y=\"85\">hm</text><text x=\"205\" y=\"85\">dam</text><text x=\"275\" y=\"85\">m</text><text x=\"345\" y=\"85\">dm</text>\n  </g>\n  <g font-size=\"13\" fill=\"#1e293b\" text-anchor=\"middle\" font-weight=\"bold\">\n    <text x=\"65\" y=\"53\">2,</text><text x=\"135\" y=\"53\">5</text><text x=\"205\" y=\"53\"></text><text x=\"275\" y=\"53\">0</text><text x=\"345\" y=\"53\">0</text>\n  </g>\n  <text x=\"215\" y=\"110\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\">2,5 km = 2 500 m : la virgule se déplace de 3 colonnes</text>\n</svg><span class=\"fig-cap\">Conversions des longueurs : km → hm → dam → m ; chaque saut de colonne multiplie ou divise par 10.</span></div>\n<ul>\n<li>Longueurs : km, hm, dam, m, dm, cm, mm — <b>1 km = 1 000 m</b>, 1 m = 100 cm ;</li>\n<li>Masses : t, kg, g, mg — <b>1 kg = 1 000 g</b>, 1 t = 1 000 kg ;</li>\n<li>Capacités : hL, daL, L, dL, cL, mL — 1 L = 100 cL = 1 000 mL ; <b>1 L = 1 dm³</b>, 1 mL = 1 cm³.</li>\n</ul>\n\n<h3>3. Durées et conversions</h3>\n<ul>\n<li>1 min = 60 s ; 1 h = 60 min = 3 600 s ; 1 jour = 24 h — ici on <b>ne compte pas de 10 en 10</b> ;</li>\n<li>Convertir 2 h 45 min en minutes : 2×60 + 45 = 165 min ;</li>\n<li>Additionner des durées en colonnes comme des nombres, en reportant 1 dès qu'on dépasse 60.</li>\n</ul>\n\n<h3>4. Choisir la bonne unité</h3>\n<ul>\n<li>Estimer avant de mesurer : une porte ≈ 2 m ; un crayon ≈ 15 cm ; une personne ≈ 45-80 kg ; une canette ≈ 33 cL ;</li>\n<li>Une mesure sans unité n'a pas de sens : écrire toujours l'unité.</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Mélanger les systèmes : 1 kg = 1 000 g, mais 1 kg ≠ 100 g ; 1 km = 1 000 m, mais 1 m = 100 cm (pas 1 000).</li>\n<li>Les durées : 1,5 h = 1 h 30 min (et non « 1 h 50 min » — la virgule n'est pas un séparateur minutes).</li>\n<li>Les aires : 1 m² = 10 000 cm², pas 100 cm² (conversions ×100).</li>\n<li>Volume/capacité : 1 L = 1 dm³ ; 1 m³ = 1 000 L.</li>\n</ul>\n</div>"

    "cours": "<div class=\"cours-head\"><h2>Le pavé droit et le volume : faces, patrons, perspective</h2><span class=\"niv\">6e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Décrire le pavé droit</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 430 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Pave droit en perspective avec longueur 5 cm, largeur 3 cm, hauteur 2 cm et aretes en pointilles\">\n  <polygon points=\"60,50 200,50 230,30 90,30\" fill=\"#4f46e5\" opacity=\"0.15\"/>\n  <polygon points=\"230,30 230,110 200,130 200,50\" fill=\"#4f46e5\" opacity=\"0.25\"/>\n  <polygon points=\"60,130 200,130 230,110 90,110\" fill=\"none\"/>\n  <g stroke=\"#1e293b\" stroke-width=\"2\" fill=\"none\">\n    <polygon points=\"60,50 200,50 200,130 60,130\" fill=\"none\"/>\n    <polygon points=\"60,50 90,30 230,30 200,50\" fill=\"none\"/>\n    <polygon points=\"90,30 230,30 230,110 90,110\" fill=\"none\"/>\n  </g>\n  <g stroke=\"#1e293b\" stroke-width=\"1.6\" stroke-dasharray=\"5,4\">\n    <line x1=\"60\" y1=\"130\" x2=\"90\" y2=\"110\"/><line x1=\"60\" y1=\"130\" x2=\"60\" y2=\"50\" transform=\"translate(0,0)\"/>\n    <line x1=\"90\" y1=\"110\" x2=\"90\" y2=\"30\"/>\n  </g>\n  <line x1=\"60\" y1=\"130\" x2=\"60\" y2=\"50\" stroke=\"#1e293b\" stroke-width=\"1.6\" stroke-dasharray=\"5,4\"/>\n  <g font-size=\"11.5\" fill=\"#334155\" font-weight=\"bold\">\n    <text x=\"130\" y=\"146\">longueur : 5 cm</text>\n    <text x=\"242\" y=\"75\" fill=\"#4f46e5\">hauteur : 2 cm</text>\n    <text x=\"92\" y=\"66\" fill=\"#16a34a\" transform=\"rotate(-14 92 66)\">largeur : 3 cm</text>\n  </g>\n</svg><span class=\"fig-cap\">Un pavé droit (parallélépipède rectangle) en perspective cavalière : arêtes cachées en pointillés.</span></div>\n<ul>\n<li><b>6 faces</b> rectangulaires (des carrés si le pavé est un <b>cube</b>) ;</li>\n<li><b>8 sommets</b> et <b>12 arêtes</b> ; les faces opposées sont <b>identiques</b> ;</li>\n<li>Trois dimensions : <b>longueur L, largeur l, hauteur h</b> ;</li>\n<li>En perspective cavalière, les arêtes cachées se tracent en <b>pointillés</b> ; les faces avant sont « en vraie grandeur ».</li>\n</ul>\n\n<h3>2. Le patron du pavé droit</h3>\n<ul>\n<li>Un <b>patron</b> est le développement de la surface : en le découpant et pliant, on reconstitue le solide ;</li>\n<li>Il y a plusieurs patrons possibles, mais toujours <b>3 paires de rectangles</b> identiques ;</li>\n<li>On le dessine à partir des mesures : ex. pour 5×3×2 cm, les rectangles mesurent 5×3 (×2), 5×2 (×2), 3×2 (×2).</li>\n</ul>\n\n<h3>3. Volume et unités de volume</h3>\n<div class=\"formule\">Volume du pavé droit : V = L × l × h &nbsp;&nbsp;(cube : V = c³)</div>\n<ul>\n<li>Exemple : L = 5 cm, l = 3 cm, h = 2 cm → V = 5 × 3 × 2 = <b>30 cm³</b> ;</li>\n<li>Le <b>cm³</b> est le volume d'un cube de 1 cm de côté ; on compte combien de petits cubes remplissent le solide ;</li>\n<li>Conversions : 1 dm³ = 1 000 cm³ ; 1 m³ = 1 000 dm³ ; <b>1 L = 1 dm³</b>, 1 mL = 1 cm³.</li>\n</ul>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Compter les arêtes (12) ou les faces (6) « à l'œil » sur un dessin en perspective : on n'en voit jamais tout.</li>\n<li>Oublier une dimension : V = L × l × h — 2 multiplications, pas une seule.</li>\n<li>Unités : 1 dm³ = 1 000 cm³ (facteur 1 000, comme pour les longueurs ×10 en 3 dimensions).</li>\n<li>Un patron juste doit, une fois plié, fermer le solide sans trou ni chevauchement : toujours vérifier les faces opposées égales.</li>\n</ul>\n</div>"
  },
