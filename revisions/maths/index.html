{"t": "Identités remarquables (collège)", "q": "Résoudre (x + 7)(x − 7) = 0.", "c": ["x = −7 ou x = 7", "x = ±49", "x = 0", "x = 7 seulement"], "a": 0, "e": "Produit nul : x + 7 = 0 ou x − 7 = 0, donc x = −7 ou x = 7.", "d": "Règle du <b>produit nul</b> : A×B = 0 ⟺ A = 0 OU B = 0 — chaque facteur donne une solution.<div class='ex-detail'><u>Exemple rédigé</u> : x + 7 = 0 ⟹ x = −7 ; x − 7 = 0 ⟹ x = 7 : S = {−7 ; 7}. Vérifications : (−7+7)(−14) = 0×(−14) = 0 ✓ ; (14)(0) = 0 ✓. C'est l'équivalent factorisé de x² = 49 : la factorisation donne proprement les DEUX solutions opposées.</div>"},
{"t": "Identités remarquables (collège)", "q": "Quel est le « double produit » dans (a − b)² ?", "c": ["2ab", "−2ab", "−ab", "−2(a−b)"], "a": 1, "e": "(a − b)² = a² − 2ab + b² : le double produit apparaît avec un signe MOINS.", "d": "Le terme central de (a±b)² est <b>±2ab</b> : positif dans (a+b)², négatif dans (a−b)².<div class='ex-detail'><u>Exemple rédigé</u> : (x − 4)² = x² − 2×x×4 + 16 = x² − 8x + 16. Test x = 2 : (2−4)² = 4 et 4 − 16 + 16 = 4 ✓. Le carré du second terme (b² = 16) reste TOUJOURS positif : seul le double produit porte le signe.</div>"},
{"t": "Identités remarquables (collège)", "q": "Développer (x + 4)(x − 4).", "c": ["x² − 16", "x² − 8x − 16", "x² + 16", "x² − 8"], "a": 0, "e": "(a+b)(a−b) = a² − b² : x² − 16.", "d": "La 3ᵉ identité <b>annule les termes croisés</b> : (+4x) et (−4x) se neutralisent.<div class='ex-detail'><u>Exemple rédigé</u> : (x+4)(x−4) = x² − 4x + 4x − 16 = <b>x² − 16</b>. Test x = 3 : (7)(−1) = −7 et 9 − 16 = −7 ✓. Piège : croire qu'il « manque » un terme et écrire x² − 8x − 16 : la double distributivité confirme la disparition des termes en x.</div>"},
{"t": "Identités remarquables (collège)", "q": "Résoudre x² − 49 = 0. Quelle méthode est correcte au collège ?", "c": ["Diviser par (x − 7)", "Prendre la racine carrée : x = 7", "Développer x² = 49", "Factoriser : (x+7)(x−7) = 0, puis produit nul"], "a": 3, "e": "On factorise avec a² − b² puis on applique la règle du produit nul : deux solutions, −7 et 7.", "d": "La méthode attendue : <b>factoriser puis produit nul</b> — elle donne les deux solutions, y compris la négative.<div class='ex-detail'><u>Exemple rédigé</u> : x² − 49 = (x+7)(x−7) = 0 ⟹ x = −7 ou x = 7. Le piège de « √ des deux côtés » : donner seulement x = 7 et oublier −7 (ou pire, écrire √49 = ±7, faux). La factorisation est la méthode complète et rigoureuse du programme.</div>"},
{"t": "Identités remarquables (collège)", "q": "Factoriser 7(x − 1) + (x − 1)(x + 2).", "c": ["x(x − 1) + 7", "(x − 1)(7 + x + 2)", "7(x + 2)", "(x − 1)(x + 9)"], "a": 3, "e": "Facteur commun (x − 1) : (x − 1)(7 + x + 2) = (x − 1)(x + 9).", "d": "Le facteur commun peut être une <b>parenthèse entière</b> : on la « sort » et on met le reste dans un crochet.<div class='ex-detail'><u>Exemple rédigé</u> : 7(x−1) + (x−1)(x+2) = (x−1)[7 + (x+2)] = (x−1)(x+9) après réduction du crochet. Vérification : (x−1)(x+9) = x² + 8x − 9 = (7x − 7) + (x² + x − 2) ✓. Piège : laisser le crochet non réduit (réponse (x−1)(7+x+2)) : correct mais non terminé.</div>"},
{"t": "Fonctions (collège)", "q": "f(x) = 2x² − 3. Combien vaut f(3) ?", "c": ["2×3 − 3 = 3", "15", "3", "9"], "a": 1, "e": "f(3) = 2×9 − 3 = 15 : on remplace x par 3 dans l'expression.", "d": "L'image de 3 : <b>remplacer x par 3</b> et calculer avec les priorités (carré d'abord).<div class='ex-detail'><u>Exemple rédigé</u> : f(3) = 2×3² − 3 = 2×9 − 3 = <b>15</b>. Piège : 2×3 = 6 puis 6² = 36 sans priorité : le carré s'applique à x SEUL, donc 3² = 9 d'abord. f(3) est un NOMBRE (15), pas une fonction.</div>"},
{"t": "Fonctions (collège)", "q": "f(x) = 2x² − 3. Que vaut f(−2) ?", "c": ["−5", "5", "−11", "1"], "a": 1, "e": "f(−2) = 2×(−2)² − 3 = 2×4 − 3 = 5.", "d": "Substitution d'un <b>nombre négatif</b> : parenthèses obligatoires, et (−2)² = +4.<div class='ex-detail'><u>Exemple rédigé</u> : f(−2) = 2×(−2)² − 3 = 2×4 − 3 = <b>5</b>. Piège classique : (−2)² = −4 (faux : un carré est positif) qui donne 2×(−4) − 3 = −11. Rappel : (−2)² = (−2)×(−2) = +4, alors que −2² = −4.</div>"},
{"t": "Fonctions (collège)", "q": "Dans le tableau, f(−1) = 5 et f(4) = 5. Que peut-on dire du nombre 5 ?", "c": ["5 n'a pas d'antécédent", "Il a une seule image : 5", "−1 et 4 sont ses images", "Il a deux antécédents : −1 et 4"], "a": 3, "e": "−1 et 4 donnent tous deux 5 : le nombre 5 a deux antécédents.", "d": "ANTÉCÉDENT = ce qu'on cherche dans la ligne des x quand on connaît l'image : ici <b>−1 et 4</b> sont deux antécédents de 5.<div class='ex-detail'><u>Exemple rédigé</u> : f(−1) = 5 et f(4) = 5 : une même valeur (5) peut avoir PLUSIEURS antécédents. Ce qui est interdit, c'est qu'un même x ait deux images : f(2) ne peut pas valoir à la fois 5 et 7. Asymétrie du vocabulaire à bien intégrer pour le brevet.</div>"},
{"t": "Fonctions (collège)", "q": "Qu'est-ce que l'IMAGE de x par une fonction f ?", "c": ["L'ensemble des solutions", "La valeur de x", "Le graphique de f", "Le nombre f(x) associé à x"], "a": 3, "e": "L'image de x est f(x), le nombre que la fonction associe à x.", "d": "f(x) = <b>l'image de x</b> ; x = <b>un antécédent</b> de f(x). Sens de lecture : « l'image DE x » (x est la donnée) ; « les antécédents DE f(x) » (f(x) est la donnée).<div class='ex-detail'><u>Exemple</u> : f(x) = x² avec x = 3 : « l'image de 3 est 9 » et « 3 est un antécédent de 9 ». Au brevet, confondre les deux coûte des points sur TOUTES les questions de lecture graphique. Mnémonique : x → f(x) : l'image est le point d'ARRIVÉE.</div>"},
{"t": "Fonctions (collège)", "q": "Sur la courbe de f, les points (−2 ; 3) et (1 ; 3) appartiennent à la courbe. Les antécédents de 3 sont…", "c": ["−2 et 1", "3 seulement", "on ne peut pas savoir", "−2 seulement"], "a": 0, "e": "La droite horizontale y = 3 coupe la courbe en x = −2 et x = 1 : deux antécédents.", "d": "Lecture graphique des antécédents : tracer <b>l'horizontale</b> à l'ordonnée 3 et lire les abscisses des intersections.<div class='ex-detail'><u>Exemple rédigé</u> : y = 3 coupe la courbe en (−2 ; 3) et (1 ; 3) : les antécédents de 3 sont <b>−2 et 1</b>. Réciproquement, l'image de −2 (verticale) est unique : 3. Piège : dire « l'antécédent de 3 » au singulier alors qu'il peut y en avoir plusieurs.</div>"},
{"t": "Fonctions (collège)", "q": "Une fonction peut associer à un même x…", "c": ["aucune image en général", "plusieurs images", "deux images si x > 0", "une seule image"], "a": 3, "e": "Par définition, chaque x a UNE SEULE image par f (mais une image peut avoir plusieurs antécédents).", "d": "La définition même d'une fonction : à chaque x de départ, <b>UN SEUL</b> nombre d'arrivée.<div class='ex-detail'><u>Exemple</u> : si à x = 2 on associait f(2) = 5 ET f(2) = 7, ce ne serait pas une fonction (la courbe aurait deux points empilés sur la verticale x = 2 : le « test de la droite verticale » échouerait). En revanche, x = −1 et x = 4 peuvent BOTH donner 5 : aucun problème.</div>"},
{"t": "Fonctions (collège)", "q": "f(x) = 3x + 1. Quel est l'antécédent de 7 ?", "c": ["8", "2", "7/3", "22"], "a": 1, "e": "On résout 3x + 1 = 7 : 3x = 6, donc x = 2.", "d": "Chercher un antécédent de 7 = <b>résoudre f(x) = 7</b> — une équation, pas un calcul direct.<div class='ex-detail'><u>Exemple rédigé</u> : 3x + 1 = 7 ⟹ 3x = 6 ⟹ x = <b>2</b>. Vérification : f(2) = 3×2 + 1 = 7 ✓. Piège : répondre 22 = f(7) : calculer f(7) donne l'image de 7, pas son antécédent ! Sens de lecture : antécédent → équation ; image → calcul.</div>"},
{"t": "Fonctions (collège)", "q": "Quelle est la nature de la courbe d'une fonction affine f(x) = 2x − 3 ?", "c": ["Une droite passant par l'origine", "Une droite (ne passant pas par l'origine)", "Une parabole", "Une hyperbole"], "a": 1, "e": "Toute fonction affine a pour courbe une droite ; b = −3 ≠ 0, donc elle ne passe pas par l'origine.", "d": "Affine (ax + b) → <b>droite</b> ; linéaire (ax seul) → droite PAR l'origine (proportionnalité) ; carré → parabole.<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = 2x − 3 : droite qui coupe l'axe des ordonnées en −3 (ordonnée à l'origine) et monte de 2 par pas de 1 (coefficient directeur). Test : f(0) = −3 ≠ 0, donc pas linéaire. Deux points suffisent à la tracer : (0 ; −3) et (2 ; 1).</div>"},
{"t": "Fonctions (collège)", "q": "Dans un tableau de valeurs, SOUS la valeur x = 2 on lit f(x) = 7. Que dit-on ?", "c": ["7 est un antécédent de 2", "2 est l'image de 7", "7 est l'image de 2", "2 et 7 sont égaux"], "a": 2, "e": "On part de x = 2 et on lit son image 7 : 7 est l'image de 2 (et 2 est un antécédent de 7).", "d": "Dans un tableau, la ligne du haut donne les <b>antécédents</b> (x), celle du bas les <b>images</b> (f(x)).<div class='ex-detail'><u>Exemple rédigé</u> : sous 2, on lit 7 : « l'image de 2 est 7 » et « 2 est UN antécédent de 7 » (il peut y en avoir d'autres dans le tableau : scanner toute la ligne du bas). Piège d'inversion : dire « l'image de 7 est 2 » — on ne peut le dire que si 7 figure dans la ligne x.</div>"},
{"t": "Fonctions (collège)", "q": "Une fonction linéaire traduit…", "c": ["une égalité de Pythagore", "une symétrie centrale", "une moyenne", "une situation de proportionnalité"], "a": 3, "e": "f(x) = ax : coefficient unique = situation de proportionnalité (courbe droite par l'origine).", "d": "Linéaire = <b>proportionnalité</b> : f(x) = ax signifie que f(x)/x = a pour tout x (coefficient constant).<div class='ex-detail'><u>Exemple rédigé</u> : f(x) = 0,8x peut modéliser un prix (0,80 € par kg) ; f(3) = 2,40, f(10) = 8 : le tableau de valeurs est un tableau de proportionnalité, et la courbe passe par (0 ; 0). Ajouter b (fonction affine) brise cette proportionnalité : f(0) = b ≠ 0.</div>"},
{"t": "Statistiques (collège)", "q": "Série : 7 ; 3 ; 9 ; 5 ; 12 ; 3. Quelle est la médiane ?", "c": ["5", "6", "3", "5,5"], "a": 1, "e": "On ordonne : 3 ; 3 ; 5 ; 7 ; 9 ; 12 — effectif pair, médiane = (5+7)/2 = 6.", "d": "Étapes obligatoires : <b>trier</b> la série, compter (6 valeurs), prendre les 3ᵉ et 4ᵉ (5 et 7), faire leur moyenne : <b>6</b>.<div class='ex-detail'><u>Exemple rédigé</u> : ordonnée : 3 ; 3 ; 5 ; 7 ; 9 ; 12. De part et d'autre de 6, il y a 3 valeurs : définition respectée. Piège : chercher la médiane sans trier (répondre 9 ou 5 en lisant la série brute). La médiane n'est pas forcément une valeur DE la série (6 n'y figure pas !).</div>"},
{"t": "Statistiques (collège)", "q": "Notes : 12 (coef 1), 15 (coef 2), 8 (coef 1). Moyenne pondérée ?", "c": ["12,5", "12", "35/4 = 8,75", "11,67"], "a": 0, "e": "(12×1 + 15×2 + 8×1)/(1+2+1) = 50/4 = 12,5.", "d": "Moyenne pondérée : <b>Σ(valeur×coef) ÷ Σcoef</b> — chaque note « pèse » son coefficient.<div class='ex-detail'><u>Exemple rédigé</u> : 12 + 30 + 8 = 50 ; somme des coefficients 4 ; moyenne = <b>12,5</b>. Piège : (12+15+8)/3 ≈ 11,67 : moyenne simple, fausse ici car la note 15 compte double. Test : la pondérée doit être plus proche de 15 que la simple ✓ (12,5 > 11,67).</div>"},
{"t": "Statistiques (collège)", "q": "L'étendue de la série 2 ; 8 ; 15 ; 3 ; 7 est…", "c": ["13", "2 à 15", "17", "15"], "a": 0, "e": "Max − min = 15 − 2 = 13.", "d": "Étendue = <b>plus grande valeur − plus petite valeur</b> : 15 − 2 = <b>13</b>, un NOMBRE unique qui mesure la dispersion.<div class='ex-detail'><u>Exemple rédigé</u> : dire « l'étendue va de 2 à 15 » est une réponse incomplète : l'étendue EST 13. Piège : additionner max + min (17). Une petite étendue = série homogène ; une grande = valeurs très dispersées (comme les classes A et B du cours, étendues 4 et 14 à moyennes égales).</div>"},
{"t": "Statistiques (collège)", "q": "Série ordonnée de 7 valeurs. La médiane est…", "c": ["la 3ᵉ valeur", "la moyenne des 3ᵉ et 4ᵉ", "7/2 = 3,5", "la 4ᵉ valeur"], "a": 3, "e": "Effectif impair : la médiane est la valeur centrale, la 4ᵉ sur 7.", "d": "Effectif impair (2n+1) : la médiane est la <b>(n+1)ᵉ</b> valeur — ici 4ᵉ sur 7, avec 3 valeurs de chaque côté.<div class='ex-detail'><u>Exemple rédigé</u> : 2 ; 4 ; 5 ; 9 ; 11 ; 14 ; 20 → médiane = <b>9</b> (3 valeurs en dessous, 3 au-dessus). Formule pratique : (7+1)/2 = 4ᵉ position. Piège : oublier de trier ou prendre la 3ᵉ valeur (n au lieu de n+1).</div>"},
{"t": "Statistiques (collège)", "q": "Salaires : 1200 ; 1300 ; 1400 ; 1500 ; 21000. Quel indicateur représente le mieux la série ?", "c": ["Le maximum", "La moyenne (5280)", "L'étendue seule", "La médiane (1400)"], "a": 3, "e": "La valeur extrême 21000 fausse la moyenne ; la médiane 1400 est représentative.", "d": "La moyenne est <b>sensible aux valeurs extrêmes</b> : 5280 ne correspond au salaire de personne ; la <b>médiane 1400</b> résiste à la valeur aberrante.<div class='ex-detail'><u>Exemple rédigé</u> : moyenne = 26400/5 = 5280 (tirée vers le haut par 21000) ; médiane = 1400 (3ᵉ valeur de la série ordonnée de 5). Pour un « salaire typique », les statistiques officielles utilisent d'ailleurs la médiane. L'étendue (19 800) montre seulement la dispersion, sans donner d'ordre de grandeur central.</div>"},
{"t": "Statistiques (collège)", "q": "La médiane d'une série est la valeur telle que…", "c": ["toutes les valeurs lui sont égales", "la somme des écarts est nulle", "au moins 50 % des valeurs ≤ médiane et au moins 50 % ≥ médiane", "la moyenne est maximale"], "a": 2, "e": "La médiane coupe la série ordonnée en deux moitiés d'effectifs égaux.", "d": "Définition : la médiane <b>partage la série ordonnée</b> en deux groupes d'effectifs égaux (ou presque si elle est entre deux valeurs).<div class='ex-detail'><u>Exemple</u> : pour 3 ; 3 ; 5 ; 7 ; 9 ; 12 (médiane 6), les valeurs ≤ 6 : 3, 3, 5 (3 sur 6 = 50 %) et les valeurs ≥ 6 : 7, 9, 12 (50 %). C'est un indicateur de POSITION (au milieu de la série), alors que l'étendue est un indicateur de DISPERSION (l'ampleur).</div>"},
{"t": "Statistiques (collège)", "q": "Deux classes ont la même moyenne 10, d'étendues 4 et 14. Que sait-on ?", "c": ["Les classes sont identiques", "L'une est homogène, l'autre hétérogène", "La médiane de la seconde est plus élevée", "Rien du tout"], "a": 1, "e": "À moyenne égale, l'étendue révèle la dispersion : 4 = homogène, 14 = très dispersée.", "d": "L'étendue complète la moyenne : deux séries peuvent avoir la <b>même moyenne</b> mais des profils très différents.<div class='ex-detail'><u>Exemple rédigé</u> : classe A (8 ; 9 ; 10 ; 10 ; 11 ; 12) : tout le monde est proche de 10 — profil homogène. Classe B (2 ; 6 ; 10 ; 12 ; 14 ; 16) : écart de 2 à 16 — élèves en difficulté ET excellents. Un seul indicateur ne suffit JAMAIS à décrire une série : moyenne + étendue (+ médiane) forment un tableau complet.</div>"},
{"t": "Statistiques (collège)", "q": "Moyenne de la série 5 ; 7 ; 9 ; 13 ?", "c": ["9", "8,5 ou 9", "34", "8,5"], "a": 3, "e": "(5+7+9+13)/4 = 34/4 = 8,5.", "d": "Moyenne simple : <b>somme ÷ effectif</b> = 34/4 = <b>8,5</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 5+7+9+13 = 34, et 34/4 = 8,5. Remarque : la moyenne n'est PAS forcément une valeur de la série (8,5 n'y figure pas), et elle diffère ici de la médiane ((7+9)/2 = 8). Piège : diviser par 3 (oublier une valeur) ou confondre avec la médiane.</div>"},
{"t": "Statistiques (collège)", "q": "Une série a un effectif PAIR. Pour la médiane, on…", "c": ["prend la première valeur", "divise l'effectif par 3", "fait la moyenne des deux valeurs centrales", "prend la dernière valeur"], "a": 2, "e": "Effectif pair : la médiane est la moyenne des deux valeurs centrales de la série ordonnée.", "d": "Avec 2n valeurs, aucune valeur ne se trouve « au centre » : on prend les nᵉ et (n+1)ᵉ valeurs et on <b>les moyenne</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 3 ; 5 ; 7 ; 9 (4 valeurs) : médiane = (5+7)/2 = 6, qui n'appartient PAS à la série — c'est normal. Piège : choisir 7 « parce que c'est plus proche du milieu visuellement ». La méthode (moyenne des deux centraux) est la seule correcte.</div>"},
{"t": "Statistiques (collège)", "q": "Ajouter la valeur 18 à la série 4 ; 8 ; 12. Que devient la médiane ?", "c": ["La médiane ne change jamais", "8", "12", "10"], "a": 3, "e": "Série ordonnée : 4 ; 8 ; 12 ; 18 → effectif pair, médiane = (8+12)/2 = 10.", "d": "Ajouter une valeur peut <b>changer la nature</b> du calcul : de 3 valeurs (impair, médiane 8) on passe à 4 (pair, médiane 10).<div class='ex-detail'><u>Exemple rédigé</u> : 4 ; 8 ; 12 ; 18 → médiane = (8+12)/2 = <b>10</b>. Piège : rester sur 8 par habitude. Comparer avec la moyenne : avant (4+8+12)/3 = 8 ; après (4+8+12+18)/4 = 10,5 : les deux indicateurs bougent, mais différemment — la médiane « saute » de valeur en valeur, la moyenne varie continûment.</div>"},
{"t": "Sphères et solides (collège)", "q": "Quelle est l'aire d'une sphère de rayon 6 cm (valeur exacte) ?", "c": ["36π cm²", "24π cm²", "288π cm²", "144π cm²"], "a": 3, "e": "A = 4πr² = 4π × 36 = 144π cm².", "d": "Aire de la sphère : <b>4πr²</b> avec r² = 36, donc <b>144π cm²</b> ≈ 452,4 cm².<div class='ex-detail'><u>Exemple rédigé</u> : 4 × 36 = 144. Piège : 36π vient de πr² (oubli du facteur 4) ; 288π est le VOLUME (4/3)πr³ ; 24π viendrait de 4πr. Les unités aident : une aire est en cm² → r², un volume en cm³ → r³.</div>"},
{"t": "Sphères et solides (collège)", "q": "Volume de la boule de rayon 6 cm (valeur exacte) ?", "c": ["48π cm³", "36π cm³", "144π cm³", "288π cm³"], "a": 3, "e": "V = (4/3)πr³ = (4/3)π × 216 = 288π cm³.", "d": "Volume de la boule : <b>(4/3)πr³</b> avec r³ = 216, donc (4/3) × 216 = <b>288π cm³</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 216/3 = 72, puis 72 × 4 = 288. Piège : confondre avec l'aire (144π cm²) — le facteur 4/3 remplace le facteur 4 et le rayon passe au CUBE. Ordre de grandeur : 288π ≈ 904 cm³, cohérent pour une balle de 6 cm de rayon.</div>"},
{"t": "Sphères et solides (collège)", "q": "La section d'une sphère par un plan est toujours…", "c": ["un disque (cercle)", "un point", "un rectangle", "une ellipse"], "a": 0, "e": "Toute section plane d'une sphère est un cercle (un disque avec son intérieur).", "d": "Propriété clé : le plan « tranche » la sphère en un <b>cercle</b>, dont le rayon vaut r si le plan passe par le centre (grand cercle), et moins sinon.<div class='ex-detail'><u>Exemple</u> : coupe d'orange = disque ; méridiens et équateur sur un globe terrestre = grands cercles (rayon 6371 km). Piège : penser « ellipse » — c'est le cas d'autres surfaces (cônes coupés de biais), mais JAMAIS de la sphère par un plan.</div>"},
{"t": "Sphères et solides (collège)", "q": "Sphère de rayon 5 cm coupée par un plan à 3 cm du centre. Rayon du cercle de section ?", "c": ["2 cm", "4 cm", "5 cm", "√8 cm"], "a": 1, "e": "Pythagore : r² = 5² − 3² = 16, donc r = 4 cm.", "d": "Dans le triangle rectangle centre–pied du plan–point de section : <b>r² = R² − d²</b> (Pythagore).<div class='ex-detail'><u>Exemple rédigé</u> : r² = 25 − 9 = 16 ⟹ r = <b>4 cm</b> (triplet 3-4-5). Contrôle : le rayon de section (4) doit être PLUS PETIT que le rayon de la sphère (5) ✓ — répondre √8 ≈ 2,8 (soustraction 5−3 puis carré inversé) est le piège classique.</div>"},
{"t": "Sphères et solides (collège)", "q": "Un cylindre est coupé par un plan PERPENDICULAIRE à son axe. La section est…", "c": ["un cylindre", "un rectangle", "un triangle", "un disque"], "a": 3, "e": "Perpendiculaire à l'axe : la section est un disque (comme une tranche de saucisson).", "d": "Sections du cylindre : plan ⟂ axe ⟹ <b>disque</b> (même rayon que la base) ; plan ∥ axe ⟹ rectangle (largeur = 2r).<div class='ex-detail'><u>Exemple</u> : couper un rouleau de papier perpendiculairement donne un cercle de même rayon ; le couper dans le sens de la longueur donne un rectangle de largeur le diamètre. Pour le pavé droit : section parallèle à une face = rectangle de mêmes dimensions.</div>"},
{"t": "Sphères et solides (collège)", "q": "Une translation transforme une figure en…", "c": ["un agrandissement", "une figure de mêmes dimensions, glissée selon un vecteur", "une figure déformée", "une figure retournée d'un angle donné"], "a": 1, "e": "La translation fait glisser la figure sans la déformer : longueurs et angles conservés.", "d": "La translation est une <b>isométrie</b> : chaque point subit le même déplacement (direction, sens, longueur = le vecteur).<div class='ex-detail'><u>Exemple rédigé</u> : pour translater un triangle ABC selon un vecteur, on construit A', B', C' avec AA' = BB' = CC' = le vecteur : A'B' = AB et A'B'C' est superposable à ABC. Piège : la rotation change l'ORIENTATION de la figure ; la translation jamais.</div>"},
{"t": "Sphères et solides (collège)", "q": "Dans une rotation de centre O et d'angle α, un point M et son image M' vérifient…", "c": ["OM' = OM et l'angle MÔM' = α", "MM' = α", "OM' = 2OM", "M' est toujours sur [OM]"], "a": 0, "e": "Rotation : distance au centre conservée (OM' = OM) et angle MÔM' = α.", "d": "Deux conditions définissent l'image : <b>même distance au centre</b> et <b>angle donné</b> (sens précisé : direct ou indirect).<div class='ex-detail'><u>Exemple rédigé</u> : rotation de centre O, angle 90° : M devient M' avec OM' = OM et MÔM' = 90° — construire la perpendiculaire à (OM) en O et reporter la longueur OM. Piège : M' sur [OM] correspond à l'identité ou la symétrie centrale (rotation de 180°), pas à une rotation générale.</div>"},
{"t": "Sphères et solides (collège)", "q": "Un cône est coupé par un plan PARALLÈLE à sa base. La section est…", "c": ["un disque plus grand", "un triangle réduit", "un rectangle", "un disque plus petit que la base"], "a": 3, "e": "Section parallèle à la base d'un cône : un disque, réduction du disque de base (rapport k < 1).", "d": "Section ∥ base ⟹ <b>réduction</b> de la base : même nature (disque pour le cône, carré pour la pyramide à base carrée), dimensions ×k, aire ×k².<div class='ex-detail'><u>Exemple rédigé</u> : à mi-hauteur (k = 1/2), le disque de section a un rayon moitié, une aire divisée par 4 et le petit cône « détaché » un volume divisé par 8. Piège : un disque plus GRAND est impossible : le cône se referme vers le sommet.</div>"},
{"t": "Sphères et solides (collège)", "q": "Quelle est la différence entre SPHÈRE et BOULE ?", "c": ["Aucune, ce sont des synonymes", "La sphère est pleine", "La sphère est la surface, la boule est le volume intérieur", "La boule est creuse"], "a": 2, "e": "Sphère = surface (aire en cm²) ; boule = volume plein (V en cm³).", "d": "Sphère : ensemble des points à distance r du centre (SURFACE, creuse — un ballon). Boule : points à distance ≤ r (VOLUME, plein — une orange).<div class='ex-detail'><u>Exemple rédigé</u> : la Terre modélisée : la surface terrestre est une sphère (aire 4πr²), la planète entière est une boule (volume (4/3)πr³). Piège d'unités : une aire s'exprime en cm², un volume en cm³ — la question « sphère ou boule ? » se traduit souvent par « aire ou volume ? ».</div>"},
{"t": "Sphères et solides (collège)", "q": "Un plan passe EXACTEMENT par le centre d'une sphère de rayon r. La section est un cercle de rayon…", "c": ["r", "r/2", "2r", "√r"], "a": 0, "e": "C'est le grand cercle de la sphère : son rayon vaut exactement r.", "d": "Section par un plan passant par le centre = <b>grand cercle</b> : le plus grand cercle possible sur la sphère, de même rayon r.<div class='ex-detail'><u>Exemple rédigé</u> : sur Terre (r ≈ 6371 km), l'équateur et les méridiens sont des grands cercles : leur rayon vaut celui de la Terre. Un cercle de section hors centre (distance d > 0) a un rayon √(r² − d²) plus petit (le « rayon des latitudes » diminue vers les pôles).</div>"},
{"t": "Nombres et calculs (6e)", "q": "Quel nombre est le plus grand : 5,4 ou 5,379 ?", "c": ["On ne peut pas comparer", "5,4", "5,379", "Ils sont égaux"], "a": 1, "e": "Dixièmes : 4 > 3, donc 5,4 > 5,379.", "d": "On compare <b>chiffre par chiffre</b> à partir de la gauche : parties entières égales (5), puis dixièmes : 4 contre 3.<div class='ex-detail'><u>Exemple rédigé</u> : 5,4 = 5,400 et 5,400 &gt; 5,379 (400 millièmes &gt; 379 millièmes). Piège : « 5,379 a plus de chiffres donc est plus grand » — FAUX. On peut écrire 5,4 = 5,40 = 5,400 : les zéros à droite ne changent rien.</div>"},
{"t": "Nombres et calculs (6e)", "q": "Combien vaut 2,4 × 0,7 ?", "c": ["1,68", "0,168", "1,32", "16,8"], "a": 0, "e": "24 × 7 = 168, et 1 + 1 = 2 chiffres après la virgule : 1,68.", "d": "On multiplie <b>sans les virgules</b> (24 × 7 = 168), puis on compte le total de décimales (une pour chaque facteur) : <b>1,68</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 2,4 (1 décimale) × 0,7 (1 décimale) → 168 devient 1,68 (2 décimales). Contrôle : 2,4 × 0,7 ≈ 2,5 × 0,7 ≈ 1,75 : cohérent. Piège : 16,8 (oubli des décimales) ou 0,168 (un rang de trop).</div>"},
{"t": "Nombres et calculs (6e)", "q": "342 est-il divisible par 3 ?", "c": ["Non, car il ne finit pas par 3", "Oui, car 3 + 4 + 2 = 9 est divisible par 3", "Non, car 342 est pair", "Oui, car il finit par 2"], "a": 1, "e": "Somme des chiffres : 3 + 4 + 2 = 9, divisible par 3 → 342 = 3 × 114.", "d": "Critère par 3 : <b>la somme des chiffres</b> doit être divisible par 3 (et c'est le même critère pour 9).<div class='ex-detail'><u>Exemple rédigé</u> : 3+4+2 = 9 = 3×3, donc 342 = 3 × 114 = 9 × 38 : divisible par 3 ET par 9. Contre-exemple : 343 → 3+4+3 = 10, pas divisible par 3. Piège : regarder le dernier chiffre (critère de 2 et de 5, PAS de 3).</div>"},
{"t": "Nombres et calculs (6e)", "q": "Quel nombre est divisible par 5 ?", "c": ["317", "1024", "342", "125"], "a": 3, "e": "Par 5 : le chiffre des unités est 0 ou 5 → 125.", "d": "Critère par 5 : l'unité doit valoir <b>0 ou 5</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 125 finit par 5 → divisible (125 = 5 × 25). 342 (unité 2), 1024 (4) et 317 (7) ne le sont pas. Révision rapide : par 2 → pair ; par 10 → finit par 0 ; par 4 → les deux derniers chiffres divisibles par 4 (1024 : 24 = 4×6 ✓).</div>"},
{"t": "Nombres et calculs (6e)", "q": "Combien vaut 47,5 ÷ 100 ?", "c": ["0,475", "4 750", "4,75", "475"], "a": 0, "e": "La virgule part de 2 rangs vers la gauche : 47,5 ÷ 100 = 0,475.", "d": "Diviser par 10, 100, 1000 : on déplace la virgule de 1, 2, 3 rangs vers la <b>gauche</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 47,5 ÷ 100 : la virgule passe de 2 rangs vers la gauche → <b>0,475</b>. Contrôle : 0,475 × 100 = 47,5 ✓. Piège : 4,75 (un seul rang, c'est ÷ 10) et 4 750 (multiplication par 100). Le sens du déplacement se vérifie toujours en inversant l'opération.</div>"},
{"t": "Nombres et calculs (6e)", "q": "Dans le nombre 23,407, le chiffre 4 vaut…", "c": ["4 centièmes", "4 millièmes", "4 unités", "4 dixièmes"], "a": 3, "e": "Premier chiffre après la virgule : les dixièmes (23,407 = 23 + 4/10 + 0/100 + 7/1000).", "d": "Positions : 1ᵉʳ après la virgule = <b>dixièmes</b>, 2ᵉ = centièmes, 3ᵉ = millièmes.<div class='ex-detail'><u>Exemple rédigé</u> : 23,407 = 23 + 4/10 + 0/100 + 7/1000. Donc le 4 vaut 4 dixièmes = 0,4. Lecture d'appui : 23,407 se lit « 23 et 407 millièmes ». Piège : confondre le nombre de chiffres de la partie décimale avec le nom de la dernière position (7 = millièmes, 0 = centièmes).</div>"},
{"t": "Nombres et calculs (6e)", "q": "Ordre de grandeur de 19,8 × 4,1 ?", "c": ["80", "800", "8", "20"], "a": 0, "e": "19,8 ≈ 20 et 4,1 ≈ 4 : le résultat est proche de 20 × 4 = 80.", "d": "Estimer avant de calculer : <b>arrondir chaque facteur</b> au plus simple, puis multiplier.<div class='ex-detail'><u>Exemple rédigé</u> : 20 × 4 = 80 ; le vrai produit vaut 81,18, très proche ✓. À quoi ça sert : si le calcul donne 8,118 ou 811,8, l'ordre de grandeur signale une virgule mal placée. Réflexe d'expert : TOUJOURS encadrer son résultat par un ordre de grandeur.</div>"},
{"t": "Nombres et calculs (6e)", "q": "5,3 et 5,30 sont-ils égaux ?", "c": ["Seulement si on arrondit", "Non, 5,30 est plus grand", "Oui : ajouter des zéros à droite ne change rien", "Non, 5,3 est plus grand"], "a": 2, "e": "5,3 = 5,30 = 5,300 : les zéros ajoutés à droite de la partie décimale ne changent pas la valeur.", "d": "Écritures équivalentes : <b>5,3 = 5,30 = 5,300</b> — c'est le même nombre 53 dixièmes.<div class='ex-detail'><u>Exemple rédigé</u> : 5,30 = 5 + 3/10 + 0/100 = 5,3. Astuce pratique : ces zéros aident à comparer (5,3 vs 5,37 → 5,30 vs 5,37) et à poser les opérations en colonnes. Attention : 5,03 ≠ 5,3 (le zéro AVANT le 3 compte : 3 centièmes ≠ 3 dixièmes).</div>"},
{"t": "Nombres et calculs (6e)", "q": "Multiplier 8 par 0,5 revient à…", "c": ["prendre la moitié de 8", "ajouter 0,5", "doubler 8", "diviser par 5"], "a": 0, "e": "0,5 = un demi : 8 × 0,5 = 4 (multiplier par un nombre < 1 rétrécit).", "d": "Multiplier par un nombre <b>plus petit que 1</b> donne un résultat PLUS PETIT : 8 × 0,5 = <b>4</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 0,5 = 5/10 = 1/2, donc 8 × 0,5 = 8/2 = 4. Généralisation : × 0,1 = ÷ 10 ; × 0,25 = ÷ 4 ; × 2,5 = plus grand (facteur > 1). Piège fréquent : croire qu'une multiplication « grandit toujours » — faux dès qu'un facteur est décimal inférieur à 1.</div>"},
{"t": "Nombres et calculs (6e)", "q": "Quel est le critère de divisibilité par 9 ?", "c": ["La somme des chiffres est divisible par 9", "Il est divisible par 3 et pair", "Le nombre contient un 9", "Le nombre finit par 9"], "a": 0, "e": "Comme pour 3 : la somme des chiffres doit être divisible par 9.", "d": "Critère par 9 : <b>somme des chiffres</b> divisible par 9 (le même principe que par 3, mais avec 9).<div class='ex-detail'><u>Exemple rédigé</u> : 7 242 : 7+2+4+2 = 15, pas divisible par 9 (mais divisible par 3) ; 7 242 = 9 × 804,67 non — en fait 15 n'est pas multiple de 9, donc 7242 non plus. Autre exemple : 342 → 9 = multiple de 9 ✓ (342 = 9 × 38). Retenir : multiple de 9 ⟹ automatiquement multiple de 3, mais l'inverse est faux.</div>"},
{"t": "Fractions (6e)", "q": "Combien valent 3/4 de 24 élèves ?", "c": ["6", "8", "18", "16"], "a": 2, "e": "24 ÷ 4 = 6 (un quart), puis 6 × 3 = 18.", "d": "Prendre a/b d'une quantité : <b>diviser par b, multiplier par a</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 24 ÷ 4 = 6 élèves (1/4), puis 6 × 3 = <b>18 élèves</b>. Contrôle : 18/24 = 3/4 ✓. Piège : 24 × 3 = 72 puis ÷ 4 = 18 aussi (autre ordre valable) ; mais 24 ÷ 3 = 8 confond numérateur et dénominateur.</div>"},
{"t": "Fractions (6e)", "q": "Combien vaut 1/4 + 2/3 ?", "c": ["3/12", "11/12", "2/5", "3/7"], "a": 1, "e": "Même dénominateur 12 : 3/12 + 8/12 = 11/12.", "d": "On réduit au <b>même dénominateur</b> (12) : 1/4 = 3/12 et 2/3 = 8/12, puis on additionne les numérateurs : <b>11/12</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 3/12 + 8/12 = 11/12 ≈ 0,917. Contrôle décimal : 0,25 + 0,667 = 0,917 ✓. LE piège du chapitre : 1/2 + 1/3 = (1+1)/(2+3) = 2/5 est FAUX — additionner numérateurs ET dénominateurs séparément ne marche jamais.</div>"},
{"t": "Fractions (6e)", "q": "Quel est le plus grand : 2/3 ou 2/5 ?", "c": ["On ne peut pas savoir", "Égaux (même numérateur)", "2/3", "2/5"], "a": 2, "e": "À numérateur égal, le plus petit dénominateur donne les plus grosses parts : 2/3 > 2/5.", "d": "À numérateur égal, la fraction au <b>plus petit dénominateur</b> est la plus grande : les tiers sont plus gros que les cinquièmes.<div class='ex-detail'><u>Exemple rédigé</u> : 2/3 ≈ 0,667 et 2/5 = 0,4 : 2/3 &gt; 2/5 ✓. Image : 2 parts d'un gâteau coupé en 3, c'est plus que 2 parts du même gâteau coupé en 5. Piège : croire que 5 &gt; 3 entraîne 2/5 &gt; 2/3 — c'est l'inverse !</div>"},
{"t": "Fractions (6e)", "q": "Comparer 5/7 et 3/7.", "c": ["5/7 < 3/7", "Impossible à comparer", "5/7 > 3/7", "Égaux"], "a": 2, "e": "Même dénominateur : on compare les numérateurs, 5 > 3.", "d": "Même dénominateur = mêmes parts : 5 parts sur 7 contre 3 parts sur 7 → <b>5/7 &gt; 3/7</b>.<div class='ex-detail'><u>Exemple</u> : comme 5 pommes &gt; 3 pommes quand les « sacs » sont de même taille. C'est le cas le plus simple de comparaison — pour les autres cas (dénominateurs différents), réduire au même dénominateur d'abord (ex. 2/3 vs 3/5 → 10/15 vs 9/15).</div>"},
{"t": "Fractions (6e)", "q": "Combien vaut 3/4 en nombre décimal ?", "c": ["0,75", "1,33", "0,34", "3,4"], "a": 0, "e": "3/4 = 3 ÷ 4 = 0,75.", "d": "Une fraction est un <b>quotient</b> : a/b = a ÷ b.<div class='ex-detail'><u>Exemple rédigé</u> : 3 ÷ 4 = <b>0,75</b> (car 0,75 × 4 = 3). Fractions à connaître : 1/2 = 0,5 ; 1/4 = 0,25 ; 3/4 = 0,75 ; 1/5 = 0,2 ; 1/10 = 0,1. Piège : 3,4 vient de la confusion « barre = virgule » — non, la barre de fraction signifie DIVISION.</div>"},
{"t": "Fractions (6e)", "q": "Simplifier 6/8.", "c": ["3/4", "2/3", "1/2", "6/8 est déjà simplifié"], "a": 0, "e": "On divise haut et bas par 2 : 6/8 = 3/4.", "d": "Simplifier : diviser <b>numérateur ET dénominateur par un même nombre</b> (ici 2).<div class='ex-detail'><u>Exemple rédigé</u> : 6 ÷ 2 = 3 et 8 ÷ 2 = 4, donc 6/8 = <b>3/4</b> = 0,75 (et 6/8 = 0,75 ✓). Piège : « soustraire 2 partout » (6/8 → 4/6) change la valeur (0,667 ≠ 0,75) ! Seule la multiplication/division des DEUX étages par le même nombre conserve la fraction.</div>"},
{"t": "Fractions (6e)", "q": "7/10 − 2/5 = ?", "c": ["5/5 = 1", "9/10", "3/10", "5/10"], "a": 2, "e": "2/5 = 4/10, donc 7/10 − 4/10 = 3/10.", "d": "Soustraction : <b>réduire au même dénominateur</b> (10) puis soustraire les numérateurs en gardant le dénominateur.<div class='ex-detail'><u>Exemple rédigé</u> : 2/5 = 4/10 (×2 haut et bas) ; 7/10 − 4/10 = <b>3/10</b> = 0,3. Contrôle : 0,7 − 0,4 = 0,3 ✓. Pièges : 5/5 (soustraction des dénominateurs 10 − 5 !) et 9/10 (addition au lieu de soustraction).</div>"},
{"t": "Fractions (6e)", "q": "La fraction 7/4 est…", "c": ["négative", "plus petite que 1", "égale à 1", "plus grande que 1 (elle vaut 1,75)"], "a": 3, "e": "7 > 4 donc 7/4 > 1 : elle vaut exactement 1,75 (1 + 3/4).", "d": "Comparer une fraction à 1 : si le <b>numérateur dépasse le dénominateur</b>, la fraction est plus grande que 1 (fraction « impropre »).<div class='ex-detail'><u>Exemple rédigé</u> : 7/4 = 1 + 3/4 = <b>1,75</b> : une pizza entière et 3 parts d'une seconde. De même 5/5 = 1 exactement et 3/5 < 1. Piège : croire qu'une fraction est « toujours entre 0 et 1 » — faux dès que le numérateur dépasse le dénominateur.</div>"},
{"t": "Fractions (6e)", "q": "Prendre 2/3 de 18 €. On obtient…", "c": ["27 €", "6 €", "9 €", "12 €"], "a": 3, "e": "18 ÷ 3 = 6, puis 6 × 2 = 12 €.", "d": "Fraction d'une quantité : <b>÷ dénominateur, × numérateur</b> — dans cet ordre pour rester avec des entiers.<div class='ex-detail'><u>Exemple rédigé</u> : 18 ÷ 3 = 6 € (un tiers), puis 6 × 2 = <b>12 €</b>. Contrôle : 12/18 = 2/3 ✓ et 12 ≤ 18 ✓. Piège : 18 × 2 = 36 puis 36 ÷ 3 = 12 fonctionne aussi, mais diviser d'abord garde des nombres petits ; prendre 18 × 3 = 54 mélange les rôles.</div>"},
{"t": "Fractions (6e)", "q": "Sur une règle graduée de 0 à 1 partagée en 8, où se place 3/8 ?", "c": ["Impossible à placer", "Au milieu", "À 3,8", "Au 3ᵉ huitième"], "a": 3, "e": "L'unité coupée en 8 : 3/8 est la 3ᵉ graduation (juste avant 0,375 ≈ la moitié).", "d": "Lire une fraction sur une graduation : le <b>dénominateur</b> donne le nombre de parts de l'unité, le <b>numérateur</b> le rang de la graduation.<div class='ex-detail'><u>Exemple rédigé</u> : entre 0 et 1, huit parts égales ; 3/8 se place à la 3ᵉ marque ≈ 0,375. Vérifications amies : 4/8 = 1/2 (le milieu exact !) ; 8/8 = 1. Piège : confondre 3/8 (≈ 0,375) et 3,8 — la fraction n'est pas une décimale « collée ».</div>"},
{"t": "Proportionnalité et pourcentages (6e)", "q": "4 cahiers coûtent 6 €. Combien coûtent 10 cahiers ?", "c": ["10 €", "12 €", "15 €", "16 €"], "a": 2, "e": "1 cahier = 6/4 = 1,5 €, donc 10 × 1,5 = 15 €.", "d": "Passage par l'unité (la bonne méthode 6e) : prix d'UN cahier, puis × 10.<div class='ex-detail'><u>Exemple rédigé</u> : 6 ÷ 4 = 1,5 € le cahier ; 10 × 1,5 = <b>15 €</b>. Contrôle : 6/4 = 15/10 = 1,5 ✓. Piège : 6 + 4 = 10 € (additionner au lieu de raisonner proportionnellement). Ce réflexe « passage par l'unité » servira toute la scolarité.</div>"},
{"t": "Proportionnalité et pourcentages (6e)", "q": "Quel tableau est proportionnel ?", "c": ["2 kg → 6 € et 5 kg → 14 €", "2 kg → 6 € et 5 kg → 15 €", "2 h → 100 km et 5 h → 300 km (à vitesse constante)", "1 L → 2 € et 3 L → 5 €"], "a": 1, "e": "6/2 = 3 et 15/5 = 3 : coefficient constant → proportionnel.", "d": "Test des quotients : tous les rapports ligne/ligne doivent être <b>égaux</b>.<div class='ex-detail'><u>Exemple rédigé</u> : tableau A : 6/2 = 3 et 15/5 = 3 ✓ proportionnel. Tableau B : 6/2 = 3 mais 14/5 = 2,8 ✗. Tableau C : 2/1 = 2 mais 5/3 ≈ 1,67 ✗. Piège du tableau D : 100 km en 2 h = 50 km/h mais 300/5 = 60 km/h : vitesses différentes, PAS proportionnel — l'énoncé « à vitesse constante » était le piège inversé.</div>"},
{"t": "Proportionnalité et pourcentages (6e)", "q": "Combien valent 25 % de 80 € ?", "c": ["40 €", "20 €", "8 €", "25 €"], "a": 1, "e": "25 % = un quart : 80 ÷ 4 = 20 €.", "d": "25 % = <b>le quart</b> : diviser par 4, pas multiplier par 25 !<div class='ex-detail'><u>Exemple rédigé</u> : 80 × 25/100 = 80 × 0,25 = <b>20 €</b> ; plus vite : 80 ÷ 4 = 20. Pourcentages-automatismes : 50 % = ÷2, 25 % = ÷4, 10 % = ÷10, 75 % = 3 × ÷4. Piège : 8 € vient de 80 × 25/100 calculé comme 80 × 0,1 (confusion 10 %/25 %).</div>"},
{"t": "Proportionnalité et pourcentages (6e)", "q": "Un pull à 40 € est soldé à −30 %. Prix soldé ?", "c": ["12 €", "10 €", "30 €", "28 €"], "a": 3, "e": "Remise : 0,3 × 40 = 12 € ; prix soldé : 40 − 12 = 28 € (ou 0,7 × 40).", "d": "Deux étapes : <b>remise</b> (30 % de 40 = 12) puis <b>soustraction</b> (40 − 12) — ou l'astuce directe : payer 70 %.<div class='ex-detail'><u>Exemple rédigé</u> : 0,3 × 40 = 12 € de remise ; 40 − 12 = <b>28 €</b>. Astuce : 0,7 × 40 = 28 directement. Piège : 30 € (40 − 10 %... ou soustraction de 30 !) : le pourcentage est une FRACTION du prix, pas un montant en euros.</div>"},
{"t": "Proportionnalité et pourcentages (6e)", "q": "Que signifie 100 % d'une quantité ?", "c": ["La moitié", "Beaucoup plus que la quantité", "La totalité de la quantité", "Une petite partie"], "a": 2, "e": "100 % = 100/100 = la totalité : 100 % de 60 = 60.", "d": "100 % = 100/100 = 1 : prendre <b>100 % d'une quantité, c'est la prendre entière</b>.<div class='ex-detail'><u>Exemple rédigé</u> : (100/100) × 60 = 60. Repères : 200 % = le double ; 150 % = une fois et demie ; 50 % = la moitié. Piège : croire que 100 % signifie « beaucoup » — en maths, un pourcentage est TOUJOURS une fraction sur 100, et 100/100 = 1 exactement.</div>"},
{"t": "Proportionnalité et pourcentages (6e)", "q": "Un prix augmente de 50 % puis baisse de 50 %. Revient-il au prix initial ?", "c": ["Oui, à condition que le prix soit rond", "Non : il finit à 75 % du prix initial", "Non : il finit à 150 %", "Oui, exactement"], "a": 1, "e": "100 → +50 % → 150 → −50 % (de 150) → 75 : plus bas que le départ !", "d": "Le deuxième pourcentage s'applique au <b>nouveau prix</b>, pas au prix de départ : les variations ne s'annulent pas.<div class='ex-detail'><u>Exemple rédigé</u> : départ 100 €. +50 % : ×1,5 → 150 €. Puis −50 % : la baisse porte sur 150 € : 150 × 0,5 = 75 € de remise → 150 − 75 = <b>75 €</b>, soit 75 % du prix initial. Moralité : les pourcentages successifs se COMPOSENT (× 1,5 puis × 0,5), ils ne s'additionnent pas.</div>"},
{"t": "Proportionnalité et pourcentages (6e)", "q": "Combien valent 10 % de 250 ?", "c": ["25", "2,5", "0,25", "250"], "a": 0, "e": "10 % = diviser par 10 : 250 ÷ 10 = 25.", "d": "10 % = <b>÷ 10</b> (décaler la virgule d'un rang vers la gauche).<div class='ex-detail'><u>Exemple rédigé</u> : 250 × 10/100 = <b>25</b>. Automatisme puissant : de 10 % on déduit tout : 5 % = la moitié de 10 % (12,5), 20 % = le double (50), 30 % = le triple (75). Piège : 2,5 vient d'une division par 100 (confusion avec 1 %).</div>"},
{"t": "Proportionnalité et pourcentages (6e)", "q": "Sur une carte au 1/1000, 1 cm représente…", "c": ["1 m", "10 m", "1000 m", "1 km"], "a": 1, "e": "1 cm × 1000 = 1000 cm = 10 m.", "d": "Échelle 1/1000 : la réalité est <b>1000 fois plus grande</b> que la carte : 1 cm → 1000 cm = <b>10 m</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 1000 cm = 10 m (1 m = 100 cm). Astuce : 1/1000 en cm = m : au 1/100, 1 cm = 1 m ; au 1/1000, 1 cm = 10 m ; au 1/25 000, 1 cm = 250 m. Piège : oublier la conversion cm → m et répondre « 1000 cm » sans unité parlante.</div>"},
{"t": "Proportionnalité et pourcentages (6e)", "q": "5 baguettes coûtent 4,50 €. Combien coûtent 10 baguettes ?", "c": ["4,50 €", "8 €", "22,50 €", "9 €"], "a": 3, "e": "On double la quantité, on double le prix : 4,50 × 2 = 9 €.", "d": "Propriété de proportionnalité : <b>« doubler l'un double l'autre »</b> — pas besoin du coefficient ici !<div class='ex-detail'><u>Exemple rédigé</u> : 10 = 2 × 5, donc prix = 2 × 4,50 = <b>9 €</b>. Autres sauts utiles : ×3 (13,50 € pour 15 baguettes) ; passage par l'unité : 4,50/5 = 0,90 € la baguette. Piège : 22,50 € vient de 4,50 × 5 : on a multiplié le prix par 5 au lieu de raisonner par proportionnalité.</div>"},
{"t": "Proportionnalité et pourcentages (6e)", "q": "75 % d'une classe de 24 élèves représentent…", "c": ["18 élèves", "6 élèves", "16 élèves", "20 élèves"], "a": 0, "e": "75 % = 3/4 : 24 ÷ 4 = 6, puis 6 × 3 = 18 élèves.", "d": "75 % = <b>trois quarts</b> : diviser par 4, multiplier par 3.<div class='ex-detail'><u>Exemple rédigé</u> : 24 × 75/100 = 24 × 0,75 = <b>18</b> ; ou 24 ÷ 4 = 6 (25 %) et 6 × 3 = 18. Contrôle de cohérence : 18 < 24 ✓. Piège : 16 élèves (2/3, soit 67 % : un autre réflexe de fraction) ; bien associer 75 % ↔ 3/4 et 66 % ↔ 2/3.</div>"},
{"t": "Géométrie de base (6e)", "q": "Deux angles complémentaires : l'un mesure 35°. L'autre mesure…", "c": ["90°", "55°", "35°", "145°"], "a": 1, "e": "Complémentaires : 90° − 35° = 55°.", "d": "« Complémentaires » = leur somme vaut <b>90°</b> : l'autre angle vaut 90 − 35 = <b>55°</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 35 + 55 = 90 ✓. Si l'énoncé disait « supplémentaires », ce serait 180 − 35 = 145°. Mnémonique : com-90 (comme « combler l'angle droit »), sup-180 (comme « surface plate »).</div>"},
{"t": "Géométrie de base (6e)", "q": "La somme des angles d'un triangle vaut…", "c": ["90°", "270°", "180°", "360°"], "a": 2, "e": "Quels que soient les côtés : angle1 + angle2 + angle3 = 180°.", "d": "Propriété fondamentale : la somme des angles de TOUT triangle vaut <b>180°</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un triangle avec 50° et 60° connus : le troisième vaut 180 − 110 = <b>70°</b>. Pour le quadrilatère : 360° (deux triangles « collés » : 2 × 180). Piège : confondre 180 (triangle) et 360 (quadrilatère / tour complet).</div>"},
{"t": "Géométrie de base (6e)", "q": "Un triangle a deux angles de 45°. Le troisième mesure…", "c": ["60°", "90°", "45°", "180°"], "a": 1, "e": "180 − 45 − 45 = 90° : le triangle est rectangle.", "d": "Angle manquant : <b>180° − somme des autres</b> = 180 − 90 = <b>90°</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 45 + 45 + 90 = 180 ✓. Bonus : deux angles égaux ⟹ triangle <b>isocèle</b> ; et comme le troisième vaut 90°, il est même « isocèle rectangle ». Piège : oublier de soustraire et répondre 45° par imitation.</div>"},
{"t": "Géométrie de base (6e)", "q": "Quel quadrilatère n'a AUCUN axe de symétrie ?", "c": ["Le losange", "Le carré", "Le rectangle", "Le parallélogramme"], "a": 3, "e": "Le parallélogramme n'a pas d'axe de symétrie (mais un centre de symétrie).", "d": "Axes : rectangle 2, losange 2, carré 4 — le <b>parallélogramme</b> : 0 (seulement une symétrie centrale).<div class='ex-detail'><u>Pourquoi ?</u> Plier un parallélogramme « penché » le long de n'importe quelle droite : les deux parties ne coïncident pas. Mais le tourner d'un demi-tour autour de son centre le fait coïncider avec lui-même : symétrie centrale ✓. C'est la distinction axiale/centrale la plus fréquente aux évaluations.</div>"},
{"t": "Géométrie de base (6e)", "q": "Le diamètre d'un cercle de rayon 5 cm mesure…", "c": ["10 cm", "2,5 cm", "5 cm", "25 cm"], "a": 0, "e": "Diamètre = 2 × rayon = 10 cm.", "d": "Le diamètre traverse tout le cercle en passant par le centre : <b>d = 2r</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 2 × 5 = <b>10 cm</b>. Réciproquement, rayon = diamètre ÷ 2 : un couvercle de 24 cm de diamètre a un rayon de 12 cm. Piège : confondre les deux mots « au bord » : le RAYON va du centre au bord (5), le diamètre fait l'aller-retour (10).</div>"},
{"t": "Géométrie de base (6e)", "q": "Un angle de 120° est…", "c": ["droit", "plat", "aigu", "obtus"], "a": 3, "e": "Entre 90° et 180° : l'angle est obtus.", "d": "Angle aigu &lt; 90° &lt; <b>obtus</b> &lt; 180° (plat).<div class='ex-detail'><u>Exemple rédigé</u> : 120° dépasse l'angle droit (90°) sans atteindre l'angle plat (180°) : obtus. Repères visuels : aigu = « fermé » (30°), droit = coin d'équerre, obtus = « ouvert » (120°), plat = ligne droite. Piège : croire que « obtus = plus grand que 180° » — au-delà de 180° on parle d'un angle rentrant (hors programme).</div>"},
{"t": "Géométrie de base (6e)", "q": "Combien d'axes de symétrie possède un triangle équilatéral ?", "c": ["1", "3", "2", "Aucun"], "a": 1, "e": "Un axe par sommet (et la médiatrice du côté opposé) : 3 axes.", "d": "Chaque sommet « voit » un axe qui le relie au milieu du côté opposé : <b>3 axes</b> pour l'équilatéral.<div class='ex-detail'><u>Exemple rédigé</u> : 3 côtés égaux ⟹ 3 axes de symétrie ; comparaison : isocèle 1 (seul l'axe du sommet principal), scalène 0. Le carré a 4 axes (2 médianes + 2 diagonales) — les figures les plus « régulières » ont le plus de symétries.</div>"},
{"t": "Géométrie de base (6e)", "q": "Dans une symétrie axiale, l'axe (d) est…", "c": ["un côté de [MM′]", "la médiatrice de [MM′]", "le milieu de la figure", "parallèle à [MM′]"], "a": 1, "e": "Le symétrique M′ vérifie : (d) perpendiculaire à [MM′] en son milieu : (d) est la médiatrice de [MM′].", "d": "Symétrie axiale : <b>(d) ⊥ [MM′] et coupe [MM′] en son milieu</b> — la définition même de médiatrice.<div class='ex-detail'><u>Exemple rédigé</u> : pour construire M′ : perpendiculaire à (d) par M, intersection H, reporter HM′ = HM. Deux conséquences : MM′ ⊥ (d) et le point H est le milieu de [MM′]. Piège : croire que M′ est « à la même hauteur » : dans une symétrie oblique, la notion de hauteur n'intervient pas.</div>"},
{"t": "Géométrie de base (6e)", "q": "La symétrie centrale de centre O transforme M en M′ tel que…", "c": ["OM′ = 2 OM", "OM = OM′ et O milieu de [MM′]", "M et M′ sont symétriques par rapport à une droite", "MM′ = OM"], "a": 1, "e": "Symétrie centrale = demi-tour : O est le milieu de [MM′], donc OM = OM′.", "d": "Symétrie centrale : M, O, M′ sont <b>alignés</b> et <b>OM = OM′</b> (O au milieu) : c'est un demi-tour autour de O.<div class='ex-detail'><u>Exemple rédigé</u> : construire M′ : tracer la demi-droite [MO) et reporter OM′ = OM de l'autre côté. La figure obtenue est « retournée » (un 7 devient un reflet tête-bêche) contrairement à la translation. Piège : le symétrique central d'une figure n'a PAS la même orientation « haut-bas » : un triangle pointant vers le haut pointera vers le bas.</div>"},
{"t": "Géométrie de base (6e)", "q": "Quelle figure possède une infinité d'axes de symétrie ?", "c": ["Le carré", "Le triangle équilatéral", "Le rectangle", "Le cercle"], "a": 3, "e": "Chaque diamètre du cercle est un axe de symétrie : il y en a une infinité.", "d": "Le <b>cercle</b> est invariant par pliage le long de n'importe quel diamètre (et par rotation d'un angle quelconque : il a aussi une infinité de symétries de rotation).<div class='ex-detail'><u>Exemple rédigé</u> : pliez un disque en papier le long de n'importe quelle droite passant par le centre : les deux moitiés coïncident. Comparaison : carré 4 axes, rectangle 2, losange 2, isocèle 1, parallélogramme 0. Plus une figure est « ronde » / régulière, plus ses symétries abondent.</div>"},
{"t": "Périmètres et aires (6e)", "q": "Périmètre d'un rectangle de 12 m sur 8 m ?", "c": ["96 m", "20 m", "40 m", "48 m"], "a": 2, "e": "P = 2 × (12 + 8) = 40 m.", "d": "Périmètre du rectangle : <b>2 × (longueur + largeur)</b> = 2 × 20 = <b>40 m</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 12 + 8 + 12 + 8 = 40 ✓. Piège : 96 vient de l'AIRE (12 × 8) — périmètre et aire sont les confondables n°1 du chapitre : le périmètre est un CONTOUR (en m), l'aire une SURFACE (en m²).</div>"},
{"t": "Périmètres et aires (6e)", "q": "Aire d'un triangle de base 8 cm et hauteur 5 cm ?", "c": ["26 cm²", "13 cm²", "40 cm²", "20 cm²"], "a": 3, "e": "A = (8 × 5)/2 = 20 cm².", "d": "Aire du triangle : <b>(base × hauteur) ÷ 2</b> = 40/2 = <b>20 cm²</b>.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi ÷ 2 ? Deux triangles identiques forment un rectangle 8 × 5 = 40 cm² : chaque triangle en occupe la moitié. Attention : la hauteur est PERPENDICULAIRE à la base — pas forcément un côté du triangle. Piège : oublier le ÷ 2 (répondre 40).</div>"},
{"t": "Périmètres et aires (6e)", "q": "Aire d'un disque de rayon 3 cm (valeur exacte) ?", "c": ["28,26 cm", "3π cm²", "6π cm²", "9π cm²"], "a": 3, "e": "A = πr² = 9π cm² (≈ 28,3 cm²).", "d": "Aire du disque : <b>π × r²</b> = π × 9 = <b>9π cm²</b>.<div class='ex-detail'><u>Exemple rédigé</u> : avec r = 3 : r² = 9 (pas 6 !). Pièges : 6π vient de 2πr — qui est le PÉRIMÈTRE (18,8 cm) ; 3π confond r et r². Distinction clé : aire = πr² (cm²), périmètre = 2πr (cm). Vérification d'unité : l'aire se finit toujours en cm².</div>"},
{"t": "Périmètres et aires (6e)", "q": "1 m² vaut combien de cm² ?", "c": ["10 000 cm²", "1 000 000 cm²", "100 cm²", "1 000 cm²"], "a": 0, "e": "1 m = 100 cm, donc 1 m² = 100 × 100 = 10 000 cm².", "d": "Conversions d'aires : on <b>carre l'échelle des longueurs</b> : (100)² = <b>10 000</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 1 m × 1 m = 100 cm × 100 cm = 10 000 cm². Repères : 3,5 m² = 35 000 cm² ; 250 000 cm² = 25 m². Piège : 100 cm² (le réflexe « linéaire » × 100 une fois) — c'est la conversion de 1 dm² vers 1 cm², ou de 0,01 m². Chaque échelon d'aire saute de ×100.</div>"},
{"t": "Périmètres et aires (6e)", "q": "On double les côtés d'un carré. Son aire est multipliée par…", "c": ["2", "8", "16", "4"], "a": 3, "e": "Aire = c² : doubler c multiplie l'aire par 2² = 4.", "d": "L'aire dépend du <b>carré</b> de la longueur : ×2 sur les côtés ⟹ ×4 sur l'aire.<div class='ex-detail'><u>Exemple rédigé</u> : carré de côté 3 : aire 9 ; côté 6 : aire 36 = 4 × 9 ✓. Généralisation (qui prépare Thalès) : longueurs ×k ⟹ aires ×k². Piège : répondre 2 (comme les côtés) ou 8 (réflexe volume ×k³ : celui-là vaut pour les solides).</div>"},
{"t": "Périmètres et aires (6e)", "q": "Un carré de côté 10 cm et un rectangle de 12 cm sur 8 cm : même aire ?", "c": ["Non, le rectangle est plus grand", "Non, le carré est plus grand", "On ne peut pas comparer", "Oui, 100 cm² chacun"], "a": 1, "e": "Carré : 10² = 100 cm² ; rectangle : 12 × 8 = 96 cm² : le carré est plus grand.", "d": "Il faut CALCULER les deux aires avant de comparer : carré <b>100 cm²</b>, rectangle <b>96 cm²</b> — le carré est plus grand.<div class='ex-detail'><u>Exemple rédigé</u> : 10 × 10 = 100 ; 12 × 8 = 96 : différence de 4 cm². Remarque amusante : leurs périmètres sont égaux (40 cm tous les deux !) — à périmètre égal, le carré gagne toujours en aire. Piège de l'intuition : « le rectangle a l'air plus long donc plus grand » — la géométrie décide, pas l'impression visuelle.</div>"},
{"t": "Périmètres et aires (6e)", "q": "Périmètre d'un cercle de rayon 5 cm (arrondi) ?", "c": ["31,4 cm", "78,5 cm", "25 cm", "10π cm = 31,4 cm"], "a": 0, "e": "P = 2πr = 2 × π × 5 = 10π ≈ 31,4 cm.", "d": "Périmètre du cercle (circonférence) : <b>2πr</b> = 10π ≈ <b>31,4 cm</b>.<div class='ex-detail'><u>Exemple rédigé</u> : 2 × 5 = 10, × π ≈ 31,4. Piège : 78,5 est l'AIRE (πr² = 25π ≈ 78,5 cm²). Mémo : périmètre = une LONGUEUR (1 dimension → r), aire = une SURFACE (2 dimensions → r²). Le choix de la formule se lit à l'unité demandée (cm vs cm²).</div>"},
{"t": "Périmètres et aires (6e)", "q": "L'aire d'un rectangle mesure 24 cm² et sa longueur 6 cm. Sa largeur vaut…", "c": ["3 cm", "4 cm", "144 cm", "18 cm"], "a": 1, "e": "l = A/L = 24/6 = 4 cm.", "d": "Formule à l'envers : A = L × l ⟹ <b>l = A ÷ L</b> = 24 ÷ 6 = <b>4 cm</b>.<div class='ex-detail'><u>Exemple rédigé</u> : vérification 6 × 4 = 24 ✓. Ce « raisonnement inverse » vaut pour toutes les formules : périmètre du carré connu ⟹ côté = P/4 ; aire du carré = 49 ⟹ côté = 7. Piège : 18 = 24 − 6 (confusion entre produit et somme) et 144 = 24 × 6 (inversion du sens).</div>"},
{"t": "Périmètres et aires (6e)", "q": "Quelle unité convient pour mesurer l'aire d'une pièce de maison ?", "c": ["Des mètres", "Des mètres carrés", "Des centimètres", "Des litres"], "a": 1, "e": "Une surface se mesure en unités carrées : m² pour une pièce.", "d": "Réflexe d'unité : périmètre/longueur → m ; <b>aire → m²</b> ; volume → m³ (et litres).<div class='ex-detail'><u>Exemple</u> : une chambre de 4 m sur 3 m a une aire de 12 m² (et un périmètre de 14 m pour poser les plinthes). Contexte quotidien : le carrelage se vend au m², la plinthe au mètre linéaire — même pièce, deux unités selon ce qu'on mesure. Piège : « des mètres » pour une aire est LA confusion type du contrôle.</div>"},
{"t": "Nombres relatifs (5e)", "q": "Quel est le plus grand : −5 ou −3 ?", "c": ["−3", "−5", "Ils sont égaux", "On ne peut pas comparer"], "a": 0, "e": "Chez les négatifs, le plus proche de zéro est le plus grand : −3 > −5.", "d": "Ordre des négatifs : <b>−5 &lt; −3</b> car −5 est plus loin de zéro.<div class='ex-detail'><u>Exemple</u> : au thermomètre, −5° est plus froid que −3° : plus petit. Image de la droite graduée : −5 est à GAUCHE de −3, et « à gauche = plus petit ». Piège : raisonner comme sur les positifs (« 5 &gt; 3 donc −5 &gt; −3 ») — le sens s'INVERSE chez les négatifs.</div>"},
{"t": "Nombres relatifs (5e)", "q": "Combien vaut (−6) + (−9) ?", "c": ["−15", "−3", "+3", "+15"], "a": 0, "e": "Même signe : 6 + 9 = 15, signe commun − : −15.", "d": "Même signe → on <b>additionne les distances à zéro</b> (6 + 9 = 15) et on garde le signe commun : <b>−15</b>.<div class='ex-detail'><u>Exemple rédigé</u> : deux dettes de 6 € et 9 € font une dette totale de 15 € : (−6) + (−9) = −15 ✓. Piège : −3 viendrait de la règle des signes contraires (soustraction 9 − 6) : elle ne s'applique pas ici.</div>"},
{"t": "Nombres relatifs (5e)", "q": "Combien vaut (−8) + (+3) ?", "c": ["+11", "−5", "−11", "+5"], "a": 1, "e": "Signes contraires : 8 − 3 = 5, signe du plus loin de zéro (−) : −5.", "d": "Signes contraires → <b>différence des distances à zéro</b> (8 − 3 = 5), signe du plus loin de zéro : −8 est plus loin que +3, donc <b>−5</b>.<div class='ex-detail'><u>Exemple rédigé</u> : partir de −8 sur la droite et AVANCER de 3 : on atteint −5 ✓. Piège : −11 (addition des distances) confondrait avec la règle « même signe ». Contrôle d'ordre de grandeur : le résultat doit se trouver ENTRE −8 et +3.</div>"},
{"t": "Nombres relatifs (5e)", "q": "Combien vaut 3 − (−7) ?", "c": ["−4", "10", "4", "−10"], "a": 1, "e": "3 − (−7) = 3 + (+7) = 10 : soustraire un négatif, c'est ajouter.", "d": "Règle d'or : <b>a − b = a + (−b)</b> : soustraire −7 = ajouter +7 : <b>10</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le « − » de la soustraction followed du « − » du nombre s'annulent : − (−7) = +7. Image : reculer de −7 pas… c'est avancer de 7 pas ! Piège : −4 viendrait de 3 − 7 : on a soustrait +7 au lieu du nombre −7.</div>"},
{"t": "Nombres relatifs (5e)", "q": "Combien vaut −4 − (−6) ?", "c": ["+2", "−2", "−10", "+10"], "a": 0, "e": "−4 − (−6) = −4 + (+6) = +2.", "d": "Transformer la soustraction : <b>−4 + (+6)</b> ; signes contraires : 6 − 4 = 2, signe du plus loin de zéro (+6) : <b>+2</b>.<div class='ex-detail'><u>Exemple rédigé</u> : partant de −4, on enlève une dette de 6 : on s'enrichit de 6 → −4 + 6 = 2 ✓. Piège : −10 (addition naïve −4 − 6). La règle « deux moins qui se suivent = plus » résout tous les cas de ce type.</div>"},
{"t": "Nombres relatifs (5e)", "q": "Quelle est la distance à zéro de −8 ?", "c": ["−8", "0", "8", "±8"], "a": 2, "e": "La distance à zéro est toujours POSITIVE : c'est 8.", "d": "La distance à zéro (future « valeur absolue ») est un nombre de « pas » : <b>8</b>, sans signe.<div class='ex-detail'><u>Exemple rédigé</u> : −8 est à 8 unités de zéro sur la droite graduée. On l'utilise dans les règles d'addition : « on ajoute/soustrait les DISTANCES à zéro », puis on décide du signe séparément. Piège : répondre −8 (confondre le nombre et sa distance) ou ±8 (une distance est unique et positive).</div>"},
{"t": "Nombres relatifs (5e)", "q": "Calculer −7 + 3 − 5 + 12.", "c": ["−23", "+23", "+3", "−3"], "a": 2, "e": "Positifs : 3 + 12 = 15 ; négatifs : −7 − 5 = −12 ; total : 15 − 12 = 3.", "d": "Méthode des regroupements : <b>additionner les positifs entre eux, les négatifs entre eux</b>, puis conclure.<div class='ex-detail'><u>Exemple rédigé</u> : (3 + 12) + (−7 − 5) = 15 + (−12) = <b>+3</b>. Piège : −23 viendrait d'un signe « − » global imaginaire ou d'additions en chaîne hasardeuses. Contrôle : la somme est cohérente avec la droite graduée (de −7 : +3 → −4, −5 → −9, +12 → +3 ✓).</div>"},
{"t": "Nombres relatifs (5e)", "q": "Sur une droite graduée, quel nombre est à gauche de tous les autres ?", "c": ["−0,5", "0", "−2,1", "−1"], "a": 2, "e": "À gauche = le plus petit : −2,1 est le plus éloigné de zéro côté négatif.", "d": "Sur une droite orientée gauche → droite : plus à gauche = plus <b>petit</b> ; −2,1 &lt; −1 &lt; −0,5 &lt; 0.<div class='ex-detail'><u>Exemple rédigé</u> : parmi −1, −0,5, −2,1 et 0 : −2,1 est le plus loin de zéro dans les négatifs, donc le plus à gauche. Astuce : ranger en comptant « combien de pas à gauche de zéro » : 2,1 pas à gauche gagne. Piège : croire que −0,5 (le « plus petit nombre » visuellement) est le plus petit : la DECIMALE ne change pas la règle.</div>"},
{"t": "Nombres relatifs (5e)", "q": "(+8) + (−5) = ?", "c": ["+13", "+3", "−3", "−13"], "a": 1, "e": "Signes contraires : 8 − 5 = 3, signe du plus loin de zéro (+8) : +3.", "d": "Signes contraires : différence des distances (8 − 5 = 3), signe du plus grand éloignement : <b>+3</b>.<div class='ex-detail'><u>Exemple rédigé</u> : gagner 8 € puis dépenser 5 € : il reste 3 € ✓. Comparer avec (+5) + (−8) = −3 : mêmes nombres, ordre inversé → signe inversé. Le signe du résultat dépend du plus loin de zéro, PAS de l'ordre d'écriture.</div>"},
{"t": "Nombres relatifs (5e)", "q": "La température passe de −3 °C à +5 °C. De combien a-t-elle varié ?", "c": ["+8 °C", "+5 °C", "+2 °C", "−8 °C"], "a": 0, "e": "Variation = +5 − (−3) = 5 + 3 = +8 °C.", "d": "Une variation = <b>température finale − initiale</b> : +5 − (−3) = <b>+8 °C</b> (elle a augmenté de 8°).<div class='ex-detail'><u>Exemple rédigé</u> : sur la droite, de −3 à +5, on franchit 3 (jusqu'à 0) puis 5 : 3 + 5 = 8 pas vers la droite. Piège : +2 viendrait de 5 − 3 (on a « soustrait un positif » au lieu du négatif −3). Toute question « écart/variation » entre relatifs est une soustraction déguisée.</div>"},
{"t": "Expressions littérales (5e)", "q": "x + x + x est égal à…", "c": ["3x", "x + 3", "3 + x", "x³"], "a": 0, "e": "Trois sommes de x : x + x + x = 3x.", "d": "La SOMME répétée donne un <b>coefficient</b> : x + x + x = <b>3x</b> ; le PRODUIT répété donne une puissance : x × x × x = x³.<div class='ex-detail'><u>Exemple</u> : avec x = 5 : 5 + 5 + 5 = 15 = 3 × 5 ✓, alors que 5³ = 125. Piège : confondre le nombre de fois où x apparaît avec un exposant. La règle : signe + → coefficient ; signe × → exposant.</div>"},
{"t": "Expressions littérales (5e)", "q": "Simplifier 5 × x + 3 × x.", "c": ["8x", "5x + 3", "15x", "8x²"], "a": 0, "e": "5x + 3x = 8x : on additionne les coefficients.", "d": "D'abord les conventions : 5 × x = 5x et 3 × x = 3x ; puis même nature ⟹ <b>8x</b>.<div class='ex-detail'><u>Exemple rédigé</u> : contrôle avec x = 2 : 5×2 + 3×2 = 10 + 6 = 16 = 8 × 2 ✓. Piège : 15x viendrait de la MULTIPLICATION des coefficients (additionner des « 5x » se fait comme 5 pommes + 3 pommes = 8 pommes).</div>"},
{"t": "Expressions littérales (5e)", "q": "Simplifier 4 × x × 2.", "c": ["4x + 2", "8x", "6x", "8x²"], "a": 1, "e": "Les nombres se multiplient entre eux : 4 × 2 = 8, donc 8x.", "d": "Dans un produit, l'ordre des facteurs ne compte pas : 4 × x × 2 = 4 × 2 × x = <b>8x</b>.<div class='ex-detail'><u>Exemple rédigé</u> : contrôle avec x = 3 : 4 × 3 × 2 = 24 = 8 × 3 ✓. Piège : 6x (addition des nombres 4 + 2) — dans un produit tout se MULTIPLIE. Autres exemples : 2 × 5 × x = 10x ; 3 × x × x = 3x².</div>"},
{"t": "Expressions littérales (5e)", "q": "Quelle écriture est correcte pour « 1 × a » ?", "c": ["1a", "a", "1 + a", "a1"], "a": 1, "e": "1 × a = a : le coefficient 1 ne s'écrit pas.", "d": "Convention : le coefficient 1 est <b>invisible</b> : 1 × a = a (jamais « 1a »).<div class='ex-detail'><u>Exemple</u> : x + x = 1x + 1x = 2x, qu'on écrit simplement x + x = 2x. Autres conventions : le nombre AVANT la lettre (2x, pas x2) ; le signe × disparaît (4c) ; a × 1 = a aussi. Piège : « 1a » se voit encore dans les copies : le coefficient 1 ne s'écrit JAMAIS.</div>"},
{"t": "Expressions littérales (5e)", "q": "Le périmètre d'un rectangle de longueur L et largeur l s'écrit…", "c": ["P = L × l", "P = 4L", "P = 2(L + l)", "P = L + l"], "a": 2, "e": "Deux longueurs et deux largeurs : P = 2(L + l).", "d": "Périmètre = contour : L + l + L + l = <b>2(L + l)</b> (une longueur + une largeur, le tout × 2).<div class='ex-detail'><u>Exemple rédigé</u> : avec L = 8 et l = 3 : 2 × (8 + 3) = 22 ✓ (et non 24 = L × l, qui est l'AIRE). Piège : P = 4L correspond au CARRÉ de côté L. Le test numérique distingue toujours les formules.</div>"},
{"t": "Expressions littérales (5e)", "q": "L'égalité 3x + 2 = 17 est-elle vraie pour x = 5 ?", "c": ["Non : 3×5 = 15 ≠ 17", "Non : 3×5 + 2 = 16", "Cela dépend de l'ordre", "Oui : 3×5 + 2 = 17"], "a": 3, "e": "Membre de gauche : 3 × 5 + 2 = 17 = membre de droite : égalité vraie.", "d": "Tester une égalité : calculer <b>chaque membre séparément</b>, puis comparer.<div class='ex-detail'><u>Exemple rédigé</u> : gauche : 3×5 + 2 = 15 + 2 = 17 ; droite : 17 : 17 = 17, égalité VRAIE pour x = 5. Contre-test avec x = 4 : gauche 14 ≠ 17 : fausse pour 4. Une égalité littérale n'est pas « toujours vraie » : elle dépend de la valeur substituée.</div>"},
{"t": "Expressions littérales (5e)", "q": "Un cahier coûte c euros. Trois cahiers et un stylo à 2 € coûtent…", "c": ["3c + 2", "5c", "3 + c + 2", "3(c + 2)"], "a": 0, "e": "3 cahiers : 3c ; plus le stylo : 3c + 2.", "d": "Traduction : « trois cahiers » = <b>3 × c = 3c</b> ; « et un stylo à 2 € » = + 2 : total <b>3c + 2</b>.<div class='ex-detail'><u>Exemple rédigé</u> : avec c = 4 : 3×4 + 2 = 14 € ✓. Piège : 5c viendrait de l'ADDITION du coefficient (3c + 2c ?) : le stylo n'est pas un cahier, son prix ne se multiplie pas par c. 3(c+2) = 3c + 6 correspondrait à un lot « cahier + stylo » × 3.</div>"},
{"t": "Expressions littérales (5e)", "q": "Quelle expression ne peut PAS être simplifiée davantage ?", "c": ["x + x", "3x + 5", "2 × x", "3x + 5x"], "a": 1, "e": "3x + 5 : un terme en x et un nombre ne s'additionnent pas.", "d": "On ne réduit que les termes de <b>même nature</b> : x et nombres ne se mélangent pas.<div class='ex-detail'><u>Exemple rédigé</u> : x + x = 2x ; 3x + 5x = 8x ; 2 × x = 2x ; mais <b>3x + 5</b> reste tel quel. Image : 3 baguettes et 5 pommes ne font ni 8 baguettes ni 8 pommes. Ce réflexe prépare la réduction d'expressions de 4e.</div>"},
{"t": "Expressions littérales (5e)", "q": "Avec l'expression N = p + 3m, si p = 20 et m = 6, que vaut N ?", "c": ["29", "236", "26", "38"], "a": 3, "e": "N = 20 + 3 × 6 = 20 + 18 = 38 (la multiplication est prioritaire).", "d": "Substitution : remplacer p et m par leurs valeurs, puis <b>priorité de la multiplication</b> sur l'addition.<div class='ex-detail'><u>Exemple rédigé</u> : N = 20 + 3 × 6 = 20 + 18 = <b>38</b>. Piège : (20 + 3) × 6 = 138 : calculer p + 3 d'abord néglige la priorité opératoire ; 26 viendrait de 20 + 6 : il faut remplacer m par 6 dans TOUTE l'expression (3m, pas m).</div>"},
{"t": "Expressions littérales (5e)", "q": "L'aire d'un disque de rayon r s'écrit…", "c": ["πd²", "πr²", "2πr", "r²"], "a": 1, "e": "A = π × r² (alors que le périmètre vaut 2πr).", "d": "Aire du disque : <b>πr²</b> ; périmètre : 2πr — même r, mais l'aire l'élève AU CARRÉ.<div class='ex-detail'><u>Exemple rédigé</u> : avec r = 3 : aire = 9π ≈ 28,3 cm² ; périmètre = 6π ≈ 18,8 cm. Piège : 2πr est la formule de LONGUEUR : elle donne un résultat en cm, jamais en cm². Test d'unité systématique : aire ⟹ un carré de nombres ⟹ r².</div>"},
{"t": "Triangles (5e)", "q": "Deux angles d'un triangle mesurent 47° et 68°. Le troisième mesure…", "c": ["115°", "65°", "95°", "75°"], "a": 1, "e": "180 − (47 + 68) = 180 − 115 = 65°.", "d": "Propriété : somme des angles = <b>180°</b>. Troisième = 180 − 115 = <b>65°</b>.<div class='ex-detail'><u>Exemple rédigé</u> : contrôle : 47 + 68 + 65 = 180 ✓. Piège : 115° serait la somme des deux premiers (arrêté en route) ; 95° = 180 − 68 − 17 mélangerait les valeurs. Toujours refermer le calcul par la vérification « somme = 180 ».</div>"},
{"t": "Triangles (5e)", "q": "Un triangle équilatéral a des angles de…", "c": ["45°", "30°", "90°", "60°"], "a": 3, "e": "180 ÷ 3 = 60° chacun.", "d": "Trois angles égaux : 180 ÷ 3 = <b>60°</b>.<div class='ex-detail'><u>Exemple rédigé</u> : le raisonnement : côtés égaux ⟹ angles égaux ; trois angles identiques qui totalisent 180° : 60° chacun. Piège : 90° (un seul angle droit n'existe que dans le triangle rectangle) ; 45° correspondrait à quatre angles égaux comme dans un rectangle.</div>"},
{"t": "Triangles (5e)", "q": "Dans un triangle rectangle, les deux angles aigus…", "c": ["sont égaux", "mesurent toujours 45°", "sont complémentaires (somme 90°)", "sont supplémentaires (somme 180°)"], "a": 2, "e": "L'angle droit prend 90° : il reste 90° pour les deux aigus.", "d": "L'angle droit = 90° ; les deux aigus se partagent 180 − 90 = <b>90°</b> : ils sont complémentaires.<div class='ex-detail'><u>Exemple rédigé</u> : triangle rectangle avec un aigu de 37° : l'autre vaut 90 − 37 = 53° (contrôle : 37 + 53 + 90 = 180 ✓). Piège : croire qu'ils sont égaux SAUF si le triangle est aussi isocèle (rectangle-isocèle : 45° + 45°).</div>"},
{"t": "Triangles (5e)", "q": "Un triangle isocèle a un angle au sommet de 40°. Ses angles à la base valent…", "c": ["140° chacun", "40° chacun", "60° chacun", "70° chacun"], "a": 3, "e": "180 − 40 = 140, divisé par 2 : 70° chacun.", "d": "Les deux angles à la BASE sont égaux : (180 − 40) ÷ 2 = <b>70°</b> chacun.<div class='ex-detail'><u>Exemple rédigé</u> : contrôle : 40 + 70 + 70 = 180 ✓. Piège : 140° serait la somme des deux (oubli du partage) ; 40° chacun supposerait un triangle équilatéral. Retenir : l'angle au sommet est celui qui est SEUL entre les deux côtés égaux.</div>"},
{"t": "Triangles (5e)", "q": "Peut-on construire un triangle avec 3 cm, 4 cm et 8 cm ?", "c": ["Oui", "Non, car 3 + 4 < 8", "Non, car 3 + 8 < 4", "Oui, car 3 + 4 = 7"], "a": 1, "e": "3 + 4 = 7 < 8 : le plus grand côté dépasse la somme des deux autres.", "d": "Inégalité triangulaire : le plus grand côté (8) doit être PLUS PETIT que la somme des autres (3 + 4 = 7). Or 7 &lt; 8 : <b>impossible</b>.<div class='ex-detail'><u>Exemple rédigé</u> : image des trajets : marcher 3 cm puis 4 cm ne peut pas rapporter plus loin qu'en ligne droite sur 8 cm — on « referme » mal la figure. Piège : choisir 3 + 8 &lt; 4 : on compare TOUJOURS les deux plus petits au plus grand. Cas limite 3 + 4 = 7 avec grand côté 7 : points alignés, pas un triangle.</div>"},
{"t": "Triangles (5e)", "q": "Peut-on construire un triangle avec 5 cm, 7 cm et 11 cm ?", "c": ["Non, car 5 + 7 < 11", "Oui, car 5 + 7 > 11", "Non, car 11 est trop grand", "Oui, car la somme des trois est impaire"], "a": 1, "e": "Plus grand côté : 11 ; 5 + 7 = 12 > 11 : le triangle existe.", "d": "On compare : 5 + 7 = 12 &gt; 11 (le plus grand côté) : le triangle <b>existe</b>.<div class='ex-detail'><u>Exemple rédigé</u> : réflexe : repérer le PLUS GRAND côté (11), additionner les deux autres (12), comparer : 12 &gt; 11 ✓. Piège : s'arrêter à « 11 est grand » sans calcul : c'est la COMPARAISON qui décide, pas l'impression. Entraînement : 5-7-13 ne marche pas (12 &lt; 13).</div>"},
{"t": "Triangles (5e)", "q": "La somme des angles d'un triangle vaut 180°. Et celle d'un quadrilatère ?", "c": ["180°", "540°", "270°", "360°"], "a": 3, "e": "Un quadrilatère se coupe en deux triangles : 2 × 180 = 360°.", "d": "On trace une diagonale : le quadrilatère est partagé en <b>deux triangles</b> : 2 × 180° = <b>360°</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un rectangle : 4 angles de 90° : 4 × 90 = 360° ✓. Généralisation : pentagone = 3 triangles = 540°. Piège : 540° pour le quadrilatère saute une étape (c'est le PENTAGONE). La technique du « découpage en triangles » résout toutes ces questions.</div>"},
{"t": "Triangles (5e)", "q": "Dans un triangle isocèle, quels angles sont forcément égaux ?", "c": ["Les trois angles", "L'angle au sommet et un angle de base", "Aucun", "Les deux angles à la base"], "a": 3, "e": "Isocèle = deux côtés égaux, opposés à deux angles égaux à la base.", "d": "« Isocèle » = deux côtés de même longueur ; les angles ADOSSENT ces côtés (à la base) sont <b>égaux</b>.<div class='ex-detail'><u>Exemple rédigé</u> : si l'angle au sommet vaut 34° : base : (180 − 34)/2 = 73° chacun. Piège : croire que TOUS les angles sont égaux : c'est le triangle ÉQUILATÉRAL (cas très particulier d'isocèle). Le sommet « principal » porte l'angle unique.</div>"},
{"t": "Triangles (5e)", "q": "Un triangle a deux angles de 90° chacun. Que dire du troisième ?", "c": ["45°", "90°", "Impossible à savoir", "0° : ce n'est pas un vrai triangle"], "a": 3, "e": "180 − 90 − 90 = 0° : deux angles droits à eux seuls épuisent les 180°.", "d": "180 − (90 + 90) = <b>0°</b> : le « triangle » serait aplati : <b>inexistant</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un polygone ne peut pas avoir deux angles droits dans un TRIANGLE : la somme serait déjà 180°. D'où : au plus UN angle droit par triangle. Piège : répondre « 90° » en pensant qu'il reste de la place. La propriété 180° est un garde-fou pour TOUTES ces questions d'existence.</div>"},
{"t": "Triangles (5e)", "q": "La médiatrice d'un segment [AB] est…", "c": ["la moitié de [AB]", "une droite parallèle à [AB]", "la droite passant par A et B", "la droite qui coupe [AB] en son milieu perpendiculairement"], "a": 3, "e": "Médiatrice = perpendiculaire au segment en son milieu ; ses points sont équidistants de A et B.", "d": "La médiatrice coupe le segment <b>perpendiculairement en son milieu</b> ; tout point de la médiatrice est à égale distance de A et B.<div class='ex-detail'><u>Exemple rédigé</u> : construction au compas : arcs de même rayon depuis A et B, intersection des arcs = deux points de la médiatrice. Application : situer un point équidistant de deux villes. Piège : la droite (AB) ELLE-MÊME passe par le milieu… mais pas perpendiculairement : elle n'est pas la médiatrice.</div>"},
{"t": "Parallélogrammes (5e)", "q": "ABCD est un parallélogramme avec AB = 5 cm. Que vaut CD ?", "c": ["3 cm", "Impossible à savoir", "5 cm", "10 cm"], "a": 2, "e": "Côtés opposés égaux : CD = AB = 5 cm.", "d": "Dans un parallélogramme, les côtés <b>opposés</b> sont égaux : [CD] fait face à [AB] : <b>5 cm</b>.<div class='ex-detail'><u>Exemple rédigé</u> : piège : 10 cm (addition) ou 3 cm (l'autre côté, si BC = 3 : c'est AD qui vaut 3). Face à AB se trouve CD : le seul réflexe utile est de VISUALISER le quadrilatère ABCD dans l'ordre et de repérer la face cachée.</div>"},
{"t": "Parallélogrammes (5e)", "q": "Que sait-on des diagonales d'un parallélogramme ?", "c": ["Elles sont de même longueur", "Elles se coupent en leur milieu", "Elles sont perpendiculaires", "Elles sont parallèles"], "a": 1, "e": "Propriété : les diagonales d'un parallélogramme se coupent en leur milieu commun.", "d": "Les diagonales d'un parallélogramme se coupent <b>en leur MILIEU</b> (le point d'intersection est le centre de symétrie).<div class='ex-detail'><u>Exemple rédigé</u> : réciproque utile : si IA = IC et IB = ID, alors ABCD est un parallélogramme — c'est LE critère de reconnaissance le plus fréquent. Piège : « même longueur » = RECTANGLE ; « perpendiculaires » = LOSANGE : ces deux propriétés ne sont PAS vraies pour un parallélogramme quelconque.</div>"},
{"t": "Parallélogrammes (5e)", "q": "Un parallélogramme a un angle de 110°. Son angle opposé mesure…", "c": ["180°", "110°", "70°", "90°"], "a": 1, "e": "Angles opposés égaux : 110° (l'angle consécutif, lui, vaudrait 70°).", "d": "Les angles <b>opposés</b> (en face à face) d'un parallélogramme sont égaux : <b>110°</b>.<div class='ex-detail'><u>Exemple rédigé</u> : les angles CONSÉCUTIFS (côte à côte) sont, eux, supplémentaires : 180 − 110 = 70°. Ménage : opposé ⟹ ÉGAL ; consécutif ⟹ SUPPLÉMENTAIRE (somme 180°). Piège : répondre 70° en confondant les deux positions. Contrôle final : 110 + 70 + 110 + 70 = 360° ✓.</div>"},
{"t": "Parallélogrammes (5e)", "q": "Quelles diagonales caractérisent un LOSANGE ?", "c": ["De même longueur", "De même milieu seulement", "Perpendiculaires", "Parallèles"], "a": 2, "e": "Losange : diagonales perpendiculaires (le rectangle a, lui, des diagonales égales).", "d": "<b>Losange ⟹ diagonales PERPENDICULAIRES</b> ; rectangle ⟹ diagonales de MÊME LONGUEUR ; carré ⟹ les deux.<div class='ex-detail'><u>Exemple rédigé</u> : un losange de côté 5 et d'angle 60° a des diagonales 5 et 5√3 ≈ 8,66 : inégales mais bien perpendiculaires. Piège mnémotechnique inversé : « losange ⟹ égales » est FAUX. Toutes les diagonales des quadrilatères de la famille (rectangle, losange, carré, parallélogramme) ont le même milieu.</div>"},
{"t": "Parallélogrammes (5e)", "q": "Lequel de ces quadrilatères n'est PAS un parallélogramme ?", "c": ["Le carré", "Le rectangle", "Le losange", "Le cerf-volant"], "a": 3, "e": "Rectangle, losange et carré sont des parallélogrammes particuliers ; le cerf-volant non.", "d": "Famille : <b>tous</b> rectangles, losanges et carrés SONT des parallélogrammes (cas particuliers). Le <b>cerf-volant</b> n'a que des côtés adjacents égaux : pas de côtés opposés parallèles : il en est exclu.<div class='ex-detail'><u>Exemple rédigé</u> : le cerf-volant a deux paires de côtés ADJACENTS égaux (côte à côte) : ses diagonales sont perpendiculaires mais une seule est coupée en son milieu. Piège : croire que « diagonales perpendiculaires ⟹ losange » : il faut EN PLUS que les diagonales aient le même milieu.</div>"},
{"t": "Parallélogrammes (5e)", "q": "Un quadrilatère a ses diagonales de même longueur ET de même milieu. C'est…", "c": ["un losange", "un parallélogramme quelconque", "un cerf-volant", "un rectangle"], "a": 3, "e": "Même milieu ⟹ parallélogramme ; diagonales égales en plus ⟹ rectangle.", "d": "Étape 1 : diagonales de même milieu ⟹ c'est un <b>parallélogramme</b>. Étape 2 : diagonales de même LONGUEUR ⟹ c'est un <b>rectangle</b>.<div class='ex-detail'><u>Exemple rédigé</u> : un rectangle 8 × 6 : diagonales AC et BD valent toutes deux 10 (Pythagore) et se coupent en leur centre commun ✓. Piège : « losange » : il faudrait des diagonales perpendiculaires ; « quelconque » : les diagonales égales ajoutent une contrainte qui FORCE le rectangle.</div>"},
{"t": "Parallélogrammes (5e)", "q": "Angles consécutifs d'un parallélogramme : que vérifie-t-on si l'un vaut 65° et l'autre 115° ?", "c": ["Leur somme vaut 180°", "Leur différence vaut 50°", "Leur somme vaut 90°", "Leur somme vaut 360°"], "a": 0, "e": "Angles consécutifs supplémentaires : 65 + 115 = 180°.", "d": "Angles consécutifs d'un parallélogramme : <b>somme = 180°</b> (supplémentaires) : 65 + 115 = 180 ✓.<div class='ex-detail'><u>Exemple rédigé</u> : si un angle vaut 65°, les deux angles consécutifs valent 115° chacun, et l'opposé vaut 65°. Contrôle global : 65 + 115 + 65 + 115 = 360° ✓. Piège : « somme 360° » : c'est la somme des QUATRE angles, pas de deux.</div>"},
{"t": "Parallélogrammes (5e)", "q": "L'aire d'un parallélogramme de base 9 cm et de hauteur 4 cm vaut…", "c": ["36 cm²", "26 cm²", "18 cm²", "13 cm²"], "a": 0, "e": "A = base × hauteur = 9 × 4 = 36 cm².", "d": "A = <b>base × hauteur</b> = 9 × 4 = <b>36 cm²</b>.<div class='ex-detail'><u>Exemple rédigé</u> : pourquoi base × hauteur : en « glissant » le coin dépassant vers l'autre côté, le parallélogramme devient un rectangle de mêmes base et hauteur. Piège : 13 = 9 + 4 confond avec un périmètre partiel ; il faut la HAUTEUR (perpendiculaire), pas le côté incliné : avec un côté de 5 incliné, la hauteur réelle serait 4, pas 5.</div>"},
{"t": "Parallélogrammes (5e)", "q": "Pour démontrer qu'un quadrilatère est un parallélogramme, quel argument suffit ?", "c": ["Deux côtés consécutifs égaux", "Deux côtés opposés parallèles et de même longueur", "Un angle droit", "Deux diagonales perpendiculaires"], "a": 1, "e": "Une paire de côtés opposés à la fois parallèles et égaux suffit ; angle droit ou diagonales ⊥ ne suffisent pas.", "d": "Critère suffisant : une paire de côtés <b>opposés parallèles ET de même longueur</b> ; ou des diagonales de même <b>milieu</b> ; ou 4 côtés opposés parallèles deux à deux ; ou angles opposés égaux.<div class='ex-detail'><u>Exemple rédigé</u> : contre-exemples : un trapèze a des côtés parallèles de longueurs DIFFÉRENTES (pas un parallélogramme) ; un cerf-volant peut avoir un angle droit et des diagonales perpendiculaires sans être un parallélogramme. Piège : « deux côtés consécutifs égaux » : c'est la signature du CERF-VOLANT.</div>"},
{"t": "Parallélogrammes (5e)", "q": "Un carré est…", "c": ["un rectangle mais pas un losange", "à la fois un rectangle et un losange", "un losange mais pas un rectangle", "ni l'un ni l'autre"], "a": 1, "e": "Le carré est le cas particulier commun : 4 angles droits ET 4 côtés égaux.", "d": "Carré = <b>rectangle ET losange</b> : 4 angles droits (côtés égaux en plus) et 4 côtés égaux (diagonales perpendiculaires et de même longueur).<div class='ex-detail'><u>Exemple rédigé</u> : ses diagonales cumulent toutes les propriétés : même milieu, même longueur, perpendiculaires (et bissectrices des angles). Piège : le rattacher à une seule famille ferait oublier l'autre : dans un QCM, « à la fois les deux » est la seule réponse complète.</div>"},
{"t": "Statistiques (5e)", "q": "Effectifs : 12 élèves à 3, 8 à 4, 5 à 5. Quel est l'effectif total ?", "c": ["3 valeurs", "20", "12", "25"], "a": 3, "e": "12 + 8 + 5 = 25 élèves.", "d": "Effectif total = <b>somme des effectifs</b> : 12 + 8 + 5 = <b>25</b>.<div class='ex-detail'><u>Exemple rédigé</u> : piège : « 3 » : le nombre de VALEURS distinctes (3, 4, 5) n'est pas un effectif ; on compte les INDIVIDUS, pas les catégories. Applications directes : fréquences et moyennes utilisent toujours ce 25 au dénominateur.</div>"},
{"t": "Statistiques (5e)", "q": "Sur 25 élèves, 12 ont eu 3. Fréquence de la note 3 (en %) ?", "c": ["48 %", "25 %", "12 %", "52 %"], "a": 0, "e": "12 ÷ 25 = 0,48 = 48 %.", "d": "Fréquence = effectif ÷ effectif total = 12 ÷ 25 = 0,48 = <b>48 %</b>.<div class='ex-detail'><u>Exemple rédigé</u> : astuce : 12/25 = 48/100 (multiplier haut et bas par 4). Contrôle global : 48 % + 32 % + 20 % = 100 % ✓. Piège : « 12 % » recopierait l'effectif : un pourcentage ne se lit JAMAIS directement dans le tableau, il se CALCULE.</div>"},
