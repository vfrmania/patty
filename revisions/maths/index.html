    "titre": "Proportionnalité : vitesses, échelles",
    "cours": "<div class=\"cours-head\"><h2>Proportionnalité : vitesses, échelles, pourcentages</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Reconnaître la proportionnalité</h3>\n<ul>\n<li>Deux grandeurs sont <b>proportionnelles</b> si leur quotient est constant (le coefficient) : prix ÷ masse = prix au kg, toujours le même ;</li>\n<li>Test du tableau : les <b>produits en croix</b> sont égaux dans un tableau de proportionnalité ;</li>\n<li>Tableaux « additives mais pas proportionnels » : l'âge et la taille d'un enfant ;</li>\n<li>Sur un graphique, la proportionnalité se traduit par des points <b>alignés avec l'origine</b> : droite passant par (0 ; 0).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Droite proportionnelle\">\n  <line x1=\"40\" y1=\"120\" x2=\"410\" y2=\"120\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"120\" x2=\"40\" y2=\"15\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"120\" x2=\"390\" y2=\"30\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <circle cx=\"135\" cy=\"96\" r=\"4\" fill=\"#4f46e5\"/><circle cx=\"231\" cy=\"72\" r=\"4\" fill=\"#4f46e5\"/><circle cx=\"326\" cy=\"48\" r=\"4\" fill=\"#4f46e5\"/>\n  <text x=\"135\" y=\"112\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">(2 ; 3,5)</text>\n  <text x=\"231\" y=\"88\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">(4 ; 7)</text>\n  <text x=\"326\" y=\"64\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">(6 ; 10,5)</text>\n  <text x=\"330\" y=\"25\" font-size=\"11\" fill=\"#4f46e5\" font-weight=\"bold\">coefficient : 7 ÷ 4 = 1,75</text>\n</svg><span class=\"fig-cap\">Les points s'alignent sur une droite qui passe par l'origine : le quotient y/x vaut partout 1,75, le coefficient de proportionnalité.</span></div>\n\n<h3>2. Vitesse : la star des grandeurs composées</h3>\n<div class=\"tip\"><b>v = d/t</b> (vitesse = distance ÷ durée), et surtout ses variantes : <b>d = v × t</b> et <b>t = d ÷ v</b>. Toujours homogénéiser les unités : km/h avec des heures, m/s avec des secondes (1 m/s = 3,6 km/h).</div>\n<ul>\n<li>Un TGV à 320 km/h pendant 1,5 h : d = 320 × 1,5 = <b>480 km</b> ;</li>\n<li>42 km à 12 km/h (vélo) : t = 42 ÷ 12 = <b>3,5 h</b> = 3 h 30 min (0,5 h = 30 min, pas 50 !) ;</li>\n<li>Conversion : 10 m/s = 10 × 3600 m/h = 36 000 m/h = <b>36 km/h</b> ;</li>\n<li>La vitesse moyenne n'est PAS la moyenne des vitesses : faire l'aller à 60 et le retour à 80 sur la même distance donne une moyenne harmonique, ≈ 68,6 km/h.</li>\n</ul>\n<table>\n<tr><th>Situation</th><th>Formule</th><th>Calcul</th><th>Résultat</th></tr>\n<tr><td>d = 240 km ; t = 3 h</td><td>v = d/t</td><td>240 ÷ 3</td><td>80 km/h</td></tr>\n<tr><td>v = 90 km/h ; t = 2 h 20</td><td>d = v × t</td><td>90 × 2,333</td><td>210 km</td></tr>\n<tr><td>d = 8 km ; v = 5 m/s</td><td>t = d/v</td><td>8000 ÷ 5</td><td>1600 s = 26 min 40 s</td></tr>\n<tr><td>15 min à 20 km/h</td><td>d = v × t</td><td>20 × 0,25</td><td>5 km</td></tr>\n</table>\n\n<h3>3. Échelles : le monde en réduction</h3>\n<ul>\n<li>Échelle = distance sur la carte ÷ distance réelle : 1/25 000 signifie 1 cm ↔ 25 000 cm = 250 m ;</li>\n<li>Carte routière au 1/200 000 : 1 cm = 2 km ; plan de maison au 1/50 : 1 cm = 50 cm ;</li>\n<li>Une échelle n'est PAS une « taille de carte » : c'est un <b>rapport constant</b> entre deux mondes ;</li>\n<li>Grands écarts : maquette au 1/100 : la Tour Eiffel (324 m) devient 3,24 m ;</li>\n<li>Agrandissement possible aussi : microbe dessiné à l'échelle 1 000/1.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Echelle de carte\">\n  <rect x=\"40\" y=\"30\" width=\"200\" height=\"80\" rx=\"6\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"40\" y1=\"70\" x2=\"240\" y2=\"70\" stroke=\"#ef4444\" stroke-width=\"2\" stroke-dasharray=\"6,4\"/>\n  <circle cx=\"40\" cy=\"70\" r=\"4\" fill=\"#ef4444\"/><circle cx=\"240\" cy=\"70\" r=\"4\" fill=\"#ef4444\"/>\n  <text x=\"140\" y=\"60\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\">8 cm sur la carte</text>\n  <text x=\"290\" y=\"55\" font-size=\"12\" fill=\"#1e293b\">au 1/25 000 :</text>\n  <text x=\"290\" y=\"75\" font-size=\"12\" fill=\"#4f46e5\" font-weight=\"bold\">8 × 25 000 cm = 2 km</text>\n  <text x=\"140\" y=\"125\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">multiplier par le dénominateur pour revenir au réel</text>\n</svg><span class=\"fig-cap\">La distance « carte » se convertit en distance réelle en multipliant par le dénominateur de l'échelle — un simple produit en croix.</span></div>\n\n<h3>4. Pourcentages : le retour en force</h3>\n<ul>\n<li>Prendre p % : × p/100 ; augmenter de p % : × (1 + p/100) ; diminuer : × (1 − p/100) ;</li>\n<li>+20 % → ×1,20 ; −15 % → ×0,85 ; +8,5 % → ×1,085 : le <b>coefficient multiplicateur</b> est l'outil universel ;</li>\n<li>Retrouver la valeur initiale : diviser par le coefficient (prix soldé ÷ 0,85 = prix initial) ;</li>\n<li>Problème type : 45 élèves sur 60 ont la moyenne → 45/60 = 0,75 = <b>75 %</b> ;</li>\n<li>Pourcentages successifs : une hausse de 10 % puis une baisse de 10 % ne ramène PAS au point de départ (×1,1 × 0,9 = ×0,99 : −1 %).</li>\n</ul>\n\n<h3>5. Grandeurs composées et conversions pièges</h3>\n<table>\n<tr><th>Grandeur</th><th>Unité</th><th>Équivalence clé</th></tr>\n<tr><td>vitesse</td><td>km/h ; m/s</td><td>1 m/s = 3,6 km/h</td></tr>\n<tr><td>débit</td><td>L/min ; m³/h</td><td>1 m³ = 1000 L</td></tr>\n<tr><td>masse volumique</td><td>g/cm³ ; kg/m³</td><td>1 g/cm³ = 1000 kg/m³</td></tr>\n<tr><td>consommation</td><td>L/100 km</td><td>6 L/100 km = 0,06 L/km</td></tr>\n</table>\n<ul>\n<li>Durée décimale → sexagésimal : 2,4 h = 2 h + 0,4×60 min = 2 h 24 min (jamais 2 h 40 !) ;</li>\n<li>Réciproquement : 1 h 30 = 1,5 h ; 2 h 15 = 2,25 h : la partie après la virgule est une <b>fraction de 60</b> ;</li>\n<li>Réflexe : avant tout calcul, aligner les unités (tout en heures, tout en mètres, tout en litres).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'aller-retour du cycliste</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Léo fait 12 km à 24 km/h, puis les 12 km du retour à 8 km/h (vent de face). Quelle est sa vitesse moyenne sur l'aller-retour ? Est-ce la moyenne de 24 et 8 ?</div><div class=\"etu\"><b>Étape 1 — Durée de l'aller</b> : t₁ = 12 ÷ 24 = 0,5 h (30 min).</div><div class=\"etu\"><b>Étape 2 — Durée du retour</b> : t₂ = 12 ÷ 8 = 1,5 h (1 h 30).</div><div class=\"etu\"><b>Étape 3 — Vitesse moyenne</b> : distance totale 24 km, durée totale 2 h : v = 24 ÷ 2 = <b>12 km/h</b>.</div><div class=\"etu\"><b>Étape 4 — Comparer</b> : la moyenne des vitesses serait (24+8)/2 = 16 km/h : FAUX. La moyenne « honnête » pondère chaque vitesse par sa durée : le retour lent pèse plus. La vitesse moyenne se calcule TOUJOURS par distance totale ÷ durée totale.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la maquette du stade</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un stade rectangulaire de 105 m × 68 m est représenté à l'échelle 1/500. Quelles sont les dimensions de la maquette ? Et l'aire du terrain réel en hectares ?</div><div class=\"etu\"><b>Étape 1 — Convertir en cm</b> : 105 m = 10 500 cm ; 68 m = 6 800 cm.</div><div class=\"etu\"><b>Étape 2 — Appliquer l'échelle</b> : 10 500 ÷ 500 = <b>21 cm</b> ; 6 800 ÷ 500 = <b>13,6 cm</b> : la maquette tient dans une feuille A4.</div><div class=\"etu\"><b>Étape 3 — Aire réelle</b> : 105 × 68 = 7 140 m² = <b>0,714 ha</b> (1 ha = 10 000 m²).</div><div class=\"etu\"><b>Étape 4 — Attention à l'aire de la maquette</b> : 21 × 13,6 = 285,6 cm², et le rapport d'aires est 500² = 250 000 : 285,6 cm² × 250 000 = 71 400 000 cm² = 7 140 m² ✓. Les aires ne suivent PAS l'échelle mais son <b>carré</b> : erreur classique et piège d'examen.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Moyenner des vitesses : la vitesse moyenne = distance totale ÷ durée totale, pas la moyenne des vitesses.</li>\n<li>2,4 h = 2 h 40 : non — 2 h 24 (la décimale est sur 60).</li>\n<li>Confondre échelle « au 1/25 000 » (1 cm = 250 m) et « au 25 000 % » : le premier divise, le second multiplie.</li>\n<li>Les remises successives ne s'additionnent pas : −20 % puis −30 % = ×0,8 ×0,7 = ×0,56, soit −44 %.</li>\n<li>Unités mélangées : km/h avec des minutes — toujours convertir avant de poser d = v × t.</li>\n</ul>\n</div>\n<h3>6. Mélange et concentration : la proportionnalité cachée</h3>\n<ul>\n<li>Une <b>concentration</b> (g/L), un <b>pourcentage</b> de pente, un <b>dosage</b> : chaque fois, un quotient constant structure le problème ;</li>\n<li>Solution de 12 g de sel dans 300 mL : concentration = 12/300 = 0,04 g/mL = 40 g/L ;</li>\n<li>Combien de sel dans 750 mL ? Produit en croix : 0,04 × 750 = <b>30 g</b> ;</li>\n<li>Recette de cuisine, dosage de médicament, mélange de peinture : la vie courante est un livre d'exercices de proportionnalité.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Tableau de proportionnalite sel et eau\">\n  <rect x=\"60\" y=\"20\" width=\"210\" height=\"80\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"135\" y1=\"20\" x2=\"135\" y2=\"100\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n  <line x1=\"205\" y1=\"20\" x2=\"205\" y2=\"100\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n  <line x1=\"60\" y1=\"60\" x2=\"270\" y2=\"60\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n  <text x=\"97\" y=\"48\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">sel (g)</text>\n  <text x=\"170\" y=\"48\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">12</text>\n  <text x=\"237\" y=\"48\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\" font-weight=\"bold\">x</text>\n  <text x=\"97\" y=\"85\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">eau (mL)</text>\n  <text x=\"170\" y=\"85\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">300</text>\n  <text x=\"237\" y=\"85\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\" font-weight=\"bold\">750</text>\n  <path d=\"M 140 75 L 200 35\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <path d=\"M 200 75 L 140 35\" stroke=\"#16a34a\" stroke-width=\"2\" stroke-dasharray=\"5,4\"/>\n  <text x=\"300\" y=\"50\" font-size=\"12\" fill=\"#ef4444\">12 × 750 = 9 000</text>\n  <text x=\"300\" y=\"70\" font-size=\"12\" fill=\"#16a34a\">300 × x = 9 000</text>\n  <text x=\"300\" y=\"90\" font-size=\"12\" fill=\"#1e293b\" font-weight=\"bold\">x = 30 g de sel</text>\n</svg><span class=\"fig-cap\">Le tableau de proportionnalité : l'égalité des produits en croix (12 × 750 = 300 × x) résout la question en une équation.</span></div>\n\n<h3>7. Pourcentages : les pièges des variations</h3>\n<ul>\n<li><b>Coefficient multiplicateur</b> systématique : +t % → ×(1 + t/100) ; −t % → ×(1 − t/100) ;</li>\n<li>Variations successives : ×1,15 puis ×0,90 = ×1,035 : hausse de 15 % puis baisse de 10 % ≈ <b>+3,5 %</b> nettes ;</li>\n<li>Retrouver un pourcentage : après +25 %, le prix final vaut ×1,25 l'initial : initial = final ÷ 1,25 ;</li>\n<li>Points de pourcentage ≠ pourcents : passer de 40 % à 45 % d'opinion, c'est +5 <b>points</b> (et ×45/40 = +12,5 % en relatif) : distinction clé des débats médiatiques.</li>\n</ul>\n<table>\n<tr><th>Parcours</th><th>Coefficients</th><th>Bilan</th></tr>\n<tr><td>+20 % puis −20 %</td><td>1,2 × 0,8 = 0,96</td><td>−4 % (on ne revient pas)</td></tr>\n<tr><td>+50 % puis −50 %</td><td>1,5 × 0,5 = 0,75</td><td>−25 %</td></tr>\n<tr><td>+10 % puis +10 %</td><td>1,1 × 1,1 = 1,21</td><td>+21 % (pas +20 %)</td></tr>\n<tr><td>−25 % puis +33,3 %</td><td>0,75 × 4/3 = 1</td><td>on revient exactement</td></tr>\n</table>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le teaser du vendeur</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un vendeur annonce : « hier +50 % de clients, aujourd'hui −50 % : nous sommes au niveau d'avant-hier ! » Vrai ou faux ? Et avec +80 % puis −80 % ?</div><div class=\"etu\"><b>Étape 1 — Tester avec 100 clients</b> : hier 100, +50 % → 150 ; aujourd'hui −50 % → 75.</div><div class=\"etu\"><b>Étape 2 — Bilan</b> : 75 clients : <b>−25 %</b> par rapport à l'avant-hier : la phrase est fausse.</div><div class=\"etu\"><b>Étape 3 — Avec ±80 %</b> : 100 → 180 → 36 : <b>−64 %</b> ! Plus les pourcentages sont grands, plus la chute relative est sévère.</div><div class=\"etu\"><b>Étape 4 — Expliquer</b> : la baisse s'applique à une base gonflée par la hausse : −50 % de 150 enlève 75 quand +50 % de 100 n'avait ajouté que 50. Les coefficients se multiplient (1,5 × 0,5 = 0,75) : ils ne s'annulent jamais que si leur produit vaut 1.</div></div></details>\n"

    "theme": "Pyramides et cônes (collège)",

    "titre": "Pyramides et cônes : volumes",
    "cours": "<div class=\"cours-head\"><h2>Pyramides et cônes : volumes, patrons</h2><span class=\"niv\">4e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La pyramide : un sommet, une base</h3>\n<ul>\n<li>Une <b>pyramide</b> a une base polygonale (triangle, carré, hexagone...) et un <b>sommet</b> ; ses faces latérales sont des triangles qui se rejoignent au sommet ;</li>\n<li>La <b>hauteur</b> h est perpendiculaire à la base, issue du sommet — ce n'est PAS une arête latérale (sauf cas particulier) ;</li>\n<li>Pyramide <b>régulière</b> : base régulière et sommet « au-dessus du centre » : toutes les arêtes latérales sont égales ;</li>\n<li>Le <b>cône</b> est la version « à base circulaire » : base = disque, face latérale = surface courbe.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Pyramide a base carree et hauteur\">\n  <path d=\"M 90 130 L 230 130 L 185 95 L 45 95 Z\" fill=\"#eef2ff\" fill-opacity=\"0.6\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"45\" y1=\"95\" x2=\"138\" y2=\"30\" stroke=\"#4f46e5\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/>\n  <line x1=\"185\" y1=\"95\" x2=\"138\" y2=\"30\" stroke=\"#4f46e5\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/>\n  <line x1=\"90\" y1=\"130\" x2=\"138\" y2=\"30\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"130\" x2=\"138\" y2=\"30\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <line x1=\"138\" y1=\"25\" x2=\"137.5\" y2=\"112\" stroke=\"#ef4444\" stroke-width=\"2.5\" stroke-dasharray=\"6,4\"/>\n  <circle cx=\"137.5\" cy=\"112\" r=\"2.5\" fill=\"#ef4444\"/>\n  <text x=\"145\" y=\"75\" font-size=\"12\" fill=\"#ef4444\">h ⊥ base</text>\n  <text x=\"130\" y=\"20\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">S</text>\n  <text x=\"290\" y=\"55\" font-size=\"12\" fill=\"#1e293b\">base : carré 8 cm × 8 cm</text>\n  <text x=\"290\" y=\"75\" font-size=\"12\" fill=\"#4f46e5\" font-weight=\"bold\">V = (B × h) / 3</text>\n  <text x=\"290\" y=\"95\" font-size=\"11\" fill=\"#64748b\">h : perpendiculaire à la base</text>\n  <text x=\"290\" y=\"115\" font-size=\"11\" fill=\"#64748b\">B : aire de la base</text>\n</svg><span class=\"fig-cap\">La hauteur (rouge) tombe perpendiculairement au centre de la base ; le volume est le tiers du prisme de même base et hauteur.</span></div>\n\n<h3>2. Les formules de volume</h3>\n<div class=\"tip\"><b>Pyramide</b> : V = (aire de la base × hauteur) ÷ 3. <b>Cône</b> : V = (π × r² × h) ÷ 3. Le « ÷3 » est la signature des pointes : trois pyramides identiques remplissent exactement le prisme/cylindre de même base et hauteur.</div>\n<table>\n<tr><th>Solide</th><th>Base</th><th>Hauteur</th><th>Volume</th></tr>\n<tr><td>pyramide à base carrée</td><td>carré 6×6 (B = 36)</td><td>h = 10</td><td>36 × 10 ÷ 3 = 120</td></tr>\n<tr><td>pyramide à base carrée</td><td>carré 9×9 (B = 81)</td><td>h = 4</td><td>81 × 4 ÷ 3 = 108</td></tr>\n<tr><td>pyramide à base triangulaire</td><td>triangle (B = 15)</td><td>h = 6</td><td>15 × 6 ÷ 3 = 30</td></tr>\n<tr><td>cône</td><td>r = 3 (B = 9π ≈ 28,3)</td><td>h = 7</td><td>9π × 7 ÷ 3 = 21π ≈ 66 cm³</td></tr>\n<tr><td>cône</td><td>r = 5 (B = 25π)</td><td>h = 12</td><td>25π × 12 ÷ 3 = 100π ≈ 314 cm³</td></tr>\n</table>\n<ul>\n<li>Unités : longueurs en cm → volume en cm³ ; 1 L = 1 dm³ = 1 000 cm³ ;</li>\n<li>Vérification d'ordre de grandeur : le volume d'une pyramide doit être <b>plus petit</b> que celui du prisme correspondant (B × h) : si on trouve plus, le ÷3 a été oublié.</li>\n</ul>\n\n<h3>3. Le tiers qui change tout : la preuve par l'eau</h3>\n<ul>\n<li>Expérience : remplir un cône d'eau, le vider dans le cylindre de même rayon et hauteur → il faut <b>trois cônes</b> pour remplir le cylindre ;</li>\n<li>C'est l'origine du ÷3 : pyramides et cônes « pincent » leur prisme/cylindre de départ ;</li>\n<li>Conséquence inverse : le prisme tient trois fois la pyramide de même base et hauteur ;</li>\n<li>Exemple de contrôle : base 50 cm², hauteur 12 cm → prisme 600 cm³, pyramide 200 cm³ : exactement le tiers.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Trois pyramides remplissent le prisme\">\n  <polygon points=\"30,115 90,115 60,40\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <polygon points=\"95,115 155,115 125,40\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <polygon points=\"160,115 220,115 190,40\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <rect x=\"250\" y=\"40\" width=\"80\" height=\"75\" fill=\"#c7d2fe\" fill-opacity=\"0.6\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <text x=\"125\" y=\"128\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">3 pyramides identiques</text>\n  <text x=\"290\" y=\"128\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">= 1 prisme</text>\n  <path d=\"M 232 78 L 245 78\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <text x=\"355\" y=\"75\" font-size=\"12\" fill=\"#ef4444\" font-weight=\"bold\">V(prisme) = 3 × V(pyramide)</text>\n</svg><span class=\"fig-cap\">Trois pyramides de même base et hauteur composent exactement le prisme : d'où le division par 3 dans la formule du volume.</span></div>\n\n<h3>4. Patrons : déplier les solides</h3>\n<ul>\n<li>Le <b>patron</b> est le solide déplié à plat : une pyramide régulière à base carrée = 1 carré + 4 triangles isocèles identiques ;</li>\n<li>Cône : un disque (base) + un secteur de disque (face latérale) dont le rayon = la distance sommet-bord (génératrice) ;</li>\n<li>Le périmètre du secteur doit égaler le périmètre du cercle de base : c'est la « couture » qui se referme ;</li>\n<li>Construire un patron est la meilleure façon de VÉRIFIER sa vision 3D : si le patron se referme sans trou ni chevauchement, la figure est correcte.</li>\n</ul>\n<table>\n<tr><th>Solide</th><th>Éléments du patron</th><th>Contrôle de fermeture</th></tr>\n<tr><td>pyramide (base carrée 4 cm, arêtes latérales 6 cm)</td><td>1 carré + 4 triangles isocèles (base 4, côtés 6)</td><td>les bases des triangles = les côtés du carré</td></tr>\n<tr><td>cône (r = 2, génératrice 5)</td><td>disque r = 2 + secteur de rayon 5</td><td>arc du secteur = 2π×2 ≈ 12,6 cm</td></tr>\n</table>\n\n<h3>5. Sections planes : couper les solides</h3>\n<ul>\n<li>Couper une pyramide parallèlement à la base → une <b>réduction</b> de la base (même forme, tailles réduites) ;</li>\n<li>La petite pyramide découpée est une <b>réduction</b> de la grande : rapport k des longueurs → rapport k² des aires, k³ des volumes ;</li>\n<li>Couper un cône parallèlement à la base : petit disque ; par l'axe : triangle isocèle ;</li>\n<li>C'est la naissance des « sections de solides » qui domineront la 3e et le lycée (sphère, cylindre...).</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le sorbet du glacier</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un cornet conique a un rayon de 3 cm et une hauteur de 12 cm. Quelle contenance en cL ? Le glacier double le rayon en gardant la hauteur : nouvelle contenance ?</div><div class=\"etu\"><b>Étape 1 — Volume initial</b> : V = πr²h ÷ 3 = π × 9 × 12 ÷ 3 = 36π ≈ <b>113 cm³</b>, soit environ 11,3 cL (1 cL = 10 cm³).</div><div class=\"etu\"><b>Étape 2 — Rayon doublé</b> : r = 6 : V' = π × 36 × 12 ÷ 3 = 144π ≈ 452 cm³.</div><div class=\"etu\"><b>Étape 3 — Comparer</b> : 452 ÷ 113 = 4 : la contenance a été multipliée par <b>4</b> !</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : le volume dépend du carré du rayon : doubler r multiplie le volume par 4 (et tripler par 9). Le glacier qui élargit ses cornets gagne bien plus qu'il ne croit — ou facture bien plus que le cône ne coûte.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la pyramide du Louvre réduite</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> La pyramide du Louvre : base carrée de 35 m de côté, hauteur 21,6 m. Volume ? Une maquette au 1/100 : volume de la maquette ?</div><div class=\"etu\"><b>Étape 1 — Aire de la base</b> : B = 35 × 35 = 1 225 m².</div><div class=\"etu\"><b>Étape 2 — Volume réel</b> : V = 1 225 × 21,6 ÷ 3 = 1 225 × 7,2 = <b>8 820 m³</b> (l'équivalent de 4 piscines olympiques).</div><div class=\"etu\"><b>Étape 3 — Maquette 1/100</b> : longueurs ÷100 → volume ÷100³ = ÷1 000 000 : V' = 8 820 ÷ 10⁶ = <b>0,00882 m³</b>, soit 8,82 litres.</div><div class=\"etu\"><b>Étape 4 — Contrôle par les longueurs</b> : base 35 cm, hauteur 21,6 cm : V' = 0,35² × 0,216 ÷ 3 ≈ 0,0088 m³ ✓. Le volume suit le <b>cube</b> de l'échelle : les longueurs se réduisent doucement, les volumes s'effondrent.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Oublier le ÷3 : pyramide = UN TIERS du prisme, jamais la moitié.</li>\n<li>Prendre une arête latérale pour la hauteur : la hauteur est perpendiculaire à la base (sauf indication).</li>\n<li>Réduire les volumes comme les longueurs : maquette au 1/10 → volume ÷ 1000, pas ÷ 10.</li>\n<li>Cône : utiliser le diamètre dans πr²h/3 — vérifier r = d/2.</li>\n<li>Unités : 1 L = 1 dm³ = 1000 cm³ — un résultat « en litres » calculé depuis des cm doit être divisé par 1000.</li>\n</ul>\n</div>\n<h3>6. La sphère en avant-première : la grande formule</h3>\n<div class=\"tip\"><b>Sphère de rayon r</b> : volume V = (4/3) × π × r³ ; aire A = 4πr². Curiosité : l'aire est exactement celle de 4 grands disques de même rayon (4 × πr²).</div>\n<ul>\n<li>Balle de rayon 3 cm : V = (4/3)π×27 ≈ 113 cm³ ; A = 4π×9 ≈ 113 cm² — les deux « 113 » coïncident pour r = 3, pur hasard numérique ;</li>\n<li>La sphère est la forme qui <b>maximise le volume pour une aire donnée</b> : gouttes, bulles, planètes la retrouvent toutes seules (physique) ;</li>\n<li>Section d'une sphère par un plan : toujours un <b>cercle</b> (les parallèles de la Terre) ; grand cercle si le plan passe par le centre (équateur) ;</li>\n<li>La Terre (r ≈ 6 371 km) : V ≈ 1,08 × 10¹² km³, A ≈ 5,1 × 10⁸ km² — l'ordre de grandeur se calcule avec les puissances de 10.</li>\n</ul>\n<table>\n<tr><th>Solide</th><th>Formule volume</th><th>Formule aire</th><th>r = 2 : volume</th></tr>\n<tr><td>sphère</td><td>(4/3)πr³</td><td>4πr²</td><td>≈ 33,5 cm³</td></tr>\n<tr><td>cylindre (h = 2r)</td><td>πr²h</td><td>2πr² + 2πrh</td><td>≈ 50,3 cm³</td></tr>\n<tr><td>cône (h = 2r)</td><td>πr²h/3</td><td>πr² + πr√(r²+h²)</td><td>≈ 16,7 cm³</td></tr>\n</table>\n<ul>\n<li>À même rayon et même hauteur : sphère &lt; cylindre... pour h = 2r, la sphère occupe les 2/3 du cylindre circonscrit ; le cône en occupe le tiers : 1/3 &lt; 2/3 &lt; 1, la hiérarchie des volumes se lit d'un coup.</li>\n</ul>\n\n<h3>7. Visions dans l'espace : les bons réflexes</h3>\n<ul>\n<li>Toujours <b>redessiner</b> la figure en perspective cavalière (faces avant réelles, fuyantes à 45° réduites) ;</li>\n<li>Repérer les <b>triangles rectangles</b> cachés (hauteur, génératrice, rayon : Pythagore relie tout) : génératrice du cône : g = √(r² + h²) ;</li>\n<li>Une seule formule par problème, mais trois contrôles : unités, ordre de grandeur, cas particulier (r = 0 ou h = 0 doit donner 0) ;</li>\n<li>Le volume du cône avec g (génératrice) au lieu de h est une erreur classique : g sert pour l'aire latérale (πrg), h pour le volume.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — la boule de pétanque et le cylindre d'eau</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une boule de rayon 4 cm est plongée dans un récipient cylindrique (rayon 6 cm) contenant de l'eau. De combien le niveau monte-t-il ?</div><div class=\"etu\"><b>Étape 1 — Volume de la boule</b> : V = (4/3)πr³ = (4/3)π × 64 ≈ 268 cm³.</div><div class=\"etu\"><b>Étape 2 — Volume « déplacé »</b> : la boule immergée chasse son volume d'eau : 268 cm³ doivent se loger dans le cylindre.</div><div class=\"etu\"><b>Étape 3 — Hauteur équivalente</b> : section du cylindre : π × 36 ≈ 113 cm² ; montée : h = 268 ÷ 113 ≈ <b>2,4 cm</b>.</div><div class=\"etu\"><b>Étape 4 — Contrôler</b> : le diamètre de la boule (8 cm) dépasse 2,4 cm — pas de contradiction : la boule est simplement partiellement émergée au début ; une fois immergée, la montée est fixée par les volumes. Combiner sphère et cylindre dans un même raisonnement : c'est le niveau « expert » des volumes.</div></div></details>\n"
  },

    "titre": "Théorème de Thalès et sa réciproque",
    "cours": "<div class=\"cours-head\"><h2>Théorème de Thalès et sa réciproque</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. La configuration : deux triangles emboîtés</h3>\n<ul>\n<li>Deux droites <b>sécantes</b> en un point A, coupées par <b>deux droites parallèles</b> (BC) et (EF) : c'est la « configuration de Thalès » ;</li>\n<li>On obtient deux triangles ABC et AEF qui « s'emboîtent », le petit dans le grand ;</li>\n<li>Thalès traduit la réduction : les côtés du petit triangle sont proportionnels à ceux du grand ;</li>\n<li>Le sommet commun A est le <b>centre de réduction</b> : tout passe par lui.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Configuration de Thales triangle\">\n  <line x1=\"215\" y1=\"25\" x2=\"80\" y2=\"150\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <line x1=\"215\" y1=\"25\" x2=\"350\" y2=\"150\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <circle cx=\"215\" cy=\"25\" r=\"4\" fill=\"#ef4444\"/><text x=\"215\" y=\"18\" font-size=\"13\" fill=\"#ef4444\" font-weight=\"bold\" text-anchor=\"middle\">A</text>\n  <circle cx=\"154\" cy=\"81\" r=\"4\" fill=\"#4f46e5\"/><text x=\"141\" y=\"77\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">B</text>\n  <circle cx=\"276\" cy=\"81\" r=\"4\" fill=\"#4f46e5\"/><text x=\"283\" y=\"77\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">C</text>\n  <circle cx=\"80\" cy=\"150\" r=\"4\" fill=\"#16a34a\"/><text x=\"68\" y=\"160\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">E</text>\n  <circle cx=\"350\" cy=\"150\" r=\"4\" fill=\"#16a34a\"/><text x=\"356\" y=\"160\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">F</text>\n  <line x1=\"154\" y1=\"81\" x2=\"276\" y2=\"81\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <line x1=\"80\" y1=\"150\" x2=\"350\" y2=\"150\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <text x=\"215\" y=\"150\" font-size=\"12\" fill=\"#16a34a\" text-anchor=\"middle\">(EF)</text>\n  <text x=\"215\" y=\"68\" font-size=\"12\" fill=\"#4f46e5\" text-anchor=\"middle\">(BC) ∥ (EF)</text>\n  <text x=\"215\" y=\"42\" font-size=\"13\" fill=\"#ef4444\" font-weight=\"bold\" text-anchor=\"middle\">AB/AE = AC/AF = BC/EF</text>\n</svg><span class=\"fig-cap\">Configuration « triangle » : A est le sommet commun, (BC) ∥ (EF). Les rapports de côtés emboîtés sont tous égaux — c'est le théorème.</span></div>\n\n<h3>2. Le théorème : calculer une longueur</h3>\n<div class=\"tip\"><b>Théorème de Thalès</b> : si (BC) ∥ (EF), alors AB/AE = AC/AF = BC/EF (en partant du sommet commun A, dans le même ordre). Trois rapports, une seule valeur : le rapport de réduction.</div>\n<ul>\n<li>Méthode : repérer les deux triangles (sommet commun + parallèles), écrire les rapports, remplacer les valeurs connues, calculer la longueur manquante par <b>produit en croix</b> ;</li>\n<li>Exemple : AB = 3, AE = 7, AC = 4, AF = ? → 3/7 = 4/AF → AF = 7×4÷3 ≈ 9,3 ;</li>\n<li>Toujours partir du <b>sommet commun</b> pour écrire les rapports : c'est la protection n°1 contre les erreurs de placement.</li>\n</ul>\n<table>\n<tr><th>Données</th><th>Rapport écrit</th><th>Calcul</th><th>Résultat</th></tr>\n<tr><td>AB = 2 ; AE = 6 ; AC = 5 ; AF = ?</td><td>2/6 = 5/AF</td><td>AF = 6×5/2</td><td>AF = 15</td></tr>\n<tr><td>AB = 4 ; AE = 10 ; BC = 3 ; EF = ?</td><td>4/10 = 3/EF</td><td>EF = 10×3/4</td><td>EF = 7,5</td></tr>\n<tr><td>AE = 9 ; AB = 3 ; EF = 12 ; BC = ?</td><td>3/9 = BC/12</td><td>BC = 3×12/9</td><td>BC = 4</td></tr>\n</table>\n\n<h3>3. La réciproque : prouver le parallélisme</h3>\n<ul>\n<li><b>Réciproque</b> : si AB/AE = AC/AF (deux rapports égaux, côtés pris dans le même ordre depuis le sommet), alors <b>(BC) ∥ (EF)</b> ;</li>\n<li>Méthode : calculer les deux rapports séparément, comparer (fractions égales ?), conclure ;</li>\n<li>Exemple : AB/AE = 2/5 = 0,4 et AC/AF = 3/7,5 = 0,4 : rapports égaux → droites parallèles ;</li>\n<li><b>Attention</b> : si les rapports sont différents, on conclut « les droites ne sont PAS parallèles » (contraposée) — jamais on ne calcule une longueur dans ce cas.</li>\n</ul>\n<div class=\"warn\"><b>L'ordre des points compte</b> : la réciproque exige que les rapports soient formés « dans le même ordre » (le point le plus proche du sommet en haut). Renverser le rapport (AE/AB) sans le faire partout est l'erreur la plus fréquente.</div>\n\n<h3>4. Les applications : cartes, ombres, hauteurs</h3>\n<ul>\n<li><b>Hauteur d'un immeuble</b> : un bâton vertical de 1 m a une ombre de 0,8 m ; l'immeuble, une ombre de 24 m : hauteur = 24 × 1 ÷ 0,8 = <b>30 m</b> (rayons du Soleil parallèles → Thalès) ;</li>\n<li><b>Profondeur d'un lac</b> : un roseau, un point de vue, la ligne de visée : le « triangle des reflets » est thalésien ;</li>\n<li><b>Réductions</b> : un triangle et son agrandissement de rapport 2,5 : toutes les longueurs suivent, y compris les hauteurs ;</li>\n<li><b>Trapezes et papier</b> : plier une feuille en trois marque des configurations de Thalès au pli.</li>\n</ul>\n\n<h3>5. Agrandissement-réduction : effets sur aires et volumes</h3>\n<table>\n<tr><th>Rapport k</th><th>Longueurs</th><th>Aires</th><th>Volumes</th></tr>\n<tr><td>k = 2</td><td>×2</td><td>×4</td><td>×8</td></tr>\n<tr><td>k = 3</td><td>×3</td><td>×9</td><td>×27</td></tr>\n<tr><td>k = 0,5</td><td>÷2</td><td>÷4</td><td>÷8</td></tr>\n<tr><td>k quelconque</td><td>×k</td><td>×k²</td><td>×k³</td></tr>\n</table>\n<ul>\n<li>Le rapport de Thalès est ce rapport k : les triangles emboîtés sont semblables ;</li>\n<li>Aires ×k² : une carte au 1/100 a des aires ÷10 000 ;</li>\n<li>Volumes ×k³ : une maquette au 1/10 a des volumes ÷1000 — la règle des échelles se décline en trois dimensions.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — mesurer la hauteur d'un arbre avec un bâton</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Enzo plante un bâton de 1,5 m droit dans le sol : son ombre mesure 2 m. Au même moment, l'ombre de l'arbre mesure 14 m. Quelle est la hauteur de l'arbre ? Et si l'ombre de l'arbre est confondue avec son pied (Soleil au zénith) ?</div><div class=\"etu\"><b>Étape 1 — Justifier la configuration</b> : les rayons du Soleil sont parallèles, donc les triangles (bâton, ombre) et (arbre, ombre) sont emboîtés en Thalès.</div><div class=\"etu\"><b>Étape 2 — Écrire les rapports</b> : hauteur_bâton / hauteur_arbre = ombre_bâton / ombre_arbre : 1,5/h = 2/14.</div><div class=\"etu\"><b>Étape 3 — Produit en croix</b> : h = 1,5 × 14 ÷ 2 = <b>10,5 m</b>.</div><div class=\"etu\"><b>Étape 4 — Cas limite</b> : Soleil au zénith : ombre nulle, Thalès inapplicable (rapports 0/0 indéterminés) — la méthode exige une ombre non nulle. Astuce des géomètres en cas de Soleil bas : utiliser un miroir posé au sol et la ligne de visée réfléchie : mêmes triangles, mêmes rapports.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — les droites sont-elles parallèles ? (réciproque)</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> A, M, B alignés et A, N, C alignés (M entre A et B, N entre A et C). AM = 3, AB = 7,5, AN = 4, AC = 11. (MN) est-elle parallèle à (BC) ?</div><div class=\"etu\"><b>Étape 1 — Écrire les deux rapports dans le même ordre</b> : AM/AB = 3/7,5 = 0,4 ; AN/AC = 4/11 ≈ 0,364.</div><div class=\"etu\"><b>Étape 2 — Comparer</b> : 0,4 ≠ 0,364 — les rapports diffèrent (en valeurs exactes : 3/7,5 = 2/5 et 4/11, irréductibles et distincts).</div><div class=\"etu\"><b>Étape 3 — Conclure</b> : par contraposée de la réciproque, <b>(MN) n'est pas parallèle</b> à (BC).</div><div class=\"etu\"><b>Étape 4 — Si AC avait valu 10</b> : AN/AC = 4/10 = 0,4 = AM/AB : rapports égaux → parallèles. Un dixième d'écart change la conclusion : c'est pourquoi on compare des valeurs exactes (fractions réduites), jamais des arrondis approximatifs.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Écrire les rapports sans partir du sommet commun : toujours AB/AE (A d'abord), jamais AB/EA renversé d'un seul côté.</li>\n<li>Utiliser Thalès sans les parallèles : la configuration exige (BC) ∥ (EF) — sinon les rapports n'existent pas.</li>\n<li>Points non alignés dans l'ordre : si M n'est pas entre A et B, la configuration « croisée » change l'écriture des rapports.</li>\n<li>Comparer des rapports arrondis pour la réciproque : travailler en valeurs exactes.</li>\n<li>Aires ×k et volumes ×k² : c'est aires ×k², volumes ×k³ — les exposants doublent puis triplent.</li>\n</ul>\n</div>\n\n<h3>6. Thalès et configurations remarquables : milieux, droites des milieux</h3>\n<ul>\n<li><b>Droite des milieux</b> : dans un triangle, si un segment joint les milieux de deux côtés, il est <b>parallèle</b> au troisième et mesure la <b>moitié</b> de celui-ci : cas particulier de Thalès avec rapport 1/2 ;</li>\n<li>Réciproquement, la droite passant par le milieu d'un côté et parallèle à un autre côté coupe le troisième en son milieu : Thalès au service des milieux ;</li>\n<li>Papillon (droites sécantes « vues de l'autre côté ») : même théorème, mais les triangles se chevauchent — la rédaction des rapports reste identique ;</li>\n<li>Plusieurs configurations emboîtées : si (BC) ∥ (EF) ∥ (GH) sur les mêmes sécantes, tous les rapports restent cohérents : AB/AE = AC/AF et AE/AG = AF/AH.</li>\n</ul>\n<table>\n<tr><th>Configuration</th><th>Sécantes en</th><th>Parallèles</th><th>Rapport type</th></tr>\n<tr><td>Triangle</td><td>A</td><td>(BC) ∥ (EF)</td><td>AB/AE = AC/AF = BC/EF</td></tr>\n<tr><td>Papillon</td><td>A (croisement)</td><td>(BC) ∥ (EF)</td><td>mêmes rapports, ordre inversé sur une branche</td></tr>\n<tr><td>Des milieux</td><td>sommet du triangle</td><td>segment des milieux</td><td>rapport 1/2</td></tr>\n</table>\n<ul>\n<li>Cordes d'un cercle entre deux sécantes issues d'un même point : puissance d'un point, en 2de ;</li>\n<li>En pratique : face à une figure chargée, toujours <b>colorier</b> les deux triangles concernés avant d'écrire les rapports.</li>\n</ul>"

    "titre": "Trigonométrie dans le triangle rectangle",
    "cours": "<div class=\"cours-head\"><h2>Trigonométrie dans le triangle rectangle</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Cosinus, sinus, tangente : trois rapports d'angle</h3>\n<div class=\"tip\"><b>SOH-CAH-TOA</b> (moyen mnémotechnique) :\n<b>S</b>inus = <b>O</b>pposé / <b>H</b>ypoténuse ; <b>C</b>osinus = <b>A</b>djacent / <b>H</b>ypoténuse ; <b>T</b>angente = <b>O</b>pposé / <b>A</b>djacent.\nCes rapports ne dépendent <b>que de l'angle</b>, pas de la taille du triangle : tous les triangles rectangles d'un même angle aigu ont les mêmes cosinus/sinus/tangente.</div>\n<ul>\n<li>L'<b>opposé</b> est le côté en face de l'angle étudié ; l'<b>adjacent</b> le côté qui le touche (sans être l'hypoténuse) ;</li>\n<li>Repère visuel : se placer à l'angle, pointer l'hypoténuse (le grand côté), puis classer les deux autres ;</li>\n<li>Le repère change selon l'angle choisi : le côté opposé de l'un est l'adjacent de l'autre.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Triangle rectangle cos sin tan\">\n  <path d=\"M 60 130 L 300 130 L 60 40 Z\" fill=\"#eef2ff\" fill-opacity=\"0.5\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <rect x=\"60\" y=\"114\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <text x=\"50\" y=\"35\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">B</text>\n  <text x=\"310\" y=\"140\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">C</text>\n  <text x=\"50\" y=\"140\" font-size=\"13\" fill=\"#1e293b\" font-weight=\"bold\">A</text>\n  <path d=\"M 284 130 A 16 16 0 0 0 282 118\" fill=\"#16a34a\" fill-opacity=\"0.4\"/>\n  <text x=\"262\" y=\"122\" font-size=\"12\" fill=\"#16a34a\">α</text>\n  <text x=\"180\" y=\"75\" font-size=\"12\" fill=\"#ef4444\" text-anchor=\"middle\">hypoténuse</text>\n  <text x=\"180\" y=\"145\" font-size=\"12\" fill=\"#f59e0b\" text-anchor=\"middle\">adjacent de α</text>\n  <text x=\"38\" y=\"88\" font-size=\"12\" fill=\"#4f46e5\" transform=\"rotate(-90 38 88)\" text-anchor=\"middle\">opposé de α</text>\n  <text x=\"350\" y=\"55\" font-size=\"13\" fill=\"#1e293b\">cos α = adjacent / hyp</text>\n  <text x=\"350\" y=\"75\" font-size=\"13\" fill=\"#1e293b\">sin α = opposé / hyp</text>\n  <text x=\"350\" y=\"95\" font-size=\"13\" fill=\"#1e293b\">tan α = opposé / adjacent</text>\n</svg><span class=\"fig-cap\">Dans ABC rectangle en A, pour l'angle α en C : opposé = [AB], adjacent = [AC], hypoténuse = [BC].</span></div>\n\n<h3>2. Les trois types d'exercice</h3>\n<table>\n<tr><th>Données</th><th>Cherché</th><th>Formule mobilisée</th></tr>\n<tr><td>angle + hypoténuse</td><td>côté opposé</td><td>sin : opposé = hyp × sin(angle)</td></tr>\n<tr><td>angle + adjacent</td><td>côté opposé</td><td>tan : opposé = adj × tan(angle)</td></tr>\n<tr><td>deux côtés</td><td>un angle</td><td>tan⁻¹ (ou sin⁻¹/cos⁻¹) : angle = arctan(rapport)</td></tr>\n</table>\n<ul>\n<li>Type 1-2 : on connaît l'angle → cos/sin/tan de l'angle sont des nombres donnés par la calculatrice (mode DEGRÉ !) → produit en croix ;</li>\n<li>Type 3 : on connaît le rapport → l'angle s'obtient par les <b>fonctions inverses</b> (sin⁻¹, cos⁻¹, tan⁻¹, « arc » ou « shift » sur la calculatrice) ;</li>\n<li>Choisir la bonne formule : repérer les deux côtés qui interviennent (celui qu'on a, celui qu'on veut) — le troisième n'existe pas pour nous.</li>\n</ul>\n<div class=\"ex\"><b>Exemple complet</b> : ABC rectangle en A, angle B = 40°, hypoténuse BC = 10. Chercher AB (opposé de B) : sin 40° = AB/10 → AB = 10 × sin 40° ≈ 6,4. Chercher AC : cos 40° = AC/10 → AC ≈ 7,7. Contrôle Pythagore : 6,4² + 7,7² ≈ 10² ✓.</div>\n\n<h3>3. Les valeurs remarquables</h3>\n<table>\n<tr><th>Angle</th><th>cos</th><th>sin</th><th>tan</th></tr>\n<tr><td>30°</td><td>√3/2 ≈ 0,866</td><td>1/2 = 0,5</td><td>1/√3 ≈ 0,577</td></tr>\n<tr><td>45°</td><td>√2/2 ≈ 0,707</td><td>√2/2 ≈ 0,707</td><td>1</td></tr>\n<tr><td>60°</td><td>1/2 = 0,5</td><td>√3/2 ≈ 0,866</td><td>√3 ≈ 1,732</td></tr>\n</table>\n<ul>\n<li>Origine géométrique : le triangle équilatéral coupé en deux donne 30°/60° ; le demi-carré donne 45° ;</li>\n<li>cos et sin « échangent » leurs valeurs entre 30° et 60° : symétrie du triangle ;</li>\n<li>Propriété : cos²α + sin²α = 1 pour tout angle (l'hypoténuse au carré vaut 1) — le fameux « Pythagore trigonométrique ».</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Cercle trigonometrique premier quadrant\">\n  <line x1=\"50\" y1=\"110\" x2=\"410\" y2=\"110\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"50\" y1=\"110\" x2=\"50\" y2=\"20\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <circle cx=\"50\" cy=\"110\" r=\"90\" fill=\"none\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/>\n  <line x1=\"50\" y1=\"110\" x2=\"119\" y2=\"52\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <line x1=\"119\" y1=\"52\" x2=\"119\" y2=\"110\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <line x1=\"50\" y1=\"110\" x2=\"119\" y2=\"110\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <text x=\"95\" y=\"75\" font-size=\"11\" fill=\"#4f46e5\" text-anchor=\"middle\">rayon = 1</text>\n  <text x=\"140\" y=\"80\" font-size=\"11\" fill=\"#ef4444\">sin α</text>\n  <text x=\"85\" y=\"105\" font-size=\"11\" fill=\"#16a34a\">cos α</text>\n  <text x=\"70\" y=\"100\" font-size=\"11\" fill=\"#64748b\">α</text>\n</svg><span class=\"fig-cap\">Le cercle de rayon 1 : l'angle α donne un point dont l'abscisse est cos α et l'ordonnée sin α — la trigo de 2de est déjà là.</span></div>\n\n<h3>4. Applications concrètes : pentes, angles, distances</h3>\n<ul>\n<li><b>Pente en pourcentage</b> : une pente à 10 % signifie un dénivelé de 10 m pour 100 m parcourus à l'horizontale : tan α = 10/100 = 0,1 → α ≈ 5,7° ;</li>\n<li><b>Hauteur inaccessible</b> : à 40 m du pied d'un monument, l'angle de vue du sommet vaut 35° : h = 40 × tan 35° ≈ <b>28 m</b> ;</li>\n<li><b>Aviation</b> : angle de montée 12° pendant 10 km parcourus : altitude gagnée = 10 × sin 12° ≈ 2,1 km ;</li>\n<li><b>Trait de scie</b> : menuisiers et charpentiers calculent leurs coupes en tangentes.</li>\n</ul>\n\n<h3>5. Rédiger un calcul trigonométrique</h3>\n<ol>\n<li>Identifier le triangle rectangle et l'angle utile ;</li>\n<li>Classer les côtés (opposé / adjacent / hypoténuse) <b>pour cet angle</b> ;</li>\n<li>Choisir la formule (celle qui relie les deux côtés en jeu) et l'énoncer ;</li>\n<li>Remplacer, calculer (mode degrés vérifié) ;</li>\n<li>Contrôler avec Pythagore ou un ordre de grandeur (le côté cherché doit être plus petit que l'hypoténuse).</li>\n</ol>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'escalier réglementaire</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un escalier doit monter de 2,60 m sur une profondeur (recul) de 3,90 m. Quel angle fait-il avec le sol ? Quelle est la longueur du limon (la poutre inclinée) ?</div><div class=\"etu\"><b>Étape 1 — Identifier</b> : triangle rectangle, hauteur 2,60 (opposé de l'angle), recul 3,90 (adjacent).</div><div class=\"etu\"><b>Étape 2 — Choisir la formule</b> : les deux côtés connus sont opposé et adjacent → <b>tan</b> : tan α = 2,60/3,90.</div><div class=\"etu\"><b>Étape 3 — Calculer l'angle</b> : tan α = 0,667 → α = tan⁻¹(0,667) ≈ <b>33,7°</b>.</div><div class=\"etu\"><b>Étape 4 — Limon (hypoténuse)</b> : Pythagore ou cos : L = √(2,60² + 3,90²) = √21,25 ≈ <b>4,61 m</b>. Réglementation : angle entre 25 et 42° pour un escalier résidentiel ✓. Trigo pour l'angle, Pythagore pour la longueur : les deux outils se complètent parfaitement.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — retrouver un angle au sol d'un vol d'oiseau</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un cerf-volant est retenu par un fil de 50 m tendu. Il plane à 35 m de hauteur. Quel angle le fil fait-il avec l'horizontale ? À quelle distance horizontale se trouve le point de chute projeté ?</div><div class=\"etu\"><b>Étape 1 — Classer</b> : hypoténuse = fil (50) ; opposé de l'angle au sol = hauteur (35) ; adjacent = distance horizontale cherchée.</div><div class=\"etu\"><b>Étape 2 — Premier calcul (angle)</b> : sin α = 35/50 = 0,7 → α = sin⁻¹(0,7) ≈ <b>44,4°</b>.</div><div class=\"etu\"><b>Étape 3 — Distance horizontale</b> : cos α = d/50 → d = 50 × cos 44,4° ≈ 50 × 0,714 ≈ <b>35,7 m</b>.</div><div class=\"etu\"><b>Étape 4 — Contrôle Pythagore</b> : 35² + 35,7² = 1225 + 1274 ≈ 2499 ≈ 50² = 2500 ✓. Trois formules, un seul triangle : sin pour l'angle, cos pour le côté, Pythagore pour vérifier — le triangle rectangle est un monde cohérent.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Calculatrice en radians : des résultats aberrants (sin 30 = −0,99) → toujours vérifier le mode DEGRÉ.</li>\n<li>Confondre opposé et adjacent : se placer « dans l'angle » avant de classer.</li>\n<li>tan = adjacent/opposé : c'est l'inverse — opposé/adjacent (SOH-CAH-TOA).</li>\n<li>Utiliser l'hypoténuse dans tan : la tangente ne contient jamais l'hypoténuse.</li>\n<li>Arrondir les étapes intermédiaires : garder les valeurs exactes, arrondir seulement le résultat final.</li>\n</ul>\n</div>"

    "cours": "<div class=\"cours-head\"><h2>Racines carrées et calculs associés</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Définition et premières propriétés</h3>\n<ul>\n<li>La <b>racine carrée</b> de a (a ≥ 0) est l'unique nombre positif dont le carré vaut a : √a ≥ 0 et (√a)² = a ;</li>\n<li>√49 = 7 ; √0 = 0 ; √1 = 1 ; √(−4) n'existe pas (aucun carré négatif dans les réels) ;</li>\n<li>√a² = a pour a ≥ 0 ; √(a²) = |a| pour tout a : √((−3)²) = √9 = 3 ;</li>\n<li>La racine « défait » le carré, mais seulement sur des nombres positifs.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Courbe racine carree\">\n  <line x1=\"40\" y1=\"110\" x2=\"410\" y2=\"110\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"110\" x2=\"40\" y2=\"20\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <path d=\"M 40 110 C 90 45 160 30 400 18\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <circle cx=\"150\" cy=\"34\" r=\"4\" fill=\"#ef4444\"/>\n  <line x1=\"150\" y1=\"110\" x2=\"150\" y2=\"34\" stroke=\"#ef4444\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/>\n  <text x=\"150\" y=\"126\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">a</text>\n  <text x=\"28\" y=\"38\" font-size=\"11\" fill=\"#64748b\">√a</text>\n  <text x=\"250\" y=\"40\" font-size=\"12\" fill=\"#4f46e5\">croissante : a &lt; b ⟹ √a &lt; √b</text>\n  <text x=\"250\" y=\"60\" font-size=\"12\" fill=\"#ef4444\">√(a+b) ≤ √a + √b (sous-additive)</text>\n</svg><span class=\"fig-cap\">La fonction racine : définie sur les positifs, croissante, et « moins pentue » que la droite : la racine d'une somme est plus petite que la somme des racines.</span></div>\n\n<h3>2. Les règles de calcul</h3>\n<div class=\"tip\"><b>√(a×b) = √a × √b</b> (produit sous une même racine) et <b>√(a/b) = √a / √b</b> (quotient). Ces règles servent à <b>simplifier</b> et à <b>réduire</b> des sommes de racines. En revanche, <b>√(a+b) ≠ √a + √b</b> : la racine ne traverse jamais une somme !</div>\n<table>\n<tr><th>Expression</th><th>Transformation</th><th>Résultat</th></tr>\n<tr><td>√50</td><td>√(25×2) = √25 × √2</td><td>5√2</td></tr>\n<tr><td>√72</td><td>√(36×2)</td><td>6√2</td></tr>\n<tr><td>√18 + √8</td><td>3√2 + 2√2</td><td>5√2</td></tr>\n<tr><td>√75 − √12</td><td>5√3 − 2√3</td><td>3√3</td></tr>\n<tr><td>√6 × √3</td><td>√18 = √(9×2)</td><td>3√2</td></tr>\n<tr><td>√2 × √2</td><td>√4</td><td>2</td></tr>\n<tr><td>(3√5)²</td><td>9 × 5</td><td>45</td></tr>\n</table>\n<ul>\n<li>Simplifier = sortir de la racine les plus grands <b>carrés parfaits</b> : 2, 3, 5, 7 restent souvent dedans ;</li>\n<li> Additionner des racines <b>semblables</b> : 5√2 + 3√2 = 8√2 (comme des pommes) ; 5√2 + 3√3 ne se réduit pas ;</li>\n<li>Rendre rationnel un dénominateur : 6/√2 = 6√2/2 = 3√2 (multiplier haut et bas par √2).</li>\n</ul>\n\n<h3>3. Développer avec des racines</h3>\n<ul>\n<li>Distributivité : √2(√3 + 5) = √6 + 5√2 ;</li>\n<li>Double distributivité : (√3 + 2)(√3 − 2) = 3 − 2√3 + 2√3 − 4 = <b>−1</b> : une identité remarquable qui élimine les racines !</li>\n<li>(√5 + √2)² = 5 + 2√10 + 2 = 7 + 2√10 : le double produit garde sa racine ;</li>\n<li>Le « conjugué » (√a + √b)(√a − √b) = a − b est l'outil de nettoyage des dénominateurs du lycée.</li>\n</ul>\n<div class=\"warn\"><b>Test anti-erreur</b> : toute prétendue simplification doit se vérifier numériquement. √(9+16) = √25 = 5, mais √9 + √16 = 3 + 4 = 7 : 5 ≠ 7 — la racine d'une somme n'est pas la somme des racines, preuve éclatante.</div>\n\n<h3>4. Racines et Pythagore : le duo gagnant</h3>\n<ul>\n<li>Pythagore crée des racines : côtés 1 et 1 → hypoténuse √2 (irrationnel, découverte historique des Grecs) ;</li>\n<li>Carrés parfaits cachés : diagonale du carré = c√2 ; hauteur du triangle équilatéral = (c√3)/2 ;</li>\n<li>Encadrer une racine entre deux entiers : 7² &lt; 52 &lt; 8² → 7 &lt; √52 &lt; 8 ;</li>\n<li>La calculatrice donne une valeur approchée : l'écriture exacte (5√2) reste la référence des rédactions.</li>\n</ul>\n\n<h3>5. Résolution d'équations x² = a</h3>\n<table>\n<tr><th>Équation</th><th>Solutions</th><th>Exemple</th></tr>\n<tr><td>x² = a (a &gt; 0)</td><td>deux solutions : √a et −√a</td><td>x² = 25 → x = 5 ou x = −5</td></tr>\n<tr><td>x² = 0</td><td>une solution : x = 0</td><td>—</td></tr>\n<tr><td>x² = a (a &lt; 0)</td><td>aucune solution réelle</td><td>x² = −9 : impossible</td></tr>\n</table>\n<ul>\n<li>Le passage au carré crée une <b>double</b> possibilité : ne jamais oublier la racine négative ;</li>\n<li>Exemple : (x − 3)² = 16 → x − 3 = 4 ou x − 3 = −4 → x = 7 ou x = −1 : deux solutions, toujours.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — simplifier jusqu'à l'os</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Simplifier : A = √300 − 4√27 + 2√75 ; B = √6(√24 − √54) ; C = (√5 + 3)² − (√5 − 3)².</div><div class=\"etu\"><b>Étape 1 — A : chercher les carrés parfaits</b> : √300 = √(100×3) = 10√3 ; √27 = √(9×3) = 3√3 ; √75 = √(25×3) = 5√3.</div><div class=\"etu\"><b>Étape 2 — A : réduire la famille √3</b> : A = 10√3 − 12√3 + 10√3 = <b>8√3</b>.</div><div class=\"etu\"><b>Étape 3 — B : factoriser sous la racine</b> : √6×√24 = √144 = 12 ; √6×√54 = √324 = 18 → B = 12 − 18 = <b>−6</b>.</div><div class=\"etu\"><b>Étape 4 — C : identités remarquables</b> : (a+b)² − (a−b)² = 4ab avec a = √5, b = 3 : C = 4×3×√5 = <b>12√5</b>. Trois gestes différents (familles de racines, produit sous racine, identités) sur le même thème : la racine se calcule, pas seulement s'écrit.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'escalier de secours</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une échelle de secours doit relier une fenêtre à 8 m du sol, avec un pied posé à 6 m du mur (réglementation 3-4-5 approximative). Quelle longueur d'échelle ? Et si la fenêtre était à 5 m avec pied à 12 m ?</div><div class=\"etu\"><b>Étape 1 — Modéliser</b> : triangle rectangle mur-sol-échelle : 8 et 6 sont les cathètes, l'échelle l'hypoténuse.</div><div class=\"etu\"><b>Étape 2 — Pythagore</b> : L = √(64 + 36) = √100 = <b>10 m</b> : carré parfait, échelle standard.</div><div class=\"etu\"><b>Étape 3 — Second cas</b> : L = √(25 + 144) = √169 = <b>13 m</b> : encore un Pythagore remarquable (5-12-13).</div><div class=\"etu\"><b>Étape 4 — Si rien ne tombe juste</b> : fenêtre 7 m, pied 4 m : L = √65 ≈ 8,06 m — l'écriture √65 est la valeur exacte, 8,06 l'approchée pour la commande de matériel. Les racines sont le prix à payer quand les triangles ne sont pas « remarquables » : c'est le cas général.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>√(a + b) = √a + √b : FAUX — test numérique 9 + 16 : √25 = 5 ≠ 7.</li>\n<li>√(−a) existe : non, pas dans les réels.</li>\n<li>3√2 + 5√2 = 8√4 : non — la racine reste, seuls les coefficients s'additionnent (8√2).</li>\n<li>Oublier la solution négative de x² = a.</li>\n<li>(√3)² = √9 : (√3)² = 3 directement — la racine et le carré s'annulent pour un positif.</li>\n</ul>\n</div>\n\n<h3>6. Racines et géométrie : les irrationnels du compas</h3>\n<ul>\n<li>Les Grecs ont découvert √2 en mesurant la diagonale d'un carré unité : aucun quotient d'entiers ne l'écrit — première « crise » des mathématiques ;</li>\n<li>C'est pour cela qu'on garde les racines <b>exactes</b> : √2 ≈ 1,41421356... sans jamais s'arrêter ni se répéter ;</li>\n<li>Escalier de racines : 1 → √2 → √3 → 2 → √5 → ... : chaque hypoténuse d'un triangle de côté 1 ajouté crée la racine suivante ;</li>\n<li>Regroupement astucieux : √8 + √50 − √18 = 2√2 + 5√2 − 3√2 = 4√2 — trois racines « différentes », une seule famille.</li>\n</ul>\n<table>\n<tr><th>Nombre</th><th>Décomposition</th><th>Forme simplifiée</th><th>Valeur approchée</th></tr>\n<tr><td>√12</td><td>√(4×3)</td><td>2√3</td><td>3,46</td></tr>\n<tr><td>√45</td><td>√(9×5)</td><td>3√5</td><td>6,71</td></tr>\n<tr><td>√80</td><td>√(16×5)</td><td>4√5</td><td>8,94</td></tr>\n<tr><td>√98</td><td>√(49×2)</td><td>7√2</td><td>9,90</td></tr>\n<tr><td>√200</td><td>√(100×2)</td><td>10√2</td><td>14,14</td></tr>\n</table>\n<div class=\"tip\"><b>L'escalier des racines, mode d'emploi</b> : partez d'un segment de longueur 1. Construisez perpendiculairement un second segment de longueur 1 : l'hypoténuse vaut √2. Depuis son extrémité, reconstruisez un triangle avec un côté 1 : hypoténuse √3. Et ainsi de suite : √4 = 2, √5, √6... Chaque marche de l'escalier ajoute 1 « au carré » sous la racine : (√n)² + 1² = n + 1. La spirale de Théodore dessine ainsi toutes les racines jusqu'à √17 — un musée des irrationnels.</div>\n<ul>\n<li>Comparaison sans calculatrice : √7 vs 2,6 : 2,6² = 6,76 &lt; 7 → √7 &gt; 2,6 ;</li>\n<li>Ordre des racines : la fonction racine est croissante, donc √5 &lt; √11 &lt; √20 sans aucune valeur approchée ;</li>\n<li>Rangement : toujours comparer les <b>carrés</b> (pour des positifs) : c'est l'astuce la plus fiable ;</li>\n<li>En 2de, la fonction racine deviendra une fonction de référence : domaine, variation, courbe — les bases sont posées ici.</li>\n</ul>\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'antenne bien orientée</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un mât d'antenne est haubanné par trois câbles de 13 m partant de son sommet, ancrés au sol à 12 m du pied. Quelle est la hauteur du mât ? Vérifier que le triangle est bien rectangle.</div><div class=\"etu\"><b>Étape 1 — Modéliser</b> : triangle rectangle pied-sommet-ancre : hypoténuse 13 (câble), côté au sol 12, hauteur h.</div><div class=\"etu\"><b>Étape 2 — Pythagore</b> : h = √(13² − 12²) = √(169 − 144) = √25 = <b>5 m</b>.</div><div class=\"etu\"><b>Étape 3 — Cohérence</b> : trois câbles identiques ancrés à 120° donnent une stabilité parfaite : la géométrie du triangle 5-12-13 (cousin du 3-4-5) garantit chaque hauban.</div><div class=\"etu\"><b>Étape 4 — Cas non remarquable</b> : câble de 15 m, ancre à 9 m : h = √(225 − 81) = √144 = 12 m — encore un carré parfait ! Et câble de 14 m, ancre à 8 m : h = √132 = 2√33 ≈ 11,49 m : cette fois la racine reste, valeur exacte en main, approchée pour le devis.</div></div></details>"

    "titre": "Développement, factorisation et identités remarquables",
    "cours": "<div class=\"cours-head\"><h2>Développement, factorisation et identités remarquables</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Les trois identités remarquables</h3>\n<div class=\"tip\"><b>Les formules à connaître par cœur</b> :\n(a + b)² = a² + 2ab + b² ;\n(a − b)² = a² − 2ab + b² ;\n(a + b)(a − b) = a² − b².\nElles accélèrent le développement, mais surtout elles <b>se lisent de droite à gauche</b> pour factoriser.</div>\n<ul>\n<li>Chaque identité se prouve par double distributivité : (a+b)² = (a+b)(a+b) = a² + ab + ab + b² ;</li>\n<li>Exemples : (x+3)² = x² + 6x + 9 ; (2x−5)² = 4x² − 20x + 25 ; (x+4)(x−4) = x² − 16 ;</li>\n<li>Test anti-erreur : (a+b)² ≠ a² + b² — prendre a = b = 1 : (1+1)² = 4 mais 1+1 = 2.</li>\n</ul>\n<table>\n<tr><th>Identité</th><th>Forme factorisée</th><th>Forme développée</th><th>Vérification (a=3, b=1)</th></tr>\n<tr><td>carré d'une somme</td><td>(a + b)²</td><td>a² + 2ab + b²</td><td>16 = 9 + 6 + 1 ✓</td></tr>\n<tr><td>carré d'une différence</td><td>(a − b)²</td><td>a² − 2ab + b²</td><td>4 = 9 − 6 + 1 ✓</td></tr>\n<tr><td>produit somme-différence</td><td>(a + b)(a − b)</td><td>a² − b²</td><td>8 = 9 − 1 ✓</td></tr>\n</table>\n\n<h3>2. Reconnaître les identités dans le sens factorisation</h3>\n<ul>\n<li>x² + 10x + 25 = (x + 5)² : deux carrés parfaits (x² et 25) et un double produit (10x = 2×x×5) → carré parfait ;</li>\n<li>4x² − 12x + 9 = (2x − 3)² : a = 2x, b = 3, −2ab = −12x ✓ ;</li>\n<li>x² − 49 = (x + 7)(x − 7) : a² − b², la plus rapide des trois ;</li>\n<li>Méthode de lecture : chercher deux « carrés » aux extrémités, puis vérifier que le terme central vaut ±2ab.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Aires et identite remarquable\">\n  <rect x=\"40\" y=\"30\" width=\"220\" height=\"90\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <line x1=\"40\" y1=\"70\" x2=\"260\" y2=\"70\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/>\n  <line x1=\"180\" y1=\"30\" x2=\"180\" y2=\"120\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/>\n  <text x=\"110\" y=\"52\" font-size=\"13\" fill=\"#4f46e5\" text-anchor=\"middle\">a²</text>\n  <text x=\"220\" y=\"52\" font-size=\"13\" fill=\"#16a34a\" text-anchor=\"middle\">ab</text>\n  <text x=\"110\" y=\"95\" font-size=\"13\" fill=\"#f59e0b\" text-anchor=\"middle\">ab</text>\n  <text x=\"220\" y=\"95\" font-size=\"13\" fill=\"#ef4444\" text-anchor=\"middle\">b²</text>\n  <text x=\"330\" y=\"60\" font-size=\"13\" fill=\"#1e293b\">(a+b)² =</text>\n  <text x=\"330\" y=\"80\" font-size=\"13\" fill=\"#1e293b\">a² + ab + ab + b²</text>\n  <text x=\"330\" y=\"100\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"bold\">= a² + 2ab + b²</text>\n</svg><span class=\"fig-cap\">Preuve par les aires : le carré de côté (a+b) se découpe en a², deux rectangles ab et b² — le double produit 2ab est visible.</span></div>\n\n<h3>3. La factorisation complète : la méthode en quatre étapes</h3>\n<ol>\n<li><b>Chercher un facteur commun</b> (numérique, littéral ou une parenthèse) : 3x² + 6x = 3x(x + 2) ; (x−1)(x+2) + (x−1)(3x) = (x−1)(4x+2) ;</li>\n<li>Sinon, <b>chercher une identité remarquable</b> : deux carrés aux extrémités + terme central = carré parfait ;</li>\n<li>Sinon, <b>trinôme « général »</b> : chercher deux nombres dont le produit vaut c et la somme b : x² + 5x + 6 = (x+2)(x+3) (2×3 = 6, 2+3 = 5) ;</li>\n<li><b>Vérifier en redéveloppant</b> : la boucle développement-factorisation doit se refermer exactement.</li>\n</ol>\n<table>\n<tr><th>Expression</th><th>Type</th><th>Factorisation</th></tr>\n<tr><td>5x² − 15x</td><td>facteur commun 5x</td><td>5x(x − 3)</td></tr>\n<tr><td>x² − 81</td><td>a² − b²</td><td>(x + 9)(x − 9)</td></tr>\n<tr><td>x² + 8x + 16</td><td>carré parfait</td><td>(x + 4)²</td></tr>\n<tr><td>9x² − 30x + 25</td><td>carré parfait</td><td>(3x − 5)²</td></tr>\n<tr><td>x² + 7x + 12</td><td>produit-somme (3×4 = 12, 3+4 = 7)</td><td>(x + 3)(x + 4)</td></tr>\n<tr><td>(2x + 1)(x − 3) − (x − 3)</td><td>facteur commun (x−3)</td><td>(x − 3)(2x)</td></tr>\n</table>\n\n<h3>4. Équations produit : la récompense de la factorisation</h3>\n<div class=\"tip\"><b>Équation produit nul</b> : A(x) × B(x) = 0 ⟺ A(x) = 0 ou B(x) = 0. Un produit est nul si et seulement si l'un de ses facteurs est nul — c'est LE pont vers les équations du second degré.</div>\n<ul>\n<li>x² − 49 = 0 → (x+7)(x−7) = 0 → x = −7 ou x = +7 ;</li>\n<li>x² + 5x + 6 = 0 → (x+2)(x+3) = 0 → x = −2 ou x = −3 ;</li>\n<li>(3x − 6)(x + 4) = 0 → 3x − 6 = 0 (x = 2) ou x + 4 = 0 (x = −4) : deux solutions ;</li>\n<li>La factorisation transforme une équation « carrée » inconnue en deux équations du premier degré.</li>\n</ul>\n\n<h3>5. Développement ou factorisation : quel outil choisir ?</h3>\n<table>\n<tr><th>Question posée</th><th>Outil</th><th>Pourquoi</th></tr>\n<tr><td>« Calculer pour x = 5 »</td><td>développement (ou substitution directe)</td><td>la forme développée se calcule terme à terme</td></tr>\n<tr><td>« Résoudre = 0 »</td><td>factorisation</td><td>produit nul → équations simples</td></tr>\n<tr><td>« Prouver une égalité »</td><td>développer les deux membres</td><td>on aboutit à la même forme réduite</td></tr>\n<tr><td>« Montrer que N est divisible par 7 »</td><td>factoriser par 7</td><td>N = 7 × (...) : la factorisation exhibe le diviseur</td></tr>\n</table>\n<ul>\n<li>Exemple de divisibilité : 17² − 9² = (17−9)(17+9) = 8 × 26 = 208 = 8×26 : sans calculer les carrés, la factorisation a² − b² donne le résultat — et prouve que 15² − 7² = 8 × 22 est divisible par 8 <b>pour tout</b> couple impair/impair.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'aire du cadre photo</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Une photo carrée de côté x est montée sur un carton carré de côté x + 4. Exprimer l'aire du cadre (carton moins photo), puis la calculer pour x = 6 en factorisant d'abord.</div><div class=\"etu\"><b>Étape 1 — Modéliser</b> : aire du cadre = (x+4)² − x².</div><div class=\"etu\"><b>Étape 2 — Reconnaître a² − b²</b> : = (x+4+x)(x+4−x) = (2x+4) × 4 = <b>8x + 16</b>.</div><div class=\"etu\"><b>Étape 3 — Calculer pour x = 6</b> : 8×6 + 16 = <b>64 cm²</b> (vérif : 10² − 6² = 100 − 36 = 64 ✓).</div><div class=\"etu\"><b>Étape 4 — Bonus</b> : 8x + 16 = 8(x + 2) : l'aire du cadre est toujours un multiple de 8 — propriété générale prouvée par la factorisation, invisible dans la forme développée. Factoriser n'est pas qu'une technique : c'est un regard qui révèle la structure.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — résoudre (2x − 3)² − 25 = 0</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Résoudre (2x − 3)² − 25 = 0. (Indice : ni facteur commun ni trinôme apparent — mais une identité se cache.)</div><div class=\"etu\"><b>Étape 1 — Reconnaître a² − b²</b> : (2x−3)² − 5² = [(2x−3) − 5][(2x−3) + 5].</div><div class=\"etu\"><b>Étape 2 — Simplifier chaque facteur</b> : (2x − 8)(2x + 2).</div><div class=\"etu\"><b>Étape 3 — Produit nul</b> : 2x − 8 = 0 → x = 4 ; 2x + 2 = 0 → x = −1.</div><div class=\"etu\"><b>Étape 4 — Vérifier</b> : x = 4 : (8−3)² − 25 = 25 − 25 = 0 ✓ ; x = −1 : (−5)² − 25 = 0 ✓. Une équation du second degré résolue sans discriminant : la reconnaissance des identités économise des années de calcul — le discriminant de 1re généralisera seulement cette méthode.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>(a + b)² = a² + b² : le double produit 2ab manque à l'appel.</li>\n<li>Signe du double produit : (a − b)² = a² − 2ab + b² (moins) mais (a − b)(a + b) = a² − b² (un seul terme en moins).</li>\n<li>Factoriser un trinôme au hasard : toujours vérifier produit ET somme des candidats.</li>\n<li>(x − 3)² = x² − 9 : non — c'est (x−3)(x+3) qui donne x² − 9.</li>\n<li>Résoudre AB = 0 en « divisant par A » : on perd des solutions — utiliser le produit nul, jamais la division par une expression qui peut s'annuler.</li>\n</ul>\n</div>\n\n<h3>6. Factoriser avec des expressions plus complexes</h3>\n<ul>\n<li>Facteur commun <b>parenthèse opposée</b> : (x−2)(3x+1) + (2−x)(x+5) : remarquer que (2−x) = −(x−2), donc l'expression = (x−2)[(3x+1) − (x+5)] = (x−2)(2x−4) = 2(x−2)(x−2) = 2(x−2)² ;</li>\n<li>Facteur commun <b>caché</b> : (x+1)² − (x+1)(2x−3) = (x+1)[(x+1) − (2x−3)] = (x+1)(4−x) ;</li>\n<li>Après une première factorisation, en chercher une <b>seconde</b> : 2x² − 8 = 2(x² − 4) = 2(x−2)(x+2) ;</li>\n<li>Réflexe : x⁴ − 16 = (x²)² − 4² = (x²−4)(x²+4) = (x−2)(x+2)(x²+4) — les identités s'appliquent à n'importe quel niveau d'emboîtement.</li>\n</ul>\n<table>\n<tr><th>Expression</th><th>Étape 1</th><th>Étape 2 (si possible)</th><th>Forme finale</th></tr>\n<tr><td>x³ − 4x</td><td>x(x² − 4)</td><td>x(x−2)(x+2)</td><td>x(x−2)(x+2)</td></tr>\n<tr><td>(x+3)² − (x+3)(x−1)</td><td>(x+3)[(x+3) − (x−1)]</td><td>(x+3)(4)</td><td>4(x+3)</td></tr>\n<tr><td>4x² − 100</td><td>4(x² − 25)</td><td>4(x−5)(x+5)</td><td>4(x−5)(x+5)</td></tr>\n<tr><td>9 − (2x−1)²</td><td>[3 − (2x−1)][3 + (2x−1)]</td><td>(4−2x)(2x+2)</td><td>4(2−x)(x+1)</td></tr>\n</table>\n\n<h3>7. Le menuisier et le comptoir : la preuve par les aires</h3>\n<ul>\n<li>Un comptoir rectangulaire de longueur L et largeur l voit sa longueur augmentée de a et sa largeur de b : aire finale (L+a)(l+b) = Ll + Lb + al + ab : chacun des quatre termes est une zone du rectangle — la double distributivité se <b>dessine</b> ;</li>\n<li>Retirer un coin carré de côté a à une plaque carrée de côté L : aire restante L² − a² = (L−a)(L+a) : l'identité remarquable est un <b>découpage</b> ;</li>\n<li>Cadre : plaque carrée de côté L dont on retire une fenêtre carrée de côté l : aire (L−l)(L+l) — encadrement et vitre ;</li>\n<li>La géométrie sauve l'algèbre : quand une identité semble mystérieuse, la dessiner en aires la rend évidente.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Difference de carres a² − b²\">\n  <rect x=\"60\" y=\"25\" width=\"120\" height=\"100\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <rect x=\"60\" y=\"25\" width=\"70\" height=\"60\" fill=\"#fee2e2\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"50\" font-size=\"13\" fill=\"#ef4444\" text-anchor=\"middle\">b²</text><text x=\"152\" y=\"118\" font-size=\"13\" fill=\"#4f46e5\" text-anchor=\"middle\">a²</text>\n  <text x=\"220\" y=\"55\" font-size=\"13\" fill=\"#1e293b\">a² − b²</text>\n  <path d=\"M 130 60 h 40\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <text x=\"175\" y=\"85\" font-size=\"13\" fill=\"#16a34a\">= (a−b)(a+b)</text>\n  <text x=\"175\" y=\"105\" font-size=\"12\" fill=\"#64748b\">deux bandes rectangulaires</text>\n  <text x=\"175\" y=\"122\" font-size=\"12\" fill=\"#64748b\">déplacées = un rectangle</text>\n</svg><span class=\"fig-cap\">a² − b² découpe : le grand carré moins le petit se réarrange en un rectangle (a−b)×(a+b) — l'identité prouvée par découpage.</span></div>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — l'entrepôt optimisé</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Un entrepôt carré de côté x est étendu : +3 m sur la longueur et +2 m sur la largeur. 1) Développer la nouvelle aire. 2) Le gérant affirme : « j'ai gagné 5x + 6 m² ». A-t-il raison ? 3) Factoriser le gain si l'extension était symétrique (+a des deux côtés).</div><div class=\"etu\"><b>Étape 1 — Développer</b> : (x+3)(x+2) = x² + 2x + 3x + 6 = x² + 5x + 6.</div><div class=\"etu\"><b>Étape 2 — Vérifier l'affirmation</b> : le gain vaut (x+3)(x+2) − x² = 5x + 6 : <b>il a raison</b> — mais uniquement pour x = l'ancien côté : en général le gain contient 5x, il dépend donc de la taille initiale.</div><div class=\"etu\"><b>Étape 3 — Extension symétrique</b> : (x+a)² − x² = (x+a−x)(x+a+x) = a(2x+a) : le gain est toujours a(2x+a).</div><div class=\"etu\"><b>Étape 4 — Lecture structurelle</b> : a(2x+a) montre que le gain croît avec x : plus l'entrepôt initial est grand, plus l'extension symétrique rapporte — une conclusion <b>visible seulement en forme factorisée</b>. Développer répond, factoriser explique.</div></div></details>"
  },
  {
    "id": "fonctions",
    "theme": "Fonctions (collège)",
    "niveau": "3e",
    "titre": "Notion de fonction : image, antécédent",
    "cours": "<div class=\"cours-head\"><h2>Notion de fonction : image, antécédent</h2><span class=\"niv\">3e</span></div>\n<div class=\"chap-quick\"><a onclick=\"showTab('fiches')\">🗂️ Fiche synthétique du cours</a><a onclick=\"showTab('quiz')\">🧪 QCM du cours</a></div>\n\n<h3>1. Le vocabulaire : une machine à transformer</h3>\n<ul>\n<li>Une <b>fonction</b> f est un procédé qui, à chaque nombre x de son ensemble de départ, associe <b>un seul</b> nombre noté f(x) — « f de x » ;</li>\n<li>x s'appelle la <b>variable</b> (l'entrée) ; f(x) s'appelle l'<b>image</b> de x par f (la sortie) ;</li>\n<li>Si f(x) = y, on dit que x est un <b>antécédent</b> de y ;</li>\n<li>Chaque x a UNE image, mais un y peut avoir <b>plusieurs antécédents</b>, ou aucun : c'est l'asymétrie fondamentale ;</li>\n<li>Exemples de procédés : « multiplier par 3 puis ajouter 1 » (f(x) = 3x+1), « prendre le carré » (g(x) = x²), « diviser par 2 » (h(x) = x/2).</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Machine fonction\">\n  <ellipse cx=\"70\" cy=\"65\" rx=\"45\" ry=\"28\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <text x=\"70\" y=\"70\" font-size=\"14\" fill=\"#1e293b\" text-anchor=\"middle\">x</text>\n  <rect x=\"170\" y=\"35\" width=\"120\" height=\"60\" rx=\"10\" fill=\"#ecfdf5\" stroke=\"#16a34a\" stroke-width=\"2.5\"/>\n  <text x=\"230\" y=\"60\" font-size=\"13\" fill=\"#1e293b\" text-anchor=\"middle\">fonction f</text>\n  <text x=\"230\" y=\"80\" font-size=\"11\" fill=\"#64748b\" text-anchor=\"middle\">« ×3 puis +1 »</text>\n  <ellipse cx=\"390\" cy=\"65\" rx=\"45\" ry=\"28\" fill=\"#fff7ed\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <text x=\"390\" y=\"70\" font-size=\"14\" fill=\"#1e293b\" text-anchor=\"middle\">f(x)</text>\n  <path d=\"M 115 65 Q 145 50 168 60\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <path d=\"M 290 65 Q 330 80 346 68\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <text x=\"390\" y=\"110\" font-size=\"12\" fill=\"#64748b\" text-anchor=\"middle\">l'image est unique</text>\n</svg><span class=\"fig-cap\">La fonction comme machine : un nombre entre, un nombre sort. L'image existe toujours (si x est dans le domaine), l'antécédent pas forcément.</span></div>\n\n<h3>2. Image et antécédent : calculer dans les deux sens</h3>\n<div class=\"tip\"><b>Image</b> : on remplace x par la valeur et on calcule — sens direct, toujours unique. <b>Antécédent</b> : on résout f(x) = y — sens inverse, il faut <b>chercher toutes les solutions</b> (il peut y en avoir 0, 1 ou plusieurs).</div>\n<table>\n<tr><th>Fonction</th><th>Question</th><th>Calcul</th><th>Réponse</th></tr>\n<tr><td>f(x) = 3x + 1</td><td>image de 2</td><td>f(2) = 7</td><td>7</td></tr>\n<tr><td>f(x) = 3x + 1</td><td>antécédents de 10</td><td>3x + 1 = 10 → x = 3</td><td>3 (unique)</td></tr>\n<tr><td>g(x) = x²</td><td>image de −4</td><td>(−4)² = 16</td><td>16</td></tr>\n<tr><td>g(x) = x²</td><td>antécédents de 9</td><td>x² = 9 → x = 3 ou x = −3</td><td>deux antécédents !</td></tr>\n<tr><td>g(x) = x²</td><td>antécédents de −9</td><td>x² = −9</td><td>aucun</td></tr>\n</table>\n<ul>\n<li>Un carré a toujours deux antécédents (sauf 0) : +√y et −√y ;</li>\n<li>Une fonction affine (ax+b, a ≠ 0) a toujours exactement un antécédent : on résout ax + b = y ;</li>\n<li>Réflexe de rédaction : « l'image de 2 par f est 7 », « les antécédents de 9 par g sont 3 et −3 » — le vocabulaire précis rapporte des points.</li>\n</ul>\n\n<h3>3. La représentation graphique</h3>\n<ul>\n<li>Dans un repère (O ; I ; J), on construit les points de coordonnées (x ; f(x)) : leur ensemble dessine la <b>courbe</b> de f ;</li>\n<li>Lire l'image de a : partir de a sur l'axe horizontal, monter jusqu'à la courbe, lire la hauteur — c'est f(a) ;</li>\n<li>Lire les antécédents de b : partir de b sur l'axe vertical, tracer l'horizontale : <b>chaque</b> intersection avec la courbe donne un antécédent ;</li>\n<li>Si l'horizontale ne coupe pas la courbe : aucun antécédent ; si elle la touche deux fois : deux antécédents.</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 430 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Lecture graphique image et antecedent\">\n  <line x1=\"40\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"130\" x2=\"40\" y2=\"20\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <path d=\"M 60 45 Q 230 170 400 45\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n  <line x1=\"120\" y1=\"130\" x2=\"120\" y2=\"81\" stroke=\"#16a34a\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <circle cx=\"120\" cy=\"81\" r=\"4\" fill=\"#16a34a\"/>\n  <line x1=\"120\" y1=\"81\" x2=\"40\" y2=\"81\" stroke=\"#16a34a\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <text x=\"120\" y=\"145\" font-size=\"11\" fill=\"#16a34a\" text-anchor=\"middle\">a</text>\n  <text x=\"48\" y=\"77\" font-size=\"11\" fill=\"#16a34a\">f(a)</text>\n  <line x1=\"40\" y1=\"115\" x2=\"350\" y2=\"115\" stroke=\"#ef4444\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <circle cx=\"171\" cy=\"115\" r=\"4\" fill=\"#ef4444\"/><circle cx=\"289\" cy=\"115\" r=\"4\" fill=\"#ef4444\"/>\n  <text x=\"45\" y=\"111\" font-size=\"11\" fill=\"#ef4444\">b</text>\n  <text x=\"171\" y=\"148\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\">x₁</text>\n  <text x=\"289\" y=\"148\" font-size=\"11\" fill=\"#ef4444\" text-anchor=\"middle\">x₂</text>\n  <text x=\"355\" y=\"40\" font-size=\"12\" fill=\"#1e293b\">b a deux antécédents</text>\n</svg><span class=\"fig-cap\">Vert : lecture de l'image de a (une seule). Rouge : lecture des antécédents de b (ici deux) — l'horizontale découpe la courbe.</span></div>\n\n<h3>4. Tableaux de valeurs et proportions</h3>\n<ul>\n<li>Le tableau de valeurs liste x en haut et f(x) en bas : il aide à conjecturer puis à tracer ;</li>\n<li>Si f(x) = ax (proportionnalité), les images sont proportionnelles aux entrées : la courbe est une <b>droite passant par l'origine</b> ;</li>\n<li>Si f(x) = ax + b, la courbe est une droite ne passant pas par l'origine : b est l'ordonnée à l'origine (f(0) = b) ;</li>\n<li>Pour x², la courbe est une parabole symétrique par rapport à l'axe vertical.</li>\n</ul>\n<table>\n<tr><th>x</th><th>−2</th><th>−1</th><th>0</th><th>1</th><th>2</th><th>3</th></tr>\n<tr><td>f(x) = 2x + 1</td><td>−3</td><td>−1</td><td>1</td><td>3</td><td>5</td><td>7</td></tr>\n<tr><td>g(x) = x²</td><td>4</td><td>1</td><td>0</td><td>1</td><td>4</td><td>9</td></tr>\n<tr><td>h(x) = x/2</td><td>−1</td><td>−0,5</td><td>0</td><td>0,5</td><td>1</td><td>1,5</td></tr>\n</table>\n<ul>\n<li>Lecture rapide : f et h progressent régulièrement (droites), g non (parabole) — le tableau annonce déjà la forme de la courbe ;</li>\n<li>Trouver l'expression d'une fonction affine : deux points suffisent (ou un point + la pente) : système de deux équations.</li>\n</ul>\n\n<h3>5. Fonctions dans la vraie vie</h3>\n<ul>\n<li><b>Tarif taxi</b> : prise 4 € + 1,80 €/km : p(x) = 1,8x + 4 — antécédents de 22 : distance correspondant à 22 € : x = 10 km ;</li>\n<li><b>Aire d'un carré</b> : A(c) = c² : image de 7 = 49 ; antécédents de 100 = 10 (le carré de côté négatif n'existe pas physiquement — on ne garde que le positif) ;</li>\n<li><b>Température</b> : T(h) donnée heure par heure : lire le maximum, c'est la question « quelle est l'image la plus grande ? » ;</li>\n<li>Toute situation « à chaque entrée correspond une sortie » est une fonction : le mot est juste un habillage du quotidien.</li>\n</ul>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — le forfait contre le paiement à l'usage</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Salle de sport A : abonnement 30 € + 2 € par séance. Salle B : 6 € par séance, sans abonnement. Modéliser le coût mensuel, trouver à partir de combien de séances A devient plus avantageuse.</div><div class=\"etu\"><b>Étape 1 — Modéliser</b> : A(x) = 2x + 30 ; B(x) = 6x : deux fonctions affines/linéaires de la même variable x (nombre de séances).</div><div class=\"etu\"><b>Étape 2 — Égaliser</b> : 2x + 30 = 6x → 30 = 4x → x = 7,5.</div><div class=\"etu\"><b>Étape 3 — Interpréter</b> : à 7,5 séances, égalité parfaite ; dès <b>8 séances</b>, A est moins cher (A(8) = 46 € &lt; B(8) = 48 €).</div><div class=\"etu\"><b>Étape 4 — Généraliser</b> : le point d'intersection des deux droites de coûts est la frontière tarifaire ; graphiquement, tracer A et B et repérer le croisement : la fonction la moins haute est la moins chère — les fonctions servent d'abord à <b>décider</b>.</div></div></details>\n\n<details class=\"ex-util\"><summary>💡 Focus sur... — traquer tous les antécédents</summary><div class=\"exu-body\"><div class=\"exu-enonce\"><b>Énoncé.</b> Soit f(x) = x² − 4x + 3. 1) Calculer f(0), f(1), f(3). 2) Quels sont les antécédents de 3 ? De 0 ?</div><div class=\"etu\"><b>Étape 1 — Images directes</b> : f(0) = 3 ; f(1) = 1 − 4 + 3 = 0 ; f(3) = 9 − 12 + 3 = 0.</div><div class=\"etu\"><b>Étape 2 — Antécédents de 3</b> : x² − 4x + 3 = 3 → x² − 4x = 0 → x(x − 4) = 0 → x = 0 ou x = 4 : <b>deux</b> antécédents.</div><div class=\"etu\"><b>Étape 3 — Antécédents de 0</b> : x² − 4x + 3 = 0 → (x−1)(x−3) = 0 → x = 1 ou x = 3 : confirmé par l'étape 1.</div><div class=\"etu\"><b>Étape 4 — Morale</b> : résoudre f(x) = k équivaut à résoudre une équation — l'antécédent est une <b>équation déguisée</b>. Une valeur y peut avoir 0, 1 ou plusieurs antécédents : ne jamais en donner un seul sans avoir résolu complètement.</div></div></details>\n\n<div class=\"piege\"><b>⚠️ Pièges classiques :</b>\n<ul>\n<li>Confondre f(2) (l'image de 2) avec « le nombre 2 a pour image » — le rôle de la valeur change selon le sens de lecture.</li>\n<li>Donner un seul antécédent à un carré : x² = 9 a DEUX solutions.</li>\n<li>Écrire f(2) = 5 puis « l'antécédent de 5 est 2 » au singulier alors qu'il pourrait y en avoir d'autres.</li>\n<li>Oublier les parenthèses dans le calcul : f(−2) = 3×(−2) + 1 = −5, pas 3×−2 mal interprété.</li>\n<li>Lire les antécédents verticalement sur le graphique : image = lecture verticale, antécédents = lecture horizontale depuis l'axe des y.</li>\n</ul>\n</div>"
